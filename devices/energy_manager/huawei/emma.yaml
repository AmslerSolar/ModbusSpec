enums:
  emma_external_meter_running_status: {'0': Online, '1': Offline}
  emma_ess_control_mode: {'1': Reserved 1, '2': Maximum self consumption, '3': Reserved 3, '4': Fully fed to grid, '5': Time of use, '6': Third party dispatch}
  storage_excess_pv_energy_use_in_tou: {'0': Fed to grid, '1': Charge}
  emma_limitation_mode: {'0': Total power, '1': Single phase power}
  bool: {'0': 'False', '1': 'True'}
  emma_power_supply_configuration: {'0': None, '1': Mains only, '2': Mains and generator, '3': Generator only}
  emma_consider_mains_faulty_if: {'0': Open, '1': Closed}

notes:
- 'evcc template `huawei-emma` (grid, pv, battery) lists: Huawei EMMA.'
- huawei-solar-lib reads and writes everything as holding registers (function 03, writes 06/16).
- Huawei devices accept only one Modbus TCP connection at a time.
- The library waits 1 s after connecting and 50 ms between requests.
- Detected by the model name (30000) starting with SmartHEMS; the product model is at 30222.
- Identification as huawei-solar recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
