enums:
  bool: {'0': 'False', '1': 'True'}
  s_dongle_type: {'1': Na, '2': Wlan, '3': ' 4g', '4': Wlan fe}
  s_dongle_device_search_status: {'0': Search completed, '1': Searching, '2': Search failed}
  s_dongle_wireless_route_access_signal_strength4_g: {'32764': Connect success, '32765': Connecting or connection failed, '32766': Disconnected due to authentication failure, '32767': Disconnected}
  s_dongle_traffic_status4_g: {'0': Normal, '1': Warning, '2': Used up, '255': No package configured}
  s_dongle_port_mode: {'0': Dual port, '1': Single port}
  s_dongle_network_mode4_g: {'0': Auto select 4g 3g 2g, '1': Auto select 3g 2g, '2': Only 2g}
  dongle4_g_network_mode: {'0': Auto 4g 3g 2g, '1': Auto 3g 2g, '2': Only 2g}
  dongle4_g_apn_mode: {'0': Automatic, '1': Manual}
  dongle4_g_authentication_type: {'0': None, '1': Pap, '2': Chap, '3': Pap or chap}
  dongle4_g_signal_strength: {'0': No signal, '1': Very weak, '2': Weak, '3': Medium, '4': Strong, '5': Very strong}
  dongle4_g_module_status: {'0': No sim card, '1': Sim registration failed, '2': No connection, '6': Connected, '100': Sim present, '101': Pin required, '102': Puk required, '65535': Module not inserted}

notes:
- huawei-solar-lib reads and writes everything as holding registers (function 03, writes 06/16).
- Huawei devices accept only one Modbus TCP connection at a time.
- The library waits 1 s after connecting and 50 ms between requests.
- Detected at unit id 100 by reading 37411 (device search status), or by a model name starting with SDongle.
- Identification as huawei-solar recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
