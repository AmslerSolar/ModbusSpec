modbusspec: 0
id: huawei-sdongle
manufacturer: Huawei
name: SDongle
kind: energy_manager

sources:
- id: huawei-solar
  title: huawei-solar-lib (Python library used by Home Assistant)
  url: https://github.com/wlcrs/huawei-solar-lib
  license: AGPL-3.0
  commit: 19dfcfb642f362890b037ce781fb93c396fabc2e
  path: src/huawei_solar/registers.py, src/huawei_solar/register_names.py, src/huawei_solar/register_values.py

connection:
  default_port: 502
  default_unit: 100
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
  limits:
    max_registers: 64
    max_gap: 14
    min_interval_ms: 50

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 30015
    type: str
    length: 10
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: SDongle
  - - table: holding
      address: 37411
      type: u16
      answers: true

defaults:
  verified: false
  sources:
  - huawei-solar

