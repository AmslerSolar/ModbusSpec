# Written from the Huawei SmartLogger ModBus Interface Definitions (issue 35, 2020-02-20).

modbusspec: 0
id: huawei-smartlogger
manufacturer: Huawei
name: SmartLogger
kind: energy_manager

sources:
- title: SmartLogger ModBus Interface Definitions
  version: Issue 35 (2020-02-20)
  url: https://github.com/bohdan-s/Sungrow-Inverter/blob/755ae6fda3e9f2c897ccd11427e2d5df050409ee/Modbus%20Information/SmartLogger%20ModBus%20Interface%20Definitions.pdf
  sha256: 87a0b6d3b183df1d558659be610f865f0b0941387461d21e048e7212cc88dadb
- id: huawei-solar
  title: huawei-solar-lib (Python library used by Home Assistant)
  url: https://github.com/wlcrs/huawei-solar-lib
  license: AGPL-3.0
  commit: 19dfcfb642f362890b037ce781fb93c396fabc2e
  path: src/huawei_solar/registers.py, src/huawei_solar/register_names.py, src/huawei_solar/register_values.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.huawei

connection:
  default_port: 502
  default_unit: 0
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40713
    type: str
    length: 10
  checks:
  # active power control mode
  - table: holding
    address: 40737
    type: u16
    in:
    - 0
    - 1
    - 3
    - 4
    - 6
    - 200
    - 65533
    - 65534
  # device search status
  - table: holding
    address: 40736
    type: u16
    in:
    - 0
    - 1
    - 2
  - table: holding
    address: 40713
    type: str
    length: 10
    printable: true

points:
  # Identity and clock
  - {key: serial, label: ESN, table: holding, address: 40713, type: str, length: 10, poll: slow}
  - {key: x.clock, label: Date&Time, table: holding, address: 40000, type: u32, epoch: {start: '1970-01-01', unit: s}, writable: true, poll: slow, note: Epoch seconds (UTC)., conflicts: [{sources: [huawei-solar], label: smartlogger_date_time}]}
  - {key: x.city, label: City, table: holding, address: 40002, type: u32, writable: true, poll: slow}
  - {key: x.dst_enabled, label: Daylight Saving Time (DST), table: holding, address: 40004, type: u16, enum: disabled_enabled, writable: true, poll: slow}
  - {key: x.time_zone, label: Time Zone, table: holding, address: 40005, type: s32, unit: s, poll: slow, note: Offset from UTC.}
  - {key: x.dst_state, label: DST state, table: holding, address: 40007, type: u16, enum: dst_state, poll: slow}
  - {key: x.dst_offset, label: DST offset, table: holding, address: 40008, type: u16, unit: min, poll: slow}
  - {key: x.local_time, label: The Local Time, table: holding, address: 40009, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow, note: Epoch seconds in the SmartLogger's local time., conflicts: [{sources: [huawei-solar], label: smartlogger_local_time}]}
  - {key: x.system_time, label: The SystemTime, table: holding, address: 42017, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, writable: true, poll: slow, note: 'Local time, one register per part (year 2000–2068).', conflicts: [{sources: [huawei-solar], type: u16, label: smartlogger_system_time_year}]}

  # Totals of all inverters connected to the SmartLogger
  - {key: pv_power, label: Active power, table: holding, address: 40525, type: s32, unit: W, note: Total active output power of all inverters.}
  - {key: x.input_power, label: Input power, table: holding, address: 40521, type: u32, unit: W, note: Total DC input power of all inverters.}
  - {key: reactive_power, label: Reactive power, table: holding, address: 40544, type: s32, unit: var}
  - {key: power_factor, label: Power factor, table: holding, address: 40532, type: s16, scale: 0.001}
  - {key: x.dc_current, label: DC current, table: holding, address: 40500, type: s16, unit: A, scale: 0.1, note: Total DC input current; use 40554 when it exceeds the 16-bit range.}
  - {key: x.dc_current_2, label: DC current 2, table: holding, address: 40554, type: s32, unit: A, scale: 0.1}
  - {key: l1_current, label: Phase A current, table: holding, address: 40572, type: s16, unit: A, note: Sum of all inverters' phase A currents.}
  - {key: l2_current, label: Phase B current, table: holding, address: 40573, type: s16, unit: A}
  - {key: l3_current, label: Phase C current, table: holding, address: 40574, type: s16, unit: A}
  - {key: x.line_voltage_l1_l2, label: Uab, table: holding, address: 40575, type: u16, unit: V, scale: 0.1}
  - {key: x.line_voltage_l2_l3, label: Ubc, table: holding, address: 40576, type: u16, unit: V, scale: 0.1}
  - {key: x.line_voltage_l3_l1, label: Uca, table: holding, address: 40577, type: u16, unit: V, scale: 0.1}
  - {key: x.efficiency, label: Inverter Efficiency, table: holding, address: 40685, type: u16, unit: '%', scale: 0.01}
  - {key: pv_energy, label: E-Total, table: holding, address: 40560, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: pv_energy_today, label: E-Daily, table: holding, address: 40562, type: u32, unit: kWh, scale: 0.1}
  - {key: x.generation_hours_today, label: Duration of daily power generation, table: holding, address: 40564, type: u32, unit: h, scale: 0.1}
  - {key: x.co2_reduction, label: CO2 reduction, table: holding, address: 40523, type: u32, unit: kg, scale: 0.1, poll: slow, note: Use 40550 when it exceeds the 32-bit range.}
  - {key: x.co2_reduction_total, label: CO2 reduction, table: holding, address: 40550, type: u64, unit: kg, scale: 0.01, poll: slow}

  # Plant state
  - {key: x.locked, label: Locked, table: holding, address: 40699, type: u16, enum: locked, note: Unlocked as soon as more than one inverter is on-grid and feeding.}
  - {key: x.di_status, label: DI status, table: holding, address: 40700, type: u16, flags: di, note: Bit set = DI closed.}
  - {key: x.plant_status_qinghai, label: Plant status (Qinghai), table: holding, address: 40543, type: u16, enum: plant_status_qinghai}
  - {key: x.plant_status_xinjiang, label: Plant status (Xinjiang), table: holding, address: 40566, type: u16, enum: plant_status_xinjiang}
  - {key: x.plant_status_ningxia, label: Plant status (Ningxia), table: holding, address: 40567, type: u16, enum: plant_status_ningxia}
  - {key: x.active_alarm_sequence, label: Active alarm sequence number, table: holding, address: 40568, type: u32}
  - {key: x.historical_alarm_sequence, label: Historical alarm sequence number, table: holding, address: 40570, type: u32}
  - {key: x.device_search_status, label: Device access status, table: holding, address: 40736, type: u16, enum: search_status}
  - {key: x.transfer_trip, label: Transfer trip, table: holding, address: 40204, type: u16, enum: transfer_trip, writable: true, note: In fault outage the plant shuts down and ignores start-up requests.}

  # Power control
  - {key: x.active_power_control_mode, label: Active power control mode, table: holding, address: 40737, type: u16, enum: active_mode, poll: slow}
  - {key: x.active_power_target, label: Active power scheduling target value, table: holding, address: 40738, type: u32, unit: W, scale: 100, conflicts: [{sources: [huawei-solar], type: s32, label: smartlogger_active_power_scheduling_target_value}]}
  - {key: x.active_scheduling_percentage, label: Active scheduling percentage, table: holding, address: 40802, type: u32, unit: '%', conflicts: [{sources: [huawei-solar], type: s32, label: smartlogger_active_power_scheduling_in_percentage}]}
  - {key: x.reactive_power_control_mode, label: Reactive power control mode, table: holding, address: 40740, type: u16, enum: reactive_mode, poll: slow}
  - {key: x.reactive_curve_mode, label: Reactive power scheduling curve mode, table: holding, address: 40741, type: u16, enum: reactive_curve_mode, poll: slow}
  - {key: x.reactive_power_target, label: Reactive power scheduling target value, table: holding, address: 40742, type: s32, note: 'A power factor (raw ÷ 1000) when 40741 = 0, a reactive power in kvar (raw ÷ 10) when 40741 = 1; given raw here.', conflicts: [{sources: [huawei-solar], unit: var, scale: 100, label: smartlogger_reactive_power_scheduling_target_value}]}
  - {key: x.active_adjustment, label: Active adjustment, table: holding, address: 40420, type: u32, unit: W, scale: 100, writable: true, note: Total active power of all inverters; values outside the range are discarded; write at most once a second., conflicts: [{sources: [huawei-solar], type: s32, label: smartlogger_active_power_adjustment}]}
  - {key: x.reactive_adjustment, label: Reactive adjustment, table: holding, address: 40422, type: s32, unit: var, scale: 100, writable: true}
  - {key: x.active_adjustment_2, label: Active adjustment, table: holding, address: 40424, type: u32, unit: W, scale: 100, writable: true, note: Second register pair for the same adjustment.}
  - {key: x.reactive_adjustment_2, label: Reactive adjustment, table: holding, address: 40426, type: s32, unit: var, scale: 100, writable: true}
  - {key: x.active_adjustment_percent, label: Active power adjustment by percentage, table: holding, address: 40428, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, note: Of the sum of all inverters' rated power., conflicts: [{sources: [huawei-solar], type: s16, label: smartlogger_active_power_adjustment_in_percentage}]}
  - {key: x.power_factor_adjustment, label: Power factor adjustment, table: holding, address: 40429, type: s16, scale: 0.001, writable: true, note: '(−1, −0.8] or [0.8, 1].'}
  - {key: x.max_reactive_adjustment, label: Max. reactive adjustment, table: holding, address: 40693, type: u32, unit: var, scale: 100, poll: slow}
  - {key: x.min_reactive_adjustment, label: Min. reactive adjustment, table: holding, address: 40695, type: s32, unit: var, scale: 100, poll: slow}
  - {key: x.max_active_adjustment, label: Max. active adjustment, table: holding, address: 40697, type: u32, unit: W, scale: 100, poll: slow, conflicts: [{sources: [huawei-solar], type: s32, label: smartlogger_maximum_active_power_adjustment_value}]}

  # Plant settings
  - {key: x.co2_coefficient, label: CO2 emission reduction coefficient, table: holding, address: 41124, type: u16, unit: kg/kWh, scale: 0.001, writable: true, poll: slow}
  - {key: x.pv_module_capacity, label: PV module capacity, table: holding, address: 41934, type: u32, unit: W, poll: slow}
  - {key: x.rated_plant_capacity, label: Rated plant capacity, table: holding, address: 41936, type: u32, unit: W, poll: slow}
  - {key: x.rated_inverter_capacity, label: Total rated capacity of grid-connected inverters, table: holding, address: 41938, type: u32, unit: W, poll: slow}
  - {key: x.conversion_coefficient, label: Conversion coefficient, table: holding, address: 41940, type: u32, scale: 0.001, poll: slow}
  - {key: x.jp_server_status, label: Communication status, table: holding, address: 41942, type: u16, enum: connection_result, note: Link to the servers of Japanese power companies.}
  - {key: x.comm_loss_shutdown, label: Communication abnormal shutdown, table: holding, address: 41947, type: u16, enum: disabled_enabled, writable: true, poll: slow}
  - {key: x.comm_loss_detection_time, label: Communication abnormal detection time, table: holding, address: 41948, type: u16, unit: s, writable: true, min: 60, max: 1800, poll: slow}
  - {key: x.comm_recovery_start, label: Auto start upon communication recovery, table: holding, address: 41949, type: u16, enum: disabled_enabled, writable: true, poll: slow}

  # Alarms
  - {key: x.alarm_info_1, label: Alarm Info 1, table: holding, address: 50000, type: u16, flags: alarm_info_1}
  - {key: x.alarm_info_2, label: Alarm Info 2, table: holding, address: 50001, type: u16, flags: alarm_info_2}
  - {key: x.alarm_info_3, label: Alarm Info 3, table: holding, address: 50002, type: u16, flags: alarm_info_3, note: Not in the register table; the alarm table places its bits here., verified: false}

  # Public registers (answered for every connected device on its own unit id)
  - {key: x.device_list_change, label: Device list change number, table: holding, address: 65521, type: u16}
  - {key: x.port_number, label: Port number, table: holding, address: 65522, type: u16, poll: slow}
  - {key: x.device_address, label: Device Address, table: holding, address: 65523, type: u16, poll: slow}
  - {key: x.device_name, label: Device name, table: holding, address: 65524, type: str, length: 10, writable: true, poll: slow}
  - {key: x.connection_status, label: Device connection status, table: holding, address: 65534, type: u16, enum: connection_status}
  - {key: x.smartlogger_software_package_name, label: smartlogger_software_package_name, table: holding, address: 20689, type: str, length: 30, verified: false, sources: [huawei-solar]}
  - {key: x.model_name, label: model_name, table: holding, address: 30000, type: str, length: 15, verified: false, sources: [huawei-solar]}
  - {key: x.serial_number, label: serial_number, table: holding, address: 30015, type: str, length: 10, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_pv_inverter_shutdown, label: smartlogger_pv_inverter_shutdown, table: holding, address: 40196, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_pv_inverter_startup, label: smartlogger_pv_inverter_startup, table: holding, address: 40197, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_ess_shutdown, label: smartlogger_ess_shutdown, table: holding, address: 40198, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_ess_startup, label: smartlogger_ess_startup, table: holding, address: 40199, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_startup, label: smartlogger_startup, table: holding, address: 40200, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
  - {key: x.smartlogger_shutdown, label: smartlogger_shutdown, table: holding, address: 40201, type: u16, invalid: [65535], writable: true, verified: false, sources: [huawei-solar]}
