notes:
- Modbus TCP on port 502. Unit 0 is the SmartLogger itself (registers here); units 1–247 reach the connected devices (inverters,
  power meter, environmental monitor) at their RS485 addresses. All registers are holding registers (read 03, write 06 / 16);
  a slave answers within 5 s; at most 125 registers per read.
- The SmartLogger alarm table lists 50002 bits that its register table doesn't; alarm IDs 1106–1115 need SmartLogger V200R001
  or later.
- 'Problems: only MCB disconnect (1103, grid-tied breaker off: all inverters stop) is reported as a fault; the other SmartLogger
  alarms (scheduling, DI inputs, SPD, 24 V, certificates, license) as warnings. The Xinjiang plant status ''fault outage''
  counts as a fault where a grid operator uses it.'
- 'Left out: the write-only commands (power on/off of all inverters 40200–40203, array reset 40205, system reset 40723, fast
  device access 40724, device operation 40725), the inspection and I-V scan commands (42730, 42779), the scan current error
  42150 and the reserved block 40608.'
- 'The remapped registers (from 51000 on the SmartLogger''s unit: 25 registers per device, address = 51000 + 25 × (device
  address − 1) + offset) aren''t described here; they hold each inverter''s active / reactive power, DC current, input power,
  insulation resistance, power factor, status, cabinet temperature and fault codes, and each environmental monitor''s values.'
- The SUN2000 inverters behind the SmartLogger use their own register map (the document refers to the inverter's protocol);
  the power meter and the environmental monitor instrument are in huawei-smartlogger-meter and huawei-smartlogger-emi.
- 'Left out: smartlogger_system_time_month (holding 42018, u16) from huawei-solar overlaps x.system_time from the documents.'
- 'Left out: smartlogger_system_time_day (holding 42019, u16) from huawei-solar overlaps x.system_time from the documents.'
- 'Left out: smartlogger_system_time_hour (holding 42020, u16) from huawei-solar overlaps x.system_time from the documents.'
- 'Left out: smartlogger_system_time_minute (holding 42021, u16) from huawei-solar overlaps x.system_time from the documents.'
- 'Left out: smartlogger_system_time_second (holding 42022, u16) from huawei-solar overlaps x.system_time from the documents.'
- huawei-solar-lib reads and writes everything as holding registers (function 03, writes 06/16).
- Huawei devices accept only one Modbus TCP connection at a time.
- The library waits 1 s after connecting and 50 ms between requests.
- Detected by a model name starting with SmartLogger, or (without a model name register) by reading the ESN at 40713; the
  device name is at 65524.
- Identification as huawei-solar recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
