enums:
  off_on: {'0': 'Off', '1': 'On'}
  qv_limit: {'0': Limit not reached, '1': Lower limit reached, '2': Upper limit reached}
  p_control_mode: {'0': No configuration found, '1': Variable fixed value Pvar fix, '2': Variable fixed value Pvar DI, '3': Variable fixed value Pvar AI, '4': Variable fixed value Pvar Modbus, '5': Remote Power Control (RPC), '100': LFSM-O, '101': LFSM-U, '102': FSM, '112': RPC & FSM, '120': Controller freeze (undervoltage), '121': Controller freeze (overvoltage), '200': Fail-safe operation (hold last setpoint), '201': Fail-safe operation (default setpoint), '202': Fail-safe operation (system fallback value), '203': Fail-safe operation (automatic grid disconnection)}
  q_control_mode: {'0': No configuration found, '1': Variable fixed value cos φ fix, '2': Variable fixed value cos φ DI, '3': Variable fixed value cos φ AI, '4': Variable fixed value cos φ Modbus, '5': Characteristic curve cos φ (P), '6': Characteristic curve cos φ (V), '7': Variable fixed value Q fix, '8': Variable fixed value Q DI, '9': Variable fixed value Q AI, '10': Variable fixed value Q Modbus, '11': Characteristic curve Q (P), '12': Characteristic curve Q (V), '13': Characteristic curve Q (tan φ), '14': Voltage control Q (V droop), '15': Characteristic curve Q(V) Modbus, '16': Characteristic curve cos φ (P) Modbus, '100': Reactive power compensation, '120': Controller freeze (undervoltage), '121': Controller freeze (overvoltage), '200': Fail-safe operation (hold last setpoint), '201': Fail-safe operation (default setpoint), '202': Fail-safe operation (system fallback value)}
  q_control_mode_hybrid: {'0': No configuration found, '1': Variable fixed value cos φ fix, '2': Variable fixed value cos φ DI, '3': Variable fixed value cos φ AI, '4': Variable fixed value cos φ Modbus, '5': Characteristic curve cos φ (P), '6': Characteristic curve cos φ (V), '7': Variable fixed value Q fix, '8': Variable fixed value Q DI, '9': Variable fixed value Q AI, '10': Variable fixed value Q Modbus, '11': Characteristic curve Q (P), '12': Characteristic curve Q (V), '13': Characteristic curve Q (tan φ), '14': Voltage control Q (V droop), '15': Characteristic curve Q(V) Modbus, '16': Characteristic curve cos φ (P) Modbus, '100': Reactive power compensation, '200': Fail-safe operation (setpoint failure), '201': Fail-safe operation (meter failure), '202': Fail-safe operation (system fallback)}

problems:
  - {when: {key: x.p_control_mode, range: [200, 203]}, kind: warning, text: 'Active power control in fail-safe operation ({text})'}
  - {when: {key: x.q_control_mode, range: [200, 202]}, kind: warning, text: 'Reactive power control in fail-safe operation ({text})'}

notes:
- 'The blue''Log data logger acting as power plant controller. The register map depends on whether the Hybrid EMS is used:
  without it the values sit at 0 ff. (read) and 5000 ff. (write), with it at 1000 ff. (read) and 10000 ff. (write). The vendor
  and model registers tell the two apart.'
- Register numbers in the document are used as 0-based protocol addresses. Values are read with function 03 and written with
  function 16.
- Port, unit id and word order of the 32-bit values are not stated in the document; 502, 1 and high word first are assumed.
- Several registers only exist from a given firmware on (noted per point); older firmware has no vendor and model registers,
  so the model can't be detected there.
- 'Left out: frequency (FSM, LFSM) and ramp-rate parameters, characteristic-curve reference points, the reactive power meter
  block (150 ff.), energy-trader setpoints and test commands.'
- 'Identification: one of the model matches must hold.'
