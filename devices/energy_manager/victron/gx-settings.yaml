# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-settings
manufacturer: Victron Energy
name: 'GX Modbus-TCP: settings, ESS control and restore (com.victronenergy.settings, hub4, platform)'
kind: energy_manager

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/victron/victron

connection:
  default_port: 502
  default_unit: 100
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.settings_cgwacs_ac_power_set_point, label: ESS control loop setpoint, table: holding, address: 2700, type: s16, unit: W, writable: true}
  - {key: x.settings_cgwacs_max_charge_percentage, label: ESS max charge current (fractional), table: holding, address: 2701, type: u16, unit: '%', writable: true}
  - {key: x.settings_cgwacs_max_discharge_percentage, label: ESS max discharge current (fractional), table: holding, address: 2702, type: u16, unit: '%', writable: true}
  - {key: x.settings_cgwacs_ac_power_set_point_2703, label: ESS control loop setpoint, table: holding, address: 2703, type: s16, unit: W, scale: 100, writable: true, note: 'Same as 2700 in 100 W steps, for setpoints beyond 32 kW.'}
  - {key: x.settings_cgwacs_max_discharge_power_2704, label: ESS max discharge current, table: holding, address: 2704, type: s16, unit: W, scale: 10, writable: true, conflicts: [{sources: [hass-victron], type: u16, label: settings ess maxdischargepower}]}
  - {key: x.settings_system_setup_max_charge_current, label: DVCC system max charge current, table: holding, address: 2705, type: s16, unit: A, writable: true, note: -1 = no limit.}
  - {key: x.settings_cgwacs_max_feed_in_power_2706, label: Maximum System Grid Feed In, table: holding, address: 2706, type: s16, unit: W, scale: 100, writable: true, note: -1 = no limit.}
  - {key: x.settings_cgwacs_overvoltage_feed_in, label: Feed excess DC-coupled PV into grid, table: holding, address: 2707, type: s16, enum: settings_cgwacs_overvoltage_feed_in, writable: true}
  - {key: x.settings_cgwacs_prevent_feedback, label: Don’t feed excess AC-coupled PV into grid, table: holding, address: 2708, type: s16, enum: settings_cgwacs_prevent_feedback, writable: true}
  - {key: x.hub4_pv_power_limiter_active, label: Grid limiting status, table: holding, address: 2709, type: s16, enum: hub4_pv_power_limiter_active}
  - {key: x.settings_system_setup_max_charge_voltage, label: Limit managed battery voltage, table: holding, address: 2710, type: u16, unit: V, scale: 0.1, writable: true}
  - {key: x.settings_system_setup_ac_input1, label: AC input 1 source (for VE.Bus inverter/chargers), table: holding, address: 2711, type: u16, enum: settings_system_setup_ac_input1, writable: true}
  - {key: x.settings_system_setup_ac_input2, label: AC input 2 source (for VE.Bus inverter/chargers), table: holding, address: 2712, type: u16, enum: settings_system_setup_ac_input1, writable: true}
  - {key: x.settings_cgwacs_ac_export_limit, label: AC export limit when peakshaving, table: holding, address: 2713, type: s16, unit: A, writable: true, note: -1 = disabled.}
  - {key: x.settings_cgwacs_ac_input_limit, label: AC import limit when peakshaving, table: holding, address: 2714, type: s16, writable: true, note: -1 = disabled.}
  - {key: x.settings_cgwacs_always_peak_shave, label: Mode for peakshaving, table: holding, address: 2715, type: u16, enum: settings_cgwacs_always_peak_shave, writable: true}
  - {key: x.hub4_overrides_setpoint, label: 'AC grid setpoint (volatile, in memory)', table: holding, address: 2716, type: s32, unit: W, writable: true}
  - {key: x.settings_cgwacs_run_without_grid_meter, label: Grid metering, table: holding, address: 2718, type: u16, enum: settings_cgwacs_run_without_grid_meter, writable: true}
  - {key: x.settings_cgwacs_max_discharge_power, label: ESS max discharge current, table: holding, address: 2720, type: s32, unit: W, writable: true, note: 32-bit version of 2704.}
  - {key: x.settings_cgwacs_max_feed_in_power, label: Maximum System Grid Feed In, table: holding, address: 2722, type: s32, unit: W, writable: true, note: 32-bit version of 2706.}
  - {key: x.hub4_pv_disable, label: Disable PV inverter generation (set limit to zero), table: holding, address: 2724, type: u16, enum: hub4_pv_disable, writable: true}
  - {key: x.settings_cgwacs_battery_life_state, label: ESS BatteryLife state, table: holding, address: 2900, type: u16, enum: settings_cgwacs_battery_life_state, writable: true}
  - {key: x.settings_cgwacs_battery_life_minimum_soc_limit, label: ESS Minimum SoC (unless grid fails), table: holding, address: 2901, type: u16, unit: '%', scale: 0.1, writable: true}
  - {key: x.settings_cgwacs_hub4_mode, label: ESS Mode, table: holding, address: 2902, type: u16, enum: settings_cgwacs_hub4_mode, writable: true}
  - {key: x.settings_cgwacs_battery_life_soc_limit, label: ESS BatteryLife SoC limit (read only), table: holding, address: 2903, type: u16, unit: '%', scale: 0.1, note: Kept by BatteryLife; the active limit is the lower of this and 2901.}
  - {key: x.settings_pump0_auto_start_enabled, label: Auto start enabled, table: holding, address: 4701, type: u16, enum: settings_pump0_auto_start_enabled, writable: true}
  - {key: x.settings_pump0_mode, label: Mode, table: holding, address: 4702, type: u16, enum: settings_pump0_mode, writable: true}
  - {key: x.settings_pump0_start_value, label: Start value, table: holding, address: 4703, type: u16, unit: '%', writable: true}
  - {key: x.settings_pump0_stop_value, label: Stop value, table: holding, address: 4704, type: u16, unit: '%', writable: true}
  - {key: x.settings_dynamic_ess_battery_capacity, label: Battery capacity, table: holding, address: 5420, type: u16, unit: kWh, scale: 0.1, writable: true, poll: slow}
  - {key: x.settings_dynamic_ess_full_charge_duration, label: Full battery charge duration, table: holding, address: 5421, type: u16, unit: h, writable: true}
  - {key: x.settings_dynamic_ess_full_charge_interval, label: Full battery charge interval, table: holding, address: 5422, type: u16, unit: d, writable: true}
  - {key: x.settings_dynamic_ess_mode, label: Dynamic ESS mode, table: holding, address: 5423, type: u16, enum: settings_dynamic_ess_mode, writable: true}
  - {key: x.settings_dynamic_ess_schedule_0_allow_grid_feed_in, label: Allow grid feed-in during this schedule, table: holding, address: 5424, type: u16, enum: settings_dynamic_ess_schedule_0_allow_grid_feed_in, writable: true}
  - {key: x.settings_dynamic_ess_schedule_0_duration, label: Duration for this schedule, table: holding, address: 5425, type: u16, unit: s, writable: true}
  - {key: x.settings_dynamic_ess_schedule_0_restrictions, label: Active restrictions for this schedule, table: holding, address: 5426, type: u16, enum: settings_dynamic_ess_schedule_0_restrictions, writable: true}
  - {key: x.settings_dynamic_ess_schedule_0_soc, label: Target SOC for this schedule, table: holding, address: 5427, type: u16, unit: '%', writable: true}
  - {key: x.settings_dynamic_ess_schedule_0_start, label: Unix timestamp when this schedule starts, table: holding, address: 5428, type: s32, writable: true, conflicts: [{sources: [hass-victron], unit: s, label: settings dynamicess schedule starttime}]}
  - {key: x.settings_dynamic_ess_schedule_0_strategy, label: Used strategy for this schedule, table: holding, address: 5430, type: u16, enum: settings_dynamic_ess_schedule_0_strategy, writable: true}
  - {key: x.settings_system_setup_system_name, label: GX device System Name, table: holding, address: 5700, type: str, length: 8, writable: true, poll: slow}
  - {key: x.platform_vebus_devices_0_restore_file_index, label: 'Index of configuration to restore, starting with 0', table: holding, address: 5800, type: u16, writable: true}
  - {key: x.platform_vebus_devices_0_restore_action, label: Start restore, table: holding, address: 5801, type: u16, enum: platform_vebus_devices_0_restore_action, writable: true}
  - {key: x.platform_vebus_devices_0_restore_notify, label: Notify when restore is complete, table: holding, address: 5802, type: u16, enum: platform_vebus_devices_0_restore_notify}
  - {key: x.platform_vebus_devices_1_restore_file_index, label: 'Index of configuration to restore, starting with 0', table: holding, address: 5810, type: u16, writable: true}
  - {key: x.platform_vebus_devices_1_restore_action, label: Start restore, table: holding, address: 5811, type: u16, enum: platform_vebus_devices_0_restore_action, writable: true}
  - {key: x.platform_vebus_devices_1_restore_notify, label: Notify when restore is complete, table: holding, address: 5812, type: u16, enum: platform_vebus_devices_0_restore_notify}

enums:
  settings_cgwacs_overvoltage_feed_in: {'0': Don’t feed excess DC-tied PV into grid, '1': Feed excess DC-tied PV into the grid}
  settings_cgwacs_prevent_feedback: {'0': Feed excess AC-tied PV into grid, '1': Don’t feed excess AC-tied PV into the grid}
  hub4_pv_power_limiter_active: {'0': Feed-in limiting is inactive, '1': Feed-in limiting is active}
  settings_system_setup_ac_input1: {'0': Unused, '1': Grid, '2': Genset, '3': Shore}
  settings_cgwacs_always_peak_shave: {'0': Above minimum SOC only, '1': Always}
  settings_cgwacs_run_without_grid_meter: {'0': External meter, '1': Inverter/Charger}
  hub4_pv_disable: {'0': Enable PV inverters, '1': Disable PV inverters}
  settings_cgwacs_battery_life_state: {'0': 'Unused, BL disabled', '1': Restarting, '2': Self-consumption, '3': Self-consumption, '4': Self-consumption, '5': Discharge disabled, '6': Force charge, '7': Sustain, '8': Low Soc Recharge, '9': Keep batteries charged, '10': BL Disabled, '11': BL Disabled (Low SoC), '12': BL Disabled (Low SOC recharge)}
  settings_cgwacs_hub4_mode: {'1': ESS with Phase Compensation, '2': ESS without phase compensation, '3': Disabled/External Control}
  settings_pump0_auto_start_enabled: {'0': Disabled, '1': Enabled}
  settings_pump0_mode: {'0': Auto, '1': 'On', '2': 'Off'}
  settings_dynamic_ess_mode: {'0': 'Off', '1': Auto, '4': Node-RED}
  settings_dynamic_ess_schedule_0_allow_grid_feed_in: {'0': Not allowed, '1': Allowed}
  settings_dynamic_ess_schedule_0_restrictions: {'0': No restrictions between battery and the grid, '1': Battery to grid energy flow is restricted, '2': Grid to battery energy flow is restricted, '3': No energy flow between battery and grid}
  settings_dynamic_ess_schedule_0_strategy: {'0': Target SOC, '1': Self-consumption, '2': Pro battery, '3': Pro grid}
  platform_vebus_devices_0_restore_action: {'1': Restore}
  platform_vebus_devices_0_restore_notify: {'0': None, '2': Complete, '102': Error}

notes:
- Unit id 100 is the GX itself (the list's unit id sheet; 0 works too, but many clients don't accept it).
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- Also carries the hub4 (2709, 2716, 2724) and platform (5800–5812, VE.Bus configuration restore) services, which answer on
  unit 100 like the settings; their keys start with x.hub4_ / x.platform_.
- Answers on unit id 100 (the GX itself); hass-victron reads only system and settings registers there.
