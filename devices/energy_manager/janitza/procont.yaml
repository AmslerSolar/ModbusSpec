notes:
- 'Kind energy_manager: the controller reports the site''s main meter power, remaining power and trend, and controls load
  groups and charging stations, which is the format''s definition of an energy manager.'
- The list starts at address 0, so these are taken as protocol addresses as listed. It doesn't say so outright, and it names
  no read function; the holding table is assumed, unverified like every point here. Only function 06 is named, for 280 and
  281 (the list's note names 280; the row for 281 says the same).
- 'Rows 100–227 (load groups) and 293–299 are shaded in the list, meaning not on all device types: the LMC has 128 groups,
  the LMC-LITE 16, the EMC none. They are optional here, without models. The load group states at 660 onward aren''t shaded,
  although the EMC has no groups.'
- 'Modbus has to be enabled in Procont Vis under the network settings, and so do external setpoints: per station for 228–259,
  as a system setting for 280. Values at 788–855 are written from outside and feed the controller; writing them, the setpoints
  or 281 changes what it does.'
- 'List oddities, the same in German: External Meter Power is UINT16 with a 32-bit range and two registers per row (read
  as u32); load group states have unit kW but values 0, 1, 2 (unit dropped, meanings not given); the input and output words
  have a range of ten bits for twelve channels. ''Som'' in the tariff enum is the list''s own abbreviation, not explained.'
- Which system alarm counts as a fault and which as a warning is this file's judgement. Bits of the input and output words
  are presumably channel 1 upward; not stated. The unit of the IO values and analog inputs depends on configuration.
- No device registers exist to tell it apart, so identify uses the plausible ranges of tariff, clock and lifebit. A device
  with a clock in these exact registers would pass as well. Transport tcp is taken from the mention of network settings;
  port 502, unit 1 and 125 registers per request aren't documented; assumed.
- 'Left out: the 61 configurable alarms at 39–99 (0 to 3, off to active and unacknowledged, names only in Procont Vis),
  load groups 17–128 at 116–227 and their states at 676–787.'
