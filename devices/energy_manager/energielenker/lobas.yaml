# Written from the energielenker help article on the Lobas Modbus TCP server (valid from Lobas V2.32.0 / LMB 3.20.0).

modbusspec: 0
id: energielenker-lobas
manufacturer: energielenker
name: Lobas load management (SunSpec server)
kind: energy_manager

sources:
- title: energielenker Hilfecenter, SunSpec-Modbus im Lobas-System einrichten und nutzen
  version: from Lobas V2.32.0 (LMB 3.20.0)
  url: https://support.energielenker.de/portal/de/kb/articles/lobas-modbus-tcp-server
  sha256: 05fe52bb9aafbdbddb390d6f719e032a298e5aacd868832bd939636014de32c4
  language: de

connection:
  default_port: 1502
  default_unit: 1
  transports:
  - tcp
  input_equals_holding: true
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

sunspec: true

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: str
    length: 2
    equals: SunS
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: energielenker
  - table: holding
    address: 40020
    type: str
    length: 16
    prefix: Load Management

