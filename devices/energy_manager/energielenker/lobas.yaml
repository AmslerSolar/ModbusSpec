notes:
- 'These points are the fixed part only: the SunSpec block at 40000 and the settings, flags and variables models. The wallboxes, meters and batteries behind the Lobas have no fixed addresses, so they can''t be points in this format: scan the SunSpec chain from 40000.'
- 'The article warns that the addresses of the models 60000 (40070), 60001 (40098) and 60002 (40132) can change in future versions, and that blocks move up when a device is removed. A reader should check the model code at each start and otherwise walk the chain.'
- 'The server has to be turned on in the Lobas (Konfiguration, Schnittstellen, Modbus TCP Server), and each component has to be published in its own settings.'
- 'Port 1502 is fixed on CC100 hardware and on all systems built from 2025. On older ones it is freely chosen; the article''s configuration example shows 502.'
- 'The Lobas answers on the configured id (1 in the example, set by sunspec_srv_id, 0 stops the server). The block at 40000 answers on that id and id + 1. The models 60000–60002 and virtual meters follow on the id, the configured devices (113, 213, 124) on id + 1 and upwards.'
- 'Device model 113 (charging station, length 63, offsets from the model code): currents 2 (sum), 4, 6, 8; voltages 16, 18, 20; power 22; frequency 24; apparent 26; reactive 28; power factor 30; energy 32 in Wh, all float. State 62 (int16: noMock -2, ignore -1, noState 0, waiting 1, evPresent 2, evCharging 3, evChargingWithVent 4, failure 5, offline 6, rebooting 7), device id 63, communication error 64. Only offset 28 can be written.'
- 'Device model 213 (meter, length 126, read only, floats): currents 2 (sum), 4, 6, 8; voltage 10, then 12, 14, 16; frequency 26; power 28, then 30, 32, 34; apparent 36, then 38, 40, 42; reactive 44; power factor 52; export 60 and import 68 in Wh. Event flags 124, role 126 (displayOnly 0, consumption 1, production 2, gridDemand 3, vehicleConsumption 4, storageHome 5, storageAll 6, chargingGroup 7), device id 127.'
- 'Device model 124 (battery, length 25, read only, added for storage roles): maximum power 2 in W, charge limit 3 and discharge limit 4 in 1/100 %, state of charge 8 in %, scale factors 18 and 19 (the latter -2), device id 26. For a battery without its own meter, the meter fields mirror its values.'
- 'In the article''s start address table the settings model has length 16 and the flags model 33, but the models'' own tables and the start addresses give 26 and 32 registers after the header; those are used.'
- 'The variables model holds 22 registers per variable (name, then a float), repeated for as many as are configured; this file has the first. Optional because there may be none.'
- 'Enable and add-unbalance are floats holding 0 or 1. Which settings can be written, and the effect of a write, isn''t stated row by row; try on a real system first. A write of the external maximum current needs the heartbeat kept alive.'
- Function 3 and 4 read; 6 and 16 write. 125 registers per request are assumed. The options field at offset 36 is left out because the article gives no type.
