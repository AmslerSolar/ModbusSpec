modbusspec: 0
id: hager-flow
manufacturer: Hager
name: XEM energy manager with EMC flow R2
kind: energy_manager

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/hager-flow-modbus.yaml

connection:
  default_port: 502
  default_unit: 0
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_current, label: Grid L1 current, table: holding, address: 4099, type: u16, unit: A}
  - {key: l2_current, label: Grid L2 current, table: holding, address: 4100, type: u16, unit: A}
  - {key: l3_current, label: Grid L3 current, table: holding, address: 4101, type: u16, unit: A}
  - {key: grid_power, label: Grid power, table: holding, address: 4102, type: s32, unit: W, positive: import}
  - {key: x.pv_power_1, label: PV power (part 1), table: holding, address: 4126, type: u32, unit: W}
  - {key: battery_power, label: Battery power, table: holding, address: 4138, type: s32, unit: W, positive: charge}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 4146, type: u16, unit: '%'}

notes:
- 'evcc template `hager-flow` (grid, pv, battery) lists: Hager XEM with EMC flow R2.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
