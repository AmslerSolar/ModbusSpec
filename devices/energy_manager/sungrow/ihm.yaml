  version: V1.0.2 (2026-01-21)
  url: https://github.com/TCzerny/ha-modbus-manager/blob/c722b72d95cdda8745d7655a5ee6a12dd662cc3c/docs/Communication%20Protocol%20of%20iHomeManager_V1.0.2.pdf
  sha256: 654d8dc30246e609f7045f0d9e0ad0b88d7e7136d4e450c6acf9f818b44bf5a9
- title: Communication Protocol of iHomeManager (iHM Communication Protocol)
  version: V1.0.1
  url: https://github.com/TCzerny/ha-modbus-manager/blob/c722b72d95cdda8745d7655a5ee6a12dd662cc3c/docs/Communication%20Protocol%20of%20iHomeManager_V1.0.1_EN.pdf
  sha256: 6b48f87bd692d014d91cf689c6a5d63c9a779448f30dbf7ff7969c707e738817
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/sungrow-ihm.yaml
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.sungrow/src/main/java/org/openhab/binding/modbus/sungrow/internal/SungrowIHomeManagerRegisters.java,
    bundles/org.openhab.binding.modbus.sungrow/src/main/java/org/openhab/binding/modbus/sungrow/internal/SungrowIHomeManagerHandler.java
- id: openwb
