enums:
  status: {'0': Waiting, '1': Normal, '2': Warning, '3': Fault, '4': Flashing firmware update}
  meter_status: {'0': Disabled, '1': Online, '2': Offline}
  ems_inverter_status: {'0': Absent, '2': Online}

notes:
- Reached through the inverter's Wi-Fi / LAN dongle on TCP port 8899, which wraps Modbus requests in GivEnergy's own framing
  (not plain Modbus TCP); every device on the bus answers there under its own device address. The library reads at most 60
  registers per request, in blocks starting at multiples of 60.
- Plant-level registers of the EMS controller at device address 0x11 (2040 and up), with per-inverter and per-meter summaries.
- 'Left out: inverter_1_suspected_status (same register value as inverter_1_status); inverter_2_suspected_status (same register
  value as inverter_2_status); inverter_3_suspected_status (same register value as inverter_3_status); inverter_4_suspected_status
  (same register value as inverter_4_status).'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
