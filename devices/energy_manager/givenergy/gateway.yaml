  - {key: x.aio_state, label: Aio state, table: input, address: 1703, type: u16, enum: state}
  - {key: x.battery_firmware_version, label: Battery firmware version, table: input, address: 1704, type: u16}
  - {key: x.e_aio1_charge_today, label: Energy aio1 charge today, table: input, address: 1705, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio1_charge_total, label: Energy aio1 charge total, table: input, address: 1706, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio2_charge_today, label: Energy aio2 charge today, table: input, address: 1708, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio2_charge_total, label: Energy aio2 charge total, table: input, address: 1709, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio3_charge_today, label: Energy aio3 charge today, table: input, address: 1711, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio3_charge_total, label: Energy aio3 charge total, table: input, address: 1712, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio1_discharge_today, label: Energy aio1 discharge today, table: input, address: 1750, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio1_discharge_total, label: Energy aio1 discharge total, table: input, address: 1751, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio2_discharge_today, label: Energy aio2 discharge today, table: input, address: 1753, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio2_discharge_total, label: Energy aio2 discharge total, table: input, address: 1754, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio3_discharge_today, label: Energy aio3 discharge today, table: input, address: 1756, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio3_discharge_total, label: Energy aio3 discharge total, table: input, address: 1757, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_battery_charge_today, label: Energy battery charge today, table: input, address: 1795, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_battery_charge_total, label: Energy battery charge total, table: input, address: 1796, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_battery_discharge_today, label: Energy battery discharge today, table: input, address: 1798, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_battery_discharge_total, label: Energy battery discharge total, table: input, address: 1799, type: u32, unit: kWh, scale: 0.1}
  - {key: x.aio1_soc, label: Aio1 soc, table: input, address: 1801, type: u16, unit: '%', note: 'The library treats values outside 0 to 100 (after scaling) as invalid, except all zero.'}
  - {key: x.aio2_soc, label: Aio2 soc, table: input, address: 1802, type: u16, unit: '%', note: 'The library treats values outside 0 to 100 (after scaling) as invalid, except all zero.'}
  - {key: x.aio3_soc, label: Aio3 soc, table: input, address: 1803, type: u16, unit: '%', note: 'The library treats values outside 0 to 100 (after scaling) as invalid, except all zero.'}
  - {key: x.p_aio1_inverter, label: Power aio1 inverter, table: input, address: 1816, type: s16, unit: W, note: 'The library flips the sign of this value: the firmware reports it positive while the battery charges.'}
  - {key: x.p_aio2_inverter, label: Power aio2 inverter, table: input, address: 1817, type: s16, unit: W, note: 'The library flips the sign of this value: the firmware reports it positive while the battery charges.'}
  - {key: x.p_aio3_inverter, label: Power aio3 inverter, table: input, address: 1818, type: s16, unit: W, note: 'The library flips the sign of this value: the firmware reports it positive while the battery charges.'}
  - {key: x.aio1_serial_number, label: Aio1 serial number, table: input, address: 1841, type: str, length: 5}
  - {key: x.aio2_serial_number, label: Aio2 serial number, table: input, address: 1846, type: str, length: 5}
  - {key: x.aio3_serial_number, label: Aio3 serial number, table: input, address: 1851, type: str, length: 5}

enums:
  work_mode: {'0': Initialising, '1': Off grid, '2': On grid, '3': Fault, '4': Update}
  state: {'0': Static, '1': Charge, '2': Discharge}

flags:
  gateway_fault: {'0': Grid mode Off, '12': AC over voltage constant, '13': AC under frequency constant, '14': AC over frequency constant, '15': Over AC voltage long-time, '16': Under quarter AC voltage, '17': Over quarter AC voltage, '18': No zero-point protection, '20': AC under voltage 2, '21': AC over voltage 2, '22': AC under frequency 2, '23': AC over frequency 2, '24': AC under voltage 1, '25': AC over voltage 1, '26': AC under frequency 1, '27': AC over frequency 1, '28': Relay 3&4 disconnect, '29': Relay 1&2 disconnect, '30': Relay 3&4 bonding, '31': Relay 1&2 bonding}

notes:
- Reached through the inverter's Wi-Fi / LAN dongle on TCP port 8899, which wraps Modbus requests in GivEnergy's own framing
  (not plain Modbus TCP); every device on the bus answers there under its own device address. The library reads at most 60
  registers per request, in blocks starting at multiples of 60.
- Registers of the GivEnergy Gateway in the V1 layout (firmware up to GA000009, and the only layout seen on devices so far).
  The library also keeps a V2 layout with swapped 32-bit words that has never been observed; it is not imported.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
