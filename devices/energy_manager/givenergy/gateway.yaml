modbusspec: 0
id: givenergy-gateway
manufacturer: GivEnergy
name: Gateway
kind: energy_manager

sources:
- id: givenergy-modbus
  title: givenergy-modbus (Python library for GivEnergy inverters, used by givenergy-hass)
  url: https://github.com/dewet22/givenergy-modbus
  license: Apache-2.0
  commit: 90e3ec13098aacc9607160209779b4e029ac8cd9
  path: givenergy_modbus/model/gateway.py

connection:
  default_port: 8899
  default_unit: 17

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - givenergy-modbus

points:
  - {key: x.software_version, label: Software version, table: input, address: 1600, type: str, length: 2, note: 'Version prefix; the next two registers (1602, 1603) carry the version digits, one number per byte.'}
  - {key: x.work_mode, label: Work mode, table: input, address: 1604, type: u16, enum: work_mode}
  - {key: x.v_grid, label: Voltage grid, table: input, address: 1608, type: s16, unit: V, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.i_grid, label: Current grid, table: input, address: 1609, type: s16, unit: A, scale: 0.1, note: 'The library treats values outside -500.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.v_load, label: Voltage load, table: input, address: 1610, type: u16, unit: V, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.i_load, label: Current load, table: input, address: 1611, type: u16, unit: A, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.i_pv, label: Current pv, table: input, address: 1612, type: s16, unit: A, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.p_ac1, label: Power ac1, table: input, address: 1616, type: s16, unit: W}
  - {key: x.p_pv, label: Power pv, table: input, address: 1617, type: u16, unit: W, note: 'The library treats values outside at most 50000 (after scaling) as invalid, except all zero.'}
  - {key: x.p_load, label: Power load, table: input, address: 1618, type: u16, unit: W, note: 'The library treats values outside at most 50000 (after scaling) as invalid, except all zero.'}
  - {key: x.p_liberty, label: Power liberty, table: input, address: 1619, type: s16, unit: W, note: 'The library flips the sign of this value: the firmware reports it positive while the battery charges.'}
  - {key: x.fault_protection, label: Fault protection, table: input, address: 1620, type: u32}
  - {key: x.gateway_fault_codes, label: Gateway fault codes, table: input, address: 1622, type: u32, flags: gateway_fault}
  - {key: x.v_grid_relay, label: Voltage grid relay, table: input, address: 1624, type: u16, unit: V, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.v_inverter_relay, label: Voltage inverter relay, table: input, address: 1625, type: u16, unit: V, scale: 0.1, note: 'The library treats values outside 0.0 to 500.0 (after scaling) as invalid, except all zero.'}
  - {key: x.first_inverter_serial_number, label: First inverter serial number, table: input, address: 1627, type: str, length: 5}
  - {key: x.e_grid_import_today, label: Energy grid import today, table: input, address: 1640, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_grid_import_total, label: Energy grid import total, table: input, address: 1641, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_pv_today, label: Energy pv today, table: input, address: 1643, type: u16, unit: kWh, scale: 0.1}
