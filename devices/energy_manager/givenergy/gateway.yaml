  - {key: x.e_grid_export_today, label: Energy grid export today, table: input, address: 1646, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_grid_export_total, label: Energy grid export total, table: input, address: 1647, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio_charge_today, label: Energy aio charge today, table: input, address: 1649, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio_charge_total, label: Energy aio charge total, table: input, address: 1650, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_aio_discharge_today, label: Energy aio discharge today, table: input, address: 1652, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_aio_discharge_total, label: Energy aio discharge total, table: input, address: 1653, type: u32, unit: kWh, scale: 0.1}
  - {key: x.e_load_today, label: Energy load today, table: input, address: 1655, type: u16, unit: kWh, scale: 0.1}
  - {key: x.e_load_total, label: Energy load total, table: input, address: 1656, type: u32, unit: kWh, scale: 0.1}
  - {key: x.parallel_aio_num, label: Parallel aio num, table: input, address: 1700, type: u16}
