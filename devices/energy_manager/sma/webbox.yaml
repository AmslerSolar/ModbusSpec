modbusspec: 0
id: sma-webbox
manufacturer: SMA
name: WebBox
kind: energy_manager

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/sma-webbox.yaml

connection:
  default_port: 502
  default_unit: 2
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
