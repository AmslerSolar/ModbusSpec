  - {key: pv_power, label: PV power, table: holding, address: 30775, type: s32, unit: W, invalid: [-2147483648, 2147483647]}

notes:
- 'evcc template `sma-webbox` (pv) lists: SMA WebBox.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
