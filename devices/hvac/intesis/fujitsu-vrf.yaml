# Written from the Intesis Modbus Server – Fujitsu VRF user manual (r1.0, 02/2020).

modbusspec: 0
id: intesis-fujitsu-vrf
manufacturer: Intesis (HMS Networks)
name: Modbus server gateway for Fujitsu VRF air conditioning (INMBSFGL016O000)
kind: hvac

sources:
- title: Intesis Modbus Server – Fujitsu VRF Air Conditioning, user manual (INMBSFGL016O000)
  version: r1.0 (02/2020)
  url: https://idx.co.za/wp-content/uploads/2021/01/fujitsu-vrf-modbus-user-manual.pdf
  sha256: 4f773b5a33cfcc8a2234f6d666377e7b41ac48f49cbc5cc9ddf2f7833cf00863
  archive_url: https://web.archive.org/web/20240808025956/https://www.idx.co.za/wp-content/uploads/2021/01/fujitsu-vrf-modbus-user-manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  # Gateway (0–16)
  - {key: x.gateway_energy_saving, label: Gateway energy saving, table: holding, address: 0, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.gateway_error, label: Gateway error, table: holding, address: 1, type: u16, enum: normal_error}
  - {key: x.gateway_error_code, label: Gateway error code, table: holding, address: 2, type: u16, enum: gateway_error_code}
  - {key: x.all_on, label: On (all units), table: holding, address: 3, type: u16, writable: true, write_only: true, poll: slow, note: 1 switches all indoor units on.}
  - {key: x.all_off, label: Off (all units), table: holding, address: 4, type: u16, writable: true, write_only: true, poll: slow, note: 1 switches all indoor units off.}
  - {key: x.all_setpoint, label: Temperature setpoint (all units), table: holding, address: 16, type: s16, unit: °C, scale: 0.1, writable: true, write_only: true, poll: slow, note: 'Cooling 19…30 °C, heating 17…30 °C. Registers 5…15 likewise set the mode (5 auto, 6 heat, 7 dry, 8 fan, 9 cool) and fan speed (10 auto, 11 quiet, 12 low, 13 mid-low, 14 mid-high, 15 high) of all units when 1 is written.'}

  # Outdoor unit with ID 0: (ID+1)×25 + 10000 + n
  - {key: x.outdoor_capacity_save, label: Outdoor unit capacity save, table: holding, address: 10025, type: u16, enum: capacity_save}
  - {key: x.outdoor_forced_off, label: Outdoor unit forced off, table: holding, address: 10026, type: u16, enum: forced_off}
  - {key: x.outdoor_error, label: Outdoor unit error, table: holding, address: 10027, type: u16, enum: no_error_error}
  - {key: x.outdoor_error_code, label: Outdoor unit error code, table: holding, address: 10028, type: u16, enum: error_code, note: 0 = no error; other values per the error code table.}

  # Indoor unit with ID 1: (ID+1)×100 + n
  - {key: x.on_off, label: On/Off, table: holding, address: 200, type: u16, enum: off_on, writable: true}
  - {key: x.operation_mode, label: Operation mode, table: holding, address: 201, type: u16, enum: operation_mode, writable: true}
  - {key: x.fan_speed, label: Fan speed, table: holding, address: 202, type: u16, enum: fan_speed, writable: true, note: 'Units with four speeds: 0 auto, 1 quiet, 2 low, 3 medium, 4 high. Units with five speeds: 0 auto, 1 quiet, 2 low, 3 medium-low, 4 medium-high, 5 high.'}
  - {key: x.vane_up_down, label: Vane position up/down, table: holding, address: 203, type: u16, enum: vane_ud, writable: true}
  - {key: x.vane_left_right, label: Vane position left/right, table: holding, address: 204, type: u16, enum: vane_lr, writable: true}
  - {key: x.setpoint, label: Temperature setpoint, table: holding, address: 205, type: s16, unit: °C, scale: 0.1, writable: true, note: 'Cooling 19…30 °C, heating 17…30 °C.'}
  - {key: x.room_temperature, label: Ambient temperature, table: holding, address: 206, type: s16, unit: °C, scale: 0.1, note: 0…63.5 °C.}
  - {key: x.temperature_limit_valid, label: Temperature limit valid, table: holding, address: 207, type: u16, enum: invalid_valid, poll: slow}
  - {key: x.heat_setpoint_max, label: Heat setpoint upper limit, table: holding, address: 208, type: s16, unit: °C, scale: 0.1, writable: true, min: 10, max: 30, poll: slow}
  - {key: x.heat_setpoint_min, label: Heat setpoint lower limit, table: holding, address: 209, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.cool_setpoint_max, label: Cool setpoint upper limit, table: holding, address: 210, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.cool_setpoint_min, label: Cool setpoint lower limit, table: holding, address: 211, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.auto_setpoint_max, label: Auto setpoint upper limit, table: holding, address: 212, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.auto_setpoint_min, label: Auto setpoint lower limit, table: holding, address: 213, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.unit_error, label: Unit error, table: holding, address: 214, type: u16, enum: no_error_error}
  - {key: error_code, label: Unit error code, table: holding, address: 215, type: u16, enum: error_code, note: 0 = no error; other values per the error code table (Modbus value → Fujitsu code).}
  - {key: x.filter_alarm, label: Filter alarm, table: holding, address: 216, type: u16, enum: normal_alarm}
  - {key: x.filter_alarm_reset, label: Filter alarm reset, table: holding, address: 217, type: u16, writable: true, write_only: true, poll: slow, note: 1 resets the filter alarm.}
  - {key: x.communication_error, label: Indoor unit communication error, table: holding, address: 218, type: u16, enum: no_error_error}
  - {key: x.emergency, label: Emergency, table: holding, address: 219, type: u16, enum: off_on}
  - {key: x.rc_full_control_lock, label: Allow full control from remote controller, table: holding, address: 220, type: u16, enum: allow_not_allow, writable: true, poll: slow}
  - {key: x.rc_on_off_lock, label: Allow on/off from remote controller, table: holding, address: 221, type: u16, enum: allow_not_allow, writable: true, poll: slow}
  - {key: x.rc_mode_lock, label: Allow mode from remote controller, table: holding, address: 222, type: u16, enum: allow_not_allow, writable: true, poll: slow}
  - {key: x.rc_setpoint_lock, label: Allow setpoint from remote controller, table: holding, address: 223, type: u16, enum: allow_not_allow, writable: true, poll: slow}
  - {key: x.thermo, label: Thermo off, table: holding, address: 224, type: u16, enum: thermo, writable: true}

enums:
  disable_enable: {'0': Disabled, '1': Enabled}
  normal_error: {'0': Normal, '1': Error}
  no_error_error: {'0': No error, '1': Error}
  normal_alarm: {'0': Normal, '1': Alarm}
  gateway_error_code: {'0': No error, '1': Communication error, '2': No configuration}
  capacity_save: {'0': Not set, '1': 100 %, '2': 90 %, '3': 80 %, '4': 70 %, '5': 60 %, '6': 50 %, '7': 40 %}
  forced_off: {'0': Not forced, '1': Forced off}
  off_on: {'0': 'Off', '1': 'On'}
  operation_mode: {'0': Auto, '1': Heat, '2': Dry, '3': Fan, '4': Cool}
  fan_speed: {'0': Auto, '1': Quiet, '2': Low, '3': Medium / medium-low, '4': High / medium-high, '5': High}
  vane_ud: {'1': Position 1, '2': Position 2, '3': Position 3, '4': Position 4, '10': Swing}
  vane_lr: {'1': Position 1, '2': Position 2, '3': Position 3, '4': Position 4, '5': Position 5, '10': Swing}
  invalid_valid: {'0': Invalid, '1': Valid}
  allow_not_allow: {'0': Allowed, '1': Not allowed}
  thermo: {'0': Thermo off, '1': Thermo on}
  error_code: {'0': No error, '1': (no code), '2': '12: Remote controller communication error', '3': '13: Communication error with outdoor unit', '4': '14: Network communication error', '5': '15: Scan error', '6': '16: Peripheral device communication error', '7': '21: Initial setting error', '8': '26: Address setting error', '9': '27: Master / slave unit setting error', '10': '28: Other setting error', '11': '31: Indoor unit power supply abnormal', '12': '32: Indoor unit main PCB error', '13': '35: Manual auto switch error', '14': '37: Indoor unit transmission PCB error', '15': '38: Network convertor PCB error', '16': '41: Room temperature sensor error', '17': '42: Indoor unit heat exchanger sensor error', '18': '51: Indoor unit fan motor 1 error', '19': '53: Water drain abnormal', '20': '5U: Indoor unit error', '21': '61: Outdoor unit power supply abnormal', '22': '62: Outdoor unit main PCB error', '23': '63: Inverter PCB error', '24': '67: Short interruption detection protected operation', '25': '68: Magnetic relay error', '26': '69: Outdoor unit transmission PCB error', '27': '71: Discharge temperature sensor error', '28': '72: Compressor temperature sensor error', '29': '73: Outdoor unit heat exchanger sensor error', '30': '74: Outdoor temperature sensor error', '31': '75: Suction gas temperature sensor error', '32': '77: Heat sink temperature sensor error', '33': '82: Sub-cool heat exchanger gas temperature sensor error', '34': '83: Liquid pipe temperature sensor error', '35': '84: Current sensor error', '36': '86: Pressure sensor error', '37': '92: Compressor 2 error', '38': '93: Compressor start-up error', '39': '94: Trip detection', '40': '95: Compressor motor control error', '41': '97: Outdoor unit fan motor 1 error', '42': '99: 4-way valve error', '43': '9U: Outdoor unit error', '44': 'A1: Discharge temperature 1 abnormal', '45': 'A2: Discharge temperature 2 abnormal', '46': 'A3: Compressor temperature abnormal', '47': 'A4: Pressure abnormal 1', '48': 'A5: Pressure abnormal 2', '49': 'AA: Special operation error', '50': 'AC: Ambient temperature abnormal', '51': 'C1: Main PCB error', '52': 'C2: Transmission PCB error', '53': 'C3: PCB 1 error', '54': 'C4: PCB 2 error', '55': 'C5: PCB 3 error', '56': 'C6: PCB 4 error', '57': 'C7: PCB 5 error', '58': 'C8: Input device error', '59': 'C9: Display device error', '60': 'CA: EEPROM error', '61': 'CC: Sensor error', '62': 'CF: External connector error (USB memory)', '63': 'CJ: Other parts error', '64': Unknown, '65': '17: Electricity charge apportionment error', '66': '98: Outdoor unit fan motor 2 error', '67': '9A: Coil (expansion valve) error', '68': '52: Coil (expansion valve) error', '69': 'J1: RB unit error', '70': 'A6: Outdoor heat exchanger temperature abnormal', '71': '29: Connection unit number error in wired remote controller system', '72': '3A: Indoor unit communication circuit (wired remote controller) error'}

problems:
  - {when: {key: x.gateway_error, equals: 1}, kind: fault, text: 'Gateway error ({value})'}
  - {when: {key: x.outdoor_error_code, not: 0}, kind: fault, text: 'Outdoor unit error {text}'}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Indoor unit error {text}'}
  - {when: {key: x.communication_error, equals: 1}, kind: fault, text: No communication with the indoor unit}
  - {when: {key: x.filter_alarm, equals: 1}, kind: warning, text: Filter alarm}

notes:
- Addresses are the 0-based protocol addresses the manual gives (it states that the first register is 0).
- One gateway serves up to 16 Fujitsu VRF units on the X1/X2 bus (VRF-II series and later). Each unit gets an ID (0…31) in
  the configuration tool. Indoor unit registers are at (ID+1)×100 + n (n = 0…24), outdoor unit registers at (ID+1)×25 + 10000
  + n (n = 0…3). The points here follow the manual's example configuration, in which the outdoor unit has ID 0 (10025…10028)
  and the first indoor unit ID 1 (200…224); add (ID−1)×100 for other indoor units.
- Read with function 03 or 04, write with 06 or 16. All registers are 16-bit signed. Registers not in the map read 0; poll
  records may span addresses 0…20000.
- Temperatures are °C × 10 with the default Celsius setting; the configuration tool can switch the gateway to Fahrenheit (then
  °F × 10), which this file can't express.
- 'Write-only command registers 3…16 and 217 are triggers: the gateway acts on a write of 1 (or of the setpoint value).'
- Modbus TCP port and keep-alive, and the RTU baud rate (1200…115200), parity and stop bits are set in the configuration tool;
  the defaults are 502, 9600 baud 8N1 and unit 1. RS485 and RS232 are both available, as is TCP alongside RTU.
- The gateway has no register that identifies it; it can't be recognised on a network scan from this map.
