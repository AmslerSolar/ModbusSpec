modbusspec: 0
id: climaveneta-imxw
manufacturer: Climaveneta
name: Fan coils with i-MXW controller
kind: hvac

sources:
- id: climaveneta
  title: climaveneta (Home Assistant integration)
  url: https://github.com/Tadiern/climaveneta
  license: MIT
  commit: 4cb8311fae1940260e120278f18c1dac297b4a3d
  path: custom_components/climaveneta/pyclimaveneta.py, custom_components/climaveneta/coordinator.py, custom_components/climaveneta/binary_sensor.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - climaveneta

points:
  - {key: x.firmware_release, label: Firmware release, table: holding, address: 4097, type: u16, note: Shown as the hex digits with a dot before the last two (0x123 → 1.23).}
  - {key: x.air_temperature, label: Room air temperature, table: holding, address: 4098, type: u16, unit: °C, scale: 0.1}
  - {key: x.t2_temperature, label: T2 probe temperature, table: holding, address: 4099, type: s16, unit: °C, scale: 0.1, note: Optional probe. The project treats raw values outside 50–1000 (5–100 °C) as probe not connected.}
  - {key: x.water_temperature, label: Water (exchanger) temperature, table: holding, address: 4100, type: u16, unit: °C, scale: 0.1}
  - {key: x.dip1, label: Dip switch 1, table: holding, address: 4101, type: u16, note: 'On machines without electric heater: 0 = continuous ventilation on, 1 = off.'}
  - {key: x.dip2, label: Dip switch 2 (master / slave), table: holding, address: 4102, type: u16, enum: master_slave}
  - {key: x.on_off, label: On / off, table: holding, address: 4111, type: u16, enum: on_off}
  - {key: x.fan_only, label: Fan only, table: holding, address: 4112, type: u16, enum: on_off}
  - {key: x.season, label: Season, table: holding, address: 4115, type: u16, enum: season}
  - {key: x.fan_auto, label: Fan auto, table: holding, address: 4119, type: u16, enum: on_off}
  - {key: x.fan_stop, label: Fan stop, table: holding, address: 4120, type: u16, enum: on_off}
  - {key: x.fan_min, label: Fan minimum speed, table: holding, address: 4121, type: u16, enum: on_off}
  - {key: x.fan_med, label: Fan medium speed, table: holding, address: 4122, type: u16, enum: on_off}
  - {key: x.fan_max, label: Fan maximum speed, table: holding, address: 4123, type: u16, enum: on_off}
  - {key: x.ev_water, label: Water valve EV1, table: holding, address: 4124, type: u16, enum: water_valve, note: The valve also switches the external pump contact.}
  - {key: x.relay5_fan_high, label: Relay 5 (fan high / inverter on), table: holding, address: 4130, type: u16}
  - {key: x.window_input, label: Window input, table: holding, address: 4131, type: u16, enum: contact}
  - {key: x.pump_alarm_input, label: Pump alarm input, table: holding, address: 4132, type: u16, enum: contact}
  - {key: x.heater_present, label: Heater present, table: holding, address: 4134, type: u16, enum: present}
  - {key: x.analog_output, label: Analog output 0–10 V, table: holding, address: 4135, type: u16, unit: V, scale: 0.1}
  - {key: x.alarm_t1, label: 'Alarm: T1 probe fault', table: holding, address: 4136, type: u16}
  - {key: x.alarm_t2, label: 'Alarm: T2 probe fault', table: holding, address: 4137, type: u16}
  - {key: x.alarm_t3, label: 'Alarm: T3 probe fault', table: holding, address: 4138, type: u16}
  - {key: x.alarm_water_drain, label: 'Alarm: condensate drain level', table: holding, address: 4139, type: u16}
  - {key: x.offset_ntc_etn, label: NTC ETN probe offset (OFS), table: holding, address: 4140, type: s16, unit: °C, scale: 0.1}
  - {key: x.setpoint_summer, label: 'Set temperature, summer (cooling)', table: holding, address: 4141, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.setpoint_winter, label: 'Set temperature, winter (heating)', table: holding, address: 4142, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.min_water_temp_winter, label: 'Minimum water temperature, winter', table: holding, address: 4146, type: u16, unit: °C, scale: 0.1}
  - {key: x.max_water_temp_summer, label: 'Maximum water temperature, summer', table: holding, address: 4147, type: u16, unit: °C, scale: 0.1}
  - {key: x.setpoint_hysteresis, label: Set point hysteresis (I-rL), table: holding, address: 4152, type: u16, unit: °C, scale: 0.1}
  - {key: x.dead_zone_center, label: Dead zone centre (dEds), table: holding, address: 4153, type: u16, unit: °C, scale: 0.1}
  - {key: x.dead_zone_range, label: Dead zone range (dEdr), table: holding, address: 4154, type: u16, unit: °C, scale: 0.1}
  - {key: x.t1_compensation_delta, label: T1 compensation delta (t1dS), table: holding, address: 4155, type: u16, unit: °C, scale: 0.1}
  - {key: x.min_voltage_winter, label: 'Fan minimum voltage, winter', table: holding, address: 4159, type: u16, unit: V, scale: 0.1}
  - {key: x.max_voltage_winter, label: 'Fan maximum voltage, winter', table: holding, address: 4160, type: u16, unit: V, scale: 0.1}
  - {key: x.min_voltage_summer, label: 'Fan minimum voltage, summer', table: holding, address: 4176, type: u16, unit: V, scale: 0.1}
  - {key: x.max_voltage_summer, label: 'Fan maximum voltage, summer', table: holding, address: 4177, type: u16, unit: V, scale: 0.1}
  - {key: x.no_frost, label: No-frost (away) mode, table: holding, address: 4181, type: u16, enum: on_off, writable: true}
  - {key: x.power_save, label: Power save (eco) mode, table: holding, address: 4182, type: u16, enum: on_off, writable: true}
  - {key: x.antistrat_wait_time, label: Anti-stratification wait time (Ft1), table: holding, address: 4183, type: u16, unit: min, writable: true, note: 10–20 min.}
  - {key: x.t1_compensation_base_summer, label: 'T1 compensation base, summer (t1SE)', table: holding, address: 4184, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.antistrat_time_summer, label: 'Anti-stratification time, summer (Ft2E)', table: holding, address: 4185, type: u16, unit: s, writable: true, note: 30–180 s.}
  - {key: x.t1_compensation_base_winter, label: 'T1 compensation base, winter (t1SI)', table: holding, address: 4186, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.antistrat_time_winter, label: 'Anti-stratification time, winter (Ft2I)', table: holding, address: 4187, type: u16, unit: s, writable: true, note: 30–180 s.}
  - {key: x.set_on_off, label: On / off (command), table: holding, address: 4188, type: u16, enum: on_off, writable: true}
  - {key: x.set_mode, label: Mode (command), table: holding, address: 4189, type: u16, enum: imxw_mode, writable: true}
  - {key: x.set_fan_speed, label: Fan speed (command), table: holding, address: 4190, type: u16, enum: fan, writable: true}
  - {key: x.external_probe_enabled, label: External room temperature enabled, table: holding, address: 4208, type: u16, enum: on_off, writable: true, note: 1 = use the room temperature written to the next register instead of the unit's own probe.}
  - {key: x.external_probe_temperature, label: External room temperature, table: holding, address: 4209, type: u16, unit: °C, scale: 0.1, writable: true}

enums:
  on_off: {'0': 'Off', '1': 'On'}
  season: {'0': Summer (cooling), '1': Winter (heating)}
  imxw_mode: {'0': Summer (cooling), '1': Winter (heating), '2': Fan only, '3': Auto}
  fan: {'0': Auto, '1': Low, '2': Medium, '3': High}
  water_valve: {'0': Bypass (closed), '1': Circulating (open)}
  contact: {'0': Closed, '1': Open}
  present: {'0': Absent, '1': Present}
  master_slave: {'0': Master, '1': Slave}

notes:
- The status registers 0x1017–0x101B hold one flag each for the fan setting (auto, stop, minimum, medium, maximum); the command
  register 0x105E takes the speed as a number.
- The unit is in cooling or heating by the season register; with the water valve open it is actively cooling or heating, otherwise
  idle.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
