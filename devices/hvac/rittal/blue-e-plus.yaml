notes:
- OpenEMS calls the device only "Blue E Plus" (Rittal's Blue e+ cooling unit line). Holding registers 0–87 are settings OpenEMS
  only writes (function 16).
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
