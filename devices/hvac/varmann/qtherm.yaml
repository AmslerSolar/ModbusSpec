modbusspec: 0
id: varmann-qtherm
manufacturer: Varmann
name: Qtherm
kind: hvac

sources:
- id: modbus-local-gateway
  title: modbus_local_gateway (Home Assistant integration)
  url: https://github.com/timlaing/modbus_local_gateway
  license: MIT
  commit: e770d6c91220d98b8f0be22b103fdb607c3c67f4
  path: custom_components/modbus_local_gateway/device_configs/Varmann Qtherm.yaml

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - modbus-local-gateway

points:
  - {key: x.slave_address, label: Slave Address, table: holding, address: 0, type: u16, writable: true}
  - {key: x.tmp_ntc, label: Temperature NTC, table: holding, address: 1, type: u16, unit: °C, scale: 0.1}
  - {key: x.ust_tmp, label: Required Temperature, table: holding, address: 2, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.heat_chill, label: Heat/Chill Mode, table: holding, address: 3, type: u16, enum: heat_chill, writable: true}
  - {key: x.timereg, label: Integration time, table: holding, address: 4, type: u16, unit: s, writable: true}
  - {key: x.kreg, label: Regulation profile, table: holding, address: 5, type: u16, writable: true}
  - {key: x.ust_fan, label: Required Fan speed, table: holding, address: 6, type: u16, unit: '%', writable: true}
  - {key: x.valve_heat, label: Heating valve, table: holding, address: 7, type: u16, writable: true}
  - {key: x.valve_chill, label: Cooling valve, table: holding, address: 8, type: u16, writable: true}
  - {key: x.tmp_out, label: Incoming temperature, table: holding, address: 9, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.time_lan, label: LAN communication timeout, table: holding, address: 10, type: u16, unit: s, writable: true}
  - {key: x.vadc, label: ADC value, table: holding, address: 11, type: u16, unit: '%'}
  - {key: x.fan_ust, label: Fan speed, table: holding, address: 12, type: u16, unit: '%'}
  - {key: x.o_heat, label: Heating valve state, table: holding, address: 13, type: u16, enum: o_heat}
  - {key: x.o_chill, label: Cooling valve state, table: holding, address: 14, type: u16, enum: o_heat}
  - {key: x.alarm, label: Alarm status, table: holding, address: 15, type: u16, enum: alarm}
  - {key: x.dip_1, label: DIP Switch 1, table: holding, address: 16, type: u16, enum: dip_1}
  - {key: x.dip_2, label: DIP Switch 2, table: holding, address: 17, type: u16, enum: dip_1}
  - {key: x.i_mode, label: Operating mode, table: holding, address: 18, type: u16}
  - {key: x.i_manual, label: Manual control, table: holding, address: 19, type: u16, bits: [0, 2], flags: i_manual}
  - {key: x.freq_sin, label: Motor drive frequency, table: holding, address: 20, type: u16, unit: Hz}
  - {key: x.amp_sin, label: Motor drive amplitude, table: holding, address: 21, type: u16, unit: V}
  - {key: x.ishunt, label: Motor current, table: holding, address: 22, type: u16, unit: A}
  - {key: x.inorm, label: Motor nominal current, table: holding, address: 23, type: u16, unit: A, writable: true}

enums:
  heat_chill: {'0': Heating, '1': Cooling, '2': Auto}
  o_heat: {'0': Closed, '1': Open}
  alarm: {'0': OK, '1': Fault}
  dip_1: {'0': Manual, '1': Auto}

flags:
  i_manual: {'0': Fan High, '1': Fan Medium, '2': Fan Low}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
