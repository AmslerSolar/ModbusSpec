modbusspec: 0
id: neptronic-skvf
manufacturer: Neptronic
name: SKVF series evaporative cooler
kind: hvac

sources:
- title: SKVF Series Evaporative Cooler, Modbus Communication Module User Guide (SKVF-Modbus Guide-250211)
  version: v1.08, 2025-02-11
  url: http://neptronic.com/Humidifiers/pdf/2025/SKVF-Modbus%20Guide(v1.08)-250211.pdf
  sha256: 9e5a1ff88336fd0a654dac1e5406439eabd98dee03b9815897494ec763949aea
  archive_url: https://web.archive.org/web/20251013024655/https://www.neptronic.com/humidifiers/pdf/2025/SKVF-Modbus%20Guide(v1.08)-250211.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N2

encoding:
  byte_order: big
  word_order: big

points:
  # Device (0–8)
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 0, type: u16, bits: [0, 7], writable: true, min: 1, max: 247, poll: slow}
  - {key: x.product_type, label: Product type, table: holding, address: 0, type: u16, bits: [8, 15], poll: slow, note: Value for the SKVF not given.}
  - {key: x.baud_rate, label: Device baud rate, table: holding, address: 1, type: u16, scale: 100, writable: true, poll: slow, note: 0 = automatic baud rate detection.}
  - {key: x.comport_config, label: Modbus slave communication port configuration, table: holding, address: 2, type: u16, enum: comport_config, writable: true, poll: slow}
  - {key: x.product_name, label: Product name, table: holding, address: 3, type: str, length: 4, poll: slow, verified: false, note: '8 ASCII characters, writable. The table puts characters 0–1 in register 6 and 6–7 in register 3; read here in register order as in other Neptronic devices, not verified.'}
  - {key: firmware, label: Product actual firmware version, table: holding, address: 7, type: u16, scale: 0.01, poll: slow}
  - {key: x.eeprom_version, label: Product actual EEPROM version, table: holding, address: 8, type: u16, scale: 0.01, poll: slow}

  # Inputs (2003–2007)
  - {key: x.fan_feedback, label: ECM fan feedback, table: holding, address: 2003, type: u16, unit: Hz}
  - {key: x.supply_voltage, label: Main power supply, table: holding, address: 2006, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.fan2_feedback, label: ECM fan feedback 2, table: holding, address: 2007, type: u16, unit: Hz, optional: true}

  # Measurements and settings (6000–6101)
  - {key: x.demand, label: SKVF demand, table: holding, address: 6000, type: u16, unit: '%', scale: 0.01}
  - {key: x.power_output, label: Power output, table: holding, address: 6001, type: u16, unit: '%', scale: 0.01}
  - {key: x.control_input, label: Control input, table: holding, address: 6002, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh, label: Room RH, table: holding, address: 6006, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.supply_rh, label: Supply high limit RH, table: holding, address: 6010, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.run_time, label: Run time, table: holding, address: 6014, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: 'Registers (0)–(3); read as a 32-bit value from (0) and (1), (0) the low word (not stated; assumed).'}
  - {key: x.on_time, label: On time, table: holding, address: 6018, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As run time.}
  - {key: x.water_treated_volume, label: Water treated volume, table: holding, address: 6022, type: u32, word_order: little, unit: l, scale: 0.01, poll: slow, verified: false, note: As run time. Scale 100 per the table (its example is copied from the hours counters); not verified.}
  - {key: x.service_on_time, label: Service on time, table: holding, address: 6026, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As run time.}
  - {key: x.min_output, label: Minimum production output, table: holding, address: 6031, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.max_output, label: Maximum production output, table: holding, address: 6032, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.service_interval, label: Service interval, table: holding, address: 6034, type: u16, unit: h, writable: true, min: 1000, max: 3000, poll: slow}
  - {key: x.power_output_feedback, label: Power output feedback, table: holding, address: 6039, type: u16, unit: '%', scale: 0.01}
  - {key: x.room_rh_network, label: Room RH network reading, table: holding, address: 6047, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh_setpoint, label: Room RH setpoint, table: holding, address: 6048, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh_unoccupied_setpoint, label: Room RH unoccupied setpoint, table: holding, address: 6049, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.room_rh_vacant_setpoint, label: Room RH vacant setpoint, table: holding, address: 6050, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.room_rh_demand, label: Room RH demand, table: holding, address: 6054, type: u16, unit: '%', scale: 0.01}
  - {key: x.supply_high_limit_network, label: RH supply high limit network reading, table: holding, address: 6055, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.supply_high_limit_setpoint, label: RH supply high limit setpoint, table: holding, address: 6056, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.supply_high_limit_demand, label: RH supply high limit demand, table: holding, address: 6062, type: u16, unit: '%', scale: 0.01}
  - {key: x.network_demand, label: Control network demand, table: holding, address: 6063, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.network_high_limit, label: Control network high limit, table: holding, address: 6064, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.control_demand, label: Demand, table: holding, address: 6065, type: u16, unit: '%', scale: 0.01}
  - {key: x.room_temperature, label: Room temperature, table: holding, address: 6067, type: s16, unit: °C, scale: 0.01, optional: true, verified: false, note: Marked writable in the document. °C or °F by the Modbus server units (register 15000); metric (°C) is the default and assumed.}
  - {key: x.room_temperature_network, label: Room temperature network reading, table: holding, address: 6071, type: s16, unit: °C, scale: 0.01, writable: true, min: -40, max: 260, verified: false, note: Typed unsigned in the document but its range starts at −40; read as signed. °C assumed.}
  - {key: x.room_temperature_setpoint, label: Room temperature setpoint, table: holding, address: 6072, type: u16, unit: °C, scale: 0.01, writable: true, min: 0, max: 40, verified: false, note: °C assumed (see register 15000).}
  - {key: x.room_temperature_demand, label: Room temperature demand, table: holding, address: 6078, type: u16, unit: '%', scale: 0.01}
  - {key: x.hrl_temperature, label: HRL temperature, table: holding, address: 6079, type: s16, unit: °C, scale: 0.01, optional: true, verified: false, note: Temperature at the HRL room sensor. °C assumed (see register 15000).}
  - {key: x.hrl_humidity, label: HRL humidity, table: holding, address: 6080, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.temperature_high_limit_demand, label: Temp supply high limit demand, table: holding, address: 6090, type: u16, unit: '%', scale: 0.01}
  - {key: x.supply_temperature, label: Supply high limit temperature, table: holding, address: 6092, type: s16, unit: °C, scale: 0.01, optional: true, verified: false, note: Marked writable in the document. °C assumed (see register 15000).}
  - {key: x.network_timeout, label: Network timeout, table: holding, address: 6101, type: u16, unit: s, writable: true, min: 1, max: 900, poll: slow}

  # Inputs (10000–10008)
  - {key: x.air_flow, label: Air flow, table: holding, address: 10000, type: u16, enum: closed_open}
  - {key: x.supply_high_limit, label: Supply high limit, table: holding, address: 10001, type: u16, enum: closed_open}
  - {key: x.interlock, label: Interlock, table: holding, address: 10002, type: u16, enum: closed_open}
  - {key: x.binary_external_demand, label: Binary external demand, table: holding, address: 10003, type: u16, enum: binary_demand}
  - {key: x.water_leak, label: Water leak detection, table: holding, address: 10004, type: u16, enum: ok_leak}
  - {key: x.relay_fuse, label: Relay fuse, table: holding, address: 10007, type: u16, enum: fuse}
  - {key: x.control_fuse, label: Control PCB fuse, table: holding, address: 10008, type: u16, enum: fuse}

  # Outputs (11000–11004)
  - {key: x.alarm_relay, label: Alarm warning relay, table: holding, address: 11000, type: u16, enum: off_on}
  - {key: x.service_relay, label: Service warning relay, table: holding, address: 11001, type: u16, enum: off_on}
  - {key: x.water_supply_valve, label: Water supply valve, table: holding, address: 11002, type: u16, enum: off_on}
  - {key: x.drain_valve, label: Drain valve, table: holding, address: 11003, type: u16, enum: off_on}
  - {key: x.circulation_pump, label: Circulation pump, table: holding, address: 11004, type: u16, enum: off_on}

  # States (12000–12011)
  - {key: x.float_switch, label: Float switch, table: holding, address: 12000, type: u16, enum: inactive_active}
  - {key: x.water_treatment_service_due, label: Water treatment service due, table: holding, address: 12001, type: u16, enum: no_yes}
  - {key: x.network_control_state, label: Network control state, table: holding, address: 12007, type: u16, enum: normal_fault, writable: true}
  - {key: x.memory_status, label: Memory status, table: holding, address: 12011, type: u16, enum: ok_fail}

  # System (15000–15028)
  - {key: x.server_units, label: Modbus server units, table: holding, address: 15000, type: u16, enum: units, writable: true, poll: slow}
  - {key: x.control_profile, label: Control profile, table: holding, address: 15004, type: u16, enum: control_profile, writable: true, poll: slow}
  - {key: x.occupancy, label: Occupancy state, table: holding, address: 15006, type: u16, enum: occupancy}
  - {key: x.cutout_state, label: Control cutout state, table: holding, address: 15014, type: u16, enum: cutout_state}
  - {key: state, label: State, table: holding, address: 15015, type: u16, enum: state}
  - {key: x.system_alarm, label: System alarm, table: holding, address: 15016, type: u16, enum: system_alarm}
  - {key: x.system_power, label: System power state, table: holding, address: 15027, type: u16, enum: off_on, writable: true}
  - {key: x.request, label: Recirculation request, table: holding, address: 15028, type: u16, enum: request, writable: true, poll: slow}

enums:
  comport_config: {'0': 'No parity, 2 stop bits', '1': 'Even parity, 1 stop bit', '2': 'Odd parity, 1 stop bit'}
  off_on: {'0': 'Off', '1': 'On'}
  no_yes: {'0': 'No', '1': 'Yes'}
  closed_open: {'0': Closed, '1': Open}
  inactive_active: {'0': Inactive, '1': Active}
  binary_demand: {'0': 0 %, '1': 100 %}
  ok_leak: {'0': OK, '1': Leak}
  fuse: {'0': Normal, '1': Open fuse}
  normal_fault: {'0': Normal, '1': Fault}
  ok_fail: {'0': OK, '1': Fail}
  units: {'0': Metric, '1': Imperial}
  control_profile: {'0': External analog, '1': External network, '2': Internal humidity analog, '3': Internal humidity network, '4': Internal cooling analog, '5': Internal cooling network, '6': HRL humidity, '7': HRL cooling, '8': Custom}
  occupancy: {'0': Occupied, '1': Unoccupied, '2': Vacant, '3': 'Off'}
  cutout_state: {'0': 'Off', '1': Normal, '2': Low limit, '3': High limit, '4': No air flow, '5': Interlock}
  state: {'0': 'Off', '1': Idle, '2': Line rinse, '3': Filling, '4': Draining, '5': Running, '6': Alarm, '7': Drying}
  system_alarm: {'0': Normal, '1': Drain timeout, '2': Fill timeout, '3': Water leak, '4': Fan defect}
  request: {'0': None, '1': Reset alarms, '2': Drain, '3': Reset service counter, '4': Reset water service counter, '5': Filling}

problems:
  - {when: {key: x.system_alarm, not: 0}, kind: fault, text: 'System alarm: {text}'}
  - {when: {key: x.water_leak, equals: 1}, kind: fault, text: Water leak detected}
  - {when: {key: x.relay_fuse, equals: 1}, kind: fault, text: Relay fuse open}
  - {when: {key: x.control_fuse, equals: 1}, kind: fault, text: Control PCB fuse open}
  - {when: {key: x.memory_status, equals: 1}, kind: fault, text: Memory failure}
  - {when: {key: x.water_treatment_service_due, equals: 1}, kind: warning, text: Water treatment service due}
  - {when: {key: x.network_control_state, equals: 1}, kind: warning, text: Network control fault}

notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxxx holding register number (400001 = 0); the
  protocol address is used. A few holding register numbers there are wrong (6082 as 4061083, 11005/11006 as 411004/411005);
  the protocol address is taken.'
- Holding registers only (functions 03, 06, 16).
- RS485 Modbus RTU, unit id 1–246 (the register description says 1–247) set on the device menu or in register 0. Default unit
  id not stated; 1 assumed.
- 'Serial: automatic baud rate detection by default (9600–57600; register 1 default 19200); default framing no parity, 2 stop
  bits.'
- Ethernet interface and Modbus TCP keep-alive registers exist, but the document describes RTU only; Modbus TCP is not listed
  here.
- 'Units: temperatures in °C or °F by the Modbus server units register (15000); metric is the default and assumed.'
- Humidity values are % RH.
- Long counters take four registers each ((0)–(3)); read as a 32-bit value from (0) and (1), (0) the low word (not stated;
  assumed).
- The state registers (10000–15031) hold one value each (0/1 or an enum), not bit strings. Register 12002 is named 'Service
  Due' but lists 'Not allowed / Allowed' and is writable; left out.
- 'Left out: raw signal voltages (2000–2002, 2004, 2008–2010, 4000–4001), min/max/bias calibration values, PID tuning, temperature
  high limit settings and setpoints, drain, rinse, drying and water supply settings, signal type and source selections, manual
  fan / pump / water supply requests, direct feed settings, notification enables, LEDs, buzzer and the update status.'
