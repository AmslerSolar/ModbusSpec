  # Counters (6051–6066)
  - {key: x.run_time, label: Boiler run time, table: holding, address: 6051, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: 'Registers (0)–(3); (0) read as the low word of a 32-bit value (the range fits 32 bits); not stated, assumed.'}
  - {key: x.on_time, label: Boiler on time, table: holding, address: 6055, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}
  - {key: x.service_run_time, label: Boiler service run time, table: holding, address: 6059, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}
  - {key: x.service_on_time, label: Boiler service on time, table: holding, address: 6063, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}

  # Settings (6067–6081)
