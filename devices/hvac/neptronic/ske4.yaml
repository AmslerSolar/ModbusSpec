modbusspec: 0
id: neptronic-ske4
manufacturer: Neptronic
name: SKE4 electric steam humidifier
kind: hvac

sources:
- title: SKE4 Steam Humidifier, Modbus Communication Module User Guide (SKE4-Modbus Guide-240531)
  version: V2.07, 2024-05-31
  url: http://neptronic.com/Humidifiers/PDF/SKE4/Manuals/2024/SKE4-Modbus%20Guide-240531%20(V2.07).pdf
  sha256: 97ea46ce66cf6354a43583a367b405a872fc171ca736d23203cc7500ce2ed874
  archive_url: https://web.archive.org/web/20241204101823/http://www.neptronic.com/Humidifiers/pdf/SKE4/Manuals/2024/SKE4-Modbus%20Guide-240531%20(V2.07).pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N2

encoding:
  byte_order: big
  word_order: big

points:
  # Device (0–8)
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 0, type: u16, bits: [0, 7], writable: true, poll: slow, note: 1–247.}
  - {key: x.product_type, label: Product type, table: holding, address: 0, type: u16, bits: [8, 15], poll: slow, note: Value for the SKE4 not given.}
  - {key: x.baud_rate, label: Device baud rate, table: holding, address: 1, type: u16, scale: 100, writable: true, poll: slow, note: 0 = automatic baud rate detection.}
  - {key: x.comport_config, label: Modbus slave communication port configuration, table: holding, address: 2, type: u16, enum: comport_config, writable: true, poll: slow}
  - {key: x.product_name, label: Product name, table: holding, address: 3, type: str, length: 4, poll: slow, verified: false, note: '8 ASCII characters, writable. The table puts characters 0–1 in register 6 and 6–7 in register 3; read here in register order as in other Neptronic devices, not verified.'}
  - {key: firmware, label: Product actual firmware version, table: holding, address: 7, type: u16, scale: 0.01, poll: slow}
  - {key: x.eeprom_version, label: Product actual EEPROM version, table: holding, address: 8, type: u16, scale: 0.01, poll: slow}

  # Inputs and outputs (2013, 4001)
  - {key: x.supply_voltage, label: Main power supply, table: holding, address: 2013, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.heater_ssr_stage, label: Heater SSR stage, table: holding, address: 4001, type: u16, unit: '%', scale: 0.01}

  # Measurements (6000–6050)
  - {key: x.control_input, label: Control input, table: holding, address: 6000, type: u16, unit: '%', scale: 0.01}
  - {key: x.room_rh, label: Room RH, table: holding, address: 6004, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.supply_rh, label: Supply high limit RH, table: holding, address: 6008, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.water_temperature, label: Water temperature, table: holding, address: 6012, type: u16, unit: °C, scale: 0.01, verified: false, note: °C or °F by the Modbus server units (register 15001); metric (°C) is the default and assumed.}
  - {key: x.ssr_temperature, label: SSR temperature, table: holding, address: 6014, type: s16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 15001).}
  - {key: x.cabinet_temperature, label: Cabinet temperature, table: holding, address: 6015, type: s16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 15001).}
