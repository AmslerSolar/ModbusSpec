  - {key: x.room_rh_vacant_setpoint, label: Room RH vacant setpoint, table: holding, address: 6031, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.room_demand, label: Room demand, table: holding, address: 6035, type: u16, unit: '%', scale: 0.01}
  - {key: x.supply_high_limit_network, label: Supply high limit network reading, table: holding, address: 6036, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.supply_high_limit_setpoint, label: Supply high limit setpoint, table: holding, address: 6037, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.supply_high_limit_demand, label: Supply high limit demand, table: holding, address: 6041, type: u16, unit: '%', scale: 0.01}
  - {key: x.network_demand, label: Humidity control network demand, table: holding, address: 6042, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
