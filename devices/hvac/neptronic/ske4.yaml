  - {key: x.humidity_demand, label: Humidity demand, table: holding, address: 6044, type: u16, unit: '%', scale: 0.01}
  - {key: x.power_output, label: System power output, table: holding, address: 6046, type: u16, unit: '%', scale: 0.01}
  - {key: x.boiler_demand, label: Boiler demand, table: holding, address: 6048, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
