  - {key: x.current2, label: Current sensor 2, table: holding, address: 6017, type: u16, unit: A, scale: 0.01, verified: false, note: Heater current sensor 2; which phase it measures is not stated.}
  - {key: x.power_output_feedback, label: Power output feedback, table: holding, address: 6022, type: u16, unit: '%', scale: 0.01}
