modbusspec: 0
id: neptronic-sks4
manufacturer: Neptronic
name: SKS4 steam to steam humidifier
kind: hvac

sources:
- title: SKS4 Steam to Steam Humidifier, Modbus Communication Module User Guide (SKS4-Modbus Guide-220509)
  version: V2.03, 2022-05-09
  url: http://neptronic.com/Humidifiers/PDF/SKS4/20230525/SKS4-Modbus%20Guide-220509%20(V2.03).pdf
  sha256: af04fa31d377b405c6e01c300e500be36e148cb1fbc88e364bd6e46e8cf3e70d
  archive_url: https://web.archive.org/web/20230929073010/http://neptronic.com/Humidifiers/PDF/SKS4/20230525/SKS4-Modbus%20Guide-220509%20(V2.03).pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N2

encoding:
  byte_order: big
  word_order: big

points:
  # Device (0–8)
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 0, type: u16, bits: [0, 7], writable: true, poll: slow, note: 1–247.}
  - {key: x.product_type, label: Product type, table: holding, address: 0, type: u16, bits: [8, 15], poll: slow, note: Value for the SKS4 not given.}
  - {key: x.baud_rate, label: Device baud rate, table: holding, address: 1, type: u16, scale: 100, writable: true, poll: slow, note: 0 = automatic baud rate detection.}
  - {key: x.comport_config, label: Modbus slave communication port configuration, table: holding, address: 2, type: u16, enum: comport_config, writable: true, poll: slow}
  - {key: x.product_name, label: Product name, table: holding, address: 3, type: str, length: 4, poll: slow, verified: false, note: '8 ASCII characters, writable. The table puts characters 0–1 in register 6 and 6–7 in register 3; read here in register order as in other Neptronic devices, not verified.'}
  - {key: firmware, label: Product actual firmware version, table: holding, address: 7, type: u16, scale: 0.01, poll: slow}
  - {key: x.eeprom_version, label: Product actual EEPROM version, table: holding, address: 8, type: u16, scale: 0.01, poll: slow}

  # Inputs (2010)
  - {key: x.supply_voltage, label: Main power supply, table: holding, address: 2010, type: u16, unit: V, scale: 0.1, poll: slow}

  # Measurements (6001–6052)
  - {key: x.control_input, label: Control input, table: holding, address: 6001, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh, label: Room RH, table: holding, address: 6005, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.supply_rh, label: Supply high limit RH, table: holding, address: 6009, type: u16, unit: '%', scale: 0.01, optional: true, note: Listed as protocol address 6008 next to holding register 406010; 6009 taken (6008 is room RH bias).}
  - {key: x.water_temperature, label: Water temperature, table: holding, address: 6015, type: u16, unit: °C, scale: 0.01, verified: false, note: °C or °F by the Modbus server units (register 15000); metric (°C) is the default and assumed.}
  - {key: x.cabinet_temperature, label: Cabinet temperature, table: holding, address: 6019, type: s16, unit: °C, scale: 0.01, verified: false, note: 'Typed unsigned in the document, but its range starts at −20 °C; read as signed. °C assumed.'}
  - {key: x.board_temperature, label: Board temperature, table: holding, address: 6020, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 15000).}
  - {key: x.power_output_feedback, label: Power output feedback, table: holding, address: 6024, type: u16, unit: '%', scale: 0.01}
  - {key: x.steam_valve_control, label: Steam valve control, table: holding, address: 6025, type: u16, unit: '%', scale: 0.01}
  - {key: x.water_level, label: Water level, table: holding, address: 6026, type: u16, unit: '%', scale: 0.1, note: 0–120 %.}
  - {key: x.room_rh_network, label: Room RH network reading, table: holding, address: 6031, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh_setpoint, label: Room RH setpoint, table: holding, address: 6032, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh_unoccupied_setpoint, label: Room RH unoccupied setpoint, table: holding, address: 6033, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.room_rh_vacant_setpoint, label: Room RH vacant setpoint, table: holding, address: 6034, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.room_demand, label: Room demand, table: holding, address: 6038, type: u16, unit: '%', scale: 0.01}
  - {key: x.supply_high_limit_network, label: Supply high limit network reading, table: holding, address: 6039, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.supply_high_limit_setpoint, label: Supply high limit setpoint, table: holding, address: 6040, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.supply_high_limit_demand, label: Supply high limit demand, table: holding, address: 6044, type: u16, unit: '%', scale: 0.01}
  - {key: x.network_demand, label: Humidity control network demand, table: holding, address: 6045, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.network_high_limit, label: Humidity control network high limit, table: holding, address: 6046, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.humidity_demand, label: Humidity demand, table: holding, address: 6047, type: u16, unit: '%', scale: 0.01}
  - {key: x.power_output, label: System power output, table: holding, address: 6048, type: u16, unit: '%', scale: 0.01}
  - {key: x.steam_capacity, label: System steam capacity, table: holding, address: 6049, type: u16, unit: kg/h, scale: 0.1, poll: slow, verified: false, note: kg/h or lb/h by register 15000; kg/h assumed.}
  - {key: x.boiler_demand, label: Boiler demand, table: holding, address: 6050, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.boiler_capacity, label: Boiler capacity, table: holding, address: 6051, type: u16, unit: kg/h, scale: 0.1, poll: slow, verified: false, note: kg/h or lb/h by register 15000; kg/h assumed.}
  - {key: x.boiler_power_output, label: Boiler power output, table: holding, address: 6052, type: u16, unit: '%', scale: 0.01}

  # Counters (6053–6068)
  - {key: x.run_time, label: Boiler run time, table: holding, address: 6053, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: 'Registers (0)–(3); (0) read as the low word of a 32-bit value (the range fits 32 bits); not stated, assumed.'}
  - {key: x.on_time, label: Boiler on time, table: holding, address: 6057, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}
  - {key: x.service_run_time, label: Boiler service run time, table: holding, address: 6061, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}
  - {key: x.service_on_time, label: Boiler service on time, table: holding, address: 6065, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As boiler run time.}

  # Settings and readings (6069–6084)
  - {key: x.min_steam_output, label: Boiler minimum steam output, table: holding, address: 6069, type: u16, unit: '%', writable: true, min: 1, max: 25, poll: slow}
  - {key: x.max_steam_output, label: Boiler max steam output, table: holding, address: 6072, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, verified: false, note: Scale 1 per the table; its example says 30 % = 300.}
  - {key: x.hrl_temperature, label: HRL temperature, table: holding, address: 6075, type: s16, unit: °C, scale: 0.01, optional: true, verified: false, note: Temperature at the HRL room sensor. °C assumed (see register 15000).}
  - {key: x.hrl_humidity, label: HRL humidity, table: holding, address: 6076, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.service_interval, label: Boiler service interval, table: holding, address: 6078, type: u16, unit: h, writable: true, min: 1000, max: 3000, poll: slow}
  - {key: x.steam_valve_feedback, label: Steam valve feedback, table: holding, address: 6081, type: u16, unit: '%', scale: 0.01}
  - {key: x.network_timeout, label: Network timeout, table: holding, address: 6084, type: u16, unit: s, writable: true, min: 1, max: 900, poll: slow}

  # Inputs (10000–10009)
  - {key: x.air_flow, label: Air flow, table: holding, address: 10000, type: u16, enum: closed_open}
  - {key: x.supply_high_limit, label: Supply high limit, table: holding, address: 10001, type: u16, enum: closed_open}
  - {key: x.interlock, label: Interlock, table: holding, address: 10002, type: u16, enum: closed_open}
  - {key: x.binary_external_demand, label: Binary external demand, table: holding, address: 10003, type: u16, enum: binary_demand}
  - {key: x.water_leak, label: Water leak detection, table: holding, address: 10004, type: u16, enum: ok_leak}
  - {key: x.thermal_cutout, label: Thermal cutout, table: holding, address: 10005, type: u16, enum: closed_open}
  - {key: x.contactors_fuse, label: Contactors PCB fuse, table: holding, address: 10008, type: u16, enum: fuse}
  - {key: x.control_fuse, label: Control PCB fuse, table: holding, address: 10009, type: u16, enum: fuse}

  # Outputs (11000–11008)
  - {key: x.alarm_relay, label: Alarm warning relay, table: holding, address: 11000, type: u16, enum: off_on}
  - {key: x.service_relay, label: Service warning relay, table: holding, address: 11001, type: u16, enum: off_on}
  - {key: x.water_level_valve, label: Water level valve, table: holding, address: 11002, type: u16, enum: off_on}
  - {key: x.drain_pump, label: Drain pump, table: holding, address: 11005, type: u16, enum: off_on}
  - {key: x.drain_valve, label: Drain valve, table: holding, address: 11006, type: u16, enum: off_on}

  # States (12000–12015)
  - {key: x.water_level_low, label: Water level low, table: holding, address: 12000, type: u16, enum: inactive_active}
  - {key: x.water_level_high, label: Water level high, table: holding, address: 12001, type: u16, enum: inactive_active}
  - {key: x.foam_sensor, label: Foam sensor, table: holding, address: 12002, type: u16, enum: foam_sensor}
  - {key: x.service_due, label: Boiler service due, table: holding, address: 12004, type: u16, enum: off_on}
  - {key: x.foam, label: Foam, table: holding, address: 12005, type: u16, enum: ok_detected}
  - {key: x.network_control_state, label: Network control state, table: holding, address: 12008, type: u16, enum: normal_fault, writable: true}
  - {key: x.manual_calibration, label: Manual water calibration state, table: holding, address: 12014, type: u16, enum: ok_required}
  - {key: x.antifreeze_warning, label: AntiFreeze warning, table: holding, address: 12015, type: u16, enum: antifreeze}

  # System (15000–15025)
  - {key: x.server_units, label: Modbus server units, table: holding, address: 15000, type: u16, enum: units, writable: true, poll: slow}
  - {key: x.control_profile, label: Control profile, table: holding, address: 15004, type: u16, enum: control_profile, writable: true, poll: slow}
  - {key: x.occupancy, label: Occupancy state, table: holding, address: 15006, type: u16, enum: occupancy}
  - {key: x.cutout_state, label: Humidity control cutout state, table: holding, address: 15013, type: u16, enum: cutout_state}
  - {key: x.request, label: Boiler request, table: holding, address: 15014, type: u16, enum: request, writable: true, poll: slow}
  - {key: state, label: Boiler state, table: holding, address: 15015, type: u16, enum: boiler_state}
  - {key: x.boiler_alarm, label: Boiler alarm, table: holding, address: 15017, type: u16, enum: boiler_alarm}
  - {key: x.system_power, label: System power state, table: holding, address: 15021, type: u16, enum: off_on, writable: true}
  - {key: x.probe_warning, label: Water level probe warning, table: holding, address: 15023, type: u16, enum: ok_replace}
  - {key: x.probe_failure, label: Water level probe failure, table: holding, address: 15024, type: u16, enum: probe_failure}
  - {key: x.probe_alarm, label: Water level probe alarm, table: holding, address: 15025, type: u16, enum: probe_alarm}

enums:
  comport_config: {'0': 'No parity, 2 stop bits', '1': 'Even parity, 1 stop bit', '2': 'Odd parity, 1 stop bit'}
  off_on: {'0': 'Off', '1': 'On'}
  closed_open: {'0': Closed, '1': Open}
  inactive_active: {'0': Inactive, '1': Active}
  binary_demand: {'0': 0 %, '1': 100 %}
  ok_leak: {'0': OK, '1': Leak}
  fuse: {'0': Normal, '1': Open fuse}
  ok_required: {'0': OK, '1': Required}
  foam_sensor: {'0': No foam, '1': Foam}
  ok_detected: {'0': OK, '1': Detected}
  normal_fault: {'0': Normal, '1': Fault}
  antifreeze: {'0': Inactive, '1': Drain}
  ok_replace: {'0': OK, '1': Replace}
  units: {'0': Metric, '1': Imperial}
  control_profile: {'0': External analog, '1': External network, '2': Internal analog, '3': Internal network, '4': HRL, '5': Custom}
  occupancy: {'0': Occupied, '1': Unoccupied, '2': Vacant, '3': 'Off'}
  cutout_state: {'0': 'Off', '1': Normal, '2': Low limit, '3': High limit, '4': No air flow, '5': Interlock}
  request: {'0': None, '1': Reset alarms, '2': Drain, '3': Reset counters, '4': Filling, '5': Water calibration}
  boiler_state: {'0': 'Off', '1': Idle, '2': Line rinse, '3': Tank rinse, '4': Filling, '5': Draining, '6': Heating, '7': Boiling, '8': Alarm}
  boiler_alarm: {'0': Normal, '1': Failed pump, '2': Fill timeout, '3': Blocked piping, '4': Heat timeout, '5': Overheat, '6': Water leak, '7': Service, '9': Tank blocked, '10': Refill delay}
  probe_failure: {'0': None, '1': Capacitive, '2': Resistive, '3': Both}
  probe_alarm: {'0': OK, '1': Defect, '2': No calibration}

problems:
  - {when: {key: x.boiler_alarm, in: [1, 2, 3, 4, 5, 6, 9, 10]}, kind: fault, text: 'Boiler alarm: {text}'}
  - {when: {key: x.boiler_alarm, equals: 7}, kind: warning, text: Service required}
  - {when: {key: x.water_leak, equals: 1}, kind: fault, text: Water leak detected}
  - {when: {key: x.thermal_cutout, equals: 1}, kind: fault, text: Thermal cutout open}
  - {when: {key: x.contactors_fuse, equals: 1}, kind: fault, text: Contactors PCB fuse open}
  - {when: {key: x.control_fuse, equals: 1}, kind: fault, text: Control PCB fuse open}
  - {when: {key: x.probe_failure, not: 0}, kind: fault, text: 'Water level probe failure: {text}'}
  - {when: {key: x.probe_alarm, not: 0}, kind: fault, text: 'Water level probe alarm: {text}'}
  - {when: {key: x.foam, equals: 1}, kind: warning, text: Foam detected}
  - {when: {key: x.probe_warning, equals: 1}, kind: warning, text: Replace water level probe}
  - {when: {key: x.manual_calibration, equals: 1}, kind: warning, text: Manual water calibration required}
  - {when: {key: x.antifreeze_warning, equals: 1}, kind: warning, text: Antifreeze drain}
  - {when: {key: x.service_due, equals: 1}, kind: warning, text: Boiler service due}
  - {when: {key: x.network_control_state, equals: 1}, kind: warning, text: Network control fault}

notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxxx holding register number (400001 = 0); the
  protocol address is used. Where the two disagree (6008/406010, 6035/406037) the holding register number minus 400001 is
  taken.'
- Holding registers only (functions 03, 06, 16).
- RS485 Modbus RTU, unit id 1–246 (the register description says 1–247) set on the device menu or in register 0. Default unit
  id not stated; 1 assumed.
- 'Serial: automatic baud rate detection by default (9600–57600; register 1 default 19200); default framing no parity, 2 stop
  bits.'
- Ethernet interface and Modbus TCP keep-alive registers exist, but the document describes RTU only; Modbus TCP is not listed
  here.
- 'Units: temperatures in °C or °F and capacities in kg/h or lb/h by the Modbus server units register (15000); metric is the
  default and assumed.'
- Humidity values are % RH.
- Long counters take four registers each ((0)–(3)); read as a 32-bit value from (0) and (1), (0) the low word (not stated;
  assumed).
- The state registers (10000–15025) hold one value each (0/1 or an enum), not bit strings.
- The document marks room RH min/max/bias (6006–6008) read-only but the corresponding supply high limit values writable.
- 'Left out: raw input and output signal voltages (2000–2011, 4000–4001), min/max/bias calibration values, PID tuning, water
  probe frequencies (6027–6030), drain, rinse and idle settings, signal type and source selections, notification enables,
  LEDs, buzzer and extra drain pumps.'
