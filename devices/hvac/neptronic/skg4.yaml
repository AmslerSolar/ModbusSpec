notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxxx holding register number (400001 = 0); the
  protocol address is used.'
- Holding registers only (functions 03, 06, 16).
- RS485 Modbus RTU, unit id 1–246 (the register description says 1–247) set on the device menu or in register 0. Default unit
  id not stated; 1 assumed.
- 'Serial: automatic baud rate detection by default (9600–57600; register 1 default 19200); default framing no parity, 2 stop
  bits.'
- Ethernet interface and Modbus TCP keep-alive registers exist, but the document describes RTU only; Modbus TCP is not listed
  here.
- Up to four burner modules; registers for modules a unit doesn't have are listed in the document like the others (whether
  they answer is not stated).
- 'Units: temperatures in °C or °F and capacity in kg/h or lb/h by the Modbus server units register (15000); metric is the
  default and assumed.'
- Humidity values are % RH.
- Long counters take four registers each ((0)–(3)); read as a 32-bit value from (0) and (1), (0) the low word (not stated;
  assumed).
- The state registers (10000–15047) hold one value each (0/1 or an enum), not bit strings. Register 12020 (boiler line rinse)
  sits inside the module 2 block; the module 2 ignition control and alarm LED follow at 12021–12022.
- 'Left out: raw signal voltages (2000–2003, 4000), min/max/bias calibration values, PID tuning, water probe frequencies,
  fan and drain settings, rinse and idle settings, signal type and source selections, probe auto calibration, notification
  enables, per-module valves, pumps, level switches and LEDs, buzzer and the update status.'
