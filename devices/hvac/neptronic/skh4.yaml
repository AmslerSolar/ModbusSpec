  - {key: x.modbus_address, label: Modbus address, table: holding, address: 0, type: u16, bits: [0, 7], writable: true, min: 1, max: 247, poll: slow}
  - {key: x.product_type, label: Product type, table: holding, address: 0, type: u16, bits: [8, 15], poll: slow, note: Value for the SKH4 not given.}
  - {key: x.baud_rate, label: Device baud rate, table: holding, address: 1, type: u16, scale: 100, writable: true, poll: slow, note: 0 = automatic baud rate detection.}
  - {key: x.comport_config, label: Modbus slave communication port configuration, table: holding, address: 2, type: u16, enum: comport_config, writable: true, poll: slow}
  - {key: x.product_name, label: Product name, table: holding, address: 3, type: str, length: 4, poll: slow, verified: false, note: '8 ASCII characters, writable. The table puts characters 0–1 in register 6 and 6–7 in register 3; read here in register order as in other Neptronic devices, not verified.'}
  - {key: firmware, label: Product actual firmware version, table: holding, address: 7, type: u16, scale: 0.01, poll: slow}
  - {key: x.eeprom_version, label: Product actual EEPROM version, table: holding, address: 8, type: u16, scale: 0.01, poll: slow}

  # Inputs (2006)
  - {key: x.supply_voltage, label: Main power supply, table: holding, address: 2006, type: u16, unit: V, scale: 0.1, poll: slow}

  # Measurements and settings (6000–6087)
  - {key: x.demand, label: Demand, table: holding, address: 6000, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.power_output, label: Power output, table: holding, address: 6001, type: u16, unit: '%', scale: 0.01}
  - {key: x.control_input, label: Control input, table: holding, address: 6002, type: u16, unit: '%', scale: 0.01, writable: true, min: 0, max: 100}
  - {key: x.room_rh, label: Room RH, table: holding, address: 6006, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.supply_rh, label: Supply high limit RH, table: holding, address: 6010, type: u16, unit: '%', scale: 0.01, optional: true}
  - {key: x.run_time, label: Run time, table: holding, address: 6014, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: Registers (0) and (1); (0) read as the low word (not stated; assumed).}
  - {key: x.on_time, label: On time, table: holding, address: 6016, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: 'Registers (0)–(3); read as a 32-bit value from (0) and (1), (0) the low word (not stated; assumed).'}
  - {key: x.service_on_time, label: Service on time, table: holding, address: 6020, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: As on time.}
  - {key: x.water_temperature, label: Water temperature, table: holding, address: 6024, type: u16, unit: °C, scale: 0.1, verified: false, note: °C or °F by the Modbus server units (register 15001); metric (°C) is the default and assumed.}
  - {key: x.pressure, label: Pressure, table: holding, address: 6025, type: u16, unit: psi, verified: false, note: 'Pump pressure. Unit as the document gives it; may follow register 15001, not verified.'}
