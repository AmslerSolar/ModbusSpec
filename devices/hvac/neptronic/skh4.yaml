enums:
  comport_config: {'0': 'No parity, 2 stop bits', '1': 'Even parity, 1 stop bit', '2': 'Odd parity, 1 stop bit'}
  off_on: {'0': 'Off', '1': 'On'}
  no_yes: {'0': 'No', '1': 'Yes'}
  closed_open: {'0': Closed, '1': Open}
  binary_demand: {'0': 0 %, '1': 100 %}
  ok_leak: {'0': OK, '1': Leak}
  ok_fault: {'0': OK, '1': Fault}
  low_ok: {'0': Low, '1': OK}
  fuse: {'0': Normal, '1': Open fuse}
  ok_timeout: {'0': OK, '1': Timeout}
  ok_fail: {'0': OK, '1': Fail}
  normal_fault: {'0': Normal, '1': Fault}
  units: {'0': Metric, '1': Imperial}
  request: {'0': None, '1': Reset alarms, '2': Drain, '3': Reset service counter}
  control_profile: {'0': External analog, '1': External network, '2': Internal humidity analog, '3': Internal humidity network, '4': Internal cooling analog, '5': Internal cooling network, '6': HRL humidity, '7': HRL cooling}
  occupancy: {'0': Occupied, '1': Unoccupied, '2': Vacant, '3': 'Off'}
  cutout_state: {'0': 'Off', '1': Normal, '2': Low limit, '3': High limit, '4': No air flow, '5': Interlock}
  state: {'0': 'Off', '1': Idle, '2': Spraying, '3': Draining, '4': Alarm}
  system_alarm: {'0': Normal, '1': Water high temperature, '2': Water low temperature, '3': Outlet high pressure, '4': Outlet low pressure, '5': Inlet low pressure, '6': Water leak, '7': Service, '8': Configuration}

