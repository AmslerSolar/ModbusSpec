  - {key: x.stage3_run_time, label: Stage 3 run time, table: holding, address: 6155, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: (0) read as the low word (not stated; assumed).}
  - {key: x.stage4_run_time, label: Stage 4 run time, table: holding, address: 6157, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: (0) read as the low word (not stated; assumed).}
  - {key: x.stage5_run_time, label: Stage 5 run time, table: holding, address: 6159, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: (0) read as the low word (not stated; assumed).}
  - {key: x.stage6_run_time, label: Stage 6 run time, table: holding, address: 6161, type: u32, word_order: little, unit: h, scale: 0.01, poll: slow, verified: false, note: (0) read as the low word (not stated; assumed).}
