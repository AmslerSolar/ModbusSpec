  - {key: x.room_temperature, label: Room temperature, table: holding, address: 6053, type: s16, unit: °C, scale: 0.01, optional: true, verified: false, note: °C assumed (see register 15001).}
  - {key: x.room_temperature_network, label: Room temperature network reading, table: holding, address: 6057, type: s16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C assumed (see register 15001).}
