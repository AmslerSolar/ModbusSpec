  - {when: {key: x.zone_d_timeout, equals: 1}, kind: warning, text: Zone D communication timeout}
  - {when: {key: x.zone_e_timeout, equals: 1}, kind: warning, text: Zone E communication timeout}
  - {when: {key: x.zone_f_timeout, equals: 1}, kind: warning, text: Zone F communication timeout}

notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxxx holding register number (400001 = 0); the
  protocol address is used. One typo there (6071 listed as 40672) is ignored.'
- Holding registers only (functions 03, 06, 16).
- RS485 Modbus RTU, unit id 1–246 (the register description says 1–247) set on the device menu or in register 0. Default unit
  id not stated; 1 assumed.
- 'Serial: automatic baud rate detection by default (9600–57600; register 1 default 19200); default framing no parity, 2 stop
  bits.'
- Ethernet interface and Modbus TCP keep-alive registers exist, but the document describes RTU only; Modbus TCP is not listed
  here.
- 'Units: temperatures in °C or °F and capacity in kg/h or lb/h by the Modbus server units register (15001); metric is the
  default and assumed. Pressure is given in psi.'
- Humidity values are % RH. Scales differ between registers (× 100 for readings, × 10 for most setpoints) as the document
  gives them.
- Some single values are listed as two registers, (0) and (1) (e.g. setpoint 6058, network timeout 6087); only (0) is read.
  Counters with (0)–(1) or (0)–(3) are read as a 32-bit value from (0) and (1), (0) the low word (not stated; assumed).
- Up to six spray stages assigned to zones A–F (zone controllers on their own addresses).
- The state registers (10000–15056) hold one value each (0/1 or an enum), not bit strings.
- 'Kind: a high-pressure water atomizer for humidification or evaporative cooling, listed as `hvac`.'
- 'Left out: raw signal voltages (2000–2010, 4000–4001), min/max/bias calibration values, PID tuning, temperature high limit
  settings, per-zone demand/temperature/humidity inputs (6095–6114), stage capacities, drain volumes and times, idle and on
  times, max on and pause times, drain cycle counts, zone MAC addresses and delays, the twelve valve outputs, diagnostic settings,
  signal type, source and stage assignment registers, notification enables, LEDs, buzzer and the update status.'
