modbusspec: 0
id: neptronic-skh4
manufacturer: Neptronic
name: SKH4 high-pressure atomizer (humidifier / evaporative cooler)
kind: hvac

sources:
- title: SKH4 High-Pressure Atomizer, Modbus Communication Module User Guide (SKH4-Modbus Guide-240126)
  version: V.1.00, 2024-01-26
  url: http://neptronic.com/Humidifiers/pdf/2024/SKH4-Modbus%20Guide-240126%20(V.1.00).pdf
  sha256: adfbd7216fa5564ddfce4b611735e41feb534b6c236706bbd22f0895a33f8212
  archive_url: https://web.archive.org/web/20251013022704/https://www.neptronic.com/humidifiers/pdf/2024/SKH4-Modbus%20Guide-240126%20(V.1.00).pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N2

encoding:
  byte_order: big
  word_order: big

points:
