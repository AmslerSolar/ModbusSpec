# Written from the Mitsubishi Electric Procon MelcoBEMS MINI (A1M+ / A1M R5) Modbus Register Tables (1.0.2).

modbusspec: 0
id: mitsubishi-melcobems-ata
manufacturer: Mitsubishi Electric
name: Procon MelcoBEMS MINI (A1M+ / A1M R5) interface, air-to-air units
kind: hvac

sources:
- title: Procon MelcoBEMS MINI (A1M+) / MelcoBEMS MINI (A1M R5) Modbus Register Tables (A1M+ firmware 4.1.2, A1M R5 firmware
    3.1.05)
  version: 1.0.2 (13/05/26)
  url: https://www.nukumi.cz/data/files/67/procon-a1m-modbus-bacnet-adapter-1790325742.pdf?v=31f986df
  sha256: 312bb6ff9e0bb082fd3a3c3eaf7fccbaede4a4bcce034ff1662ff2be8bea59ca

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  # Holding registers (function 03, write 06 / 16)
  - {key: x.drive_mode, label: Drive Mode, table: holding, address: 0, type: u16, enum: drive_mode, writable: true, note: The i-see modes (9 … 11) can only be read.}
  - {key: x.temperature_setpoint, label: Temperature Setpoint, table: holding, address: 1, type: u16, unit: °C, scale: 0.1, writable: true}
  - {key: x.fan_speed, label: Fan Speed, table: holding, address: 2, type: u16, enum: fan_speed, writable: true}
  - {key: x.air_direction, label: Air Direction, table: holding, address: 3, type: u16, enum: air_direction, writable: true}
  - {key: x.modbus_slave_id, label: Modbus Slave ID, table: holding, address: 4, type: u16, writable: true, min: 1, max: 247, poll: slow, note: BACnet station id 1 … 127 in BACnet mode.}
  - {key: x.baud_rate, label: Modbus RS-485 Baud Rate, table: holding, address: 5, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: RS-485 Parity Type, table: holding, address: 6, type: u16, enum: parity, writable: true, poll: slow}
  - {key: x.drive_on_off, label: Drive On/Off, table: holding, address: 7, type: u16, enum: off_on, writable: true, note: Also coil 0.}
  - {key: x.room_temperature, label: Room Temperature, table: holding, address: 8, type: u16, unit: °C, scale: 0.1, note: Read only; also input register 0.}
  - {key: x.fault_code_hex, label: Fault Code (hex), table: holding, address: 9, type: u16, poll: slow, note: '0x8000 = no error, 0x6999 = no communication with the indoor unit. Read only; also input register 1.'}
  - {key: firmware, label: MelcoBEMS MINI (A1M) Firmware Version, table: holding, address: 10, type: u16, poll: slow, note: Read only; coding not stated.}
  - {key: x.comms_counter, label: Modbus Comms Counter, table: holding, address: 11, type: u16, note: +1 per valid Modbus command; wraps after 65535.}
  - {key: error_code, label: Fault Code (decimal), table: holding, address: 12, type: u16, enum: fault_code, note: 8000 = no error. Read only; also input register 8.}
  - {key: x.system_type, label: System Type Detected, table: holding, address: 13, type: u16, enum: system_type, poll: slow, note: Read only; also input register 9.}
  - {key: x.deadband_enabled, label: Deadband Enabled State, table: holding, address: 14, type: u16, enum: deadband, poll: slow, note: Read only (DIP switch 8).}
  - {key: x.bms_room_temperature, label: BMS Room Temperature (signed), table: holding, address: 15, type: s16, unit: °C, scale: 0.1, writable: true, min: -10, max: 50, note: Register 16 holds the same without sign (0 … 50 °C).}
  - {key: x.bms_virtual_setpoint, label: BMS Virtual Setpoint, table: holding, address: 17, type: u16, unit: °C, scale: 0.1, writable: true, min: 10, max: 40}
  - {key: x.deadband_heating_setpoint, label: Deadband Heating Setpoint, table: holding, address: 18, type: u16, unit: °C, writable: true, poll: slow, note: Whole degrees; default 19 °C; at least 2 °C below the cooling setpoint.}
  - {key: x.deadband_cooling_setpoint, label: Deadband Cooling Setpoint, table: holding, address: 19, type: u16, unit: °C, writable: true, poll: slow, note: Whole degrees; default 23 °C; at least 2 °C above the heating setpoint.}
  - {key: x.external_temperature_feedback, label: External Temperature feedback function ON/OFF, table: holding, address: 430, type: u16, enum: off_on, writable: true, poll: slow, note: Default 0 (disabled).}
  - {key: x.external_temperature_value, label: External Temperature feedback Value, table: holding, address: 431, type: u16, unit: °C, scale: 0.1, writable: true, note: Sent on to the unit when written.}
  - {key: x.external_temperature_polling, label: External Temperature Polling Feature, table: holding, address: 432, type: u16, enum: off_on, writable: true, poll: slow, note: 'Default 1: the external value is sent to the unit every 10 s.'}

enums:
  off_on: {'0': 'Off', '1': 'On'}
  drive_mode: {'1': Heating, '2': Humidity reduction, '3': Cooling, '7': Ventilation (clean air), '8': Auto, '9': i-see heating, '10': i-see humidity reduction, '11': i-see cooling}
  fan_speed: {'0': Auto, '2': Quiet, '3': Weak, '5': Strong, '6': Very strong}
  air_direction: {'0': Auto, '1': Position 1, '2': Position 2, '3': Position 3, '4': Position 4, '5': Position 5, '7': Swing}
  baud_rate: {'0': '9600', '1': '1200', '2': '2400', '3': '4800', '4': '9600', '5': '14400', '6': '19200', '7': '28800', '8': '38400', '9': '56000', '10': '57600', '11': '115200'}
  parity: {'0': None, '1': Even, '2': Odd}
  fault_code: {'8000': No error, '6999': No communication with the indoor unit}
  system_type: {'0': Air-to-air unit, '1': Air-to-water system, '2': Lossnay, '255': Not detected yet}
  deadband: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: error_code, equals: 6999}, kind: fault, text: No communication between the interface and the indoor unit}
  - {when: {key: error_code, not_in: [8000, 6999]}, kind: fault, text: 'Indoor unit fault code {value}'}

notes:
- The MelcoBEMS MINI is an RS-485 Modbus RTU (or BACnet MS/TP) interface plugged into a Mitsubishi Electric indoor unit; one
  register map per connected system type (air-to-air here; Lossnay and air-to-water in their own files).
- Addresses are the 0-based addresses the document lists; its Modicon references (00001, 30001, 40001) are these + 1.
- 'Every input register and coil is mirrored in a holding register, so only holding registers are listed here. Input registers:
  0 room temperature, 1 fault code (hex), 3 firmware, 5 comms counter, 8 fault code (decimal), 9 system type, 10 deadband
  state. Coil 0: drive on/off.'
- Serial settings and unit id are set in registers 4 … 6 (no stop bit setting); the document doesn't give the factory values.
  9600 baud, no parity and unit 1 are assumed (value 0 of the baud register also means 9600).
- The document gives no registers that single the interface out (no serial number or fixed identifier); `identify` is left
  out. The system type (holding 13) tells the three register maps apart.
- 'Left out: the BACnet settings (272 … 277).'
