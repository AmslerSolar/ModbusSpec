notes:
- 'Modbus RTU on the board''s RS485 port, 9600 baud, 8 data bits, no parity, 1 stop bit (CFF via KNX: 1200 baud). The slave
  address is set with DIP switches, 1…60; unit 1 here is only a default. Port 502 only applies behind a gateway.'
- Only holding registers (functions 03, 06, 16). Several registers may be written in one request only if all of them are writable.
- Addresses are the document's hexadecimal addresses, used unchanged (its examples send them as they are).
- The controller model in 0x1000 tells the board apart; the document lists it as hexadecimal (e.g. 5000 = 0x5000). Most boards
  share one layout; CVP shifts its commands and counters, CFF shifts the whole state, alarm and parameter area. Points name
  their models where they differ.
- Firmware release in 0x1001 is the major release in the high byte and the minor release in the low byte (0x0106 = 1.06).
- Probe use depends on the board and its DIP switches (e.g. T1 air, T2 water, T3 optional); the document only names them T1…T3,
  so they stay device-specific.
- The relay states, digital inputs, DIP switch read-backs, the many tuning parameters (change-over, hysteresis, ECM voltages,
  lock bits), the version-dependent additional functions (IAQ, ambient probe via Modbus, T-MB / IR presence, clock, flaps)
  and the bit commands at 0x1100…0x1107 are left out.
- The CVP example in the document calls 0x5003 a CVP; the table gives 0x5004 / 0x5005 for CVP (0x5003 is FanCoil ECM). The
  QCV example shows 0x5000 in the reply but calls it 0x5006. The tables are followed.
- The document gives no signs for the set-points beyond sig16 and no 'not available' value.
- 'Identification: one of the model matches must hold.'
