modbusspec: 0
id: haier-ycj-a002
manufacturer: Haier
name: YCJ-A002
kind: hvac

sources:
- id: modbus-devices
  title: Modbus_Devices (Home Assistant integration)
  url: https://github.com/dk-1983/Modbus_Devices
  license: MIT
  commit: 88460d5b9db9b7cb3abb0032de81a562522ec8b7
  path: README.md

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1

defaults:
  verified: false
  sources:
  - modbus-devices

points:
  - {key: x.power, label: Power, table: coil, address: 0, type: bool, writable: true}
  - {key: x.target_temperature, label: Target temperature, table: holding, address: 0, type: u16, unit: °C, writable: true, note: 16–30 °C}
  - {key: x.hvac_mode, label: HVAC mode, table: holding, address: 1, type: u16, enum: mode, writable: true}
  - {key: x.fan_mode, label: Fan mode, table: holding, address: 2, type: u16, enum: fan, writable: true}
  - {key: x.controller_lock_state, label: Controller lock state, table: holding, address: 3, type: u16}
  - {key: x.room_temperature, label: Room temperature, table: input, address: 0, type: u16, unit: °C}
  - {key: x.fault_code, label: Fault code, table: input, address: 1, type: u16}
  - {key: x.compatibility_unit_number, label: Compatibility unit number, table: input, address: 2, type: u16}

enums:
  mode: {'1': cool, '2': heat, '3': dry, '4': fan_only, '5': auto}
  fan: {'1': low, '2': medium, '3': high, '4': auto}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
