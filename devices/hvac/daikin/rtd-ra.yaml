modbusspec: 0
id: daikin-rtd-ra
manufacturer: Daikin
name: RTD-RA
kind: hvac

sources:
- id: modbus-devices
  title: Modbus_Devices (Home Assistant integration)
  url: https://github.com/dk-1983/Modbus_Devices
  license: MIT
  commit: 88460d5b9db9b7cb3abb0032de81a562522ec8b7
  path: README.md

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600

defaults:
  verified: false
  sources:
  - modbus-devices

points:
  - {key: x.target_temperature, label: Target temperature, table: holding, address: 1, type: u16, unit: °C, writable: true}
  - {key: x.fan_mode, label: Fan mode, table: holding, address: 2, type: u16, enum: fan, writable: true}
  - {key: x.hvac_mode, label: HVAC mode, table: holding, address: 3, type: u16, enum: mode, writable: true}
  - {key: x.louvre_stop_swing, label: Louvre stop/swing, table: holding, address: 4, type: u16, enum: swing, writable: true}
  - {key: x.power, label: Power, table: holding, address: 5, type: u16, writable: true}
  - {key: x.fault_active, label: Fault active, table: input, address: 121, type: u16}
  - {key: x.fault_code, label: Fault code, table: input, address: 122, type: u16, note: 'Two ASCII characters, high byte first; 255 = no fault, 0 = waiting.'}
  - {key: x.return_air_temperature, label: Return-air temperature, table: input, address: 123, type: s16, unit: °C, scale: 0.01}
  - {key: x.thermostat_state, label: Thermostat state, table: input, address: 130, type: u16}
  - {key: x.coil_inlet_temperature, label: Coil-inlet temperature, table: input, address: 131, type: s16, unit: °C, scale: 0.01}

enums:
  fan: {'0': auto, '1': speed_1, '2': speed_2, '3': speed_3, '4': speed_4, '5': speed_5}
  mode: {'0': auto, '1': heat, '2': fan_only, '3': cool, '4': dry}
  swing: {'0': 'off', '1': 'on'}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
