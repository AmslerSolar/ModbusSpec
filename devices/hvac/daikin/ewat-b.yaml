# Written from the Daikin EWAT-B BAS Integration Guide Modbus D-EIGOC00203-22 03 English (D-EIGOC00203-22_03EN, unit
# software NASH 2.14.A, 12/07/2024).

modbusspec: 0
id: daikin-ewat-b
manufacturer: Daikin
name: EWAT-B air-cooled chiller (Microtech controller)
kind: hvac

sources:
- title: EWAT-B BAS Integration Guide - Modbus protocol (D-EIGOC00203-22_03EN_EWAT-B)
  version: 03 (software NASH 2.14.A, 12/07/2024)
  url: https://www.daikin.ba/content/dam/document-library/installation-manuals/as/air-cooled-chiller/ewat-b-ss/EWAT-B_BAS%20Integration%20Guide%20Modbus_D-EIGOC00203-22_03_English.pdf
  sha256: 317cb878840960efb573c717fdb88e5e31a0a1ffc90091c100734faa1ee919ef

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N2

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # unit model: air cooled
  - table: holding
    address: 317
    type: u16
    equals: 3
  # number of circuits
  - table: holding
    address: 1855
    type: u16
    in:
    - 1
    - 2
  # unit status
  - table: holding
    address: 15
    type: u16
    range:
    - 0
    - 4

defaults:
  verified: false

points:
  # Unit state and commands
  - {key: x.control_source, label: Unit - Control Source, table: holding, address: 1, type: u16, enum: control_source}
  - {key: x.enabled_state, label: Unit - Enabled State, table: holding, address: 2, type: u16, enum: disabled_enabled}
  - {key: x.run_allowed, label: Unit - Run Allowed, table: holding, address: 3, type: u16, enum: run_allowed}
  - {key: x.capacity_limited, label: Unit - Capacity Limited, table: holding, address: 4, type: u16, enum: capacity_limited}
  - {key: x.generic_alarm, label: Unit - Generic Alarm, table: holding, address: 5, type: u16, enum: no_alarm}
  - {key: x.evaporator_flow, label: Evaporator - Water Flow State, table: holding, address: 6, type: u16, enum: water_flow}
  - {key: x.operating_state, label: Unit - Operating State, table: holding, address: 8, type: u16, enum: thermo}
  - {key: x.enable_setpoint, label: Unit - Enable Setpoint, table: holding, address: 9, type: u16, enum: disable_enable, poll: slow, writable: true}
  - {key: x.alarm_reset, label: Unit - Alarm Reset Setpoint, table: holding, address: 10, type: u16, enum: alarm_reset, poll: slow, writable: true, note: Write 1 to clear the alarms.}
  - {key: x.active_mode, label: Unit - Active Operation Mode, table: holding, address: 11, type: u16, enum: active_mode}
  - {key: x.active_setpoint, label: Unit - Active Temperature Setpoint, table: holding, address: 12, type: s16, unit: °C, scale: 0.1}
  - {key: x.capacity, label: Unit - Actual Capacity, table: holding, address: 13, type: u16, unit: '%', scale: 0.1}
  - {key: x.capacity_limit, label: Unit - Active Capacity Limit, table: holding, address: 14, type: u16, unit: '%', scale: 0.1}
  - {key: state, label: Unit - Status, table: holding, address: 15, type: u16, enum: unit_status}
  # Water and air temperatures, electrical values
  - {key: x.evaporator_entering_temperature, label: Evaporator Entering Water Temperature, table: holding, address: 16, type: s16, unit: °C, scale: 0.1}
  - {key: x.evaporator_leaving_temperature, label: Evaporator Leaving Water Temperature, table: holding, address: 17, type: s16, unit: °C, scale: 0.1}
  - {key: x.heat_recovery_enable, label: Heat Recovery - Enable Setpoint, table: holding, address: 18, type: u16, enum: disable_enable, poll: slow, writable: true}
  - {key: x.heat_recovery_entering_temperature, label: Heat Recovery - Entering Water Temperature, table: holding, address: 22, type: s16, unit: °C, scale: 0.1}
  - {key: x.heat_recovery_leaving_temperature, label: Heat Recovery - Leaving Water Temperature, table: holding, address: 23, type: s16, unit: °C, scale: 0.1}
  - {key: x.outside_temperature, label: Outside Air Temperature, table: holding, address: 24, type: s16, unit: °C, scale: 0.1}
  - {key: x.current, label: Unit - Average Current, table: holding, address: 25, type: u16, unit: A}
  - {key: x.voltage, label: Unit - Average Voltage, table: holding, address: 26, type: u16, unit: V, scale: 0.1}
  - {key: consumer_power, label: Unit - Active Power, table: holding, address: 27, type: u16, unit: W, scale: 100, positive: consumption, note: 0.1 kW per step.}
  # Active alarms: index = general cause, code = index × 256 + the reporting device (see the enums)
  - {key: x.warning_index, label: Unit Alarm - Warning Index, table: holding, address: 28, type: u16, enum: warning_index, note: 0 = no warning (assumed; not stated).}
  - {key: x.problem_index, label: Unit Alarm - Problem Index, table: holding, address: 29, type: u16, enum: problem_index}
  - {key: x.fault_index, label: Unit Alarm - Fault Index, table: holding, address: 30, type: u16, enum: fault_index}
  - {key: x.warning_code, label: Unit Alarm - Warning Code, table: holding, address: 31, type: u16, note: 'The high byte is the warning index; the low byte tells the unit, circuit or compressor (e.g. C1.Comp1).'}
  - {key: x.problem_code, label: Unit Alarm - Problem Code, table: holding, address: 32, type: u16}
  - {key: error_code, label: Unit Alarm - Fault Code, table: holding, address: 33, type: u16, note: High byte = fault index (register 30).}
  # Setpoints
  - {key: x.mode_setpoint, label: Unit - Operation Mode Setpoint, table: holding, address: 34, type: u16, enum: mode_setpoint, poll: slow, writable: true}
  - {key: x.cool_setpoint, label: Unit - Cool Temperature Setpoint, table: holding, address: 35, type: s16, unit: °C, scale: 0.1, poll: slow, writable: true}
  - {key: x.ice_setpoint, label: Unit - Ice Temperature Setpoint, table: holding, address: 36, type: s16, unit: °C, scale: 0.1, poll: slow, writable: true}
  - {key: x.heat_setpoint, label: Unit - Heat Temperature Setpoint, table: holding, address: 37, type: s16, unit: °C, scale: 0.1, poll: slow, writable: true}
  - {key: x.capacity_limit_setpoint, label: Unit - Capacity Limit Setpoint, table: holding, address: 38, type: u16, unit: '%', scale: 0.1, poll: slow, writable: true}
  # Refrigerant circuits
  - {key: x.circuit1_condenser_pressure, label: Circuit 1 - Condenser Refrigerant Pressure, table: holding, address: 39, type: s16, unit: kPa, scale: 0.1}
  - {key: x.circuit1_condenser_saturated_temperature, label: Circuit 1 - Condenser Saturated Temperature, table: holding, address: 40, type: s16, unit: °C, scale: 0.1}
  - {key: x.circuit1_evaporator_pressure, label: Circuit 1 - Evaporator Refrigerant Pressure, table: holding, address: 41, type: s16, unit: kPa, scale: 0.1}
  - {key: x.circuit1_evaporator_saturated_temperature, label: Circuit 1 - Evaporator Saturated Temperature, table: holding, address: 42, type: s16, unit: °C, scale: 0.1}
  - {key: x.circuit2_condenser_pressure, label: Circuit 2 - Condenser Refrigerant Pressure, table: holding, address: 43, type: s16, unit: kPa, scale: 0.1}
  - {key: x.circuit2_condenser_saturated_temperature, label: Circuit 2 - Condenser Saturated Temperature, table: holding, address: 44, type: s16, unit: °C, scale: 0.1}
  - {key: x.circuit2_evaporator_pressure, label: Circuit 2 - Evaporator Refrigerant Pressure, table: holding, address: 45, type: s16, unit: kPa, scale: 0.1}
  - {key: x.circuit2_evaporator_saturated_temperature, label: Circuit 2 - Evaporator Saturated Temperature, table: holding, address: 46, type: s16, unit: °C, scale: 0.1}
  - {key: x.circuit1_shutdown_alarm, label: Circuit 1 - Shutdown Alarm, table: holding, address: 51, type: u16, enum: shutdown_alarm}
  - {key: x.circuit2_shutdown_alarm, label: Circuit 2 - Shutdown Alarm, table: holding, address: 52, type: u16, enum: shutdown_alarm}
  - {key: x.unit_shutdown_alarm, label: Unit - Shutdown Alarm, table: holding, address: 54, type: u16, enum: shutdown_alarm}
  - {key: x.heat_recovery_setpoint, label: Heat Recovery - Temperature Setpoint, table: holding, address: 59, type: s16, unit: °C, scale: 0.1, poll: slow, writable: true}
  - {key: x.heat_recovery_state, label: Heat Recovery - Operating State, table: holding, address: 60, type: u16, enum: heat_recovery_state}
  # Compressors
  - {key: x.c1_comp1_suction_temperature, label: Circ 1 Compressor 1 - Suction Temperature, table: holding, address: 65, type: s16, unit: °C, scale: 0.1}
  - {key: x.c1_comp1_discharge_temperature, label: Circ 1 Compressor 1 - Discharge Temperature, table: holding, address: 68, type: s16, unit: °C, scale: 0.1}
  - {key: x.c1_comp1_capacity, label: Circ 1 Compressor 1 - Actual Capacity, table: holding, address: 1840, type: u16, unit: '%', scale: 0.1}
  - {key: x.c1_comp1_state, label: Circ 1 Compressor 1 - Operating State, table: holding, address: 1852, type: u16, enum: off_on}
  - {key: x.c1_comp1_off_auto, label: Circ 1 Compressor 1 - OffAuto Setpoint, table: holding, address: 1841, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c1_comp1_starts, label: Circ 1 Compressor 1 - Number of Starts, table: holding, address: 73, type: u16, poll: slow, note: Marked writable (W) in the document.}
  - {key: x.c1_comp1_hours, label: Circ 1 Compressor 1 - Number of Running Hours, table: holding, address: 74, type: u32, unit: h, poll: slow, note: Two registers; the word order is not stated (assumed most significant word first).}
  - {key: x.c1_comp2_state, label: Circ 1 Compressor 2 - Operating State, table: holding, address: 1838, type: u16, enum: off_on}
  - {key: x.c1_comp2_off_auto, label: Circ 1 Compressor 2 - OffAuto Setpoint, table: holding, address: 1827, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c1_comp2_starts, label: Circ 1 Compressor 2 - Number of Starts, table: holding, address: 86, type: u16, poll: slow}
  - {key: x.c1_comp2_hours, label: Circ 1 Compressor 2 - Number of Running Hours, table: holding, address: 87, type: u32, unit: h, poll: slow}
  - {key: x.c1_comp3_state, label: Circ 1 Compressor 3 - Operating State, table: holding, address: 1825, type: u16, enum: off_on}
  - {key: x.c1_comp3_off_auto, label: Circ 1 Compressor 3 - OffAuto Setpoint, table: holding, address: 1814, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c1_comp3_starts, label: Circ 1 Compressor 3 - Number of Starts, table: holding, address: 99, type: u16, poll: slow}
  - {key: x.c1_comp3_hours, label: Circ 1 Compressor 3 - Number of Running Hours, table: holding, address: 100, type: u32, unit: h, poll: slow, note: The document gives 100-102; two registers (100-101) as in the other compressors and the EWYT-B guide.}
  - {key: x.c2_comp1_suction_temperature, label: Circ 2 Compressor 1 - Suction Temperature, table: holding, address: 104, type: s16, unit: °C, scale: 0.1}
  - {key: x.c2_comp1_discharge_temperature, label: Circ 2 Compressor 1 - Discharge Temperature, table: holding, address: 107, type: s16, unit: °C, scale: 0.1}
  - {key: x.c2_comp1_capacity, label: Circ 2 Compressor 1 - Actual Capacity, table: holding, address: 1800, type: u16, unit: '%', scale: 0.1}
  - {key: x.c2_comp1_state, label: Circ 2 Compressor 1 - Operating State, table: holding, address: 1812, type: u16, enum: off_on}
  - {key: x.c2_comp1_off_auto, label: Circ 2 Compressor 1 - OffAuto Setpoint, table: holding, address: 1801, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c2_comp1_starts, label: Circ 2 Compressor 1 - Number of Starts, table: holding, address: 112, type: u16, poll: slow}
  - {key: x.c2_comp1_hours, label: Circ 2 Compressor 1 - Number of Running Hours, table: holding, address: 113, type: u32, unit: h, poll: slow}
  - {key: x.c2_comp2_state, label: Circ 2 Compressor 2 - Operating State, table: holding, address: 1799, type: u16, enum: off_on}
  - {key: x.c2_comp2_off_auto, label: Circ 2 Compressor 2 - OffAuto Setpoint, table: holding, address: 1788, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c2_comp2_starts, label: Circ 2 Compressor 2 - Number of Starts, table: holding, address: 125, type: u16, poll: slow}
  - {key: x.c2_comp2_hours, label: Circ 2 Compressor 2 - Number of Running Hours, table: holding, address: 126, type: u32, unit: h, poll: slow}
  - {key: x.c2_comp3_state, label: Circ 2 Compressor 3 - Operating State, table: holding, address: 1786, type: u16, enum: off_on}
  - {key: x.c2_comp3_off_auto, label: Circ 2 Compressor 3 - OffAuto Setpoint, table: holding, address: 1775, type: u16, enum: off_auto, poll: slow, writable: true}
  - {key: x.c2_comp3_starts, label: Circ 2 Compressor 3 - Number of Starts, table: holding, address: 138, type: u16, poll: slow}
  - {key: x.c2_comp3_hours, label: Circ 2 Compressor 3 - Number of Running Hours, table: holding, address: 139, type: u32, unit: h, poll: slow}
  # Free cooling
  - {key: x.freecooling_enable, label: Freecooling - Enable Setpoint, table: holding, address: 250, type: u16, enum: disable_enable, poll: slow, writable: true}
  - {key: x.freecooling_status, label: Freecooling - Status, table: holding, address: 251, type: u16, enum: freecooling_status}
  - {key: x.freecooling_enabled, label: Freecooling - Enabled State, table: holding, address: 252, type: u16, enum: disabled_enabled}
  - {key: x.freecooling_circuit1_mode, label: Freecooling - Circuit 1 Mode, table: holding, address: 253, type: u16, enum: freecooling_mode}
  - {key: x.freecooling_circuit2_mode, label: Freecooling - Circuit 2 Mode, table: holding, address: 254, type: u16, enum: freecooling_mode}
  # Pumps, unit information
  - {key: x.evaporator_pump_speed, label: Evaporator Pump - Speed, table: holding, address: 296, type: u16, unit: '%'}
  - {key: x.evaporator_pump1_hours, label: Evaporator Pump 1 - Number of Running Hours, table: holding, address: 303, type: u32, unit: h, poll: slow}
  - {key: x.evaporator_pump1_state, label: Evaporator Pump 1 - Operating State, table: holding, address: 305, type: u16, enum: stop_run}
  - {key: x.evaporator_pump2_hours, label: Evaporator Pump 2 - Number of Running Hours, table: holding, address: 306, type: u32, unit: h, poll: slow}
  - {key: x.evaporator_pump2_state, label: Evaporator Pump 2 - Operating State, table: holding, address: 308, type: u16, enum: stop_run}
  - {key: x.evaporator_pump1_fault, label: Evaporator Pump 1 - Fault, table: holding, address: 430, type: u16, enum: no_alarm}
  - {key: x.evaporator_pump2_fault, label: Evaporator Pump 2 - Fault, table: holding, address: 431, type: u16, enum: no_alarm}
  - {key: x.measurement_units, label: Unit - Measurement unit setpoint, table: holding, address: 316, type: u16, enum: measurement_units, poll: slow, writable: true, note: The units in this file are the metric ones.}
  - {key: x.unit_model, label: Unit - Model, table: holding, address: 317, type: u16, enum: unit_model, poll: slow}
  - {key: x.panel_temperature, label: Unit - Electrical Panel Temperature, table: holding, address: 850, type: s16, unit: °C, scale: 0.1}
  - {key: x.circuits, label: Unit - Number of Circuits, table: holding, address: 1855, type: u16, poll: slow}
  - {key: x.compressors, label: Unit - Number of Compressors, table: holding, address: 1856, type: u16, poll: slow, note: Compressors per circuit (1-3).}
  - {key: x.tons, label: Unit - Number of Tons, table: holding, address: 1857, type: u16, poll: slow}
  # Superheat, energy, variable flow
  - {key: x.circuit2_superheat_setpoint, label: Circuit 2 - Evaporator Superheat Active Setpoint, table: holding, address: 1896, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit1_superheat_setpoint, label: Circuit 1 - Evaporator Superheat Active Setpoint, table: holding, address: 1897, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit2_superheat, label: Circuit 2 - Evaporator Superheat Temperature, table: holding, address: 1898, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit1_superheat, label: Circuit 1 - Evaporator Superheat Temperature, table: holding, address: 1899, type: s16, unit: K, scale: 0.1}
  - {key: consumer_energy, label: Unit - Active Energy, table: holding, address: 1900, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Two registers; word order not stated (assumed most significant word first).}
  - {key: power_factor, label: Unit - Power Factor, table: holding, address: 1902, type: s16, scale: 0.01}
  - {key: x.plant_differential_pressure, label: Variable Flow - Plant Differential Pressure, table: holding, address: 1905, type: s16, unit: kPa, scale: 0.1, writable: true, note: Marked W in the document (a value the BAS may supply).}
  - {key: x.bypass_valve, label: Variable Flow - Water Bypass Valve State, table: holding, address: 1906, type: u16, enum: valve}
  - {key: x.plant_differential_pressure_setpoint, label: Variable Flow - Plant Differential Pressure setpoint, table: holding, address: 1909, type: u16, unit: kPa, scale: 0.1, poll: slow, writable: true}
  - {key: x.plant_delta_temperature, label: Variable Flow - Plant Delta Temperature, table: holding, address: 1911, type: s16, unit: K, scale: 0.1}
  - {key: x.plant_delta_temperature_setpoint, label: Variable Flow - Plant Delta Temperature Setpoint, table: holding, address: 1913, type: s16, unit: K, scale: 0.1, poll: slow, writable: true}
  - {key: x.evaporator_fixed_speed_setpoint, label: Variable Flow - Evaporator Fixed Speed Setpoint, table: holding, address: 1915, type: s16, unit: '%', poll: slow, writable: true}
  # Expansion valves and fans
  - {key: x.circuit2_expansion_valve, label: Circuit 2 - Expansion Valve Position, table: holding, address: 1966, type: u16, unit: '%'}
  - {key: x.circuit2_fan_speed, label: Circuit 2 - Fan Speed, table: holding, address: 1970, type: u16, unit: '%'}
  - {key: x.circuit2_condenser_approach, label: Circuit 2 - Condenser Approach Temperature, table: holding, address: 1971, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit2_evaporator_approach, label: Circuit 2 - Evaporator Approach Temperature, table: holding, address: 1972, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit2_fan_staging, label: Circuit 2 - Fan Staging, table: holding, address: 1981, type: u16}
  - {key: x.circuit1_expansion_valve, label: Circuit 1 - Expansion Valve Position, table: holding, address: 1982, type: u16, unit: '%'}
  - {key: x.circuit1_fan_speed, label: Circuit 1 - Fan Speed, table: holding, address: 1986, type: u16, unit: '%'}
  - {key: x.circuit1_condenser_approach, label: Circuit 1 - Condenser Approach Temperature, table: holding, address: 1987, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit1_evaporator_approach, label: Circuit 1 - Evaporator Approach Temperature, table: holding, address: 1988, type: s16, unit: K, scale: 0.1}
  - {key: x.circuit1_fan_staging, label: Circuit 1 - Fan Staging, table: holding, address: 1997, type: u16}

enums:
  control_source: {'0': Network, '1': Local}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  disable_enable: {'0': Disable, '1': Enable}
  run_allowed: {'0': 'Off', '1': Allowed}
  capacity_limited: {'0': Not limited, '1': Limited}
  no_alarm: {'0': No alarm, '1': Alarm}
  water_flow: {'0': No flow, '1': Flow}
  thermo: {'0': Thermo off, '1': Thermo on}
  alarm_reset: {'0': None, '1': Clear}
  active_mode: {'0': Ice, '1': Cool, '2': Heat, '3': Pursuit}
  unit_status: {'0': 'Off', '1': Start, '2': Run, '3': Pre-shutdown, '4': Service}
  mode_setpoint: {'0': None, '1': Ice, '2': Cool, '3': Heat, '4': Pursuit}
  shutdown_alarm: {'1': No alarm, '2': Alarm}
  heat_recovery_state: {'0': 'Off', '1': Recirculation, '2': Regulation}
  off_on: {'0': 'Off', '1': 'On'}
  off_auto: {'0': 'Off', '1': Auto}
  stop_run: {'0': Stop, '1': Run}
  measurement_units: {'0': English, '1': Metric}
  unit_model: {'1': Centrifugal, '2': Water cooled, '3': Air cooled, '4': Heat pump, '5': Reserved, '6': Reserved, '7': Reserved, '8': Reserved, '9': Other}
  valve: {'0': Closed, '1': Opened}
  freecooling_status: {'1': 'Off', '2': Start, '3': Mixed, '4': Free cooling, '5': Mechanical}
  freecooling_mode: {'1': Mechanical, '2': Switching, '3': Switching, '4': Free cooling, '5': FC pumpdown, '6': FC off}
