notes:
- Addresses are the numbers of the document's integration list, taken as 0-based protocol addresses of holding registers.
  The document names neither the function code nor whether the numbering starts at 0 or 1; if the values look shifted by one
  register, the list is 1-based. All points are unverified for this reason.
- 'RS485 (Modbus RTU) through the POL902 module (defaults: address 1, 19200 baud, no parity, 2 stop bits) or the built-in
  Modbus option of Microtech 4 controllers (19200 baud, no parity, 1 stop bit, address set by the user).'
- 'Alarms come as an index (the cause) and a code (cause and the unit, circuit or compressor that reports it) for each of
  three levels: warning, problem (the unit keeps running with limits) and fault (the unit, a circuit or a compressor stops).
  An index stands for a compressor or a circuit alarm alike where the document has both; the enums give both texts.'
- 'Left out: the single alarm and warning registers (366 to 852, 0 = no alarm, 1 = alarm), which the alarm index and code
  registers cover.'
- The EWYT-B heat pump has the same list without free cooling but with defrost, collective housing and performance registers
  (file daikin-ewyt-b).
