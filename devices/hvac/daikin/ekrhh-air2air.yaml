modbusspec: 0
id: daikin-ekrhh-air2air
manufacturer: Daikin
name: Air-to-air heat pumps (Home Hub EKRHH)
kind: hvac

sources:
- id: daikin-ha-ekrhh-modbus
  title: daikin-ha-ekrhh-modbus (Home Assistant integration)
  url: https://github.com/gerione/daikin-ha-ekrhh-modbus
  license: MIT
  commit: 0583d6b5fab3111aee32dc28e223c9dd43ce405d
  path: custom_components/daikin_ha_ekrhh_modbus/const.py
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/daikin-homehub-air2air.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/daikin/daikin_homehub_air2air/consumer.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - tls
  ports:
    tls: 802

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - daikin-ha-ekrhh-modbus
  - evcc
  - openwb

points:
  - {key: x.smart_grid, label: Smart grid, table: holding, address: 1000, type: s16, enum: smart_grid_holding_1001, writable: true}
  - {key: x.power_limit_for_demand_control, label: Power limit for Demand Control, table: holding, address: 1001, type: s16, unit: W, scale: 10, writable: true}

enums:
  smart_grid_holding_1001: {'0': Free, '1': Forced off, '2': Recommended on, '3': Forced on}

notes:
- Air-to-air heat pumps behind the Daikin Home Hub (EKRHH, use case 4). daikin-ha-ekrhh-modbus reads only these two holding
  registers.
- 'evcc template `daikin-altherma` (single device) lists: Daikin HomeHub air2air (SG Ready).'
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
