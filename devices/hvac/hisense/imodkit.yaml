notes:
- Indoor unit n (0, 1, …) uses holding registers 40000 + n × 91 … 40090 + n × 91; the points listed are those of unit 0. Gateway
  register 4997 gives the number of indoor units.
- Outdoor module m of refrigerant system s starts at 5000 + s × 490 + m × 98 (s 0–5, m 0–4); the points listed are those of
  system 0, module 0. Registers 1000–1005 say which modules exist.
- 'The project reads with function 03 and writes with function 16 only, also for single registers: the gateway manual doesn''t
  list function 06.'
- Some gateway firmware versions report 0 for the outdoor operating values (from the run status on) even while the compressor
  runs; model name, capacity and id are always filled in.
- To switch a unit on, the project writes run/stop, mode, fan, swing and set temperature (5 registers) in one request.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
