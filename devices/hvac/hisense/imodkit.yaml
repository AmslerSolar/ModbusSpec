modbusspec: 0
id: hisense-imodkit
manufacturer: Hisense
name: VRF air conditioning via i-Modkit HCPC-H2M1C gateway
kind: hvac

sources:
- id: hisense-vrf
  title: hisense_vrf (Home Assistant integration)
  url: https://github.com/buchuman/hisense_vrf
  license: MIT
  commit: 41d7b32c4466aeee1061bec972c9d493ba4e8628
  path: pyacmodbus-stub/pyacmodbus/__init__.py, custom_components/hisense_vrf/sensor.py, custom_components/hisense_vrf/exp_descriptors.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - hisense-vrf

