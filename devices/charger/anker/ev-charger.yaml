modbusspec: 0
id: anker-ev-charger
manufacturer: Anker SOLIX
name: V1 Smart EV Charger
kind: charger

sources:
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.ankersolix/src/main/java/org/openhab/binding/modbus/ankersolix/internal/AnkerSolixWallboxHandler.java

connection:
  default_port: 502
  default_unit: 1

identify:
  serial:
    table: input
    address: 20011
    type: str
    length: 12
  any:
  - table: input
    address: 20011
    type: str
    length: 12
    contains:
    - A519
  - table: input
    address: 20001
    type: str
    length: 10
    contains:
    - EV Charger

defaults:
  verified: false
  sources:
  - openhab

points:
  - {key: x.charging_command, label: Charging Command, table: holding, address: 21000, type: u16, enum: charging_command, writable: true}
  - {key: x.maximum_current_setting, label: Maximum Current Setting, table: holding, address: 21001, type: u16, unit: A, scale: 0.1, writable: true, note: Write range 0…32 A.}
  - {key: x.boost_mode_command, label: Boost Mode, table: holding, address: 21002, type: u16, enum: off_on, writable: true}
  - {key: x.set_timeout, label: Set Timeout, table: holding, address: 21003, type: u16, unit: s, writable: true, note: At least 6 s.}
  - {key: x.set_number_of_charging_phases, label: Set Number of Charging Phases, table: holding, address: 21005, type: u16, enum: phase_setting, writable: true}
  - {key: x.product_number, label: Product number, table: input, address: 20000, type: u16}
  - {key: x.model, label: Model, table: input, address: 20001, type: str, length: 10}
  - {key: serial, label: Serial number, table: input, address: 20011, type: str, length: 12}
  - {key: firmware, label: Software version, table: input, address: 20023, type: str, length: 6}
  - {key: x.hardware, label: Hardware version, table: input, address: 20029, type: str, length: 6}
  - {key: x.rated_power, label: Rated Power (Pn), table: input, address: 20035, type: s32, unit: W}
  - {key: x.minimum_output_current, label: Minimum Output Current, table: input, address: 20037, type: s32, unit: A}
  - {key: x.maximum_output_current, label: Maximum Output Current, table: input, address: 20039, type: s32, unit: A}
  - {key: x.alarm_information_1, label: Alarm Information 1, table: input, address: 20041, type: u16}
  - {key: x.alarm_information_2, label: Alarm Information 2, table: input, address: 20042, type: u16}
  - {key: x.alarm_information_3, label: Alarm Information 3, table: input, address: 20043, type: u16}
  - {key: x.alarm_information_4, label: Alarm Information 4, table: input, address: 20044, type: u16}
  - {key: x.alarm_information_5, label: Alarm Information 5, table: input, address: 20045, type: u16}
  - {key: x.alarm_information_6, label: Alarm Information 6, table: input, address: 20046, type: u16}
  - {key: x.alarm_information_7, label: Alarm Information 7, table: input, address: 20047, type: u16}
  - {key: x.alarm_information_8, label: Alarm Information 8, table: input, address: 20048, type: u16}
  - {key: x.alarm_information_9, label: Alarm Information 9, table: input, address: 20049, type: u16}
  - {key: x.alarm_information_10, label: Alarm Information 10, table: input, address: 20050, type: u16}
  - {key: x.alarm_information_11, label: Alarm Information 11, table: input, address: 20051, type: u16}
  - {key: x.alarm_information_12, label: Alarm Information 12, table: input, address: 20052, type: u16}
  - {key: l1_voltage, label: L1-N Voltage, table: input, address: 20053, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: L2-N Voltage, table: input, address: 20054, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: L3-N Voltage, table: input, address: 20055, type: u16, unit: V, scale: 0.1}
  - {key: x.l1_l2_voltage, label: L1-L2 Voltage, table: input, address: 20056, type: u16, unit: V, scale: 0.1}
  - {key: x.l2_l3_voltage, label: L2-L3 Voltage, table: input, address: 20057, type: u16, unit: V, scale: 0.1}
  - {key: x.l3_l1_voltage, label: L3-L1 Voltage, table: input, address: 20058, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: L1 Current, table: input, address: 20059, type: u16, unit: A, scale: 0.01}
  - {key: l2_current, label: L2 Current, table: input, address: 20060, type: u16, unit: A, scale: 0.01}
  - {key: l3_current, label: L3 Current, table: input, address: 20061, type: u16, unit: A, scale: 0.01}
  - {key: x.l1_active_power, label: L1 Active Power, table: input, address: 20062, type: u32, unit: W}
  - {key: x.l2_active_power, label: L2 Active Power, table: input, address: 20064, type: u32, unit: W}
  - {key: x.l3_active_power, label: L3 Active Power, table: input, address: 20066, type: u32, unit: W}
  - {key: consumer_power, label: Total Charging Active Power, table: input, address: 20068, type: u32, unit: W, positive: consumption}
  - {key: x.l1_reactive_power, label: L1 Reactive Power, table: input, address: 20070, type: u32, unit: var}
  - {key: x.l2_reactive_power, label: L2 Reactive Power, table: input, address: 20072, type: u32, unit: var}
  - {key: x.l3_reactive_power, label: L3 Reactive Power, table: input, address: 20074, type: u32, unit: var}
  - {key: x.l1_apparent_power, label: L1 Apparent Power, table: input, address: 20076, type: u32, unit: VA}
  - {key: x.l2_apparent_power, label: L2 Apparent Power, table: input, address: 20078, type: u32, unit: VA}
  - {key: x.l3_apparent_power, label: L3 Apparent Power, table: input, address: 20080, type: u32, unit: VA}
  - {key: x.current_charging_session_duration, label: Current Charging Session Duration, table: input, address: 20082, type: u32, unit: s}
  - {key: x.current_charging_capacity, label: Current Charging Capacity, table: input, address: 20084, type: u32, unit: kWh, scale: 0.001}
  - {key: x.pwm_enabled_status, label: PWM Enabled Status, table: input, address: 20086, type: u16, enum: enabled}
  - {key: x.single_three_phase_operating_mode, label: Single / Three-Phase Operating Mode, table: input, address: 20087, type: u16, enum: phase_mode}
  - {key: x.charging_mode, label: Charging Mode, table: input, address: 20088, type: u16, enum: charging_mode}
  - {key: x.load_balancing_enabled_status, label: Load Balancing Enabled Status, table: input, address: 20089, type: u16, enum: enabled}
  - {key: x.solar_power_balancing_enabled_status, label: Solar Power Balancing Enabled Status, table: input, address: 20090, type: u16, enum: enabled}
  - {key: x.cp_acquisition_voltage, label: CP Acquisition Voltage, table: input, address: 20091, type: u16}
  - {key: x.cp_signal_status, label: CP Signal Status, table: input, address: 20092, type: u16, enum: cp_signal}
  - {key: x.relay_1_temperature, label: Relay 1 Temperature, table: input, address: 20093, type: s16, unit: °C}
  - {key: x.relay_2_temperature, label: Relay 2 Temperature, table: input, address: 20094, type: s16, unit: °C}
  - {key: x.boost_mode, label: Boost Mode, table: input, address: 20095, type: u16, enum: enabled}
  - {key: x.led_light_brightness, label: LED Light Brightness, table: input, address: 20096, type: u16, unit: '%'}
  - {key: state, label: Charging Status, table: input, address: 20097, type: u16, enum: charging_status}
  - {key: x.ocpp_connection_status, label: OCPP Connection Status, table: input, address: 20099, type: u16, enum: ocpp}
  - {key: x.mqtt_connection_status, label: MQTT Connection Status, table: input, address: 20100, type: u16, enum: mqtt}

enums:
  enabled: {'0': Disabled, '1': Enabled}
  phase_mode: {'1': Single phase, '3': Three phase}
  charging_mode: {'0': Solar plus grid, '1': Only solar}
  cp_signal: {'0': A 12v, '3': B1 9v, '4': B2 9v, '5': C1 6v, '6': C2 6v, '7': Error, '8': D1 3v, '9': D2 3v, '10': E 0v, '11': F minus 12v}
  charging_status: {'0': Idle, '1': Preparing, '2': Charging, '3': Charger paused, '4': Vehicle paused, '5': Charging completed, '6': Reserving, '7': Disabled, '8': Error}
  ocpp: {'0': Not connected, '1': Connecting, '2': Connected}
  mqtt: {'0': Not connected, '1': Connected}
  charging_command: {'1': Start charging, '2': Stop charging}
  off_on: {'0': 'Off', '1': 'On'}
  phase_setting: {'0': Default, '1': Fixed single phase, '2': Fixed three phase}

notes:
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- The sources don't state the default unit id; 1 is a guess.
- Identification as openhab recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
