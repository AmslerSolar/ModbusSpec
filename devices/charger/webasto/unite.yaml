modbusspec: 0
id: webasto-unite
manufacturer: Webasto
name: Unite
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evcs.webasto.unite/src/io/openems/edge/evcs/webasto/unite/EvcsWebastoUniteImpl.java

connection:
  default_port: 502
  default_unit: 255

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.failsafe_current, label: Failsafe current, table: holding, address: 2000, type: u16, unit: A, writable: true}
  - {key: x.failsafe_timeout, label: Failsafe timeout, table: holding, address: 2002, type: u16, writable: true}
  - {key: x.charging_current, label: Charging current, table: holding, address: 5004, type: u16, unit: A, writable: true}
  - {key: x.alive_register, label: Alive register, table: holding, address: 6000, type: u16, writable: true}
  - {key: serial, label: Serial number, table: input, address: 100, type: str, length: 25}
  - {key: x.charge_point_id, label: Charge point ID, table: input, address: 130, type: str, length: 50}
  - {key: x.brand, label: Brand, table: input, address: 190, type: str, length: 10}
  - {key: x.model, label: Model, table: input, address: 210, type: str, length: 5}
  - {key: firmware, label: Firmware version, table: input, address: 230, type: str, length: 50}
  - {key: x.date, label: Date, table: input, address: 290, type: u32}
  - {key: x.time, label: Time, table: input, address: 294, type: u32}
  - {key: x.charge_point_power, label: Charge point power, table: input, address: 400, type: u32, unit: W}
  - {key: x.number_of_phases, label: Number of phases, table: input, address: 404, type: u16}
  - {key: x.charge_point_state, label: Charge point state, table: input, address: 1000, type: u16}
  - {key: x.charging_state, label: Charging state, table: input, address: 1001, type: u16}
  - {key: x.equipment_state, label: Equipment state, table: input, address: 1002, type: u16}
  - {key: x.cable_state, label: Cable state, table: input, address: 1004, type: u16}
  - {key: x.evse_fault_code, label: Evse fault code, table: input, address: 1006, type: u32}
  - {key: l1_current, label: Current L1, table: input, address: 1008, type: u16, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: input, address: 1010, type: u16, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: input, address: 1012, type: u16, unit: A, scale: 0.001}
  - {key: l1_voltage, label: Voltage L1, table: input, address: 1014, type: u16, unit: V, scale: 0.001}
  - {key: l2_voltage, label: Voltage L2, table: input, address: 1016, type: u16, unit: V, scale: 0.001}
  - {key: l3_voltage, label: Voltage L3, table: input, address: 1018, type: u16, unit: V, scale: 0.001}
  - {key: consumer_power, label: Active power, table: input, address: 1020, type: u32, unit: W, positive: consumption}
  - {key: l1_power, label: Active power L1, table: input, address: 1024, type: u32, unit: W, positive: consumption}
  - {key: l2_power, label: Active power L2, table: input, address: 1028, type: u32, unit: W, positive: consumption}
  - {key: l3_power, label: Active power L3, table: input, address: 1032, type: u32, unit: W, positive: consumption}
  - {key: x.meter_reading, label: Meter reading, table: input, address: 1036, type: u32}
  - {key: x.session_max_current, label: Session max current, table: input, address: 1100, type: u16, unit: A}
  - {key: x.evse_min_current, label: Evse min current, table: input, address: 1102, type: u16, unit: A}
  - {key: x.evse_max_current, label: Evse max current, table: input, address: 1104, type: u16, unit: A}
  - {key: x.cable_max_current, label: Cable max current, table: input, address: 1106, type: u16, unit: A}
  - {key: session_energy, label: Energy session, table: input, address: 1502, type: u32, unit: kWh, scale: 0.001}
  - {key: x.session_start_time, label: Session start time, table: input, address: 1504, type: u32}
  - {key: x.session_duration, label: Session duration, table: input, address: 1508, type: u32}
  - {key: x.session_end_time, label: Session end time, table: input, address: 1512, type: u32}

notes:
- Per OpenEMS the charger doesn't accept reads that span unused registers, so it reads each value on its own.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
