modbusspec: 0
id: webasto-next
manufacturer: Webasto
name: Next
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evcs.webasto.next/src/io/openems/edge/evcs/webasto/next/EvcsWebastoNextImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.charge_point_state, label: Charge point state, table: holding, address: 1000, type: u16, enum: charge_point_state}
  - {key: x.evse_state, label: Evse state, table: holding, address: 1002, type: u16, enum: evse_state}
  - {key: x.cable_state, label: Cable state, table: holding, address: 1004, type: u16, enum: cable_state}
  - {key: x.evse_error_code, label: Evse error code, table: holding, address: 1006, type: u16, enum: evse_error_code}
  - {key: l1_current, label: Current L1, table: holding, address: 1008, type: u16, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: holding, address: 1010, type: u16, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: holding, address: 1012, type: u16, unit: A, scale: 0.001}
  - {key: consumer_power, label: Active power, table: holding, address: 1020, type: u32, unit: W, positive: consumption}
  - {key: l1_power, label: Active power L1, table: holding, address: 1024, type: u32, unit: W, positive: consumption}
  - {key: l2_power, label: Active power L2, table: holding, address: 1028, type: u32, unit: W, positive: consumption}
  - {key: l3_power, label: Active power L3, table: holding, address: 1032, type: u32, unit: W, positive: consumption}
  - {key: consumer_energy, label: Active production energy, table: holding, address: 1036, type: u32, unit: kWh, scale: 0.001}
  - {key: x.max_hw_current, label: Max HW current, table: holding, address: 1100, type: u16, unit: A}
  - {key: x.min_hw_current, label: Min HW current, table: holding, address: 1102, type: u16, unit: A}
  - {key: x.max_evse_current, label: Max evse current, table: holding, address: 1104, type: u16, unit: A}
  - {key: x.max_cable_current, label: Max cable current, table: holding, address: 1106, type: u16, unit: A}
  - {key: x.max_ev_current, label: Max EV current, table: holding, address: 1108, type: u16, unit: A}
  - {key: x.last_energy_session, label: Last energy session, table: holding, address: 1502, type: u16, unit: kWh, scale: 0.001}
  - {key: x.start_time, label: Start time, table: holding, address: 1504, type: u32}
  - {key: x.charge_session_time, label: Charge session time, table: holding, address: 1508, type: u32, unit: s}
  - {key: x.end_time, label: End time, table: holding, address: 1512, type: u32}
  - {key: x.smart_vehicle_detected, label: Smart vehicle detected, table: holding, address: 1620, type: u16}
  - {key: x.safe_current, label: Safe current, table: holding, address: 2000, type: u16, unit: A}
  - {key: x.com_timeout, label: Com timeout, table: holding, address: 2002, type: u16, unit: s}
  - {key: x.ev_set_charge_power_limit, label: Ev set charge power limit, table: holding, address: 5000, type: u32, unit: W, writable: true}
  - {key: x.charge_current, label: Charge current, table: holding, address: 5004, type: u16, unit: A, writable: true}
  - {key: x.start_cancel_charging_session, label: Start cancel charging session, table: holding, address: 5006, type: u16, enum: start_cancel_charging_session, writable: true}
  - {key: x.life_bit, label: Life bit, table: holding, address: 6000, type: u16, writable: true}

enums:
  charge_point_state: {'0': No vehicle attached, '1': 'Vehicle attached, no permission (preparing)', '3': Charging, '4': Charging paused, '7': Charging error, '8': Charging station reserved}
  evse_state: {'0': Starting, '1': Running, '2': Error}
  cable_state: {'0': No cable attached, '1': 'Cable attached, no car attached', '2': 'Cable attached, car attached', '3': 'Cable attached, car attached and locked'}
  evse_error_code: {'0': No error, '1': 'Error internal board supply voltage, 5V Ref Voltage', '2': Supply voltage error, '3': EV communication error, '4': Over Voltage, '5': Under Voltage, '6': Over current failure, '7': Other error, '8': Ground failure, '9': Error RCD modulel, '10': Error overtemperature, '11': Proximity Pilot Error, '12': Shutter Error, '13': Three phase check error, '14': PWR internal error, '15': negative control pilot out of range, '16': DC residual current}
  start_cancel_charging_session: {'0': No action, '1': Start charging session, '2': 'Cancel charging session '}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
