enums:
  cp_status: {'0': Unknown, '1': Available, '2': Preparing, '3': Charging, '4': SuspendedEVSE, '5': SuspendedEV, '6': Finishing, '7': Reserved, '8': Unavailable, '9': Faulted}
  vehicle_state: {'1': A – Not connected, '2': B – Connected, '3': C – Charging, '4': D – Charging (ventilation), '5': E – Error}
  phase_switch_mode: {'0': 1-Phase Only, '1': 3-Phase Only, '2': Dynamic Phase Switch, '3': Static (Start-Of-Session)}
  dlm_mode: {'0': Disabled, '1': DLM master + slave, '2': DLM master standalone, '3': DLM slave auto discovery, '4': DLM slave fixed IP}
  cp_availability: {'0': Not available, '1': Available}
  plug_lock_status: {'0': Unlocked, '1': Locked}
  hems_config: {'0': Modbus TCP off, '1': Read only, '2': Read and write}

flags:
  error_codes_1: {'0': RCM tripped, '1': Vehicle state E, '2': Mode 3 diode check failed, '3': Type 2 MCB tripped, '4': Schuko MCB tripped, '5': RCD tripped, '6': Contactor welded, '7': Backend disconnected, '8': Plug lock actuator error, '9': Plug lock actuator stuck, '10': Firmware update running, '11': Tilt error, '12': Wrong CP/PR cable, '13': Type 2 overload, '14': No power supply}

notes:
- Modbus protocol version 1.5 (firmware 1.5.x). All AMTRON 4You and 4Business models share one register set; tested by the
  project on a 4Business 730.
- Modbus TCP must be enabled on the wallbox; register 2010 shows the mode (0 off, 1 read only, 2 read and write).
- The wallbox serves one Modbus TCP client at a time.
- Meter registers 200-227 are 32-bit values, high word first.
- The sign of the meter power registers is not stated by the project.
- 'Left out: holding_112_bits (holding 112, u16) from openems overlaps error_codes_4 (holding 111, u32); check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
