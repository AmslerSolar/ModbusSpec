modbusspec: 0
id: mennekes-amtron
manufacturer: Mennekes
name: AMTRON 4You 400/500, 4Business 600/700
kind: charger

sources:
- id: mennekes-amtron-ha
  title: mennekes-amtron-ha (Home Assistant integration)
  url: https://github.com/nobelp/mennekes-amtron-ha
  license: MIT
  commit: 4d5fb864052a942fbdf5e49215e9bf2d9d6806d7
  path: custom_components/mennekes_amtron/const.py, custom_components/mennekes_amtron/coordinator.py, custom_components/mennekes_amtron/sensor.py,
    modbus_wallbox.yaml, templates/wallbox.yaml
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evse.chargepoint.bender/src/io/openems/edge/evse/chargepoint/bender/AbstractEvseChargePointBender.java,
    io.openems.edge.evse.chargepoint.mennekes/src/io/openems/edge/evse/chargepoint/mennekes/common/AbstractMennekes.java

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - mennekes-amtron-ha

