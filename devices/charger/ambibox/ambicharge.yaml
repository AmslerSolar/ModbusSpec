modbusspec: 0
id: ambibox-ambicharge
manufacturer: Ambibox
name: ambiCHARGE Home
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evse.chargepoint.ambibox/src/io/openems/edge/evse/chargepoint/ambibox/EvseChargePointAmbiboxImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.set_target_power, label: Set target power, table: holding, address: 3000, type: s32, unit: W, writable: true, note: OpenEMS negates the raw value. Negative = charging (as the driver states).}
  - {key: x.set_wake_up, label: Set wake up, table: holding, address: 3002, type: u32, writable: true}
  - {key: x.sleep, label: Sleep, table: input, address: 4000, type: s32}
  - {key: x.current, label: Current, table: input, address: 4002, type: f32, unit: A}
  - {key: l1_current, label: Current L1, table: input, address: 4004, type: f32, unit: A}
  - {key: l2_current, label: Current L2, table: input, address: 4006, type: f32, unit: A}
  - {key: l3_current, label: Current L3, table: input, address: 4008, type: f32, unit: A}
  - {key: x.voltage, label: Voltage, table: input, address: 4010, type: f32, unit: V}
  - {key: l1_voltage, label: Voltage L1, table: input, address: 4012, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2, table: input, address: 4014, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3, table: input, address: 4016, type: f32, unit: V}
  - {key: consumer_power, label: Active power, table: input, address: 4018, type: s32, unit: W, positive: consumption}
  - {key: x.power_factor, label: Power factor, table: input, address: 4020, type: f32}
  - {key: frequency, label: Frequency, table: input, address: 4022, type: f32, unit: Hz}
  - {key: x.active_consumption_energy, label: Active consumption energy, table: input, address: 4026, type: f32, unit: kWh, scale: 0.001}
  - {key: consumer_energy, label: Active production energy, table: input, address: 4028, type: f32, unit: kWh, scale: 0.001}
  - {key: x.voltage_dc, label: Voltage DC, table: input, address: 4030, type: f32, unit: V}
  - {key: x.current_dc, label: Current DC, table: input, address: 4032, type: f32, unit: A}
  - {key: x.power_dc, label: Power DC, table: input, address: 4034, type: s32, unit: W}
  - {key: x.number_phases, label: Number phases, table: input, address: 4036, type: u32}
  - {key: x.charger_min_power, label: Charger min power, table: input, address: 4038, type: s32, unit: W}
  - {key: x.charger_max_power, label: Charger max power, table: input, address: 4040, type: s32, unit: W}
  - {key: x.inverter_state, label: Inverter state, table: input, address: 4042, type: u32, enum: inverter_state}
  - {key: x.inverter_error, label: Inverter error, table: input, address: 4044, type: u32}
  - {key: x.inverter_temperature, label: Inverter temperature, table: input, address: 4046, type: f32, unit: °C}
  - {key: x.capacity, label: Capacity, table: input, address: 4048, type: f32, unit: kWh, scale: 0.001}
  - {key: x.min_soc, label: Min SOC, table: input, address: 4050, type: f32, unit: '%'}
  - {key: x.max_soc, label: Max SOC, table: input, address: 4052, type: f32, unit: '%'}
  - {key: x.ev_soc, label: Ev SOC, table: input, address: 4054, type: f32, unit: '%'}
  - {key: x.state_of_health, label: State of health, table: input, address: 4056, type: f32, unit: '%'}
  - {key: x.time_to_full_soc, label: Time to full SOC, table: input, address: 4058, type: u32, unit: s}
  - {key: x.number_cycles, label: Number cycles, table: input, address: 4060, type: u32}
  - {key: x.ev_min_charge_power, label: Ev min charge power, table: input, address: 4062, type: u32, unit: W}
  - {key: x.ev_max_charge_power, label: Ev max charge power, table: input, address: 4064, type: u32, unit: W}
  - {key: x.ev_min_discharge_power, label: Ev min discharge power, table: input, address: 4066, type: u32, unit: W}
  - {key: x.ev_max_discharge_power, label: Ev max discharge power, table: input, address: 4068, type: u32, unit: W}
  - {key: x.battery_state, label: Battery state, table: input, address: 4070, type: u32, enum: battery_state}
  - {key: x.battery_temperature, label: Battery temperature, table: input, address: 4072, type: f32, unit: °C}
  - {key: x.battery_error, label: Battery error, table: input, address: 4074, type: u32}
  - {key: x.control_mode, label: Control mode, table: input, address: 4076, type: u32, enum: control_mode}
  - {key: x.power_dc_battery, label: Power DC battery, table: input, address: 4078, type: s32, unit: W}
  - {key: x.charge_protocol, label: Charge protocol, table: input, address: 4080, type: u32, enum: charge_protocol}
  - {key: x.session_state, label: Session state, table: input, address: 4082, type: u32, enum: evse_state}
  - {key: x.ev_connected, label: Ev connected, table: input, address: 4084, type: u32}
  - {key: x.seconds_to_departure, label: Seconds to departure, table: input, address: 4086, type: u32, unit: s}
  - {key: x.departure_soc, label: Departure SOC, table: input, address: 4088, type: f32, unit: '%'}
  - {key: x.departure_energy, label: Departure energy, table: input, address: 4090, type: u32, unit: kWh, scale: 0.001}
  - {key: x.min_energy_request, label: Min energy request, table: input, address: 4092, type: u32, unit: kWh, scale: 0.001}
  - {key: x.max_energy_request, label: Max energy request, table: input, address: 4094, type: u32, unit: kWh, scale: 0.001}
  - {key: x.ev_charger_error, label: Ev charger error, table: input, address: 4096, type: u32}
  - {key: x.energy_session, label: Energy session, table: input, address: 4098, type: f32, unit: kWh, scale: 0.001}
  - {key: x.energy_export_session, label: Energy export session, table: input, address: 4100, type: f32, unit: kWh, scale: 0.001}
  - {key: x.replug_required, label: Replug required, table: input, address: 4102, type: u32}

enums:
  inverter_state: {'0': Offline, '1': Sleeping, '2': Starting, '3': MPPT, '4': Throttled, '5': Shutting down, '6': Fault, '7': Standby, '8': Started}
  battery_state: {'0': Sleep, '1': Idle, '2': Charge, '3': Discharge}
  control_mode: {'0': Disabled, '1': Controllable, '2': Limitable}
  charge_protocol: {'0': Other, '1': CHAdeMO, '2': DIN 70121, '3': ISO 15118-2, '4': ISO 15118-2 VAS, '5': ISO 15118-20}
  evse_state: {'0': Session setup, '1': Authorization, '2': Charge parameter discovery, '3': Cable check, '4': Pre charge, '5': Charge loop, '6': Post charge, '7': Paused, '8': Stopped, '9': Error}

notes:
- Addresses for connector 1 (input registers from 4000, holding registers from 3000). Connectors 2 to 10 follow in steps of
  200 (input) and 100 (holding).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
