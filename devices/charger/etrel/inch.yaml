  - {key: x.c2_l1_voltage, label: Connector 2 L-N voltage L1, table: input, address: 108, type: f32, unit: V, models: [duo]}
  - {key: x.c2_l2_voltage, label: Connector 2 L-N voltage L2, table: input, address: 110, type: f32, unit: V, models: [duo]}
  - {key: x.c2_l3_voltage, label: Connector 2 L-N voltage L3, table: input, address: 112, type: f32, unit: V, models: [duo]}
  - {key: x.c2_l1_current, label: Connector 2 current L1, table: input, address: 114, type: f32, unit: A, models: [duo]}
  - {key: x.c2_l2_current, label: Connector 2 current L2, table: input, address: 116, type: f32, unit: A, models: [duo]}
  - {key: x.c2_l3_current, label: Connector 2 current L3, table: input, address: 118, type: f32, unit: A, models: [duo]}
  - {key: x.c2_l1_power, label: Connector 2 active power L1, table: input, address: 120, type: f32, unit: W, scale: 1000, models: [duo], note: kW in the register.}
  - {key: x.c2_l2_power, label: Connector 2 active power L2, table: input, address: 122, type: f32, unit: W, scale: 1000, models: [duo], note: kW in the register.}
  - {key: x.c2_l3_power, label: Connector 2 active power L3, table: input, address: 124, type: f32, unit: W, scale: 1000, models: [duo], note: kW in the register.}
  - {key: x.c2_power, label: Connector 2 active power total, table: input, address: 126, type: f32, unit: W, scale: 1000, models: [duo], note: kW in the register.}
