  - {key: x.c2_ev_planned_energy, label: Connector 2 EV planned energy, table: input, address: 146, type: f32, unit: kWh, poll: slow, models: [duo]}
  - {key: x.c2_energy, label: Connector 2 meter value (active energy counter), table: input, address: 148, type: s64, unit: kWh, scale: 1.0e-06, poll: slow, models: [duo], note: mWh in the register.}
  - {key: x.c2_charging_mode, label: Connector 2 selected charging mode, table: input, address: 153, type: s16, enum: charging_mode, poll: slow, models: [duo]}
