  - {key: x.c2_l2_phase, label: Connector 2 L2 connected to phase, table: input, address: 1125, type: s16, enum: phase, poll: slow, models: [duo]}
  - {key: x.c2_l3_phase, label: Connector 2 L3 connected to phase, table: input, address: 1126, type: s16, enum: phase, poll: slow, models: [duo]}
  - {key: x.c2_custom_max_current, label: Connector 2 custom max current, table: input, address: 1128, type: f32, unit: A, poll: slow, models: [duo]}

  # Setpoints (write-only commands, function 16)
  - {key: x.current_setpoint, label: Connector 1 set current setpoint, table: holding, address: 8, type: f32, unit: A, writable: true, write_only: true, poll: slow, note: The list doesn't say it can be read back. Cancel with a write to 10. Not accepted in the first 45 s after start-up; too high a value gives exception 12.}
  - {key: x.power_setpoint, label: Connector 1 set power setpoint, table: holding, address: 11, type: f32, unit: W, scale: 1000, writable: true, write_only: true, poll: slow, note: kW in the register. Cancel with a write to 13.}
  - {key: x.c2_current_setpoint, label: Connector 2 set current setpoint, table: holding, address: 108, type: f32, unit: A, writable: true, write_only: true, poll: slow, models: [duo], note: Cancel with a write to 110.}
  - {key: x.c2_power_setpoint, label: Connector 2 set power setpoint, table: holding, address: 111, type: f32, unit: W, scale: 1000, writable: true, write_only: true, poll: slow, models: [duo], note: kW in the register. Cancel with a write to 113.}

enums:
  connector_status: {'0': Unknown, '1': Available, '2': Preparing (unauthorized / disconnected), '3': 'Preparing, waiting for EV', '4': Charging, '5': Charging paused by EV, '6': Charging paused by EVSE, '7': Finishing, '8': Faulted, '9': Unpausing charging, '10': Unavailable, '11': Reserved}
  vehicle_phases: {'0': Three phases, '1': Single phase (L1), '2': Single phase (L2), '3': Single phase (L3), '4': Unknown, '5': Two phases}
  connector_type: {'1': Type 2 socket, '2': Type 2 cable, '3': Household socket}
  phase: {'1': L1, '2': L2, '3': L3}
  charging_mode: {'1': Fast mode, '2': Smart mode}

problems:
  - {when: {key: state, equals: 8}, kind: fault, text: Charging station faulted (connector 1 status 8)}
  - {when: {key: x.c2_state, equals: 8}, kind: fault, text: Charging station faulted (connector 2 status 8)}

notes:
- Read registers with function 04 (input registers). Addresses in the list are the protocol addresses sent on the bus (0-based,
  used as printed).
- Values are big-endian; the list says nothing about word order, most significant word first is assumed.
- The list doesn't state the unit id or request limits; default_unit 1 is an assumption.
- All registers of V6.0 need firmware 7.1.1 or later.
- 'Commands without a value (the written value is ignored): stop charging 1 / 101, pause charging 2 / 102, cancel current
  setpoint 10 / 110, cancel power setpoint 13 / 113, restart 1004. Set departure time 4 / 104 and set clock 1000 take an Int64
  Unix time.'
- 'Left out: the power-management server on port 503 (Building Load Guard and power-cluster values at 2000–2112 and 3000,
  cluster limits at 2000–2004), because the format has one port per device.'
