  - {key: x.hw_version, label: HW version, table: input, address: 1010, type: str, length: 5, poll: slow}
  - {key: firmware, label: SW version, table: input, address: 1015, type: str, length: 5, poll: slow}
  - {key: x.connectors, label: Number of connectors, table: input, address: 1020, type: s32, poll: slow}
  - {key: x.connector_type, label: Connector 1 connector type, table: input, address: 1022, type: s16, enum: connector_type, poll: slow}
  - {key: x.phases, label: Connector 1 number of phases, table: input, address: 1023, type: s16, poll: slow}
  - {key: x.l1_phase, label: Connector 1 L1 connected to phase, table: input, address: 1024, type: s16, enum: phase, poll: slow}
  - {key: x.l2_phase, label: Connector 1 L2 connected to phase, table: input, address: 1025, type: s16, enum: phase, poll: slow}
  - {key: x.l3_phase, label: Connector 1 L3 connected to phase, table: input, address: 1026, type: s16, enum: phase, poll: slow}
  - {key: x.custom_max_current, label: Connector 1 custom max current, table: input, address: 1028, type: f32, unit: A, poll: slow}
