# From Etrel's register list "INCH and DUO SmartHome Modbus TCP Registers" V6.0 (Etrel Knowledge Centre).

modbusspec: 0
id: etrel-inch
manufacturer: Etrel
name: INCH / INCH Duo wallbox (also sold as sonnenCharger)
kind: charger

sources:
- title: INCH and DUO SmartHome Modbus TCP Registers – master specifications (Excel)
  version: V6.0 (07/2025), attached 2025-08-13
  url: https://etrel.atlassian.net/wiki/download/attachments/3485665834/INCH%20and%20DUO%20SmartHome%20Modbus%20TCPRegisters%20master%20SPECIFICATIONS%20-%20V6.0%20-%20072025_02.xlsx?api=v2
  sha256: 373c8466bda439a6c1e32c252505188041655f48eb7cecd3e2d8f8821931433c
- title: Modbus Communication with INCH products (Etrel Knowledge Centre page)
  version: '2026-01-16'
  url: https://etrel.atlassian.net/wiki/spaces/EKC/pages/3485665834
  sha256: 5a17f2050ad514bee06fc0f763888367b271f04f534fd784670b7946e740f0bb

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 990
    type: str
    length: 10
  checks:
  - table: input
    address: 0
    type: s16
    range:
    - 0
    - 11
  - table: input
    address: 1020
    type: s32
    range:
    - 1
    - 2

models:
  - {id: duo, name: INCH Duo (two connectors), match: {table: input, address: 1020, type: s32, equals: 2}}
  - {id: inch, name: INCH (one connector)}

points:
  # Connector 1 – real-time values
  - {key: state, label: Connector 1 status, table: input, address: 0, type: s16, enum: connector_status}
  - {key: x.vehicle_phases, label: Connector 1 measured vehicle number of phases, table: input, address: 1, type: s16, enum: vehicle_phases}
  - {key: x.ev_max_phase_current, label: Connector 1 EV max phase current, table: input, address: 2, type: f32, unit: A}
  - {key: x.target_current, label: Connector 1 target current from power management or Modbus, table: input, address: 4, type: f32, unit: A}
  - {key: frequency, label: Connector 1 frequency, table: input, address: 6, type: f32, unit: Hz}
  - {key: l1_voltage, label: Connector 1 L-N voltage L1, table: input, address: 8, type: f32, unit: V}
  - {key: l2_voltage, label: Connector 1 L-N voltage L2, table: input, address: 10, type: f32, unit: V}
  - {key: l3_voltage, label: Connector 1 L-N voltage L3, table: input, address: 12, type: f32, unit: V}
  - {key: l1_current, label: Connector 1 current L1, table: input, address: 14, type: f32, unit: A}
  - {key: l2_current, label: Connector 1 current L2, table: input, address: 16, type: f32, unit: A}
  - {key: l3_current, label: Connector 1 current L3, table: input, address: 18, type: f32, unit: A}
  - {key: l1_power, label: Connector 1 active power L1, table: input, address: 20, type: f32, unit: W, scale: 1000, positive: consumption, verified: false, note: kW in the register. The list gives no sign convention; positive = consumption assumed.}
  - {key: l2_power, label: Connector 1 active power L2, table: input, address: 22, type: f32, unit: W, scale: 1000, positive: consumption, verified: false, note: kW in the register. The list gives no sign convention; positive = consumption assumed.}
  - {key: l3_power, label: Connector 1 active power L3, table: input, address: 24, type: f32, unit: W, scale: 1000, positive: consumption, verified: false, note: kW in the register. The list gives no sign convention; positive = consumption assumed.}
  - {key: consumer_power, label: Connector 1 active power total, table: input, address: 26, type: f32, unit: W, scale: 1000, positive: consumption, verified: false, note: kW in the register. The list gives no sign convention; positive = consumption assumed.}
  - {key: power_factor, label: Connector 1 power factor, table: input, address: 28, type: f32, unit: ''}
  - {key: session_energy, label: Connector 1 imported active energy in running session, table: input, address: 30, type: f32, unit: kWh}
  - {key: x.session_duration, label: Connector 1 running session duration, table: input, address: 32, type: s64, unit: s}
  - {key: x.departure_time, label: Connector 1 running session departure time, table: input, address: 36, type: s64, unit: s, poll: slow, note: Unix time (UTC).}
  - {key: x.session_id, label: Connector 1 running session ID, table: input, address: 40, type: s64, poll: slow, note: The OCPP transaction id when a central system is connected.}
  - {key: x.ev_max_power, label: Connector 1 EV max power, table: input, address: 44, type: f32, unit: W, scale: 1000, note: kW in the register; highest power seen in the running session.}
  - {key: x.ev_planned_energy, label: Connector 1 EV planned energy, table: input, address: 46, type: f32, unit: kWh, poll: slow}
  - {key: consumer_energy, label: Connector 1 meter value (active energy counter), table: input, address: 48, type: s64, unit: kWh, scale: 1.0e-06, poll: slow, note: mWh in the register; lifetime energy of the connector.}
  - {key: x.charging_mode, label: Connector 1 selected charging mode, table: input, address: 53, type: s16, enum: charging_mode, poll: slow}
  - {key: x.last_rfid, label: Connector 1 RFID UID of last session, table: input, address: 54, type: str, length: 10, poll: slow}

