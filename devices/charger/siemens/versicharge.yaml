# From Siemens' VersiCharge AC Series ModBus Map A5E52200882-AJ (firmware ≥ 2.135), with the differences of the
# older map A5E52200882-AA (firmware ≥ 2.118) as a second model.

modbusspec: 0
id: siemens-versicharge
manufacturer: Siemens
name: VersiCharge AC wallboxes
kind: charger

sources:
- title: VersiCharge AC Series ModBus Map (A5E52200882-AJ)
  version: AJ (06/2024), firmware ≥ V2.135
  url: https://cache.industry.siemens.com/dl/files/359/109814359/att_1291322/v1/versicharge_wallbox_modBus_map_en-US.pdf
  sha256: 8bf40ac5e3b78390feb0da56fa3f5bb77b6c02133d4e0e4dc0845695ab93d842
- title: VersiCharge AC Series ModBus Map (A5E52200882-AA)
  version: AA (10/2022), firmware ≥ V2.118
  url: https://assets.new.siemens.com/siemens/assets/api/uuid:ee5e40d6-fad5-47ca-8c5b-9a5b1dbc615f/versicharge-wallbox-modBus-map-en-US..pdf
  sha256: f36ace266d07b5abfb3334d57dc41eb8ceb4ac698779365c09f0ef29df5255b3
  archive_url: https://web.archive.org/web/20240620183946/https://assets.new.siemens.com/siemens/assets/api/uuid:ee5e40d6-fad5-47ca-8c5b-9a5b1dbc615f/versicharge-wallbox-modBus-map-en-US..pdf
- id: siemens-sentron
  title: ha-siemens-sentron (Home Assistant integration)
  url: https://github.com/powerassistant/ha-siemens-sentron
  license: MIT
  commit: dfb1773af007be60193f1a4ad83770d3400c057f
  path: custom_components/siemens_sentron/versicharge.py

connection:
  default_port: 502
  default_unit: 2
  transports:
  - tcp
  - rtu
  serial:
    baud: 38400
    format: 8E1
  limits:
    max_registers: 125
    min_interval_ms: 5000

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 7
    type: str
    length: 5
  checks:
  - table: holding
    address: 0
    type: str
    length: 5
    prefix: Siemens

models:
  - {id: al, name: Firmware ≥ 2.135 (map A5E52200882-AJ)}
  - {id: af, name: Firmware 2.118–2.134 (map A5E52200882-AA)}

points:
  # Charger specification
  - {key: x.manufacturer, label: Manufacturer Name, table: holding, address: 0, type: str, length: 5, poll: slow, note: '"Siemens AG".'}
  - {key: x.production_year, label: Production Date (word 1), table: holding, address: 5, type: u16, poll: slow, note: Year; derived from the serial number., conflicts: [{sources: [siemens-sentron], type: datetime, length: 2, word_order: big, label: Production date}]}
  - {key: x.production_month, label: 'Production Date (word 2, byte 3)', table: holding, address: 6, type: u16, bits: [8, 15], poll: slow}
  - {key: x.production_day, label: 'Production Date (word 2, byte 4)', table: holding, address: 6, type: u16, bits: [0, 7], poll: slow}
  - {key: serial, label: Serial Number, table: holding, address: 7, type: str, length: 5, poll: slow}
  - {key: x.model, label: MLFB Number, table: holding, address: 12, type: str, length: 10, poll: slow, note: Product catalog number.}
  - {key: x.platform_type, label: Platform Type, table: holding, address: 22, type: u16, enum: platform_type, poll: slow}
  - {key: x.number_of_outlets, label: Number of Outlets, table: holding, address: 24, type: u16, poll: slow}
  - {key: x.outlet_type, label: Type of Outlet, table: holding, address: 25, type: u16, enum: outlet_type, poll: slow}
