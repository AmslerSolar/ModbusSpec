  - {when: {key: state, equals: 6}, kind: fault, text: Charge point faulted (OCPP state 6)}
  - {when: {key: x.evse_state, equals: E}, kind: fault, text: Charging station fault E (recoverable)}
  - {when: {key: x.evse_state, equals: F}, kind: fault, text: Charging station fault F (not recoverable)}

notes:
- Addresses are the maps' "internal" 0-based column; the external numbers are 40001 higher (41634 = holding 1633). Everything
  is read with function 03; writes with 06 or 16.
- 'Unit id 2 by default (RTU and, assumed, TCP); RS485 38400 baud, 8 data bits, even parity, 1 stop bit. TCP port 502, fixed.
  AJ asks for at least 5 s between polls and a 10 s timeout (AA: 1 s and 2 s).'
- Register blocks with gaps (e.g. holding 23 and 1604–1628 are buffers) and requests over 125 registers are rejected with
  exception 0x02.
- The model follows the A8 firmware string at holding 31; there is no register that tells the maps apart directly. The AA
  map has no EVSE state, error code or OCPP state (1599–1601) and no firmware variant / release date (42–50).
- Dynamic values may lag several polls behind. When the charger is controlled over OCPP, Modbus is mainly for monitoring.
- No unavailable marker is documented; registers for phases a single-phase charger lacks read 0.
- 'Left out: RFID card add/remove and whitelists (80–337, 1852–1877), reboot, factory reset and RTU address reset (1826–1844,
  1878).'
- Everything is read with function 03 from holding registers; unit id 2, on some units 1.
- 'The firmware version (A8 firmware string at holding 31) selects the register map: from 2.135 the energy counter counts
  Wh and power factors 0.001; before, 0.1 Wh and 0.01. The error-code table and charger states changed with 2.136, so firmware
  2.135 uses the new scaling with the old error codes.'
- Holding register 23 doesn't exist; blocks are read around it. Registers 42–50 exist only on the newer map.
- Manufacturer string at holding 0 reads "Siemens AG"; the model string at 12 starts with 8EM or contains VERSICHARGE.
- Identification as siemens-sentron recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
