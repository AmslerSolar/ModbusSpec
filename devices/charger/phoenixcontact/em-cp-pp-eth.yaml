modbusspec: 0
id: phoenixcontact-em-cp-pp-eth
manufacturer: Phoenix Contact
name: EM-CP-PP-ETH charge controller
kind: charger

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: charger/phoenix-em-eth.go

connection:
  default_port: 502
  default_unit: 180
  transports:
  - tcp

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.enable, label: Charging enabled, table: coil, address: 400, type: bool, writable: true}
  - {key: x.max_current, label: Charging current limit, table: holding, address: 300, type: u16, unit: A, writable: true, note: evcc writes at least 6 A.}
  - {key: x.status, label: Vehicle state, table: input, address: 100, type: str, length: 1, chars: low, note: 'IEC 61851 state as an ASCII letter (A, B, C …).'}
  - {key: x.charge_time, label: Charging time, table: input, address: 102, type: u32, unit: s}
  - {key: l1_voltage, label: L1 voltage, table: input, address: 108, type: s32, unit: V, scale: 0.01}
  - {key: l2_voltage, label: L2 voltage, table: input, address: 110, type: s32, unit: V, scale: 0.01}
  - {key: l3_voltage, label: L3 voltage, table: input, address: 112, type: s32, unit: V, scale: 0.01}
  - {key: l1_current, label: L1 current, table: input, address: 114, type: s32, unit: A, scale: 0.001}
  - {key: l2_current, label: L2 current, table: input, address: 116, type: s32, unit: A, scale: 0.001}
  - {key: l3_current, label: L3 current, table: input, address: 118, type: s32, unit: A, scale: 0.001}
  - {key: consumer_power, label: Charging power, table: input, address: 120, type: s32, unit: W, scale: 10, positive: consumption, note: Raw value in 0.01 kW.}
  - {key: consumer_energy, label: Energy, table: input, address: 128, type: u32, unit: kWh, scale: 0.01}

notes:
- The measurements need a connected meter; evcc checks for one by a voltage above 0 on L1.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
