modbusspec: 0
id: phoenixcontact-ev-ser
manufacturer: Phoenix Contact
name: EV-CC-AC1-M charge controllers (RS485)
kind: charger

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: charger/phoenix-ev-ser.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.enable, label: Charging enabled, table: coil, address: 20000, type: bool, writable: true}
  - {key: x.max_current, label: Charging current limit, table: holding, address: 22000, type: u16, unit: A, writable: true, note: evcc writes at least 6 A.}
  - {key: x.status, label: Vehicle state, table: input, address: 24000, type: str, length: 1, chars: high, note: 'IEC 61851 state as an ASCII letter (A, B, C …).'}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
