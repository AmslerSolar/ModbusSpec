enums:
  charging_state: {'1': Undefined, '2': 'A1 – no car, charging not allowed', '3': 'A2 – no car, charging allowed', '4': 'B1 – car plugged, no request, charging not allowed', '5': 'B2 – car plugged, no request, charging allowed', '6': 'C1 – car requests charging, not allowed', '7': 'C2 – car requests charging, allowed', '8': Derating, '9': E – error, '10': F – wallbox locked or not ready, '11': Error}
  lock: {'0': Locked, '1': Unlocked}
  standby: {'0': Standby enabled, '4': Standby disabled}
  rfid_config_command: {'4096': Disable internal whitelist, '4097': Activate internal whitelist, '4098': Disable RFID card security, '4099': Activate RFID card security, '4100': Disable authentication, '4101': Activate authentication}
  rfid_control_command: {'8194': Start teaching RFID card, '8195': Cancel teaching RFID card, '8196': Card accepted by the Modbus controller, '8200': Card rejected by the Modbus controller}
  charging_permission_command: {'12289': Give charging permission}
  rfid_security: {'0': No secure card, '1': Amperfied secure card}
  charging_permission: {'0': No permission, '1': Via RFID, '2': Via web browser, '3': Via app, '4': Via OCPP, '5': Via Modbus}
  ready: {'0': Wallbox available, '1': Ready for charging}
  mid_available: {'0': No internal MID meter, '1': Internal MID meter fitted}
  phases: {'1': 1 phase, '3': 3 phases}
  charging_strategy: {'0': Manual mode, '1': Solar (eco) mode, '2': Not used}
  disconnect_simulation: {'0': No disconnect simulation, '1': Simulate disconnect}
  phase_switch_state: {'0': Phase switching in progress, '1': 1 phase active, '3': 3 phases active}

flags:
  rfid_status_bits: {'0': Internal whitelist activated, '1': RFID card security activated, '2': Authentication activated}

problems:
  - {when: {key: state, equals: 9}, kind: fault, text: Charging error (state E)}
  - {when: {key: state, equals: 11}, kind: fault, text: Wallbox error (state 11)}
  - {when: {key: state, equals: 8}, kind: warning, text: Charging current derated}

notes:
- The Energy Control speaks Modbus RTU over two-wire RS485 (half duplex) at 19200 baud, 8 data bits, even parity, 1 stop bit,
  unicast only (no broadcast); it supports functions 03, 04, 06 and 16. The connect series speaks Modbus TCP on port 502 and
  allows one connection at a time. Unit 1 is an assumption.
- Addresses are the documents' bus addresses, used as 0-based protocol addresses. Input registers are read with function 04,
  holding registers with 03 and written with 06.
- 32-bit values are two registers, high register first; the documents write the high-register weight as "216", meaning 2^16.
- 'Register layout version (input 4) decides what exists. Energy Control: up to 1.0.8 (power and energy since power-on from
  1.0.4, energy since installation and current/failsafe commands from 1.0.7). connect series: connect.home from 1.0.8, connect.business
  from 2.0.0, connect.solar / .solar pro from 2.0.1; most later blocks need 2.0.0–2.0.4 as noted per point.'
- 'Registers in one table mean different things per product: input 300–318 (diagnostics) and 500–819 (error memory) are manufacturer-only
  on both; on the connect series holding 300–302 are RFID commands and holding 500–505 phase-switch settings.'
- Left out the manufacturer-only blocks (logistic string 102–133, diagnostics 300–318, error memory 500–819) and the raw RFID
  UID (2002–2007, bytes rather than text).
- Energy Control values (currents, voltages, power, energy) are internal measurements, not for billing; energy is apparent
  energy (VAh).
- Heidelberg Energy Control speaks Modbus RTU over RS485 (usually behind a TCP gateway); the Amperfied / Heidelberg connect
  series (connect.home, connect.solar) has Modbus TCP built in.
- 'Register layout version (input register 4) decides which registers exist: watchdog, FailSafe current and standby from 1.0.8,
  session energy (19-20) and the MID meter (3000-3012) from 2.0.0. Some units report a newer layout without the registers;
  a read that includes a missing register fails as a whole, so the project reads such registers on their own first.'
- Register 3010 (MID reverse power) is not implemented on all units; the project leaves it out.
- Charging state values 2-11 map to IEC 61851 states A-F; the vehicle counts as connected from 4 on.
- EvcsHeidelbergEnergyImpl.java reads holding register 257 as watchdog_time with type s16, unit none, scale 1; EvseChargePointHeidelbergConnectImpl.java
  (kept here) reads type u16, unit s, scale 0.001.
- EvcsHeidelbergEnergyImpl.java reads holding register 261 as max_current with type s16, unit none, scale 1; EvseChargePointHeidelbergConnectImpl.java
  (kept here) reads type u16, unit A, scale 0.1.
- EvcsHeidelbergEnergyImpl.java reads holding register 262 as failsafe_current with type s16, unit none, scale 1; EvseChargePointHeidelbergConnectImpl.java
  (kept here) reads type u16, unit A, scale 0.1.
