#
# Written from Amperfied's Modbus register layout documents for the Wallbox Energy Control and the connect series
# (see sources).

modbusspec: 0
id: heidelberg-energy-control
manufacturer: Heidelberg / Amperfied
name: Wallbox Energy Control and connect series (connect.home, .business, .solar, .solar pro)
kind: charger

sources:
- title: Heidelberg Wallbox Energy Control – ModBus Register Layout ("Erweiterte ModBus Registerbeschreibung")
  version: '20220809'
  url: https://www.amperfied.de/wp-content/uploads/2023/03/20220809_AMP-Erweiterte-ModBus-Registerbeschreibung.pdf
  sha256: 5b3a7bed7ceefc6f87b6f5bcee62794a45bb4d46fd3028c986ff6ebdae701b0c
  archive_url: https://web.archive.org/web/20231103131216/https://www.amperfied.de/wp-content/uploads/2023/03/20220809_AMP-Erweiterte-ModBus-Registerbeschreibung.pdf
- title: Table Modbus Register – Wallbox Energy Control
  version: 22 February 2021
  url: https://www.amperfied.de/wp-content/uploads/2023/03/EC_ModBus_register_table_20210222_LW.pdf
- title: List Modbus Register – Heidelberg Wallbox Energy Control
  version: 20.10.2020
- title: Heidelberg Wallbox Energy Control – ModBus-Anbindung (German, early edition)
  url: https://cdn.shopify.com/s/files/1/0101/2409/9669/files/heidelberg-energy-control-modbus.pdf
  sha256: 8d6b0053ad14dbe24937b9c4d883bfd3cf3e9080d21ec5712557b773cfaec966
- title: Amperfied Wallbox connect series – Modbus TCP Register Layout (layout 1.0.8 – 2.0.4)
  version: '20250422'
  url: https://www.amperfied.de/wp-content/uploads/2025/05/Documentation-Modbus-Register-Layout-connect-series-20250422.pdf
  sha256: 1001fbb72faec51c64476a2b2687108c4e691d30f00a8e2ea5e6512b965611c9
  archive_url: https://web.archive.org/web/20250513083506/https://www.amperfied.de/wp-content/uploads/2025/05/Documentation-Modbus-Register-Layout-connect-series-20250422.pdf
- id: heidelberg-energy-control
  title: heidelberg_energy_control (Home Assistant integration)
  url: https://github.com/Schrolli91/heidelberg_energy_control
  license: MIT
  commit: 187a9980f019374a9da92146f36067d996a442e5
  path: custom_components/heidelberg_energy_control/core/capabilities/*.py, custom_components/heidelberg_energy_control/const.py,
    custom_components/heidelberg_energy_control/sensor.py, custom_components/heidelberg_energy_control/number.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evse.chargepoint.heidelberg/src/io/openems/edge/evse/chargepoint/heidelberg/connect/EvseChargePointHeidelbergConnectImpl.java,
    io.openems.edge.evcs.heidelberg/src/io/openems/edge/evcs/heidelberg/energy/EvcsHeidelbergEnergyImpl.java

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: input
    address: 4
    type: u16
    range:
    - 256
    - 1279
  - table: input
    address: 5
    type: u16
    range:
    - 1
    - 11

points:
  # General (Energy Control and connect series)
  - {key: x.reg_layout_ver, label: Modbus Register-Layouts Version, table: input, address: 4, type: u16, poll: slow, note: 'Read as hex digits: 0x108 = V1.0.8. Not the firmware version; it decides which registers exist.'}
  - {key: state, label: Charging State, table: input, address: 5, type: u16, enum: charging_state}
  - {key: l1_current, label: L1 - Current RMS, table: input, address: 6, type: u16, unit: A, scale: 0.1, note: '0–35 A. Energy Control: internal value, not for billing; connect series: from the MID meter where one is fitted.'}
  - {key: l2_current, label: L2 - Current RMS, table: input, address: 7, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: L3 - Current RMS, table: input, address: 8, type: u16, unit: A, scale: 0.1}
  - {key: temperature, label: PCB-Temperature, table: input, address: 9, type: s16, unit: °C, scale: 0.1, conflicts: [{sources: [heidelberg-energy-control, openems], type: u16, label: Housing temperature}]}
  - {key: l1_voltage, label: Voltage L1 - N, table: input, address: 10, type: u16, unit: V}
  - {key: l2_voltage, label: Voltage L2 - N, table: input, address: 11, type: u16, unit: V}
  - {key: l3_voltage, label: Voltage L3 - N, table: input, address: 12, type: u16, unit: V}
  - {key: x.external_lock_state, label: Extern Lock State, table: input, address: 13, type: u16, enum: lock}
  - {key: consumer_power, label: Power (L1+L2+L3), table: input, address: 14, type: u16, unit: W, positive: consumption, verified: false, note: 'Energy Control layout 1.0.4+: apparent power in VA; the connect series document gives W. Unsigned, so positive = consumption (derived).'}
  - {key: x.energy_since_power_on, label: Energy since PowerOn, table: input, address: 15, type: u32, unit: kWh, scale: 0.001, note: 'VAh, high register first (the document''s "216" means 2^16). Restarts at power-on and after standby. Layout 1.0.4+.'}
  - {key: consumer_energy, label: Energy since Installation, table: input, address: 17, type: u32, unit: kWh, scale: 0.001, poll: slow, note: 'VAh, high register first; survives power loss, can''t be reset. Energy Control layout 1.0.7+; on the connect series from the MID meter where fitted.'}
  - {key: session_energy, label: Energy during charge cycle, table: input, address: 19, type: u32, unit: kWh, scale: 0.001, note: VAh since the start of the charging cycle. connect series only (layout 2.0.0+).}
  - {key: l1_power, label: Power L1, table: input, address: 21, type: u16, unit: W, positive: consumption, verified: false, note: 'connect series layout 2.0.3+. Unsigned, so positive = consumption (derived).'}
  - {key: l2_power, label: Power L2, table: input, address: 22, type: u16, unit: W, positive: consumption, verified: false}
  - {key: l3_power, label: Power L3, table: input, address: 23, type: u16, unit: W, positive: consumption, verified: false}
  - {key: x.hw_max_current, label: Hardware configuration maximal current, table: input, address: 100, type: u16, unit: A, poll: slow, note: Set by the switch inside the wallbox.}
  - {key: x.hw_min_current, label: Hardware configuration minimal current, table: input, address: 101, type: u16, unit: A, poll: slow, note: Fixed 6 A on the connect series.}
  - {key: x.hw_version, label: Hardware-Variant, table: input, address: 200, type: u16, poll: slow, note: Reserved for the manufacturer.}
  - {key: x.sw_version, label: Application Software svn-revNo, table: input, address: 203, type: u16, poll: slow, note: Revision number of the application software (manufacturer use).}

  # Holding registers (read 03, write 06)
  - {key: x.watchdog_timeout_command, label: ModBus-Master WatchDog Timeout, table: holding, address: 257, type: u16, unit: s, scale: 0.001, writable: true, poll: slow, note: 'Default 15000 = 15 s, 0 = off. Without a successful request in this time the wallbox goes to timeout mode (FailSafe current). Kept over power-off from layout 1.0.8.'}
  - {key: x.standby_function_control, label: Standby Function Control, table: holding, address: 258, type: u16, enum: standby, writable: true, poll: slow, note: 'Energy Control only; write-only up to layout 1.0.7, read/write from 1.0.8. In standby (no car) the wallbox doesn''t answer Modbus. Only 0 and 4 are allowed.'}
  - {key: x.remote_lock_command, label: Remote lock, table: holding, address: 259, type: u16, enum: lock, writable: true, poll: slow, note: Default 1 (unlocked); works only while the external lock input is unlocked. Kept over power-off from layout 1.0.8.}
  - {key: x.max_current_command, label: Maximal current command, table: holding, address: 261, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 16, persistent: false, note: 0 or 6.0–16.0 A; 0.1–5.9 A count as 0 = no charging. Default 0 after power-on or standby. Layout 1.0.7+. Amperfied asks to keep a new value for 20 s.}
  - {key: x.failsafe_current_command, label: FailSafe Current, table: holding, address: 262, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 16, poll: slow, note: 'Current after the watchdog timeout: 0 (no charging) or 6.0–16.0 A. Layout 1.0.7+; kept over power-off from 1.0.8.'}

  # connect series: logistic data (input, ASCII, two characters per register, zero-terminated)
  - {key: serial, label: Wallbox Serial Number, table: input, address: 1000, type: str, length: 18, poll: slow, note: connect series layout 2.0.0+.}
  - {key: x.item_number, label: Wallbox Item Number, table: input, address: 1050, type: str, length: 18, poll: slow}
  - {key: x.production_date, label: Date of Production, table: input, address: 1100, type: str, length: 18, poll: slow, note: 'Week and year, e.g. 1723.'}
  - {key: firmware, label: Firmware Version, table: input, address: 1250, type: str, length: 41, poll: slow, note: e.g. V2.0.0.}
  - {key: x.firmware_variant, label: Firmware Variant, table: input, address: 1300, type: str, length: 41, poll: slow}

  # connect series: RFID handling (layout 2.0.0+)
  - {key: x.rfid_config_command, label: RFID Configuration Commands, table: holding, address: 300, type: u16, enum: rfid_config_command, writable: true, write_only: true, poll: slow, note: The status is in input 2100.}
  - {key: x.rfid_control_command, label: RFID Control Commands, table: holding, address: 301, type: u16, enum: rfid_control_command, writable: true, write_only: true, poll: slow}
  - {key: x.charging_permission_command, label: Charging Permission Command, table: holding, address: 302, type: u16, enum: charging_permission_command, writable: true, write_only: true, poll: slow}
  - {key: x.rfid_card_counter, label: RFID Card Counter, table: input, address: 2000, type: u16, poll: slow}
  - {key: x.rfid_uid_length, label: RFID UID Length, table: input, address: 2001, type: u16, poll: slow, note: 'Bytes of the UID in 2002–2007 (two bytes per register, first byte high).'}
  - {key: x.rfid_card_serial, label: RFID Card Serial Number, table: input, address: 2008, type: str, length: 10, poll: slow, note: Amperfied security cards only.}
  - {key: x.rfid_security_type, label: RFID Security Type, table: input, address: 2018, type: u16, enum: rfid_security, poll: slow}
  - {key: x.charging_permission, label: Charging Permission, table: input, address: 2019, type: u16, enum: charging_permission, note: Only with the internal whitelist active.}
  - {key: x.ready_for_charging, label: Wallbox Ready for Charging, table: input, address: 2020, type: u16, enum: ready}
  - {key: x.rfid_status, label: RFID Status Information, table: input, address: 2100, type: u16, flags: rfid_status_bits, poll: slow, note: The document's parameter table repeats address 2020; the heading says 2100.}

  # connect series: internal MID meter (connect.business and connect.solar pro, layout 2.0.0+)
  - {key: x.mid_available, label: Int. MID available, table: input, address: 3000, type: u16, enum: mid_available, poll: slow}
  - {key: x.mid_current_l1, label: Int. MID Current L1, table: input, address: 3001, type: u16, unit: A, scale: 0.1}
  - {key: x.mid_current_l2, label: Int. MID Current L2, table: input, address: 3002, type: u16, unit: A, scale: 0.1}
  - {key: x.mid_current_l3, label: Int. MID Current L3, table: input, address: 3003, type: u16, unit: A, scale: 0.1}
  - {key: x.mid_voltage_l1, label: Int. MID Voltage L1, table: input, address: 3004, type: u16, unit: V}
  - {key: x.mid_voltage_l2, label: Int. MID Voltage L2, table: input, address: 3005, type: u16, unit: V}
  - {key: x.mid_voltage_l3, label: Int. MID Voltage L3, table: input, address: 3006, type: u16, unit: V}
  - {key: x.mid_power_forward, label: Int. MID Power Forward, table: input, address: 3007, type: u16, unit: W, note: Power delivered to the car.}
  - {key: x.mid_energy_forward, label: Int. MID Energy Forward since Installation, table: input, address: 3008, type: u32, unit: kWh, scale: 0.001, poll: slow, note: 'Wh, high register first; billing grade.'}
  - {key: x.mid_power_reverse, label: Int. MID Power Reverse, table: input, address: 3010, type: u16, unit: W, note: Power from the car; bidirectional charging isn't implemented yet.}
  - {key: x.mid_energy_reverse, label: Int. MID Energy Reverse since Installation, table: input, address: 3011, type: u32, unit: kWh, scale: 0.001, poll: slow, note: Wh; bidirectional charging isn't implemented yet.}
  - {key: x.mid_power_forward_l1, label: Int. MID Power Forward L1, table: input, address: 3013, type: u16, unit: W, note: Layout 2.0.3+.}
  - {key: x.mid_power_forward_l2, label: Int. MID Power Forward L2, table: input, address: 3014, type: u16, unit: W}
  - {key: x.mid_power_forward_l3, label: Int. MID Power Forward L3, table: input, address: 3015, type: u16, unit: W}
  - {key: x.mid_power_reverse_l1, label: Int. MID Power Reverse L1, table: input, address: 3016, type: u16, unit: W, verified: false, note: Heading says 3016–3018; the parameter table repeats 3013–3015. Bidirectional charging isn't implemented yet.}
  - {key: x.mid_power_reverse_l2, label: Int. MID Power Reverse L2, table: input, address: 3017, type: u16, unit: W, verified: false}
  - {key: x.mid_power_reverse_l3, label: Int. MID Power Reverse L3, table: input, address: 3018, type: u16, unit: W, verified: false}
  - {key: x.mid_serial, label: Int. MID Serial Number, table: input, address: 3100, type: str, length: 51, poll: slow}
  - {key: x.mid_vendor, label: Int. MID Vendor Name, table: input, address: 3151, type: str, length: 51, poll: slow, note: Layout 2.0.2+.}
  - {key: x.mid_product, label: Int. MID Product Name, table: input, address: 3202, type: str, length: 51, poll: slow, note: Layout 2.0.2+.}
  - {key: x.mid_software, label: Int. MID Software Version, table: input, address: 3253, type: str, length: 21, poll: slow, note: Layout 2.0.2+.}
  - {key: x.mid_hardware, label: Int. MID Hardware Version, table: input, address: 3274, type: str, length: 21, poll: slow, note: Layout 2.0.2+.}

  # connect series: internal power data of the control board (HCB), layout 2.0.0+; not for billing
  - {key: x.hcb_current_l1, label: Internal HCB Current L1, table: input, address: 3500, type: u16, unit: A, scale: 0.1}
  - {key: x.hcb_current_l2, label: Internal HCB Current L2, table: input, address: 3501, type: u16, unit: A, scale: 0.1}
  - {key: x.hcb_current_l3, label: Internal HCB Current L3, table: input, address: 3502, type: u16, unit: A, scale: 0.1}
  - {key: x.hcb_voltage_l1, label: Internal HCB Voltage L1, table: input, address: 3503, type: u16, unit: V}
  - {key: x.hcb_voltage_l2, label: Internal HCB Voltage L2, table: input, address: 3504, type: u16, unit: V}
  - {key: x.hcb_voltage_l3, label: Internal HCB Voltage L3, table: input, address: 3505, type: u16, unit: V}
  - {key: x.hcb_power, label: Internal HCB Power, table: input, address: 3506, type: u16, unit: W}
  - {key: x.hcb_energy_since_power_on, label: Internal HCB Energy since Power on, table: input, address: 3507, type: u32, unit: kWh, scale: 0.001}
  - {key: x.hcb_energy_since_installation, label: Internal HCB Energy since Installation, table: input, address: 3509, type: u32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.hcb_power_l1, label: Internal HCB Power L1, table: input, address: 3511, type: u16, unit: W, note: Layout 2.0.3+.}
  - {key: x.hcb_power_l2, label: Internal HCB Power L2, table: input, address: 3512, type: u16, unit: W}
  - {key: x.hcb_power_l3, label: Internal HCB Power L3, table: input, address: 3513, type: u16, unit: W}

  # connect series: external grid meter used for solar charging (layout 2.0.2+); only with a meter connected
  - {key: x.ext_current_l1, label: Ext. Power Meter Current L1, table: input, address: 4000, type: u16, unit: A, scale: 0.1}
  - {key: x.ext_current_l2, label: Ext. Power Meter Current L2, table: input, address: 4001, type: u16, unit: A, scale: 0.1}
  - {key: x.ext_current_l3, label: Ext. Power Meter Current L3, table: input, address: 4002, type: u16, unit: A, scale: 0.1}
  - {key: x.ext_voltage_l1, label: Ext. Power Meter Voltage L1, table: input, address: 4003, type: u16, unit: V}
  - {key: x.ext_voltage_l2, label: Ext. Power Meter Voltage L2, table: input, address: 4004, type: u16, unit: V}
  - {key: x.ext_voltage_l3, label: Ext. Power Meter Voltage L3, table: input, address: 4005, type: u16, unit: V}
  - {key: x.ext_power_import, label: 'Ext. Power Meter: Power Forward', table: input, address: 4006, type: u16, unit: W, note: Power drawn from the grid (sum of phases).}
  - {key: grid_import_energy, label: 'Ext. Power Meter: Energy Forward since Installation', table: input, address: 4007, type: u32, unit: kWh, scale: 0.001, poll: slow, note: 'Wh from the grid, high register first.'}
  - {key: x.ext_power_export, label: 'Ext. Power Meter: Power Reverse', table: input, address: 4009, type: u16, unit: W, note: Power fed into the grid (sum of phases).}
  - {key: grid_export_energy, label: 'Ext. Power Meter: Energy Reverse since Installation', table: input, address: 4010, type: u32, unit: kWh, scale: 0.001, poll: slow, note: 'Wh to the grid, high register first.'}
  - {key: x.ext_power_import_l1, label: 'Ext. Power Meter: Power Forward L1', table: input, address: 4012, type: u16, unit: W, note: Layout 2.0.3+.}
  - {key: x.ext_power_import_l2, label: 'Ext. Power Meter: Power Forward L2', table: input, address: 4013, type: u16, unit: W}
  - {key: x.ext_power_import_l3, label: 'Ext. Power Meter: Power Forward L3', table: input, address: 4014, type: u16, unit: W}
  - {key: x.ext_power_export_l1, label: 'Ext. Power Meter: Power Reverse L1', table: input, address: 4015, type: u16, unit: W, note: Layout 2.0.3+.}
  - {key: x.ext_power_export_l2, label: 'Ext. Power Meter: Power Reverse L2', table: input, address: 4016, type: u16, unit: W}
  - {key: x.ext_power_export_l3, label: 'Ext. Power Meter: Power Reverse L3', table: input, address: 4017, type: u16, unit: W}

  # connect series: external meter, extended ranges (layout 2.0.4+)
  - {key: x.ext_current_signed_l1, label: Ext. Power Meter Current L1 (extended), table: input, address: 4020, type: s16, unit: A, scale: 0.1, note: −600 … 600 A; the document gives no sign convention.}
  - {key: x.ext_current_signed_l2, label: Ext. Power Meter Current L2 (extended), table: input, address: 4021, type: s16, unit: A, scale: 0.1}
  - {key: x.ext_current_signed_l3, label: Ext. Power Meter Current L3 (extended), table: input, address: 4022, type: s16, unit: A, scale: 0.1}
  - {key: x.ext_voltage_ext_l1, label: Ext. Power Meter Voltage L1 (extended), table: input, address: 4023, type: u16, unit: V}
  - {key: x.ext_voltage_ext_l2, label: Ext. Power Meter Voltage L2 (extended), table: input, address: 4024, type: u16, unit: V}
  - {key: x.ext_voltage_ext_l3, label: Ext. Power Meter Voltage L3 (extended), table: input, address: 4025, type: u16, unit: V}
  - {key: x.ext_power_import_32, label: 'Ext. Power Meter: Power Forward (extended)', table: input, address: 4026, type: u32, unit: W}
  - {key: x.ext_energy_import_64, label: 'Ext. Power Meter: Energy Forward since Installation (extended)', table: input, address: 4028, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Wh.}
  - {key: x.ext_power_export_32, label: 'Ext. Power Meter: Power Reverse (extended)', table: input, address: 4032, type: u32, unit: W}
  - {key: x.ext_energy_export_64, label: 'Ext. Power Meter: Energy Reverse since Installation (extended)', table: input, address: 4034, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Wh.}
  - {key: x.ext_power_import_32_l1, label: 'Ext. Power Meter: Power Forward L1 (extended)', table: input, address: 4038, type: u32, unit: W}
  - {key: x.ext_power_import_32_l2, label: 'Ext. Power Meter: Power Forward L2 (extended)', table: input, address: 4040, type: u32, unit: W}
  - {key: x.ext_power_import_32_l3, label: 'Ext. Power Meter: Power Forward L3 (extended)', table: input, address: 4042, type: u32, unit: W}
  - {key: x.ext_power_export_32_l1, label: 'Ext. Power Meter: Power Reverse L1 (extended)', table: input, address: 4044, type: u32, unit: W}
  - {key: x.ext_power_export_32_l2, label: 'Ext. Power Meter: Power Reverse L2 (extended)', table: input, address: 4046, type: u32, unit: W}
  - {key: x.ext_power_export_32_l3, label: 'Ext. Power Meter: Power Reverse L3 (extended)', table: input, address: 4048, type: u32, unit: W}
  - {key: x.ext_meter_serial, label: Ext. MID Serial Number, table: input, address: 4100, type: str, length: 51, poll: slow}
  - {key: x.ext_meter_vendor, label: Ext. MID Vendor Name, table: input, address: 4151, type: str, length: 51, poll: slow}
  - {key: x.ext_meter_product, label: Ext. MID Product Name, table: input, address: 4202, type: str, length: 51, poll: slow}
  - {key: x.ext_meter_software, label: Ext. MID Software Version, table: input, address: 4253, type: str, length: 21, poll: slow}
  - {key: x.ext_meter_hardware, label: Ext. MID Hardware Version, table: input, address: 4274, type: str, length: 21, poll: slow}

  # connect series: phase switching and solar mode
  - {key: x.max_power_target, label: Maximal Power Target Command, table: holding, address: 500, type: u16, unit: W, writable: true, note: 'connect.solar / .solar pro, layout 2.0.2+. Sets a power target and lets the wallbox choose the phases; don''t combine with 501 or 261.'}
  - {key: x.phase_switch_control, label: Phase Switch Control, table: holding, address: 501, type: u16, enum: phases, writable: true, note: 'connect.solar / .solar pro, layout 2.0.1+. Default 3; use with 261, not with 500.'}
  - {key: x.charging_strategy, label: Charging Management Strategy, table: holding, address: 502, type: u16, enum: charging_strategy, writable: true, poll: slow}
  - {key: x.phase_switch_duration, label: Duration Time Phase Switch, table: holding, address: 503, type: u16, unit: s, writable: true, min: 15, max: 900, poll: slow, note: Default 90. Layout 2.0.2+.}
  - {key: x.phase_switch_wait, label: Waiting Time Phase Switch, table: holding, address: 504, type: u16, unit: s, writable: true, min: 0, max: 3600, poll: slow, note: Default 300. Layout 2.0.2+.}
  - {key: x.disconnect_simulation, label: Disconnect Simulation Command, table: holding, address: 505, type: u16, enum: disconnect_simulation, writable: true, poll: slow, note: Default 1 (recommended). Layout 2.0.2+.}
  - {key: x.max_power_set, label: Maximal Power Set, table: input, address: 5000, type: u16, unit: W, verified: false, note: Readback of 500. The document names the function "04 - readHoldingRegister"; input table (function 04) assumed.}
  - {key: x.phase_switch_state, label: Phase Switch State, table: input, address: 5001, type: u16, enum: phase_switch_state}
  - {key: x.charging_strategy_state, label: Status Charging Management Strategy, table: input, address: 5002, type: u16, enum: charging_strategy}
