modbusspec: 0
id: iont-charger
manufacturer: IONT
name: EV chargers
kind: charger

sources:
- id: pyiont
  title: pyiont (Python library used by the ha-iont Home Assistant integration)
  url: https://github.com/IONTtech/pyiont
  license: MIT
  commit: 0c18d1ec02dd46c786a7b4864c6dce11607ab2dc
  path: src/pyiont/components.py, src/pyiont/const.py

connection:
  default_port: 30502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - pyiont

points:
  - {key: x.external_power_limit, label: External power limit, table: holding, address: 4098, type: u16, unit: W, writable: true, note: Writable charging power cap for an energy manager; 65535 W lifts it. Reads back the effective limit.}
  - {key: x.authorize_by_connector_id, label: Authorize connector (by connector id), table: holding, address: 4112, type: u16, writable: true, note: 'Command trigger: write the connector id; the charger resets it to 0 when done.'}
  - {key: x.deauthorize_by_connector_id, label: Deauthorize connector (by connector id), table: holding, address: 4113, type: u16, writable: true, note: 'Command trigger: write the connector id; the charger resets it to 0 when done.'}
  - {key: x.authorize_boost_by_connector_id, label: Authorize boost charging (by connector id), table: holding, address: 4114, type: u16, writable: true, note: 'Command trigger: write the connector id; the charger resets it to 0 when done.'}
  - {key: x.connector1_authorize, label: 'Connector 1: authorize', table: holding, address: 8193, type: u16, writable: true, note: Command trigger (holding register in the connector block); the charger resets it to 0 when done.}
  - {key: x.connector1_deauthorize, label: 'Connector 1: deauthorize', table: holding, address: 8194, type: u16, writable: true, note: Command trigger (holding register in the connector block); the charger resets it to 0 when done.}
  - {key: x.main_breaker_current, label: Main breaker current, table: input, address: 4096, type: u16, unit: A}
  - {key: x.charger_breaker_current, label: Charger breaker current, table: input, address: 4097, type: u16, unit: A}
  - {key: x.phase_count, label: Phase count, table: input, address: 4098, type: u16}
  - {key: x.free_charging, label: Free charging, table: input, address: 4099, type: u16, enum: off_on}
  - {key: x.power_limit_user, label: Power limit user, table: input, address: 4100, type: u16, unit: W}
  - {key: x.available_power, label: Available power, table: input, address: 4101, type: u16, unit: W}
  - {key: x.charging_strategy, label: Charging strategy, table: input, address: 4102, type: u16, enum: charging_strategy}
  - {key: state, label: Status, table: input, address: 4103, type: u16, enum: device_status}
  - {key: x.uptime, label: Uptime, table: input, address: 4104, type: s32, unit: s}
  - {key: x.connector_count, label: Connector count, table: input, address: 4106, type: s32, note: Number of connector blocks.}
  - {key: x.code, label: Code, table: input, address: 4352, type: s32, note: Result of the last command; 1 = carried out.}
  - {key: x.connector1_identifier, label: 'Connector 1: identifier', table: input, address: 8192, type: s32}
  - {key: x.connector1_connector_id, label: 'Connector 1: connector id', table: input, address: 8194, type: u16, note: OCPP connector id (1-based); 0 when none is set.}
  - {key: x.connector1_current_flow, label: 'Connector 1: current flow', table: input, address: 8195, type: u16, enum: current_flow}
  - {key: x.connector1_connection_state, label: 'Connector 1: connection state', table: input, address: 8196, type: u16, enum: connection_state}
  - {key: x.connector1_vehicle_state, label: 'Connector 1: vehicle state', table: input, address: 8197, type: u16, enum: vehicle_state}
  - {key: x.connector1_charging_state, label: 'Connector 1: charging state', table: input, address: 8198, type: u16, enum: charging_state}
  - {key: x.connector1_charging, label: 'Connector 1: charging', table: input, address: 8199, type: u16, enum: off_on}
  - {key: x.connector1_authorized, label: 'Connector 1: authorized', table: input, address: 8200, type: u16, enum: off_on}
  - {key: x.connector1_authorized_by, label: 'Connector 1: authorized by', table: input, address: 8201, type: u16, enum: authorized_by}
  - {key: x.connector1_power_limit, label: 'Connector 1: power limit', table: input, address: 8202, type: f32, unit: W}
  - {key: x.connector1_power, label: 'Connector 1: power', table: input, address: 8204, type: s32, unit: W}
  - {key: l1_voltage, label: 'Connector 1: voltage l1', table: input, address: 8206, type: f32, unit: V}
  - {key: l2_voltage, label: 'Connector 1: voltage l2', table: input, address: 8208, type: f32, unit: V}
  - {key: l3_voltage, label: 'Connector 1: voltage l3', table: input, address: 8210, type: f32, unit: V}
  - {key: l1_current, label: 'Connector 1: current l1', table: input, address: 8212, type: f32, unit: A}
  - {key: l2_current, label: 'Connector 1: current l2', table: input, address: 8214, type: f32, unit: A}
  - {key: l3_current, label: 'Connector 1: current l3', table: input, address: 8216, type: f32, unit: A}
  - {key: frequency, label: 'Connector 1: frequency l1', table: input, address: 8218, type: f32, unit: Hz}
  - {key: x.connector1_frequency_l2, label: 'Connector 1: frequency l2', table: input, address: 8220, type: f32, unit: Hz}
  - {key: x.connector1_frequency_l3, label: 'Connector 1: frequency l3', table: input, address: 8222, type: f32, unit: Hz}
  - {key: session_energy, label: 'Connector 1: session energy', table: input, address: 8224, type: f32, unit: kWh, scale: 0.001}
  - {key: x.connector1_last_session_energy, label: 'Connector 1: last session energy', table: input, address: 8226, type: f32, unit: kWh, scale: 0.001}
  - {key: consumer_energy, label: 'Connector 1: total energy', table: input, address: 8228, type: f32, unit: kWh, scale: 0.001}
  - {key: x.connector1_battery_soc, label: 'Connector 1: battery soc', table: input, address: 8230, type: u16, unit: '%', scale: 0.1, note: Vehicle state of charge; DC connectors only (AC reports 0).}
  - {key: temperature, label: 'Connector 1: temperature inner', table: input, address: 8232, type: f32, unit: °C, note: 0 where not measured.}
  - {key: x.connector1_temperature_ambient, label: 'Connector 1: temperature ambient', table: input, address: 8234, type: f32, unit: °C, note: 0 where not measured.}

enums:
  authorized_by: {'0': Unknown, '1': Not charging, '2': Rfid, '3': Timer, '4': Remote, '5': Auto, '6': Modbus, '7': Mqtt, '8': Ocpp}
  charging_state: {'0': Unknown, '1': Not charging, '2': Charging 1f, '3': Charging 3f, '4': Charging dc, '5': Paused, '6': Charging done}
  charging_strategy: {'0': Unknown, '1': Normal, '2': Eco, '3': Boost}
  connection_state: {'0': Unknown, '1': Offline, '2': Online}
  current_flow: {'0': Unknown, '1': Ac, '2': Dc}
  device_status: {'0': Unknown, '1': Init, '2': Operational, '3': Out of order, '4': Maintenance, '5': Auth not possible, '6': Deactivated}
  vehicle_state: {'0': Unknown, '1': Not connected, '2': Connected, '3': Wants to charge, '4': Needs to ventilate, '5': Error}
  off_on: {'0': 'Off', '1': 'On'}

notes:
- Modbus TCP on port 30502 (pyiont 0.1.0 still defaulted to 502; the ha-iont integration and the next pyiont commit use 30502).
  The charger answers on any unit id. Enable Modbus TCP (and writing, for control) in the charger's administration interface
  under Protocols.
- Device state is in input registers 0x1000-0x100B; settings and command triggers are holding registers.
- 'Each charging connector has a block of input registers: connector n starts at 0x2000 + 0x80 × (n − 1) (0x1000 + 0x00A gives
  the number of connectors). The points cover connector 1; the same offsets apply to the others.'
- Enumerations report 0 for unknown.
- The sign of the connector power register (int32) is not stated by the project.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
