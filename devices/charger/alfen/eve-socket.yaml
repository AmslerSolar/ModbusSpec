  - {key: x.safe_current, label: Active load balancing safe current, table: holding, address: 1212, type: f32, unit: A}
  - {key: x.setpoint_accounted, label: Received setpoint accounted for, table: holding, address: 1214, type: u16, enum: yes_no, invalid: [65535]}
  - {key: x.charge_phases, label: Charge using 1 or 3 phases, table: holding, address: 1215, type: u16, enum: charge_phases, writable: true, invalid: [65535]}

enums:
  meter_type: {'0': RTU, '1': TCP/IP, '2': UDP, '3': P1, '4': Other}
  availability: {'0': Inoperative, '1': Operative}
  yes_no: {'0': 'No', '1': 'Yes'}
  charge_phases: {'1': 1 Phase, '3': 3 Phases}

flags:
  meter_state: {'0': Initialised, '1': Updated, '2': Warning, '3': Error}

problems:
  - {when: {key: x.mode3_state, in: [E, F]}, kind: fault, text: 'Charging error (Mode 3 state {value})'}
  - {when: {key: x.meter_state, bit: 3}, kind: warning, text: Energy meter error (meter state 0x08)}
  - {when: {key: x.meter_state, bit: 2}, kind: warning, text: Energy meter warning (meter state 0x04)}

notes:
- Holding registers only (function 03); up to two Modbus TCP clients at once. Socket 1 (single socket, or the left one) answers
  on unit 1, the right socket of a dual station on unit 2; station registers on unit 200 (see alfen-eve-station).
- Needs the licensed Active Load Balancing feature with data source "Energy Management System" and "Allow reading" switched
  on in the ACE Service Installer (off by default).
- 'The 2025 guide contradicts itself on the word order of 32- and 64-bit values: low word first in one place, network byte
  order in another; the 2020 NG9xx document says big endian (network order) throughout. A reader can try both on the frequency
  (336, 40–70 Hz), else on the L1 voltage (306), and keep the plausible one; FLOAT64 energies follow the same order.'
- The 2025 guide's tables print register numbers (e.g. 300) but its text says to subtract 1 for the Modbus address; the 2020
  NG9xx document prints the same numbers without that rule. The addresses here are the printed numbers; try one lower when
  the manufacturer string isn't found at 117.
- Reserved or unavailable values read as NaN (0xFFFF for 16-bit registers). A multi-register value must be read (and written)
  in one request.
- The meter registers 301, 312–316, 326–332, 346–350, 354–358, 362–386 (per phase) and 394–422 are only listed in the 2020
  NG9xx document; the 2025 guide leaves them out. Values the meter doesn't give read as NaN.
- The power sign is not in the guide; consumption-positive is assumed (unverified).
- Needs the Active Load Balancing licence and Modbus TCP enabled on the charger (Eve NG9xx from firmware 4.2.0, AHP from 2.6.0).
- AHP firmware rejects reads that start or end inside a multi-register value; read whole values only.
- Socket 1 answers on unit id 1, socket 2 (dual chargers) on unit id 2; station registers on unit id 200 (see alfen-eve-station).
- Registers 300-425 hold the socket's energy meter, 1200-1215 its mode 3 status and setpoint.
- The sign of the meter's power values is not stated by the project.
