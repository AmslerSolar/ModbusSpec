  - {key: x.current_sum, label: Current sum, table: holding, address: 326, type: f32, unit: A}
  - {key: x.power_factor_l1, label: Power factor L1, table: holding, address: 328, type: f32, unit: ''}
  - {key: x.power_factor_l2, label: Power factor L2, table: holding, address: 330, type: f32, unit: ''}
  - {key: x.power_factor_l3, label: Power factor L3, table: holding, address: 332, type: f32, unit: ''}
