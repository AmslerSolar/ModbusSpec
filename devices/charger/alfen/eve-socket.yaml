  - {key: x.reactive_energy, label: Reactive energy sum, table: holding, address: 422, type: f64, unit: kvarh, scale: 0.001, note: Raw value in varh., conflicts: [{sources: [alfen-modbus, openems], unit: varh, scale: 1, word_order: big}]}
