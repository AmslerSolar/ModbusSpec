connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 336
    type: f32
    plausible:
    - 40
    - 70

