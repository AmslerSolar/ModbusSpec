  - {key: x.meter_type, label: Meter type, table: holding, address: 305, type: u16, enum: meter_type, invalid: [65535], poll: slow}
  - {key: l1_voltage, label: Voltage L1-N, table: holding, address: 306, type: f32, unit: V}
