modbusspec: 0
id: alpitronic-hypercharger
manufacturer: Alpitronic
name: Hypercharger
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evse.chargepoint.alpitronic/src/io/openems/edge/evcs/alpitronic/EvcsAlpitronicImpl.java, io.openems.edge.evse.chargepoint.alpitronic/src/io/openems/edge/evse/chargepoint/alpitronic/EvseAlpitronicImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.raw_charge_power_set, label: Raw charge power set, table: holding, address: 100, type: u32, unit: W, writable: true}
  - {key: x.setpoint_reactive_power, label: Setpoint reactive power, table: holding, address: 102, type: u32, unit: var, writable: true}
  - {key: x.raw_status, label: Raw status, table: input, address: 100, type: u16, enum: available_state}
  - {key: x.charging_voltage, label: Charging voltage, table: input, address: 101, type: u32, unit: V, scale: 0.01}
  - {key: x.charging_current, label: Charging current, table: input, address: 103, type: u16, unit: A, scale: 0.01}
  - {key: x.raw_charge_power, label: Raw charge power, table: input, address: 104, type: u32, unit: W}
  - {key: x.charged_time, label: Charged time, table: input, address: 106, type: u16, unit: s}
  - {key: x.charged_energy, label: Charged energy, table: input, address: 107, type: u16, unit: kWh, scale: 0.01}
  - {key: x.ev_soc, label: Ev SOC, table: input, address: 108, type: u16, unit: '%', scale: 0.01}
  - {key: x.connector_type, label: Connector type, table: input, address: 109, type: u16, enum: selected_connector}
  - {key: x.ev_max_charging_power, label: Ev max charging power, table: input, address: 110, type: u32, unit: W}
  - {key: x.ev_min_charging_power, label: Ev min charging power, table: input, address: 112, type: u32, unit: W}
  - {key: x.var_reactive_max, label: Var reactive max, table: input, address: 114, type: u32, unit: var}
  - {key: x.var_reactive_min, label: Var reactive min, table: input, address: 116, type: u32, unit: var, note: OpenEMS negates the raw value.}

enums:
  available_state: {'0': Available, '1': Ready to prepare the tag ID, '2': Charging, '3': Charging, '4': Suspended electric vehicle, '5': Suspended electric vehicle se, '6': Finishing, '7': Reserved, '8': Unavailable, '9': Unavailable firmware update, '10': Faulted, '11': Unavailable connection}
  selected_connector: {'0': ChargePoint, '1': CCS_DC Connector, '2': CHAdeMO Connector, '3': CCS AC Connector}

notes:
- 'Addresses for connector slot 0. Each connector has its own block: OpenEMS adds 100, 200, 300 or 400 for slots 0 to 3 (the
  addresses here include the 100 of slot 0).'
- EvseAlpitronicImpl.java reads input register 101 as voltage with scale 1e-05; EvcsAlpitronicImpl.java (kept here) reads
  scale 0.01.
- EvseAlpitronicImpl.java reads input register 103 as current with scale 1e-05; EvcsAlpitronicImpl.java (kept here) reads
  scale 0.01.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
