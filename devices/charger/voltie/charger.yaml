modbusspec: 0
id: voltie-charger
manufacturer: Voltie
name: AC charging station
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evse.chargepoint.voltie/src/io/openems/edge/evse/chargepoint/voltie/EvseChargePointVoltieImpl.java

connection:
  default_port: 502
  default_unit: 11

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.charger_id, label: Charger ID, table: holding, address: 0, type: u16}
  - {key: x.firmware_build, label: Firmware build, table: holding, address: 1, type: u16}
  - {key: x.mcu_serial, label: Mcu serial, table: holding, address: 2, type: u64, word_order: little}
  - {key: x.power_board_serial, label: Power board serial, table: holding, address: 6, type: u64, word_order: little}
  - {key: x.evse_state, label: Evse state, table: holding, address: 10, type: u16, enum: evse_state}
  - {key: x.autostart_enabled, label: Autostart enabled, table: holding, address: 11, type: u16}
  - {key: x.charging_enabled, label: Charging enabled, table: holding, address: 12, type: u16, writable: true}
  - {key: x.charging_active, label: Charging active, table: holding, address: 13, type: u16}
  - {key: x.mains_phases, label: Mains phases, table: holding, address: 14, type: u16}
  - {key: x.stored_dlm_mode, label: Stored DLM mode, table: holding, address: 15, type: u16}
  - {key: x.charge_stop_reason, label: Charge stop reason, table: holding, address: 18, type: u16, enum: charge_stop_reason}
  - {key: x.autonomous_current_limit, label: Autonomous current limit, table: holding, address: 19, type: u16, unit: A, scale: 0.001}
  - {key: x.current_limit, label: Current limit, table: holding, address: 20, type: u16, unit: A, scale: 0.001, writable: true}
  - {key: x.effective_dlm_mode, label: Effective DLM mode, table: holding, address: 21, type: u16}
  - {key: x.forced_single_phase, label: Forced single phase, table: holding, address: 22, type: u16, writable: true}
  - {key: x.comm_watchdog_timeout, label: Comm watchdog timeout, table: holding, address: 23, type: u16, unit: s}
  - {key: x.hardware_current_limit, label: Hardware current limit, table: holding, address: 24, type: u16, unit: A, scale: 0.001}
  - {key: x.capability_flags, label: Capability flags, table: holding, address: 25, type: u16}
  - {key: x.phases_in_use, label: Phases in use, table: holding, address: 26, type: u16}
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 8192, type: u32, unit: V, scale: 0.001}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 8194, type: u32, unit: V, scale: 0.001}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 8196, type: u32, unit: V, scale: 0.001}
  - {key: l1_current, label: Current L1, table: holding, address: 8198, type: u32, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: holding, address: 8200, type: u32, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: holding, address: 8202, type: u32, unit: A, scale: 0.001}
  - {key: x.charge_duration, label: Charge duration, table: holding, address: 8204, type: u32, unit: s}
  - {key: session_energy, label: Energy session, table: holding, address: 8206, type: u32, unit: kWh, scale: 2.777777778e-07, note: Ws on the wire; OpenEMS divides by 3600 (whole Wh).}
  - {key: consumer_power, label: Active power, table: holding, address: 8208, type: s32, unit: W, positive: consumption}
  - {key: x.available_current_capacity, label: Available current capacity, table: holding, address: 8210, type: u32, unit: A, scale: 0.001}
  - {key: consumer_energy, label: Active production energy, table: holding, address: 8214, type: u32, unit: kWh, scale: 0.001}
  - {key: l1_power, label: Active power L1, table: holding, address: 8216, type: s32, unit: W, positive: consumption}
  - {key: l2_power, label: Active power L2, table: holding, address: 8218, type: s32, unit: W, positive: consumption}
  - {key: l3_power, label: Active power L3, table: holding, address: 8220, type: s32, unit: W, positive: consumption}

enums:
  evse_state: {'0': State not yet determined, '1': 'Vehicle state A, not connected', '2': 'Vehicle state B, connected', '3': 'Vehicle state C, charging', '4': 'Vehicle state D, charging with ventilation', '5': 'Error: control signal (CP)', '6': 'Error: residual current detected', '7': 'Error: no grounding', '8': 'Error: stuck relay', '9': 'Error: residual current sensor test failed', '10': 'Error: over temperature', '11': 'Error: over current', '12': 'Error: I2C bus fault', '13': 'Error: vehicle fault (state E)', '14': 'Error: over humidity', '15': 'Error: phase misconnected', '16': 'Error: overvoltage', '17': 'Error: undervoltage on AC supply', '18': 'Charger disabled, not functioning', '19': Booting, '21': 'Error: unknown power board', '24': State undetermined, '25': Uploading VoltieMeter firmware}
  charge_stop_reason: {'0': 'None, charging in progress', '1': Unspecified reason, '2': Preset charge duration reached, '3': Preset energy amount charged, '4': Stopped by the user, '5': 'Error: residual current detected', '6': 'Charger disabled, out of order', '7': Firmware restart, '8': 'Charger in sleep mode, out of order', '9': 'Error: no voltage on the output', '10': Vehicle disconnected, '11': Vehicle not accepting charge, '12': 'Error: I2C bus fault', '13': 'Error: residual current sensor test failed', '14': 'Error: over temperature', '15': 'Error: control signal (CP)', '17': 'Error: stuck relay', '18': 'Error: over current', '21': 'Error: over humidity', '22': 'Error: phase misconnected', '100': Not enough free building current available (dynamic load management), '101': Not enough solar current available (eco/green mode), '102': Grid voltage is not high enough (grid-controlled mode), '103': Charge current limit set to zero, '105': 'Error: overvoltage', '106': 'Error: vehicle fault', '107': 'Error: undervoltage on AC supply', '108': Vehicle in state D while state D is disabled, '109': 'Error: unknown power board'}

notes:
- 'The Modbus TCP server is a gateway to the charger''s control unit: it forwards one request at a time and answers only in
  the gaps of its own polling (about every 500 ms), so OpenEMS reads one block per cycle.'
- Writes only with function 6; function 16 is rejected (exception 1). OpenEMS writes the current limit at most every 5 s.
- Registers 0–26 as one block need firmware build 357 or later; OpenEMS requires build 370 (where the lifetime energy at 0x2016
  includes the running session).
- Registers 16 and 17 must not be written (17 forces Modbus control on).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
