modbusspec: 0
id: spelsberg-smart-pro
manufacturer: Spelsberg
name: SMART PRO
kind: charger

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evcs.spelsberg/src/io/openems/edge/evcs/spelsberg/smart/EvcsSpelsbergSmartImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.charge_point_state, label: State of the charging device, table: holding, address: 1000, type: u16, enum: charge_point_state}
  - {key: x.evse_state, label: State of the charging station, table: holding, address: 1002, type: u16, enum: evse_state}
  - {key: x.cable_state, label: State of the cable socket connection, table: holding, address: 1004, type: u16, enum: cable_state}
  - {key: l1_current, label: Current L1, table: holding, address: 1008, type: u16, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: holding, address: 1010, type: u16, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: holding, address: 1012, type: u16, unit: A, scale: 0.001}
  - {key: consumer_power, label: Active power, table: holding, address: 1020, type: u32, unit: W, positive: consumption}
  - {key: x.power_total, label: Sum of active charging power, table: holding, address: 1022, type: u32, unit: W}
  - {key: l1_power, label: Active power L1, table: holding, address: 1024, type: u32, unit: W, positive: consumption}
  - {key: l2_power, label: Active power L2, table: holding, address: 1028, type: u32, unit: W, positive: consumption}
  - {key: l3_power, label: Active power L3, table: holding, address: 1032, type: u32, unit: W, positive: consumption}
  - {key: consumer_energy, label: Active production energy, table: holding, address: 1036, type: u32, unit: kWh, scale: 0.001}
  - {key: x.max_hardware_current, label: Maximal charging current of the hardware, table: holding, address: 1100, type: u16, unit: A}
  - {key: x.min_hardware_current, label: Minimum charging current of the hardware, table: holding, address: 1102, type: u16, unit: A}
  - {key: session_energy, label: Sum of charged energy for the current session in Wh, table: holding, address: 1502, type: u16, unit: kWh, scale: 0.001}
  - {key: x.charge_start_time, label: Start time of charging process, table: holding, address: 1504, type: u32}
  - {key: x.charge_duration_session, label: Duration of the current session in Wh, table: holding, address: 1508, type: u32, unit: s}
  - {key: x.charge_stop_time, label: Stop time of charging process, table: holding, address: 1512, type: u32}
  - {key: x.charge_save_current_limit, label: Maximum charging current under communication failure, table: holding, address: 2000, type: u16, unit: A}
  - {key: x.apply_charge_power_limit, label: Maximum charging power limit, table: holding, address: 5000, type: u32, unit: W, writable: true}
  - {key: x.apply_charge_current_limit, label: Maximum charging current limit, table: holding, address: 5004, type: u16, unit: A, writable: true}
  - {key: x.life_bit, label: Heartbeat toggle bit, table: holding, address: 6000, type: u16, writable: true}

enums:
  charge_point_state: {'0': No vehicle attached, '1': 'Vehicle attached, no permission (preparing)', '3': Charging, '4': Charging paused, '7': Charging error, '8': Charging station reserved}
  evse_state: {'0': Starting, '1': Running, '2': Error}
  cable_state: {'0': No cable attached, '1': 'Cable attached, no car attached', '2': 'Cable attached, car attached', '3': 'Cable attached, car attached and locked'}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
