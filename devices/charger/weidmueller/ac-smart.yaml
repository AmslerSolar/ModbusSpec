modbusspec: 0
id: weidmueller-ac-smart
manufacturer: Weidmüller
name: AC SMART wallbox (ECO, VALUE, ADVANCED)
kind: charger

sources:
- title: Modbus-Register – AC SMART ECO / VALUE / ADVANCED (document 2933050000)
  version: 02 (06/2023)
  url: https://assets.dam.weidmueller.com/assets/api/3d9e48ca-2295-4250-80a3-da9b723d953b/Original/2933050000_02_06-2023_AC-SMART_Modbus-Register_2LANG.pdf
  sha256: 1fd511b76f81a3adf28b455f851576b16594913263d63d9ffec223d70774e625
  archive_url: https://web.archive.org/web/20260410172744/https://assets.dam.weidmueller.com/assets/api/3d9e48ca-2295-4250-80a3-da9b723d953b/Original/2933050000_02_06-2023_AC-SMART_Modbus-Register_2LANG.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 880
    type: str
    length: 8
  checks:
  - table: holding
    address: 993
    type: u16
    range:
    - 0
    - 2
  # serial number; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 880
    type: str
    length: 8
    printable: true

defaults:
  verified: false

models:
  - {id: eco, name: AC SMART ECO, match: {table: holding, address: 993, type: u16, equals: 0}}
  - {id: value, name: AC SMART VALUE, match: {table: holding, address: 993, type: u16, equals: 1}}
  - {id: advanced, name: AC SMART ADVANCED, match: {table: holding, address: 993, type: u16, equals: 2}}

points:
  # Identity
  - {key: firmware, label: GD_ID_SC_FW_VERSION, table: holding, address: 846, type: str, length: 6, poll: slow}
  - {key: x.hardware_version, label: GD_ID_SC_HW_VERSION, table: holding, address: 852, type: str, length: 6, poll: slow}
  - {key: x.article_number, label: GD_ID_SC_WM_ARTICLENUMBER, table: holding, address: 875, type: str, length: 5, poll: slow}
  - {key: serial, label: GD_ID_SC_WM_SERIALNUMBER, table: holding, address: 880, type: str, length: 8, poll: slow, note: 15 characters.}
  - {key: x.variant, label: GD_ID_SC_VARIANT, table: holding, address: 993, type: u16, enum: variant, poll: slow}

  # Charging state
  - {key: x.current_setting, label: GD_ID_EVCC_ACTUAL_CURRENT_SETTING, table: holding, address: 300, type: u16, unit: A, note: Current signalled to the car.}
  - {key: x.car_state, label: GD_ID_EVCC_CAR_STATE, table: holding, address: 301, type: u16, enum: car_state, note: One ASCII letter (A–F) in the register.}
  - {key: state, label: GD_ID_EVCC_EVSE_STATE, table: holding, address: 302, type: u16, enum: evse_state}
  - {key: x.relay_active, label: GD_ID_EVCC_RELAIS_ACITVE, table: holding, address: 303, type: u16, enum: inactive_active}
  - {key: x.pwm_active, label: GD_ID_EVCC_PWM_ACTIVE, table: holding, address: 304, type: u16}
  - {key: x.charging_time, label: GD_ID_EVCC_CHARGING_TIME, table: holding, address: 305, type: u32, unit: s, note: From authorisation to de-authorisation.}
  - {key: x.station_available, label: GD_ID_EVCC_CHARGING_STATION_AVAILABLE, table: holding, address: 307, type: u16, note: 1 = available; otherwise maintenance mode.}
  - {key: x.cable_current_limit, label: GD_ID_EVCC_CABLE_CURRENT_LIMIT, table: holding, address: 308, type: s16, unit: A, invalid: [-1], note: Cable's PP rating; -1 on error.}
  - {key: x.lock_closed, label: GD_ID_EVCC_LOCKING_CLOSED, table: holding, address: 309, type: u16}
  - {key: x.charging_enabled, label: GD_ID_EVCC_ENABLE_CHARGING, table: holding, address: 310, type: u16, note: Charge release given.}
  - {key: x.cable, label: GD_ID_EVCC_CABLE, table: holding, address: 311, type: u16, enum: cable, poll: slow}
  - {key: x.phases, label: GD_ID_EVCC_PHASES, table: holding, address: 317, type: u16, enum: phases, writable: true, persistent: true, poll: slow}
  - {key: x.installed_phases, label: GD_ID_EVCC_INSTALLED_PHASES, table: holding, address: 319, type: u16, poll: slow, note: 0 = single-phase; other values aren't listed.}
  - {key: x.connection_duration, label: GD_ID_EVCC_CONNECTION_DURATION, table: holding, address: 322, type: u32, unit: s, note: How long a car has been connected.}
  - {key: x.din_current_reduction, label: GD_ID_DIN_CURRENT_REDUCTION, table: holding, address: 111, type: u16, unit: '%', note: Current reduction set by the digital inputs.}

  # Charging meter
  - {key: l1_voltage, label: GD_ID_CM_VOLTAGE_PHASE_1, table: holding, address: 400, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: l2_voltage, label: GD_ID_CM_VOLTAGE_PHASE_2, table: holding, address: 402, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: l3_voltage, label: GD_ID_CM_VOLTAGE_PHASE_3, table: holding, address: 404, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: l1_current, label: GD_ID_CM_CURRENT_PHASE_1, table: holding, address: 406, type: u32, unit: A, scale: 0.001, note: mA.}
  - {key: l2_current, label: GD_ID_CM_CURRENT_PHASE_2, table: holding, address: 408, type: u32, unit: A, scale: 0.001, note: mA.}
  - {key: l3_current, label: GD_ID_CM_CURRENT_PHASE_3, table: holding, address: 410, type: u32, unit: A, scale: 0.001, note: mA.}
  - {key: consumer_power, label: GD_ID_CM_ACTIVE_POWER, table: holding, address: 418, type: u32, unit: W, scale: 0.001, positive: consumption, note: 'mW, sum of the phases. Unsigned, so positive = consumption (derived).'}
  - {key: reactive_power, label: GD_ID_CM_REACTIVE_POWER, table: holding, address: 420, type: u32, unit: var, scale: 0.001, note: mvar.}
  - {key: apparent_power, label: GD_ID_CM_APPARENT_POWER, table: holding, address: 422, type: u32, unit: VA, scale: 0.001, note: mVA.}
  - {key: x.power_factor_raw, label: GD_ID_CM_POWER_FACTOR, table: holding, address: 424, type: u32, note: The document gives no scale.}
  - {key: frequency, label: GD_ID_CM_MAIN_FREQUENZY, table: holding, address: 426, type: u32, unit: Hz, note: The document says Hz in an integer register; a finer unit (e.g. mHz) is possible.}
  - {key: session_energy, label: GD_ID_CM_CONSUMED_ENERGY_LAST_CHARGING_WH, table: holding, address: 430, type: u32, unit: kWh, scale: 0.001, note: 'Wh, last (or current) charge; 428 holds the same in Ws.'}
  - {key: temperature, label: GD_ID_CM_TEMPERATURE, table: holding, address: 432, type: s16, unit: °C, note: The document gives no unit or scale.}
  - {key: x.measure_type, label: GD_ID_CM_MESSURE_TYPE, table: holding, address: 434, type: u16, enum: measure_type, poll: slow}
  - {key: x.energy_meter_detected, label: GD_ID_CM_ENERGY_METER_DETECTED, table: holding, address: 442, type: str, length: 11, poll: slow}
  - {key: consumer_energy, label: GD_ID_CM_CONSUMED_ENERGY_TOTAL_WH, table: holding, address: 457, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Wh; 453 holds the same in Ws.}

  # House connection (external meter)
  - {key: x.house_voltage_l1, label: GD_ID_CM_HOUSE_VOLTAGE_PHASE_1, table: holding, address: 461, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: x.house_voltage_l2, label: GD_ID_CM_HOUSE_VOLTAGE_PHASE_2, table: holding, address: 463, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: x.house_voltage_l3, label: GD_ID_CM_HOUSE_VOLTAGE_PHASE_3, table: holding, address: 465, type: u32, unit: V, scale: 0.001, note: mV.}
  - {key: x.house_current_l1, label: GD_ID_CM_HOUSE_CURRENT_PHASE_1, table: holding, address: 467, type: s32, unit: A, scale: 0.001, note: 'mA, signed; direction not stated.'}
  - {key: x.house_current_l2, label: GD_ID_CM_HOUSE_CURRENT_PHASE_2, table: holding, address: 469, type: s32, unit: A, scale: 0.001, note: 'mA, signed; direction not stated.'}
  - {key: x.house_current_l3, label: GD_ID_CM_HOUSE_CURRENT_PHASE_3, table: holding, address: 471, type: s32, unit: A, scale: 0.001, note: 'mA, signed; direction not stated.'}
  - {key: x.house_power, label: GD_ID_CM_HOUSE_ACTIVE_POWER, table: holding, address: 473, type: s32, unit: W, scale: 0.001, note: 'mW at the house connection, signed; the document doesn''t say whether import or export is positive.'}
  - {key: x.house_energy, label: GD_ID_CM_HOUSE_CONSUMED_ENERGY_TOTAL, table: holding, address: 483, type: s64, unit: kWh, scale: 1.0e-06, poll: slow, note: mWh.}

  # Limits and authorisation
  - {key: x.evse_current_limit, label: GD_ID_AUT_EVSE_CURRENT_LIMIT, table: holding, address: 700, type: u16, unit: A, poll: slow, note: The wallbox's own limit.}
  - {key: x.installation_current_limit, label: GD_ID_AUT_INSTALLATION_CURRENT_LIMIT, table: holding, address: 701, type: u16, unit: A, writable: true, persistent: true, poll: slow}
  - {key: x.user_current_limit, label: GD_ID_AUT_USER_CURRENT_LIMIT, table: holding, address: 702, type: u16, unit: A, writable: true, persistent: true, poll: slow, note: For dynamic control use 11052.}
  - {key: x.plug_and_charge, label: GD_ID_AUT_PLUG_AND_CHARGE_ACTIVE, table: holding, address: 704, type: u16, enum: inactive_active, writable: true, persistent: true, poll: slow, note: Charging without authorisation.}
  - {key: x.external_enable_charging, label: GD_ID_AUT_EXTERNAL_ENABLE_CHARGING, table: holding, address: 705, type: u16, enum: external_release, writable: true, persistent: false, note: 'Charge release from web page, app or Modbus.'}
  - {key: x.availability, label: GD_ID_AUT_AVAILABILITY, table: holding, address: 707, type: u16, writable: true, persistent: true, poll: slow, note: Available / maintenance mode. Values not listed.}
  - {key: x.auth_method, label: GD_ID_AUT_USED_METHOD, table: holding, address: 709, type: u16, enum: auth_method}
  - {key: x.current_limit_reason, label: GD_ID_AUT_CURRENT_LIMIT_REASON, table: holding, address: 714, type: u16, note: Limiting factor of the current setting; values not listed.}
  - {key: x.current_limit_minimal, label: GD_ID_AUT_CURRENT_LIMIT_MINIMAL, table: holding, address: 715, type: u16, unit: A, note: 'Lowest current limit, without load management.'}
  - {key: x.charging_id, label: GD_ID_AUT_CHARGING_ID, table: holding, address: 716, type: u32, poll: slow, note: Running number of the charging session.}
  - {key: x.lcm_current_limit, label: GD_ID_LCM_ACTUAL_CURRENT_LIMIT, table: holding, address: 11052, type: u16, unit: A, writable: true, persistent: false, note: Current set by load / charge management.}
  - {key: x.lcm_charge_mode, label: GD_ID_LCM_CURRENT_CHARGE_MODE, table: holding, address: 11055, type: u16, enum: charge_mode}

  # Errors
  - {key: x.errors, label: GD_ID_ERM_MODBUS_0, table: holding, address: 10000, type: u64, note: 'Error code, one bit per error; the bits aren''t named in the document. The error list (10010–10656) holds the entries as 67-byte objects of undocumented layout.'}

enums:
  variant: {'0': ECO, '1': VALUE, '2': ADVANCED}
  car_state: {'65': A, '66': B, '67': C, '68': D, '69': E, '70': F}
  evse_state: {'0': 'Idle, no car, no error', '1': Locking cable, '2': Unlocking cable, '3': Waiting for authorisation, '4': RCMB self-test, '5': Car connected (B1), '6': B2, '7': 'Wake-up, negative voltage', '8': 'Wake-up, no voltage', '9': Checking car awake after negative voltage, '10': Checking car awake after no voltage, '11': Charging (C2), '12': Charging paused (C1), '13': Cable pulled during PWM (A2), '14': Error state (-12 V), '15': 'Error, charging stopped (12 V)'}
  inactive_active: {'0': Inactive, '1': Active}
  cable: {'0': Fixed cable, '1': Socket}
  phases: {'0': Single-phase, '1': Three-phase}
  measure_type: {'0': None, '1': Internal, '2': Energy meter}
  external_release: {'0': None, '1': Accepted (external), '2': Whitelist accepted, '3': Whitelist rejected}
  auth_method: {'0': None, '1': Plug and charge, '2': RFID, '3': External, '4': Key switch, '5': OCPP}
  charge_mode: {'0': Booster, '1': Mixed, '2': Pure}

problems:
  - {when: {key: state, equals: 14}, kind: fault, text: 'Charging station error state (-12 V, state 14)'}
  - {when: {key: state, equals: 15}, kind: fault, text: 'Error, charging stopped (state 15)'}
  - {when: {key: x.car_state, equals: 69}, kind: fault, text: Vehicle state E}
  - {when: {key: x.car_state, equals: 70}, kind: fault, text: Vehicle state F}
  - {when: {key: x.errors, not: 0}, kind: fault, text: 'Charging station error (bits 0x{value:X})'}

notes:
- The document lists only register numbers ("ID"), data type, size in bytes and access; it doesn't say which function code,
  whether numbering starts at 0, word order, port or unit id. Holding registers (function 03) at the listed number as 0-based
  address, most significant word first, port 502 and unit id 1 are assumptions, so every point is unverified.
- 'Register counts follow the byte sizes: 1–2 bytes = one register, 4 = two, 8 = four; strings take bytes / 2 rounded up.'
- Registers marked non-volatile have limited write cycles; the document forbids writing them cyclically. 11052 (load-management
  current) and 705 (external release) are volatile.
- 'State 12: the English text says C2, the German C1; C1 (paused) is used. RS485 settings of the external interface are configurable
  (500–504) but not documented as a slave port for this map.'
- 'Left out: digital input/output configuration (100–118, 200–203), network, Wi-Fi, Bluetooth, modem, OCPP and time settings
  (800–995, 6000–8546), RFID tags and whitelist (1000–1722), the external meter configuration (5600–5677), house-connection
  reactive / apparent power, power factor and frequency (475–481), load-management configuration (11000–11054 except 11052)
  and satellite IPs (12000…).'
