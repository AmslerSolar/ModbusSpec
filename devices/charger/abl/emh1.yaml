# Written from ABL's Modbus-ASCII interface description for the eMH1 (EVCC2/3 API subset, Rev. B; see sources).

modbusspec: 0
id: abl-emh1
manufacturer: ABL
name: eMH1 wallbox (EVCC2/3 charge controller)
kind: charger

sources:
- title: EVCC2/3 API subset for external applications (05 0015 20), published by ABL as "API Dokumentation Wallbox eMH1 –
    Schnittstellenbeschreibung Modbus-ASCII"
  version: Rev. B (2020-03-12)
  url: https://www.ablmobility.de/global/downloads/anleitungen/emh1/Schnittstellenbeschreibung_Modbus-ASCII.pdf
  sha256: 02098df2fb83127b00a221105c76bbc5085a0fa0b596ebf2a15b2e65c514f494
  archive_url: https://web.archive.org/web/20220404075650/https://www.ablmobility.de/global/downloads/anleitungen/emh1/Schnittstellenbeschreibung_Modbus-ASCII.pdf
- id: abl-emh1-modbus
  title: abl_emh1_modbus (Home Assistant integration)
  url: https://github.com/matfroh/abl_emh1_modbus
  license: GPL-3.0
  commit: 29179afcd3c7bc4e48f312e59b7ae24c779324a5
  path: custom_components/ev_charger_modbus/modbus_device.py, custom_components/ev_charger_modbus/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - ascii
  serial:
    baud: 38400
    format: 8E1
  limits:
    max_registers: 8
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # first byte echoes register 0x01
  - table: holding
    address: 1
    type: u16
    range:
    - 256
    - 511

points:
  # 0x0001–0x0002: device id, firmware and configuration (read both registers together)
  - {key: x.reply_echo_1, label: Reply register number (0x0001), table: holding, address: 1, type: u16, bits: [8, 15], poll: slow, note: The controller puts the low byte of the start address in the first data byte of each reply; always 0x01 here. Not a value.}
  - {key: x.hardware_version, label: Hardware (pcba), table: holding, address: 1, type: u16, bits: [6, 7], enum: hardware_version, poll: slow}
  - {key: x.device_id, label: Device-ID, table: holding, address: 1, type: u16, bits: [0, 5], poll: slow, note: '1–16, default 1.'}
  - {key: x.firmware_major, label: Major revision, table: holding, address: 2, type: u16, bits: [12, 15], poll: slow}
  - {key: x.firmware_minor, label: Minor revision, table: holding, address: 2, type: u16, bits: [8, 11], poll: slow, note: The document's example 0x1237 reads V1.2.}
  - {key: x.config, label: Configuration bits, table: holding, address: 2, type: u16, bits: [0, 7], flags: config_bits, poll: slow, note: 'Bits 1–0 are a field for the enable input: 00 no function, 01 must be closed for B1→B2, 10 closed = outlet enabled, 11 invalid.'}

  # 0x0003: Modbus settings
  - {key: x.reply_echo_3, label: Reply register number (0x0003), table: holding, address: 3, type: u16, bits: [8, 15], poll: slow, note: Always 0x03.}
  - {key: x.modbus_stop_bits, label: Stop bits, table: holding, address: 3, type: u16, bits: [6, 7], enum: stop_bits, poll: slow}
  - {key: x.modbus_parity, label: Parity, table: holding, address: 3, type: u16, bits: [4, 5], enum: parity, poll: slow}
  - {key: x.modbus_baud, label: Baud rate, table: holding, address: 3, type: u16, bits: [0, 3], enum: baud, poll: slow}

  # 0x0005: modify state (write only)
  - {key: x.outlet_command, label: Modify state, table: holding, address: 5, type: u16, enum: outlet_command, writable: true, write_only: true, note: Broadcast allowed. 0xE0E0 (disable) and 0xE2E2 are the normal commands; other values must not be used.}

  # 0x0006–0x0007: system flags (read both registers together)
  - {key: x.reply_echo_6, label: Reply register number (0x0006), table: holding, address: 6, type: u16, bits: [8, 15], note: Always 0x06.}
  - {key: x.state_machine_pointer, label: Pointer of state-machine, table: holding, address: 6, type: u16, bits: [0, 7]}
  - {key: x.system_flags, label: System flags, table: holding, address: 7, type: u16, flags: system_bits}
  - {key: x.overcurrent_level, label: EV current against Ic, table: holding, address: 7, type: u16, bits: [0, 2], enum: overcurrent_level}

  # 0x0014: set Icmax (write only)
  - {key: x.charging_current_setpoint, label: Set Icmax, table: holding, address: 20, type: u16, unit: '%', scale: 0.1, writable: true, write_only: true, min: 8, max: 100, note: 'Broadcast allowed. PWM duty cycle; 100 % means no current allowed. The current follows from the IEC 61851-1 duty-cycle table (e.g. 16.6 % = 10 A, 26.6 % = 16 A). Rev. B corrected this register.'}

  # 0x002C: set device-ID (write only)
  - {key: x.device_setup, label: Set device-ID, table: holding, address: 44, type: u16, writable: true, write_only: true, note: 'Outlet must be in state E2. Bits 15–14: 01 disables / 10 enables the upstream timeout and failure F4; bits 13–12: 01 go to B2 / 10 stay in B1 after a power cycle with car connected (00 and 11 = no change); bits 7–0: device-ID 1–16. Rev. B corrected this register.'}

  # 0x002E–0x0032: state, inputs, Ic and phase currents in 0.1 A (read all five registers together)
  - {key: x.reply_echo_46, label: Reply register number (0x002E), table: holding, address: 46, type: u16, bits: [8, 15], note: Always 0x2E.}
  - {key: x.state_full, label: State of EVSE, table: holding, address: 46, type: u16, bits: [0, 7], enum: state}
  - {key: x.ev_connected, label: UCP ≤ 10 V, table: holding, address: 47, type: u16, bits: [15, 15], enum: ucp, note: Not valid in E and F states.}
  - {key: x.duty_reduced, label: Duty cycle reduced (BC3–BC6), table: holding, address: 47, type: u16, bits: [14, 14]}
  - {key: x.en2_closed, label: EN2 closed, table: holding, address: 47, type: u16, bits: [13, 13]}
  - {key: x.en1_closed, label: EN1 closed, table: holding, address: 47, type: u16, bits: [12, 12]}
  - {key: x.duty_cycle, label: Duty cycle Ic, table: holding, address: 47, type: u16, bits: [0, 11], unit: '%', scale: 0.1, note: '0–1000 = 0–100 % (the current the car may take, as PWM duty cycle).'}
  - {key: l1_current, label: Ict1, table: holding, address: 48, type: u16, unit: A, scale: 0.1, invalid: [1000], note: 0–800 = 0–80 A; 1000 (0x03E8) = no phase meter or state A.}
  - {key: l2_current, label: Ict2, table: holding, address: 49, type: u16, unit: A, scale: 0.1, invalid: [1000]}
  - {key: l3_current, label: Ict3, table: holding, address: 50, type: u16, unit: A, scale: 0.1, invalid: [1000]}

  # 0x0033–0x0035: state and phase currents in whole amperes (read all three registers together)
  - {key: x.reply_echo_51, label: Reply register number (0x0033), table: holding, address: 51, type: u16, bits: [8, 15], note: Always 0x33.}
  - {key: x.ev_connected_short, label: UCP ≤ 10 V (short read), table: holding, address: 51, type: u16, bits: [7, 7], enum: ucp, note: Not valid in E and F states; bits 6–0 are 0.}
  - {key: state, label: State of EVSE (short read), table: holding, address: 52, type: u16, bits: [8, 15], enum: state}
  - {key: x.current_l1_amps, label: Ict1 (1 A), table: holding, address: 52, type: u16, bits: [0, 7], unit: A, note: 0–80 A; 100 (0x64) = no phase meter or state A.}
  - {key: x.current_l2_amps, label: Ict2 (1 A), table: holding, address: 53, type: u16, bits: [8, 15], unit: A, note: 100 (0x64) = no phase meter or state A.}
  - {key: x.current_l3_amps, label: Ict3 (1 A), table: holding, address: 53, type: u16, bits: [0, 7], unit: A, note: 100 (0x64) = no phase meter or state A.}

  # 0x0050–0x0057: serial number (only in the document's frame examples)
  - {key: x.reply_echo_80, label: Reply register number (0x0050), table: holding, address: 80, type: u16, bits: [8, 15], poll: slow, verified: false, note: Always 0x50.}
  - {key: serial, label: Serial number, table: holding, address: 81, type: str, length: 7, poll: slow, verified: false, note: 'Only shown as a frame example (read 8 registers from 0x0050): 0x0050 holds the echo byte and 0x00, then 14 ASCII characters, e.g. 2W22xy01234567.'}
  - {key: x.max_current_setting, label: Maximum current setting, table: holding, address: 15, type: u16, unit: A, scale: 0.004098360656, note: Hardware current limit; the project divides by 244 and rounds to whole amperes (16 or 32 A)., verified: false, sources: [abl-emh1-modbus]}

enums:
  hardware_version: {'0': pcba 141215, '1': pcba 160307, '2': pcba 170725, '3': Not used}
  stop_bits: {'0': 1 stop bit, '3': 2 stop bits}
  parity: {'0': None, '1': Odd, '2': Even, '3': Invalid}
  baud: {'0': Reserved, '5': 9600 Bd, '6': 19200 Bd, '7': 38400 Bd, '8': 57600 Bd}
  outlet_command: {'14392': 'Enable load imbalance detection (20 A), needs E2', '23130': Reset, '41377': Go to state A1 (needs E0 or E2), '57568': Go to state E0 (outlet disabled), '58082': Go to state E2 (needs A1 or E0), '61937': Go to state F1 (trips the RCD if configured)}
  overcurrent_level: {'0': EV current ≤ 100 % of Ic, '1': 100–105 % of Ic, '5': 105–110 % of Ic (fault after 1000 s), '3': 110–120 % of Ic (fault after 100 s), '7': Above 120 % of Ic (fault after 10 s)}
  ucp: {'0': UCP > 10 V (no car), '1': UCP ≤ 10 V (car connected)}
  state: {'161': A1 – waiting for car, '177': B1 – car asks to charge, '178': B2 – car may charge, '194': C2 – charging, '195': 'C3 – charging, current reduced (F16, F17)', '196': 'C4 – charging, current reduced (imbalance F15)', '224': E0 – outlet disabled, '225': E1 – production test, '226': E2 – setup mode, '227': E3 – bus idle, '241': F1 – contact welded, '242': F2 – internal error, '243': F3 – DC residual current, '244': F4 – upstream communication timeout, '245': F5 – socket lock failed, '246': F6 – CS out of range, '247': F7 – car requests state D, '248': F8 – CP out of range, '249': F9 – overcurrent, '250': F10 – temperature out of limits, '251': F11 – contact opened unintentionally}

flags:
  config_bits: {'2': Welding detection enabled, '3': Socket enabled, '4': Internal RDC-MD enabled, '5': Internal phase-current meter enabled, '6': Upstream timeout enabled, '7': Coding resistor (CS) reading enabled}
  system_bits: {'4': B1→B2 disabled, '5': A1→B1 disabled, '6': Internal phase-current meter failed (BC4), '7': Board temperature 60–80 °C (BC5), '8': Load imbalance detected (BC3), '9': Upstream communication lost (BC6), '13': China limits for CP detection, '14': B1→B2 disabled after power cycle, '15': Upstream timeout triggers F4 instead of F14}

problems:
  - {when: {key: state, equals: 241}, kind: fault, text: 'F1: contactor welded'}
  - {when: {key: state, equals: 242}, kind: fault, text: 'F2: internal error'}
  - {when: {key: state, equals: 243}, kind: fault, text: 'F3: DC residual current detected'}
  - {when: {key: state, equals: 244}, kind: fault, text: 'F4: upstream communication timeout'}
  - {when: {key: state, equals: 245}, kind: fault, text: 'F5: socket lock failed'}
  - {when: {key: state, equals: 246}, kind: fault, text: 'F6: CS out of range'}
  - {when: {key: state, equals: 247}, kind: fault, text: 'F7: car requests state D'}
  - {when: {key: state, equals: 248}, kind: fault, text: 'F8: CP out of range'}
  - {when: {key: state, equals: 249}, kind: fault, text: 'F9: overcurrent'}
  - {when: {key: state, equals: 250}, kind: fault, text: 'F10: temperature out of limits'}
  - {when: {key: state, equals: 251}, kind: fault, text: 'F11: contactor opened unintentionally'}
  - {when: {key: x.system_flags, bit: 6}, kind: warning, text: Internal phase-current meter failed}
  - {when: {key: x.system_flags, bit: 7}, kind: warning, text: Board temperature above 60 °C}
  - {when: {key: x.system_flags, bit: 8}, kind: warning, text: Load imbalance detected}
  - {when: {key: x.system_flags, bit: 9}, kind: warning, text: Upstream communication lost}

notes:
- Modbus ASCII over RS485 (frames ':' … LRC CR LF), 38400 Bd 8E1 by default; device-ID 1–16, 0 = broadcast. Only function
  0x03 (read) and 0x10 (write) exist. Over Ethernet only through a transparent serial server, not a Modbus TCP gateway (default_port
  is meaningless here).
- 'Read each block exactly as the document defines it: 0x0001 ×2, 0x0003 ×1, 0x0006 ×2, 0x002E ×5, 0x0033 ×3, 0x0050 ×8. Addresses
  are the document''s hex register numbers (0-based protocol addresses).'
- Every reply carries the low byte of the start address in its first data byte (the document says so for reads); the x.reply_echo_*
  points mark those bytes. Read as plain registers, the values sit in the bits given here.
- 'Without a reply the request failed: the controller stays silent on bad frames, unknown functions and invalid registers;
  a failed write answers exception 0x04.'
- State codes are the state names read as hex (A1 = 0xA1, E0 = 0xE0, F1 = 0xF1 …); F10 and F11 are taken as 0xFA and 0xFB
  (not spelled out). The document's example labels 0xC3 as "State C2 (I > 1 A)" while its state table calls C3 a reduced-current
  state.
- Current setpoint and outlet state are write-only (0x0014, 0x0005, 0x002C); the document gives no read-back.
- ABL publishes this document only for the eMH1; for the eMH2 / eMH3 it documents OCPP, not Modbus. The eM4 has its own Modbus
  TCP map (abl-em4).
- 'Left out: Firmware version (minor) (holding 1, u16) from abl-emh1-modbus overlaps x.hardware_version from the documents.'
- 'Left out: Hardware version (holding 2, u16) from abl-emh1-modbus overlaps x.config from the documents.'
- 'Left out: Serial number (holding 80, str) from abl-emh1-modbus overlaps x.reply_echo_80 from the documents.'
- Transport is Modbus ASCII over RS485 (frames ':'…LRC CR LF), not Modbus RTU; 8 data bits, even parity, 1 stop bit, 38400
  baud by default. Over TCP only through a transparent serial server (e.g. Elfin EW11) passing the ASCII frames through, not
  a Modbus TCP gateway.
- The eMH1 may need a wake-up read (function 03 at 0x0001, count 2) before it answers; the project sends it to unit 0 and
  unit 1.
- Several replies repeat the low byte of the start address as the first data byte (0x002E, 0x0033, 0x0050); read as plain
  registers, the values are at the positions given here.
- State values 0xA1-0xC4 mean the outlet is enabled (waiting, connected, charging); 0xE0-0xE3 disabled or idle; 0xF1-0xFB
  errors.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
