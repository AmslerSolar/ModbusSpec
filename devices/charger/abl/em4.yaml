# Written from ABL's Modbus TCP interface description for the Wallbox eM4 Controller / Extender (see sources).

modbusspec: 0
id: abl-em4
manufacturer: ABL
name: Wallbox eM4 Single / Twin (Controller / Extender)
kind: charger

sources:
- title: Modbus TCP – Schnittstellenbeschreibung Wallbox eM4 Controller / Extender
  version: R 01 (19.12.2023)
  url: https://www.ablmobility.de/global/downloads/anleitungen/em4/20230905_Schnittstellenbeschreibung_ModbusTCP_WallboxeM4_Controller_Extender.pdf
  sha256: 5d466104eb747ee279a5d88188c83893ecfd25126b40eb604a0fa0d8315a1b8c
  archive_url: https://web.archive.org/web/20240805023636/https://www.ablmobility.de/global/downloads/anleitungen/em4/20230905_Schnittstellenbeschreibung_ModbusTCP_WallboxeM4_Controller_Extender.pdf
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.evcs.abl/src/io/openems/edge/evcs/abl/EvcsAblImpl.java

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp
  limits:
    max_registers: 125
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 272
    type: str
    length: 16
  checks:
  - table: holding
    address: 3
    type: u16
    equals: 0
  # controller type
  - table: holding
    address: 2
    type: u16
    in:
    - 0
    - 1
  # product type (SAP number)
  - table: holding
    address: 256
    type: str
    length: 16
    printable: true
  # serial number
  - table: holding
    address: 272
    type: str
    length: 16
    printable: true

points:
  # Modbus endpoint (0x0001–0x00FF)
  - {key: x.api_revision_major, label: Revision API (major), table: holding, address: 1, type: u16, bits: [8, 15], poll: slow}
  - {key: x.api_revision_minor, label: Revision API (minor), table: holding, address: 1, type: u16, bits: [0, 7], poll: slow}
  - {key: x.controller_type, label: Typ Controller, table: holding, address: 2, type: u16, enum: controller_type, poll: slow}
  - {key: x.node_type, label: Node type, table: holding, address: 3, type: u16, enum: node_type, poll: slow}

  # Product (standalone: 0x0100–0x01FF; product n of a group: 0x0n00)
  - {key: x.product_type, label: Typ (SAP material number), table: holding, address: 256, type: str, length: 16, poll: slow}
  - {key: serial, label: S/N, table: holding, address: 272, type: str, length: 16, poll: slow}
  - {key: x.outlet_count, label: Ausführung (outlets), table: holding, address: 288, type: u16, bits: [8, 11], enum: outlet_count, poll: slow}
  - {key: x.connector, label: Ausführung (connector), table: holding, address: 288, type: u16, bits: [4, 7], enum: connector, poll: slow}
  - {key: x.phases, label: Ausführung (phases), table: holding, address: 288, type: u16, bits: [0, 3], enum: phases, poll: slow}
  - {key: x.outlet_left, label: Outlet# (left), table: holding, address: 289, type: u16, bits: [8, 15], poll: slow, note: Standalone 1.}
  - {key: x.outlet_right, label: Outlet# (right), table: holding, address: 289, type: u16, bits: [0, 7], poll: slow, note: Standalone 2.}
  - {key: x.firmware_major, label: FW-Revision (major), table: holding, address: 290, type: u16, bits: [12, 15], poll: slow}
  - {key: x.firmware_minor, label: FW-Revision (minor), table: holding, address: 290, type: u16, bits: [8, 11], poll: slow}
  - {key: x.firmware_patch, label: FW-Revision (patch), table: holding, address: 290, type: u16, bits: [0, 7], poll: slow}
  - {key: x.rated_current, label: Irated, table: holding, address: 291, type: u16, unit: A, scale: 0.1, poll: slow, note: 6–32 A.}
  - {key: x.default_current, label: Idefault, table: holding, address: 292, type: u16, unit: A, scale: 0.1, poll: slow, note: 'Maximum current from the installation, ≤ Irated.'}
  - {key: x.ar4100_voltage, label: Spannung AR4100, table: holding, address: 294, type: u16, unit: V, scale: 0.1, note: 0–12 V at the AR4100 control input; in a group only on the controller.}

  # Outlet 1 (standalone: left outlet, 0x3000–0x30FF; outlet n of a group: 0x3000 + (n−1)·0x100)
  - {key: x.outlet1_product, label: Produkt# (outlet 1), table: holding, address: 12288, type: u16, poll: slow}
  - {key: l1_current, label: Strom Zähler Phase 1 (outlet 1), table: holding, address: 12289, type: u32, unit: A, scale: 0.1}
  - {key: l2_current, label: Strom Zähler Phase 2 (outlet 1), table: holding, address: 12291, type: u32, unit: A, scale: 0.1}
  - {key: l3_current, label: Strom Zähler Phase 3 (outlet 1), table: holding, address: 12293, type: u32, unit: A, scale: 0.1}
  - {key: l1_voltage, label: Spannung Zähler Phase 1 (outlet 1), table: holding, address: 12295, type: u32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Spannung Zähler Phase 2 (outlet 1), table: holding, address: 12297, type: u32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Spannung Zähler Phase 3 (outlet 1), table: holding, address: 12299, type: u32, unit: V, scale: 0.1}
  - {key: consumer_power, label: Wirkleistung Zähler (outlet 1), table: holding, address: 12301, type: u32, unit: W, positive: consumption, verified: false, note: 'Unsigned, so positive = consumption (derived; the document gives no direction).'}
  - {key: consumer_energy, label: Zählerstand Wirkenergie (outlet 1), table: holding, address: 12303, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: state, label: Status outlet (outlet 1), table: holding, address: 12337, type: u16, enum: outlet_state}
  - {key: x.outlet1_state_group, label: Status outlet high nibble (outlet 1), table: holding, address: 12337, type: u16, bits: [4, 7], note: 15 = error (0x00Fx).}
  - {key: x.outlet1_icmax, label: Icmax (outlet 1), table: holding, address: 12338, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 32, note: 'Current limit from the energy manager: 0 or 6.0–32.0 A, ≤ Idefault.'}
  - {key: x.outlet1_ic, label: Ic (outlet 1), table: holding, address: 12339, type: u16, unit: A, scale: 0.1, note: 'Current the car may take: 0 or 6.0–32.0 A.'}

  # Outlet 2 (eM4 Twin standalone: right outlet, 0x3100–0x31FF)
  - {key: x.outlet2_product, label: Produkt# (outlet 2), table: holding, address: 12544, type: u16, poll: slow, note: Twin only.}
  - {key: x.outlet2_current_l1, label: Strom Zähler Phase 1 (outlet 2), table: holding, address: 12545, type: u32, unit: A, scale: 0.1}
  - {key: x.outlet2_current_l2, label: Strom Zähler Phase 2 (outlet 2), table: holding, address: 12547, type: u32, unit: A, scale: 0.1}
  - {key: x.outlet2_current_l3, label: Strom Zähler Phase 3 (outlet 2), table: holding, address: 12549, type: u32, unit: A, scale: 0.1}
  - {key: x.outlet2_voltage_l1, label: Spannung Zähler Phase 1 (outlet 2), table: holding, address: 12551, type: u32, unit: V, scale: 0.1}
  - {key: x.outlet2_voltage_l2, label: Spannung Zähler Phase 2 (outlet 2), table: holding, address: 12553, type: u32, unit: V, scale: 0.1}
  - {key: x.outlet2_voltage_l3, label: Spannung Zähler Phase 3 (outlet 2), table: holding, address: 12555, type: u32, unit: V, scale: 0.1}
  - {key: x.outlet2_power, label: Wirkleistung Zähler (outlet 2), table: holding, address: 12557, type: u32, unit: W}
  - {key: x.outlet2_energy, label: Zählerstand Wirkenergie (outlet 2), table: holding, address: 12559, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.outlet2_state, label: Status outlet (outlet 2), table: holding, address: 12593, type: u16, enum: outlet_state}
  - {key: x.outlet2_state_group, label: Status outlet high nibble (outlet 2), table: holding, address: 12593, type: u16, bits: [4, 7], note: 15 = error (0x00Fx).}
  - {key: x.outlet2_icmax, label: Icmax (outlet 2), table: holding, address: 12594, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 32}
  - {key: x.outlet2_ic, label: Ic (outlet 2), table: holding, address: 12595, type: u16, unit: A, scale: 0.1}

enums:
  controller_type: {'0': ESP32 (Extender), '1': SBC (Controller)}
  node_type: {'0': Server}
  outlet_count: {'0': One outlet, '1': Two outlets}
  connector: {'0': Cable, '1': Socket}
  phases: {'0': Single-phase, '1': Three-phase}
  outlet_state: {'160': 'Outlet blocked, car detected', '161': Waiting for car, '162': Outlet reserved, '176': 'Car detected, authentication failed', '177': 'Car detected, authenticating', '178': Ready to supply energy, '179': Car finished or paused charging, '194': Charging, '224': 'Outlet blocked, no car detected', '226': Outlet booting}

problems:
  - {when: {key: x.outlet1_state_group, equals: 15}, kind: fault, text: Outlet 1 error (status 0xFx)}
  - {when: {key: x.outlet2_state_group, equals: 15}, kind: fault, text: Outlet 2 error (status 0xFx)}

notes:
- Modbus TCP on port 502, unit id 0xFF (the wallbox is identified by its IP address). Read with function 0x03 (the document
  allows up to 126 registers; 125 here, the Modbus maximum), write with 0x10 (up to 124 registers). Values over two registers
  are most significant register first.
- The wallbox sends no exception responses; on any error it doesn't answer.
- Standalone, the eM4 is one product (0x0100) with outlet 1 = left (0x3000) and, on the Twin, outlet 2 = right (0x3100). In
  a group the controller's SBCx serves products 1–32 at 0x0100–0x20FF and outlets 1–32 at 0x3000–0x4FFF; only the standalone
  layout is listed here.
- The document gives the outlet state only for the listed codes and 0x00Fx (error); the individual error codes aren't described.
- Addresses are the document's hex register numbers (0-based protocol addresses). Every register is read with function 0x03,
  so all points are in the holding table.
- Addresses for plug 1. OpenEMS adds 0x100 × (plug number − 1) for plugs 2 to 32 of a controller with extenders.
