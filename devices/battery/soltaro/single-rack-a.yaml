  - {when: {key: x.state_word_8512, bit: 4}, kind: warning, text: Cluster 1 Total Voltage Low Alarm Level 2}
  - {when: {key: x.state_word_8512, bit: 5}, kind: warning, text: Cluster 1 Discharge Current High Alarm Level 2}
  - {when: {key: x.state_word_8512, bit: 6}, kind: warning, text: Alarm level 2 cell cha temp high}
  - {when: {key: x.state_word_8512, bit: 7}, kind: warning, text: Cluster1 Cell Charge Temperature Low Alarm Level 2}
