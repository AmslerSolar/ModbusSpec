  - {when: {key: x.state_word_8513, bit: 4}, kind: warning, text: Cluster 1 Total Voltage Low Alarm Level 1}
  - {when: {key: x.state_word_8513, bit: 5}, kind: warning, text: Cluster 1 Discharge Current High Alarm Level 1}
