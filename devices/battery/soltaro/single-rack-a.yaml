modbusspec: 0
id: soltaro-single-rack-a
manufacturer: Soltaro
name: Single rack battery, version A
kind: battery

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.battery.soltaro

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.bms_contactor_control, label: Bms contactor control, table: holding, address: 8208, type: u16, enum: contactor_control, writable: true}
  - {key: x.charge_max_voltage, label: Charge max voltage, table: holding, address: 8258, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_voltage_protect, label: Cell voltage protect, table: holding, address: 8262, type: u16, unit: V, scale: 0.001, writable: true}
  - {key: x.cell_voltage_recover, label: Cell voltage recover, table: holding, address: 8263, type: u16, unit: V, scale: 0.001, writable: true}
  - {key: x.discharge_min_voltage, label: Discharge min voltage, table: holding, address: 8264, type: u16, unit: V, scale: 0.1}
  - {key: battery_voltage, label: Voltage, table: holding, address: 8448, type: u16, unit: V, scale: 0.1}
  - {key: x.current, label: Current, table: holding, address: 8449, type: s16, unit: A, scale: 0.1}
  - {key: x.charge_indication, label: Charge indication, table: holding, address: 8450, type: u16, enum: charge_indication}
  - {key: battery_soc, label: Soc, table: holding, address: 8451, type: u16, unit: '%'}
  - {key: battery_soh, label: Soh, table: holding, address: 8452, type: u16, unit: '%'}
  - {key: x.cluster_1_max_cell_voltage_id, label: Cluster 1 max cell voltage id, table: holding, address: 8453, type: u16}
  - {key: x.max_cell_voltage, label: Max cell voltage, table: holding, address: 8454, type: u16, unit: V, scale: 0.001}
  - {key: x.cluster_1_min_cell_voltage_id, label: Cluster 1 min cell voltage id, table: holding, address: 8455, type: u16}
  - {key: x.min_cell_voltage, label: Min cell voltage, table: holding, address: 8456, type: u16, unit: V, scale: 0.001}
  - {key: x.cluster_1_max_cell_temperature_id, label: Cluster 1 max cell temperature id, table: holding, address: 8457, type: u16}
  - {key: x.max_cell_temperature, label: Max cell temperature, table: holding, address: 8458, type: s16, unit: °C, scale: 0.1}
  - {key: x.cluster_1_min_cell_temperature_id, label: Cluster 1 min cell temperature id, table: holding, address: 8459, type: u16}
  - {key: x.min_cell_temperature, label: Min cell temperature, table: holding, address: 8460, type: s16, unit: °C, scale: 0.1}
  - {key: x.system_insulation, label: System insulation, table: holding, address: 8470, type: u16, unit: Ω, scale: 1000}
  - {key: x.state_word_8512, label: Status bits at 8512, table: holding, address: 8512, type: u16, flags: state_word_8512}
  - {key: x.state_word_8513, label: Status bits at 8513, table: holding, address: 8513, type: u16, flags: state_word_8513}
  - {key: x.cluster_run_state, label: Cluster run state, table: holding, address: 8514, type: u16, enum: cluster_run_state}
  - {key: x.bp_charge_bms, label: Bp charge bms, table: holding, address: 8544, type: u16, unit: A, scale: 0.1}
  - {key: x.bp_discharge_bms, label: Bp discharge bms, table: holding, address: 8545, type: u16, unit: A, scale: 0.1}
  - {key: x.state_word_8581, label: Status bits at 8581, table: holding, address: 8581, type: u16, flags: state_word_8581}
  - {key: x.cluster_1_battery_000_voltage, label: Cluster 1 battery 000 voltage, table: holding, address: 10240, type: u16, unit: V, scale: 0.001, note: 'First of 240 values of this kind at 10240, 10241, … 10479 (every 1 register; last: Cluster 1 battery 239 voltage).'}
  - {key: x.cluster_1_battery_00_temperature, label: Cluster 1 battery 00 temperature, table: holding, address: 11264, type: s16, unit: °C, scale: 0.1, note: 'First of 48 values of this kind at 11264, 11265, … 11311 (every 1 register; last: Cluster 1 battery 47 temperature).'}

enums:
  contactor_control: {'0': Cut off, '1': Connection initiating, '3': On grid}
  charge_indication: {'0': Standby, '1': Discharge, '2': Charge}
  cluster_run_state: {'0': Normal, '1': Stop charging, '2': Stop discharging, '3': Standby}

flags:
  state_word_8512: {'0': Cluster 1 Cell Voltage High Alarm Level 2, '1': Cluster 1 Total Voltage High Alarm Level 2, '2': Cluster 1 Charge Current High Alarm Level 2, '3': Cluster 1 Cell Voltage Low Alarm Level 2, '4': Cluster 1 Total Voltage Low Alarm Level 2, '5': Cluster 1 Discharge Current High Alarm Level 2, '6': Alarm level 2 cell cha temp high, '7': Cluster1 Cell Charge Temperature Low Alarm Level 2, '12': Cluster1Insulation Low Alarm Level 2, '14': Alarm level 2 cell discha temp high, '15': Alarm level 2 cell discha temp low}
  state_word_8513: {'0': Cluster 1 Cell Voltage High Alarm Level 1, '1': Cluster 1 Total Voltage High Alarm Level 1, '2': Cluster 1 Charge Current High Alarm Level 1, '3': Cluster 1 Cell Voltage Low Alarm Level 1, '4': Cluster 1 Total Voltage Low Alarm Level 1, '5': Cluster 1 Discharge Current High Alarm Level 1, '6': Alarm level 1 cell cha temp high, '7': Alarm level 1 cell cha temp low, '8': Cluster 1 SOC Low Alarm Level 1, '9': Cluster X Cell temperature Diff High Alarm Level 1, '11': Cluster 1 Cell Voltage Diff High Alarm Level 1, '12': Cluster1 Insulation Low Alarm Level1, '13': Cluster1 Total Voltage Diff High Alarm Level 1, '14': Alarm level 1 cell discha temp high, '15': Alarm level 1 cell discha temp low}
  state_word_8581: {'0': sampling wire fault, '1': connector wire fault, '2': LTC6803 fault, '3': Voltage sampling fault, '4': Temperature sampling fault, '5': Temperature sensor fault, '8': Balancing module fault, '9': Temperature sampling line fault, '10': Intranet communication fault, '11': EEPROM fault, '12': Initialization failure}

