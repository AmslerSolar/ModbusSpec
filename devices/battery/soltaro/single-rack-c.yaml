enums:
  system_reset: {'1': Activates the Reset}
  pre_charge_control: {'0': Shut Down Main Power Contactor & Pre-charge, '1': Switch ON Pre-charge & Main Power Contactor, '2': 'Intermediate State: Pre-charging', '3': Running}
  auto_set_function: {'0': Init mode, '1': Start auto setting, '2': Success, '3': Failure}
  sleep: {'1': Activates the Sleep}
  ems_baudrate: {'1': Baudrate 9600, '3': Baudrate 19200, '4': Baudrate 57600}
  charge_indication: {'0': Standby, '1': Discharge, '2': Charge}
  cluster_run_state: {'0': Normal, '1': Stop charging, '2': Stop discharging, '3': Standby}

flags:
  state_word_8512: {'0': Cell Voltage High Alarm Level 2, '1': Total Voltage High Alarm Level 2, '2': Charge Current High Alarm Level 2, '3': Cell Voltage Low Alarm Level 2, '4': Total Voltage Low Alarm Level 2, '5': Discharge Current High Alarm Level 2, '6': Charge Temperature High Alarm Level 2, '7': Cell Charge Temperature Low Alarm Level 2, '10': Power Pole temperature too high Alarm Level 2, '12': Insulation Value Failure Alarm Level 2, '14': Discharge Temperature High Alarm Level 2, '15': Discharge Temperature Low Alarm Level 2}
  state_word_8513: {'0': Cell Voltage High Alarm Level 1, '1': Total Voltage High Alarm Level 1, '2': Charge Current High Alarm Level 1, '3': Cell Voltage Low Alarm Level 1, '4': Total Voltage Low Alarm Level 1, '5': Discharge Current High Alarm Level 1, '6': Charge Temperature High Alarm Level 1, '7': Cell Charge Temperature Low Alarm Level 1, '10': Power Pole temperature too high Alarm Level 1, '12': Insulation Value Failure Alarm Level 1, '14': Discharge Temperature High Alarm Level 1, '15': Discharge Temperature Low Alarm Level 1}
  state_word_8514: {'2': Charge Current High Pre-Alarm, '4': Total Voltage Low Pre-Alarm, '5': Discharge Current High Pre-Alarm, '6': Charge Temperature High Pre-Alarm, '7': Charge Temperature Low Pre-Alarm, '8': State-Of-Charge Low Pre-Alarm, '10': Power Pole Temperature High Pre-Alarm, '11': Cell Voltage Difference Too Big Pre-Alarm, '12': Insulation Failure Pre-Alarm, '13': Total Voltage Difference Too Big Pre-Alarm, '14': Discharge Temperature High Pre-Alarm, '15': Discharge Temperature Low Pre-Alarm}
  state_word_8613: {'0': Communication Failure to Master BMS, '1': Communication Failure to Slave BMS, '2': Alarm communication slave bms to temp sensors, '3': Slave BMS Hardware Failure}
  state_word_8579: {'0': Slave 17 communication error, '1': Slave 18 communication error, '2': Slave 19 communication error, '3': Slave 20 communication error}
  state_word_8580: {'0': Slave 1 communication error, '1': Slave 2 communication error, '2': Slave 3 communication error, '3': Slave 4 communication error, '4': Slave 5 communication error, '5': Slave 6 communication error, '6': Slave 7 communication error, '7': Slave 8 communication error, '8': Slave 9 communication error, '9': Slave 10 communication error, '10': Slave 11 communication error, '11': Slave 12 communication error, '12': Slave 13 communication error, '13': Slave 14 communication error, '14': Slave 15 communication error, '15': Slave 16 communication error}
  state_word_8581: {'0': Slave bms voltage sensor cables, '1': Slave bms power cable, '2': Slave bms ltc6803, '3': Slave bms voltage sensors, '4': Slave bms temp sensor cables, '5': Slave bms temp sensors, '6': Slave bms power pole temp sensor, '7': Slave bms temp board com, '8': Slave bms balance module, '9': Slave bms temp sensors2, '10': Slave bms internal com, '11': Slave bms eeprom, '12': Slave bms init}

