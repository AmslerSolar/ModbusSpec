modbusspec: 0
id: soltaro-single-rack-c
manufacturer: Soltaro
name: Single rack battery, version C
kind: battery

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.battery.soltaro

connection:
  default_port: 502
  default_unit: 0

defaults:
  verified: false
  sources:
  - openems

