enums:
  open_close: {'1': Open, '2': Closed}
  start_stop: {'1': Closed (start), '2': Open (stop)}
  high_low: {'1': High, '2': Low}
  run_mode: {'1': Normal, '2': Debug}
  enable_disable: {'1': Enabled, '2': Disabled}
  auto_set: {'0': Initial, '1': Start automatic setting, '2': Success, '3': Failure}
  charge_state: {'0': Idle, '1': Discharging, '2': Charging}
  run_state: {'0': Normal, '1': Full, '2': Empty, '3': Standby, '4': Stopped}

flags:
  alarm_bits: {'0': Cell over voltage, '1': System over voltage, '2': Charge over current, '3': Cell under voltage, '4': System under voltage, '5': Discharge over current, '6': Charge over temperature, '7': Charge under temperature, '8': SOC low, '9': Temperature difference too big, '10': Pole (terminal) over temperature, '11': Cell voltage difference too big, '12': Insulation failure, '13': Total voltage difference too big (measured vs. sum of cells), '14': Discharge over temperature, '15': Discharge under temperature}
  slave_comm_17_20: {'0': Slave 17 communication fault, '1': Slave 18 communication fault, '2': Slave 19 communication fault, '3': Slave 20 communication fault}
  slave_fault: {'0': Voltage sense wire fault, '1': Connection cable fault, '2': LTC6803 fault, '3': Voltage measurement fault, '4': Temperature measurement fault, '5': Temperature sensor fault, '6': Cell tab temperature fault, '7': Temperature board fault, '8': Balancing module fault, '9': Temperature sense wire fault, '10': Internal communication fault, '11': EEPROM fault, '12': Slave initialisation failed}

problems:
  - {when: {key: x.alarm_level_2, not: 0}, kind: fault, text: 'Battery stopped by a level 2 alarm (0x{value:X})'}
  - {when: {key: x.alarm_level_1, not: 0}, kind: warning, text: 'Battery level 1 alarm (0x{value:X})'}
  - {when: {key: x.slave_fault, not: 0}, kind: fault, text: 'Slave BMS fault (0x{value:X})'}
  - {when: {key: x.slave_comm_alarm_1, not: 0}, kind: warning, text: 'Slave communication fault, slaves 17…20 (0x{value:X})'}
  - {when: {key: x.slave_comm_alarm_2, not: 0}, kind: warning, text: 'Slave communication fault, slaves 1…16 (0x{value:X})'}
  - {when: {key: state, equals: 4}, kind: warning, text: Battery rack stopped}

notes:
- The document lists offsets within the rack only and states neither a base address nor the serial settings. The base 0x2000
  is assumed (the rack base of the related multi-rack protocols); addresses here are 0x2000 + the document's offset. Modbus
  RTU and holding registers (function 03) are assumed as in those protocols. Default EMS address 0 (register 0x201B).
- 'All registers are unsigned unless marked signed. Current sign as stated: positive = discharging.'
- Bit names of the alarm words follow the Chinese labels; several English labels of 0x2007 / 0x2008 are swapped or wrong (e.g.
  bits 6, 7, 3, 1 and 0). 0x2007 / 0x2008 hold the same bits as alarm flags and protection flags; problems are raised from
  the level 1 / level 2 words (0x2141 / 0x2140) only.
- Cell voltages start at 0x2800 (u16, mV; cell 1 … up to 240), cell temperatures at 0x2C00 (s16, 0.1 °C; up to 240 sensors).
- 'Left out: alarm and protection enable masks (0x2009…0x200C: low byte selects, high byte switches on/off), testing IO (0x200E),
  the remaining protection thresholds (0x2040…0x2061) and alarm thresholds (0x2080…0x20A2, each with a recovery value; mV,
  0.1 V, 0.1 A, 0.1 °C, %, Ω/V), PCS address and baud rate (0x20C0, 0x20C1), current calibration (0x20C2, 0x20C3), charger
  current (0x20C4), the values at the last alarm / stop (0x2143…0x2153), last charge / discharge records (0x218F…0x2195) and
  the event counters (0x2196…0x21AC, 0x21B4, 0x21B5).'
- 'Left out: Total capacity low bits (holding 8578, u16) from openems overlaps x.total_capacity from the documents.'
- 'Left out: System time low (holding 8583, u16) from openems overlaps x.run_time from the documents.'
- Cell voltages start at 0x2800 (u16, mV) and cell temperatures at 0x2C00 (s16, 0.1 °C), 12 per module, one after the other
  for all modules.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
