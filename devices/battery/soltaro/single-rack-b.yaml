# Written from the Soltaro Single Rack MOD-BUS protocol (V3.6). The document gives register offsets only; the base
# address 0x2000 is assumed (see notes), so every point is `verified: false`.

modbusspec: 0
id: soltaro-single-rack-b
manufacturer: Soltaro
name: Single rack battery, version B
kind: battery

sources:
- title: Single Rack MOD-BUS protocol
  version: V3.6
  url: https://github.com/OpenEMS/openems/blob/c044448d6346209e4aa8dae7f4bde08a676ad0ed/io.openems.edge.battery.soltaro/doc/Single%20Rack%20MOD-BUS%20protocol%20V3.6.doc
  sha256: c32382b2ec02f80a11693e9076dab28cce623f6dccecf8313384d0d58c4dba36
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.battery.soltaro

connection:
  default_port: 502
  default_unit: 0
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  # Control registers (offset 0x0000 ff.)
  - {key: x.fan_status, label: Fan status, table: holding, address: 8192, type: u16, enum: open_close}
  - {key: x.main_contactor_state, label: Main contactor state, table: holding, address: 8193, type: u16, enum: start_stop}
  - {key: x.dry_contact_1, label: Dry contact 1 output, table: holding, address: 8194, type: u16, enum: high_low}
  - {key: x.dry_contact_2, label: Dry contact 2 output, table: holding, address: 8195, type: u16, enum: high_low}
  - {key: x.system_reset, label: System reset, table: holding, address: 8196, type: u16, writable: true, poll: slow, note: Write 1 to reset.}
  - {key: x.run_mode, label: System run mode, table: holding, address: 8197, type: u16, enum: run_mode}
  - {key: x.pre_contactor_state, label: Pre-charge contactor state, table: holding, address: 8198, type: u16, enum: start_stop}
  - {key: x.alarm_flags, label: Alarm flag status, table: holding, address: 8199, type: u16, flags: alarm_bits}
  - {key: x.protect_flags, label: Protection flag status, table: holding, address: 8200, type: u16, flags: alarm_bits}
  - {key: x.short_circuit_function, label: Short circuit function, table: holding, address: 8205, type: u16, enum: enable_disable, writable: true, poll: slow}
  - {key: x.soft_shutdown, label: Soft shutdown, table: holding, address: 8207, type: u16, writable: true, poll: slow, note: Write 1 to shut down.}
  - {key: x.pre_charge_status, label: Pre-charge status, table: holding, address: 8208, type: u16, note: Values not stated in the document.}
  - {key: x.pcs_alarm_reset, label: PCS alarm reset, table: holding, address: 8210, type: u16, writable: true, poll: slow, note: Write 1 to clear a PCS standby alarm by hand.}
  - {key: x.auto_set_slave_ids, label: Auto set slave IDs, table: holding, address: 8212, type: u16, enum: auto_set, writable: true, poll: slow}
  - {key: x.auto_set_slave_temperature_ids, label: Auto set slave temperature IDs, table: holding, address: 8217, type: u16, enum: auto_set, writable: true, poll: slow}
  - {key: x.ems_address, label: EMS address, table: holding, address: 8219, type: u16, writable: true, poll: slow, note: Default 0.}
  - {key: x.ems_timeout, label: EMS communication timeout protection, table: holding, address: 8220, type: u16, unit: s, writable: true, poll: slow, note: Default 90 s.}
  - {key: x.sleep, label: Sleep, table: holding, address: 8221, type: u16, writable: true, poll: slow, note: 'Write 1 to sleep (ACC not connected to power +). To wake up: connect ACC to power + and reset the system.'}
  - {key: x.voltage_low_protection, label: Voltage low protection, table: holding, address: 8222, type: u16, unit: V, scale: 0.001, writable: true, poll: slow, note: Default 2.650 V.}

  # Protection (stop) thresholds (offset 0x0040 ff.), a selection
  - {key: x.cell_over_voltage_protection, label: Cell over voltage protection, table: holding, address: 8256, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.system_over_voltage_protection, label: System over voltage protection, table: holding, address: 8258, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.charge_over_current_protection, label: Charge over current protection, table: holding, address: 8260, type: u16, unit: A, scale: 0.1, writable: true, poll: slow}
  - {key: x.cell_under_voltage_protection, label: Cell under voltage protection, table: holding, address: 8262, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.system_under_voltage_protection, label: System under voltage protection, table: holding, address: 8264, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.discharge_over_current_protection, label: Discharge over current protection, table: holding, address: 8266, type: u16, unit: A, scale: 0.1, writable: true, poll: slow}

  # Work parameters (offset 0x00C0 ff.), a selection
  - {key: x.rtc_time, label: System RTC time, table: holding, address: 8389, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.cell_float_charge_voltage, label: Cell float charging threshold, table: holding, address: 8391, type: u16, unit: V, scale: 0.001, poll: slow, note: Charging starts below this.}
  - {key: x.cell_full_voltage, label: Cell full charge threshold, table: holding, address: 8392, type: u16, unit: V, scale: 0.001, poll: slow, note: The cell counts as full above this.}
  - {key: x.cell_stop_discharge_voltage, label: Cell end-of-discharge threshold, table: holding, address: 8393, type: u16, unit: V, scale: 0.001, poll: slow, note: Discharging stops below this.}
  - {key: x.system_capacity, label: System capacity, table: holding, address: 8396, type: u16, poll: slow, note: Unit not stated in the document.}
  - {key: x.system_soc_setting, label: System SOC (work parameter), table: holding, address: 8415, type: u16, poll: slow, note: In the work-parameter group; unit and use not stated., conflicts: [{sources: [openems], unit: '%', label: Set soc}]}
  - {key: x.system_soh_default, label: System SOH default value, table: holding, address: 8416, type: u16, poll: slow}

  # Rack summary (offset 0x0100 ff.)
  - {key: battery_voltage, label: Total voltage, table: holding, address: 8448, type: u16, unit: V, scale: 0.1}
  - {key: battery_current, label: Main circuit current, table: holding, address: 8449, type: s16, unit: A, scale: 0.1, positive: discharge, note: −500…500 A.}
  - {key: x.charge_state, label: Charge / discharge indication, table: holding, address: 8450, type: u16, enum: charge_state}
  - {key: battery_soc, label: SOC, table: holding, address: 8451, type: u16, unit: '%'}
  - {key: battery_soh, label: SOH, table: holding, address: 8452, type: u16, unit: '%', scale: 0.1}
  - {key: x.max_cell_voltage_id, label: Number of the highest cell, table: holding, address: 8453, type: u16, note: 1…196.}
  - {key: x.max_cell_voltage, label: Highest cell voltage, table: holding, address: 8454, type: u16, unit: V, scale: 0.001, conflicts: [{sources: [openems], type: s16, label: Cluster 1 max cell voltage}]}
  - {key: x.min_cell_voltage_id, label: Number of the lowest cell, table: holding, address: 8455, type: u16}
  - {key: x.min_cell_voltage, label: Lowest cell voltage, table: holding, address: 8456, type: u16, unit: V, scale: 0.001}
  - {key: x.max_cell_temperature_id, label: Number of the hottest sensor, table: holding, address: 8457, type: u16, note: 1…60.}
  - {key: battery_temperature, label: Highest cell temperature, table: holding, address: 8458, type: s16, unit: °C, scale: 0.1}
  - {key: x.min_cell_temperature_id, label: Number of the coldest sensor, table: holding, address: 8459, type: u16}
  - {key: x.min_cell_temperature, label: Lowest cell temperature, table: holding, address: 8460, type: s16, unit: °C, scale: 0.1}
  - {key: x.max_cell_resistance_id, label: Number of the cell with the highest resistance, table: holding, address: 8461, type: u16, poll: slow}
  - {key: x.max_cell_resistance, label: Highest cell resistance, table: holding, address: 8462, type: u16, unit: mΩ, scale: 0.01, poll: slow, conflicts: [{sources: [openems], unit: Ω, scale: 1.0e-05, label: Max cell resistance}]}
  - {key: x.min_cell_resistance_id, label: Number of the cell with the lowest resistance, table: holding, address: 8463, type: u16, poll: slow}
  - {key: x.min_cell_resistance, label: Lowest cell resistance, table: holding, address: 8464, type: u16, unit: mΩ, scale: 0.01, poll: slow, conflicts: [{sources: [openems], unit: Ω, scale: 1.0e-05, label: Min cell resistance}]}
  - {key: x.insulation_positive, label: Positive insulation, table: holding, address: 8465, type: u16, note: Unit not stated in the document., conflicts: [{sources: [openems], unit: Ω, scale: 1000}]}
  - {key: x.insulation_negative, label: Negative insulation, table: holding, address: 8466, type: u16, note: Unit not stated in the document., conflicts: [{sources: [openems], unit: Ω, scale: 1000}]}
  - {key: x.main_contactor_flag, label: Main contactor (breaker) feedback, table: holding, address: 8467, type: u16, note: Values not stated in the document.}
  - {key: x.environment_temperature, label: Environment temperature, table: holding, address: 8469, type: s16, unit: °C, scale: 0.1, conflicts: [{sources: [openems], type: u16}]}
  - {key: x.system_insulation, label: System insulation, table: holding, address: 8470, type: u16, unit: kΩ, conflicts: [{sources: [openems], unit: Ω, scale: 1000}]}
  - {key: x.cell_voltage_difference, label: Cell voltage difference (highest − lowest), table: holding, address: 8471, type: u16, unit: V, scale: 0.001}
  - {key: x.total_voltage_difference, label: Total voltage difference (measured − sum of cells), table: holding, address: 8472, type: u16, unit: V, scale: 0.1}

