  - {key: x.alarm_level_2, label: Level 2 alarms (stop), table: holding, address: 8512, type: u16, flags: alarm_bits}
  - {key: x.alarm_level_1, label: Level 1 alarms, table: holding, address: 8513, type: u16, flags: alarm_bits}
  - {key: state, label: Rack run state, table: holding, address: 8514, type: u16, enum: run_state}
