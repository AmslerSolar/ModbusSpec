modbusspec: 0
id: tesvolt-battery
manufacturer: TESVOLT
name: Battery storage behind SMA inverters
kind: battery

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/sma/sma_sunny_boy

connection:
  default_port: 502
  default_unit: 25

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: battery_power, label: Battery power, table: input, address: 1012, type: s32, unit: W, positive: discharge}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 1056, type: s32, unit: '%', scale: 0.1}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
