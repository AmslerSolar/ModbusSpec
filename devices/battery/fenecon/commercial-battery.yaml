notes:
- Tower registers are shown for the first tower (base 3072); each further tower adds 768. Module values within a tower start
  at tower base + 128 and repeat every 20 registers.
- 'Left out: voltage_3086 (holding 3086, u16) from openems overlaps sub_master_firmware_version (holding 3085, str, 2 registers);
  check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
