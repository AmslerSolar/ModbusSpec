enums:
  system_state: {'0': Standby, '1': Off-grid, '2': On-grid, '3': Fail, '4': Off-grid PV}
  control_mode: {'1': Remote, '2': Local}
  battery_group_state: {'0': Initial, '1': Off grid, '2': On griding, '3': On grid, '4': Stopping, '5': Fail}
  pcs_state: {'0': Self-checking, '1': Standby, '2': Off-grid PV, '3': Off-grid, '4': On-grid, '5': Fail, '6': Bypass 1, '7': Bypass 2}
  system_control: {'0': Local, '1': Remote on-grid start, '2': Remote off-grid start, '3': Stop, '4': Emergency stop}
  setup_mode: {'0': 'Off', '1': 'On'}
  pcs_mode: {'0': Emergency, '1': Consumers Peak Pattern, '2': Economic, '3': Eco, '4': Debug, '5': Smooth PV, '6': Remote, '7': Riyuan, '8': Timing}
  debug_run_state: {'0': Forbid, '1': Charge, '2': Discharge}

flags:
