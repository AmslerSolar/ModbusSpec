# Written from the FENECON Modbus protocol 485 (MINIES) (spreadsheet, from the OpenEMS repository at commit
# c044448d). The spreadsheet names the system only "MINIES"; it sits with FENECON's Mini driver.

modbusspec: 0
id: fenecon-mini
manufacturer: FENECON
name: FENECON Mini (MINIES)
kind: battery

sources:
- title: Modbus protocol 485 (MINIES) (spreadsheet)
  version: commit c044448d6346209e4aa8dae7f4bde08a676ad0ed
  url: https://github.com/OpenEMS/openems/blob/c044448d6346209e4aa8dae7f4bde08a676ad0ed/io.openems.edge.fenecon.mini/doc/Modbus%20protocol_485%28MINIES%29.xlsx
  sha256: adab9cfc93055937e78b6fd1730ff9b322b3e89be442f898e4cea5d26703f435
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.fenecon.mini

connection:
  default_port: 502
  default_unit: 4
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

points:
  # Status
  - {key: x.system_state, label: System status, table: holding, address: 100, type: u16, enum: system_state, note: The read function code isn't stated; holding registers assumed., verified: false}
  - {key: x.control_mode, label: Control mode, table: holding, address: 101, type: u16, enum: control_mode, poll: slow, note: Commands (registers 200 … 202) are only accepted in remote mode.}
  - {key: x.charge_power_limit, label: Battery allowable charging power limitation, table: holding, address: 104, type: u32, unit: W, note: 'High word at 104, low word at 105. The document gives the unit as 1 Wh; taken as W because it is a power limit.', verified: false}
  - {key: x.battery_discharge_energy, label: Total energy discharged from battery, table: holding, address: 106, type: u32, unit: kWh, scale: 0.001, poll: slow, note: '1 Wh per step; high word at 106, low word at 107.'}
  - {key: x.battery_group_state, label: Battery group status, table: holding, address: 108, type: u16, enum: battery_group_state}
  - {key: battery_soc, label: Battery group SOC, table: holding, address: 109, type: u16, unit: '%'}
  - {key: battery_voltage, label: Battery group voltage, table: holding, address: 110, type: u16, unit: V, scale: 0.1, conflicts: [{sources: [openems], scale: 0.001, label: Battery voltage}]}
  - {key: battery_current, label: Battery group current, table: holding, address: 111, type: s16, unit: A, scale: 0.1, positive: discharge, note: Signed; the positive direction isn't stated (assumed discharge)., conflicts: [{sources: [openems], scale: 0.001, label: Battery current}], verified: false}
  - {key: battery_power, label: Battery group power, table: holding, address: 112, type: s16, unit: W, positive: discharge, note: Signed; the positive direction isn't stated (assumed discharge)., verified: false}
  - {key: x.battery_alarm, label: Battery group alarm message, table: holding, address: 113, type: u16, flags: battery_alarm}
  - {key: x.pcs_state, label: PCS operation status, table: holding, address: 114, type: u16, enum: pcs_state}
  # Inverter (PCS) and grid
  - {key: x.pcs_current, label: PCS output current, table: holding, address: 118, type: s16, unit: A, scale: 0.1, note: 'Signed; the document only remarks ''inverting output'', the positive direction isn''t stated.', verified: false}
  - {key: x.grid_voltage, label: Grid voltage, table: holding, address: 121, type: u16, unit: V, scale: 0.1}
  - {key: x.pcs_active_power, label: PCS active power, table: holding, address: 124, type: s16, unit: W, note: 'Signed; the document only remarks ''inverting output'', the positive direction isn''t stated.', verified: false}
  - {key: reactive_power, label: PCS reactive power, table: holding, address: 127, type: s16, unit: var}
  - {key: frequency, label: Grid frequency, table: holding, address: 131, type: u16, unit: Hz, scale: 0.01}
  - {key: x.pcs_max_power, label: PCS maximum output apparent power, table: holding, address: 134, type: u16, unit: W, poll: slow, note: The document gives the unit as W.}
  - {key: x.meter_active_power, label: Meter total active power, table: holding, address: 139, type: s16, unit: W, note: Total active power of the grid meter; the positive direction isn't stated., verified: false}
  - {key: x.meter_reactive_power, label: Meter total reactive power, table: holding, address: 140, type: s16, unit: var}
  - {key: x.charge_limit, label: System charging limitation, table: holding, address: 141, type: u16, unit: W}
  - {key: x.discharge_limit, label: System discharging limitation, table: holding, address: 142, type: u16, unit: W}
  - {key: pv_power, label: PV inverter power, table: holding, address: 143, type: u16, unit: W}
  # Control (write-only)
  - {key: x.set_system_control, label: System control, table: holding, address: 200, type: u16, enum: system_control, writable: true, write_only: true, write_multiple: true, poll: slow, note: Registers 200 … 202 are written together; without a command for 60 s the system returns to local mode. Remote off-grid start (2) isn't available yet according to the document.}
  - {key: x.set_active_power, label: Target active power, table: holding, address: 201, type: s16, unit: W, writable: true, write_only: true, write_multiple: true, min: -10000, max: 10000, poll: slow, note: The sign convention isn't stated.}
  - {key: x.set_reactive_power, label: Target reactive power, table: holding, address: 202, type: s16, unit: var, writable: true, write_only: true, write_multiple: true, min: -10000, max: 10000, poll: slow}
  - {key: l1_power, label: Active power l1, table: holding, address: 2007, type: u16, unit: W, offset: -10000, positive: discharge, note: Raw value minus 10000; OpenEMS keeps a raw 0 as 0., verified: false, sources: [openems]}
  - {key: l2_power, label: Active power l2, table: holding, address: 2107, type: u16, unit: W, offset: -10000, positive: discharge, note: Raw value minus 10000; OpenEMS keeps a raw 0 as 0., verified: false, sources: [openems]}
  - {key: l3_power, label: Active power l3, table: holding, address: 2207, type: u16, unit: W, offset: -10000, positive: discharge, note: Raw value minus 10000; OpenEMS keeps a raw 0 as 0., verified: false, sources: [openems]}
  - {key: x.debug_run_state, label: Debug run state, table: holding, address: 2992, type: u16, enum: debug_run_state, writable: true, verified: false, sources: [openems]}
