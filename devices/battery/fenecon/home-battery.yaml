notes:
- 'Tower registers are shown for the first tower (base 10000); each further tower adds 2000. Module m of a tower starts at
  tower base + 100 + 100·m: cell voltages from +2 (u16, mV), temperature sensors from +18 (s16, 0.1 °C), as many as the battery
  reports cells and sensors per module.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
