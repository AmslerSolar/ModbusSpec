  work_mode: {'2': Economy, '6': Remote, '8': Timing}
  battery_group_state: {'0': Initial, '1': Stop, '2': Starting, '3': Running, '4': Stopping, '5': Fail}
  pcs_operation_state: {'0': Self-checking, '1': Standby, '2': Off-Grid PV, '3': Off-Grid, '4': ON_GRID, '5': Fail, '6': ByPass 1, '7': ByPass 2}
  set_work_state: {'0': Local Control, '1': Start, '2': Remote Control off Grid Starting, '3': Stop, '4': Emergency Stop}
  setup_mode: {'0': 'Off', '1': 'On'}
  pcs_mode: {'0': Emergency, '1': Consumers Peak Pattern, '2': Economic, '3': Eco, '4': Debug, '5': Smooth PV, '6': Remote}

