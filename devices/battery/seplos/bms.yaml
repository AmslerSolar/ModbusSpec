connection:
  default_port: 502
  default_unit: 0
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 5909
    type: str
    length: 15
    byte_order: little
  checks:
  # factory name
  - table: input
    address: 5888
    type: str
    length: 10
    byte_order: little
    printable: true

points:
  # Pack info A (PIA), function 04
