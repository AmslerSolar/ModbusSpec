  url: https://github.com/syssi/esphome-seplos-bms/blob/4a9bd96537c5cecaa0103be3897970915e4e0413/docs/XZH%20BMS%20Modbus-RTU%20Protocol%20V0.3%20%28English%2C%20official%29.pdf
  sha256: abba2025fa3bf7e7cba67a6d1a74fa4af0d53991c0d243669bff3df10909daa5
