  - {key: x.cell_11_voltage, label: Cell11 voltage, table: input, address: 4362, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_12_voltage, label: Cell12 voltage, table: input, address: 4363, type: u16, unit: V, scale: 0.001}
