  - {key: battery_current, label: Current, table: input, address: 4097, type: s16, unit: A, scale: 0.01, positive: charge, verified: false, note: The direction isn't stated; charge positive is assumed. Document V0.2 changed the PIA current unit to 0.1 A for 300 A and 400 A BMS models (see notes).}
  - {key: x.remaining_capacity, label: Remaining capacity, table: input, address: 4098, type: u16, unit: Ah, scale: 0.01}
  - {key: x.total_capacity, label: Total capacity, table: input, address: 4099, type: u16, unit: Ah, scale: 0.01, poll: slow}
  - {key: x.total_discharge_capacity, label: Total discharge capacity, table: input, address: 4100, type: u16, unit: Ah, scale: 10, poll: slow}
  - {key: battery_soc, label: SOC, table: input, address: 4101, type: u16, unit: '%', scale: 0.1}
  - {key: battery_soh, label: SOH, table: input, address: 4102, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.cycles, label: Cycle, table: input, address: 4103, type: u16, poll: slow}
  - {key: x.average_cell_voltage, label: Average of cell voltage, table: input, address: 4104, type: u16, unit: V, scale: 0.001}
  - {key: battery_temperature, label: Average of cell temperature, table: input, address: 4105, type: u16, unit: °C, scale: 0.1, offset: -273.1}
  - {key: x.max_cell_voltage, label: Max cell voltage, table: input, address: 4106, type: u16, unit: V, scale: 0.001}
  - {key: x.min_cell_voltage, label: Min cell voltage, table: input, address: 4107, type: u16, unit: V, scale: 0.001}
  - {key: x.max_cell_temperature, label: Max cell temperature, table: input, address: 4108, type: u16, unit: °C, scale: 0.1, offset: -273.1}
  - {key: x.min_cell_temperature, label: Min cell temperature, table: input, address: 4109, type: u16, unit: °C, scale: 0.1, offset: -273.1}
  - {key: x.max_discharge_current, label: MaxDisCurt (suggested maximum discharge current), table: input, address: 4111, type: u16, unit: A}
  - {key: x.max_charge_current, label: MaxChgCurt (suggested maximum charge current), table: input, address: 4112, type: u16, unit: A}
  - {key: x.precharge_percent, label: Precharge percent, table: input, address: 4113, type: u16, unit: '%', scale: 0.1, optional: true, note: Only in the English V0.3; the Chinese V0.3 and V0.1 list nothing after 0x1010.}
  # Pack info B (PIB), function 04
  - {key: x.cell_01_voltage, label: Cell1 voltage, table: input, address: 4352, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_02_voltage, label: Cell2 voltage, table: input, address: 4353, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_03_voltage, label: Cell3 voltage, table: input, address: 4354, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_04_voltage, label: Cell4 voltage, table: input, address: 4355, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_05_voltage, label: Cell5 voltage, table: input, address: 4356, type: u16, unit: V, scale: 0.001}
