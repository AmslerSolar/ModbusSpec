notes:
- 'Maker: the English V0.3 is titled "SEPLOS BMS Modbus RTU Protocol"; the Chinese V0.3 and V0.1 are documents of Shanghai
  Xinzhiheng Electronic Technology (XZH), which makes the BMS boards.'
- The English V0.3 covers Seplos BMS boards with up to 16 cells and 4 cell temperature sensors (the X02 series adds SNMP,
  WiFi and a gyroscope).
- RS485, 19200 baud, 8N1. A BMS answers only its own address, 0x00–0x7F; the document's examples use address 0, so unit 0
  here (some Modbus gateways treat 0 as broadcast and won't forward it).
- Addresses are the document's hex register addresses (0-based protocol addresses as sent in the request; the examples read
  0x1000, 0x1100 and coils from 0x1200).
- 'Live values and parameters are read with function 04 only (input registers); parameters are written with function 16 to
  the same addresses. Status bits are read with function 01: the document''s PIC table packs them into bytes (two per register
  row from 0x1200), and the coil for bit b of byte n is 0x1200 + 8 × n + b (its example reads 0x90 = 144 coils from 0x1200).'
- Temperatures are in 0.1 K; the document's examples subtract 273.1 K (raw 2944 = 21.3 °C).
- 'Document V0.2: for 300 A and 400 A BMS models the PIA current unit became 0.1 A; below 200 A it stayed 10 mA. A reader
  can''t tell the models apart from the registers; the 10 mA scale is used here.'
- The version info strings (0x1700 ff.) are stored little-endian per the document.
- 'Left out: per-cell low/high voltage and temperature alarm bits, balancing bits (coils 0x1200–0x123F), most system parameters
  (0x1302–0x1367: recover, alarm and delay thresholds, balancing, heating, pulse and precharge settings), function switches
  (SFA, 0x1400 ff.), system control commands (SCA, 0x1500 ff.: clock, calibration, FET control, power off, reset, factory
  reset), history records (HIA, 0x1600 ff.), PCS protocol settings (PCT, 0x1800 ff.) and the EMS / system blocks (EIA/EIB/EIC,
  0x2000 ff.), which the document lists only for the ECU and display, not for the BMS itself.'
