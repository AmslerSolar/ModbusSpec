  url: https://github.com/syssi/esphome-seplos-bms/blob/4a9bd96537c5cecaa0103be3897970915e4e0413/docs/XZH%20BMS%20Modbus-RTU%20Protocol%20V0.3%20%28Chinese%29.pdf
