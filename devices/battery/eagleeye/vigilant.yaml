# Written from the Eagle Eye Power Solutions Vigilant BMS Modbus data mapping (0.6, 2022-04-22).

modbusspec: 0
id: eagleeye-vigilant
manufacturer: Eagle Eye Power Solutions
name: Vigilant battery monitoring system
kind: battery

sources:
- title: Eagle Eye Power Solutions Vigilant BMS Modbus data mapping
  version: 0.6 (2022-04-22)
  url: https://eepowersolutions.com/wp-content/uploads/2025/03/VIGILANT-modbus-data-mapping-v0.6.pdf
  sha256: fada9dbaf655079d7d4761621e5587e330e5c13c0cc1dee5f7f9ff85f2edfc98
  archive_url: https://web.archive.org/web/20250616225730/https://eepowersolutions.com/wp-content/uploads/2025/03/VIGILANT-modbus-data-mapping-v0.6.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  # Battery string (input registers, function 04)
  - {key: x.tick, label: Tick / Heartbeat, table: input, address: 0, type: u16, poll: fast, note: 'Counts up each time the monitor refreshes its Modbus data (wraps to 0, and restarts at 0 when the Modbus module restarts); a value that stops changing means stale data.'}
  - {key: x.critical_alarms, label: Critical alarms, table: input, address: 1, type: u16, poll: fast, note: 'Number of active critical alarms, sensor alarms included.'}
  - {key: x.warnings, label: Warnings, table: input, address: 2, type: u16, poll: fast, note: 'Number of active warnings, sensor warnings included.'}
  - {key: battery_current, label: Battery current, table: input, address: 1923, type: s32, unit: A, scale: 0.001, positive: discharge, poll: fast, verified: false, note: 'In mA, most significant register first. The sign convention is not stated in the document; discharge positive is assumed.'}
  - {key: battery_voltage, label: Battery voltage, table: input, address: 1925, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.ambient_temperature, label: Ambient C, table: input, address: 1926, type: s16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.ambient_temperature_f, label: Ambient F, table: input, address: 1927, type: s16, unit: °F, scale: 0.01, poll: fast}
  - {key: x.memory_used, label: Memory used, table: input, address: 1928, type: u16, unit: '%', scale: 0.1, poll: slow, note: Share of the monitor's storage in use.}
  - {key: temperature, label: Internal C, table: input, address: 1929, type: s16, unit: °C, scale: 0.01, poll: fast, note: Internal temperature of the monitor.}
  - {key: x.internal_temperature_f, label: Internal F, table: input, address: 1930, type: s16, unit: °F, scale: 0.01, poll: fast}
  - {key: state, label: Mode, table: input, address: 1931, type: u16, enum: mode, poll: fast}
  - {key: x.unexpected_restarts, label: Unexpected restarts, table: input, address: 1932, type: u16, poll: slow, note: Counts boots after an improper shutdown (power loss or watchdog reset).}
  - {key: x.update_time, label: Update time, table: input, address: 1933, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: fast, note: 'Experimental in the document: time the last Modbus update completed, UTC.'}
  - {key: x.average_unit_voltage, label: Average unit voltage, table: input, address: 1935, type: s16, unit: V, scale: 0.001, poll: fast}
  - {key: battery_temperature, label: Average post temperature C, table: input, address: 1936, type: s16, unit: °C, scale: 0.01, poll: fast, note: Average of the post temperatures across the battery.}
  - {key: x.average_post_temperature_f, label: Average post temperature F, table: input, address: 1937, type: s16, unit: °F, scale: 0.01, poll: fast}
  - {key: x.average_unit_resistance, label: Average unit resistance, table: input, address: 1938, type: s16, unit: µΩ, poll: slow}
  - {key: x.average_strap_resistance, label: Average strap resistance, table: input, address: 1939, type: s16, unit: µΩ, poll: slow, note: Average interconnect resistance.}

  # Unit (sensor) 1; units 2…240 follow at the next addresses (see notes)
  - {key: x.unit1_voltage, label: Unit voltage 1, table: input, address: 3, type: u16, unit: V, scale: 0.001, poll: fast}
  - {key: x.unit1_post_temperature, label: Post Temperature C1, table: input, address: 243, type: s16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.unit1_post_temperature_f, label: Post Temperature F1, table: input, address: 483, type: s16, unit: °F, scale: 0.01, poll: fast}
  - {key: x.unit1_ripple, label: Unit ripple 1, table: input, address: 723, type: u16, unit: V, scale: 0.001, poll: fast}
  - {key: x.unit1_resistance, label: Unit resistance 1, table: input, address: 963, type: u16, unit: µΩ, poll: slow}
  - {key: x.unit1_strap_resistance, label: Strap resistance 1, table: input, address: 1203, type: u16, unit: µΩ, poll: slow}
  - {key: x.unit1_critical_alarms, label: Unit critical alarms 1, table: input, address: 1443, type: u16, poll: fast}
  - {key: x.unit1_warnings, label: Unit warnings 1, table: input, address: 1683, type: u16, poll: fast}

  # Discrete inputs (function 02)
  - {key: x.aux1, label: AUX_1, table: discrete, address: 0, type: bool, enum: active, poll: fast}
  - {key: x.aux2, label: AUX_2, table: discrete, address: 1, type: bool, enum: active, poll: fast}
  - {key: x.shutoff, label: SHUTOFF, table: discrete, address: 7, type: bool, enum: shutoff, poll: fast, note: The monitor is preparing to power itself down.}
  - {key: x.unit1_electrolyte_alarm, label: ELS_EL_1, table: discrete, address: 8, type: bool, enum: alarm, poll: fast, note: Electrolyte level sensor 1; sensors 2…240 follow at 9…247.}
  - {key: x.unit1_temperature_alarm, label: ELS_TL_1, table: discrete, address: 248, type: bool, enum: alarm, poll: fast, note: Electrolyte level sensor 1 temperature level; sensors 2…240 follow at 249…487.}
  - {key: x.ground_fault, label: GROUND_FAULT, table: discrete, address: 968, type: bool, enum: alarm, poll: fast}
  - {key: x.modbus_error, label: MODBUS_ERROR, table: discrete, address: 969, type: bool, enum: alarm, poll: fast, note: 'Experimental in the document: the Modbus module suspects a problem collecting data.'}

enums:
  mode: {'0': Normal, '1': Discharging}
  active: {'0': Inactive, '1': Active}
  shutoff: {'0': Normal operation, '1': Preparing to power down}
  alarm: {'0': OK, '1': Alarm}

problems:
  - {when: {key: x.critical_alarms, not: 0}, kind: fault, text: 'Battery monitor: {value} critical alarm(s) active'}
  - {when: {key: x.warnings, not: 0}, kind: warning, text: 'Battery monitor: {value} warning(s) active'}
  - {when: {key: x.ground_fault, equals: 1}, kind: fault, text: Ground fault alarm}
  - {when: {key: x.shutoff, equals: 1}, kind: warning, text: Battery monitor preparing to power down}
  - {when: {key: x.modbus_error, equals: 1}, kind: warning, text: Battery monitor reports a data collection problem}

notes:
- The document numbers input registers 40001… and discrete inputs 20001…; the addresses here are those numbers minus 40001
  and 20001. Input registers are read with function 04, discrete inputs with function 02; everything is read-only.
- 'The monitor watches a standby (lead-acid) battery of up to 240 units, each with its own sensor. Per-unit values sit in
  blocks of 240 consecutive registers; only unit 1 is listed, unit n is at the unit 1 address + n − 1: voltage 3…242, post
  temperature °C 243…482, °F 483…722, ripple 723…962, unit resistance 963…1202, strap resistance 1203…1442, critical alarms
  1443…1682, warnings 1683…1922.'
- Discrete inputs 2…6 are reserved for legacy systems, 488…727 are experimental per-sensor electrolyte alarms (ELS_EA_1…240)
  and 728…967 are reserved; not listed.
- 'Values are scaled integers: voltages in mV (battery voltage in cV), temperatures in hundredths of a degree, memory in tenths
  of a percent, resistances in µΩ. Temperatures are given both in °C and °F.'
- Modbus TCP only; Modbus is off by default and is enabled and configured in the monitor's web interface. The port and unit
  id are not stated in the document; 502 and 1 are assumed.
- The document gives no identification registers, so the monitor can't be recognised in a network search.
- The register map may change between firmware versions; the document says data points are kept backward compatible where
  possible.
