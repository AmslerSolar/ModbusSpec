enums:
  charge_state: {'0': Idle, '1': Charging, '2': Discharging}
  off_on: {'0': 'Off', '1': 'On'}
  battery_type: {'0': LiFePO4, '1': Li-ion (ternary), '2': LTO (lithium titanate)}

flags:
  fault_status_1: {'0': 'Cell voltage too high, level 1', '1': 'Cell voltage too high, level 2', '2': 'Cell voltage too low, level 1', '3': 'Cell voltage too low, level 2', '4': 'Total voltage too high, level 1', '5': 'Total voltage too high, level 2', '6': 'Total voltage too low, level 1', '7': 'Total voltage too low, level 2', '8': 'Charging temperature too high, level 1', '9': 'Charging temperature too high, level 2', '10': 'Charging temperature too low, level 1', '11': 'Charging temperature too low, level 2', '12': 'Discharge temperature too high, level 1', '13': 'Discharge temperature too high, level 2', '14': 'Discharge temperature too low, level 1', '15': 'Discharge temperature too low, level 2'}
  fault_status_2: {'0': 'Charge overcurrent, level 1', '1': 'Charge overcurrent, level 2', '2': 'Discharge overcurrent, level 1', '3': 'Discharge overcurrent, level 2', '4': 'SOC too high, level 1', '5': 'SOC too high, level 2', '6': 'SOC too low, level 1', '7': 'SOC too low, level 2', '8': 'Cell voltage difference too high, level 1', '9': 'Cell voltage difference too high, level 2', '10': 'Temperature difference too high, level 1', '11': 'Temperature difference too high, level 2'}
  fault_status_3: {'0': Charge MOS over temperature, '1': Discharge MOS over temperature, '2': Charge MOS temperature sensor failure, '3': Discharge MOS temperature sensor failure, '4': Charge MOS stuck closed (adhesion), '5': Discharge MOS stuck closed (adhesion), '6': Charge MOS open circuit, '7': Discharge MOS open circuit, '8': AFE acquisition chip failure, '9': Cell voltage acquisition offline, '10': Temperature sensor failure, '11': EEPROM storage failure, '12': RTC clock failure, '13': Precharge failed, '14': Vehicle communication failure, '15': Internal network communication module failure}
  fault_status_4: {'0': Current module failure, '1': Total voltage detection module failure, '2': Short circuit protection failure, '3': 'Low voltage: charging prohibited', '4': MOS switched off by GPS or soft switch, '5': Charging cabinet offline}

