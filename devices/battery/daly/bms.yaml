  - {key: x.cell_1_voltage, label: Cell voltage 1, table: holding, address: 0, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_2_voltage, label: Cell voltage 2, table: holding, address: 1, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_3_voltage, label: Cell voltage 3, table: holding, address: 2, type: u16, unit: V, scale: 0.001}
