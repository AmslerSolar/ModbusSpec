notes:
- Function 03 reads, 06 and 16 write. The document's examples use unit id 0xD2 (210); the factory default address is not stated.
- Addresses are the document's hexadecimal register addresses (0-based).
- Temperatures are sent with an offset of 40 (raw 40 = 0 °C).
- Level 1 alarms are taken as warnings and level 2 alarms as faults (the document doesn't say what each level does).
- 'The two translations of the document differ in the GPS block (0x57 ff.: longitude, latitude, speed, altitude, satellites,
  IMEI) by up to two registers; it is left out, as are the remaining mileage (0x3E), the alarm threshold settings (0x8B-0xA4,
  0xA8), the board configuration (0x82-0x88), the password (0xC9), the IP address (0xCE ff.) and the restart / shutdown /
  reset commands (0xF0-0xF3).'
