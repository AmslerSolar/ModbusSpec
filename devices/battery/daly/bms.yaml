# Written from the Daly "Modbus protocol" register table (BMS / protection board, spreadsheet, undated), checked
# against the other translation of the same table, "dalyModbusProtocol" (undated).

modbusspec: 0
id: daly-bms
manufacturer: Daly
name: Smart BMS (protection board, RS485 Modbus)
kind: battery

sources:
- title: Modbus protocol (Daly BMS protection board protocol description, spreadsheet)
  version: undated (archived at commit b7233c92f2d4988e25ff21a970492bf74d6c0be4)
  url: https://github.com/syssi/esphome-daly-bms/blob/b7233c92f2d4988e25ff21a970492bf74d6c0be4/docs/Modbus%20protocol.xlsx
  sha256: 658427ff811c132cf97a24031cfdac1fe8e96cd09f194f5c5dc61ca62bd8736a
- title: dalyModbusProtocol (Daly BMS protocol description, spreadsheet, other translation)
  version: undated (archived at commit b7233c92f2d4988e25ff21a970492bf74d6c0be4)
  url: https://github.com/syssi/esphome-daly-bms/blob/b7233c92f2d4988e25ff21a970492bf74d6c0be4/docs/dalyModbusProtocol.xlsx
  sha256: 4e21d8813f7bbc08ca6e90211380a0cea862ab253aa990355c4fde700bab5dc0

connection:
  default_port: 502
  default_unit: 210
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # charge / discharge state
  - table: holding
    address: 47
    type: u16
    in:
    - 0
    - 1
    - 2
  # balancing
  - table: holding
    address: 52
    type: u16
    in:
    - 0
    - 1
  # charge MOS
  - table: holding
    address: 53
    type: u16
    in:
    - 0
    - 1
  # discharge MOS
  - table: holding
    address: 54
    type: u16
    in:
    - 0
    - 1
  # number of cells
  - table: holding
    address: 49
    type: u16
    range:
    - 1
    - 48
  # battery type
  - table: holding
    address: 137
    type: u16
    in:
    - 0
    - 1
    - 2

points:
  # Live data (0x28 ff.)
  - {key: battery_voltage, label: Total battery voltage, table: holding, address: 40, type: u16, unit: V, scale: 0.1}
  - {key: battery_current, label: Current, table: holding, address: 41, type: u16, unit: A, scale: 0.1, offset: -3000, positive: discharge, note: 'Raw value 30000 = 0 A; above = discharging, below = charging.'}
  - {key: battery_soc, label: SOC, table: holding, address: 42, type: u16, unit: '%', scale: 0.1, note: Raw 800 = 80 %.}
  - {key: x.max_cell_voltage, label: Maximum cell voltage, table: holding, address: 43, type: u16, unit: V, scale: 0.001}
  - {key: x.min_cell_voltage, label: Lowest cell voltage, table: holding, address: 44, type: u16, unit: V, scale: 0.001}
  - {key: x.max_temperature, label: Maximum cell temperature, table: holding, address: 45, type: u16, unit: °C, offset: -40}
  - {key: x.min_temperature, label: Minimum cell temperature, table: holding, address: 46, type: u16, unit: °C, offset: -40}
  - {key: state, label: Charge and discharge state, table: holding, address: 47, type: u16, enum: charge_state}
  - {key: x.remaining_capacity, label: Battery remaining capacity, table: holding, address: 48, type: u16, unit: Ah, scale: 0.1}
  - {key: x.cell_count, label: Number of cells, table: holding, address: 49, type: u16, poll: slow}
  - {key: x.temperature_sensor_count, label: Number of temperature sensors, table: holding, address: 50, type: u16, poll: slow}
  - {key: x.cycles, label: Number of battery cycles, table: holding, address: 51, type: u16, poll: slow}
  - {key: x.balancing, label: Balancing, table: holding, address: 52, type: u16, enum: off_on}
  - {key: x.charge_mos, label: Charging MOS state, table: holding, address: 53, type: u16, enum: off_on}
  - {key: x.discharge_mos, label: Discharge MOS state, table: holding, address: 54, type: u16, enum: off_on}
  - {key: x.average_cell_voltage, label: Average cell voltage, table: holding, address: 55, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_voltage_difference, label: Cell voltage difference, table: holding, address: 56, type: u16, unit: V, scale: 0.001}
  - {key: x.power, label: Power, table: holding, address: 57, type: u16, unit: W, verified: false, note: Unsigned; the direction is not stated (see register 0x2F).}
  - {key: x.fault_status_1, label: Fault status 1, table: holding, address: 58, type: u16, flags: fault_status_1, verified: false, note: 'Bits 0-7 = "byte 0", bits 8-15 = "byte 1" of the document (assumed; not stated).'}
  - {key: x.fault_status_2, label: Fault status 2, table: holding, address: 59, type: u16, flags: fault_status_2, verified: false}
  - {key: x.fault_status_3, label: Fault status 3, table: holding, address: 60, type: u16, flags: fault_status_3, verified: false}
  - {key: x.fault_status_4, label: Fault status 4, table: holding, address: 61, type: u16, flags: fault_status_4, verified: false}
