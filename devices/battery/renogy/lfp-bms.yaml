# Written from the Renogy Lithium Iron Battery BMS Modbus Protocol (V1.7, 2020-03-10).

modbusspec: 0
id: renogy-lfp-bms
manufacturer: Renogy
name: Lithium iron phosphate battery BMS (RS485)
kind: battery

sources:
- title: Lithium Iron Battery BMS Modbus Protocol (Suzhou RongSi New Energy Technology)
  version: V1.7 (2020-03-10)
  url: https://github.com/cyrils/renogy-bt/files/12444500/Lithium.Iron.Battery.BMS.Modbus.Protocol.V1.7.zh-CN.en.1.pdf
  sha256: 98188fb121783955f6f9302bf79dcc34bcfc1d77cb491b0228a600b1fd0dff72

connection:
  default_port: 502
  default_unit: 247
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 5110
    type: str
    length: 8
  checks:
  # number of cells
  - table: holding
    address: 5000
    type: u16
    range:
    - 1
    - 16
  # number of cell temperatures
  - table: holding
    address: 5017
    type: u16
    range:
    - 0
    - 16

points:
  # Cells (5000 ff.)
  - {key: x.cell_count, label: Number of Cell, table: holding, address: 5000, type: u16, poll: slow}
  - {key: x.cell_1_voltage, label: Cell 1 voltage, table: holding, address: 5001, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_2_voltage, label: Cell 2 voltage, table: holding, address: 5002, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_3_voltage, label: Cell 3 voltage, table: holding, address: 5003, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_4_voltage, label: Cell 4 voltage, table: holding, address: 5004, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_5_voltage, label: Cell 5 voltage, table: holding, address: 5005, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_6_voltage, label: Cell 6 voltage, table: holding, address: 5006, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_7_voltage, label: Cell 7 voltage, table: holding, address: 5007, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_8_voltage, label: Cell 8 voltage, table: holding, address: 5008, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_9_voltage, label: Cell 9 voltage, table: holding, address: 5009, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_10_voltage, label: Cell 10 voltage, table: holding, address: 5010, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_11_voltage, label: Cell 11 voltage, table: holding, address: 5011, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_12_voltage, label: Cell 12 voltage, table: holding, address: 5012, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_13_voltage, label: Cell 13 voltage, table: holding, address: 5013, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_14_voltage, label: Cell 14 voltage, table: holding, address: 5014, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_15_voltage, label: Cell 15 voltage, table: holding, address: 5015, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_16_voltage, label: Cell 16 voltage, table: holding, address: 5016, type: u16, unit: V, scale: 0.1}
  - {key: x.cell_temperature_count, label: Number of Cell Temperature, table: holding, address: 5017, type: u16, poll: slow}
  - {key: battery_temperature, label: Temperature of cell 1, table: holding, address: 5018, type: s16, unit: °C, scale: 0.1, verified: false, note: Signedness of the cell temperatures isn't stated (the limit registers are marked signed); taken as signed.}
  - {key: x.cell_temperature_2, label: Temperature of cell 2, table: holding, address: 5019, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.cell_temperature_3, label: Temperature of cell 3, table: holding, address: 5020, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.cell_temperature_4, label: Temperature of cell 4, table: holding, address: 5021, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.bms_temperature, label: Temperature of BMS board, table: holding, address: 5035, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.environment_temperature_count, label: Number of Environment Temperature, table: holding, address: 5036, type: u16, poll: slow}
  - {key: x.environment_temperature_1, label: Environment Temperature 1, table: holding, address: 5037, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.environment_temperature_2, label: Environment Temperature 2, table: holding, address: 5038, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.heater_temperature_count, label: Number of Heater Temperature, table: holding, address: 5039, type: u16, poll: slow}
  - {key: x.heater_temperature_1, label: Heater Temperature 1, table: holding, address: 5040, type: s16, unit: °C, scale: 0.1, verified: false}
  - {key: x.heater_temperature_2, label: Heater Temperature 2, table: holding, address: 5041, type: s16, unit: °C, scale: 0.1, verified: false}
  # Pack
  - {key: battery_current, label: Current, table: holding, address: 5042, type: s16, unit: A, scale: 0.01, positive: charge, verified: false, note: Signed; the direction isn't stated. Assumed positive = charging.}
  - {key: battery_voltage, label: Module voltage, table: holding, address: 5043, type: u16, unit: V, scale: 0.1}
  - {key: x.remaining_capacity, label: Remain capacity, table: holding, address: 5044, type: u32, unit: Ah, scale: 0.001, note: The document gives the unit as 0.001 A; it is a capacity (mAh).}
  - {key: x.total_capacity, label: Module total capacity, table: holding, address: 5046, type: u32, unit: Ah, scale: 0.001, poll: slow}
  - {key: x.cycles, label: Cycle number, table: holding, address: 5048, type: u16, poll: slow}
  - {key: x.charge_voltage_limit, label: Charge voltage limit, table: holding, address: 5049, type: u16, unit: V, scale: 0.1}
  - {key: x.discharge_voltage_limit, label: Discharge voltage limit, table: holding, address: 5050, type: u16, unit: V, scale: 0.1}
  - {key: x.charge_current_limit, label: Charge current limit, table: holding, address: 5051, type: u16, unit: A, scale: 0.01}
  - {key: x.discharge_current_limit, label: Discharge current limit, table: holding, address: 5052, type: s16, unit: A, scale: 0.01, note: Marked signed in the document.}
  # Alarms and status (5100 ff.)
  - {key: x.cell_voltage_alarms, label: Cell voltage Alarminfo, table: holding, address: 5100, type: u32, note: 'Two bits per cell, cell 1 in bits 0–1 up to cell 16 in bits 30–31: 0 normal, 1 below the lower limit, 2 above the upper limit, 3 other alarm.'}
  - {key: x.cell_temperature_alarms, label: Cell Temperature Alarminfo, table: holding, address: 5102, type: u32, note: 'Two bits per cell temperature, cell 1 in bits 0–1 up to cell 16 in bits 30–31; values as for 5100.'}
  - {key: x.other_alarms, label: Other Alarminfo, table: holding, address: 5104, type: u32, note: 'Two bits each (values as for 5100): BMS board temperature 30–31, environment temperature 1 28–29, 2 26–27, heater temperature 1 24–25, 2 22–23, charge current 20–21, discharge current 18–19.'}
  - {key: x.status1, label: Status1, table: holding, address: 5106, type: u16, flags: status1}
  - {key: x.status2, label: Status2, table: holding, address: 5107, type: u16, flags: status2}
  - {key: x.status3, label: Status3, table: holding, address: 5108, type: u16, flags: status3}
  - {key: x.charge_discharge_status, label: 'Charge, discharge status', table: holding, address: 5109, type: u16, flags: charge_discharge_status}
  # Identity (5110 ff.)
  - {key: serial, label: SN Number, table: holding, address: 5110, type: str, length: 8, poll: slow}
  - {key: x.manufacture_version, label: Manufacture version, table: holding, address: 5118, type: str, length: 1, poll: slow}
  - {key: x.mainline_version, label: Main line version, table: holding, address: 5119, type: str, length: 2, poll: slow}
  - {key: x.protocol_version, label: Communication protocol version, table: holding, address: 5121, type: str, length: 1, poll: slow}
  - {key: x.battery_name, label: Battery name, table: holding, address: 5122, type: str, length: 8, poll: slow}
  - {key: firmware, label: Software Version, table: holding, address: 5130, type: str, length: 2, poll: slow}
  - {key: x.manufacturer_name, label: Manufacturer Name, table: holding, address: 5132, type: str, length: 10, poll: slow}
  # Settings (5200 ff.), a selection
  - {key: x.cell_over_voltage_limit, label: Cell over voltage limit, table: holding, address: 5200, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.cell_under_voltage_limit, label: Cell under voltage limit, table: holding, address: 5203, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.module_over_voltage_limit, label: Module over voltage limit, table: holding, address: 5211, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.module_under_voltage_limit, label: Module under voltage limit, table: holding, address: 5214, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.shutdown, label: Shutdown command, table: holding, address: 5222, type: u16, enum: shutdown, writable: true, poll: slow}
  - {key: x.device_id, label: Device ID, table: holding, address: 5223, type: u16, writable: true, min: 3, max: 247, poll: slow, note: Modbus unit id.}
  - {key: x.charge_power_setting, label: Charging power setting, table: holding, address: 5228, type: u16, unit: '%', writable: true, poll: slow, note: Default 100 %.}
  - {key: x.discharge_power_setting, label: Discharge power setting, table: holding, address: 5229, type: u16, unit: '%', writable: true, poll: slow, note: Default 100 %.}

enums:
  shutdown: {'0': No action, '1': Shutdown}

flags:
  status1: {'0': Short circuit (protection), '1': Charge MOSFET on, '2': Discharge MOSFET on, '3': Using battery module power, '4': Charge over current 2 (protection), '5': Discharge over current 2 (protection), '6': Module over voltage (protection), '7': Cell under voltage (protection), '8': Cell over voltage (protection), '9': Charge over current 1 (protection), '10': Discharge over current 1 (protection), '11': Discharge under temperature (protection), '12': Discharge over temperature (protection), '13': Charge under temperature (protection), '14': Charge over temperature (protection), '15': Module under voltage (protection)}
  status2: {'0': Cell low voltage (warning), '1': Cell high voltage (warning), '2': Module low voltage (warning), '3': Module high voltage (warning), '4': Charge low temperature (warning), '5': Charge high temperature (warning), '6': Discharge low temperature (warning), '7': Discharge high temperature (warning), '8': Buzzer on, '11': Fully charged, '13': Heater on, '14': Effective discharge current, '15': Effective charge current}
  status3: {'0': Cell 1 voltage error, '1': Cell 2 voltage error, '2': Cell 3 voltage error, '3': Cell 4 voltage error, '4': Cell 5 voltage error, '5': Cell 6 voltage error, '6': Cell 7 voltage error, '7': Cell 8 voltage error, '8': Cell 9 voltage error, '9': Cell 10 voltage error, '10': Cell 11 voltage error, '11': Cell 12 voltage error, '12': Cell 13 voltage error, '13': Cell 14 voltage error, '14': Cell 15 voltage error, '15': Cell 16 voltage error}
  charge_discharge_status: {'3': Full charge request, '4': Charge immediately, '5': Charge immediately, '6': Discharge enabled (0 = request to stop discharging), '7': Charge enabled (0 = request to stop charging)}

problems:
  - {when: {key: x.status1, bit: 0}, kind: fault, text: Short circuit protection}
  - {when: {key: x.status1, bit: 4}, kind: fault, text: Charge over current 2 protection}
  - {when: {key: x.status1, bit: 5}, kind: fault, text: Discharge over current 2 protection}
  - {when: {key: x.status1, bit: 6}, kind: fault, text: Module over voltage protection}
  - {when: {key: x.status1, bit: 7}, kind: fault, text: Cell under voltage protection}
  - {when: {key: x.status1, bit: 8}, kind: fault, text: Cell over voltage protection}
  - {when: {key: x.status1, bit: 9}, kind: fault, text: Charge over current 1 protection}
  - {when: {key: x.status1, bit: 10}, kind: fault, text: Discharge over current 1 protection}
  - {when: {key: x.status1, bit: 11}, kind: fault, text: Discharge under temperature protection}
  - {when: {key: x.status1, bit: 12}, kind: fault, text: Discharge over temperature protection}
  - {when: {key: x.status1, bit: 13}, kind: fault, text: Charge under temperature protection}
  - {when: {key: x.status1, bit: 14}, kind: fault, text: Charge over temperature protection}
  - {when: {key: x.status1, bit: 15}, kind: fault, text: Module under voltage protection}
  - {when: {key: x.status2, bit: 0}, kind: warning, text: Cell low voltage}
  - {when: {key: x.status2, bit: 1}, kind: warning, text: Cell high voltage}
  - {when: {key: x.status2, bit: 2}, kind: warning, text: Module low voltage}
  - {when: {key: x.status2, bit: 3}, kind: warning, text: Module high voltage}
  - {when: {key: x.status2, bit: 4}, kind: warning, text: Charge low temperature}
  - {when: {key: x.status2, bit: 5}, kind: warning, text: Charge high temperature}
  - {when: {key: x.status2, bit: 6}, kind: warning, text: Discharge low temperature}
  - {when: {key: x.status2, bit: 7}, kind: warning, text: Discharge high temperature}
  - {when: {key: x.status3, not: 0}, kind: fault, text: 'Cell voltage error (cells 0x{value:X})'}

notes:
- The document is issued by Suzhou RongSi New Energy Technology and doesn't name Renogy; it was published for Renogy lithium
  iron phosphate batteries.
- Modbus RTU on RS485 (initial 9600 baud; frame format not stated), functions 03, 06 and 16, up to 125 registers per read.
  Default unit id 247 (0xF7) from V1.3 on; 255 (0xFF) is the broadcast address. Port 502 is only for an RS485 gateway. The
  battery also has a CAN port (500 kbit/s), not described here.
- Register addresses are given as decimal PDU addresses (0-based) and used as given.
- 'Unused cell and temperature slots: the counts in 5000, 5017, 5036 and 5039 say how many are fitted (up to 16 cells, 16
  cell temperatures, 2 environment and 2 heater temperatures). Cell temperatures 5 to 16 (5022–5033) are left out here.'
- There is no state-of-charge register; remaining / total capacity (5044 / 5046) gives it.
- Cell voltages have 0.1 V resolution in the document.
- 'Left out: the charge, temperature and current warning / limit thresholds other than the four voltage limits (5201–5221),
  lock control and test registers (5224–5225), the unique id (5226) and the address-assignment registers 61440–61442. Functions
  0x78 (factory reset) and 0x79 (clear history) exist.'
