  - {key: x.mppt1_status, label: MPPT1 working status, table: holding, address: 560, type: u16, enum: dcdc_status, note: MPPT units 1–20 at 560–579; only the first is listed here. Same value table as the DCDC units.}
  - {key: x.pmc_status, label: PMC status, table: holding, address: 580, type: u16, enum: pmc_status}
