# Written from the DuNext PowerMount-P960-2007kWh Series Modbus Interface Definitions (issue 02, 2026-04-08).
# The PowerMount-P960-2250kWh Series document (issue 01, 2026-04-08) has the same register map word for word, and so
# have chapters 3–6 of the PowerMount-P960-2250kWh Local EMS document (issue 03, 2026-04-17).

modbusspec: 0
id: dunext-powermount
manufacturer: DuNext
name: PowerMount P960 battery storage cabinet (ESS controller PUC)
kind: battery

sources:
- title: PowerMount-P960-2007kWh Series Modbus Interface Definitions
  version: 02 (2026-04-08)
  url: https://artsani-energy.ro/wp-content/uploads/2026/08/dunext-powermount-modbus-2-mwh.pdf
  sha256: 76f0e896815efa4a38b69a82c22925e10c28b487882edf41ac1b290aed78afb0
- title: PowerMount-P960-2250kWh Series Modbus Interface Definitions
  version: 01 (2026-04-08)
  url: https://artsani-energy.ro/wp-content/uploads/2026/08/dunext-powermount-modbus-2-25-mwh.pdf
  sha256: 9508af24cbe7533cad8921fcab601ea916769e3ee2759826f55a3a3289f84fd9
- title: PowerMount-P960-2250kWh Series Local EMS Modbus Interface Definitions
  version: 03 (2026-04-17)
  url: https://artsani-energy.ro/wp-content/uploads/2026/08/dunext-ems-modbus.pdf
  sha256: d21ed70022177ceb5f2a440fee3d60a79bb3527cd787685e0e9b9ce59c655011

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # working status
  - table: holding
    address: 300
    type: u16
    in:
    - 1
    - 2
    - 3
  # working mode
  - table: holding
    address: 301
    type: u16
    in:
    - 1
    - 2
    - 3
    - 11
  # PCS summary status
  - table: holding
    address: 371
    type: u16
    in:
    - 1
    - 2
    - 3
  # BMS summary status
  - table: holding
    address: 377
    type: u16
    in:
    - 1
    - 2
    - 3

points:
  # PUC summary data (300 ff.)
  - {key: state, label: Working status, table: holding, address: 300, type: u16, enum: stop_run_fault}
  - {key: x.working_mode, label: Working mode, table: holding, address: 301, type: u16, enum: working_mode}
  - {key: x.max_discharge_power, label: Allowable discharge active power limit, table: holding, address: 302, type: s16, unit: kW, scale: 0.1}
  - {key: x.max_charge_power, label: Allowable charging active power limit, table: holding, address: 303, type: s16, unit: kW, scale: 0.1}
  - {key: x.grid_voltage, label: System grid voltage, table: holding, address: 304, type: u16, unit: V, scale: 0.1}
  - {key: grid_power, label: System grid active power, table: holding, address: 305, type: s16, unit: W, scale: 100, positive: export, verified: false, note: kW × 0.1 in the document. Sign not stated in the document; assumed + = export.}
  - {key: x.load_voltage, label: Load voltage, table: holding, address: 306, type: s16, unit: V, scale: 0.1}
  - {key: load_power, label: Load active power, table: holding, address: 307, type: u16, unit: W, scale: 100, note: kW × 0.1 in the document.}
  - {key: pv_power, label: MPPT total power, table: holding, address: 308, type: u16, unit: W, scale: 100, note: kW × 0.1 in the document.}
  - {key: grid_import_energy, label: Grid input active energy, table: holding, address: 319, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_export_energy, label: Grid output active energy, table: holding, address: 321, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.load_energy, label: Load output active energy, table: holding, address: 323, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: pv_energy, label: PV input active energy, table: holding, address: 325, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.io_input, label: IO input, table: holding, address: 338, type: u16, flags: io_input}
  - {key: x.io_output, label: IO output, table: holding, address: 339, type: u16, flags: io_output}
  - {key: x.alarm_0, label: Alarm 0, table: holding, address: 340, type: u16, flags: alarm_0}
  - {key: x.alarm_1, label: Alarm 1, table: holding, address: 341, type: u16, flags: alarm_1, note: 'Bits 0–3 tell whether the battery cabinets (BC), ACDC, DCDC and MPPT units are available; a unit that has failed is unavailable.'}
  - {key: x.fault_0, label: Fault 0, table: holding, address: 342, type: u16, flags: fault_0, note: The smoke sensor fault is reported when both smoke sensors are triggered.}
  - {key: x.fault_1, label: Fault 1, table: holding, address: 343, type: u16, flags: fault_1}
  - {key: x.alarm_2, label: Alarm 2, table: holding, address: 344, type: u16, flags: alarm_2}
  - {key: x.io2_input, label: IO2 input, table: holding, address: 345, type: u16, flags: io2_input}
  - {key: x.alarm_3, label: Alarm 3, table: holding, address: 346, type: u16, flags: alarm_3}
