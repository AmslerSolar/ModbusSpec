notes:
- Modbus TCP to the ESS controller (PUC), default IP 192.168.1.100, port 502, unit id 1; the cabinet also has an external
  RS485 port (485-1). Serial settings aren't given. Behind a DuNext Local EMS the cabinets answer on unit ids 1, 2, … (see
  dunext-powermount-ems).
- Function codes 03 (read) and 06 (write single register) only. Addresses are the document's register numbers as they are
  (its example reads 300 as 0x012C).
- Energy counters are two registers, high word first, read here as one 32-bit value.
- 'The document states a sign only for the active power control (702: − = charging, + = discharging). The grid power, battery
  power and battery current signs here are assumed and unverified.'
- BMS 1–20 at 15000 + 1000 × (n − 1) and PCS 1–20 at 4000 + 100 × (n − 1); only BMS 1 and PCS 1 are listed. Likewise only
  the first of the 20 BC, ACDC, DCDC and MPPT status registers (500–579).
- 'Left out: the BC / ACDC / DCDC / MPPT version summaries (408–420), boot and protocol versions, the cell numbers of the
  extreme temperatures, the BMS detector values (PM2.5, temperature, CO; no unit given), the BMS clock, the bit list at 15022
  (marked reserved), the per-cell voltages (15100–15549) and temperatures (15550–15999), IGBT 2–6 temperatures, PCS setting
  echoes (4036–4042) and parallel operation info (4053–4056).'
