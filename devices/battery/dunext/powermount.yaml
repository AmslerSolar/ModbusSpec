  - {key: battery_power, label: Total DC power of battery cabinet, table: holding, address: 428, type: s16, unit: W, scale: 100, positive: discharge, verified: false, note: 'kW × 0.1 in the document. Sign not stated in the document; assumed + = discharging, as the active power control register (702).'}
  - {key: x.max_cell_voltage_cluster, label: Cluster number with highest cell voltage, table: holding, address: 430, type: s16}
  - {key: x.max_cell_voltage_cabinet, label: Battery cabinet number with highest cell voltage, table: holding, address: 431, type: s16}
