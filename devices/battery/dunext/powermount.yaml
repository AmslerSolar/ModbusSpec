  - {key: x.pcs_ac_power, label: Summary of PCS AC active power, table: holding, address: 372, type: s16, unit: kW, scale: 0.1, verified: false, note: 'Sign not stated; presumably + = discharging, as the active power control register (702).'}
  - {key: x.pcs_ac_current, label: Summary of PCS AC current, table: holding, address: 373, type: s16, unit: A, scale: 0.1}
  - {key: l1_voltage, label: Summary of PCS AC phase A voltage, table: holding, address: 374, type: u16, unit: V, scale: 0.1}
