  - {key: x.pmc_software_version, label: PMC software version, table: holding, address: 362, type: u16, poll: slow}
  - {key: x.hmi_software_version, label: HMI software version, table: holding, address: 364, type: u16, poll: slow}
  - {key: x.clock, label: Date and time, table: holding, address: 365, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow, verified: false, note: 'One register each for year, month, day, hour, minute and second. Whether the year is the full year (2026) isn''t stated; assumed.'}
