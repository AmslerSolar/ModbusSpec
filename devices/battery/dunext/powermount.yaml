  - {key: battery_current, label: Summary of BMS pack current, table: holding, address: 379, type: s16, unit: A, scale: 0.1, positive: discharge, verified: false, note: 'Sign not stated in the document; assumed + = discharging, as the active power control register (702).'}
  - {key: battery_soc, label: Summary of BMS pack SOC, table: holding, address: 380, type: u16, unit: '%', note: The document gives no unit; percent assumed.}
  - {key: battery_soh, label: Summary of BMS pack SOH, table: holding, address: 381, type: u16, unit: '%'}
  - {key: x.dcdc_status, label: Summary of DCDC status, table: holding, address: 382, type: u16, enum: stop_run_fault_short}
