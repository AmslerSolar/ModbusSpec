# Written from the DuNext PowerMount-P960-2250kWh Series Local EMS Modbus Interface Definitions (issue 03,
# 2026-04-17), chapter 2 (EMS registers). Its chapters 3–6 repeat the cabinet register map, see dunext-powermount.

modbusspec: 0
id: dunext-powermount-ems
manufacturer: DuNext
name: PowerMount Local EMS (site controller for PowerMount cabinets)
kind: battery

sources:
- title: PowerMount-P960-2250kWh Series Local EMS Modbus Interface Definitions
  version: 03 (2026-04-17)
  url: https://artsani-energy.ro/wp-content/uploads/2026/08/dunext-ems-modbus.pdf
  sha256: d21ed70022177ceb5f2a440fee3d60a79bb3527cd787685e0e9b9ce59c655011

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # working status
  - table: holding
    address: 1
    type: u16
    in:
    - 1
    - 2
    - 3
  # working mode
  - table: holding
    address: 2
    type: u16
    in:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 7
  # control source
  - table: holding
    address: 3
    type: u16
    in:
    - 0
    - 1
    - 2

points:
  # Status and measurements (1 ff.)
  - {key: state, label: Working status, table: holding, address: 1, type: u16, enum: working_status}
  - {key: x.working_mode, label: Working mode, table: holding, address: 2, type: u16, enum: working_mode}
  - {key: x.control_source, label: Control power, table: holding, address: 3, type: u16, enum: control_source}
  - {key: x.max_discharge_power, label: Permissible discharge active power limit, table: holding, address: 4, type: u16, unit: kW, scale: 0.1}
  - {key: x.max_charge_power, label: Permissible charge active power limit, table: holding, address: 5, type: u16, unit: kW, scale: 0.1}
  - {key: x.system_active_power, label: System active power, table: holding, address: 6, type: s16, unit: kW, scale: 0.1, verified: false, note: 'Sign not stated; presumably + = discharging, as the active power control (63).'}
  - {key: load_power, label: Load active power, table: holding, address: 7, type: s16, unit: W, scale: 100, note: kW × 0.1 in the document.}
  - {key: grid_power, label: Grid active power, table: holding, address: 8, type: s16, unit: W, scale: 100, positive: export, verified: false, note: kW × 0.1 in the document. Sign not stated in the document; assumed + = export.}
  - {key: pv_power, label: MPPT total power, table: holding, address: 9, type: s16, unit: W, scale: 100, note: kW × 0.1 in the document.}
  - {key: grid_import_energy, label: Grid input active energy, table: holding, address: 10, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_export_energy, label: Grid output active energy, table: holding, address: 12, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.load_energy, label: Load output active energy, table: holding, address: 14, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.charge_forbidden, label: High voltage charging prohibition flag, table: holding, address: 16, type: u16, enum: normal_forbidden}
  - {key: x.discharge_forbidden, label: Low voltage discharging prohibition flag, table: holding, address: 17, type: u16, enum: normal_forbidden}
  - {key: x.device_number, label: Device number, table: holding, address: 18, type: u16, poll: slow}
  - {key: pv_energy, label: MPPT power generation, table: holding, address: 19, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_charge_energy, label: BMS historical charging energy, table: holding, address: 21, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_energy, label: BMS historical discharge energy, table: holding, address: 23, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.anti_backflow_state, label: Anti-backflow state, table: holding, address: 25, type: u16, note: 'G100 anti-backflow status 1, 2 or 3; the meaning of each isn''t given.'}
  - {key: battery_soc, label: System SOC, table: holding, address: 26, type: u16, unit: '%'}
  - {key: x.system_alarm_0, label: System alarm 0, table: holding, address: 27, type: u16, flags: system_alarm_0}
  - {key: x.system_alarm_1, label: System alarm 1, table: holding, address: 28, type: u16, flags: system_alarm_1}
  - {key: x.system_fault_0, label: System fault 0, table: holding, address: 29, type: u16, flags: system_fault_0}
  - {key: x.system_fault_1, label: System fault 1, table: holding, address: 30, type: u16, note: The bit meanings aren't given.}
  - {key: x.fault_free_days, label: Days of fault-free operation, table: holding, address: 31, type: u16, unit: d, poll: slow}
  - {key: x.system_alarm_2, label: System alarm 2, table: holding, address: 32, type: u16, note: The bit meanings aren't given.}
  - {key: x.meter_forward_energy, label: P - Forward total active energy, table: holding, address: 33, type: u32, unit: kWh, poll: slow, verified: false, note: Which meter (P) and which direction is forward isn't stated.}
  - {key: x.meter_reverse_energy, label: P - Reverse total active energy, table: holding, address: 35, type: u32, unit: kWh, poll: slow, verified: false}
  - {key: x.grid_voltage, label: Grid voltage, table: holding, address: 37, type: u16, unit: V, scale: 0.1, verified: false, note: The document gives no unit; V assumed.}
  - {key: x.grid_current, label: Grid current, table: holding, address: 38, type: u16, unit: A, scale: 0.1, verified: false, note: The document gives no unit; A assumed.}
  - {key: x.grid_power_factor, label: Grid power factor, table: holding, address: 39, type: u16, scale: 0.001}
  - {key: x.clock, label: Date and time, table: holding, address: 40, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow, verified: false, note: 'One register each for year, month, day, hour, minute and second. Whether the year is the full year (2026) isn''t stated; assumed.'}
  - {key: x.ems_version, label: EMS version number, table: holding, address: 46, type: u16, poll: slow}
  - {key: x.e_forward_energy, label: E - Forward active total energy, table: holding, address: 47, type: u32, unit: kWh, poll: slow, verified: false, note: 'The document gives no unit; kWh assumed, as for the P meter (33). Which meter (E) isn''t stated.'}
  - {key: x.e_reverse_energy, label: E - Reverse active total energy, table: holding, address: 49, type: u32, unit: kWh, poll: slow, verified: false}
  - {key: x.collection_program_version, label: Collection program version number, table: holding, address: 51, type: u16, poll: slow}
  - {key: x.web_server_version, label: Web server version number, table: holding, address: 52, type: u16, poll: slow}
  - {key: x.ac_pv_power, label: AC_PV active power, table: holding, address: 53, type: s16, unit: kW, scale: 0.1}
  - {key: x.pcs_summary_status, label: Summary PCS status, table: holding, address: 54, type: u16, enum: pcs_summary_status}
  - {key: x.soc_precise, label: High precision SOC, table: holding, address: 55, type: u16, unit: '%', scale: 0.1}
  - {key: x.max_load_power, label: Maximum load power, table: holding, address: 56, type: u16, unit: kW}
  - {key: x.charging_pile_power, label: Summary of charging pile power, table: holding, address: 57, type: u16, unit: kW, scale: 0.1}
  - {key: x.charging_pile_count, label: Number of charging stations, table: holding, address: 58, type: u16, poll: slow}
  - {key: x.generator_power, label: Diesel generator power, table: holding, address: 59, type: s16, unit: kW, scale: 0.1, note: The diesel generator meter has id 3.}
  # Settings (60 ff.)
  - {key: x.system_mode_control, label: System mode control, table: holding, address: 60, type: u16, enum: working_mode, writable: true, poll: slow}
  - {key: x.system_status_control, label: System status control, table: holding, address: 61, type: u16, enum: start_stop, writable: true, poll: slow}
  - {key: x.control_source_setting, label: Control power, table: holding, address: 62, type: u16, enum: control_source, writable: true, poll: slow}
  - {key: x.active_power_setpoint, label: Active power control, table: holding, address: 63, type: s16, unit: kW, scale: 0.1, writable: true, poll: slow, note: − = charging.}
  - {key: x.reactive_power_setpoint, label: Reactive power control, table: holding, address: 64, type: s16, unit: kvar, scale: 0.1, writable: true, poll: slow}
  - {key: x.soc_high, label: SOC-H (state of charge high), table: holding, address: 65, type: u16, unit: '%', writable: true, poll: slow, verified: false, note: The document gives no unit; percent assumed (also for 79–86).}
  - {key: x.soc_low, label: SOC-L (state of charge low), table: holding, address: 66, type: u16, unit: '%', writable: true, poll: slow, verified: false}
  - {key: x.backup_charge_power, label: Backup charging power, table: holding, address: 67, type: s16, unit: kW, scale: 0.1, writable: true, poll: slow}
  - {key: x.clear_faults, label: Clear faults, table: holding, address: 72, type: u16, writable: true, poll: slow}
  - {key: x.control_rights, label: EMS control rights, table: holding, address: 75, type: u16, enum: control_rights, writable: true, poll: slow}
  - {key: x.station_max_power, label: Station maximum power, table: holding, address: 76, type: u16, writable: true, poll: slow, note: The document gives no unit.}
  - {key: x.pv_rated_power, label: PV rated power, table: holding, address: 77, type: u16, writable: true, poll: slow, note: The document gives no unit.}
  - {key: x.expansion_flag, label: Expansion flag, table: holding, address: 78, type: u16, enum: expansion_flag, writable: true, poll: slow}
  - {key: x.bcm_soc_low, label: BCM_SOCL (reserved SOC), table: holding, address: 79, type: u16, unit: '%', writable: true, poll: slow, verified: false}
  - {key: x.pv_power_control, label: PV power control, table: holding, address: 80, type: u16, unit: kW, scale: 0.1, writable: true, poll: slow}
  - {key: x.min_soc, label: MIN_SOC (SOC lower limit), table: holding, address: 81, type: u16, unit: '%', writable: true, poll: slow, verified: false}
  - {key: x.backup_soc, label: BCP_SOC (backup SOC), table: holding, address: 82, type: u16, unit: '%', writable: true, poll: slow, verified: false}
  - {key: x.peak_valley_pv_soc, label: DCM_SOC (SOC limit for peak-valley PV systems), table: holding, address: 83, type: u16, unit: '%', writable: true, poll: slow, verified: false}
