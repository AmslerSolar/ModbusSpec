  - {key: x.g100_enable, label: Whether to use G100 settings, table: holding, address: 103, type: u16, enum: off_on, writable: true, poll: slow}
  - {key: x.di_stop_enable, label: DI triggered stop setting, table: holding, address: 104, type: u16, enum: off_on, writable: true, poll: slow}
