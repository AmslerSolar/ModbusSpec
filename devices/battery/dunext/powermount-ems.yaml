  system_alarm_1: {'0': BC1 communication interrupted, '1': BC2 communication interrupted, '2': BC3 communication interrupted, '3': BC4 communication interrupted, '4': BC5 communication interrupted, '5': BC6 communication interrupted, '6': BC7 communication interrupted, '7': BC8 communication interrupted, '8': Meter communication interrupted, '9': PVM communication interrupted, '10': Meter 2 communication interrupted}
  system_fault_0: {'10': Power meter communication completely interrupted, '14': PVM communication interrupted, '15': SmartLogger communication interrupted}
  pv_alarm: {'0': PV inverter 1 communication interrupted, '1': PV inverter 2 communication interrupted, '2': PV inverter 3 communication interrupted, '3': PV inverter 4 communication interrupted, '4': PV inverter 5 communication interrupted, '5': PV inverter 6 communication interrupted, '6': PV inverter 7 communication interrupted, '7': PV inverter 8 communication interrupted, '8': PV inverter 9 communication interrupted, '9': PV inverter 10 communication interrupted, '10': PV inverter 11 communication interrupted, '11': PV inverter 12 communication interrupted, '12': PV inverter 13 communication interrupted, '13': PV inverter 14 communication interrupted, '14': PV inverter 15 communication interrupted}
  charging_pile_alarm: {'0': Charging pile 1 communication interrupted, '1': Charging pile 2 communication interrupted, '2': Charging pile 3 communication interrupted, '3': Charging pile 4 communication interrupted, '4': Charging pile 5 communication interrupted, '5': Charging pile 6 communication interrupted, '6': Charging pile 7 communication interrupted, '7': Charging pile 8 communication interrupted, '8': Charging pile 9 communication interrupted, '9': Charging pile 10 communication interrupted}

