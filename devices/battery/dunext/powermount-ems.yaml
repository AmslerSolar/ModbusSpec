notes:
- Modbus TCP to the PowerMount Local EMS, default IP 192.168.1.200, port 502; the EMS answers on unit id 1. The cabinets behind
  it answer on unit ids 1, 2, … with the cabinet register map (PUC, BMS, PCS; see dunext-powermount). The document shows an
  RTU frame example too but names no serial port or settings for the EMS.
- Function codes 03 (read) and 06 (write single register) only. Addresses are the document's register numbers as they are
  (its example reads 300 as 0x012C).
- Energy counters are two registers, high word first (the document calls them high and low byte), read here as one 32-bit
  value.
- 'Signs: only the active power control (63) is stated (− = charging). The grid power sign is assumed (+ = export) and unverified;
  the system active power sign is unknown.'
- SOC settings (65, 66, 79, 81–84) have no unit in the document; percent assumed.
- 'Left out: the meter CT ratios, SOC interval and mean settings, power command and distribution settings, generator limits,
  PV inverter type / quantity, time configuration reset, generator SOC_M and charging pile capacity (68–71, 73, 74, 86–94,
  96, 98–100, 102, 105, 106), and the writable copies of the version numbers.'
