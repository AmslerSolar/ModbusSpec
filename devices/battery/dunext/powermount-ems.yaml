  - {key: x.charging_pile_alarm, label: Charging pile alarm, table: holding, address: 201, type: u16, flags: charging_pile_alarm}

enums:
  working_status: {'1': Shutdown, '2': Running, '3': Fault}
  working_mode: {'1': P/Q, '2': Off-grid, '3': Off-grid, '4': Peak-valley, '5': Backup power, '7': PV self-use}
  control_source: {'0': IOT control / EMS (RS485-2), '1': Client control (RS485-1), '2': HMI control (CAN2)}
  normal_forbidden: {'0': Normal, '1': Forbidden}
  pcs_summary_status: {'1': Fault, '2': On-grid, '3': Off-grid, '4': Bypass}
  start_stop: {'2': Stop, '6': Running}
  control_rights: {'0': Network, '1': COM}
  expansion_flag: {'0': Discharge down to SOCL, '1': 'Stop at BCM_SOCL, then expansion mode down to SOCL'}
  pv_operation_mode: {'7': 'Load first, rest to storage (AC coupling)', '8': 'Load first, rest to grid, charging in time periods (AC coupling)', '9': 'PV + time periods (PV not controllable, AC coupling)', '10': 'PV (direct MPPT, DC coupling)', '11': Control circuit breaker, '12': 'Storage first, rest to load (AC coupling)', '13': 'PV not controllable (no time periods, AC coupling)', '14': 'PV to storage first + time periods (PV controllable, AC coupling)'}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  off_on: {'0': 'Off', '1': 'On'}

flags:
