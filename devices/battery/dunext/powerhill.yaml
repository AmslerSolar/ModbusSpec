# Written from the DuNext PowerHill (261kWh) Modbus Interface Definitions (issue 01, 2026-05-18).

modbusspec: 0
id: dunext-powerhill
manufacturer: DuNext
name: PowerHill 261 kWh battery storage cabinet (EMS master station)
kind: battery

sources:
- title: PowerHill (261kWh) Modbus Interface Definitions
  version: 01 (2026-05-18)
  url: https://artsani-energy.ro/wp-content/uploads/2026/08/dunext-powerhill-261-modbus.pdf
  sha256: cba792fca8d024785a67501a6f2435fcc7e51d521a5fc598d2ba47a5220808de

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # EMS online flag
  - table: input
    address: 30001
    type: s32
    unit_id: 1
    in:
    - 0
    - 1
  # PCS operating status
  - table: input
    address: 30049
    type: s32
    unit_id: 2
    in:
    - 0
    - 1
    - 3
    - 5
    - 9
    - 32
    - 64
    - 257
    - 8256

points:
  # EMS (unit id 1)
  - {key: x.ems_online, label: Online, table: input, address: 30001, type: s32, enum: online}
  - {key: x.system_status, label: System operating status, table: input, address: 30003, type: s32, enum: normal_abnormal}
  - {key: x.system_active_power, label: Total active power, table: input, address: 30005, type: s32, unit: kW, scale: 0.1, verified: false, note: Sign not stated in the document.}
  - {key: x.system_reactive_power, label: Total reactive power, table: input, address: 30007, type: s32, unit: kvar, scale: 0.1}
