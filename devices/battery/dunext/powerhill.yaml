notes:
- 'Modbus TCP to the EMS master station''s WAN2 port (default IP 192.168.30.101, port 502). The station answers for its parts
  on separate unit ids: 1 = EMS, 2 = PCS, 34 = battery master BMS, 98 = single cell values, 170 = liquid cooling unit, 172
  = other devices (dehumidifier at 30501 ff., DI/DO at 30001 ff.).'
- 'Addresses: the document''s register numbers (10001, 30001, 40001 …) are sent as they are; its example reads 40009 as address
  0x9C49. So here address = the listed number, in the table of the function code the document gives (02 discrete inputs, 04
  input registers, 03 holding registers). Read-only values use 04 and 02; read-write values 03, 06 and 16. Not tried on a
  device.'
- Every register value is a 32-bit integer (I32) or float (F32) in two registers, big-endian, high word first.
- 'Signs of power and current aren''t stated, except the strategy power registers (40021 ff.: − = charging, + = discharging);
  the battery power and current here assume the same and are unverified.'
- Discrete alarm inputs are listed per unit; their problem kind follows the document's wording (1 = fault / latched → fault,
  1 = alarm / abnormal / protected → warning). For the liquid cooling inputs the document also names 255 = alarm disabled,
  which a discrete input can't carry. The EMS 'DI trigger hold signal' (10013) has no meaning given and raises no problem.
- 'Left out: the 24 time-of-use strategies (40013–40299), monthly demand thresholds and the other EMS settings (40301–40523),
  PCS setting echoes and protection points (30159–30341), BMS alarm / halt thresholds (30191–30525), all single cell voltages
  and temperatures (unit 98, 30003 ff., 30523 ff.), liquid cooling runtimes, counters and settings, and dehumidifier settings.'
