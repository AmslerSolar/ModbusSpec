modbusspec: 0
id: hyxi-halo
manufacturer: HYXIPower
name: HALO micro storage (HYX-MS3000AC)
kind: battery

sources:
- id: hyxi-cloud
  title: ha-hyxi-cloud (Home Assistant integration)
  url: https://github.com/Veldkornet/ha-hyxi-cloud
  license: MIT
  commit: 0d1172e7a231f13a6e1f9b1eb305a396c3a4e002
  path: custom_components/hyxi_cloud/modbus/registers.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 100
    min_interval_ms: 200

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - hyxi-cloud

points:
  - {key: x.workmodesetting_mode, label: Workmodesetting mode, table: holding, address: 4024, type: u16, enum: work_mode_setting, writable: true, note: Reported back in input 4102 unless VPP dispatch is on.}
