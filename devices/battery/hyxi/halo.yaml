  - {key: x.identity_arm_version, label: Identity arm version, table: input, address: 4026, type: u32}
  - {key: x.identity_dsp_version, label: Identity dsp version, table: input, address: 4028, type: u32}
  - {key: x.identity_hardware_version, label: Identity hardware version, table: input, address: 4034, type: u32}
