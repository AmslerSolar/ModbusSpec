enums:
  bms_state: {'4': High-voltage charge, '5': High-voltage discharge}
  dispatch_mode: {'0': Absolute power dispatch, '1': Percentage dispatch}
  enabled: {'0': Disabled, '1': Enabled}
  grid_state: {'0': Grid abnormal, '1': Grid normal}
  on_off: {'0': 'Off', '1': 'On'}
  online: {'0': Offline, '1': Online}
  vpp_mode: {'0': Idle, '1': Charge, '2': Discharge, '3': Self-consumption}
  work_mode_setting: {'1': Self-use, '3': Grid backup, '21': Custom discharge, '22': Time of use}
  work_state: {'1': Standby, '3': Self-test, '6': Running, '7': Stopped}

notes:
- 'RS485 pinout (relayed from HYXI, not confirmed by the project): RJ45 pin 7 = A, pin 8 = B.'
- Input and holding registers are separate spaces that reuse addresses (input 4152 = grid power, holding 4152 = VPP minimum
  SOC).
- Taken from the vendor's Micro Storage RS485 MODBUS protocol V1.0 as transcribed by the project; mostly not yet checked on
  hardware.
- The device implements only functions 03, 04 and 16; single registers are written with function 16.
- The VPP block (holding 4146–4151) allows local battery control.
- Clock, time zone, RS485 address and baud rate (holding 4000–4005) exist but are left out on purpose.
- Fault and alarm words (input 4850–4857) are read raw; the BMS alarm words 5000–5002 are not read.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
