  - {key: x.settings_active_power_setpoint, label: Settings active power setpoint, table: holding, address: 4049, type: s32, unit: W, writable: true}
  - {key: x.settings_anti_starvation, label: Settings anti starvation, table: holding, address: 4121, type: u16, enum: enabled, writable: true}
  - {key: x.settings_force_charge_start_soc, label: Settings force charge start soc, table: holding, address: 4132, type: u16, unit: '%', writable: true}
  - {key: x.settings_off_grid_min_soc, label: Settings off grid min soc, table: holding, address: 4133, type: u16, unit: '%', writable: true}
  - {key: x.settings_self_use_soc, label: Settings self use soc, table: holding, address: 4134, type: u16, unit: '%', writable: true}
  - {key: x.settings_force_charge_stop_soc, label: Settings force charge stop soc, table: holding, address: 4140, type: u16, unit: '%', writable: true}
  - {key: x.settings_discharge_min_soc, label: Settings discharge min soc, table: holding, address: 4141, type: u16, unit: '%', writable: true}
  - {key: x.settings_vpp_enable, label: Settings vpp enable, table: holding, address: 4146, type: u16, enum: enabled, writable: true}
  - {key: x.settings_vpp_mode, label: Settings vpp mode, table: holding, address: 4147, type: u16, enum: vpp_mode, writable: true}
