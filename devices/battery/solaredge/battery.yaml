enums:
  battery_status: {'0': 'Off', '1': Standby, '2': Init, '3': Charge, '4': Discharge, '5': Fault, '7': Idle}
  se_control_mode: {'0': Disabled, '1': Maximize Self Consumption, '2': Time of Use (Profile programming), '3': Backup Only, '4': Remote Control}
  ac_charge_policy: {'0': Disabled, '1': Always allowed, '2': Fixed Energy Limit, '3': Percent of Production}
  command_mode: {'0': Stopped, '1': Only PV excess power not going to AC is used for charging the battery., '2': 'Charge from PV first, before producing power to the AC.', '3': Charge Bat, '4': Discharge Bat, '5': Discharge Bat+BalanceZero, '7': Auto}
  meter_communicate_status: {'1': OK, '65535': NO_METER}

problems:
  - {when: {key: state, equals: 5}, kind: fault, text: Battery fault (status 5)}

notes:
- Batteries are read through the inverter, at the inverter's unit id and port (see solaredge-inverter). The block is SolarEdge-specific,
  not SunSpec.
- Addresses here are battery 1 (0xE100, mirrored at 0xF500). The 2017 document gives battery 2 at 0xE200 with the same layout
  (256 registers higher) and supports up to two batteries.
- 32- and 64-bit values in the 0xE000 and 0xF000 ranges have the low word first (stated in the SunSpec logging note, appendix
  A of 3.2 / C of 2.x). Document 3.2 adds that a copy with the high word first sits 0x800 registers higher; it is not used
  here.
- Values the battery vendor doesn't supply may be missing; a battery is presumably fitted when its rated energy is above 0
  (assumed).
- Storage control (mode, AC charge policy, backup reserve, remote control commands) is in solaredge-control.
- 'evcc template `solaredge-hybrid` (grid, pv, battery) lists: SolarEdge Hybrid Inverter.'
- evcc also reads SunSpec model values for this template (not included here).
- Only the SolarEdge storage registers (0xE000 range) are taken; OpenEMS reads the rest through SunSpec.
- Batteries are read through the inverter, at the inverter's unit id, in a SolarEdge-specific block with the low word first.
  The addresses here are battery 1 (0xE100); battery 2 is 256 registers higher (0xE200), battery 3 768 higher (0xE400).
- A battery is present when its rated energy (0xE142) is a number above 0.
- Float values read NaN (0x7FC00000) when not available.
- The addresses here are battery 1 (0xE100); battery 2 starts at 0xE200, battery 3 at 0xE400.
- A battery is there when its rated energy (0xE142) is above 0; firmware 4.18 shows a second battery with strings but no energy.
- Identification as solaredge-modbus-multi recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
