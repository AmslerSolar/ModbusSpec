connection:
  default_port: 1502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: holding
    address: 57648
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
    word_order: big
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: SolarEdge
  - table: holding
    address: 57666
    type: f32
    range:
    - 0
    - 3.4e+38
    not: 0


