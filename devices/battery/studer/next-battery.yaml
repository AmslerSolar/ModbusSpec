modbusspec: 0
id: studer-next-battery
manufacturer: Studer Innotec
name: Next battery values (unit id 2)
kind: battery

sources:
- id: studer-innotec-next3-ha
  title: Studer-Innotec-next3-HA (Home Assistant integration)
  url: https://github.com/anakinch75/Studer-Innotec-next3-HA
  license: MIT
  commit: 1c2a5eedb9816928609ba0bfb789fd128a774f7c
  path: custom_components/studer_next3/const.py

connection:
  default_port: 502
  default_unit: 2
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - studer-innotec-next3-ha

points:
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 318, type: f32, unit: V}
  - {key: battery_current, label: Battery Current, table: holding, address: 320, type: f32, unit: A, positive: charge}
  - {key: battery_soh, label: Battery State of Health, table: holding, address: 326, type: f32, unit: '%'}
  - {key: battery_temperature, label: Battery Temperature, table: holding, address: 329, type: f32, unit: °C}
  - {key: x.soc_for_end_of_charge, label: SOC for End of Charge, table: holding, address: 342, type: f32, unit: '%', writable: true}
  - {key: x.soc_for_grid_feeding, label: SOC for Grid Feeding, table: holding, address: 344, type: f32, unit: '%', writable: true}
  - {key: x.soc_for_backup, label: SOC for Backup, table: holding, address: 346, type: f32, unit: '%', writable: true}

notes:
- 'A Next system answers on several unit ids: 1 = system totals, 2 = battery, 7 = AC source (grid), 14 = the Next3 device,
  29 = the Next1 device. Each is its own device here.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
