modbusspec: 0
id: varta-pulse
manufacturer: VARTA
name: pulse / pulse neo / element
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/varta.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/varta/varta

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc
  - openwb

points:
  - {key: battery_power, label: Battery power, table: holding, address: 1066, type: s16, unit: W, positive: charge}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 1068, type: s16, unit: '%'}
  - {key: x.batterymode_1074, label: Battery mode control (write), table: holding, address: 1074, type: s16, writable: true, note: 'evcc writes battery mode normal: -4000; battery mode hold: 0.', sources: [evcc], conflicts: [{sources: [openwb], type: u16, label: Battery register 1074}]}
  - {key: grid_power, label: Grid power, table: holding, address: 1078, type: s16, unit: W, positive: export}
  - {key: pv_power, label: PV power, table: holding, address: 1102, type: u16, unit: W}

notes:
- 'evcc template `varta` (grid, pv, battery) lists: VARTA pulse; VARTA pulse neo; VARTA element; VARTA element backup.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
