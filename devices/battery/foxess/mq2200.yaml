enums:
  work_mode: {'1': Self-Use, '2': Feed-in Priority, '3': Back-Up, '4': Peak Shaving, '5': Power Station, '6': Force Charge, '7': Force Discharge}
  system_power_state: {'0': Turn OFF, '1': Turn ON}
  network_status: {'0': Not Connected, '1': Disconnection, '2': Connection}
  eps_output: {'0': 'Off', '2': 'On'}

flags:
  alarm_1: {'0': Input string voltage is high, '1': DC arc fault, '2': String reverse connection, '7': Grid power outage, '8': Abnormal power grid voltage, '11': Abnormal power grid frequency, '14': Output overcurrent, '15': DC component of output current too large}
  alarm_2: {'0': Abnormal residual current, '1': System grounding abnormality, '2': Low insulation resistance, '3': Temperature is too high, '9': Energy storage equipment abnormality, '10': Isolated island, '14': Off-grid output overload}
  alarm_3: {'3': External fan abnormality, '4': Energy storage reverse connection, '9': Meter Lost, '10': BMS Lost}
  inverter_status_1: {'0': Standby, '2': Operation, '6': Fault}
  grid_status: {'0': Off-grid}

notes:
- 'evcc template `fox-ess-avocado` (grid, pv, battery) lists: FoxESS Avocado; FoxESS MQ2200; Solakon ONE; Tepto Avocado Pro.'
- Sold in the Netherlands as the NextEnergy Plug-in battery (master FoxESS MQ2200-M-AC, expansion packs MQ2200-M-S). Modbus
  TCP on port 502 over Wi-Fi and LAN; not enabled on BMS firmware 1.000.
- Registers follow FoxESS's Modbus protocol V1.05.03 (holding registers, function 03).
- Some firmware refuses the inverter-ratings block (36001, 39053…) or the BMS identity block (37003…); the project then leaves
  those values out.
- 'Read blocks must not cross the gaps between documented ranges: such reads come back short (e.g. 37003-37020, 37032-37037,
  37097-37176, 37635-37636 are separate blocks).'
- Inverter status 1 is treated as a bit field (standby, operation, fault bits).
- 'model_name: the sensor table in const.py says 30000 (length 8), the device model reads 30000 (length 16); the device model
  is used here.'
- 'network_status: the sensor table in const.py says 49242, the device model reads 49240; the device model is used here.'
- The binding reads input and settings with function 03 at the addresses as written.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- Identification as openhab recognises the device (not checked against a document).
- 'Left out: serial_number (holding 30008, str) from openhab overlaps model_name (holding 30000, str, 16 registers); check
  a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
