notes:
- Register address = cluster base + offset. The document gives the base of cluster 1 (0x2000) and says further clusters have
  their own base, without listing them; only cluster 1 is described here.
- Addresses are the document's hexadecimal register addresses, read with function 03 (holding); function 06 and 16 write.
- Registers are unsigned unless the document marks them signed.
- 'Alarm levels: the document doesn''t rank them. Level 3 bits are taken as faults and levels 1 and 2 as warnings (assumed).
  Bit 8 of the other-alarm word is the isolation switch state, not an alarm.'
- 'Alarm word 2 bits 10 and 11: the English and Chinese texts disagree; the Chinese is followed (bit 10 cell voltage extremely
  high, bit 11 extremely low).'
- The front page lists 9600 and 57600 baud with one of them struck through; the rendered text gives 57600.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
