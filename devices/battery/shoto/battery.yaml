notes:
- The document carries the SHOTO logo but does not name a product; it covers SHOTO's intelligent lithium battery BMS with
  up to 16 cells.
- Addresses are the document's hexadecimal register addresses, used as 0-based protocol addresses; all registers are read
  with function 03 (holding).
- 'Unit ids: settable 1 to 247, the battery range is 214 to 221 and 224 to 231, default 214. Serial is fixed at 9600 baud,
  8N1; at most 32 registers per frame.'
- 'The word order of the 32-bit counters is not stated; most significant word first is assumed (verified: false). Battery
  current sign is as stated (charge positive). The cell voltage factor is assumed (see x.cell1_voltage).'
- 'Left out: reserved registers. The two loop-control registers combine the external command with the board''s own logic (closing
  needs both, opening either).'
