# Written from the SHOTO Intelligent lithium battery RS485 Modbus monitoring communication protocol (V1.2).

modbusspec: 0
id: shoto-battery
manufacturer: SHOTO
name: Intelligent lithium battery (RS485 Modbus)
kind: battery

sources:
- title: Intelligent lithium battery RS485 Modbus monitoring communication protocol, client version
  version: V1.2
  url: https://github.com/Sleeper85/esphome-yambms/blob/e183d206bc3b041fdd39dc2ee331e6ef22f4b84d/documents/RS485%20protocol/Shoto%20RS485%20Modbus%20protocol%20V1.2.pdf
  sha256: 152c4f798266c1d00f1218a0ea1735e89938bd3e8f94128796e0fa4db2db4de7

connection:
  default_port: 502
  default_unit: 214
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 32

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 4197
    type: str
    length: 10

points:
  # Live values
  - {key: battery_voltage, label: Vbat, table: holding, address: 1, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.bus_voltage, label: Vbus, table: holding, address: 0, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: battery_current, label: ibat, table: holding, address: 4145, type: s16, unit: A, scale: 0.01, positive: charge, poll: fast}
  - {key: x.bus_current, label: Ibus, table: holding, address: 4144, type: s16, unit: A, scale: 0.01, poll: fast, note: 'Charging positive, discharging negative.'}
  - {key: battery_soc, label: SOC, table: holding, address: 4148, type: u16, unit: '%', scale: 0.01, poll: fast}
  - {key: battery_soh, label: SOH, table: holding, address: 4149, type: u16, unit: '%', scale: 0.01, poll: slow}
  - {key: x.cell_temperature_max, label: Tcell_max, table: holding, address: 5, type: s16, unit: °C}
  - {key: x.cell_temperature_min, label: Tcell_min, table: holding, address: 6, type: s16, unit: °C}
  - {key: temperature, label: MOS temperature, table: holding, address: 4172, type: s16, unit: °C}
  - {key: x.cell1_temperature, label: Tcell1, table: holding, address: 18, type: s16, unit: °C, note: Only as many cell temperature probes as configured (4 to 8) are fitted.}
  - {key: x.cell2_temperature, label: Tcell2, table: holding, address: 19, type: s16, unit: °C}
  - {key: x.cell3_temperature, label: Tcell3, table: holding, address: 20, type: s16, unit: °C}
  - {key: x.cell4_temperature, label: Tcell4, table: holding, address: 21, type: s16, unit: °C}
  - {key: x.cell5_temperature, label: Tcell5, table: holding, address: 22, type: s16, unit: °C}
  - {key: x.cell6_temperature, label: Tcell6, table: holding, address: 23, type: s16, unit: °C}
  - {key: x.cell7_temperature, label: Tcell7, table: holding, address: 24, type: s16, unit: °C}
  - {key: x.cell8_temperature, label: Tcell8, table: holding, address: 25, type: s16, unit: °C}
  - {key: x.cell9_temperature, label: Tcell9, table: holding, address: 26, type: s16, unit: °C}
  - {key: x.cell10_temperature, label: Tcell10, table: holding, address: 27, type: s16, unit: °C}
  - {key: x.cell11_temperature, label: Tcell11, table: holding, address: 28, type: s16, unit: °C}
  - {key: x.cell12_temperature, label: Tcell12, table: holding, address: 29, type: s16, unit: °C}
  - {key: x.cell13_temperature, label: Tcell13, table: holding, address: 30, type: s16, unit: °C}
  - {key: x.cell14_temperature, label: Tcell14, table: holding, address: 31, type: s16, unit: °C}
  - {key: x.cell15_temperature, label: Tcell15, table: holding, address: 32, type: s16, unit: °C}
  - {key: x.cell16_temperature, label: Tcell16, table: holding, address: 33, type: s16, unit: °C}
  - {key: x.cell1_voltage, label: Vcell1, table: holding, address: 34, type: u16, unit: V, scale: 0.001, verified: false, note: 'The document prints the factor as "Multiples of 100 0" (with a space, on every cell row); 1000 (mV) is assumed. A factor of 100 would also give plausible readings, so this needs a real battery.'}
  - {key: x.cell2_voltage, label: Vcell2, table: holding, address: 35, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell3_voltage, label: Vcell3, table: holding, address: 36, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell4_voltage, label: Vcell4, table: holding, address: 37, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell5_voltage, label: Vcell5, table: holding, address: 38, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell6_voltage, label: Vcell6, table: holding, address: 39, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell7_voltage, label: Vcell7, table: holding, address: 40, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell8_voltage, label: Vcell8, table: holding, address: 41, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell9_voltage, label: Vcell9, table: holding, address: 42, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell10_voltage, label: Vcell10, table: holding, address: 43, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell11_voltage, label: Vcell11, table: holding, address: 44, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell12_voltage, label: Vcell12, table: holding, address: 45, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell13_voltage, label: Vcell13, table: holding, address: 46, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell14_voltage, label: Vcell14, table: holding, address: 47, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell15_voltage, label: Vcell15, table: holding, address: 48, type: u16, unit: V, scale: 0.001, verified: false}
  - {key: x.cell16_voltage, label: Vcell16, table: holding, address: 49, type: u16, unit: V, scale: 0.001, verified: false}

  # State, alarms and protections. The document numbers each byte's bits separately: "Hbyte" bit n is register bit
  # n + 8, "Lbyte" bit n is register bit n.
  - {key: x.alarm_status_1, label: BMS alarm status 1, table: holding, address: 4151, type: u16, flags: alarm_status_1}
  - {key: x.alarm_status_2, label: BMS alarm status 2, table: holding, address: 4152, type: u16, flags: alarm_status_2}
  - {key: x.alarm_status_3, label: BMS alarm status 3, table: holding, address: 4153, type: u16, flags: alarm_status_3}
  - {key: x.alarm_status_4, label: BMS alarm status 4, table: holding, address: 4154, type: u16, flags: alarm_status_4}
  - {key: x.alarm_status_5, label: BMS alarm status 5, table: holding, address: 4155, type: u16, flags: alarm_status_5}
  - {key: x.protection_status, label: BMS protection status, table: holding, address: 4156, type: u16, flags: protection_status}
  - {key: state, label: Operating status (total running status), table: holding, address: 4157, type: u16, bits: [0, 7], enum: running_status}
  - {key: x.discharge_mode, label: Operating status (discharge mode), table: holding, address: 4157, type: u16, bits: [8, 15], enum: discharge_mode}

  # Counters
  - {key: x.full_capacity, label: Full battery capacity, table: holding, address: 4146, type: u16, unit: Ah, scale: 0.01, poll: slow}
  - {key: x.cycles, label: Cycles, table: holding, address: 4147, type: u16, poll: slow}
  - {key: x.total_charge_ah, label: Total charge capacity, table: holding, address: 4160, type: u32, unit: Ah, poll: slow, verified: false}
  - {key: x.total_capacity_ah, label: Total capacity, table: holding, address: 4162, type: u32, unit: Ah, poll: slow, note: 'Named only "total capacity"; possibly the discharged total, not stated.', verified: false}
  - {key: x.total_charging_time, label: Total charging time, table: holding, address: 4164, type: u32, unit: s, poll: slow, verified: false}
  - {key: x.total_time, label: Total time, table: holding, address: 4166, type: u32, unit: s, poll: slow, verified: false}
  - {key: x.charge_energy, label: Total charge Wh, table: holding, address: 4168, type: u32, unit: Wh, poll: slow, verified: false}
  - {key: x.discharge_energy, label: Total put Wh, table: holding, address: 4170, type: u32, unit: Wh, poll: slow, note: '"Total put" read as total discharged energy.', verified: false}
  - {key: x.operation_hours, label: Operation hours, table: holding, address: 521, type: u32, unit: h, poll: slow, verified: false}

  # Identity and configuration
  - {key: firmware, label: Software version, table: holding, address: 257, type: u16, poll: slow, note: 0xXY = version X.Y.}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 258, type: str, length: 1, poll: slow, note: 'Two ASCII characters, e.g. 0x3031 = V0.1.'}
  - {key: serial, label: System barcode, table: holding, address: 4197, type: str, length: 10, poll: slow}
  - {key: x.pcb_barcode, label: PCB barcode, table: holding, address: 4173, type: str, length: 10, poll: slow}
  - {key: x.cell_count, label: Number of battery cells, table: holding, address: 271, type: u16, poll: slow}
  - {key: x.temperature_probe_count, label: Number of battery temperature probes, table: holding, address: 4150, type: u16, poll: slow}
  - {key: x.parallel_count, label: Number of parallel machines online, table: holding, address: 4159, type: u16, poll: slow}
  - {key: x.clock, label: 'Date and time (year, month, day, hour, minute, second)', table: holding, address: 4096, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, writable: true, poll: slow}
  - {key: x.bus_voltage_set, label: Discharge BUS voltage set value (Vbus_set), table: holding, address: 4112, type: u16, unit: V, scale: 0.01, writable: true, poll: slow}
  - {key: x.bus_current_set, label: Discharge BUS current setting (Ibus_set), table: holding, address: 4113, type: u16, unit: '%', scale: 0.01, writable: true, poll: slow, note: Percent of the BUS current target.}
  - {key: x.bus_power_set, label: Discharge BUS power set (Pbus_set), table: holding, address: 4114, type: u16, unit: '%', scale: 0.01, writable: true, poll: slow, note: Percent of the BUS power target.}
  - {key: x.charge_current_set, label: Average charge current setting (Ibat_set), table: holding, address: 4115, type: u16, unit: '%', scale: 0.01, writable: true, poll: slow, note: Percent of the battery charge current target.}
  - {key: x.bus_voltage_step_set, label: Discharge BUS voltage step setting value (Vbus_set_dod), table: holding, address: 4116, type: u16, unit: V, scale: 0.01, writable: true, poll: slow}
  - {key: x.depth_of_discharge, label: Depth of discharge DOD, table: holding, address: 4117, type: u16, unit: '%', scale: 0.01, writable: true, poll: slow}
  - {key: x.mode_control, label: Mode control, table: holding, address: 4118, type: u16, enum: mode_control, writable: true, poll: slow}
  - {key: x.modbus_address, label: RS 485 modbus address offset, table: holding, address: 4119, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.temperature_probe_setting, label: Set the number of cell temperature probes, table: holding, address: 4120, type: u16, writable: true, min: 4, max: 8, poll: slow}
  - {key: x.cell_count_setting, label: Cell number setting, table: holding, address: 4121, type: u16, writable: true, min: 15, max: 16, poll: slow}
  - {key: x.charge_loop_control, label: Charging loop control, table: holding, address: 4221, type: u16, enum: loop_control, writable: true, poll: slow}
  - {key: x.discharge_loop_control, label: Discharge loop control, table: holding, address: 4222, type: u16, enum: loop_control, writable: true, poll: slow}

enums:
  running_status: {'1': Precharge, '2': Through charging, '3': Through discharging, '4': BUCK charging, '5': BOOST charging, '6': BUCK discharge, '7': BOOST discharge, '8': Standby, '9': Alarm, '10': Protection shutdown, '11': Fault shutdown, '12': Maintenance mode, '13': Test mode, '14': Sleep}
  discharge_mode: {'1': Power management constant voltage discharge, '2': Battery characteristic discharge mode, '3': Self-managed constant voltage discharge (self-following)}
  mode_control: {'257': Power management constant voltage discharge, '514': Reserved, '771': Battery characteristic discharge mode, '1285': Maintenance, '1542': Production test, '1799': Self-managed constant voltage discharge (self-following)}
  loop_control: {'1': Circuit closed, '85': Circuit disconnected}

flags:
  alarm_status_1: {'0': NTC disconnection, '1': ADC damaged, '2': Reverse battery connection, '3': Fan on failure, '4': Battery lock, '11': Cell voltage too low fault, '12': Voltage sampling disconnection, '13': Charging MOS damaged, '14': Discharge MOS damaged, '15': Voltage sampling element damaged}
  alarm_status_2: {'0': Charging, '1': Discharging, '2': Short circuit protection, '4': Overvoltage protection (not resolved), '5': Undervoltage protection (not resolved), '6': Charging over-temperature protection, '7': Charging under-temperature protection, '8': Discharge over-temperature protection, '9': Discharge under-temperature protection, '10': Overall overvoltage protection, '11': Startup failed, '12': Charge MOS off, '13': Discharge MOS off}
  alarm_status_3: {'0': Force charging MOS on, '1': Force charging MOS off, '2': Forced discharge MOS on, '3': Forced discharge MOS off, '4': Heating pad on, '5': MOSFET over-temperature protection, '6': MOSFET low-temperature protection, '7': Charging temperature too low, '8': Environment low-temperature protection, '9': Environment high-temperature protection, '15': Fan on}
  alarm_status_4: {'1': Vibration alarm, '2': Dry contact 1, '3': Dry contact 2, '7': BMS module SN repetition (parallel)}
  alarm_status_5: {'0': Cell overvoltage alarm, '1': Cell undervoltage alarm, '2': Overall overvoltage warning, '3': Overall undervoltage warning, '4': Overcharge alarm, '5': Overcurrent warning, '6': Battery charging over-temperature alarm, '7': Battery charging under-temperature alarm, '8': Ambient over-temperature alarm, '9': Ambient under-temperature alarm, '10': MOS over-temperature alarm, '11': SOC too low alarm, '12': Overpressure alarm, '13': Battery over-temperature warning, '14': Battery discharge under-temperature alarm}
  protection_status: {'0': Cell overvoltage protection, '1': Overall overvoltage protection, '2': Cell undervoltage protection, '3': Overall undervoltage protection, '4': Charging overcurrent 1 protection, '5': Charging overcurrent 2 protection, '6': Discharge overcurrent 1 protection, '7': Discharge overcurrent 2 protection, '13': Full charge protection}

