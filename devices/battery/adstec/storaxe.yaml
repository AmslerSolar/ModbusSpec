modbusspec: 0
id: adstec-storaxe
manufacturer: ads-tec
name: StoraXe
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/storaxe.yaml
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.ess.adstec.storaxe

connection:
  default_port: 502
  default_unit: 2
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: battery_power, label: Battery power, table: input, address: 1, type: s16, unit: W, scale: 100, positive: discharge, sources: [evcc, openems]}
  - {key: l1_voltage, label: Battery L1 voltage, table: input, address: 6, type: s16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Battery L2 voltage, table: input, address: 7, type: s16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Battery L3 voltage, table: input, address: 8, type: s16, unit: V, scale: 0.1}
  - {key: l1_current, label: Battery L1 current, table: input, address: 9, type: s16, unit: A, scale: 0.1}
  - {key: l2_current, label: Battery L2 current, table: input, address: 10, type: s16, unit: A, scale: 0.1}
  - {key: l3_current, label: Battery L3 current, table: input, address: 11, type: s16, unit: A, scale: 0.1}
  - {key: x.battery_energy, label: Battery energy, table: input, address: 114, type: u32, unit: kWh}
  - {key: x.max_apparent_power, label: Max apparent power, table: input, address: 124, type: u16, unit: VA, scale: 100, sources: [openems]}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 125, type: s16, unit: '%', conflicts: [{sources: [openems], type: u16, label: State of Charge of the energy storage system}]}
  - {key: x.active_discharge_energy, label: Active discharge energy, table: input, address: 133, type: u32, unit: kWh, sources: [openems]}
  - {key: x.active_charge_energy, label: Active charge energy, table: input, address: 135, type: u32, unit: kWh, sources: [openems]}
  - {key: x.min_cell_voltage, label: Minimum cell voltage, table: input, address: 137, type: u16, unit: V, scale: 0.001, sources: [openems]}
  - {key: x.max_cell_voltage, label: Maximum cell voltage, table: input, address: 138, type: u16, unit: V, scale: 0.001, sources: [openems]}

notes:
- 'evcc template `storaxe` (battery) lists: Ads-tec StoraXe.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
