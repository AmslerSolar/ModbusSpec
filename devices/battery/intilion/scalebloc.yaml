modbusspec: 0
id: intilion-scalebloc
manufacturer: INTILION
name: scalebloc energy
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/intilion-scalebloc.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: battery_soc, label: Battery state of charge, table: input, address: 5002, type: u16, unit: '%', scale: 0.1}
  - {key: battery_power, label: Battery power, table: input, address: 5040, type: s16, unit: W, scale: 100, positive: discharge}
  - {key: l1_voltage, label: Grid L1 voltage, table: input, address: 6000, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 voltage, table: input, address: 6001, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Grid L3 voltage, table: input, address: 6002, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid L1 current, table: input, address: 6006, type: s16, unit: A, scale: 0.1}
  - {key: l2_current, label: Grid L2 current, table: input, address: 6007, type: s16, unit: A, scale: 0.1}
  - {key: l3_current, label: Grid L3 current, table: input, address: 6008, type: s16, unit: A, scale: 0.1}
  - {key: x.grid_power_1, label: Grid power (part 1), table: input, address: 6010, type: s16, unit: W, scale: 100}
  - {key: x.grid_power_2, label: Grid power (part 2), table: input, address: 6012, type: s16, unit: W, scale: 100}
  - {key: x.grid_power_3, label: Grid power (part 3), table: input, address: 6014, type: s16, unit: W, scale: 100}

derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: x.grid_power_1}, {key: x.grid_power_2}, {key: x.grid_power_3}]}

notes:
- 'evcc template `intilion-scalebloc` (grid, battery) lists: INTILION scalebloc energy.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
