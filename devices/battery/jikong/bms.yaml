notes:
- 'Addresses: the document gives each value as a base address (0x1000 settings, 0x1200 live data, 0x1400 identity, 0x1600
  commands) plus an offset; the address here is their sum (e.g. battery voltage 0x1200 + 0x90 = 0x1290). The offsets and lengths
  count bytes, so a 2-byte value takes one register yet the next value is two addresses on. Whether the device numbers its
  registers this way, or as base + offset / 2, isn''t stated; base + offset is assumed, and all points are unverified for
  this reason. Read with function 03 and the length / 2 registers.'
- 'Two 8-bit values in one 2-byte field: the first one listed (lower offset) is taken to be the high byte. The word order
  of 32-bit values isn''t stated; most significant first is assumed.'
- The sign of the battery current isn't stated; positive = charging is assumed. The battery power register is unsigned.
- 'Left out: balance wire resistances (0x1088… settings, 0x124A… live), protection delays and release times, correction factors
  and sensor voltages, the serial / CAN protocol selections and dry-contact settings that V1.1 adds at 0x14B2–0x1507, and
  the write-only command registers at 0x1600 (calibration, shutdown, one-key Li-ion / LiFePO4 / LTO presets, emergency start,
  time sync), whose layout differs between V1.0 and V1.1.'
- V1.1 lists two more alarm entries after bit 21 (temperature sensor anomaly, parallel module fault) without bit numbers;
  they are left out. V1.0 has battery alarm temperatures at 0x1116 instead of the extra function bits 7–9, PWM duty cycles
  at 0x12E0 / 0x12E2 and a PVD timestamp at 0x12F4, which V1.1 drops; V1.0 also lacks the charge / float voltages at 0x1020
  / 0x1024.
- The serial port runs at 115200 baud 8N1; slave addresses 1–247. No default address is stated; 1 is assumed.
- 'The identity check is weak: the manufacturer ID''s content isn''t given, only that it is ASCII.'
