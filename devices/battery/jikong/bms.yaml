# Written from the Jikong (JK) BMS RS485 Modbus general protocol V1.1, checked against V1.0 (which adds the frame
# format and serial settings). Where the two differ, V1.1 is followed; see the notes.

modbusspec: 0
id: jikong-bms
manufacturer: Jikong (JK BMS)
name: JK BMS (RS485 Modbus)
kind: battery

sources:
- title: Jikong BMS RS485 Modbus protocol (极空BMS RS485 Modbus通用协议)
  version: V1.1 (2024-01)
  url: https://github.com/Sleeper85/esphome-yambms/blob/e183d206bc3b041fdd39dc2ee331e6ef22f4b84d/documents/RS485%20protocol/Jikong%20BMS%20RS485%20modbus%20protocol%20V1.1.pdf
  sha256: 7f3d436c49bc6d2bbd819f4f50d8999da035318ace8d84aed25cdccc74f47871
- title: Jikong BMS RS485 Modbus protocol (极空BMS RS485 Modbus通用协议)
  version: V1.0 (2023-08)
  url: https://github.com/syssi/esphome-jk-bms/blob/46ac4cf26aed1c33ce4fce3d4bba688f600e036b/docs/pb2a16s20p/JK_BMS.RS485.Modbus.v1_0.pdf
  sha256: 34dc1032ed4e3e2d7f2a2c3560dc4f54c6cdb384b8cc04e934126541510b51d5

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # manufacturer device ID
  - table: holding
    address: 5120
    type: str
    length: 8
    printable: true
  # cell count setting
  - table: holding
    address: 4204
    type: u32
    range:
    - 1
    - 32

defaults:
  verified: false

points:
  # Live data (base 0x1200)
  - {key: x.cell_voltage_0, label: Cell voltage 0 (CellVol0), table: holding, address: 4608, type: u16, unit: V, scale: 0.001}
