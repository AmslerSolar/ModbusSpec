# Written from the PACE BMS Modbus Protocol for RS485 (V1.3, 2017-06-27).

modbusspec: 0
id: pace-bms
manufacturer: PACE
name: Lithium battery BMS (16 cells, RS485)
kind: battery

sources:
- title: PACE BMS Modbus Protocol for RS485
  version: V1.3 (2017-06-27)
  url: https://github.com/syssi/esphome-pace-bms/blob/2c0408d3ad0df4abe0ed7dc1f2b56499c54c4f5a/docs/PACE-BMS-Modbus-Protocol-for-RS485-V1.3-20170627.pdf
  sha256: 2aee34db485aad190f039bc314ff82896692c739513263d9f2a1a5c9bf34dc16

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 100
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 170
    type: str
    length: 10
  checks:
  # SOC
  - table: holding
    address: 2
    type: u16
    range:
    - 0
    - 100
  # SOH
  - table: holding
    address: 3
    type: u16
    range:
    - 0
    - 100
  # version information
  - table: holding
    address: 150
    type: str
    length: 10
    printable: true
  # model SN
  - table: holding
    address: 160
    type: str
    length: 10
    printable: true

points:
  # Data acquisition (0 ff.)
  - {key: battery_current, label: Current, table: holding, address: 0, type: s16, unit: A, scale: 0.01, positive: charge}
  - {key: battery_voltage, label: Voltage of pack, table: holding, address: 1, type: u16, unit: V, scale: 0.01}
  - {key: battery_soc, label: SOC, table: holding, address: 2, type: u16, unit: '%'}
  - {key: battery_soh, label: SOH, table: holding, address: 3, type: u16, unit: '%'}
  - {key: x.remaining_capacity, label: Remain capacity, table: holding, address: 4, type: u16, unit: Ah, scale: 0.01}
  - {key: x.full_capacity, label: Full capacity, table: holding, address: 5, type: u16, unit: Ah, scale: 0.01, poll: slow}
  - {key: x.design_capacity, label: Design capacity, table: holding, address: 6, type: u16, unit: Ah, scale: 0.01, poll: slow}
  - {key: x.cycles, label: Battery cycle counts, table: holding, address: 7, type: u16, poll: slow}
  - {key: x.warning_flags, label: Warning flag, table: holding, address: 9, type: u16, flags: warning_flags}
  - {key: x.protection_flags, label: Protection flag, table: holding, address: 10, type: u16, flags: protection_flags}
  - {key: x.status_flags, label: Status/Fault flag, table: holding, address: 11, type: u16, flags: status_flags}
  - {key: x.charging, label: State of charge (status bit 8), table: holding, address: 11, type: u16, bits: [8, 8], enum: no_yes, note: 1 = the pack is charging.}
  - {key: x.discharging, label: State of discharge (status bit 9), table: holding, address: 11, type: u16, bits: [9, 9], enum: no_yes, note: 1 = the pack is discharging.}
  - {key: x.balance_status, label: Balance status, table: holding, address: 12, type: u16, note: Bit mask; which bit belongs to which cell isn't stated (presumably bit 0 = cell 1).}
  - {key: x.cell_1_voltage, label: Cell voltage 1, table: holding, address: 15, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_2_voltage, label: Cell voltage 2, table: holding, address: 16, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_3_voltage, label: Cell voltage 3, table: holding, address: 17, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_4_voltage, label: Cell voltage 4, table: holding, address: 18, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_5_voltage, label: Cell voltage 5, table: holding, address: 19, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_6_voltage, label: Cell voltage 6, table: holding, address: 20, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_7_voltage, label: Cell voltage 7, table: holding, address: 21, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_8_voltage, label: Cell voltage 8, table: holding, address: 22, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_9_voltage, label: Cell voltage 9, table: holding, address: 23, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_10_voltage, label: Cell voltage 10, table: holding, address: 24, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_11_voltage, label: Cell voltage 11, table: holding, address: 25, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_12_voltage, label: Cell voltage 12, table: holding, address: 26, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_13_voltage, label: Cell voltage 13, table: holding, address: 27, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_14_voltage, label: Cell voltage 14, table: holding, address: 28, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_15_voltage, label: Cell voltage 15, table: holding, address: 29, type: u16, unit: V, scale: 0.001}
  - {key: x.cell_16_voltage, label: Cell voltage 16, table: holding, address: 30, type: u16, unit: V, scale: 0.001}
  - {key: battery_temperature, label: Cell temperature 1, table: holding, address: 31, type: s16, unit: °C, scale: 0.1}
  - {key: x.cell_temperature_2, label: Cell temperature 2, table: holding, address: 32, type: s16, unit: °C, scale: 0.1}
  - {key: x.cell_temperature_3, label: Cell temperature 3, table: holding, address: 33, type: s16, unit: °C, scale: 0.1}
  - {key: x.cell_temperature_4, label: Cell temperature 4, table: holding, address: 34, type: s16, unit: °C, scale: 0.1}
  - {key: x.mosfet_temperature, label: MOSFET temperature, table: holding, address: 35, type: s16, unit: °C, scale: 0.1, note: Not valid on the BMS-4820.}
  - {key: x.environment_temperature, label: Environment temperature, table: holding, address: 36, type: s16, unit: °C, scale: 0.1, note: Not valid on the BMS-4820.}

  # Settings (60 ff.), a selection
  - {key: x.pack_ov_protection, label: Pack OV protection, table: holding, address: 61, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.cell_ov_protection, label: Cell OV protection, table: holding, address: 65, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.pack_uv_protection, label: Pack UV protection, table: holding, address: 69, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.cell_uv_protection, label: Cell UV protection, table: holding, address: 73, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.charge_oc_protection, label: Charging OC protection, table: holding, address: 77, type: u16, unit: A, writable: true, poll: slow}
  - {key: x.discharge_oc_protection, label: Discharging OC protection, table: holding, address: 80, type: u16, unit: A, writable: true, poll: slow}
  - {key: x.full_charge_voltage, label: Pack full-charge voltage, table: holding, address: 107, type: u16, unit: V, scale: 0.001, writable: true, poll: slow}
  - {key: x.full_charge_current, label: Pack full-charge current, table: holding, address: 108, type: u16, unit: A, scale: 0.001, writable: true, poll: slow}
  - {key: x.soc_alarm_threshold, label: SOC alarm threshold, table: holding, address: 112, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}

  # Identity (150 ff.)
  - {key: firmware, label: Version information, table: holding, address: 150, type: str, length: 10, poll: slow}
  - {key: x.model_sn, label: Model SN (BMS manufacturer), table: holding, address: 160, type: str, length: 10, poll: slow}
  - {key: serial, label: PACK SN (pack manufacturer), table: holding, address: 170, type: str, length: 10, poll: slow}

enums:
  no_yes: {'0': 'No', '1': 'Yes'}

flags:
  warning_flags: {'0': Cell overvoltage alarm, '1': Cell low voltage alarm, '2': Pack overvoltage alarm, '3': Pack low voltage alarm, '4': Charging over current alarm, '5': Discharging over current alarm, '8': Charging high temperature alarm (cell), '9': Discharging high temperature alarm (cell), '10': Charging low temperature alarm (cell), '11': Discharging low temperature alarm (cell), '12': Environment high temperature alarm, '13': Environment low temperature alarm, '14': MOSFET high temperature alarm, '15': SOC low alarm}
  protection_flags: {'0': Cell over voltage protection, '1': Cell low voltage protection, '2': Pack over voltage protection, '3': Pack low voltage protection, '4': Charging over current protection, '5': Discharging over current protection, '6': Short circuit protection, '7': Charger overvoltage protection, '8': Charging high temperature protection (cell), '9': Discharging high temperature protection (cell), '10': Charging low temperature protection (cell), '11': Discharging low temperature protection (cell), '12': MOSFET high temperature protection, '13': Environment high temperature protection, '14': Environment low temperature protection}
  status_flags: {'0': Charging MOSFET fault, '1': Discharging MOSFET fault, '2': Temperature sensor fault, '4': Battery cell fault, '5': Front-end sampling communication fault, '8': Charging, '9': Discharging, '10': Charging MOSFET on, '11': Discharging MOSFET on, '12': Charging limiter on, '14': Charger reversed, '15': Heater on}

problems:
  - {when: {key: x.protection_flags, bit: 0}, kind: fault, text: Cell over voltage protection}
  - {when: {key: x.protection_flags, bit: 1}, kind: fault, text: Cell low voltage protection}
  - {when: {key: x.protection_flags, bit: 2}, kind: fault, text: Pack over voltage protection}
  - {when: {key: x.protection_flags, bit: 3}, kind: fault, text: Pack low voltage protection}
  - {when: {key: x.protection_flags, bit: 4}, kind: fault, text: Charging over current protection}
  - {when: {key: x.protection_flags, bit: 5}, kind: fault, text: Discharging over current protection}
  - {when: {key: x.protection_flags, bit: 6}, kind: fault, text: Short circuit protection}
  - {when: {key: x.protection_flags, bit: 7}, kind: fault, text: Charger overvoltage protection}
  - {when: {key: x.protection_flags, bit: 8}, kind: fault, text: Charging high temperature protection}
  - {when: {key: x.protection_flags, bit: 9}, kind: fault, text: Discharging high temperature protection}
  - {when: {key: x.protection_flags, bit: 10}, kind: fault, text: Charging low temperature protection}
  - {when: {key: x.protection_flags, bit: 11}, kind: fault, text: Discharging low temperature protection}
  - {when: {key: x.protection_flags, bit: 12}, kind: fault, text: MOSFET high temperature protection}
  - {when: {key: x.protection_flags, bit: 13}, kind: fault, text: Environment high temperature protection}
  - {when: {key: x.protection_flags, bit: 14}, kind: fault, text: Environment low temperature protection}
  - {when: {key: x.status_flags, bit: 0}, kind: fault, text: Charging MOSFET fault}
  - {when: {key: x.status_flags, bit: 1}, kind: fault, text: Discharging MOSFET fault}
  - {when: {key: x.status_flags, bit: 2}, kind: fault, text: Temperature sensor fault}
  - {when: {key: x.status_flags, bit: 4}, kind: fault, text: Battery cell fault}
  - {when: {key: x.status_flags, bit: 5}, kind: fault, text: Front-end sampling communication fault}
  - {when: {key: x.status_flags, bit: 14}, kind: fault, text: Charger connected reversed}
  - {when: {key: x.warning_flags, bit: 0}, kind: warning, text: Cell overvoltage alarm}
  - {when: {key: x.warning_flags, bit: 1}, kind: warning, text: Cell low voltage alarm}
  - {when: {key: x.warning_flags, bit: 2}, kind: warning, text: Pack overvoltage alarm}
  - {when: {key: x.warning_flags, bit: 3}, kind: warning, text: Pack low voltage alarm}
  - {when: {key: x.warning_flags, bit: 4}, kind: warning, text: Charging over current alarm}
  - {when: {key: x.warning_flags, bit: 5}, kind: warning, text: Discharging over current alarm}
  - {when: {key: x.warning_flags, bit: 8}, kind: warning, text: Charging high temperature alarm}
  - {when: {key: x.warning_flags, bit: 9}, kind: warning, text: Discharging high temperature alarm}
  - {when: {key: x.warning_flags, bit: 10}, kind: warning, text: Charging low temperature alarm}
  - {when: {key: x.warning_flags, bit: 11}, kind: warning, text: Discharging low temperature alarm}
  - {when: {key: x.warning_flags, bit: 12}, kind: warning, text: Environment high temperature alarm}
  - {when: {key: x.warning_flags, bit: 13}, kind: warning, text: Environment low temperature alarm}
  - {when: {key: x.warning_flags, bit: 14}, kind: warning, text: MOSFET high temperature alarm}
  - {when: {key: x.warning_flags, bit: 15}, kind: warning, text: SOC low alarm}

notes:
- 'Modbus RTU on RS485: 9600 baud 8N1 by default (the BMS specification may differ), function 03 to read and 16 to write,
  up to 125 registers per read. The BMS answers within 200 ms; leave more than 100 ms between frames. Register addresses are
  0-based decimal as given.'
- The unit id (1–15) is set with four DIP switches on the pack, binary with switch 1 as the lowest bit; all off = 0. The document
  gives no default; unit 1 is assumed. Port 502 is only for an RS485 gateway.
- 'Current: positive = charging, negative = discharging (as stated). Values the document types as UINT8 sit in the low byte,
  high byte 0. Text registers hold two ASCII characters each.'
- Only the first cell temperature is mapped to battery_temperature; the pack has four cell temperature sensors (31–34).
- 'Left out: alarm / release thresholds and delay times of the protection settings (60–114) apart from the main protection
  levels, balance thresholds (105–106), sleep settings (109–110), short-circuit delay (111) and charging OC-2 (113–114).'
