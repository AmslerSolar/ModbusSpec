# Written from the Huawei LUNA2000B ESS Modbus Port Definitions (Issue 01, 2023-11-28): the C&I cabinet subsystem
# (chapter 3). The ESS (battery rack) subsystem of the same document is in huawei-luna2000b-ess.

modbusspec: 0
id: huawei-luna2000b-cabinet
manufacturer: Huawei
name: LUNA2000-200KWH ESS, C&I cabinet subsystem (LUNA2000-200KWH-2H0, -2H1)
kind: battery

sources:
- title: LUNA2000B ESS Modbus Port Definitions
  version: Issue 01 (2023-11-28)
  url: https://portal.segensolar.se/reseller/docs/LUNA2000B%20ESS%20Modbus%20Port%20Definitions.pdf
  sha256: 46b4ebcedd724a422810e7dc4dbe7d3a89b730c0eea55bf6f255f5e7c12e0b47

connection:
  default_port: 502
  default_unit: 0
  transports:
  - tcp

encoding:
