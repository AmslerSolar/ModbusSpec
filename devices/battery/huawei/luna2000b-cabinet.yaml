  - {key: x.charged_energy_total, label: Total energy charged, table: holding, address: 30076, type: s64, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.discharged_energy_total, label: Total energy discharged, table: holding, address: 30080, type: s64, unit: kWh, scale: 0.01, poll: slow}
