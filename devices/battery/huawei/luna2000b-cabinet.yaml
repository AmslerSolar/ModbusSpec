  - {key: x.dc_bus_voltage, label: DC bus voltage, table: holding, address: 30202, type: u16, unit: V, scale: 0.1}
  - {key: x.dc_bus_current, label: DC bus current, table: holding, address: 30203, type: u16, unit: A, scale: 0.1}
  - {key: l1_voltage, label: Phase A voltage, table: holding, address: 30300, type: u32, unit: V, scale: 0.01}
  - {key: l2_voltage, label: Phase B voltage, table: holding, address: 30302, type: u32, unit: V, scale: 0.01}
