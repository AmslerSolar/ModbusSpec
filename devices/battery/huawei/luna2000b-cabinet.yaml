  - {key: x.container_status_2, label: Container status 2, table: holding, address: 30001, type: u16, flags: container_status_2}
  - {key: x.container_status_3, label: Container status 3, table: holding, address: 30002, type: u16, flags: container_status_3}
  - {key: battery_temperature, label: Battery cabin temperature 1, table: holding, address: 30014, type: s16, unit: °C, scale: 0.1}
  - {key: x.cabin_humidity, label: Battery cabin humidity 1, table: holding, address: 30015, type: s16, unit: '%', scale: 0.1}
  - {key: x.cabin_dew_point, label: Battery cabin dew point temperature, table: holding, address: 30034, type: s16, unit: °C, scale: 0.1}
  - {key: battery_soc, label: SOC, table: holding, address: 30035, type: u16, unit: '%'}
