  - {key: x.rectifier_power, label: Total output power of rectifiers, table: holding, address: 30503, type: u32, unit: W, note: kW with gain 1000.}

enums:
  no_yes: {'0': 'No', '1': 'Yes'}

flags:
  container_status_1: {'0': 'AC SPD fault (alarm 3804, major)', '3': 'UPS alarm (alarm 3825, major)', '7': 'Fire alarm (alarm 3832, major)', '11': 'Combustible gas alarm (alarm 3826, major)', '12': 'Built-in fire suppression module pressure low (alarm 3831, major)'}
  container_status_2: {'0': 'Battery cabin water alarm (alarm 3800, major)'}
  container_status_3: {'1': 'Battery cabin door 1 open (alarm 3801, major)'}
  alarm_1: {'0': 'Battery cabin temperature high (alarm 3827, major)', '2': 'Battery cabin condensation risk (alarm 3828, minor)', '4': 'Battery cabin T/H sensor malfunction (alarm 3829, minor)', '6': 'Battery cabin T/H control malfunction (alarm 3830, major)'}
  alarm_2: {'0': 'Rectifier fault, bit 0 (alarm 3833, major)', '1': 'Rectifier fault, bit 1 (alarm 3833, major)', '2': 'Rectifier fault, bit 2 (alarm 3833, major)', '3': 'Rectifier fault, bit 3 (alarm 3833, major)', '4': 'Rectifier fault, bit 4 (alarm 3833, major)', '5': 'Rectifier fault, bit 5 (alarm 3833, major)'}

problems:
  - {when: {key: x.container_status_1, bit: 0}, kind: fault, text: AC SPD fault (alarm 3804)}
  - {when: {key: x.container_status_1, bit: 3}, kind: fault, text: UPS alarm (alarm 3825)}
  - {when: {key: x.container_status_1, bit: 7}, kind: fault, text: Fire alarm (alarm 3832)}
  - {when: {key: x.container_status_1, bit: 11}, kind: fault, text: Combustible gas alarm (alarm 3826)}
  - {when: {key: x.container_status_1, bit: 12}, kind: fault, text: Built-in fire suppression module pressure low (alarm 3831)}
  - {when: {key: x.container_status_2, bit: 0}, kind: fault, text: Battery cabin water alarm (alarm 3800)}
  - {when: {key: x.container_status_3, bit: 1}, kind: fault, text: Battery cabin door 1 open (alarm 3801)}
  - {when: {key: x.alarm_1, bit: 0}, kind: fault, text: Battery cabin temperature high (alarm 3827)}
  - {when: {key: x.alarm_1, bit: 2}, kind: warning, text: Battery cabin condensation risk (alarm 3828)}
  - {when: {key: x.alarm_1, bit: 4}, kind: warning, text: Battery cabin T/H sensor malfunction (alarm 3829)}
  - {when: {key: x.alarm_1, bit: 6}, kind: fault, text: Battery cabin T/H control malfunction (alarm 3830)}
  - {when: {key: x.alarm_2, bit: 0}, kind: fault, text: 'Rectifier fault, bit 0 (alarm 3833)'}
  - {when: {key: x.alarm_2, bit: 1}, kind: fault, text: 'Rectifier fault, bit 1 (alarm 3833)'}
  - {when: {key: x.alarm_2, bit: 2}, kind: fault, text: 'Rectifier fault, bit 2 (alarm 3833)'}
  - {when: {key: x.alarm_2, bit: 3}, kind: fault, text: 'Rectifier fault, bit 3 (alarm 3833)'}
  - {when: {key: x.alarm_2, bit: 4}, kind: fault, text: 'Rectifier fault, bit 4 (alarm 3833)'}
  - {when: {key: x.alarm_2, bit: 5}, kind: fault, text: 'Rectifier fault, bit 5 (alarm 3833)'}

notes:
- 'Addresses are the document''s register addresses, used unchanged as protocol addresses (holding registers, function 03).
  The document gives a gain: value = raw / gain.'
- The signs of the charge/discharge power and the per-phase active powers are not stated in the document; positive = charging
  is assumed.
- Modbus TCP over Ethernet, port 502. Unit 0 reaches the directly connected node, other unit ids reach devices behind it;
  the document doesn't say which unit id the C&I cabinet and ESS subsystems answer on, and its two tables overlap (e.g. 30202),
  so they are separate devices. Unit 0 is the document's stated default for the directly connected node over TCP (configurable);
  the document also names 0 as the broadcast address, which is the RS485 meaning. Which unit id each subsystem answers on
  needs a real installation.
- 'Models: LUNA2000-200KWH-2H0 (model ID 512, from FusionSolar V800R021C10) and LUNA2000-200KWH-2H1 (model ID 513, from LUNA2000B
  V300R023C00). The model ID and serial (ESN) come only through function 0x2B (read device identification, vendor HUAWEI),
  not from registers, so there is no identify.'
- Alarms of major severity are faults, minor and warning ones warnings.
