modbusspec: 0
id: huawei-esm48100
manufacturer: Huawei
name: ESM-48100 lithium battery module
kind: battery

sources:
- id: huawei-esm48100
  title: huawei-esm48100 (Python library for the Huawei ESM-48100 battery, used by huawei-esm48100-home-assistant)
  url: https://github.com/GImDX/huawei-esm48100
  license: MIT
  commit: 13508b33203c5405a7e9abca72e2ffae26ffd9b9
  path: src/huawei_esm48100/registers.py, src/huawei_esm48100/decoder.py

connection:
  default_port: 502
  default_unit: 214
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 32

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - huawei-esm48100

