  module_mode: {'0': Hibernating, '1': Low power, '2': Charge, '3': Discharge, '4': Standby}
  do1_alarm_action: {'0': Close, '1': Open}
  do2_alarm_action: {'0': Close, '1': Open}
  gyroscope_sensitivity: {'0': Low, '1': Medium, '2': High}

flags:
  alarm_word_1: {'0': Heater fault, '1': Cell voltage detection failure, '2': Cell temperature detection failure, '3': Charging output short circuit, '4': Relay short fault, '5': Overload lock, '6': Bidirectional MOS fault}
  alarm_word_2: {'0': Cell 1 fault, '1': Cell 2 fault, '2': Cell 3 fault, '3': Cell 4 fault, '4': Cell 5 fault, '5': Cell 6 fault, '6': Cell 7 fault, '7': Cell 8 fault, '8': Cell 9 fault, '9': Cell 10 fault, '10': Cell 11 fault, '11': Cell 12 fault, '12': Cell 13 fault, '13': Cell 14 fault, '14': Cell 15 fault, '15': Cell 16 fault}
  alarm_word_3: {'0': Charging low temperature protection, '1': Charging high temperature protection, '2': Discharging low temperature protection, '3': Discharging high temperature protection, '4': Pack overvoltage protection, '5': Cell charge overvoltage protection, '6': Battery discharge undervoltage protection, '7': Cell discharge undervoltage protection, '8': Battery overvoltage protection, '9': Module internal temperature protection, '10': Output short circuit protection, '11': Pro discharge low-voltage disconnect, '12': Input reverse polarity, '13': Anti-theft alarm locked, '14': Overload protection}
  alarm_word_4: {'0': Low temperature charging warning, '1': High temperature charging warning, '2': Discharging low temperature warning, '3': Discharging high temperature warning, '4': Pack overvoltage warning, '5': Cell charge overvoltage warning, '6': Battery discharge undervoltage warning, '7': Cell discharge undervoltage warning, '8': Converter open-loop warning, '9': Serial number conflict warning}
  alarm_word_5: {'0': Manual shutdown state, '1': VBUS overvoltage lock, '2': Anti-theft handshake state, '3': Abnormal shutdown state, '4': Battery discharge overcurrent warning, '5': Battery discharge overcurrent protection, '6': Battery discharge overcurrent lock, '7': VBUS overvoltage protection, '8': Slow-up failure protection, '9': FRU read failure, '10': Charging overcurrent warning, '11': Charging overcurrent protection, '12': Gyroscope fault warning, '13': Battery-side upper-pipe short circuit}
  alarm_word_3_extended: {'0': Cell 17 fault, '1': Cell 18 fault, '2': Cell 19 fault, '3': Cell 20 fault, '4': Cell 21 fault, '5': Cell 22 fault, '6': Cell 23 fault, '7': Cell 24 fault}

notes:
- RS485 Modbus RTU. Huawei's tool scans unit ids 214-221 and 224-231 (0xD6-0xDD, 0xE0-0xE7). A transparent TCP serial server
  can forward the RTU frames.
- A module that has been idle may not answer the first requests or answer with a corrupt frame; the project wakes it with
  plain reads of 0x0000 until a valid answer comes.
- Cell values beyond the cell count (0x010F) are not valid; cells 17-24 only exist on modules with more than 16 cells.
- Mapping confirmed by the project on two ESM-48100B1 with software V112 only.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
