notes:
- 'Addresses are the document''s register addresses, used unchanged as protocol addresses (holding registers, function 03).
  The document gives a gain: value = raw / gain.'
- The signs of the charge/discharge power and the rack current are not stated in the document; positive = charging is assumed.
- Modbus TCP over Ethernet, port 502. Unit 0 reaches the directly connected node, other unit ids reach devices behind it;
  the document doesn't say which unit id the ESS subsystem answers on (a model can have several ESS subsystems). Unit 0 is
  the document's stated default for the directly connected node over TCP (configurable); the document also names 0 as the
  broadcast address, which is the RS485 meaning. Which unit id each subsystem answers on needs a real installation.
- 'Models: LUNA2000-200KWH-2H0 (model ID 512) and LUNA2000-200KWH-2H1 (model ID 513). Model and serial (ESN) come only through
  function 0x2B, so there is no identify.'
- Alarms of major severity are faults, minor and warning ones warnings. Device status (30102) values are not listed.
