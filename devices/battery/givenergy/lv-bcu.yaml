modbusspec: 0
id: givenergy-lv-bcu
manufacturer: GivEnergy
name: LV battery stack controller (BCU)
kind: battery

sources:
- id: givenergy-modbus
  title: givenergy-modbus (Python library for GivEnergy inverters, used by givenergy-hass)
  url: https://github.com/dewet22/givenergy-modbus
  license: Apache-2.0
  commit: 90e3ec13098aacc9607160209779b4e029ac8cd9
  path: givenergy_modbus/model/lv_bcu.py

connection:
  default_port: 8899
  default_unit: 49

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - givenergy-modbus

points:
  - {key: x.bms_status_1, label: Bms status 1, table: input, address: 60, type: u16}
  - {key: x.bms_status_2, label: Bms status 2, table: input, address: 61, type: u16}
  - {key: x.request_charge_current, label: Request charge current, table: input, address: 62, type: u16}
  - {key: x.request_discharge_current, label: Request discharge current, table: input, address: 63, type: u16}

notes:
- Reached through the inverter's Wi-Fi / LAN dongle on TCP port 8899, which wraps Modbus requests in GivEnergy's own framing
  (not plain Modbus TCP); every device on the bus answers there under its own device address. The library reads at most 60
  registers per request, in blocks starting at multiples of 60.
- The LV stack controller block at device address 0x31.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
