notes:
- No fixed unit id (since Venus OS 2.60 the GX assigns them, normally the device instance; see Settings → Integrations → Modbus
  TCP server → Available services). 225 is the list's id for a CAN-bus BMS; a battery monitor on VE.Direct gets the id of
  its port.
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- 1318 is a 4-register string (1318–1321); revision 52 moved the SmartLithium registers to 1322–1327 (mode, balancer status,
  four error flags), so older layouts with them at 1320–1324 are wrong.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
- hass-victron divides the amp-hour counters by a negative factor, so consumed and discharged Ah come out negative (scale
  -0.1, or -1 for the 32-bit consumed Ah at 330).
- 'Left out: battery_balancer_status (holding 1320, u16) from hass-victron overlaps battery_system_maxtemperaturecellid (holding
  1318, str, 4 registers); check a document.'
- 'Left out: battery_errors_smartlithium_communication (holding 1321, u16) from hass-victron overlaps battery_system_maxtemperaturecellid
  (holding 1318, str, 4 registers); check a document.'
