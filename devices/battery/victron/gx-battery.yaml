  relay_0_state: {'0': Open, '1': Closed}
  alarms_low_cell_voltage: {'0': No alarm, '1': Almost discharged, '2': Alarm}
  alarms_bms_cable: {'0': No alarm, '1': Warning, '2': Alarm}
  state: {'0': Initializing (Wait start), '1': Initializing (before boot), '2': Initializing (Before boot delay), '3': Initializing (Wait boot), '4': Initializing, '5': Initializing (Measure battery voltage), '6': Initializing (Calculate battery voltage), '7': Initializing (Wait bus voltage), '8': Initializing (Wait for lynx shunt), '9': Running, '10': Error (10), '11': Unused (11), '12': Shutdown, '13': Slave updating, '14': Standby, '15': Going to run, '16': Pre-charging, '17': Contactor check}
  error_code: {'0': No error, '1': Battery initialization error, '2': No batteries connected, '3': Unknown battery connected, '4': Different battery type, '5': Number of batteries incorrect, '6': Lynx Shunt not found, '7': Battery measure error, '8': Internal calculation error, '9': Batteries in series not ok, '10': Number of batteries incorrect, '11': Hardware error, '12': Watchdog error, '13': Over voltage, '14': Under voltage, '15': Over temperature, '16': Under temperature, '17': Hardware fault, '18': Standby shutdown, '19': Pre-charge charge error, '20': Safety contactor check error, '21': Pre-charge discharge error, '22': ADC error, '23': Slave error, '24': Slave warning, '25': Pre-charge error, '26': Safety contactor error, '27': Over current, '28': Slave update failed, '29': Slave update unavailable, '30': Calibration data lost, '31': Settings invalid, '32': BMS cable, '33': Reference failure, '34': Wrong system voltage, '35': Pre-charge timeout}
  system_switch: {'0': Disabled, '1': Enabled}
  balancing: {'0': Inactive, '1': Active}
  io_allow_to_charge: {'0': 'No', '1': 'Yes'}
  mode: {'3': 'On', '252': Standby}
  balancer_status: {'0': Unknown, '1': Balanced, '2': Balancing, '3': Cell imbalance}
  errors_smart_lithium_communication: {'0': OK, '1': Error}

