modbusspec: 0
id: victron-gx-battery
manufacturer: Victron Energy
name: 'GX Modbus-TCP: battery monitor / BMS (com.victronenergy.battery)'
kind: battery

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.victron

connection:
  default_port: 502
  default_unit: 225
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: battery_power, label: Battery power, table: holding, address: 256, type: s32, unit: W, positive: charge, verified: false, note: 'The list gives no sign for the power; taken to follow the current at 261 (positive = charging), as P = V × I.'}
  - {key: x.dc_0_power, label: Battery power, table: holding, address: 258, type: s16, unit: W, positive: charge, verified: false, note: 16-bit version of 256. The list gives no sign; taken to follow the current at 261 (positive = charging).}
