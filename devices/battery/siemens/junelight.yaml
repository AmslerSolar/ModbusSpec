modbusspec: 0
id: siemens-junelight
manufacturer: Siemens
name: Junelight Smart Battery
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/siemens-junelight.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/siemens/siemens

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc
  - openwb

points:
  - {key: battery_power, label: Battery power, table: holding, address: 6, type: s32, unit: W, positive: discharge}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 8, type: s32, unit: '%'}
  - {key: grid_power, label: Grid power, table: holding, address: 14, type: s32, unit: W, positive: import}
  - {key: pv_power, label: PV power, table: holding, address: 16, type: s32, unit: W}

notes:
- 'evcc template `siemens-junelight` (grid, pv, battery) lists: Siemens Junelight Smart Battery.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
