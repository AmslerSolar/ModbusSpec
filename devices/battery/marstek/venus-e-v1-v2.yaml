  - {key: x.fault_status, label: Fault Status, table: holding, address: 36100, type: u16, flags: fault_status, note: 'The project lists 4 registers here but decodes only the first one. The project also names bits 16-58, beyond the register it decodes; left out.'}
  - {key: x.max_cell_voltage, label: Max Cell Voltage, table: holding, address: 37007, type: s16, unit: V, scale: 0.001}
  - {key: x.min_cell_voltage, label: Min Cell Voltage, table: holding, address: 37008, type: s16, unit: V, scale: 0.001}
