  - {key: x.schedule_1_end, label: Schedule 1 End, table: holding, address: 43102, type: datetime, length: 1, unit: min, datetime: {hour: {register: 0, div: 100}, minute: {register: 0, mod: 100}}, writable: true, note: The end is exclusive and a slot does not cross midnight. The project offers 1 to 2359 in steps of 1 min.}
  - {key: x.schedule_1_mode, label: Schedule 1 Mode, table: holding, address: 43103, type: s16, unit: W, writable: true, note: 'Slot power: positive discharges, negative charges, -1 follows the CT meter (self-consumption). The project offers -2500 to 2500 in steps of 1 W.'}
  - {key: x.schedule_1_enabled, label: Schedule 1 Enabled, table: holding, address: 43104, type: u16, enum: schedule_1_enabled, writable: true}
