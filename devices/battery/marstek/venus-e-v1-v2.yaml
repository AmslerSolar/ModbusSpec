  - {key: battery_soc, label: Battery state of charge, table: holding, address: 32104, type: u16, unit: '%', sources: [evcc, marstek-modbus-suite, openwb]}
  - {key: x.battery_total_energy, label: Battery Total Energy, table: holding, address: 32105, type: u16, unit: kWh, scale: 0.001}
  - {key: x.ac_voltage, label: AC Voltage, table: holding, address: 32200, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_current, label: AC Current, table: holding, address: 32201, type: s16, unit: A, scale: 0.01}
