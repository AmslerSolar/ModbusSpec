  grid_standard: {'0': Auto, '1': EN50549, '2': Netherlands, '3': Germany, '4': Austria, '5': United Kingdom, '6': Spain, '7': Poland, '8': Italy, '9': China}
  backup_function: {'0': 'On', '1': 'Off'}
  schedule_1_enabled: {'0': 'Off', '1': 'On'}
  schedule_2_enabled: {'0': 'Off', '1': 'On'}
  schedule_3_enabled: {'0': 'Off', '1': 'On'}
  schedule_4_enabled: {'0': 'Off', '1': 'On'}
  schedule_5_enabled: {'0': 'Off', '1': 'On'}
  schedule_6_enabled: {'0': 'Off', '1': 'On'}

flags:
  fault_status: {'0': Grid Overvoltage, '1': Grid Undervoltage, '2': Grid Overfrequency, '3': Grid Underfrequency, '4': Grid Peak Voltage, '5': Current Dcover, '6': Voltage Dcover}
  alarm_status: {'0': PLL Abnormal Restart, '1': Overtemperature Limit, '2': Low Temperature Limit, '3': Fan Abnormal Warning, '4': Low Battery SOC Warning, '5': Output Overcurrent Warning, '6': Abnormal Line Sequence Detection}
  schedule_1_days: {'0': Monday, '1': Tuesday, '2': Wednesday, '3': Thursday, '4': Friday, '5': Saturday, '6': Sunday}
