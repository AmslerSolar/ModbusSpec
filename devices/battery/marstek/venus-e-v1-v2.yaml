  - {key: x.modbus_address, label: Modbus Address, table: holding, address: 41100, type: u16}
  - {key: x.backup_function, label: Backup Function, table: holding, address: 41200, type: u16, enum: backup_function, writable: true}
  - {key: x.batterymode_42000, label: Battery mode control (write), table: holding, address: 42000, type: u16, writable: true, note: 'evcc writes battery mode normal: 21930, then 21947; battery mode hold: 21930, then 21947; battery mode charge: 21930; battery mode holdcharge: 21930, then 21947; battery mode discharge: 21930.', sources: [evcc, marstek-modbus-suite, openwb]}
  - {key: x.batterymode_42010, label: Battery mode control (write), table: holding, address: 42010, type: u16, writable: true, note: 'evcc writes battery mode charge: 1; battery mode discharge: 2.', sources: [evcc, marstek-modbus-suite, openwb]}
  - {key: x.charge_to_soc, label: Charge to SoC, table: holding, address: 42011, type: u16, unit: '%', writable: true, note: The project offers 10 to 100 in steps of 1 %.}
  - {key: x.batterymode_42020, label: Battery mode control (write), table: holding, address: 42020, type: u16, unit: W, writable: true, note: 'evcc writes battery mode charge: 2500.', sources: [evcc, marstek-modbus-suite, openwb]}
  - {key: x.batterymode_42021, label: Battery mode control (write), table: holding, address: 42021, type: u16, unit: W, writable: true, note: 'evcc writes battery mode discharge: 800.', sources: [evcc, marstek-modbus-suite, openwb]}
  - {key: x.batterymode_43000, label: Battery mode control (write), table: holding, address: 43000, type: u16, writable: true, note: 'evcc writes battery mode normal: 1; battery mode hold: 1; battery mode holdcharge: 1.', sources: [evcc, marstek-modbus-suite]}
