modbusspec: 0
id: marstek-venus-e-v1-v2
manufacturer: Marstek
name: Venus E
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/marstek-venus-e.yaml
- id: marstek-modbus-suite
  title: marstek-modbus-suite (Home Assistant integration)
  url: https://github.com/sphings79/marstek-modbus-suite
  license: MIT
  commit: 1bbd2182879b8835000732e04f5f0f53333aa31e
  path: custom_components/marstek_modbus/registers/e_v12.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/marstek/venus_c_e

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - marstek-modbus-suite

points:
  - {key: x.wifi_status, label: WiFi Status, table: holding, address: 30300, type: u16}
  - {key: x.bluetooth_status, label: Bluetooth Status, table: holding, address: 30301, type: u16}
  - {key: x.cloud_status, label: Cloud Status, table: holding, address: 30302, type: u16}
  - {key: x.wifi_signal_strength, label: WiFi Signal Strength, table: holding, address: 30303, type: u16, unit: dBm, scale: -1}
  - {key: x.ble_mac_address, label: Bluetooth MAC, table: holding, address: 30402, type: str, length: 6, note: MAC address as ASCII text (12 hex digits).}
  - {key: x.comm_module_firmware, label: Communication Module Firmware, table: holding, address: 30800, type: str, length: 6}
  - {key: x.device_name, label: Device Name, table: holding, address: 31000, type: str, length: 10}
  - {key: x.software_version, label: Software Version, table: holding, address: 31100, type: u16, scale: 0.01}
  - {key: x.ems_version, label: EMS Version, table: holding, address: 31101, type: u16}
  - {key: x.bms_version, label: BMS Version, table: holding, address: 31102, type: u16}
  - {key: serial, label: Serial Number, table: holding, address: 31200, type: str, length: 10}
