modbusspec: 0
id: marstek-jupiter-c-plus
manufacturer: Marstek
name: Jupiter C Plus Battery Storage
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/marstek-jupiterc-plus.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.pv_power_1, label: PV power (part 1), table: holding, address: 3, type: u16, unit: W, note: 'evcc reads it for the usages pv, battery. evcc negates it for the battery power.'}
  - {key: x.pv_power_2, label: PV power (part 2), table: holding, address: 6, type: u16, unit: W, note: 'evcc reads it for the usages pv, battery. evcc negates it for the battery power.'}
  - {key: x.pv_power_3, label: PV power (part 3), table: holding, address: 9, type: u16, unit: W, note: 'evcc reads it for the usages pv, battery. evcc negates it for the battery power.'}
  - {key: x.pv_power_4, label: PV power (part 4), table: holding, address: 12, type: u16, unit: W, note: 'evcc reads it for the usages pv, battery. evcc negates it for the battery power.'}
  - {key: x.battery_power_1, label: Battery power (part 1), table: holding, address: 13, type: u16, unit: W}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 16, type: u16, unit: '%'}

derived:
  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}, {key: x.pv_power_3}, {key: x.pv_power_4}]}
  - {key: battery_power, label: Battery power, unit: W, positive: discharge, sum: [{key: x.battery_power_1}, {key: x.pv_power_1, factor: -1}, {key: x.pv_power_2, factor: -1}, {key: x.pv_power_3, factor: -1}, {key: x.pv_power_4, factor: -1}]}

notes:
- 'evcc template `marstek-jupiterc-plus` (pv, battery) lists: Marstek Jupiter C Plus Battery Storage.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
