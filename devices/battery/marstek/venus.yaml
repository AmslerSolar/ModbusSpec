notes:
- 'evcc template `marstek-venus-a` (pv, battery) lists: Marstek Venus A; Marstek Venus D.'
- 'evcc template `marstek-venus-e` (battery) lists: Marstek Venus E; Marstek Venus E Gen 2.0; Marstek Venus E Gen 3.0; Marstek
  Venus C.'
- Registers evcc uses with the template option `generation` = 3.
- The project says Venus A, D and E v3 share one firmware base; Venus E v1 / v2 is a different device file.
- 'Model string at 31000 (10 registers): VNSA-0, VNSD-0 or VNSE3-0.'
- 'Battery packs: Venus D up to 7, Venus A up to 6, each pack''s block at 34000 + 100 × (pack − 1); the Venus E v3 has one
  built-in pack.'
- 'Some 32-bit values are served as register pairs that must be read together: read 36000/36001 and 36100/36101 as pairs and
  36103 only in a block with them; a single read of 36001, 36101 or 36103 returns a different value (project''s finding on
  the Venus E v3; the A and D maps also say to read 36100/36101 together).'
- 'Venus A: Registers the project never reads as part of a larger block (some act when read or are refused): 30030-30035,
  38000-39014, 41500-41631, 45000-45031, 45603-45605, 46000.'
- 'Venus D: Registers the project never reads as part of a larger block (some act when read or are refused): 30030-30035,
  30214, 37021-37022, 38000-39014, 41500-41631, 45000-45031, 45603-45605, 46000.'
- 'Venus E v3: Registers the project never reads as part of a larger block (some act when read or are refused): 38000-39014,
  41500-41631, 45000-45031, 45603-45605, 46000.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
- 'Identification: one of the model matches must hold.'
