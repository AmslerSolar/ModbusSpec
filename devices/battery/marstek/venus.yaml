  - {key: x.dc_sample_power, label: DC Sample Power, table: holding, address: 30001, type: s16, unit: W, models: [venus_a, venus_d], note: 'One DC measuring point that carries the battery and the PV inputs together; power flowing towards the AC side is negative (battery power: see derived).'}
  - {key: battery_power, label: Battery Power, table: holding, address: 30001, type: s16, unit: W, positive: charge, models: [venus_e3]}
  - {key: x.battery_power_1, label: Battery power (part 1), table: holding, address: 30006, type: s16, unit: W, sources: [evcc, marstek-modbus-suite]}
