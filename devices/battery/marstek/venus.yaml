modbusspec: 0
id: marstek-venus
manufacturer: Marstek
name: Venus A
kind: battery

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/marstek-venus-a.yaml, templates/definition/meter/marstek-venus-e.yaml
- id: marstek-modbus-suite
  title: marstek-modbus-suite (Home Assistant integration)
  url: https://github.com/sphings79/marstek-modbus-suite
  license: MIT
  commit: 1bbd2182879b8835000732e04f5f0f53333aa31e
  path: custom_components/marstek_modbus/registers/a.yaml, custom_components/marstek_modbus/registers/d.yaml, custom_components/marstek_modbus/registers/e_v3.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 31000
    type: str
    length: 10
    prefix: VNSA-
  - table: holding
    address: 31000
    type: str
    length: 10
    prefix: VNSD-
  - table: holding
    address: 31000
    type: str
    length: 10
    prefix: VNSE3-

defaults:
  verified: false
  sources:
  - marstek-modbus-suite

models:
  - {id: venus_a, name: Venus A, match: {table: holding, address: 31000, type: str, length: 10, prefix: VNSA-}}
  - {id: venus_d, name: Venus D, match: {table: holding, address: 31000, type: str, length: 10, prefix: VNSD-}}
  - {id: venus_e3, name: Venus E v3, match: {table: holding, address: 31000, type: str, length: 10, prefix: VNSE3-}}

