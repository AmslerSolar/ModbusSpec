  mppt_warning: {'0': No warning, '1345': MPPT power or voltage reference out of range, '1363': 'Power derating, radiator or ambient above 73 °C', '1364': Radiator 1 sensor open or shorted, '1365': Radiator 2 sensor open or shorted, '1366': Ambient sensor open or shorted, '1367': MPPT chip above 85 °C, '1368': Radiator 1 above 73 °C, '1369': Radiator 2 above 73 °C, '1370': Ambient above 73 °C}
  selftest_status: {'0': Not run yet, '1': OK, '2': EEPROM fault, '3': Flash fault, '5': Ethernet chip reports another version than expected (harmless)}
  backup_function: {'0': 'On', '1': 'Off'}
  schedule_1_enabled: {'0': 'Off', '1': 'On'}
