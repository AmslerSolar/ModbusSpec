notes:
- ES2020 controller of the LG 350, 450, 740 and 1000 units. Register LG_Modell (input 25) lists only LG350, LG450 and LG740.
- 'Modbus RTU: 19200 Bd, 8 data bits, even parity, 1 stop bit, address 20 by default (address, baud rate and parity can be
  changed in holding 208–210; per v2.0.0, 2 stop bits with no parity). Modbus TCP needs firmware 1.6 or later and is off by
  default; the document''s default TCP port is shown as 0, so 502 here is an assumption.'
- Functions 03, 04 and 06 (write single register) only. All values are unsigned 16-bit.
- The document's addresses are used as given and taken as 0-based protocol addresses (not stated in the document).
- 'Temperatures: raw value with one decimal and an offset of -1000 in the document, i.e. raw × 0.1 - 100 °C. The air balance
  settings (83–86) are raw - 500 m³/h.'
- For several on/off settings (69, 89, 90, 103, 104) the German and English descriptions give opposite meanings; the English
  one is used here.
- The Z28–Z32 registers carry no value table in the document; 1 is assumed to mean alarm.
- 'Left out: the Modbus TCP address settings (holding 164–176, 178, 179), the sensor bus baud rate (136), the EPB CO2 and
  display settings (82, 108, 135), presence mode and the summer night cooling settings (2203–2213, with inconsistent decimals
  in the document) and the summer night cooling timing values (input 5249–5251).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
