modbusspec: 0
id: flexit-ci66
manufacturer: Flexit
name: Air handling units with CI66 Modbus adapter
kind: ventilation

sources:
- id: flexit-modbus
  title: flexit-modbus (Python library behind the Home Assistant flexit integration)
  url: https://github.com/troelde/flexit-modbus
  license: Apache-2.0
  commit: c320aae43a3363492c44376847646d9897ffd9b3
  path: src/flexit_modbus/subsystems/*.py, src/flexit_modbus/data_model.py, src/flexit_modbus/enums.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

defaults:
  verified: false
  sources:
  - flexit-modbus

points:
  - {key: x.target_temperature, label: Requested supply/room setpoint temperature, table: holding, address: 8, type: s16, unit: °C, scale: 0.1, writable: true, note: The library accepts writes of 10…30 °C.}
  - {key: x.fan_mode, label: Fan speed setting (off/low/medium/high), table: holding, address: 17, type: u16, enum: fan_mode, writable: true}
  - {key: x.filter_running_hours, label: Filter running hours (unsigned), table: input, address: 8, type: u16, unit: h}
  - {key: x.supply_air_temperature, label: Measured supply air temperature, table: input, address: 9, type: s16, unit: °C, scale: 0.1}
  - {key: x.outdoor_air_temperature, label: Measured outdoor air temperature, table: input, address: 11, type: s16, unit: °C, scale: 0.1}
  - {key: x.cooling_regulation, label: Cooling regulation level, table: input, address: 13, type: s16, unit: '%'}
  - {key: x.heat_exchanger_regulation, label: Mechanical heat-recovery regulation level, table: input, address: 14, type: s16, unit: '%'}
  - {key: x.electric_heater_regulation, label: Electric heater regulation level, table: input, address: 15, type: s16, unit: '%'}
  - {key: x.filter_alarm, label: Filter alarm active, table: input, address: 27, type: u16, note: '0 = off, 1 = on.'}
  - {key: x.electric_heater_enabled, label: Electric heater enabled (not necessarily heating), table: input, address: 28, type: u16, note: '0 = off, 1 = on.'}
  - {key: x.actual_air_speed, label: Current fan speed reading, table: input, address: 48, type: s16}

enums:
  fan_mode: {'0': 'Off', '1': Low, '2': Medium, '3': High}

notes:
- Registers of the CI66 Modbus adapter, which the library says defines the Modbus interface for Flexit air handling units
  fitted with it (Modbus RTU).
- The adapter has no identity or serial number register.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
