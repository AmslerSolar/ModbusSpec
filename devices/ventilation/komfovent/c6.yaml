notes:
- Register numbers in the integration are 1-based; addresses here are the numbers minus 1. All registers are holding registers;
  32-bit values have the high register first.
- 'The controller type is the top 4 bits of the firmware version (holding 999–1000): 0 C6, 1 C6M, 2 C8.'
- Points listed only for C6/C6M are the ones the integration creates only for those controllers.
- The sources don't state the default unit id; 1 is a guess.
- 'Left out: room_sensor (holding 38, u16) from komfovent overlaps bacnet_id (holding 37, u32); check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
