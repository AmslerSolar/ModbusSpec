modbusspec: 0
id: ostberg-iqc
manufacturer: Östberg
name: IQC ventilation unit controller
kind: ventilation

sources:
- title: Modbus Registers IQC
  version: 1.5, 2024-01-26
  url: https://www.cliox.ee/dokumendid/ostberg/Modbus-Registers-IQC.pdf
  sha256: d02fd7936cef878e1cf60f7220c830ee6c3ba22649b744b363bb991b5e2dd735

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  # Commands and modes (coils, function 01 / 05)
  - {key: x.unit_on, label: Unit on, table: coil, address: 0, type: bool, writable: true, poll: fast}
  - {key: x.overpressure_mode, label: Overpressure mode, table: coil, address: 1, type: bool, writable: true, poll: fast}
  - {key: x.boost_mode, label: Boost mode, table: coil, address: 2, type: bool, writable: true, poll: fast}
  - {key: x.away_mode, label: Away mode, table: coil, address: 3, type: bool, writable: true, poll: fast}
  - {key: x.clear_alarms, label: Clear alarms, table: coil, address: 4, type: bool, writable: true, write_only: true, note: Write 1 to clear the alarms.}
  - {key: x.reset_filter_timer, label: Reset filter timer, table: coil, address: 5, type: bool, writable: true, write_only: true, note: Write 1 to restart the filter timer.}
  - {key: x.extended_operation, label: Extended operation, table: coil, address: 6, type: bool, writable: true, poll: fast, note: Also wakes the unit from a scheduled standby.}

  # Switch inputs (discrete inputs, function 02); 0 = open, 1 = closed
  - {key: x.input_fire_alarm, label: Fire alarm input (D1), table: discrete, address: 0, type: bool, enum: contact, poll: fast}
  - {key: x.input_boost, label: Boost input (D2), table: discrete, address: 1, type: bool, enum: contact, poll: fast}
  - {key: x.input_overpressure, label: Overpressure input (D3), table: discrete, address: 2, type: bool, enum: contact, poll: fast}
  - {key: x.input_extended_operation, label: Extended operation input (D4), table: discrete, address: 3, type: bool, enum: contact, poll: fast}
  - {key: x.input_away, label: Away input (D5), table: discrete, address: 4, type: bool, enum: contact, poll: fast}
  - {key: x.input_filter, label: Filter input (D6), table: discrete, address: 5, type: bool, enum: contact, poll: fast}
  - {key: x.input_heater_interlock, label: Heater interlock (D7), table: discrete, address: 6, type: bool, enum: contact, poll: fast}
  - {key: x.input_summer_winter, label: External summer/winter changeover (D8), table: discrete, address: 7, type: bool, enum: contact, poll: fast}
  - {key: x.input_emergency_stop, label: Emergency/service stop (D9), table: discrete, address: 8, type: bool, enum: contact, poll: fast}

  # Alarms (discrete inputs; shown as active alarms on the display)
  - {key: x.alarm_fire, label: Fire alarm, table: discrete, address: 9, type: bool, poll: fast}
  - {key: x.alarm_rotor, label: Rotor alarm, table: discrete, address: 10, type: bool, poll: fast}
  - {key: x.alarm_freeze, label: Freeze alarm, table: discrete, address: 12, type: bool, poll: fast}
  - {key: x.alarm_low_supply, label: Low supply alarm, table: discrete, address: 13, type: bool, poll: fast}
  - {key: x.alarm_low_rotor_temperature, label: Low rotor temperature alarm, table: discrete, address: 14, type: bool, poll: fast}
  - {key: x.alarm_sensor_open, label: Temp. sensor open circuit alarm, table: discrete, address: 17, type: bool, poll: fast}
  - {key: x.alarm_sensor_short, label: Temp. sensor short circuit alarm, table: discrete, address: 18, type: bool, poll: fast}
  - {key: x.alarm_pulser, label: Pulser alarm, table: discrete, address: 19, type: bool, poll: fast}
  - {key: x.alarm_supply_fan, label: Supply fan alarm, table: discrete, address: 20, type: bool, poll: fast}
  - {key: x.alarm_exhaust_fan, label: Exhaust fan alarm, table: discrete, address: 21, type: bool, poll: fast}
  - {key: x.alarm_supply_filter, label: Supply filter alarm, table: discrete, address: 22, type: bool, poll: fast}
  - {key: x.alarm_exhaust_filter, label: Exhaust filter alarm, table: discrete, address: 23, type: bool, poll: fast}
  - {key: x.alarm_filter_timer, label: Filter timer alarm, table: discrete, address: 24, type: bool, poll: fast}
  - {key: x.alarm_pump_heating, label: Pump alarm - heating (X4 DI), table: discrete, address: 34, type: bool, poll: fast}
  - {key: x.alarm_pump_cooling, label: Pump alarm - cooling (X14 DI), table: discrete, address: 35, type: bool, poll: fast}
  - {key: x.alarm_error, label: Error (DI-SW5 for PACIF013B-E), table: discrete, address: 41, type: bool, poll: fast}
  - {key: x.alarm_gas, label: Gas alarm (DI-SW2 for PACIF013B-E), table: discrete, address: 42, type: bool, poll: fast}
  - {key: x.alarm_pressure_supply, label: Pressure deviation alarm - supply, table: discrete, address: 45, type: bool, poll: fast}
  - {key: x.alarm_pressure_extract, label: Pressure deviation alarm - extract, table: discrete, address: 46, type: bool, poll: fast}
  - {key: x.alarm_flow_supply, label: Flow deviation alarm - supply, table: discrete, address: 47, type: bool, poll: fast}
  - {key: x.alarm_flow_extract, label: Flow deviation alarm - extract, table: discrete, address: 48, type: bool, poll: fast}
  - {key: x.alarm_com_duct_sensor, label: Lost com. ID 40 (duct pressure sensor), table: discrete, address: 49, type: bool, poll: fast}
  - {key: x.alarm_com_flow_sensor, label: Lost com. ID 41 (flow pressure sensor), table: discrete, address: 50, type: bool, poll: fast}
  - {key: x.alarm_com_filter_sensor, label: Lost com. ID 42 (filter pressure sensor), table: discrete, address: 51, type: bool, poll: fast}
  - {key: x.alarm_com_mini_expansion, label: Lost com. mini expansion, table: discrete, address: 52, type: bool, poll: fast}
  - {key: x.alarm_com_expansion, label: Lost com. expansion, table: discrete, address: 53, type: bool, poll: fast}

  # Operating status (discrete inputs)
  - {key: x.freeze_protection_b, label: Freeze protection B level, table: discrete, address: 25, type: bool, poll: fast}
  - {key: x.freeze_protection_a, label: Freeze protection A level, table: discrete, address: 26, type: bool, poll: fast}
  - {key: x.startup_phase_1, label: Startup 1st phase, table: discrete, address: 27, type: bool, poll: fast, note: 'Damper open, exhaust fan running.'}
  - {key: x.startup_phase_2, label: Startup 2nd phase, table: discrete, address: 28, type: bool, poll: fast, note: 'Supply fan running, temperature regulation started.'}
  - {key: x.heating, label: Heating, table: discrete, address: 29, type: bool, poll: fast}
  - {key: x.recovery, label: Recovery heat/cold, table: discrete, address: 30, type: bool, poll: fast}
  - {key: x.cooling, label: Cooling, table: discrete, address: 31, type: bool, poll: fast}
  - {key: x.co2_boost, label: CO2 boost, table: discrete, address: 32, type: bool, poll: fast}
  - {key: x.rh_boost, label: RH boost, table: discrete, address: 33, type: bool, poll: fast}
  - {key: x.voc_boost, label: VOC boost, table: discrete, address: 36, type: bool, poll: fast}
  - {key: x.snc_active, label: SNC active, table: discrete, address: 37, type: bool, poll: fast}
  - {key: x.pre_defrost, label: Pre-defrost (DI-SW3 for PACIF013B-E), table: discrete, address: 39, type: bool, poll: fast}
  - {key: x.defrost, label: Defrost (DI-SW4 for PACIF013B-E), table: discrete, address: 40, type: bool, poll: fast}

  # Measurements (input registers, function 04)
  - {key: x.component_id, label: Component ID, table: input, address: 0, type: u16, poll: slow, note: Always 10.}
  - {key: x.outdoor_temperature, label: Outdoor temperature (unit), table: input, address: 1, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: 'The document gives no unit, scale or sign for the temperatures; signed tenths of a °C assumed (the sensor calibration offsets are in 0.1 °C).'}
  - {key: x.supply_air_temperature, label: Supply air temperature (unit/duct), table: input, address: 2, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.extract_air_temperature, label: Extract air temperature (unit), table: input, address: 3, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.exhaust_air_temperature, label: Exhaust air temperature (unit), table: input, address: 4, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.water_temperature, label: Water temperature (coil), table: input, address: 5, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.heat_recovery_temperature, label: Heat recovery temperature (unit), table: input, address: 6, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.room_temperature, label: Room temperature, table: input, address: 7, type: s16, unit: °C, scale: 0.1, poll: fast, verified: false, note: Unit and scale not stated; assumed as for the outdoor temperature.}
  - {key: x.supply_duct_pressure, label: Supply pressure - duct (GP1), table: input, address: 11, type: u16, unit: Pa, scale: 10, poll: fast, verified: false, note: The document gives "Pa" and "x10Pa"; read like its "x0.1V" (raw × 10 = Pa). Unverified.}
  - {key: x.extract_duct_pressure, label: Extract pressure - duct (GP2), table: input, address: 12, type: u16, unit: Pa, scale: 10, poll: fast, verified: false, note: '"x10Pa" read as raw × 10 = Pa; unverified.'}
  - {key: x.supply_filter_pressure, label: Supply filter (GP3), table: input, address: 13, type: u16, unit: Pa, scale: 10, poll: fast, verified: false, note: '"x10Pa" read as raw × 10 = Pa; unverified.'}
  - {key: x.exhaust_filter_pressure, label: Exhaust filter (GP4), table: input, address: 14, type: u16, unit: Pa, scale: 10, poll: fast, verified: false, note: '"x10Pa" read as raw × 10 = Pa; unverified.'}
  - {key: x.supply_airflow, label: Supply airflow (GF1), table: input, address: 15, type: u16, unit: l/s, poll: fast}
  - {key: x.exhaust_airflow, label: Exhaust airflow (GF2), table: input, address: 16, type: u16, unit: l/s, poll: fast}
  - {key: x.sensors_open, label: Sensors open, table: input, address: 17, type: u16, flags: sensors, poll: fast, note: A bit is set when a required sensor is open circuit.}
  - {key: x.sensors_shorted, label: Sensors shorted, table: input, address: 18, type: u16, flags: sensors, poll: fast, note: A bit is set when a required sensor is shorted.}
  - {key: x.filter_days_left, label: Filter days left, table: input, address: 19, type: u16, unit: d, poll: slow}
  - {key: x.week_program, label: Current weektimer program, table: input, address: 20, type: u16, poll: fast, note: '0 = none, 1 … 5 = program 1 … 5.'}
  - {key: x.supply_fan_step, label: Current supply fan step, table: input, address: 22, type: u16, enum: fan_step, poll: fast}
  - {key: x.exhaust_fan_step, label: Current exhaust fan step, table: input, address: 23, type: u16, enum: fan_step, poll: fast}
  - {key: x.supply_fan_power, label: Current supply fan power, table: input, address: 24, type: u16, unit: '%', poll: fast}
  - {key: x.exhaust_fan_power, label: Current exhaust fan power, table: input, address: 25, type: u16, unit: '%', poll: fast}
  - {key: x.supply_fan_speed, label: Current supply fan speed, table: input, address: 26, type: u16, unit: rpm, poll: fast}
  - {key: x.exhaust_fan_speed, label: Current exhaust fan speed, table: input, address: 27, type: u16, unit: rpm, poll: fast}
  - {key: x.heating_power, label: Current heating power, table: input, address: 28, type: u16, unit: '%', scale: 0.392157, poll: fast, note: '0 … 255, 255 = 100 %.'}
  - {key: x.recovery_power, label: Current heat/cold recovery power, table: input, address: 29, type: s16, unit: '%', scale: 0.392157, poll: fast, note: '−255 … 255, 255 = 100 %; negative = cold recovery.'}
  - {key: x.cooling_power, label: Current cooling power, table: input, address: 30, type: u16, unit: '%', scale: 0.392157, poll: fast, note: '0 … 255, 255 = 100 %.'}
  - {key: x.supply_fan_voltage, label: Supply fan control voltage, table: input, address: 31, type: u16, unit: V, scale: 0.1, poll: fast}
  - {key: x.exhaust_fan_voltage, label: Exhaust fan control voltage, table: input, address: 32, type: u16, unit: V, scale: 0.1, poll: fast}
  - {key: x.changeover_active, label: Changeover active, table: input, address: 33, type: u16, enum: off_on, poll: fast}
  - {key: x.quality_sensor_1_type, label: Quality sensor 1 - type, table: input, address: 40, type: u16, enum: quality_sensor, poll: slow}
  - {key: x.quality_sensor_1, label: Quality sensor 1 - value, table: input, address: 41, type: u16, poll: fast, note: 'RH in % (0 … 100) or CO2 / VOC in ppm (0 … 2000), by the sensor type.'}
  - {key: x.quality_sensor_2_type, label: Quality sensor 2 - type, table: input, address: 42, type: u16, enum: quality_sensor, poll: slow}
  - {key: x.quality_sensor_2, label: Quality sensor 2 - value, table: input, address: 43, type: u16, poll: fast, note: 'RH in % or CO2 / VOC in ppm, by the sensor type.'}
  - {key: x.quality_sensor_3_type, label: Quality sensor 3 - type, table: input, address: 44, type: u16, enum: quality_sensor, poll: slow}
  - {key: x.quality_sensor_3, label: Quality sensor 3 - value, table: input, address: 45, type: u16, poll: fast, note: 'RH in % or CO2 / VOC in ppm, by the sensor type.'}

  # Settings (holding registers, function 03 / 06 / 16)
  - {key: x.setpoint_economy, label: Temperature setpoint (economy), table: holding, address: 0, type: u16, unit: °C, writable: true, poll: slow, note: 15 … comfort setpoint − 1.}
  - {key: x.setpoint_comfort, label: Temperature setpoint (comfort), table: holding, address: 1, type: u16, unit: °C, writable: true, poll: slow, note: '15 … 40, or the comfort maximum (holding 47).'}
  - {key: x.supply_fan_speed_setting, label: 'Supply fan speed, EC', table: holding, address: 2, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, note: Read-only with fan regulation type CPC.}
  - {key: x.exhaust_fan_speed_setting, label: 'Exhaust fan speed, EC', table: holding, address: 3, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, note: Read-only with fan regulation type CPC.}
  - {key: x.temperature_regulation_mode, label: Temperature regulation mode, table: holding, address: 11, type: u16, enum: regulation_mode, writable: true, poll: slow}
  - {key: x.min_supply_temperature, label: Min supply temperature, table: holding, address: 12, type: u16, unit: °C, writable: true, min: 15, max: 19, poll: slow, note: Used with extract or room regulation.}
  - {key: x.max_supply_temperature, label: Max supply temperature, table: holding, address: 13, type: u16, unit: °C, writable: true, min: 20, max: 40, poll: slow}
  - {key: x.boost_duration, label: Boost duration, table: holding, address: 26, type: u16, unit: min, writable: true, min: 10, max: 240, poll: slow}
  - {key: x.overpressure_duration, label: Overpressure duration, table: holding, address: 27, type: u16, unit: min, writable: true, min: 10, max: 60, poll: slow}
  - {key: x.filter_change_period, label: Filter change period, table: holding, address: 43, type: u16, unit: month, writable: true, poll: slow, note: '0 = off, 6 … 12 months of 30 days.'}
  - {key: x.alarm_classes, label: Alarm classes, table: holding, address: 44, type: u16, writable: true, poll: slow, note: Bit mask choosing alarm class A (0) or B (1) per alarm group; default 65384.}
  - {key: x.setpoint_max_comfort, label: Setpoint max limit (comfort), table: holding, address: 47, type: u16, unit: °C, writable: true, min: 15, max: 40, poll: slow}
  - {key: x.eco_setpoint_enabled, label: Eco. setpoint enabled, table: holding, address: 48, type: u16, enum: no_yes, writable: true, poll: slow}
  - {key: x.week_schedule_enabled, label: Week schedule enabled, table: holding, address: 139, type: u16, enum: no_yes, writable: true, poll: slow, note: Master switch for all week programs.}
  - {key: x.holiday_schedule_enabled, label: Holiday schedule enabled, table: holding, address: 199, type: u16, enum: no_yes, writable: true, poll: slow, note: Master switch for all holiday programs.}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 900, type: u16, writable: true, min: 1, max: 255, poll: slow}
  - {key: x.baud_rate, label: Baudrate, table: holding, address: 901, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.stop_bits, label: Stopbit, table: holding, address: 902, type: u16, enum: stop_bits, writable: true, poll: slow}
  - {key: x.parity, label: Parity, table: holding, address: 903, type: u16, enum: parity, writable: true, poll: slow}

enums:
  contact: {'0': Open, '1': Closed}
  off_on: {'0': 'Off', '1': 'On'}
  no_yes: {'0': 'No', '1': 'Yes'}
  fan_step: {'0': 'Off', '1': Min, '2': Std, '3': Max}
  quality_sensor: {'0': None, '1': RH, '2': CO2, '3': VOC}
  regulation_mode: {'0': Supply, '1': Extract, '2': Room, '3': Extract S/W, '4': Room S/W}
  baud_rate: {'0': '9600', '1': '14400', '2': '19200', '3': '28800', '4': '38400', '5': '57600', '6': '115200', '7': '230400'}
  stop_bits: {'0': Auto, '1': '1', '2': '2'}
  parity: {'0': None, '1': Odd, '2': Even}

flags:
  sensors: {'0': T1, '1': T2, '2': T3, '3': T4, '4': T5, '5': T6, '6': T7}

problems:
  - {when: {key: x.alarm_fire, equals: 1}, kind: fault, text: Fire alarm}
  - {when: {key: x.alarm_rotor, equals: 1}, kind: fault, text: Rotor alarm}
  - {when: {key: x.alarm_freeze, equals: 1}, kind: fault, text: Freeze alarm}
  - {when: {key: x.alarm_low_supply, equals: 1}, kind: warning, text: Low supply alarm}
  - {when: {key: x.alarm_low_rotor_temperature, equals: 1}, kind: warning, text: Low rotor temperature alarm}
  - {when: {key: x.alarm_sensor_open, equals: 1}, kind: fault, text: Temperature sensor open circuit}
  - {when: {key: x.alarm_sensor_short, equals: 1}, kind: fault, text: Temperature sensor short circuit}
  - {when: {key: x.alarm_pulser, equals: 1}, kind: fault, text: Pulser alarm}
  - {when: {key: x.alarm_supply_fan, equals: 1}, kind: fault, text: Supply fan alarm}
  - {when: {key: x.alarm_exhaust_fan, equals: 1}, kind: fault, text: Exhaust fan alarm}
  - {when: {key: x.alarm_supply_filter, equals: 1}, kind: warning, text: Supply filter alarm}
  - {when: {key: x.alarm_exhaust_filter, equals: 1}, kind: warning, text: Exhaust filter alarm}
  - {when: {key: x.alarm_filter_timer, equals: 1}, kind: warning, text: Filter change due (filter timer)}
  - {when: {key: x.alarm_pump_heating, equals: 1}, kind: warning, text: Heating pump alarm}
  - {when: {key: x.alarm_pump_cooling, equals: 1}, kind: warning, text: Cooling pump alarm}
  - {when: {key: x.alarm_error, equals: 1}, kind: fault, text: Error input (PACIF013B-E)}
  - {when: {key: x.alarm_gas, equals: 1}, kind: warning, text: Gas alarm}
  - {when: {key: x.alarm_pressure_supply, equals: 1}, kind: warning, text: Supply pressure deviation}
  - {when: {key: x.alarm_pressure_extract, equals: 1}, kind: warning, text: Extract pressure deviation}
  - {when: {key: x.alarm_flow_supply, equals: 1}, kind: warning, text: Supply flow deviation}
  - {when: {key: x.alarm_flow_extract, equals: 1}, kind: warning, text: Extract flow deviation}
  - {when: {key: x.alarm_com_duct_sensor, equals: 1}, kind: warning, text: Lost communication with the duct pressure sensor (ID 40)}
  - {when: {key: x.alarm_com_flow_sensor, equals: 1}, kind: warning, text: Lost communication with the flow pressure sensor (ID 41)}
  - {when: {key: x.alarm_com_filter_sensor, equals: 1}, kind: warning, text: Lost communication with the filter pressure sensor (ID 42)}
  - {when: {key: x.alarm_com_mini_expansion, equals: 1}, kind: warning, text: Lost communication with the mini expansion}
  - {when: {key: x.alarm_com_expansion, equals: 1}, kind: warning, text: Lost communication with the expansion}

notes:
- 'Addresses: the document numbers coils 0x00001 …, discrete inputs 1x00001 …, input registers 3x00001 … and holding registers
  4x00001 …; each became its table with the 0-based address n − 1 (e.g. 4x00901 = holding 900).'
- The maker is taken from the document's metadata (an ostberg.com author); the register list itself names only the IQC controller.
- Registers marked RFU are left out; they read back without meaning.
- 'Left out: the fan airflow and pressure setpoints per regulation type (holding 4 … 10, 109 … 136), freeze and SNC limits,
  standby evaluation, fire mode, filter measurement, alarm relay, changeover, damper, heater / cooler configuration, sensor
  configuration and calibration, quality sensor limits, the five week programs (holding 140 … 187) and ten holiday programs
  (holding 200 … 390), menu access and the PID parameters (holding 919 … 945).'
- 'The clock (holding 399 … 404: year, month, day, hours, minutes, seconds) is left out: reading the day copies the time into
  a buffer and writing the seconds sets it, so it needs a defined read order.'
- Temperature measurements have no unit or scale in the document; signed tenths of a °C are assumed. Setpoints and limits
  in holding registers are whole °C as stated.
- Component ID (input 0) always reads 10. That alone is too weak to recognise the unit, and there is no serial number register,
  so this file has no identify.
- Default unit address and serial settings are not stated; 1, 9600 baud, 8N1 are assumed. The TCP port is the usual default
  for a gateway.
