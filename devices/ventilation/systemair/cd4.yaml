  heizregister_typ: {'0': kein Heizregister, '1': Wasser, '2': Elektrisch, '3': 'Schütz (Contactor)?'}
  kuehler_typ: {'0': kein Kuehler, '1': Wasser}
  vorheizregister_typ: {'0': kein Heizregister, '1': Elektrisches Heizregister}
  status_rotor: {'0': keine Fehler, '1': Fehler}
