  defroster_vtc_konfiguration: {'0': A, '1': B, '2': C, '3': D}
  defroster_vtc_unbal_allowed: {'0': Unbalance not allowed, '1': 'Unbalance allowed ?'}
  defroster_vtr_status: {'0': Inactive, '1': niedrige Temperatur, '2': Defrosting}
