notes:
- The project reads holding registers with function 03 and the status bits with function 02 (discrete inputs), over a serial
  line (minimalmodbus). Addresses are the 1-based numbers of Systemair's list minus 1; the project notes that the list's numbering
  is off by one.
- SmartHomeNG plugin systemair.
- Addresses are Systemair's register numbers minus 1; every register is a holding register.
- The manual speed register (100) is both status and command.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
