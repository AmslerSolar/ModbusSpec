enums:
  mode_status: {'0': Auto, '1': Manual, '2': Party, '3': Boost, '4': Fireplace, '5': Away, '6': Holiday, '7': Cooker Hood, '8': Vacuum cleaner, '9': CDI1, '10': CDI2, '11': CDI3, '12': Pressure guard}
  mode_command: {'1': Auto, '2': Manual, '3': Party, '4': Boost, '5': Fireplace, '6': Away, '7': Holiday}
  manual_speed: {'0': Stop, '2': Low, '3': Normal, '4': High}
  free_cooling_min_speed: {'3': Normal, '4': High, '5': Maximum}
  summer_winter_operation_1_0: {'0': Summer, '1': Winter}
  iaq_level: {'0': Economy, '1': Good, '2': Improve}
  supply_air_room_exhaust_reg: {'0': Supply air, '1': Room, '2': Exhaust air}

notes:
- Addresses are Systemair's register numbers minus 1. 32-bit values are low register first.
- With the SAVE Connect gateway profile the integration reads input registers with function 03 and at most 2 registers per
  request.
- The supply and extract air flow (m³/h) the integration shows are estimates from the fan output (%), not registers.
- 'Upstream doubt: eco_heat_offset is read as unsigned but its number entity allows −10…10 °C; the integration''s 0.1 °C writer
  clamps negative values to 0.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
