modbusspec: 0
id: neptronic-cmu
manufacturer: Neptronic
name: Compact make-up air unit (CMU)
kind: ventilation

sources:
- title: Compact Make-up Air Unit, Modbus Communication Module User Guide (CMU-Modbus Guide-211125)
  version: '2021-11-25'
  url: http://neptronic.com/Heaters/pdf/20211206/CMU-Modbus%20Guide-211125.pdf
  sha256: d9e4e5ce1cee511097c19e4a390a4a0e1eee5356a90e011e6af4c082b5e0afc0
  archive_url: https://web.archive.org/web/20220525134740/http://neptronic.com/Heaters/pdf/20211206/CMU-Modbus%20Guide-211125.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N2

encoding:
  byte_order: big
  word_order: big

points:
  # Inputs and measurements (0–31)
  - {key: x.modbus_address, label: Modbus product type and address, table: holding, address: 0, type: u16, bits: [0, 7], writable: true, min: 1, max: 247, poll: slow, note: Modbus address in the low byte; the high byte holds the product type (value not given).}
  - {key: x.ai1_voltage, label: Analog input 1 voltage, table: holding, address: 1, type: u16, unit: V, scale: 0.001}
  - {key: x.ai2_voltage, label: Analog input 2 voltage, table: holding, address: 2, type: u16, unit: V, scale: 0.001}
  - {key: x.ai3_temperature, label: Analog input 3 temperature, table: holding, address: 3, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.ai4_temperature, label: Analog input 4 temperature, table: holding, address: 4, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.room_temperature, label: Room air temperature value measured by TDF, table: holding, address: 5, type: u16, unit: °C, scale: 0.01, verified: false, note: Digital room sensor (TDF). °C or °F; °C assumed.}
  - {key: x.room_humidity, label: Room air relative humidity value measured by TDF, table: holding, address: 6, type: u16, unit: '%', scale: 0.1}
  - {key: x.room_co2, label: Room CO2 concentration value measured by TDF, table: holding, address: 7, type: u16, unit: ppm}
  - {key: x.room_voc_index, label: Volatile organic compound index measured by TDF, table: holding, address: 8, type: u16}
  - {key: x.room_illuminance, label: Luminous flux measured by TDF, table: holding, address: 9, type: u16, unit: lx}
  - {key: x.potentiometer_setpoint, label: CMU on-board potentiometer temperature setpoint, table: holding, address: 10, type: u16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.intake_temperature, label: CMU intake temperature, table: holding, address: 11, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.outtake_temperature, label: CMU outtake temperature, table: holding, address: 12, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.board_temperature, label: CMU board temperature, table: holding, address: 13, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.ssr_temperature, label: CMU SSR temperature, table: holding, address: 14, type: s16, unit: °C, scale: 0.01, verified: false, note: Solid state relay temperature. °C or °F; °C assumed.}
  - {key: x.input3_state, label: AI3/BI3 multi-mode input state, table: holding, address: 15, type: u16, enum: open_closed}
  - {key: x.input4_state, label: AI4/BI4 multi-mode input state, table: holding, address: 16, type: u16, enum: open_closed}
  - {key: x.occupancy_detected, label: Room movement detection occupancy sensor, table: holding, address: 17, type: u16, enum: no_yes}
  - {key: x.on_off_input, label: CMU On/Off contact input state, table: holding, address: 18, type: u16, enum: off_on}
  - {key: x.ao1_voltage, label: Analog output 1 voltage, table: holding, address: 19, type: u16, unit: V, scale: 0.01}
  - {key: x.ao2_voltage, label: Analog output 2 voltage, table: holding, address: 20, type: u16, unit: V, scale: 0.01}
  - {key: x.bo1_state, label: Binary output 1 state, table: holding, address: 21, type: u16, enum: open_closed}
  - {key: x.bo2_state, label: Binary output 1 state (second), table: holding, address: 22, type: u16, enum: open_closed, note: The document names 40023 'Binary output 1 state' as well; presumably binary output 2.}
  - {key: x.supply_air_temperature, label: Supply air temperature, table: holding, address: 23, type: u16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.supply_air_humidity, label: Supply air relative humidity, table: holding, address: 24, type: u16, unit: '%', scale: 0.01}
  - {key: x.outdoor_temperature, label: Outside air temperature, table: holding, address: 25, type: s16, unit: °C, scale: 0.01, verified: false, note: °C or °F; °C assumed.}
  - {key: x.outdoor_humidity, label: Outside air relative humidity, table: holding, address: 26, type: u16, unit: '%', scale: 0.01}
  - {key: x.duct_static_pressure, label: Duct static pressure, table: holding, address: 27, type: u16, unit: Pa, scale: 0.1}
  - {key: x.damper_position, label: Damper position feedback, table: holding, address: 28, type: u16, unit: '%'}
  - {key: x.airflow_setpoint_actual, label: Current airflow setpoint in percent of maximum capacity, table: holding, address: 29, type: u16, unit: '%'}
  - {key: x.fan_speed, label: CMU ECM fan speed feedback value, table: holding, address: 30, type: u16, unit: rpm}
  - {key: x.heater_duty_cycle, label: Heater vernier stage duty cycle, table: holding, address: 31, type: u16, unit: '%', scale: 0.1}

  # Settings (32–70)
  - {key: x.network_setpoint, label: Network temperature setpoint, table: holding, address: 32, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C or °F; °C assumed. Scale from the example (5 °C = 500); the document also says 'value x 1'.}
  - {key: x.tdf_setpoint, label: TDF temperature setpoint, table: holding, address: 33, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C or °F; °C assumed.}
  - {key: x.antifreeze_setpoint, label: CMU anti-freeze setpoint, table: holding, address: 34, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C or °F; °C assumed.}
  - {key: x.occupied_airflow_setpoint, label: Occupied airflow setpoint in percent of maximum capacity, table: holding, address: 35, type: u16, unit: '%', writable: true, min: 0, max: 100}
  - {key: x.unoccupied_airflow_setpoint, label: Unoccupied airflow setpoint in percent of maximum capacity, table: holding, address: 36, type: u16, unit: '%', writable: true, min: 0, max: 100}
  - {key: x.dry_mode_humidity_setpoint, label: Dry mode relative humidity setpoint, table: holding, address: 46, type: u16, unit: '%', writable: true, min: 10, max: 90, poll: slow}
  - {key: x.occupied_pressure_setpoint, label: Occupied static pressure control loop setpoint, table: holding, address: 48, type: u16, unit: Pa, scale: 0.1, writable: true, min: 0, max: 1250, poll: slow}
  - {key: x.unoccupied_pressure_setpoint, label: Unoccupied static pressure control loop setpoint, table: holding, address: 49, type: u16, unit: Pa, scale: 0.1, writable: true, min: 0, max: 1250, poll: slow}
  - {key: x.co2_setpoint, label: CO2 concentration setpoint, table: holding, address: 50, type: u16, unit: ppm, writable: true, min: 0, max: 1000, poll: slow}
  - {key: x.minimum_fan_speed, label: Minimum fan speed, table: holding, address: 59, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.modbus_timeout, label: Modbus timeout, table: holding, address: 67, type: u16, unit: s, writable: true, min: 15, max: 1800, poll: slow}

  # States and modes (71–103)
  - {key: x.exhaust_fan, label: Exhaust fan state, table: holding, address: 71, type: u16, enum: off_on}
  - {key: x.damper_state, label: On/Off damper state, table: holding, address: 72, type: u16, enum: closed_open}
  - {key: x.damper_feedback, label: On/Off damper feedback, table: holding, address: 73, type: u16, enum: closed_open}
  - {key: x.fan_enable, label: CMU fan enable, table: holding, address: 74, type: u16, enum: no_yes}
  - {key: x.heater_stage2, label: CMU heater stage 2 state, table: holding, address: 75, type: u16, enum: off_on}
  - {key: x.dry_mode, label: Dry mode, table: holding, address: 81, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.co2_extract, label: CO2 extract, table: holding, address: 82, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.static_pressure_loop, label: Static pressure loop, table: holding, address: 83, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.occupancy_state, label: CMU occupancy state, table: holding, address: 85, type: u16, enum: occupancy_state, writable: true}
  - {key: x.setpoint_source, label: Temperature setpoint source, table: holding, address: 86, type: u16, enum: setpoint_source, writable: true, poll: slow}
  - {key: x.control_temperature_source, label: Control temperature source, table: holding, address: 100, type: u16, enum: control_source, writable: true, poll: slow}
  - {key: x.last_reset_reason, label: LCD screen last reset reason, table: holding, address: 103, type: u16, enum: reset_reason, poll: slow}

  # Alarms (104–105)
  - {key: x.alarm_status, label: Alarm status, table: holding, address: 104, type: u16, flags: alarm_status}
  - {key: x.system_alarm, label: System alarm host, table: holding, address: 105, type: u32, flags: system_alarm, verified: false, note: 'The document lists bits up to B31 for this register but no register 40107; read here as a 32-bit value over 40106–40107, high word first (assumed).'}

enums:
  open_closed: {'0': Open, '1': Closed}
  closed_open: {'0': Closed, '1': Open}
  off_on: {'0': 'Off', '1': 'On'}
  no_yes: {'0': 'No', '1': 'Yes'}
  disable_enable: {'0': Disabled, '1': Enabled}
  occupancy_state: {'1': Occupied, '2': Unoccupied, '3': 'Off'}
  setpoint_source: {'1': On board, '2': Thermostat (TSTAT), '3': Network}
  control_source: {'1': Supply air temperature, '2': Room air temperature}
  reset_reason: {'1': No reason, '2': Independent watchdog, '3': Window watchdog, '4': Software reset, '5': Power down}

flags:
  alarm_status: {'0': Unblocking damper required, '1': Sensor 1 not detected, '2': Sensor 2 not detected, '3': Supply air temperature sensor not detected, '4': Room air temperature sensor not detected, '5': Communication timeout, '6': AI1 reading error, '7': AI2 reading error}
  system_alarm: {'0': Thermal cutout, '1': Communication timeout, '3': Heater temperature cutout, '4': SSR temperature cutout, '5': Board temperature cutout, '6': Duct temperature cutout, '7': Heater temperature 1 failure, '8': Heater temperature 2 failure, '9': Board temperature failure, '10': SSR temperature failure, '11': TRL failure, '13': Invalid configuration, '14': Fan temperature failure, '16': External temperature failure, '17': Supply temperature failure, '22': Fan feedback error, '30': Air flow not detected, '31': Heat not detected}

problems:
  - {when: {key: x.alarm_status, bit: 0}, kind: warning, text: Damper unblocking required}
  - {when: {key: x.alarm_status, bit: 3}, kind: warning, text: Supply air temperature sensor not detected}
  - {when: {key: x.alarm_status, bit: 4}, kind: warning, text: Room air temperature sensor not detected}
  - {when: {key: x.alarm_status, bit: 5}, kind: warning, text: Communication timeout}
  - {when: {key: x.alarm_status, bit: 6}, kind: warning, text: AI1 reading error}
  - {when: {key: x.alarm_status, bit: 7}, kind: warning, text: AI2 reading error}
  - {when: {key: x.system_alarm, bit: 0}, kind: fault, text: Thermal cutout}
  - {when: {key: x.system_alarm, bit: 3}, kind: fault, text: Heater temperature cutout}
  - {when: {key: x.system_alarm, bit: 4}, kind: fault, text: SSR temperature cutout}
  - {when: {key: x.system_alarm, bit: 5}, kind: fault, text: Board temperature cutout}
  - {when: {key: x.system_alarm, bit: 6}, kind: fault, text: Duct temperature cutout}
  - {when: {key: x.system_alarm, bit: 7}, kind: fault, text: Heater temperature sensor 1 failure}
  - {when: {key: x.system_alarm, bit: 8}, kind: fault, text: Heater temperature sensor 2 failure}
  - {when: {key: x.system_alarm, bit: 9}, kind: fault, text: Board temperature sensor failure}
  - {when: {key: x.system_alarm, bit: 10}, kind: fault, text: SSR temperature sensor failure}
  - {when: {key: x.system_alarm, bit: 11}, kind: warning, text: TRL failure}
  - {when: {key: x.system_alarm, bit: 13}, kind: fault, text: Invalid configuration}
  - {when: {key: x.system_alarm, bit: 14}, kind: fault, text: Fan temperature failure}
  - {when: {key: x.system_alarm, bit: 16}, kind: warning, text: External temperature sensor failure}
  - {when: {key: x.system_alarm, bit: 17}, kind: warning, text: Supply temperature sensor failure}
  - {when: {key: x.system_alarm, bit: 22}, kind: fault, text: Fan feedback error}
  - {when: {key: x.system_alarm, bit: 30}, kind: fault, text: Air flow not detected}
  - {when: {key: x.system_alarm, bit: 31}, kind: fault, text: Heat not detected}

notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxx number (40001 = 0); the protocol address
  is used.'
- Holding registers only (functions 03, 06, 16). RS485 Modbus RTU, unit id 1–247 set on the device menu or in register 0.
- 'Serial: automatic baud rate detection by default (9600–76800); parity and stop bits configurable. Default framing not stated;
  9600 8N2 assumed.'
- Default unit id not stated; 1 assumed.
- Temperatures are in °C or °F depending on the unit's setting; °C assumed. The register selecting the unit isn't in the document.
- Several labels mention a 'communication timeout' twice (alarm status bit 5 and system alarm bit 1); both are kept as in
  the document.
- 'Left out: sensor offsets (52–58), stage weights, exhaust fan and damper timings, PID tuning (60–66), input / output mode
  and range configuration (76–80, 87–99) and LCD display options.'
- The product type in the high byte of register 0 isn't given for this unit, so there is no identification.
