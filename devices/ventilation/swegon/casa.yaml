  - {key: x.extract_air_temperature, label: Extract air temperature, table: input, address: 6203, type: s16, unit: °C, scale: 0.1}
  - {key: x.exhaust_air_temperature, label: Exhaust air temperature, table: input, address: 6204, type: s16, unit: °C, scale: 0.1, optional: true, note: T5 if fitted.}
  - {key: x.room_air_temperature, label: Room air temperature, table: input, address: 6205, type: s16, unit: °C, scale: 0.1}
