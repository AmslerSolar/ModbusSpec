  - {key: x.voc, label: Room air VOC, table: input, address: 6216, type: u16, unit: ppm, optional: true}
  - {key: x.supply_duct_pressure, label: Supply Duct Pressure, table: input, address: 6217, type: u16, unit: Pa, optional: true, note: Needs an external pressure sensor.}
  - {key: x.exhaust_duct_pressure, label: Exhaust Duct Pressure, table: input, address: 6218, type: u16, unit: Pa, optional: true, note: Needs an external pressure sensor.}
  - {key: x.supply_air_flow, label: Supply Air Flow, table: input, address: 6219, type: u16, unit: l/s, optional: true, note: Needs an external airflow sensor.}
  - {key: x.exhaust_air_flow, label: Exhaust Air Flow, table: input, address: 6220, type: u16, unit: l/s, optional: true, note: Needs an external airflow sensor.}
