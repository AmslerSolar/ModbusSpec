notes:
- The document lists registers as 4x (holding, function 03) and 3x (input, function 04) references; they are taken as 1-based,
  so 4x5001 is holding address 5000 and 3x6201 input address 6200. The numbering base isn't stated; assumed.
- Valid for the SEM / SEC Modbus connection with Genius software 4.0; each register's first software version is in the document
  (3.0, 3.1, 4.0, 4.1). Registers marked 4.x are missing on older software.
- The document gives neither serial settings nor a default unit id; unit 1 is assumed.
- Each alarm also has its own active / resettable register pair (3x6101…3x6199); the bit words carry the same information
  and are listed instead. Words 2 and 3 (and the critical alarm) are Genius-only.
- 'Left out: automation tuning limits, cooking / fireplace / vacuum cleaner tuning, heating and cooling coil configuration,
  GIO and relay functions and their Modbus control, sensor selection and 0–10 V scaling, per-sensor CO2 / RH / VOC / temperature
  readings, pressure commissioning setpoints, heater outputs, and the room controller area (4x1505…, 3x2253…).'
- The register list is for SEM / SEC device version 3.0 and later; some registers changed meaning between software 3.0 and
  3.1 (auto humidity / air quality control are 0/1 in 3.0, 0…5 from 3.1).
- 'Modbus RTU on the unit''s RJ45 port for SEC/SEM accessories (568B: orange/white = A+, orange = B−).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
