modbusspec: 0
id: swegon-casa
manufacturer: Swegon
name: CASA ventilation units (SEM / SEC, Genius software)
kind: ventilation

sources:
- title: Swegon CASA Genius Modbus Register (technical data sheet 9838)
  version: SCB 4.1, updated 2023-08-28
  url: https://www.swegon.com/globalassets/digizuite/9838-en-casa_genius_modbus_address_technicaldatasheet_en.pdf
  sha256: 38d3ded742b3b600d0af13969ffbc1b254ae8d3c9ebd868f5adfe1c9d1374d93
- id: swegon-modbus
  title: swegon_modbus (Home Assistant integration)
  url: https://github.com/majorfrog/swegon_modbus
  license: MIT
  commit: 58d96d8e2ec306f981f00d6e4af2c549a4bbdef8
  path: custom_components/swegon_modbus/models.py, custom_components/swegon_modbus/const.py, custom_components/swegon_modbus/translations/en.json,
    swegon_registers.md

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

identify:
  serial:
    table: input
    address: 6023
    type: str
    length: 24
    chars: low

points:
  # User settings
  - {key: x.operating_mode, label: Operating Mode, table: holding, address: 5000, type: u16, enum: operating_mode, writable: true}
  - {key: x.fireplace_activate, label: Fireplace function Activation, table: holding, address: 5001, type: u16, writable: true, write_only: true, note: '1 starts the fireplace function (with its timer), 0 stops it.'}
  - {key: x.cooking_mode, label: Cooking mode control, table: holding, address: 5004, type: u16, enum: off_on, writable: true, persistent: false, note: 1 opens the cooker hood damper and sets the cooking airflows; it switches off after 10 h or on restart.}
  - {key: x.co2_automation, label: CO2 automation, table: holding, address: 5008, type: u16, enum: off_on, writable: true, poll: slow, note: Units with a CO2 sensor only.}
  - {key: x.rh_automation, label: RH automation, table: holding, address: 5009, type: u16, enum: automation_level, writable: true, poll: slow}
  - {key: x.voc_automation, label: VOC automation, table: holding, address: 5010, type: u16, enum: automation_level, writable: true, poll: slow, note: Units with a VOC sensor only.}
  - {key: x.emergency_stop, label: Emergency Stop, table: holding, address: 5017, type: u16, enum: emergency_stop, writable: true, poll: slow, note: With emergency overpressurising the water radiator freezing protection is off.}
  - {key: x.temperature_setpoint, label: Temperature setpoint, table: holding, address: 5100, type: s16, unit: °C, scale: 0.1, writable: true, min: 13, max: 25, poll: slow, note: Supply air setpoint (supply air control)., conflicts: [{sources: [swegon-modbus], scale: 1}]}
  - {key: x.boost_timer, label: Boost mode timer, table: holding, address: 5101, type: u16, enum: boost_timer, writable: true, poll: slow}
  - {key: x.travelling_speed_drop, label: Travelling mode speed drop, table: holding, address: 5105, type: u16, unit: '%', writable: true, min: 0, max: 10, poll: slow}
  - {key: x.home_plus_level, label: Home + mode ventilation level, table: holding, address: 5107, type: u16, unit: '%', writable: true, min: 10, max: 90, poll: slow, note: 0 % is the Home and 100 % the Boost ventilation level.}
  - {key: x.supply_control_method, label: Supply air control method, table: holding, address: 5129, type: u16, enum: supply_control_method, writable: true, poll: slow}
  - {key: x.service_reminder, label: Service Reminder, table: holding, address: 5140, type: u16, enum: off_on, writable: true, poll: slow, note: Writing 0 then 1 restarts the service interval.}
  - {key: x.service_interval, label: Service Reminder interval, table: holding, address: 5141, type: u16, unit: month, writable: true, min: 0, max: 12, poll: slow}
  - {key: x.summer_mode_detection, label: Summer mode detection, table: holding, address: 5163, type: u16, enum: summer_mode_detection, writable: true, poll: slow}
  - {key: x.temperature_setpoint_summer, label: Temperature setpoint Summer, table: holding, address: 5167, type: s16, unit: °C, scale: 0.1, writable: true, min: 13, max: 25, poll: slow, conflicts: [{sources: [swegon-modbus], type: u16, scale: 1, label: Summer cooling minimum supply temperature}]}
  - {key: x.summer_mode_boost, label: Summer mode boost, table: holding, address: 5168, type: u16, enum: automation_level, writable: true, poll: slow}
  - {key: x.room_temperature_setpoint, label: Room temperature setpoint, table: holding, address: 5186, type: s16, unit: °C, scale: 0.1, writable: true, min: 13, max: 25, poll: slow}
  - {key: x.away_supply_fan, label: Away mode Supply fan speed, table: holding, address: 5301, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.away_exhaust_fan, label: Away mode Exhaust fan speed, table: holding, address: 5302, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.home_supply_fan, label: Home mode Supply fan speed, table: holding, address: 5303, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.home_exhaust_fan, label: Home mode Exhaust fan speed, table: holding, address: 5304, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.boost_supply_fan, label: Boost mode Supply fan speed, table: holding, address: 5305, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.boost_exhaust_fan, label: Boost mode Exhaust fan speed, table: holding, address: 5306, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.ventilation_control_mode, label: Ventilation control mode, table: holding, address: 5317, type: u16, enum: ventilation_control_mode, poll: slow}
  - {key: x.reset_info_alarms, label: Reset All info alarms, table: holding, address: 5405, type: u16, writable: true, write_only: true, note: 1 confirms the alarms; clears itself.}

  # Device information
  - {key: x.firmware_major, label: Device Firmware version major, table: input, address: 6000, type: u16, poll: slow}
  - {key: x.firmware_minor, label: Device Firmware version minor, table: input, address: 6001, type: u16, poll: slow}
  - {key: x.firmware_build, label: Device Firmware build, table: input, address: 6002, type: u16, poll: slow}
  - {key: x.model_name, label: 'Model name[0:14]', table: input, address: 6007, type: str, length: 15, chars: low, poll: slow, note: 15 ASCII characters (the document's register range for it is garbled); one character per register in the low byte assumed., conflicts: [{sources: [swegon-modbus], length: 16, label: Model name}], verified: false}
  - {key: serial, label: 'Unit Serial Number[0:23]', table: input, address: 6023, type: str, length: 24, chars: low, poll: slow, note: 24 ASCII characters in 24 registers (3x6024…3x6047); one character per register in the low byte assumed., conflicts: [{sources: [swegon-modbus], label: Serial number}], verified: false}

  # Alarms
  - {key: x.active_alarm, label: Active Alarms, table: input, address: 6131, type: u16, enum: no_yes}
  - {key: x.alarm_word_1, label: Active Alarms Bitwise - 1, table: input, address: 6135, type: u16, flags: alarms_1}
  - {key: x.past_alarm_word_1, label: Resettable alarm bitwise - 1 (Past active alarm), table: input, address: 6136, type: u16, flags: alarms_1}
  - {key: x.alarm_word_2, label: Active Alarms Bitwise - 2, table: input, address: 6190, type: u16, flags: alarms_2}
