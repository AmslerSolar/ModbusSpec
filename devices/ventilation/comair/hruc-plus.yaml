modbusspec: 0
id: comair-hruc-plus
manufacturer: ComAir / Vent-Axia
name: HRUC-Plus 3, Sentinel Kinetic Advance / Econiq / Apex (Gen V)
kind: ventilation

sources:
- id: comair-modbus-homeassistant
  title: comair-modbus-homeassistant (Home Assistant integration)
  url: https://github.com/Koky05/comair-modbus-homeassistant
  license: MIT
  commit: 3df62987a5004247e1c1bcd2772bf75d6cb10e89
  path: custom_components/comair_modbus/library/const.py, custom_components/comair_modbus/library/components.py, custom_components/comair_modbus/library/codes.py

connection:
  default_port: 502
  default_unit: 2
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - comair-modbus-homeassistant

points:
