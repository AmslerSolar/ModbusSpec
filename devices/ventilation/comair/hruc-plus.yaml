  - {key: x.override_minutes, label: Override duration, table: holding, address: 29, type: u16, unit: min, bits: [0, 7], writable: true, note: 0 = no override (the unit runs its own schedule).}
  - {key: x.override_preset, label: Override airflow preset, table: holding, address: 29, type: u16, bits: [8, 15], enum: ventilation_preset, writable: true, note: 'High byte: airflow preset (enum ventilation_preset); low byte: duration in minutes (at most 240). A duration of 0 cancels the override and returns the unit to its own schedule; preset 0 with a duration stops the fans. The unit sets the register back to 0 once it has taken the override.'}
  - {key: x.clock, label: Clock, table: holding, address: 39, type: datetime, length: 3, datetime: {year: {register: 0}, month: {register: 1, bits: [8, 15]}, day: {register: 1, bits: [0, 7]}, hour: {register: 2, bits: [8, 15]}, minute: {register: 2, bits: [0, 7]}}, writable: true}
  - {key: x.run_time, label: Run Time, table: input, address: 0, type: u16, unit: d}
  - {key: x.service_timer, label: Service Timer, table: input, address: 1, type: u16, unit: month, offset: 1, note: The unit counts from 0; the project adds 1 to match the manual.}
  - {key: x.filter_timer, label: Filter Timer, table: input, address: 2, type: u16, unit: month, offset: 1, note: The unit counts from 0; the project adds 1 to match the manual.}
