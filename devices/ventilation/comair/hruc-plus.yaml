  - {key: x.bypass_state, label: Damper Position, table: input, address: 11, type: u16, enum: bypass_state}
  - {key: x.supply_rpm, label: Supply rpm, table: input, address: 13, type: u16, unit: rpm, invalid: [32768]}
  - {key: x.extract_rpm, label: Extract rpm, table: input, address: 15, type: u16, unit: rpm, invalid: [32768]}
  - {key: x.attention_led, label: Attention LED, table: input, address: 19, type: u16, invalid: [32768], note: Any non-zero value means on.}
