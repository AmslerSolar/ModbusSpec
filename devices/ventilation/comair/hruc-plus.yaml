enums:
  bypass_state: {'0': Closed, '1': SBP Normal, '2': SBP Evening Fresh, '3': SBP Nighttime Fresh, '4': Anti-frost, '5': Diagnostic, '6': Service Mode, '7': BMS Override}
  ventilation_preset: {'0': 'Off', '1': Low, '2': Medium, '3': High, '4': Boost, '255': Max}

flags:
  faults: {'0': 'F-1: Supply air thermistor', '1': 'F-2: Extract air thermistor', '2': 'F-3: Supply fan', '3': 'F-4: Extract fan', '7': 'F-8: Supply air too cold', '31': 'F-32: HMI communication lost'}
  warnings: {'0': 'W-1: Supply air temperature', '1': 'W-2: Exhaust air temperature', '2': 'W-3: Preheated air temperature', '3': 'W-4: Intake air humidity', '4': 'W-5: Extract air humidity', '5': 'W-6: Supply air flow', '6': 'W-7: Extract air flow', '7': 'W-8: Left filter sensor', '8': 'W-9: Right filter sensor', '9': 'W-10: System overpressure', '10': 'W-11: Preheater activated', '11': 'W-12: Filter cleaning or replacement overdue', '12': 'W-13: Service interval overdue', '13': 'W-14: Lost connection to sensors or controllers', '14': 'W-15: BMS offline', '17': 'W-18: Bypass or heat exchanger efficiency', '18': 'W-19: Preheater IO offline', '19': 'W-20: Cooling unit offline'}
  notifications: {'0': 'N-1: Filter cleaning or replacement due soon', '1': 'N-2: Service due soon', '2': 'N-3: Device offline', '3': 'N-4: Cooling suspended', '4': 'N-5: Cooling insufficient'}

notes:
- Modbus RTU on the unit's BMS connector, unit id 2, 115200 baud 8N1 (settings in the Vent-Axia Connect app, Advanced Settings,
  Modbus); the project reaches it through an RS485-to-TCP gateway.
- The project names the ComAir HRUC-Plus 3 (250, 350), Vent-Axia Sentinel Kinetic Advance (250S/SX, 350S/SX), Sentinel Econiq
  SC and Sentinel Kinetic Apex (Gen V), which share this register map.
- Measurements the unit does not have read 0x8000. Zones that are not configured read 0x8000 for both temperature and humidity.
- 'The project writes 0 to holding register 19 (40020) on every poll: without it the unit raises warning W-15 (BMS offline)
  after an override has been written.'
- Holding registers 0-9 (40001-40010) are BMS virtual inputs that feed a remote temperature, humidity or CO2 value into the
  unit; which kind each one is gets set in the unit's own BMS setup.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
