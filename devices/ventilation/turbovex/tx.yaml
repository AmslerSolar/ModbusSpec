# Written from the Turbovex TX Modbus configuration guide (Modbus Manual 2019.03).

modbusspec: 0
id: turbovex-tx
manufacturer: Turbovex
name: TX ventilation units (ES880 controller with Modbus expansion board)
kind: ventilation

sources:
- title: Turbovex TX Modbus configuration guide (Modbus Manual)
  version: '2019.03'
  url: https://www.turbovex.cz/fileadmin/Dokumenty/Modbus_Manual__2019.03_.pdf
  sha256: 39274f509f77a5c77a2f7e839dedeb8cd96795b69c22a350ea941918ae44eb90
  archive_url: https://web.archive.org/web/20250124135803/https://www.turbovex.cz/fileadmin/Dokumenty/Modbus_Manual__2019.03_.pdf

connection:
  default_port: 502
  default_unit: 55
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

points:
  # Input registers (function 04)
  - {key: x.outdoor_inlet_temperature, label: T1 Inlet outdoor temperature, table: input, address: 0, type: u16, unit: °C, scale: 0.1, offset: -30, note: 'Raw 0 = −30.0 °C, 300 = 0.0 °C, 1000 = 70.0 °C.'}
  - {key: x.supply_temperature, label: T2 Inlet room temperature, table: input, address: 1, type: u16, unit: °C, scale: 0.1, offset: -30}
  - {key: x.extract_temperature, label: T3 Exhaust room temperature, table: input, address: 2, type: u16, unit: °C, scale: 0.1, offset: -30}
  - {key: x.exhaust_temperature, label: T4 Exhaust outdoor temperature, table: input, address: 3, type: u16, unit: °C, scale: 0.1, offset: -30}
  - {key: x.co2_external, label: CO2 external input, table: input, address: 4, type: u16, unit: ppm, invalid: [9999], note: '0 … 2000 ppm. Listed as R/W, to be written with function 6; 9999 disables the external input. Which table function 6 writes to here isn''t stated.'}
  - {key: x.co2, label: CO2 internal output, table: input, address: 5, type: u16, unit: ppm}
  - {key: x.supply_fan_speed, label: 'Fan, Inlet speed', table: input, address: 6, type: u16, unit: '%'}
  - {key: x.exhaust_fan_speed, label: 'Fan, Exhaust speed', table: input, address: 7, type: u16, unit: '%'}
  - {key: x.heat_level, label: Heat level, table: input, address: 8, type: u16, unit: '%'}
  - {key: x.bypass_position, label: Bypass damper position, table: input, address: 9, type: u16, unit: '%'}
  - {key: state, label: Current unit status, table: input, address: 10, type: u16, enum: unit_status}
  - {key: x.alarm_bits, label: Current alarm bits, table: input, address: 11, type: u16, flags: alarm_bits}
  - {key: x.current_setpoint, label: Current set point, table: input, address: 12, type: u16, unit: °C, verified: false, note: 8 … 33 °C; a scale is not stated (1 assumed).}
  - {key: firmware, label: 'Program version, controller', table: input, address: 13, type: u16, scale: 0.1, poll: slow}
  - {key: x.display_version, label: 'Program version, display', table: input, address: 14, type: u16, scale: 0.1, poll: slow}
  - {key: x.modbus_controller_version, label: 'Program version, Modbus controller', table: input, address: 15, type: u16, scale: 0.1, poll: slow}
  - {key: x.modbus_library_version, label: 'Version, Modbus library', table: input, address: 16, type: u16, scale: 0.1, poll: slow}
  # Holding registers (function 03, written with function 06)
  - {key: x.temp_setpoint_day, label: 'A1 Temp setpoint, day mode', table: holding, address: 0, type: u16, unit: °C, writable: true, poll: slow, verified: false, note: Scale not stated (1 assumed).}
  - {key: x.temp_setpoint_night, label: 'A2 Temp setpoint, night mode', table: holding, address: 1, type: u16, unit: °C, writable: true, poll: slow, verified: false, note: Scale not stated (1 assumed).}
  - {key: x.night_cool_frost_protection, label: C25 Night cool frost protection, table: holding, address: 14, type: u16, unit: °C, writable: true, poll: slow, verified: false, note: Scale not stated (1 assumed).}
  - {key: x.night_cool_hysteresis, label: C26 Night cool room temperature hysteresis, table: holding, address: 15, type: u16, unit: °C, writable: true, poll: slow, verified: false, note: Scale not stated (1 assumed).}
  - {key: x.night_cool_start, label: C27 Night cool start time, table: holding, address: 16, type: u16, writable: true, poll: slow, note: The time format is not stated.}
  - {key: x.night_cool_stop, label: C28 Night cool stop time, table: holding, address: 17, type: u16, writable: true, poll: slow, note: The time format is not stated.}
  - {key: x.force_time, label: C1 Force time, table: holding, address: 18, type: u16, unit: min, writable: true, min: 0, max: 250, poll: slow}
  - {key: x.extend_time, label: C2 Extend time, table: holding, address: 19, type: u16, unit: min, writable: true, min: 0, max: 250, poll: slow}
  - {key: x.pir_time, label: C3 PIR time, table: holding, address: 20, type: u16, unit: min, writable: true, min: 0, max: 250, poll: slow}
  - {key: x.bypass_on, label: C4 Bypass on, table: holding, address: 21, type: u16, enum: off_on, writable: true, poll: slow}
  - {key: x.co2_regulation, label: C12 CO2 reg ON, table: holding, address: 29, type: u16, enum: co2_regulation, writable: true, poll: slow}
  - {key: x.co2_setpoint_day, label: 'C13 CO2 setpoint, day mode', table: holding, address: 30, type: u16, unit: ppm, writable: true, poll: slow}
  - {key: x.co2_setpoint_night, label: 'C14 CO2 setpoint, night mode', table: holding, address: 31, type: u16, unit: ppm, writable: true, poll: slow}
  - {key: x.night_cool_on, label: C21 Night cool ON, table: holding, address: 38, type: u16, enum: off_on, writable: true, poll: slow, verified: false, note: 'Values not stated; 0 = off, 1 = on assumed like C4.'}
  - {key: x.night_cool_supply_speed, label: C22 Night cool fixed speed inlet, table: holding, address: 39, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.night_cool_exhaust_speed, label: C23 Night cool fixed speed outlet, table: holding, address: 40, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.night_cool_boost_time, label: C24 Night cool boost time, table: holding, address: 41, type: u16, unit: min, writable: true, poll: slow}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 59, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.baud_rate, label: Modbus baud rate, table: holding, address: 60, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: Modbus parity, table: holding, address: 61, type: u16, enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits, label: Modbus stop bits, table: holding, address: 62, type: u16, writable: true, min: 1, max: 2, poll: slow, note: 'With parity none, 2 stop bits must be set.'}
  - {key: x.scheduler_mode, label: Scheduler mode, table: holding, address: 115, type: u16, enum: scheduler_mode, writable: true, note: Writing a value below 9 overrides the calendar; 9 hands control back to it.}

enums:
  unit_status: {'0': Standby, '1': Day mode, '2': Night mode}
  off_on: {'0': 'Off', '1': 'On'}
  co2_regulation: {'0': 'Off', '1': With stop, '2': Without stop}
  baud_rate: {'1': '19200', '2': '9600'}
  parity: {'1': Even, '2': Odd, '3': None}
  scheduler_mode: {'0': Standby, '1': Day mode, '2': Night mode, '3': PIR mode, '9': Input disabled (calendar)}

flags:
  alarm_bits: {'0': Normal, '1': Fire, '2': Filter}

problems:
  - {when: {key: x.alarm_bits, bit: 1}, kind: fault, text: Fire alarm (bit 1)}
  - {when: {key: x.alarm_bits, bit: 2}, kind: warning, text: Filter alarm (bit 2)}

notes:
- Addresses are the document's register numbers without the 3x / 4x prefix (3x0000 = input register 0, 4x0059 = holding register
  59); the numbering starts at 0, so they are used as 0-based protocol addresses.
- Needs the Modbus expansion board on the unit's master board; a unit using the master/slave function can't have it (one expansion
  slot). The unit address is set on the display (D18), and D5 = 1 enables the board; restart the unit afterwards.
- 'RTU, 9600 or 19200 baud (default 19200), even / odd / no parity (default even), 1 or 2 stop bits (default 1); default address
  55. Supported functions: 3, 4, 6, 8, 17.'
- The document lists the night cooling registers C21–C28 twice; they are taken once. Temperature setpoints and the current
  set point give no scale; 1 is assumed.
- There is no serial number or model register, so the file has no identify.
