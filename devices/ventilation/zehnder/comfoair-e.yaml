modbusspec: 0
id: zehnder-comfoair-e
manufacturer: Zehnder
name: ComfoAir E300 / E400
kind: ventilation

sources:
- id: comfoair
  title: comfoair (Home Assistant integration)
  url: https://github.com/remmob/comfoair
  license: MIT
  commit: af83628ea6d6a44ca4a4146c2c9990d568de0b2a
  path: custom_components/comfoair/const.py, custom_components/comfoair/device.py, custom_components/comfoair/hub.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8E1

defaults:
  verified: false
  sources:
  - comfoair

models:
  - {id: e300_p, name: E300 P, match: {table: holding, address: 112, type: u16, equals: 0}}
  - {id: e300_rf, name: E300 RF, match: {table: holding, address: 112, type: u16, equals: 2}}
  - {id: e400_rf, name: E400 RF, match: {table: holding, address: 112, type: u16, equals: 3}}

