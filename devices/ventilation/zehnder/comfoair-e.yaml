  - {key: x.pre_heater_present, label: Pre-heater present, table: holding, address: 338, type: u16, enum: on_off}
  - {key: x.heat_exchanger_type, label: Heat exchanger type, table: holding, address: 344, type: u16, enum: heat_exchanger_type}
  - {key: x.comfort_humidity_control, label: Comfort humidity control, table: holding, address: 345, type: u16, enum: comfort_humidity_control}
  - {key: x.alarms_400, label: Alarm bits 400, table: holding, address: 400, type: u16, flags: alarms_400}
  - {key: x.alarms_402, label: Alarm bits 402, table: holding, address: 402, type: u16, flags: alarms_402}

enums:
  device_status: {'0': Error, '1': Initializing, '2': Self Test, '3': Waiting, '10': Normal, '20': Standby, '42': Maintenance}
  language: {'0': NL, '1': DE, '2': FR, '3': EN}
  orientation: {'0': Right, '1': Left}
  model: {'0': E300 P, '2': E300 RF, '3': E400 RF}
  on_off: {'0': 'OFF', '1': 'ON'}
  bypass_motor_active: {'0': Reset bypass position, '1': End position reached, '2': Active}
  heat_exchanger_type: {'0': HRV, '1': ERV}
  comfort_humidity_control: {'0': Disabled, '1': Enabled}

flags:
  alarms_400: {'0': T20 temperature sensor, '1': T21 temperature sensor, '2': T22 temperature sensor, '3': T11 temperature sensor, '4': T12 temperature sensor, '5': RH20 humidity sensor, '6': RH22 humidity sensor, '7': RH11 humidity sensor, '8': RH12 humidity sensor, '9': dp12 pressure sensor, '10': dp22 pressure sensor, '11': exhaust fan speed sensor, '12': supply fan speed sensor, '13': filter warning, '14': filter error}
  alarms_402: {'0': preheater overheat, '1': preheater location, '2': preheater error, '3': bypass motor extract, '4': bypass motor outdoor, '5': frost protection warning}

notes:
- comfoair connects over Modbus TCP (port 502) or RTU at 19200 baud 8E1; unit id 1 is the only one it allows.
- All values are holding registers. Settings and identity (105, 110-113, 115-130) are read once; the rest every few seconds.
- 'Register 110 is the firmware version as a decimal number: 20800 means 2.8.0 (major × 10000 + minor × 100 + patch). Register
  113 packs the bootloader version as major × 100 + minor; the integration also shows the minor part as the hardware version.'
- 'Serial number (115-130): the integration skips characters outside the printable range.'
- Registers 316/317 and 328 (0-10 V input), 317/329 (RF) and 318/330 (3-way switch) belong to the three control types; the
  speed settings 328-330 read 0 = low, 50 = medium, 100 = high, and 331 reads 0 = off, 100 = on.
- 'Alarm words 400 and 402: the filter warning (400 bit 13) and frost protection warning (402 bit 5) are treated as warnings,
  every other bit as a fault.'
- comfoair only reads; it writes nothing to the unit.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
