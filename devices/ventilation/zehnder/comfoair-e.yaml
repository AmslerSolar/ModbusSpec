  - {key: x.language, label: Language, table: holding, address: 105, type: u16, enum: language}
  - {key: x.firmware_version, label: Firmware version, table: holding, address: 110, type: u16}
  - {key: x.orientation, label: Orientation, table: holding, address: 111, type: u16, enum: orientation}
  - {key: x.model, label: Model, table: holding, address: 112, type: u16, enum: model}
  - {key: x.bootloader_version, label: Bootloader version, table: holding, address: 113, type: u16}
