connection:
  default_port: 502
  default_unit: 60
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # "zero parameter", always 0
  - table: input
    address: 78
    type: u16
    equals: 0
  # clock year
  - table: input
    address: 176
    type: u16
    range:
    - 2000
    - 2099
  # clock month
  - table: input
    address: 177
    type: u16
    range:
    - 1
    - 12

