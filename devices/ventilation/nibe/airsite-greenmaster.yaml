notes:
- 'The document numbers registers 1-based with the table as leading digit (0x coils, 1x discrete inputs, 3x input registers,
  4x holding registers): 300008 is input register 7 here, 100033 discrete input 32, 432772 holding register 32771.'
- 'Every register is a 16-bit integer. The document gives value ranges but no scaling: values shown with one decimal (temperatures,
  -55.0–125.0 °C) are taken as tenths and signed (assumed, not stated). Outputs run 0–4096 for 0–100 %.'
- Default Modbus ID (unit) 60. Supported functions 01–06, 08, 15, 16. Port 502 isn't stated; assumed.
- 'Which model (GMA or GMXXL) a unit is can''t be read from the registers; points marked GMXXL only exist there. Identification
  is weak: it relies on the always-zero register 300079 and a plausible clock (300177 / 300178).'
- Several outputs (fans, valves, heat exchanger, pumps, dampers) can be switched to manual through coils and then written
  through the matching holding registers; those are left out.
- v27 (firmware T03-5) adds the DO4–DO7 and DI1–DI9 mirror bits, the fire alarm sources (DI2, AI3–AI6, internal), the analogue
  smoke detector service bits, the bypass damper exercise alarm, 300008, 300701 / 300702 and 300762; on units with v26 firmware
  they may not answer.
- 'Left out: the manual-operation and per-alarm reset coils, the SC2 / SIOX damper and smoke-detector module status bits (106177
  ff.), regulator tuning (P-band, I-time), alarm delays, setpoint offset curves, time channel schedules and clock setting
  registers (400177–400184).'
