problems:
  - {when: {key: state, equals: 16}, kind: fault, text: Unit stopped by an alarm (control state 16)}
  - {when: {key: x.alarm_active, equals: 1}, kind: warning, text: Alarm active (alarm 1 code in input register 401)}

notes:
- Addresses are the register numbers of the document, which it gives without the 30001 / 40001 offset; they are used as 0-based
  protocol addresses as they are.
- The document also lets function 03 read every input register at its address + 10000 (read-only).
- Modbus RTU only (RS485 on connector CN7, no opto-isolation), 19200 baud 8E1 fixed; only the node address (default 30, 1
  … 247) can be changed. Port 502 applies only to a Modbus TCP gateway.
- Packets are limited to 255 bytes; max_registers 125 is derived from that (not stated as a register count).
- 'Not stated in the document; assumed: temperatures and setpoints in °C × 100 are signed 16-bit values.'
- The document lists which register groups each unit family (VPM, VPL, VP, VGU, COMFORT) has, but gives no machine type table;
  registers a unit lacks may read 0.
- 'Left out: the remaining output relays (100–127), week program, data log, display/HMI setup registers (3004–3075, 4000–4112),
  defrost and air-quality tuning parameters, the second user function (610–615, same layout as 600–605).'
- The machine type (holding register control_type) selects the model; the integration only accepts the types listed as models.
  The Modbus bus version (input register 0) decides which values it reads.
- 'On machine type 44 (CompactP) the integration reads the minor software version (input register 2, two ASCII characters):
  "1" means a CompactP AIR, "2" a CompactP GEO, which use the HPS registers (19xx) for the heat pump. That distinction isn''t
  expressed as a model here.'
- Values are plain 16-bit registers; the integration decodes them big-endian and, where noted, divides them (temperatures
  mostly by 100, HPS temperatures by 10).
- Register names without a reader in the integration are not imported.
- 'Upstream oddities: set_time_between_defrost writes the maximum compressor defrost time register, set_user_function_2_temperature
  writes user function 1''s temperature register, and set_supply_heating_pid_time writes the high-humidity ventilation time
  register; set_low_room_temp_ventilation_level writes a level 0–4 into the low room temperature setpoint register.'
- 'Skipped because the integration reads a register name that registers.py doesn''t define: get_hps_t22_shw_bottom_temperature
  (hps_input_t22_shw_bottom).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
