notes:
- 'Addresses are the register numbers of the document, used as 0-based protocol addresses: the document says a client reading
  -1 at 20003 (constant 0) must add 1 to every number, so the numbers as listed are right when 20003 reads 0.'
- 'Not stated in the document; assumed (hence every point unverified): holding registers (it lists function codes 3, 4, 6
  and 16 but names no table), signed 16-bit temperatures in whole °C (no scale is given; some setting ranges such as 1.0 …
  5.0 °C hint at a finer resolution), percentages and counts as plain unsigned values.'
- Modbus over TCP/IP to the board's IP address (default 192.168.5.107), port 502; the document calls it Modbus RTU over TCP/IP,
  so a client may need RTU framing over TCP instead of Modbus TCP (unverified).
- 'A system has up to 3 boards: the Compact P answers on unit 1, an attached GEO or AIR9 heat pump board on unit 4. Points
  with unit_id 4 are only there with such a board (optional). Alarm list registers 22500 ff. are listed for units 1 and 4;
  they are read on unit 1 here.'
- 'Event registers 22500 ff.: 0 = event not present, 1 = present.'
- Settings marked as applied after a restart (Smart Grid) need a restart (write 57005 to 20000) or a flash save (48815 to
  20004).
- 'Left out: most configuration parameters (humidity, cooling, CO2, frost protection, de-icing, legionella, compressor, weather
