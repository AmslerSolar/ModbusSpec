  - {key: x.t6_evaporator_sensor_state, label: T6 evaporator temperature State, table: holding, address: 20293, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t7_supply_after_heater_temperature, label: T7 supply air temperature after-heater (C), table: holding, address: 20294, type: s16, unit: °C}
  - {key: x.t7_supply_after_heater_sensor_state, label: T7 supply air temperature after-heater State, table: holding, address: 20295, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t8_outdoor_before_preheater_temperature, label: T8 outdoor air before pre-heater (C), table: holding, address: 20296, type: s16, unit: °C}
  - {key: x.t8_outdoor_before_preheater_sensor_state, label: T8 outdoor air before pre-heater State, table: holding, address: 20297, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t9_water_after_heater_temperature, label: T9 temperature in water after heater (C), table: holding, address: 20298, type: s16, unit: °C}
