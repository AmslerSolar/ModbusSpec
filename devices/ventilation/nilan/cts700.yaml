# Written from the Nilan CTS700 Modbus User Guide (30030066, revision 3, 2018-04-20).

modbusspec: 0
id: nilan-cts700
manufacturer: Nilan
name: CTS700 controller (Compact P, with GEO / AIR9 heat pump)
kind: ventilation

sources:
- title: NILAN - CTS700 Modbus User Guide (30030066)
  version: 3 (2018-04-20)
  url: https://github.com/Hywan/LaMaisonVivante/blob/f8ce2f79e431ca0fadec221cb076348ff4ee50c5/dhw-ventilation/nilan/doc/CTS700_Modbus.pdf
  sha256: ff394308be19ab889dc486879a34eff03bd8e7019247450a7d493a3e7f911856

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 20002
    type: u16
    equals: 65535
  - table: holding
    address: 20003
    type: u16
    equals: 0
  - table: holding
    address: 21680
    type: u16
    in:
    - 0
    - 1

defaults:
  verified: false

models:
  - {id: compact_p, name: Compact P, match: {table: holding, address: 21680, type: u16, equals: 0}}
  - {id: compact_p_polar, name: Compact P Polar, match: {table: holding, address: 21680, type: u16, equals: 1}}

points:
  # Control and identity
  - {key: x.addressing_check_ffff, label: PLC clarification of addressing (20002), table: holding, address: 20002, type: u16, poll: slow, note: Constant -1 (65535).}
  - {key: x.addressing_check_zero, label: PLC clarification of addressing (20003), table: holding, address: 20003, type: u16, poll: slow, note: Constant 0; reading -1 here means the client's numbering is one off (add 1 to every address).}
  - {key: x.product_type, label: Product type, table: holding, address: 21680, type: u16, enum: product_type, poll: slow}
  - {key: x.geo_product_type, label: Product type (GEO board), table: holding, address: 21839, type: u16, unit_id: 4, optional: true, poll: slow, note: 8 = GEO.}
  - {key: x.air_product_type, label: Product type (AIR9 board), table: holding, address: 21899, type: u16, unit_id: 4, optional: true, poll: slow, note: 9 = AIR.}
  # Compact P live data
  - {key: state, label: System state, table: holding, address: 21770, type: u16, enum: system_state}
  - {key: x.supply_fan_speed, label: Supply fan speed, table: holding, address: 21771, type: u16, unit: '%'}
  - {key: x.extract_fan_speed, label: Extract fan speed, table: holding, address: 21772, type: u16, unit: '%'}
  - {key: x.bypass_damper, label: Bypass damper, table: holding, address: 21773, type: u16, enum: closed_open}
  - {key: x.after_heating_element, label: After heating element, table: holding, address: 21774, type: u16, unit: '%'}
  - {key: x.compressor_state, label: Compressor state, table: holding, address: 21775, type: u16, enum: compressor_state}
  - {key: x.humidity, label: Actual air humidity, table: holding, address: 21776, type: u16, unit: '%'}
  - {key: x.co2, label: CO2 level, table: holding, address: 21778, type: u16, unit: ppm}
  - {key: x.fire_alarm, label: Fire alarm, table: holding, address: 21779, type: u16, enum: fire_alarm}
  - {key: x.user_programme_1, label: User programme 1, table: holding, address: 21780, type: u16, enum: on_off}
  - {key: x.user_programme_2, label: User programme 2, table: holding, address: 21781, type: u16, enum: on_off}
  - {key: x.anti_legionella_active, label: Anti legionella, table: holding, address: 21785, type: u16, enum: on_off}
  - {key: x.heat_pump_high_pressure_alarm, label: Heat pump high pressure alarm, table: holding, address: 21786, type: u16, note: The document gives no values.}
  - {key: x.anode_state, label: Warm water sacrificial anode, table: holding, address: 21787, type: u16, enum: anode_state}
  - {key: x.hot_water_electric_heater, label: Warm water electric supply, table: holding, address: 21788, type: u16, enum: on_off}
  - {key: x.exchanger_deicing, label: De-icing heat exchanger, table: holding, address: 21789, type: u16, note: The document gives no values.}
  - {key: x.heat_pump_deicing, label: De-icing heat pump, table: holding, address: 21790, type: u16, note: The document gives no values.}
  - {key: x.alarm_state, label: Alarm, table: holding, address: 21792, type: u16, enum: alarm_state}
  # Temperatures and sensor states
  - {key: x.text_room_temperature, label: Text room temperature (C), table: holding, address: 20280, type: s16, unit: °C}
  - {key: x.text_room_sensor_state, label: Text room temperature State, table: holding, address: 20281, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t1_outdoor_temperature, label: T1 outdoor air temperature (C), table: holding, address: 20282, type: s16, unit: °C}
  - {key: x.t1_outdoor_sensor_state, label: T1 outdoor air temperature State, table: holding, address: 20283, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t2_supply_temperature, label: T2 supply air temperature (C), table: holding, address: 20284, type: s16, unit: °C}
  - {key: x.t2_supply_sensor_state, label: T2 supply air temperature State, table: holding, address: 20285, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t3_extract_temperature, label: 'T3 extract air, room temperature (C)', table: holding, address: 20286, type: s16, unit: °C}
  - {key: x.t3_extract_sensor_state, label: 'T3 extract air, room temperature State', table: holding, address: 20287, type: u16, enum: sensor_state, poll: slow}
  - {key: x.t4_discharge_temperature, label: 'T4 discharge air, after heat exchanger (C)', table: holding, address: 20288, type: s16, unit: °C}
  - {key: x.t4_discharge_sensor_state, label: 'T4 discharge air, after heat exchanger State', table: holding, address: 20289, type: u16, enum: sensor_state, poll: slow}
