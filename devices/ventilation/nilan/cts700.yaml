  closed_open: {'0': Closed, '1': Open}
  product_type: {'0': Compact P, '1': Compact P Polar}
  system_state: {'0': Auto, '1': Cooling, '2': Heating}
  compressor_state: {'0': 'Off', '100': 'On'}
  fire_alarm: {'0': Activated, '1': Not activated}
  alarm_state: {'0': Active, '1': Not active}
  anode_state: {'1': OK, '3': Failure}
  failure_ok: {'0': Failure, '1': OK}
  sensor_state: {'0': OK, '1': Fault, '2': Missing, '3': Missing}
  language: {'0': English, '32': Danish, '33': German, '44': Finnish, '47': French, '72': Italian, '117': Norwegian, '128': Polish}

problems:
