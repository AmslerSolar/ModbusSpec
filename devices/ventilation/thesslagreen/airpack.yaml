enums:
  mode: {'0': Automatyczny, '1': Manualny, '2': Chwilowy}
  season_mode: {'0': Lato, '1': Zima}
  special_mode: {'0': Brak, '1': OKAP, '2': KOMINEK, '3': WIETRZENIE (przełącznik dzwonkowy), '4': WIETRZENIE (ON/OFF), '5': H2O/WIETRZENIE (higrostat), '6': JP/WIETRZENIE (czujnik jakości powietrza), '7': WIETRZENIE (ręczne), '8': WIETRZENIE (harmonogram AUTO), '9': WIETRZENIE (harmonogram MANUAL), '10': OTWARTE OKNA, '11': PUSTY DOM}
  comfort_mode_panel: {'0': EKO, '1': KOMFORT}
  bypass_mode: {'0': Nieaktywny, '1': Grzanie (freeheating), '2': Chłodzenie (freecooling)}
  bypass_user_mode: {'1': Tryb 1, '2': Tryb 2, '3': Tryb 3}
  gwc_mode: {'0': Nieaktywny, '1': Tryb zima, '2': Tryb lato}
  gwc_regen: {'0': Brak, '1': Dobowa, '2': Temperaturowa}
  antifreeze_stage: {'0': 'OFF', '1': FPX1, '2': FPX2}
  comfort_mode_status: {'0': Nieaktywny, '1': Grzanie, '2': Chłodzenie}
  filter_change: {'1': Presostat, '2': Filtry płaskie, '3': Filtry CleanPad, '4': Filtry CleanPad Pure}

notes:
- Covers the AirPack Home h/v/f Energy and Energy+ units over Modbus RTU; labels are the project's Polish names.
- Read at most 16 registers per request. The S-alarm range 0x2002…0x2020 has gaps; a read across a gap is answered with exception
  04, so read each S alarm on its own.
- 'Not imported: the weekly schedules (summer 0x0010…, winter 0x002C…, BCD [HHMM] start times; settings at 0x0048 / 0x0064
  with intensity % in the high byte and supply temperature × 2 in the low byte; airing start hours at 0x0080 / 0x009C, 0x2400
  = off).'
- Writing 1 to on_off switches the unit on, 0 off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
