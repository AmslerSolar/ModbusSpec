modbusspec: 0
id: thesslagreen-airpack
manufacturer: Thesslagreen
name: AirPack Home (Energy / Energy+)
kind: ventilation

sources:
- id: thesslagreen-airpack-usb
  title: ha_thesslagreen_airpack_usb (Home Assistant integration)
  url: https://github.com/arypien/ha_thesslagreen_airpack_usb
  license: MIT
  commit: 87a61225cbc7e72c484225f6d6be5f3e7ac44010
  path: custom_components/airpack_home/const.py, custom_components/airpack_home/modbus_client.py

connection:
  default_port: 502
  default_unit: 10
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 16

defaults:
  verified: false
  sources:
  - thesslagreen-airpack-usb

