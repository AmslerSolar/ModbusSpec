  operating_mode: {'0': 'off', '1': manual, '2': auto_time, '3': auto_sensor, '4': eco_supply_air, '5': eco_exhaust_air}
  season: {'0': winter, '1': summer}
  vent_level: {'0': 'off', '1': humidity_protection, '2': reduced, '3': nominal, '4': intensive}
  pump_state: {'0': 'off', '1': heating, '2': cooling}
  zone_damper: {'0': 'off', '1': zone_1, '2': zone_2, '3': zone_sensor}

