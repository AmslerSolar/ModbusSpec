modbusspec: 0
id: maico-kwl
manufacturer: Maico
name: KWL heat recovery ventilation units
kind: ventilation

sources:
- id: maico-kwl
  title: hass-maico-kwl (Home Assistant integration)
  url: https://github.com/mkshb/hass-maico-kwl
  license: MIT
  commit: 6ebdc93300fc1926d355461b1616dc6e40178268
  path: custom_components/maico_kwl/register_defs.py, docs/modbus.md

connection:
  default_port: 502
  default_unit: 10
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8E1

encoding:
