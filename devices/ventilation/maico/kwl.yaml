  fault_bits: {'0': supply_fan, '1': exhaust_fan, '2': sensor_air_intake, '3': sensor_supply, '4': sensor_exhaust, '5': sensor_room_bde, '6': sensor_room, '7': sensor_outdoor_before_ehx, '8': bypass, '9': zone_damper, '10': combi_sensor, '11': frost_protection, '12': external_preheater, '13': supply_exhaust_too_cold, '14': sensor_room_bus, '15': communication_zp1, '16': communication_zp2, '17': sensor_extract, '18': communication_bde, '19': system_memory, '20': system_bus, '21': unknown_fault, '22': external_safety_shutdown}
  notice_bits: {'0': brine_ehx_low_cooling, '1': communication_enocean, '2': communication_knx, '3': communication_air_at_home, '4': bypass_active, '5': zone_ventilation_active, '6': frost_protection_active, '7': frost_protection_airflow_reduced, '8': keypad_locked, '9': device_filter_dirty, '10': outdoor_filter_dirty, '11': room_filter_dirty, '12': airflow_calibration_active, '13': humidity_protection_active, '14': reheating_active, '16': door_contact_triggered, '17': external_safety_shutdown, '18': forced_ventilation_active, '19': communication_modbus, '20': switch_test_active, '21': filter_pressure_init_active, '22': pressure_setpoint_not_reached, '23': external_start_stop_active, '24': night_cooling_active, '25': purge_active, '26': motion_detector_active, '27': external_control_active, '28': airflow_balancing_active, '29': holiday_program_active, '30': sensor_mode_active}

notes:
- All values are holding registers (read FC 03, written FC 06 or FC 16). The unit's default Modbus address is 10; the Maico
  list gives RTU at 9600 baud 8E1 and TCP from firmware 1.1.1 on. hass-maico-kwl uses TCP only.
- hass-maico-kwl sets the clock (100-105) in one FC 16 write.
- There is no model or serial number register. Accessories (outdoor and room filters, wired and EnOcean sensors, ZP1 module,
  PTC heater) are optional; their registers answer on every unit.
- The fault (401/402) and notice (403/404) words are read as one 32-bit value, high word first. Their bit meanings come from
  Maico's GVX list, which hass-maico-kwl applies to the KWL.
- 'Registers 405, 707, 763 and 764 are write-only: 405 resets errors; 707 (room temperature, 0.1 °C), 763 (humidity %) and
  764 (air quality ppm) feed bus values, used only with the matching bus source selected.'
- 'Where hass-maico-kwl deviates from the Maico list after checks on a unit, its reading is used: 301 and the humidity values
  750-754 and 358-365 are whole units, not tenths.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
