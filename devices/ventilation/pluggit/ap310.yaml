modbusspec: 0
id: pluggit-ap310
manufacturer: Pluggit
name: AP310 ventilation unit
kind: ventilation

sources:
- id: smarthomeng
  title: SmartHomeNG plugins
  url: https://github.com/smarthomeNG/plugins
  license: GPL-3.0-or-later
  commit: 0176a8684934aab9a52f905cdea80f8410200c2f
  path: pluggit/__init__.py, pluggit/plugin.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  byte_order: big
  word_order: little

defaults:
  verified: false
  sources:
  - smarthomeng

points:
  - {key: x.systemid, label: SystemComponents, table: holding, address: 2, type: u16, flags: system_id, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.systemserialnum, label: SystemSerialNum, table: holding, address: 4, type: u64}
  - {key: x.systemname, label: SystemName, table: holding, address: 8, type: str, length: 16, byte_order: little, writable: true}
  - {key: x.fwversion, label: FirmwareVersion, table: holding, address: 24, type: u16, note: Version high byte . low byte.}
  - {key: x.dhcpen, label: DHCPEnabled, table: holding, address: 26, type: u16, note: '0 = no, 1 = yes.'}
  - {key: x.currentipaddress, label: IPAdress, table: holding, address: 28, type: u32, note: 'IPv4 address, most significant byte first in the 32-bit value.'}
  - {key: x.currentipmask, label: IPMask, table: holding, address: 32, type: u32, note: 'IPv4 address, most significant byte first in the 32-bit value.'}
  - {key: x.currentipgateway, label: IPGateway, table: holding, address: 36, type: u32, note: 'IPv4 address, most significant byte first in the 32-bit value.'}
  - {key: x.macaddr, label: MACAdress, table: holding, address: 40, type: u64, word_order: big, note: 'MAC address: bytes from register 0 (high, low), register 3 (high, low), register 2 (high, low); register 1 is not used.'}
  - {key: x.halleft, label: SwitchInBPosition, table: holding, address: 84, type: u16, note: '0 = no, 1 = yes.'}
  - {key: x.halright, label: SwitchInAPosition, table: holding, address: 86, type: u16, note: '0 = no, 1 = yes.'}
  - {key: x.haltaho1, label: Fan1rpm, table: holding, address: 100, type: f32, unit: rpm}
  - {key: x.haltaho2, label: Fan2rpm, table: holding, address: 102, type: f32, unit: rpm}
  - {key: x.datetime, label: SystemTime, table: holding, address: 108, type: u32, epoch: {start: '1970-01-01', unit: s}, note: The project reads it as UTC. The project writes this value to register 110.}
  - {key: x.ramidxt1, label: OutdoorTemperature, table: holding, address: 132, type: f32, unit: °C}
  - {key: x.ramidxt2, label: SupplyTemperature, table: holding, address: 134, type: f32, unit: °C}
  - {key: x.ramidxt3, label: ExtractTemperature, table: holding, address: 136, type: f32, unit: °C}
  - {key: x.ramidxt4, label: ExhaustTemperature, table: holding, address: 138, type: f32, unit: °C}
  - {key: x.ramidxt5, label: RoomTemperature, table: holding, address: 140, type: f32, unit: °C}
  - {key: x.preheaterdutycycle, label: PreheaterPower, table: holding, address: 160, type: u16}
  - {key: x.ramidxunitmode, label: CurrentUnitMode, table: holding, address: 168, type: u16, flags: unit_mode, writable: true, note: 'The project switches a mode on by writing its bit and off by writing the bit plus 0x8000 (Away, Night, Fireplace, Manual bypass, Summer).'}
  - {key: x.ramidxhac1firmwareversion, label: HACFirmwareVersion, table: holding, address: 192, type: u16, note: 'Version as BCD digits: d1.d2d3 from the upper three nibbles.'}
  - {key: x.ramidxrh3corrected, label: RH_Sensor.SensorValue, table: holding, address: 196, type: u16}
  - {key: x.ramidxbypassactualstate, label: Bypass, table: holding, address: 198, type: u16, enum: ramidxbypassactualstate}
  - {key: x.ramidxhac1components, label: HAC_Parts.IdxHac1Components, table: holding, address: 244, type: u16, flags: hac1_components}
  - {key: x.ramidxbypassmanualtimeout, label: Bypass.ManualTimeout, table: holding, address: 264, type: u16}
  - {key: x.romidxspeedlevel, label: FanSpeedLevel, table: holding, address: 324, type: u16, writable: true, note: Range 0…4.}
  - {key: x.romidxnightmodestarthour, label: CurrentUnitMode.NightMode.NightMode_StartHour, table: holding, address: 332, type: u16, writable: true, note: Range 0…23.}
  - {key: x.romidxnightmodestartmin, label: CurrentUnitMode.NightMode.NightMode_StartMin, table: holding, address: 334, type: u16, writable: true, note: Range 0…59.}
  - {key: x.romidxnightmodeendhour, label: CurrentUnitMode.NightMode.NightMode_EndHour, table: holding, address: 336, type: u16, writable: true, note: Range 0…23.}
  - {key: x.romidxnightmodeendmin, label: CurrentUnitMode.NightMode.NightMode_EndMin, table: holding, address: 338, type: u16, writable: true, note: Range 0…59.}
  - {key: x.romidxrhsetpoint, label: RH_Sensor.SetPoint, table: holding, address: 340, type: u16}
  - {key: x.romidxafterheatert2setpoint, label: HAC_Parts.SetpointT2, table: holding, address: 344, type: u16, writable: true, note: Range 0…30.}
  - {key: x.romidxafterheatert3setpoint, label: HAC_Parts.SetpointT3, table: holding, address: 346, type: u16, writable: true, note: Range 0…30.}
  - {key: x.romidxafterheatert5setpoint, label: HAC_Parts.SetpointT5, table: holding, address: 348, type: u16, writable: true, note: Range 0…30.}
  - {key: x.voc, label: VOC_Sensor.SensorValue, table: holding, address: 430, type: u16}
  - {key: x.bypasstmin, label: Bypass.Tmin, table: holding, address: 444, type: f32, unit: °C}
  - {key: x.bypasstmax, label: Bypass.Tmax, table: holding, address: 446, type: f32, unit: °C}
  - {key: x.numofweekprogram, label: WeekProgram, table: holding, address: 466, type: u16, note: The project writes this value to register 467.}
  - {key: x.currentblstate, label: BLState, table: holding, address: 472, type: u16, enum: currentblstate}
  - {key: x.setalarmnum, label: Alarm.ClearAlarm, table: holding, address: 514, type: u16, writable: true, note: Range 0…15.}
  - {key: x.lastactivealarm, label: Alarm, table: holding, address: 516, type: u16, enum: lastactivealarm, writable: true}
  - {key: x.refvalex, label: ReferenceExtractFanSpeed, table: holding, address: 518, type: u16}
  - {key: x.refvalsupl, label: ReferenceSupplyFanSpeed, table: holding, address: 520, type: u16}
  - {key: x.fireplacepreset, label: FireplacePresent, table: holding, address: 540, type: u16, note: '0 = no, 1 = yes.'}
  - {key: x.filterremainingtime, label: FilterRemainingLifetime, table: holding, address: 554, type: u16}
  - {key: x.filterdefaulttime, label: FilterDefaultTime, table: holding, address: 556, type: u16, writable: true, note: Range 0…360.}
  - {key: x.filterreset, label: FilterReset, table: holding, address: 558, type: u16, writable: true, note: '0 = no, 1 = yes. Range 0…1.'}
  - {key: x.ppm1unit, label: VOC_Sensor.LowTreshold, table: holding, address: 562, type: u16, writable: true, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.ppm2unit, label: VOC_Sensor.MiddleTreshold, table: holding, address: 564, type: u16, writable: true, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.ppm3unit, label: VOC_Sensor.HighTreshold, table: holding, address: 566, type: u16, writable: true, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.ppm1external, label: HAC_Parts.CO2_LowTreshold, table: holding, address: 568, type: u16, writable: true}
  - {key: x.ppm2external, label: HAC_Parts.CO2_MiddleTreshold, table: holding, address: 570, type: u16, writable: true}
  - {key: x.ppm3external, label: HAC_Parts.CO2_HighTreshold, table: holding, address: 572, type: u16, writable: true}
  - {key: x.hacco2val, label: HAC_Parts.CO2_Level, table: holding, address: 574, type: u16}
  - {key: x.systemidcomponents, label: HAC_Parts.SystemIDComponents, table: holding, address: 611, type: u16, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.worktime, label: WorkTime, table: holding, address: 624, type: u16, note: Two registers; the project reads only the first (low word) as U16.}
  - {key: x.startexploitationdatestamp, label: ExploitationDate, table: holding, address: 668, type: u32, epoch: {start: '1970-01-01', unit: s}, note: The project reads it as UTC.}

enums:
  currentblstate: {'0': Standby, '1': Manual, '2': Demand, '3': Week program, '4': Servo-flow, '5': Away, '6': Summer, '7': DI Override, '8': Hygrostat override, '9': Fireplace, '10': Installer, '11': Fail Safe 1, '12': Fail Safe 2, '13': Fail Off, '14': Defrost Off, '15': Defrost, '16': Night}
  lastactivealarm: {'0': No Alarm, '1': Exhaust FAN Alarm, '2': Supply FAN Alarm, '3': Bypass Alarm, '4': T1 Alarm, '5': T2 Alarm, '6': T3 Alarm, '7': T4 Alarm, '8': T5 Alarm, '9': RH Alarm, '10': Outdoor13 Alarm, '11': Supply5 Alarm, '12': Fire Alarm, '13': Communication Alarm, '14': FireTermostat Alarm, '15': High waterlevel Alarm}
  ramidxbypassactualstate: {'0': Closed, '1': In process, '32': Closing, '64': Opening, '255': Opened}

flags:
  system_id: {'0': FP1, '1': Week, '2': Bypass, '3': LRSwitch, '4': Internal preheater, '5': Servo flow, '6': RH sensor, '7': VOC sensor, '8': Ext Override, '9': HAC1, '10': HRC2, '11': PC Tool, '12': Apps, '13': ZeegBee, '14': DI1 Override, '15': DI2 Override}
  unit_mode: {'1': Demand Mode, '2': Manual Mode, '3': Week Program Mode, '4': Away Mode, '5': Night Mode, '6': Fireplace Mode, '7': Manual Bypass, '11': Summer Mode}
  hac1_components: {'0': CO2 Sensor, '2': PreHeater, '3': PreCooler, '4': AfterHeater, '5': AfterCooler, '6': Hygrostat}

notes:
- The project reads every value with function 03 and the client's default unit id; 32-bit values low word first. Addresses
  are the documented 4xxxx numbers minus 40001.
- Week programmes (6 registers per day from 626) are not decoded by the project.
- SmartHomeNG plugin pluggit.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
