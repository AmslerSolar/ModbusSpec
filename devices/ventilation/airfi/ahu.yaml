modbusspec: 0
id: airfi-ahu
manufacturer: Airfi
name: Air handling units (heat-recovery ventilation)
kind: ventilation

sources:
- id: airfi-homeassistant
  title: airfi-homeassistant (Home Assistant integration)
  url: https://github.com/airfioyab/airfi-homeassistant
  license: Apache-2.0
  commit: daaacf9ad370e761d2c1e5566a3194076019e12a
  path: custom_components/airfi/registers.py, custom_components/airfi/const.py, custom_components/airfi/modbus.py, custom_components/airfi/strings.json

connection:
  default_port: 502
  default_unit: 1
  transports:
