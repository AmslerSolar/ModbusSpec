enums:
  off_on: {'0': 'Off', '1': 'On'}
  home_away: {'0': Home, '1': Away}
  speed: {'0': 'Off', '1': Speed 1, '2': Speed 2, '3': Speed 3, '4': Speed 4, '5': Speed 5}
  force_control: {'0': 'Off', '1': Emergency stop, '2': Away}
  filter_change_interval: {'1': Once a year, '2': 2 times a year, '3': 3 times a year, '4': 4 times a year, '5': 5 times a year, '6': 6 times a year}
  bypass_mode: {'0': 'Off', '1': On (speeds 1–2), '2': On (speeds 1–5)}
  filter_guard_state: {'0': 'Off', '1': 'On', '2': On + calibrate}
  rh_sensor_mode: {'0': Switch mode, '1': Transmitter mode, '2': Disabled}
  boost_block: {'0': 'Off', '1': Humidity, '2': CO2, '3': Humidity and CO2, '4': All}

flags:
  error: {'0': Error E0, '1': Error E1, '2': Error E2, '3': Error E3, '4': Error E4, '5': Error E5, '6': Error E6, '7': Error E7, '8': Error E8}

notes:
- 'Register numbers are sent on the wire unchanged: register 1 is address 1, address 0 is rejected. The addresses here are
  those wire addresses.'
- A read touching a register the firmware does not know fails as a whole.
- Input register 3 holds the register-layout version; the project's tables follow version 360. Input 50 (CO2) needs version
  340 or later, inputs 51 and 52 (measured constant pressure) need 350 or later.
- The unit answers only its configured unit id (1-247, default 1) and 0.
- 'The unit type is not in a register: the units announce it, with IP, port and serial number, by UDP multicast to 239.255.100.200:3000.
  Types: 0 = Proto, 1 = Model 60 L, 2 = Model 60 R, 3 = Model 100 L, 4 = Model 100 R, 5 = Model 150 L, 6 = Model 150 R, 7
  = Model 130 L, 8 = Model 130 R, 9 = Model 250 L Electric, 10 = Model 250 R Electric, 11 = Model 250 L Water, 12 = Model
  250 R Water, 13 = Model 350 L Electric, 14 = Model 350 R Electric, 15 = Model 350 L Water, 16 = Model 350 R Water, 17 =
  Model C5 L Electric, 18 = Model C5 R Electric, 19 = Model C5 L Water, 20 = Model C5 R Water, 21 = Model 53 mini L, 22 =
  Model 53 mini R, 23 = Model 53 miniEnt L, 24 = Model 53 miniEnt R, 25 = Model 60 Ent L, 26 = Model 60 Ent R, 27 = Model
  130 Ent L, 28 = Model 130 Ent R, 29 = Model 150 Ent L, 30 = Model 150 Ent R, 31 = Model 250 EntL Electric, 32 = Model 250
  Ent R Electric, 33 = Model 250 Ent L Water, 34 = Model 250 Ent R Water, 35 = Model 350 Ent L Electric, 36 = Model 350 Ent
  R Electric, 37 = Model 350 Ent L Water, 38 = Model 350 Ent R Water, 39 = Model ReFit 10 L, 40 = Model ReFit 10 R.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
