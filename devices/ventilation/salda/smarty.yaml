enums:
  user_config_current_system_mode: {'0': Stand-by, '1': Building protection, '2': Economy, '3': Confort}
  alarm_a: {'0': no alarms, '1': alarm}
  alarm_b: {'0': no warnings, '1': warning}
  alarms_reset: {'0': nothing, '1': activate}
  current_system_state: {'0': Stand-by, '1': Building protection, '2': Economy, '3': Comfort, '4': Emergency run, '5': Preparing, '6': Opening dampers, '7': Boost, '8': Cooling heaters, '9': Closing dampers, '10': Night Cooling, '11': Critical alarm, '12': Fire alarm, '13': Heat exchanger frost protection, '14': Change filters, '15': Room RH 3 days average is lower than 30%. Limiting speed, '16': DX cooler defrosting, '17': Fire damper testing}
  current_system_mode: {'0': Stand-by, '1': Building protection, '2': Economy, '3': Comfort, '4': Boost}

notes:
- The library names its source as the Salda MCB 1.21 Modbus table and uses the addresses as protocol addresses (it sends them
  to pymodbus unchanged).
- Discrete inputs 1…67 are alarm and warning flags (1 = active); 188 and 189 summarise any critical alarm and any warning.
- 'Salda RIS/RIRS MCB from modbus_local_gateway (salda-mcb) lists a different map: its mode registers are one lower (holding
  0, input 14) and its temperatures sit at input 0/3/6/9 instead of 18/19/21. Which is right for which controller version
  is not known, so the two are kept apart.'
- Default unit 1 and Modbus TCP are the library's connection defaults.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
