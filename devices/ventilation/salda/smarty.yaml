modbusspec: 0
id: salda-smarty
manufacturer: Salda
name: Smarty (MCB controller)
kind: ventilation

sources:
- id: pysmarty2
  title: pysmarty2 (Python library behind the Home Assistant smarty integration)
  url: https://github.com/martinssipenko/pysmarty2
  license: MIT
  commit: 87575ec7110743a51e3a48980476976abb6ffc39
  path: pysmarty2/registers/*.json, pysmarty2/smarty.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - pysmarty2

