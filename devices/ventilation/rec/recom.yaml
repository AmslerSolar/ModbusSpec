modbusspec: 0
id: rec-recom
manufacturer: REC Indovent
name: RECOM SR EC / RT EC
kind: ventilation

sources:
- id: recom-modbus
  title: ha-recom-modbus (Home Assistant integration)
  url: https://github.com/gjocys/ha-recom-modbus
  license: MIT
  commit: 77e41264747755fc65e43fae7b7bb7759a8d8fb5
  path: custom_components/recom/const.py, custom_components/recom/__init__.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - recom-modbus

points:
  - {key: x.on_off, label: Unit on/off, table: coil, address: 0, type: bool, writable: true}
  - {key: x.speed_mode, label: Fan speed mode, table: holding, address: 2, type: s16, enum: speed_mode, writable: true}
  - {key: x.manual_speed, label: Manual fan speed, table: holding, address: 17, type: s16, unit: '%', writable: true, note: 0-100 %; used in speed mode 255 (manual).}
  - {key: x.ir_curseltemp, label: Temperature Setpoint, table: input, address: 0, type: s16, unit: °C, scale: 0.1}
  - {key: x.ir_curtemp_suairin, label: Intake Air Temperature, table: input, address: 1, type: s16, unit: °C, scale: 0.1}
  - {key: x.ir_curtemp_suairout, label: Supply Air Temperature, table: input, address: 2, type: s16, unit: °C, scale: 0.1}
  - {key: x.ir_curtemp_exairin, label: Extract Air Temperature, table: input, address: 3, type: s16, unit: °C, scale: 0.1}
  - {key: x.ir_curtemp_exairout, label: Exhaust Air Temperature, table: input, address: 4, type: s16, unit: °C, scale: 0.1}
  - {key: x.ir_curvbat, label: Internal Battery, table: input, address: 9, type: s16, unit: V, scale: 0.001}
  - {key: x.ir_currh_int, label: Humidity, table: input, address: 10, type: s16, unit: '%'}
  - {key: x.ir_surpm, label: Supply Fan Speed, table: input, address: 23, type: s16, unit: rpm}
  - {key: x.ir_exrpm, label: Extract Fan Speed, table: input, address: 24, type: s16, unit: rpm}

enums:
  speed_mode: {'1': Speed 1, '2': Speed 2, '3': Speed 3, '255': Manual}

notes:
- Modbus TCP, port 502, unit id 1 (the project always uses unit 1).
- The project names RECOM 2/3/4/6 SR EC and RECOM 2/4/6 RT EC; it was tested on a RECOM 4 RT EC.
- Input register 10 (humidity) needs the optional humidity sensor.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
