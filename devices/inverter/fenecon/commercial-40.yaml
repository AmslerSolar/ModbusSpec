notes:
- Addresses are the document's hexadecimal register addresses (function 03). The document doesn't give the port, unit id or
  transport; Modbus TCP on port 502 with unit 100 is assumed.
- 'Two-register counters give the low word first (LSW, then MSW): word order little.'
- State registers set one bit per state; the enums list the resulting values (bit 1 = 2, bit 2 = 4 …).
- Powers are in 0.1 kW and given here in W (scale 100).
- 'The DCDC blocks repeat every 0x300: BMS DCDC at 0xA000, BMS DCDC1 at 0xA300, PV DCDC at 0xA600, PV DCDC1 at 0xA900. They
  are only fitted in DC-coupled systems, so they are optional. Their 16-bit input / output energies (offsets 0x136, 0x137)
  and the hourly energies (0x0307 … 0x031E) are left out, as are per-cell values beyond the first.'
- The older AC-coupled variant's list (COMMERCIAL AC, V001.14) has the same registers without the DCDC blocks; its work state
  command (0x0500) lists only Stop (bit 2) and Run (bit 6).
- Reserved bits are left out of the flag tables. In the DCDC words, problems are reported per word, not per bit.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
