notes:
- 'Addresses: the document numbers the registers 0 … 2991 (decimal). Here they are 10000 higher, the addresses installed FENECON
  DESS systems answer at over Modbus TCP (unit 4). Neither the offset nor the unit id is in the document; both are assumed,
  so every point is unverified. The document''s own serial (SCI) port defaults to station address 1 and 19200 baud (registers
  149 and 150 here at 10149 and 10150).'
- Two-register values give the high-order register first.
- The document gives most registers as u16 and doesn't say how negative AC powers are encoded; read the power registers with
  care.
- Battery groups 1–3 repeat group 0's block (180 … 349) 200 registers higher (380, 580, 780); only group 0's main values are
  listed. Per-cell balancing states (290 … 349) and the reserved fault words 32 … 39 are left out.
- 'Fault and warning words: reserved bits are left out. The document''s group warning words (47, 52, 57, 62) and second warning
  words of each inverter (102, 107, 112, all reserved) are left out.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
