  stack_charge_state: {'0': Standby, '1': Charging, '2': Discharging}
  group_contactors: {'0': All disconnected, '1': Partially disconnected}
  protection_status: {'0': Normal, '1': Common warning, '2': Serious warning, '3': Common fault, '4': Serious fault}
  inverter_state: {'0': Self-inspection, '1': Standby, '2': Starting up, '3': Off-grid operation, '4': On-grid operation, '5': Fault}
  charger_working: {'0': Shutdown, '1': Working}
  no_yes: {'0': 'No', '1': 'Yes'}
  charger_charging: {'0': Not charging, '1': Fast charging, '2': Absorb charging, '3': Float charging, '4': Re-float charging, '5': Limited power (battery full), '6': Limited power (over-temperature)}
  emergency_stop: {'0': Normal, '255': Emergency stop}
  network_mode: {'0': DC-coupled single-phase, '1': AC-coupled single-phase, '2': DC-coupled split-phase, '3': AC-coupled split-phase, '4': DC-coupled three-phase, '5': AC-coupled three-phase}
