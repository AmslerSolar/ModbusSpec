modbusspec: 0
id: fronius-sunspec
manufacturer: Fronius
name: Inverters with SunSpec float registers, as read by openWB
kind: inverter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/fronius/fronius_sunspec

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

sunspec: true

models:
  - {id: ac, name: ac}

points:
  - {key: pv_power, label: Inverter power, table: holding, address: 40091, type: f32, unit: W, models: [ac], note: Raw > 0 = generation (openWB's sign handling).}
  - {key: pv_energy, label: Inverter exported energy, table: holding, address: 40101, type: f32, unit: kWh, scale: 0.001}
  - {key: x.bat_power_scale, label: Battery power scale, table: holding, address: 40267, type: s16}
  - {key: x.bat_module_count, label: Battery module count, table: holding, address: 40271, type: u16}
  - {key: x.inverter_module1_dc_power, label: Module 1 DC power, table: holding, address: 40284, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}, note: 'openWB reads the modules chosen in its settings (number of modules at 40271): inverter power = −(sum of the chosen modules), battery power = the chosen module.'}
  - {key: x.inverter_module2_dc_power, label: Module 2 DC power, table: holding, address: 40304, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}, note: 'openWB reads the modules chosen in its settings (number of modules at 40271): inverter power = −(sum of the chosen modules), battery power = the chosen module.'}
  - {key: x.inverter_module3_dc_power, label: Module 3 DC power, table: holding, address: 40324, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}, note: 'openWB reads the modules chosen in its settings (number of modules at 40271): inverter power = −(sum of the chosen modules), battery power = the chosen module.'}
  - {key: x.inverter_module4_dc_power, label: Module 4 DC power, table: holding, address: 40344, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}, note: 'openWB reads the modules chosen in its settings (number of modules at 40271): inverter power = −(sum of the chosen modules), battery power = the chosen module.'}
  - {key: x.bat_max_power_raw, label: Battery max power raw, table: holding, address: 40355, type: u16}
  - {key: x.bat_write_40359, label: Battery register 40359, table: holding, address: 40358, type: u16, writable: true, note: 'openWB writes 0, 1, 2 here.'}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 40361, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 40375, type: s16}}
  - {key: x.bat_write_40366, label: Battery register 40366, table: holding, address: 40365, type: s16, writable: true, note: openWB writes 0 here (and computed values).}
  - {key: x.bat_write_40367, label: Battery register 40367, table: holding, address: 40366, type: s16, writable: true, note: openWB writes computed values here.}
  - {key: x.bat_write_40371, label: Battery register 40371, table: holding, address: 40370, type: u16, writable: true, note: openWB writes 1 here.}
  - {key: x.bat_max_power_scale, label: Battery max power scale, table: holding, address: 40371, type: s16}
  - {key: x.bat_soc_scale, label: Battery soc scale, table: holding, address: 40375, type: s16}
  - {key: x.bat_rate_scale, label: Battery rate scale, table: holding, address: 40378, type: s16}

notes:
- openWB reads these registers at Fronius's 1-based register numbers; the addresses here are those numbers minus 1, as in
  Fronius's register map.
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
