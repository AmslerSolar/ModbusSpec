# Written from the Fronius Inverter Register Map Float v1.0 with SYMOHYBRID MODEL 124 (Fronius Datamanager register
# map workbook; copy kept in a public repository, commit c044448d).

modbusspec: 0
id: fronius-datamanager
manufacturer: Fronius
name: Inverters behind a Fronius Datamanager, incl. Symo Hybrid (SunSpec float)
kind: inverter

sources:
- title: Inverter Register Map Float v1.0 with SYMOHYBRID MODEL 124 (Fronius Datamanager Register Map)
  version: v1.0 (copy at commit c044448d6346209e4aa8dae7f4bde08a676ad0ed)
  url: https://github.com/OpenEMS/openems/blob/c044448d6346209e4aa8dae7f4bde08a676ad0ed/io.openems.edge.fronius/doc/Inverter_Register_Map_Float_v1.0_with_SYMOHYBRID_MODEL_124.xlsx
  sha256: 55e4d64b0935a9e0dc74dd73899f284f3dd960cf19250bcbb36e77a04893cca6

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40002
    type: u16
    equals: 1
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: Fronius
  # float inverter model
  - table: holding
    address: 40069
    type: u16
    in:
    - 111
    - 112
    - 113

sunspec: true

points:
  # Common model (1)
  - {key: x.manufacturer, label: Mn (manufacturer), table: holding, address: 40004, type: str, length: 16, poll: slow}
  - {key: x.model, label: Md (device model), table: holding, address: 40020, type: str, length: 16, poll: slow}
  - {key: x.datamanager_firmware, label: Opt (firmware version of the Datamanager), table: holding, address: 40036, type: str, length: 8, poll: slow}
  - {key: firmware, label: Vr (software version of the inverter), table: holding, address: 40044, type: str, length: 8, poll: slow}
  - {key: serial, label: SN (serial number of the inverter), table: holding, address: 40052, type: str, length: 16, poll: slow, note: 'Where the inverter''s serial is not available (always on Symo Hybrid), this holds the inverter controller''s (PMC) serial or its unique ID instead, which may differ from the nameplate; it can switch from one to the other while running (e.g. after boot).'}
  - {key: x.device_address, label: DA (Modbus device address), table: holding, address: 40068, type: u16, poll: slow}

  # Inverter model 111 / 112 / 113 (float)
  - {key: x.inverter_model, label: 'ID (111 single phase, 112 split phase, 113 three phase)', table: holding, address: 40069, type: u16, enum: inverter_model, poll: slow}
  - {key: x.ac_current, label: A (AC total current), table: holding, address: 40071, type: f32, unit: A}
  - {key: l1_current, label: AphA, table: holding, address: 40073, type: f32, unit: A}
  - {key: l2_current, label: AphB, table: holding, address: 40075, type: f32, unit: A}
  - {key: l3_current, label: AphC, table: holding, address: 40077, type: f32, unit: A}
  - {key: x.l1_l2_voltage, label: PPVphAB, table: holding, address: 40079, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: PPVphBC, table: holding, address: 40081, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: PPVphCA, table: holding, address: 40083, type: f32, unit: V}
  - {key: l1_voltage, label: PhVphA, table: holding, address: 40085, type: f32, unit: V}
  - {key: l2_voltage, label: PhVphB, table: holding, address: 40087, type: f32, unit: V}
  - {key: l3_voltage, label: PhVphC, table: holding, address: 40089, type: f32, unit: V}
  - {key: x.ac_power, label: W (AC power), table: holding, address: 40091, type: f32, unit: W, positive: generation, verified: false, note: The document gives no sign; + = AC output assumed.}
  - {key: frequency, label: Hz (AC frequency), table: holding, address: 40093, type: f32, unit: Hz}
  - {key: apparent_power, label: VA (apparent power), table: holding, address: 40095, type: f32, unit: VA}
  - {key: reactive_power, label: VAr (reactive power), table: holding, address: 40097, type: f32, unit: var}
  - {key: x.power_factor_pct, label: PF (power factor), table: holding, address: 40099, type: f32, unit: '%'}
  - {key: pv_energy, label: WH (AC lifetime energy production), table: holding, address: 40101, type: f32, unit: kWh, scale: 0.001, poll: slow, note: The inverter's AC lifetime energy in Wh; Fronius says it may be imprecise.}
  - {key: x.dc_current, label: DCA (DC current), table: holding, address: 40103, type: f32, unit: A, note: Not supported with several DC inputs; see the MPPT model.}
  - {key: x.dc_voltage, label: DCV (DC voltage), table: holding, address: 40105, type: f32, unit: V, note: Not supported with several DC inputs; see the MPPT model.}
  - {key: x.dc_power, label: 'DCW (DC power, all DC inputs)', table: holding, address: 40107, type: f32, unit: W}
  - {key: x.operating_state, label: St (operating state), table: holding, address: 40117, type: u16, note: SunSpec operating state; the document gives no value table.}
  - {key: x.vendor_state, label: StVnd (vendor operating state), table: holding, address: 40118, type: u16, note: The document gives no value table.}
  - {key: x.events_1, label: Evt1 (event flags bits 0-31), table: holding, address: 40119, type: u32}
  - {key: x.events_2, label: Evt2 (event flags bits 32-63), table: holding, address: 40121, type: u32}
  - {key: x.vendor_events_1, label: EvtVnd1 (vendor event flags bits 0-31), table: holding, address: 40123, type: u32}
  - {key: x.vendor_events_2, label: EvtVnd2 (vendor event flags bits 32-63), table: holding, address: 40125, type: u32}
  - {key: x.vendor_events_3, label: EvtVnd3 (vendor event flags bits 64-95), table: holding, address: 40127, type: u32}
  - {key: x.vendor_events_4, label: EvtVnd4 (vendor event flags bits 96-127), table: holding, address: 40129, type: u32}

  # Nameplate model (120)
  - {key: x.der_type, label: DERTyp (4 = PV), table: holding, address: 40133, type: u16, poll: slow}
  - {key: x.rated_power, label: WRtg (continuous power output), table: holding, address: 40134, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40135, type: s16}, poll: slow}
  - {key: x.rated_apparent_power, label: VARtg, table: holding, address: 40136, type: u16, unit: VA, scale_exponent_from: {table: holding, address: 40137, type: s16}, poll: slow}
  - {key: x.rated_storage_energy, label: WHRtg (nominal storage energy), table: holding, address: 40150, type: u16, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 40151, type: s16}, poll: slow}
  - {key: x.max_charge_rate, label: MaxChaRte, table: holding, address: 40154, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40155, type: s16}, poll: slow}
  - {key: x.max_discharge_rate, label: MaxDisChaRte, table: holding, address: 40156, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40157, type: s16}, poll: slow}

  # Basic settings model (121)
  - {key: x.max_power_setting, label: WMax (maximum power output), table: holding, address: 40161, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40181, type: s16}, writable: true, poll: slow}

  # Extended measurements model (122)
  - {key: x.pv_connection, label: PVConn, table: holding, address: 40193, type: u16, flags: conn_bits}
  - {key: x.storage_connection, label: StorConn, table: holding, address: 40194, type: u16, flags: conn_bits}
  - {key: x.ecp_connection, label: ECPConn (grid connection), table: holding, address: 40195, type: u16, enum: ecp_conn}
  - {key: x.ac_energy_wh, label: ActWh (AC lifetime active energy output), table: holding, address: 40196, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.active_controls, label: StActCtl (active inverter controls), table: holding, address: 40226, type: u32, flags: active_controls}
  - {key: x.clock, label: Tms (seconds since 2000-01-01 UTC), table: holding, address: 40232, type: u32, epoch: {start: '2000-01-01', unit: s}, poll: slow}

  # Immediate controls model (123)
  - {key: x.connection_control, label: Conn (connection control), table: holding, address: 40241, type: u16, enum: ecp_conn, writable: true}
  - {key: x.power_limit_pct, label: WMaxLimPct (power output limit), table: holding, address: 40242, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 40260, type: s16}, writable: true, note: Percent of WMax.}
  - {key: x.power_limit_window, label: WMaxLimPct_WinTms, table: holding, address: 40243, type: u16, unit: s, writable: true, min: 0, max: 300, poll: slow}
  - {key: x.power_limit_revert, label: WMaxLimPct_RvrtTms, table: holding, address: 40244, type: u16, unit: s, writable: true, min: 0, max: 28800, poll: slow}
  - {key: x.power_limit_ramp, label: WMaxLimPct_RmpTms, table: holding, address: 40245, type: u16, unit: s, writable: true, poll: slow}
  - {key: x.power_limit_enable, label: WMaxLim_Ena, table: holding, address: 40246, type: u16, enum: disabled_enabled, writable: true}
  - {key: x.pf_setpoint, label: OutPFSet (fixed power factor), table: holding, address: 40247, type: s16, scale_exponent_from: {table: holding, address: 40261, type: s16}, writable: true, poll: slow}
  - {key: x.pf_enable, label: OutPFSet_Ena, table: holding, address: 40251, type: u16, enum: disabled_enabled, writable: true, poll: slow}
  - {key: x.var_pct, label: 'VArMaxPct (reactive power, percent of VArMax)', table: holding, address: 40253, type: s16, unit: '%', scale_exponent_from: {table: holding, address: 40262, type: s16}, writable: true, poll: slow}
  - {key: x.var_enable, label: VArPct_Ena, table: holding, address: 40259, type: u16, enum: disabled_enabled, writable: true, poll: slow}

  # Multiple MPPT model (160)
  - {key: x.mppt_events, label: Evt (global events), table: holding, address: 40269, type: u32}
  - {key: x.dc_inputs, label: N (number of modules), table: holding, address: 40271, type: u16, poll: slow}
  - {key: x.dc1_name, label: 1_IDStr, table: holding, address: 40274, type: str, length: 8, poll: slow}
  - {key: x.dc1_current, label: 1_DCA, table: holding, address: 40282, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40265, type: s16}}
  - {key: x.dc1_voltage, label: 1_DCV, table: holding, address: 40283, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40266, type: s16}}
  - {key: x.dc1_power, label: 1_DCW, table: holding, address: 40284, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}}
  - {key: x.dc1_energy, label: 1_DCWH, table: holding, address: 40285, type: u32, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 40268, type: s16}, poll: slow, note: Not supported on Symo Hybrid.}
  - {key: x.dc1_temperature, label: 1_Tmp, table: holding, address: 40289, type: s16, unit: °C}
  - {key: x.dc1_state, label: 1_DCSt, table: holding, address: 40290, type: u16, note: The document gives no value table.}
  - {key: x.dc1_events, label: 1_DCEvt, table: holding, address: 40291, type: u32}
  - {key: x.dc2_name, label: 2_IDStr, table: holding, address: 40294, type: str, length: 8, poll: slow, note: '"String 2", or "Not supported" with one DC input.'}
  - {key: x.dc2_current, label: 2_DCA, table: holding, address: 40302, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40265, type: s16}, optional: true}
  - {key: x.dc2_voltage, label: 2_DCV, table: holding, address: 40303, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40266, type: s16}, optional: true}
  - {key: x.dc2_power, label: 2_DCW, table: holding, address: 40304, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40267, type: s16}, optional: true}
  - {key: x.dc2_energy, label: 2_DCWH, table: holding, address: 40305, type: u32, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 40268, type: s16}, poll: slow, optional: true, note: Not supported on Symo Hybrid.}
  - {key: x.dc2_temperature, label: 2_Tmp, table: holding, address: 40309, type: s16, unit: °C, optional: true}
  - {key: x.dc2_state, label: 2_DCSt, table: holding, address: 40310, type: u16, optional: true}
  - {key: x.dc2_events, label: 2_DCEvt, table: holding, address: 40311, type: u32, optional: true}

  # Basic storage controls model (124), Symo Hybrid with battery only
  - {key: x.max_charge_power, label: WChaMax (reference for charge and discharge limits), table: holding, address: 40315, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40331, type: s16}, poll: slow, optional: true}
