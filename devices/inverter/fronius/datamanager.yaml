  - {key: x.minimum_reserve, label: MinRsvPct (minimum reserve), table: holding, address: 40320, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 40334, type: s16}, writable: true, poll: slow, optional: true}
  - {key: battery_soc, label: 'ChaState (available energy, percent of capacity)', table: holding, address: 40321, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 40335, type: s16}, optional: true}
  - {key: x.charge_state, label: ChaSt (charge status), table: holding, address: 40324, type: u16, enum: charge_state, optional: true}
  - {key: x.discharge_rate_limit, label: OutWRte (maximum discharge rate), table: holding, address: 40325, type: s16, unit: '%', scale_exponent_from: {table: holding, address: 40338, type: s16}, writable: true, min: -100, max: 100, optional: true, note: Percent of WChaMax; may be negative to define a charging-only window. Invalid windows are silently ignored.}
  - {key: x.charge_rate_limit, label: InWRte (maximum charge rate), table: holding, address: 40326, type: s16, unit: '%', scale_exponent_from: {table: holding, address: 40338, type: s16}, writable: true, min: -100, max: 100, optional: true, note: Percent of WChaMax; may be negative to define a discharging-only window. Invalid windows are silently ignored.}
  - {key: x.grid_charging, label: ChaGriSet (charging from grid), table: holding, address: 40330, type: u16, enum: cha_gri_set, writable: true, poll: slow, optional: true}

  # Fronius registers
  - {key: x.active_state_code, label: F_Active_State_Code, table: holding, address: 213, type: u16, note: 'The inverter''s current state code, described in the inverter manual. Not supported on Fronius Hybrid inverters.'}
  - {key: x.model_type, label: F_ModelType (SunSpec model type for inverter and meter data), table: holding, address: 215, type: u16, enum: model_type, writable: true, poll: slow, note: Write 1 or 2 and then 6 at once to confirm.}
  - {key: x.storage_restrictions_view, label: F_Storage_Restrictions_View_Mode, table: holding, address: 216, type: u16, enum: restrictions_view, writable: true, poll: slow, note: 'Which restrictions model 124 reports: local (set over Modbus) or global (set system-wide).'}
  - {key: x.site_power, label: F_Site_Power (all connected inverters), table: holding, address: 499, type: u32, unit: W}
  - {key: x.site_energy_today, label: F_Site_Energy_Day (all connected inverters), table: holding, address: 501, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.site_energy_year, label: F_Site_Energy_Year (all connected inverters), table: holding, address: 505, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.site_energy_total, label: F_Site_Energy_Total (all connected inverters), table: holding, address: 509, type: u64, unit: kWh, scale: 0.001, poll: slow}

enums:
  inverter_model: {'111': Single phase, '112': Split phase, '113': Three phase}
  ecp_conn: {'0': Disconnected, '1': Connected}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  charge_state: {'1': 'Off', '2': Empty, '3': Discharging, '4': Charging, '5': Full, '6': Holding, '7': Testing (calibration or service charge)}
  cha_gri_set: {'0': PV only (charging from grid disabled), '1': Grid (charging from grid enabled)}
  model_type: {'1': Float, '2': Integer + scale factor}
  restrictions_view: {'0': Local (default), '1': Global}

flags:
  conn_bits: {'0': Connected, '1': Available, '2': Operating, '3': Test}
  active_controls: {'0': Fixed W, '1': Fixed var, '2': Fixed PF}
  storctl_mod: {'0': Charge, '1': Discharge}

notes:
- 'Addresses: the workbook numbers registers from 1 (SunS at 40001); they are converted to protocol addresses here by subtracting
  1, the Fronius registers too (F_Site_Power 500 → 499).'
- 'This is the Datamanager''s chain with float inverter models (111-113): common 40000, inverter 40069, 120 at 40131, 121
  at 40159, 122 at 40191, 123 at 40237, 160 at 40263, 124 at 40313 (Symo Hybrid with battery), end at 40339. Walk the chain
  from ''SunS'' where possible; the GEN24 lays its chain out differently (fronius-gen24).'
- The SunSpec model type (F_ModelType) can be switched to integer + scale factor; the document only describes float, so the
  inverter-model addresses here only hold with float.
- Single-phase (111) inverters leave phase B and C values unsupported; temperatures in model 111-113 (TmpCab, TmpSnk, TmpTrns,
  TmpOt) and many controls are not supported and left out.
- Unit id, port and transport are not stated in the document; 502, unit 1 and TCP assumed (the Datamanager is reached over
  Ethernet). Word order not stated; big-endian (SunSpec) assumed.
- Identification also matches a GEN24 with float models; the Datamanager's Mn / chain layout can't be told apart from it by
  the checks alone.
- The workbook gives no value tables for St, StVnd, DCSt or the event flag bits, so no problems are described.
- 'Left out: commands (F_Delete_Data, F_Store_Data, F_Reset_All_Event_Flags), unsupported registers, reactive-power ratings
  and limits, ramp and PF-minimum settings, timing registers of the immediate controls.'
