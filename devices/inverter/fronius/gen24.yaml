# Written from the Fronius GEN24 Modbus document (42,0410,2649) and the SunSpec models workbook.

modbusspec: 0
id: fronius-gen24
manufacturer: Fronius
name: Primo / Symo GEN24 and GEN24 Plus (SunSpec, float or int + SF)
kind: inverter

sources:
- title: Fronius GEN24 / GEN24 Plus Modbus TCP & RTU (operating instructions)
  version: 42,0410,2649
  url: http://www.fronius.com/QR-link/0024
  sha256: dc4c5d49362ee0c9721f21886f17fa18497e54c4d92bb5cc2c50472deb266b55
- id: fronius-float-map
  title: Fronius Gen24 Primo/Symo Inverter Register Map with Float Inverter Model and storage configured (workbook, a copy posted on the ioBroker forum)
  url: https://forum.iobroker.net/assets/uploads/files/1683535718762-065a950f-be91-4068-863a-b33dc81b2337-gen24_primo_symo_inverter_register_map_float_storage.xlsx
  sha256: 3be79377ddcc35ae5825ebdac9edb1ba8e6852982e5de202dcd7f84148c93edc
- title: SunSpec Information Models (models workbook)
  version: models_workbook.xlsx, master 2026-10-21
  url: https://github.com/sunspec/models/raw/master/models_workbook.xlsx
- id: fronius-modbus
  title: fronius_modbus (Home Assistant integration)
  url: https://github.com/redpomodoro/fronius_modbus
  license: Apache-2.0
  commit: eafca35aa5f5caf01f9952d4f29dbdb9648a7a18
  path: custom_components/fronius_modbus/froniusmodbusclient.py, custom_components/fronius_modbus/froniusmodbusclient_const.py,
    custom_components/fronius_modbus/const.py, custom_components/fronius_modbus/config_flow.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.fronius

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40002
    type: u16
    equals: 1
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: Fronius
  # an inverter model
  - table: holding
    address: 40069
    type: u16
    in:
    - 101
    - 102
    - 103
    - 111
    - 112
    - 113

sunspec: true

models:
  - {id: int_sf, name: SunSpec model type "int + SF" (inverter model 101-103), match: {table: holding, address: 40069, type: u16, in: [101, 102, 103]}}
  - {id: float, name: 'SunSpec model type "float" (inverter model 111-113, factory setting)', match: {table: holding, address: 40069, type: u16, in: [111, 112, 113]}}
  - {id: primo_gen24, name: Primo GEN24, match: {table: holding, address: 40020, type: str, length: 16, prefix: Primo GEN24}}
  - {id: symo_gen24, name: Symo GEN24, match: {table: holding, address: 40020, type: str, length: 16, prefix: Symo GEN24}}

points:
