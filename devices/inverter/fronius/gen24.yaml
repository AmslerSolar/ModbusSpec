  - {key: x.model, label: Md (model), table: holding, address: 40020, type: str, length: 16, poll: slow}
  - {key: x.options, label: Opt (options), table: holding, address: 40036, type: str, length: 8, poll: slow}
  - {key: firmware, label: Vr (version), table: holding, address: 40044, type: str, length: 8, poll: slow}
  - {key: serial, label: SN (serial number), table: holding, address: 40052, type: str, length: 16, poll: slow}
  - {key: x.device_address, label: DA (Modbus device address), table: holding, address: 40068, type: u16, poll: slow}
  - {key: x.ac_current, label: A (AC current), table: holding, address: 40071, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, models: [int_sf]}
  - {key: l1_current, label: AphA, table: holding, address: 40072, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, models: [int_sf]}
