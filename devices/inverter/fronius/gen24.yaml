notes:
- 'Fronius says the addresses aren''t fixed: find each SunSpec model by walking the chain from ''SunS'' at 40000, then use
  offsets. The absolute addresses here follow from Fronius'' Common model of 65 registers and the start addresses the document
  gives (inverter model at 40069; 120 at 40121 / 40131, 160 at 40253 / 40263, 124 at 40343 / 40353 for int + SF / float).'
- The 'SunSpec Model Type' setting picks float (factory setting, models 111-113) or int + SF (101-103); the float inverter
  model is 10 registers longer, so every model after it (120 to 124 and 160) is the same in both but sits 10 registers later
  with float. Models 120 to 124 and 160 have no float variant and always use scale factors.
- 'Fronius: scale factors aren''t constant (firmware updates, auto-scaling at runtime); read them with every poll.'
- Single-phase inverters (model 101 / 111) leave phase B and C values not implemented (0xFFFF / 0x8000 / NaN).
- Model 160 has 2 DC modules without storage and 4 with (3 = storage charging, 4 = storage discharging); model 124 exists
  only with storage.
- The Smart Meter is a separate device behind the inverter (fronius-smart-meter, unit id 200).
- 'SunSpec ''not implemented'' values: 0xFFFF (u16), 0x8000 (s16), 0xFFFFFFFF (u32), NaN (float); the acc32 energy counters
  read 0 when not accumulated.'
- 'Left out: Wchagra (holding 40346, u16) from fronius-modbus overlaps x.storage_discharge_energy from the documents.'
- Modbus TCP must be enabled in the inverter's web interface with 'SunSpec Model Type' set to 'int + SF'; the addresses here
  are for that setting.
- The battery's DC side appears as MPPT modules 3 (charging power / energy) and 4 (discharging power / energy) of the multiple-MPPT
  block.
- Storage registers are only meaningful when the nameplate DER type (40123) reads 82 (storage present).
- The project's house load is meter power (positive = import) plus the inverter's AC power.
- OpenEMS writes these storage-control registers of the SunSpec "int + SF" register map at fixed addresses; it reads the rest
  through SunSpec.
- Identification as fronius-modbus recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
