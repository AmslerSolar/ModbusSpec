  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.mppt1_power}, {key: x.mppt2_power}], verified: false, sources: [fronius-modbus]}

enums:
  inverter_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': MPPT (producing), '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby}
  dc_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': MPPT, '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby, '9': Test, '10': Reserved}
  charge_state: {'1': 'Off', '2': Empty, '3': Discharging, '4': Charging, '5': Full, '6': Holding, '7': Testing}
  cha_gri_set: {'0': PV only, '1': Grid allowed}
  fronius_inverter_status: {'1': 'Off', '2': Sleeping, '3': Starting, '4': Normal, '5': Throttled, '6': Shutdown, '7': Fault, '8': Standby, '9': No solarnet, '10': No inverter communication, '11': Overcurrent solarnet, '12': Firmware updating, '13': ACFI event}
  connection_status_condensed: {'0': Disconnected, '1': Connected, '3': Available, '7': Operating}
  ecp_connection_status: {'0': Disconnected, '1': Connected}
  control_status: {'0': Disabled, '1': Enabled}
  charge_grid_status: {'1': Disabled, '2': Enabled}
  charge_status: {'1': 'Off', '2': Empty, '3': Discharging, '4': Charging, '5': Full, '6': Holding, '7': Testing}
  storage_control_mode: {'0': Auto, '1': Charge, '2': Discharge, '3': Change and Discharge}

flags:
  evt1: {'0': Ground fault, '1': DC over-voltage, '2': AC disconnect open, '3': DC disconnect open, '4': Grid disconnected, '5': Cabinet open, '6': Manual shutdown, '7': Over-temperature, '8': Grid over-frequency, '9': Grid under-frequency, '10': Grid over-voltage, '11': Grid under-voltage, '12': Blown string fuse, '13': Under-temperature, '14': Memory loss, '15': Hardware test failure}
  dc_evt: {'0': Ground fault, '1': Input over-voltage, '3': DC disconnect open, '5': Cabinet open, '6': Manual shutdown, '7': Over-temperature, '12': Blown fuse, '13': Under-temperature, '14': Memory loss, '15': Arc detected, '20': Test failed, '22': Input over-current}
  storctl_mod: {'0': Charge limit (InWRte) active, '1': Discharge limit (OutWRte) active}
  inverter_events: {'0': Error, '1': Warning, '2': Info}
  inverter_controls: {'0': Power reduction, '1': Constant reactive power, '2': Constant power factor}

problems:
  - {when: {key: state, equals: 7}, kind: fault, text: Inverter fault (St 7)}
  - {when: {key: x.events, bit: 0}, kind: fault, text: Ground fault (Evt1 bit 0)}
  - {when: {key: x.events, bit: 1}, kind: fault, text: DC over-voltage (Evt1 bit 1)}
