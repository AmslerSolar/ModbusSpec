modbusspec: 0
id: luxpower-lxp
manufacturer: LuxPower
name: LXP hybrid inverters
kind: inverter

sources:
- id: eg4-web-monitor
  title: eg4_web_monitor (Home Assistant integration)
  url: https://github.com/joyfulhouse/eg4_web_monitor
  license: MIT
  commit: 77e6c8652d46042e2a919c8e461ddd2c10724c3a
  path: custom_components/eg4_web_monitor/const/operating_state.py
- id: luxpower-ha-integration
  title: luxpower-ha-integration (Home Assistant integration)
  url: https://github.com/ant0nkr/luxpower-ha-integration
  license: MIT
  commit: 412c3a68380a02020bf747e5c38b898c5de6bf8d
  path: custom_components/lxp_modbus/constants/input_registers.py, custom_components/lxp_modbus/constants/hold_registers.py,
    custom_components/lxp_modbus/constants/battery_registers.py, custom_components/lxp_modbus/entity_descriptions
- id: pylxpweb
  title: pylxpweb (Python library for EG4 / LuxPower inverters, used by eg4_web_monitor)
  url: https://github.com/joyfulhouse/pylxpweb
  license: MIT
  commit: bce390936f2068000b7a53e2e981e9399139753f
  path: src/pylxpweb/registers/inverter_input.py, src/pylxpweb/registers/inverter_holding.py, src/pylxpweb/registers/scheduling.py,
    src/pylxpweb/registers/battery.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 40

encoding:
  word_order: little

identify:
  serial:
    table: input
    address: 115
    type: str
    length: 5
    byte_order: little

defaults:
  verified: false
  sources:
  - luxpower-ha-integration

models:
  - {id: lxp_gen2, name: LXP GEN2, match: {table: holding, address: 19, type: u16, equals: 20}}
  - {id: lxp_eu, name: LXP EU, match: {table: holding, address: 19, type: u16, equals: 12}}
  - {id: lxp_lb, name: LXP LB, match: {table: holding, address: 19, type: u16, equals: 44}}

