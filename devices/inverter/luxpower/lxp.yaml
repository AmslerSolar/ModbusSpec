derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: x.power_from_grid}, {key: x.power_to_grid, factor: -1}], sources: [pylxpweb]}
  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv1_power}, {key: x.pv2_power}, {key: x.pv3_power}, {key: x.pv4_power}, {key: x.pv5_power}, {key: x.pv6_power}], note: pylxpweb leaves out strings the inverter doesn't report (pv4…pv6 on three-string models)., sources: [pylxpweb]}

enums:
  operating_state: {'0': Standby, '1': Fault, '2': Programming, '4': PV → Grid, '8': PV → Battery, '12': PV → Battery + Grid, '16': Battery → Grid, '17': Standby, '20': PV + Battery → Grid, '32': AC → Battery, '40': PV + AC → Battery, '64': Off-Grid (Battery), '96': Off-Grid (AC-Coupled Charging), '128': 'Off-Grid (PV, unstable)', '136': Off-Grid (PV + Charging), '192': Off-Grid (PV + Battery)}
  ac_input_type: {'0': Grid, '1': Generator}
  parallel_role: {'1': Master, '2': Slave, '3': Parallel On}
  parallel_phase: {'1': R Phase, '2': S Phase, '3': T Phase}
  phase_sequence: {'0': Positive, '1': Negative}
  bms_firmware_update_state: {'0': Idle, '1': In Process, '2': Success, '3': Failed}
  ac_charge_type: {'0': Disable, '1': According to Time, '2': According to Voltage, '3': According to SOC, '4': According to Voltage and Time, '5': According to SOC and Time}
  discharge_control_type: {'0': According to Voltage, '1': According to SOC, '2': According to Both}
  on_grid_eod_type: {'0': According to Voltage, '1': According to SOC}
  generator_charge_type: {'0': According to Battery Voltage, '1': According to Battery SOC}
  system_type: {'0': No parallel (single one), '1': Single-phase parallel (primary), '2': Secondary, '3': Three phase parallel (Master), '4': 2*208 (Master) - for split-phase}
  language: {'0': English, '1': German}
  pv_input_model: {'0': No PV, '1': PV1 in, '2': PV2 in, '3': PV3 in, '4': PV1 & PV2 in, '5': PV1 & PV3 in, '6': PV2 & PV3 in, '7': PV1 & PV2 & PV3 in}
  reactive_power_command_type: {'0': Unit power factor, '1': Fixed PF, '2': Default PF curve (Q(P)), '3': Custom PF curve, '4': Capacitive reactive power percentage, '5': Inductive reactive power percentage, '6': Q(V) curve, '7': Q(V) Dynamic}
  output_priority_config: {'0': Battery First, '1': PV First, '2': AC First}
  line_mode: {'0': APL (Appliance), '1': UPS (Uninterruptible Power Supply), '2': GEN (Generator)}
  grid_type: {'0': Split Phase 240V/120V, '1': 3-Phase Star 120V/208V, '2': Single Phase 240V, '3': Single Phase 230V, '4': Split Phase 200V/100V, '5': 3-Phase Delta 230V/230V, '6': 3-Phase Star 240V/415V, '7': 3-Phase Star 230V/400V, '8': 3-Phase Star 220V/380V}
  working_mode: {'0': Standby, '1': Normal}
  smart_load_enable: {'0': Generator, '1': Smart Load}
  lcd_screen_type: {'0': Screen 'B' size, '1': Screen 'S' size}
  eps_voltage_set: {'208': 208 V, '220': 220 V, '230': 230 V, '240': 240 V, '277': 277 V}
  eps_frequency_set: {'50': 50 Hz, '60': 60 Hz}
  off_grid_composed_phase: {'1': R Phase, '2': S Phase, '3': T Phase}
  lsp_battery_volt_or_soc: {'0': voltage, '1': SOC}
  pv_ct_direction: {'0': Normal, '1': Reversed}
  battery_charge_control: {'0': SOC, '1': Voltage}
  battery_discharge_control: {'0': SOC, '1': Voltage}
  rsd_disable: {'0': RSD enabled, '1': RSD disabled}

flags:
  fault_codes: {'0': Internal communication failure 1, '1': Model fault, '8': Parallel CAN communication failure, '9': The host is missing, '10': Inconsistent rated power, '11': Inconsistent AC or safety settings, '12': UPS short circuit, '13': UPS reverse current, '14': BUS short circuit, '15': Abnormal phase in three-phase system, '16': Relay failure, '17': Internal communication failure 2, '18': Internal communication failure 3, '19': BUS overvoltage, '20': EPS connection fault, '21': PV overvoltage, '22': Overcurrent protection, '23': Neutral fault, '24': PV short circuit, '25': Heatsink temperature out of range, '26': Internal failure, '27': Consistency failure, '28': Inconsistent generator connection, '29': Parallel sync signal loss, '31': Internal communication failure 4}
  warning_codes: {'0': Battery communication failed, '1': AFCI communication failure, '2': Battery low temperature, '3': Meter communication failed, '4': Battery cannot be charged/discharged, '5': Automated test failed, '6': RSD Active, '7': LCD communication failure, '8': Software version mismatch, '9': Fan is stuck, '10': Grid overload, '11': Number of parallel secondaries exceeds limit, '12': Battery reverse MOS abnormal, '13': Radiator temperature out of range, '14': Multiple primary units set in parallel system, '15': Battery reverse, '16': No grid connection, '17': Grid voltage out of range, '18': Grid frequency out of range, '20': Insulation resistance low, '21': Leakage current too high, '22': DCI exceeded standard, '23': PV short circuit, '25': Battery overvoltage, '26': Battery undervoltage, '27': Battery open circuit, '28': EPS overload, '29': EPS voltage high, '30': Meter reversed, '31': DCV exceeded standard}

notes:
- Operating states from 0x40 up are off-grid.
- The integration reaches the inverter through the LuxPower WiFi dongle's own TCP protocol (port 8000), which wraps Modbus
  requests for these input and holding registers; it does not use Modbus TCP.
- Requests of up to 125 registers; older firmware only accepts 40.
- A register the inverter does not implement reads 0xFFFF.
- 'Battery data: 4 blocks of 30 input registers from 5000, one per battery; the serial number in each block is text and not
  listed.'
- 32-bit values are two registers, low word first.
- Text values (the inverter serial number at input 115-119 or holding 2-6, battery serial numbers) hold two ASCII characters
  per register, low byte first; they are not listed as points.
- The battery block repeats every 30 registers from input 5002, one block per battery slot; with more batteries than slots
  the inverter rotates them through the slots.
- Besides Modbus TCP / RTU, the WiFi dongle carries the same registers over its own TCP protocol on port 8000.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
