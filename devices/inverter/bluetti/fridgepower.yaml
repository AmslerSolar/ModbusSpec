modbusspec: 0
id: bluetti-fridgepower
manufacturer: BLUETTI
name: FridgePower
kind: inverter

sources:
- id: bluetti-modbus
  title: bluetti-modbus (Python library, used by Home Assistant's bluetti_modbus)
  url: https://github.com/bluetti-community/bluetti-modbus
  license: MIT
  commit: f5f8401606ed4489467fe33527f72d7bdc382b3c
  path: src/bluetti_modbus_lib/devices/fp.py, src/bluetti_modbus_lib/fields/custom_fields.py

connection:
  default_port: 502
  default_unit: 1
  limits:
    max_registers: 20
    max_gap: 5

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - bluetti-modbus

