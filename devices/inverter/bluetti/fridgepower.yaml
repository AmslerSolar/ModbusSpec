enums:
  inverter_fault: {'0': No fault}
  inverter_status: {'0': Stop, '1': Off grid, '2': Grid connected load, '3': Grid connected operation, '4': Grid connected charging, '5': Grid connected discharging, '6': Inverter fault, '7': Abnormal off grid}
  inverter_warning: {'0': No warning}
  pack_charging_status: {'0': Idle, '1': Charging, '2': Discharging}
  pv_type: {'0': Reserve, '1': Car, '2': Adapter, '3': Other, '100': DC PV, '101': AC PV}

notes:
- Modbus TCP is off by default; it is switched on in the device's own web interface.
- There is no register that names the product family reliably for every model; the library is told which model it talks to.
  Register 50200 (6 registers) holds the type string the device reports.
- The device's Modbus TCP stack is reported to become unresponsive when polled too fast; the Home Assistant integration polls
  every 30 s. Reads now and then answer busy / acknowledge (exception 5 or 6) or a truncated reply and succeed when retried.
- Writes to holding registers are confirmed with a different (internal) register address in the reply; the library treats
  such a reply as success.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
