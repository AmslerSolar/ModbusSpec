modbusspec: 0
id: foxess-h3
manufacturer: FoxESS
name: H3 Series Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/fox-ess-h3.yaml
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/fox_ess/fox_ess

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: H3-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: H3-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AC3-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AC3-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: SK-HWR-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: SK-HWR-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: STAR-H3-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: STAR-H3-
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: SP R
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - KH3
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: SP R
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - KH3
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: 'AX '
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - kW-3ph
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: 'AX '
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - kW-3ph
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AIO-H3-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AIO-H3-
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: 'Kuara '
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -3-H
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: 'Kuara '
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -3-H

defaults:
  verified: false
  sources:
  - foxess-modbus

models:
  - {id: h3_pre180, name: 'H3, AC3: manager firmware earlier than 1.80; SK-HWR, STAR-H3, SOLAVITA-SP, ATRONIX_AX: any firmware'}
  - {id: h3_180, name: 'H3, AC3: manager firmware 1.80 and later'}
  - {id: aio_h3_101, name: 'AIO-H3: manager firmware 1.1 and later'}
  - {id: kuara_h3, name: 'KUARA-H3: any firmware'}

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version, label: 'Version: Master', table: holding, address: 30016, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.slave_version, label: 'Version: Slave', table: holding, address: 30017, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.manager_version_hex, label: 'Version: Manager (hex)', table: holding, address: 30018, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 31000, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 31001, type: s16, unit: A, scale: 0.1}
  - {key: x.pv_power_1, label: PV power (part 1), table: holding, address: 31002, type: s16, unit: W, sources: [evcc, foxess-modbus, openwb]}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 31003, type: s16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 31004, type: s16, unit: A, scale: 0.1}
  - {key: x.pv_power_2, label: PV power (part 2), table: holding, address: 31005, type: s16, unit: W, sources: [evcc, foxess-modbus, openwb]}
