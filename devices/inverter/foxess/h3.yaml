  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}], sources: [evcc]}
  - {key: x.inverter_power, label: Inverter power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}], sources: [openwb]}
  - {key: x.counter_power, label: Counter power, unit: W, sum: [{key: x.grid_power_1, factor: -1}, {key: x.grid_power_2, factor: -1}, {key: x.grid_power_3, factor: -1}], sources: [openwb]}

flags:
  fault_word_1: {'0': Grid Lost Fault, '1': Grid Voltage Fault, '2': Grid Frequency Fault, '3': Grid 10min Voltage Fault, '4': EPS Voltage Fault, '5': Software Inverter Over-current Fault, '6': DCI Fault, '8': Hardware Inverter Over-current Fault, '9': Software Bus Voltage Fault, '10': Battery Voltage Fault, '11': Software Battery Over-current Fault, '12': Isolation Fault, '13': Residual Over-current Fault, '14': PV Voltage Fault, '15': Software PV Over-current Fault}
  fault_word_2: {'0': Inverter Temperature Fault, '1': Ground Connection Fault, '2': Inverter Overload Fault, '3': EPS Overload Fault, '4': Battery Power Low Fault, '5': Hardware Bus Voltage Fault, '6': Hardware PV Over-current Fault, '7': Hardware Battery Over-current Fault, '8': SCI Fault, '9': Master SPI Fault, '10': BMS Lost Fault}
  fault_word_3: {'0': Master Sample Detection Fault, '1': Residual Current Detection Fault, '2': Inverter EEPROM Fault, '3': PV Connection Direction Fault, '4': Battery Relay Open, '5': Battery Relay Short Circuit, '6': Battery Buck Fault, '7': Battery Boost Fault, '8': EPS Relay Fault, '9': Short EPS Load Fault, '10': Battery Connection Direction Fault, '11': Main Relay Open, '12': S1 Close Fault, '13': S2 Close Fault, '14': M1 Close Fault, '15': M2 Close Fault}
  fault_word_4: {'0': Grid Voltage Consistency Fault, '1': Grid Frequency Consistency Fault, '2': DCI Consistency Fault, '3': Residual Current Consistency Fault, '6': Slave SPI Fault, '7': Slave Sample Fault, '8': RDSP SPI Fault, '9': RDSP Sample Fault}
  fault_word_5: {'0': ARM EEPROM Fault, '1': Meter Lost Fault}
  fault_word_6: {'0': BMS External Fault, '1': BMS Internal Fault, '2': Battery Over-voltage, '3': Battery under-voltage, '4': BMS Charge Over-current, '5': BMS Discharge Over-current, '6': BMS Over-temperature, '7': BMS Under-temperature, '8': BMS Cell Imbalance, '9': BMS Hardware Protection Fault, '10': BMS Circuit Fault, '11': BMS Insulation Fault, '12': BMS Voltage Sensor Fault, '13': BMS Temperature Sensor Fault, '14': BMS Current Sensor Fault, '15': BMS Relay Fault}
  fault_word_7: {'0': BMS Type Mismatch, '1': BMS Version Mismatch, '2': BMS Manufacturer Mismatch, '3': BMS Software/Hardware Mismatch, '4': BMS Master/Slave Mismatch, '5': BMS Charge Request Not Acknowledged, '6': BMS Supply Fault, '8': BMS Self Check Fault, '9': BMS Cell Temperature Difference Fault, '10': BMS Cell Voltage Break Line Fault, '11': BMS Self Check Voltage Mismatch Fault, '12': BMS Precharge Fault, '13': BMS Self Check HVB Fault, '14': BMS Self Check Pack Current Fault, '15': BMS Self Check Sys Mismatch Fault}

notes:
- 'evcc template `fox-ess-h3` (grid, pv, battery) lists: FoxESS H3 Series Hybrid Inverter.'
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): H3 = H3-<kW>; AC3 = AC3-<kW>; SK-HWR = SK-HWR-<kW>; STAR-H3 = STAR-H3-<kW>; SOLAVITA-SP
  = SP R<n>KH3; ATRONIX_AX = AX <kW>kW-3ph; AIO-H3 = AIO-H3-<kW>; KUARA-H3 = Kuara <kW>-3-H.'
- 'Models are register-set variants by manager firmware version and model name. The project doesn''t detect the firmware:
  the user picks the manager version.'
- 'The project never reads registers in these ranges (H3_REGISTERS): 41001-41006, 41012-41013, 41015.'
- 'The project reads registers in these ranges one at a time (H3_REGISTERS): 41000-41999.'
- RS485 (AUX / meter port) at 9600 baud, directly or through an RS485-to-TCP adapter; the project uses the same map over the
  inverter's LAN port when no separate LAN map exists.
- The project reads at most 20 registers per request by default and up to 100 with some adapters and on a direct LAN connection.
- 'Fault words: the project hides Grid Voltage Fault and Grid Frequency Fault while Grid Lost Fault is set.'
- 'Grid CT power, battery power: the project splits the value by sign into feed-in / grid consumption and charge / discharge;
  that split gives the direction.'
- Identification as foxess-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
