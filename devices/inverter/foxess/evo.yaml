modbusspec: 0
id: foxess-evo
manufacturer: FoxESS
name: EVO
kind: inverter

sources:
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600

encoding:
  word_order: big

identify:
  any:
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: 'EVO '
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -H
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: 'EVO '
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -H

defaults:
  verified: false
  sources:
  - foxess-modbus

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version_hex, label: 'Version: Master (hex)', table: holding, address: 36001, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.slave_version_hex, label: 'Version: Slave (hex)', table: holding, address: 36002, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.manager_version_hex, label: 'Version: Manager (hex)', table: holding, address: 36003, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 39070, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 39071, type: s16, unit: A, scale: 0.01}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 39072, type: s16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 39073, type: s16, unit: A, scale: 0.01}
  - {key: x.pv3_voltage, label: PV3 Voltage, table: holding, address: 39074, type: s16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: PV3 Current, table: holding, address: 39075, type: s16, unit: A, scale: 0.01}
  - {key: l1_voltage, label: Grid Voltage R, table: holding, address: 39123, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Inverter Current R, table: holding, address: 39126, type: s32, unit: A, scale: 0.001}
  - {key: x.inv_power, label: Inverter Power, table: holding, address: 39134, type: s32, unit: W}
  - {key: frequency, label: Grid Frequency, table: holding, address: 39139, type: u16, unit: Hz, scale: 0.01}
  - {key: temperature, label: Inverter Temp, table: holding, address: 39141, type: s16, unit: °C, scale: 0.1}
  - {key: x.ambtemp, label: Ambient Temp, table: holding, address: 39142, type: s16, unit: °C, scale: 0.1}
  - {key: grid_power, label: Grid CT, table: holding, address: 39168, type: s32, unit: W, positive: export}
  - {key: x.eps_rvolt_r, label: EPS Voltage_R, table: holding, address: 39201, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_rcurrent_r, label: EPS Current R, table: holding, address: 39204, type: s32, unit: A, scale: 0.001}
  - {key: x.eps_frequency, label: EPS Frequency, table: holding, address: 39218, type: u16, unit: Hz, scale: 0.01}
  - {key: load_power, label: Load Power, table: holding, address: 39225, type: s32, unit: W}
  - {key: x.invbatvolt_1, label: Inverter Battery 1 Voltage, table: holding, address: 39227, type: s16, unit: V, scale: 0.1}
  - {key: x.invbatcurrent_1, label: Inverter Battery 1 Current, table: holding, address: 39228, type: s32, unit: A, scale: 0.001}
  - {key: x.invbatpower_1, label: Inverter Battery 1 Power, table: holding, address: 39230, type: s32, unit: W, note: Raw value positive = discharge}
  - {key: battery_power, label: Inverter Battery Power, table: holding, address: 39237, type: s32, unit: W, positive: discharge}
  - {key: x.pv1_power, label: PV1 Power, table: holding, address: 39279, type: s32, unit: W}
  - {key: x.pv2_power, label: PV2 Power, table: holding, address: 39281, type: s32, unit: W}
  - {key: x.pv3_power, label: PV3 Power, table: holding, address: 39283, type: s32, unit: W}
  - {key: battery_soh, label: Battery SoH, table: holding, address: 39423, type: u16, unit: '%'}
  - {key: pv_energy, label: Solar Generation Total, table: holding, address: 39601, type: u32, unit: kWh, scale: 0.01}
  - {key: pv_energy_today, label: Solar Generation Today, table: holding, address: 39603, type: u32, unit: kWh, scale: 0.01}
  - {key: x.battery_charge_total, label: Battery Charge Total, table: holding, address: 39605, type: u32, unit: kWh, scale: 0.01}
  - {key: x.battery_charge_today, label: Battery Charge Today, table: holding, address: 39607, type: s32, unit: kWh, scale: 0.01}
  - {key: x.battery_discharge_total, label: Battery Discharge Total, table: holding, address: 39609, type: u32, unit: kWh, scale: 0.01}
  - {key: x.battery_discharge_today, label: Battery Discharge Today, table: holding, address: 39611, type: s32, unit: kWh, scale: 0.01}
  - {key: grid_export_energy, label: Feed-in Total, table: holding, address: 39613, type: u32, unit: kWh, scale: 0.01}
  - {key: x.feed_in_energy_today, label: Feed-in Today, table: holding, address: 39615, type: s32, unit: kWh, scale: 0.01}
  - {key: grid_import_energy, label: Grid Consumption Total, table: holding, address: 39617, type: u32, unit: kWh, scale: 0.01}
  - {key: x.grid_consumption_energy_today, label: Grid Consumption Today, table: holding, address: 39619, type: s32, unit: kWh, scale: 0.01}
  - {key: x.total_yield_total, label: Yield Total, table: holding, address: 39621, type: u32, unit: kWh, scale: 0.01}
  - {key: x.total_yield_today, label: Yield Today, table: holding, address: 39623, type: s32, unit: kWh, scale: 0.01}
  - {key: x.input_energy_total, label: Input Energy Total, table: holding, address: 39625, type: u32, unit: kWh, scale: 0.01}
  - {key: x.input_energy_today, label: Input Energy Today, table: holding, address: 39627, type: s32, unit: kWh, scale: 0.01}
  - {key: x.load_power_total, label: Load Energy Total, table: holding, address: 39629, type: u32, unit: kWh, scale: 0.01}
  - {key: x.load_energy_today, label: Load Energy Today, table: holding, address: 39631, type: s32, unit: kWh, scale: 0.01}
  - {key: x.time_period_1_enable_charge_from_grid, label: Period 1 - Enable Charge from Grid, table: holding, address: 41001, type: u16, writable: true, note: '0 = off, 1 = on'}
  - {key: x.time_period_1_start, label: Period 1 - Start, table: holding, address: 41002, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_1_end, label: Period 1 - End, table: holding, address: 41003, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_2_enable_charge_from_grid, label: Period 2 - Enable Charge from Grid, table: holding, address: 41004, type: u16, writable: true, note: '0 = off, 1 = on'}
  - {key: x.time_period_2_start, label: Period 2 - Start, table: holding, address: 41005, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_2_end, label: Period 2 - End, table: holding, address: 41006, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.max_charge_current, label: Max Charge Current, table: holding, address: 46607, type: s16, unit: A, scale: 0.1, writable: true}
  - {key: x.max_discharge_current, label: Max Discharge Current, table: holding, address: 46608, type: s16, unit: A, scale: 0.1, writable: true}
  - {key: x.min_soc, label: Min SoC, table: holding, address: 46609, type: s16, unit: '%', writable: true}
  - {key: x.max_soc, label: Max SoC, table: holding, address: 46610, type: s16, unit: '%', writable: true}
  - {key: x.min_soc_on_grid, label: Min SoC (On Grid), table: holding, address: 46611, type: s16, unit: '%', writable: true}
  - {key: x.work_mode, label: Work Mode, table: holding, address: 49203, type: u16, enum: work_mode, writable: true}

enums:
  work_mode: {'1': Self Use, '2': Feed-in First, '3': Back-up, '4': Peak Shaving}

notes:
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): EVO = EVO <n>-<kW>-H.'
- RS485 (AUX / meter port) at 9600 baud, directly or through an RS485-to-TCP adapter; the project uses the same map over the
  inverter's LAN port when no separate LAN map exists.
- The project reads at most 20 registers per request by default and up to 100 with some adapters and on a direct LAN connection.
- 'Charge periods: the project treats a period as forced charge when start and end differ.'
- 'Grid CT power, battery power: the project splits the value by sign into feed-in / grid consumption and charge / discharge;
  that split gives the direction.'
- Identification as foxess-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
