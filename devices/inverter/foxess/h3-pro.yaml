modbusspec: 0
id: foxess-h3-pro
manufacturer: FoxESS
name: H3-Pro / P3-Pro
kind: inverter

sources:
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: H3-Pro-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: P3-Pro-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: H3-Pro-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: P3-Pro-

defaults:
  verified: false
  sources:
  - foxess-modbus

models:
  - {id: h3_pro_pre122, name: 'H3_PRO: manager firmware earlier than 1.22'}
  - {id: h3_pro_122, name: 'H3_PRO: manager firmware 1.22 and later'}

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version, label: 'Version: Master', table: holding, address: 36001, type: u16, models: [h3_pro_pre122], note: Version × 100 (144 = 1.44)}
  - {key: x.master_version_hex, label: 'Version: Master (hex)', table: holding, address: 36001, type: u16, models: [h3_pro_122], note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.slave_version, label: 'Version: Slave', table: holding, address: 36002, type: u16, models: [h3_pro_pre122], note: Version × 100 (144 = 1.44)}
  - {key: x.slave_version_hex, label: 'Version: Slave (hex)', table: holding, address: 36002, type: u16, models: [h3_pro_122], note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
