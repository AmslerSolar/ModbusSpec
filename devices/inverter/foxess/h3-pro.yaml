  work_mode: {'1': Self Use, '2': Feed-in First, '3': Back-up, '4': Peak Shaving}

flags:
  fault_word_1: {'0': PV Over-voltage, '1': DC arc fault, '2': String reverse connection, '7': Grid Lost Fault, '8': Grid Voltage Fault, '11': Grid Frequency Fault, '14': Output Over-current Fault, '15': Output DC Over-current Fault}
  fault_word_2: {'0': Residual Current Consistency Fault, '1': Ground Connection Fault, '2': Low Insulation Resistante Fault, '3': Inverter Over-temperature Fault, '9': Energy Storage Equipment Abnormal Fault, '10': Isolated Island Fault, '14': Off-grid Output Overload Fault}
  fault_word_3: {'3': External Fan Fault, '4': Energy Storage Reverse Connection Fault, '9': Meter Lost Fault, '10': BMS Lost Fault}
  status_1: {'0': Standby, '2': Operation, '6': Fault}

notes:
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): H3_PRO = H or P3-Pro-<kW>.'
- 'Models are register-set variants by manager firmware version. The project doesn''t detect the firmware: the user picks
  the manager version.'
- 'The project never reads registers in these ranges (H3_PRO_REGISTERS): 37633-37699, 41001-41006, 41012-41013, 41015.'
- 'The project reads registers in these ranges one at a time (H3_PRO_REGISTERS): 41000-41999.'
- RS485 (AUX / meter port) at 9600 baud, directly or through an RS485-to-TCP adapter; the project uses the same map over the
  inverter's LAN port when no separate LAN map exists.
- The project reads at most 20 registers per request by default and up to 100 with some adapters and on a direct LAN connection.
- 'Grid CT power, battery power: the project splits the value by sign into feed-in / grid consumption and charge / discharge;
  that split gives the direction.'
- Identification as foxess-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
