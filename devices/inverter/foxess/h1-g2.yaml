modbusspec: 0
id: foxess-h1-g2
manufacturer: FoxESS
name: H1 G2 / AC1 G2 / P1
kind: inverter

sources:
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600

encoding:
  word_order: big

identify:
  any:
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: H1-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -G2
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: H1-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -G2
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: AC1-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -E-G2
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: AC1-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -E-G2
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: P1-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -E
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: P1-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -E

defaults:
  verified: false
  sources:
  - foxess-modbus

models:
  - {id: h1_g2_144, name: 'H1_G2, AC1_G2, P1: manager firmware 1.44 and later'}

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: l1_voltage, label: Grid Voltage, table: holding, address: 31006, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Inverter Current, table: holding, address: 31007, type: s16, unit: A, scale: 0.1}
  - {key: x.rpower, label: Inverter Power, table: holding, address: 31008, type: s16, unit: W}
  - {key: frequency, label: Grid Frequency, table: holding, address: 31009, type: u16, unit: Hz, scale: 0.01}
  - {key: x.eps_rvolt, label: EPS Voltage, table: holding, address: 31010, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_rcurrent, label: EPS Current, table: holding, address: 31011, type: s16, unit: A, scale: 0.1}
  - {key: x.eps_rpower, label: EPS Power, table: holding, address: 31012, type: s16, unit: W}
  - {key: x.eps_frequency, label: EPS Frequency, table: holding, address: 31013, type: u16, unit: Hz, scale: 0.01}
  - {key: grid_power, label: Grid CT, table: holding, address: 31014, type: s16, unit: W, positive: export}
  - {key: x.ct2_meter, label: CT2 Meter, table: holding, address: 31015, type: s16, unit: W}
  - {key: load_power, label: Load Power, table: holding, address: 31016, type: s16, unit: W}
  - {key: temperature, label: Inverter Temp, table: holding, address: 31018, type: s16, unit: °C, scale: 0.1}
  - {key: x.ambtemp, label: Ambient Temp, table: holding, address: 31019, type: s16, unit: °C, scale: 0.1}
  - {key: x.invbatvolt, label: Inverter Battery Voltage, table: holding, address: 31020, type: s16, unit: V, scale: 0.1}
  - {key: x.invbatcurrent, label: Inverter Battery Current, table: holding, address: 31021, type: s16, unit: A, scale: 0.1}
  - {key: battery_power, label: Inverter Battery Power, table: holding, address: 31022, type: s16, unit: W, positive: discharge}
  - {key: battery_temperature, label: Battery Temp, table: holding, address: 31023, type: s16, unit: °C, scale: 0.1}
  - {key: battery_soc, label: Battery SoC, table: holding, address: 31024, type: u16, unit: '%'}
  - {key: x.bms_charge_rate, label: BMS Charge Rate, table: holding, address: 31025, type: u16, unit: A, scale: 0.1}
  - {key: x.bms_discharge_rate, label: BMS Discharge Rate, table: holding, address: 31026, type: u16, unit: A, scale: 0.1}
  - {key: pv_energy, label: Solar Generation Total, table: holding, address: 32000, type: u32, unit: kWh, scale: 0.1}
  - {key: pv_energy_today, label: Solar Generation Today, table: holding, address: 32002, type: u16, unit: kWh, scale: 0.1}
  - {key: x.battery_charge_total, label: Battery Charge Total, table: holding, address: 32003, type: u32, unit: kWh, scale: 0.1}
  - {key: x.battery_charge_today, label: Battery Charge Today, table: holding, address: 32005, type: s16, unit: kWh, scale: 0.1}
  - {key: x.battery_discharge_total, label: Battery Discharge Total, table: holding, address: 32006, type: u32, unit: kWh, scale: 0.1}
  - {key: x.battery_discharge_today, label: Battery Discharge Today, table: holding, address: 32008, type: s16, unit: kWh, scale: 0.1}
  - {key: grid_export_energy, label: Feed-in Total, table: holding, address: 32009, type: u32, unit: kWh, scale: 0.1}
  - {key: x.feed_in_energy_today, label: Feed-in Today, table: holding, address: 32011, type: s16, unit: kWh, scale: 0.1}
  - {key: grid_import_energy, label: Grid Consumption Total, table: holding, address: 32012, type: u32, unit: kWh, scale: 0.1}
  - {key: x.grid_consumption_energy_today, label: Grid Consumption Today, table: holding, address: 32014, type: s16, unit: kWh, scale: 0.1}
  - {key: x.total_yield_total, label: Yield Total, table: holding, address: 32015, type: u32, unit: kWh, scale: 0.1}
  - {key: x.total_yield_today, label: Yield Today, table: holding, address: 32017, type: s16, unit: kWh, scale: 0.1}
  - {key: x.input_energy_total, label: Input Energy Total, table: holding, address: 32018, type: u32, unit: kWh, scale: 0.1}
  - {key: x.input_energy_today, label: Input Energy Today, table: holding, address: 32020, type: s16, unit: kWh, scale: 0.1}
  - {key: x.load_power_total, label: Load Energy Total, table: holding, address: 32021, type: u32, unit: kWh, scale: 0.1}
  - {key: x.load_energy_today, label: Load Energy Today, table: holding, address: 32023, type: s16, unit: kWh, scale: 0.1}
  - {key: x.master_version_hex, label: 'Version: Master (hex)', table: holding, address: 36001, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.slave_version_hex, label: 'Version: Slave (hex)', table: holding, address: 36002, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.manager_version_hex, label: 'Version: Manager (hex)', table: holding, address: 36003, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 37609, type: s16, unit: V, scale: 0.1, models: [h1_g2_144]}
  - {key: x.bat_current, label: Battery Current, table: holding, address: 37610, type: s16, unit: A, scale: 0.1, models: [h1_g2_144]}
  - {key: x.bms_cell_temp_high, label: BMS Cell Temp High, table: holding, address: 37617, type: s16, unit: °C, scale: 0.1, models: [h1_g2_144]}
  - {key: x.bms_cell_temp_low, label: BMS Cell Temp Low, table: holding, address: 37618, type: s16, unit: °C, scale: 0.1, models: [h1_g2_144]}
  - {key: x.bms_cell_mv_high, label: BMS Cell mV High, table: holding, address: 37619, type: u16, unit: V, scale: 0.001, models: [h1_g2_144]}
  - {key: x.bms_cell_mv_low, label: BMS Cell mV Low, table: holding, address: 37620, type: u16, unit: V, scale: 0.001, models: [h1_g2_144]}
  - {key: battery_soh, label: Battery SoH, table: holding, address: 37624, type: u16, unit: '%', models: [h1_g2_144]}
  - {key: x.bms_kwh_remaining, label: BMS kWh Remaining, table: holding, address: 37632, type: u16, unit: kWh, scale: 0.01}
  - {key: x.status_1, label: Status 1, table: holding, address: 39063, type: u16, flags: status_1, note: 'The project shows Fault (bit 6), else Off grid (status 3), else On grid (bit 2), else Standby (bit 0)'}
  - {key: x.status_3_grid_mode, label: 'Status 3: on / off grid', table: holding, address: 39065, type: u16, bits: [0, 0], enum: grid_mode}
  - {key: x.fault_word_1, label: Inverter Fault Code (word 1 of 3), table: holding, address: 39067, type: u16, flags: fault_word_1, models: [h1_g2_144]}
  - {key: x.fault_word_2, label: Inverter Fault Code (word 2 of 3), table: holding, address: 39068, type: u16, flags: fault_word_2, models: [h1_g2_144]}
  - {key: x.fault_word_3, label: Inverter Fault Code (word 3 of 3), table: holding, address: 39069, type: u16, flags: fault_word_3, models: [h1_g2_144]}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 39070, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 39071, type: s16, unit: A, scale: 0.01}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 39072, type: s16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 39073, type: s16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: PV1 Power, table: holding, address: 39280, type: s16, unit: W}
  - {key: x.pv2_power, label: PV2 Power, table: holding, address: 39282, type: s16, unit: W}
  - {key: x.work_mode, label: Work Mode, table: holding, address: 41000, type: u16, enum: work_mode, writable: true}
  - {key: x.time_period_1_enable_charge_from_grid, label: Period 1 - Enable Charge from Grid, table: holding, address: 41001, type: u16, writable: true, note: '0 = off, 1 = on'}
  - {key: x.time_period_1_start, label: Period 1 - Start, table: holding, address: 41002, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_1_end, label: Period 1 - End, table: holding, address: 41003, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_2_enable_charge_from_grid, label: Period 2 - Enable Charge from Grid, table: holding, address: 41004, type: u16, writable: true, note: '0 = off, 1 = on'}
  - {key: x.time_period_2_start, label: Period 2 - Start, table: holding, address: 41005, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.time_period_2_end, label: Period 2 - End, table: holding, address: 41006, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}}, writable: true}
  - {key: x.max_charge_current, label: Max Charge Current, table: holding, address: 41007, type: s16, unit: A, scale: 0.1, writable: true}
  - {key: x.max_discharge_current, label: Max Discharge Current, table: holding, address: 41008, type: s16, unit: A, scale: 0.1, writable: true}
  - {key: x.min_soc, label: Min SoC, table: holding, address: 41009, type: s16, unit: '%', writable: true}
  - {key: x.max_soc, label: Max SoC, table: holding, address: 41010, type: s16, unit: '%', writable: true}
  - {key: x.min_soc_on_grid, label: Min SoC (On Grid), table: holding, address: 41011, type: s16, unit: '%', writable: true}
  - {key: x.remote_enable, label: Remote control enable, table: holding, address: 44000, type: u16, writable: true, note: The project writes 1 to start and 0 to stop remote control}
  - {key: x.remote_timeout_set, label: Remote control timeout, table: holding, address: 44001, type: u16, writable: true, note: The project writes twice its poll interval}
  - {key: x.remote_active_power, label: Remote control active power, table: holding, address: 44002, type: s16, unit: W, writable: true, note: 'Power target in W the project writes; positive = discharge / export, negative = charge / import'}

enums:
  grid_mode: {'0': On grid, '1': Off grid}
  work_mode: {'0': Self Use, '1': Feed-in First, '2': Back-up, '4': Peak Shaving}

flags:
  status_1: {'0': Standby, '2': Operation, '6': Fault}
  fault_word_1: {'0': PV Over-voltage, '1': DC arc fault, '2': String reverse connection, '7': Grid Lost Fault, '8': Grid Voltage Fault, '11': Grid Frequency Fault, '14': Output Over-current Fault, '15': Output DC Over-current Fault}
  fault_word_2: {'0': Residual Current Consistency Fault, '1': Ground Connection Fault, '2': Low Insulation Resistante Fault, '3': Inverter Over-temperature Fault, '9': Energy Storage Equipment Abnormal Fault, '10': Isolated Island Fault, '14': Off-grid Output Overload Fault}
  fault_word_3: {'3': External Fan Fault, '4': Energy Storage Reverse Connection Fault, '9': Meter Lost Fault, '10': BMS Lost Fault}

notes:
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): H1_G2 = H1-<kW>-E[digit]-G2; AC1_G2 = AC1-<kW>-E-G2; P1 = P1-<kW>-E.'
- 'Models are register-set variants by manager firmware version. The project doesn''t detect the firmware: the user picks
  the manager version.'
- 'The project reads registers in these ranges one at a time (H1_G2_REGISTERS): 41000-41999.'
- RS485 (AUX / meter port) at 9600 baud, directly or through an RS485-to-TCP adapter; the project uses the same map over the
  inverter's LAN port when no separate LAN map exists.
- The project reads at most 20 registers per request by default and up to 100 with some adapters and on a direct LAN connection.
- 'Charge periods: the project treats a period as forced charge when start and end differ.'
- 'Grid CT power, battery power: the project splits the value by sign into feed-in / grid consumption and charge / discharge;
  that split gives the direction.'
- Identification as foxess-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
