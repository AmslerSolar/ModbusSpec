derived:
  - {key: x.grid_power, label: Grid power, unit: W, sum: [{key: x.grid_power_1, factor: -1}, {key: x.grid_power_2, factor: -1}, {key: x.grid_power_3, factor: -1}], sources: [evcc]}
  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}, {key: x.pv_power_3}, {key: x.pv_power_4}, {key: x.pv_power_5}, {key: x.pv_power_6}], sources: [evcc]}
  - {key: x.inverter_power, label: Inverter power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}, {key: x.pv_power_3}, {key: x.pv_power_4}, {key: x.pv_power_5}, {key: x.pv_power_6}], sources: [openwb]}

enums:
  grid_mode: {'0': On grid, '1': Off grid}

flags:
  fault_word_1: {'0': PV Over-voltage, '1': DC arc fault, '2': String reverse connection, '7': Grid Lost Fault, '8': Grid Voltage Fault, '11': Grid Frequency Fault, '14': Output Over-current Fault, '15': Output DC Over-current Fault}
  fault_word_2: {'0': Residual Current Consistency Fault, '1': Ground Connection Fault, '2': Low Insulation Resistante Fault, '3': Inverter Over-temperature Fault, '9': Energy Storage Equipment Abnormal Fault, '10': Isolated Island Fault, '14': Off-grid Output Overload Fault}
  fault_word_3: {'3': External Fan Fault, '4': Energy Storage Reverse Connection Fault, '9': Meter Lost Fault, '10': BMS Lost Fault}
  status_1: {'0': Standby, '2': Operation, '6': Fault}

notes:
- 'evcc template `fox-ess-h3-smart` (grid, pv, battery) lists: FoxESS H3-Pro/Smart Series Hybrid Inverter; A-Tronix AX Plus
  Hybrid Inverter.'
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): H3_SMART = H3-<kW>-Smart or -M; P3_SMART = P3-<kW>-SH<digit>*; SK-HWR-SMART = SK-HWR-<kW>
  SMART; ENPAL_IX = I-X<kW>; 1KOMMA5 = 1K5-HI-<n>-V1.'
- 'The project never reads registers in these ranges (H3_SMART_REGISTERS): 41001-41006, 41012-41013, 41015.'
- 'The project reads registers in these ranges one at a time (H3_SMART_REGISTERS): 37609-37620, 37632-37636.'
