modbusspec: 0
id: foxess-h3-smart
manufacturer: FoxESS
name: H3-Pro/Smart Series Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/fox-ess-h3-smart.yaml
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/fox_ess/fox_ess_h3_smart

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

identify:
  any:
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: H3-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -Smart
      - -M
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: H3-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -Smart
      - -M
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: P3-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -SH
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: P3-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -SH
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: SK-HWR-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - ' SMART'
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: SK-HWR-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - ' SMART'
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: I-X
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: I-X
  - - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      prefix: 1K5-HI-
    - table: holding
      address: 30000
      type: str
      length: 15
      chars: low
      contains:
      - -V1
  - - table: holding
      address: 30000
      type: str
      length: 15
      prefix: 1K5-HI-
    - table: holding
      address: 30000
      type: str
      length: 15
      contains:
      - -V1

defaults:
  verified: false
  sources:
  - foxess-modbus

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version_hex, label: 'Version: Master (hex)', table: holding, address: 36001, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.slave_version_hex, label: 'Version: Slave (hex)', table: holding, address: 36002, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.manager_version_hex, label: 'Version: Manager (hex)', table: holding, address: 36003, type: u16, note: 'Version as hex digits: high byte major, low byte minor (0x0144 = 1.44)'}
  - {key: x.batvolt_1, label: Battery 1 Voltage, table: holding, address: 37609, type: s16, unit: V, scale: 0.1}
  - {key: x.bat_current_1, label: Battery 1 Current, table: holding, address: 37610, type: s16, unit: A, scale: 0.1}
  - {key: x.battery_temp_1, label: Battery 1 Temp, table: holding, address: 37611, type: s16, unit: °C, scale: 0.1}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 37612, type: s16, unit: '%', sources: [evcc, openwb], conflicts: [{sources: [foxess-modbus], type: u16, label: Battery 1 SoC}]}
  - {key: x.bms_cell_temp_high_1, label: BMS 1 Cell Temp High, table: holding, address: 37617, type: s16, unit: °C, scale: 0.1}
  - {key: x.bms_cell_temp_low_1, label: BMS 1 Cell Temp Low, table: holding, address: 37618, type: s16, unit: °C, scale: 0.1}
  - {key: x.bms_cell_mv_high_1, label: BMS 1 Cell mV High, table: holding, address: 37619, type: u16, unit: V, scale: 0.001}
  - {key: x.bms_cell_mv_low_1, label: BMS 1 Cell mV Low, table: holding, address: 37620, type: u16, unit: V, scale: 0.001}
  - {key: x.battery_soh_1, label: Battery 1 SoH, table: holding, address: 37624, type: u16, unit: '%'}
  - {key: x.bms_kwh_remaining_1, label: BMS 1 kWh Remaining, table: holding, address: 37632, type: u16, unit: kWh, scale: 0.01}
