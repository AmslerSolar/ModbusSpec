  - {key: x.bms_cell_temp_high_2, label: BMS 2 Cell Temp High, table: holding, address: 38315, type: s16, unit: °C, scale: 0.1}
  - {key: x.bms_cell_temp_low_2, label: BMS 2 Cell Temp Low, table: holding, address: 38316, type: s16, unit: °C, scale: 0.1}
  - {key: x.bms_cell_mv_high_2, label: BMS 2 Cell mV High, table: holding, address: 38317, type: u16, unit: V, scale: 0.001}
  - {key: x.bms_cell_mv_low_2, label: BMS 2 Cell mV Low, table: holding, address: 38318, type: u16, unit: V, scale: 0.001}
  - {key: x.battery_soh_2, label: Battery 2 SoH, table: holding, address: 38322, type: u16, unit: '%'}
