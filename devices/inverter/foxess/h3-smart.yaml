  - {key: x.grid_power_1, label: Grid power (part 1), table: holding, address: 38816, type: s32, unit: W, scale: 0.1, note: evcc negates it for the grid power., sources: [evcc, foxess-modbus, openwb]}
  - {key: x.grid_power_2, label: Grid power (part 2), table: holding, address: 38818, type: s32, unit: W, scale: 0.1, note: evcc negates it for the grid power., sources: [evcc, foxess-modbus, openwb]}
