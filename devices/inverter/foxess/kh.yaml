modbusspec: 0
id: foxess-kh
manufacturer: FoxESS
name: KH
kind: inverter

sources:
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: KH
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: KH

defaults:
  verified: false
  sources:
  - foxess-modbus

models:
  - {id: kh_pre133, name: 'KH: manager firmware earlier than 1.33'}
  - {id: kh_133, name: 'KH: manager firmware 1.33 and later'}

