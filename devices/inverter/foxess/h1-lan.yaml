modbusspec: 0
id: foxess-h1-lan
manufacturer: FoxESS
name: H1 Series Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/fox-ess-h1.yaml
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AC1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AC1-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AIO-H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AIO-H1-

defaults:
  verified: false
  sources:
  - foxess-modbus

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version, label: 'Version: Master', table: holding, address: 30016, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.slave_version, label: 'Version: Slave', table: holding, address: 30017, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.manager_version, label: 'Version: Manager', table: holding, address: 30018, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 31000, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 31001, type: s16, unit: A, scale: 0.1}
  - {key: x.pv_power_1, label: PV power (part 1), table: holding, address: 31002, type: s16, unit: W, sources: [evcc, foxess-modbus]}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 31003, type: s16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 31004, type: s16, unit: A, scale: 0.1}
  - {key: x.pv_power_2, label: PV power (part 2), table: holding, address: 31005, type: s16, unit: W, sources: [evcc, foxess-modbus]}
  - {key: l1_voltage, label: Grid Voltage, table: holding, address: 31006, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Inverter Current, table: holding, address: 31007, type: s16, unit: A, scale: 0.1}
  - {key: x.rpower, label: Inverter Power, table: holding, address: 31008, type: s16, unit: W}
  - {key: frequency, label: Grid Frequency, table: holding, address: 31009, type: u16, unit: Hz, scale: 0.01}
  - {key: x.eps_rvolt, label: EPS Voltage, table: holding, address: 31010, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_rcurrent, label: EPS Current, table: holding, address: 31011, type: s16, unit: A, scale: 0.1}
  - {key: x.eps_rpower, label: EPS Power, table: holding, address: 31012, type: s16, unit: W}
  - {key: x.eps_frequency, label: EPS Frequency, table: holding, address: 31013, type: u16, unit: Hz, scale: 0.01}
  - {key: grid_power, label: Grid CT, table: holding, address: 31014, type: s16, unit: W, positive: export}
  - {key: x.ct2_meter, label: CT2 Meter, table: holding, address: 31015, type: s16, unit: W}
  - {key: load_power, label: Load Power, table: holding, address: 31016, type: s16, unit: W}
  - {key: temperature, label: Inverter Temp, table: holding, address: 31018, type: s16, unit: °C, scale: 0.1}
  - {key: x.ambtemp, label: Ambient Temp, table: holding, address: 31019, type: s16, unit: °C, scale: 0.1}
  - {key: x.invbatvolt, label: Inverter Battery Voltage, table: holding, address: 31020, type: s16, unit: V, scale: 0.1}
  - {key: x.invbatcurrent, label: Inverter Battery Current, table: holding, address: 31021, type: s16, unit: A, scale: 0.1}
  - {key: battery_power, label: Battery power, table: holding, address: 31022, type: s16, unit: W, positive: discharge, sources: [evcc, foxess-modbus]}
  - {key: battery_temperature, label: Battery Temp, table: holding, address: 31023, type: s16, unit: °C, scale: 0.1}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 31024, type: s16, unit: '%', sources: [evcc], conflicts: [{sources: [foxess-modbus], type: u16, label: Battery SoC}]}
  - {key: x.bms_charge_rate, label: BMS Charge Rate, table: holding, address: 31025, type: u16, unit: A, scale: 0.1}
  - {key: x.bms_discharge_rate, label: BMS Discharge Rate, table: holding, address: 31026, type: u16, unit: A, scale: 0.1}
  - {key: state, label: Inverter State, table: holding, address: 31027, type: u16, enum: inverter_state}
  - {key: x.fault_word_1, label: Inverter Fault Code (word 1 of 7), table: holding, address: 31031, type: u16, flags: fault_word_1}
  - {key: x.fault_word_2, label: Inverter Fault Code (word 2 of 7), table: holding, address: 31032, type: u16, flags: fault_word_2}
  - {key: x.fault_word_3, label: Inverter Fault Code (word 3 of 7), table: holding, address: 31034, type: u16, flags: fault_word_3}
  - {key: x.fault_word_4, label: Inverter Fault Code (word 4 of 7), table: holding, address: 31035, type: u16, flags: fault_word_4}
  - {key: x.fault_word_5, label: Inverter Fault Code (word 5 of 7), table: holding, address: 31036, type: u16, flags: fault_word_5}
  - {key: x.fault_word_6, label: Inverter Fault Code (word 6 of 7), table: holding, address: 31037, type: u16, flags: fault_word_6}
  - {key: x.fault_word_7, label: Inverter Fault Code (word 7 of 7), table: holding, address: 31038, type: u16, flags: fault_word_7}
  - {key: x.remote_enable, label: Remote control enable, table: holding, address: 44000, type: u16, writable: true, note: The project writes 1 to start and 0 to stop remote control}
  - {key: x.remote_timeout_set, label: Remote control timeout, table: holding, address: 44001, type: u16, writable: true, note: The project writes twice its poll interval}
  - {key: x.remote_active_power, label: Remote control active power, table: holding, address: 44002, type: s16, unit: W, writable: true, note: 'Power target in W the project writes; positive = discharge / export, negative = charge / import'}

derived:
  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}], sources: [evcc]}

enums:
  inverter_state: {'0': Waiting, '1': Checking, '2': On Grid, '3': Off Grid / EPS, '4': Recoverable Fault, '5': Unrecoverable Fault}

flags:
  fault_word_1: {'0': Grid Lost Fault, '1': Grid Voltage Fault, '2': Grid Frequency Fault, '3': Grid 10min Voltage Fault, '4': EPS Voltage Fault, '5': Software Inverter Over-current Fault, '6': DCI Fault, '8': Hardware Inverter Over-current Fault, '9': Software Bus Voltage Fault, '10': Battery Voltage Fault, '11': Software Battery Over-current Fault, '12': Isolation Fault, '13': Residual Over-current Fault, '14': PV Voltage Fault, '15': Software PV Over-current Fault}
  fault_word_2: {'0': Inverter Temperature Fault, '1': Ground Connection Fault, '2': Inverter Overload Fault, '3': EPS Overload Fault, '4': Battery Power Low Fault, '5': Hardware Bus Voltage Fault, '6': Hardware PV Over-current Fault, '7': Hardware Battery Over-current Fault, '8': SCI Fault, '9': Master SPI Fault, '10': BMS Lost Fault}
  fault_word_3: {'0': Master Sample Detection Fault, '1': Residual Current Detection Fault, '2': Inverter EEPROM Fault, '3': PV Connection Direction Fault, '4': Battery Relay Open, '5': Battery Relay Short Circuit, '6': Battery Buck Fault, '7': Battery Boost Fault, '8': EPS Relay Fault, '9': Short EPS Load Fault, '10': Battery Connection Direction Fault, '11': Main Relay Open, '12': S1 Close Fault, '13': S2 Close Fault, '14': M1 Close Fault, '15': M2 Close Fault}
  fault_word_4: {'0': Grid Voltage Consistency Fault, '1': Grid Frequency Consistency Fault, '2': DCI Consistency Fault, '3': Residual Current Consistency Fault, '6': Slave SPI Fault, '7': Slave Sample Fault, '8': RDSP SPI Fault, '9': RDSP Sample Fault}
  fault_word_5: {'0': ARM EEPROM Fault, '1': Meter Lost Fault}
  fault_word_6: {'0': BMS External Fault, '1': BMS Internal Fault, '2': Battery Over-voltage, '3': Battery under-voltage, '4': BMS Charge Over-current, '5': BMS Discharge Over-current, '6': BMS Over-temperature, '7': BMS Under-temperature, '8': BMS Cell Imbalance, '9': BMS Hardware Protection Fault, '10': BMS Circuit Fault, '11': BMS Insulation Fault, '12': BMS Voltage Sensor Fault, '13': BMS Temperature Sensor Fault, '14': BMS Current Sensor Fault, '15': BMS Relay Fault}
  fault_word_7: {'0': BMS Type Mismatch, '1': BMS Version Mismatch, '2': BMS Manufacturer Mismatch, '3': BMS Software/Hardware Mismatch, '4': BMS Master/Slave Mismatch, '5': BMS Charge Request Not Acknowledged, '6': BMS Supply Fault, '8': BMS Self Check Fault, '9': BMS Cell Temperature Difference Fault, '10': BMS Cell Voltage Break Line Fault, '11': BMS Self Check Voltage Mismatch Fault, '12': BMS Precharge Fault, '13': BMS Self Check HVB Fault, '14': BMS Self Check Pack Current Fault, '15': BMS Self Check Sys Mismatch Fault}

notes:
- 'evcc template `fox-ess-h1` (pv, battery) lists: FoxESS H1 Series Hybrid Inverter.'
- 'Model detection: the project reads the model name at holding registers 30000-30014 and matches it in this order (first
  match wins; <kW> is the power in kW): H1 = H1-<kW>; AC1 = AC1-<kW>; AIO-H1 = AIO-H1-<kW>.'
- The project reads at most 20 registers per request by default and up to 100 with some adapters and on a direct LAN connection.
- 'Fault words: the project hides Grid Voltage Fault and Grid Frequency Fault while Grid Lost Fault is set.'
- 'Grid CT power, battery power: the project splits the value by sign into feed-in / grid consumption and charge / discharge;
  that split gives the direction.'
- Identification as foxess-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
