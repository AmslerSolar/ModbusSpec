modbusspec: 0
id: foxess-h1
manufacturer: FoxESS
name: H1 / AC1 / AIO-H1 / AIO-AC1 (1st generation), RS485
kind: inverter

sources:
- id: foxess-modbus
  title: foxess_modbus (Home Assistant integration)
  url: https://github.com/nathanmarlor/foxess_modbus
  license: MIT
  commit: 90046fec051a6839bcfb468d4b4f340a89f721c8
  path: custom_components/foxess_modbus/entities/entity_descriptions.py, custom_components/foxess_modbus/inverter_profiles.py,
    custom_components/foxess_modbus/entities/remote_control_description.py, tests/__snapshots__/test_entity_descriptions

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AC1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AC1-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AIO-H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AIO-H1-
  - table: holding
    address: 30000
    type: str
    length: 15
    chars: low
    prefix: AIO-AC1-
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: AIO-AC1-

defaults:
  verified: false
  sources:
  - foxess-modbus

points:
  - {key: x.model_name, label: Model name, table: holding, address: 30000, type: str, length: 15, note: 'One ASCII character per register on most models, two per register (high byte first) on others (e.g. H1 G2, H3-Pro); the H3 starts with a space'}
  - {key: x.master_version, label: 'Version: Master', table: input, address: 10016, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.slave_version, label: 'Version: Slave', table: input, address: 10017, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.manager_version, label: 'Version: Manager', table: input, address: 10018, type: u16, note: Version × 100 (144 = 1.44)}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 11000, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 11001, type: s16, unit: A, scale: 0.1}
