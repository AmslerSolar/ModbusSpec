modbusspec: 0
id: qcells-ess
manufacturer: Q CELLS
name: Q.HOME ESS hybrid inverter
kind: inverter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/qcells/qcells

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: x.bat_write_124, label: Battery register 124, table: holding, address: 124, type: u16, writable: true, note: openWB writes 0 here (and computed values).}
  - {key: x.inverter_power_3, label: Inverter power (part), table: input, address: 3, type: s16, note: openWB computes the inverter power from this register with further arithmetic (sign from status bits or similar).}
  - {key: x.inverter_power_4, label: Inverter power (part), table: input, address: 4, type: s16, note: openWB computes the inverter power from this register with further arithmetic (sign from status bits or similar).}
  - {key: x.inverter_power_string1_factor, label: Inverter power string1 factor, table: input, address: 5, type: s16}
  - {key: x.inverter_power_string2_factor, label: Inverter power string2 factor, table: input, address: 6, type: s16}
  - {key: x.counter_frequency, label: Counter frequency, table: input, address: 7, type: u16, unit: Hz, scale: 0.01}
  - {key: battery_power, label: Battery power, table: input, address: 22, type: s16, unit: W, positive: charge}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 28, type: u16, unit: '%'}
  - {key: x.bat_exported, label: Battery exported energy, table: input, address: 29, type: u16, unit: kWh, scale: 0.1}
  - {key: x.bat_imported, label: Battery imported energy, table: input, address: 33, type: u16, unit: kWh, scale: 0.1}
  - {key: grid_power, label: Counter power, table: input, address: 70, type: s32, unit: W, positive: export}
  - {key: grid_export_energy, label: Counter exported energy, table: input, address: 72, type: u32, unit: kWh, scale: 0.01}
  - {key: grid_import_energy, label: Counter imported energy, table: input, address: 74, type: u32, unit: kWh, scale: 0.01}
  - {key: x.counter_voltages_l1, label: Counter voltage L1, table: input, address: 106, type: u16, unit: V, scale: 0.1}
  - {key: x.counter_voltages_l2, label: Counter voltage L2, table: input, address: 110, type: u16, unit: V, scale: 0.1}
  - {key: x.counter_voltages_l3, label: Counter voltage L3, table: input, address: 114, type: u16, unit: V, scale: 0.1}
  - {key: x.counter_powers_l1, label: Counter power L1, table: input, address: 130, type: s32, unit: W, note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l2, label: Counter power L2, table: input, address: 132, type: s32, unit: W, note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l3, label: Counter power L3, table: input, address: 134, type: s32, unit: W, note: Raw > 0 = export (openWB's sign handling).}
  - {key: pv_energy, label: Inverter exported energy, table: input, address: 148, type: u32, unit: kWh, scale: 0.1}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
