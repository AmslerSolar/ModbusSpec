notes:
- All registers are holding registers (function 03); addresses are 0-based as sent on the wire. 32-bit vendor values are high
  word first.
- 'SunSpec map at 0x9C40: Common (1) at 0x9C42, inverter model 103 at 0x9C86, multiple MPPT model 160 at 0x9CBA (two inputs),
  end marker at 0x9CEC. The Common model''s length register says 65 although a pad register at 0x9C85 makes it 66: a reader
  walking the chain with 65 lands on the pad register. Use 66 when 0x9C43 reads 65 and 0x9C86 holds 103.'
- Model 103 gives AC power, VA and var in 100 W steps and has no DC power; solar power is the sum of the two MPPT inputs (pv_power
  under derived, 1 W) and the yield comes from the vendor counters (0x0802 lifetime, 0x0804 today).
- Model 160's input IDs read 161 / 162 (inputs 1 and 2 here).
- Unused addresses read 0xFF bytes without an exception, so reads may span gaps.
- 'Problems from the alarm code (0x1828): any other non-zero code not listed counts as a fault; the internal events (7000,
  8000, 9000) and the PV under-voltage / low power codes (2631, 4656, 4657, 4700), which also appear at dawn and dusk, are
  not problems.'
- The inverter can be identified by a manufacturer containing "Schneider" (any case); the CL map shows "SCHNEIDER", the CL
  60 map "Schneider Electric".
- Evt1 and DCEvt bit meanings come from the SunSpec models; this map marks both as not available on the CL. DCEvt bit 21 (input
  under-voltage) is normal at dusk and not reported.
- There is no grid meter; grid and house consumption come from another device.
