# Written from Schneider Electric's Modbus Registers Map – Conext CL Three Phase PV Inverter 20/25kVA (503-0243-01-01, 1.5) and the SunSpec models workbook.

modbusspec: 0
id: schneider-conext-cl
manufacturer: Schneider Electric
name: Conext CL 18 / 20 / 25 (NA and E) PV inverters
kind: inverter

sources:
- title: Modbus Registers Map – Conext CL Three Phase PV Inverter 20/25kVA (503-0243-01-01)
  version: 1.5 (2016-03-15)
  url: https://solar.se.com/au/wp-content/uploads/sites/3/2021/11/Conext-CL_Modbus-Registers-Map_Rev1.5.pdf
  sha256: bfcf85406df277367a8c26d2dea5f26f6a7094bfb0cb7198cb1f871e716ce8c2
- title: SunSpec models workbook (official model definitions)
  url: https://github.com/sunspec/models/raw/master/models_workbook.xlsx

connection:
  default_port: 502
  default_unit: 10
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    max_gap: 8

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: SCHNEIDER
  - table: holding
    address: 40070
    type: u16
    equals: 103

sunspec: true

points:
  # SunSpec Common model (1) at 0x9C42
  - {key: x.common_length, label: C_SunSpec_Length, table: holding, address: 40003, type: u16, poll: slow, note: 'Says 65, but a pad register (0x9C85) follows, so model 103 starts at 0x9C86 (66 registers).'}
  - {key: x.manufacturer, label: C_Manufacturer, table: holding, address: 40004, type: str, length: 16, poll: slow}
  - {key: x.model, label: C_Model, table: holding, address: 40020, type: str, length: 16, poll: slow}
  - {key: x.options, label: C_Options, table: holding, address: 40036, type: str, length: 8, poll: slow}
  - {key: firmware, label: C_Version, table: holding, address: 40044, type: str, length: 8, poll: slow}
  - {key: serial, label: C_SerialNumber, table: holding, address: 40052, type: str, length: 16, poll: slow}
  - {key: x.device_address, label: C_DeviceAddress, table: holding, address: 40068, type: u16, poll: slow}

  # SunSpec inverter model 103 at 0x9C86
  - {key: x.ac_current, label: I_AC_Current, table: holding, address: 40072, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40076, type: s16}, invalid: [65535]}
  - {key: l1_current, label: I_AC_CurrentA, table: holding, address: 40073, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40076, type: s16}, invalid: [65535]}
  - {key: l2_current, label: I_AC_CurrentB, table: holding, address: 40074, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40076, type: s16}, invalid: [65535]}
  - {key: l3_current, label: I_AC_CurrentC, table: holding, address: 40075, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40076, type: s16}, invalid: [65535]}
  - {key: l1_voltage, label: I_AC_VoltageAN, table: holding, address: 40080, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40083, type: s16}, invalid: [65535]}
  - {key: l2_voltage, label: I_AC_VoltageBN, table: holding, address: 40081, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40083, type: s16}, invalid: [65535]}
  - {key: l3_voltage, label: I_AC_VoltageCN, table: holding, address: 40082, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40083, type: s16}, invalid: [65535]}
  - {key: x.ac_power, label: I_AC_Power, table: holding, address: 40084, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40085, type: s16}, invalid: [-32768], note: 'Scale factor 2: 100 W steps.'}
  - {key: frequency, label: I_AC_Frequency, table: holding, address: 40086, type: u16, unit: Hz, scale_exponent_from: {table: holding, address: 40087, type: s16}, invalid: [65535]}
  - {key: apparent_power, label: I_AC_VA, table: holding, address: 40088, type: s16, unit: VA, scale_exponent_from: {table: holding, address: 40089, type: s16}, invalid: [-32768]}
  - {key: reactive_power, label: I_AC_VAR, table: holding, address: 40090, type: s16, unit: var, scale_exponent_from: {table: holding, address: 40091, type: s16}, invalid: [-32768]}
  - {key: x.power_factor, label: I_AC_PF, table: holding, address: 40092, type: s16, unit: '%', scale_exponent_from: {table: holding, address: 40093, type: s16}, invalid: [-32768], verified: false, note: 'The map gives the unit % with scale factor −4 (÷ 10 000), which suggests a fraction (−1…1) rather than percent; unclear.'}
  - {key: x.ac_energy, label: I_AC_Energy_WH, table: holding, address: 40094, type: u32, unit: Wh, scale_exponent_from: {table: holding, address: 40096, type: s16}, invalid: [4294967295], poll: slow, verified: false, note: 'The map lists WH_SF as "1 (multiply by 1)", which can mean exponent 1 (×10) or factor 1. Readers prefer pv_energy (0x0802).'}
  - {key: x.dc_power, label: I_DC_Power, table: holding, address: 40101, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40102, type: s16}, invalid: [-32768], note: Not available on the CL (reads 0x8000); solar power is the sum of the two MPPT inputs.}
  - {key: temperature, label: I_Temp_Cab, table: holding, address: 40103, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40107, type: s16}, invalid: [-32768], note: Ambient temperature inside the inverter.}
  - {key: x.heat_sink_temperature, label: I_Temp_Sink, table: holding, address: 40104, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40107, type: s16}, invalid: [-32768], note: Not available on the CL (reads 0x8000).}
  - {key: state, label: I_Status, table: holding, address: 40108, type: u16, enum: sunspec_state}
  - {key: x.vendor_state, label: I_Status_Vendor, table: holding, address: 40109, type: u16, enum: vendor_state}
  - {key: x.events, label: I_Event_1, table: holding, address: 40110, type: u32, flags: evt1, invalid: [4294967295], note: The map lists it as not available (0xFFFFFFFF); bit meanings from the SunSpec models.}

  # SunSpec multiple MPPT model 160 at 0x9CBA, two inputs
  - {key: x.mppt_inputs, label: Number of modules, table: holding, address: 40130, type: u16, poll: slow}
  - {key: x.pv1_current, label: DC Current (input 1), table: holding, address: 40141, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40124, type: s16}, invalid: [65535]}
  - {key: x.pv1_voltage, label: DC Voltage (input 1), table: holding, address: 40142, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40125, type: s16}, invalid: [65535]}
  - {key: x.pv1_power, label: DC Power (input 1), table: holding, address: 40143, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40126, type: s16}, note: 'Int16 in the map (SunSpec: uint16); 1 W steps (DCW_SF 0).'}
  - {key: x.pv1_energy, label: DC Energy (input 1), table: holding, address: 40144, type: u32, unit: Wh, scale_exponent_from: {table: holding, address: 40127, type: s16}, poll: slow, note: Not available on the CL (reads 0; DCWH_SF 0x8000).}
  - {key: x.pv1_state, label: MPPT Operating State (input 1), table: holding, address: 40149, type: u16, enum: mppt_state}
  - {key: x.pv1_events, label: DC MPPT Events (input 1), table: holding, address: 40150, type: u32, flags: dc_events, invalid: [4294967295], note: Not available on the CL (0xFFFFFFFF); bit meanings from the SunSpec models.}
  - {key: x.pv2_current, label: DC Current (input 2), table: holding, address: 40161, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40124, type: s16}, invalid: [65535]}
  - {key: x.pv2_voltage, label: DC Voltage (input 2), table: holding, address: 40162, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40125, type: s16}, invalid: [65535]}
  - {key: x.pv2_power, label: DC Power (input 2), table: holding, address: 40163, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40126, type: s16}, note: 'Int16 in the map (SunSpec: uint16); 1 W steps (DCW_SF 0).'}
  - {key: x.pv2_energy, label: DC Energy (input 2), table: holding, address: 40164, type: u32, unit: Wh, scale_exponent_from: {table: holding, address: 40127, type: s16}, poll: slow, note: Not available on the CL (reads 0; DCWH_SF 0x8000).}
  - {key: x.pv2_state, label: MPPT Operating State (input 2), table: holding, address: 40169, type: u16, enum: mppt_state}
  - {key: x.pv2_events, label: DC MPPT Events (input 2), table: holding, address: 40170, type: u32, flags: dc_events, invalid: [4294967295], note: Not available on the CL (0xFFFFFFFF); bit meanings from the SunSpec models.}

  # Vendor registers
  - {key: pv_energy, label: kWh Energy Produced, table: holding, address: 2050, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow}
  - {key: pv_energy_today, label: Energy Today, table: holding, address: 2052, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295]}
  - {key: x.pv_energy_yesterday, label: Energy Today -1, table: holding, address: 2054, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow}
  - {key: x.operating_hours, label: Unit operation Hours (life time), table: holding, address: 2078, type: u32, unit: h, invalid: [4294967295], poll: slow}
  - {key: error_code, label: Inverter Alarm code, table: holding, address: 6184, type: u16, enum: alarm_code, invalid: [65535], note: The one active alarm with the highest priority; 0 = none.}

derived:
  - {key: pv_power, label: Solar power (DC power input 1 + input 2), unit: W, sum: [{key: x.pv1_power}, {key: x.pv2_power}], note: Sum of the two inputs; model 103 has no DC power on the CL.}

