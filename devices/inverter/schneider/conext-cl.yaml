  sunspec_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': Producing (MPPT), '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby}
  vendor_state: {'2': Reconnecting to grid, '3': 'Online, producing', '21': No PV, '22': Offline (service or error), '23': Derating}
  mppt_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': MPPT, '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby, '9': Test}
  # Services: the unit stops and needs manual intervention
  # Errors: the unit stops and recovers by itself
  # Warnings: the unit keeps running
  # Internal events (for Schneider's analysis)
  alarm_code: {'0': No active alarm, '10': AC relay fault, '31': AC current sensor fault, '32': AC temperature sensor fault, '33': DC temperature sensor fault, '47': AC voltage sensor fault, '131': Low efficiency fault, '203': DC initialisation fault, '204': DC self-test fault, '205': AC initialisation fault, '206': AC self-test fault, '701': DC injection fault, '702': RCMU fault, '703': Arc fault (AFCI), '704': Arc fault self-test failed, '705': PV input reversed, '706': DC injection high current, '708': RCMU fault, '709': Arc fault, '710': System configuration fault, '711': Shared system configuration fault, '712': AC internal configuration fault, '713': DC internal configuration fault, '714': RPO power module error, '2018': AC internal communication error, '2060': AC low temperature, '2061': AC modules over-temperature, '2062': DC modules over-temperature, '2101': DC internal communication error, '2102': DC-AC communication error, '2401': Grid under-frequency (fast), '2402': Grid over-frequency (fast), '2406': Grid under-voltage (fast), '2407': Grid over-voltage (fast), '2408': Grid under-voltage (instantaneous), '2410': Grid over-voltage (instantaneous), '2411': AC over-current (instantaneous), '2415': Grid over-voltage (10 min average), '2416': Grid under-frequency (slow), '2417': Grid over-frequency (slow), '2418': Grid under-voltage (slow), '2419': Grid over-voltage (slow), '2450': Grid not available, '2460': AC over-current, '2605': PV 1 over-voltage, '2606': PV 2 over-voltage, '2616': PV insulation error, '2624': PV 1 and 2 over-current, '2631': PV under-voltage, '2633': PV 1 over-current (PV 1 off), '2634': PV 2 over-current (PV 2 off), '2646': RCMU error, '2647': RCMU error, '2648': Low efficiency error, '4003': Replace fan, '4004': Loss of cooling, '4061': Ambient over-temperature derating, '4065': DC module 1 over-temperature derating, '4066': DC module 2 over-temperature derating, '4068': 'DC module 1 over-temperature, PV 1 off', '4069': 'DC module 2 over-temperature, PV 2 off', '4656': PV 1 under-voltage, '4657': PV 2 under-voltage, '4660': AC module over-temperature derating, '4661': PV 1 surge protection needs service, '4662': PV 2 surge protection needs service, '4663': AC surge protection needs service, '4680': Invalid date, '4700': Low power, '7000': Communication processor internal error, '8000': AC processor internal error, '9000': DC processor internal error}

