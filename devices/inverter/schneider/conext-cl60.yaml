# Written from Schneider Electric's Modbus Registers Map – Conext CL 60 Three Phase PV Inverter (503-0269-01-01, 3.0).

modbusspec: 0
id: schneider-conext-cl60
manufacturer: Schneider Electric
name: Conext CL 60E / CL 60A PV inverters
kind: inverter

sources:
- title: Modbus Registers Map – Conext CL 60 Three Phase PV Inverter (503-0269-01-01)
  version: 3.0 (2017-04-12)
  url: https://solar.se.com/eu/wp-content/uploads/sites/4/2021/11/Conext-CL-60-Modbus-Registers-Map.pdf
  sha256: 3f42f6102cdcca557e2a705680ba8cfbc3f520f04df6f801f005fab1d1172675

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    max_gap: 0

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 4989
    type: str
    length: 10
  checks:
  - table: input
    address: 4999
    type: u16
    in:
    - 4193
    - 4194

models:
  - {id: cl60a, name: Conext CL 60A, match: {table: input, address: 4999, type: u16, equals: 4193}}
  - {id: cl60e, name: Conext CL 60E, match: {table: input, address: 4999, type: u16, equals: 4194}}

points:
  # Identity and ratings
  - {key: firmware, label: LCD Firmware Version, table: input, address: 2581, type: str, length: 15, poll: slow}
  - {key: x.dsp_firmware, label: DSP Firmware Version, table: input, address: 2596, type: str, length: 15, poll: slow}
  - {key: x.protocol_number, label: Protocol Number, table: input, address: 4949, type: u32, poll: slow}
  - {key: x.protocol_version, label: Protocol Version, table: input, address: 4951, type: u32, poll: slow}
  - {key: serial, label: Serial Number, table: input, address: 4989, type: str, length: 10, poll: slow}
  - {key: x.model_code, label: Device Model Code, table: input, address: 4999, type: u16, enum: model_code, poll: slow}
  - {key: x.nominal_power, label: Nominal Output Power, table: input, address: 5000, type: u16, unit: kW, scale: 0.1, poll: slow}
  - {key: x.wiring, label: Output Power Wiring Type, table: input, address: 5001, type: u16, enum: wiring, poll: slow}
  - {key: x.nominal_reactive_power, label: Nominal Reactive Output Power, table: input, address: 5048, type: u16, unit: kvar, scale: 0.1, poll: slow}

  # Energy and operation
  - {key: pv_energy_today, label: Energy Produced Today, table: input, address: 5002, type: u16, unit: kWh, scale: 0.1}
  - {key: pv_energy, label: Energy Produced Life time, table: input, address: 5003, type: u32, unit: kWh, poll: slow}
  - {key: x.operating_hours, label: Total Operation Hour Life time, table: input, address: 5005, type: u32, unit: h, poll: slow}
  - {key: x.operating_minutes_today, label: Daily Operation Time, table: input, address: 5112, type: u16, unit: min}
  - {key: x.pv_energy_month, label: Monthly Energy, table: input, address: 5127, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: temperature, label: Internal Temperature, table: input, address: 5007, type: s16, unit: °C, scale: 0.1}

  # DC side
  - {key: x.pv_voltage, label: DC Voltage 1, table: input, address: 5010, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_current, label: DC Current 1, table: input, address: 5011, type: u16, unit: A, scale: 0.1}
  - {key: pv_power, label: Total DC power, table: input, address: 5016, type: u32, unit: W}
  - {key: x.negative_voltage_to_ground, label: Negative Voltage to Ground, table: input, address: 5145, type: s16, unit: V, scale: 0.1}
  - {key: x.bus_voltage, label: Bus voltage, table: input, address: 5146, type: u16, unit: V, scale: 0.1}
  - {key: x.insulation_impedance, label: Impedance to Ground in Parallel Connection, table: input, address: 5070, type: u16, unit: kΩ, invalid: [65535]}
  - {key: x.string1_current, label: 'Current: String 1', table: input, address: 7012, type: u16, unit: A, scale: 0.01}
  - {key: x.string2_current, label: 'Current: String 2', table: input, address: 7013, type: u16, unit: A, scale: 0.01}
  - {key: x.string3_current, label: 'Current: String 3', table: input, address: 7014, type: u16, unit: A, scale: 0.01}
  - {key: x.string4_current, label: 'Current: String 4', table: input, address: 7015, type: u16, unit: A, scale: 0.01}
  - {key: x.string5_current, label: 'Current: String 5', table: input, address: 7016, type: u16, unit: A, scale: 0.01}
  - {key: x.string6_current, label: 'Current: String 6', table: input, address: 7017, type: u16, unit: A, scale: 0.01}
  - {key: x.string7_current, label: 'Current: String 7', table: input, address: 7018, type: u16, unit: A, scale: 0.01}
  - {key: x.string8_current, label: 'Current: String 8', table: input, address: 7019, type: u16, unit: A, scale: 0.01}
  - {key: x.string9_current, label: 'Current: String 9', table: input, address: 7020, type: u16, unit: A, scale: 0.01, models: [cl60e]}
  - {key: x.string10_current, label: 'Current: String 10', table: input, address: 7021, type: u16, unit: A, scale: 0.01, models: [cl60e]}
  - {key: x.string11_current, label: 'Current: String 11', table: input, address: 7022, type: u16, unit: A, scale: 0.01, models: [cl60e]}
  - {key: x.string12_current, label: 'Current: String 12', table: input, address: 7023, type: u16, unit: A, scale: 0.01, models: [cl60e]}
  - {key: x.string13_current, label: 'Current: String 13', table: input, address: 7024, type: u16, unit: A, scale: 0.01, models: [cl60e]}
  - {key: x.string14_current, label: 'Current: String 14', table: input, address: 7025, type: u16, unit: A, scale: 0.01, models: [cl60e]}

  # AC side
  - {key: l1_voltage, label: A-B Line Voltage / Phase A Voltage, table: input, address: 5018, type: u16, unit: V, scale: 0.1, note: 'Phase voltage with wiring 1 (3P/4W), A-B line voltage with wiring 2 (3P/3W).'}
  - {key: l2_voltage, label: B-C Line Voltage / Phase B Voltage, table: input, address: 5019, type: u16, unit: V, scale: 0.1, note: 'Phase voltage with wiring 1 (3P/4W), B-C line voltage with wiring 2 (3P/3W).'}
  - {key: l3_voltage, label: C-A Line Voltage / Phase C Voltage, table: input, address: 5020, type: u16, unit: V, scale: 0.1, note: 'Phase voltage with wiring 1 (3P/4W), C-A line voltage with wiring 2 (3P/3W).'}
  - {key: l1_current, label: Phase A Current, table: input, address: 5021, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase B Current, table: input, address: 5022, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase C Current, table: input, address: 5023, type: u16, unit: A, scale: 0.1}
  - {key: apparent_power, label: Total Apparent Power, table: input, address: 5028, type: u32, unit: VA}
  - {key: x.ac_power, label: Total Active Power, table: input, address: 5030, type: u32, unit: W}
  - {key: reactive_power, label: Reactive power, table: input, address: 5032, type: s32, unit: var}
  - {key: power_factor, label: Power Factor, table: input, address: 5034, type: s16, unit: '', scale: 0.001, note: '+ leading, − lagging.'}
  - {key: frequency, label: Grid frequency, table: input, address: 5035, type: u16, unit: Hz, scale: 0.1}

  # State and faults
  - {key: state, label: Operation state, table: input, address: 5037, type: u16, enum: operation_state}
  - {key: x.fault_time, label: Fault/Alarm time, table: input, address: 5038, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, note: Valid only while the operation state is 0x5500 (fault) or 0x9100 (alarm).}
  - {key: error_code, label: Fault/Alarm code 1, table: input, address: 5044, type: u16, enum: fault_code, invalid: [65535], note: Valid only while the operation state is 0x5500 (fault) or 0x9100 (alarm).}
  - {key: x.state_bits, label: Operation State Bit Map, table: input, address: 5080, type: u32, flags: state_bits}

