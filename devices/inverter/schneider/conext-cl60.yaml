  wiring: {'1': 3-phase 4-wire, '2': 3-phase 3-wire}
  operation_state: {'0': Run (0x0000), '4608': Initial standby (0x1200), '4864': Key stop (0x1300), '5120': Standby (0x1400), '5376': Emergency stop (0x1500), '5632': Starting (0x1600), '9472': Communication failure (0x2500), '21760': Fault (0x5500), '32768': Stop (0x8000), '33024': Derating (0x8100), '33280': Dispatch (0x8200), '37120': Alarm (0x9100)}
  fault_code: {'2': Grid voltage high, '3': Transient grid voltage high, '4': Grid voltage low, '5': Transient grid voltage low, '6': Hardware fault, '7': Transient AC over-current, '8': Grid frequency high, '9': Grid frequency low, '10': Islanding (grid outage), '11': DC current high, '12': Leakage current fault, '13': Abnormal grid power, '14': Grid AC voltage out of range, '15': Grid AC voltage out of range, '16': Power module overload, '17': Unbalanced grid voltage, '19': DC bus voltage high, '20': DC bus voltage high, '21': PV input over-current, '23': PV string configuration changed, '24': DC bus voltage imbalance, '25': DC bus midpoint imbalance, '26': Bus voltage fluctuation, '36': Module temperature high, '37': Ambient temperature high, '38': Relay failure, '39': Insulation fault, '40': Over-current protection, '41': Hardware fault, '42': Current unbalance, '43': Ambient temperature low, '44': AC-DC inverter fault, '47': Incorrect PV input configuration, '48': Hardware fault, '49': Hardware fault, '50': Hardware fault, '51': Hardware voltage/current high, '70': Fan failure, '71': AC surge protection fault, '72': DC surge protection fault, '73': PV string fuse blown, '74': LCD communication failure, '75': Low irradiance, '76': PV power overload, '78': PV1 power abnormal, '87': Arc detection module abnormal, '88': Arc fault, '89': Arc detection disabled, '532': String 1 reversed polarity, '533': String 2 reversed polarity, '534': String 3 reversed polarity, '535': String 4 reversed polarity, '536': String 5 reversed polarity, '537': String 6 reversed polarity, '538': String 7 reversed polarity, '539': String 8 reversed polarity, '540': String 9 reversed polarity, '541': String 10 reversed polarity, '542': String 11 reversed polarity, '543': String 12 reversed polarity, '544': String 13 reversed polarity, '545': String 14 reversed polarity, '546': String 15 reversed polarity, '547': String 16 reversed polarity, '548': String 1 abnormal, '549': String 2 abnormal, '550': String 3 abnormal, '551': String 4 abnormal, '552': String 5 abnormal, '553': String 6 abnormal, '554': String 7 abnormal, '555': String 8 abnormal, '556': String 9 abnormal, '557': String 10 abnormal, '558': String 11 abnormal, '559': String 12 abnormal, '560': String 13 abnormal, '561': String 14 abnormal, '562': String 15 abnormal, '563': String 16 abnormal}

flags:
  state_bits: {'0': Run, '1': Stop, '2': Initial standby, '3': Key stop, '4': Standby, '5': Emergency stop, '6': Starting, '9': Fault, '10': Alarm, '11': Derating, '12': Dispatch, '13': Communication fault, '17': Running (operational and connected to the grid), '18': Faulted (operation halted)}

problems:
  - {when: {key: state, equals: 21760}, kind: fault, text: Inverter fault (state 0x5500)}
  - {when: {key: state, equals: 37120}, kind: warning, text: Inverter alarm (state 0x9100)}
  - {when: {key: state, equals: 33024}, kind: warning, text: Derating (state 0x8100)}
  - {when: {key: state, equals: 9472}, kind: fault, text: Communication failure (state 0x2500)}
  - {when: {key: error_code, in: [2, 3, 4, 5, 8, 9, 10, 13, 14, 15, 17]}, kind: mains_lost, text: 'Grid out of range or missing (fault code {value})'}

notes:
- 'Operation variables are input registers (function 04); configuration parameters are holding registers (03, 06, 0x10) and
  share some addresses with different meanings (e.g. 0x1387 is the clock''s year there). Addresses are used as written in
  the map, 0-based: the map''s SunSpec block starts at 0x9C40 (= 40000).'
- 32-bit values have the low word at the lower address ("little-endian for double-word data"); bytes within a register are
  big-endian. Strings are UTF-8, high byte first.
- The fault/alarm code is valid only in the fault (0x5500) and alarm (0x9100) states. A fault state with a grid code (2–5,
  8–10, 13–15, 17) is mains_lost instead of fault, an alarm state is a warning naming the code, and code 75 (low irradiance,
  normal weather) is not a problem. Readers using the problems above should apply the grid-code rule only in those two states.
- 'Output wiring 0x1389: with 1 (3P/4W) 0x139A–0x139C are phase voltages, with 2 (3P/3W) line-to-line voltages.'
- The CL 60A has 8 string inputs (0x1B64–0x1B6B), the CL 60E 14 (0x1B64–0x1B71).
- The SunSpec model 103 at 0x9C86 reports power in 100 W steps; the vendor registers give 1 W.
- 'Not stated in the document: whether the inverter accepts reads spanning undocumented registers, and the unit id behind
  a Modbus TCP gateway.'
- There is no grid meter; grid and house consumption come from another device.
