notes:
- SMA profile on unit id 3 (settable 3-123); SunSpec is served on unit id + 123 (126) and isn't used here. Addresses are SMA's
  register numbers, used as they are on the wire (SMA subtracts 1 only from SunSpec numbers).
- SMA answers function codes 03 and 04 alike for these registers (1-125 registers per request). They are listed as holding
  registers, as the open-source projects read them; SMA's Storage X document uses 04.
- 'Big-endian; 32- and 64-bit values high word first. Status (ENUM / TAGLIST) values use the low 24 bits; 0xFFFFFD means ''information
  not available''. Not available: U32 0xFFFFFFFF, S32 0x80000000, U64 0xFFFFFFFFFFFFFFFF, STR32 zero.'
- FIXn = n decimals (scale 10^-n), TEMP = 0.1 °C, Duration in seconds, FW = firmware bytes.
- A block read is answered if it holds at least one defined register (undefined ones read as not available); a block without
  any defined register gives an exception.
- 'SMA: older Speedwire devices want at least 10 s between Modbus transfers (ennexOS: 1 s).'
- 'Sunny Island: grid and battery power as derived; house load 30861; today''s grid energy 30577 / 30579; no solar power of
  its own. A device on which 31393 or 31395 is available is presumably a Sunny Island too (assumed; in the model match).'
- 'SB Smart Energy: battery power = |30851 × 30843| with the direction from 30955 (2292 charging, 2293 discharging, 2291 standby
  = 0).'
- 'Device class: the documents name 8001 (solar inverter, register lists) and 8009 (hybrid inverter, Storage X document);
  any class in 8000-8999 is assumed to be an inverter (not documented).'
- 'Storage X / Sunny Island X and newer models have no full register list in these documents: only 30201, 30233, 30845, 30955,
  31391, 40029 and 40187 are documented for them.'
- Models core2 come from projects and are listed after a model without a match, so detection never reaches them; their points
  apply only when a reader selects such a model by hand.
- 'evcc template `sma-inverter-modbus` (pv) lists: SMA Wechselrichter (Modbus).'
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- 'SMA serves its own profile and SunSpec on one port: SunSpec on the SMA unit id + 123 (126 with the factory unit id 3).
  The registers here are on the SMA unit id. ha-sunspec2 reads every SMA register one below its number; SMA addresses its
  own registers by their number (only SunSpec numbers are 1-based), as evcc does, so the addresses here are the SMA numbers.'
- Status registers carry their value in the low 24 bits; 0xFFFFFD there means not available.
- 'External battery setpoint: needs the active power mode ''external setpoint'' (1079) set in the inverter; write the control
  flag (40151, 802 = active) and then, a second or more later, the setpoint (40149, W, negative = charge). It lapses after
  the device''s timeout (41195), so it has to be rewritten (ha-sunspec2: every 30 s). SMA only allows these setpoints to be
  written cyclically; other writable registers are stored in flash.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
