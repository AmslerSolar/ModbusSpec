connection:
  default_port: 502
  default_unit: 3
  transports:
  - tcp
  limits:
    max_registers: 125
    max_gap: 100
    min_interval_ms: 10000
  input_equals_holding: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 30057
    type: u32
  checks:
  - table: holding
    address: 30051
    type: u32
    range:
    - 8000
    - 8999
  # device type given
  - table: holding
    address: 30053
    type: u32
    not_in:
    - 16777213
    - 16777215
    - 4294967295
  # serial number given
  - table: holding
    address: 30057
    type: u32
    not_in:
    - 0
    - 4294967295

models:
  # battery power registers with a value: presumably a Sunny Island too (assumed)
  - {id: sunny_island, name: Sunny Island (SI 3.0M / 4.4M / 6.0H / 8.0H -11), match_any: [{table: holding, address: 30053, type: u32, in: [9223, 9224, 9278, 9279]}, {table: holding, address: 31393, type: u32, answers: true, not: 4294967295}, {table: holding, address: 31395, type: u32, answers: true, not: 4294967295}]}
  - {id: pv_inverter, name: Sunny Boy / Sunny Tripower / Sunny Boy Smart Energy and other SMA inverters, match: {table: holding, address: 30051, type: u32, range: [8000, 8999]}}
  - {id: default, name: default}
  - {id: core2, name: core2}

