connection:
  default_port: 502
  default_unit: 3
  transports:
  - tcp
  limits:
    max_registers: 125
  input_equals_holding: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 30057
    type: u32

