enums:
  status: {'35': Fault, '303': 'Off', '307': Ok, '308': 'On', '455': Warning, '2291': Battery standby, '2292': Battery charging, '2293': Battery discharging}
  device_class: {'8001': Solar inverter, '8009': Hybrid inverter}
  device_type: {'9225': SB 5000SE-10, '9226': SB 3600SE-10}
  bms_mode: {'303': 'Off', '308': 'On', '2289': Battery charging, '2290': Battery discharging, '2424': Default setting}
  battery_state: {'303': 'Off', '2291': Standby, '2292': Charge, '2293': Discharge, '3664': Emergency Charge}
  set_control_mode: {'802': START, '803': STOP}

notes:
- SMA profile on unit id 3. SMA answers function codes 03 and 04 alike; listed as holding registers.
- 'Big-endian; 32- and 64-bit values high word first. Status (ENUM) values use the low 24 bits. Not available: U32 0xFFFFFFFF,
  S32 0x80000000, U64 0xFFFFFFFFFFFFFFFF.'
- FIXn = n decimals (scale 10^-n). Energies are in Wh on the wire.
- The register list covers the Sunny Boy Smart Energy (SB 3600SE-10 / 5000SE-10) with two DC inputs. Newer Smart Energy models
  have no register list in these documents.
- A block read is answered if it holds at least one defined register; a block without any defined register gives an exception.
- 'No identify checks: the device class (30051, 8000–8999) and serial are the same on every SMA inverter, so they don''t tell
  this map apart from sma-inverter.'
- 'evcc template `sma-hybrid` (grid, pv, battery) lists: SMA Smart Energy Hybrid Inverter.'
- OpenEMS reads the battery of the Sunny Tripower Smart Energy (STP xx-3SE) here; its inverter part goes through SunSpec.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
