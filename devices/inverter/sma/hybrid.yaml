  - {key: grid_power, label: Grid power (feed-in − reference), unit: W, positive: export, sum: [{key: x.grid_export_power}, {key: x.grid_import_power, factor: -1}]}
  - {key: l1_power, label: Grid L1 power, unit: W, positive: import, sum: [{key: x.grid_l1_power_1}, {key: x.grid_l1_power_2, factor: -1}], verified: false, sources: [evcc]}
