modbusspec: 0
id: studer-next-system
manufacturer: Studer Innotec
name: Next system values (unit id 1)
kind: inverter

sources:
- id: studer-innotec-next3-ha
  title: Studer-Innotec-next3-HA (Home Assistant integration)
  url: https://github.com/anakinch75/Studer-Innotec-next3-HA
  license: MIT
  commit: 1c2a5eedb9816928609ba0bfb789fd128a774f7c
  path: custom_components/studer_next3/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - studer-innotec-next3-ha

points:
  - {key: load_power, label: AC-Loads Active Power, table: holding, address: 3908, type: f32, unit: W}
  - {key: x.ac_loads_consumed_energy, label: AC-Loads Consumed Energy, table: holding, address: 3924, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: pv_power, label: PV Power, table: holding, address: 7505, type: f32, unit: W}
  - {key: pv_energy, label: PV Energy, table: holding, address: 7519, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: battery_power, label: Battery Power (raw), table: holding, address: 8400, type: f32, unit: W, positive: discharge}
  - {key: x.battery_charging_energy, label: Battery Charging Energy, table: holding, address: 8410, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: x.battery_discharging_energy, label: Battery Discharging Energy, table: holding, address: 8422, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: battery_soc, label: Battery SOC, table: holding, address: 8426, type: f32, unit: '%'}

notes:
- 'A Next system answers on several unit ids: 1 = system totals, 2 = battery, 7 = AC source (grid), 14 = the Next3 device,
  29 = the Next1 device. Each is its own device here.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
