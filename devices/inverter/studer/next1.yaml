modbusspec: 0
id: studer-next1
manufacturer: Studer Innotec
name: Next1 single-phase inverter/charger (unit id 29)
kind: inverter

sources:
- id: studer-innotec-next3-ha
  title: Studer-Innotec-next3-HA (Home Assistant integration)
  url: https://github.com/anakinch75/Studer-Innotec-next3-HA
  license: MIT
  commit: 1c2a5eedb9816928609ba0bfb789fd128a774f7c
  path: custom_components/studer_next3/const.py

connection:
  default_port: 502
  default_unit: 29
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - studer-innotec-next3-ha

points:
  - {key: x.inverter_status, label: Inverter Status, table: holding, address: 2700, type: u32, note: Raw status code; the integration points to Studer's Modbus documentation for the values.}
  - {key: x.inverter_errors, label: Inverter Errors, table: holding, address: 2702, type: u32, note: Raw error code; the integration points to Studer's Modbus documentation for the values.}
  - {key: x.aux1_relay_position, label: AUX1 Relay Position, table: holding, address: 3001, type: u32, enum: aux_relay_position_labels}
  - {key: x.aux1_operating_mode, label: AUX1 Operating Mode, table: holding, address: 3007, type: u32, enum: aux_relay_operating_modes, writable: true}
  - {key: x.aux2_relay_position, label: AUX2 Relay Position, table: holding, address: 3301, type: u32, enum: aux_relay_position_labels}
  - {key: x.aux2_operating_mode, label: AUX2 Operating Mode, table: holding, address: 3307, type: u32, enum: aux_relay_operating_modes, writable: true}

enums:
  aux_relay_position_labels: {'0': Safe state opened, '1': Safe state closed, '2': Manually opened, '3': Manually closed, '4': Automatically opened, '5': Automatically closed}
  aux_relay_operating_modes: {'0': Manual Off, '1': Manual On, '2': Auto}

notes:
- 'A Next system answers on several unit ids: 1 = system totals, 2 = battery, 7 = AC source (grid), 14 = the Next3 device,
  29 = the Next1 device. Each is its own device here.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
