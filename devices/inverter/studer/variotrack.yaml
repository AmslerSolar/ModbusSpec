modbusspec: 0
id: studer-variotrack
manufacturer: Studer Innotec
name: VarioTrack MPPT solar charger
kind: inverter

sources:
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderBindingConstants.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderParser.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderHandler.java

connection:
  default_port: 502
  default_unit: 20

defaults:
  verified: false
  sources:
  - openhab

points:
  - {key: battery_voltage, label: Battery Voltage, table: input, address: 0, type: f32, unit: V}
  - {key: x.battery_current, label: Battery Current, table: input, address: 2, type: f32, unit: A}
  - {key: x.voltage_pv_generator, label: PV Generator Voltage, table: input, address: 4, type: f32, unit: V}
  - {key: pv_power, label: Power of the PV Generator, table: input, address: 8, type: f32, unit: W, scale: 1000}
  - {key: x.production_current_day, label: Current Day Production, table: input, address: 14, type: f32, unit: kWh}
  - {key: x.model_vario_track, label: Model of VarioTrack, table: input, address: 30, type: f32, enum: vttype}
  - {key: x.operating_mode, label: Operating State, table: input, address: 32, type: f32, enum: vtmode}
  - {key: x.state_vario_track, label: State of the VarioTrack, table: input, address: 138, type: f32, enum: off_on}

enums:
  vttype: {'0': VT80, '1': VT65}
  vtmode: {'0': NIGHT, '1': STARTUP, '3': CHARGER, '5': SECURITY, '6': 'OFF', '8': CHARGE, '9': CHARGEV, '10': CHARGEI, '11': CHARGET, '12': CHIBSP}
  off_on: {'0': 'Off', '1': 'On'}

notes:
- 'Read through the Xcom-485i Modbus gateway: every value is a 32-bit float in two input registers (function 04).'
- Each device of this kind answers on its own unit id; the binding's default is 20.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
