modbusspec: 0
id: studer-variostring
manufacturer: Studer Innotec
name: VarioString MPPT solar charger
kind: inverter

sources:
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderBindingConstants.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderParser.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderHandler.java

connection:
  default_port: 502
  default_unit: 40

defaults:
  verified: false
  sources:
  - openhab

points:
  - {key: battery_voltage, label: Battery Voltage, table: input, address: 0, type: f32, unit: V}
  - {key: x.battery_current, label: Battery Current, table: input, address: 2, type: f32, unit: A}
  - {key: x.pv_voltage, label: PV Voltage, table: input, address: 8, type: f32, unit: V}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 10, type: f32, unit: V}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 12, type: f32, unit: V}
  - {key: x.pv_current, label: PV Current, table: input, address: 14, type: f32, unit: A}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 16, type: f32, unit: A}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 18, type: f32, unit: A}
  - {key: pv_power, label: PV Power, table: input, address: 20, type: f32, unit: W, scale: 1000}
  - {key: x.pv1_power, label: PV1 Power, table: input, address: 22, type: f32, unit: W, scale: 1000}
  - {key: x.pv2_power, label: PV2 Power, table: input, address: 24, type: f32, unit: W, scale: 1000}
  - {key: x.pv_mode, label: PV Operating State, table: input, address: 26, type: f32, enum: vsmode}
  - {key: x.pv1_mode, label: PV1 Operating State, table: input, address: 28, type: f32, enum: vsmode}
  - {key: x.pv2_mode, label: PV2 Operating State, table: input, address: 30, type: f32, enum: vsmode}
  - {key: x.production_pv_current_day, label: PV Current Day Production, table: input, address: 34, type: f32, unit: kWh}
  - {key: x.production_pv1_current_day, label: PV1 Current Day Production, table: input, address: 36, type: f32, unit: kWh}
  - {key: x.production_pv2_current_day, label: PV2 Current Day Production, table: input, address: 38, type: f32, unit: kWh}
  - {key: x.state_vario_string, label: State of the VarioString, table: input, address: 216, type: f32, enum: off_on}

enums:
  vsmode: {'0': NIGHT, '1': SECURITY, '2': 'OFF', '3': CHARGE, '4': CHARGEV, '5': CHARGEI, '6': CHARGEP, '7': CHARGEIPV, '8': CHARGET, '10': CHIBSP}
  off_on: {'0': 'Off', '1': 'On'}

notes:
- 'Read through the Xcom-485i Modbus gateway: every value is a 32-bit float in two input registers (function 04).'
- Each device of this kind answers on its own unit id; the binding's default is 40.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
