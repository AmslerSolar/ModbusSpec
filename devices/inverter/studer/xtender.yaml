modbusspec: 0
id: studer-xtender
manufacturer: Studer Innotec
name: Xtender inverter/charger
kind: inverter

sources:
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderBindingConstants.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderParser.java,
    bundles/org.openhab.binding.modbus.studer/src/main/java/org/openhab/binding/modbus/studer/internal/StuderHandler.java

connection:
  default_port: 502
  default_unit: 10

defaults:
  verified: false
  sources:
  - openhab

points:
  - {key: x.input_voltage, label: Input Voltage, table: input, address: 22, type: f32, unit: V}
  - {key: x.input_current, label: Input Current, table: input, address: 24, type: f32, unit: A}
  - {key: x.output_voltage, label: Output Voltage, table: input, address: 42, type: f32, unit: V}
  - {key: x.output_current, label: Output Current, table: input, address: 44, type: f32, unit: A}
  - {key: x.operating_state, label: Operating State, table: input, address: 56, type: f32, enum: modextender}
  - {key: x.state_inverter, label: State of the Inverter, table: input, address: 98, type: f32, enum: off_on}
  - {key: x.input_frequency, label: Input Frequency, table: input, address: 168, type: f32, unit: Hz}
  - {key: x.output_frequency, label: Output Frequency, table: input, address: 170, type: f32, unit: Hz}
  - {key: x.output_active_power, label: Output Active Power, table: input, address: 272, type: f32, unit: W, scale: 1000}
  - {key: x.input_active_power, label: Input Active Power, table: input, address: 274, type: f32, unit: W, scale: 1000}

enums:
  modextender: {'0': INVALID, '1': INVERTER, '2': CHARGER, '3': BOOST, '4': INJECTION}
  off_on: {'0': 'Off', '1': 'On'}

notes:
- 'Read through the Xcom-485i Modbus gateway: every value is a 32-bit float in two input registers (function 04).'
- Each device of this kind answers on its own unit id; the binding's default is 10.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
