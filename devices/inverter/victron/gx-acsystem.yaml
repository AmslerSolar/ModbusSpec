# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-acsystem
manufacturer: Victron Energy
name: 'GX Modbus-TCP: AC system of RS units (com.victronenergy.acsystem)'
kind: inverter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: state, label: System state, table: holding, address: 4900, type: u16, enum: state}
  - {key: x.ac_in_1_l1_v, label: Input voltage phase 1, table: holding, address: 4901, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_in_1_l2_v, label: Input voltage phase 2, table: holding, address: 4902, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_in_1_l3_v, label: Input voltage phase 3, table: holding, address: 4903, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_in_1_l1_i, label: Input current phase 1, table: holding, address: 4904, type: s16, unit: A, scale: 0.1, verified: false, note: attributes.csv gives uint16.}
  - {key: x.ac_in_1_l2_i, label: Input current phase 2, table: holding, address: 4905, type: s16, unit: A, scale: 0.1, verified: false, note: attributes.csv gives uint16.}
  - {key: x.ac_in_1_l3_i, label: Input current phase 3, table: holding, address: 4906, type: s16, unit: A, scale: 0.1, verified: false, note: attributes.csv gives uint16.}
  - {key: x.ac_in_1_l1_p, label: Input power phase 1, table: holding, address: 4907, type: s16, unit: W, scale: 10, positive: import, verified: false, note: The list gives no sign; taken as for VE.Bus input power (positive = import).}
  - {key: x.ac_in_1_l2_p, label: Input power phase 2, table: holding, address: 4908, type: s16, unit: W, scale: 10, positive: import, verified: false, note: The list gives no sign; taken as for VE.Bus input power (positive = import).}
  - {key: x.ac_in_1_l3_p, label: Input power phase 3, table: holding, address: 4909, type: s16, unit: W, scale: 10, positive: import, verified: false, note: The list gives no sign; taken as for VE.Bus input power (positive = import).}
  - {key: x.ac_in_1_l1_f, label: Input frequency, table: holding, address: 4910, type: u16, unit: Hz, scale: 0.01}
  - {key: x.ac_out_l1_v, label: Output voltage phase 1, table: holding, address: 4911, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_out_l2_v, label: Output voltage phase 2, table: holding, address: 4912, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_out_l3_v, label: Output voltage phase 3, table: holding, address: 4913, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_out_l1_i, label: Output current phase 1, table: holding, address: 4914, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_out_l2_i, label: Output current phase 2, table: holding, address: 4915, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_out_l3_i, label: Output current phase 3, table: holding, address: 4916, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_out_l1_p, label: Output power phase 1, table: holding, address: 4917, type: s16, unit: W, scale: 10, positive: generation, verified: false, note: The list gives no sign; taken as for VE.Bus output power (positive = to the loads).}
  - {key: x.ac_out_l2_p, label: Output power phase 2, table: holding, address: 4918, type: s16, unit: W, scale: 10, positive: generation, verified: false, note: The list gives no sign; taken as for VE.Bus output power (positive = to the loads).}
  - {key: x.ac_out_l3_p, label: Output power phase 3, table: holding, address: 4919, type: s16, unit: W, scale: 10, positive: generation, verified: false, note: The list gives no sign; taken as for VE.Bus output power (positive = to the loads).}
  - {key: x.ac_out_l1_f, label: Output frequency, table: holding, address: 4920, type: u16, unit: Hz, scale: 0.01}
  - {key: x.settings_ess_mode, label: ESS mode, table: holding, address: 4921, type: u16, enum: settings_ess_mode, writable: true}
  - {key: x.ess_ac_power_setpoint, label: ESS setpoint, table: holding, address: 4922, type: s32, unit: W, writable: true}
  - {key: x.ess_disable_feed_in, label: Disable Feed-in (into grid), table: holding, address: 4924, type: u16, enum: ess_disable_feed_in, writable: true}
  - {key: x.ess_active_soc_limit, label: ESS Active SOC Limit, table: holding, address: 4925, type: u16, unit: '%'}
  - {key: x.pv_disable, label: Disable PV inverter generation (set limit to zero), table: holding, address: 4929, type: u16, enum: pv_disable, writable: true}
  - {key: x.alarms_grid_lost, label: Grid Lost Alarm, table: holding, address: 4930, type: u16, enum: alarms_grid_lost}
  - {key: x.alarms_phase_rotation, label: Phase Rotation Alarm, table: holding, address: 4931, type: u16, enum: alarms_grid_lost}
  - {key: x.ac_in_1_current_limit, label: Ac input 1 current limit, table: holding, address: 4940, type: u16, unit: A, scale: 0.1, writable: true}
  - {key: x.ac_in_2_current_limit, label: Ac input 2 current limit, table: holding, address: 4941, type: u16, unit: A, scale: 0.1, writable: true}
  - {key: x.settings_ac_in_current_limit_energy_meter, label: Ac current limit at grid meter, table: holding, address: 4942, type: u16, unit: A, scale: 0.1, writable: true}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 4950, type: str, length: 8, writable: true, poll: slow}

enums:
  state: {'0': 'Off', '1': Low Power, '2': Fault, '3': Bulk, '4': Absorption, '5': Float, '6': Storage, '7': Equalize, '8': Passthru, '9': Inverting, '10': Power assist, '11': Power supply, '252': External control}
  settings_ess_mode: {'1': ESS with Phase Compensation, '2': ESS without phase compensation, '3': Disabled/External Control}
  ess_disable_feed_in: {'0': Feed-in enabled, '1': Feed-in disabled}
  pv_disable: {'0': Enable PV inverters, '1': Disable PV inverters}
  alarms_grid_lost: {'0': Ok, '1': Warning, '2': Alarm}

problems:
  - {when: {key: state, equals: 2}, kind: fault, text: AC system fault (state 2)}
  - {when: {key: x.alarms_grid_lost, equals: 2}, kind: mains_lost, text: Grid lost}
  - {when: {key: x.alarms_grid_lost, equals: 1}, kind: warning, text: Grid lost (warning)}
  - {when: {key: x.alarms_phase_rotation, equals: 2}, kind: fault, text: Phase Rotation Alarm}
  - {when: {key: x.alarms_phase_rotation, equals: 1}, kind: warning, text: Phase Rotation Alarm (warning)}

notes:
- 'No fixed unit id: the GX assigns them (since Venus OS 2.60), normally the device instance; see Settings → Integrations
  → Modbus TCP server → Available services. 1 is only a placeholder.'
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
