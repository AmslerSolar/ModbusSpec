  - {key: x.ac_pv_on_genset_l2_power_815, label: PV - AC-coupled on generator L2, table: holding, address: 815, type: u16, invalid: [65535], unit: W}
  - {key: x.ac_pv_on_genset_l3_power_816, label: PV - AC-coupled on generator L3, table: holding, address: 816, type: u16, invalid: [65535], unit: W}
  - {key: x.ac_consumption_l1_power_817, label: AC Consumption L1, table: holding, address: 817, type: u16, invalid: [65535], unit: W, positive: consumption, note: 'The list: power supplied by the system to the loads (positive = consumption).'}
  - {key: x.ac_consumption_l2_power_818, label: AC Consumption L2, table: holding, address: 818, type: u16, invalid: [65535], unit: W, positive: consumption, note: 'The list: power supplied by the system to the loads (positive = consumption).'}
  - {key: x.ac_consumption_l3_power_819, label: AC Consumption L3, table: holding, address: 819, type: u16, invalid: [65535], unit: W, positive: consumption, note: 'The list: power supplied by the system to the loads (positive = consumption).'}
