# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-system
manufacturer: Victron Energy
name: 'GX Modbus-TCP: system overview (com.victronenergy.system)'
kind: inverter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/victron-energy.yaml
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.victron
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/victron/victron

connection:
  default_port: 502
  default_unit: 100
  transports:
  - tcp
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 800
    type: str
    length: 6
  checks:
  - {table: holding, address: 800, type: str, length: 6, printable: true}
  - {table: holding, address: 826, type: s16, in: [0, 1, 2, 3, 240]}

points:
  - {key: serial, label: Serial (System), table: holding, address: 800, type: str, length: 6, poll: slow}
  - {key: x.relay_0_state, label: CCGX Relay 1 state, table: holding, address: 806, type: u16, enum: relay_0_state, writable: true}
  - {key: x.relay_1_state, label: CCGX Relay 2 state, table: holding, address: 807, type: u16, enum: relay_0_state, writable: true}
  - {key: x.ac_pv_on_output_l1_power_808, label: PV - AC-coupled on output L1, table: holding, address: 808, type: u16, invalid: [65535], unit: W}
  - {key: x.ac_pv_on_output_l2_power_809, label: PV - AC-coupled on output L2, table: holding, address: 809, type: u16, invalid: [65535], unit: W}
  - {key: x.ac_pv_on_output_l3_power_810, label: PV - AC-coupled on output L3, table: holding, address: 810, type: u16, invalid: [65535], unit: W}
  - {key: x.ac_pv_on_grid_l1_power_811, label: PV - AC-coupled on input L1, table: holding, address: 811, type: u16, invalid: [65535], unit: W}
