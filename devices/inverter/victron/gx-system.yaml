  - {key: x.dc_battery_consumed_amphours, label: Battery Consumed Amphours (System), table: holding, address: 845, type: u16, invalid: [65535], unit: Ah, scale: -0.1, note: 'Negative scale from the list: the raw counter is positive, the value negative (amp-hours taken out carry the sign of a discharge current).'}
