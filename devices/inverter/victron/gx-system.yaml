notes:
- Unit id 100 is the GX itself (the list's unit id sheet; 0 works too, but many clients don't accept it).
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The list reserves the gaps in the system range 800–937 so it can be read in blocks across them (revision 53).
- 820–825 and 808–819 are 16-bit versions of 884–918 (revision 51); older firmware has only the 16-bit ones, 872–882 and 868/870
  came in revision 48.
- 0xFFFF (uint16), 0x8000 (int16), 0xFFFFFFFF (uint32) and 0x80000000 (int32) are commonly treated as not available; the list
  doesn't name such values (unverified). The 16-bit measurements list them as `invalid`.
- pv_power, grid_power and load_power are summed from the documented per-phase registers, the 32-bit ones (884–918) where the
  firmware has them, else the 16-bit ones (808–825). A phase or source an installation doesn't have is rejected or reads as
  0 and counts as 0. Genset power (823–825 / 914–918) is in none of them. evcc's sums of the same registers read with
  function 04 are kept as x.evcc_grid_power and x.evcc_pv_power.
- A Dynamic ESS error (5404 ≠ 0) only matters while Dynamic ESS is active (5400 = 1); a problem condition can't say that here.
- The system service has no alarm registers; alarms are in the VE.Bus, Multi, battery and other services under their own unit
  ids.
- 'evcc template `victron-energy` (grid, pv, battery) lists: Victron Energy.'
- Answers on unit id 100 (the GX itself); hass-victron reads only system and settings registers there.
- hass-victron divides the amp-hour counters by a negative factor, so consumed and discharged Ah come out negative (scale
  -0.1 for system battery Ah at 845).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
