enums:
  ac_in_1_type: {'0': Unused, '1': Grid, '2': Genset, '3': Shore}
  ac_active_in_active_input: {'0': AC Input 1, '1': AC Input 2, '240': Disconnected}
  state: {'0': 'Off', '1': Low Power, '2': Fault, '3': Bulk, '4': Absorption, '5': Float, '6': Storage, '7': Equalize, '8': Passthru, '9': Inverting, '10': Power assist, '11': Power supply, '252': External control}
  mode: {'1': Charger Only, '2': Inverter Only, '3': 'On', '4': 'Off'}
  alarms_high_temperature: {'0': Ok, '1': Warning, '2': Alarm}
  relay_0_state: {'0': Open, '1': Closed}
  mpp_operation_mode: {'0': 'Off', '1': Voltage/current limited, '2': MPPT active, '255': Not available}
  error_code: {'0': No error, '1': Battery temperature too high, '2': Battery voltage too high, '3': Battery temperature sensor miswired (+), '4': Battery temperature sensor miswired (-), '5': Battery temperature sensor disconnected, '6': Battery voltage sense miswired (+), '7': Battery voltage sense miswired (-), '8': Battery voltage sense disconnected, '9': Battery voltage wire losses too high, '17': Charger temperature too high, '18': Charger over-current, '19': Charger current polarity reversed, '20': Bulk time limit reached, '22': Charger temperature sensor miswired, '23': Charger temperature sensor disconnected, '34': Input current too high}
  alarms_low_soc: {'0': No alarm, '1': Warning, '2': Alarm}
  settings_ess_mode: {'0': self-consumption (battery-life), '1': self-consumption, '2': Keep charged, '3': External control}
  ess_disable_feed_in: {'0': Feed-in enabled, '1': Feed-in disabled}
  ess_disable_charge: {'0': Charge enabled, '1': Charge disabled}
  ess_sustain: {'0': Sustain inactive, '1': Sustain active}
  pv_0_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: x.ac_active_in_active_input, equals: 240}, kind: mains_lost, text: AC input disconnected}
  - {when: {key: state, equals: 2}, kind: fault, text: Inverter/charger fault (state 2)}
  - {when: {key: x.alarms_high_temperature, equals: 2}, kind: fault, text: Temperature alarm}
  - {when: {key: x.alarms_high_temperature, equals: 1}, kind: warning, text: Temperature alarm (warning)}
  - {when: {key: x.alarms_high_voltage, equals: 2}, kind: fault, text: High voltage alarm}
  - {when: {key: x.alarms_high_voltage, equals: 1}, kind: warning, text: High voltage alarm (warning)}
  - {when: {key: x.alarms_high_voltage_ac_out, equals: 2}, kind: fault, text: High AC-Out voltage alarm}
  - {when: {key: x.alarms_high_voltage_ac_out, equals: 1}, kind: warning, text: High AC-Out voltage alarm (warning)}
  - {when: {key: x.alarms_low_temperature, equals: 2}, kind: fault, text: Low battery temperature alarm}
  - {when: {key: x.alarms_low_temperature, equals: 1}, kind: warning, text: Low battery temperature alarm (warning)}
  - {when: {key: x.alarms_low_voltage, equals: 2}, kind: fault, text: Low voltage alarm}
  - {when: {key: x.alarms_low_voltage, equals: 1}, kind: warning, text: Low voltage alarm (warning)}
  - {when: {key: x.alarms_low_voltage_ac_out, equals: 2}, kind: fault, text: Low AC-Out voltage alarm}
  - {when: {key: x.alarms_low_voltage_ac_out, equals: 1}, kind: warning, text: Low AC-Out voltage alarm (warning)}
  - {when: {key: x.alarms_overload, equals: 2}, kind: fault, text: Overload alarm}
  - {when: {key: x.alarms_overload, equals: 1}, kind: warning, text: Overload alarm (warning)}
  - {when: {key: x.alarms_ripple, equals: 2}, kind: fault, text: High DC ripple alarm}
  - {when: {key: x.alarms_ripple, equals: 1}, kind: warning, text: High DC ripple alarm (warning)}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Error code {value}'}
  - {when: {key: x.alarms_low_soc, equals: 2}, kind: fault, text: Low SOC alarm}
  - {when: {key: x.alarms_low_soc, equals: 1}, kind: warning, text: Low SOC alarm (warning)}
  - {when: {key: x.alarms_short_circuit, equals: 2}, kind: fault, text: Short Circuit Alarm}
  - {when: {key: x.alarms_short_circuit, equals: 1}, kind: warning, text: Short Circuit Alarm (warning)}

notes:
- 'No fixed unit id: the GX assigns them (since Venus OS 2.60), normally the device instance; see Settings → Integrations
  → Modbus TCP server → Available services. 1 is only a placeholder.'
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
