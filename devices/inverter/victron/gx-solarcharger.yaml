  - {key: x.history_daily_0_pv_2_max_power, label: Maximum charge power today for tracker 2, table: holding, address: 3718, type: u16, unit: W}
  - {key: x.history_daily_0_pv_3_max_power, label: Maximum charge power today for tracker 3, table: holding, address: 3719, type: u16, unit: W}
  - {key: x.history_daily_1_pv_0_max_power, label: Maximum charge power yesterday tracker 0, table: holding, address: 3720, type: u16, unit: W}
  - {key: x.history_daily_1_pv_1_max_power, label: Maximum charge power yesterday tracker 1, table: holding, address: 3721, type: u16, unit: W}
  - {key: x.history_daily_1_pv_2_max_power, label: Maximum charge power yesterday tracker 2, table: holding, address: 3722, type: u16, unit: W}
  - {key: x.history_daily_1_pv_3_max_power, label: Maximum charge power yesterday tracker 3, table: holding, address: 3723, type: u16, unit: W}
  - {key: x.pv_0_p, label: PV power for tracker 0, table: holding, address: 3724, type: u16, unit: W}
  - {key: x.pv_1_p, label: PV power for tracker 1, table: holding, address: 3725, type: u16, unit: W}
  - {key: x.pv_2_p, label: PV power for tracker 2, table: holding, address: 3726, type: u16, unit: W}
  - {key: x.pv_3_p, label: PV power for tracker 3, table: holding, address: 3727, type: u16, unit: W}
