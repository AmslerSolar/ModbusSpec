modbusspec: 0
id: victron-gx-solarcharger
manufacturer: Victron Energy
name: 'GX Modbus-TCP: MPPT solar charger (com.victronenergy.solarcharger)'
kind: inverter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.victron
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/victron/victron

connection:
  default_port: 502
  default_unit: 226
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: battery_voltage, label: Battery voltage, table: holding, address: 771, type: u16, unit: V, scale: 0.01}
  - {key: x.dc_0_current, label: Battery current, table: holding, address: 772, type: s16, unit: A, scale: 0.1}
  - {key: battery_temperature, label: Battery temperature, table: holding, address: 773, type: s16, unit: °C, scale: 0.1, note: VE.Can MPPTs only.}
  - {key: x.mode, label: Charger on/off, table: holding, address: 774, type: u16, enum: mode, writable: true, note: VE.Can MPPTs only.}
  - {key: state, label: Charge state, table: holding, address: 775, type: u16, enum: state}
  - {key: x.pv_v, label: PV voltage, table: holding, address: 776, type: u16, unit: V, scale: 0.01, note: Not available when several VE.Can chargers are combined.}
  - {key: x.pv_current, label: PV current, table: holding, address: 777, type: s16, unit: A, scale: 0.1, note: Computed by the GX from PV power and voltage.}
  - {key: x.equalization_pending, label: Equalization pending, table: holding, address: 778, type: u16, enum: equalization_pending}
  - {key: x.equalization_time_remaining, label: Equalization time remaining, table: holding, address: 779, type: u16, unit: s, scale: 0.1}
  - {key: x.relay_0_state, label: Relay on the charger, table: holding, address: 780, type: u16, enum: relay_0_state}
  - {key: x.alarms_alarm, label: Alarm, table: holding, address: 781, type: u16, enum: alarms_alarm, note: Deprecated; always 0.}
  - {key: pv_energy_today, label: Yield today, table: holding, address: 784, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_max_power, label: Maximum charge power today, table: holding, address: 785, type: u16, unit: W}
  - {key: x.history_daily_1_yield, label: Yield yesterday, table: holding, address: 786, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_max_power, label: Maximum charge power yesterday, table: holding, address: 787, type: u16, unit: W}
  - {key: error_code, label: Error code, table: holding, address: 788, type: u16, enum: error_code}
  - {key: x.yield_power, label: PV power, table: holding, address: 789, type: u16, unit: W, scale: 0.1, note: '16-bit version of 792, in 10 W steps.'}
  - {key: x.yield_user_790, label: User yield, table: holding, address: 790, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.mpp_operation_mode, label: MPP operation mode, table: holding, address: 791, type: u16, enum: mpp_operation_mode}
  - {key: pv_power, label: PV power, table: holding, address: 792, type: u32, unit: W}
  - {key: x.load_i, label: Load current, table: holding, address: 794, type: s16, unit: A, scale: 0.1}
  - {key: x.pv_0_v, label: PV voltage for tracker 0, table: holding, address: 3700, type: u16, unit: V, scale: 0.01}
  - {key: x.pv_1_v, label: PV voltage for tracker 1, table: holding, address: 3701, type: u16, unit: V, scale: 0.01}
  - {key: x.pv_2_v, label: PV voltage for tracker 2, table: holding, address: 3702, type: u16, unit: V, scale: 0.01}
  - {key: x.pv_3_v, label: PV voltage for tracker 3, table: holding, address: 3703, type: u16, unit: V, scale: 0.01}
  - {key: x.history_daily_0_pv_0_yield, label: Yield today for tracker 0, table: holding, address: 3708, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_1_yield, label: Yield today for tracker 1, table: holding, address: 3709, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_2_yield, label: Yield today for tracker 2, table: holding, address: 3710, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_3_yield, label: Yield today for tracker 3, table: holding, address: 3711, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_0_yield, label: Yield yesterday for tracker 0, table: holding, address: 3712, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_1_yield, label: Yield yesterday for tracker 1, table: holding, address: 3713, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_2_yield, label: Yield yesterday for tracker 2, table: holding, address: 3714, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_3_yield, label: Yield yesterday for tracker 3, table: holding, address: 3715, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_0_max_power, label: Maximum charge power today for tracker 0, table: holding, address: 3716, type: u16, unit: W}
