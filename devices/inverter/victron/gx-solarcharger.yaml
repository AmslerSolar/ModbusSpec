  - {key: x.pv_0_mpp_operation_mode, label: MPP operation mode tracker 1, table: holding, address: 3731, type: u16, enum: mpp_operation_mode}
  - {key: x.pv_1_mpp_operation_mode, label: MPP operation mode tracker 2, table: holding, address: 3732, type: u16, enum: mpp_operation_mode}
  - {key: x.pv_2_mpp_operation_mode, label: MPP operation mode tracker 3, table: holding, address: 3733, type: u16, enum: mpp_operation_mode}
  - {key: x.pv_3_mpp_operation_mode, label: MPP operation mode tracker 4, table: holding, address: 3734, type: u16, enum: mpp_operation_mode}
  - {key: x.pv_0_enabled, label: Tracker 1 enabled, table: holding, address: 3735, type: u16, enum: pv_0_enabled, note: Only on MPPT RS.}
  - {key: x.pv_1_enabled, label: Tracker 2 enabled, table: holding, address: 3736, type: u16, enum: pv_0_enabled}
  - {key: x.pv_2_enabled, label: Tracker 3 enabled, table: holding, address: 3737, type: u16, enum: pv_0_enabled}
  - {key: x.pv_3_enabled, label: Tracker 4 enabled, table: holding, address: 3738, type: u16, enum: pv_0_enabled}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 3740, type: str, length: 8, writable: true, poll: slow}
  - {key: x.solarcharger_alarm_lowvoltage, label: solarcharger alarm lowvoltage, table: holding, address: 782, type: u16, enum: generic_alarm_ledger, verified: false, sources: [hass-victron, openems]}
  - {key: x.solarcharger_alarm_highvoltage, label: solarcharger alarm highvoltage, table: holding, address: 783, type: u16, enum: generic_alarm_ledger, verified: false, sources: [hass-victron, openems]}

enums:
  mode: {'1': 'On', '4': 'Off'}
  state: {'0': 'Off', '2': Fault, '3': Bulk, '4': Absorption, '5': Float, '6': Storage, '7': Equalize, '11': Other (Hub-1), '245': Wake-up, '252': External control}
  equalization_pending: {'0': 'No', '1': 'Yes', '2': Error, '3': Unavailable- Unknown}
  relay_0_state: {'0': Open, '1': Closed}
  alarms_alarm: {'0': No alarm, '2': Alarm}
  error_code: {'0': No error, '1': Battery temperature too high, '2': Battery voltage too high, '3': Battery temperature sensor miswired (+), '4': Battery temperature sensor miswired (-), '5': Battery temperature sensor disconnected, '6': Battery voltage sense miswired (+), '7': Battery voltage sense miswired (-), '8': Battery voltage sense disconnected, '9': Battery voltage wire losses too high, '17': Charger temperature too high, '18': Charger over-current, '19': Charger current polarity reversed, '20': Bulk time limit reached, '22': Charger temperature sensor miswired, '23': Charger temperature sensor disconnected, '34': Input current too high}
  mpp_operation_mode: {'0': 'Off', '1': Voltage/current limited, '2': MPPT active, '255': Not available}
  pv_0_enabled: {'0': Disabled, '1': Enabled}
  generic_alarm_ledger: {'0': OK, '1': WARNING, '2': ALARM}

problems:
  - {when: {key: state, equals: 2}, kind: fault, text: Solar charger fault (state 2)}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Solar charger error {value}'}

notes:
- No fixed unit id (since Venus OS 2.60 the GX assigns them, normally the device instance; see Settings → Integrations → Modbus
  TCP server → Available services). 226 is the list's id for the Cerbo GX VE.Direct port 1; other ports and GX models have
  other ids.
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
