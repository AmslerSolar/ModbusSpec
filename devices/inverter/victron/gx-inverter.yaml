  - {key: x.pv_0_mpp_operation_mode, label: MPP operation mode tracker 1, table: holding, address: 3169, type: u16, enum: pv_0_mpp_operation_mode}
  - {key: x.pv_1_mpp_operation_mode, label: MPP operation mode tracker 2, table: holding, address: 3170, type: u16, enum: pv_0_mpp_operation_mode}
  - {key: x.pv_2_mpp_operation_mode, label: MPP operation mode tracker 3, table: holding, address: 3171, type: u16, enum: pv_0_mpp_operation_mode}
  - {key: x.pv_3_mpp_operation_mode, label: MPP operation mode tracker 4, table: holding, address: 3172, type: u16, enum: pv_0_mpp_operation_mode}
  - {key: x.pv_0_enabled, label: Tracker 1 enabled, table: holding, address: 3173, type: u16, enum: pv_0_enabled, note: Only on Inverter RS.}
  - {key: x.pv_1_enabled, label: Tracker 2 enabled, table: holding, address: 3174, type: u16, enum: pv_0_enabled}
  - {key: x.pv_2_enabled, label: Tracker 3 enabled, table: holding, address: 3175, type: u16, enum: pv_0_enabled}
  - {key: x.pv_3_enabled, label: Tracker 4 enabled, table: holding, address: 3176, type: u16, enum: pv_0_enabled}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 3180, type: str, length: 8, writable: true, poll: slow}

enums:
  alarms_high_temperature: {'0': No alarm, '1': Warning, '2': Alarm}
  mode: {'1': Charger only, '2': Inverter only, '3': 'On', '4': 'Off', '5': Low Power/Eco, '251': Passthrough, '252': Standby, '253': Hibernate}
  state: {'0': 'Off', '1': Low power mode (search mode), '2': Fault, '9': Inverting (on)}
  pv_0_mpp_operation_mode: {'0': 'Off', '1': Voltage/current limited, '2': MPPT active, '255': Not available}
  pv_0_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: x.alarms_high_temperature, equals: 2}, kind: fault, text: High temperature alarm}
  - {when: {key: x.alarms_high_temperature, equals: 1}, kind: warning, text: High temperature alarm (warning)}
  - {when: {key: x.alarms_high_voltage, equals: 2}, kind: fault, text: High battery voltage alarm}
  - {when: {key: x.alarms_high_voltage, equals: 1}, kind: warning, text: High battery voltage alarm (warning)}
  - {when: {key: x.alarms_high_voltage_ac_out, equals: 2}, kind: fault, text: High AC-Out voltage alarm}
  - {when: {key: x.alarms_high_voltage_ac_out, equals: 1}, kind: warning, text: High AC-Out voltage alarm (warning)}
  - {when: {key: x.alarms_low_temperature, equals: 2}, kind: fault, text: Low temperature alarm}
  - {when: {key: x.alarms_low_temperature, equals: 1}, kind: warning, text: Low temperature alarm (warning)}
  - {when: {key: x.alarms_low_voltage, equals: 2}, kind: fault, text: Low battery voltage alarm}
  - {when: {key: x.alarms_low_voltage, equals: 1}, kind: warning, text: Low battery voltage alarm (warning)}
  - {when: {key: x.alarms_low_voltage_ac_out, equals: 2}, kind: fault, text: Low AC-Out voltage alarm}
  - {when: {key: x.alarms_low_voltage_ac_out, equals: 1}, kind: warning, text: Low AC-Out voltage alarm (warning)}
  - {when: {key: x.alarms_overload, equals: 2}, kind: fault, text: Overload alarm}
  - {when: {key: x.alarms_overload, equals: 1}, kind: warning, text: Overload alarm (warning)}
  - {when: {key: x.alarms_ripple, equals: 2}, kind: fault, text: Ripple alarm}
  - {when: {key: x.alarms_ripple, equals: 1}, kind: warning, text: Ripple alarm (warning)}
  - {when: {key: state, equals: 2}, kind: fault, text: Inverter fault (state 2)}
  - {when: {key: x.alarms_low_soc, equals: 2}, kind: fault, text: Low SOC alarm}
  - {when: {key: x.alarms_low_soc, equals: 1}, kind: warning, text: Low SOC alarm (warning)}

notes:
- No fixed unit id (since Venus OS 2.60 the GX assigns them, normally the device instance; see Settings → Integrations → Modbus
  TCP server → Available services). 226 is the list's id for the Cerbo GX VE.Direct port 1; other ports and GX models have
  other ids.
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
