# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-inverter
manufacturer: Victron Energy
name: 'GX Modbus-TCP: inverter (com.victronenergy.inverter)'
kind: inverter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py

connection:
  default_port: 502
  default_unit: 226
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: l1_current, label: Output current, table: holding, address: 3100, type: s16, unit: A, scale: 0.1}
  - {key: l1_voltage, label: Output voltage, table: holding, address: 3101, type: u16, unit: V, scale: 0.1}
  - {key: x.ac_out_l1_p, label: Output power, table: holding, address: 3102, type: s16, unit: W, scale: 10}
  - {key: battery_voltage, label: Battery voltage, table: holding, address: 3105, type: u16, unit: V, scale: 0.01}
  - {key: x.dc_0_current, label: Battery current, table: holding, address: 3106, type: s16, unit: A, scale: 0.1}
  - {key: x.alarms_high_temperature, label: High temperature alarm, table: holding, address: 3110, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_high_voltage, label: High battery voltage alarm, table: holding, address: 3111, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_high_voltage_ac_out, label: High AC-Out voltage alarm, table: holding, address: 3112, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_low_temperature, label: Low temperature alarm, table: holding, address: 3113, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_low_voltage, label: Low battery voltage alarm, table: holding, address: 3114, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_low_voltage_ac_out, label: Low AC-Out voltage alarm, table: holding, address: 3115, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_overload, label: Overload alarm, table: holding, address: 3116, type: u16, enum: alarms_high_temperature}
  - {key: x.alarms_ripple, label: Ripple alarm, table: holding, address: 3117, type: u16, enum: alarms_high_temperature}
  - {key: firmware, label: Firmware version, table: holding, address: 3125, type: u16, poll: slow}
  - {key: x.mode, label: Inverter on/off/eco, table: holding, address: 3126, type: u16, enum: mode, writable: true}
  - {key: x.product_id, label: Inverter model, table: holding, address: 3127, type: u16, poll: slow}
  - {key: state, label: Inverter state, table: holding, address: 3128, type: u16, enum: state}
  - {key: x.energy_inverter_to_ac_out, label: Energy from battery to AC-out, table: holding, address: 3130, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.energy_out_to_inverter, label: Energy from AC-out to battery, table: holding, address: 3132, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.energy_solar_to_ac_out, label: Energy from solar to AC-out, table: holding, address: 3134, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.energy_solar_to_battery, label: Energy from solar to battery, table: holding, address: 3136, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.pv_v, label: PV voltage (for single tracker units), table: holding, address: 3138, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_0_v, label: PV voltage for tracker 0, table: holding, address: 3140, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_1_v, label: PV voltage for tracker 1, table: holding, address: 3141, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_2_v, label: PV voltage for tracker 2, table: holding, address: 3142, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_3_v, label: PV voltage for tracker 3, table: holding, address: 3143, type: u16, unit: V, scale: 0.1}
  - {key: x.history_daily_0_pv_0_yield, label: Yield today for today on tracker 0, table: holding, address: 3148, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_1_yield, label: Yield today for today on tracker 1, table: holding, address: 3149, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_2_yield, label: Yield today for today on tracker 2, table: holding, address: 3150, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_3_yield, label: Yield today for today on tracker 3, table: holding, address: 3151, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_0_yield, label: Yield today for yesterday on tracker 0, table: holding, address: 3152, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_1_yield, label: Yield today for yesterday on tracker 1, table: holding, address: 3153, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_2_yield, label: Yield today for yesterday on tracker 2, table: holding, address: 3154, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_1_pv_3_yield, label: Yield today for yesterday on tracker 3, table: holding, address: 3155, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.history_daily_0_pv_0_max_power, label: Maximum power for today on tracker 0, table: holding, address: 3156, type: u16, unit: W}
  - {key: x.history_daily_0_pv_1_max_power, label: Maximum power for today on tracker 1, table: holding, address: 3157, type: u16, unit: W}
  - {key: x.history_daily_0_pv_2_max_power, label: Maximum power for today on tracker 2, table: holding, address: 3158, type: u16, unit: W}
  - {key: x.history_daily_0_pv_3_max_power, label: Maximum power for today on tracker 3, table: holding, address: 3159, type: u16, unit: W}
  - {key: x.history_daily_1_pv_0_max_power, label: Maximum power for yesterday on tracker 0, table: holding, address: 3160, type: u16, unit: W}
  - {key: x.history_daily_1_pv_1_max_power, label: Maximum power for yesterday on tracker 1, table: holding, address: 3161, type: u16, unit: W}
  - {key: x.history_daily_1_pv_2_max_power, label: Maximum power for yesterday on tracker 2, table: holding, address: 3162, type: u16, unit: W}
  - {key: x.history_daily_1_pv_3_max_power, label: Maximum power for yesterday on tracker 3, table: holding, address: 3163, type: u16, unit: W}
  - {key: x.pv_0_p, label: PV power for tracker 0, table: holding, address: 3164, type: u16, unit: W}
  - {key: x.pv_1_p, label: PV power for tracker 1, table: holding, address: 3165, type: u16, unit: W}
  - {key: x.pv_2_p, label: PV power for tracker 2, table: holding, address: 3166, type: u16, unit: W}
  - {key: x.pv_3_p, label: PV power for tracker 3, table: holding, address: 3167, type: u16, unit: W}
