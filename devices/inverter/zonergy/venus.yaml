modbusspec: 0
id: zonergy-venus
manufacturer: Zonergy
name: Venus hybrid inverter
kind: inverter

sources:
- id: zonergy-venus-home-assistant
  title: zonergy-venus-home-assistant (Home Assistant integration)
  url: https://github.com/lillo83/zonergy-venus-home-assistant
  license: MIT
  commit: 2e8a4b7c9cc391c864c176d044fbc8ee9c2ced77
  path: esphome/zonergy-venus-esp8266.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - zonergy-venus-home-assistant

