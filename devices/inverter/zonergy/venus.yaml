enums:
  stato_sistema: {'0': Pragmatic, '1': Avvio, '2': In Rete, '3': Fuori Rete, '4': Guasto, '5': PV Fuori Rete, '6': Calibrazione Tensione, '7': Autotest}
  sorgente_carica_rete_pv: {'0': 'Sorgente Carica: Rete + PV: on', '1': 'Sorgente Carica: Rete + PV: off'}
  forza_carica_batteria: {'0': 'Forza Carica Batteria: off', '1': 'Forza Carica Batteria: on'}

notes:
- Read over RS485 (Modbus RTU) by an ESPHome gateway; the project knows no Modbus TCP access. The original Wi-Fi dongle offers
  the same registers over Bluetooth and through the vendor cloud.
- The project reads grid and load values for one phase only (named R in its cloud decoder).
- The project drops battery and grid power readings outside ±6000 W as implausible.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
