modbusspec: 0
id: must-ph1100
manufacturer: MUST
name: PH11 (PH1100) three-phase hybrid inverters
kind: inverter

sources:
- id: must-inverter
  title: ha-must-inverter (Home Assistant integration)
  url: https://github.com/mukaschultze/ha-must-inverter
  license: MIT
  commit: 9fd33151694ce05ac1aa20f4a6b51c8135a21021
  path: custom_components/must_inverter/const.py, custom_components/must_inverter/mapper.py

connection:
  default_port: 502
  default_unit: 4
  transports:
  - rtu
  - tcp
  serial:
    baud: 19200
    format: 8N1

defaults:
  verified: false
  sources:
  - must-inverter

points:
  - {key: x.battery_equalization_interval, label: Battery Equalization Interval, table: holding, address: 10117, type: s16, unit: d, writable: true}
  - {key: x.battery_equalization_start_time, label: Battery Equalization Start Time, table: holding, address: 10118, type: datetime, length: 1, datetime: {hour: {register: 0, div: 100}, minute: {register: 0, mod: 100}}, writable: true}
  - {key: x.battery_equalization_end_time, label: Battery Equalization End Time, table: holding, address: 10119, type: datetime, length: 1, datetime: {hour: {register: 0, div: 100}, minute: {register: 0, mod: 100}}, writable: true}
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 15104, type: s16, unit: V, scale: 0.1}
  - {key: x.batt_current, label: Battery Current, table: holding, address: 15105, type: s16, unit: A, scale: 0.1}
  - {key: x.batt_power, label: Battery Power, table: holding, address: 15106, type: s16, unit: W}
  - {key: x.inverter_temperature, label: Inverter Temperature, table: holding, address: 15107, type: s16, unit: °C, scale: 0.1}
