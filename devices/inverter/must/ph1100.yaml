  - {key: x.total_load_energy, label: Total Load Energy, unit: kWh, sum: [{key: x.total_load_energy_high}, {key: x.total_load_energy_low}]}
  - {key: x.total_battery_charge_energy, label: Total Battery Charge Energy, unit: kWh, sum: [{key: x.total_battery_charge_energy_high}, {key: x.total_battery_charge_energy_low}]}
  - {key: x.total_battery_discharge_energy, label: Total Battery Discharge Energy, unit: kWh, sum: [{key: x.total_battery_discharge_energy_high}, {key: x.total_battery_discharge_energy_low}]}
  - {key: x.total_inverter_charge_energy, label: Total Inverter Charge Energy, unit: kWh, sum: [{key: x.total_inverter_charge_energy_high}, {key: x.total_inverter_charge_energy_low}]}
  - {key: x.total_inverter_discharge_energy, label: Total Inverter Discharge Energy, unit: kWh, sum: [{key: x.total_inverter_discharge_energy_high}, {key: x.total_inverter_discharge_energy_low}]}
  - {key: x.total_grid_charge_energy, label: Total Grid Charge Energy, unit: kWh, sum: [{key: x.total_grid_charge_energy_high}, {key: x.total_grid_charge_energy_low}]}
  - {key: x.total_grid_discharge_energy, label: Total Grid Discharge Energy, unit: kWh, sum: [{key: x.total_grid_discharge_energy_high}, {key: x.total_grid_discharge_energy_low}]}
  - {key: x.total_mains_charge_energy_ct, label: Total Mains Charge Energy (CT), unit: kWh, sum: [{key: x.total_mains_charge_energy_ct_high}, {key: x.total_mains_charge_energy_ct_low}]}
  - {key: x.total_mains_discharge_energy_ct, label: Total Mains Discharge Energy (CT), unit: kWh, sum: [{key: x.total_mains_discharge_energy_ct_high}, {key: x.total_mains_discharge_energy_ct_low}]}

notes:
- ha-must-inverter reads the PH1100 in blocks 10102-10119, 15104-15119, 20001-20003 and 25225-25339.
- The serial number is three registers, each shown as five decimal digits.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
