  - {key: x.grid_protect_standard, label: Grid protect standard, table: holding, address: 20111, type: u16, enum: grid_protect_standard, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Grid Protect Standard}]}
  - {key: x.solar_use_aim, label: Solar use aim, table: holding, address: 20112, type: u16, enum: solar_use_aim, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Solar Use Aim}]}
  - {key: x.max_discharge_current, label: Inverter max discharger current, table: holding, address: 20113, type: u16, unit: A, scale: 0.1, writable: true, poll: slow, note: 'AC current, 1.0–21.7 A; 48 V models only.', conflicts: [{sources: [must-inverter], type: s16, label: Max Discharger Current}]}
  - {key: x.battery_stop_discharging_voltage, label: Battery stop discharging voltage, table: holding, address: 20118, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '44.0–58.0 V, default 46.0 V.', conflicts: [{sources: [must-inverter], type: s16, label: Battery Stop Discharging Voltage}]}
