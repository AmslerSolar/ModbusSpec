notes:
- Addresses are the documents' decimal register numbers, used as protocol addresses unchanged (holding registers, function
  03). The PV charger part (10001 ff., 15201 ff.) and the inverter part (20000 ff., 25201 ff.) both answer on unit id 4.
- Serial settings aren't stated in either document.
- Signedness of the registers isn't stated; values that can go negative (powers, currents of the inverter and grid side, temperatures)
  are read signed, the rest unsigned (assumed).
- The energy counters are split into a high word in 1000 kWh and a low word in 0.1 kWh; the derived values add both.
- 'EP models name the energy use modes differently: 48 V: 1 = BAU, 3 = UTI, 4 = BOU; 12 / 24 V: 1 = BU, 3 = UTI. 12 and 24
  V PV / PH models have no SUB (2). Solar use aim on EP models: 0 = LB, 1 = LU.'
- 'Left out: calibration coefficients (10006–10008, 20009–20016), the read-only copies of serial number and versions (25269–25272),
  Equalization activate now (10124), Remove accumulated data (10112, 20213) and Reset parameters (20214), warning message
  2 (all bits reserved).'
- 'Version 1.4.3 (2017) differs: 10101 charger enable, 10102 absorb voltage and 10109 absorb charge current; 20105–20107 on-grid
  / grid charge / discharge enables, 20110 time mode, 20114–20117 and 20120 limits, 20126 absorb charge current, 20129–20131
  battery type, Ah and low return voltage, 20133–20140 charge / discharge time windows, 20161–20193 grid-code settings, 20201–20207
  clock and 20209–20210 force charge / discharge exist only there. It has battery types 0–2 only at 10110 (0 none, 1 lead
  acid, 2 lithium), energy use modes 0–4 (PL, FL, FS, UPS, PO; newer: 0 SUB, 1 SBU, 3 UTI), no grid charging work state (6)
  and no equalization charging state (3).'
- 1.4.3 gives the machine type at 20001 only (PH1000 / PH3000 / PH1800); 1.4.15 splits it into letters (20000) and number
  (20001).
- The model (PV1800 or PV1900) is chosen in the integration's settings or taken from the machine type at 20000-20001 (two
  ASCII characters and a number). The PV1900 adds battery SOC/SOH (113-114) and a second PV charger (16207-16208); on it 15207-15208
  are the PV1 charger current and power.
- 'ha-must-inverter reads in blocks 10101-10124, 15201-15221, 20000-20016, 20101-20214 and 25201-25279. It warns that reading
  10009-10100 or 20016-20100 in one request made the inverter shut down and the charger stop until a full power cycle: don''t
  read across those gaps.'
- The inverter error bit table in ha-must-inverter is one entry short (a missing comma joins bit 15 of 25261 and bit 0 of
  25262), so the integration only decodes 25261. The two texts are split again here and 25262 gets the remaining bits.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
