  - {key: x.battery_low_voltage, label: Battery low voltage, table: holding, address: 20127, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '40.0–48.0 V, default 40.8 V.', conflicts: [{sources: [must-inverter], type: s16, label: Battery Low Voltage (Inverter)}]}
  - {key: x.battery_high_voltage, label: Battery high voltage, table: holding, address: 20128, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '58.0–60.0 V, default 60.0 V.', conflicts: [{sources: [must-inverter], type: s16, label: Battery High Voltage (Inverter)}]}
  - {key: x.max_combine_charger_current, label: Max combine charger current, table: holding, address: 20132, type: u16, unit: A, scale: 0.1, writable: true, poll: slow, note: 'DC current, 1.0–140.0 A, default 60.0 A (PV and PH models).', conflicts: [{sources: [must-inverter], type: s16, label: Max Combine Charger Current}]}
