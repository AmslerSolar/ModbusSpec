#
# Written from the MUST PH1800 / PV1800 / EP1800 / PV3500 / EP3500 RS485 Modbus RTU communication protocol (1.4.15),
# with the older PH / PV protocol 1.4.3 (2017-03-13) compared; English spreadsheets as kept in open-source repositories.

modbusspec: 0
id: must-pv1800
manufacturer: MUST
name: PV18 / PV19 (PV1800 / PV1900) off-grid inverters
kind: inverter

sources:
- title: PH1800 PV1800 EP1800 PV3500 EP3500 RS485 Modbus RTU communication protocol
  version: 1.4.15
  url: https://github.com/softwarecrash/Solar2MQTT-ESP8266/blob/216a4bd46b42daf5976853e8241a3831e9f6f464/Protocol/ToDo/PH1800%20PV1800%20EP1800%20PV3500%20EP3500%20RS485%20Modbud%20RTU%20communication%20Protocol%201.4.15%20%281%29.xlsx
  sha256: 91adc7413534b859c506aa59b633c7d3b9c0e1ed7941d6913b8c54a9f4d884cb
- title: PH PV RS485 Modbus RTU communication protocol
  version: 1.4.3 (2017-03-13)
  url: https://github.com/vladyspavlov/esphome-must-inverter/blob/11946ecf313f72a2530fee8550418989694a45f6/docs/PH%20PV%20RS485%20Modbud%20RTU%20communication%20Protocol1.4.3%20%2020170313.x.xlsx
  sha256: bf19c25d4a239537b8caa134058b7a5ac65b555dd82d1623d2d8ece36f750fdd
- id: must-inverter
  title: ha-must-inverter (Home Assistant integration)
  url: https://github.com/mukaschultze/ha-must-inverter
  license: MIT
  commit: 9fd33151694ce05ac1aa20f4a6b51c8135a21021
  path: custom_components/must_inverter/const.py, custom_components/must_inverter/mapper.py

connection:
  default_port: 502
  default_unit: 4
  transports:
  - rtu
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 20002
    type: u32
  checks:
  # machine type letters
  - table: holding
    address: 20000
    type: str
    length: 1
    in:
    - PH
    - PV
    - EP
  # AC voltage grade
  - table: holding
    address: 25202
    type: u16
    in:
    - 120
    - 230

models:
  - {id: pv1900, name: PV1900 (PV19)}

points:
  # PV charger settings (10001 ff.)
  - {key: x.charger_machine_type, label: Charger type of machine, table: holding, address: 10001, type: u16, poll: slow, note: The document names PC1600 here; how the value encodes it isn't stated.}
  - {key: x.charger_serial, label: Charger serial number, table: holding, address: 10002, type: u32, poll: slow, note: 'High word 10002, low word 10003.'}
  - {key: x.charger_hardware_version, label: Charger hardware version, table: holding, address: 10004, type: u16, poll: slow}
  - {key: x.charger_software_version, label: Charger software version, table: holding, address: 10005, type: u16, poll: slow}
  - {key: x.float_voltage, label: Float voltage, table: holding, address: 10103, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '48.0–58.4 V, default 54.0 V (1.4.3 calls this register the refloat voltage).', conflicts: [{sources: [must-inverter], type: s16, label: Float Voltage}]}
  - {key: x.absorption_voltage, label: Absorption voltage, table: holding, address: 10104, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '48.0–58.4 V, default 56.4 V (1.4.3 calls this register the float voltage).', conflicts: [{sources: [must-inverter], type: s16, label: Absorption Voltage}]}
  - {key: x.charger_battery_low_voltage, label: Battery low voltage, table: holding, address: 10105, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '34.0–44.0 V, default 34.0 V (PV and PH models).', conflicts: [{sources: [must-inverter], type: s16, label: Battery Low Voltage}]}
  - {key: x.charger_battery_high_voltage, label: Battery high voltage, table: holding, address: 10107, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '58.0–60.0 V, default 60.0 V (PV and PH models).', conflicts: [{sources: [must-inverter], type: s16, label: Battery High Voltage}]}
  - {key: x.pv_max_charger_current, label: PV max charger current, table: holding, address: 10108, type: u16, unit: A, scale: 0.1, writable: true, poll: slow, note: 0–80.0 A (PV and PH models)., conflicts: [{sources: [must-inverter], type: s16, label: Max Charger Current}]}
  - {key: x.battery_type, label: Battery type, table: holding, address: 10110, type: u16, enum: battery_type, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Type}]}
  - {key: x.battery_capacity, label: Battery Ah, table: holding, address: 10111, type: u16, unit: Ah, writable: true, min: 0, max: 900, poll: slow, note: Default 100 Ah., conflicts: [{sources: [must-inverter], type: s16, label: Battery Capacity (Ah)}]}
  - {key: x.battery_equalization_enable, label: Battery equalization enable, table: holding, address: 10118, type: u16, enum: off_on, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Equalization}]}
  - {key: x.battery_equalization_voltage, label: Battery equalization voltage, table: holding, address: 10119, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: 'Default 58.4 V (48 V), 29.2 V (24 V), 14.6 V (12 V).', conflicts: [{sources: [must-inverter], type: s16, label: Battery Equalization Voltage}]}
  - {key: x.battery_equalization_time, label: Battery equalized time, table: holding, address: 10121, type: u16, unit: min, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Equalization Time}]}
  - {key: x.battery_equalization_timeout, label: Battery equalized timeout, table: holding, address: 10122, type: u16, unit: min, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Equalization Timeout}]}
  - {key: x.battery_equalization_interval, label: Equalization interval, table: holding, address: 10123, type: u16, unit: d, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Equalization Interval}]}
  # PV charger live values (15201 ff.)
  - {key: x.charger_workstate, label: Charger workstate, table: holding, address: 15201, type: u16, enum: charger_workstate, conflicts: [{sources: [must-inverter], type: s16, label: Charger Workstate}]}
  - {key: x.mppt_state, label: MPPT state, table: holding, address: 15202, type: u16, enum: mppt_state, conflicts: [{sources: [must-inverter], type: s16, label: MPPT State}]}
  - {key: x.charging_state, label: Charging state, table: holding, address: 15203, type: u16, enum: charging_state, conflicts: [{sources: [must-inverter], type: s16, label: Charging State}]}
  - {key: x.pv_voltage, label: PV voltage, table: holding, address: 15205, type: u16, unit: V, scale: 0.1, conflicts: [{sources: [must-inverter], type: s16, label: PV Voltage}]}
  - {key: x.charger_battery_voltage, label: Battery voltage (charger), table: holding, address: 15206, type: u16, unit: V, scale: 0.1, conflicts: [{sources: [must-inverter], type: s16, label: Battery Voltage}]}
  - {key: x.charger_current, label: Charger current, table: holding, address: 15207, type: u16, unit: A, scale: 0.1, conflicts: [{sources: [must-inverter], type: s16, label: Charger Current}]}
  - {key: pv_power, label: Charger power, table: holding, address: 15208, type: u16, unit: W, note: Power of the PV charger (0–5000 W)., conflicts: [{sources: [must-inverter], type: s16, label: Charger Power}]}
  - {key: x.charger_radiator_temperature, label: Charger radiator temperature, table: holding, address: 15209, type: s16, unit: °C}
  - {key: x.external_temperature, label: External temperature, table: holding, address: 15210, type: s16, unit: °C}
  - {key: x.charger_battery_relay, label: Battery relay, table: holding, address: 15211, type: u16, enum: relay, conflicts: [{sources: [must-inverter], type: s16, label: Relay Battery}]}
  - {key: x.charger_pv_relay, label: PV relay, table: holding, address: 15212, type: u16, enum: relay, conflicts: [{sources: [must-inverter], type: s16, label: Relay PV}]}
  - {key: x.charger_error, label: Charger error message, table: holding, address: 15213, type: u16, flags: charger_error}
  - {key: x.charger_warning, label: Charger warning message, table: holding, address: 15214, type: u16, flags: charger_warning}
  - {key: x.charger_battery_voltage_grade, label: Battery voltage grade (charger), table: holding, address: 15215, type: u16, unit: V, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Battery Voltage Grade}]}
  - {key: x.charger_rated_current, label: Charger rated current, table: holding, address: 15216, type: u16, unit: A, scale: 0.1, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Rated Current}]}
  - {key: x.pv_energy_high, label: Accumulated PV power high, table: holding, address: 15217, type: u16, unit: kWh, scale: 1000, poll: slow}
  - {key: x.pv_energy_low, label: Accumulated PV power low, table: holding, address: 15218, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.accumulated_days, label: Accumulated day, table: holding, address: 15219, type: u16, unit: d, poll: slow, conflicts: [{sources: [must-inverter], unit: h, label: Accumulated Time (hours)}]}
  - {key: x.accumulated_hours, label: Accumulated hour, table: holding, address: 15220, type: u16, unit: h, poll: slow, conflicts: [{sources: [must-inverter], unit: min, label: Accumulated Time (minutes)}]}
  - {key: x.accumulated_minutes, label: Accumulated minute, table: holding, address: 15221, type: u16, unit: min, poll: slow, conflicts: [{sources: [must-inverter], unit: s, label: Accumulated Time (seconds)}]}
  # Inverter identity and settings (20000 ff.)
  - {key: x.machine_type_letters, label: Type of machine high, table: holding, address: 20000, type: str, length: 1, poll: slow, note: 'PH, EP or PV.'}
  - {key: x.machine_type_number, label: Type of machine low, table: holding, address: 20001, type: u16, poll: slow, note: '1800, 3000, …'}
  - {key: serial, label: Serial number, table: holding, address: 20002, type: u32, poll: slow, note: 'High word 20002, low word 20003; the same number is also at 25269/25270 (read-only).'}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 20004, type: u16, poll: slow}
  - {key: firmware, label: Software version, table: holding, address: 20005, type: u16, poll: slow}
  - {key: x.protocol_version, label: Communication protocol edition, table: holding, address: 20006, type: u16, poll: slow, note: 1.04.15 for this document. Not in 1.4.3.}
  - {key: x.offgrid_work_enable, label: Inverter offgrid work enable, table: holding, address: 20101, type: u16, enum: off_on, writable: true, poll: slow, note: 1 = output stays on when the grid is lost., conflicts: [{sources: [must-inverter], type: s16, label: Offgrid Work}]}
  - {key: x.output_voltage_set, label: Inverter output voltage set, table: holding, address: 20102, type: u16, unit: V, scale: 0.1, writable: true, min: 220, max: 240, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Output Voltage}]}
  - {key: x.output_frequency_set, label: Inverter output frequency set, table: holding, address: 20103, type: u16, unit: Hz, scale: 0.01, writable: true, poll: slow, note: 50.00 or 60.00 Hz., conflicts: [{sources: [must-inverter], type: s16, label: Output Frequency}]}
  - {key: x.search_mode_enable, label: Inverter search mode enable, table: holding, address: 20104, type: u16, enum: off_on, writable: true, poll: slow, conflicts: [{sources: [must-inverter], type: s16, label: Power Saving Mode}]}
