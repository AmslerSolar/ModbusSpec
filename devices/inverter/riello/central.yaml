notes:
- Modbus RTU (RS-485 slots 1 and 2, RS-232 COM-2, 9600 bit/s) and Modbus/TCP. Registers are read with function 03 (holding).
- The document numbers registers from 1 and doesn't state the address base. Addresses here are register − 1 (unverified).
  To find out, try register 80 (phase number, 0x0031 / 0x0033) at address 79 first, then at 80, and use whichever answers
  with a valid value.
- Byte order isn't stated for the central inverter. If the phase number (document register 80) reads 0x3100 / 0x3300, the
  inverter sends LSByte first (as the document describes for the String Box) and every register must be byte-swapped; readers
  detect this.
- 0xFFFF in any register means "value not available" (stated); an all-ones 32-bit pair presumably means the same (not stated).
  Signed points list it as −1.
- Registers 42–53 need firmware 1.2.5 or later; if a request for 7–53 is rejected, read 7–9, 11–41 and 42–53 separately (older
  firmware refuses 42–53).
- 'There is no DC power register: PV power can be computed as Σ Vpv × Ipv of the PV inputs (else the AC power, derived above).
  The inverter doesn''t measure the grid connection.'
- Default unit id (1) and TCP port (502) aren't stated in the document.
- 'The alarm-word bit numbering is uncertain: the tables count bits 1–16, while the Power Reducer section refers to "bit 0
  of register 8" for the write-inhibit state, which no table lists. This file takes bit 1 as the least significant bit.'
- The String Box (a separate RTU device with its own map, mappatura-modbus-sb-en) isn't covered.
