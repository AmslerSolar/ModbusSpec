  - {when: {key: x.alarm_word_7, bit: 13}, kind: mains_lost, text: Grid frequency out of range (master) (alarm 7 bit 14)}
  - {when: {key: x.alarm_word_7, bit: 11}, kind: fault, text: Grid impedance out of range (master) (alarm 7 bit 12)}
  - {when: {key: x.alarm_word_7, bit: 9}, kind: fault, text: Relay failure (alarm 7 bit 10)}
  - {when: {key: x.alarm_word_7, bit: 7}, kind: fault, text: ENS grid voltage mismatch (alarm 7 bit 8)}
  - {when: {key: x.alarm_word_7, bit: 6}, kind: fault, text: ENS grid frequency mismatch (alarm 7 bit 7)}
  - {when: {key: x.alarm_word_7, bit: 5}, kind: fault, text: ENS grid impedance mismatch (alarm 7 bit 6)}
  - {when: {key: x.alarm_word_7, bit: 4}, kind: fault, text: ENS measurement mismatch (alarm 7 bit 5)}
  - {when: {key: x.alarm_word_7, bit: 3}, kind: fault, text: AC current offset failure (alarm 7 bit 4)}
  - {when: {key: x.alarm_word_7, bit: 2}, kind: fault, text: PV isolation failure (alarm 7 bit 3)}
  - {when: {key: x.alarm_word_7, bit: 1}, kind: mains_lost, text: Grid voltage out of range (master) (alarm 7 bit 2)}
  - {when: {key: x.alarm_word_8, bit: 15}, kind: fault, text: PV voltage too high (alarm 8 bit 16)}
  - {when: {key: x.alarm_word_8, bit: 14}, kind: fault, text: Self-test failed (alarm 8 bit 15)}
  - {when: {key: x.alarm_word_8, bit: 13}, kind: warning, text: Over-temperature (alarm 8 bit 14)}
  - {when: {key: x.alarm_word_8, bit: 11}, kind: fault, text: DC bus failure (alarm 8 bit 12)}
  - {when: {key: x.alarm_word_8, bit: 10}, kind: fault, text: Leakage current too high (alarm 8 bit 11)}
  - {when: {key: x.alarm_word_8, bit: 9}, kind: mains_lost, text: No grid (alarm 8 bit 10)}
