notes:
- 'The vendor document named by the project (V1.30) is not at hand here; every point is as the project gives it.'
- 'No identification: the protocol has no serial number or model register. The project only reads the machine power type
  (input 0x38) for the model name.'
- 'Settings are holding registers (function 03, written with 06); measurements are input registers (function 04).
  32-bit counters are most significant word first, which the project checked on a real inverter.'
- 'Power signs are not stated by the project.'
- 'The project gives the unit W for the apparent and reactive powers; VA and var are used here.'
- 'Left out: the derived battery energy (0x011A × 0x011B, and that times the SOC), and the factory reset (holding 0x49) and
  error log reset (0x4B) commands, which the project leaves out on purpose.'
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
