notes:
- 'Two register maps share this file: Hybrid G3 (X1 / X3) and Hybrid G4 (X1 / X3). Most live values sit at the same addresses;
  settings, firmware registers, fault tables and some battery registers differ, and points say which models they apply to.
  Telling the models apart isn''t covered by the documents: the serial-number prefixes in `models` are not stated in them
  (assumed).'
- 'Addresses are the documents'' hexadecimal register addresses, used as they are (0-based): function 03 reads the holding
  table, function 04 the input table. 32-bit values have the low word first, as the documents state.'
- 'G4: Modbus RTU on RS485, unit 1, 19200 baud 8N1 by default (settable: holding 0x00AF address, 0x00B0 baud rate). The G4
  inverter itself has no Modbus TCP: TCP on port 502 (unit 1) goes through SolaX''s monitoring module. G3: Modbus TCP on the
  LAN port 502 (unit 1) and RTU at 115200 baud by default.'
- At least 1 s between requests and a 1 s response timeout; up to 125 registers per read.
- 'Settings are read in the holding table but most are written at other addresses with function 06 (e.g. G4 work mode: read
  0x008B, write 0x001F); the notes on the points give the write address. Many write registers go to EEPROM, which wears out:
  don''t write them cyclically. Remote power control (VPP, G4 function 16 at 0x007C ff.) is left out.'
- Grid-side power (0x0046) is positive when feeding in; the inverter's own AC output (X1 0x0002, X3 0x006C/0x0070/0x0074)
  and the battery power have no stated sign.
- 'Left out: grid-code protection limits and trip times, power-factor and Q(U) curves, Italian self-test values, charge /
  discharge / heating time periods, generator, dry-contact, peak-shaving and TOU parameters, parallel-system registers (input
  0x01DD ff.), the G3 block at input 0x00BA–0x00C8 that repeats single-phase values, the BMS slave versions and serials, and
  EV charger / DataHub registers (separate documents).'
- The G4 export-limit and some power settings count in 1 W on X1 and 10 W on X3. The G3 documents also cover the X1-AC inverter
  (not a model here).
- Models openwb_g3, openwb_g4, solax_modbus_gen3_x1_ac, solax_modbus_gen3_x1_ac_hybrid, solax_modbus_gen5_x1_hybrid, solax_modbus_gen4_x3_ac,
  solax_modbus_gen5_x3_hybrid_mppt5, solax_modbus_gen4_x1_mic_mppt3, solax_modbus_max, solax_modbus_gen2_x1_hybrid, solax_modbus_gen3_x3_ac,
  solax_modbus_gen4_x1_ac, solax_modbus_gen5_x1_hybrid_mppt3, solax_modbus_gen6_x1_hybrid_mppt3, solax_modbus_gen6_x1_hybrid_mppt4,
  solax_modbus_gen5_x3_hybrid, solax_modbus_gen5_x3_hybrid_mppt3, solax_modbus_gen6_x3_hybrid_mppt3, solax_modbus_gen6_x3_hybrid,
  solax_modbus_gen2_x1_mic, solax_modbus_gen4_x1_mic, solax_modbus_gen_x3_mic, solax_modbus_gen2_x3_mic, solax_modbus_gen2_x3_mic_mppt3
  come from projects and are listed after a model without a match, so detection never reaches them; their points apply only
  when a reader selects such a model by hand.
- Identification as solax-modbus recognises the device (not checked against a document).
- 'evcc template `solax-g2` (grid, pv) lists: Solax X3-MIC G2; Solax X3-PRO G2; Qcells Q.VOLT P5T-X; Qcells Q.VOLT P17T-X.'
- 'evcc template `solax` (grid, pv, battery) lists: Solax Hybrid X1/X3 G3/G4; Qcells Q.HOME ESS HYB-G3.'
- The template has the option `mppt3` (default false); points used only with another value say so in their note.
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- If the serial number can't be read there, the project tries other addresses as well; model matches only use the first.
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- 'Left out: backup_charge_start (holding 149, datetime) from solax-modbus overlaps charge_end_1 (holding 148, datetime, 2
  registers); check a document.'
- 'Left out: backup_charge_end (holding 151, datetime) from solax-modbus overlaps discharge_start_1 (holding 150, datetime,
  2 registers); check a document.'
- 'Left out: meter_1_direction (holding 171, u16) from solax-modbus overlaps registration_code_pocket (holding 170, str, 5
  registers); check a document.'
- 'Left out: meter_2_direction (holding 172, u16) from solax-modbus overlaps registration_code_pocket (holding 170, str, 5
  registers); check a document.'
- 'Left out: inverter_temperature (input 8, s16) from solax-modbus overlaps inverter_temperature (input 8, s16); check a document.'
- 'Left out: pv_l1_current (input 1034, u16) from evcc, solax-modbus overlaps counter_power_1033 (input 1033, s32); check
  a document.'
- 'Left out: today_s_grid_import (input 1084, u16) from solax-modbus overlaps grid_power (input 1083, s32); check a document.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
