modbusspec: 0
id: solax-mega-forth
manufacturer: SolaX
name: X3-MEGA / X3-FORTH inverters
kind: inverter

sources:
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_solax_mega_forth.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  serial:
    table: input
    address: 50
    type: str
    length: 8
  any:
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G04
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G05
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G06
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G075
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G08
  - table: input
    address: 50
    type: str
    length: 8
    prefix: X3G01
  - table: input
    address: 50
    type: str
    length: 8
    prefix: A3F10
  - table: input
    address: 50
    type: str
    length: 8
    prefix: MAXMEG_G2

defaults:
  verified: false
  sources:
  - solax-modbus

models:
