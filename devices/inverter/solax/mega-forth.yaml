  - {id: gen2_max_mppt6, name: 'GEN2 | MAX | MPPT6 (prefix X3G04*, X3G06*)'}
  - {id: gen2_max_mppt9, name: 'GEN2 | MAX | MPPT9 (prefix X3G075*, X3G08*, X3G01*, A3F10*)'}

