enums:
  charger_use_mode: {'0': Economic Mode, '1': Green Mode, '2': Ease Use Mode, '3': Manual Mode}
  eps_mute: {'0': 'Off', '1': 'On'}
  language: {'0': Nihongo, '1': Chūgokugo}
  manual_mode: {'0': Stop Charge and Discharge, '1': Force Charge, '2': Force Discharge}
  power_factor_mode: {'0': 'Off', '1': Over Excited, '2': Under Excited, '3': Fix Q}
  eps_set_frequency: {'0': '50', '1': '60'}

notes:
- If the serial number can't be read there, the project tries other addresses as well; model matches only use the first.
- The sources don't state the default unit id; 1 is a guess.
- Identification as solax-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
