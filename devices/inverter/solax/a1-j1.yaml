modbusspec: 0
id: solax-a1-j1
manufacturer: SolaX
name: A1 / J1 hybrid inverters
kind: inverter

sources:
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_solax_a1j1.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: little

identify:
  serial:
    table: holding
    address: 0
    type: str
    length: 7
  any:
  - table: holding
    address: 0
    type: str
    length: 7
    prefix: J1
  - table: holding
    address: 0
    type: str
    length: 7
    prefix: A1

defaults:
  verified: false
  sources:
  - solax-modbus

models:
  - {id: j1_hybrid, name: J1 | HYBRID (prefix J1*), match: {table: holding, address: 0, type: str, length: 7, prefix: J1}}
  - {id: a1_hybrid, name: A1 | HYBRID (prefix A1*), match: {table: holding, address: 0, type: str, length: 7, prefix: A1}}

points:
  - {key: x.seriesnumber, label: Series Number, table: holding, address: 0, type: str, length: 7, note: The project decodes this text with little word order (registers in reverse order).}
  - {key: x.firmware_version_inverter_master, label: Firmware Version Inverter Master, table: holding, address: 35, type: u16, models: [j1_hybrid]}
  - {key: x.firmware_version_manager, label: Firmware Version Manager, table: holding, address: 36, type: u16, models: [j1_hybrid]}
  - {key: x.firmware_version_manager_bootloader, label: Firmware Version Manager Bootloader, table: holding, address: 37, type: u16, models: [j1_hybrid]}
  - {key: x.firmware_version_modbustcp, label: Firmware Version Modbus, table: holding, address: 38, type: u16, models: [j1_hybrid]}
  - {key: x.rtc, label: RTC, table: holding, address: 39, type: datetime, length: 6, datetime: {second: {register: 0}, minute: {register: 1}, hour: {register: 2}, day: {register: 3}, month: {register: 4}, year: {register: 5, offset: 2000}}, models: [j1_hybrid]}
  - {key: x.charger_use_mode, label: Charger Use Mode, table: holding, address: 45, type: u16, enum: charger_use_mode, models: [j1_hybrid]}
  - {key: x.charger_start_time_1, label: Charger Start Time 1, table: holding, address: 46, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, models: [j1_hybrid]}
  - {key: x.charger_stop_time_1, label: Charger Stop Time 1, table: holding, address: 47, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, models: [j1_hybrid]}
  - {key: x.charger_start_time_2, label: Charger Start Time 2, table: holding, address: 48, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, models: [j1_hybrid]}
  - {key: x.charger_stop_time_2, label: Charger Stop Time 2, table: holding, address: 49, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, models: [j1_hybrid]}
  - {key: x.forcharge_soc_economic, label: ForceCharge SOC - Economic, table: holding, address: 51, type: u16, unit: '%', models: [j1_hybrid], conflicts: [{sources: [solax-modbus], label: ForceCharge SOC - Green}]}
