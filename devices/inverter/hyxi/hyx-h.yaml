modbusspec: 0
id: hyxi-hyx-h
manufacturer: HYXIPower
name: HYX-H hybrid inverters (H5–12K-HT, H15–25K-HT, H6–15K-HTA/HTAC)
kind: inverter

sources:
- id: hyxi-cloud
  title: ha-hyxi-cloud (Home Assistant integration)
  url: https://github.com/Veldkornet/ha-hyxi-cloud
  license: MIT
  commit: 0d1172e7a231f13a6e1f9b1eb305a396c3a4e002
  path: custom_components/hyxi_cloud/modbus/registers_hybrid.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 100
    min_interval_ms: 500

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - hyxi-cloud

