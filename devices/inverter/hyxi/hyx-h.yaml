enums:
  battery_status: {'0': Sleep, '1': Charge, '2': Discharge, '3': Idle}
  control_mode: {'0': Battery power control, '1': Inverter AC power control}
  enabled: {'0': Disabled, '1': Enabled}
  grid_connected: {'0': Failed, '1': Connected}
  grid_mode: {'0': Off-grid, '1': Grid-connected}
  open_close: {'0': Open, '1': Close}
  operating_mode: {'1': Self-use, '2': Backup (green), '3': Backup (grid), '4': Feed-in, '5': Off-grid, '6': Battery SOC calibration, '7': Battery forced charging, '11': VPP, '12': VPP2 off-grid, '13': Idle, '14': Charging, '15': Discharging, '16': Self-consumption (export before charging), '17': Backup forced charging, '18': Self-consumption (charging before export), '31': Self-consumption with peak shaving, '32': Backup with peak shaving}
  operation_status: {'0': Initialising, '1': Standby, '2': DC-side startup, '3': Self-test startup, '4': Self-test wait, '5': Inverter operation, '6': Steady state operation}
  power_command: {'1': Power on, '2': Power off, '3': Restart}
  run_command: {'0': Stop, '1': Start}
  self_test_status: {'0': Standby, '1': Self-test in progress, '2': Self-test in progress, '3': Self-test in progress, '4': Self-test in progress, '5': Self-test in progress, '6': Self-test in progress, '7': Self-test in progress, '8': Self-test in progress, '9': Self-test completed}

notes:
- 'RS485 on the inverter''s COM port (RJ45): pin 5 = A, pin 6 = B.'
- Input and holding registers are separate spaces that reuse addresses (input 1007 = serial number, holding 1007 = clock).
- Taken from the vendor's RS485 Modbus RTU Hybrid Inverter Protocol V4.1 as transcribed by the project; mostly not yet checked
  on hardware.
- The document lists function 06 for single writes, but a real unit answered it with a mismatched echo; the project writes
  single registers with function 16.
- 'Local control: holding 3000 = 1 hands control to Modbus; 3015 then sets battery power.'
- Clock (holding 1007/1009), baud rate (3120) and Modbus address (3121) exist but are left out on purpose.
- Fault and alarm words (input 38–45, 1041–1043) are read raw; their bits are not decoded by the project.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
