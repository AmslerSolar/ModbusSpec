points:
  # Model and identity
  - {key: x.inverter_type, label: Solis inverter model definition, table: input, address: 35000, type: u16, enum: inverter_type, poll: slow, note: 'Values as listed (hex): 0x2030 = single-phase LV hybrid …'}
  - {key: x.protocol_family, label: Solis inverter model definition (high byte), table: input, address: 35000, type: u16, bits: [8, 15], enum: protocol_family, poll: slow, note: 0x20 = this protocol (ESINV-33000ID); 0x10 = the grid-tied protocol (INV-3000ID). Readable whenever the display is powered.}
  - {key: x.model_no, label: Model No., table: input, address: 33000, type: u16, poll: slow, note: Shown in hex; the model table (appendix 1) is not part of the document.}
  - {key: firmware, label: DSP version, table: input, address: 33001, type: u16, poll: slow, note: Shown in hex.}
  - {key: x.hmi_version, label: HMI version, table: input, address: 33002, type: u16, poll: slow, note: Shown in hex.}
  - {key: x.protocol_version, label: Protocol version, table: input, address: 33003, type: u16, poll: slow, note: Shown in hex.}
  - {key: serial, label: SN, table: input, address: 33004, type: str, length: 16, poll: slow, note: 'Two ASCII characters per register, 33004 first; the manufacturer uses the first 15 characters as the serial number.'}
  - {key: x.initial_setup_done, label: Initial startup setting flag, table: input, address: 33020, type: u16, enum: done, poll: slow}
  - {key: x.clock, label: System time, table: input, address: 33022, type: datetime, length: 6, datetime: {year: {register: 0, offset: 2000}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow, note: 'Year 0…99, taken as years after 2000.'}

  # Energy counters
  - {key: pv_energy, label: Total energy generation, table: input, address: 33029, type: u32, unit: kWh, poll: slow}
  - {key: x.energy_this_month, label: Current month energy generation, table: input, address: 33031, type: u32, unit: kWh, poll: slow}
  - {key: x.energy_last_month, label: Last month energy generation, table: input, address: 33033, type: u32, unit: kWh, poll: slow}
  - {key: pv_energy_today, label: Today energy generation, table: input, address: 33035, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.energy_yesterday, label: Yesterday energy generation, table: input, address: 33036, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.energy_this_year, label: This year energy generation, table: input, address: 33037, type: u32, unit: kWh, poll: slow}
  - {key: x.energy_last_year, label: Last year energy generation, table: input, address: 33039, type: u32, unit: kWh, poll: slow}

  # PV and AC side
  - {key: x.ac_output_type, label: AC output type, table: input, address: 33047, type: u16, enum: ac_output_type, poll: slow}
  - {key: x.dc_input_count, label: DC input type, table: input, address: 33048, type: u16, offset: 1, poll: slow, note: 'Raw 0 = 1 input, 1 = 2 inputs …'}
  - {key: x.pv1_voltage, label: DC voltage 1, table: input, address: 33049, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: DC current 1, table: input, address: 33050, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: DC voltage 2, table: input, address: 33051, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: DC current 2, table: input, address: 33052, type: u16, unit: A, scale: 0.1}
  - {key: x.pv3_voltage, label: DC voltage 3, table: input, address: 33053, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: DC current 3, table: input, address: 33054, type: u16, unit: A, scale: 0.1}
  - {key: x.pv4_voltage, label: DC voltage 4, table: input, address: 33055, type: u16, unit: V, scale: 0.1}
  - {key: x.pv4_current, label: DC current 4, table: input, address: 33056, type: u16, unit: A, scale: 0.1}
  - {key: pv_power, label: Total DC output power (PV power), table: input, address: 33057, type: u32, unit: W}
  - {key: x.dc_bus_voltage, label: DC bus voltage, table: input, address: 33071, type: u16, unit: V, scale: 0.1}
  - {key: x.dc_bus_half_voltage, label: DC bus half voltage, table: input, address: 33072, type: u16, unit: V, scale: 0.1}
  - {key: l1_voltage, label: AB line voltage / A phase voltage, table: input, address: 33073, type: u16, unit: V, scale: 0.1, note: Line voltage on three-phase three-wire models (see AC output type).}
