  - {key: l3_voltage, label: CA line voltage / C phase voltage, table: input, address: 33075, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: A phase current, table: input, address: 33076, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: B phase current, table: input, address: 33077, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: C phase current, table: input, address: 33078, type: u16, unit: A, scale: 0.1}
  - {key: x.active_power, label: Active power, table: input, address: 33079, type: s32, unit: W, note: Signed; the direction is not stated., verified: false}
  - {key: reactive_power, label: Reactive power, table: input, address: 33081, type: s32, unit: var}
  - {key: apparent_power, label: Apparent power, table: input, address: 33083, type: s32, unit: VA}
  - {key: x.working_mode, label: Standard working modes, table: input, address: 33091, type: u16, enum: working_mode, poll: slow}
  - {key: x.grid_standard, label: Grid standards, table: input, address: 33092, type: u16, poll: slow, note: Country / grid code number; the code table (appendix 3) differs between product lines and is not reproduced here.}
  - {key: temperature, label: Inverter temperature, table: input, address: 33093, type: s16, unit: °C, scale: 0.1}
  - {key: frequency, label: Grid frequency, table: input, address: 33094, type: u16, unit: Hz, scale: 0.01}
  - {key: state, label: Inverter current status, table: input, address: 33095, type: u16, enum: inverter_status, note: 'Operating state, or the alarm / fault code (shown in hex on the display).'}
  - {key: x.lead_acid_battery_temperature, label: Lead-acid battery temperature, table: input, address: 33096, type: s16, unit: °C, scale: 0.1}
  - {key: x.active_power_limit_rated, label: Limit active power adjustment rated power, table: input, address: 33100, type: s32, unit: W, poll: slow}
  - {key: x.reactive_power_limit_rated, label: Limit reactive power adjustment rated power, table: input, address: 33102, type: s32, unit: var, poll: slow}
  - {key: x.power_limit_actual, label: Limited power actual value, table: input, address: 33104, type: u16, unit: '%', scale: 0.01, poll: slow, note: 10000 = 100 % of rated power.}
  - {key: x.power_factor_setting, label: PF adjustment actual value, table: input, address: 33105, type: s16, scale: 0.001, poll: slow, note: 'The table gives 0.01 as unit, but its examples are 800 = 0.80 and 1000 = 1.00; scale 0.001 follows the examples. Not on models of 15 kW and below.'}
  - {key: x.reactive_power_limit, label: Limited reactive power, table: input, address: 33106, type: s16, unit: '%', scale: 0.01, poll: slow, note: Range −6000…6000; 10000 = 100 % as in the 2018 translation (the 2020 edition gives only '1%'). Only for working mode 4., verified: false}
  - {key: x.setting_flags, label: Setting flag bit, table: input, address: 33115, type: u16, flags: setting_flags, poll: slow}
  - {key: x.grid_fault_status, label: Fault code 01 (grid fault status), table: input, address: 33116, type: u16, flags: grid_fault_status}
  - {key: x.backup_fault_status, label: Fault code 02 (backup load fault status), table: input, address: 33117, type: u16, flags: backup_fault_status}
  - {key: x.battery_fault_status, label: Fault code 03 (battery fault status), table: input, address: 33118, type: u16, flags: battery_fault_status}
  - {key: x.device_fault_status_1, label: Fault code 04 (device fault status), table: input, address: 33119, type: u16, flags: device_fault_status_1}
  - {key: x.device_fault_status_2, label: Fault code 05 (device fault status), table: input, address: 33120, type: u16, flags: device_fault_status_2}
  - {key: x.operating_status, label: Operating status, table: input, address: 33121, type: u16, flags: operating_status}

