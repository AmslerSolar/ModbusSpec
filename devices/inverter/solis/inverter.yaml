notes:
- 'Addresses are used as the document gives them: it states that its register numbers are the protocol addresses (no offset),
  and its example frames confirm it (input 33000 is requested as 0x80E8).'
- The protocol asks for more than 300 ms between frames and recommends at most 50 registers per request. Default unit id not
  stated; 1 assumed.
- 'Input register 35000 (added 2020): high byte = protocol family (0x20 for this protocol), low byte = inverter type. Older
  firmware may not answer it; then this file''s identification does not recognise the device.'
- Hybrid inverters with the low byte 0x30…0x60 answer this map; the grid-tied inverters (high byte 0x10) use the 3000-range
  protocol (solis-string).
- 'Inverter status (33095): where the document lists different meanings for the single-phase 2nd-generation models and for
  the 30 kW / 15 kW three-phase / 4th-generation models, the second is given first.'
- 'Left out: the discrete inputs 12501…12595 (function 02; the same faults and states as the fault and status words), the
  Italian self-test registers 33221…33242, the per-phase meter reactive / apparent powers, most Meter2 values, and the 43000-range
  settings other than those listed (grid protection thresholds, calibration, reactive power control). 33130 (meter active
  power) and 33126…33129 are struck out in the 2020 edition and left out.'
- The 2018 document is an unofficial translation; the 43000-range settings and the coil come only from it and were not checked
  against a later edition.
- 'Storage control bit 5 (33132, and the same bit of 43110): the 2020 table gives 0 = grid may charge the battery, 1 = it
  may not (the 2018 translation lists the bit as reserved). Not checked on a device; installations are reported where the
  bit works the other way round (set = grid charging allowed), so read the bit back and check the behaviour before relying
  on it.'
