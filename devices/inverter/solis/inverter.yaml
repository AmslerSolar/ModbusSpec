  - {key: battery_voltage, label: Battery voltage, table: input, address: 33133, type: u16, unit: V, scale: 0.1}
  - {key: battery_current, label: Battery current, table: input, address: 33134, type: s16, unit: A, scale: 0.1, positive: charge, note: 'The document gives + = charge, − = discharge; register 33135 also gives the direction.'}
