connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 50
    min_interval_ms: 300

encoding:
  byte_order: big
  word_order: big

