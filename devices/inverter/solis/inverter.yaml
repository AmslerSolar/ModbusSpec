  - {key: x.bms_fault_status_2, label: Battery fault status02 (from BMS), table: input, address: 33146, type: u16, flags: bms_fault_status_2, note: As status01., conflicts: [{sources: [solis-modbus], scale: 0.1, label: Battery Fault Status 2 (BMS)}]}
  - {key: load_power, label: Household load power, table: input, address: 33147, type: u16, unit: W}
  - {key: x.backup_load_power, label: Backup load power, table: input, address: 33148, type: u16, unit: W}
