# "without control" (revision V002B000D01B). The setting registers (43000…, function 03/06/10) that edition leaves out
# are taken from the older 2018 English translation of the same protocol, as marked.

modbusspec: 0
id: solis-inverter
manufacturer: Solis
name: Hybrid / energy storage inverter (ESINV-33000ID protocol)
kind: inverter

sources:
