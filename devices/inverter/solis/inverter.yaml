  Inverter (S Series); Axitec AXIhycon 12-15H.'
- 'evcc template `solis-hybrid` (grid, pv, battery) lists: Ginlong Solis Hybrid Inverter (RHI series).'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- 'solis_modbus: the user picks the inverter model; hybrid and energy-storage models (S6-EH1P/EH2P/EH3P, S6-EO1P, S6-EA1P,
  S5-EH1P/EO1P, RHI, RAI) use this map.'
- 'Input register 35000: low byte = inverter type (see enum), high byte = protocol version.'
- Input register 33095 holds the operating state or a fault code; the code in hex is the alarm code shown on the display and
  in SolisCloud.
- Battery power (33149) is a magnitude; 33135 says the direction (0 charging, 1 discharging).
- The protocol asks for more than 300 ms between frames.
