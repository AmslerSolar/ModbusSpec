modbusspec: 0
id: solis-old
manufacturer: Solis
name: Solis inverters (old register map)
kind: inverter

sources:
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_solis_old.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  serial:
    table: input
    address: 3061
    type: str
    length: 4
  any:
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '303105'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '363105'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '463105'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '503105'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '603105'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: '603122'
  - table: input
    address: 3061
    type: str
    length: 4
    prefix: 110CA22

defaults:
  verified: false
  sources:
  - solax-modbus

models:
  - {id: x3_hybrid, name: X3 | HYBRID (prefix 110CA22*), match: {table: input, address: 3061, type: str, length: 4, prefix: 110CA22}}
  - {id: x1_hybrid, name: 'X1 | HYBRID (prefix 303105*, 363105*, 463105*, 503105*, 603105*, 603122*)'}

points:
  - {key: x.activepower, label: ActivePower, table: input, address: 3005, type: u32, unit: W, scale: 1000}
  - {key: x.pv_total_power, label: PV Total Power, table: input, address: 3007, type: u32, unit: W}
  - {key: x.power_generation_total, label: Power Generation Total, table: input, address: 3009, type: u32, unit: kWh}
  - {key: x.power_generation_this_month, label: Power Generation This Month, table: input, address: 3011, type: u32, unit: kWh}
  - {key: x.power_generation_last_month, label: Power Generation Last Month, table: input, address: 3013, type: u32, unit: kWh}
  - {key: x.power_generation_today, label: Power Generation Today, table: input, address: 3015, type: u16, unit: kWh, scale: 0.1}
  - {key: x.power_generation_yesterday, label: Power Generation Yesterday, table: input, address: 3016, type: u16, unit: kWh, scale: 0.1}
  - {key: x.power_generation_this_year, label: Power Generation This Year, table: input, address: 3017, type: u32, unit: kWh}
  - {key: x.power_generation_last_year, label: Power Generation Last Year, table: input, address: 3019, type: u32, unit: kWh}
  - {key: x.pv_voltage_1, label: PV Voltage 1, table: input, address: 3022, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_current_1, label: PV Current 1, table: input, address: 3023, type: u16, unit: A, scale: 0.1}
  - {key: x.pv_voltage_2, label: PV Voltage 2, table: input, address: 3024, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_current_2, label: PV Current 2, table: input, address: 3025, type: u16, unit: A, scale: 0.1}
  - {key: x.pv_voltage_3, label: PV Voltage 3, table: input, address: 3026, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_current_3, label: PV Current 3, table: input, address: 3027, type: u16, unit: A, scale: 0.1}
  - {key: x.pv_voltage_4, label: PV Voltage 4, table: input, address: 3028, type: u16, unit: V, scale: 0.1}
  - {key: x.pv_current_4, label: PV Current 4, table: input, address: 3029, type: u16, unit: A, scale: 0.1}
  - {key: x.inverter_voltage, label: Inverter Voltage, table: input, address: 3034, type: u16, unit: V, scale: 0.1, models: [x1_hybrid]}
  - {key: x.grid_voltage_r, label: Inverter Voltage R, table: input, address: 3034, type: u16, unit: V, scale: 0.1, models: [x3_hybrid]}
  - {key: x.grid_voltage_s, label: Inverter Voltage S, table: input, address: 3035, type: u16, unit: V, scale: 0.1, models: [x3_hybrid]}
  - {key: x.grid_voltage_t, label: Inverter Voltage T, table: input, address: 3036, type: u16, unit: V, scale: 0.1, models: [x3_hybrid]}
  - {key: x.inverter_current, label: Inverter Current, table: input, address: 3037, type: u16, unit: A, scale: 0.1, models: [x1_hybrid]}
  - {key: x.grid_current_r, label: Inverter Current R, table: input, address: 3037, type: u16, unit: A, scale: 0.1, models: [x3_hybrid]}
  - {key: x.grid_current_s, label: Inverter Current S, table: input, address: 3038, type: u16, unit: A, scale: 0.1, models: [x3_hybrid]}
  - {key: x.grid_current_t, label: Inverter Current T, table: input, address: 3039, type: u16, unit: A, scale: 0.1, models: [x3_hybrid]}
  - {key: temperature, label: Inverter Temperature, table: input, address: 3042, type: u16, unit: °C, scale: 0.1}
  - {key: frequency, label: Inverter Frequency, table: input, address: 3043, type: u16, unit: Hz, scale: 0.01}

notes:
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- The sources don't state the default unit id; 1 is a guess.
- Identification as solax-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
