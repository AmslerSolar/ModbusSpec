modbusspec: 0
id: solis-1p-5g
manufacturer: Solis
name: 1P-5G
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/solis_1p-5g.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: load_power, label: Load Power, table: input, address: 3004, type: u32, unit: W}
  - {key: pv_power, label: PV Power, table: input, address: 3006, type: u32, unit: W}
  - {key: pv_energy, label: Total Production, table: input, address: 3008, type: u32, unit: kWh}
  - {key: x.monthly_production, label: Monthly Production, table: input, address: 3010, type: u32, unit: kWh}
  - {key: pv_energy_today, label: Today Production, table: input, address: 3014, type: u16, unit: kWh, scale: 0.1}
  - {key: x.yearly_production, label: Yearly Production, table: input, address: 3016, type: u32, unit: kWh}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 3021, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 3022, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 3023, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 3024, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.load_voltage, label: Load Voltage, table: input, address: 3035, type: u16, unit: V, scale: 0.1}
  - {key: x.load_current, label: Load Current, table: input, address: 3038, type: u16, unit: A, scale: 0.1}
  - {key: x.working_mode, label: Working Mode, table: input, address: 3040, type: u16, enum: working_mode}
  - {key: temperature, label: Inverter Temperature, table: input, address: 3041, type: s16, unit: °C, scale: 0.1}
  - {key: x.load_frequency, label: Load Frequency, table: input, address: 3042, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_status, label: Inverter Status, table: input, address: 3043, type: u16, enum: inverter_status}
  - {key: x.working_status, label: Working Status, table: input, address: 3071, type: u16}
  - {key: x.wstatus_normal, label: WStatus Normal, table: input, address: 3071, type: u16, bits: [0, 0]}
  - {key: x.wstatus_initialising, label: WStatus Initialising, table: input, address: 3071, type: u16, bits: [1, 1]}
  - {key: x.wstatus_grid_off, label: WStatus Grid off, table: input, address: 3071, type: u16, bits: [2, 2]}
  - {key: x.wstatus_standby, label: WStatus Standby, table: input, address: 3071, type: u16, bits: [4, 4]}
  - {key: x.wstatus_derating, label: WStatus Derating, table: input, address: 3071, type: u16, bits: [5, 5]}
  - {key: x.wstatus_limiting, label: WStatus Limiting, table: input, address: 3071, type: u16, bits: [6, 6]}
  - {key: x.inverter_ac_export_power, label: Inverter AC Export Power, table: input, address: 3113, type: u16, unit: W, scale: 10}

enums:
  working_mode: {'0': No response mode, '1': Volt–watt default, '2': Volt–var, '3': Fixed power factor, '4': Fix reactive power, '5': Power-PF, '6': Rule21Volt–watt}
  inverter_status: {'0': Waiting, '1': OpenRun, '2': SoftRun, '3': Generating, '4100': Grid off, '4112': Grid Over Voltage, '4113': Grid Under Voltage, '4117': No Grid, '4146': Temperature Protection, '8209': Fail Safe}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Also used for solis_1p8k-5g.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
