enums:
  inverter_status: {'0': Waiting, '1': Open Operating, '2': Soft Run, '3': Generating, '4': Bypass Inverter Running, '5': Bypass Inverter Sync, '6': Bypass Grid Running, '15': Normal Running, '4100': Grid Off, '4112': Grid Overvoltage, '4113': Grid Undervoltage, '4114': Grid Overfrequency, '4115': Grid Underfrequency, '4116': Grid Reverse Current, '4117': No-Grid, '4118': Grid Unbalanced, '4119': Grid Frequency Fluctuation, '4120': Grid Overcurrent, '4121': Grid Current Sampling Error, '4128': DC Overvoltage, '4129': DC Bus Overvoltage, '4130': DC Bus Unbalanced, '4131': DC Bus Undervoltage, '4132': DC Bus Unbalanced 2, '4133': DC(Channel A) Overcurrent, '4134': DC(Channel B) Overcurrent, '4135': DC Interference, '4136': DC Reverse, '4137': PV Midpoint Grounding, '4144': Grid Interference Protection, '4145': DSP Initial Protection, '4146': Over Temperature Protection, '4147': PV Insulation Fault, '4148': Leakage Current Protection, '4149': Relay Check Protection, '4150': DSP_B Protection, '4151': DC Injection Protection, '4152': 12V Undervoltage Faulty, '4153': Leakage Current Check Protection, '4154': Under Temperature Protection, '4160': AFCI Check Fault, '4161': AFCI Fault, '4162': DSP Chip SRAM Fault, '4163': DSP Chip FLASH Fault, '4164': DSP Chip PC Pointer Fault, '4165': DSP Chip Register Fault, '4166': Grid Interference Protection 02, '4167': Grid Current Sampling Error, '4168': IGBT Overcurrent, '4176': Grid Transient Overcurrent, '4177': Battery Hardware Overvoltage fault, '4178': LLC Hardware Overcurrent, '4179': Battery Overvoltage, '4180': Battery Undervoltage, '4181': Battery Not Connected, '4182': Backup Overvoltage, '4183': Backup Overload, '4184': DSP Selfcheck Error, '8208': Fail Safe, '8209': Meter COM Fail, '8210': Battery COM Fail, '8212': DSP COM Fail, '8213': BMS Alarm, '8214': BatName-FAIL, '8215': BMS Alarm 2, '8216': DRM Connect Fail, '8217': Meter Select Fail, '8224': Lead-acid Battery High Temp, '8225': Lead-acid Battery Low Temp, '61456': Grid Surge, '61457': Fan Fault}
  energy_storage_control_switch: {'1': Self-Use - No Grid Charging, '17': Backup/Reserve - No Grid Charging, '33': Self-Use, '37': Off-Grid Mode, '41': Battery Awaken, '49': Backup/Reserve, '64': Feed-in priority - No Grid Charging, '80': Feed-in priority + Backup/Reserve - No Grid Charging, '96': Feed-in priority}
  power_switch: {'190': 'On', '222': 'Off'}
  generator_status: {'1': Stopped, '2': Supplying Power, '3': Preheating, '4': Cooling}
  backflow_power_switch: {'0': 'Off', '16': 'On'}
  battery_control_override_switch: {'0': 'Off', '1': Force charge, '2': Force discharge}

notes:
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- The sources don't state the default unit id; 1 is a guess.
- Identification as solax-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
