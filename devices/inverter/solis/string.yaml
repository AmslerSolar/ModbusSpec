notes:
- 'Address conversion: the document numbers the 3000-range input and holding registers one higher than the protocol address
  (its example reads register 3000 by sending 2999 = 0x0BB7); the addresses here are protocol addresses, i.e. the document''s
  numbers minus one. Input 35000, the coil 5000 and the discrete inputs are used without offset, as the document says.'
- The power-off saving bits (3068) name the document's register numbers (one higher than the addresses here).
- The protocol asks for more than 300 ms between frames and recommends at most 50 registers per request. Default unit id not
  stated; 1 assumed. Writes to unit 0xFF are carried out without a reply; unit 0xFE always answers.
- 'Inverter status (3043): where the document lists different meanings for the single-phase 2nd-generation models and for
  the 30 kW / 15 kW three-phase / 4th-generation models, the second is given first.'
- Input register 35000 was added in 2020; older firmware may not answer it, and this file's identification then does not recognise
  the device.
- 'Left out: the discrete inputs 2501…2588 (function 02, 30 kW series and 4G only; the same faults as the fault words), the
  HMI–DSP fault words (document 3095…3100), DC bus voltages (document 3032/3033, no unit given), the string currents and voltages
  of large inverters (document 3289…3335), IV-curve data (3341…3462), MPPT values (3500…3544), the anti-PID module (5000…5004),
  the external EPM device registers (36000…, 36500…), grid protection and Italian self-test settings, calibration, DRM, datalogger
  and compensation settings.'
- 'evcc template `solis` (grid, pv) lists: Ginlong Solis Inverter.'
- 'solis_modbus: the user picks the inverter model; grid-tie models (S6-GR1P, S5-GR1P/GR3P, S5-GC, 1P/3P 4G) use this map.'
- 'Addresses are protocol addresses: the Solis document numbers these registers one higher (its 3001 is address 3000 here);
  the project says so and checked it on an S5-GR3P.'
- The protocol asks for more than 300 ms between frames.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
