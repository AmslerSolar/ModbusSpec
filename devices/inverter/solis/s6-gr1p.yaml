modbusspec: 0
id: solis-s6-gr1p
manufacturer: Solis
name: S6-GR1P
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/solis_s6-gr1p.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: load_power, label: Load Power, table: input, address: 3004, type: u32, unit: W}
  - {key: pv_power, label: PV Power, table: input, address: 3006, type: u32, unit: W}
  - {key: pv_energy, label: Total Production, table: input, address: 3008, type: u32, unit: kWh}
  - {key: x.monthly_production, label: Monthly Production, table: input, address: 3010, type: u32, unit: kWh}
  - {key: pv_energy_today, label: Today Production, table: input, address: 3014, type: u16, unit: kWh, scale: 0.1}
  - {key: x.yearly_production, label: Yearly Production, table: input, address: 3016, type: u32, unit: kWh}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 3021, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 3022, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 3023, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 3024, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.load_voltage, label: Load Voltage, table: input, address: 3035, type: u16, unit: V, scale: 0.1}
  - {key: x.load_current, label: Load Current, table: input, address: 3038, type: u16, unit: A, scale: 0.1}
  - {key: temperature, label: Inverter Temperature, table: input, address: 3041, type: s16, unit: °C, scale: 0.1}
  - {key: x.load_frequency, label: Load Frequency, table: input, address: 3042, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_status, label: Inverter Status, table: input, address: 3043, type: u16, enum: inverter_status}
  - {key: x.operating_status, label: Operating Status, table: input, address: 3071, type: u16, flags: operating_status}

enums:
  inverter_status: {'0': Waiting State, '1': Open Loop Operation, '2': Soft Start, '3': On Grid/Generating, '4100': Grid OverVoltage, '4112': Grid UnderVoltage, '4114': Grid OverFrequency, '4115': Grid UnderFrequency, '4116': Grid Imp too large, '4117': No Grid, '4118': Grid Imbalance, '4119': Grid Freq Jitter, '4120': Grid Overcurrent, '4121': Grid Tracking Fault, '4128': DC OverVoltage, '4129': DC Bus Overvoltage, '4130': DC Bus Uneven Voltage, '4132': DC Bus Uneven Voltage2, '4133': DC A path OverCurrent, '4134': DC B path OverCurrent, '4135': DC Input Disturbance, '4144': Grid Disturbance, '4145': 'DSP Initialization Protection ', '4146': Over Temp Protection, '4147': PV Insulation Fault, '4148': Leakage Current Protection, '4149': Relay Detection Protection, '4150': DSP_B Protection, '4151': DC Component too Large, '4152': 12v UnderVoltage Protection, '4153': Under Temperature Protection, '4160': Arc Self-Test Protection, '4161': Arc Protection, '4162': DSP on-chip SRAM exception, '4163': DSP on-chip FLASH exception, '4164': DSP on-chip PC pointer is abnormal, '4165': DSP key register exception, '4166': Grid disturbance 02, '4167': Grid current sampling abnormality, '4168': IGBT overcurrent, '4176': Network current transient overcurrent, '4177': Battery overvoltage hardware failure, '4178': LLC hardware overcurrent, '4179': Battery overvoltage detection, '4180': Battery undervoltage detection, '4181': Battery no connected, '4182': Bypass overvoltage fault, '4183': Bypass overload fault}

flags:
  operating_status: {'0': Normal Operation, '1': Initial Standby, '2': Control Shutdown, '3': Downtime, '4': Standby, '5': Derating Operation, '6': Limit Operation, '7': Bypass Overload}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
