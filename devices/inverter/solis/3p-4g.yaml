modbusspec: 0
id: solis-3p-4g
manufacturer: Solis
name: 3P-4G
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/solis_3p-4g.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: x.product_model, label: Product Model, table: input, address: 2999, type: u16}
  - {key: x.dsp_software_version, label: DSP Software Version, table: input, address: 3000, type: u16}
  - {key: x.lcd_software_version, label: LCD Software Version, table: input, address: 3001, type: u16}
  - {key: load_power, label: Load Power, table: input, address: 3004, type: u32, unit: W}
  - {key: pv_power, label: PV Power, table: input, address: 3006, type: u32, unit: W}
  - {key: pv_energy, label: Total Production, table: input, address: 3008, type: u32, unit: kWh}
  - {key: x.monthly_production, label: Monthly Production, table: input, address: 3010, type: u32, unit: kWh}
  - {key: pv_energy_today, label: Today Production, table: input, address: 3014, type: u16, unit: kWh, scale: 0.1}
  - {key: x.yearly_production, label: Yearly Production, table: input, address: 3016, type: u32, unit: kWh}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 3021, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 3022, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 3023, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 3024, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv3_voltage, label: PV3 Voltage, table: input, address: 3025, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 3 MPPT trackers.}
  - {key: x.pv3_current, label: PV3 Current, table: input, address: 3026, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 3 MPPT trackers.}
  - {key: x.load_l1_voltage, label: Load L1 Voltage, table: input, address: 3033, type: u16, unit: V, scale: 0.1}
  - {key: x.load_l2_voltage, label: Load L2 Voltage, table: input, address: 3034, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: x.load_l3_voltage, label: Load L3 voltage, table: input, address: 3035, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 3 phases.}
  - {key: x.load_l1_current, label: Load L1 Current, table: input, address: 3036, type: u16, unit: A, scale: 0.1}
  - {key: x.load_l2_current, label: Load L2 Current, table: input, address: 3037, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: x.load_l3_current, label: Load L3 Current, table: input, address: 3038, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 3 phases.}
  - {key: x.working_mode, label: Working Mode, table: input, address: 3040, type: u16, enum: working_mode}
  - {key: temperature, label: Inverter Temperature, table: input, address: 3041, type: u16, unit: °C, scale: 0.1}
  - {key: x.load_frequency, label: Load Frequency, table: input, address: 3042, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_status, label: Inverter Status, table: input, address: 3043, type: u16, enum: inverter_status}

enums:
  working_mode: {'0': No response mode, '1': Volt–watt default, '2': Volt–var, '3': Fixed power factor, '4': Fix reactive power, '5': Power-PF, '6': Rule21Volt–watt}
  inverter_status: {'0': Waiting, '1': OpenRun, '2': SoftRun, '3': Generating, '1004': Grid off, '2011': Fail Safe}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Also used for solis_3p-4g+.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
