notes:
- 'Modbus RTU over RS485, 9600 8N1, functions 03, 06 and 16, at most 32 registers per request (V1.3: 20). Default address
  1; 255 is a universal address for one-to-one connections.'
- 32-bit values span two registers with the low word at the lower address.
- Addresses are the document's hexadecimal register numbers used as they are (0x0100 = 256).
- The fault codes 0x204–0x207 are explained in the instruction manual, not in this document. The 64 fault bits at 0x200–0x203
  are for internal debugging and are left out.
- 'Left out: control commands (0xDF00 power on/off, reset, factory reset, equalize now), the password registers, the battery
  voltage thresholds 0xE005–0xE00E and 0xE01B–0xE024 (given for a 12 V battery), timed charge / discharge periods 0xE026–0xE04D,
  generator settings, the grid protection settings 0xE400–0xE437, the last-7-days history 0xF000–0xF02A and the fault history
  0xF800 ff.'
- Some registers apply only to some models or generations (gray in the document); a machine may answer them with 0.
- The V1.94 change list says 0xE204 became the BMS communication fault stop register; the register table keeps 0xE204 as output
  priority and has that setting at 0xE214.
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- If the serial number can't be read there, the project tries other addresses as well; model matches only use the first.
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
