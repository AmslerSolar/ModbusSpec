modbusspec: 0
id: solarmax-maxstorage
manufacturer: SolarMax
name: MAX.STORAGE / MAX.STORAGE Ultimate
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/solarmax-maxstorage.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/solarmax/solarmax

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - evcc
  - openwb

points:
  - {key: x.batterymode_140, label: Battery mode control (write), table: holding, address: 140, type: s16, writable: true, note: 'evcc writes battery mode normal: 7000; battery mode hold: 0.'}
  - {key: x.batterymode_141, label: Battery mode control (write), table: holding, address: 141, type: s16, writable: true, note: 'evcc writes battery mode normal: 7000; battery mode hold: 0.'}
  - {key: x.batterymode_142, label: Battery mode control (write), table: holding, address: 142, type: s16, writable: true, note: 'evcc writes battery mode normal: 0; battery mode hold: a computed value.'}
  - {key: pv_power, label: PV power, table: input, address: 110, type: s32, unit: W, sources: [evcc]}
  - {key: battery_power, label: Battery power, table: input, address: 114, type: s32, unit: W, positive: charge}
  - {key: grid_power, label: Grid power, table: input, address: 118, type: s32, unit: W, positive: export}
  - {key: x.inverter_power, label: Inverter power, table: input, address: 120, type: s32, unit: W, note: Raw > 0 = generation (openWB's sign handling)., sources: [openwb]}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 122, type: s16, unit: '%'}

notes:
- 'evcc template `solarmax-maxstorage` (grid, pv, battery) lists: SolarMax MAX.STORAGE / MAX.STORAGE Ultimate.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
