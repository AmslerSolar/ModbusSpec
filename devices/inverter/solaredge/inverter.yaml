- title: SunSpec Implementation Technical Note
  version: January 2016
  url: http://www.solaredge.com/files/pdfs/sunspec-implementation-technical-note.pdf
  sha256: 24d1ed73d102cf28256cf59fbef2a4fa9641dccbb16c09077d847049ef63cd1b
  archive_url: https://web.archive.org/web/20160310181811/http://www.solaredge.com/files/pdfs/sunspec-implementation-technical-note.pdf
