  license: MIT
  commit: 2efb4dd6e51e55a5f07d960f56a6281831eb58de
  path: custom_components/sunspec2/vendors/__init__.py, custom_components/sunspec2/vendors/profile.py, custom_components/sunspec2/vendors/solaredge.py

connection:
  default_port: 1502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40002
    type: u16
    equals: 1
  - table: holding
    address: 40003
    type: u16
    equals: 65
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: SolarEdge
  - table: holding
    address: 40069
    type: u16
    in:
    - 101
    - 102
    - 103

sunspec: true

models:
  - {id: single_phase, name: Single phase inverter (SunSpec model 101), match: {table: holding, address: 40069, type: u16, equals: 101}}
  - {id: split_phase, name: Split phase inverter (SunSpec model 102), match: {table: holding, address: 40069, type: u16, equals: 102}}
  - {id: three_phase, name: Three phase inverter (SunSpec model 103), match: {table: holding, address: 40069, type: u16, equals: 103}}
  - {id: solaredge_modbus_multi_single_phase, name: Single phase inverter, match: {table: holding, address: 40069, type: u16, equals: 101}}
  - {id: solaredge_modbus_multi_split_phase, name: Split phase inverter, match: {table: holding, address: 40069, type: u16, equals: 102}}
  - {id: solaredge_modbus_multi_three_phase, name: Three phase inverter, match: {table: holding, address: 40069, type: u16, equals: 103}}
  - {id: solaredged_single_phase, name: Single phase inverter, match: {table: holding, address: 40069, type: u16, equals: 101}}
  - {id: solaredged_split_phase, name: Split phase inverter, match: {table: holding, address: 40069, type: u16, equals: 102}}
  - {id: solaredged_three_phase, name: Three phase inverter, match: {table: holding, address: 40069, type: u16, equals: 103}}

points:
  # Common block (SunSpec model 1)
  - {key: x.sunspec_id, label: C_SunSpec_ID, table: holding, address: 40000, type: u32, poll: slow, note: '"SunS" (0x53756E53).'}
  - {key: x.common_did, label: C_SunSpec_DID, table: holding, address: 40002, type: u16, poll: slow, note: 1 = common block.}
  - {key: x.common_length, label: C_SunSpec_Length, table: holding, address: 40003, type: u16, poll: slow, note: 65 registers.}
  - {key: x.manufacturer, label: C_Manufacturer, table: holding, address: 40004, type: str, length: 16, poll: slow, note: Reads "SolarEdge".}
  - {key: x.model, label: C_Model, table: holding, address: 40020, type: str, length: 16, poll: slow, note: 'Inverter model, e.g. SE5000.'}
  - {key: x.options, label: C_Option, table: holding, address: 40036, type: str, length: 8, poll: slow, note: Not implemented on SolarEdge inverters.}
  - {key: firmware, label: C_Version, table: holding, address: 40044, type: str, length: 8, poll: slow, note: 'CPU firmware version with leading zeros, e.g. 0002.0611.'}
  - {key: serial, label: C_SerialNumber, table: holding, address: 40052, type: str, length: 16, poll: slow}
  - {key: x.device_address, label: C_DeviceAddress, table: holding, address: 40068, type: u16, poll: slow, note: The inverter's Modbus id.}

  # Inverter model 101 / 102 / 103
  - {key: x.inverter_did, label: C_SunSpec_DID, table: holding, address: 40069, type: u16, enum: inverter_did, poll: slow}
  - {key: x.inverter_length, label: C_SunSpec_Length, table: holding, address: 40070, type: u16, poll: slow, note: 50 registers.}
  - {key: x.ac_current, label: I_AC_Current, table: holding, address: 40071, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, invalid: [65535]}
  - {key: l1_current, label: I_AC_CurrentA, table: holding, address: 40072, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, invalid: [65535]}
  - {key: l2_current, label: I_AC_CurrentB, table: holding, address: 40073, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, invalid: [65535]}
  - {key: l3_current, label: I_AC_CurrentC, table: holding, address: 40074, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40075, type: s16}, invalid: [65535]}
  - {key: x.ac_current_sf, label: I_AC_Current_SF, table: holding, address: 40075, type: s16}
  - {key: x.ac_voltage_ab, label: I_AC_VoltageAB, table: holding, address: 40076, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535]}
  - {key: x.ac_voltage_bc, label: I_AC_VoltageBC, table: holding, address: 40077, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535]}
  - {key: x.ac_voltage_ca, label: I_AC_VoltageCA, table: holding, address: 40078, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535]}
  - {key: l1_voltage, label: I_AC_VoltageAN, table: holding, address: 40079, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535], note: 'The document marks the phase-to-neutral voltages as supported only in split-phase configurations (Japan, 240 V North America).'}
  - {key: l2_voltage, label: I_AC_VoltageBN, table: holding, address: 40080, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535], note: See I_AC_VoltageAN.}
  - {key: l3_voltage, label: I_AC_VoltageCN, table: holding, address: 40081, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40082, type: s16}, invalid: [65535], note: See I_AC_VoltageAN.}
  - {key: x.ac_voltage_sf, label: I_AC_Voltage_SF, table: holding, address: 40082, type: s16}
  - {key: pv_power, label: I_AC_Power, table: holding, address: 40083, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40084, type: s16}, invalid: [-32768], verified: false, note: 'AC power of the inverter. The document gives no sign; + = AC output is assumed. On inverters with a battery (StorEdge) it includes battery power, so it is solar production only on PV-only inverters.'}
  - {key: x.ac_power_sf, label: I_AC_Power_SF, table: holding, address: 40084, type: s16}
  - {key: frequency, label: I_AC_Frequency, table: holding, address: 40085, type: u16, unit: Hz, scale_exponent_from: {table: holding, address: 40086, type: s16}, invalid: [65535]}
  - {key: x.ac_frequency_sf, label: I_AC_Frequency_SF, table: holding, address: 40086, type: s16}
  - {key: apparent_power, label: I_AC_VA, table: holding, address: 40087, type: s16, unit: VA, scale_exponent_from: {table: holding, address: 40088, type: s16}, invalid: [-32768]}
  - {key: x.ac_va_sf, label: I_AC_VA_SF, table: holding, address: 40088, type: s16}
  - {key: reactive_power, label: I_AC_VAR, table: holding, address: 40089, type: s16, unit: var, scale_exponent_from: {table: holding, address: 40090, type: s16}, invalid: [-32768]}
  - {key: x.ac_var_sf, label: I_AC_VAR_SF, table: holding, address: 40090, type: s16}
  - {key: x.power_factor_pct, label: I_AC_PF, table: holding, address: 40091, type: s16, unit: '%', scale_exponent_from: {table: holding, address: 40092, type: s16}, invalid: [-32768]}
  - {key: x.ac_pf_sf, label: I_AC_PF_SF, table: holding, address: 40092, type: s16}
  - {key: pv_energy, label: I_AC_Energy_WH, table: holding, address: 40093, type: u32, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 40095, type: s16}, poll: slow, note: 'AC lifetime energy production (acc32, Wh: only increases). As with I_AC_Power, on inverters with a battery it is not solar yield alone.'}
  - {key: x.ac_energy_sf, label: I_AC_Energy_WH_SF, table: holding, address: 40095, type: s16, note: The register table lists it as uint16; it is a SunSpec scale factor and is read as signed here.}
  - {key: x.dc_current, label: I_DC_Current, table: holding, address: 40096, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40097, type: s16}, invalid: [65535]}
  - {key: x.dc_current_sf, label: I_DC_Current_SF, table: holding, address: 40097, type: s16}
  - {key: x.dc_voltage, label: I_DC_Voltage, table: holding, address: 40098, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40099, type: s16}, invalid: [65535]}
  - {key: x.dc_voltage_sf, label: I_DC_Voltage_SF, table: holding, address: 40099, type: s16}
  - {key: x.dc_power, label: I_DC_Power, table: holding, address: 40100, type: s16, unit: W, scale_exponent_from: {table: holding, address: 40101, type: s16}, invalid: [-32768]}
  - {key: x.dc_power_sf, label: I_DC_Power_SF, table: holding, address: 40101, type: s16}
  - {key: temperature, label: I_Temp_Sink, table: holding, address: 40103, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40106, type: s16}, invalid: [-32768], note: Heat sink temperature.}
  - {key: x.temp_sf, label: I_Temp_SF, table: holding, address: 40106, type: s16}
  - {key: state, label: I_Status, table: holding, address: 40107, type: u16, enum: status}
  - {key: error_code, label: I_Status_Vendor, table: holding, address: 40108, type: u16, note: Vendor operating state and error code; meanings are in the inverter's installation guide. The document says to use it for firmware up to 3.19.x (newer firmware - I_Status_Vendor4).}
  - {key: x.status_vendor4, label: I_Status_Vendor4, table: holding, address: 40119, type: u32, note: 'Vendor state and error code (document 3.2 and later): the high 16 bits name the controller type (e.g. 3x, 8x, 18x), the low 16 bits the error code; meanings are in the installation guide.'}
  - {key: x.status_vendor4_controller, label: I_Status_Vendor4 (controller type), table: holding, address: 40119, type: u32, bits: [16, 31]}
  - {key: x.status_vendor4_code, label: I_Status_Vendor4 (error code), table: holding, address: 40119, type: u32, bits: [0, 15]}

  # Multiple MPPT inverter extension model 160 (Synergy three-phase inverters, firmware 4.13.x and later)
  - {key: x.mppt_model_id, label: ID (model 160), table: holding, address: 40121, type: u16, poll: slow, optional: true, note: 160 when the model is there; otherwise meter 1 starts here (see solaredge-meter).}
  - {key: x.mppt_model_length, label: L (model 160), table: holding, address: 40122, type: u16, poll: slow, optional: true}
  - {key: x.mppt_dca_sf, label: DCA_SF, table: holding, address: 40123, type: s16, optional: true}
  - {key: x.mppt_dcv_sf, label: DCV_SF, table: holding, address: 40124, type: s16, optional: true}
  - {key: x.mppt_dcw_sf, label: DCW_SF, table: holding, address: 40125, type: s16, optional: true}
  - {key: x.synergy_units, label: N (number of Synergy units), table: holding, address: 40129, type: u16, poll: slow, optional: true, note: 2 or 3.}
  - {key: x.unit0_name, label: IDStr (Synergy unit 0), table: holding, address: 40132, type: str, length: 8, poll: slow, optional: true}
  - {key: x.unit0_dc_current, label: DCA (Synergy unit 0), table: holding, address: 40140, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40123, type: s16}, optional: true}
  - {key: x.unit0_dc_voltage, label: DCV (Synergy unit 0), table: holding, address: 40141, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40124, type: s16}, optional: true}
  - {key: x.unit0_dc_power, label: DCW (Synergy unit 0), table: holding, address: 40142, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40125, type: s16}, optional: true}
  - {key: x.unit0_temperature, label: Tmp (Synergy unit 0), table: holding, address: 40147, type: s16, unit: °C, optional: true}
  - {key: x.unit1_name, label: IDStr (Synergy unit 1), table: holding, address: 40152, type: str, length: 8, poll: slow, optional: true}
  - {key: x.unit1_dc_current, label: DCA (Synergy unit 1), table: holding, address: 40160, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40123, type: s16}, optional: true}
  - {key: x.unit1_dc_voltage, label: DCV (Synergy unit 1), table: holding, address: 40161, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40124, type: s16}, optional: true}
  - {key: x.unit1_dc_power, label: DCW (Synergy unit 1), table: holding, address: 40162, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40125, type: s16}, optional: true}
  - {key: x.unit1_temperature, label: Tmp (Synergy unit 1), table: holding, address: 40167, type: s16, unit: °C, optional: true}
  - {key: x.unit2_name, label: IDStr (Synergy unit 2), table: holding, address: 40172, type: str, length: 8, poll: slow, optional: true, note: Only with 3 units.}
  - {key: x.unit2_dc_current, label: DCA (Synergy unit 2), table: holding, address: 40180, type: u16, unit: A, scale_exponent_from: {table: holding, address: 40123, type: s16}, optional: true, note: Only with 3 units.}
  - {key: x.unit2_dc_voltage, label: DCV (Synergy unit 2), table: holding, address: 40181, type: u16, unit: V, scale_exponent_from: {table: holding, address: 40124, type: s16}, optional: true, note: Only with 3 units.}
  - {key: x.unit2_dc_power, label: DCW (Synergy unit 2), table: holding, address: 40182, type: u16, unit: W, scale_exponent_from: {table: holding, address: 40125, type: s16}, optional: true, note: Only with 3 units.}
  - {key: x.unit2_temperature, label: Tmp (Synergy unit 2), table: holding, address: 40187, type: s16, unit: °C, optional: true, note: Only with 3 units.}
  - {key: x.i_temp_cab, label: I_Temp_Cab, table: holding, address: 40102, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40106, type: s16}, invalid: [-32768], note: Scaled by 10^(value at 40106). Not supported by SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi, solaredged]}
  - {key: x.i_temp_trns, label: I_Temp_Trns, table: holding, address: 40104, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40106, type: s16}, invalid: [-32768], note: Scaled by 10^(value at 40106). Not supported by SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi, solaredged]}
  - {key: x.i_temp_other, label: I_Temp_Other, table: holding, address: 40105, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 40106, type: s16}, invalid: [-32768], note: Scaled by 10^(value at 40106). Not supported by SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi, solaredged]}
  - {key: x.evt1, label: Evt1, table: holding, address: 40109, type: u32, invalid: [4294967295], note: No known use on SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi]}
  - {key: x.evt2, label: Evt2, table: holding, address: 40111, type: u32, invalid: [4294967295], note: No known use on SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi]}
  - {key: x.i_grid_status, label: I_Grid_Status, table: holding, address: 40113, type: u32, invalid: [4294967295], note: 0 = connected to the grid., verified: false, sources: [solaredge-modbus-multi, solaredged], conflicts: [{sources: [sunspec2], word_order: little, label: Grid status}]}
  - {key: x.evtvnd2, label: EvtVnd2, table: holding, address: 40115, type: u32, invalid: [4294967295], note: No known use on SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi]}
  - {key: x.evtvnd3, label: EvtVnd3, table: holding, address: 40117, type: u32, invalid: [4294967295], note: No known use on SolarEdge inverters (solaredge-modbus-multi)., verified: false, sources: [solaredge-modbus-multi]}
