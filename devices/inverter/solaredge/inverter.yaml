notes:
- Addresses are the document's base-0 protocol addresses (it also lists base-1 PLC addresses, one higher). The common block
  starts at 40000, the inverter model at 40069.
- 'Values with a SunSpec scale factor: real value = raw × 10^(scale factor register). Registers an inverter doesn''t support
  read SunSpec''s not-implemented value (0xFFFF, 0x8000).'
- Modbus TCP is off by default. Inverters configured with SetApp use TCP port 1502 by default; inverters with an LCD use 502.
  Both ports can be changed. The inverter on Ethernet has unit id 1 by default.
- Modbus TCP serves only one client connection; the server drops an idle connection after 2 minutes without a request.
- 'RS485 (RTU): 115200 bit/s 8N1 by default, adjustable from 9600 bit/s. Every inverter on the bus needs its own Modbus id
  (1–247). Only one Modbus master (RTU or TCP) per system.'
- Inverters configured with SetApp support SunSpec; inverters with an LCD need firmware 3.x or later (the 2016 note named
  CPU version 2.0496).
- 'Registers not listed in the document (40102, 40104, 40105, 40109–40118: cabinet / transformer / other temperatures and
  SunSpec event words) are not given here.'
- The document doesn't say whether I_Status_Vendor or I_Status_Vendor4 = 0 means no error, so no problem rules are given for
  them.
- 'Model 160 at 40121: the document marks DCWH, Evt, TmsPer, Tms, DCSt and DCEvt as not supported (0), so they are left out.
  The fixed block is for the whole Synergy system; each unit has a block of 20 registers from 40131. The 2.0 note (before
  model 160) says Synergy three-phase inverters give no DC values in the inverter model.'
- Meters (solaredge-meter) follow in the SunSpec chain; batteries and the power / storage control blocks are SolarEdge-specific
  (solaredge-battery, solaredge-control).
- Typical response time under 0.5 s per read; leave at least 0.1 s between requests (Appendix B of document 3.2, for SetApp
  three-phase commercial inverters).
- 'Left out: I_Status_Vendor4_controller (holding 40119, u32) from solaredge-modbus-multi overlaps x.status_vendor4_controller
  from the documents.'
- 'SolarEdge inverters are partly SunSpec: the common block (40000), the inverter model 101/102/103 (40069) and the multiple-MPPT
  model 160 (40121) are SunSpec and big-endian; the battery, meter and control blocks are in the devices solaredge-battery,
  solaredge-meter and solaredge-control.'
- 'Identification: 40000–40001 holds ''SunS'' (0x53756E53), 40002 = 1 and 40003 = 65 (common block).'
- 'Values with a SunSpec scale factor: real value = raw × 10^(scale factor register); the scale factor registers are listed
  as points of their own.'
- 'SunSpec ''not implemented'' values: 0xFFFF (u16), 0x8000 (s16), 0xFFFFFFFF (u32); energy counters read 0 when not accumulated.'
- 'Multiple-MPPT model (40121): present when 40121 = 160 and 40129 (number of modules) is 2 or 3; each module is a block of
  20 registers from 40131. solaredge-modbus-multi only reads it on firmware 4.13.0 or later. Without it, 40121 is where meter
  1 starts.'
- 40113–40120 (grid status, extended vendor status) are not served by all firmware; solaredge-modbus-multi reads 40119 (status
  vendor 4) only on firmware 3.20.0 or later, solaredged probes the block. Grid status 0 means the inverter is connected to
  the grid.
- 'Status vendor 4 (40119): bits 24–31 name the controller, bits 0–15 the event code; solaredge-modbus-multi has a text table
  per controller (controllers 0x0, 0x3, 0x8, 0x18, 0x1C, 0x1D, 0x26, 0x32, 0x33, 0xF1).'
- SolarEdge EV chargers answer like an inverter (model name starting SE-EV-SA) but give no measurements over Modbus.
- A SunSpec storage capacity model (713) may follow in the model chain when the grid profile enables IEEE 1547-2018; its address
  depends on the chain and is not listed here.
- Identification as solaredge-modbus-multi recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
