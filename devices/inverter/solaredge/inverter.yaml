modbusspec: 0
id: solaredge-inverter
manufacturer: SolarEdge
name: SolarEdge inverters (SunSpec logging)
kind: inverter

sources:
- title: Technical Note – SolarEdge Inverters - SunSpec Logging
  version: 3.2 (June 2025)
  url: https://github.com/WillCodeForCats/solaredge-modbus-multi/blob/2bffb6ad39897991cec037ed2240032e41fab6a3/doc/sunspec-implementation-technical-note.pdf
  sha256: ee578cc770f381b58dc0de75a6b8696477c7827f7c5109e2ee71b98a1f57dc2d
- title: Technical Note – SunSpec Logging in SolarEdge Inverters
  version: 2.5 (November 2022)
  url: https://www.solaredge.com/sites/default/files/sunspec-implementation-technical-note.pdf
  sha256: a93afea72570ec36bf2f23474b17fecce2b5abb6520a8a7542e7420f470ddbe8
  archive_url: https://web.archive.org/web/20221207064846/https://www.solaredge.com/sites/default/files/sunspec-implementation-technical-note.pdf
- title: Technical Note – SunSpec Logging in SolarEdge Inverters
  version: 2.4 (December 2021)
  url: https://github.com/nmakel/solaredge_modbus/blob/fd3ce7ae32a259ee371c672dac3bcd75bfe51258/documents/sunspec-implementation-technical-note-v2.4.pdf
  sha256: b37440a14b4d5465e4b3d8d97715bb67a23a2488e26e004df904ac818ff06b61
- title: Technical Note – SunSpec Logging in SolarEdge Inverters
  version: 2.0 (January 2019)
  url: https://github.com/nmakel/solaredge_modbus/blob/fd3ce7ae32a259ee371c672dac3bcd75bfe51258/documents/sunspec-implementation-technical-note-v2.0.pdf
