enums:
  export_limit_mode: {'0': Total (all phases together), '1': Per phase (1/3 of the site limit each)}
  storage_control_mode: {'0': Disabled, '1': Maximize self consumption, '2': Time of use (profile programming), '3': Backup only, '4': Remote control}
  ac_charge_policy: {'0': Disabled, '1': Always allowed, '2': Fixed yearly energy limit, '3': Percent of production}
  charge_discharge_mode: {'0': 'Off', '1': Charge excess PV power only, '2': 'Charge from PV first, then AC output', '3': Charge from PV and AC (up to the charge limit), '4': Maximize export (discharge to reach the AC limit), '5': Discharge to meet loads (no discharge to the grid), '7': Maximize self consumption}
  reactive_power_config: {'0': Fixed cos phi, '1': Fixed Q, '2': Cos phi (P), '3': Q(U) + Q(P), '4': RRCR}
  frequency_derating_config: {'0': 'Off', '1': Reserved, '2': Reserved, '3': P(f) with hysteresis, '4': P(f) without hysteresis}
  site_limit_mode: {'0': Disabled, '1': Export control (export/import meter), '2': Export control (consumption meter), '4': Production control}

flags:
  export_control_mode: {'0': Direct export limitation (meter at the grid connection), '1': Indirect export limitation (meter at the load connection), '2': Production limitation, '10': External (non-SolarEdge) production, '11': Negative site limit (minimum import)}

notes:
- 'These are control registers of a SolarEdge inverter, not a device of their own: a network search finds the inverter (solaredge-inverter),
  so this file has no identification.'
- SolarEdge-specific blocks of the inverter, read and written at the inverter's unit id and port (see solaredge-inverter).
  Supported on inverters with CPU firmware 3.x and later.
- 32-bit values in the 0xE000 and 0xF000 ranges have the low word first and must be written together with function 16 (SunSpec
  logging note, appendix A of 3.2 / C of 2.x). Document 3.2 adds that a copy with the high word first sits 0x800 registers
  higher; it is not used here.
- Dynamic, export limit and storage control need AdvancedPwrControlEn (0xF142) = 1 and ReactivePwrConfig (0xF104) = 4, followed
  by a commit (write 1 to 0xF100).
- 'Mirrors: the export limit registers 0xE000–0xE003 also at 0xF700, storage control 0xE004–0xE011 at 0xF704. The text also
  says the export block is mirrored at 0xF000, which clashes with the dynamic power control block there; the register table''s
  0xF700 is taken.'
- 'Remote storage control: set 0xE000 to 0, 0xE004 to 4, choose the default mode (0xE00A), then write timeout (0xE00B), command
  mode (0xE00D) and the charge / discharge limit (0xE00E / 0xE010) for each command; the inverter returns to the default mode
  when the timeout runs out. Modes 5 and 7 need a consumption or export meter. Power limits and gradients take priority.'
- 'Left out: the graph settings of the power control block (cos phi(P), Q(U), Q(P), P(U), P(f) points and lock-in / lock-out
  values, 0xF10E–0xF13C, 0xF152–0xF18A, 0xF190–0xF1A6) and the grid protection trip limits (commit / restore 0xF600–0xF601,
  limits 0xF602–0xF652).'
- 'Sign convention for reactive power settings: inductive positive, capacitive negative (from appendix A of the document).'
- Write response time under 0.5 s; an active power setpoint acts within 1 s, a commit takes up to 1.5 s (document 3.2, appendix
  B, SetApp three-phase commercial inverters); the 2017 document gives 5–10 s for a commit.
- 'evcc template `solaredge-inverter` (grid, pv) lists: SolarEdge Inverter.'
- evcc also reads SunSpec model values for this template (not included here).
- 'evcc template `solaredge` (single device) lists: SolarEdge Inverter (feed-in limitation).'
- 'SolarEdge-specific control blocks of the inverter, read at the inverter''s unit id, with the low word first: site limit
  control (0xE000), storage control (0xE004), dynamic power control (0xF000), advanced power control (0xF100) and enhanced
  dynamic power control (0xF300).'
- Each block is optional; the inverter answers an absent block with a Modbus exception.
- Advanced power control settings only take effect after writing 1 to 0xF100 (commit); writing 1 to 0xF101 restores the defaults.
- 'Storage control: the command mode, command timeout and charge / discharge limits are used in remote control mode (0xE004
  = 4); the default mode applies after the command timeout.'
- Site limit 0xE002 reads ±3.4e38 (largest float) when no limit is set.
- Active power limit (0xF001), cos phi (0xF002), the dynamic limits at 0xF322–0xF327 and the storage command registers are
  reported not to be stored in the inverter.
- 'Storage control in remote control mode: the inverter goes back to the default mode when the command timeout runs out or
  when it restarts at night, so the command and its timeout have to be written again (ha-sunspec2 does it every 15 minutes).'
- 'ha-sunspec2 writes the active power limit (0xF001) again every 10 s: some firmware drops it after about ten seconds.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
