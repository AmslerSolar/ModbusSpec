notes:
- 'Family detected by a model tag in the serial number: DTU, DTS, KMT, MSU, MST, MSC, DSN, DTN, DST, NSU, SSN, SST, SSX, SSY,
  PSB, PSC.'
- The library reaches these registers over Modbus TCP or as RTU frames over UDP through the Wi-Fi/LAN dongle; the dongle puts
  AA 55 before each RTU reply.
- 'Single-phase models have one of these tags in the serial number: DSN, DST, NSU, SSN, SST, SSX, SSY, MSU, MST, PSB, PSC,
  MSC.'
- PV3/PV4 registers exist only on three- or four-MPPT models (by serial number tag).
- Identification as goodwe recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
