modbusspec: 0
id: goodwe-dt
manufacturer: GoodWe
name: DT / MS / D-NS / XS grid inverters
kind: inverter

sources:
- id: goodwe
  title: goodwe (Python library used by Home Assistant)
  url: https://github.com/marcelblijleven/goodwe
  license: MIT
  commit: 66dfcdd9cd947bfd799f2bddb40b4e05ba9db6f6
  path: goodwe/dt.py, goodwe/sensor.py, goodwe/const.py, goodwe/model.py

connection:
  default_port: 502
  default_unit: 127
  transports:
  - tcp
  - rtu_over_udp
  ports:
    rtu_over_udp: 8899
  reply_prefix: AA55

encoding:
  word_order: big

identify:
  serial:
    table: holding
    address: 30004
    type: str
    length: 8
  checks:
  - table: holding
    address: 30004
    type: str
    length: 8
    contains:
    - DTU
    - DTS
    - KMT
    - MSU
    - MST
    - MSC
    - DSN
    - DTN
    - DST
    - NSU
    - SSN
    - SST
    - SSX
    - SSY
    - PSB
    - PSC

defaults:
  verified: false
  sources:
  - goodwe

models:
  - {id: single_phase, name: Single-phase, match: {table: holding, address: 30004, type: str, length: 8, contains: [DSN, DST, NSU, SSN, SST, SSX, SSY, MSU, MST, PSB, PSC, MSC]}}
  - {id: three_phase, name: Three-phase}

points:
  - {key: serial, label: serial_number, table: holding, address: 30004, type: str, length: 8}
  - {key: x.model_name, label: model_name, table: holding, address: 30012, type: str, length: 5}
  - {key: x.dsp1_version, label: dsp1_version, table: holding, address: 30034, type: u16}
  - {key: x.dsp2_version, label: dsp2_version, table: holding, address: 30035, type: u16}
  - {key: x.arm_version, label: arm_version, table: holding, address: 30036, type: u16}
  - {key: x.dsp_svn_version, label: dsp_svn_version, table: holding, address: 30037, type: u16}
  - {key: x.arm_svn_version, label: arm_svn_version, table: holding, address: 30038, type: u16}
  - {key: x.meter_software_version, label: meter_software_version, table: holding, address: 30063, type: u16}
  - {key: x.meter_serial_number, label: meter_serial_number, table: holding, address: 30075, type: str, length: 7}
  - {key: x.timestamp, label: Timestamp, table: holding, address: 30100, type: datetime, length: 3, datetime: {year: {register: 0, bits: [8, 15], offset: 2000}, month: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}}
