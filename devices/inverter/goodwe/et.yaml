  # From the Third-Party EMS protocol V1.1.1; every register below answered on a real ESA GW8K-ETA-G20 (2026-11-02)
  - {key: x.rated_max_charge_power, label: Max Charge Power, table: holding, address: 33001, type: u32, unit: W, poll: slow, note: 'Read 12000 on a GW8K-ETA-G20, whose datasheet gives 8.0 kW: what it limits is not known.'}
  - {key: x.rated_max_discharge_power, label: Max Discharge Power, table: holding, address: 33004, type: u32, unit: W, poll: slow, verified: true, note: Read 8800 on a GW8K-ETA-G20; its datasheet gives 8.8 kW.}
  - {key: x.rated_max_pv_power, label: Max PV Power, table: holding, address: 33006, type: u32, unit: W, poll: slow, verified: true, note: Read 16000 on a GW8K-ETA-G20; its datasheet gives 16 kW.}
  - {key: x.battery_strings2, label: Battery Strings2, table: holding, address: 35267, type: u16, poll: slow}
  - {key: x.pmppt9, label: PV MPPT9 Power, table: holding, address: 35407, type: u16, unit: W, invalid: [65535]}
  - {key: x.pmppt10, label: PV MPPT10 Power, table: holding, address: 35408, type: u16, unit: W, invalid: [65535]}
  - {key: x.imppt9, label: PV MPPT9 Current, table: holding, address: 35415, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.imppt10, label: PV MPPT10 Current, table: holding, address: 35416, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.pv17_voltage, label: PV17 Voltage, table: holding, address: 35423, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.pv17_current, label: PV17 Current, table: holding, address: 35424, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.pv18_voltage, label: PV18 Voltage, table: holding, address: 35425, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.pv18_current, label: PV18 Current, table: holding, address: 35426, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.pv19_voltage, label: PV19 Voltage, table: holding, address: 35427, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.pv19_current, label: PV19 Current, table: holding, address: 35428, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.pv20_voltage, label: PV20 Voltage, table: holding, address: 35429, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.pv20_current, label: PV20 Current, table: holding, address: 35430, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.meter_total_power_36133, label: Meter Total Active Power, table: holding, address: 36133, type: s32, unit: W, note: 'The document states no sign. On a real ESA whose meter measured another inverter in the same house, not the grid connection, it read -922 W while 36025 read 0 and AC Active Power (35139) 13 W. So 36133 gives the meter''s own reading; that 36025 stays 0 there, and the sign, are open.'}
  - {key: x.bms1_power, label: BMS1 Bat power, table: holding, address: 37080, type: s32, unit: W, note: 'GoodWe batteries only. The document says U32, but a real ESA read FFFFFE1A, which is -486 W as S32; the sign is not stated.'}
  - {key: x.bms2_rated_capacity, label: BMS2 Rated Capacity, table: holding, address: 39074, type: u16, unit: kWh, scale: 0.1, poll: slow, note: GoodWe batteries only.}
  - {key: x.bms2_power, label: BMS2 Bat power, table: holding, address: 39078, type: s32, unit: W, note: 'GoodWe batteries only; U32 in the document, read as BMS1 (37080).'}
  - {key: x.phase_export_limit_ena, label: 3 Phase Export Power Limit Enable, table: holding, address: 47534, type: u16, enum: off_on_47534, invalid: [65535], writable: true, persistent: true, note: 'Stored in flash, yet the document gives a write cycle of 1 s.'}
  - {key: x.l1_export_limit, label: R phase Export Power Limit Parameter, table: holding, address: 47535, type: s16, unit: W, writable: true, persistent: true, min: -30000, max: 30000}
  - {key: x.l2_export_limit, label: S phase Export Power Limit Parameter, table: holding, address: 47536, type: s16, unit: W, writable: true, persistent: true, min: -30000, max: 30000}
  - {key: x.l3_export_limit, label: T phase Export Power Limit Parameter, table: holding, address: 47537, type: s16, unit: W, writable: true, persistent: true, min: -30000, max: 30000}

