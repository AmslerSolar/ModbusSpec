connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  - rtu_over_udp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
  ports:
    rtu_over_udp: 8899
  reply_prefix: AA55

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 35003
    type: str
    length: 8
  checks:
  # a series tag in the serial number, or the external model name of an ESA (GW…K-ETA-G20)
  - - table: holding
      address: 35003
      type: str
      length: 8
      contains:
      - ETU
      - ETL
      - ETR
      - BHN
      - EHU
      - BHU
      - EHR
      - BTU
      - ESN
      - EBN
      - EMN
      - SPN
      - ERN
      - ESC
      - HLB
      - HMB
      - HBB
      - EOA
      - ETT
      - HTA
      - HUB
      - AEB
      - SPB
      - CUB
      - EUB
      - HEB
      - ERB
      - BTT
      - ETF
      - ARB
      - URB
      - EBR
      - NAH
      - AES
      - HHI
      - ABP
      - EHB
      - HSB
      - HUA
      - CUA
      - ETC
      - BTC
      - BTN
    - table: holding
      address: 35060
      type: str
      length: 16
      contains:
      - -ETA-
models:
  - {id: goodwe_single_phase, name: Single-phase, match: {table: holding, address: 35003, type: str, length: 8, contains: [EHB, EHU, EHR, HSB, ESN, EMN, ERN, EBN, HLB, HMB, HBB, SPN, NAH]}}
  - {id: goodwe_three_phase, name: Three-phase}

points:
  # Device info (35000…)
  - {key: x.rated_power, label: Rate Power, table: holding, address: 35001, type: u16, unit: W, poll: slow, note: The document gives no unit; W is assumed., conflicts: [{sources: [goodwe, openems], label: rated_power}], verified: false}
  - {key: serial, label: Inverter SN, table: holding, address: 35003, type: str, length: 8, poll: slow}
  - {key: x.model_name, label: Model Name, table: holding, address: 35011, type: str, length: 5, poll: slow}
  - {key: x.firmware_dsp_master, label: Firmware Version_DSP_Master, table: holding, address: 35016, type: u16, poll: slow}
  - {key: x.firmware_dsp_slave, label: Firmware Version_DSP_Slave, table: holding, address: 35017, type: u16, poll: slow}
  - {key: x.firmware_arm, label: Firmware Version_ARM, table: holding, address: 35019, type: u16, poll: slow}
  - {key: x.system_control_mode, label: System control mode, table: holding, address: 35043, type: u16, enum: system_control_mode, optional: true, poll: slow}
  - {key: x.beta_version_dsp_slave, label: Beta Version_DSP_Slave, table: holding, address: 35044, type: u16, optional: true, poll: slow}
  - {key: x.external_model_name, label: Externel Model Name, table: holding, address: 35060, type: str, length: 16, optional: true, poll: slow, note: Read "GW29.9K-ET" on a real ET.}

  # Real-time clock: two values per register, high byte first
  - {key: x.clock, label: Real-Time Clock, table: holding, address: 35100, type: datetime, length: 3, datetime: {year: {register: 0, bits: [8, 15], offset: 2000}, month: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}, note: Two-digit year (13–99 = 2013–2099).}

  # PV inputs
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 35103, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 35104, type: u16, unit: A, scale: 0.1}
  - {key: x.pv1_power, label: PV1 Power, table: holding, address: 35105, type: u32, invalid: [4294967295], unit: W}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 35107, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 35108, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_power, label: PV2 Power, table: holding, address: 35109, type: u32, invalid: [4294967295], unit: W, note: 'See the note on PV power registers: on two-strings-per-MPPT models this is the power of an MPPT, not of string PV2.', verified: false}
  - {key: x.pv3_voltage, label: PV3 Voltage, table: holding, address: 35111, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: PV3 Current, table: holding, address: 35112, type: u16, unit: A, scale: 0.1}
  - {key: x.pv3_power, label: PV3 Power, table: holding, address: 35113, type: u32, invalid: [4294967295], unit: W, note: As PV2 Power., verified: false}
  - {key: x.pv4_voltage, label: PV4 Voltage, table: holding, address: 35115, type: u16, unit: V, scale: 0.1}
  - {key: x.pv4_current, label: PV4 Current, table: holding, address: 35116, type: u16, unit: A, scale: 0.1}
  - {key: x.pv4_power, label: PV4 Power, table: holding, address: 35117, type: u32, invalid: [4294967295], unit: W, note: As PV2 Power., verified: false}
  - {key: x.pv_mode, label: PV Mode, table: holding, address: 35119, type: u32, note: 'One byte per input, PV1…PV4, codes in enum pv_mode. Which end byte 0 (PV1) is isn''t stated; taken as the least significant byte.', verified: false}

  # Grid side (inverter output per phase)
  - {key: l1_voltage, label: R Phase Inverter Voltage, table: holding, address: 35121, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: R Phase Inverter Current, table: holding, address: 35122, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: R Phase Inverter Frequency, table: holding, address: 35123, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, label: On-grid L1 Frequency}]}
  - {key: x.inverter_l1_power, label: R Phase Inverter Power, table: holding, address: 35124, type: s32, unit: W, positive: export, note: Sign not stated; output of the inverter taken as positive (the goodwe library's convention)., verified: false}
  - {key: l2_voltage, label: S Phase Inverter Voltage, table: holding, address: 35126, type: u16, unit: V, scale: 0.1}
  - {key: l2_current, label: S Phase Inverter Current, table: holding, address: 35127, type: u16, unit: A, scale: 0.1}
  - {key: x.l2_frequency, label: S Phase Inverter Frequency, table: holding, address: 35128, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, models: [goodwe_three_phase], label: On-grid L2 Frequency}]}
  - {key: x.inverter_l2_power, label: S Phase Inverter Power, table: holding, address: 35129, type: s32, unit: W, positive: export, note: As L1., verified: false}
  - {key: l3_voltage, label: T Phase Inverter Voltage, table: holding, address: 35131, type: u16, unit: V, scale: 0.1}
  - {key: l3_current, label: T Phase Inverter Current, table: holding, address: 35132, type: u16, unit: A, scale: 0.1}
  - {key: x.l3_frequency, label: T Phase Inverter Frequency, table: holding, address: 35133, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, models: [goodwe_three_phase], label: On-grid L3 Frequency}]}
  - {key: x.inverter_l3_power, label: T Phase Inverter Power, table: holding, address: 35134, type: s32, unit: W, positive: export, note: As L1., conflicts: [{sources: [openems], scale: 0.01, label: P grid t}], verified: false}
  - {key: x.grid_mode, label: Grid Mode, table: holding, address: 35136, type: u16, enum: grid_mode}
  - {key: x.total_inverter_power, label: Total Inverter Power, table: holding, address: 35137, type: s32, unit: W, note: Sign not stated.}
  - {key: grid_power, label: AC Active Power, table: holding, address: 35139, type: s32, unit: W, positive: export, note: 'Meter power when the meter link works, otherwise the power at the inverter''s grid port. The document states no sign; export = positive is the open-source goodwe library''s convention (assumed). The document''s EMS power formulas (table 8-16) and the meter offset at 47120 (positive = towards selling) only suggest the same.', verified: false}
  - {key: reactive_power, label: AC Reactive Power, table: holding, address: 35141, type: s32, unit: var}
  - {key: apparent_power, label: AC Apparent Power, table: holding, address: 35143, type: s32, unit: VA}

  # Back-up output and loads
  - {key: x.backup_l1_voltage, label: R Phase Load Voltage of Back-Up, table: holding, address: 35145, type: u16, unit: V, scale: 0.1}
  - {key: x.backup_l1_current, label: R Phase Load Current of Back-Up, table: holding, address: 35146, type: u16, unit: A, scale: 0.1}
  - {key: x.backup_l1_frequency, label: R Phase Load Frequency of Back-Up, table: holding, address: 35147, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, label: Back-up L1 Frequency}]}
  - {key: x.backup_l1_load_mode, label: Load Mode_R, table: holding, address: 35148, type: u16, enum: backup_load_mode, note: Also used by single-phase inverters.}
  - {key: x.backup_l1_power, label: R Phase Load Power of Back-Up, table: holding, address: 35149, type: s32, unit: W, note: Sign not stated.}
  - {key: x.backup_l2_voltage, label: S Phase Load Voltage of Back-Up, table: holding, address: 35151, type: u16, unit: V, scale: 0.1}
  - {key: x.backup_l2_current, label: S Phase Load Current of Back-Up, table: holding, address: 35152, type: u16, unit: A, scale: 0.1}
  - {key: x.backup_l2_frequency, label: S Phase Load Frequency of Back-Up, table: holding, address: 35153, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, models: [goodwe_three_phase], label: Back-up L2 Frequency}]}
  - {key: x.backup_l2_load_mode, label: Load Mode_S, table: holding, address: 35154, type: u16, enum: backup_load_mode, note: Not used by single-phase inverters.}
  - {key: x.backup_l2_power, label: S Phase Load Power of Back-Up, table: holding, address: 35155, type: s32, unit: W, note: Sign not stated.}
  - {key: x.backup_l3_voltage, label: T Phase Load Voltage of Back-Up, table: holding, address: 35157, type: u16, unit: V, scale: 0.1}
  - {key: x.backup_l3_current, label: T Phase Load Current of Back-Up, table: holding, address: 35158, type: u16, unit: A, scale: 0.1}
  - {key: x.backup_l3_frequency, label: T Phase Load Frequency of Back-Up, table: holding, address: 35159, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [goodwe], type: s16, models: [goodwe_three_phase], label: Back-up L3 Frequency}]}
  - {key: x.backup_l3_load_mode, label: Load Mode_T, table: holding, address: 35160, type: u16, enum: backup_load_mode, note: Not used by single-phase inverters.}
  - {key: x.backup_l3_power, label: T Phase Load Power of Back-Up, table: holding, address: 35161, type: s32, unit: W, note: Sign not stated.}
  - {key: x.load_l1_power, label: R Phase On-Grid Load Power, table: holding, address: 35163, type: s32, unit: W, note: Back-up load not included.}
  - {key: x.load_l2_power, label: S Phase On-Grid Load Power, table: holding, address: 35165, type: s32, unit: W, note: Back-up load not included.}
  - {key: x.load_l3_power, label: T Phase On-Grid Load Power, table: holding, address: 35167, type: s32, unit: W, note: Back-up load not included.}
  - {key: x.backup_load_power, label: Total Back-Up Load Power, table: holding, address: 35169, type: s32, unit: W}
  - {key: x.on_grid_load_power, label: Total Load Power, table: holding, address: 35171, type: s32, unit: W, note: 'On-grid loads only, back-up port not included.'}
  - {key: x.ups_load, label: Ups Load Percent, table: holding, address: 35173, type: u16, unit: '%', scale: 0.01, note: Back-up load as a share of rated power., conflicts: [{sources: [goodwe], scale: 1, label: Ups Load}]}

  # Inverter
  - {key: x.air_temperature, label: Air Temperature, table: holding, address: 35174, type: s16, unit: °C, scale: 0.1}
  - {key: x.module_temperature, label: Model Temperature, table: holding, address: 35175, type: s16, unit: °C, scale: 0.1}
  - {key: temperature, label: Hitsink Temperature, table: holding, address: 35176, type: s16, unit: °C, scale: 0.1}
  - {key: x.function_bits, label: Function Bit Value, table: holding, address: 35177, type: u16, note: Bits in the document's table 8-37 (not decoded here).}
  - {key: x.bus_voltage, label: BUS Voltage, table: holding, address: 35178, type: u16, unit: V, scale: 0.1}
  - {key: x.nbus_voltage, label: NBUS Voltage, table: holding, address: 35179, type: u16, unit: V, scale: 0.1}

  # Battery 1
  - {key: battery_voltage, label: Battery1 Voltage, table: holding, address: 35180, type: u16, unit: V, scale: 0.1, note: The BMS's value when it communicates.}
  - {key: x.battery1_current, label: Battery1 Current, table: holding, address: 35181, type: s16, unit: A, scale: 0.1, note: Sign not stated.}
  - {key: battery_power, label: Battery1 Power, table: holding, address: 35182, type: s32, unit: W, positive: discharge, note: The document states no sign; discharge = positive is the open-source goodwe library's convention (assumed). The document's EMS power formulas (table 8-16) only suggest the same. The ET30 map v1.0 lists it as U32; the BESS map V1.1 and Map V1.2 as S32 (200 ms average)., verified: false}
  - {key: x.battery1_mode, label: Battery1 Mode, table: holding, address: 35184, type: u16, enum: battery_mode}

  # Status
  - {key: x.warning_code, label: Warning Code, table: holding, address: 35185, type: u16, note: 'The document has no table for it (neither column); shown as hex. 0x40 (bit 6) was read on a real ET whose own web page showed no warning: treated as harmless, meaning unknown. The documented warnings are in 35328 / 35335.'}
  - {key: x.safety_country, label: Safety Country, table: holding, address: 35186, type: u16, poll: slow, note: Codes in the document's table 8-21.}
  - {key: state, label: Work Mode, table: holding, address: 35187, type: u16, enum: work_mode}
  - {key: error_code, label: Error Message, table: holding, address: 35189, type: u32, flags: error_message, note: 'The register row refers to table 8-12 (operation modes), in both languages; the bit table is 8-2.'}

  # Energy
  - {key: pv_energy, label: PV Energy-Total, table: holding, address: 35191, type: u32, invalid: [4294967295], unit: kWh, scale: 0.1, poll: slow}
  - {key: pv_energy_today, label: PV Energy-Day, table: holding, address: 35193, type: u32, invalid: [4294967295], unit: kWh, scale: 0.1}
  - {key: x.inverter_output_energy, label: Inverter output energy total, table: holding, address: 35195, type: u32, unit: kWh, scale: 0.1, poll: slow, note: 'Not in Map V1.2. Taken as the lifetime counterpart of 35199 (by analogy, unconfirmed).', verified: false}
  - {key: x.operating_hours, label: Hour-Total, table: holding, address: 35197, type: u32, unit: h, poll: slow}
  - {key: x.inverter_output_energy_today, label: Energy-Day-Sell, table: holding, address: 35199, type: u16, unit: kWh, scale: 0.1, note: 'The Chinese text (authoritative) says the inverter''s AC output energy of the day, not grid export as the English says.'}
  - {key: x.inverter_input_energy, label: Inverter input energy total, table: holding, address: 35200, type: u32, unit: kWh, scale: 0.1, poll: slow, note: 'Not in Map V1.2. Taken as the lifetime counterpart of 35202 (by analogy, unconfirmed).', verified: false}
  - {key: x.inverter_input_energy_today, label: Energy-Day-Buy, table: holding, address: 35202, type: u16, unit: kWh, scale: 0.1, note: 'The Chinese text (authoritative) says the inverter''s AC input energy of the day, not grid import as the English says.'}
  - {key: x.load_energy, label: Energy-Total-Load, table: holding, address: 35203, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Back-up load not included.}
  - {key: x.load_energy_today, label: Energy-Load-Day, table: holding, address: 35205, type: u16, unit: kWh, scale: 0.1, note: Back-up load not included.}
  - {key: x.battery_charge_energy, label: Energy-Battery Charge, table: holding, address: 35206, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_charge_energy_today, label: Energy-Charge-Day, table: holding, address: 35208, type: u16, unit: kWh, scale: 0.1, note: 'Counted by the inverter, not the BMS.'}
  - {key: x.battery_discharge_energy, label: Energy-Battery Discharge, table: holding, address: 35209, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_energy_today, label: Energy-Discharge-Day, table: holding, address: 35211, type: u16, unit: kWh, scale: 0.1, note: 'Counted by the inverter, not the BMS.'}
  - {key: x.battery_strings, label: Battery Strings, table: holding, address: 35212, type: u16, note: Number of battery modules.}
  - {key: x.cpld_warning_code, label: CPLD Warning Code, table: holding, address: 35213, type: u16, note: For after-sales service only (table 8-17); not a problem to report.}
  - {key: x.diagnosis_status_high, label: Diagnosis Status High, table: holding, address: 35218, type: u32, note: 'Codes in table 8-13; explanations, not faults.'}
  - {key: x.diagnosis_status_low, label: Diagnosis Status Low, table: holding, address: 35220, type: u32, flags: diagnosis_low, note: 'Why the battery doesn''t charge or discharge; explanations, not faults.'}

  # Detailed fault and status words (BESS map V1.1, ET30 map v1.0)
  - {key: x.grid_detailed_error, label: Safety Detailed Error Message, table: holding, address: 35250, type: u64, flags: grid_detailed_error, optional: true, note: Details of grid faults (table 8-30); the faults themselves are reported through 35189.}
  - {key: x.inverter_detailed_error, label: Inverter Detailed Error Message, table: holding, address: 35254, type: u64, flags: inverter_detailed_error, optional: true, note: Details of inverter faults (table 8-31); the faults themselves are reported through 35189.}
  - {key: x.inverter_detailed_status, label: Inverter Detailed Status Message, table: holding, address: 35258, type: u64, flags: inverter_detailed_status, optional: true, note: 'Table 8-32: curves, limits and derating in force.'}

  # Battery 2 (models with two batteries; older firmware answers with an exception)
