notes:
- 'All ones means "not available" on the 32-bit PV registers: a real GW29.9K-ET (firmware 04062-13-S00) read 0xFFFFFFFF at night
  (about 02:20 on 2026-11-02) at 35301 and 35193; marked invalid on 35105, 35109, 35113, 35117, 35191, 35193 and 35301. The
  document gives no marker for them. The s32 power registers get none either: all ones reads as -1 W there, a possible real value.'
- 'ESA series (GoodWe ESA 5-30kW, all-in-one; GW5K- to GW29.999K-ETA-G20, all three-phase): the ET register map. On a real
  GW8K-ETA-G20 (2026-11-02) all 167 registers of the Third-Party EMS protocol answered, and 912 of this file''s 1111 holding points;
  those that didn''t are nearly all openems-only grid-code settings (45400-45900), the DC-DC battery block (51000 ff.) and the EV
  charger and backup box flags (10600, 10900). Its serial number carries the series tag NBG, which is not in the list (one unit
  only), and 35011 reads GWGWGW, so it is identified by its external model name at 35060.'
- All values are holding registers (function 03). 35000 (33 registers), 35100 (125), 35262 (5), 35301 (7) and 37000 (24) can
  be read as whole blocks; the inverter answers across the few undocumented registers inside them.
- Battery 2 (35262…) and the PV extension (35301…) don't exist on every model or firmware; such inverters answer with a Modbus
  exception.
- 'PV power registers 35105/35109/35113/35117: on models with two strings per MPPT they hold the power per MPPT (seen on a
  GW30K-ET: PV2 power at 0 A matched PV3 voltage × current). Per-string power is safer computed as voltage × current; the
  sum of the four registers is still the PV total.'
- 35199/35202 (day) and 35195/35200 (total) are the inverter's own AC output and input, battery included, not the grid export
  and import; the document has no grid energy counters in this block.
- Grid and battery power signs (35139, 35182, 35264) aren't stated in the document in either language; they follow the open-source
  goodwe library and still need confirming on a real inverter. Diagnosis bit 10 (35220) reports a reversed meter, which would
  flip the grid sign.
- 'Table 8-31 bits 16/17: the BESS map''s English text swaps them; the Chinese (followed) has 16 = off-grid AC voltage too
  high, 17 = too low.'
- 'Meter block: the meter power and energy signs aren''t stated in the maps; registers 36005–36009 (S16) are for ARM firmware
  up to 09, 36019–36041 (S32) for later firmware. Meter power factor: factor 1000 per the BESS map V1.1 (ET30 map v1.0: 100).'
- 'Problems: the BMS codes apply only while battery 1 is present (35184 ≠ 0). Grid mode 0 is not reported: it also covers
  the inverter waiting, disconnected.'
- Identification as goodwe recognises the device (not checked against a document).
- 'Left out: On-grid L1 Power (holding 35125, s16) from goodwe overlaps x.inverter_l1_power from the documents.'
- 'Left out: On-grid L2 Power (holding 35130, s16) from goodwe overlaps x.inverter_l2_power from the documents.'
