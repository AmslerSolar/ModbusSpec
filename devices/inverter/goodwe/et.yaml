- 'evcc template `goodwe-hybrid` (grid, pv, battery) lists: GoodWe ET/EH/BH/BT/ESA Hybrid Inverter.'
- evcc also offers Modbus over UDP for it.
- The template has the option `battery` (default 1); points used only with another value say so in their note.
- 'Family detected by a model tag in the serial number: ETU, ETL, ETR, BHN, EHU, BHU, EHR, BTU, ESN, EBN, EMN, SPN, ERN, ESC,
  HLB, HMB, HBB, EOA, ETT, HTA, HUB, AEB, SPB, CUB, EUB, HEB, ERB, BTT, ETF, ARB, URB, EBR, NAH, AES, HHI, ABP, EHB, HSB,
  HUA, CUA, ETC, BTC, BTN.'
- The library reaches these registers over Modbus TCP or as RTU frames over UDP through the Wi-Fi/LAN dongle; the dongle puts
  AA 55 before each RTU reply.
- 'Single-phase models have one of these tags in the serial number: EHB, EHU, EHR, HSB, ESN, EMN, ERN, EBN, HLB, HMB, HBB,
  SPN, NAH.'
- 'Battery Error (battery_error): bits 0-15 are register 37006, bits 16-31 register 37012. Upstream combines them as `high
  << 16 + low`, which Python evaluates as `high << (16 + low)`; the layout here is the intended one.'
- 'Battery Warning (battery_warning): bits 0-15 are register 37010, bits 16-31 register 37013. Upstream combines them as `high
  << 16 + low`, which Python evaluates as `high << (16 + low)`; the layout here is the intended one.'
- 'Battery 2 Error (battery2_error): bits 0-15 are register 39004, bits 16-31 register 39010. Upstream combines them as `high
  << 16 + low`, which Python evaluates as `high << (16 + low)`; the layout here is the intended one.'
- 'Battery 2 Warning (battery2_warning): bits 0-15 are register 39008, bits 16-31 register 39011. Upstream combines them as
  `high << 16 + low`, which Python evaluates as `high << (16 + low)`; the layout here is the intended one.'
- Second-battery registers (35262…, 39000…) are read only on two-battery models or from 25 kW rated power.
- MPPT registers (35301…) and the extended meter registers (36045…) are read only on platform 745 models or from 15 kW rated
  power; inverters without them reject the request.
- PV3/PV4 registers are dropped on inverters below 15 kW without four MPPTs.
- Settings 47545…47603 need ARM firmware 19, settings 47542…47612 firmware 22 (the library probes 47547 and 47589 and drops
  them on an illegal-address reply). Eco-mode groups are packed records and left out; only their on/off byte (eco_mode_N_switch,
  high byte of one group register) is listed.
- OpenEMS reads the state and fault registers from 32000 on only where the inverter answers them (chosen at run time); they
  are not included.
- The models are openWB's settings for this device (which register map to read), not detected from the device.
