# Written from the GoodWe Modbus protocol map (1.2, updated 2025-03-28); where its English and Chinese text differ,
# the Chinese is followed. Meter block (36000 ff.), detailed fault words (35250 ff.) and the parallel-system block
# (10400 ff.) from the ESG2 ET30 map v1.0 and the BESS map V1.1. The ESA series (all-in-one, three-phase, model numbers
# GW…K-ETA-G20) has the same register map: checked with GoodWe's Third-Party EMS protocol V1.1.1 and a sweep of a real
# GW8K-ETA-G20 (sweeps/esa-gw8k-eta-g20_2026-11-02.sweep).

modbusspec: 0
id: goodwe-et
manufacturer: GoodWe
name: ET / EH / BT / BH and ESA (GW…K-ETA-G20) hybrid inverters
kind: inverter

sources:
- title: GoodWe Modbus Protocol Hybrid (Modbus protocol Map), English and Chinese
  version: 1.2 (updated 2025-03-28)
- title: GoodWe Third-Party EMS Protocol MODBUS (Simplified Version)
