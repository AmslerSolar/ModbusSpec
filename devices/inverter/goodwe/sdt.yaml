modbusspec: 0
id: goodwe-sdt
manufacturer: GoodWe
name: SDT/DT Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/goodwe-dt.yaml

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: pv_power, label: PV power, table: holding, address: 781, type: u16, unit: W}
  - {key: pv_energy, label: PV energy, table: holding, address: 786, type: u32, unit: kWh, scale: 0.1}

notes:
- 'evcc template `goodwe-dt` (pv) lists: GoodWe SDT/DT Inverter.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
