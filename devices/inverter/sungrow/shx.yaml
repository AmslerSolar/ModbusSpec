connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 4989
    type: str
    length: 10
  checks:
  - table: input
    address: 4999
    type: u16
    range:
    - 3328
    - 3839

models:
  - {id: sh_rs, name: SH3.0–10RS, match: {table: input, address: 4999, type: u16, in: [3341, 3343, 3344, 3351, 3352, 3354, 3355]}}
  - {id: sh_rt, name: SH5.0–10RT, match: {table: input, address: 4999, type: u16, in: [3584, 3585, 3586, 3587, 3592, 3593, 3594, 3595, 3596, 3597, 3598, 3599, 3600, 3601, 3602, 3603]}}
  - {id: sh_t, name: SH5–25T, match: {table: input, address: 4999, type: u16, in: [3616, 3617, 3618, 3619, 3620, 3621, 3622, 3624]}}
  - {id: mg_rl, name: MG5–12RL, match: {table: input, address: 4999, type: u16, in: [3367, 3368, 3369, 3370, 3375, 3377]}}
  - {id: sh_rl, name: SH3–10RL, match: {table: input, address: 4999, type: u16, in: [3371, 3372, 3373, 3374, 3393, 3394, 3395]}}
  - {id: sh_cx, name: SH50–125CX, match: {table: input, address: 4999, type: u16, in: [3641, 3642, 3645, 3665, 3666]}}
  - {id: mg_tl, name: MG10–25TL, match: {table: input, address: 4999, type: u16, in: [3667, 3668, 3669, 3670, 3671]}}
  - {id: sh_k, name: 'SH3K6, SH4K6, SH5K (older)', match: {table: input, address: 4999, type: u16, in: [3331, 3334, 3335, 3337, 3338, 3339, 3340]}}
  - {id: other, name: Other Sungrow hybrid (type code not in the document), match: {table: input, address: 4999, type: u16, range: [3328, 3839]}}
  - {id: sh, name: SH via LAN}

points:
  # Identity
  - {key: x.protocol_version, label: Protocol version, table: input, address: 4951, type: u32, invalid: [4294967295], poll: slow, note: 'One byte per part, most significant first: 0x01010700 = V1.1.7. Not available through a Logger.'}
  - {key: x.arm_certification_version, label: Certification version of ARM software, table: input, address: 4953, type: str, length: 15, poll: slow}
  - {key: x.dsp_certification_version, label: Certification version of DSP software, table: input, address: 4968, type: str, length: 15, poll: slow}
  - {key: serial, label: SN, table: input, address: 4989, type: str, length: 10, poll: slow}
  - {key: x.device_type_code, label: Device type code, table: input, address: 4999, type: u16, enum: device_type, invalid: [65535], poll: slow}
  - {key: x.nominal_output_power, label: Nominal output power, table: input, address: 5000, type: u16, unit: kW, scale: 0.1, invalid: [65535], poll: slow}
  - {key: x.output_type, label: Output type, table: input, address: 5001, type: u16, enum: output_type, invalid: [65535], poll: slow}
  # Inverter
  - {key: x.daily_output_energy, label: Daily output energy, table: input, address: 5002, type: u16, unit: kWh, scale: 0.1, invalid: [65535], note: AC output including battery discharge.}
  - {key: x.total_output_energy, label: Total output energy, table: input, address: 5003, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], models: [sh_rs, sh_rt, sh_t, mg_rl, sh_rl, mg_tl, other], poll: slow, note: AC output including battery discharge.}
  - {key: x.total_output_energy, label: Total output energy, table: input, address: 5003, type: u32, unit: kWh, invalid: [4294967295], models: [sh_cx], poll: slow, note: Whole kWh on the SH50–125CX.}
  - {key: temperature, label: Inside temperature, table: input, address: 5007, type: s16, unit: °C, scale: 0.1, invalid: [32767]}
  - {key: x.mppt1_voltage, label: MPPT 1 voltage, table: input, address: 5010, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.mppt1_current, label: MPPT 1 current, table: input, address: 5011, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.mppt2_voltage, label: MPPT 2 voltage, table: input, address: 5012, type: u16, unit: V, scale: 0.1, invalid: [65535]}
  - {key: x.mppt2_current, label: MPPT 2 current, table: input, address: 5013, type: u16, unit: A, scale: 0.1, invalid: [65535]}
  - {key: x.mppt3_voltage, label: MPPT 3 voltage, table: input, address: 5014, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 3 or more MPPTs (see notes).}
  - {key: x.mppt3_current, label: MPPT 3 current, table: input, address: 5015, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 3 or more MPPTs (see notes).}
  - {key: x.mppt4_voltage, label: MPPT 4 voltage, table: input, address: 5114, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 4 or more MPPTs (see notes).}
  - {key: x.mppt4_current, label: MPPT 4 current, table: input, address: 5115, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 4 or more MPPTs (see notes).}
  - {key: x.mppt5_voltage, label: MPPT 5 voltage, table: input, address: 5116, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 5 or more MPPTs (see notes).}
  - {key: x.mppt5_current, label: MPPT 5 current, table: input, address: 5117, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 5 or more MPPTs (see notes).}
  - {key: x.mppt6_voltage, label: MPPT 6 voltage, table: input, address: 5118, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 6 or more MPPTs (see notes).}
  - {key: x.mppt6_current, label: MPPT 6 current, table: input, address: 5119, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 6 or more MPPTs (see notes).}
  - {key: x.mppt7_voltage, label: MPPT 7 voltage, table: input, address: 5120, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 7 or more MPPTs (see notes).}
  - {key: x.mppt7_current, label: MPPT 7 current, table: input, address: 5121, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 7 or more MPPTs (see notes).}
  - {key: x.mppt8_voltage, label: MPPT 8 voltage, table: input, address: 5122, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 8 or more MPPTs (see notes).}
  - {key: x.mppt8_current, label: MPPT 8 current, table: input, address: 5123, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 8 or more MPPTs (see notes).}
  - {key: x.mppt9_voltage, label: MPPT 9 voltage, table: input, address: 5129, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 9 or more MPPTs (see notes).}
  - {key: x.mppt9_current, label: MPPT 9 current, table: input, address: 5130, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 9 or more MPPTs (see notes).}
  - {key: x.mppt10_voltage, label: MPPT 10 voltage, table: input, address: 5131, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Only on models with 10 or more MPPTs (see notes).}
  - {key: x.mppt10_current, label: MPPT 10 current, table: input, address: 5132, type: u16, unit: A, scale: 0.1, invalid: [65535], note: Only on models with 10 or more MPPTs (see notes).}
  - {key: pv_power, label: Total DC power, table: input, address: 5016, type: u32, unit: W, invalid: [4294967295]}
  - {key: l1_voltage, label: Phase A voltage / A-B line voltage, table: input, address: 5018, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line voltage A-B when the output type is 3P3L.}
  - {key: l2_voltage, label: Phase B voltage / B-C line voltage, table: input, address: 5019, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line voltage B-C when the output type is 3P3L.}
  - {key: l3_voltage, label: Phase C voltage / C-A line voltage, table: input, address: 5020, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line voltage C-A when the output type is 3P3L.}
  - {key: reactive_power, label: Reactive power, table: input, address: 5032, type: s32, unit: var, invalid: [2147483647]}
  - {key: power_factor, label: Power factor, table: input, address: 5034, type: s16, scale: 0.001, invalid: [32767], note: '> 0 leading, < 0 lagging.', conflicts: [{sources: [openhab, openwb, sungrow-mkaiser], unit: '%', label: Power Factor}]}
  - {key: x.grid_frequency_0_1, label: Grid frequency (0.1 Hz), table: input, address: 5035, type: u16, unit: Hz, scale: 0.1, invalid: [65535], note: Same value as 5241 at lower resolution; prefer 5241., conflicts: [{sources: [openems, openhab], scale: 0.01, label: Grid frequency}]}
  - {key: l1_current, label: Phase A current, table: input, address: 13030, type: s16, unit: A, scale: 0.1, invalid: [32767], note: The document gives no sign.}
  - {key: l2_current, label: Phase B current, table: input, address: 13031, type: s16, unit: A, scale: 0.1, invalid: [32767], note: Only with output type 3P4L or 3P3L.}
  - {key: l3_current, label: Phase C current, table: input, address: 13032, type: s16, unit: A, scale: 0.1, invalid: [32767], note: Only with output type 3P4L or 3P3L.}
  - {key: x.total_active_power, label: Total active power, table: input, address: 13033, type: s32, unit: W, invalid: [2147483647]}
  - {key: frequency, label: Grid frequency, table: input, address: 5241, type: u16, unit: Hz, scale: 0.01, invalid: [65535]}
  - {key: state, label: Running state, table: input, address: 12999, type: u16, enum: running_state, invalid: [65535]}
  - {key: x.power_flow, label: Power flow status, table: input, address: 13000, type: u16, flags: power_flow, invalid: [65535], note: Bits 1 and 2 give the battery direction (charging / discharging).}
  # PV
  - {key: pv_energy_today, label: Daily PV generation, table: input, address: 13001, type: u16, unit: kWh, scale: 0.1, invalid: [65535]}
  - {key: pv_energy, label: Total PV generation, table: input, address: 13002, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow}
  - {key: x.daily_export_from_pv, label: Daily export energy from PV, table: input, address: 13004, type: u16, unit: kWh, scale: 0.1, invalid: [65535], note: Only valid with a smart meter connected directly to the inverter.}
  - {key: x.total_export_from_pv, label: Total export energy from PV, table: input, address: 13005, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow, note: Only valid with a smart meter connected directly to the inverter.}
  - {key: x.daily_direct_consumption, label: Daily direct energy consumption, table: input, address: 13016, type: u16, unit: kWh, scale: 0.1, invalid: [65535], note: Only valid with a smart meter connected directly to the inverter.}
  - {key: x.total_direct_consumption, label: Total direct energy consumption, table: input, address: 13017, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow, note: Only valid with a smart meter connected directly to the inverter.}
  # Grid meter
  - {key: x.meter_power, label: Meter active power, table: input, address: 5600, type: s32, unit: W, positive: import, invalid: [2147483647], note: 'Document: > 0 buying from the grid, < 0 selling. Only valid with a smart meter connected directly to the inverter. Added in protocol V1.1.7.'}
  - {key: x.meter_l1_power, label: Meter phase A active power, table: input, address: 5602, type: s32, unit: W, positive: import, invalid: [2147483647], note: Sign as 5600. Only with a three-phase meter connected directly to the inverter.}
  - {key: x.meter_l2_power, label: Meter phase B active power, table: input, address: 5604, type: s32, unit: W, positive: import, invalid: [2147483647], note: Sign as 5600. Only with a three-phase meter connected directly to the inverter.}
  - {key: x.meter_l3_power, label: Meter phase C active power, table: input, address: 5606, type: s32, unit: W, positive: import, invalid: [2147483647], note: Sign as 5600. Only with a three-phase meter connected directly to the inverter.}
  - {key: load_power, label: Load power, table: input, address: 13007, type: s32, unit: W, invalid: [2147483647], note: Only valid with a smart meter connected directly to the inverter. The document gives no sign; power-flow bits 3 / 7 suggest it is negative only when the 'load' side generates (retrofit systems).}
  - {key: x.export_power, label: Export power, table: input, address: 13009, type: s32, unit: W, positive: export, invalid: [2147483647], verified: false, note: Only valid with a smart meter connected directly to the inverter. Described as power the inverter delivers to the grid; what a negative value means isn't stated. Grid power comes from 5600 where the firmware has it (derived).}
  - {key: x.daily_import_energy, label: Daily import energy, table: input, address: 13035, type: u16, unit: kWh, scale: 0.1, invalid: [65535], note: Only valid with a smart meter connected directly to the inverter.}
  - {key: grid_import_energy, label: Total import energy, table: input, address: 13036, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow, note: Only valid with a smart meter connected directly to the inverter.}
  - {key: x.daily_export_energy, label: Daily export energy, table: input, address: 13044, type: u16, unit: kWh, scale: 0.1, invalid: [65535], note: Only valid with a smart meter connected directly to the inverter.}
  - {key: grid_export_energy, label: Total export energy, table: input, address: 13045, type: u32, unit: kWh, scale: 0.1, invalid: [4294967295], poll: slow, note: Only valid with a smart meter connected directly to the inverter.}
  - {key: x.self_consumption_today, label: Self-consumption of today, table: input, address: 13028, type: u16, unit: '%', scale: 0.1, invalid: [65535]}
  - {key: x.meter2_power, label: Channel 2 total active power, table: input, address: 13199, type: s32, unit: W, invalid: [2147483647], models: [sh_rt, sh_t], note: Only with a dual-channel meter (e.g. DTSU666-20); no sign stated.}
  - {key: x.meter2_l1_power, label: Channel 2 phase A active power, table: input, address: 13201, type: s32, unit: W, invalid: [2147483647], models: [sh_rt, sh_t]}
  - {key: x.meter2_l2_power, label: Channel 2 phase B active power, table: input, address: 13203, type: s32, unit: W, invalid: [2147483647], models: [sh_rt, sh_t]}
  - {key: x.meter2_l3_power, label: Channel 2 phase C active power, table: input, address: 13205, type: s32, unit: W, invalid: [2147483647], models: [sh_rt, sh_t]}
  - {key: x.feed_in_limit_min, label: Min. feed-in power limitation value, table: input, address: 5621, type: u16, unit: kW, scale: 0.01, invalid: [65535], poll: slow}
  - {key: x.feed_in_limit_max, label: Max. feed-in power limitation value, table: input, address: 5622, type: u16, unit: kW, scale: 0.01, invalid: [65535], poll: slow}
  # Battery
  - {key: x.battery_power, label: Battery power, table: input, address: 5213, type: s32, unit: W, invalid: [2147483647], note: Recommended over 13021. The document gives no sign; power-flow bits 1 (charging) and 2 (discharging) give the direction. One open-source project reads + = discharging; unconfirmed.}
  - {key: x.battery_power_legacy, label: Battery power, table: input, address: 13021, type: u16, unit: W, invalid: [65535], models: [sh_rt, sh_t, mg_rl, sh_rl, sh_cx, mg_tl, other], note: 'Older register, magnitude only; prefer 5213.'}
  - {key: x.battery_power_legacy, label: Battery power, table: input, address: 13021, type: s16, unit: W, invalid: [32767], models: [sh_rs], note: S16 on the SH3.0–10RS; no sign stated. Prefer 5213.}
