notes:
- The documents number registers from 1 and ask to request number − 1; the addresses here are those request addresses (document
  register 5000 = address 4999).
- Running data are input registers (function 04), settings holding registers (function 03/06/16).
- 32-bit values are sent low word first; bytes within a register and text are high byte first.
- 'Registers a model doesn''t have answer with the type''s maximum: 0xFFFF (U16), 0xFFFFFFFF (U32), 0x7FFF (S16), 0x7FFFFFFF
  (S32), 0x00 bytes for text.'
- Connect through the inverter's own Ethernet port where fitted, its RS485 port, or the Ethernet port of a WiNet-S / WiNet-S2
  / Logger1000; other Sungrow modules (e.g. iHomeManager) don't pass it on. Unit id 1 by default (1–247). Behind a WiNet-S
  or Logger the unit id to use is shown in its web interface; that it is 1 for a single inverter is assumed.
- Settings (holding registers) shouldn't be read or written often through a WiNet-S / WiNet-S2 / Logger1000.
- Only read documented runs of registers (reserved ones inside a run are fine); a request touching an undocumented register
  fails.
- 'Models: the device type code (4999) names the model; models are grouped by series as in the document''s Appendix 1. Codes
  0x0D00–0x0EFF the document doesn''t list are assumed to be other Sungrow hybrids.'
- 'MPPTs per model (Appendix 1): SH3.0–6.0RS 2, SH8.0/10RS 4, SH5.0–10RT 2, SH5–12T 2, SH15–25T 3, MG5/6RL 2, MG7.5–12RL 3,
  SH3–6RL 2, SH8/10RL 3, SH50–125CX 10, MG10–25TL 3. MPPT 5–10 exist on the SH50–125CX only.'
- Grid, load and energy-flow values (5600–5607, 13004–13010, 13016–13018, 13035–13037, 13044–13046) are only valid with a
  smart meter connected directly to the inverter; without one 5600 is expected to read the S32 'not available' value (assumed)
  and grid / load are unknown.
- 'Battery power sign: the document doesn''t give one for 5213 or 13021; use the power-flow bits (13000 bit 1 charging, bit
  2 discharging) for the direction.'
- 'The battery fault and alarm fields 13065–13078 belong to the battery: the document serves them at the battery''s own unit
  id (RS485: 200–203; via WiNet-S: the forwarding address shown in its device list; not through a Logger1000). Read at the
  inverter''s unit id they may be empty.'
- 'Problems: a set bit in the fault fields is a fault, in the alarm fields (13049, 13067, 13069, 13077) a warning; grid-side
  fault bit 8 means the grid is lost. Set bits the document leaves unnamed count too, as ''Code (field bit n)''. Running state
  fault (0x5500 / 0x0100 / 0x2500) matters only when no fault bit already explains it, warn running (0x9100) only when no
  warning bit does.'
- 'The document''s RS485 time-out is 1000 ms: wait that long for an answer before the next request.'
- Settings are listed read-write as in the document.
- 'Older SH…K models (SH3K6, SH4K6, SH5K-20, SH5K-V13, SH3K6-30, SH4K6-30, SH5K-30): editions up to V1.0.23 describe them;
  V1.1.0 removed them and the registers only they had (BMS data 13099–13117, lead-acid battery settings 13054–13072, grid
  state 13029). Their points are scoped to model sh_k; registers added in V1.1.x may be missing on them.'
- In V1.0.20 / V1.0.23 the running state (12999) is called system state and the power flow status (13000) running state; their
  values match.
- 'evcc template `sungrow-hybrid` (grid, pv, battery) lists: Sungrow SH Series Hybrid Inverter.'
- The template has the option `lan` (default false); points used only with another value say so in their note.
- The binding gives 1-based register numbers and reads input registers (function 04) one lower.
- Export power (13010 in the binding's numbering) is the signed grid power named after its positive direction; the binding
  has no separate import power.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
