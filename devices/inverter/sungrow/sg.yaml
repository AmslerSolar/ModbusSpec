notes:
- The documents number registers from 1 and ask to request number − 1; the addresses here are those request addresses (document
  register 5000 = address 4999).
- Running data are input registers (function 04), settings holding registers (function 03/06/16).
- 32-bit values are sent low word first; bytes within a register and text are high byte first.
- 'Registers a model doesn''t have answer with the type''s maximum: 0xFFFF (U16), 0xFFFFFFFF (U32), 0x7FFF (S16), 0x7FFFFFFF
  (S32), 0x00 bytes for text.'
- Connect through the inverter's own Ethernet port where fitted, its RS485 port, or the Ethernet port of a WiNet-S / WiNet-S2
  / Logger1000; other Sungrow modules (e.g. iHomeManager) don't pass it on. Unit id 1 by default (1–247). Behind a WiNet-S
  or Logger the unit id to use is shown in its web interface; that it is 1 for a single inverter is assumed.
- Settings (holding registers) shouldn't be read or written often through a WiNet-S / WiNet-S2 / Logger1000.
- Only read documented runs of registers (reserved ones inside a run are fine); a request touching an undocumented register
  fails.
- 'Models: the device type code (register 5000, address 4999) names the model (Appendix 1); some codes are shared by several
  models. Unlisted codes 0x2400–0x2CFF are assumed to be other SG inverters.'
- The number of MPPTs and strings per model is in the document's Appendix 1; MPPT and string registers a model doesn't have
  read as not available.
- Meter, load and feed-in / purchased energy (5082–5099) need a smart meter connected for feed-in limitation and exist only
  on SG2.0–10RS, SG…RS-L2, SG3.0–25RT and SG3.0–25RT-P2.
- 'Meter power sign: V1.1.80 gives none for 5082–5089; the single-phase edition V1.0.16 states feed-in negative and purchase
  positive (> 0 = import).'
- Older editions (V1.1.37, V1.1.53) list the meter, load and energy registers (5082–5103) for SG5KTL-MT, SG6KTL-MT, SG8KTL-M,
  SG10KTL-M, SG10KTL-MT, SG12KTL-M, SG15KTL-M, SG17KTL-M and SG20KTL-M with the country set to a European area, and add direct
  consumption at 5100/5102.
- The single-phase edition V1.0.16 (older residential single-phase inverters) has the same layout for the registers it lists;
  its example gives device type code 0x0022 for the SG4KTL. Its state data 2 (5046 there) has no clear value table and isn't
  included.
- 'Problems: in fault (0x5500) or alarm run (0x9100) the fault/alarm code (5044) names the cause: a fault in state 0x5500,
  a warning in 0x9100, and code 10 (grid power outage) means grid lost.'
- Many registers are missing on the SG5.5RS-JP (marked 'Except SG5.5RS-JP' in the document).
- Settings are listed read-write as in the document.
- 'evcc template `sungrow-inverter` (grid, pv) lists: Sungrow SG Series Inverter.'
