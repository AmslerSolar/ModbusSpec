notes:
- Solectria Renewables is a Yaskawa company. Function 03 reads, 06 writes. All values are single 16-bit registers, high byte
  first, with the multiplier applied to the raw value. Offsets are the 0-based protocol addresses (Modicon register = offset
  + 40001).
- The document doesn't name the physical link, serial settings or a default unit id; Modbus RTU on RS485, unit 1 and port
  502 (behind a gateway) are assumed. The unit id (Network ID, offset 14) can be 1–247, but at most 16 devices including the
  master on one bus.
- 'Other Solectria inverters use other Modbus levels: offset 38 reads 8 on inverters with the level 8 map and 9 on the level
  9 map, which keeps the level 8 registers and adds more (points marked level 9, optional here). Level 9 comes with firmware
  D002 or D003 (offset 35); registers marked D003 only don''t exist on D002. Level 9 names offsets 2 and 5 of informative
  alarms 1 ''very low'' / ''very high'', bit 9 ''recovery from grid event'', and moves DC contactor failure to informative
  alarms 2 bit 5 (level 8: bit 4).'
- 'Level 9 alarm additions not reported as problems: low DC power wait / shutdown and current limiting out of MPPT range (normal
  operation at low sun).'
- The SolZone string-current registers exist only where the option is fitted (0x8000 = sensor disconnected).
- The protection settings are preset for UL 1741 / IEEE 1547; Revision B made them read-only (except the over-voltage setting,
  which the description still lists as writable).
- 'Problem kinds: alarms after which the inverter still produces AC power (per the document''s table) are warnings, the other
  critical alarms faults. Grid voltage / frequency alarms are warnings (the grid, not the inverter); Waiting for grid is reported
  as grid lost.'
- Model detection from the nameplate power (offset 73 = 500 or 750 kW) is assumed; the document gives no model register.
