notes:
- 'SunSpec map: ''SunS'' at 40000, then models 1, 103, 113 (float copy of 103), 120, 121, 122, 123, 129, 130, 135, 136, 160,
  16 / 16001–16003 (network interfaces) and the vendor model 64190, end marker at 40921. The document''s addresses are used
  as 0-based protocol addresses, as in SunSpec. Read groups (strings, 32-bit values) from their first register in one request.
  Function 03 reads, 06 writes.'
- The document doesn't name the transport, port or unit id. The inverter has Ethernet and Wi-Fi interfaces, so Modbus TCP
  on port 502 with unit 1 is assumed.
- 'Every scale factor is a register (listed values: currents, voltages, power, frequency, energy −1; ratings 3 or −1); scale
  factors are read as signed although the document''s type column sometimes says uint16. Power, apparent / reactive power
  and power factor are taken as signed per SunSpec model 103; the document lists them as uint16.'
- 'EvtVnd2 bit numbers for the communication faults differ between the document''s tables: the model 103 / 113 tables use
  bits 24–31 (used here), the model 64190 table bits 25–31 (without ''Invalid configuration request'').'
- The document names the WMaxLim_Ena and OutPFSet_Ena values 0 'Disconnect' and 1 'Connect'; given here as disabled / enabled.
- 'Left out: model 113 (float duplicates of model 103), ride-through curves (models 129, 130, 135, 136), the network interface
  models, the remaining model 121 settings, per-zone timestamps / temperatures / states (the document shows them as not available),
  and the vendor write-only and test registers (password, event clearing, arc / insulation / IMI test start, input zone configuration).'
- Model 120 in the document lists both the ID and the DERTyp at 40186; the ID is at 40184 and the length at 40185.
- 'Problem kinds: grid voltage / frequency and island events are the grid''s, reported as warnings (island detection as grid
  lost); inverter hardware, arc, insulation and ground faults as faults. Derating by customer command is not a problem.'
