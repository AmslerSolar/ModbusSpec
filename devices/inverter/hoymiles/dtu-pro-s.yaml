modbusspec: 0
id: hoymiles-dtu-pro-s
manufacturer: Hoymiles
name: DTU-Pro-S gateway for HMS / HMT microinverters (Modbus TCP)
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: meter/hoymiles-dtu-mbtcp.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.port, label: Port number, table: holding, address: 4099, type: u16, bits: [0, 7], note: 0 = slot unused.}
  - {key: x.power, label: Panel power, table: holding, address: 4104, type: u16, unit: W, scale: 0.1}
  - {key: x.energy, label: Panel lifetime energy, table: holding, address: 4106, type: u32, unit: kWh, scale: 0.001}

notes:
- One block of 20 registers per inverter port (panel), from 0x1000 on; slot N (from 0) starts at 0x1000 + N × 40 (evcc steps
  the start address by 40 and reads 20 registers). Points are shown for slot 0. evcc reads up to 99 slots and stops at the
  first one with an all-zero serial or port 0.
- Bytes 1–6 of a block (from the low byte of its first register) hold the inverter serial as 6 binary bytes (printed as hex).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
