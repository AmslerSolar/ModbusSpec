modbusspec: 0
id: tsun-tsol-ms
manufacturer: TSUN
name: TSOL-MS
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/tsun_tsol-ms.yaml

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: x.pv_max_power, label: PV Max Power, table: holding, address: 8199, type: u16, unit: W}
  - {key: x.device_state, label: Device State, table: holding, address: 12288, type: u16, enum: device_state, note: The project ignores raw values outside 0–5.}
  - {key: x.grid_voltage, label: Grid Voltage, table: holding, address: 12297, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_current, label: Grid Current, table: holding, address: 12298, type: s16, unit: A, scale: 0.01}
  - {key: frequency, label: Grid Frequency, table: holding, address: 12299, type: u16, unit: Hz, scale: 0.01}
  - {key: temperature, label: Temperature, table: holding, address: 12300, type: u16, unit: °C, offset: -40}
  - {key: x.rated_power, label: Rated Power, table: holding, address: 12302, type: u16, unit: W}
  - {key: x.output_power, label: Output Power, table: holding, address: 12303, type: u16, unit: W, scale: 0.1}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 12304, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 12305, type: u16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: PV1 Power, table: holding, address: 12306, type: u16, unit: W, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 12307, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 12308, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_power, label: PV2 Power, table: holding, address: 12309, type: u16, unit: W, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: pv_energy_today, label: Today Production, table: holding, address: 12316, type: u16, unit: kWh, scale: 0.01}
  - {key: pv_energy, label: Total Production, table: holding, address: 12318, type: u16, unit: kWh, scale: 0.01}
  - {key: x.today_production_1, label: Today Production 1, table: holding, address: 12319, type: u16, unit: kWh, scale: 0.1}
  - {key: x.today_production_2, label: Today Production 2, table: holding, address: 12322, type: u16, unit: kWh, scale: 0.01}

enums:
  device_state: {'0': Standby, '1': Normal}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
