enums:
  inverter_running_status: {'0': Wait, '1': Check, '2': On Grid, '3': Fault, '4': Flash (Firmware Update), '5': Off Grid}
  battery_mode: {'0': Discharge, '1': Charge}
  hybrid_inverter_working_mode: {'1': General Mode, '2': Economic Mode, '3': UPS Mode, '258': EMS General Mode, '259': EMS ACCtrlMode, '513': EMS BattCtrlMode, '772': EMS OffGridMode}
  inverter_ac_power_setting_mode: {'0': 'Off', '1': Total Power Setting, '2': Power on each Phase Setting}
  priority_power_output_setting: {'0': PV Output Priority, '1': Battery Output Priority}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
