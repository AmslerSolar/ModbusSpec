modbusspec: 0
id: sunway-stt
manufacturer: Sunway
name: STT-10KTL inverter
kind: inverter

sources:
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: 0056f9fb2485d1fbaa9fef29272ce686eefe7cf0
  path: custom_components/solax_modbus/plugin_sunway.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solax-modbus

