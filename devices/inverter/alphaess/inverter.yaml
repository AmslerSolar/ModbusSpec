notes:
- 'Addresses are the document''s hexadecimal register addresses, which are already 0-based protocol addresses. All registers
  are holding registers: read with function 03, written with 06 or 16.'
- 'The document describes RS485 (Modbus RTU): 9600 baud 8N1 for SMILE5, SMILE-B3 and SMILE-T10, 19200 baud for the Storion
  T30; the default unit id is 0x55 (85). The SMILE5 needs Modbus enabled on its display. Answers come within 300 ms; send
  at most one request every 300 ms. TCP and port 502 are not part of the document.'
- 'The document''s EMS SN example starts with "AL"; the system fault (0x08D4) and grid regulation (0x1000) tables have one
  column for AL… and one for AE… serial numbers. The flags here are the AL column. For AE systems, bits 0–27 of the system
  fault mean: inverter disconnected, grid meter disconnected, battery disconnected, system not set up, PV meter disconnected,
  meter not set up, PV meter connected the wrong way round, SD card missing or write error, RTC error, SDRAM error, MMC error,
  network card error, extension CAN error, DRED error, Android LCD disconnected, STS lost, STS fault, PV inverter lost, DG/PV
  conflict, PV inverter fault, air conditioner fault, fire fault, fire controller error, GC fault, air conditioner lost, over
  current, PCS mode fault, battery energy low.'
- 'Battery status 0x0103: the high byte is the charge state (0–2), the low byte the discharge state (0–1); the document gives
  no names for the values.'
- 'Signs: only battery power (0x0126) states its direction (− = charge, + = discharge). Grid power (0x0021) is assumed positive
  = import; the other power values are kept device-specific.'
- 'Left out: per-phase reactive / apparent power and power factors of the grid meter, PV meter per-phase values, pack and
  cell ID registers (0x0105 ff.), the AUX outputs, the safety-test protection limits (0x1001–0x101B), the ATE test block (0x1100
  ff.: reset, serial / MAC write, CT calibration), network addresses, and the industrial-series fault counters and per-cluster
  BMU data (0xA100 ff.).'
- The Topbmu registers (0xA000 ff.) are for the industrial series (Storion T30); other systems may not answer them. Topbmu
  temperatures are raw × 0.1 − 40 °C as the document states.
- Models openwb_other, solax_modbus_gen, solax_modbus_gen2_max_mppt5 come from projects and are listed after a model without
  a match, so detection never reaches them; their points apply only when a reader selects such a model by hand.
- Identification as alphaess-modbus recognises the device (not checked against a document).
- ha-alphaess-modbus names the model from the serial number's prefix; the models here only identify it. SMILE-B3 and B3-PLUS
  use other scales for a few values (see the point notes); the project doesn't detect them, the user picks the variant.
- 'Battery power control goes through the dispatch block 0x0880…0x088A: start, active power (s32, raw = W + 32000), reactive
  power, mode, SoC (× 0.392 %), duration in seconds, flow direction, PV switch.'
- 'evcc template `alpha-ess-smile` (grid, pv, battery) lists: Alpha ESS Storion SMILE.'
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- 'Left out: ct_rate_grid_meter (holding 1, u16) from alphaess-modbus overlaps counter_currents_l1 (holding 0, s32); check
  a document.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
