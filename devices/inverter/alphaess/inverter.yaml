  - {key: x.battery_charge_flag, label: Battery status (charge), table: holding, address: 259, type: u16, bits: [8, 15], note: '0, 1 or 2; the document doesn''t name the values.'}
  - {key: x.battery_discharge_flag, label: Battery status (discharge), table: holding, address: 259, type: u16, bits: [0, 7], note: 0 or 1; the document doesn't name the values.}
