modbusspec: 0
id: alphaess-inverter
manufacturer: AlphaESS
name: SMILE5, SMILE-B3, SMILE-T10 and Storion T30 storage systems
kind: inverter

sources:
- title: Handbuch Modbus RTU - Storion SMILE + T30 (German)
  version: V1.23
  url: https://github.com/dxoverdy/Alpha2MQTT/blob/febfd78da85256ba3dd33e3dff873bb295e57d52/Pics/AlphaESS-Handbuch_SMILET30_ModBus_RTU_V123-DE.pdf
  sha256: 3911c2b307bc4f1e78c621e0e47966332e60aa3ba2712985ca928b1cb2caa2b8
- id: alphaess-modbus
  title: ha-alphaess-modbus (Home Assistant integration)
  url: https://github.com/senalse/ha-alphaess-modbus
  license: MIT
  commit: 3b944d6bbba8cae6ccc6f58ca99f2ec8a6e46563
  path: custom_components/alphaess_modbus/const.py, custom_components/alphaess_modbus/sensor.py, custom_components/alphaess_modbus/__init__.py,
    custom_components/alphaess_modbus/coordinator.py
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/alpha-ess-smile.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/alpha_ess/alpha_ess
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_alphaess.py

connection:
  default_port: 502
  default_unit: 85
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    min_interval_ms: 300

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 1859
    type: str
    length: 8
  any:
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: SMILE-T10
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: SMILE-M5
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: SMILE-B3
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: SMILE-S5
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: STORION
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: SMILE5
  - table: holding
    address: 1610
    type: str
    length: 15
    prefix: ALD

models:
  - {id: alphaess_modbus_smile_t10, name: SMILE-T10, match: {table: holding, address: 1610, type: str, length: 15, prefix: SMILE-T10}}
  - {id: alphaess_modbus_smile_m5, name: SMILE-M5, match: {table: holding, address: 1610, type: str, length: 15, prefix: SMILE-M5}}
  - {id: alphaess_modbus_smile_b3, name: SMILE-B3, match: {table: holding, address: 1610, type: str, length: 15, prefix: SMILE-B3}}
  - {id: alphaess_modbus_smile_s5, name: SMILE-S5, match: {table: holding, address: 1610, type: str, length: 15, prefix: SMILE-S5}}
  - {id: alphaess_modbus_storion, name: STORION, match: {table: holding, address: 1610, type: str, length: 15, prefix: STORION}}
  - {id: alphaess_modbus_smile5, name: SMILE5, match: {table: holding, address: 1610, type: str, length: 15, prefix: SMILE5}}
  - {id: alphaess_modbus_ald, name: Alphastore, match: {table: holding, address: 1610, type: str, length: 15, prefix: ALD}}
  - {id: openwb_kit_before_v1_23, name: AlphaESS kit with firmware before V1.23}
  - {id: openwb_other, name: Other setups}
  - {id: solax_modbus_gen, name: GEN (prefix XYZ*), match: {table: holding, address: 1610, type: str, length: 10, prefix: XYZ}}
  - {id: solax_modbus_gen2_max_mppt5, name: GEN2 | MAX | MPPT5 (prefix ZYX*), match: {table: holding, address: 1610, type: str, length: 10, prefix: ZYX}}

points:
  # Grid meter
  - {key: x.grid_ct_enable, label: Grid meter CT enable, table: holding, address: 0, type: u16, writable: true, poll: slow, conflicts: [{sources: [openwb], type: s32, unit: W, word_order: big, models: [openwb_kit_before_v1_23], label: Counter power L1 (part)}]}
  - {key: x.grid_ct_rate, label: Grid meter CT rate, table: holding, address: 1, type: u16, writable: true, poll: slow}
  - {key: grid_export_energy, label: Total energy feed to grid (grid meter), table: holding, address: 16, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_import_energy, label: Total energy consumed from grid (grid meter), table: holding, address: 18, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: l1_voltage, label: Voltage of A phase (grid), table: holding, address: 20, type: u16, unit: V, conflicts: [{sources: [alphaess-modbus], type: s16, label: Grid Voltage Phase A}]}
  - {key: l2_voltage, label: Voltage of B phase (grid), table: holding, address: 21, type: u16, unit: V, conflicts: [{sources: [alphaess-modbus], type: s16, label: Grid Voltage Phase B}]}
  - {key: l3_voltage, label: Voltage of C phase (grid), table: holding, address: 22, type: u16, unit: V, conflicts: [{sources: [alphaess-modbus], type: s16, label: Grid Voltage Phase C}]}
  - {key: l1_current, label: Current of A phase (grid), table: holding, address: 23, type: s16, unit: A, scale: 0.1}
  - {key: l2_current, label: Current of B phase (grid), table: holding, address: 24, type: s16, unit: A, scale: 0.1}
  - {key: l3_current, label: Current of C phase (grid), table: holding, address: 25, type: s16, unit: A, scale: 0.1}
  - {key: frequency, label: Frequency (grid), table: holding, address: 26, type: u16, unit: Hz, scale: 0.01}
  - {key: x.power_phase_a_grid, label: Active power of A phase (grid), table: holding, address: 27, type: s32, unit: W, note: Sign not stated.}
  - {key: x.power_phase_b_grid, label: Active power of B phase (grid), table: holding, address: 29, type: s32, unit: W, note: Sign not stated.}
  - {key: x.power_phase_c_grid, label: Active power of C phase (grid), table: holding, address: 31, type: s32, unit: W, note: Sign not stated.}
  - {key: grid_power, label: Total active power (grid meter), table: holding, address: 33, type: s32, unit: W, positive: import, verified: false, note: Not stated in the document; assumed positive = import.}
  - {key: reactive_power, label: Total reactive power (grid), table: holding, address: 41, type: s32, unit: var}
  - {key: apparent_power, label: Total apparent power (grid), table: holding, address: 49, type: s32, unit: VA}
  - {key: power_factor, label: Total power factor (grid), table: holding, address: 54, type: s16, scale: 0.01}
  # PV meter (AC-coupled PV inverter)
  - {key: x.pv_ct_enable, label: PV meter CT enable, table: holding, address: 128, type: u16, writable: true, poll: slow}
  - {key: x.ct_rate_pv_meter, label: PV meter CT rate, table: holding, address: 129, type: u16, writable: true, poll: slow}
  - {key: x.total_energy_feed_to_grid_pv, label: Total energy feed to grid (PV meter), table: holding, address: 144, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_energy_consumed_from_grid_pv, label: Total energy consumed from grid (PV meter), table: holding, address: 146, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.active_power_pv_meter, label: Total active power (PV meter), table: holding, address: 161, type: s32, unit: W, note: Sign not stated.}
  # Battery (HOME series)
  - {key: battery_voltage, label: Battery voltage, table: holding, address: 256, type: u16, unit: V, scale: 0.1, conflicts: [{sources: [alphaess-modbus, solax-modbus], type: s16, label: Battery Voltage}]}
