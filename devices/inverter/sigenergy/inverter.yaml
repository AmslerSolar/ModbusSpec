notes:
- One inverter (hybrid or PV-only) of a Sigenergy plant, on its own unit id 1-246 set in the mySigen app. The default unit
  id 1 is not stated in the document; it must differ from the other devices' ids. The plant as a whole answers on unit id
  247 (sigenergy-plant), a DC charger built into the hybrid inverter on the inverter's unit id (sigenergy-dc-charger).
- 'Models: the document lists which models each register applies to (hybrid inverters: SigenStor EC SP/TP/TPLV, Sigen Hybrid
  SP/TP/SP2/TP2, Sigen PV M1-HYA/HYB, PG Controller; PV inverters: Sigen PV Max SP/TP, Sigen PV M1/H1/H2). It does not say
  what the model type register (30500) contains; the model matches assume it holds the model name as listed in the document
  (verified: false). Storage registers are hybrid-only, PV strings 17-36 PV-inverter-only.'
- PV string registers are valid only up to the string count in 31025.
- Sign of the inverter's active power (30587) and of the battery power (30599) are not stated for this table; battery_power
  is assumed positive for charging like the plant's ESS power.
- Addresses are the document's register numbers, used unchanged as 0-based protocol addresses (its request examples put 30540
  on the wire as 0x774C and 40001 as 0x9C41). 3xxxx registers are input registers (function 04), 4xxxx and 5xxxx holding registers
  (function 03).
- 'The document is inconsistent about holding registers: its type table says read/write registers support functions 04, 06
  and 0x10, and one example reads a 4xxxx register with function 04, another a 3xxxx register with function 03. Not tested;
  the tables here follow the section titles.'
- Byte and word order are not stated; big-endian (most significant register first) is assumed.
- Power registers have gain 1000 in kW (kVar, kVA) in the document, i.e. the raw value is W (var, VA); energy registers gain
  100 in kWh.
- 'At most 124 registers per read request and a minimum request period of 1000 ms, as the document states. RS485: 9600 baud
  default, 8N1. Modbus TCP server on port 502 (alternatively the device can connect out as a TCP client to a configured port).
  One inverter of the plant gives access to all devices of the plant by their unit ids; AC chargers (EVAC) are only reachable
  through an inverter, not on their own.'
- Alarm kinds follow the severity levels V2.8 and older of the document give (critical = fault, general = warning); V2.9 dropped
  that table. Grid power outage is reported as mains lost.
- 'Left out: the active and reactive power adjustment limits (30579-30586), the adjustment feedback values (30613-30619) and
  the startup / shutdown times (31038, 31040). The DC charger registers (30609, 31500-31525, 41000-41005) are in sigenergy-dc-charger.'
- Up to V1.8 the document had the inverter's daily and accumulated export / import energy at 30554-30565; since V2.4 that
  range is reserved.
- 'Left out: Grid energy (holding 30562) from evcc: the documents mark it reserved.'
- 'evcc template `sigenergy` (grid, pv, battery) lists: Sigenergy Sigen Hybrid; Sigenergy Sigen PV Max; Sigenergy SigenStore
  EC.'
- The template has the option `gateway` (default false); points used only with another value say so in their note.
- Each inverter answers on its own unit id (the project's default is 1; it must differ from an AC charger's, which often has
  1).
- Points limited to the `hybrid_inverter` model are those the project marks as applying to hybrid inverters only (battery
  values); the project does not detect the model from a register.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
