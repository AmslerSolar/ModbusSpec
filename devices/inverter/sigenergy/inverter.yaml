connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 124
    min_interval_ms: 1000

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 30515
    type: str
    length: 10
  checks:
  - table: input
    address: 30500
    type: str
    length: 15
    printable: true
  - table: input
    address: 30578
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 7
  - table: input
    address: 31004
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3

models:
  - {id: hybrid_inverter, name: 'Hybrid inverter (SigenStor, Sigen Hybrid, Sigen PV M1-HYA/HYB, PG Controller)', match: {table: input, address: 30500, type: str, length: 15, contains: [SigenStor, Hybrid, HYA, HYB, PG Controller]}}
  - {id: pv_inverter, name: 'PV inverter (Sigen PV Max, Sigen PV M1/H1/H2)', match: {table: input, address: 30500, type: str, length: 15, contains: [PV Max, M1, H1, H2]}}

