notes:
- The plant is the whole system as its EMS sees it (grid sensor, total PV, storage, loads). It answers on unit id 247 only;
  writes to unit id 0 (broadcast) are carried out without a reply. Each inverter, DC charger and AC charger has its own register
  map on its own unit id (separate files).
- Storage values (SOC, SOH, ESS power and energy, PV power limit) exist only in plants with hybrid inverters (SigenStor, Sigen
  Hybrid, Sigen PV M1-HYB); with PV-only inverters they are not valid.
- grid_power (30005) and the grid sensor phase powers are positive for import and negative for export, and battery_power (30037)
  positive for charging, as the document states. The sign of the plant's own active power (30015-30019, 30031) is not stated.
- Addresses are the document's register numbers, used unchanged as 0-based protocol addresses (its request examples put 30540
  on the wire as 0x774C and 40001 as 0x9C41). 3xxxx registers are input registers (function 04), 4xxxx and 5xxxx holding registers
  (function 03).
- 'The document is inconsistent about holding registers: its type table says read/write registers support functions 04, 06
  and 0x10, and one example reads a 4xxxx register with function 04, another a 3xxxx register with function 03. Not tested;
  the tables here follow the section titles.'
- Byte and word order are not stated; big-endian (most significant register first) is assumed.
- Power registers have gain 1000 in kW (kVar, kVA) in the document, i.e. the raw value is W (var, VA); energy registers gain
  100 in kWh.
- 'At most 124 registers per read request and a minimum request period of 1000 ms, as the document states. RS485: 9600 baud
  default, 8N1. Modbus TCP server on port 502 (alternatively the device can connect out as a TCP client to a configured port).
  One inverter of the plant gives access to all devices of the plant by their unit ids; AC chargers (EVAC) are only reachable
  through an inverter, not on their own.'
- Alarm kinds follow the severity levels V2.8 and older of the document give (critical = fault, general = warning); V2.9 dropped
  that table. Grid power outage is reported as mains lost.
- 'Left out: available min/max active and reactive power (30039-30046), plant and grid sensor reactive power per phase (30021-30026,
  30058-30063), the 24 smart-load counters and powers (30098-30193), the duplicate counters of the newer statistics set (30240-30271),
  the current control command value (30279, Japan), the per-phase and reactive power dispatch targets (40003, 40006-40025,
  40030), the active power gradient and grid-code settings (40049-40068), the PCC power factor targets (40157, 40158) and
  the ESS preheating schedule (50000-50183).'
- Up to V1.7 the document had an active power upper limit at 40026 (S32) and 40028 (S16 %); they are reserved since V1.8.
- 'evcc template `sigenergy` (grid, pv, battery) lists: Sigenergy Sigen Hybrid; Sigenergy Sigen PV Max; Sigenergy SigenStore
  EC.'
- The template has the option `gateway` (default false); points used only with another value say so in their note.
- 'The plant (the whole system as the EMS sees it: grid sensor, total PV, battery, loads) answers on unit id 247. Each inverter,
  AC charger and DC charger has its own register map (separate device files).'
- Smart-load and generator counters, and a second set of lifetime energy counters (30240-30271), are listed as the project
  lists them; which firmware fills which set is not stated.
- Points limited to the `hybrid_inverter` model are those the project marks as applying only to plants with hybrid inverters
  (battery control); the project does not detect this from a register.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
