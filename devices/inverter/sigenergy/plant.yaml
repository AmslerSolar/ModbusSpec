connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 124
    min_interval_ms: 1000

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: input
    address: 30051
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 7
  - table: input
    address: 30003
    type: u16
    in:
    - 0
    - 1
    - 2
    - 5
    - 7
    - 9
  - table: input
    address: 30009
    type: u16
    in:
    - 0
    - 1
    - 2
  # rated frequency (0.01 Hz); a device answering 0 or FFFFh everywhere is not this one
  - table: input
    address: 30276
    type: u16
    range:
    - 4500
    - 6500

models:
  - {id: hybrid_inverter, name: Hybrid inverter (with battery)}

