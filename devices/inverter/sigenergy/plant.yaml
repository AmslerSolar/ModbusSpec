enums:
  ems_work_mode: {'0': Max self consumption, '1': AI mode, '2': TOU, '5': Full feed-in to grid, '7': Remote EMS mode, '9': Custom}
  grid_sensor_status: {'0': Not connected, '1': Connected}
  on_off_grid: {'0': On grid, '1': Off grid (automatic), '2': Off grid (manual)}
  running_state: {'0': Standby, '1': Running, '2': Fault, '3': Shutdown, '7': Environmental abnormality}
  start_stop: {'0': Stop, '1': Start}
  off_on: {'0': Disabled, '1': Enabled}
  remote_ems_mode: {'0': PCS remote control, '1': Standby, '2': Maximum self-consumption, '3': Command charging (grid first), '4': Command charging (PV first), '5': Command discharging (PV first), '6': Command discharging (ESS first), '7': Reserved, '8': V2G (vehicle to grid)}
  plant_independent_phase_power_control_enable: {'0': disabled, '1': enabled}
  plant_lvrt_enable: {'0': Disable, '1': Enable}
  plant_lvrt_grid_voltage_protection_blocking: {'0': Not block, '1': Block}
  plant_hvrt_enable: {'0': Disable, '1': Enable}
  plant_hvrt_grid_voltage_protection_blocking: {'0': Not block, '1': Block}
  plant_over_freq_derating_enable: {'0': Disable, '1': Enable}
  plant_under_freq_power_boost_enable: {'0': Disable, '1': Enable}
  plant_ess_preheating_enable: {'0': disable, '1': enable}
  plant_ess_preheating_mode: {'0': automatic, '1': manual}
  plant_ess_preheating_advance_enable: {'0': disable, '1': enable}

flags:
  pcs_alarm1: {'0': Software version mismatch, '1': Low insulation resistance, '2': Over-temperature, '3': Equipment fault, '4': System grounding fault, '5': PV string over-voltage, '6': PV string reversely connected, '7': PV string back-filling, '8': AFCI fault, '9': Grid power outage, '10': Grid over-voltage, '11': Grid under-voltage, '12': Grid over-frequency, '13': Grid under-frequency, '14': Grid voltage imbalance, '15': DC component of output current out of limit}
  pcs_alarm2: {'0': Leak current out of limit, '1': Communication abnormal, '2': System internal protection, '3': AFCI self-checking circuit fault, '4': Off-grid protection, '5': Manual operation protection, '7': Abnormal phase sequence, '8': Short circuit to PE, '9': Soft start failure}
  ess_alarm: {'0': Software version mismatch, '1': Low insulation resistance of the storage module to ground, '2': Temperature too high, '3': Equipment fault, '4': Under-temperature, '5': Internal protection, '6': Thermal runaway}
  gateway_alarm: {'0': Software version mismatch, '1': Temperature too high, '2': Equipment fault, '3': Excessive leakage current in off-grid output, '4': N line grounding fault, '5': Abnormal phase sequence of grid wiring, '6': Abnormal phase sequence of inverter wiring, '7': Grid phase loss}
  dc_charger_alarm: {'0': Software version mismatch, '1': Low insulation resistance to ground, '2': Over-temperature, '3': Equipment fault, '4': Charging fault, '5': Equipment protection}
  plant_alarm1: {'0': Gateway communication abnormal, '1': Meter communication abnormal, '2': AC power sensor communication abnormal, '6': Hard protection against grid-feed power limit exceedance, '8': Generator failure to start, '10': CLS fault}
  plant_alarm2: {'0': OVGR fault, '1': RPR fault}

