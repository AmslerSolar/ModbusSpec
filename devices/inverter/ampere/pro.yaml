modbusspec: 0
id: ampere-pro
manufacturer: Ampere
name: Ampere Pro storage
kind: inverter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/ampere/ampere

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: x.inverter_pv1_power, label: Inverter power (part), table: holding, address: 519, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling).}
  - {key: x.inverter_pv2_power, label: Inverter power (part), table: holding, address: 522, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling).}
  - {key: battery_power, label: Battery power, table: input, address: 535, type: s16, unit: W, positive: discharge}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 1339, type: u16, unit: '%'}
  - {key: grid_power, label: Counter power, table: input, address: 1348, type: s16, unit: W, positive: import}
  - {key: x.counter_powers_l1, label: Counter power L1, table: input, address: 1349, type: s16, unit: W, note: Raw > 0 = import (openWB's sign handling).}
  - {key: x.counter_powers_l2, label: Counter power L2, table: input, address: 1350, type: s16, unit: W, note: Raw > 0 = import (openWB's sign handling).}
  - {key: x.counter_powers_l3, label: Counter power L3, table: input, address: 1351, type: s16, unit: W, note: Raw > 0 = import (openWB's sign handling).}

derived:
  - {key: pv_power, label: Inverter power, unit: W, sum: [{key: x.inverter_pv1_power}, {key: x.inverter_pv2_power}]}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
