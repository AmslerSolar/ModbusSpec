modbusspec: 0
id: swatten-inverter
manufacturer: Swatten
name: Swatten SiH hybrid inverters
kind: inverter

sources:
- title: Swatten inverter Modbus table
  version: undated
  url: https://github.com/user-attachments/files/17558047/Swatten.inverter.Modbus.table.xlsx
  sha256: 1aba93a4074548db37ce3e862214b271bfc97a8d45d5658574e9ccb82eb9b0d8
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_swatten.py

connection:
  default_port: 502
  default_unit: 1
  transports:
