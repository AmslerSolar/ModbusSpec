  - {key: x.grid_import_today, label: Daily Energy Purchased, table: input, address: 10036, type: u16, unit: kWh, scale: 0.1}
  - {key: grid_import_energy, label: Cumulative Energy Purchased, table: input, address: 10037, type: u32, unit: kWh, scale: 0.1}
  - {key: x.battery_charge_today, label: Daily Charging Energy, table: input, address: 10040, type: u16, unit: kWh, scale: 0.1}
  - {key: x.battery_charge_total, label: Total Charging Energy, table: input, address: 10041, type: u32, unit: kWh, scale: 0.1}
  - {key: x.grid_export_today, label: Daily Grid Feed-in, table: input, address: 10045, type: u16, unit: kWh, scale: 0.1}
