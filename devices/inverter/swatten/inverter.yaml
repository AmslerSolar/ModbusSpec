    table: input
    address: 5809
    type: str
    length: 8
  any:
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH3KSH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH4KSH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH5KSH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH6KSH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH5KTH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH6KTH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH8KTH
  - table: input
    address: 5809
    type: str
    length: 8
    prefix: SiH10KTH

