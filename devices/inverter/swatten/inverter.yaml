  - {key: x.feeder_limit_mode, label: Feeder power limit enable, table: holding, address: 21221, type: u16, enum: feeder_limit_mode, writable: true, poll: slow}
  - {key: x.feeder_limit, label: Feeder limit value percentage, table: holding, address: 21223, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.energy_management_mode, label: Energy Management Mode, table: holding, address: 23146, type: u16, enum: energy_management_mode, writable: true, poll: slow}
  - {key: x.battery_command, label: Battery Charge and Discharge Commands, table: holding, address: 23147, type: u16, enum: battery_command, writable: true, poll: slow, note: Used in forced charge / discharge mode.}
  - {key: x.battery_command_power, label: Battery Charge and Discharge Power, table: holding, address: 23148, type: u16, unit: W, scale: 10, writable: true, poll: slow, note: The table's unit is 0.01 kW.}
  - {key: x.max_soc, label: Maximum SOC, table: holding, address: 23031, type: u16, unit: '%', scale: 0.1, writable: true, min: 50, max: 100, poll: slow}
  - {key: x.min_soc, label: Minimum SOC, table: holding, address: 23032, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 50, poll: slow}
  - {key: x.forced_charge_enable, label: Energy Management Forced Charge Enable, table: holding, address: 23208, type: u16, enum: enable_aa_55, writable: true, poll: slow}
  - {key: x.country, label: Country Selection, table: holding, address: 22310, type: u16, writable: true, poll: slow}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 20460, type: u16, writable: true, min: 1, max: 246, poll: slow, note: Default 1.}
  - {key: x.power_factor, label: Power Factor, table: holding, address: 4085, type: s16, sources: [solax-modbus]}
  - {key: x.rtc, label: RTC, table: input, address: 4050, type: datetime, length: 6, datetime: {year: {register: 0, offset: 2000}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, sources: [solax-modbus]}
  - {key: x.model_type, label: Model Type, table: input, address: 5809, type: str, length: 8, sources: [solax-modbus]}

enums:
  state: {'0': 'Grid-connected, normal operation', '2048': Forced grid-connected operation, '4096': Off-grid operation, '4608': Initial standby, '5120': Idle, '5632': Starting (self-test), '16385': Emergency charging}
  on_off: {'206': 'Off', '207': 'On'}
  battery_selection: {'0': No battery, '1': Lithium battery, '2': Battery simulator}
  enable_aa_55: {'85': Disabled, '170': Enabled}
  mppt_mode: {'0': No PV, '85': Independent, '170': Parallel}
  feeder_limit_mode: {'85': 'Off', '161': Soft limit, '162': Hard limit, '163': Generation limit}
  energy_management_mode: {'0': Self-use, '2': Forced charge / discharge}
  battery_command: {'170': Charge, '187': Discharge, '204': No action}

problems:
  - {when: {key: state, equals: 4096}, kind: backup_mode, text: Inverter runs off-grid}
  - {when: {key: state, equals: 16385}, kind: warning, text: Emergency charging}

notes:
- The table doesn't name function codes. Read-only monitoring registers are taken as input registers (function 04) and read
  / write settings as holding registers (function 03); not stated in the table, assumed.
- Addresses are the table's decimal addresses, used as 0-based protocol addresses.
- 32-bit values (marked "32 bits") take two registers; the word order isn't stated, big-endian (high word first) is assumed.
- The table gives no serial number, model or alarm registers, nor the transport, unit id or serial settings; port 502 and
  unit 1 are assumed.
- Enable switches use 0xAA (170) = on and 0x55 (85) = off. Settings marked [x] in the table have default x.
- 'Left out: grid protection and ramp settings, reactive power control, the weekday / non-working-day discharge windows (23151…23187)
  and forced charge windows (23210…23219), restart and restore commands (20031, 20050), DRM and DO settings, energy compensation
  counters (20118…20121). Battery temperature (10025) and power factor (4085) are left out because their scaling isn''t given.'
- Models gen_x3_hybrid come from projects and are listed after a model without a match, so detection never reaches them; their
  points apply only when a reader selects such a model by hand.
- Identification as solax-modbus recognises the device (not checked against a document).
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- The plugin's 32-bit word order setting is little, but most of its 32-bit readings use big (set per description, which wins
  when reading); writes of 32-bit values use little.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
