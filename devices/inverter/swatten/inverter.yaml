  - {key: x.on_off, label: Switch On/Off Settings, table: holding, address: 20030, type: u16, enum: on_off, writable: true, poll: slow}
  - {key: x.battery_selection, label: Battery selection, table: holding, address: 26101, type: u16, enum: battery_selection, writable: true, poll: slow}
