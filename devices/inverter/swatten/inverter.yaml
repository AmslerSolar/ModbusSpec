  - {key: temperature, label: Internal Temperature, table: input, address: 4058, type: s16, unit: °C, scale: 0.1}
  - {key: apparent_power, label: Total AC Apparent Power, table: input, address: 4059, type: u32, unit: VA, note: 32 bits over 4059/4060; the table gives the unit as W.}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 4061, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 4062, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 4063, type: u16, unit: V, scale: 0.1, note: Scale not given for PV2; assumed as PV1.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 4064, type: u16, unit: A, scale: 0.1, note: Scale not given for PV2; assumed as PV1.}
  - {key: pv_power, label: PV total power, table: input, address: 4067, type: u32, unit: W}
  - {key: l1_voltage, label: L1 Voltage, table: input, address: 4069, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: L2 Voltage, table: input, address: 4070, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: l3_voltage, label: L3 Voltage, table: input, address: 4071, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: l1_current, label: L1 Current, table: input, address: 4072, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: L2 Current, table: input, address: 4073, type: u16, unit: A, scale: 0.1, optional: true}
  - {key: l3_current, label: L3 Current, table: input, address: 4074, type: u16, unit: A, scale: 0.1, optional: true}
  - {key: x.ac_output_power, label: Total AC Output Power, table: input, address: 4081, type: s32, unit: W, note: '32 bits; signedness not stated, assumed signed.', conflicts: [{sources: [solax-modbus], type: u32, label: Total Output Power}]}
  - {key: reactive_power, label: Reactive Power, table: input, address: 4083, type: s32, unit: var, note: '32 bits; the table gives the unit as W. Signedness not stated, assumed signed.', conflicts: [{sources: [solax-modbus], type: u32}]}
  - {key: x.insulation_resistance, label: Insulation resistance, table: input, address: 4121, type: u16, unit: kΩ, poll: slow, note: Scale not given.}
  - {key: x.bus_voltage, label: Busbar Voltage 1, table: input, address: 4197, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: Grid Frequency, table: input, address: 4198, type: u16, unit: Hz, scale: 0.01}
  - {key: x.feeder_power, label: Real-time feeder power, table: input, address: 5401, type: s16, unit: W, note: 'Power at the grid connection point (meter). Type and sign not stated; assumed signed, direction unknown.'}
  - {key: state, label: Inverter status, table: input, address: 10000, type: u16, enum: state}
  - {key: pv_energy_today, label: Daily PV Power Generation, table: input, address: 10002, type: u16, unit: kWh, scale: 0.1}
  - {key: pv_energy, label: Total PV Production, table: input, address: 10003, type: u32, unit: kWh, scale: 0.1}
