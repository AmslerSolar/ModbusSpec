  - {key: battery_voltage, label: Battery Voltage, table: input, address: 10020, type: u16, unit: V, scale: 0.1, conflicts: [{sources: [solax-modbus], scale: 0}]}
  - {key: x.battery_current, label: Battery Current, table: input, address: 10021, type: s16, unit: A, scale: 0.1, note: Signedness and direction not stated; assumed signed like the battery power., conflicts: [{sources: [solax-modbus], type: u16}]}
  - {key: x.battery_power, label: Battery Power, table: input, address: 10022, type: s16, unit: W, note: Signed; the table doesn't say which direction is positive.}
  - {key: battery_soc, label: SoC, table: input, address: 10023, type: u16, unit: '%'}
  - {key: battery_soh, label: SoH, table: input, address: 10024, type: u16, unit: '%', poll: slow}
  - {key: x.battery_discharge_today, label: Daily Discharging Energy, table: input, address: 10026, type: u16, unit: kWh, scale: 0.1}
