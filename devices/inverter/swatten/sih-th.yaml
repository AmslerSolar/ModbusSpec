modbusspec: 0
id: swatten-sih-th
manufacturer: Swatten
name: SIH-TH
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/swatten_sih-th.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: x.on_off, label: On/Off, table: holding, address: 20030, type: u16, enum: on_off, writable: true}
  - {key: x.battery_type, label: Battery Type, table: holding, address: 26101, type: s16}
  - {key: x.running, label: Running, table: input, address: 4056, type: u16}
  - {key: temperature, label: Temperature, table: input, address: 4058, type: s16, unit: °C, scale: 0.1}
  - {key: x.internal_apparent_power, label: Internal Apparent Power, table: input, address: 4059, type: s32, unit: VA}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 4061, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 4062, type: s16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 4063, type: s16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 4064, type: s16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: pv_power, label: PV Power, table: input, address: 4067, type: u32, unit: W}
  - {key: l1_voltage, label: Grid L1 Voltage, table: input, address: 4069, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 Voltage, table: input, address: 4070, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: l3_voltage, label: Grid L3 Voltage, table: input, address: 4071, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 3 phases.}
  - {key: l1_current, label: Grid L1 Current, table: input, address: 4072, type: u16, unit: A, scale: 0.01}
  - {key: l2_current, label: Grid L2 Current, table: input, address: 4073, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 2 phases.}
  - {key: l3_current, label: Grid L3 Current, table: input, address: 4074, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 3 phases.}
  - {key: x.internal_power, label: Internal Power, table: input, address: 4081, type: s32, unit: W}
  - {key: x.internal_reactive_power, label: Internal Reactive Power, table: input, address: 4083, type: s32, unit: var}
  - {key: x.internal_power_factor, label: Internal Power Factor, table: input, address: 4085, type: s16, unit: '%', scale: 0.001}
  - {key: frequency, label: Grid Frequency, table: input, address: 4198, type: s16, unit: Hz, scale: 0.01}
  - {key: x.device_alarm, label: Device Alarm, table: input, address: 5253, type: u16, enum: device_alarm}
  - {key: x.real_time_feeder_power, label: Real-time feeder power, table: input, address: 5401, type: s16, unit: W}
  - {key: x.device_state, label: Device State, table: input, address: 10000, type: u16, enum: device_state}
  - {key: pv_energy_today, label: Today Production, table: input, address: 10002, type: u16, unit: kWh, scale: 0.1}
  - {key: pv_energy, label: Total Production, table: input, address: 10003, type: u32, unit: kWh, scale: 0.1}
  - {key: load_power, label: Load Power, table: input, address: 10008, type: s16, unit: W}
  - {key: battery_voltage, label: Battery Voltage, table: input, address: 10020, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_current, label: Battery Current, table: input, address: 10021, type: s16, unit: A, scale: 0.1}
  - {key: x.battery_power, label: Battery Power, table: input, address: 10022, type: s16, unit: W}
  - {key: battery_soc, label: Battery, table: input, address: 10023, type: s16, unit: '%'}
  - {key: battery_soh, label: Battery SOH, table: input, address: 10024, type: s16, unit: '%'}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 10025, type: s16, unit: °C, scale: 0.1}
  - {key: x.today_battery_discharge, label: Today Battery Discharge, table: input, address: 10026, type: u16, unit: kWh, scale: 0.1}
  - {key: x.total_battery_discharge, label: Total Battery Discharge, table: input, address: 10027, type: u32, unit: kWh, scale: 0.1}
  - {key: x.today_energy_import, label: Today Energy Import, table: input, address: 10036, type: u16, unit: kWh, scale: 0.1}
  - {key: grid_import_energy, label: Total Energy Import, table: input, address: 10037, type: u32, unit: kWh, scale: 0.1}
  - {key: x.today_battery_charge, label: Today Battery Charge, table: input, address: 10040, type: u16, unit: kWh, scale: 0.1}
  - {key: x.total_battery_charge, label: Total Battery Charge, table: input, address: 10041, type: u32, unit: kWh, scale: 0.1}
  - {key: x.today_energy_export, label: Today Energy Export, table: input, address: 10045, type: u16, unit: kWh, scale: 0.1}
  - {key: grid_export_energy, label: Total Energy Export, table: input, address: 10046, type: u32, unit: kWh, scale: 0.1}

enums:
  device_state: {'0': Grid-connected normal operation, '2048': Forced grid-connected operation, '4096': Off-grid operation, '4608': Initial standby, '5120': Standby, '5632': Starting (Self-test), '16385': Emergency charging operation}
  device_alarm: {'0': No Alert}
  on_off: {'0': 'Off', '1': 'On'}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
