modbusspec: 0
id: ecoflow-ocean2
manufacturer: EcoFlow
name: Ocean 2 three-phase / Ocean 2 Plus single-phase
kind: inverter

sources:
- id: ef-powerocean-tcpmodbus
  title: EF-PowerOcean-TcpModbus (Home Assistant integration)
  url: https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus
  license: MIT
  commit: c2c2989de642cc62d7c3528ed1596e95b51ac4a9
  path: custom_components/ef_powerocean_tcpmodbus/const.py, custom_components/ef_powerocean_tcpmodbus/models.py, custom_components/ef_powerocean_tcpmodbus/telemetry.py,
    custom_components/ef_powerocean_tcpmodbus/translations/en.json

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125
  input_equals_holding: true

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - ef-powerocean-tcpmodbus

models:
  - {id: ocean_2, name: Ocean 2 Three Phase, match: {table: holding, address: 40003, type: u16, equals: 4}}
  - {id: ocean_2_plus_single_phase, name: Ocean 2 Plus Single Phase, match: {table: holding, address: 40003, type: u16, equals: 5}}

points:
