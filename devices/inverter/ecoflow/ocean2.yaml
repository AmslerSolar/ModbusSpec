enums:
  product_category: {'1': three-phase, '2': single-phase}
  grid_feed_mode: {'0': Limited, '1': Unlimited, '2': Limited (percent)}
  control_method: {'0': Default, '1': System feed/draw (meter), '2': Inverter feed/draw, '3': Battery charge/discharge}
  operating_mode: {'0': Standby, '1': Self-consumption, '2': AI}
  fault_code: {'100': Power outage, '101': Grid undervoltage, '102': Grid overvoltage, '105': Grid under-frequency, '128': Bus fast overvoltage, '139': Voltage flicker alarm, '140': Sudden grid voltage phase change alarm, '156': Grid reconnection waiting, '163': 12V auxiliary power fault, '179': Inverter module power-on notification, '203': BP module power-on notification, '521': Energy storage communication error, '532': 12V auxiliary power voltage fault, '700': Device off-grid event, '702': Low power mode, '703': EMS module power-on notification}

flags:
  system_modes: {'0': Off-grid (islanded), '1': System fault, '2': Running (0 = standby), '3': Battery saver / low-power mode, '11': Following Modbus control, '12': BMS connected}
  system_state_2: {'0': System shutdown, '1': Upgrade shutdown, '2': Epo triggered, '3': Low power mode, '4': Fan failure, '5': System failure, '6': Battery reverse connection, '7': Battery disconnected, '8': Auxiliary power failure, '9': Pcs timeout, '10': Pcs failure, '11': Igbt self test failure, '12': High temperature protection, '13': Battery overheating, '14': Ntc circuit failure, '15': System reset, '16': Hardware version error, '17': Parallel sync error, '18': Low temperature protection, '19': Parallel master slave conflict, '20': Parallel slave setting error, '21': Parallel inverter error, '22': Parallel meter fault}

notes:
- Modbus answers only after the inverter's control mode is set to Modbus control in the EcoFlow Pro app. Registers exist only
  from 40001 to 44096; the device answers on any unit id.
- Addresses are EcoFlow's register numbers plus 40001, used as the protocol address.
- 32-bit values are read high word first on these models.
- 32-bit writes (function 16) must be sent high word first on every model measured; a write in read order is taken as a value
  65536 times too large.
- Models are told apart by product number (40003).
- 'Energy counters are in Wh. These models read gaps as an error: a request must not cover unimplemented registers.'
- Control (setpoints, control command 40534) is only followed while the heartbeat register 40608 is written (value 1) at least
  every 60 s; the project writes it every 20 s.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
