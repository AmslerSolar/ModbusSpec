modbusspec: 0
id: sermatec-smt
manufacturer: Sermatec
name: SMT-5K-TL-LV Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/sermatec-hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.battery_power_1, label: Battery power (part 1), table: holding, address: 12288, type: u16, scale: 0.1, note: evcc multiplies it with the other factors of the battery power.}
  - {key: x.battery_power_2, label: Battery power (part 2), table: holding, address: 12289, type: s16, scale: 0.1, note: evcc multiplies it with the other factors of the battery power.}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 12291, type: u16, unit: '%'}
  - {key: x.pv_power_1, label: PV power (part 1), table: holding, address: 16386, type: s16, unit: W}
  - {key: x.pv_power_2, label: PV power (part 2), table: holding, address: 16389, type: s16, unit: W}
  - {key: grid_power, label: Grid power, table: holding, address: 16407, type: s16, unit: W, positive: export}

derived:
  - {key: pv_power, label: PV power, unit: W, sum: [{key: x.pv_power_1}, {key: x.pv_power_2}]}

notes:
- 'evcc template `sermatec-hybrid` (grid, pv, battery) lists: Sermatec SMT-5K-TL-LV Hybrid Inverter; Sermatec SMT-10K-TL-LV
  Hybrid Inverter.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
