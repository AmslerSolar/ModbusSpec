modbusspec: 0
id: enertech-inverter
manufacturer: Enertech
name: Enertech inverters
kind: inverter

sources:
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_Enertech.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  any:
  - table: holding
    address: 20
    type: str
    length: 4
    prefix: GEN

defaults:
  verified: false
  sources:
  - solax-modbus

models:
  - {id: gen_hybrid, name: GEN | HYBRID (prefix GEN*), match: {table: holding, address: 20, type: str, length: 4, prefix: GEN}}

