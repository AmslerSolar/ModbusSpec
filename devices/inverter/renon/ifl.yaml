modbusspec: 0
id: renon-ifl
manufacturer: Renon
name: IFL
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/renon_ifl.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: serial, label: Device Serial Number, table: holding, address: 4660, type: str, length: 6}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: holding, address: 5776, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 5777, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: holding, address: 5778, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 5779, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.grid_power_factor, label: Grid power factor, table: holding, address: 5793, type: u16, unit: '%'}
  - {key: temperature, label: Temperature, table: holding, address: 5798, type: s16, unit: °C, scale: 0.1}
  - {key: x.environment_temperature, label: Environment Temperature, table: holding, address: 5799, type: s16, unit: °C, scale: 0.1}
  - {key: x.pv1_power, label: PV1 Power, table: holding, address: 8831, type: u16, unit: W}
  - {key: x.pv2_power, label: PV2 Power, table: holding, address: 8833, type: u16, unit: W, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: l1_voltage, label: Grid L1 Voltage, table: holding, address: 12560, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid L1 Current, table: holding, address: 12561, type: u16, unit: A, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 Voltage, table: holding, address: 12563, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: l2_current, label: Grid L2 Current, table: holding, address: 12564, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: l3_voltage, label: Grid L3 Voltage, table: holding, address: 12566, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 3 phases.}
  - {key: l3_current, label: Grid L3 Current, table: holding, address: 12567, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 3 phases.}
  - {key: frequency, label: Grid Frequency, table: holding, address: 12569, type: u16, unit: Hz, scale: 0.01}
  - {key: x.load_l1_voltage, label: Load L1 Voltage, table: holding, address: 12576, type: u16, unit: V, scale: 0.1}
  - {key: x.load_l2_current, label: Load L2 Current, table: holding, address: 12577, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: x.load_l1_voltage_2, label: Load L1 Voltage, table: holding, address: 12580, type: u16, unit: V, scale: 0.1}
  - {key: x.load_l2_current_2, label: Load L2 Current, table: holding, address: 12581, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 phases.}
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 12608, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_current, label: Battery Current, table: holding, address: 12609, type: s16, unit: A, scale: 0.01}
  - {key: battery_soc, label: Battery, table: holding, address: 12613, type: u16, unit: '%', scale: 0.1}
  - {key: battery_temperature, label: Battery Temperature, table: holding, address: 12614, type: s16, unit: °C, scale: 0.1}
  - {key: x.battery_power, label: Battery Power, table: holding, address: 12618, type: s16, unit: W}
  - {key: pv_energy_today, label: Today Production, table: holding, address: 12627, type: u32, unit: kWh, scale: 0.001}
  - {key: x.today_energy_export, label: Today Energy Export, table: holding, address: 12629, type: u32, unit: kWh, scale: 0.001}
  - {key: x.today_load_consumption, label: Today Load Consumption, table: holding, address: 12631, type: s32, unit: kWh, scale: 0.001}
  - {key: pv_energy, label: Total Production, table: holding, address: 12645, type: u32, unit: kWh, scale: 0.001}
  - {key: grid_export_energy, label: Total Energy Export, table: holding, address: 12647, type: u32, unit: kWh, scale: 0.001}
  - {key: x.total_load_consumption_low, label: Total Load Consumption (low word), table: holding, address: 12649, type: u16, unit: kWh, scale: 0.001}
  - {key: x.today_energy_import, label: Today Energy Import, table: holding, address: 12651, type: u32, unit: kWh, scale: 0.001}
  - {key: x.today_battery_charge, label: Today Battery Charge, table: holding, address: 12653, type: u32, unit: kWh, scale: 0.001}
  - {key: x.today_battery_discharge, label: Today Battery Discharge, table: holding, address: 12655, type: u32, unit: kWh, scale: 0.001}
  - {key: grid_import_energy, label: Total Energy Import, table: holding, address: 12669, type: u32, unit: kWh, scale: 0.001}
  - {key: x.total_battery_charge, label: Total Battery Charge, table: holding, address: 12671, type: u32, unit: kWh, scale: 0.001}
  - {key: x.total_battery_discharge, label: Total Battery Discharge, table: holding, address: 12673, type: u32, unit: kWh, scale: 0.001}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- 'Left out: total_load_consumption_high (holding 12656, u16) from solarman overlaps today_battery_discharge (holding 12655,
  u32); check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
