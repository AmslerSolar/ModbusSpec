# Written from the Hybrid Modbus Protocol (V4.25), a hybrid inverter Modbus protocol attached to a GitHub discussion.

modbusspec: 0
id: chint-cps-scetl
manufacturer: CHINT
name: CPS-SCETL hybrid inverters
kind: inverter

sources:
- title: Modbus Protocol (hybrid inverters, "Hybrid Modbus Protocol per inverter ibridi")
  version: V4.25 (2024-10-07)
  url: https://github.com/user-attachments/files/17295986/Hybrid.Modbus.Protocol.per.inverter.ibridi.pdf
  sha256: 7d43b45551f31af69d34be43f022c8a1ce3db360d12207975610b94cd2015e1c
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/chint_cps-scetl.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 124

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 6672
    type: str
    length: 8
  checks:
  # rated frequency
  - table: holding
    address: 6725
    type: u16
    in:
    - 5000
    - 6000
  # grid phase number
  - table: holding
    address: 6728
    type: u16
    in:
    - 1
    - 3

points:
  # Device information (0x1A00 ff.)
  - {key: x.device, label: Device model, table: holding, address: 6656, type: str, length: 8, poll: slow, note: 'ASCII, e.g. "PV 30KTL".', conflicts: [{sources: [solarman], length: 16, label: Device}]}
  - {key: serial, label: Device serial number, table: holding, address: 6672, type: str, length: 8, poll: slow, note: 'ASCII, e.g. "1234-123456789".'}
  - {key: x.device_protocol_version, label: Modbus protocol version, table: holding, address: 6680, type: u16, poll: slow, note: 'Hex digits: 0x1234 = V12.34.'}
  - {key: firmware, label: Master software version, table: holding, address: 6684, type: str, length: 3, poll: slow, conflicts: [{sources: [solarman], type: u16, label: Device Protocol Version}]}
  - {key: x.master_software_build_date, label: Master software build date, table: holding, address: 6691, type: str, length: 3, poll: slow}
  - {key: x.slave_firmware_version, label: Slave firmware version, table: holding, address: 6694, type: str, length: 3, poll: slow}
  - {key: x.slave_firmware_build_date, label: Slave firmware build date, table: holding, address: 6701, type: str, length: 3, poll: slow}
  - {key: x.device_mppts, label: MPPT number, table: holding, address: 6715, type: u16, poll: slow}
  - {key: x.device_rated_voltage, label: Rated voltage, table: holding, address: 6724, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.device_rated_frequency, label: Rated frequency, table: holding, address: 6725, type: u16, unit: Hz, scale: 0.01, poll: slow}
  - {key: x.device_rated_power, label: Rated power, table: holding, address: 6726, type: u16, unit: W, poll: slow}
  - {key: x.device_phases, label: Grid phase number, table: holding, address: 6728, type: u16, poll: slow, note: '1 = single phase, 3 = three phase.'}
  - {key: x.production_type, label: Production type, table: holding, address: 6746, type: u16, enum: production_type, poll: slow}
  - {key: x.ems_firmware_version, label: EMS firmware version, table: holding, address: 6752, type: str, length: 3, poll: slow}
  - {key: x.ems_firmware_build_date, label: EMS firmware build date, table: holding, address: 6759, type: str, length: 7, poll: slow, note: ASCII YYYYMMDDhhmmss.}
  - {key: x.dcdc_firmware_version, label: DCDC firmware version, table: holding, address: 6767, type: str, length: 3, poll: slow}
  - {key: x.dcdc_firmware_build_date, label: DCDC firmware build date, table: holding, address: 6774, type: str, length: 3, poll: slow}
  # Real-time data: inverter output (0x1001 ff.)
  - {key: x.output_l1_voltage, label: Phase A voltage, table: holding, address: 4097, type: u16, unit: V, scale: 0.1}
  - {key: x.output_l1_current, label: Phase A current, table: holding, address: 4098, type: u16, unit: A, scale: 0.01}
  - {key: x.output_l1_power, label: Phase A power, table: holding, address: 4099, type: s32, unit: W, scale: 0.1, verified: false, note: Sign not stated in the document.}
  - {key: x.output_l1_frequency, label: Phase A frequency, table: holding, address: 4101, type: u16, unit: Hz, scale: 0.01}
  - {key: x.output_l2_voltage, label: Phase B voltage, table: holding, address: 4102, type: u16, unit: V, scale: 0.1}
  - {key: x.output_l2_current, label: Phase B current, table: holding, address: 4103, type: u16, unit: A, scale: 0.01}
  - {key: x.output_l2_power, label: Phase B power, table: holding, address: 4104, type: s32, unit: W, scale: 0.1, verified: false}
  - {key: x.output_l2_frequency, label: Phase B frequency, table: holding, address: 4106, type: u16, unit: Hz, scale: 0.01}
  - {key: x.output_l3_voltage, label: Phase C voltage, table: holding, address: 4107, type: u16, unit: V, scale: 0.1}
  - {key: x.output_l3_current, label: Phase C current, table: holding, address: 4108, type: u16, unit: A, scale: 0.01}
  - {key: x.output_l3_power, label: Phase C power, table: holding, address: 4109, type: s32, unit: W, scale: 0.1, verified: false}
