notes:
- The document names no manufacturer. It was attached to a GitHub discussion; its register map is the one of the CHINT CPS-SCETL
  file built from projects, so it is filed here.
- Addresses are the document's hex register addresses, used as 0-based protocol addresses. All registers are read with function
  03 (also the device information and real-time data); 06 and 10 write. Up to 124 registers per read, 122 per write.
- Modbus RTU on RS-485, 9600 baud 8N1, default address 1 (1–247). Port 502 applies only to a Modbus TCP gateway.
- 'Not stated in the document; assumed: 32-bit values are high word first.'
- The document doesn't state the sign of the per-phase, active, grid and load powers or of the battery current; they are kept
  as x. points. The meter's power direction is a setting (0x30B2).
- Parameters marked 'Notice 1' (0x510F–0x5115) apply to three-phase models only (0x1A48 = 3).
- 'Left out: lithium BMS address and lead-acid voltages (0x2111, 0x2113, 0x2114), off-grid output voltage / frequency (0x211D,
  0x211E), Modbus address and baud rate (0x303E, 0x304C), export de-rating words (0x3085, 0x3086), meter address and CT ratio
  (0x30B0, 0x30B4), and the grid-protection and reactive-power parameters 0x5000–0x5061 and 0x510E–0x511D.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
