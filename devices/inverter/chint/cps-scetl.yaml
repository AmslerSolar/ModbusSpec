  - {key: x.pv1_current, label: PV1 current, table: holding, address: 4113, type: u16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: MPPT1 power, table: holding, address: 4114, type: u32, unit: W, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 voltage, table: holding, address: 4116, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2 current, table: holding, address: 4117, type: u16, unit: A, scale: 0.01}
  - {key: x.pv2_power, label: MPPT2 power, table: holding, address: 4118, type: u32, unit: W, scale: 0.1}
  - {key: x.pv3_voltage, label: PV3 voltage, table: holding, address: 4120, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: PV3 current, table: holding, address: 4121, type: u16, unit: A, scale: 0.01}
  - {key: x.pv3_power, label: MPPT3 power, table: holding, address: 4122, type: u32, unit: W, scale: 0.1}
  - {key: x.pv4_voltage, label: PV4 voltage, table: holding, address: 4158, type: u16, unit: V, scale: 0.1}
  - {key: x.pv4_current, label: PV4 current, table: holding, address: 4159, type: u16, unit: A, scale: 0.01}
  - {key: x.pv4_power, label: MPPT4 power, table: holding, address: 4160, type: u32, unit: W, scale: 0.1}
  - {key: pv_power, label: PV total input power, table: holding, address: 4168, type: u32, unit: W, scale: 0.1}
  # State, faults, totals
  - {key: temperature, label: Inner temperature, table: holding, address: 4124, type: s16, unit: °C}
  - {key: state, label: Inverter mode, table: holding, address: 4125, type: u16, enum: inverter_mode}
  - {key: x.inverter_fault, label: Error code 1, table: holding, address: 4126, type: u16, flags: inverter_fault, note: Error code table 2 (inverter faults).}
  - {key: x.inverter_fault_2, label: Error code 2, table: holding, address: 4127, type: u16, flags: inverter_fault_2, note: Error code table 1 (input / output notices).}
  - {key: x.inverter_fault_3, label: Error code 3, table: holding, address: 4128, type: u16, flags: inverter_fault_3}
  - {key: x.total_production_1, label: Total energy, table: holding, address: 4129, type: u32, unit: kWh, poll: slow, note: Whole kWh; 0x104C adds the Wh.}
  - {key: x.generator_operating_time, label: Total generation time, table: holding, address: 4131, type: u32, unit: h, poll: slow}
  - {key: pv_energy_today, label: Today energy, table: holding, address: 4135, type: u32, unit: kWh, scale: 0.001, verified: false, note: Inverter yield today (the document's unit is Wh). For a hybrid inverter it isn't stated whether this is PV or AC output energy.}
  - {key: x.power, label: Active power, table: holding, address: 4151, type: s32, unit: W, scale: 0.1, verified: false, note: Sign not stated in the document.}
  - {key: reactive_power, label: Reactive power, table: holding, address: 4153, type: s32, unit: var, scale: 0.1, conflicts: [{sources: [solarman], type: s16, label: Reactive Power (high word)}]}
  - {key: x.today_peak_power, label: Today peak power, table: holding, address: 4155, type: s32, unit: W, scale: 0.1, poll: slow}
