  - {key: x.total_production_2, label: Decimals of total energy, table: holding, address: 4172, type: u16, unit: kWh, scale: 0.001, poll: slow, note: 'The Wh below the whole kWh of 0x1021 (220.836 kWh: 0x1021 = 220, 0x104C = 836).'}
  - {key: x.pv5_voltage, label: PV5 voltage, table: holding, address: 4224, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: x.pv5_current, label: PV5 current, table: holding, address: 4225, type: u16, unit: A, scale: 0.01, optional: true}
  - {key: x.pv5_power, label: MPPT5 power, table: holding, address: 4226, type: u32, unit: W, scale: 0.1, optional: true}
  - {key: x.pv6_voltage, label: PV6 voltage, table: holding, address: 4228, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: x.pv6_current, label: PV6 current, table: holding, address: 4229, type: u16, unit: A, scale: 0.01, optional: true}
