enums:
  device_type: {'16433': '50 kW 480 V, assumed (0x4031)', '16434': '60 kW 480 V, old MCU (0x4032)', '16435': '50 kW 480 V, new MCU, assumed (0x4033)', '16436': '60 kW 480 V, new MCU (0x4034)', '16437': 100/125 kW 1500 V (0x4035), '16438': 25(20) kW 480 V (0x4036), '16441': 250/275 kW 12-boost (0x4039), '16447': 320/350 kW 1500 V (0x403F), '16451': '12 kW PV-storage unit (different map, not covered) (0x4043)', '16456': SCH250-T-US-600 (0x4048), '16461': SCA100K / SCA50K (0x404D)}
  mode: {'0': Power off, '1024': Soft shutdown, '2048': Derating, '4096': Running, '8192': Standby, '16384': Checking, '32768': Fault}

