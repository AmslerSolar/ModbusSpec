notes:
- 'Only the common input register group 0x0000–0x0048 (function 04, base address 0) that all 403X maps share. Not the CHINT
  CPS-SCETL map (chint-cps-scetl, taken from ha-solarman): that one is a different product line with holding registers from
  4097 (0x1001) on - per-phase voltage, current, 32-bit power and frequency - and none of this group''s addresses.'
- 'Integers with fixed scale factors; 32- and 64-bit values high word first (example in the maps: 0x0016 = 0x0156, 0x0017
  = 0x2318 → 22 422 296 kWh).'
- 'Not implemented: 0xFFFF (uint16), 0x8000 (int16), 0xFFFFFFFF (uint32); strings padded with 0x00. One section of the maps
  says not-implemented registers read 0x0000 - read that as meant for strings.'
- The device type in 0x0000 picks the family. 0x4031 and 0x4033 as 50 kW are assumed (the 50/60 kW map lists them without
  saying). Any other 0x4030–0x404F is read with the 50/60 kW layout; the 25 kW 208 V map (V4.01) has that layout but repeats
  the 60 kW codes, so its own code is unknown (unverified).
- 0x4043 is the 12 kW PV-storage unit with its own protocol (live data at 0x0800 ff.); it is not covered here and excluded
  from the identify check.
- 'Family differences: 25 kW 480 V - group ends at 0x0042 (no Pdc, no rated power), 0x002E is the transformer temperature.
  100/125 kW - one PV input (0x0027–0x002A reserved). 320/350 kW - PV currents in 0.01 A. SCH250 and SCA100K/50K - no PV inputs
  in this group (only Pdc), signed phase currents. Efficiency is 1 % per step on the SCH250.'
- String inverters speak Modbus RTU only (RS485, 8N1; 9600 baud and address 1 where a default is stated, the 250 kW map also
  mentions 115200), so a RS485-to-TCP gateway is needed; the unit id is the RS485 address. The 275 kW and 350 kW units also
  speak Modbus TCP on port 502.
- If the inverter rejects 0x0016 up to the family's last register (0x0042 or 0x0048) as one request, read the documented sub-blocks
  (0x0016–0x0024, 0x0025–0x002A, 0x002B–0x002D, 0x002E, 0x002F–0x003B, 0x003C–0x0040, 0x0041, 0x0042, 0x0043–0x0048).
- 'Solar power: Pdc (0x0045), else the sum of U × I of the PV inputs, else Pac. The inverter doesn''t measure the grid connection,
  so there is no grid value; the map has only line-to-line voltages, so there are no per-phase voltages.'
- 'Problems: only the 50/60 kW map''s event table (section 6.0) is decoded; set bits outside it are reported as "<word> bit
  <n>" with the word''s kind. For other families any non-zero word is reported raw. Mode 0x8000 is reported only when no fault
  bit is set. Derating isn''t reported (the maps don''t say whether it''s a limit or a protection).'
- 'Not covered here: 0x0003 RegNum, 0x0014/0x0015 holding register count and offset, 0x0030 fault timestamp, 0x0043/0x0044
  capacitances, 0x0048 safety version, and the holding registers.'
