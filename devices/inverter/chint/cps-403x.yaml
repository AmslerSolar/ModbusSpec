  warn: {'0': External fan alarm (ExtFanErr), '1': Internal fan alarm (IntFanErr), '2': Internal communication failed (CommErr), '3': EEPROM problem (Warn0030), '4': DC side lightning protection abnormal (Warn0040), '5': Temperature sensor abnormal (Warn0050), '6': Fuse error (Warn0060), '7': AC side lightning arrester abnormal (Warn0070), '10': AC side MOV abnormal (Warn0100), '11': PID box failure, '12': PID box communication failed, '13': PV string error (PVStrErr), '15': External communication failed (Warn0150)}
  fault0: {'0': Bus voltage high (Protect0090), '2': Bus voltage difference high (Protect0070), '3': Bus soft start timeout (Protect0060), '4': Inverter soft start timeout (Protect0050), '6': PV1 high current (Protect0040), '7': Grid line voltage out of range (GridV.OutLim), '8': Grid phase voltage out of range (GridV.OutLim), '9': High inverter current (Protect0030), '10': Grid frequency high (GridF.OutLim), '11': Grid frequency low (GridF.OutLim), '12': Grid out of phase (GridV.OutLim), '13': Grid relay protection (Protect0020), '14': Over-temperature protection (TempOver), '15': Inverter current bias (Protect0010)}
  fault1: {'1': DCI current bias (Protect0180), '2': DCI current too high (Protect0170), '3': Insulation resistance too low (IsolationErr), '4': Leakage current too high (GFCIErr), '5': Abnormal frequency selection (Protect0160), '7': MCU protection (Protect0150), '8': Inverter hardware over-current (Protect0140), '9': Grid voltage unbalanced (GridV.OutLim), '11': Inverter current imbalance (Protect0130), '12': Power module protection (Protect0120), '14': Bus hardware over-voltage (Protect0110), '15': Leakage current sensor abnormal (Protect0100)}
  fault2: {'1': Internal hardware error (Protect0210), '3': PV2 input reversed (PV2Reverse), '4': PV2 input over-current (Protect0240), '5': PV2 voltage too high (PV2VoltOver), '6': PV source input abnormal (Protect0260), '7': Power inverter open-loop self-test (Protect0230), '9': PV1 input reversed (PV1Reverse), '10': PV1 voltage too high (PV1VoltOver), '11': PV3 input reversed (PV3Reverse), '12': PV3 voltage too high (PV3VoltOver)}
  fault3: {'13': Hardware driver power supply abnormal (Protect0330), '15': Arc protection (ARC Protect)}
  fault4: {'0': Control board 5 V low (Protect0620), '1': Steady-state GFCI protection (Protect0610), '2': Arc board failure (Arcboard Err), '3': Battery overboard (Protect0590), '4': PV3 input over-current (Protect0580), '5': PLL lock exception (Protect0570), '6': Control board 3.3 V low (Protect0560), '7': Boost hardware over-current (Protect0550), '8': Abnormal product model (Protect0540), '9': CPLD program version abnormal (Protect0530), '10': CPLD clock abnormal (Protect0520), '15': Phase-to-ground voltage anomaly (Protect0470)}

