connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 51

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 6
    type: bcd64
  checks:
  - table: input
    address: 0
    type: u16
    range:
    - 16432
    - 16463
    not: 16451

models:
  - {id: cps_50_60kw_480v, name: 50/60 kW 480 V, match: {table: input, address: 0, type: u16, in: [16433, 16434, 16435, 16436]}}
  - {id: cps_25kw_480v, name: 25(20) kW 480 V, match: {table: input, address: 0, type: u16, equals: 16438}}
  - {id: cps_100_125kw_1500v, name: 100/125 kW 1500 V, match: {table: input, address: 0, type: u16, equals: 16437}}
  - {id: cps_250_275kw, name: 250/275 kW 12-boost, match: {table: input, address: 0, type: u16, equals: 16441}}
  - {id: cps_320_350kw_1500v, name: 320/350 kW 1500 V, match: {table: input, address: 0, type: u16, equals: 16447}}
  - {id: sch250_t_us_600, name: SCH250-T-US-600 (250 kW 600 V / 200 kW 480 V), match: {table: input, address: 0, type: u16, equals: 16456}}
  - {id: sca100k_sca50k, name: 'SCA100K / SCA50K (1000 Vdc, 208 V)', match: {table: input, address: 0, type: u16, equals: 16461}}
  - {id: cps_403x, name: Other 403X (read with the 50/60 kW layout), match: {table: input, address: 0, type: u16, range: [16432, 16463]}}

points:
  # Identification (read every 12 polls)
  - {key: x.device_type, label: Device, table: input, address: 0, type: u16, enum: device_type, poll: slow}
  - {key: x.protocol_version, label: ProVer, table: input, address: 4, type: u16, scale: 0.01, invalid: [65535], poll: slow, note: The 250 kW and 1000 Vdc maps call this BCD.}
  - {key: x.version_minor, label: MinorVer, table: input, address: 5, type: u16, invalid: [65535], poll: slow, note: '0xAABB: AA = low byte of the DSP version, BB = low byte of the LCD version.'}
  - {key: serial, label: SN, table: input, address: 6, type: bcd64, poll: slow, note: '16 BCD digits; the first 3 are unused, e.g. 0x0001010091114001 = 1010091114001. All 0x0000 or all 0xFFFF = none.'}
  - {key: x.model, label: model, table: input, address: 10, type: str, length: 10, poll: slow, note: NUL-padded text such as SC60KTL-DO/US-480.}
  - {key: x.version_major, label: MajorVer, table: input, address: 65, type: u16, invalid: [65535], poll: slow, note: '0xAABB: AA = high byte of the DSP version, BB = high byte of the LCD version.'}
  - {key: x.rated_power, label: PmaxLim, table: input, address: 70, type: u16, unit: kW, invalid: [65535], poll: slow, models: [cps_50_60kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, sch250_t_us_600, sca100k_sca50k, cps_403x]}
  - {key: x.rated_apparent_power, label: SmaxLim, table: input, address: 71, type: u16, unit: kVA, invalid: [65535], poll: slow, models: [cps_50_60kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, sch250_t_us_600, sca100k_sca50k, cps_403x]}

  # Energy
  - {key: pv_energy, label: TYield, table: input, address: 22, type: u32, unit: kWh, invalid: [4294967295], poll: slow, note: Total energy fed to the grid (AC side).}
  - {key: pv_energy_today, label: DYield, table: input, address: 24, type: u16, unit: kWh, scale: 0.1, invalid: [65535]}

  # AC side
  - {key: x.efficiency, label: Eff, table: input, address: 25, type: u16, unit: '%', scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, cps_403x], note: The 50/60 kW and 25 kW maps give the unit as 0.1 % but a scale factor of −3; 0.1 % is used.}
  - {key: x.efficiency, label: Eff, table: input, address: 25, type: u16, unit: '%', invalid: [65535], models: [sch250_t_us_600]}
  - {key: x.efficiency, label: Eff, table: input, address: 25, type: u16, unit: '%', scale: 0.1, invalid: [65535], models: [sca100k_sca50k], verified: false, note: Not in the 1000 Vdc map; assumed as in the 50/60 kW map.}
  - {key: power_factor, label: PF, table: input, address: 26, type: s16, unit: '', scale: 0.001, invalid: [-32768]}
  - {key: x.peak_power_today, label: Pmax, table: input, address: 27, type: u16, unit: W, scale: 100, invalid: [65535], note: Highest AC active power of the day.}
  - {key: x.feed_in_time_today, label: RunT, table: input, address: 28, type: u16, unit: min, scale: 0.1, invalid: [65535]}
  - {key: x.ac_power, label: Pac, table: input, address: 29, type: u16, unit: W, scale: 100, invalid: [65535], note: AC active power output (unsigned).}
  - {key: apparent_power, label: Sac, table: input, address: 30, type: u16, unit: VA, scale: 100, invalid: [65535]}
  - {key: x.uab_voltage, label: Uab, table: input, address: 31, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line-to-line grid voltage.}
  - {key: x.ubc_voltage, label: Ubc, table: input, address: 32, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line-to-line grid voltage.}
  - {key: x.uca_voltage, label: Uca, table: input, address: 33, type: u16, unit: V, scale: 0.1, invalid: [65535], note: Line-to-line grid voltage.}
  - {key: l1_current, label: Ia, table: input, address: 34, type: u16, unit: A, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: l2_current, label: Ib, table: input, address: 35, type: u16, unit: A, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: l3_current, label: Ic, table: input, address: 36, type: u16, unit: A, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: l1_current, label: Ia, table: input, address: 34, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [sch250_t_us_600, sca100k_sca50k], note: Signed in these maps; the sign's meaning isn't stated.}
  - {key: l2_current, label: Ib, table: input, address: 35, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [sch250_t_us_600, sca100k_sca50k], note: Signed in these maps; the sign's meaning isn't stated.}
  - {key: l3_current, label: Ic, table: input, address: 36, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [sch250_t_us_600, sca100k_sca50k], note: Signed in these maps; the sign's meaning isn't stated.}
  - {key: frequency, label: Freq, table: input, address: 43, type: u16, unit: Hz, scale: 0.1, invalid: [65535]}
  - {key: reactive_power, label: Qac, table: input, address: 59, type: s16, unit: var, scale: 100, invalid: [-32768], note: Signed; the sign's meaning isn't stated.}

  # PV inputs
  - {key: pv_power, label: Pdc, table: input, address: 69, type: u16, unit: W, scale: 100, invalid: [65535], models: [cps_50_60kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, sch250_t_us_600, sca100k_sca50k, cps_403x], note: PV input total power.}
  - {key: x.pv1_voltage, label: Upv1, table: input, address: 37, type: u16, unit: V, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: x.pv1_current, label: Ipv1, table: input, address: 38, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [cps_50_60kw_480v, cps_25kw_480v, cps_100_125kw_1500v, cps_250_275kw, cps_403x]}
  - {key: x.pv1_current, label: Imppt1, table: input, address: 38, type: s16, unit: A, scale: 0.01, invalid: [-32768], models: [cps_320_350kw_1500v]}
  - {key: x.pv2_voltage, label: Upv2, table: input, address: 39, type: u16, unit: V, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: x.pv2_current, label: Ipv2, table: input, address: 40, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [cps_50_60kw_480v, cps_25kw_480v, cps_250_275kw, cps_403x]}
  - {key: x.pv2_current, label: Imppt2, table: input, address: 40, type: s16, unit: A, scale: 0.01, invalid: [-32768], models: [cps_320_350kw_1500v]}
  - {key: x.pv3_voltage, label: Upv3, table: input, address: 41, type: u16, unit: V, scale: 0.1, invalid: [65535], models: [cps_50_60kw_480v, cps_25kw_480v, cps_250_275kw, cps_320_350kw_1500v, cps_403x]}
  - {key: x.pv3_current, label: Ipv3, table: input, address: 42, type: s16, unit: A, scale: 0.1, invalid: [-32768], models: [cps_50_60kw_480v, cps_25kw_480v, cps_250_275kw, cps_403x]}
  - {key: x.pv3_current, label: Imppt3, table: input, address: 42, type: s16, unit: A, scale: 0.01, invalid: [-32768], models: [cps_320_350kw_1500v]}

  # Temperatures
  - {key: temperature, label: Tmod, table: input, address: 44, type: s16, unit: °C, scale: 0.1, invalid: [-32768], note: Heat sink temperature.}
