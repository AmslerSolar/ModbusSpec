  - {key: x.transformer_temperature, label: Tcoil, table: input, address: 46, type: s16, unit: °C, scale: 0.1, invalid: [-32768], models: [cps_25kw_480v]}

  # State, faults and warnings
  - {key: state, label: Mode, table: input, address: 47, type: u16, enum: mode}
  - {key: x.pfault, label: PFault, table: input, address: 52, type: u16, flags: pfault, models: [cps_50_60kw_480v]}
