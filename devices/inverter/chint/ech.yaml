modbusspec: 0
id: chint-ech
manufacturer: CHINT
name: ECH10K-TH-EU Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/chint-ech-hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.battery_power_1, label: Battery power (part 1), table: input, address: 1536, type: u16, scale: 0.1, note: evcc multiplies it with the other factors of the battery power.}
  - {key: x.battery_power_2, label: Battery power (part 2), table: input, address: 1537, type: s16, scale: 0.1, note: evcc multiplies it with the other factors of the battery power.}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 1539, type: u16, unit: '%'}
  - {key: grid_power, label: Grid power, table: input, address: 1792, type: s32, unit: W, positive: import}
  - {key: pv_power, label: PV power, table: input, address: 1801, type: u16, unit: W}
  - {key: l1_current, label: Grid L1 current, table: input, address: 2095, type: s16, unit: A, scale: 0.01}
  - {key: l2_current, label: Grid L2 current, table: input, address: 2096, type: s16, unit: A, scale: 0.01}
  - {key: l3_current, label: Grid L3 current, table: input, address: 2097, type: s16, unit: A, scale: 0.01}

notes:
- 'evcc template `chint-ech-hybrid` (grid, pv, battery) lists: CHINT ECH10K-TH-EU Hybrid Inverter.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
