notes:
- 'The VPP map is the same for every family in its DTC table (V2.03: SPH/SPA 3501–3504, 3601, 3701, 3715, 3716, 3725, 3735;
  MIN-XH 5100; MOD/MID-XH 5400, MOD/MID-HU 5401; WIT/WIS 5600, 5601, 5800, 5801; MIC/MIN-X 5200, 5201; MOD/MID/MAC-X 5001–5003;
  MAX 5000, 5500–5502). MIN-X, MOD/MID/MAC-X and MAX use no battery or storage registers. The projects split these families
  over growatt-tl-x, growatt-sph, growatt-wit and growatt-legacy; this file covers only the VPP models kept in growatt-legacy,
  under the projects'' model ids. The same map is in growatt-tl-x (and the other growatt files) unchanged.'
- 'Models: the MIC belongs to DTC 5200 (MIC/MIN 2500-6000TL-X/X2) in the document; growatt-tl-x already matches 5200, so no
  match is set here. Like all DTC 5200/5201 models it uses no battery registers.'
- 'Protocol: Modbus RTU on the inverter''s RS485 port, 9600 bps by default (38400 selectable, see 30113), 1 start, 8 data
  and 1 stop bit; the unit id is the mailing address 30112 (default 1). Over TCP it is reached through an RS485-to-TCP gateway
  (port 502 there); local Modbus TCP on dongles is not covered by the document.'
- Identification and ratings are holding registers (FC 03), live values input registers (FC 04). Register numbers are sent
  as they are (no offset; the document shows none, not checked on a device).
- 'A request must stay inside one of the document''s register groups (30000–30099, 30100–30149, 31000–31009, 31010–31099,
  31100–31199, one block per battery 31200/31300/31400/31500, …): reading across a group boundary answers exception 2. Whether
  every family accepts reads of up to 50 registers that include the reserved registers inside a group (e.g. 31042–31057) is
  not stated.'
- 'Signs as the device sends them: 31100 active power positive = export to grid; 31112 meter power positive = import from
  grid; 31200 battery power and 31215 battery current positive = charging. All from the document.'
- 32-bit values are high word first; 31058, 31100, 31102, 31112, 31200 and 31215 are signed (INT32), the energies, ratings
  and FCC unsigned.
- 'Batteries: up to four blocks (31200, 31300, 31400, 31500) with the same layout; a block that answers exception 2 or holds
  only zeros is an empty slot. MIC/MIN TL-X (DTC 5200/5201) use no battery registers at all (30300–30499, 31200–31599).'
- 'Version differences: V2.03 adds bypass (9) to the on/off command 30101, describes working states 5–8 as on-grid (5, 6)
  and off-grid (7, 8), renames country 12 (SA_IEC62116&61727, Hungary) and adds countries 61–92. Older editions (V2.01) call
  12 SA_HUNGARY and end the country table at 60.'
- 'Left out: the other control settings in 30100–30499 (clock, power and reactive power, export limitation, EPS, battery charge
  / discharge and time-of-use; V2.03 changes some ranges there: 30160 up to 70 %, 30162 default 20000, stop SOCs 30404–30406
  and 30475 10–100 %, 30410 adds AC-only charging), the areas V2.03 adds (on/off-grid switching and per-phase power 30209–30215,
  diesel generator 30250–30255, peak shaving 30301–30305, time-of-use default mode and reset 30476–30477) and the safety parameters
  30500–30999.'
- No register gives home consumption or PV yield; home consumption is derived from the power balance.
- 'Models: the VPP map (holding 30000+, input 31000+) is model mic_600_3300tl_x_v201; the older V3.xx map (holding 0–200,
  input 0–129) is model pv_v3. The V3.xx document names no models and gives no register that identifies the map, so a network
  search finds only the VPP model (DTC 5200 at 30000); pv_v3 is picked by hand. The connection limits here (45 registers,
  850 ms between requests) are the V3.xx ones; the VPP map allows 50 registers.'
- 'Older map (V3.xx), protocol: Modbus RTU on RS485 at 9600 bps, 8 data bits, no parity, 1 stop bit; unit id 1–247. Function
  codes 3, 4, 6 and 16. At most 45 registers per request, and a request must stay inside one block of 45 registers (the document
  gives 1–45 and 96–123 as allowed and 40–60 as not allowed; its examples do not make the block boundaries fully clear). Wait
  at least 850 ms between requests (1 s suggested).'
- 'Older map: addresses are the register numbers of the tables, sent as they are: since V2.08 the map starts at 0x0000 (0-based,
  no 3xxxx/4xxxx offset).'
- 'Older map: 32-bit values are two registers, high word first (the tables list "H" before "L"). The document calls every
  register an unsigned 16-bit integer; temperatures and string currents (stated as −15…15 A) are read as signed here.'
- 'Older map: no grid or battery power; these are grid-tied PV inverters; the document gives only the inverter''s AC output
  (input 11) and per-phase apparent power.'
- 'Older map, version differences: V3.04 and V3.05 have no input 66–79 (output percent, full-load power, main-CPU warnings,
  string data; 80–89 reserved) and no input 115–129 (PID, PV3, fault bits), which came with V3.10–V3.13; V3.04''s holding
  map ends at 150.'
- 'Older map, left out: grid-code / protection limits and times (holding 19–22, 35–42, 51–58, 81–86, 100–176, 183–194), PID
  settings (holding 87–89), PF limit line (holding 90–98), network and datalogger settings (holding 180–182, 195–200), fault
  values (input 33–39), PID data (input 115–119), string fault / warning codes (input 86, 87, 89), auto-test data (input 135–144),
  grid fault and error records (input 90–114, 180–429), energy history (input 450–575) and manufacturer debug registers.'
- Models mic_600_3300tl_x, mic_2500_5500mtl_s, tl3_s_3000_15000 come from projects and are listed after a model without a
  match, so detection never reaches them; their points apply only when a reader selects such a model by hand.
- 'Left out: ac_current_vpp (input 31101, u16) from growatt-modbustcp overlaps x.active_power from the documents.'
- 'The project tells this protocol apart by holding 73 (Modbus version × 100): above 3.0 and at most 3.15.'
- 'RTU protocol v3.x layout: input registers from 0 (about 0-179); the project names the protocol V3.05.'
- 'The MIC 2500-5500MTL-S rejects multi-register reads in the project''s experience: read one register at a time. The TL3-S
  profile limits reads to 50 registers.'
- Identification as growatt-modbus recognises the device (not checked against a document).
- 'Left out: ac_power_low (input 12, u16) from growatt-modbustcp overlaps output_power (input 11, s32); check a document.'
- 'Left out: energy_today_low (input 53, u16) from growatt-modbustcp overlaps input_2_energy_today (input 52, s32); check
  a document.'
- 'Left out: energy_total_low (input 55, u16) from growatt-modbustcp overlaps input_2_energy_total (input 54, s32); check
  a document.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
