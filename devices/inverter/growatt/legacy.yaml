  sha256: b5e9daae665c14572aa229b515f585465c894b5ca7286908b05e663b6cade5de
- id: growatt-modbus
  title: homeassistant-growatt-modbus (Home Assistant integration)
  url: https://github.com/jacobbjerregaard/homeassistant-growatt-modbus
  license: Apache-2.0
  commit: 30914b3e6687713ab041ccbd5638c2bd45a396a5
  path: custom_components/growatt_modbus/api/device_type/inverter_315.py
- id: growatt-modbustcp
  title: Growatt_ModbusTCP (Home Assistant integration)
  url: https://github.com/0xAHA/Growatt_ModbusTCP
  license: MIT
  commit: 42f01bc346245197787b2976f6a9d2f4558bc503
  path: custom_components/growatt_modbus/profiles

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 45
    min_interval_ms: 850

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
  - table: holding
    address: 30001
    type: str
    length: 15
    models:
    - mic_600_3300tl_x_v201
  - table: holding
    address: 23
    type: str
    length: 5
    models:
    - pv_v3
  checks:
  - table: holding
    address: 30000
    type: u16
    in:
    - 5200

models:
  - {id: mic_600_3300tl_x_v201, name: MIC 600-3300TL-X (VPP V2.01)}
  - {id: pv_v3, name: Older PV inverters (RS485 protocol V3.xx)}
  - {id: mic_600_3300tl_x, name: MIC 600-3300TL-X}
  - {id: mic_2500_5500mtl_s, name: MIC 2500-5500MTL-S, match: {table: holding, address: 43, type: u16, equals: 210}}
  - {id: tl3_s_3000_15000, name: TL3-S 3000-15000, match: {table: holding, address: 43, type: u16, equals: 2049}}

points:
  # Basic parameters (holding 30000–30099)
  - {key: x.dtc_code, label: Equipment type (DTC), table: holding, address: 30000, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: serial, label: SN, table: holding, address: 30001, type: str, length: 15, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: 'The table gives 15 UINT16 registers and no encoding. Taken as ASCII, two characters per register; a reader may also accept one character per register (all high bytes 0).'}
  - {key: x.rated_power, label: Rated power (Pn), table: holding, address: 30016, type: u32, unit: W, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.max_active_power, label: Maximum active power (Pmax), table: holding, address: 30018, type: u32, unit: W, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.max_reactive_power_fed_in, label: Maximum reactive power (Qmax fed into the grid), table: holding, address: 30020, type: u32, unit: var, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.max_reactive_power_absorbed, label: Maximum reactive power (Qmax absorption grid), table: holding, address: 30022, type: u32, unit: var, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.max_apparent_power, label: Maximum apparent power (Smax), table: holding, address: 30024, type: u32, unit: VA, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.pv_max_power, label: PV input maximum power, table: holding, address: 30028, type: u32, unit: W, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}

  # Version information (30060–30082): two ASCII registers (name), then version digits
  - {key: firmware, label: Machine model (inverter version name), table: holding, address: 30060, type: str, length: 2, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: 'Two characters per register assumed (e.g. TL, AA); the version digits follow in 30062–30064.'}
  - {key: x.firmware_num1, label: Inverter version num 1, table: holding, address: 30062, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.firmware_num2, label: Inverter version num 2, table: holding, address: 30063, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.firmware_num3, label: Inverter version num 3, table: holding, address: 30064, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.m3_version_name, label: M3 version name, table: holding, address: 30065, type: str, length: 2, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: Two characters per register assumed.}
  - {key: x.m3_version_num, label: M3 version num 1, table: holding, address: 30067, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.meter_version_name, label: Meter machine model, table: holding, address: 30080, type: str, length: 2, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: Two characters per register assumed.}
  - {key: x.meter_version_num, label: Meter version num 1, table: holding, address: 30082, type: u16, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.protocol_version, label: VPP protocol version, table: holding, address: 30099, type: u16, models: [mic_600_3300tl_x_v201], poll: slow, note: '200 = V2.00, 201 = V2.01 and so on. The table gives 15 registers here; only the first carries the version.'}

  # System order control (30100–30149)
  - {key: x.control_authority, label: Control authority, table: holding, address: 30100, type: u16, enum: enable, models: [mic_600_3300tl_x_v201], writable: true, poll: slow}
  - {key: x.remote_onoff, label: On off command, table: holding, address: 30101, type: u16, enum: on_off, models: [mic_600_3300tl_x_v201], writable: true, poll: slow}
  - {key: x.country, label: Country / region number, table: holding, address: 30102, type: u16, enum: country, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: x.modbus_address, label: Mailing address, table: holding, address: 30112, type: u16, models: [mic_600_3300tl_x_v201], poll: slow, note: 'The unit id, 1–255; read-only over Modbus.'}
  - {key: x.baud_rate, label: Communication baud rate, table: holding, address: 30113, type: u16, enum: baud_rate, models: [mic_600_3300tl_x_v201], poll: slow}

  # Working status (input 31000–31009)
  - {key: state, label: Working state of energy storage machine, table: input, address: 31000, type: u16, enum: work_state, models: [mic_600_3300tl_x_v201]}
  - {key: x.priority, label: Priority of work, table: input, address: 31002, type: u16, enum: priority, models: [mic_600_3300tl_x_v201]}
  - {key: error_code, label: Fault code, table: input, address: 31005, type: u16, models: [mic_600_3300tl_x_v201], note: 'Table 3-3 is empty in V2.01 and V2.03 ("reference product fault list"), so codes have no text here.'}
  - {key: x.fault_subcode, label: Fault sub code, table: input, address: 31006, type: u16, models: [mic_600_3300tl_x_v201]}
  - {key: x.alarm_code, label: Alarm code, table: input, address: 31007, type: u16, models: [mic_600_3300tl_x_v201], note: Table 3-4 is empty in V2.01 and V2.03.}
  - {key: x.alarm_subcode, label: Alarm sub code, table: input, address: 31008, type: u16, models: [mic_600_3300tl_x_v201]}

  # PV (31010–31099): voltage and current per input, 16 inputs, then the total
  - {key: x.pv1_voltage, label: PV1 voltage, table: input, address: 31010, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201], conflicts: [{sources: [growatt-modbustcp], type: u16, label: pv1_voltage_vpp}]}
  - {key: x.pv1_current, label: PV1 current, table: input, address: 31011, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201], conflicts: [{sources: [growatt-modbustcp], type: u16, label: pv1_current_vpp}]}
  - {key: x.pv2_voltage, label: PV2 voltage, table: input, address: 31012, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201], conflicts: [{sources: [growatt-modbustcp], type: u32, unit: W, word_order: big, label: pv1_power_vpp}]}
  - {key: x.pv2_current, label: PV2 current, table: input, address: 31013, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv3_voltage, label: PV3 voltage, table: input, address: 31014, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201], verified: false, note: 'The table prints INT32 0.1W with one register, an evident slip; read as INT16 0.1 V like the other inputs.'}
  - {key: x.pv3_current, label: PV3 current, table: input, address: 31015, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv4_voltage, label: PV4 voltage, table: input, address: 31016, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv4_current, label: PV4 current, table: input, address: 31017, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv5_voltage, label: PV5 voltage, table: input, address: 31018, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201], conflicts: [{sources: [growatt-modbustcp], type: u32, unit: W, word_order: big, label: pv_total_power_vpp}]}
  - {key: x.pv5_current, label: PV5 current, table: input, address: 31019, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv6_voltage, label: PV6 voltage, table: input, address: 31020, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv6_current, label: PV6 current, table: input, address: 31021, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv7_voltage, label: PV7 voltage, table: input, address: 31022, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv7_current, label: PV7 current, table: input, address: 31023, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv8_voltage, label: PV8 voltage, table: input, address: 31024, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv8_current, label: PV8 current, table: input, address: 31025, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv9_voltage, label: PV9 voltage, table: input, address: 31026, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv9_current, label: PV9 current, table: input, address: 31027, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv10_voltage, label: PV10 voltage, table: input, address: 31028, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv10_current, label: PV10 current, table: input, address: 31029, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv11_voltage, label: PV11 voltage, table: input, address: 31030, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv11_current, label: PV11 current, table: input, address: 31031, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv12_voltage, label: PV12 voltage, table: input, address: 31032, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv12_current, label: PV12 current, table: input, address: 31033, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv13_voltage, label: PV13 voltage, table: input, address: 31034, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv13_current, label: PV13 current, table: input, address: 31035, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv14_voltage, label: PV14 voltage, table: input, address: 31036, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv14_current, label: PV14 current, table: input, address: 31037, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv15_voltage, label: PV15 voltage, table: input, address: 31038, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv15_current, label: PV15 current, table: input, address: 31039, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv16_voltage, label: PV16 voltage, table: input, address: 31040, type: s16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.pv16_current, label: PV16 current, table: input, address: 31041, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: pv_power, label: PV input power, table: input, address: 31058, type: s32, unit: W, scale: 0.1, models: [mic_600_3300tl_x_v201]}

  # AC (31100–31199)
  - {key: x.active_power, label: Active power, table: input, address: 31100, type: s32, unit: W, scale: 0.1, positive: export, models: [mic_600_3300tl_x_v201], note: 'The inverter''s AC active power: positive = export to grid, negative = import.', conflicts: [{sources: [growatt-modbustcp], type: u16, unit: V, label: ac_voltage_vpp}]}
  - {key: reactive_power, label: Reactive power, table: input, address: 31102, type: s32, unit: var, scale: 0.1, models: [mic_600_3300tl_x_v201], note: The table prints the unit as 0.1VA., conflicts: [{sources: [growatt-modbustcp], type: u32, unit: VA, label: ac_power_vpp}]}
  - {key: frequency, label: Grid frequency, table: input, address: 31105, type: u16, unit: Hz, scale: 0.01, models: [mic_600_3300tl_x_v201]}
  - {key: x.grid_voltage_ab, label: Grid voltage / line AB voltage, table: input, address: 31106, type: u16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201], note: 'Phase voltage when the output is L/N (single phase), otherwise the AB line voltage.', conflicts: [{sources: [growatt-modbustcp], unit: Hz, scale: 0.01, label: ac_frequency_vpp}]}
  - {key: x.line_voltage_bc, label: BC line voltage of power grid, table: input, address: 31107, type: u16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.line_voltage_ca, label: CA line voltage of power grid, table: input, address: 31108, type: u16, unit: V, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: l1_current, label: Grid current / A phase current of grid, table: input, address: 31109, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: l2_current, label: Phase B current of grid, table: input, address: 31110, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: l3_current, label: Phase C current of grid, table: input, address: 31111, type: s16, unit: A, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: grid_power, label: Meter power, table: input, address: 31112, type: s32, unit: W, scale: 0.1, positive: import, models: [mic_600_3300tl_x_v201], note: 'Positive = import from grid, negative = export. Needs Growatt''s meter; without one the value is presumably 0 (not stated).'}
  - {key: temperature, label: Inverter temperature, table: input, address: 31114, type: s16, unit: °C, scale: 0.1, models: [mic_600_3300tl_x_v201]}
  - {key: x.grid_import_energy_today, label: Power to user daily, table: input, address: 31118, type: u32, unit: kWh, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: Taken as energy from the grid (Growatt's usual meaning of "to user"); the document doesn't explain it.}
  - {key: grid_import_energy, label: Total power to user, table: input, address: 31120, type: u32, unit: kWh, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow, verified: false, note: Taken as energy from the grid (Growatt's usual meaning of "to user"); the document doesn't explain it.}
  - {key: x.grid_export_energy_today, label: Power to grid daily, table: input, address: 31122, type: u32, unit: kWh, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}
  - {key: grid_export_energy, label: Total power to grid, table: input, address: 31124, type: u32, unit: kWh, scale: 0.1, models: [mic_600_3300tl_x_v201], poll: slow}

  # Older map (RS485 protocol V3.xx): holding registers
  - {key: x.remote_onoff, label: OnOff (on/off and auto start), table: holding, address: 0, type: u16, enum: onoff_autostart, models: [pv_v3], writable: true, poll: slow, note: 'Low byte = on (1) / off (0), high byte = start automatically at the next power-up (1) or not (0).'}
  - {key: x.active_power_rate, label: Active P Rate, table: holding, address: 3, type: u16, unit: '%', models: [pv_v3], writable: true, min: 0, max: 100, poll: slow, note: Default 100.}
  - {key: x.reactive_power_rate, label: Reactive P Rate, table: holding, address: 4, type: u16, unit: '%', models: [pv_v3], writable: true, min: 0, max: 100, poll: slow}
  - {key: x.power_factor_setting, label: Power factor (× 10000), table: holding, address: 5, type: u16, models: [pv_v3], writable: true, min: 0, max: 20000, poll: slow, note: 'Default 10000; 0–10000 means underexcited, above 10000 overexcited.'}
  - {key: x.pf_model, label: PFModel (power factor mode), table: holding, address: 99, type: u16, enum: pf_model, models: [pv_v3], writable: true, poll: slow}
  - {key: x.normal_power, label: Pmax (normal power), table: holding, address: 6, type: u32, unit: VA, scale: 0.1, models: [pv_v3], poll: slow}
  - {key: x.normal_pv_voltage, label: Vnormal (normal working PV voltage), table: holding, address: 8, type: u16, unit: V, scale: 0.1, models: [pv_v3], poll: slow}
  - {key: firmware, label: Fw version, table: holding, address: 9, type: str, length: 3, models: [pv_v3], poll: slow}
  - {key: x.control_firmware, label: Fw version2 (control firmware), table: holding, address: 12, type: str, length: 3, models: [pv_v3], poll: slow}
  - {key: x.pv_start_voltage, label: Vpv start (input start voltage), table: holding, address: 17, type: u16, unit: V, scale: 0.1, models: [pv_v3], writable: true, poll: slow}
  - {key: x.start_time, label: Time start, table: holding, address: 18, type: u16, unit: s, models: [pv_v3], writable: true, poll: slow}
  - {key: serial, label: Serial No. 5…1, table: holding, address: 23, type: str, length: 5, models: [pv_v3], poll: slow, verified: false, note: 'Ten ASCII characters; the table numbers the registers 5 (at 23) down to 1 (at 27). Read in register order, two characters per register (assumed).'}
  - {key: x.inverter_module, label: Moudle H/L (inverter model code), table: holding, address: 28, type: u32, models: [pv_v3], poll: slow, note: 'Packed model code, one hex digit each for T, Q, P, U, M, S from bit 20 down (e.g. 0x00F151 = T0 Q0 PF U1 M5 S1).'}
