# Written from the Growatt VPP communication protocol (V2.03, 2025-09-01; V2.01 also listed) for the VPP register map
# (holding 30000+, input 31000+), and from the Growatt PV Inverter Modbus RS485 RTU Protocol (V3.14, 2016-09-27; V3.05
# and V3.04 checked against it) for the register map of the older grid-tied PV inverters (holding 0–200, input
# 0–129), before protocol II.

modbusspec: 0
id: growatt-legacy
manufacturer: Growatt
name: MIC 600-3300TL-X (VPP protocol) and older PV inverters (RS485 protocol V3.xx)
kind: inverter

sources:
- title: GROWATT VPP Communication Protocol of Inverter (GI-BK-E060)
  version: V2.03 (2025-09-01)
