  - {key: x.battery_charge_energy_today, label: EBatChgToday H/L, table: input, address: 98, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_charge_energy_total, label: EBatChgTotal H/L, table: input, address: 100, type: u32, unit: kWh, scale: 0.1, poll: slow}
