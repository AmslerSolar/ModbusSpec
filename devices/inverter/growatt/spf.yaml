  - {key: x.ac_input_apparent_power, label: AC_InVA H/L, table: input, address: 38, type: u32, unit: VA, scale: 0.1}
  - {key: error_code, label: Fault bit (fault code), table: input, address: 40, type: u16, enum: fault_code, verified: false, note: 'Named "fault bit", but its table lists fault numbers (1–81), not bits: read as a code, 0 = none (assumed).'}
