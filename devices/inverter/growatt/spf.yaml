  - {key: x.ac_discharge_apparent_power, label: AC_DisChrVA H/L, table: input, address: 71, type: u32, unit: VA, scale: 0.1}
  - {key: x.battery_discharge_power, label: Bat_DisChrWatt H/L, table: input, address: 73, type: u32, unit: W, scale: 0.1}
  - {key: x.battery_discharge_apparent_power, label: Bat_DisChrVA H/L, table: input, address: 75, type: u32, unit: VA, scale: 0.1}
