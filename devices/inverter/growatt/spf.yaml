notes:
- 'Protocol: Modbus RTU on RS485 or RS232, 9600 bps, 8 data bits, no parity, 1 stop bit; unit id 1–247 (253 is for debugging).
  Wait at least 850 ms between requests (1 s suggested). At most 45 registers per read or write, and a request must stay inside
  one block of 45 registers (the document''s example: 1–45 and 96–123 work, 40–60 doesn''t); that alignment can''t be expressed
  here. Addresses are the register numbers of the tables, sent as they are (0-based; no 3xxxx/4xxxx offset). Function 3 reads
  holding, 4 reads input, 6 and 16 write holding registers.'
- 32-bit values are two registers, high word first (the tables list "H" before "L"). The document calls every register an
  unsigned 16-bit integer, but marks input 36–37 and 77–78 as signed 32-bit; temperatures (range down to −30 °C) and the BMS
  current and temperatures are read as signed here.
- 'Signs from the document: input 36 (AC input power) positive = from the grid, negative = export to the grid; input 77 (battery
  power) positive = discharging, negative = charging.'
- 'Input 0: V0.26 gives two lists for the system status; the longer one in the register row (0–28, with the generator and
  grid-export states) is used. Fault code 56 is "battery open" in V0.14 and "IGBT over current" in V0.26; V0.26 is used.'
- Input 200–289 is the lithium battery's BMS data passed through by the inverter (empty without BMS communication). Some of
  the BMS tables exist only in Chinese in the document; they were translated.
- 'Left out: debug and factory registers (holding 16–17, 31–33, 40–42, 51–58, 84–113 except 95), the battery-feed, grid-charge
  and second-output time windows and thresholds (holding 125–136, 138–156), grid-code settings (holding 160–169, 300–426),
  the firmware build numbers (holding 67–70), the per-cell voltages and the per-module data of the BMS (input 209–232, 236,
  240, 242, 245–250, 253–255, 259–262, 273–289).'
- Identification as growatt-modbustcp recognises the device (not checked against a document).
- 'Left out: firmware_version_medium (holding 10, u16) from growatt-modbustcp overlaps firmware from the documents.'
- 'Left out: firmware_version_low (holding 11, u16) from growatt-modbustcp overlaps firmware from the documents.'
- 'Left out: control_firmware_version_medium (holding 13, u16) from growatt-modbustcp overlaps x.control_firmware from the
  documents.'
- 'Left out: control_firmware_version_low (holding 14, u16) from growatt-modbustcp overlaps x.control_firmware from the documents.'
- 'Left out: serial_number_4 (holding 24, u16) from growatt-modbustcp overlaps serial from the documents.'
- 'Left out: serial_number_3 (holding 25, u16) from growatt-modbustcp overlaps serial from the documents.'
- 'Left out: serial_number_2 (holding 26, u16) from growatt-modbustcp overlaps serial from the documents.'
- 'Left out: serial_number_1 (holding 27, u16) from growatt-modbustcp overlaps serial from the documents.'
- 'Off-grid protocol: one range from 0 for input and holding registers. The project warns that these inverters reset when
  registers in the VPP ranges (30000 and up) are read.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
