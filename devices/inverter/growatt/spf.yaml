# Written from the Growatt OffGrid Modbus RS485&RS232 RTU Protocol (V0.26, 2024-07-15); V0.14 checked against it.
# The protocol of Growatt's off-grid inverters (SPF, and the SPE grid-feeding variants it also covers).

modbusspec: 0
id: growatt-spf
manufacturer: Growatt
name: SPF / SPE off-grid inverters (off-grid protocol)
kind: inverter

sources:
- title: Growatt OffGrid Modbus RS485&RS232 RTU Protocol
  version: V0.26 (2024-07-15)
  url: https://github.com/0xAHA/Growatt_ModbusTCP/blob/42f01bc346245197787b2976f6a9d2f4558bc503/Protocols/OffGrid-Modbus-RS485-RS232-RTU-Protocol-V0-26.xlsx
  sha256: 7801b3fd3c5d1341a437090a4fdf8d402de29768761a8814be477bb0f60d0d2e
- title: Growatt OffGrid Modbus RS485/RS232 RTU Protocol
  version: V0.14 (2021-04-20)
  url: https://github.com/SeByDocKy/pvbrain2/blob/39e895fe7c6597ed51515ce7e8c1effa19a69054/pvbrain2/inverter/growatt/OffGrid-Modbus-RS485RS232-RTU-Protocol-V0.14-20210420.pdf
  sha256: 376a778f8f4bdf1f9013b22252d26e248835dda49ed8b01941e47ff23815c603
- id: growatt-modbustcp
  title: Growatt_ModbusTCP (Home Assistant integration)
  url: https://github.com/0xAHA/Growatt_ModbusTCP
  license: MIT
  commit: 42f01bc346245197787b2976f6a9d2f4558bc503
  path: custom_components/growatt_modbus/profiles

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 45
    min_interval_ms: 850

encoding:
  byte_order: big
  word_order: big

identify:
  any:
  - table: input
    address: 44
    type: u16
    in:
    - 3400
    - 3401
    - 3402
    - 3403
  serial:
    table: holding
    address: 23
    type: str
    length: 5

models:
  - {id: spf_3000_6000_es_plus, name: SPF 3000-6000 ES PLUS, match: {table: input, address: 44, type: u16, in: [3400, 3401, 3402, 3403]}}
  - {id: spe_8000_12000_es, name: SPE 8000-12000 ES}

points:
  # Holding: operation and settings
  - {key: x.standby, label: 'On/Off (low byte: standby on/off)', table: holding, address: 0, type: u16, bits: [0, 7], enum: on_off, writable: true, poll: slow}
  - {key: x.output_disable, label: 'On/Off (high byte: AC output disable)', table: holding, address: 0, type: u16, bits: [8, 15], enum: output_disable, writable: true, poll: slow, note: '0x0000 = output enabled, 0x0100 = output disabled.'}
  - {key: x.output_config, label: OutputConfig (AC output source priority), table: holding, address: 1, type: u16, enum: output_config, writable: true, poll: slow}
  - {key: x.charge_config, label: ChargeConfig (charge source priority), table: holding, address: 2, type: u16, enum: charge_config, writable: true, poll: slow}
  - {key: x.uti_out_start, label: UtiOutStart (utility output start time), table: holding, address: 3, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, writable: true, poll: slow, conflicts: [{sources: [growatt-modbustcp], type: u16, unit: h, label: uti_out_start}]}
  - {key: x.uti_out_end, label: UtiOutEnd (utility output end time), table: holding, address: 4, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, writable: true, poll: slow}
  - {key: x.uti_charge_start, label: UtiChargeStart (utility charge start time), table: holding, address: 5, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, writable: true, poll: slow}
  - {key: x.uti_charge_end, label: UtiChargeEnd (utility charge end time), table: holding, address: 6, type: datetime, length: 1, datetime: {hour: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}}, writable: true, poll: slow}
  - {key: x.pv_input_mode, label: PVModel (PV input mode), table: holding, address: 7, type: u16, enum: pv_input_mode, writable: true, poll: slow}
  - {key: x.ac_input_mode, label: ACInModel (AC input mode), table: holding, address: 8, type: u16, enum: ac_input_mode, writable: true, poll: slow}
  - {key: firmware, label: Fw version H/M/L, table: holding, address: 9, type: str, length: 3, poll: slow, conflicts: [{sources: [growatt-modbustcp], type: u16, label: firmware_version_high}]}
  - {key: x.control_firmware, label: Fw version2 H/M/L (control firmware), table: holding, address: 12, type: str, length: 3, poll: slow, conflicts: [{sources: [growatt-modbustcp], type: u16, label: control_firmware_version_high}]}
  - {key: x.output_voltage_type, label: OutputVoltType, table: holding, address: 18, type: u16, enum: output_voltage_type, writable: true, poll: slow}
  - {key: x.output_frequency_type, label: OutputFreqType, table: holding, address: 19, type: u16, enum: output_frequency_type, writable: true, poll: slow}
  - {key: x.overload_restart, label: OverLoadRestart, table: holding, address: 20, type: u16, enum: overload_restart, writable: true, poll: slow}
  - {key: x.overtemp_restart, label: OverTempRestart, table: holding, address: 21, type: u16, enum: yes_no, writable: true, poll: slow}
  - {key: x.buzzer_enable, label: BuzzerEN, table: holding, address: 22, type: u16, enum: enable, writable: true, poll: slow}
  - {key: serial, label: Serial NO. 5…1, table: holding, address: 23, type: str, length: 5, poll: slow, verified: false, note: 'Five registers, two ASCII characters each. The document numbers them 5 (holding 23) down to 1 (holding 27); that 23 holds the first characters is assumed (as in Growatt''s grid-tie protocol).', conflicts: [{sources: [growatt-modbustcp], type: u16, label: serial_number_5}]}
  - {key: x.model_power, label: Moudle L (inverter model power), table: holding, address: 29, type: u16, unit: W, scale: 100, poll: slow, note: 'In 0.1 kW, e.g. 50 = 5.0 kW model.'}
  - {key: x.modbus_address, label: Com Address, table: holding, address: 30, type: u16, writable: true, min: 1, max: 254, poll: slow, note: Default 1; 253 is reserved for debugging.}
  - {key: x.max_charge_current, label: MaxChargeCurr, table: holding, address: 34, type: u16, unit: A, writable: true, min: 0, max: 400, poll: slow, note: Default 70.}
  - {key: x.bulk_charge_voltage, label: BulkChargeVolt, table: holding, address: 35, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '50.0–64.0 V in the document, which fits 48 V systems; 24 V models take lower values.'}
  - {key: x.float_charge_voltage, label: FloatChargeVolt, table: holding, address: 36, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '50.0–56.0 V in the document, which fits 48 V systems; 24 V models take lower values.'}
  - {key: x.bat_low_to_uti, label: BatLowToUtiVolt (switch to utility at), table: holding, address: 37, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, note: '0.1 V (20.0–64.0 V) for non-lithium batteries; with a lithium battery the value is the SOC in % (5–100), scale 1. The unit depends on the battery type (holding 39) and can''t be expressed here: the non-lithium reading is given.', conflicts: [{sources: [growatt-modbustcp], label: bat_low_to_uti}]}
  - {key: x.ac_charge_current, label: ACChargeCurr, table: holding, address: 38, type: u16, unit: A, writable: true, min: 0, max: 400, poll: slow, note: Default 30.}
  - {key: x.battery_type, label: Battery Type, table: holding, address: 39, type: u16, enum: battery_type, writable: true, poll: slow, note: Only settable in standby.}
  - {key: x.dtc, label: DTC (device type code), table: holding, address: 43, type: u16, poll: slow}
  - {key: x.system_time, label: Sys Year…Sec (system time), table: holding, address: 45, type: datetime, length: 6, datetime: {year: {register: 0, offset: 2000}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, writable: true, poll: slow}
  - {key: x.manufacturer, label: Manufacturer Info 8…1, table: holding, address: 59, type: str, length: 8, poll: slow}
  - {key: x.modbus_version, label: ModbusVersion, table: holding, address: 73, type: u16, poll: slow, note: 207 = V2.07.}
  - {key: x.rated_power, label: Rate Watt H/L (rated active power), table: holding, address: 76, type: u32, unit: W, scale: 0.1, poll: slow}
  - {key: x.rated_apparent_power, label: Rate VA H/L (rated apparent power), table: holding, address: 78, type: u32, unit: VA, scale: 0.1, poll: slow}
  - {key: x.bat_low_cutoff, label: wBatLowCutOff (battery low cut-off), table: holding, address: 82, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, verified: false, note: Same unit rule as holding 37 (SOC in % for lithium). The W column is empty in the document; writable assumed., conflicts: [{sources: [growatt-modbustcp], label: bat_low_cutoff}]}
  - {key: x.gen_charge_current, label: MaxGenChgCurr (maximum generator charge current), table: holding, address: 83, type: u16, unit: A, writable: true, min: 0, max: 400, poll: slow, verified: false, note: The W column is empty in the document; writable assumed.}
  - {key: x.ac_to_bat_volt, label: uwAC2BatVolt (switch from AC back to battery at), table: holding, address: 95, type: u16, unit: V, scale: 0.1, writable: true, poll: slow, verified: false, note: Same unit rule as holding 37 (SOC in % for lithium). The W column is empty in the document; writable assumed., conflicts: [{sources: [growatt-modbustcp], label: ac_to_bat_volt}]}
  - {key: x.fault_restart_enable, label: uwFaultResartEn, table: holding, address: 114, type: u16, enum: enable, poll: slow}
  # Holding: grid feed (SPE models)
  - {key: x.feed_enable, label: uwFeedEn (grid feed enable), table: holding, address: 115, type: u16, enum: enable, poll: slow}
  - {key: x.load_first, label: uwLoadFirst (load first or charge first), table: holding, address: 116, type: u16, enum: load_first, poll: slow}
  - {key: x.feed_range, label: uwFeedRange, table: holding, address: 117, type: u16, enum: feed_range, poll: slow}
  - {key: x.battery_feed_enable, label: uwBatFeedEn (battery feed enable), table: holding, address: 118, type: u16, enum: enable, poll: slow}
  - {key: x.feed_power_limit, label: uwFeedPow (feed power limit), table: holding, address: 119, type: u16, unit: W, scale: 100, poll: slow, note: 0–12.0 kW in 0.1 kW.}
  - {key: x.battery_feed_current, label: uwBatFeedCurr (battery feed current), table: holding, address: 120, type: u16, unit: A, poll: slow}
  - {key: x.battery_feed_volt_loss, label: uwBatFeedVLoss (battery feed stop voltage), table: holding, address: 121, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.battery_feed_volt_back, label: uwBatFeedVBack (battery feed resume voltage), table: holding, address: 122, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.battery_feed_soc_loss, label: uwBatFeedSocLoss (battery feed stop SOC), table: holding, address: 123, type: u16, unit: '%', poll: slow}
  - {key: x.battery_feed_soc_back, label: uwBatFeedSocBack (battery feed resume SOC), table: holding, address: 124, type: u16, unit: '%', poll: slow}
  - {key: x.max_gen_run_time, label: MaxGenRunTime, table: holding, address: 137, type: u16, unit: h, poll: slow}
  - {key: x.shaving_power, label: ShavingPow (grid peak-shaving power), table: holding, address: 157, type: u16, unit: W, scale: 100, poll: slow}
  - {key: x.export_limit_power, label: ExpLimPow (export limit power), table: holding, address: 158, type: u16, unit: W, scale: 100, poll: slow}
  - {key: x.typical_setup, label: TypicalSet, table: holding, address: 159, type: u16, enum: typical_setup, poll: slow}
  - {key: x.serial_new, label: uwNewSerNum15…1 (new serial number), table: holding, address: 209, type: str, length: 15, poll: slow, optional: true, verified: false, note: 30 characters; which models fill it isn't stated. Register order (15 first) as for holding 23.}

  # Input: live values
  - {key: state, label: System Status, table: input, address: 0, type: u16, enum: system_status}
  - {key: x.pv1_voltage, label: Vpv1, table: input, address: 1, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: Vpv2, table: input, address: 2, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_power, label: Ppv1 H/L (PV1 charge power), table: input, address: 3, type: u32, unit: W, scale: 0.1}
  - {key: x.pv2_power, label: Ppv2 H/L (PV2 charge power), table: input, address: 5, type: u32, unit: W, scale: 0.1}
  - {key: x.pv1_current, label: Buck1Curr / Pv1Curr, table: input, address: 7, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_current, label: Buck2Curr / Pv2Curr, table: input, address: 8, type: u16, unit: A, scale: 0.1}
  - {key: load_power, label: OP_Watt H/L (output active power), table: input, address: 9, type: u32, unit: W, scale: 0.1}
  - {key: x.output_apparent_power, label: OP_VA H/L (output apparent power), table: input, address: 11, type: u32, unit: VA, scale: 0.1}
  - {key: x.ac_charge_power, label: ACChr_Watt H/L (AC charge power), table: input, address: 13, type: u32, unit: W, scale: 0.1}
  - {key: x.ac_charge_apparent_power, label: ACChr_VA H/L, table: input, address: 15, type: u32, unit: VA, scale: 0.1}
  - {key: battery_voltage, label: Bat Volt (M3), table: input, address: 17, type: u16, unit: V, scale: 0.01}
  - {key: battery_soc, label: BatterySOC, table: input, address: 18, type: u16, unit: '%'}
  - {key: x.bus_voltage, label: Bus Volt (inverter bus total voltage), table: input, address: 19, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_voltage, label: Grid Volt (AC input voltage), table: input, address: 20, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: Line Freq (AC input frequency), table: input, address: 21, type: u16, unit: Hz, scale: 0.01}
  - {key: x.output_voltage, label: OutputVolt (AC output voltage), table: input, address: 22, type: u16, unit: V, scale: 0.1}
  - {key: x.output_frequency, label: OutputFreq (AC output frequency), table: input, address: 23, type: u16, unit: Hz, scale: 0.01}
  - {key: x.output_dc_voltage, label: Ouput DCV, table: input, address: 24, type: u16, unit: V, scale: 0.1}
  - {key: temperature, label: InvTemp, table: input, address: 25, type: s16, unit: °C, scale: 0.1}
  - {key: x.dcdc_temperature, label: DcDc Temp, table: input, address: 26, type: s16, unit: °C, scale: 0.1}
  - {key: x.load_percent, label: LoadPercent, table: input, address: 27, type: u16, unit: '%', scale: 0.1}
  - {key: x.battery_port_voltage, label: 'Bat_s_Volt (battery port voltage, DSP)', table: input, address: 28, type: u16, unit: V, scale: 0.01}
  - {key: x.battery_bus_voltage, label: 'Bat_Volt_DSP (battery bus voltage, DSP)', table: input, address: 29, type: u16, unit: V, scale: 0.01}
  - {key: x.work_time_total, label: Time total H/L, table: input, address: 30, type: u32, unit: s, scale: 0.5, poll: slow}
  - {key: x.buck1_temperature, label: Buck1_NTC, table: input, address: 32, type: s16, unit: °C, scale: 0.1}
  - {key: x.buck2_temperature, label: Buck2_NTC, table: input, address: 33, type: s16, unit: °C, scale: 0.1}
  - {key: x.output_current, label: OP_Curr (output current), table: input, address: 34, type: u16, unit: A, scale: 0.1}
