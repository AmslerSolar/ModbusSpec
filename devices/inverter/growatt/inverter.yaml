notes:
- 'Families and register groups (from the document''s scope): MIN TL-X / TL-XH / TL-XH US and MOD TL3-XH read input 3000–3249
  and holding 0–124 / 3000+; TL3-X (MAX, MID, MAC), MAX 1500V / MAX-X LV and WIT TL3 read input 0–124 (and 125–249, not taken
  here); SPH / MIX storage read input 0–124 and 1000–1124; SPA reads input 1000–1124 and 2000–2124 (no input 0–124). The models
  are told apart by which input group answers (3000, then 2000, then 1000, then 0); this order is derived from the scope table,
  not stated by the document, and not checked on a device.'
- The document gives no DTC table for current products (holding 43; the V1.13 table only covers the old numbering), so the
  models are not matched by DTC. The VPP DTC table (holding 30000) is in growatt-tl-x / growatt-sph.
- 'Protocol: Modbus RTU on RS485, 9600 bps by default (38400 selectable in holding 22), 8 data bits, no parity, 1 stop bit;
  unit id 1–254 (holding 30, default 1). At most 125 registers per read; wait at least 850 ms between requests (1 s suggested).
  A read that crosses a group boundary (0–124, 125–249, …, 1000–1124, 1125–1249, 2000–2124, 3000–3124, 3125–3249, …) is answered
  with exception 2. Addresses are the register numbers of the tables, sent as they are (0-based; no 3xxxx/4xxxx offset).'
- 32-bit values are two registers, high word first (the tables list "H" before "L"). The document calls every register an
  unsigned 16-bit integer and gives no signs; temperatures, reactive power and battery current are read as signed here (unverified).
- 'No register is a signed grid or battery power: the document gives separate "to user" (from the grid) and "to grid" powers,
  and separate charge and discharge powers; grid_power and battery_power are derived from them.'
- 'Codes and fault bits: the fault-code table for input 105 and the hybrid system fault words (input 1001–1008) come from
  V1.13; V1.24 and V1.39 refer to them without repeating them. V1.39 changed input 106–111 (V1.13 had fault and warning bit
  codes there); the V1.39 meaning is used. The TL-X fault and warning codes (3105–3108) have no table.'
- Older editions (V1.20) have input 3019–3022 (system output power, reactive power), 3083 (PV energy today), 3121–3124 (self-use
  power, system energy today), 3137 (system energy total) and 3165 (battery derating mode) as reserved, and end the TL-X BMS
  block at 3229 (no 3230 / 3231 cell voltages).
- 'Left out: grid-code / protection settings (holding 52–117, 125+), time-of-use tables (holding 1017–1119, 3038–3059), PID
  and PV9–16 data (input 125–249, 875–999), SPA extra-inverter registers, APX battery (holding 5400+, input 5080+), backup
  box (input 3250+), business storage (holding 875–999, input 8000+), and the meter data read with function code 0x20.'
- Models gen4_x1_hybrid_mppt4, gen4_x3_hybrid, gen4_x3_hybrid_mppt3, gen3_x1_hybrid, spf_x1_hybrid, gen3_x1_ac, gen4_x1_pv,
  gen4_x1_pv_mppt3, gen2_x3_pv, gen3_x1_pv, gen_x1_pv, gen_x3_pv, gen2_x3_pv_mppt4, gen3_x3_hybrid come from projects and
  are listed after a model without a match, so detection never reaches them; their points apply only when a reader selects
  such a model by hand.
- Identification as solax-modbus recognises the device (not checked against a document).
- 'Left out: PV Input Mode (holding 7, u16) from solax-modbus overlaps x.normal_power from the documents.'
- 'Left out: firmware_control_version_number (holding 14, u16) from solax-modbus overlaps x.control_firmware from the documents.'
- 'Left out: Max AC Charge Current (holding 38, u16) from solax-modbus overlaps x.manufacturer from the documents.'
- 'Left out: Battery Type (holding 39, u16) from solax-modbus overlaps x.manufacturer from the documents.'
- 'Model detection: the identifier at holding registers 3001, 209, 23 (tried in turn) is compared with a table of serial prefixes;
  if none fits, register 9 (firmware) is compared with a table of firmware prefixes, then with the serial prefixes. Model
  matches only use the first serial register.'
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
