models:
  - {id: tl_x, name: 'MIN TL-X / TL-XH / TL-XH US, MOD TL3-XH (input group 3000)', match: {table: input, address: 3000, type: u16, answers: true}}
  - {id: spa, name: SPA storage (input groups 1000 and 2000), match: {table: input, address: 2000, type: u16, answers: true}}
  - {id: storage, name: SPH / MIX storage (input groups 0 and 1000), match: {table: input, address: 1000, type: u16, answers: true}}
  - {id: tl3, name: 'TL3-X (MAX, MID, MAC), WIT TL3 and other inverters (input group 0)', match: {table: input, address: 0, type: u16, answers: true}}
  - {id: gen4_x1_hybrid_mppt3, name: GEN4 | X1 | HYBRID | MPPT3 (prefix JGQ*), match: {table: holding, address: 3001, type: str, length: 5, prefix: JGQ}}
  - {id: gen4_x3_hybrid_mppt3_apx_bms_input_tss_bms_input, name: GEN4 | X3 | HYBRID | MPPT3 | APX_BMS_INPUT | TSS_BMS_INPUT (prefix TSS*), match: {table: holding, address: 3001, type: str, length: 5, prefix: TSS}}
  - {id: gen4_x3_hybrid_mppt3_apx_bms_input, name: GEN4 | X3 | HYBRID | MPPT3 | APX_BMS_INPUT (prefix DLP*), match: {table: holding, address: 3001, type: str, length: 5, prefix: DLP}}
  - {id: gen4_x3_hybrid_mppt10, name: GEN4 | X3 | HYBRID | MPPT10 (prefix 0PH*), match: {table: holding, address: 3001, type: str, length: 5, prefix: 0PH}}
  - {id: gen4_x3_pv, name: GEN4 | X3 | PV (prefix GXF*), match: {table: holding, address: 3001, type: str, length: 5, prefix: GXF}}
  - {id: gen4_x3_pv_mppt6, name: GEN4 | X3 | PV | MPPT6 (prefix NAH*), match: {table: holding, address: 3001, type: str, length: 5, prefix: NAH}}
  - {id: gen3_x3_pv, name: GEN3 | X3 | PV (prefix EKK*), match: {table: holding, address: 3001, type: str, length: 5, prefix: EKK}}
  - {id: gen4_x1_hybrid, name: 'GEN4 | X1 | HYBRID (prefix ABJ*, SKL*, XVM*, HJU*, XHL*, MFK*)'}
  - {id: gen4_x1_hybrid_apx_bms_input, name: GEN4 | X1 | HYBRID | APX_BMS_INPUT (prefix AL1* at firmware)}
  - {id: gen4_x1_hybrid_mppt4, name: 'GEN4 | X1 | HYBRID | MPPT4 (prefix SMN*, VFJ*)'}
  - {id: gen4_x3_hybrid, name: 'GEN4 | X3 | HYBRID (prefix DPS*, PYL*, JCM*, MEK*, DFK*, KLN*, KMN*, FMP*, FPP*, FQP*, CZM*, 0PE*, 0PC*, 0HU*, DN1* at firmware, V* at firmware)'}
  - {id: gen4_x3_hybrid_mppt3, name: 'GEN4 | X3 | HYBRID | MPPT3 (prefix DMS*, DKS*, DO1*, TTS*, EGR*, KNN*, RKM*)'}
  - {id: gen3_x1_hybrid, name: 'GEN3 | X1 | HYBRID (prefix YRP*, RAA* at firmware, RA1* at firmware)'}
  - {id: spf_x1_hybrid, name: 'SPF | X1 | HYBRID (prefix NFR*, YRE*, TTJ*, BNJ*, KAM*, NUK*, 067* at firmware, 113* at firmware, 500* at firmware, 040* at firmware)'}
  - {id: gen3_x1_ac, name: 'GEN3 | X1 | AC (prefix WPD*, RH1* at firmware)'}
  - {id: gen4_x1_pv, name: 'GEN4 | X1 | PV (prefix FPH*, FWJ*, QYL*, XTD*, BDK*, DCF*, AJ1* at firmware, GH1* at firmware, AK1* at firmware)'}
  - {id: gen4_x1_pv_mppt3, name: 'GEN4 | X1 | PV | MPPT3 (prefix WVN*, AM1* at firmware)'}
  - {id: gen2_x3_pv, name: 'GEN2 | X3 | PV (prefix RDH*, QEH*, RPH*, SZG*, TJ1* at firmware, DL1* at firmware)'}
  - {id: gen3_x1_pv, name: 'GEN3 | X1 | PV (prefix DIE*, PYH*, NLC*, NRC*, AH1* at firmware)'}
  - {id: gen_x1_pv, name: 'GEN | X1 | PV (prefix BZP*, QNB*, QMB*, JLE*, 4FZ*, BY3*)'}
  - {id: gen_x3_pv, name: 'GEN | X3 | PV (prefix MVC*, dha* at firmware)'}
  - {id: gen2_x3_pv_mppt4, name: GEN2 | X3 | PV | MPPT4 (prefix DM1* at firmware)}
  - {id: gen3_x3_hybrid, name: 'GEN3 | X3 | HYBRID (prefix SPH* at firmware, YA1* at firmware)'}

points:
  # Holding, first group (0–124): every family
  - {key: x.remote_onoff, label: OnOff (remote on/off), table: holding, address: 0, type: u16, enum: on_off, writable: true, poll: slow}
  - {key: x.active_power_rate, label: Active Power Rate, table: holding, address: 3, type: u16, unit: '%', writable: true, poll: slow, note: 0–100; 255 = not limited., conflicts: [{sources: [solax-modbus], label: active_power_limit}]}
  - {key: x.reactive_power_rate, label: Reactive Power Rate, table: holding, address: 4, type: s16, unit: '%', writable: true, poll: slow, note: −100…100; 255 = not limited., conflicts: [{sources: [solax-modbus], label: reactive_power_limit}]}
  - {key: x.normal_power, label: Pmax (normal power), table: holding, address: 6, type: u32, unit: VA, scale: 0.1, poll: slow}
  - {key: firmware, label: Fw version, table: holding, address: 9, type: str, length: 3, poll: slow}
  - {key: x.control_firmware, label: Fw version2 (control firmware), table: holding, address: 12, type: str, length: 3, poll: slow, conflicts: [{sources: [solax-modbus], length: 2, label: firmware_control_version_ascii}]}
  - {key: x.baud_rate, label: Select Baud rate, table: holding, address: 22, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: serial, label: Serial NO (serial number 1–10), table: holding, address: 23, type: str, length: 5, models: [spa, storage, tl3], poll: slow}
  - {key: x.inverter_module, label: Module H/L (inverter model code), table: holding, address: 28, type: u32, poll: slow, note: 'Packed model code, one hex digit each for A, B, D, T, P, U, M, S (from the top nibble down), e.g. 0x1000F151.'}
  - {key: x.modbus_address, label: Com Address, table: holding, address: 30, type: u16, writable: true, min: 1, max: 254, poll: slow, note: Default 1.}
  - {key: x.manufacturer, label: Manufacturer Info 8…1, table: holding, address: 34, type: str, length: 8, poll: slow, conflicts: [{sources: [solax-modbus], type: u16, unit: A, models: [spf_x1_hybrid], label: Max Charge Current}]}
  - {key: x.dtc_code, label: DTC (device type code), table: holding, address: 43, type: u16, poll: slow, note: 'The document gives no table for the current models; V1.13 only lists the old scheme (e.g. 001xx = 1 tracker, single-phase TL).'}
  - {key: x.tracker_phase_num, label: TP (input tracker and output phase number), table: holding, address: 44, type: u16, poll: slow, note: 'High byte = MPPT trackers, low byte = output phases (0x0203 = two trackers, three-phase).'}
  - {key: x.modbus_version, label: Modbus Version, table: holding, address: 88, type: u16, poll: slow, note: 207 = V2.07.}
  - {key: x.export_limit_mode, label: ExportLimit_En/dis, table: holding, address: 122, type: u16, enum: export_limit_mode, writable: true, poll: slow}
  - {key: x.export_limit_rate, label: ExportLimitPowerRate, table: holding, address: 123, type: s16, unit: '%', scale: 0.1, writable: true, min: -100, max: 100, poll: slow, conflicts: [{sources: [solax-modbus], models: [gen4_x1_hybrid_mppt3, gen4_x3_hybrid_mppt3_apx_bms_input_tss_bms_input, gen4_x3_hybrid_mppt3_apx_bms_input, gen4_x3_hybrid_mppt10, gen4_x3_pv, gen4_x3_pv_mppt6, gen4_x1_hybrid, gen4_x1_hybrid_mppt4, gen4_x3_hybrid, gen4_x3_hybrid_mppt3, gen3_x1_hybrid, gen3_x1_ac, gen4_x1_pv, gen4_x1_pv_mppt3, gen2_x3_pv, gen3_x1_pv, gen2_x3_pv_mppt4, gen3_x3_hybrid], label: grid_export_limit}]}

  # Holding, storage group (1000–1124; SPH / MIX / SPA)
  - {key: x.priority_setting, label: Priority (load / battery / grid first), table: holding, address: 1044, type: u16, enum: priority, models: [spa, storage], poll: slow}
  - {key: x.grid_first_discharge_rate, label: GridFirstDischargePowerRate, table: holding, address: 1070, type: u16, unit: '%', models: [spa, storage], writable: true, min: 0, max: 100, poll: slow}
  - {key: x.grid_first_stop_soc, label: GridFirstStopSOC, table: holding, address: 1071, type: u16, unit: '%', models: [spa, storage], writable: true, min: 0, max: 100, poll: slow}
  - {key: x.bat_first_charge_rate, label: BatFirstPowerRate, table: holding, address: 1090, type: u16, unit: '%', models: [spa, storage], writable: true, min: 0, max: 100, poll: slow}
  - {key: x.bat_first_stop_soc, label: wBatFirst stop SOC, table: holding, address: 1091, type: u16, unit: '%', models: [spa, storage], writable: true, min: 0, max: 100, poll: slow}
  - {key: x.ac_charge_enable, label: AC charge Switch (when battery first), table: holding, address: 1092, type: u16, enum: enable, models: [spa, storage], writable: true, poll: slow}

  # Holding, TL-X group (3000–3124)
  - {key: serial, label: New Serial NO (serial number 1–30), table: holding, address: 3001, type: str, length: 15, models: [tl_x], poll: slow}
  - {key: x.grid_first_discharge_rate, label: GridFirstDischargePowerRate, table: holding, address: 3036, type: u16, unit: '%', models: [tl_x], writable: true, min: 1, max: 255, poll: slow}
  - {key: x.grid_first_stop_soc, label: GridFirstStopSOC, table: holding, address: 3037, type: u16, unit: '%', models: [tl_x], writable: true, min: 1, max: 100, poll: slow}
  - {key: x.bat_first_charge_rate, label: BatFirstPowerRate, table: holding, address: 3047, type: u16, unit: '%', models: [tl_x], writable: true, min: 1, max: 100, poll: slow, note: 'The R/W column is empty in the document, writable assumed.', verified: false}
  - {key: x.bat_first_stop_soc, label: wBatFirst stop SOC, table: holding, address: 3048, type: u16, unit: '%', models: [tl_x], writable: true, min: 1, max: 100, poll: slow, note: 'The R/W column is empty in the document, writable assumed.', verified: false}
  - {key: x.ac_charge_enable, label: AcChargeEnable, table: holding, address: 3049, type: u16, enum: enable, models: [tl_x], writable: true, poll: slow, note: 'The R/W column is empty in the document, writable assumed.', verified: false}
  - {key: x.battery_type, label: BatteryType (buck-boost input), table: holding, address: 3070, type: u16, enum: battery_type_tlx, models: [tl_x], writable: true, poll: slow}

  # Input, first group (0–124): TL3-X / MAX / MID / MAC, WIT, SPH / MIX
