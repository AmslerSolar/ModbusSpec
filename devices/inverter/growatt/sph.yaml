connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 50

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 30001
    type: str
    length: 15
  checks:
  - table: holding
    address: 30000
    type: u16
    in:
    - 3501
    - 3502
    - 3503
    - 3504
    - 3701
    - 3715
    - 3716
    - 3735
    - 3601
    - 3725

