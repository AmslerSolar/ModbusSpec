notes:
- 'The VPP map is the same for every family in its DTC table (V2.03: SPH/SPA 3501–3504, 3601, 3701, 3715, 3716, 3725, 3735;
  MIN-XH 5100; MOD/MID-XH 5400, MOD/MID-HU 5401; WIT/WIS 5600, 5601, 5800, 5801; MIC/MIN-X 5200, 5201; MOD/MID/MAC-X 5001–5003;
  MAX 5000, 5500–5502). MIN-X, MOD/MID/MAC-X and MAX use no battery or storage registers. The projects split these families
  over growatt-tl-x, growatt-sph, growatt-wit and growatt-legacy; this file covers only the VPP models kept in growatt-wit,
  under the projects'' model ids. The same map is in growatt-tl-x (and the other growatt files) unchanged.'
- 'Models: V2.03''s DTC table gives 5600 (WIT 50-100K-H/HE/HU/A/AE/AU and -US, WIT 28-55K-…-US L2, WIS 100K-AM), 5601 (WIT29.9-50K-XHU),
  5800 (WIS 210K) and 5801 (WIS 215K-AM). Older editions (V2.01) listed only 5601 as WIT 100KTL3-H and 5800 as WIS 215KTL3.
  The project''s other DTCs (5603, 5604, 5605) are not in the document; its WIT 4-15 kW profile has no DTC there and gets
  the same registers.'
- 'Protocol: Modbus RTU on the inverter''s RS485 port, 9600 bps by default (38400 selectable, see 30113), 1 start, 8 data
  and 1 stop bit; the unit id is the mailing address 30112 (default 1). It can be reached through an RS485-to-TCP gateway
  (port 502 there); local Modbus TCP on dongles is not covered by the document.'
- Identification and ratings are holding registers (FC 03), live values input registers (FC 04). Register numbers are sent
  as they are (no offset; the document shows none, not checked on a device).
- 'A request must stay inside one of the document''s register groups (30000–30099, 30100–30149, 31000–31009, 31010–31099,
  31100–31199, one block per battery 31200/31300/31400/31500, …): reading across a group boundary answers exception 2. Whether
  the reserved registers inside a group (e.g. 31042–31057) may be read together with their neighbours on every family is not
  stated.'
- 'Signs as the device sends them: 31100 active power positive = export to grid; 31112 meter power positive = import from
  grid; 31200 battery power and 31215 battery current positive = charging. All from the document.'
- 32-bit values are high word first; 31058, 31100, 31102, 31112, 31200 and 31215 are signed (INT32), the energies, ratings
  and FCC unsigned.
- 'Batteries: up to four blocks (31200, 31300, 31400, 31500) with the same layout; a block that answers exception 2 or holds
  only zeros is an empty slot. MIC/MIN TL-X (DTC 5200/5201) use no battery registers at all (30300–30499, 31200–31599). For
  totals, sum the blocks'' power and weight their SOC by FCC.'
- 'Version differences: V2.03 adds bypass (9) to the on/off command 30101, describes working states 5–8 as on-grid (5, 6)
  and off-grid (7, 8), renames country 12 (SA_IEC62116&61727, Hungary) and adds countries 61–92. Older editions (V2.01) call
  12 SA_HUNGARY and end the country table at 60.'
- 'Left out: the other control settings in 30100–30499 (clock, power and reactive power, export limitation, EPS, battery charge
  / discharge and time-of-use; V2.03 changes some ranges there: 30160 up to 70 %, 30162 default 20000, stop SOCs 30404–30406
  and 30475 10–100 %, 30410 adds AC-only charging), the areas V2.03 adds (on/off-grid switching and per-phase power 30209–30215,
  diesel generator 30250–30255, peak shaving 30301–30305, time-of-use default mode and reset 30476–30477) and the safety parameters
  30500–30999.'
- No register gives home consumption or PV yield; home consumption is derived from the power balance.
- 'Left out: battery_temp_vpp_alt (input 31222, s16) from growatt-modbustcp overlaps x.battery_remaining_capacity from the
  documents.'
- Protocol II inverter range plus the WIT range from 8000 and the VPP protocol ranges at 30000 / 31000.
- Models are matched by the device type code in holding 30000 as the project assigns them; the project marks many of these
  assignments as not yet confirmed on a device.
- Identification as growatt-modbustcp recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
