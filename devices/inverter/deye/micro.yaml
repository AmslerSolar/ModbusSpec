notes:
- RS485 / RS232, 9600 Bd 8N1; functions 03 (read, at most 125 registers) and 10 (write, at most 123). The document is for
  RTU only; the unit id is settable 1–247 (register 1), 1 is assumed as default. Data loggers that wrap Modbus RTU in their
  own TCP protocol are not described here.
- Addresses are the document's register numbers, used as 0-based protocol addresses (its example reads register 107 with start
  address 0x006B). All registers are holding registers (function 03).
- 32-bit values are listed low word first (word_order little); the document marks no 32-bit value as signed except where noted.
- Reserved and unsupported registers read 0.
- 'The document is one map for string, micro and single-phase storage inverters: registers 59…124 have a different meaning
  per kind (columns ''String'', ''Hybird'', ''MI''), and 150…218 differ between string and storage inverters. Register 0 tells
  the kind.'
- The microinverter rows of 59…124 are those the document marks 'MI'. Module totals 69/70, 71/72, 74/75 and 77/78 are low
  word / high word pairs (register 73 is the grid voltage, 76 the grid current). Grid voltage and current (73, 76) are taken
  from the string-inverter rows the document marks as also used by microinverters.
- Microinverters with two modules don't have modules / DC inputs 3 and 4.
- The fault code table at the end of the document is shared by all inverter kinds; several codes only occur on storage inverters.
- 'Left out: grid protection limits, power factor regulation and the other settings in 20…58.'
- 'Left out: Device Phases (holding 18, u16) from solarman overlaps x.phase_count from the documents.'
- 'Left out: Device MPPTs (holding 18, u16) from solarman overlaps x.mppt_count from the documents.'
- 'evcc template `deye-mi` (pv) lists: Deye Micro inverter; Bosswerk Micro inverter; Anker Micro inverter; Sunsynk Micro inverter.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- The project picks this map when Deye's device type (holding register 0) is one of 0x0004, 0x0400.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
