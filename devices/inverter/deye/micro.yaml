  - {key: x.pv3_current, label: Dc current 3, table: holding, address: 114, type: u16, unit: A, scale: 0.1, optional: true}
  - {key: x.pv4_voltage, label: Dc voltage 4, table: holding, address: 115, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: x.pv4_current, label: Dc current 4, table: holding, address: 116, type: u16, unit: A, scale: 0.1, optional: true}
  - {key: x.device_modbus_address, label: Device Modbus Address, table: holding, address: 1, type: u16, verified: false, sources: [solarman]}
  - {key: x.device_chip_type, label: Device Chip Type, table: holding, address: 9, type: u16, enum: device_chip_type, verified: false, sources: [solarman]}
