  - {when: {key: x.alarm_word_1, bit: 3}, kind: warning, text: W04 Meter communication failure}
  - {when: {key: x.fault_word_1, bit: 6}, kind: fault, text: F07 DC/DC soft start fault}
  - {when: {key: x.fault_word_1, bit: 9}, kind: fault, text: F10 Auxiliary power supply failure}
