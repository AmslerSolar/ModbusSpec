  - {key: x.device_chip_type, label: Device Chip Type, table: holding, address: 9, type: u16, enum: device_chip_type, verified: false, sources: [solarman]}
  - {key: x.device_communication_board_firmware_version_2, label: Device Communication Board Firmware Version (2), table: holding, address: 10, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.device_control_board_firmware_version_3, label: Device Control Board Firmware Version (3), table: holding, address: 11, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.device_control_board_firmware_version_2, label: Device Control Board Firmware Version (2), table: holding, address: 12, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.self_check_time, label: Self-check time, table: holding, address: 21, type: u16, unit: s, writable: true, note: The project ignores raw values outside 0–1000., verified: false, sources: [solarman]}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 184, type: s16, unit: '%', verified: false, sources: [openwb]}
  - {key: x.inverter_power_186, label: Inverter power (part), table: holding, address: 186, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling)., verified: false, sources: [openwb]}
  - {key: x.inverter_power_187, label: Inverter power (part), table: holding, address: 187, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling)., verified: false, sources: [openwb]}
  - {key: x.inverter_power_188, label: Inverter power (part), table: holding, address: 188, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling)., verified: false, sources: [openwb]}
  - {key: x.inverter_power_189, label: Inverter power (part), table: holding, address: 189, type: s16, unit: W, note: Raw > 0 = generation (openWB's sign handling)., verified: false, sources: [openwb]}
  - {key: battery_power, label: Battery power, table: holding, address: 190, type: s16, unit: W, positive: discharge, verified: false, sources: [openwb]}

derived:
