enums:
  device_type: {'512': String inverter, '768': Single-phase low-voltage storage inverter, '1024': Microinverter, '1280': Three-phase low-voltage storage inverter, '1536': Three-phase high-voltage storage inverter}
  rated_power_class: {'2': Single-phase inverter, '3': Three-phase inverter, '8': Single-phase storage inverter}
  run_state: {'0': Standby, '1': Self-check, '2': Normal, '3': Alarm, '4': Fault}
  on_off: {'0': 'Off', '1': 'On', '2': 'Off'}
  device_chip_type: {'0': AT32F403A, '1': SXX32F103, '2': GD32F103, '3': GD32F303}

flags:
  alarm_word_1: {'1': W02 Fan warning, '2': W03 Grid phase wrong, '3': W04 Meter communication failure}
  fault_word_1: {'6': F07 DC/DC soft start fault, '9': F10 Auxiliary power supply failure, '12': F13 Working mode changed}
  fault_word_2: {'0': F17 Active battery hold, '1': F18 AC overcurrent (hardware), '3': F20 DC overcurrent (hardware), '5': F22 Emergency stop (inverter locked), '6': F23 AC leakage current transient overcurrent, '7': F24 DC insulation impedance failure, '8': F25 AC active battery fault, '9': F26 DC bus unbalanced, '12': F29 Parallel CAN bus fault, '14': F31 Soft start failed}
  fault_word_3: {'2': F35 No AC grid, '4': F37 DC LLC soft overcurrent, '6': F39 DC LLC overcurrent, '7': F40 Battery overcurrent, '8': F41 Parallel system stop, '9': F42 AC line voltage low, '13': F46 Backup battery fault, '14': F47 AC over frequency, '15': F48 AC under frequency}
  fault_word_4: {'0': F49 Backup battery fault, '7': F56 DC bus voltage low, '9': F58 BMS communication fault, '11': F60 Generator voltage or frequency fault, '12': F61 Switched off by button, '14': F63 Arc fault, '15': F64 Heat sink temperature too high}

problems:
