  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/deye_p3.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: holding
    address: 3
    type: str
    length: 5
  checks:
  - table: holding
    address: 0
    type: u16
    in:
    - 1280
    - 1536
    - 1537
    - 5
    - 6

models:
  - {id: lv, name: Low-voltage battery (three-phase LV hybrid), match: {table: holding, address: 0, type: u16, in: [1280, 5]}}
  - {id: hv, name: High-voltage battery (three-phase HV hybrid), match: {table: holding, address: 0, type: u16, in: [1536, 1537, 6]}}
  - {id: solarman_sg0_lp3, name: SG0*LP3, match: {table: holding, address: 0, type: u16, in: [5, 1280]}}
  - {id: solarman_sg0_hp3, name: SG0*HP3, match: {table: holding, address: 0, type: u16, in: [6, 7, 8, 1536, 1537]}}

points:
  # Fixed attributes (0…59)
  - {key: x.device_type, label: Device type, table: holding, address: 0, type: u16, enum: device_type, poll: slow, conflicts: [{sources: [openwb], type: s16, label: Inverter device type}]}
  - {key: x.protocol_version, label: Communication protocol version, table: holding, address: 2, type: u16, poll: slow, note: 0x0102 = version 1.2.}
  - {key: serial, label: SN byte 01…10, table: holding, address: 3, type: str, length: 5, poll: slow}
  - {key: firmware, label: Control panel firmware master version, table: holding, address: 15, type: u16, poll: slow, note: 'Bits 12–15 release (F = internal test build), bits 0–11 serial number of the version.'}
  - {key: x.comm_firmware, label: Comm panel firmware master version, table: holding, address: 18, type: u16, poll: slow}
  - {key: x.rated_power, label: Rated power, table: holding, address: 20, type: u32, unit: W, scale: 0.1, poll: slow, conflicts: [{sources: [solarman], type: s32, label: Device Rated Power}]}
  - {key: x.mppt_count, label: MPPT number, table: holding, address: 22, type: u16, bits: [8, 15], poll: slow, note: '0x0503 = five MPPTs, three-phase: high byte MPPTs, low byte phases.', verified: false}
  - {key: x.phase_count, label: Phases, table: holding, address: 22, type: u16, bits: [0, 7], poll: slow, note: See MPPT number., verified: false}
  - {key: x.battery_inputs, label: Battery input number, table: holding, address: 24, type: u16, poll: slow, note: '0 and 1 = one battery input, 2 = two.'}
  - {key: x.output_type, label: Three-phase or split-phase output, table: holding, address: 25, type: u16, enum: output_type, poll: slow}

  # Settings (60…499, function 10 to write)
  - {key: x.clock, label: System time, table: holding, address: 62, type: datetime, length: 3, datetime: {year: {register: 0, bits: [8, 15], offset: 2000}, month: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}, writable: true, note: 'Six bytes year (from 2000), month, day, hour, minute, second; byte 1 of each register taken as the high byte (not stated; assumed).', verified: false}
  - {key: x.active_power_regulation, label: Active-power regulation, table: holding, address: 77, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.on_off, label: Switch on and off enable, table: holding, address: 80, type: u16, enum: on_off, writable: true, poll: slow}
  - {key: x.battery_type, label: Control Mode (battery charge type), table: holding, address: 98, type: u16, enum: battery_type, writable: true, poll: slow}
  - {key: x.battery_capacity, label: Batt Capacity, table: holding, address: 102, type: u16, unit: Ah, writable: true, min: 0, max: 2000, poll: slow}
  - {key: x.battery_max_charge_current, label: Max A Charge, table: holding, address: 108, type: u16, unit: A, writable: true, min: 0, max: 185, poll: slow}
  - {key: x.battery_max_discharge_current, label: Max A discharge, table: holding, address: 109, type: u16, unit: A, writable: true, min: 0, max: 185, poll: slow}
  - {key: x.battery_mode, label: battery operates according to voltage or capacity, table: holding, address: 111, type: u16, enum: battery_mode, writable: true, poll: slow}
  - {key: x.battery_shutdown_soc, label: battery capacity ShutDown, table: holding, address: 115, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.battery_restart_soc, label: battery capacity Restart, table: holding, address: 116, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.battery_low_soc, label: battery capacity LowBatt, table: holding, address: 117, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.battery_shutdown_voltage, label: battery voltage ShutDown, table: holding, address: 118, type: u16, unit: V, scale: 0.01, writable: true, poll: slow, conflicts: [{sources: [solarman], scale: 0.1, models: [solarman_sg0_hp3], label: Battery Shutdown Voltage}]}
  - {key: x.battery_restart_voltage, label: battery voltage Restart, table: holding, address: 119, type: u16, unit: V, scale: 0.01, writable: true, poll: slow, conflicts: [{sources: [solarman], scale: 0.1, models: [solarman_sg0_hp3], label: Battery Restart Voltage}]}
  - {key: x.battery_low_voltage, label: battery voltage LowBatt, table: holding, address: 120, type: u16, unit: V, scale: 0.01, writable: true, poll: slow, conflicts: [{sources: [solarman], scale: 0.1, models: [solarman_sg0_hp3], label: Battery Low Voltage}]}
  - {key: x.grid_charge_current, label: Grid charge the battery current, table: holding, address: 128, type: u16, unit: A, writable: true, min: 0, max: 185, poll: slow}
  - {key: x.generator_charge_enable, label: Generator is charged to enable, table: holding, address: 129, type: u16, writable: true, poll: slow}
  - {key: x.grid_charge_enable, label: Grid is charged to enable, table: holding, address: 130, type: u16, writable: true, poll: slow}
  - {key: x.energy_management_mode, label: Energy management model, table: holding, address: 141, type: u16, bits: [0, 1], enum: energy_management_mode, writable: true, poll: slow}
  - {key: x.limit_control, label: limit control function, table: holding, address: 142, type: u16, enum: limit_control, writable: true, poll: slow}
  - {key: x.max_sell_power, label: Max sell Power, table: holding, address: 143, type: u16, unit: W, models: [lv], writable: true, poll: slow}
  - {key: x.max_sell_power, label: Max sell Power, table: holding, address: 143, type: u16, unit: W, scale: 10, models: [hv], writable: true, poll: slow}
  - {key: x.solar_sell, label: Solar sell, table: holding, address: 145, type: u16, enum: off_on, writable: true, poll: slow}
  - {key: x.time_of_use, label: Time of Use Selling enabled, table: holding, address: 146, type: u16, writable: true, poll: slow, note: 'Bit 0 enable, bits 1–7 Monday…Sunday, bit 8 Spain mode.'}
  - {key: x.force_off_grid, label: Force off-grid setting, table: holding, address: 179, type: u16, enum: force_off_grid, writable: true, poll: slow}
  - {key: x.grid_frequency_setting, label: Grid Frequency, table: holding, address: 183, type: u16, enum: grid_frequency, writable: true, poll: slow}
  - {key: x.grid_type, label: Grid Type, table: holding, address: 184, type: u16, enum: grid_type, writable: true, poll: slow, note: 'Only used when register 25 (output type) is 1 (split-phase); unused otherwise. Changed in V105 (2024-10-09): V105.1 and the SG01-HP3 edition list it as unused on three-phase units with 2 = split-phase.'}
  - {key: x.ev_off_grid_soc, label: EV_charge_mode (off-grid SOC), table: holding, address: 259, type: u16, bits: [8, 15], unit: '%', writable: true, poll: slow, optional: true, note: Added in V105 (2025-01-13).}
  - {key: x.ev_charge_mode, label: EV_charge_mode, table: holding, address: 259, type: u16, bits: [0, 7], flags: ev_charge_mode, writable: true, poll: slow, optional: true, note: Added in V105 (2025-01-13).}
  - {key: x.ev_max_charge_power, label: Max EV charge Power, table: holding, address: 260, type: u16, unit: W, scale: 10, writable: true, poll: slow, optional: true, note: Added in V105 (2025-01-13).}
  - {key: x.special_functions, label: Special function register, table: holding, address: 343, type: u16, writable: true, poll: slow, note: Bits 0–1 = 3 enables 0 ms switching; bits 2–3 Australian hard export limit; bits 4–7 customer-specific dry contact 1 functions. Redefined in V105 (2025-10-22); older editions mark it undefined or use it differently.}
  - {key: x.grid_check_source, label: Grid check from Meter or CT, table: holding, address: 344, type: u16, flags: grid_check_source, writable: true, poll: slow, note: 'Bit 0 clear = CT, set = meter.'}
  - {key: x.meter_maker, label: Meter manufacturer, table: holding, address: 345, type: u16, enum: meter_maker, writable: true, poll: slow}
  - {key: x.meter_limit_mode, label: Meter limit mode, table: holding, address: 346, type: u16, writable: true, poll: slow, note: 'Bit 0: 0 = average, 1 = minimum. Bits 8–9, 10–11, 12–13 = 2 (binary 10): external CT of phase A, B, C reversed.'}
  - {key: x.ct_ratio, label: CT ratio, table: holding, address: 347, type: u16, writable: true, poll: slow, note: '30 = 30:1.'}

  # Real-time data (500…)
  - {key: state, label: run state, table: holding, address: 500, type: u16, enum: run_state}
  - {key: x.energy_today, label: Active power generation of today (grid side), table: holding, address: 501, type: s16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_connected_time_today, label: Grid connection time of today, table: holding, address: 503, type: u16, unit: s, poll: slow}
  - {key: x.energy_total, label: Active power generation of total (grid side), table: holding, address: 504, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.generator_hours_total, label: Generator total working time, table: holding, address: 512, type: u32, unit: h, scale: 0.1, poll: slow}
  - {key: x.battery_charge_today, label: Daily charge of the battery, table: holding, address: 514, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_today, label: Daily discharge of the battery, table: holding, address: 515, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_charge_total, label: Total charge of the battery, table: holding, address: 516, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_total, label: Total discharge of the battery, table: holding, address: 518, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_import_today, label: Day_GridBuy_PowerWh, table: holding, address: 520, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_export_today, label: Day_GridSell_PowerWh, table: holding, address: 521, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: grid_import_energy, label: Total_GridBuy_PowerWh, table: holding, address: 522, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: grid_export_energy, label: Total_GridSell_PowerWh, table: holding, address: 524, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.load_energy_today, label: Day_Load_PowerWh, table: holding, address: 526, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.load_energy_total, label: Total_Load_PowerWh, table: holding, address: 527, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: pv_energy_today, label: Day_PV_PowerWh, table: holding, address: 529, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: pv_energy, label: Total PV_powerWh, table: holding, address: 534, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Marked 'reserved' in the document (but listed with unit); may read 0 on some firmware.}
  - {key: x.generator_energy_today, label: Generator energy today, table: holding, address: 536, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.generator_energy_total, label: Generator energy total, table: holding, address: 537, type: u32, unit: kWh, scale: 0.1, poll: slow, conflicts: [{sources: [evcc], type: s32, label: PV energy (part 2)}]}
  - {key: x.dc_transformer_temperature, label: DC transformer temperature, table: holding, address: 540, type: u16, unit: °C, scale: 0.1, offset: -100, conflicts: [{sources: [solarman], type: s16, label: DC Temperature}]}
  - {key: temperature, label: Heat sink temperature, table: holding, address: 541, type: u16, unit: °C, scale: 0.1, offset: -100, note: The offset of 1000 is given only for register 540; assumed here too., conflicts: [{sources: [solarman], type: s16, label: Temperature}], verified: false}
  - {key: x.load_energy_year, label: Yer_Loadwh, table: holding, address: 545, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.comm_board_fault, label: Failure status of communication board, table: holding, address: 548, type: u16, flags: comm_board_fault}
  - {key: x.switch_state, label: Turn off/on status, table: holding, address: 551, type: u16, bits: [0, 3], enum: off_on}
  - {key: x.relay_state, label: AC relay status, table: holding, address: 552, type: u16, flags: relay_state}
  - {key: x.alarm_word_1, label: Warning message word 1, table: holding, address: 553, type: u16, flags: alarm_word_1, note: The code tables don't give bit positions; code Wn / Fn is taken as bit n−1 counted across the words (the three-phase document's warning word 1 bit list agrees for W02 and W03). Not stated for the fault words; assumed., conflicts: [{sources: [solarman], type: u32, word_order: little, label: Device Alarm}], verified: false}
  - {key: x.alarm_word_2, label: Warning message word 2, table: holding, address: 554, type: u16, flags: alarm_word_2}
  - {key: x.fault_word_1, label: Fault information word 1, table: holding, address: 555, type: u16, flags: fault_word_1, note: 'Fault codes F01–F16 as bits 0–15 (assumed, see warning word 1).', conflicts: [{sources: [solarman], type: u64, word_order: little, label: Device Fault}], verified: false}
  - {key: x.fault_word_2, label: Fault information word 2, table: holding, address: 556, type: u16, flags: fault_word_2, note: 'Fault codes F17–F32 as bits 0–15 (assumed, see warning word 1).', verified: false}
  - {key: x.fault_word_3, label: Fault information word 3, table: holding, address: 557, type: u16, flags: fault_word_3, note: 'Fault codes F33–F48 as bits 0–15 (assumed, see warning word 1).', verified: false}
  - {key: x.fault_word_4, label: Fault information word 4, table: holding, address: 558, type: u16, flags: fault_word_4, note: 'Fault codes F49–F64 as bits 0–15 (assumed, see warning word 1).', verified: false}
  - {key: battery_temperature, label: Battery1 temperature, table: holding, address: 586, type: u16, unit: °C, scale: 0.1, offset: -100, note: Range 0…3000 at 0.1 °C; the offset of 1000 (as register 540) is assumed., verified: false}
  - {key: battery_voltage, label: Battery-1 voltage, table: holding, address: 587, type: u16, unit: V, scale: 0.01, models: [lv]}
  - {key: battery_voltage, label: Battery-1 voltage, table: holding, address: 587, type: u16, unit: V, scale: 0.1, models: [hv]}
  - {key: battery_soc, label: Battery-1 SOC, table: holding, address: 588, type: u16, unit: '%'}
  - {key: x.battery2_soc, label: Battery-2 SOC, table: holding, address: 589, type: u16, unit: '%', optional: true}
  - {key: battery_power, label: Battery output power, table: holding, address: 590, type: s16, unit: W, positive: discharge, models: [lv], note: Signed; direction not stated. 'Output' power taken as positive when discharging (assumed)., verified: false}
  - {key: battery_power, label: Battery output power, table: holding, address: 590, type: s16, unit: W, scale: 10, positive: discharge, models: [hv], note: As the LV reading (10 W steps)., verified: false}
  - {key: battery_current, label: Battery1 Current, table: holding, address: 591, type: s16, unit: A, scale: 0.01, positive: discharge, note: As battery output power (assumed)., verified: false}
  - {key: x.battery_corrected_capacity, label: Corrected_AH, table: holding, address: 592, type: u16, unit: Ah, poll: slow}
  - {key: x.battery2_voltage, label: Battery-2 voltage, table: holding, address: 593, type: u16, unit: V, scale: 0.1, models: [hv], optional: true, note: Second battery input (HV models with two inputs).}
  - {key: x.battery2_current, label: Battery2 Current, table: holding, address: 594, type: s16, unit: A, scale: 0.01, models: [hv], optional: true, note: No unit or type given; as battery 1 assumed., verified: false}
  - {key: x.battery2_power, label: Battery2 Power, table: holding, address: 595, type: s16, unit: W, scale: 10, models: [hv], optional: true, note: Signedness not stated; as battery 1 assumed., conflicts: [{sources: [evcc], scale: 1, label: Battery power}], verified: false}
  - {key: x.ct_self_test, label: CT self-test result, table: holding, address: 597, type: u16, flags: ct_self_test, poll: slow, note: 'Bits 3–5 phase-sequence result (as register 232). The document labels bits 6, 7 and 8 all ''phase A CT direction''; taken as phases A, B, C.'}
  - {key: l1_voltage, label: Grid phase voltage A, table: holding, address: 598, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid phase voltage B, table: holding, address: 599, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Grid phase voltage C, table: holding, address: 600, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: Grid-side frequency, table: holding, address: 609, type: u16, unit: Hz, scale: 0.01, note: No unit given; 0.01 Hz assumed like the inverter and load frequencies., conflicts: [{sources: [openwb], type: s16, label: Counter frequency}], verified: false}
  - {key: x.grid_inner_l1_current, label: Grid side inner current A, table: holding, address: 610, type: s16, unit: A, scale: 0.01}
  - {key: x.grid_inner_l2_current, label: Grid side inner current B, table: holding, address: 611, type: s16, unit: A, scale: 0.01}
  - {key: x.grid_inner_l3_current, label: Grid side inner current C, table: holding, address: 612, type: s16, unit: A, scale: 0.01}
