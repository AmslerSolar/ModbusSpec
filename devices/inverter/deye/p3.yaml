notes:
- RS485 / RS232, 9600 Bd 8N1. Registers 0…59 and 500…2000 are read with function 03, settings 60…499 are written with function
  10 (06 and 05 are also listed). The document is for RTU only; the unit id is settable 1–247 (register 1), 1 is assumed as
  default.
- Addresses are the document's register numbers, used as 0-based protocol addresses; all are holding registers.
- 32-bit counters are listed low word first (word_order little). Since V104 the AC powers are 32-bit, with the old register
  as the low 16 bits and the high 16 bits in 687…709 (and 656…660, 668…671); these are given as low / high points and derived
  sums.
- 'LV and HV models differ in steps: battery voltage 0.01 V (LV) / 0.1 V (HV), battery and PV input power 1 W / 10 W, maximum
  sell power 1 W / 10 W. Register 0 tells them apart (0x0500 LV, 0x0600 / 0x0601 HV); 0x0800 (100 kW PCS) and 0x0900 (balcony
  storage) are listed but not covered by a model. The SG01-HP3 edition (V104.3.1) gives 0x0005 (LV) and 0x0006 (HV) instead,
  possibly a typo or byte-swap of 0x0500 / 0x0600; both are accepted.'
- 'Fault and warning words: V105 removed the code descriptions from this document; the code table is taken from V104. Their
  bit positions are assumed (see warning word 1).'
- 'Older editions: V100 (Modbus.Deye-2) has no 32-bit AC powers (the high words at 687…709 came with V104) and no 0x0600 device
  type; V105.1 and the SG01-HP3 edition have 684…686 reserved and no 716 (DSP running time) or 719…730 (PV5–PV8).'
- Battery and grid power signs are not stated anywhere in the document; the assumptions are marked on the points.
- 'Left out: grid code / protection and ride-through settings (185…499 mostly), time-of-use slots (148…177), generator and
  smart-load settings, BMS values (210…258), calibration registers, reactive power per phase (710…715), the customized remote-control
  registers from 1000, the fault memory (1000…1499 in the record table) and the Deye battery area from 10000.'
- 'Left out: Device Phases (holding 22, u16) from solarman overlaps x.phase_count from the documents.'
- 'Left out: Device MPPTs (holding 22, u16) from solarman overlaps x.mppt_count from the documents.'
- 'evcc template `deye-hybrid-3p` (grid, pv, battery) lists: Deye 3p hybrid inverter; Sunsynk 3p hybrid inverter.'
- The template has the option `batterytype` (default lv); points used only with another value say so in their note.
- The template has the option `firmware1098` (default false); points used only with another value say so in their note.
- The template has the option `includegenport` (default false); points used only with another value say so in their note.
- The template has the option `storageunit` (default 1); points used only with another value say so in their note.
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- The project picks this map when Deye's device type (holding register 0) is one of 0x0005, 0x0500, 0x0006, 0x0007, 0x0600,
  0x0008, 0x0601.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
