enums:
  device_type: {'512': String inverter, '768': Single-phase storage inverter, '1024': Microinverter, '1280': Three-phase low-voltage storage inverter, '1536': Three-phase high-voltage storage inverter 6–15 kW, '1537': Three-phase high-voltage storage inverter 20–50 kW, '2048': 100 kW three-phase PCS, '2304': Balcony storage}
  output_type: {'0': Three-phase, '1': Split-phase, '2': Two-phase 60° (Japan)}
  run_state: {'0': Standby, '1': Self-check, '2': Normal, '3': Alarm, '4': Fault, '5': Activating}
  on_off: {'0': 'Off', '1': 'On', '2': 'Off'}
  off_on: {'0': 'Off', '1': 'On'}
