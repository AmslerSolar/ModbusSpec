#
# Written from the Deye Modbus RTU Protocol, single phase (1P) (V119); V118 also listed. The registers of the storage
# ("Hybird") columns and the storage areas.

modbusspec: 0
id: deye-hybrid
manufacturer: Deye
name: Single-phase storage (hybrid) inverter
kind: inverter

sources:
- title: Deye Modbus RTU Protocol, single phase (1P)
  version: V119 (2024-02-19)
  url: https://github.com/Lewa-Reka/esphome-deye-inverter/blob/56599c6deacd7fcceec8dc185eea29679f168b5c/docs/modbus_communication_protocols/Modbus%20RTU%20single%20phase%20%281P%29%20V119.pdf
  sha256: d00ffd6768635dc91dc6a864206ca0b8995c2a73c83991f195aad8da25dd27f5
- title: Deye Modbus RTU Protocol
  version: V118
  url: https://github.com/user-attachments/files/16597960/Deye.Modbus.protocol.V118.pdf
  sha256: 7444d2ef7dee282d5dbc734e73d6792788bc8a323ca532c8202d8d5f976b3717
- title: Deye Modbus RTU Protocol, single phase (sunsynk modbus deye single phase)
  version: V115 (2019-11-12)
  url: https://github.com/githubDante/deye-controller/blob/20259772468d29b69d7576341d294cdbe421185d/docs/sunsynk_modbus_deye_single_phase.docx
  sha256: 9df83c15abb2e2446d493be1b964a7ef042d27ed9a60153515849f844518fee2
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/deye-storage.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/deye/deye
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/deye_hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
  write_multiple: true

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: holding
    address: 3
    type: str
    length: 5
  checks:
  - table: holding
    address: 0
    type: u16
    equals: 768

points:
  # Fixed attributes (0…19) and clock
  - {key: x.device_type, label: Device type, table: holding, address: 0, type: u16, enum: device_type, poll: slow, conflicts: [{sources: [openwb], type: s16, label: Inverter device type}]}
  - {key: x.protocol_version, label: Communication protocol version, table: holding, address: 2, type: u16, poll: slow, note: 0x0102 = version 1.2.}
  - {key: serial, label: SN byte 01…10, table: holding, address: 3, type: str, length: 5, poll: slow}
  - {key: x.rated_power_class, label: Rated Power, table: holding, address: 8, type: u16, enum: rated_power_class, poll: slow}
  - {key: firmware, label: Firmware version of control board, table: holding, address: 13, type: u16, poll: slow}
  - {key: x.comm_firmware, label: Firmware version of communication board, table: holding, address: 14, type: u16, poll: slow}
  - {key: x.rated_power, label: Rated power, table: holding, address: 16, type: u32, unit: W, scale: 0.1, poll: slow, conflicts: [{sources: [solarman], type: s32, label: Device Rated Power}]}
  - {key: x.mppt_count, label: MPPT number, table: holding, address: 18, type: u16, bits: [8, 15], poll: slow, verified: false, note: '0x0503 = five MPPTs, three-phase: high byte MPPTs, low byte phases.'}
  - {key: x.phase_count, label: Phases, table: holding, address: 18, type: u16, bits: [0, 7], poll: slow, verified: false, note: See MPPT number.}
  - {key: x.clock, label: System time, table: holding, address: 22, type: datetime, length: 3, datetime: {year: {register: 0, bits: [8, 15], offset: 2000}, month: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}, writable: true, verified: false, note: 'Six bytes year (from 2000), month, day, hour, minute, second; byte 1 of each register taken as the high byte (not stated; assumed).'}

  # Settings
  - {key: x.on_off, label: Switch on and off enable, table: holding, address: 43, type: u16, enum: on_off, writable: true, poll: slow}
  - {key: x.ac_power_ratio, label: AC power ratio, table: holding, address: 54, type: u16, poll: slow, note: '10: registers 167…172, 176…179, 185 and 190 count in 10 W; 1: in 1 W. The range column says [0,2].'}

  # Real-time data (storage columns)
  - {key: state, label: run state, table: holding, address: 59, type: u16, enum: run_state}
  - {key: x.energy_today, label: DayActive PowerWh, table: holding, address: 60, type: s16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.generator_energy_today, label: Today_Gen_PowerWh, table: holding, address: 62, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.energy_total, label: Total_Active_PowerWh, table: holding, address: 63, type: u32, unit: kWh, scale: 0.1, poll: slow, conflicts: [{sources: [solarman], type: s32, label: Total Energy}]}
  - {key: x.battery1_current, label: Battery 1 current, table: holding, address: 65, type: u16, unit: A, scale: 0.01, verified: false, note: Marked as an addition in the storage column; type and sign not stated.}
  - {key: x.battery2_current, label: Battery 2 current, table: holding, address: 66, type: u16, unit: A, scale: 0.01, verified: false, note: As battery 1 current.}
  - {key: x.battery_charge_today, label: Day_Batt_Charge_PowerWh, table: holding, address: 70, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_today, label: Day_Batt_Discharge_PowerWh, table: holding, address: 71, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_charge_total, label: total_Batt_charge_PowerWh, table: holding, address: 72, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_total, label: total_Batt_Discharge_PowerWh, table: holding, address: 74, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_import_today, label: Day_GridBuy_PowerWh, table: holding, address: 76, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_export_today, label: Day_GridSell_PowerWh, table: holding, address: 77, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.grid_import_total_low, label: Total_GridBuy_PowerWh low word, table: holding, address: 78, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: frequency, label: Grid frequency, table: holding, address: 79, type: u16, unit: Hz, scale: 0.01, conflicts: [{sources: [openwb], type: s16, label: Counter frequency}]}
  - {key: x.grid_import_total_high, label: Total_GridBuy_PowerWh high word, table: holding, address: 80, type: u16, unit: kWh, scale: 6553.6, poll: slow, note: High word of the total bought energy (× 65536 × 0.1 kWh); the low word is register 78., conflicts: [{sources: [evcc], scale: 1, label: Grid energy (part 2)}]}
  - {key: grid_export_energy, label: Total_GridSell_PowerWh, table: holding, address: 81, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.generator_hours_today, label: Generator daily operating time, table: holding, address: 83, type: u16, unit: h, scale: 0.1, poll: slow}
  - {key: x.load_energy_today, label: Day_Load_PowerWh, table: holding, address: 84, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.load_energy_total, label: Total_Load_PowerWh, table: holding, address: 85, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.dc_transformer_temperature, label: Radiator temperature (DC transformer temperature), table: holding, address: 90, type: u16, unit: °C, scale: 0.1, offset: -100, verified: false, note: The offset of 1000 (0 °C = 1000) is given for register 91; assumed here too., conflicts: [{sources: [solarman], type: s16, label: DC Temperature}]}
  - {key: temperature, label: IGBT temperature (radiator temperature), table: holding, address: 91, type: u16, unit: °C, scale: 0.1, offset: -100, conflicts: [{sources: [solarman], type: s16, label: Temperature}]}
  - {key: x.generator_energy_total_low, label: Total_Gen_powerWhL, table: holding, address: 92, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.generator_energy_total_high, label: Total_Gen_powerWhH, table: holding, address: 95, type: u16, unit: kWh, scale: 6553.6, poll: slow, note: High word (× 65536 × 0.1 kWh); low word in register 92., conflicts: [{sources: [solarman], scale: 0.1, label: Generator Energy (high word)}]}
  - {key: pv_energy, label: historyPV PowerWh, table: holding, address: 96, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.alarm_word_1, label: Warning message word 1, table: holding, address: 101, type: u16, flags: alarm_word_1, verified: false, note: The code tables don't give bit positions; code Wn / Fn is taken as bit n−1 counted across the words (the three-phase document's warning word 1 bit list agrees for W02 and W03). Not stated for the fault words; assumed., conflicts: [{sources: [solarman], type: u32, word_order: little, label: Device Alarm}]}
  - {key: x.alarm_word_2, label: Warning message word 2, table: holding, address: 102, type: u16}
  - {key: x.fault_word_1, label: Fault information word 1, table: holding, address: 103, type: u16, flags: fault_word_1, verified: false, note: 'Fault codes F01–F16 as bits 0–15 (assumed, see warning word 1).', conflicts: [{sources: [solarman], type: u64, word_order: little, label: Device Fault}]}
  - {key: x.fault_word_2, label: Fault information word 2, table: holding, address: 104, type: u16, flags: fault_word_2, verified: false, note: 'Fault codes F17–F32 as bits 0–15 (assumed, see warning word 1).'}
  - {key: x.fault_word_3, label: Fault information word 3, table: holding, address: 105, type: u16, flags: fault_word_3, verified: false, note: 'Fault codes F33–F48 as bits 0–15 (assumed, see warning word 1).'}
  - {key: x.fault_word_4, label: Fault information word 4, table: holding, address: 106, type: u16, flags: fault_word_4, verified: false, note: 'Fault codes F49–F64 as bits 0–15 (assumed, see warning word 1).'}
  - {key: pv_energy_today, label: Day PV PowerWh, table: holding, address: 108, type: u16, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.pv1_voltage, label: Dc voltage 1, table: holding, address: 109, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: Dc current 1, table: holding, address: 110, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: Dc voltage 2, table: holding, address: 111, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: Dc current 2, table: holding, address: 112, type: u16, unit: A, scale: 0.1}
  - {key: x.pv3_voltage, label: Dc voltage 3, table: holding, address: 113, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: Dc current 3, table: holding, address: 114, type: u16, unit: A, scale: 0.1}
  - {key: x.pv4_voltage, label: Dc voltage 4, table: holding, address: 115, type: u16, unit: V, scale: 0.1}
  - {key: x.pv4_current, label: Dc current 4, table: holding, address: 116, type: u16, unit: A, scale: 0.1}
  - {key: x.ups_power, label: UPS Power, table: holding, address: 119, type: u16, unit: W}

  # Storage real-time area (150…197)
  - {key: l1_voltage, label: Grid side voltage L1-N, table: holding, address: 150, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid side voltage L2-N, table: holding, address: 151, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_voltage_l1_l2, label: Grid side voltage L1-L2, table: holding, address: 152, type: u16, unit: V, scale: 0.1}
  - {key: x.relay_middle_voltage, label: Voltage at middle side of relay L1-L2, table: holding, address: 153, type: u16, unit: V, scale: 0.1}
  - {key: x.inverter_l1_voltage, label: Inverter output voltage L1-N, table: holding, address: 154, type: u16, unit: V, scale: 0.1}
  - {key: x.inverter_l2_voltage, label: Inverter output voltage L2-N, table: holding, address: 155, type: u16, unit: V, scale: 0.1}
  - {key: x.inverter_voltage_l1_l2, label: Inverter output voltage L1-L2, table: holding, address: 156, type: u16, unit: V, scale: 0.1}
  - {key: x.load_l1_voltage, label: Load voltage L1, table: holding, address: 157, type: u16, unit: V, scale: 0.1}
  - {key: x.load_l2_voltage, label: Load voltage L2, table: holding, address: 158, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid side current L1, table: holding, address: 160, type: s16, unit: A, scale: 0.01}
  - {key: l2_current, label: Grid side current L2, table: holding, address: 161, type: s16, unit: A, scale: 0.01}
  - {key: x.external_ct_l1_current, label: Grid external limiter current L1, table: holding, address: 162, type: s16, unit: A, scale: 0.01}
  - {key: x.external_ct_l2_current, label: Grid external limiter current L2, table: holding, address: 163, type: s16, unit: A, scale: 0.01}
  - {key: x.inverter_l1_current, label: Inverter output current L1, table: holding, address: 164, type: s16, unit: A, scale: 0.01}
  - {key: x.inverter_l2_current, label: Inverter output current L2, table: holding, address: 165, type: s16, unit: A, scale: 0.01}
  - {key: x.gen_port_power, label: Gen port power (micro inverter input), table: holding, address: 166, type: s16, unit: W, note: Positive when the port feeds a load; negative when a micro inverter on it feeds the storage inverter., conflicts: [{sources: [solarman], type: u16, label: Generator Power}]}
  - {key: x.grid_l1_power, label: Grid side L1 power, table: holding, address: 167, type: s16, unit: W, verified: false, note: 'Sign not stated; probably as grid power (positive = buying). In W, or in 10 W when register 54 is 10 (see notes).'}
  - {key: x.grid_l2_power, label: Grid side L2 power, table: holding, address: 168, type: s16, unit: W, verified: false, note: As grid side L1 power.}
  - {key: grid_power, label: Grid power, table: holding, address: 169, type: s16, unit: W, positive: import, note: 'In W, or in 10 W when register 54 is 10 (see notes).'}
  - {key: x.external_ct_l1_power, label: Grid external limiter 1 power, table: holding, address: 170, type: s16, unit: W}
  - {key: x.external_ct_l2_power, label: Grid external limiter 2 power, table: holding, address: 171, type: s16, unit: W}
  - {key: x.external_ct_power, label: Grid external total power, table: holding, address: 172, type: s16, unit: W}
  - {key: x.inverter_l1_power, label: Inverter outputs L1 power, table: holding, address: 173, type: s16, unit: W}
  - {key: x.inverter_l2_power, label: Inverter outputs L2 power, table: holding, address: 174, type: s16, unit: W}
  - {key: x.inverter_power, label: Inverter output total power, table: holding, address: 175, type: s16, unit: W}
  - {key: x.load_l1_power, label: Load side L1 power, table: holding, address: 176, type: s16, unit: W}
  - {key: x.load_l2_power, label: Load side L2 power, table: holding, address: 177, type: s16, unit: W}
  - {key: load_power, label: Load side total power, table: holding, address: 178, type: s16, unit: W}
  - {key: x.load_l1_current, label: Load current L1, table: holding, address: 179, type: s16, unit: A, scale: 0.01}
  - {key: x.load_l2_current, label: Load current L2, table: holding, address: 180, type: s16, unit: A, scale: 0.01}
  - {key: x.gen_port_voltage, label: Gen port voltage, table: holding, address: 181, type: u16, unit: V, scale: 0.1, verified: false, note: No unit given; 0.1 V assumed like the other voltages.}
  - {key: battery_temperature, label: battery temperature, table: holding, address: 182, type: u16, unit: °C, scale: 0.1, offset: -100}
  - {key: battery_voltage, label: battery voltage, table: holding, address: 183, type: u16, unit: V, scale: 0.01}
  - {key: battery_soc, label: battery capacity, table: holding, address: 184, type: u16, unit: '%'}
  - {key: x.battery_status, label: battery Status, table: holding, address: 185, type: u16, note: Values not listed.}
  - {key: x.pv1_power, label: PV1 input power, table: holding, address: 186, type: u16, unit: W}
