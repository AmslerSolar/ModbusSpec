  - {key: x.grid_frequency_setting, label: Grid Frequency, table: holding, address: 285, type: u16, enum: grid_frequency, writable: true, poll: slow}
  - {key: x.grid_type, label: Grid Type, table: holding, address: 286, type: u16, enum: grid_type, writable: true, poll: slow}
  - {key: x.device_modbus_address, label: Device Modbus Address, table: holding, address: 1, type: u16, verified: false, sources: [solarman]}
  - {key: x.device_chip_type, label: Device Chip Type, table: holding, address: 9, type: u16, enum: device_chip_type, verified: false, sources: [solarman]}
  - {key: x.device_communication_board_firmware_version_2, label: Device Communication Board Firmware Version (2), table: holding, address: 10, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.device_control_board_firmware_version_3, label: Device Control Board Firmware Version (3), table: holding, address: 11, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.device_control_board_firmware_version_2, label: Device Control Board Firmware Version (2), table: holding, address: 12, type: u16, note: 'The project shows this as a version: each 4-bit nibble is one digit.', verified: false, sources: [solarman]}
  - {key: x.self_check_time, label: Self-check time, table: holding, address: 21, type: u16, unit: s, writable: true, verified: false, sources: [solarman]}
