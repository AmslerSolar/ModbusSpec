  - {key: x.battery_low_voltage, label: battery voltage LowBatt, table: holding, address: 222, type: u16, unit: V, scale: 0.01, writable: true, min: 38, max: 61, poll: slow}
  - {key: x.grid_charge_current, label: Grid charge the battery current, table: holding, address: 230, type: u16, unit: A, writable: true, min: 0, poll: slow, note: V119 gives 0–185 A; the maximum depends on the model.}
  - {key: x.generator_charge_enable, label: Generator is charged to enable, table: holding, address: 231, type: u16, writable: true, poll: slow}
  - {key: x.grid_charge_enable, label: Grid is charged to enable, table: holding, address: 232, type: u16, writable: true, poll: slow}
  - {key: x.energy_management_mode, label: Energy management model, table: holding, address: 243, type: u16, enum: energy_management_mode, writable: true, poll: slow}
