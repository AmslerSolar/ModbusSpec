  - {when: {key: x.fault_word_4, bit: 15}, kind: fault, text: F64 Heat sink temperature too high}

notes:
- RS485 / RS232, 9600 Bd 8N1; functions 03 (read, at most 125 registers) and 10 (write, at most 123). The document is for
  RTU only; the unit id is settable 1–247 (register 1), 1 is assumed as default. Data loggers that wrap Modbus RTU in their
  own TCP protocol are not described here.
- Addresses are the document's register numbers, used as 0-based protocol addresses (its example reads register 107 with start
  address 0x006B). All registers are holding registers (function 03).
- 32-bit values are listed low word first (word_order little); the document marks no 32-bit value as signed except where noted.
- Reserved and unsupported registers read 0.
- 'The document is one map for string, micro and single-phase storage inverters: registers 59…124 have a different meaning
  per kind (columns ''String'', ''Hybird'', ''MI''), and 150…218 differ between string and storage inverters. Register 0 tells
  the kind.'
- Registers 167…172, 176…178 and 190 (grid, limiter, load and battery powers) are in W, or in 10 W when register 54 (AC power
  ratio) is 10; the 1 W default is used here. The register 54 row also lists 179 and 185, whose own rows give other units.
- Battery and grid energy counters and powers come from the storage ('Hybird') column of 60…99; the string and micro meanings
  of those registers are in the deye-string and deye-micro files.
- 'Older editions (V115, 2019) differ in the storage column: 62 is today''s grid-connection time (s) instead of today''s generator
  energy; 65 and 66 are this month''s PV and load energy (1 kWh) instead of battery currents; 92 is inductor temperature and
  95 ambient temperature instead of the generator energy total; 94 is the SD card state (1000 fault, 2000 normal); 119 is
  a PV input damage word instead of UPS power; 181 and 185 are reserved and 196 is a debug value. Its battery area is per
  pack (serial numbers from 500, pack data from 600).'
- 'Left out: grid protection limits and California ride-through settings (25…58, 287…415), the six time-of-use slots (250…279),
  generator and smart-load settings, BMS values written by the display (312…325), the per-pack battery area (500…809) and
  the Deye battery area from 10000.'
- 'Left out: Device Phases (holding 18, u16) from solarman overlaps x.phase_count from the documents.'
- 'Left out: Device MPPTs (holding 18, u16) from solarman overlaps x.mppt_count from the documents.'
- 'evcc template `deye-storage` (grid, pv, battery) lists: Deye Storage (hybrid) inverter; Sunsynk Storage (hybrid) inverter.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- The project picks this map when Deye's device type (holding register 0) is one of 0x0003, 0x0300, 0x0103, 0x0104.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
