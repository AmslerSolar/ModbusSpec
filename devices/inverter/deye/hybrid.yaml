  - {key: x.pv3_power, label: PV3 input power, table: holding, address: 188, type: u16, unit: W}
  - {key: x.pv4_power, label: PV4 input power, table: holding, address: 189, type: u16, unit: W}
  - {key: battery_power, label: Battery output power, table: holding, address: 190, type: s16, unit: W, positive: discharge, verified: false, note: 'Signed; the direction isn''t stated. ''Output'' power taken as positive when discharging (assumed). In W, or 10 W when register 54 is 10.'}
  - {key: battery_current, label: Battery output current, table: holding, address: 191, type: s16, unit: A, scale: 0.01, positive: discharge, verified: false, note: As battery output power (assumed).}
  - {key: x.load_frequency, label: load frequency, table: holding, address: 192, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_frequency, label: Inverter output frequency, table: holding, address: 193, type: u16, unit: Hz, scale: 0.01}
  - {key: x.grid_relay, label: Grid side relay status, table: holding, address: 194, type: u16, enum: relay}
  - {key: x.generator_relay, label: Generator side relay status, table: holding, address: 195, type: u16, bits: [0, 3], enum: generator_relay}
  - {key: x.switch_state, label: Generator side relay status (switch signal), table: holding, address: 195, type: u16, bits: [4, 7], enum: on_off}
  - {key: x.gen_port_frequency, label: Gen port frequency, table: holding, address: 196, type: u16, unit: Hz, scale: 0.01}

  # Storage settings (200…)
