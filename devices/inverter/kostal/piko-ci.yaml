modbusspec: 0
id: kostal-piko-ci
manufacturer: KOSTAL
name: PIKO CI 30 / 50 / 60, PIKO CI 30/50 G2 and PIKO CI 100 (KOSTAL register set)
kind: inverter

sources:
- title: PIKO CI – KOSTAL MODBUS (TCP) with control information, interface description
  version: 1.5 (11.08.2025)
  url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/BA/Protokollbeschreibung/BA_PIKO-CI_KOSTAL-Interface-description-Modbus-Sunspec.pdf
  sha256: fe0fb4a7a7efc2d731193e64b2b748a80369842487786736c7b58c993c7c509d
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/kostal/kostal_piko_ci

connection:
  default_port: 1502
  default_unit: 71
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8N2
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 152
    type: f32
    plausible:
    - 45
    - 65

identify:
  serial:
    table: holding
    address: 14
    type: str
    length: 8
  checks:
  - table: holding
    address: 768
    type: str
    length: 32
    prefix: PIKO CI

