notes:
- Holding registers only (function 03 to read, 06 to write); at most 125 registers per request. Not the PLENTICORE map although
  many addresses match - no register 5 (byte order), no battery, no 1066 total PV power, and up to 8 MPPT inputs.
- TCP port 1502 and unit id 71 by default (the unit id can be changed). RS485 is RTU at 19200 baud, 8 data bits, no parity,
  2 stop bits.
- Floats are IEEE 754 over two registers. The document doesn't say in which word order; readers detect it from the grid frequency
  (152, 45–65 Hz) and assume the usual KOSTAL low-word-first order until then (unverified).
- Solar power is 100 (total DC power), else the sum of the MPPT inputs. MPPT inputs come from the 0x7000 block (current, power,
  voltage per input, 6 registers apart, as many as register 34 says); DC1–3 at 258 ff. and DC4 at 300 ff. hold the same for
  older readers.
- The grid figure (252) is only a grid value with a meter at the grid connection; house consumption is then 116 (from PV)
  + 108 (from grid). With register 611 = 1 (meter on the load side) 252 is house consumption and there is no grid value -
  unverified that 611 is the sensor position meant at 252.
- Energies are in Wh in the device; scaled to kWh here.
- 'Error bits by model (document note 5): 4126 bit 2 (remote off), 4127 bits 14–15 and 4128 bits 4 and 8 only on the G2 and
  CI 100; 4128 bits 3 and 7 are marked for no model but listed. The problems here leave out 4126 bit 2 (an operator command)
  or 4127 bit 11 (PV under-voltage, normal at low light).'
- The document also describes SunSpec models (common at 40003, inverter models 103/113, nameplate 120, controls 123, MPPT
  160); this file covers only the KOSTAL register set.
