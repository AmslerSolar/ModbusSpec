  byte_order: {'0': Little-endian (CDAB), '1': Big-endian (ABCD)}
  inverter_state: {'0': 'Off', '1': Init, '2': Isolation measurement, '3': Grid check, '4': Start-up, '6': Feed-in, '7': Throttled, '8': External switch off, '9': Update, '10': Standby, '11': Grid sync, '12': Grid pre-check, '13': Grid switch off, '14': Overheating, '15': Shutdown, '16': Improper DC voltage, '17': ESB (emergency power), '18': Unknown}
  energy_manager: {'0': Idle, '2': Emergency battery charge, '8': Winter mode step 1, '16': Winter mode step 2}
  battery_type: {'0': No battery, '2': PIKO Battery Li, '4': BYD, '8': BMZ, '16': AXIstorage Li SH, '64': LG, '512': Pylontech, '1024': AXIstorage Li SV, '4096': Dyness, '8192': VARTA, '16384': ZYC, '32768': HELIVOR, '65536': M-TEC (PLENTICORE G3 only)}
  sensor_type: {'0': SDM 630, '1': B-Control EM-300 LR, '3': KSEM, '4': KEM-C, '5': KEM-P, '6': KEM MP-P, '255': No sensor}
  battery_management_mode: {'0': No external battery management, '1': External via digital I/O, '2': External via Modbus}
  mdc_role: {'-1': Not available, '0': 'Off', '1': Client, '2': Host}
  pssb_fuse_state: {'0': Fuse fail, '1': Fuse ok, '255': Unchecked}

problems:
  - {when: {key: state, equals: 14}, kind: warning, text: Overheating (state 14)}
  - {when: {key: state, equals: 17}, kind: backup_mode, text: Emergency power mode (state 17)}
  - {when: {key: x.pssb_fuse_state, equals: 0}, kind: fault, text: Battery fuse failed (PSSB)}

notes:
- Modbus TCP on port 1502, unit id 71 (changeable), function 03 only, 1–125 registers per request; addresses are 0-based.
  Modbus has to be switched on in the inverter.
- 'Word order: 32-bit values (floats, and as assumed also U32) are low word first (CDAB) from the factory; the inverter can
  be set to ABCD. Register 5 says which (0 = CDAB, 1 = ABCD); the document links it to the float registers only; applying
  it to U32 integers is an assumption. Readers take the order from register 5, which also works at night (0 Hz).'
- The map has gaps (e.g. 102, 176, 180–189). Registers the inverter rejects when read on their own are missing on that model
  or firmware.
- The battery registers answer only when a battery is set (588 ≠ 0). The PSSB fuse fault applies only then. Whether a meter
  is connected comes from 1082 (0xFF = none), else from the meter reporting a frequency (220).
- 'Signs from the document: 200 battery current positive = discharge; 252 meter power positive = drawn from the grid (sensor
  at the grid connection); 1549 plant battery power positive = discharge. Not stated: 582 battery power, the AC phase powers
  and 172 total AC power.'
- Home consumption is 116 + 106 + 108 (from PV, battery and grid), on the inverter with the meter only.
- 'Multi Device Control: every inverter answers on its own address; the host (1545 = 2) also reports plant totals 1547–1555
  (PLENTICORE G3 from SW 3.06.10).'
- 'The inverter state is the only status: there are no error registers. States 13 (grid switch off) and 16 (improper DC voltage)
  aren''t explained and aren''t reported as problems.'
- Not for the PIKO CI, which has a different map under the same product-name register (see kostal-piko-ci).
- Identification as sunspec2 recognises the device (not checked against a document).
- 'evcc template `kostal-ksem-inverter` (grid) lists: Kostal Smart Energy Meter (via inverter).'
- 'evcc template `kostal-plenticore-gen2` (pv, battery) lists: Kostal Plenticore Hybrid.'
- The template has the option `endianness` (default little); points used only with another value say so in their note.
- evcc also reads SunSpec model values for this template (not included here).
- The grid meter values (220…255) are those OpenEMS reads through the inverter; it reads them low word first with its 'word-wrap'
  setting (taken here, as for the inverter's other values) and high word first without it. Its other grid-meter mode reads
  a KOSTAL Smart Energy Meter directly (not included).
- The project reads every value with function 03 on unit 71; 32-bit values low word first. Port 1502 is the one its README
  configures.
- SmartHomeNG plugin kostalmodbus.
- Modbus is off from the factory and is switched on in the inverter. KOSTAL's own 32-bit registers are low word first from
  the factory (CDAB); the inverter can be switched to ABCD, which these addresses don't follow.
- Not for the PIKO CI, which has its own register map.
- The battery registers (202…, 1034…, 1046…, 1068…, 1280…) answer only when a battery type is set in 588.
- The battery limitation 1280…1283 has to be written again within the fallback time (1288, at least 30 s), else the fallback
  values apply. Registers 1280…1289 are held in RAM.
- The DC power setpoint (1034) is only used while external battery management is set to Modbus in the inverter's menu (see
  1080).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
