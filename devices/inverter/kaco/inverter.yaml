id: kaco-inverter
manufacturer: KACO new energy
name: blueplanet TL1 / TL3 and Powador TL3 inverters (SunSpec)
kind: inverter

sources:
- title: KACO Modbus Protocol Application Note, Tx1 and Tx3 Series
  version: '180730'
  url: https://github.com/OpenEMS/openems/blob/c044448d6346209e4aa8dae7f4bde08a676ad0ed/io.openems.edge.pvinverter.kaco.blueplanet/doc/APL_Modbus-Protocol_de_180730.pdf
