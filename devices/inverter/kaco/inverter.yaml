notes:
- SunSpec over Modbus TCP (port 502 by default) on all devices; newer devices with a web interface also over Modbus RTU. Modbus
  / SunSpec must be switched on in the inverter's menu (on by default on US models); write access is a separate switch, off
  by default.
- 'Function codes 03 (read), 06 and 16 (write). Unit id: ignored over TCP on legacy devices; on newer devices it addresses
  auxiliary devices (e.g. string combiners) on the RS485 bus. Modbus UDP (package version 4.0 and later, same port) only takes
  write requests and never answers; with UDP the unit id must be 0.'
- 'The map starts with "SunS" at register 40001 (protocol address 40000); the models follow, ending with model 0xFFFF of length
  0. Only the common model (1) is described in this document; the other models are in the SunSpec and KACO model workbooks
  it refers to. Supported models by software version: blueplanet TL3 2.02+ / Powador TL3 2.10+: models 1, 102 and 103, read-only;
  blueplanet TL1 3.00+ / TL3 3.22+: adds 122 and 123; blueplanet TL1 / TL3 / Powador TL3 4.00+: adds 112, 113, 129, 130, 135,
  136, 160.'
- 'Some SunSpec settings are stored in flash: don''t write them periodically. Device address (40068) is not implemented.'
- The registers are SunSpec models. The project finds the SunSpec map at holding register 40000, 0, 50000 (tried in that order)
  and walks the model chain; the addresses here are those of the chain it captured from a blueplanet 8.6 TL3 INT, firmware
  V5.53 (model ID at 1 at 40002, 103 at 40070, 113 at 40122, 120 at 40184, 121 at 40212, 122 at 40244, 123 at 40290, 126 at
  40316, 129 at 40544, 130 at 40606, 132 at 40668, 135 at 40734, 136 at 40796, 160 at 40858, 64204 at 40908). Check the model
  IDs before relying on them for another model or firmware.
- The project accepts the device as a KACO when the manufacturer (model 1, holding 40004) starts with 'KACO'.
- The project uses only the three-phase inverter model 103; the float model 113 carries the same values and is not listed.
  Vendor model 64204 has no public definition.
- Most KACO inverters ignore the unit id (the project's tools default to 1).
- At night the inverter keeps answering (state sleeping) but reports 0 for grid frequency, phase voltages, cabinet temperature
  and power factor.
- Values equal to the SunSpec 'not implemented' value of their type are given as invalid.
- 103 W (AC power) and WH (AC lifetime energy) are the inverter's output; the captured inverter is a PV inverter (nameplate
  type PV).
- 'Model 126: only the first curve is listed; further ones follow every 54 registers.'
- 'Model 129: only the first curve is listed; further ones follow every 50 registers.'
- 'Model 130: only the first curve is listed; further ones follow every 50 registers.'
- 'Model 132: only the first curve is listed; further ones follow every 54 registers.'
- 'Model 135: only the first curve is listed; further ones follow every 50 registers.'
- 'Model 136: only the first curve is listed; further ones follow every 50 registers.'
- 'Model 160: 2 modules on the captured inverter, all listed.'
- Identification as kaco-modbus recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
