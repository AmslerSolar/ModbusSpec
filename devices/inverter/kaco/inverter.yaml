- id: kaco-modbus
  title: kaco-modbus (Python library, used by Home Assistant's kaco_modbus)
  url: https://github.com/g4bri3lDev/kaco-modbus
  license: Apache-2.0
  commit: 9f4578c17dea563ec9a5a086df1bb9bb5c4ff3b4
  path: src/kaco_modbus/models.py, src/kaco_modbus/testing.py, src/kaco_modbus/device.py, src/kaco_modbus/const.py
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/kaco/kaco_tx

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: KACO

sunspec: true

