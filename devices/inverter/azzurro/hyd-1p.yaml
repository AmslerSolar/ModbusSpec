modbusspec: 0
id: azzurro-hyd-1p
manufacturer: Azzurro (ZCS)
name: HYD 3–6k 1P hybrid inverter
kind: inverter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/azzurro_zcs/azzurro_zcs

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: x.counter_frequency, label: Counter frequency, table: input, address: 524, type: u16, unit: Hz, scale: 0.01}
  - {key: battery_power, label: Battery power, table: input, address: 525, type: s16, unit: W, positive: charge}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 528, type: u16, unit: '%'}
  - {key: grid_power, label: Counter power, table: input, address: 530, type: s16, unit: W, positive: export}
  - {key: pv_energy, label: Inverter exported energy, table: input, address: 533, type: u16, unit: kWh, scale: 0.1}
  - {key: x.bat_imported, label: Battery imported energy, table: input, address: 551, type: u16, unit: kWh, scale: 0.1}
  - {key: x.bat_exported, label: Battery exported energy, table: input, address: 553, type: u16, unit: kWh, scale: 0.1}
  - {key: x.inverter_power_592, label: Inverter power (part), table: input, address: 592, type: u16, note: openWB computes the inverter power from this register with further arithmetic (sign from status bits or similar).}
  - {key: x.inverter_power_string1_factor, label: Inverter power string1 factor, table: input, address: 593, type: s16}
  - {key: x.inverter_power_595, label: Inverter power (part), table: input, address: 595, type: s16, note: openWB computes the inverter power from this register with further arithmetic (sign from status bits or similar).}
  - {key: x.inverter_power_string2_factor, label: Inverter power string2 factor, table: input, address: 596, type: s16}

notes:
- openWB reads ten registers from input 542 and from input 544 and hands each list on as the grid export / import energy (×10);
  these are left out.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
