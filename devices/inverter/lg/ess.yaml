# Written from LG's Home 8/10 LG ESS SunSpec register map (1.3) and the SunSpec models workbook.

modbusspec: 0
id: lg-ess
manufacturer: LG Electronics
name: LG ESS Home 8 / Home 10 (SunSpec, firmware 10.05.7213 and later)
kind: inverter

sources:
- title: Home 8/10 LG ESS SunSpec register map
  version: 1.3 (2021-04-30, firmware 10.05.7230); no public address, copy provided by the user
- title: SunSpec Information Models (models workbook)
  version: models_workbook.xlsx, master 2026-10-21
  url: https://github.com/sunspec/models/raw/master/models_workbook.xlsx

connection:
  default_port: 6502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 52
    type: str
    length: 16
  checks:
  - table: holding
    address: 0
    type: u32
    equals: 1400204883
  - table: holding
    address: 2
    type: u16
    equals: 1


sunspec: true

points:
  - {key: x.manufacturer, label: Mn (manufacturer), table: holding, address: 4, type: str, length: 16, poll: slow}
  - {key: x.model, label: Md (model), table: holding, address: 20, type: str, length: 16, poll: slow}
  - {key: firmware, label: Vr (version), table: holding, address: 44, type: str, length: 8, poll: slow}
  - {key: serial, label: SN (serial number), table: holding, address: 52, type: str, length: 16, poll: slow}
  - {key: x.ac_current_103, label: A (model 103), table: holding, address: 72, type: u16, unit: A, scale_exponent_from: {table: holding, address: 76, type: s16, negate: true}, note: Read only when model 113 is missing., verified: false}
  - {key: x.l1_current_103, label: AphA (model 103), table: holding, address: 73, type: u16, unit: A, scale_exponent_from: {table: holding, address: 76, type: s16, negate: true}, verified: false}
  - {key: x.l2_current_103, label: AphB (model 103), table: holding, address: 74, type: u16, unit: A, scale_exponent_from: {table: holding, address: 76, type: s16, negate: true}, verified: false}
  - {key: x.l3_current_103, label: AphC (model 103), table: holding, address: 75, type: u16, unit: A, scale_exponent_from: {table: holding, address: 76, type: s16, negate: true}, verified: false}
  - {key: x.l1_voltage_103, label: PhVphA (model 103), table: holding, address: 80, type: u16, unit: V, scale_exponent_from: {table: holding, address: 83, type: s16, negate: true}, verified: false}
  - {key: x.l2_voltage_103, label: PhVphB (model 103), table: holding, address: 81, type: u16, unit: V, scale_exponent_from: {table: holding, address: 83, type: s16, negate: true}, verified: false}
  - {key: x.l3_voltage_103, label: PhVphC (model 103), table: holding, address: 82, type: u16, unit: V, scale_exponent_from: {table: holding, address: 83, type: s16, negate: true}, verified: false}
  - {key: x.ac_power_103, label: W (model 103), table: holding, address: 84, type: s16, unit: W, scale_exponent_from: {table: holding, address: 85, type: s16, negate: true}, positive: generation, note: No sign documented; + = AC output assumed., verified: false}
  - {key: x.frequency_103, label: Hz (model 103), table: holding, address: 86, type: u16, unit: Hz, scale_exponent_from: {table: holding, address: 87, type: s16, negate: true}, verified: false}
  - {key: x.apparent_power_103, label: VA (model 103), table: holding, address: 88, type: s16, unit: VA, scale_exponent_from: {table: holding, address: 89, type: s16, negate: true}, verified: false}
  - {key: x.ac_energy_103, label: WH (model 103), table: holding, address: 94, type: u32, unit: kWh, scale_exponent_from: {table: holding, address: 96, type: s16, negate: true}, poll: slow, note: 'LG and SunSpec say Wh; kWh observed on a Home 10, not documented.', verified: false}
  - {key: x.dc_current_103, label: DCA (model 103), table: holding, address: 97, type: u16, unit: A, scale_exponent_from: {table: holding, address: 98, type: s16, negate: true}, verified: false}
  - {key: x.dc_voltage_103, label: DCV (model 103), table: holding, address: 99, type: u16, unit: V, scale_exponent_from: {table: holding, address: 100, type: s16, negate: true}, verified: false}
  - {key: x.dc_power_103, label: DCW (model 103), table: holding, address: 101, type: s16, unit: W, scale_exponent_from: {table: holding, address: 102, type: s16, negate: true}, verified: false}
  - {key: x.cabinet_temperature_103, label: TmpCab (model 103), table: holding, address: 103, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 107, type: s16, negate: true}, verified: false}
  - {key: x.transformer_temperature_103, label: TmpTrns (model 103), table: holding, address: 105, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 107, type: s16, negate: true}, verified: false}
  - {key: x.state_103, label: St (model 103), table: holding, address: 108, type: u16, enum: inverter_state, note: Read only when model 113 is missing.}
  - {key: x.events_103, label: Evt1 (model 103), table: holding, address: 110, type: u32, flags: inverter_evt1, note: Read only when model 113 is missing.}
  - {key: x.ac_current, label: A, table: holding, address: 124, type: f32, unit: A}
  - {key: l1_current, label: AphA, table: holding, address: 126, type: f32, unit: A}
  - {key: l2_current, label: AphB, table: holding, address: 128, type: f32, unit: A}
  - {key: l3_current, label: AphC, table: holding, address: 130, type: f32, unit: A}
  - {key: x.inverter_l1_voltage, label: PhVphA, table: holding, address: 138, type: f32, unit: V}
  - {key: x.inverter_l2_voltage, label: PhVphB, table: holding, address: 140, type: f32, unit: V}
  - {key: x.inverter_l3_voltage, label: PhVphC, table: holding, address: 142, type: f32, unit: V}
  - {key: x.ac_power, label: W (AC power), table: holding, address: 144, type: f32, unit: W, positive: generation, note: No sign documented; + = AC output assumed. Solar = AC power − battery (+ = discharging); home = AC power + purchase., verified: false}
  - {key: x.inverter_frequency, label: Hz, table: holding, address: 146, type: f32, unit: Hz}
  - {key: apparent_power, label: VA, table: holding, address: 148, type: f32, unit: VA}
  - {key: x.ac_energy, label: WH (lifetime energy), table: holding, address: 154, type: f32, unit: kWh, poll: slow, note: LG and SunSpec say Wh; kWh observed on a Home 10 (firmware 10.05.7437); not documented., verified: false}
  - {key: x.dc_current, label: DCA, table: holding, address: 156, type: f32, unit: A}
  - {key: x.dc_voltage, label: DCV, table: holding, address: 158, type: f32, unit: V}
  - {key: x.dc_power, label: DCW, table: holding, address: 160, type: f32, unit: W}
  - {key: temperature, label: TmpCab (cabinet temperature), table: holding, address: 162, type: f32, unit: °C}
  - {key: x.transformer_temperature, label: TmpTrns, table: holding, address: 166, type: f32, unit: °C}
  - {key: state, label: St (operating state), table: holding, address: 170, type: u16, enum: inverter_state}
  - {key: x.events, label: Evt1, table: holding, address: 172, type: u32, flags: inverter_evt1}
  - {key: x.der_type, label: DERTyp, table: holding, address: 186, type: u16, enum: der_type, poll: slow}
  - {key: x.rated_power, label: WRtg, table: holding, address: 187, type: u16, unit: W, scale_exponent_from: {table: holding, address: 188, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_apparent_power, label: VARtg, table: holding, address: 189, type: u16, unit: VA, scale_exponent_from: {table: holding, address: 190, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_var_q1, label: VArRtgQ1, table: holding, address: 191, type: s16, unit: var, scale_exponent_from: {table: holding, address: 195, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_var_q2, label: VArRtgQ2, table: holding, address: 192, type: s16, unit: var, scale_exponent_from: {table: holding, address: 195, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_var_q3, label: VArRtgQ3, table: holding, address: 193, type: s16, unit: var, scale_exponent_from: {table: holding, address: 195, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_var_q4, label: VArRtgQ4, table: holding, address: 194, type: s16, unit: var, scale_exponent_from: {table: holding, address: 195, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_current, label: ARtg, table: holding, address: 196, type: u16, unit: A, scale_exponent_from: {table: holding, address: 197, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.rated_pf_q1, label: PFRtgQ1, table: holding, address: 198, type: s16, unit: '', scale_exponent_from: {table: holding, address: 202, type: s16, negate: true}, poll: slow, note: cos φ., verified: false}
  - {key: x.rated_pf_q2, label: PFRtgQ2, table: holding, address: 199, type: s16, unit: '', scale_exponent_from: {table: holding, address: 202, type: s16, negate: true}, poll: slow, note: cos φ., verified: false}
  - {key: x.rated_pf_q3, label: PFRtgQ3, table: holding, address: 200, type: s16, unit: '', scale_exponent_from: {table: holding, address: 202, type: s16, negate: true}, poll: slow, note: cos φ., verified: false}
  - {key: x.rated_pf_q4, label: PFRtgQ4, table: holding, address: 201, type: s16, unit: '', scale_exponent_from: {table: holding, address: 202, type: s16, negate: true}, poll: slow, note: cos φ., verified: false}
  - {key: x.rated_storage_energy, label: WHRtg, table: holding, address: 203, type: u16, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 204, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.max_charge_rate, label: MaxChaRte, table: holding, address: 207, type: u16, unit: W, scale_exponent_from: {table: holding, address: 208, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.max_discharge_rate, label: MaxDisChaRte, table: holding, address: 209, type: u16, unit: W, scale_exponent_from: {table: holding, address: 210, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.connected, label: Conn, table: holding, address: 216, type: u16, enum: connected, poll: slow, writable: true}
