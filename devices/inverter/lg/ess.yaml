  - {key: x.power_limit_enabled, label: WMaxLim_Ena, table: holding, address: 221, type: u16, enum: enabled, poll: slow, writable: true}
  - {key: x.pf_setpoint, label: OutPFSet, table: holding, address: 222, type: s16, unit: '', scale_exponent_from: {table: holding, address: 236, type: s16, negate: true}, poll: slow, writable: true, note: cos φ., verified: false}
  - {key: x.pf_setpoint_enabled, label: OutPFSet_Ena, table: holding, address: 226, type: u16, enum: enabled, poll: slow, writable: true}
  - {key: x.var_mode, label: VArPct_Mod, table: holding, address: 233, type: u16, enum: var_mode, poll: slow, writable: true}
  - {key: x.var_enabled, label: VArPct_Ena, table: holding, address: 234, type: u16, enum: enabled, poll: slow, writable: true}
