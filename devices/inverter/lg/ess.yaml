  - {key: x.control_mode, label: LocRemCtl, table: holding, address: 255, type: u16, enum: control_mode, poll: slow}
  - {key: x.battery_type, label: Typ, table: holding, address: 259, type: u16, enum: battery_type, poll: slow}
