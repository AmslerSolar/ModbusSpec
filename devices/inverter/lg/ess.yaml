notes:
- 'LG''s SunSpec map is fixed: ''SunS'' at 0, Common at 2, inverter 103 at 70 and 113 (float) at 122, nameplate 120 at 184,
  controls 123 at 212, battery 802 at 238, LG''s power meter model 64256 at 302. Port 6502. The unit id isn''t in the document;
  1 is assumed.'
- 'Scale factors work the other way round from SunSpec: real value = raw ÷ 10^SF (LG''s ''× 10'' notes for SF 1; observed
  on a Home 10), hence `negate: true`.'
- 'Both inverter models are served: 103 (integer) and 113 (float).'
- 'Grid: model 64256 ActPower, + = purchase from the grid (LG). Battery: 802 W in watts without scale factor and without a
  documented sign; the direction comes from ChaSt. Solar has no register: AC power − battery power (+ = discharging) gives
  it, a few percent low because of conversion losses.'
- The meter gives a voltage per phase but only a total power.
- Event severities (fault / warning / mains lost) are not from the documents; the SunSpec workbook gives none. Manual shutdown
  (inverter Evt1 bit 6) isn't reported as a problem.
