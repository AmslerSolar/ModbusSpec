  - {key: l1_voltage, label: Vol_AN, table: holding, address: 307, type: u16, unit: V, scale_exponent_from: {table: holding, address: 310, type: s16, negate: true}, note: 'LG: Vol_SF = 1 (× 10).', verified: false}
  - {key: l2_voltage, label: Vol_BN, table: holding, address: 308, type: u16, unit: V, scale_exponent_from: {table: holding, address: 310, type: s16, negate: true}, note: 'LG: Vol_SF = 1 (× 10).', verified: false}
  - {key: l3_voltage, label: Vol_CN, table: holding, address: 309, type: u16, unit: V, scale_exponent_from: {table: holding, address: 310, type: s16, negate: true}, note: 'LG: Vol_SF = 1 (× 10).', verified: false}
  - {key: frequency, label: AC_Freq, table: holding, address: 311, type: u16, unit: Hz, scale_exponent_from: {table: holding, address: 312, type: s16, negate: true}, note: 'LG: ACFreq_SF = 1 (× 10).', verified: false}
  - {key: grid_import_energy, label: AC_PurchaseEnergy, table: holding, address: 313, type: s64, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 321, type: s16, negate: true}, poll: slow, note: 'Wh; LG: Energy_SF = 0. Lifetime counter.', verified: false}
  - {key: grid_export_energy, label: AC_FeedInEnergy, table: holding, address: 317, type: s64, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 321, type: s16, negate: true}, poll: slow, note: 'Wh; LG: Energy_SF = 0. Lifetime counter.', verified: false}
  - {key: pv_energy_today, label: PV_Generation_Energy, table: holding, address: 322, type: u32, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 321, type: s16, negate: true}, note: Wh. LG only calls it PV generation energy; observed to be today's yield (equals the HTTPS API's today_pv_generation_sum); not documented., verified: false}

enums:
  inverter_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': Producing, '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby}
  charge_state: {'1': 'Off', '2': Empty, '3': Discharging, '4': Charging, '5': Full, '6': Holding, '7': Testing}
  der_type: {'4': PV, '82': PV with storage}
  connected: {'0': Disconnected, '1': Connected}
  enabled: {'0': Disabled, '1': Enabled}
  var_mode: {'0': None, '1': '% of max W', '2': '% of max VAr', '3': '% of available VAr'}
  control_mode: {'0': Remote, '1': Local}
  battery_type: {'0': Not applicable, '1': Lead-acid, '2': NiMH, '3': NiCd, '4': Li-ion, '5': Carbon-zinc, '6': Zinc chloride, '7': Alkaline, '8': Rechargeable alkaline, '9': Sodium-sulfur, '10': Flow, '99': Other}
  bank_state: {'1': Disconnected, '2': Initializing, '3': Connected, '4': Standby, '5': SoC protection, '6': Suspending, '99': Fault}

flags:
  inverter_evt1: {'0': Ground fault, '1': DC overvoltage, '2': AC disconnect open, '3': DC disconnect open, '4': Grid disconnect, '5': Cabinet open, '6': Manual shutdown, '7': Over-temperature, '8': Grid overfrequency, '9': Grid underfrequency, '10': AC overvoltage, '11': AC undervoltage, '12': Blown string fuse, '13': Under-temperature, '14': Memory loss, '15': Hardware test failure}
  battery_evt1: {'0': Battery communication error, '1': Battery over-temperature alarm, '2': Battery over-temperature warning, '3': Battery under-temperature alarm, '4': Battery under-temperature warning, '5': Battery over charge current alarm, '6': Battery over charge current warning, '7': Battery over discharge current alarm, '8': Battery over discharge current warning, '9': Battery overvoltage alarm, '10': Battery overvoltage warning, '11': Battery undervoltage alarm, '12': Battery undervoltage warning, '13': Battery below min. SoC alarm, '14': Battery below min. SoC warning, '15': Battery above max. SoC alarm, '16': Battery above max. SoC warning, '17': Battery voltage imbalance warning, '18': Battery temperature imbalance alarm, '19': Battery temperature imbalance warning, '20': Battery contactor error, '21': Battery fan error, '22': Battery ground fault, '23': Battery open door error, '24': Battery current imbalance warning, '25': Battery other alarm, '26': Battery other warning, '28': Battery configuration alarm, '29': Battery configuration warning}

