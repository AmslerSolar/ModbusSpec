  - {key: x.battery_current_reported, label: A (total DC current), table: holding, address: 282, type: s16, unit: A, scale_exponent_from: {table: holding, address: 299, type: s16, negate: true}, note: 'Not a real reading on a Home 10 (0 A while discharging; observed on a device, not documented).', verified: false}
  - {key: x.battery_max_charge_current, label: AChaMax, table: holding, address: 283, type: u16, unit: A, scale_exponent_from: {table: holding, address: 300, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.battery_max_discharge_current, label: ADisChaMax, table: holding, address: 284, type: u16, unit: A, scale_exponent_from: {table: holding, address: 300, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.battery_power, label: W (total power), table: holding, address: 285, type: s16, unit: W, note: 'Already in W: LG lists no W_SF (SunSpec''s offset 63 is missing). No sign documented; take |W| with the direction from ChaSt (3 discharging, 4 charging, else 0).', verified: false}
