  - {key: x.battery_capacity, label: WHRtg, table: holding, address: 241, type: u16, unit: kWh, scale: 0.001, scale_exponent_from: {table: holding, address: 291, type: s16, negate: true}, poll: slow, note: LG's table names no scale factor for it; WHRtg_SF is assumed., verified: false}
  - {key: x.battery_max_charge_power, label: WChaRteMax, table: holding, address: 242, type: u16, unit: W, scale_exponent_from: {table: holding, address: 292, type: s16, negate: true}, poll: slow, verified: false}
  - {key: x.battery_max_discharge_power, label: WDisChaRteMax, table: holding, address: 243, type: u16, unit: W, scale_exponent_from: {table: holding, address: 292, type: s16, negate: true}, poll: slow, verified: false}
  - {key: battery_soc, label: SoC, table: holding, address: 249, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 294, type: s16, negate: true}, note: 'LG: percent × 10; observed on a Home 10: 233 with SoC_SF 1 = 23.3 %.', verified: false}
  - {key: x.depth_of_discharge, label: DoD, table: holding, address: 250, type: u16, unit: '%', scale_exponent_from: {table: holding, address: 295, type: s16, negate: true}, note: 'LG: percent × 10.', verified: false}
