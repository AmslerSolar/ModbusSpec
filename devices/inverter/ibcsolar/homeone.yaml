modbusspec: 0
id: ibcsolar-homeone
manufacturer: IBC Solar
name: HomeOne Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/ibc-homeone.yaml

connection:
  default_port: 502
  default_unit: 3
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: pv_power, label: PV power, table: input, address: 1600, type: u32, unit: W}
  - {key: pv_energy, label: PV energy, table: input, address: 1604, type: u32, unit: kWh, scale: 0.1}
  - {key: battery_power, label: Battery power, table: input, address: 1618, type: s32, unit: W, positive: discharge}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 1621, type: u16, unit: '%'}
  - {key: x.grid_power_1, label: Grid power (part 1), table: input, address: 60038, type: s32, unit: W, word_order: little}
  - {key: x.grid_power_2, label: Grid power (part 2), table: input, address: 60040, type: s32, unit: W, word_order: little}
  - {key: x.grid_power_3, label: Grid power (part 3), table: input, address: 60042, type: s32, unit: W, word_order: little}

derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: x.grid_power_1}, {key: x.grid_power_2}, {key: x.grid_power_3}]}

notes:
- 'evcc template `ibc-homeone` (grid, pv, battery) lists: IBC Solar HomeOne Hybrid Inverter.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
