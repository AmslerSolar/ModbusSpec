  - {key: x.ac_active_power, label: Total AC Active Power, unit: W, models: [trex10], sum: [{key: x.invert_active_power}, {key: x.invert_active_power_l2}, {key: x.invert_active_power_l3}]}

enums:
  working_mode: {'0': Power On, '1': Standby, '2': Bypass, '3': Off-grid, '4': Fault, '5': Line, '6': PV Charge}
  weekday: {'0': Sunday, '1': Monday, '2': Tuesday, '3': Wednesday, '4': Thursday, '5': Friday, '6': Saturday}
  operating_mode: {'0': 'General mode (self-use, load priority)', '1': 'Backup mode (grid-tied, no battery discharge)', '2': Economic mode (scheduled charge-discharge), '3': 'Oil engine mode (generator; 5048 firmware 2203+, 10048 firmware 207+)'}
  battery_type: {'0': User defined, '1': Lithium battery (default), '2': FelicitySolar(LPBF series), '3': FelicitySolar(LPBA series), '4': No battery}
  econ_rule_1_enable: {'0': Disabled, '1': Charge, '2': Discharge, '3': ECO mode}

flags:
  econ_rule_1_effective_week: {'0': Sunday, '1': Monday, '2': Tuesday, '3': Wednesday, '4': Thursday, '5': Friday, '6': Saturday}

notes:
- ha_felicity's register list for these models follows Felicity's RS485 protocol for the IVGM5048 / IVGM10048 (the T-REX-5/6/10
  layout), not the IVGM8K-20K document.
- The T-REX-6 uses the T-REX-5 map unchanged; only the rated power differs.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
