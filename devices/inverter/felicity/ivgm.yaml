notes:
- 'ha_felicity calls its IVGM support provisional: built from Felicity''s 8K RS485 protocol, with the 15K/20K map inferred
  from the registers the document marks as not supported on the 8K (phase C, PV3/PV4, battery 2).'
- The protocol gives the live power registers (below 0x2000) in W, but ha_felicity measured 0.01 kW per count on a 20K and
  a 15K (e.g. battery power 156 = 1560 W) and applies that to the whole family. Power settings (0x2000 and up) are plain watts.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
