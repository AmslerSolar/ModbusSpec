derived:
  - {key: x.total_pv_power, label: total_pv_power, unit: W, sum: [{key: x.pv1_power, factor: 1000}, {key: x.pv2_power, factor: 1000}, {key: x.pv3_power, factor: 1000}, {key: x.pv4_power, factor: 1000}]}
  - {key: x.battery_power, label: Battery Power, unit: W, sum: [{key: x.bat1_power, factor: 1000}, {key: x.bat2_power, factor: 1000}]}
  - {key: x.total_ac_output_active_power, label: total_ac_output_active_power, unit: W, sum: [{key: x.phase_a_load_active_power, factor: 1000}, {key: x.phase_b_load_active_power, factor: 1000}, {key: x.phase_c_load_active_power, factor: 1000}]}
  - {key: x.total_ac_input_power, label: total_ac_input_power, unit: W, sum: [{key: x.phase_a_ct_active_power, factor: 1000}, {key: x.phase_b_ct_active_power, factor: 1000}, {key: x.phase_c_ct_active_power, factor: 1000}]}
  - {key: x.loadpower_lineside, label: loadpower_lineside, unit: W, sum: [{key: x.phase_a_ct_active_power, factor: 1000}, {key: x.phase_b_ct_active_power, factor: 1000}, {key: x.phase_c_ct_active_power, factor: 1000}, {key: grid_power, factor: -1000}]}
  - {key: x.inverter_active_power_kw, label: Inverter Active Power kW, unit: kW, sum: [{key: x.phase_a_inverter_active_power}, {key: x.phase_b_inverter_active_power}, {key: x.phase_c_inverter_active_power}]}
  - {key: x.total_generator_active_power, label: Total Generator Active Power, unit: W, sum: [{key: x.phase_a_generator_active_power, factor: 1000}, {key: x.phase_b_generator_active_power, factor: 1000}, {key: x.phase_c_generator_active_power, factor: 1000}]}
  - {key: x.total_grid_active_power, label: Total Grid Active Power, unit: W, sum: [{key: x.phase_a_grid_active_power, factor: 1000}, {key: x.phase_b_grid_active_power, factor: 1000}, {key: x.phase_c_grid_active_power, factor: 1000}]}
  - {key: x.battery_current, label: Battery Current, unit: A, sum: [{key: x.bat1_current}, {key: x.bat2_current}]}

