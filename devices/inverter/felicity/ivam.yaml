modbusspec: 0
id: felicity-ivam
manufacturer: Felicity Solar
name: IVAM6048 high-frequency inverter
kind: inverter

sources:
- id: felicity
  title: ha_felicity (Home Assistant integration)
  url: https://github.com/partach/ha_felicity
  license: MIT
  commit: 0a40564251e19c8e6598848935dc6183ef983537
  path: custom_components/ha_felicity/ivam.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 2400
    format: 8N1

defaults:
  verified: false
  sources:
  - felicity

points:
  - {key: x.alarm_codes, label: Alarm Code, table: holding, address: 4361, type: u16}
  - {key: x.fault_codes, label: Fault Code, table: holding, address: 4362, type: u16}
  - {key: x.pv1_voltage, label: PV1 input voltage, table: holding, address: 4376, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 input voltage, table: holding, address: 4377, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: holding, address: 4380, type: s16, unit: A, scale: 0.1}
  - {key: x.pv2_current, label: PV2 Current, table: holding, address: 4381, type: s16, unit: A, scale: 0.1}
  - {key: x.pv1_power, label: PV1 input power, table: holding, address: 4392, type: s16, unit: W}
  - {key: x.pv2_power, label: PV2 input power, table: holding, address: 4393, type: s16, unit: W}
  - {key: battery_voltage, label: Battery voltage, table: holding, address: 4396, type: u16, unit: V, scale: 0.1}
  - {key: battery_current, label: Battery current, table: holding, address: 4400, type: s16, unit: A, scale: 0.1, positive: charge}
  - {key: battery_power, label: Battery power, table: holding, address: 4401, type: s16, unit: W, positive: charge}
  - {key: battery_soc, label: Battery SOC, table: holding, address: 4408, type: u16, unit: '%', scale: 0.1}
  - {key: x.scc_heatsink_temperature, label: SccHs temperature, table: holding, address: 4420, type: s16, unit: °C}
  - {key: x.generator_a_current, label: Generater current, table: holding, address: 4426, type: s16, unit: A, scale: 0.1}
  - {key: x.generator_a_voltage, label: Generater voltage, table: holding, address: 4429, type: u16, unit: V, scale: 0.1}
  - {key: l1_voltage, label: Grid voltage, table: holding, address: 4432, type: u16, unit: V, scale: 0.1}
  - {key: x.load_a_voltage, label: Load voltage, table: holding, address: 4438, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid current, table: holding, address: 4444, type: s16, unit: A, scale: 0.1}
  - {key: x.load_a_current, label: Load current, table: holding, address: 4450, type: s16, unit: A, scale: 0.1}
  - {key: x.load_frequency, label: Load frequency, table: holding, address: 4463, type: u16, unit: Hz, scale: 0.01}
  - {key: x.generator_a_phase_power, label: Generater Power, table: holding, address: 4464, type: s16, unit: W}
  - {key: x.grid_a_phase_power, label: Grid Power, table: holding, address: 4467, type: s16, unit: W}
  - {key: x.load_aphase_power, label: Load Power, table: holding, address: 4473, type: s16, unit: W}
  - {key: x.load_apparent_power, label: Load apparent power, table: holding, address: 4476, type: u16, unit: VA}
  - {key: x.load_percentage, label: Load percentage, table: holding, address: 4479, type: u16, unit: '%'}
  - {key: x.smart_load_voltage, label: Smart Load voltage, table: holding, address: 4485, type: u16, unit: V, scale: 0.1}
  - {key: x.smart_load_current, label: Smart Load current, table: holding, address: 4488, type: s16, unit: A, scale: 0.1}
  - {key: x.smart_load_power, label: Smart Load power, table: holding, address: 4492, type: s16, unit: W}
  - {key: x.pv1_total_gen_energy, label: PV1 Generated energy inquiry Total, table: holding, address: 4501, type: u32, unit: kWh, scale: 0.1}
  - {key: x.pv2_total_gen_energy, label: PV2 Generated energy inquiry Total, table: holding, address: 4503, type: u32, unit: kWh, scale: 0.1}
  - {key: x.load_total_cost_energy, label: Load consumption energy inquiry Total, table: holding, address: 4521, type: u32, unit: kWh, scale: 0.1}
  - {key: x.pv1_day_gen_energy, label: PV1 Generated energy inquiry This day, table: holding, address: 4529, type: u16, unit: kWh, scale: 0.1}
  - {key: x.pv1_month_gen_energy, label: PV1 Generated energy inquiry This month, table: holding, address: 4530, type: u32, unit: kWh, scale: 0.1}
  - {key: x.pv1_year_gen_energy, label: PV1 Generated energy inquiry This year, table: holding, address: 4532, type: u32, unit: kWh, scale: 0.1}
  - {key: x.pv2_day_gen_energy, label: PV2 Generated energy inquiry This day, table: holding, address: 4534, type: u16, unit: kWh, scale: 0.1}
  - {key: x.pv2_month_gen_energy, label: PV2 Generated energy inquiry This month, table: holding, address: 4535, type: u32, unit: kWh, scale: 0.1}
  - {key: x.pv2_year_gen_energy, label: PV2 Generated energy inquiry This year, table: holding, address: 4537, type: u32, unit: kWh, scale: 0.1}
  - {key: x.load_day_cost_energy, label: Load consumption energy inquiry This day, table: holding, address: 4581, type: u16, unit: kWh, scale: 0.1}
  - {key: x.load_month_cost_energy, label: Load consumption energy inquiry This month, table: holding, address: 4582, type: u32, unit: kWh, scale: 0.1}
  - {key: x.load_year_cost_energy, label: Load consumption energy inquiry This year, table: holding, address: 4584, type: u32, unit: kWh, scale: 0.1}

notes:
- ha_felicity reads the IVAM only (its protocol defines no settings).
- Power scales are the protocol document's (W) and not checked on a device; the IVGM document said W too and was off by 10.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
