  - {key: x.output_manual_mode, label: Output control mode manual/automatic, table: coil, address: 1, type: bool, writable: true, note: '1 = manual, 0 = automatic.'}
  - {key: x.load_manual_on, label: Manual control the load, table: coil, address: 2, type: bool, writable: true, note: Switches the load when the load is in manual mode.}
  - {key: x.load_default_on, label: Default control the load, table: coil, address: 3, type: bool, writable: true}
  - {key: x.load_test_mode, label: Enable load test mode, table: coil, address: 5, type: bool, writable: true}
  - {key: x.load_force_on, label: Force the load on/off, table: coil, address: 6, type: bool, writable: true, note: For a temporary load test.}

enums:
  battery_voltage_status: {'0': Normal, '1': Over voltage, '2': Under voltage, '3': Over discharge, '4': Fault}
  battery_temperature_status: {'0': Normal, '1': Over temperature, '2': Low temperature}
  charging_state: {'0': Not charging, '1': Float, '2': Boost, '3': Equalization}
  standby_running: {'0': Standby, '1': Running}
  pv_input_status: {'0': Normal, '1': No input power connected, '2': Input voltage too high, '3': Input voltage error}
  discharge_input_status: {'0': Normal, '1': Input voltage low, '2': Input voltage high, '3': No access}
  load_level: {'0': Light load, '1': Moderate, '2': Rated, '3': Overload}
  day_night: {'0': Day, '1': Night}
  battery_type: {'0': User defined, '1': Sealed, '2': GEL, '3': Flooded}
  load_control_mode: {'0': Manual control, '1': Light on/off, '2': Light on + timer, '3': Timing control}
  rated_voltage_level: {'0': Auto recognize, '1': 12 V, '2': 24 V, '3': 36 V, '4': 48 V, '5': 60 V, '6': 110 V, '7': 120 V, '8': 220 V, '9': 240 V}
  off_on: {'0': 'Off', '1': 'On'}
  charging_mode: {'0': Voltage compensation, '1': SOC}
  charging_mode_type: {'0': Connect/disconnect, '1': PWM, '2': MPPT}
  main_power_supply: {'1': Battery, '2': AC-DC power supply}

flags:
  charging_status: {'0': Running, '1': Fault, '4': PV input short circuit, '6': Disequilibrium in three circuits, '7': Load MOSFET short circuit, '8': Load short circuit, '9': Load over current, '10': Input over current, '11': Anti-reverse MOSFET short circuit, '12': Charging or anti-reverse MOSFET open circuit, '13': Charging MOSFET short circuit}
  discharging_status: {'0': Running, '1': Fault, '4': Output over voltage, '5': Boost over voltage, '6': Short circuit in high voltage side, '7': Input over voltage, '8': Output voltage abnormal, '9': Unable to stop discharging, '10': Unable to discharge, '11': Short circuit}

problems:
  - {when: {key: x.battery_voltage_status, equals: 1}, kind: warning, text: Battery over voltage}
  - {when: {key: x.battery_voltage_status, equals: 2}, kind: warning, text: Battery under voltage}
  - {when: {key: x.battery_voltage_status, equals: 3}, kind: warning, text: Battery over discharged}
  - {when: {key: x.battery_voltage_status, equals: 4}, kind: fault, text: Battery fault}
  - {when: {key: x.battery_temperature_status, in: [1, 2]}, kind: warning, text: 'Battery temperature: {text}'}
  - {when: {key: x.battery_resistance_abnormal, equals: 1}, kind: warning, text: Battery inner resistance abnormal}
  - {when: {key: x.rated_voltage_wrong, equals: 1}, kind: fault, text: Battery rated voltage wrongly identified}
  - {when: {key: x.pv_input_status, in: [2, 3]}, kind: fault, text: 'PV input: {text}'}
  - {when: {key: x.charging_status, bit: 1}, kind: fault, text: Charging fault}
  - {when: {key: x.charging_status, bit: 4}, kind: fault, text: PV input short circuit}
  - {when: {key: x.charging_status, bit: 6}, kind: fault, text: Disequilibrium in three circuits}
  - {when: {key: x.charging_status, bit: 7}, kind: fault, text: Load MOSFET short circuit}
  - {when: {key: x.charging_status, bit: 8}, kind: fault, text: Load short circuit}
  - {when: {key: x.charging_status, bit: 9}, kind: fault, text: Load over current}
  - {when: {key: x.charging_status, bit: 10}, kind: fault, text: PV input over current}
  - {when: {key: x.charging_status, bit: 11}, kind: fault, text: Anti-reverse MOSFET short circuit}
  - {when: {key: x.charging_status, bit: 12}, kind: fault, text: Charging or anti-reverse MOSFET open circuit}
  - {when: {key: x.charging_status, bit: 13}, kind: fault, text: Charging MOSFET short circuit}
  - {when: {key: x.discharging_status, bit: 1}, kind: fault, text: Discharging (load output) fault}
  - {when: {key: x.discharging_status, bit: 4}, kind: fault, text: Load output over voltage}
  - {when: {key: x.discharging_status, bit: 5}, kind: fault, text: Boost over voltage}
  - {when: {key: x.discharging_status, bit: 6}, kind: fault, text: Short circuit on the high voltage side}
  - {when: {key: x.discharging_status, bit: 7}, kind: fault, text: Discharging input over voltage}
  - {when: {key: x.discharging_status, bit: 8}, kind: fault, text: Load output voltage abnormal}
  - {when: {key: x.discharging_status, bit: 9}, kind: fault, text: Unable to stop discharging}
  - {when: {key: x.discharging_status, bit: 10}, kind: fault, text: Unable to discharge}
  - {when: {key: x.discharging_status, bit: 11}, kind: fault, text: Load output short circuit}
  - {when: {key: x.load_level, equals: 3}, kind: warning, text: Load output overloaded}
  - {when: {key: x.over_temperature, equals: 1}, kind: fault, text: Controller over temperature}

notes:
- Modbus RTU, unit 1 by default (changeable with the PC software or the MT50 display; only one controller on the bus while
  changing it), 115200 baud, 8 data bits, no parity, 1 stop bit (parity stated in V2.3 and LS-B V1.1). V2.3 gives the default
  server address as 0; v2.5 and LS-B V1.1 say 1. Port 502 is only for a Modbus TCP gateway on the RS485 line; the documents
  name none.
- Addresses are hexadecimal protocol addresses (base offset 0), used as given. Function 04 for real-time and rated data, 03
  / 10 for parameters, 02 for the two discrete inputs, 05 for the coils.
- Values are raw ÷ 100 where the document gives a factor of 100. 32-bit values are two registers, low word at the lower address
  (word order little); within a register the high byte comes first.
- The documents don't say whether temperatures are signed; those points are unverified. The battery current direction (0x331B,
  + = charging) is stated only in LS-B V1.1.
- 'Charging equipment status 0x3201 bit 12: v2.5 names it an open circuit of the charging or anti-reverse MOSFET; V2.3 and
  LS-B V1.1 call it a short circuit. The newer wording is kept.'
- 'V2.3 swaps the labels of 0x901E and 0x9020 (DTTV at 0x901E, NTTV at 0x9020), but its descriptions match v2.5: 0x901E is
  the sundown (night) threshold, 0x9020 the sunrise (day) threshold.'
- Battery parameters 0x9003–0x900E can only be set with battery type User, all together; the document lists ordering rules
  between them (over-voltage disconnect > charging limit > equalize > boost > float > boost reconnect; under-voltage warning
  recover > warning > low-voltage disconnect > discharging limit).
- 'Left out: the load timer registers (0x903E–0x904D, 0x9065, 0x9069), backlight time (0x9063), and the coils to restore defaults
  (13) and clear energy statistics (14).'
- 'RJ45 RS485 port on LS-B, VS-B, Tracer-A/B: pins 3–4 B, 5–6 A, 7–8 ground, 1–2 supply output (don''t use). The LS-B V1.1
  list gives A and B the other way round (3–4 A, 5–6 B) and pins 1–2 as not connected.'
