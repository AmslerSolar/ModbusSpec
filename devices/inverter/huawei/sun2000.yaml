  url: https://github.com/wlcrs/huawei-solar-lib
  license: AGPL-3.0
  commit: 19dfcfb642f362890b037ce781fb93c396fabc2e
  path: src/huawei_solar/registers.py, src/huawei_solar/register_names.py, src/huawei_solar/register_values.py
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/huawei/huawei

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125
    max_gap: 0

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 30015
    type: str
    length: 10
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: SUN
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: EDF ESS
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: Powershifter
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: SWI300

models:
  - {id: sun2000ma, name: SUN2000MA, match: {table: holding, address: 30000, type: str, length: 15, prefix: SUN2000MA}}
  - {id: sun2000, name: SUN2000, match: {table: holding, address: 30000, type: str, length: 15, prefix: SUN}}
  - {id: edf_ess, name: EDF ESS, match: {table: holding, address: 30000, type: str, length: 15, prefix: EDF ESS}}
