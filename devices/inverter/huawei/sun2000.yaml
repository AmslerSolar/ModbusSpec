notes:
- All values are holding registers (function 03). Over TCP, unit 0 is the device the connection goes to (the inverter's own
  WLAN/FE port); behind an SDongle or SmartLogger the inverter has its own address, usually 1.
- At most 125 registers per request, and a request that touches an undefined register fails with exception 2, so read only
  runs of defined registers.
- The inverter ignores requests sent straight after the TCP connection opens; wait about 1 s after connecting.
- No battery or no meter means the battery (37758…) or meter (37100…) blocks answer with an exception. Rated capacity 37758
  = 0 also means no battery, and meter status 37100 must be 1 before the meter values count.
- 'Battery signs: the document states positive = charging for the storage units (37001, 37743) but not for the total 37765.'
- 'Grid meter signs (37113, 37132…37136: positive = feed-in) and 37119 = export / 37121 = import are stated in issue 05; issue
  06 states none.'
- 'Transport: RS485 (and MBUS) carry Modbus RTU, WLAN / FE / 4G Modbus TCP (issue 05). RTU addresses 1–247; the documents
  give no baud rate.'
- 'PV strings: up to 24 (issue 05); PVn voltage at 32014 + 2n, current at 32015 + 2n. Read only as many as 30071 gives.'
- 'Alarm levels (issue 05): Major → fault, Minor and Warning → warning.'
- Device status codes (32089) come from the huawei-solar library; the document points to a separate description that isn't
  part of it.
- 'Problems: status 0x0300 counts only when no alarm bit already gave a fault; the battery fault ID and status count only
  with a battery (37758 > 0), the status only when the fault ID is 0. Alarm 3 bits 9–15 come from issue 05. Off-grid can be
  reported both by state 3 bit 0 and by the device status (515, 2560). Alarm 4 (32011) is shown but not reported.'
- Identification as huawei-solar recognises the device (not checked against a document).
- 'evcc template `huawei-sun2000-hybrid` (grid, pv, battery) lists: Huawei SUN2000 Hybrid Inverter.'
- The template has the option `forceaccharging` (default false); points used only with another value say so in their note.
- evcc waits 1s after opening the connection before the first request.
- 'evcc template `huawei-sun2000-inverter` (pv) lists: Huawei SUN2000 Inverter (without battery).'
- huawei-solar-lib reads and writes everything as holding registers (function 03, writes 06/16).
- Huawei devices accept only one Modbus TCP connection at a time.
- The library waits 1 s after connecting and 50 ms between requests.
- Detected by the model name (30000) starting with SUN, EDF ESS, Powershifter or SWI300.
- The batteries (LUNA2000 or LG RESU, 37000–39xxx, 47xxx) and the grid power meter (37100–37138) are read through the inverter
  at its unit id; they are part of this device.
- 'Which battery is connected: 47000 / 47089 (storage unit 1 / 2 product model). Meter online: 37100.'
- 'Model sun2000ma: the library marks 35000–35044 as SUN2000MA-only; matching the model name prefix SUN2000MA is an assumption
  made at import.'
- 32108 is called total_dc_input_power in the library but has unit kWh.
- 'The library gives some registers two names: grid_voltage = line_voltage_A_B (32066); grid_current = phase_A_current (32072);
  system_time = system_time_raw (40000).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
