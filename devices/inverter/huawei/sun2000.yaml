  sha256: 2e465e85a2776cee43b896968e472c532c83369cd804c2d1f79dcb2c7be9d6b2
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/huawei-sun2000-hybrid.yaml, templates/definition/meter/huawei-sun2000-inverter.yaml
- id: huawei-solar
