# Written from the Huawei SUN2000 8–28KTL MODBUS Interface Definitions (issue 01, 2015-04-07).

modbusspec: 0
id: huawei-sun2000-v100
manufacturer: Huawei
name: SUN2000 8–28KTL (first generation, SUN2000 V100R001 firmware, 40000 register map)
kind: inverter

sources:
- title: SUN2000 8–28KTL MODBUS Interface Definitions
  version: Issue 01 (2015-04-07)
  url: https://github.com/gavinying/modpoll/blob/e274c4afaff286bee248b12e356b906c24c22b44/contrib/huawei/sun2000/HUAWEI_SUN2000_245KTL28KTL_MODBUS_Interface_Definitions_20150715_JP.pdf
  sha256: a96736b31e92484676b67ef3326f375e9607e8b966f6c9c929ca73ef3fec58ae

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40713
    type: str
    length: 10
  checks:
  # model code
  - table: holding
    address: 40710
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 9
    - 16
    - 17
    - 18
    - 19
    - 20
  - table: holding
    address: 40939
    type: u16
    in:
    - 0
    - 1
    - 2
    - 256
    - 512
    - 513
    - 768
    - 769
    - 1025
    - 1026
    - 40960
  - table: holding
    address: 40713
    type: str
    length: 10
    printable: true

points:
  # Device characteristics
  - {key: x.model_code, label: Rated inverter power, table: holding, address: 40710, type: u16, enum: model, poll: slow, note: 'A model code, not a power value: see the enum.'}
  - {key: serial, label: ESN, table: holding, address: 40713, type: str, length: 10, poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 40789, type: str, length: 15, poll: slow}
  - {key: firmware, label: Software version, table: holding, address: 40819, type: str, length: 15, poll: slow}
  - {key: x.protocol_version, label: ModBus protocol version, table: holding, address: 40834, type: str, length: 15, poll: slow}

  # PV inputs
  - {key: x.pv1_voltage, label: PV1 voltage, table: holding, address: 40500, type: s16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 voltage, table: holding, address: 40501, type: s16, unit: V, scale: 0.1}
  - {key: x.pv3_voltage, label: PV3 voltage, table: holding, address: 40502, type: s16, unit: V, scale: 0.1}
  - {key: x.pv4_voltage, label: PV4 voltage, table: holding, address: 40503, type: s16, unit: V, scale: 0.1}
  - {key: x.pv5_voltage, label: PV5 voltage, table: holding, address: 40504, type: s16, unit: V, scale: 0.1}
  - {key: x.pv6_voltage, label: PV6 voltage, table: holding, address: 40505, type: s16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 current, table: holding, address: 40506, type: s16, unit: A, scale: 0.01}
  - {key: x.pv2_current, label: PV2 current, table: holding, address: 40507, type: s16, unit: A, scale: 0.01}
  - {key: x.pv3_current, label: PV3 current, table: holding, address: 40508, type: s16, unit: A, scale: 0.01}
  - {key: x.pv4_current, label: PV4 current, table: holding, address: 40509, type: s16, unit: A, scale: 0.01}
  - {key: x.pv5_current, label: PV5 current, table: holding, address: 40510, type: s16, unit: A, scale: 0.01}
  - {key: x.pv6_current, label: PV6 current, table: holding, address: 40511, type: s16, unit: A, scale: 0.01}
  - {key: x.mppt1_power, label: MPPT1 total input power, table: holding, address: 40686, type: u32, unit: W}
  - {key: x.mppt2_power, label: MPPT2 total input power, table: holding, address: 40688, type: u32, unit: W}
  - {key: x.mppt3_power, label: MPPT3 total input power, table: holding, address: 40690, type: u32, unit: W}
  - {key: pv_power, label: Total input power, table: holding, address: 40692, type: u32, unit: W}

  # AC output
  - {key: x.active_power, label: Active power, table: holding, address: 40525, type: s32, unit: W, note: The inverter's AC output; the document gives no sign.}
  - {key: x.line_voltage_l1_l2, label: Uab, table: holding, address: 40527, type: u16, unit: V, scale: 0.01}
  - {key: x.line_voltage_l2_l3, label: Ubc, table: holding, address: 40528, type: u16, unit: V, scale: 0.01}
  - {key: x.line_voltage_l3_l1, label: Uca, table: holding, address: 40529, type: u16, unit: V, scale: 0.01}
  - {key: l1_current, label: Ia, table: holding, address: 40572, type: s16, unit: A, scale: 0.01}
  - {key: l2_current, label: Ib, table: holding, address: 40573, type: s16, unit: A, scale: 0.01}
  - {key: l3_current, label: Ic, table: holding, address: 40574, type: s16, unit: A, scale: 0.01}
  - {key: power_factor, label: Power factor, table: holding, address: 40532, type: s16, scale: 0.001}
  - {key: reactive_power, label: Reactive output power, table: holding, address: 40544, type: s32, unit: var}
  - {key: frequency, label: Frequency, table: holding, address: 40546, type: u16, unit: Hz, scale: 0.01}
  - {key: temperature, label: Cabinet temperature, table: holding, address: 40533, type: s16, unit: °C, scale: 0.1}
  - {key: x.efficiency, label: Inverter efficiency, table: holding, address: 40685, type: u16, unit: '%', scale: 0.01}

  # Energy
  - {key: pv_energy, label: E-Total, table: holding, address: 40560, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: pv_energy_today, label: Current-day yield, table: holding, address: 40562, type: u32, unit: kWh, scale: 0.01}
  - {key: x.co2_reduction, label: CO2 reduction, table: holding, address: 40523, type: u32, unit: kg, scale: 0.01, poll: slow}

  # State
  - {key: state, label: Inverter status, table: holding, address: 40939, type: u16, enum: status}
  - {key: x.grid_tied, label: Inverter on/off status, table: holding, address: 40931, type: u16, bits: [1, 1], enum: on_off}
  - {key: x.startup_time, label: Inverter start time, table: holding, address: 40613, type: u32, unit: s, verified: false, note: The document gives the unit (s) only; presumably epoch seconds as the date and time register 40000 (assumed).}
  - {key: x.shutdown_time, label: Inverter shutdown time, table: holding, address: 40615, type: u32, unit: s, verified: false, note: As 40613 (assumed epoch seconds).}
  - {key: x.zvrt, label: Zero voltage ride through protection, table: holding, address: 40696, type: u16, enum: no_yes}
  - {key: x.lvrt_active, label: LVRT protection, table: holding, address: 40697, type: u16, enum: no_yes}
  - {key: x.anti_islanding_active, label: Anti-islanding, table: holding, address: 40698, type: u16, enum: no_yes}
  - {key: x.locking, label: Locking, table: holding, address: 40699, type: u16, enum: locking}

  # Alarm words (50010 is not defined)
  - {key: x.alarm_50000, label: Alarm word 50000, table: holding, address: 50000, type: u16, flags: alarm_50000}
  - {key: x.alarm_50001, label: Alarm word 50001, table: holding, address: 50001, type: u16, flags: alarm_50001}
  - {key: x.alarm_50002, label: Alarm word 50002, table: holding, address: 50002, type: u16, flags: alarm_50002}
  - {key: x.alarm_50003, label: Alarm word 50003, table: holding, address: 50003, type: u16, flags: alarm_50003}
  - {key: x.alarm_50004, label: Alarm word 50004, table: holding, address: 50004, type: u16, flags: alarm_50004}
  - {key: x.alarm_50005, label: Alarm word 50005, table: holding, address: 50005, type: u16, flags: alarm_50005}
  - {key: x.alarm_50006, label: Alarm word 50006, table: holding, address: 50006, type: u16, flags: alarm_50006}
  - {key: x.alarm_50007, label: Alarm word 50007, table: holding, address: 50007, type: u16, flags: alarm_50007}
  - {key: x.alarm_50008, label: Alarm word 50008, table: holding, address: 50008, type: u16, flags: alarm_50008}
  - {key: x.alarm_50009, label: Alarm word 50009, table: holding, address: 50009, type: u16, flags: alarm_50009}
  - {key: x.alarm_50011, label: Alarm word 50011, table: holding, address: 50011, type: u16, flags: alarm_50011}

  # Settings (read/write)
  - {key: x.clock, label: Date and time synchronization, table: holding, address: 40000, type: u32, epoch: {start: '1970-01-01', unit: s}, writable: true, poll: slow, verified: false, note: Range 0–3155759999; that it counts seconds since 1970 is assumed.}
  - {key: x.grid_code, label: Grid code, table: holding, address: 40002, type: u16, writable: true, min: 0, max: 23, poll: slow, note: The document has no table of the codes.}
  - {key: x.mppt_scan, label: MPPT setting, table: holding, address: 40004, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.reactive_power_mode, label: Reactive power compensation, table: holding, address: 40117, type: u16, enum: reactive_mode, writable: true, poll: slow}
  - {key: x.active_power_mode, label: Active power control, table: holding, address: 40118, type: u16, enum: active_mode, writable: true, poll: slow}
  - {key: x.active_power_limit_percent, label: 'Active power deration setting [percentage]', table: holding, address: 40119, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow}
  - {key: x.active_power_limit, label: 'Active power deration setting [fixed value]', table: holding, address: 40120, type: u16, unit: W, scale: 100, writable: true, min: 0, max: 22000, poll: slow}
  - {key: x.active_power_gradient, label: Active power deration gradient, table: holding, address: 40121, type: u16, unit: '%/s', scale: 0.1, writable: true, min: 0.5, max: 10, poll: slow}
  - {key: x.power_factor_setting, label: 'Reactive power compensation setting [power factor]', table: holding, address: 40122, type: s16, scale: 0.001, writable: true, min: -1, max: 1, poll: slow}
  - {key: x.q_s_setting, label: 'Reactive power compensation setting [Q/S]', table: holding, address: 40123, type: s16, scale: 0.001, writable: true, min: -1, max: 1, poll: slow}

enums:
  model: {'0': SUN2000-20KTL, '1': SUN2000-17KTL, '2': SUN2000-15KTL, '3': SUN2000-12KTL, '4': SUN2000-10KTL, '5': SUN2000-8KTL, '9': SUN2000-500KTL, '16': SUN2000-24.5KTL, '17': SUN2000-23KTL, '18': SUN2000-28KTL, '19': SUN2000-33KTL, '20': SUN2000-40KTL}
  status: {'0': 'Idle: initializing', '1': 'Idle: ISO detecting', '2': 'Idle: irradiation detecting', '256': Starting, '512': On-grid, '513': 'On-grid: limited', '768': 'Shutdown: abnormal', '769': 'Shutdown: forced', '1025': 'Grid dispatch: cosφ-P curve', '1026': 'Grid dispatch: Q-U curve', '40960': 'Idle: no irradiation'}
  on_off: {'0': Shutdown, '1': Grid-tied}
  no_yes: {'0': 'No', '1': 'Yes'}
  locking: {'0': Locked, '1': Not locked}
  disable_enable: {'0': Disabled, '1': Enabled}
  reactive_mode: {'0': Reactive power output disabled, '1': Power factor set by communication, '2': Q/S set by parameter, '3': Power factor set by parameter, '4': Q(U) characteristic curve, '5': Power factor characteristic curve}
  active_mode: {'0': Active power limiting disabled, '1': Percentage set by communication, '2': Absolute value (kW) set by parameter, '3': Percentage set by parameter}

