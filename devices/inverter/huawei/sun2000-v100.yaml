notes:
- The first-generation SUN2000 8–28KTL (firmware V100R001C11SPC409 or later) uses this 40000/50000 register map; later SUN2000
  models use the 30000/32000 map in huawei-sun2000.
- All registers are holding registers read with function 03. The document gives addresses as protocol addresses (e.g. 40002
  = 0x9C42), taken as they are.
- 'Interface: RS485 (Modbus RTU) at 4800, 9600 or 19200 bit/s, 11 bits per character (8 data bits); the default rate, the
  parity and the default slave address (1–247; 1 assumed) aren''t stated, so no serial settings are given here. A slave answers
  within 5 s; at most 125 registers per read.'
- 40710 is named 'Rated inverter power' but holds a model code; the document's table maps each code to a model with its Pmax,
  Qmax and rated power.
- Line voltages (40527–40529) have a gain of 100 in this document (0.01 V), unlike the 0.1 V of later maps.
- 'Alarm words: the document''s ''Bit'' column (0x00–0x0F) is taken as the bit number. Each alarm gives its alarm ID and cause
  ID (shown as ID-cause in the texts). Major alarms are reported as faults, minor ones and warnings as warnings; 301-29 (grid
  failed or AC breaker off) as mains lost.'
- 50004 bits 2 and 3 are named 'String 1/2 Reversed' (cause 2) although the document's cause text describes low string voltage;
  the names are kept as given.
- 'Left out: the grid protection parameters (40006–40076: under/over voltage and frequency thresholds and times, LVRT, soft
  start), Q-U and over-frequency derating parameters, and the write-only commands (power on 40200, power off 40201, active
  power derating 40234, reactive power factor 40237).'
- Sign of the active power 40525 not stated.
