modbusspec: 0
id: huawei-pv-inverter
manufacturer: Huawei
name: SUN2000 PV inverters (register map used by OpenEMS)
kind: inverter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.huawei

connection:
  default_port: 502
  default_unit: 0

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.voltage_l1_l2, label: Voltage l1 l2, table: holding, address: 32274, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: x.voltage_l2_l3, label: Voltage l2 l3, table: holding, address: 32275, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: x.voltage_l3_l1, label: Voltage l3 l1, table: holding, address: 32276, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l1_voltage, label: Voltage l1, table: holding, address: 32277, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l2_voltage, label: Voltage l2, table: holding, address: 32278, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l3_voltage, label: Voltage l3, table: holding, address: 32279, type: u16, unit: V, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l1_current, label: Current l1, table: holding, address: 32280, type: u16, unit: A, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l2_current, label: Current l2, table: holding, address: 32281, type: u16, unit: A, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: l3_current, label: Current l3, table: holding, address: 32282, type: u16, unit: A, scale: 0.01, note: 'The power of ten is an OpenEMS setting (default 1, taken here).'}
  - {key: frequency, label: Frequency, table: holding, address: 32283, type: u16, unit: Hz, scale: 0.01}
  - {key: pv_power, label: Active power, table: holding, address: 32290, type: u32, unit: W, note: Positive = generation (OpenEMS channel active power).}
  - {key: reactive_power, label: Reactive power, table: holding, address: 32292, type: u32, unit: var}
  - {key: x.input_power, label: Input power, table: holding, address: 32294, type: u32, unit: W}
  - {key: pv_energy, label: Active production energy, table: holding, address: 32306, type: u32, unit: kWh, scale: 0.01}
  - {key: x.huawei_active_power_limit, label: Huawei active power limit, table: holding, address: 40235, type: u16, unit: W, scale: 100, writable: true}

notes:
- Addresses differ from the SUN2000 map in huawei-sun2000; OpenEMS names the component just 'PV-Inverter Huawei'.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
