notes:
- The TRIO has RS-485 only (Modbus RTU, 8N1; default 19200 bit/s on the European TRIO-20/27.6, 9600 bit/s on the US/Japan
  versions and the TRIO-5.8/8.5). It is reached through an RS-485 ↔ Modbus TCP gateway; the unit id is the inverter's RS-485
  address (2 is only the documents' example).
- Registers are numbered from 1 ("PLC addresses"); addresses here are register − 1. Some gateways renumber; checking the fixed
  start register (4370) at both 99 and 100 finds the offset.
- Values are IEEE 754 floats in two registers; the word order isn't stated. The right order is the one that gives a grid frequency
  of 40–70 Hz. NaN and 0xFFFFFFFF read as not available.
- Solar power is the inverter's AC output ("Grid power"); the DC inputs are informative. A TRIO doesn't measure the grid connection.
- 'Problems: global states that are faults → fault; inverter state 43 (grid not present) / 46 (grid fail) → mains lost; alarm
  codes Exxx → fault, Wxxx → warning, grid alarms (grid fail, grid OV/UV/OF/UF, df/dt) → mains lost. Not problems: sun low,
  input under-voltage, bulk UV (W011), input UC, zero power (low light) and remote off (an operator command). Any alarm code
  not listed counts as a fault.'
- The TRIO-20/27.6 document also lists alarm 84 (arc fault reset by user, W026) and 85 (arc fault wrong configuration, E055),
  which aren't listed here.
