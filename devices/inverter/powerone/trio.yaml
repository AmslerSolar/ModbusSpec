modbusspec: 0
id: powerone-trio
manufacturer: Power-One / ABB
name: TRIO-5.8/8.5 and TRIO-20.0/27.6-TL-OUTD string inverters (register map GT)
kind: inverter

sources:
- title: Modbus RTU Register Map, TRIO-20.0(27.6)-TL-OUTD
  version: GT05, Rev. 1.6 (11/02/2016)
- title: Modbus RTU registers map for TRIO (TRIO-5.8/8.5-TL-OUTD)
  version: GB00, Rev. 0.2 (23/07/2015)

connection:
  default_port: 502
  default_unit: 2
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 76
    max_gap: 4
  sleeps: true   # powered by its panels: silent after sunset

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: input
    address: 149
    type: f32
    plausible:
    - 40
    - 70

identify:
  serial:
    table: input
    address: 103
    type: str
    length: 6
    chars: low
  checks:
  - table: input
    address: 99
    type: u16
    equals: 4370


