notes:
- RS-485 only (Modbus RTU; 19200 bit/s, no parity by default, even or odd selectable). It is reached through an RS-485 ↔ Modbus
  TCP gateway; the unit id is the inverter's RS-485 address (1–247; 2 is only the document's example). The serial port must
  be set to "Modbus RTU Slave" (not Aurora or SunSpec).
- Data address X is sent as X − 1 (stated); addresses here are protocol addresses. Some gateways renumber; checking the fixed
  Inverter ID (261) at both 999 and 1000 finds the offset.
- Floats are word-swapped IEEE 754 (low word first, stated); U32 values are high word first.
- A request may span unmapped registers only if it starts and ends on mapped ones; strings and 32-bit values must be read
  whole. DC inputs 2 and 3 (1114–1119, 1130–1135) are marked TRIO-TM only; a request ending at 1135 might be rejected by a
  TRIO-50/60-TL if those registers aren't mapped there (unverified).
- Energies are in Wh (the document's table; its encoding example calls the same value kWh).
- Solar power is the inverter's AC output; the DC inputs are informative. A TRIO doesn't measure the grid connection.
- 'Problems: global states that are faults → fault; alarm codes Exxx → fault, Wxxx → warning, W015 island detected → mains
  lost; derating bits → warning except bit 0 (user curtailment), 4 (nameplate current limit) and 7 (storage zero-injection).
  Not problems: input UV, bulk UV (W011) and remote off. Any alarm code not listed counts as a fault.'
