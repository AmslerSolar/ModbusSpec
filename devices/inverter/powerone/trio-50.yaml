  - {key: x.isolation_resistance, label: Isolation resistance, table: input, address: 1125, type: f32, unit: MΩ, poll: slow, note: Value measured at start-up.}
  - {key: x.max_leakage_current, label: Max leakage current, table: input, address: 1127, type: f32, unit: A, poll: slow, note: In case of a ground fault.}

