# Written from Power-One's Modbus RTU Register Map for the TRIO-50.0/60.0-TL-OUTD and TRIO-TM (Gt03.0, Rev. 3.4).

modbusspec: 0
id: powerone-trio-50
manufacturer: Power-One / ABB
name: TRIO-50.0/60.0-TL-OUTD and TRIO-TM-50.0/60.0 string inverters (register map Gt03)
kind: inverter

sources:
- title: Modbus RTU Register Map, TRIO-50.0/60.0-TL-OUTD, TRIO-TM-50.0-400, TRIO-TM-60.0-480
  version: Gt03.0, Rev. 3.4 (10/06/2019)

connection:
  default_port: 502
  default_unit: 2
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 86
    max_gap: 15
  sleeps: true   # powered by its panels: silent after sunset

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 1008
    type: str
    length: 6
    chars: low
  checks:
  - table: input
    address: 999
    type: u16
    equals: 261

models:
  - {id: trio_50_eu, name: TRIO-50-TL-OUTD-EU, match: {table: input, address: 1021, type: u16, equals: 40}}
  - {id: trio_60, name: TRIO-60-TL-OUTD, match: {table: input, address: 1021, type: u16, equals: 47}}
  - {id: trio_50_us, name: TRIO-50-TL-OUTD-US, match: {table: input, address: 1021, type: u16, equals: 41}}
  - {id: trio_60_us, name: TRIO-60-TL-OUTD-US, match: {table: input, address: 1021, type: u16, equals: 58}}
  - {id: trio_50_jp, name: TRIO-50-TL-OUTD-JP, match: {table: input, address: 1021, type: u16, equals: 59}}
  - {id: trio_tm, name: TRIO-TM-50.0/60.0, match: {table: input, address: 1021, type: u16, equals: 92}}

points:
