derived:
  - {key: pv_power, label: PV power (Ppv1 + Ppv2 + Ppv3), unit: W, sum: [{key: x.pv1_power}, {key: x.pv2_power}, {key: x.pv3_power}]}
  - {key: battery_power, label: Battery power (Pdischarge − Pcharge), unit: W, positive: discharge, sum: [{key: x.discharge_power}, {key: x.charge_power, factor: -1}]}
  - {key: grid_power, label: Grid power (Ptogrid − Ptouser), unit: W, positive: export, sum: [{key: x.export_power}, {key: x.import_power, factor: -1}]}
  - {key: pv_energy, label: PV energy (Epv1_all + Epv2_all + Epv3_all), unit: kWh, sum: [{key: x.pv1_energy}, {key: x.pv2_energy}, {key: x.pv3_energy}]}
  - {key: pv_energy_today, label: PV energy today (Epv1_day + Epv2_day + Epv3_day), unit: kWh, sum: [{key: x.pv1_energy_today}, {key: x.pv2_energy_today}, {key: x.pv3_energy_today}]}
  - {key: x.energy_daily_grid_net, label: Energy Daily Grid Net, unit: kWh, sum: [{key: x.import_energy_today}, {key: x.export_energy_today, factor: -1}], sources: [eg4-inverter-modbus], verified: false}
  - {key: x.energy_cumulative_grid_net, label: Energy Cumulative Grid Net, unit: kWh, sum: [{key: grid_import_energy}, {key: grid_export_energy, factor: -1}], sources: [eg4-inverter-modbus], verified: false}
  - {key: x.pv_total_power, label: PV power, unit: W, sum: [{key: x.pv1_power}, {key: x.pv2_power}, {key: x.pv3_power}, {key: x.pv4_power}, {key: x.pv5_power}, {key: x.pv6_power}], note: pylxpweb leaves out strings the inverter doesn't report (pv4…pv6 on three-string models)., verified: false, sources: [pylxpweb]}

enums:
  state: {'0': Standby, '1': Fault, '2': Programming (firmware update), '4': PV on-grid, '8': PV charge, '12': PV charge + on-grid, '16': Battery on-grid, '20': PV + battery on-grid, '32': AC charge, '40': PV + AC charge, '64': Battery off-grid, '128': PV off-grid, '136': PV charge + off-grid, '192': PV + battery off-grid}
  ac_input_type: {'0': Grid, '1': Generator}
  master_slave: {'1': Master, '2': Slave}
  phase: {'1': R, '2': S, '3': T}
  disable_enable: {'0': Disabled, '1': Enabled}
  standby: {'0': Standby, '1': Power on}
  system_type: {'0': No parallel, '1': Single-phase parallel (master), '2': Slave, '3': Three-phase parallel (master)}
  output_priority: {'0': Battery first, '1': PV first, '2': AC first}
  line_mode: {'0': 'APL (90–280 V, 20 ms)', '1': 'UPS (170–280 V, 10 ms)', '2': 'GEN (90–280 V, 20 ms)'}
  ac_input_type_codes: {'0': Grid, '1': Generator}
  setting_language: {'0': Chinese, '1': English, '2': Spanish, '3': German}
  setting_reactive_power_cmd_type: {'0': Unit power factor, '1': Fixed PF, '2': Default PF curve (Q(P)), '3': Custom PF curve, '4': Capacitive reactive power percentage, '5': Inductive reactive power percentage, '6': Q(V) curve, '7': Q(V) Dynamic}
  setting_functionen1_ctsampleratio: {'0': 1/1000, '1': 1/3000}
  setting_functionen1_pvctsampletype: {'0': PV power, '1': SpecLoad}
  setting_functionen1_ongridworkingmode: {'0': Self consumption, '1': Charge First}
  setting_composed_phase: {'1': R Phase, '2': S Phase, '3': T Phase}
  setting_ac_charge_type: {'0': Disable, '1': According to Time, '2': According to Voltage, '3': According to SOC, '4': According to Voltage and Time, '5': According to SOC and Time}
  setting_discharge_control_type: {'0': According to Voltage, '1': According to SOC, '2': According to Both}
  setting_ongrid_eod_type: {'0': According to Voltage, '1': According to SOC}
  setting_generator_charge_type: {'0': According to Battery Voltage, '1': According to Battery SOC}
  setting_ufunctionen2_smart_load_en: {'0': Generator, '1': Smart Load}
  setting_ufunctionen2_rsd_disable: {'0': Enabled, '1': Disabled}
  setting_grid_type: {'0': Split 240V, '1': Split 208V, '2': Single 240V, '3': Single 230V, '4': Split 200V}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  no_action_charging_discharging: {'0': No action, '1': Charging, '2': Discharging}
  lsp_battery_volt_or_soc: {'0': voltage, '1': SOC}
  ac_charge_enable_period_1: {'0': 'Off', '1': 'On'}
  ac_charge_enable_period_2: {'0': 'Off', '1': 'On'}
  ac_ct_direction: {'0': Normal, '1': Reversed}
  pv_ct_direction: {'0': Normal, '1': Reversed}
  weekly_schedule_enable: {'0': daily regs 68-89, '1': weekly regs 500-723}

flags:
  fault_code: {'0': E000 Internal communication fault 1, '1': E001 Model fault, '8': E008 Parallel CAN communication lost, '9': E009 Master unit lost in parallel system, '10': E010 Several master units in parallel system, '11': E011 AC input inconsistent in parallel system, '12': E012 UPS (backup output) short circuit, '13': E013 Reverse current on UPS output, '14': E014 Bus short circuit, '15': E015 Grid phases inconsistent in three-phase parallel system, '16': E016 Relay check fault, '17': E017 Internal communication fault 2, '18': E018 Internal communication fault 3, '19': E019 Bus voltage high, '20': E020 EPS connection fault, '21': E021 PV voltage high, '22': E022 Overcurrent protection, '23': E023 Neutral fault, '24': E024 PV short circuit, '25': E025 Radiator temperature out of range, '26': E026 Internal fault, '27': E027 Sample inconsistent between main and redundant CPU, '31': E031 Internal communication fault 4}
  warning_code: {'0': W000 Battery communication failure, '1': W001 AFCI communication failure, '2': W002 AFCI high, '3': W003 Meter communication failure, '4': W004 Charge and discharge both forbidden by the battery, '5': W005 Auto test failed, '7': W007 LCD communication failure, '8': W008 Firmware version mismatch, '9': W009 Fan stuck, '11': W011 Parallel number out of range, '15': W015 Battery reverse connection, '16': W016 Grid power outage, '17': W017 Grid voltage out of range, '18': W018 Grid frequency out of range, '20': W020 PV insulation low, '21': W021 Leakage current high, '22': W022 DCI high, '23': W023 PV short circuit, '25': W025 Battery voltage high, '26': W026 Battery voltage low, '27': W027 Battery open circuit, '28': W028 EPS overload, '29': W029 EPS voltage high, '30': W030 Meter reverse connection, '31': W031 DCV high}
  afci: {'0': Arc alarm CH1, '1': Arc alarm CH2, '2': Arc alarm CH3, '3': Arc alarm CH4, '4': Self-test failed CH1, '5': Self-test failed CH2, '6': Self-test failed CH3, '7': Self-test failed CH4}

