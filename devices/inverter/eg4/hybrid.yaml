  - {key: x.eps_l2n_power, label: Peps_L2N, table: input, address: 130, type: u16, unit: W}
  - {key: x.eps_l1n_apparent_power, label: Seps_L1N, table: input, address: 131, type: u16, unit: VA}
  - {key: x.eps_l2n_apparent_power, label: Seps_L2N, table: input, address: 132, type: u16, unit: VA}
