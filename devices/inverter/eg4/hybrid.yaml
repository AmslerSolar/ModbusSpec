  - {key: x.min_cell_voltage, label: MinCellVolt_BMS, table: input, address: 102, type: u16, unit: V, scale: 0.001}
  - {key: x.max_cell_temperature, label: MaxCellTemp_BMS, table: input, address: 103, type: s16, unit: °C, scale: 0.1}
