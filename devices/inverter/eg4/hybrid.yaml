# Written from the EG4 18KPV-12LV Modbus RTU Protocol (undated).

modbusspec: 0
id: eg4-hybrid
manufacturer: EG4
name: Hybrid inverters (PV series, FlexBOSS)
kind: inverter

sources:
- title: EG4 18KPV-12LV Modbus RTU Protocol
  version: undated
  url: https://www.dth.net/solar/luxpower/modbus/EG4-18KPV-12LV-Modbus-Protocol.pdf
  sha256: 21d4d2083d4fce97e43e614dbe9ce73039b83e8bb5a604debc47f62425536fb5
  archive_url: https://web.archive.org/web/20250201080654/https://www.dth.net/solar/luxpower/modbus/EG4-18KPV-12LV-Modbus-Protocol.pdf
- id: eg4-inverter-modbus
  title: EG4-Inverter-Modbus (Home Assistant integration)
  url: https://github.com/poldim/EG4-Inverter-Modbus
  license: GPL-3.0
  commit: a6735554e50a17f3ee7437650b9ba4d8f4eaad1a
  path: custom_components/eg4_inverter_modbus/hub.py, custom_components/eg4_inverter_modbus/const.py
- id: eg4-web-monitor
  title: eg4_web_monitor (Home Assistant integration)
  url: https://github.com/joyfulhouse/eg4_web_monitor
  license: MIT
  commit: 77e6c8652d46042e2a919c8e461ddd2c10724c3a
  path: custom_components/eg4_web_monitor/const/operating_state.py
- id: pylxpweb
  title: pylxpweb (Python library for EG4 / LuxPower inverters, used by eg4_web_monitor)
  url: https://github.com/joyfulhouse/pylxpweb
  license: MIT
  commit: bce390936f2068000b7a53e2e981e9399139753f
  path: src/pylxpweb/registers/inverter_input.py, src/pylxpweb/registers/inverter_holding.py, src/pylxpweb/registers/scheduling.py,
    src/pylxpweb/registers/battery.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 40
    min_interval_ms: 1000

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: holding
    address: 2
    type: str
    length: 5
    byte_order: little
  any:
  - table: holding
    address: 19
    type: u16
    equals: 2092
  - table: holding
    address: 19
    type: u16
    equals: 10284

models:
  - {id: pv_series, name: PV SERIES, match: {table: holding, address: 19, type: u16, equals: 2092}}
  - {id: flexboss, name: FLEXBOSS, match: {table: holding, address: 19, type: u16, equals: 10284}}

points:
  # Input registers (function 04): running data
  - {key: state, label: State, table: input, address: 0, type: u16, enum: state}
  - {key: x.pv1_voltage, label: Vpv1, table: input, address: 1, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: Vpv2, table: input, address: 2, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_voltage, label: Vpv3, table: input, address: 3, type: u16, unit: V, scale: 0.1}
  - {key: battery_voltage, label: Vbat, table: input, address: 4, type: u16, unit: V, scale: 0.1}
  - {key: battery_soc, label: SOC, table: input, address: 5, type: u16, bits: [0, 7], unit: '%', note: SOC and SOH share register 5; low byte = SOC assumed from the order of the table (as for the version bytes in holding 9/10)., verified: false}
  - {key: battery_soh, label: SOH, table: input, address: 5, type: u16, bits: [8, 15], unit: '%', verified: false}
  - {key: x.internal_fault, label: InternalFault, table: input, address: 6, type: u16, note: Internal DTC (the code table isn't in the document).}
  - {key: x.pv1_power, label: Ppv1, table: input, address: 7, type: u16, unit: W}
  - {key: x.pv2_power, label: Ppv2, table: input, address: 8, type: u16, unit: W}
  - {key: x.pv3_power, label: Ppv3, table: input, address: 9, type: u16, unit: W}
  - {key: x.charge_power, label: Pcharge (battery charging power), table: input, address: 10, type: u16, unit: W}
  - {key: x.discharge_power, label: Pdischarge (battery discharging power), table: input, address: 11, type: u16, unit: W}
  - {key: l1_voltage, label: VacR (R-phase mains voltage), table: input, address: 12, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: VacS (S-phase mains voltage), table: input, address: 13, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: VacT (T-phase mains voltage), table: input, address: 14, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: Fac (mains frequency), table: input, address: 15, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_power, label: 'Pinv (inverter output power, grid port)', table: input, address: 16, type: u16, unit: W}
  - {key: x.rectifier_power, label: Prec (AC charging rectified power), table: input, address: 17, type: u16, unit: W}
  - {key: x.inverter_current, label: IinvRMS, table: input, address: 18, type: u16, unit: A, scale: 0.01}
  - {key: x.power_factor_raw, label: PF, table: input, address: 19, type: u16, note: 'Coded: x in (0, 1000] gives x / 1000; x in (1000, 2000) gives (1000 − x) / 1000. The quotient form can''t be expressed here, so the raw value is given.', conflicts: [{sources: [eg4-inverter-modbus, pylxpweb], scale: 0.001, label: Power Factor Inverter}]}
  - {key: x.eps_voltage_r, label: VepsR (R-phase off-grid output voltage), table: input, address: 20, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_voltage_s, label: VepsS (S-phase off-grid output voltage), table: input, address: 21, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_voltage_t, label: VepsT (T-phase off-grid output voltage), table: input, address: 22, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_frequency, label: Feps (off-grid output frequency), table: input, address: 23, type: u16, unit: Hz, scale: 0.01}
  - {key: x.eps_power, label: Peps (off-grid inverter power), table: input, address: 24, type: u16, unit: W}
  - {key: x.eps_apparent_power, label: Seps (off-grid apparent power), table: input, address: 25, type: u16, unit: VA}
  - {key: x.export_power, label: Ptogrid (export power to grid), table: input, address: 26, type: u16, unit: W}
  - {key: x.import_power, label: Ptouser (import power from grid), table: input, address: 27, type: u16, unit: W}
  - {key: x.pv1_energy_today, label: Epv1_day, table: input, address: 28, type: u16, unit: kWh, scale: 0.1}
  - {key: x.pv2_energy_today, label: Epv2_day, table: input, address: 29, type: u16, unit: kWh, scale: 0.1}
  - {key: x.pv3_energy_today, label: Epv3_day, table: input, address: 30, type: u16, unit: kWh, scale: 0.1}
  - {key: x.inverter_energy_today, label: Einv_day, table: input, address: 31, type: u16, unit: kWh, scale: 0.1}
  - {key: x.rectifier_energy_today, label: Erec_day (AC charging), table: input, address: 32, type: u16, unit: kWh, scale: 0.1}
  - {key: x.charge_energy_today, label: Echg_day, table: input, address: 33, type: u16, unit: kWh, scale: 0.1}
  - {key: x.discharge_energy_today, label: Edischg_day, table: input, address: 34, type: u16, unit: kWh, scale: 0.1}
  - {key: x.eps_energy_today, label: Eeps_day, table: input, address: 35, type: u16, unit: kWh, scale: 0.1}
  - {key: x.export_energy_today, label: Etogrid_day, table: input, address: 36, type: u16, unit: kWh, scale: 0.1}
  - {key: x.import_energy_today, label: Etouser_day, table: input, address: 37, type: u16, unit: kWh, scale: 0.1}
  - {key: x.bus1_voltage, label: Vbus1, table: input, address: 38, type: u16, unit: V, scale: 0.1}
  - {key: x.bus2_voltage, label: Vbus2, table: input, address: 39, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_energy, label: Epv1_all, table: input, address: 40, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.pv2_energy, label: Epv2_all, table: input, address: 42, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.pv3_energy, label: Epv3_all, table: input, address: 44, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.inverter_energy, label: Einv_all, table: input, address: 46, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.rectifier_energy, label: Erec_all (AC charging), table: input, address: 48, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.charge_energy, label: Echg_all, table: input, address: 50, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.discharge_energy, label: Edischg_all, table: input, address: 52, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.eps_energy, label: Eeps_all, table: input, address: 54, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: grid_export_energy, label: Etogrid_all, table: input, address: 56, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: grid_import_energy, label: Etouser_all, table: input, address: 58, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.fault_code, label: FaultCode, table: input, address: 60, type: u32, flags: fault_code}
  - {key: x.warning_code, label: WarningCode, table: input, address: 62, type: u32, flags: warning_code}
  - {key: temperature, label: Tinner (internal temperature), table: input, address: 64, type: s16, unit: °C}
  - {key: x.radiator1_temperature, label: Tradiator1, table: input, address: 65, type: s16, unit: °C}
  - {key: x.radiator2_temperature, label: Tradiator2, table: input, address: 66, type: s16, unit: °C}
  - {key: battery_temperature, label: Tbat, table: input, address: 67, type: s16, unit: °C}
  - {key: x.running_time, label: RunningTime, table: input, address: 69, type: u32, unit: s, poll: slow, conflicts: [{sources: [eg4-inverter-modbus], unit: d, scale: 1.157407407e-05, label: Inverter Uptime}]}
  - {key: x.ac_input_type, label: ACInputType, table: input, address: 77, type: u16, enum: ac_input_type, poll: slow, note: Given for the 12K hybrid.}
  - {key: x.bms_max_charge_current, label: MaxChgCurr (BMS limit), table: input, address: 81, type: u16, unit: A, scale: 0.01}
  - {key: x.bms_max_discharge_current, label: MaxDischgCurr (BMS limit), table: input, address: 82, type: u16, unit: A, scale: 0.01}
  - {key: x.bms_charge_voltage, label: ChargeVoltRef (BMS recommended charging voltage), table: input, address: 83, type: u16, unit: V, scale: 0.1}
  - {key: x.bms_discharge_cutoff_voltage, label: DischgCutVolt (BMS recommended discharge cut-off), table: input, address: 84, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_parallel_count, label: BatParallelNum, table: input, address: 96, type: u16, poll: slow}
  - {key: x.battery_capacity, label: BatCapacity, table: input, address: 97, type: u16, unit: Ah, poll: slow}
  - {key: battery_current, label: BatCurrent_BMS, table: input, address: 98, type: s16, unit: A, scale: 0.01, positive: charge, note: Signed; the document doesn't say which direction is positive (charging assumed)., conflicts: [{sources: [eg4-inverter-modbus, pylxpweb], scale: 0.1, label: Battery Current}], verified: false}
  - {key: x.bms_fault_code, label: FaultCode_BMS, table: input, address: 99, type: u16, note: Codes not listed in the document.}
  - {key: x.bms_warning_code, label: WarningCode_BMS, table: input, address: 100, type: u16, note: Codes not listed in the document.}
