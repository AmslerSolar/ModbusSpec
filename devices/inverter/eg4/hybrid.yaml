  - {key: x.power_on, label: FuncEn.SetToStandby, table: holding, address: 21, type: u16, bits: [9, 9], enum: standby, writable: true, poll: slow}
  - {key: x.forced_discharge_enable, label: FuncEn.ForcedDischgEn, table: holding, address: 21, type: u16, bits: [10, 10], enum: disable_enable, writable: true, poll: slow}
  - {key: x.forced_charge_enable, label: FuncEn.ForcedChgEn, table: holding, address: 21, type: u16, bits: [11, 11], enum: disable_enable, writable: true, poll: slow}
