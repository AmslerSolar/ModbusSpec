  # Holding registers (function 03, write 06; 10 only for serial number and time)
  - {key: serial, label: 'SN[0]–SN[9]', table: holding, address: 2, type: str, length: 5, byte_order: little, poll: slow, note: 'Ten ASCII characters, two per register, the first of each pair in the low byte (e.g. AB12345678).'}
  - {key: x.slave_version, label: Slave Ver (redundant CPU firmware), table: holding, address: 9, type: u16, bits: [0, 7], poll: slow}
  - {key: x.com_version, label: Com Ver (communication CPU firmware), table: holding, address: 9, type: u16, bits: [8, 15], poll: slow}
  - {key: x.control_version, label: Cntl Ver (control CPU firmware), table: holding, address: 10, type: u16, bits: [0, 7], poll: slow}
  - {key: firmware, label: FWVer (firmware version code), table: holding, address: 10, type: u16, bits: [8, 15], poll: slow}
