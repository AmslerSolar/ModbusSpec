  - {key: x.battery_cycles, label: CycleCnt_BMS, table: input, address: 106, type: u16, poll: slow}
  - {key: x.battery_voltage_inverter, label: BatVoltSample_INV, table: input, address: 107, type: u16, unit: V, scale: 0.1}
  - {key: x.master_or_slave, label: MasterOrSlave, table: input, address: 113, type: u16, bits: [0, 1], enum: master_slave, poll: slow}
  - {key: x.parallel_phase, label: SingleOrThreePhase, table: input, address: 113, type: u16, bits: [2, 3], enum: phase, poll: slow}
  - {key: x.parallel_count, label: ParallelNum, table: input, address: 113, type: u16, bits: [8, 15], poll: slow}
  - {key: x.generator_voltage, label: GenVolt, table: input, address: 121, type: u16, unit: V, scale: 0.1}
  - {key: x.generator_frequency, label: GenFreq, table: input, address: 122, type: u16, unit: Hz, scale: 0.01}
