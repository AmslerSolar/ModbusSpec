notes:
- RS-485, 19200 baud 8N1, minimum polling period 1 s. Function codes 03, 04, 06 and 10 (10 only for the serial number and
  the clock). Port 502 only applies behind an RS485-to-TCP gateway; unit 1 is not stated (assumed).
- 'At most 40 registers per request, and a request must stay inside one group of 40 (0–39, 40–79, 80–119 …): registers 38–40
  take two requests.'
- The document's own frame puts a 10-byte serial number after the function code and sends every 16-bit field (addresses, counts,
  values) low byte first. This file describes the registers for standard Modbus framing, with register values high byte first;
  that byte order is assumed, not stated. 32-bit values are low word first, as the document states (pairs given as L / H registers).
- Register numbers are the document's addresses, used as 0-based protocol addresses.
- 'Values the document marks as signed (green): PF (19), temperatures 64–67; also the BMS current (98), cell temperatures
  (103/104) and the CT offset (holding 119). All others are unsigned.'
- Where two 8-bit fields share a register, the first listed is taken as the low byte (holding 9/10, input 5, holding 12–14);
  the document doesn't say so.
- Battery and grid power come as separate unsigned charge/discharge and export/import registers; the derived values combine
  them.
- 'Left out: auto-test (71–75), BMS status words (85–95), AFCI currents and arc values (140–143, 145–152), reserved temperatures
  (108–112), the reset command bits (holding 11), grid-code protection settings (holding 22–59, 92–97, 115–136 and similar),
  time-of-use schedules (holding 68–89, 126–131, 152–157), lead-acid settings and the remaining battery / generator charging
  settings.'
- Identification as pylxpweb recognises the device (not checked against a document).
- Read through an RS485-to-Ethernet gateway on the inverter's Modbus port.
- The battery block repeats every 30 input registers from 5000, read for up to 6 batteries; a slot counts as present when
  its register at offset 2 reads 0xC002 or its capacity (offset 3) is between 1 and 1999.
- 32-bit values are two registers, low word first.
- Operating states from 0x40 up are off-grid.
- Text values (the inverter serial number at input 115-119 or holding 2-6, battery serial numbers) hold two ASCII characters
  per register, low byte first; they are not listed as points.
- The battery block repeats every 30 registers from input 5002, one block per battery slot; with more batteries than slots
  the inverter rotates them through the slots.
- Besides Modbus TCP / RTU, the WiFi dongle carries the same registers over its own TCP protocol on port 8000.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
