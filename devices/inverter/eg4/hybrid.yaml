  - {key: x.generator_energy_today, label: Egen_day, table: input, address: 124, type: u16, unit: kWh, scale: 0.1}
  - {key: x.generator_energy, label: Egen_all, table: input, address: 125, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.eps_l1n_voltage, label: EPSVoltL1N, table: input, address: 127, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_l2n_voltage, label: EPSVoltL2N, table: input, address: 128, type: u16, unit: V, scale: 0.1}
