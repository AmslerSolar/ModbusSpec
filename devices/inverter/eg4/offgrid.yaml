enums:
  operating_state: {'0': Standby, '1': Fault, '2': Programming, '4': PV → Grid, '8': PV → Battery, '12': PV → Battery + Grid, '16': Battery → Grid, '17': Standby, '20': PV + Battery → Grid, '32': AC → Battery, '40': PV + AC → Battery, '64': Off-Grid (Battery), '96': Off-Grid (AC-Coupled Charging), '128': 'Off-Grid (PV, unstable)', '136': Off-Grid (PV + Charging), '192': Off-Grid (PV + Battery)}
  bms_fault_code: {'0': Normal / No Fault, '1': Cell Over-Voltage Protection (COVP), '2': Cell Under-Voltage Protection (CUVP), '3': Pack Overvoltage, '4': Pack Undervoltage, '5': Charging Over-Temperature Protection (COTP), '6': Charging Under-Temperature Protection (CUTP), '7': Discharging Over-Temperature Protection (DOTP), '8': Low Temperature Protection, '9': Charging Overcurrent, '10': Discharging Overcurrent, '11': Short Circuit, '12': MOSFET Over-Temperature, '13': Cell Unbalance, '14': Over-Capacity}
  bms_warning_code: {'0': Normal / No Warning, '1': Cell Over-Voltage Warning, '2': Cell Under-Voltage Warning, '3': Pack Overvoltage Warning, '4': Pack Undervoltage Warning, '5': Charging Over-Temperature Warning, '6': Charging Under-Temperature Warning, '7': Discharging Over-Temperature Warning, '8': Low Temperature Warning, '9': Charging Overcurrent Warning, '10': Discharging Overcurrent Warning, '11': Short Circuit Warning, '12': MOSFET Over-Temperature Warning, '13': Cell Unbalance Warning, '14': Over-Capacity Warning}
  language: {'0': English, '1': German/Chinese}
  power_on: {'0': Standby, '1': Power On}
  lsp_battery_volt_or_soc: {'0': voltage, '1': SOC}
  ac_charge_enable_period_1: {'0': 'Off', '1': 'On'}
  ac_charge_enable_period_2: {'0': 'Off', '1': 'On'}
  output_voltage_select: {'0': 230V, '1': 240V, '2': 277V, '3': 208V}
  output_frequency_select: {'0': 50Hz, '1': 60Hz}
  system_type: {'0': Single, '1': Master, '2': Slave, '3': 3-Phase Master}
  ongrid_eod_type: {'0': voltage, '1': SOC}
  output_priority: {'0': Battery First, '1': PV First, '2': AC First}
  line_mode: {'0': APL (normal), '1': UPS, '2': GEN (generator)}
  ac_ct_direction: {'0': Normal, '1': Reversed}
  pv_ct_direction: {'0': Normal, '1': Reversed}
  battery_charge_control: {'0': SOC, '1': Voltage}
  battery_discharge_control: {'0': SOC, '1': Voltage}
  smart_load_enable: {'0': Generator, '1': Smart Load}
  rsd_disable: {'0': RSD enabled, '1': RSD disabled}
  weekly_schedule_enable: {'0': daily regs 68-89, '1': weekly regs 500-723}

flags:
  fault_code: {'0': Internal communication failure 1, '1': Model fault, '8': Parallel CAN communication failure, '9': The host is missing, '10': Inconsistent rated power, '11': Inconsistent AC or safety settings, '12': UPS short circuit, '13': UPS reverse current, '14': BUS short circuit, '15': Abnormal phase in three-phase system, '16': Relay failure, '17': Internal communication failure 2, '18': Internal communication failure 3, '19': BUS overvoltage, '20': EPS connection fault, '21': PV overvoltage, '22': Overcurrent protection, '23': Neutral fault, '24': PV short circuit, '25': Heatsink temperature out of range, '26': Internal failure, '27': Consistency failure, '28': Inconsistent generator connection, '29': Parallel sync signal loss, '31': Internal communication failure 4}
  warning_code: {'0': Battery communication failed, '1': AFCI communication failure, '2': Battery low temperature, '3': Meter communication failed, '4': Battery cannot be charged/discharged, '5': Automated test failed, '6': RSD Active, '7': LCD communication failure, '8': Software version mismatch, '9': Fan is stuck, '10': Grid overload, '11': Number of parallel secondaries exceeds limit, '12': Battery reverse MOS abnormal, '13': Radiator temperature out of range, '14': Multiple primary units set in parallel system, '15': Battery reverse, '16': No grid connection, '17': Grid voltage out of range, '18': Grid frequency out of range, '20': Insulation resistance low, '21': Leakage current too high, '22': DCI exceeded standard, '23': PV short circuit, '25': Battery overvoltage, '26': Battery undervoltage, '27': Battery open circuit, '28': EPS overload, '29': EPS voltage high, '30': Meter reversed, '31': DCV exceeded standard}

notes:
- Operating states from 0x40 up are off-grid.
- 32-bit values are two registers, low word first.
- Text values (the inverter serial number at input 115-119 or holding 2-6, battery serial numbers) hold two ASCII characters
  per register, low byte first; they are not listed as points.
- The battery block repeats every 30 registers from input 5002, one block per battery slot; with more batteries than slots
  the inverter rotates them through the slots.
- Besides Modbus TCP / RTU, the WiFi dongle carries the same registers over its own TCP protocol on port 8000.
- Identification as pylxpweb recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
