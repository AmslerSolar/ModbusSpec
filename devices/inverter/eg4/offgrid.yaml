modbusspec: 0
id: eg4-offgrid
manufacturer: EG4
name: Off-grid inverters (SNA / XP series)
kind: inverter

sources:
- id: eg4-web-monitor
  title: eg4_web_monitor (Home Assistant integration)
  url: https://github.com/joyfulhouse/eg4_web_monitor
  license: MIT
  commit: 77e6c8652d46042e2a919c8e461ddd2c10724c3a
  path: custom_components/eg4_web_monitor/const/operating_state.py
- id: pylxpweb
  title: pylxpweb (Python library for EG4 / LuxPower inverters, used by eg4_web_monitor)
  url: https://github.com/joyfulhouse/pylxpweb
  license: MIT
  commit: bce390936f2068000b7a53e2e981e9399139753f
  path: src/pylxpweb/registers/inverter_input.py, src/pylxpweb/registers/inverter_holding.py, src/pylxpweb/registers/scheduling.py,
    src/pylxpweb/registers/battery.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 40

encoding:
  word_order: little

identify:
  serial:
    table: input
    address: 115
    type: str
    length: 5
    byte_order: little
  any:
  - table: holding
    address: 19
    type: u16
    equals: 54
  - table: holding
    address: 19
    type: u16
    equals: 38
  - table: holding
    address: 19
    type: u16
    equals: 2102

defaults:
  verified: false
  sources:
  - pylxpweb

models:
  - {id: sna, name: SNA, match: {table: holding, address: 19, type: u16, equals: 54}}
  - {id: sna_6000xp, name: SNA 6000XP, match: {table: holding, address: 19, type: u16, equals: 38}}
  - {id: sna_12000xp, name: SNA 12000XP, match: {table: holding, address: 19, type: u16, equals: 2102}}

