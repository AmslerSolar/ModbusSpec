  - {key: x.leakage_current, label: Leakage current, table: holding, address: 14377, type: s16, unit: mA, scale: 0.1, conflicts: [{sources: [solarman], type: u16, label: Leakage Current}]}
  - {key: x.dci_r, label: R phase DCI, table: holding, address: 14386, type: s16, unit: mA, scale: 0.1}
  - {key: x.dci_s, label: S phase DCI, table: holding, address: 14387, type: s16, unit: mA, scale: 0.1}
  - {key: x.dci_t, label: T phase DCI, table: holding, address: 14388, type: s16, unit: mA, scale: 0.1}
  - {key: x.insulation_resistance, label: DC insulation resistance, table: holding, address: 14389, type: u16, unit: kΩ}
  - {key: x.efficiency, label: Machine efficiency, table: holding, address: 14466, type: u16, unit: '%', scale: 0.1}
  - {key: x.rtc_state, label: RTC state, table: holding, address: 14467, type: u16, enum: rtc_state, poll: slow}
  - {key: x.meter_comm_quality, label: Meter communication quality, table: holding, address: 14468, type: u16, unit: '%', scale: 0.1}
  - {key: x.daily_peak_power, label: Daily peak power, table: holding, address: 14540, type: u32, unit: W}

  # Temperatures
