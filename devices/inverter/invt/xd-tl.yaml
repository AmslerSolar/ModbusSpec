notes:
- The document covers the XG grid-tied series (single- and three-phase) and the XD single-phase hybrid series. Grid-tied models
  answer 0x3000–0x307D and 0x3800–0x387D; hybrids also 0x3100–0x317D, 0x387D–0x38FA and 0x3900–0x397D. Points of the hybrid
  areas are marked with the hybrid model.
- Everything is read with function 03 and written with function 10h (06 is also listed); addresses are the document's hex
  addresses, already 0-based. At most 125 registers per request.
- RS485 only, fixed 9600 baud 8N1 (0x3013 can switch to 115200); the unit id is set on the keypad (1–247) and isn't given
  a default in the document, 1 is assumed. A broadcast address 0 answers like the own address (one inverter on the bus only).
- The fault and alarm codes are shown as main-sub (e.g. 31-03 no mains voltage, 04-08 meter communication); the enums name
  the main code groups only. The full sub-code tables are in the document's appendix.
- 'Left out: the grid-protection, ride-through, QU curve, snow-removal, AFCI, auto-test and fuse-detection settings and readings,
  per-string currents, battery 2 registers, the debugging registers, harmonics, the fault log (0x4000 ff.), I/V scan and waveform
  areas. 0x38D0 holds date and time as milliseconds since 1970 (u64), which can''t be expressed yet.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
