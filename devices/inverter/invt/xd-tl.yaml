# Written from the INVT Solar Inverter Modbus RTU Protocol (RS485 Communication Protocol V1.38, 2024-07-16).

modbusspec: 0
id: invt-xd-tl
manufacturer: INVT
name: XD hybrid / XG grid-tied inverters
kind: inverter

sources:
- title: INVT Solar Inverter Modbus RTU Protocol (INVT SOLAR RS485 Communication Protocol)
  version: V1.38 (2024-07-16)
  url: https://github.com/user-attachments/files/17638743/INVT.Modbus.July.2024.pdf
  sha256: d7ddf2c46c52f9862a05cbf71e22253e27a983bca21141f6759aee129f928998
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/invt_xd-tl.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 12289
    type: str
    length: 16
    chars: low

models:
  - {id: hybrid, name: XD hybrid inverter (single-phase), match: {table: holding, address: 12392, type: u16, equals: 1}}
  - {id: grid_tied, name: XG grid-tied inverter (single- or three-phase), match: {table: holding, address: 12392, type: u16, not: 1}}

points:
  # Identity and clock (read / write area 0x3000 ff.)
  - {key: x.rated_power, label: Rated power, table: holding, address: 12288, type: u16, unit: kW, scale: 0.1, poll: slow}
  - {key: serial, label: Inverter serial number, table: holding, address: 12289, type: str, length: 16, chars: low, poll: slow, verified: false, note: '16 registers of ASCII characters (''0''–''9'', ''a''–''z'', ''A''–''Z'' per register): one character per register, in the low byte, assumed.'}
  - {key: x.model_name, label: Model of inverter device, table: holding, address: 12397, type: str, length: 16, chars: low, poll: slow, verified: false, note: Coded like the serial number; one character per register assumed.}
  - {key: x.software_id, label: Software version identifier, table: holding, address: 14336, type: str, length: 2, poll: slow, verified: false, note: Two registers of ASCII; two characters per register assumed.}
  - {key: firmware, label: Software version number 1 (main DSP), table: holding, address: 14338, type: u16, poll: slow, note: '1–9999: thousands and hundreds = official version, tens and units = test version.'}
  - {key: x.aux_dsp_version, label: Software version number 2 (auxiliary DSP), table: holding, address: 14339, type: u16, poll: slow}
  - {key: x.cpld_version, label: Software version number 3 (CPLD), table: holding, address: 14340, type: u16, poll: slow}
  - {key: x.arm_version, label: Software version number 4 (ARM), table: holding, address: 14341, type: u16, poll: slow}
  - {key: x.model_recognition, label: Model recognition, table: holding, address: 12392, type: u16, enum: model_recognition, poll: slow, note: 'The register table gives 1 hybrid, 2 grid-tied, 3 off-grid; the overview table at the start says 1 hybrid, 2 battery pack data, any other value grid-tied.'}
  - {key: x.inverter_model, label: Inverter model, table: holding, address: 14465, type: u16, poll: slow, note: No value table in the document.}
  - {key: x.modbus_address, label: 485 address setting, table: holding, address: 12306, type: u16, writable: true, min: 1, max: 247, persistent: true, poll: slow}
  - {key: x.baud_rate, label: 485 baud rate setting, table: holding, address: 12307, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.clock, label: Year-Month / Day-Hour / Minute-Seconds, table: holding, address: 12308, type: datetime, length: 3, datetime: {year: {register: 0, bits: [8, 15], offset: 2000}, month: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}, writable: true, poll: slow, note: Year 20–99 (2000 added).}
  - {key: x.grid_code, label: Grid code (regulation), table: holding, address: 12318, type: u16, bits: [8, 15], enum: grid_code, writable: true, poll: slow}
  - {key: x.manufacturer_selection, label: Manufacturer selection, table: holding, address: 12318, type: u16, bits: [0, 7], enum: manufacturer_selection, writable: true, poll: slow}

  # Control settings
  - {key: x.remote_shutdown, label: Remote shutdown, table: holding, address: 12312, type: u16, enum: remote_shutdown, writable: true, poll: slow}
  - {key: x.active_power_limit, label: Percent of active power setting, table: holding, address: 12313, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: true, poll: slow}
  - {key: x.reactive_power_mode, label: Setting of reactive power control mode, table: holding, address: 12314, type: u16, enum: reactive_power_mode, writable: true, persistent: true, poll: slow}
  - {key: x.power_factor_setting, label: Power factor settings, table: holding, address: 12315, type: s16, scale: 0.001, writable: true, persistent: true, poll: slow, note: +800…+1000 and −800…−1000 raw (magnitude 0.8–1).}
  - {key: x.reactive_power_setting, label: Reactive power setting, table: holding, address: 12316, type: s16, unit: '%', scale: 0.1, writable: true, min: -60, max: 60, persistent: true, poll: slow, note: 'The description gives −60 … +60 %, the range column −66 … +66 %.'}
  - {key: x.zero_export_meter, label: Zero export function meter, table: holding, address: 12395, type: u16, enum: zero_export_meter, writable: true, poll: slow}
  - {key: x.single_export_limiting, label: Single inverter export limiting, table: holding, address: 12430, type: u16, enum: enable, writable: true, poll: slow}
  - {key: x.allowed_backflow_power, label: Allowable backflow power, table: holding, address: 12379, type: u16, unit: kW, scale: 0.1, writable: true, poll: slow}

  # Battery and energy-storage settings (hybrid, area 0x3100 ff.)
  - {key: x.priority_mode, label: Priority configuration, table: holding, address: 12561, type: u16, enum: priority_mode, writable: true, poll: slow, models: [hybrid]}
  - {key: x.eps_enable, label: EPS function enable, table: holding, address: 12564, type: u16, enum: enable, writable: true, poll: slow, models: [hybrid]}
  - {key: x.discharge_stop_soc, label: Stop SOC during discharge, table: holding, address: 12568, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, models: [hybrid], note: Grid priority mode.}
  - {key: x.charge_stop_soc, label: Stop SOC when charging, table: holding, address: 12579, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, models: [hybrid], note: Battery priority mode.}
  - {key: x.ac_charge_enable, label: AC charging enable, table: holding, address: 12580, type: u16, enum: enable, writable: true, poll: slow, models: [hybrid]}
  - {key: x.max_charge_current, label: Maximum battery charging current, table: holding, address: 12599, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 100, poll: slow, models: [hybrid]}
  - {key: x.max_discharge_current, label: Maximum battery discharge current, table: holding, address: 12600, type: u16, unit: A, scale: 0.1, writable: true, min: 0, max: 100, poll: slow, models: [hybrid]}
  - {key: x.battery_type, label: Battery type, table: holding, address: 12601, type: u16, enum: battery_type, writable: true, poll: slow, models: [hybrid]}
  - {key: x.battery_manufacturer, label: Battery manufacturers, table: holding, address: 12602, type: u16, enum: battery_manufacturer, writable: true, poll: slow, models: [hybrid]}
  - {key: x.battery_dod, label: Battery discharge depth DOD, table: holding, address: 12604, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, models: [hybrid]}
  - {key: x.ems_battery_power, label: EMS set battery charge and discharge power, table: holding, address: 12607, type: s16, unit: kW, scale: 0.1, writable: true, min: -12, max: 12, poll: slow, models: [hybrid], verified: false, note: The document doesn't say which sign charges; used with 0x3140 and mode control 0x314A = EMS.}
  - {key: x.ems_battery_power_enable, label: EMS set battery charge and discharge power mode enable, table: holding, address: 12608, type: u16, enum: enable, writable: true, poll: slow, models: [hybrid]}
  - {key: x.mode_control, label: Mode control, table: holding, address: 12618, type: u16, enum: mode_control, writable: true, poll: slow, models: [hybrid]}

  # State, alarms and faults (read-only area 0x3800 ff.)
  - {key: state, label: Inverter working status, table: holding, address: 14342, type: u16, enum: state}
  - {key: x.main_alarm_code, label: Main alarm code, table: holding, address: 14343, type: u16, enum: alarm_main, note: 'With the sub-alarm code it forms the displayed code main-sub (e.g. 04-08). Main codes 1–45 are grid-tied, 46–64 energy-storage alarms.', conflicts: [{sources: [solarman], type: u32, word_order: big, label: Device Alarm}]}
  - {key: x.sub_alarm_code, label: Sub-alarm code, table: holding, address: 14344, type: u16}
  - {key: error_code, label: Main fault code, table: holding, address: 14345, type: u16, enum: fault_main, verified: false, note: With the sub-fault code it forms the displayed code main-sub (e.g. 31-03). 0 = no fault is not stated; assumed., conflicts: [{sources: [solarman], type: u32, word_order: big, label: Device Fault}]}
  - {key: x.sub_fault_code, label: Sub-fault code, table: holding, address: 14346, type: u16}
  - {key: x.alarm_bits, label: Alarm bit, table: holding, address: 14347, type: u32, note: No bit table in the document.}
  - {key: x.fault_bits, label: Fault bit, table: holding, address: 14349, type: u32, note: No bit table in the document.}
  - {key: x.hardware_abnormal, label: Internal hardware abnormal, table: holding, address: 14450, type: u16, flags: hardware_abnormal}
  - {key: x.derating_mode, label: Derating mode, table: holding, address: 14380, type: u16, enum: derating_mode, note: 'Values for XG3–70 kW; the XG100–136 kW use another table (0 none, 1 ambient temperature, 2 over-frequency, 3 reactive power, 4 user active power setting, 5 loading slope, 6 fan, 7 wave-by-wave current limit, 8 anti-reflux, 9 low-voltage ride-through, 10 MPPT reset, 12 bus voltage too high).'}
  - {key: x.derating_power, label: Derating power, table: holding, address: 14378, type: u32, unit: W, scale: 0.1}

  # Grid side
  - {key: x.pbus_voltage, label: PBUS voltage, table: holding, address: 14351, type: u16, unit: V, scale: 0.1}
  - {key: x.nbus_voltage, label: NBUS voltage, table: holding, address: 14352, type: u16, unit: V, scale: 0.1}
  - {key: x.rs_voltage, label: RS grid line voltage, table: holding, address: 14353, type: u16, unit: V, scale: 0.1}
  - {key: x.st_voltage, label: ST grid line voltage, table: holding, address: 14354, type: u16, unit: V, scale: 0.1}
  - {key: x.tr_voltage, label: TR grid line voltage, table: holding, address: 14355, type: u16, unit: V, scale: 0.1}
  - {key: l1_voltage, label: R grid phase voltage, table: holding, address: 14356, type: u16, unit: V, scale: 0.1}
