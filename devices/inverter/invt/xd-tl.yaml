  - {key: x.pv3_current, label: PV3 input current, table: holding, address: 14395, type: s16, unit: A, scale: 0.01, conflicts: [{sources: [solarman], type: u16, label: PV3 Current}]}
  - {key: x.pv4_voltage, label: PV4 input voltage, table: holding, address: 14396, type: u16, unit: V, scale: 0.1}
