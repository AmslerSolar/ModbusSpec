  - {key: l2_current, label: S phase grid-connected current, table: holding, address: 14360, type: s16, unit: A, scale: 0.01, conflicts: [{sources: [solarman], type: u16, label: Grid L2 Current}]}
  - {key: l3_current, label: T phase grid-connected current, table: holding, address: 14361, type: s16, unit: A, scale: 0.01, conflicts: [{sources: [solarman], type: u16, label: Grid L3 Current}]}
