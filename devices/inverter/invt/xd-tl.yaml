  - {key: x.grid_connect_countdown, label: Countdown to grid connection, table: holding, address: 14363, type: u16, unit: s}
  - {key: x.load_power_kw, label: Load power, table: holding, address: 14364, type: u16, unit: kW, scale: 0.1}
  - {key: x.active_power, label: Active power, table: holding, address: 14365, type: s32, unit: W, scale: 0.1, verified: false, note: The inverter's AC output power; the document gives no sign convention.}
  - {key: reactive_power, label: Reactive power, table: holding, address: 14367, type: s32, unit: var, scale: 0.1}
  - {key: power_factor, label: Power factor, table: holding, address: 14369, type: s16, scale: 0.001}
  - {key: x.meter_power, label: Meter power, table: holding, address: 14375, type: s32, unit: W, scale: 0.1, verified: false, note: 'Power at the grid meter / CT; the document doesn''t say which direction is positive, so it isn''t given as grid_power.'}
  - {key: x.meter_l1_power, label: R phase meter power, table: holding, address: 14534, type: s32, unit: W, scale: 0.1}
  - {key: x.meter_l2_power, label: S phase meter power, table: holding, address: 14536, type: s32, unit: W, scale: 0.1}
  - {key: x.meter_l3_power, label: T phase meter power, table: holding, address: 14538, type: s32, unit: W, scale: 0.1}
