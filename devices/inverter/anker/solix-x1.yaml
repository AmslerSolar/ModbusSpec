  - {key: pv_power, label: PV power, table: input, address: 10183, type: s32, unit: W, word_order: little}
  - {key: pv_energy, label: PV energy, table: input, address: 10187, type: u32, unit: kWh, scale: 0.01, word_order: little}
  - {key: x.battery_energy, label: Battery energy, table: input, address: 10264, type: u32, unit: kWh, scale: 0.01, word_order: little}
  - {key: l1_voltage, label: Grid L1 voltage, table: input, address: 10632, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 voltage, table: input, address: 10633, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Grid L3 voltage, table: input, address: 10634, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid L1 current, table: input, address: 10635, type: u16, unit: A, scale: 0.01}
  - {key: l2_current, label: Grid L2 current, table: input, address: 10636, type: u16, unit: A, scale: 0.01}
  - {key: l3_current, label: Grid L3 current, table: input, address: 10637, type: u16, unit: A, scale: 0.01}
  - {key: l1_power, label: Grid L1 power, table: input, address: 10638, type: s32, unit: W, word_order: little, positive: import}
  - {key: l2_power, label: Grid L2 power, table: input, address: 10640, type: s32, unit: W, word_order: little, positive: import}
  - {key: l3_power, label: Grid L3 power, table: input, address: 10642, type: s32, unit: W, word_order: little, positive: import}
  - {key: grid_power, label: Grid power, table: input, address: 10644, type: s32, unit: W, word_order: little, positive: import}
  - {key: grid_import_energy, label: Grid energy, table: input, address: 10656, type: u32, unit: kWh, scale: 0.01, word_order: little}

notes:
- 'evcc template `anker-solix-x1` (grid, pv, battery) lists: Anker SOLIX X1 Hybrid Inverter.'
