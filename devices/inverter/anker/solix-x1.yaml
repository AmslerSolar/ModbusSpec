modbusspec: 0
id: anker-solix-x1
manufacturer: Anker
name: SOLIX X1 Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/anker-solix-x1.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
