# Written from APsystems' SunSpec Modbus document (Rev 3.3) and the SunSpec models workbook.

modbusspec: 0
id: apsystems-ecu
manufacturer: APsystems
name: Microinverters behind an ECU-R / ECU-C (SunSpec over the ECU)
kind: inverter

sources:
- title: APsystems SunSpec Modbus
  version: Rev 3.3
  url: https://global.apsystems.com/wp-content/uploads/2025/01/SunSpec-Modbus.pdf
  sha256: a06880a8646202bec5617d9f3e7f3f102717d2bde7116fb6c138b67d024c99a4
- title: SunSpec Information Models (models workbook)
  version: models_workbook.xlsx, master 2026-10-21
  url: https://github.com/sunspec/models/raw/master/models_workbook.xlsx
- id: sunspec2
  title: ha-sunspec2 (Home Assistant integration)
  url: https://github.com/hilman2/ha-sunspec2
  license: MIT
  commit: 2efb4dd6e51e55a5f07d960f56a6281831eb58de
  path: custom_components/sunspec2/vendors/__init__.py, custom_components/sunspec2/vendors/apsystems.py, custom_components/sunspec2/vendors/profile.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: APsystems

sunspec: true

models:
  - {id: single_phase, name: Single-phase microinverter (SunSpec model 111), match: {table: holding, address: 40122, type: u16, equals: 111}}
  - {id: three_phase, name: Three-phase microinverter (SunSpec model 113), match: {table: holding, address: 40122, type: u16, equals: 113}}

points:
  - {key: x.manufacturer, label: Mn (manufacturer), table: holding, address: 40004, type: str, length: 16, poll: slow}
  - {key: x.model, label: Md (model), table: holding, address: 40020, type: str, length: 16, poll: slow}
  - {key: x.options, label: Opt (options), table: holding, address: 40036, type: str, length: 8, poll: slow}
  - {key: firmware, label: Vr (version), table: holding, address: 40044, type: str, length: 8, poll: slow}
  - {key: serial, label: SN (serial number), table: holding, address: 40052, type: str, length: 16, poll: slow}
  - {key: x.device_address, label: DA (device address), table: holding, address: 40068, type: u16, poll: slow}
  - {key: x.ac_current, label: A (AC current), table: holding, address: 40124, type: f32, unit: A}
  - {key: l1_current, label: AphA, table: holding, address: 40126, type: f32, unit: A}
  - {key: l2_current, label: AphB, table: holding, address: 40128, type: f32, unit: A, models: [three_phase]}
  - {key: l3_current, label: AphC, table: holding, address: 40130, type: f32, unit: A, models: [three_phase]}
  - {key: l1_voltage, label: PhVphA, table: holding, address: 40138, type: f32, unit: V, models: [single_phase], note: The three-phase model leaves the phase-to-neutral voltages unimplemented.}
  - {key: x.ac_power, label: W (AC power), table: holding, address: 40144, type: f32, unit: W, positive: generation, note: No sign documented; + = AC output assumed., verified: false}
  - {key: frequency, label: Hz, table: holding, address: 40146, type: f32, unit: Hz}
  - {key: apparent_power, label: VA, table: holding, address: 40148, type: f32, unit: VA}
  - {key: reactive_power, label: VAr, table: holding, address: 40150, type: f32, unit: var}
  - {key: x.power_factor_pct, label: PF, table: holding, address: 40152, type: f32, unit: '%'}
  - {key: pv_energy, label: WH (AC energy), table: holding, address: 40154, type: f32, unit: kWh, scale: 0.001, poll: slow, note: 'APsystems only says ''AC Energy'' (Wh). Lifetime yield is assumed, but an ECU-R register dump published with ha-sunspec2 suggests it resets every night (today''s energy).', verified: false}
  - {key: temperature, label: TmpCab (cabinet temperature), table: holding, address: 40162, type: f32, unit: °C}
  - {key: state, label: St (operating state), table: holding, address: 40170, type: u16, enum: inverter_state, note: APsystems' float tables end at TmpCab; St is documented only in the int + SF model (40108). Its place in the float model (SunSpec offset 48) is assumed., verified: false}
  - {key: x.vendor_state, label: StVnd, table: holding, address: 40171, type: u16, note: Not in APsystems' float table; unimplemented in the int + SF model., verified: false}
  - {key: x.events, label: Evt1, table: holding, address: 40172, type: u32, flags: evt1, note: APsystems' float tables end at TmpCab; Evt1 is documented only in the int + SF model (40110). Its place in the float model (SunSpec offset 50) is assumed., verified: false}
  - {key: x.dc1_voltage, label: DC Voltage (DCV1), table: holding, address: 40214, type: f32, unit: V}
  - {key: x.dc2_voltage, label: DC Voltage (DCV2), table: holding, address: 40216, type: f32, unit: V}
  - {key: x.dc3_voltage, label: DC Voltage (DCV3), table: holding, address: 40218, type: f32, unit: V, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc4_voltage, label: DC Voltage (DCV4), table: holding, address: 40220, type: f32, unit: V, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc5_voltage, label: DC Voltage (DCV5), table: holding, address: 40222, type: f32, unit: V, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
