  - {key: x.dc7_voltage, label: DC Voltage (DCV7), table: holding, address: 40226, type: f32, unit: V, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc8_voltage, label: DC Voltage (DCV8), table: holding, address: 40228, type: f32, unit: V, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc1_current, label: DC Amps (DCA1), table: holding, address: 40230, type: f32, unit: A}
  - {key: x.dc2_current, label: DC Amps (DCA2), table: holding, address: 40232, type: f32, unit: A}
  - {key: x.dc3_current, label: DC Amps (DCA3), table: holding, address: 40234, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc4_current, label: DC Amps (DCA4), table: holding, address: 40236, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc5_current, label: DC Amps (DCA5), table: holding, address: 40238, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc6_current, label: DC Amps (DCA6), table: holding, address: 40240, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc7_current, label: DC Amps (DCA7), table: holding, address: 40242, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc8_current, label: DC Amps (DCA8), table: holding, address: 40244, type: f32, unit: A, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
