  - {key: x.dc5_power, label: DC Watt (DCW5), table: holding, address: 40254, type: f32, unit: W, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc6_power, label: DC Watt (DCW6), table: holding, address: 40256, type: f32, unit: W, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc7_power, label: DC Watt (DCW7), table: holding, address: 40258, type: f32, unit: W, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}
  - {key: x.dc8_power, label: DC Watt (DCW8), table: holding, address: 40260, type: f32, unit: W, note: 'Depends on the inverter model (APsystems: only inputs 1 and 2 are always supported).'}

enums:
  inverter_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': MPPT (producing), '5': Throttled, '6': Shutting down, '7': Fault, '8': Standby}

flags:
  evt1: {'0': Ground fault, '1': DC over-voltage, '2': AC disconnect open, '3': DC disconnect open, '4': Grid disconnected, '5': Cabinet open, '6': Manual shutdown, '7': Over-temperature, '8': Grid over-frequency, '9': Grid under-frequency, '10': Grid over-voltage, '11': Grid under-voltage, '12': Blown string fuse, '13': Under-temperature, '14': Memory loss, '15': Hardware test failure}

problems:
  - {when: {key: state, equals: 7}, kind: fault, text: Inverter fault (St 7)}
  - {when: {key: x.events, bit: 0}, kind: fault, text: Ground fault (Evt1 bit 0)}
  - {when: {key: x.events, bit: 1}, kind: fault, text: DC over-voltage (Evt1 bit 1)}
  - {when: {key: x.events, bit: 2}, kind: fault, text: AC disconnect open (Evt1 bit 2)}
  - {when: {key: x.events, bit: 3}, kind: fault, text: DC disconnect open (Evt1 bit 3)}
  - {when: {key: x.events, bit: 4}, kind: mains_lost, text: Grid disconnected (Evt1 bit 4)}
  - {when: {key: x.events, bit: 5}, kind: warning, text: Cabinet open (Evt1 bit 5)}
  - {when: {key: x.events, bit: 6}, kind: warning, text: Manual shutdown (Evt1 bit 6)}
  - {when: {key: x.events, bit: 7}, kind: warning, text: Over-temperature (Evt1 bit 7)}
  - {when: {key: x.events, bit: 8}, kind: mains_lost, text: Grid over-frequency (Evt1 bit 8)}
  - {when: {key: x.events, bit: 9}, kind: mains_lost, text: Grid under-frequency (Evt1 bit 9)}
  - {when: {key: x.events, bit: 10}, kind: mains_lost, text: Grid over-voltage (Evt1 bit 10)}
  - {when: {key: x.events, bit: 11}, kind: mains_lost, text: Grid under-voltage (Evt1 bit 11)}
  - {when: {key: x.events, bit: 12}, kind: fault, text: Blown string fuse (Evt1 bit 12)}
  - {when: {key: x.events, bit: 13}, kind: warning, text: Under-temperature (Evt1 bit 13)}
  - {when: {key: x.events, bit: 14}, kind: fault, text: Memory loss (Evt1 bit 14)}
  - {when: {key: x.events, bit: 15}, kind: fault, text: Hardware test failure (Evt1 bit 15)}

notes:
- 'Supported ECUs: ECU-R (2160… from firmware 1.3.7, 2162… from 2.0.2) and ECU-C (215… from C1.1.3); not ECU-B. Switch SunSpec
  Modbus on in the EMA Manager app (ECU APP → Workspace → Modbus Configuration) and give every microinverter its Modbus address
  there.'
- 'Each microinverter is its own device: the unit id is the address set for it (1 in APsystems'' example). TCP port 502 (fixed);
  RTU over the ECU''s RS485 port, 8N1, baud rate chosen in the app.'
- 'Addresses as on the wire: ''SunS'' at 40000, Common at 40002 (length 66), inverter model 101 / 103 (int + SF) at 40070
  and 111 / 113 (float) at 40122, controls 123 at 40184.'
- 'DC values per input are in APsystems'' model 114 at 40212 (values 40214-40261, float32). In APsystems'' table model 123
  ends at 40209, so walking the SunSpec chain doesn''t reach 114: read it at its fixed address.'
- The inverter models leave DC current, voltage and power unimplemented; solar power = sum of the model-114 DC powers.
- 'No grid meter and no battery: grid and house load come from another device.'
- The ECU serves each micro inverter as a SunSpec device on its own unit id (set in EMA Manager). The DC values per input
  sit at 40214…40261 behind the SunSpec end marker (APsystems calls the block model 114), so a SunSpec scan doesn't find them.
  Inputs an inverter doesn't have read 0.
- Identification as sunspec2 recognises the device (not checked against a document).
