modbusspec: 0
id: senergy-hybrid
manufacturer: Senergy
name: Hybrid Inverter
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/senergy-hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: pv_energy, label: PV energy, table: holding, address: 4129, type: u32, unit: kWh}
  - {key: pv_power, label: PV power, table: holding, address: 4168, type: u32, unit: W, scale: 0.1}
  - {key: x.grid_power_1, label: Grid power (part 1), table: holding, address: 4864, type: s32, unit: W, scale: 0.1}
  - {key: x.grid_power_2, label: Grid power (part 2), table: holding, address: 4866, type: s32, unit: W, scale: 0.1}
  - {key: x.grid_power_3, label: Grid power (part 3), table: holding, address: 4868, type: s32, unit: W, scale: 0.1}
  - {key: grid_import_energy, label: Grid energy, table: holding, address: 4870, type: u32, unit: kWh, scale: 0.01}
  - {key: l1_current, label: Grid L1 current, table: holding, address: 4893, type: s32, unit: A, scale: 0.01}
  - {key: l2_current, label: Grid L2 current, table: holding, address: 4895, type: s32, unit: A, scale: 0.01}
  - {key: l3_current, label: Grid L3 current, table: holding, address: 4897, type: s32, unit: A, scale: 0.01}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 8192, type: u16, unit: '%'}
  - {key: battery_power, label: Battery power, table: holding, address: 8201, type: s32, unit: W, scale: 0.1, positive: discharge}
  - {key: x.battery_energy, label: Battery energy, table: holding, address: 8209, type: u32, unit: kWh, scale: 0.01}
  - {key: x.batterymode_8448, label: Battery mode control (write), table: holding, address: 8448, type: u16, writable: true, note: 'evcc writes battery mode normal: 0; battery mode hold: 3; battery mode charge: 0.'}
  - {key: x.batterymode_8449, label: Battery mode control (write), table: holding, address: 8449, type: u16, writable: true, note: 'evcc writes battery mode charge: 1.'}
  - {key: x.batterymode_8450, label: Battery mode control (write), table: holding, address: 8450, type: u16, writable: true, note: 'evcc writes battery mode charge: 0.'}
  - {key: x.batterymode_8451, label: Battery mode control (write), table: holding, address: 8451, type: u16, writable: true, note: 'evcc writes battery mode charge: 5947.'}
  - {key: x.batterymode_8524, label: Battery mode control (write), table: holding, address: 8524, type: u16, writable: true, note: 'evcc writes battery mode normal: 0; battery mode hold: 0; battery mode charge: 1.'}

derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: x.grid_power_1}, {key: x.grid_power_2}, {key: x.grid_power_3}]}

notes:
- 'evcc template `senergy-hybrid` (grid, pv, battery) lists: Senergy Hybrid Inverter; Strong Energy Alfred 10.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
