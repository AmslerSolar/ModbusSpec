enums:
  state: {'0': Factory default, '1': Disconnected from grid, '3': Connected to grid}

flags:
  power_reduction: {'0': Over-temperature, '1': PV input voltage, '2': Fan locked, '3': Initial ramp, '4': High grid frequency, '5': EMS communication lost, '7': Maximum apparent power, '8': Night powered mode, '9': Communications (wattmeter or master), '10': High grid voltage, '11': Low grid frequency, '12': Remote off power gradient, '13': Configuration, '15': P(f) algorithm}

problems:
  - {when: {key: x.power_reduction_reason, bit: 0}, kind: warning, text: Over-temperature derating (reduction bit 0)}
  - {when: {key: x.power_reduction_reason, bit: 2}, kind: warning, text: Fan locked (reduction bit 2)}

notes:
- Read-only holding registers (function 03) at protocol addresses 0x1001–0x1092 (Modicon 40001 + address), through the inverter's
  Modbus TCP dongle. At most 124 registers per request; unit id 1 by default; port 502.
- Ingeteam recommends a single client and at least 1 s between requests.
- 'Scale factors are written "[V x 10]", "[W x 10]" etc.: the register holds value × factor, so divide. The "[W x 10]" powers
  are all 32-bit, which only makes sense at 0.1 W resolution.'
- 32-bit word order isn't stated; high word first is assumed (unverified).
- The reserved ranges are listed as starting at 0x1028 and 0x1041, i.e. at the second word of the daily energy (0x1027) and
  of Pmppt4 (0x1040); both are read as 32-bit. The English and Spanish parts disagree on where the second range ends (0x1049
  vs 0x104F).
- Whether reads across the reserved registers (0x1001 + 65, 0x1050 + 68) are accepted is not stated; the defined ranges alone
  take five requests. MPPT 5–9 may be missing on small inverters.
- Unavailable values aren't documented; 0xFFFF / 0xFFFFFFFF (−1 for signed values) are assumed to mean missing (unverified).
- No identification registers (model, serial, rated power). A 3Play can only be told from a 1Play by a voltage on phase 2
  or 3, so a 3Play without grid voltage looks like a 1Play.
- Solar power is the sum of the MPPT powers; the inverter doesn't measure the grid connection.
- Event codes (0x101E–0x1020) are explained in ACL2010IMC01, which isn't used here; they aren't reported as problems. Only
  the reduction reasons over-temperature and fan locked become warnings.
- State 1 is "off-grid" in the English part and "disconnected from the grid" in the Spanish part; the latter is used here.
