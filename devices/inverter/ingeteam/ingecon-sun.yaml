  sha256: e3fb6a69d9141f38c9db3e84dd1dc9383613369772ffaa8695e856106fdb7330

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 124
    max_gap: 0
    min_interval_ms: 1000

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 4125
    type: u16
    in:
    - 0
    - 1
    - 3
  - table: holding
    address: 4097
    type: u16
    range:
    - 0
    - 6000
  # frequency, 0 when off the grid
  - table: holding
    address: 4101
    type: u16
    range:
    - 0
    - 6500

models:
  - {id: three_play, name: INGECON SUN 3Play, match: {table: holding, address: 4102, type: u16, range: [1, 6000]}}
  - {id: one_play, name: INGECON SUN 1Play}

