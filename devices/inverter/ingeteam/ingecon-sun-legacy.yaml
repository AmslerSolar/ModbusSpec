# Written from the Ingeteam Online data input register list (AAA0030IMB02, Q), older register maps.

modbusspec: 0
id: ingeteam-ingecon-sun-legacy
manufacturer: Ingeteam
name: INGECON SUN 1Play / 3Play / 3Play 100TL–160TL string inverters (older register maps)
kind: inverter

sources:
- title: Online data input register list (AAA0030IMB02)
  version: Q (03/05/24)
  url: https://www.ingeras.es/manual/AAA0030IMB02.pdf
  sha256: 1b1f904bbf22347b2cd790be3ea11f6dd9cd1572ebef6b53c9da84cdf8963c77

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  limits:
    max_registers: 67
    max_gap: 10

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: input
    address: 0
    type: u16
    range:
    - 1900
    - 2100
  - table: input
    address: 1
    type: u16
    range:
    - 1
    - 12
  - table: input
    address: 2
    type: u16
    range:
    - 1
    - 31
  - table: input
    address: 3
    type: u16
    range:
    - 0
    - 23
  - table: input
    address: 4
    type: u16
    range:
    - 0
    - 59
  - table: input
    address: 5
    type: u16
    range:
    - 0
    - 59
  # status (100TL / 160TL)
  - - table: input
      address: 20
      type: u16
      range:
      - 0
      - 2
    # status (1Play, 3Play)
    - table: input
      address: 26
      type: u16
      range:
      - 0
      - 2

models:
  # grid frequency
  - {id: play3_100tl, name: INGECON SUN 3Play 100TL / 160TL (ABS1004), match: [{table: input, address: 20, type: u16, range: [0, 2]}, {table: input, address: 27, type: u16, range: [4500, 6500]}]}   # status
  - {id: play1_hf, name: INGECON SUN 1Play HF (ABF1000), match: [{table: input, address: 26, type: u16, range: [0, 2]}, {table: input, address: 32, type: u16, range: [4500, 6500]}, {table: input, address: 38, type: u16, equals: 65535}, {table: input, address: 40, type: u16, equals: 65535}]}   # reserved on the HF, PV2 on the TLM
  - {id: play1_tlm, name: INGECON SUN 1Play TLM (ABE1000), match: [{table: input, address: 26, type: u16, range: [0, 2]}, {table: input, address: 32, type: u16, range: [4500, 6500]}]}
  - {id: play3, name: INGECON SUN 3Play (ABI1000 / ABI1004), match: [{table: input, address: 26, type: u16, range: [0, 2]}, {table: input, address: 35, type: u16, range: [4500, 6500]}, {table: input, address: 32, type: u16, range: [0, 5000]}, {table: input, address: 33, type: u16, range: [0, 5000]}, {table: input, address: 34, type: u16, range: [0, 5000]}]}   # phase voltages ≤ 500 V

points:
  # All maps: clock
  - {key: x.clock, label: Actual date, table: input, address: 0, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow}
  # 1Play HF (ABF1000) and 1Play TLM (ABE1000)
  - {key: pv_energy, label: Total energy delivered, table: input, address: 6, type: u32, unit: kWh, invalid: [4294967295], poll: slow, models: [play1_hf, play1_tlm, play3]}
  - {key: x.alarm_code_1, label: Instantaneous alarm code 1 bits, table: input, address: 18, type: u16, invalid: [65535], models: [play1_hf, play1_tlm]}
  - {key: x.alarm_code_2, label: Instantaneous alarm code 2 bits, table: input, address: 19, type: u16, invalid: [65535], models: [play1_hf, play1_tlm]}
