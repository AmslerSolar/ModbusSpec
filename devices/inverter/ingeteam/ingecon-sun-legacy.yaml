  state: {'0': Not ready to connect, '1': Waiting to connect, '2': Connected to the grid}
  reduction_1play: {'0': No reduction, '1': No reduction, '2': Temperature, '3': Temperature, '4': Temperature, '5': Communications, '6': Grid frequency / active power control, '7': Grid voltage / active power control, '8': Reactive priority and output current limit, '9': Configuration, '10': Connection initial ramp, '11': Self-consumption mode, '12': Manufacturer reserved, '13': Pac vs Vac algorithm, '14': cos φ or tangent target, '15': Low Vac to reach nominal power}
  reduction_3play: {'0': No reduction, '1': No reduction, '2': Not defined, '3': Not defined, '4': Not defined, '5': Communications, '6': Grid frequency / active power control, '7': Grid voltage / active power control, '8': Reactive priority and output current limit, '9': Configuration, '10': Connection initial ramp, '11': Self-consumption mode, '12': Manufacturer reserved, '13': Pac vs Vac algorithm, '14': cos φ or tangent target, '15': Low Vac to reach nominal power}
  reactive_reference: {'0': cos φ configuration, '1': Qref manual, '2': cos φ manual, '3': Qref communications, '4': cos φ communications, '5': Qref Q(V), '6': cos φ (P)}

problems:
  - {when: {key: x.alarm_code_1, not: 0}, kind: fault, text: 'Alarm code 1: 0x{value:X}'}
  - {when: {key: x.alarm_code_2, not: 0}, kind: fault, text: 'Alarm code 2: 0x{value:X}'}
  - {when: {key: x.alarm_code_3, not: 0}, kind: fault, text: 'Alarm code 3: 0x{value:X}'}
  - {when: {key: x.alarm_code_4, not: 0}, kind: fault, text: 'Alarm code 4: 0x{value:X}'}
  - {when: {key: x.warning_code, not: 0}, kind: warning, text: 'Warning code 0x{value:X}'}
  - {when: {key: x.power_reduction_reason, in: [2, 3, 4]}, kind: warning, text: 'Temperature derating (reason {value})'}

notes:
- Input registers (function 04) 0–124; the "start address" in the document is the protocol address (Modicon 30001 + address).
  Modbus RTU, or TCP through a gateway or the inverter's interface. Unit id and port aren't stated (1 and 502 assumed).
- 'The document has one map per product and no identification register. The map can be recognised from where plausible values
  sit in registers 0–66: a valid date in 0–5, then status (0–2) and grid frequency at 26 / 32 (1Play), 26 / 35 with phase
  voltages ≤ 500 V in 32–34 (3Play), or 20 / 27 (100TL/160TL). 1Play HF has registers 38 and 40 reserved (0xFFFF), the TLM
  a second PV input there. The `match` entries above check this from register 20 on; they need the inverter connected to the
  grid (frequency reported).'
- 'Not covered: IS 350TL-M12 (ACB1005; its first 32 registers match the 100TL, so it would be taken for one) and Power B (ABK1000,
  central inverter). The 100TL string kit data at 860–984 isn''t read.'
- '"Not implemented" registers read 0xFFFF (stated for reserved registers); 0xFFFF (−1 for signed values) is assumed to mean
  missing everywhere. 32-bit counters are high word first (stated).'
- '"Watt/10", "VA/10", "VAr/10" are read as register = value / 10 (×10 to get the value), "KWh*100" as register = kWh × 100,
  judging by the usual maximum values (10 000 ≙ 100 kW for a 3Play).'
- On the 3Play, PV2 values and the total PV power exist only on ABI1000.
- Solar power is the PV power (1Play, 3Play ABI1000) or the sum of the PV inputs; the inverters don't measure the grid connection.
  The self-consumption wattmeter's sign isn't stated, so it isn't taken as grid power here.
- 'Alarm and warning bit meanings are in other Ingeteam documents (ACL2010IMC01, AAA0030IMB07) not used here: any non-zero
  alarm code register is a fault and a non-zero warning code a warning, shown raw. Reduction reasons 2–4 (temperature) are
  a warning; on the 3Play maps they are "not defined".'
