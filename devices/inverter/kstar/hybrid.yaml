  - {key: l3_voltage, label: T phase grid voltage, table: input, address: 3105, type: u16, unit: V, scale: 0.1, models: [three_phase]}
  - {key: x.grid_l3_frequency, label: T phase grid frequency, table: input, address: 3106, type: u16, unit: Hz, scale: 0.01, models: [three_phase]}
