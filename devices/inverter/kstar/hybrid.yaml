  - {key: x.inverter_model, label: Inverter model, table: input, address: 3045, type: u16, enum: inverter_model, poll: slow}
  - {key: state, label: SYS_STATE, table: input, address: 3046, type: u16, enum: sys_state}
  - {key: x.inv_state, label: INV_STATE, table: input, address: 3047, type: u16, enum: inv_state}
  - {key: x.dcdc_state, label: DCDC_STATE, table: input, address: 3048, type: u16, enum: dcdc_state}
