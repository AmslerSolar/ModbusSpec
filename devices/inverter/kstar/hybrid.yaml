notes:
- 'Modbus RTU on RS485: 9600 baud by default (2400 / 4800 optional), 8N1; slave addresses up to 32, 0 = broadcast. Function
  codes 03, 04, 06 and 16. Values are big-endian; 32-bit values high word first.'
- Register addresses are the protocol addresses as the document gives them (its examples send 3000 as 0x0BB8).
- Most live values and settings are input registers (function 04). Registers the document marks 04H/06H are read with function
  04 and written with function 06 at the same address; they are marked writable here. The model name, battery name and version
  numbers (3200–3218) are holding registers (function 03).
- Points marked for three-phase models (S / T phase, PV and LLC temperature, DSP2 version, PV start voltage) are only available
  on E8KT / E10KT / E12KT (model codes 0x20 and up in 3045).
- The document doesn't give the sign of the battery, meter, inverter and real-time power values or of the battery currents;
  they are left as device-specific values. DCDC_STATE (3048) says whether the battery charges or discharges.
- Time-of-use windows 1 and 2 (3160–3175, ASCII "HHMM" per window time) are written with function 16, each block in one request;
  windows 3–5 are at 4050–4073 (same layout, left out). The clock is written with function 16 at 3239–3245 in one request,
  as ASCII digit pairs (year, month, day, hour, minute, second, weekday).
- 'Commands (function 06, any value, holding registers): 3240 clear statistics, 3241 remote shutdown, 3242 cancel remote shutdown,
  3243 restart the inverter.'
- 'Battery packs: pack n starts at 3441 + 44 × (n − 1) (pack 1 at 3441, pack 8 at 3749). Each block: address, warning / protection
  / status flags, voltage (0.01 V), current (0.01 A, signed), balance status, cycle count, SOH, SOC, over-temperature time,
  online, design / residual / full capacity (×100 mAh), discharged / charged energy (kWh), heating request, cell / MOSFET
  / ambient temperatures (avg, max, min; 0.1 °C), cell voltages (avg, max, min; 0.01 V), BMS version (ASCII, 3 registers).
  Only pack 1''s main values are listed here.'
- 'Left out: calibration factors, grid-code trip and curve settings (3201–3216, 3326–3439, three-phase only), heat pump, demand
  control and peak shaving settings (3900–3913), fan / ATE / aging test registers, CSA nameplate ratings (3950–3983), and
  registers the document reserves or marks for KSTAR''s own use.'
- 'PV not connected (W04) and PV off (W30) aren''t reported as problems: they are normal at night. During system initialisation
  (state 0) the data is not valid.'
- 'Left out: DSP Alarm Code (1) (input 3050, u16) from solarman overlaps x.dsp_alarm from the documents.'
- 'Left out: DSP Error Code (1) (input 3052, u16) from solarman overlaps x.dsp_error from the documents.'
- 'Left out: Timed Charge 1 Start (2) (input 3161, u16) from solarman overlaps x.charge_start_1 from the documents.'
- 'Left out: Timed Charge 1 End (2) (input 3163, u16) from solarman overlaps x.charge_end_1 from the documents.'
- 'Left out: Timed Discharge 1 Start (2) (input 3165, u16) from solarman overlaps x.discharge_start_1 from the documents.'
- 'Left out: Timed Discharge 1 End (2) (input 3167, u16) from solarman overlaps x.discharge_end_1 from the documents.'
- 'Left out: Timed Charge 2 Start (2) (input 3169, u16) from solarman overlaps x.charge_start_2 from the documents.'
- 'Left out: Timed Charge 2 End (2) (input 3171, u16) from solarman overlaps x.charge_end_2 from the documents.'
- 'Left out: Timed Discharge 2 Start (2) (input 3173, u16) from solarman overlaps x.discharge_start_2 from the documents.'
- 'Left out: Timed Discharge 2 End (2) (input 3175, u16) from solarman overlaps x.discharge_end_2 from the documents.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
