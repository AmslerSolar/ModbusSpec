  - {key: x.discharge_end_1, label: Discharge end time 1, table: input, address: 3166, type: str, length: 2, writable: true, write_multiple: true, poll: slow, conflicts: [{sources: [solarman], type: u16, label: Timed Discharge 1 End (1)}]}
  - {key: x.charge_start_2, label: Charge start time 2, table: input, address: 3168, type: str, length: 2, writable: true, write_multiple: true, poll: slow, conflicts: [{sources: [solarman], type: u16, label: Timed Charge 2 Start (1)}]}
  - {key: x.charge_end_2, label: Charge end time 2, table: input, address: 3170, type: str, length: 2, writable: true, write_multiple: true, poll: slow, conflicts: [{sources: [solarman], type: u16, label: Timed Charge 2 End (1)}]}
