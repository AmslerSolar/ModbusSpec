  - {key: battery_temperature, label: BAT_Temp, table: input, address: 3067, type: s16, unit: °C, scale: 0.1}
  - {key: x.ongrid_discharge_depth, label: On-grid discharge depth, table: input, address: 3068, type: u16, unit: '%', writable: true, min: 10, max: 95, poll: slow, note: Default 90.}
  - {key: x.battery_charge_voltage, label: BAT_CHG_VOLT, table: input, address: 3069, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_charge_current_limit, label: BAT_CHG_LIMIT_CURR, table: input, address: 3070, type: u16, unit: A}
  - {key: x.battery_discharge_current_limit, label: BAT_DISCHG_LIMIT_CURR, table: input, address: 3071, type: u16, unit: A}
  - {key: x.min_battery_discharge_voltage, label: Min bat discharge voltage, table: input, address: 3072, type: u16, unit: V, scale: 0.1, writable: true, min: 40, max: 48, poll: slow, note: Default 43.2 V.}
  - {key: x.max_battery_charge_voltage, label: Max bat charge voltage, table: input, address: 3073, type: u16, unit: V, scale: 0.1, writable: true, min: 52, max: 58.5, poll: slow, note: Default 57.5 V.}
  - {key: x.battery_capacity, label: BAT_CAP_AH, table: input, address: 3074, type: u16, unit: Ah, writable: true, min: 50, max: 1000, poll: slow, note: Only for lead-acid batteries; default 100.}
  - {key: battery_soh, label: BAT health, table: input, address: 3075, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.battery_pack_count, label: Number of battery packs, table: input, address: 3077, type: u16, poll: slow}
