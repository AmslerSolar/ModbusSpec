# Written from the KSTAR Hybrid Inverter MODBUS RS485 Communication Protocol (V2.9.1, 2024.07.21).

modbusspec: 0
id: kstar-hybrid
manufacturer: KSTAR
name: KSE / BluE-S / E-KT hybrid inverters
kind: inverter

sources:
- title: KSTAR Hybrid Inverter MODBUS RS485 Communication Protocol (SFT-KSE-001)
  version: V2.9.1 (2024.07.21)
  url: https://github.com/user-attachments/files/17555061/KSTAR.Hybrid.Inverter.Modbus.V2.9.1_2024.07.21.pdf
  sha256: 02d9357b8f3571808f9898f0aafee711c798e34d9cef3291d17baeb7cb1754a9
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/kstar_hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 3228
    type: str
    length: 11

models:
  - {id: single_phase, name: 'Single-phase models (KSE, BluE-S)', match: {table: input, address: 3045, type: u16, range: [0, 31]}}
  - {id: three_phase, name: 'Three-phase models (E8KT, E10KT, E12KT)', match: {table: input, address: 3045, type: u16, range: [32, 47]}}

points:
  # PV (input registers, function 04)
  - {key: x.pv1_voltage, label: PV1 input voltage, table: input, address: 3000, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 input voltage, table: input, address: 3001, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 input current, table: input, address: 3012, type: s16, unit: A, scale: 0.01}
  - {key: x.pv2_current, label: PV2 input current, table: input, address: 3013, type: s16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: PV1 input power, table: input, address: 3024, type: s16, unit: W}
  - {key: x.pv2_power, label: PV2 input power, table: input, address: 3025, type: s16, unit: W}
