  - {key: x.bms_dod_enable, label: BMS DOD enable, table: input, address: 3060, type: u16, enum: off_on, writable: true, poll: slow}
  - {key: x.offgrid_dod, label: Off-grid DOD, table: input, address: 3061, type: u16, unit: '%', writable: true, min: 5, max: 90, poll: slow, note: Default 90.}
  - {key: x.battery_type, label: BAT type, table: input, address: 3062, type: u16, enum: battery_type, poll: slow}
  - {key: battery_voltage, label: BAT voltage, table: input, address: 3063, type: u16, unit: V, scale: 0.01}
