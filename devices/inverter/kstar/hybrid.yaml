  - {key: x.inv_l2_power, label: S-INV power, table: input, address: 3130, type: s16, unit: W, models: [three_phase], verified: false}
  - {key: x.inv_l3_voltage, label: T-INV voltage, table: input, address: 3131, type: u16, unit: V, scale: 0.1, models: [three_phase]}
