  - {key: x.pv_energy_year, label: Year energy (PV), table: input, address: 3039, type: u32, unit: kWh, poll: slow}
  - {key: pv_energy, label: Total energy (PV), table: input, address: 3041, type: u32, unit: kWh, scale: 0.1, poll: slow}
