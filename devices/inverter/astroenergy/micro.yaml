modbusspec: 0
id: astroenergy-micro
manufacturer: Astro-Energy
name: TM-L series
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/astro-energy_micro.yaml

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 0, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 1, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv3_voltage, label: PV3 Voltage, table: input, address: 2, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 3 MPPT trackers.}
  - {key: x.pv4_voltage, label: PV4 Voltage, table: input, address: 3, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 4 MPPT trackers.}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 5, type: u16, unit: A, scale: 0.01}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 6, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv3_current, label: PV3 Current, table: input, address: 7, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 3 MPPT trackers.}
  - {key: x.pv4_current, label: PV4 Current, table: input, address: 8, type: u16, unit: A, scale: 0.01, note: The project reads this only on devices with at least 4 MPPT trackers.}
  - {key: x.current, label: Current, table: input, address: 9, type: s16, unit: A, scale: 0.01}
  - {key: x.voltage, label: Voltage, table: input, address: 11, type: u16, unit: V, scale: 0.1}
  - {key: x.frequency, label: Frequency, table: input, address: 13, type: u16, unit: Hz, scale: 0.01}
  - {key: x.power, label: Power, table: input, address: 15, type: s16, unit: W, scale: 0.1}
  - {key: x.energy, label: Energy, table: input, address: 20, type: u16, unit: kWh, scale: 0.01}
  - {key: x.temperature, label: Temperature, table: input, address: 22, type: u16, unit: °C, scale: 0.01}
  - {key: x.mppts, label: MPPTs, table: input, address: 23, type: u16}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Also used for astro-energy_2mppt.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
