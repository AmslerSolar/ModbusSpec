modbusspec: 0
id: givenergy-inverter-3ph
manufacturer: GivEnergy
name: Three-phase inverters
kind: inverter

sources:
- id: givenergy-modbus
  title: givenergy-modbus (Python library for GivEnergy inverters, used by givenergy-hass)
  url: https://github.com/dewet22/givenergy-modbus
  license: Apache-2.0
  commit: 90e3ec13098aacc9607160209779b4e029ac8cd9
  path: givenergy_modbus/model/inverter_threephase.py

connection:
  default_port: 8899
  default_unit: 17

encoding:
  word_order: big

identify:
  serial:
    table: holding
    address: 13
    type: str
    length: 5
  checks:
  - - table: holding
      address: 0
      type: u16
      range:
      - 16384
      - 20479
    - table: holding
      address: 0
      type: u16
      range:
      - 24576
      - 28671
    - table: holding
      address: 0
      type: u16
      range:
      - 33280
      - 33535
  - table: holding
    address: 13
    type: str
    length: 5
    printable: true

defaults:
  verified: false
  sources:
  - givenergy-modbus

