notes:
- Reached through the inverter's Wi-Fi / LAN dongle on TCP port 8899, which wraps Modbus requests in GivEnergy's own framing
  (not plain Modbus TCP); every device on the bus answers there under its own device address. The library reads at most 60
  registers per request, in blocks starting at multiples of 60.
- The library's three-phase map is the single-phase map plus the three-phase registers from 1000 up, which win where both
  name the same value; the library notes that several single-phase registers are not populated on three-phase firmware.
- 'Left out: firmware_version (combined from the separate DSP and ARM version registers); model (same register value as device_type_code);
  inverter_fault_messages (same register value as inverter_errors); charge_status (same register value as charge_status_label);
  charger_warning_messages (same register value as charger_warning_code).'
- Identification as givenergy-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
