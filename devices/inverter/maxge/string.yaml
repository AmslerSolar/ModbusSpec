modbusspec: 0
id: maxge-string
manufacturer: Maxge
name: STRING
kind: inverter

sources:
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/maxge_string.yaml

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solarman

points:
  - {key: x.device, label: Device, table: input, address: 20, type: str, length: 16}
  - {key: x.device_software_version, label: Device Software Version, table: input, address: 44, type: str, length: 16}
  - {key: serial, label: Device Serial Number, table: input, address: 60, type: str, length: 12}
  - {key: x.load_current, label: Load Current, table: input, address: 258, type: u16, unit: A, scale: 0.1}
  - {key: x.load_voltage, label: Load Voltage, table: input, address: 264, type: u16, unit: V, scale: 0.1}
  - {key: x.load_frequency, label: Load Frequency, table: input, address: 267, type: u16, unit: Hz, scale: 0.01}
  - {key: load_power, label: Load Power, table: input, address: 268, type: u32, unit: W}
  - {key: pv_energy_today, label: Today Production, table: input, address: 273, type: u32, unit: kWh, scale: 0.1}
  - {key: pv_energy, label: Total Production, table: input, address: 275, type: u32, unit: kWh}
  - {key: x.pv1_voltage, label: PV1 Voltage, table: input, address: 518, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 Current, table: input, address: 519, type: u16, unit: A, scale: 0.1}
  - {key: x.pv2_voltage, label: PV2 Voltage, table: input, address: 525, type: u16, unit: V, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}
  - {key: x.pv2_current, label: PV2 Current, table: input, address: 526, type: u16, unit: A, scale: 0.1, note: The project reads this only on devices with at least 2 MPPT trackers.}

notes:
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
