- SunSpec register layout at fixed addresses (common model at 40002, model 103 at 40070, 120 at 40122, 121 at 40150, 123 at
  40182, REFU models 64040/64041 at 40208/40213, 64800 at 40225); scale factors as OpenEMS applies them.
- 'Left out: id_64041 (holding 40213, u16) from openems overlaps read_write_param_index (holding 40212, u32); check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
