enums:
  operating_state: {'1': 'Off', '2': Sleeping, '3': Starting, '4': MPPT, '5': Throttled, '6': Shutting Down, '7': Fault, '8': Standby, '9': Started}
  vendor_operating_state: {'-1': Undefinded}
  der_typ: {'4': PV, '82': PVStor}
  conn: {'0': Disconnect, '1': Connect}
  wmax_lim_ena: {'0': Disabled, '1': Enabled}
  out_pf_set_ena: {'0': Disabled, '1': Enabled}
  var_pct_ena: {'0': Disabled, '1': Enabled}
  loc_rem_ctl: {'0': PCS Remote Control, '1': PCS Local Control}
  pcs_set_operation: {'0': No Command, '1': Connect to grid, '2': Stop system, '3': Enter Standby Mode, '4': Exit Standby Mode}

flags:
  state_word_40110: {'0': Other alarm, '1': Other warning}
  state_word_40111: {'0': Ground fault, '1': Dc over voltage, '2': AC disconnect open, '3': DC disconnect open, '4': Grid shutdown, '5': Cabinet open, '6': Manual shutdown, '7': Over temperature, '8': Frequency above limit, '9': Frequency under limit, '10': AC Voltage above limit, '11': AC Voltage under limit, '12': Blown String fuse on input, '13': Under temperature, '14': Generic Memory or Communication error (internal), '15': Hardware test failure}

problems:
