  - {when: {key: x.state_word_40111, bit: 6}, kind: warning, text: Manual shutdown}
  - {when: {key: x.state_word_40111, bit: 7}, kind: warning, text: Over temperature}
  - {when: {key: x.state_word_40111, bit: 8}, kind: warning, text: Frequency above limit}
  - {when: {key: x.state_word_40111, bit: 9}, kind: warning, text: Frequency under limit}
  - {when: {key: x.state_word_40111, bit: 10}, kind: warning, text: AC Voltage above limit}
