modbusspec: 0
id: solinteg-inverter
manufacturer: Solinteg
name: Integ ONE GEN3
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/solinteg-gen3.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/mtec/mtec
- id: solax-modbus
  title: homeassistant-solax-modbus (Home Assistant integration)
  url: https://github.com/wills106/homeassistant-solax-modbus
  license: Apache-2.0
  commit: d644181940210c4a00a6b4637888495c7a7d6217
  path: custom_components/solax_modbus/plugin_solinteg.py

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - solax-modbus

models:
  - {id: openwb_generation_2, name: Generation 2}
  - {id: solax_modbus_x3_hybrid_mppt2, name: X3 | HYBRID | MPPT2, match: {table: holding, address: 10008, type: u16, in: [7680, 7681, 7682, 7683, 7684, 7685, 7686, 7687, 7688, 7689]}}
  - {id: solax_modbus_x1_hybrid_mppt2, name: X1 | HYBRID | MPPT2, match: {table: holding, address: 10008, type: u16, in: [7936, 7937, 7938, 7939, 7940, 7941, 7942, 7943, 10241, 10242, 10243, 10244, 10245]}}
  - {id: solax_modbus_x1_hybrid, name: X1 | HYBRID, match: {table: holding, address: 10008, type: u16, in: [7944, 7945, 10240]}}
  - {id: solax_modbus_x3_hybrid_mppt4, name: X3 | HYBRID | MPPT4, match: {table: holding, address: 10008, type: u16, in: [8192, 8193, 8194, 8195, 8196, 10496, 10497, 10498, 10499, 10500]}}
  - {id: solax_modbus_x3_hybrid_mppt6, name: X3 | HYBRID | MPPT6, match: {table: holding, address: 10008, type: u16, in: [11008, 11009, 11010, 11011, 11012, 11013]}}
  - {id: solax_modbus_x1_mppt2, name: X1 | MPPT2}

