enums:
  inverter_status: {'0': Waiting, '1': Self checking, '2': On Grid generating, '3': Fault, '4': Firmware upgrade, '5': Off Grid generating}
  simple_switch: {'0': 'off', '1': 'on'}
  ems_battctrl_priority_power_output: {'0': PV, '1': Battery}
  ems_acctrl_mode: {'0': 'Off', '1': Total Power Setting, '2': Power Setting on each Phase}
  mppt_dd: {'0': 'off', '32767': 'on'}

flags:
  operation_flags: {'0': WorkMode Abn., '1': Emergency Stop, '2': DC Abn., '3': Mains Abn., '4': OffGrid Dis., '5': Batt. Abn., '6': Cmd Stop, '7': SocLow&NoPV, '8': ComErr Slave, '9': Meter Abn., '10': Bypass Wait, '11': NPD Standby, '12': Generator Abn., '13': S14 Undefined, '14': OffGrid, '15': NPD Clearing, '16': Cmd PLim, '17': OFreq PLim, '18': OTemp PLim, '19': OCurr PLim, '20': Reactive PLim, '21': Exp PLim, '22': Slow Loading, '23': OVolt PLim, '24': System PLim, '25': EMS CmdLim, '26': S27 Undefined, '27': S28 Undefined, '28': S29 Undefined, '29': S30 Undefined, '30': S31 Undefined, '31': PV PLim}
  fault_flags1: {'0': Mains Lost, '1': Grid Voltage Fault, '2': Grid Frequency Fault, '3': DCI Fault, '4': ISO Over Limitation, '5': GFCI Fault, '6': PV Over Voltage, '7': Bus Voltage Fault, '8': Inverter OverTemperature}
  fault_flags2: {'1': SPI Fault, '2': E2 Fault, '3': GFCI Device Fault, '4': AC Transducer Fault, '5': Relay Check Fail, '6': Internal Fan Fault, '7': External Fan Fault}
  fault_flags3: {'0': Bus Hardware Fault, '1': PV Power Low, '2': Batt.Voltage Fault, '3': BAK Voltage Fault, '4': Bus Voltage Low, '5': Sys Hardware Fault, '6': BAK Over Power, '7': Inverter Over Voltage, '8': Inverter Over Freq, '9': Inverter Over Current, '10': Phase Order Err}
  fault_arm_flags1: {'0': SCI Fault, '1': FLASH Fault, '2': Meter Comm Fault, '3': BMS Comm Fault}
  fault_arm_flags2: {'0': BMS Comm Fault}

notes:
- 'evcc template `solinteg-gen3` (grid, pv, battery) lists: Solinteg Integ ONE GEN3; M-TEC Energy Butler GEN3; Wattsonic 3p
  AIO Series GEN3; Sunways STH Series GEN3; A-Tronix Hybridpower AX2 GEN3; SunEnergyBox SEB Series GEN3.'
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- 'Model detection: holding register 10008 holds the model code (high byte = series, low byte = model); the model matches
  list the codes the project names, other codes of the same series get the same type bits.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
