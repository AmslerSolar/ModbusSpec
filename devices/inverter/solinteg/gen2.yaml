modbusspec: 0
id: solinteg-gen2
manufacturer: Solinteg
name: Integ ONE GEN2
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/solinteg-gen2.yaml

connection:
  default_port: 502
  default_unit: 247
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_power, label: Grid L1 power, table: holding, address: 10994, type: s32, unit: W, positive: export}
  - {key: l2_power, label: Grid L2 power, table: holding, address: 10996, type: s32, unit: W, positive: export}
  - {key: l3_power, label: Grid L3 power, table: holding, address: 10998, type: s32, unit: W, positive: export}
  - {key: grid_power, label: Grid power, table: holding, address: 11000, type: s32, unit: W, positive: export}
  - {key: pv_power, label: PV power, table: holding, address: 11028, type: u32, unit: W}
  - {key: battery_power, label: Battery power, table: holding, address: 40258, type: s32, unit: W, positive: discharge}
  - {key: grid_export_energy, label: Grid return energy, table: holding, address: 41102, type: u32, unit: kWh, scale: 0.1}
  - {key: grid_import_energy, label: Grid energy, table: holding, address: 41104, type: u32, unit: kWh, scale: 0.1}
  - {key: x.battery_returnenergy, label: Battery return energy, table: holding, address: 41108, type: u32, unit: kWh, scale: 0.1}
  - {key: x.battery_energy, label: Battery energy, table: holding, address: 41110, type: u32, unit: kWh, scale: 0.1}
  - {key: pv_energy, label: PV energy, table: holding, address: 41112, type: u32, unit: kWh, scale: 0.1}
  - {key: battery_soc, label: Battery state of charge, table: holding, address: 43000, type: u16, unit: '%', scale: 0.01}
  - {key: x.batterymode_50000, label: Battery mode control (write), table: holding, address: 50000, type: u16, writable: true, note: 'evcc writes battery mode normal: 257; battery mode hold: 258; battery mode charge: 259.'}

notes:
- 'evcc template `solinteg-gen2` (grid, pv, battery) lists: Solinteg Integ ONE GEN2; M-TEC Energy Butler GEN2; Wattsonic 3p
  AIO Series GEN2.'
- evcc waits 100ms before each register access.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
