  - {key: pv_energy, label: PV energy, table: input, address: 5064, type: f32, unit: kWh, sources: [evcc, ferroamp-modbus]}
  - {key: pv_power, label: PV power, table: input, address: 5100, type: f32, unit: W, scale: 1000, sources: [evcc, ferroamp-modbus]}
