modbusspec: 0
id: ferroamp-energyhub
manufacturer: Ferroamp
name: EnergyHub
kind: inverter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/ferroamp-energyhub.yaml
- id: ferroamp-modbus
  title: ferroamp-modbus (Home Assistant integration)
  url: https://github.com/danielolsson100/ferroamp-modbus
  license: MIT
  commit: 8ed33909406ec2d56ffb7e7290e111eada8ae4ab
  path: custom_components/ferroamp_modbus/const.py, custom_components/ferroamp_modbus/hub.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - ferroamp-modbus

points:
  - {key: x.batterymode_6000, label: Battery mode control (write), table: holding, address: 6000, type: u16, writable: true, note: 'evcc writes battery mode normal: 0; battery mode hold: 1; battery mode charge: 1.', sources: [evcc, ferroamp-modbus]}
  - {key: x.batterymode_6064, label: Battery mode control (write), table: holding, address: 6064, type: f32, unit: W, scale: 1000, writable: true, note: 'evcc writes battery mode normal: 0; battery mode hold: 0; battery mode charge: a value from the user''s settings.', sources: [evcc, ferroamp-modbus]}
  - {key: x.limit_import, label: Limit Import, table: holding, address: 8000, type: u16, writable: true, note: '1 = on, 0 = off; takes effect after writing 0 and then 1 to holding 8006. Reads back at input 8000.'}
  - {key: x.import_threshold, label: Import Threshold, table: holding, address: 8002, type: f32, unit: W, writable: true, note: Takes effect after writing 0 and then 1 to holding 8006. Reads back at input 8002.}
  - {key: x.apply_import_threshold, label: Apply Import Threshold, table: holding, address: 8006, type: u16, writable: true, note: A change to 1 applies the values just written; leave it at 1 for a while (the project says resetting it at once cancels the change).}
  - {key: x.limit_export, label: Limit Export, table: holding, address: 8010, type: u16, writable: true, note: '1 = on, 0 = off; takes effect after writing 0 and then 1 to holding 8016. Reads back at input 8010.'}
  - {key: x.export_threshold, label: Export Threshold, table: holding, address: 8012, type: f32, unit: W, writable: true, note: Takes effect after writing 0 and then 1 to holding 8016. Reads back at input 8012.}
  - {key: x.apply_export_threshold, label: Apply Export Threshold, table: holding, address: 8016, type: u16, writable: true, note: A change to 1 applies the values just written; leave it at 1 for a while (the project says resetting it at once cancels the change).}
  - {key: x.modbus_major_version_1, label: Modbus Major Version 1, table: input, address: 1004, type: u16}
  - {key: x.modbus_major_version_2, label: Modbus Major Version 2, table: input, address: 1008, type: u16}
  - {key: x.inverter_status, label: Inverter Status, table: input, address: 2000, type: u16}
  - {key: frequency, label: Grid Frequency, table: input, address: 2016, type: f32, unit: Hz}
