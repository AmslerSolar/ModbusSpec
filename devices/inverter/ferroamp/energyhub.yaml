  - {key: battery_soh, label: State Of Health, table: input, address: 6012, type: f32, unit: '%'}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 6016, type: f32, unit: '%', sources: [evcc, ferroamp-modbus]}
  - {key: x.battery_returnenergy, label: Battery return energy, table: input, address: 6064, type: f32, unit: kWh, sources: [evcc, ferroamp-modbus]}
  - {key: x.battery_energy, label: Battery energy, table: input, address: 6068, type: f32, unit: kWh, sources: [evcc, ferroamp-modbus]}
