notes:
- 'evcc template `ferroamp-energyhub` (grid, pv, battery) lists: Ferroamp EnergyHub.'
- Modbus TCP has to be enabled on the EnergyHub. The project sends no unit id and says the EnergyHub ignores it.
- The project advises against controlling the battery over Modbus and MQTT at the same time.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
