  - {key: x.grid_reactive_current_l1, label: Grid Reactive Current L1, table: input, address: 3124, type: f32, unit: A}
  - {key: x.grid_reactive_current_l2, label: Grid Reactive Current L2, table: input, address: 3128, type: f32, unit: A}
  - {key: x.grid_reactive_current_l3, label: Grid Reactive Current L3, table: input, address: 3132, type: f32, unit: A}
  - {key: x.grid_rms_current_l1, label: Grid RMS Current L1, table: input, address: 3136, type: f32, unit: A}
