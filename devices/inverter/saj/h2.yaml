notes:
- 'evcc template `saj-h1` (grid, pv, battery) lists: SAJ H1 Series Hybrid Solar Inverter.'
- 'evcc template `saj-h2` (grid, pv, battery) lists: SAJ H2 Series Hybrid Solar Inverter; Ampere Ampere.StoragePro.'
- All values are holding registers (function 03).
- Unsigned 16-bit registers read 0xFFFF where the unit lacks the value (e.g. PV3/PV4 on inverters with fewer MPPT inputs);
  some firmware reads 0 there instead.
- The BMS block (0xA000…) is missing on some models; the inverter-side battery values 0x4067…0x406F stay available.
- Newer H1 firmware leaves the CT grid power register 0x40A1 at 0; the meter A phase powers (0xA03F, 0xA045, 0xA04B) still
  report the grid power.
- 'Charge (0x3606…) and discharge (0x361B…) schedules: 7 slots of 3 registers each (start, end, day mask and power). 0x3604/0x3605
  are bit masks of the enabled slots; slots only act in app mode 1.'
- Battery power sign (0x40A6) is taken from the project's wiki (positive = charging), not from code.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
