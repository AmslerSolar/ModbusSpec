# Written from the SAJ Modbus Communication Protocol (edition 7.2, for PLUS / R5 / R6 / C6), its R6 3–15K part
# (see sources).

modbusspec: 0
id: saj-r6
manufacturer: SAJ
name: R6 3–15K inverter
kind: inverter

sources:
- title: SAJ Modbus Communication Protocol (PLUS, R5, R6, C6)
  version: A, edition 7.2 (November 2022)
  url: https://github.com/wimb0/home-assistant-saj-r5-modbus/blob/1ae7a190ea922961c64a016a561c4267ab211c49/map-modbus-communication-protocol-saj-r5-r6-c6.pdf
  sha256: c68abd532800795f4945d5497a57ea1a94cc99a88d063bf11d1d6920aa75aa81
- title: SAJ Modbus Communication Protocol (PLUS, R5, R6, C6)
  version: A, edition 7.1 (November 2022)
  url: https://github.com/wimb0/home-assistant-saj-r5-modbus/blob/1ae7a190ea922961c64a016a561c4267ab211c49/saj-modbus-communicationprotocol.pdf
  sha256: 666e31484b5b44db27ed4ff8128820b34eaac1329bc5058c505909f4e8052deb

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 36611
    type: str
    length: 10

points:
  # Information (0x8F00 …)
  - {key: x.device_type, label: Type, table: holding, address: 36608, type: u16, poll: slow, note: The document gives no type table for the R6.}
  - {key: x.sub_type, label: SubType, table: holding, address: 36609, type: u16, poll: slow, note: Machine power class (no table given).}
  - {key: x.protocol_version, label: CommProVersion, table: holding, address: 36610, type: u16, scale: 0.001, poll: slow}
  - {key: serial, label: SN, table: holding, address: 36611, type: str, length: 10, poll: slow}
  - {key: x.product_code, label: PC, table: holding, address: 36621, type: str, length: 10, poll: slow}
  - {key: x.display_sw_version, label: DV, table: holding, address: 36631, type: u16, scale: 0.001, invalid: [65535], poll: slow}
  - {key: firmware, label: MCV (master control software version), table: holding, address: 36632, type: u16, scale: 0.001, invalid: [65535], poll: slow}
  - {key: x.slave_sw_version, label: SCV, table: holding, address: 36633, type: u16, scale: 0.001, invalid: [65535], poll: slow}
  - {key: x.display_hw_version, label: DispHWVersion, table: holding, address: 36634, type: u16, scale: 0.001, invalid: [65535], poll: slow}
  - {key: x.control_hw_version, label: CtrlHWVersion, table: holding, address: 36635, type: u16, scale: 0.001, invalid: [65535], poll: slow}
  - {key: x.power_hw_version, label: PowerHWVersion, table: holding, address: 36636, type: u16, scale: 0.001, invalid: [65535], poll: slow}

  # Real-time data (0x4000 …)
  - {key: x.clock, label: Time, table: holding, address: 16384, type: datetime, length: 4, poll: slow, datetime: {year: {register: 0}, month: {register: 1, bits: [8, 15]}, day: {register: 1, bits: [0, 7]}, hour: {register: 2, bits: [8, 15]}, minute: {register: 2, bits: [0, 7]}, second: {register: 3, bits: [8, 15]}}, note: 'Year as a number, then one byte each for month, day, hour, minute, second; the last byte is reserved.'}
  - {key: state, label: MPVMode, table: holding, address: 16388, type: u16, enum: state}
  - {key: x.display_fault, label: HFaultMSG (display board / slave), table: holding, address: 16389, type: u32, flags: display_fault}
  - {key: x.master_fault, label: MFaultMSG (master controller), table: holding, address: 16391, type: u32, flags: master_fault}
  - {key: x.master_fault2, label: MFaultMSG2 (master controller 2), table: holding, address: 16393, type: u32, flags: master_fault2}
  - {key: x.bms_fault, label: BMSFaultMSG, table: holding, address: 16395, type: u32, note: No bit table given.}
  - {key: x.error_count, label: Error_Count, table: holding, address: 16399, type: u16, poll: slow}
  - {key: temperature, label: SinkTempC (heat sink), table: holding, address: 16400, type: s16, unit: °C, scale: 0.1}
  - {key: x.ambient_temperature, label: AmbTempC, table: holding, address: 16401, type: s16, unit: °C, scale: 0.1}
  - {key: x.gfci, label: GFCI (leakage current), table: holding, address: 16402, type: s16, unit: A, scale: 0.001, note: Given in mA.}
  - {key: x.iso_pv1, label: ISO1 (PV1+ insulation), table: holding, address: 16403, type: u16, unit: kΩ, poll: slow}
  - {key: x.iso_pv2, label: ISO2 (PV2+ insulation), table: holding, address: 16404, type: u16, unit: kΩ, poll: slow}
  - {key: x.iso_pv3, label: ISO3 (PV3+ insulation), table: holding, address: 16405, type: u16, unit: kΩ, poll: slow}
  - {key: x.iso_pv_minus, label: ISO4 (PV− insulation), table: holding, address: 16406, type: u16, unit: kΩ, poll: slow}
  - {key: x.connect_countdown, label: ConnTime (grid connection countdown), table: holding, address: 16409, type: u16, unit: s}
  - {key: x.app_mode, label: SetAppMode, table: holding, address: 16418, type: s16, poll: slow, note: Application mode as set; no value table given.}
  - {key: x.battery_status, label: BatStatusDisp, table: holding, address: 16423, type: u16, note: No value table given.}
  - {key: x.battery_soc_max, label: BatChgSocUpLimit, table: holding, address: 16425, type: s16, unit: '%', poll: slow}
  - {key: x.battery_soc_min, label: BatDisSocDowLimit, table: holding, address: 16426, type: s16, unit: '%', poll: slow}
  - {key: x.battery_soc_reserve, label: BatResSoc, table: holding, address: 16428, type: s16, unit: '%', poll: slow}

  # Grid side, per phase (R/S/T = L1/L2/L3)
  - {key: l1_voltage, label: RGridVolt, table: holding, address: 16433, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_l1_current, label: RGridCurr, table: holding, address: 16434, type: s16, unit: A, scale: 0.01}
  - {key: frequency, label: RGridFreq, table: holding, address: 16435, type: u16, unit: Hz, scale: 0.01}
  - {key: x.grid_l1_power, label: RGridPowerWatt, table: holding, address: 16437, type: s16, unit: W, note: Signed; the document doesn't say which direction is positive.}
  - {key: x.grid_l1_apparent_power, label: RGridPowerVA, table: holding, address: 16438, type: u16, unit: VA, note: The document gives the unit as W.}
  - {key: x.grid_l1_pf, label: RGridPowerPF, table: holding, address: 16439, type: s16, scale: 0.001}
  - {key: l2_voltage, label: SGridVolt, table: holding, address: 16440, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_l2_current, label: SGridCurr, table: holding, address: 16441, type: s16, unit: A, scale: 0.01}
  - {key: x.grid_l2_power, label: SGridPowerWatt, table: holding, address: 16444, type: s16, unit: W}
  - {key: l3_voltage, label: TGridVolt, table: holding, address: 16447, type: u16, unit: V, scale: 0.1}
  - {key: x.grid_l3_current, label: TGridCurr, table: holding, address: 16448, type: s16, unit: A, scale: 0.01}
  - {key: x.grid_l3_power, label: TGridPowerWatt, table: holding, address: 16451, type: s16, unit: W}

  # Inverter side, per phase
  - {key: x.inv_l1_power, label: RInvPowerWatt, table: holding, address: 16457, type: s16, unit: W}
  - {key: x.inv_l2_power, label: SInvPowerWatt, table: holding, address: 16462, type: s16, unit: W}
  - {key: x.inv_l3_power, label: TInvPowerWatt, table: holding, address: 16467, type: s16, unit: W}

  # Output (backup) side, per phase
  - {key: x.out_l1_voltage, label: ROutVolt, table: holding, address: 16469, type: u16, unit: V, scale: 0.1}
  - {key: x.out_l1_current, label: ROutCurr, table: holding, address: 16470, type: u16, unit: A, scale: 0.01}
  - {key: x.out_l1_power, label: ROutPowerWatt, table: holding, address: 16473, type: u16, unit: W}
  - {key: x.out_l2_voltage, label: SOutVolt, table: holding, address: 16475, type: u16, unit: V, scale: 0.1}
  - {key: x.out_l2_current, label: SOutCurr, table: holding, address: 16476, type: u16, unit: A, scale: 0.01}
  - {key: x.out_l2_power, label: SOutPowerWatt, table: holding, address: 16479, type: u16, unit: W}
  - {key: x.out_l3_voltage, label: TOutVolt, table: holding, address: 16481, type: u16, unit: V, scale: 0.1}
  - {key: x.out_l3_current, label: TOutCurr, table: holding, address: 16482, type: u16, unit: A, scale: 0.01}
  - {key: x.out_l3_power, label: TOutPowerWatt, table: holding, address: 16485, type: u16, unit: W}

  # DC side
  - {key: x.bus_voltage_master, label: BusVoltMaster, table: holding, address: 16487, type: u16, unit: V, scale: 0.1}
  - {key: x.bus_voltage_slave, label: BusVoltSlave, table: holding, address: 16488, type: u16, unit: V, scale: 0.1}
  - {key: battery_voltage, label: BatVolt, table: holding, address: 16489, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_current, label: BatCurr, table: holding, address: 16490, type: s16, unit: A, scale: 0.01, note: Signed; the document doesn't say which direction is positive.}
  - {key: x.battery_power, label: BatPower, table: holding, address: 16493, type: s16, unit: W, note: Signed; the document doesn't say which direction is positive.}
  - {key: battery_temperature, label: BatTempC, table: holding, address: 16494, type: s16, unit: °C, scale: 0.1}
  - {key: battery_soc, label: BatEnergyPercent, table: holding, address: 16495, type: u16, unit: '%', scale: 0.01}
  - {key: x.pv1_voltage, label: PV1Volt, table: holding, address: 16497, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1Curr, table: holding, address: 16498, type: u16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: PV1Power, table: holding, address: 16499, type: u16, unit: W}
  - {key: x.pv2_voltage, label: PV2Volt, table: holding, address: 16500, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: PV2Curr, table: holding, address: 16501, type: u16, unit: A, scale: 0.01}
  - {key: x.pv2_power, label: PV2Power, table: holding, address: 16502, type: u16, unit: W}
  - {key: x.pv3_voltage, label: PV3Volt, table: holding, address: 16503, type: u16, unit: V, scale: 0.1}
  - {key: x.pv3_current, label: PV3Curr, table: holding, address: 16504, type: u16, unit: A, scale: 0.01}
  - {key: x.pv3_power, label: PV3Power, table: holding, address: 16505, type: u16, unit: W}
  - {key: x.pv4_voltage, label: PV4Volt, table: holding, address: 16506, type: u16, unit: V, scale: 0.1}
  - {key: x.pv4_current, label: PV4Curr, table: holding, address: 16507, type: u16, unit: A, scale: 0.01}
  - {key: x.pv4_power, label: PV4Power, table: holding, address: 16508, type: u16, unit: W}

  # Energy flow and totals
  - {key: x.pv_direction, label: PV_direction, table: holding, address: 16533, type: u16, note: No value table given.}
  - {key: x.battery_direction, label: Battery_direction, table: holding, address: 16534, type: s16, note: No value table given.}
  - {key: x.grid_direction, label: Grid_direction, table: holding, address: 16535, type: s16, note: No value table given.}
  - {key: x.output_direction, label: OutPut_direction, table: holding, address: 16536, type: u16, note: No value table given.}
  - {key: x.pv_to_load_power, label: PVConsumpWatt, table: holding, address: 16537, type: s16, unit: W}
  - {key: x.grid_to_load_power, label: GridConsumpWatt, table: holding, address: 16538, type: s16, unit: W}
  - {key: x.pv_to_grid_power, label: GridFeedInPVWatt, table: holding, address: 16539, type: s16, unit: W}
  - {key: x.battery_to_grid_power, label: GridFeedInBatWatt, table: holding, address: 16540, type: s16, unit: W}
  - {key: x.battery_to_load_power, label: BatConsumpWatt, table: holding, address: 16541, type: s16, unit: W}
  - {key: x.pv_to_battery_power, label: BatChgPVWatt, table: holding, address: 16542, type: s16, unit: W}
  - {key: x.grid_to_battery_power, label: BatChgGridWatt, table: holding, address: 16543, type: s16, unit: W}
  - {key: load_power, label: SysTotalLoadWatt, table: holding, address: 16544, type: s16, unit: W}
  - {key: x.ct_grid_power, label: CT_GridPowerWatt, table: holding, address: 16545, type: s16, unit: W}
  - {key: x.ct_pv_power, label: CT_PVPowerWatt, table: holding, address: 16547, type: s16, unit: W}
  - {key: pv_power, label: TotalPVPower, table: holding, address: 16549, type: s16, unit: W}
  - {key: x.total_battery_power, label: TotalBatteryPower, table: holding, address: 16550, type: s16, unit: W, note: Signed; the document doesn't say which direction is positive.}
  - {key: x.total_grid_power, label: TotalGridPowerWatt, table: holding, address: 16551, type: s16, unit: W, note: Signed; the document doesn't say which direction is positive.}
  - {key: x.total_grid_apparent_power, label: TotalGridPowerVA, table: holding, address: 16552, type: s16, unit: VA}
  - {key: x.total_inverter_power, label: TotalInvPowerWatt, table: holding, address: 16553, type: s16, unit: W}
  - {key: x.total_inverter_apparent_power, label: TotalInvPowerVA, table: holding, address: 16554, type: s16, unit: VA}
  - {key: x.backup_load_power, label: BackupTotalLoadPowerWatt, table: holding, address: 16555, type: u16, unit: W}
  - {key: x.system_grid_power, label: SysGridPowerWall, table: holding, address: 16557, type: s16, unit: W, note: Signed; the document doesn't say which direction is positive.}
  - {key: x.hours_today, label: Today_Hour (grid-connected), table: holding, address: 16572, type: u16, unit: h, scale: 0.1, poll: slow}
  - {key: x.hours_total, label: Total_Hour (grid-connected), table: holding, address: 16573, type: u32, unit: h, scale: 0.1, poll: slow}
  - {key: pv_energy_today, label: Today_PVEnergy, table: holding, address: 16575, type: u32, unit: kWh, scale: 0.01}
  - {key: pv_energy, label: Total_PVEnergy, table: holding, address: 16581, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.battery_charge_energy_today, label: Today_BatChgEnergy, table: holding, address: 16583, type: u32, unit: kWh, scale: 0.01}
  - {key: x.battery_charge_energy, label: Total_BatChgEnergy, table: holding, address: 16589, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.battery_discharge_energy_today, label: Today_BatDisEnergy, table: holding, address: 16591, type: u32, unit: kWh, scale: 0.01}
  - {key: x.battery_discharge_energy, label: Total_BatDisEnergy, table: holding, address: 16597, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.inverter_energy_today, label: Today_InvGenEnergy, table: holding, address: 16599, type: u32, unit: kWh, scale: 0.01}
  - {key: x.inverter_energy, label: Total_InvGenEnergy, table: holding, address: 16605, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.load_energy_today, label: Today_TotalLoadEnergy, table: holding, address: 16607, type: u32, unit: kWh, scale: 0.01}
  - {key: x.load_energy, label: Total_TotalLoadEnergy, table: holding, address: 16613, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.backup_load_energy_today, label: Today_BackupLoadEnergy, table: holding, address: 16615, type: u32, unit: kWh, scale: 0.01}
  - {key: x.backup_load_energy, label: Total_BackupLoadEnergy, table: holding, address: 16621, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.sell_energy_today, label: Today_SellEnergy, table: holding, address: 16623, type: u32, unit: kWh, scale: 0.01}
  - {key: x.sell_energy, label: Total_SellEnergy, table: holding, address: 16629, type: u32, unit: kWh, scale: 0.01, poll: slow, note: '"System selling" energy; the document doesn''t explain how it differs from the feed-in counter (0x40FD).'}
  - {key: x.feed_in_energy_today, label: Today_FeedInEnergy, table: holding, address: 16631, type: u32, unit: kWh, scale: 0.01}
  - {key: x.feed_in_energy, label: Total_FeedInEnergy, table: holding, address: 16637, type: u32, unit: kWh, scale: 0.01, poll: slow}

  # Settings (0x3400 …)
  - {key: x.function_mask, label: FunMask, table: holding, address: 13320, type: u16, flags: function_mask, writable: true, poll: slow, note: Bit set = function enabled.}
  - {key: x.power_limit, label: PowerLimited, table: holding, address: 13323, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, verified: false, note: 'Multiplier −3 on a ratio; read as 0.1 % steps as for the PLUS/R5 register 0x101C (assumed: the R6 part gives no range).'}
  - {key: x.inverter_stop, label: InverterStop, table: holding, address: 13324, type: u16, enum: inverter_stop, writable: true, poll: slow}
  - {key: x.iso_limit, label: ISOLimit, table: holding, address: 13328, type: u16, unit: kΩ, writable: true, poll: slow}
  - {key: x.reactive_mode, label: ReactiveMode, table: holding, address: 13334, type: u16, enum: reactive_mode, writable: true, poll: slow}
  - {key: x.reactive_value, label: ReactiveValue, table: holding, address: 13335, type: u16, writable: true, poll: slow, note: 'Meaning depends on 0x3416: modes 0–1 reactive power in var (0–65535), modes 2–3 power factor (×0.001), modes 4–5 a reactive compensation value.'}
  - {key: x.safety_type, label: SafetyType (grid code), table: holding, address: 13345, type: u16, writable: true, poll: slow}
  - {key: x.pv_input_mode, label: PVInputMode, table: holding, address: 13370, type: u16, enum: pv_input_mode, writable: true, poll: slow}

enums:
  state: {'0': Initialising, '1': Waiting, '2': Running, '3': Off-grid (storage), '4': On-grid with load (storage), '5': Fault, '6': Upgrading, '7': Debug, '8': Self-check, '9': Reset}
  inverter_stop: {'0': Power on, '1': Power off}
  reactive_mode: {'0': 'Capacitive, reactive power', '1': 'Inductive, reactive power', '2': Capacitive power factor, '3': Inductive power factor, '4': Q(U) curve, '5': Power factor curve}
  pv_input_mode: {'0': PV inputs independent, '8': PV inputs parallel}

flags:
  display_fault: {'0': 'Code 50: internal communication lost (display/master)', '1': 'Code 51: meter communication lost (warning)', '2': 'Code 52: display EEPROM fault', '3': 'Code 53: display RTC fault', '4': 'Code 54: BMS device fault', '5': 'Code 55: BMS communication lost (warning)', '6': 'Code 56: CT device fault', '7': 'Code 57: AFCI board communication lost', '11': 'Code 61: L1 grid voltage high', '12': 'Code 62: L1 grid voltage low', '13': 'Code 63: L2 grid voltage high', '14': 'Code 64: L2 grid voltage low', '15': 'Code 65: L3 grid voltage high', '16': 'Code 66: L3 grid voltage low', '17': 'Code 67: grid frequency high', '18': 'Code 68: grid frequency low', '23': 'Code 73: no grid', '24': 'Code 74: PV input mode error', '25': 'Code 75: PV overcurrent (hardware)', '26': 'Code 76: PV overvoltage', '27': 'Code 77: bus overvoltage (hardware)'}
  master_fault: {'0': 'Code 33: bus overvoltage (software)', '1': 'Code 34: bus undervoltage (software)', '2': 'Code 35: grid phase error', '3': 'Code 36: PV overvoltage', '4': 'Code 37: islanding', '5': 'Code 83: arc detection device fault', '6': 'Code 84: PV input error', '7': 'Code 49: meter communication lost', '8': 'Code 38: bus overvoltage (hardware)', '9': 'Code 39: PV overcurrent (hardware)', '11': 'Code 41: inverter overcurrent (hardware)', '14': 'Code 44: neutral-to-earth voltage fault', '15': 'Code 86: DRM0 fault', '16': 'Code 45: fan 1 fault', '17': 'Code 46: fan 2 fault', '18': 'Code 47: fan 3 fault', '19': 'Code 48: fan 4 fault', '20': 'Code 87: arc fault', '21': 'Code 88: PV overcurrent (software)', '22': 'Code 89: battery overvoltage', '23': 'Code 90: battery overcurrent', '24': 'Code 91: battery charge voltage high', '25': 'Code 92: battery overload', '26': 'Code 93: battery soft-connect timeout', '27': 'Code 94: output overload', '28': 'Code 95: battery open circuit', '29': 'Code 96: battery discharge voltage low', '30': 'Code 85: authorisation expired', '31': 'Code 81: lost communication between display and control board'}
  master_fault2: {'0': 'Code 01: relay fault', '1': 'Code 02: EEPROM fault', '2': 'Code 03: temperature too high', '3': 'Code 04: temperature too low', '4': 'Code 05: internal communication lost (master/slave)', '5': 'Code 06: leakage current sensor fault', '6': 'Code 07: DC injection sensor fault', '7': 'Code 08: current sensor fault', '8': 'Code 09: L1 grid voltage high', '9': 'Code 10: L1 grid voltage low', '10': 'Code 11: L2 grid voltage high', '11': 'Code 12: L2 grid voltage low', '12': 'Code 13: L3 grid voltage high', '13': 'Code 14: L3 grid voltage low', '14': 'Code 15: 10-minute average grid voltage high', '15': 'Code 16: off-grid output voltage low', '17': 'Code 18: grid frequency high', '18': 'Code 19: grid frequency low', '20': 'Code 21: L1 output DC voltage component high', '21': 'Code 22: L2 output DC voltage component high', '22': 'Code 23: L3 output DC voltage component high', '23': 'Code 24: no grid', '26': 'Code 27: leakage current (GFCI) fault', '27': 'Code 28: L1 DC injection high', '28': 'Code 29: L2 DC injection high', '29': 'Code 30: L3 DC injection high', '30': 'Code 31: insulation fault', '31': 'Code 32: bus voltage imbalance'}
  function_mask: {'0': Relay check, '1': Insulation check, '2': Leakage current device self-test, '3': Leakage current check, '4': Grid current DC component check, '5': Grid current DC component control, '6': Anti-islanding, '7': Fan check, '8': PV tracking, '9': Output voltage DC component check, '10': Global MPPT scan, '11': Grid connection check, '12': Output voltage DC component control, '13': Output connection check, '14': Inverter waveform check, '15': PV independent load}

problems:
  - {when: {key: state, equals: 5}, kind: fault, text: Inverter fault (mode 5)}
  - {when: {key: state, equals: 3}, kind: backup_mode, text: Running off-grid (mode 3)}
  - {when: {key: x.master_fault2, bit: 23}, kind: mains_lost, text: No grid (code 24)}
  - {when: {key: x.display_fault, bit: 23}, kind: mains_lost, text: No grid (code 73)}
  - {when: {key: x.display_fault, bit: 1}, kind: warning, text: Meter communication lost (code 51)}
  - {when: {key: x.display_fault, bit: 5}, kind: warning, text: BMS communication lost (code 55)}

notes:
- Register map of the R6 3–15K from the SAJ protocol edition 7.2 (section 4.2.2, settings 4.3.2, faults 4.5.2); the information
  block 0x8F00 is shared with the other SAJ on-grid series. The R6 17–50K uses another map (see saj-c6).
- The document gives hex register addresses; they are used as they are (0-based). Reads use function 03.
- RS485 runs at 9600 baud by default, the RS232/USB port at 115200 baud; 8N1. The document gives no default address, so unit
  1 is an assumption, and port 502 only applies behind a TCP gateway.
- 32-bit values are taken as most significant register first (the protocol's PLUS/R5 fault example shows that order; not stated
  for this map). Fault bit numbers are the document's tag numbers 0–31, taken as bit 0 = least significant.
- The signed grid, battery and inverter powers and the battery current have no stated direction, and the map also has direction
  registers (0x4095–0x4098) without value tables, so they are left as device-specific values. Readings show which way is positive
  on a real device.
- 'Not used: the per-phase grid DC component, frequency and inverter/output apparent power and frequency registers, the per-string
  PV currents (0x407D–0x408C), the grid-connected side block (0x408D–0x4094, whose S/T entries look garbled in the document),
  the CT apparent powers, the intelligent-load powers (0x40B0–0x40B2), the 5-minute power maxima, the month/year energy counters,
  and the battery and meter setting readbacks 0x4023–0x4030 other than those above.'
