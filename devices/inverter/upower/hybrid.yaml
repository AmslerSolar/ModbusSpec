modbusspec: 0
id: upower-hybrid
manufacturer: UPower
name: Hybrid inverters
kind: inverter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/upower/upower

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

models:
  - {id: gen_1, name: GEN 1}
  - {id: gen_2, name: GEN 2}

points:
  - {key: grid_power, label: Counter power, table: holding, address: 1000, type: s32, unit: W, positive: export, models: [gen_1]}
  - {key: pv_energy, label: Inverter exported energy, table: holding, address: 1006, type: u32, unit: kWh, scale: 0.01, models: [gen_2]}
  - {key: grid_power, label: Counter power, table: holding, address: 1219, type: s16, unit: W, scale: 10, positive: export, models: [gen_2]}
  - {key: pv_power, label: Inverter power, table: holding, address: 1220, type: u16, unit: W, models: [gen_2], note: Raw > 0 = generation (openWB's sign handling).}
  - {key: x.counter_powers_l1_1750, label: Counter power L1, table: holding, address: 1750, type: s16, unit: W, scale: 10, models: [gen_2], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l2_1751, label: Counter power L2, table: holding, address: 1751, type: s16, unit: W, scale: 10, models: [gen_2], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l3_1752, label: Counter power L3, table: holding, address: 1752, type: s16, unit: W, scale: 10, models: [gen_2], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_frequency_1759, label: Counter frequency, table: holding, address: 1759, type: u16, unit: Hz, scale: 0.01, models: [gen_2]}
  - {key: x.counter_powers_l1_10994, label: Counter power L1, table: holding, address: 10994, type: s32, unit: W, models: [gen_1], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l2_10996, label: Counter power L2, table: holding, address: 10996, type: s32, unit: W, models: [gen_1], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_powers_l3_10998, label: Counter power L3, table: holding, address: 10998, type: s32, unit: W, models: [gen_1], note: Raw > 0 = export (openWB's sign handling).}
  - {key: x.counter_frequency_11015, label: Counter frequency, table: holding, address: 11015, type: u16, unit: Hz, models: [gen_1]}
  - {key: pv_energy, label: Inverter exported energy, table: holding, address: 11020, type: u32, unit: kWh, scale: 0.1, models: [gen_1]}
  - {key: pv_power, label: Inverter power, table: holding, address: 11028, type: u32, unit: W, models: [gen_1], note: Raw > 0 = generation (openWB's sign handling).}
  - {key: grid_export_energy, label: Counter exported energy, table: holding, address: 31102, type: u32, unit: kWh, scale: 0.1, models: [gen_1]}
  - {key: grid_import_energy, label: Counter imported energy, table: holding, address: 31104, type: u32, unit: kWh, scale: 0.1, models: [gen_1]}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 1402, type: u16, unit: '%', scale: 0.1, models: [gen_2]}
  - {key: battery_power, label: Battery power, table: input, address: 1427, type: s16, unit: W, positive: charge, models: [gen_2]}
  - {key: battery_power, label: Battery power, table: input, address: 30258, type: s32, unit: W, positive: discharge, models: [gen_1]}
  - {key: x.bat_imported, label: Battery imported energy, table: input, address: 31108, type: u32, unit: kWh, scale: 0.1, models: [gen_1]}
  - {key: x.bat_exported, label: Battery exported energy, table: input, address: 31110, type: u32, unit: kWh, scale: 0.1, models: [gen_1]}
  - {key: battery_soc, label: Battery state of charge, table: input, address: 33000, type: u16, unit: '%', models: [gen_1]}

notes:
- The models are openWB's settings for this device (which register map to read), not detected from the device.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
