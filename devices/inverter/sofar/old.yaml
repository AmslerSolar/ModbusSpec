  - {key: x.inverter_power, label: Input/output power, table: holding, address: 532, type: s16, unit: W, scale: 10, note: Direction not stated.}
  - {key: pv_power, label: Power of generation, table: holding, address: 533, type: u16, unit: W, scale: 10}
