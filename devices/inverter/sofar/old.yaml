  - {key: l3_current, label: Grid C current, table: holding, address: 523, type: s16, unit: A, scale: 0.01, optional: true}
  - {key: frequency, label: Grid frequency, table: holding, address: 524, type: u16, unit: Hz, scale: 0.01}
