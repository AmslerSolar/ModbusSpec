connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 8193
    type: str
    length: 7
  any:
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SA1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SA3
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SB1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: ZA3
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SC1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SD1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SF4
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SH1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SJ2
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SL1
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SE1E
  - table: input
    address: 8194
    type: str
    length: 6
    prefix: SM1
  - table: input
