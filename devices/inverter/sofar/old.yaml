  sha256: 108acecc594383b07d186aa1a4d5b835550ed219930d43ed7138f48fc4e77450
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/sofarsolar.yaml
- id: sofar-modbus
