notes:
- The document describes a SofarSolar energy storage inverter (serial product code E1) with a low-voltage battery. Live data
  is read with function 03, battery parameters and inverter information with function 04.
- 'Fault, alert and battery fault words: the high byte holds the odd byte number (byte 1, 3, …), the low byte the even one.
  Battery fault words 2…5 (0x023E…0x0241) are all reserved.'
- 'Serial number (14 characters): S = SofarSolar, product code (A1 = 1.1–6 kW, M1 = micro-inverter, C1 = 10–20 kW, D1 = 30–40
  kW, E1 = storage inverter), region (E or U), configuration, then year, month, day and a sequence number. The document places
  it at input registers 0x2001…0x2007; not checked on a device.'
- 'Left out: the bus and buck readings 0x022D…0x022F and the generation current 0x0236 (units missing or unclear in the document),
  reserved 0x0224…0x0229, and the vendor function codes (time broadcast).'
- Models sofar_modbus_x1_pv, sofar_modbus_x3_pv, sofar_modbus_pv, solarman_default, solarman_hyd_es, solax_modbus_x1_pv, solax_modbus_x3_pv,
  solax_modbus_x1_hybrid, solax_modbus_pv come from projects and are listed after a model without a match, so detection never
  reaches them; their points apply only when a reader selects such a model by hand.
- Identification as solax-modbus recognises the device (not checked against a document).
- 'evcc template `sofarsolar` (grid, pv, battery) lists: SofarSolar Inverter; SofarSolar Hybrid Inverter; ZCS Azzurro Inverter;
  ZCS Azzurro Hybrid Inverter.'
- The project reads this map over RTU only and never writes it.
- The serial number is in the input registers (0x2002); the project strips padding characters before matching its prefix.
- Default unit 1 and 9600 baud are the Home Assistant sofar integration's defaults (it uses the current map only).
- Models without a match can't be picked by one serial prefix; their names list the prefixes the project maps to them (first
  prefix in its list wins).
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Also used for sofar_wifikit.
- Also used for sofar_hyd-es (mod=1).
- Also used for sofar_hyd3k-6k-es (mod=1).
- The model is a setting in the project (its `mod` option); it isn't read from the device.
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- 'Left out: serial_number (input 8194, str) from sofar-modbus, solax-modbus overlaps device_serial_number (input 8193, str,
  7 registers); check a document.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
