  - {id: sofar_modbus_x1_pv, name: 'X1 | PV (serial SA1*, SA3*, SB1*, ZA3*)'}
  - {id: sofar_modbus_x3_pv, name: 'X3 | PV (serial SC1*, SD1*, SF4*, SH1*, SJ2*, SL1*)'}
  - {id: sofar_modbus_pv, name: PV (serial SM1*)}
  - {id: solarman_default, name: default (mod 0)}
