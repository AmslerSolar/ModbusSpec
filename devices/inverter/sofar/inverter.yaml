notes:
- 'Read with function 03 (holding registers). 32-bit values: high word first.'
- 'Address areas start with a 64-bit mask (e.g. 0x0400…0x0403, 0x0440…0x0443): each bit says whether one of the 64 registers
  of the area is in use on this model. Which PV inputs, battery packs, temperatures and fault words a model has depends on
  the model.'
- 'Fault words: byte 0 is the low byte (bits 0–7), byte 1 the high byte (bits 8–15). Fault word 8 only raises alarms (derating)
  and does not stop the inverter. Bit texts follow the document; ID numbers are the inverter''s event IDs.'
- 'Writes: several settings must be written as a block starting at a fixed address (e.g. the clock at 0x1004 with seven registers,
  the battery parameters with a control register that applies the shadow values); see the document before writing. Writing
  is not described here.'
- 'Left out: the other PV inputs (5…16 at 0x0584 + 3 × (n − 1)), battery packs 2…8 (0x0604 + 7 × (n − 1)), heat sinks 4…6,
  reactive and PCC power factor per phase, the BMS area (0x9000…) and the DC-DC area (0x5000…).'
- 'Serial settings: 9600 baud, 8 data bits, no parity, one stop bit by default; changeable at 0x100B…0x100F (address, baud,
  stop bits, parity).'
- Models sofar_modbus_gen_x3_hybrid, sofar_modbus_gen_x1_hybrid, sofar_modbus_gen_x3_pv, sofar_modbus_x3_pv, solax_modbus_x3_hybrid,
  solax_modbus_gen_x1_hybrid_hyd_ep, solax_modbus_gen_x1_pv, solax_modbus_gen_x3_pv_mppt10, solax_modbus_gen_x3_hybrid_bat_bts,
  solax_modbus_gen_x3_hybrid, solax_modbus_gen_x1_hybrid, solax_modbus_gen_x3_pv, solax_modbus_x3_pv come from projects and
  are listed after a model without a match, so detection never reaches them; their points apply only when a reader selects
  such a model by hand.
- Identification as solax-modbus recognises the device (not checked against a document).
- 'evcc template `sofarsolar-g3` (grid, pv, battery) lists: SofarSolar HYD 5…20K-3PH; SofarSolar HYD 3…6K-EP; SofarSolar SOFAR
  80…136KTL; SofarSolar SOFAR 5…24KTL-G3.'
- The template has the option `externalpower` (default false); points used only with another value say so in their note.
- Default port 502, unit 1 and 9600 baud are the Home Assistant sofar integration's defaults.
- The project reads at most 48 registers per request on this map.
- 'Type detection: the serial number (0x0445) prefix gives the type; if it gives none, the project derives it from the address
  masks (three-phase if 0x0498 is served, hybrid if 0x0604 is, string count from block 0x0580, battery tower if block 0x9000
  answers).'
- 'Address masks: each 64-register block from 0x0400 starts with 4 registers (one 64-bit value, most significant register
  first) whose bit n says whether address base + n is served. The project drops the meter energy (0x0688 on) when its bit
  is clear, and reads 0x105B only when declared.'
- The settings at 0x1023/0x1024, 0x1029/0x102A, 0x1105/0x1106, 0x1184/0x1185 and 0x1187–0x118C are accepted only as one block
  write each.
- Models without a match can't be picked by one serial prefix; their names list the prefixes the project maps to them (first
  prefix in its list wins).
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
- Also used for hyd-zss-hp-3k-6k (pack=1).
- Also used for sofar_tlx-g3.
- Also used for zcs_azzurro-hyd-zss-hp (pack=1).
- Also used for zcs_azzurro-ktl-v3.
- 'Models without a match can''t be picked by a single serial prefix; their names list the prefixes the project maps to them
  ("some": only some of those serials, the project also looks at other data).'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
