  - {key: x.protocol_version, label: Modbus_Protocol_Version, table: holding, address: 68, type: bcd16, scale: 0.01, poll: slow, note: 'BCD: 0x0122 = protocol version 1.22.'}

  # System information (0x0404…0x043D)
  - {key: state, label: SysState (operational status), table: holding, address: 1028, type: u16, enum: sys_state}
  - {key: x.fault_1, label: Fault1, table: holding, address: 1029, type: u16, flags: fault_1}
  - {key: x.fault_2, label: Fault2, table: holding, address: 1030, type: u16, flags: fault_2}
  - {key: x.fault_3, label: Fault3, table: holding, address: 1031, type: u16, flags: fault_3}
  - {key: x.fault_4, label: Fault4, table: holding, address: 1032, type: u16, flags: fault_4}
  - {key: x.fault_5, label: Fault5, table: holding, address: 1033, type: u16, flags: fault_5}
  - {key: x.fault_6, label: Fault6, table: holding, address: 1034, type: u16, flags: fault_6}
  - {key: x.fault_7, label: Fault7, table: holding, address: 1035, type: u16, flags: fault_7}
  - {key: x.fault_8, label: Fault8, table: holding, address: 1036, type: u16, flags: fault_8}
  - {key: x.fault_9, label: Fault9, table: holding, address: 1037, type: u16, flags: fault_9}
  - {key: x.fault_10, label: Fault10, table: holding, address: 1038, type: u16, flags: fault_10}
  - {key: x.fault_11, label: Fault11, table: holding, address: 1039, type: u16, flags: fault_11}
  - {key: x.fault_12, label: Fault12, table: holding, address: 1040, type: u16, flags: fault_12}
  - {key: x.fault_13, label: Fault13, table: holding, address: 1041, type: u16, flags: fault_13}
  - {key: x.fault_14, label: Fault14, table: holding, address: 1042, type: u16, flags: fault_14}
  - {key: x.fault_15, label: Fault15, table: holding, address: 1043, type: u16, flags: fault_15}
  - {key: x.fault_16, label: Fault16, table: holding, address: 1044, type: u16, flags: fault_16}
  - {key: x.fault_17, label: Fault17, table: holding, address: 1045, type: u16, flags: fault_17}
  - {key: x.fault_18, label: Fault18, table: holding, address: 1046, type: u16, flags: fault_18}
  - {key: x.fault_19, label: Fault19, table: holding, address: 1074, type: u16, flags: fault_19}
  - {key: x.fault_20, label: Fault20, table: holding, address: 1075, type: u16}
  - {key: x.fault_21, label: Fault21, table: holding, address: 1076, type: u16}
  - {key: x.fault_22, label: Fault22, table: holding, address: 1077, type: u16, flags: fault_22}
  - {key: x.fault_23, label: Fault23, table: holding, address: 1078, type: u16, flags: fault_23}
  - {key: x.fault_24, label: Fault24, table: holding, address: 1079, type: u16}
  - {key: x.fault_25, label: Fault25, table: holding, address: 1080, type: u16}
  - {key: x.fault_26, label: Fault26, table: holding, address: 1081, type: u16, flags: fault_26}
  - {key: x.fault_27, label: Fault27, table: holding, address: 1082, type: u16, flags: fault_27}
  - {key: x.fault_28, label: Fault28, table: holding, address: 1083, type: u16}
  - {key: x.fault_29, label: Fault29, table: holding, address: 1084, type: u16, flags: fault_29}
  - {key: x.fault_30, label: Fault30, table: holding, address: 1085, type: u16, flags: fault_30}
  - {key: x.countdown, label: Countdown (grid connection waiting time), table: holding, address: 1047, type: u16, unit: s, conflicts: [{sources: [sofar-modbus, solax-modbus], type: s16, label: Waiting time}]}
  - {key: x.ambient_temperature_1, label: Temperature_Env1, table: holding, address: 1048, type: s16, unit: °C}
  - {key: x.ambient_temperature_2, label: Temperature_Env2, table: holding, address: 1049, type: s16, unit: °C, optional: true}
  - {key: temperature, label: Temperature_HeatSink1, table: holding, address: 1050, type: s16, unit: °C}
  - {key: x.heatsink_temperature_2, label: Temperature_HeatSink2, table: holding, address: 1051, type: s16, unit: °C, optional: true}
  - {key: x.heatsink_temperature_3, label: Temperature_HeatSink3, table: holding, address: 1052, type: s16, unit: °C, optional: true}
  - {key: x.module_temperature_1, label: Temperature_Inv1 (module temperature 1), table: holding, address: 1056, type: s16, unit: °C}
  - {key: x.module_temperature_2, label: Temperature_Inv2, table: holding, address: 1057, type: s16, unit: °C, optional: true}
  - {key: x.module_temperature_3, label: Temperature_Inv3, table: holding, address: 1058, type: s16, unit: °C, optional: true}
  - {key: x.generation_time_today, label: GenerationTime_Today, table: holding, address: 1062, type: u16, unit: min, poll: slow}
  - {key: x.generation_time_total, label: GenerationTime_Total, table: holding, address: 1063, type: u32, unit: min, poll: slow}
  - {key: x.service_time_total, label: ServiceTime_Total, table: holding, address: 1065, type: u32, unit: min, poll: slow}
  - {key: x.insulation_resistance, label: InsulationResistance, table: holding, address: 1067, type: u16, unit: kΩ, poll: slow}
  - {key: x.clock, label: SysTime (year … second), table: holding, address: 1068, type: datetime, length: 6, datetime: {year: {register: 0, offset: 2000}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow}

  # Identity (0x0444…0x0471)
  - {key: serial, label: Serial_Number0-7 (serial characters 1-16), table: holding, address: 1093, type: str, length: 8, poll: slow, note: 'Two characters per register, first character in the high byte. 20-character serial numbers continue in x.serial_ext (0x0470).', conflicts: [{sources: [sofar-modbus, solax-modbus], length: 7, label: Serial number}]}
  - {key: x.hardware_version, label: Hardware_Version0-1, table: holding, address: 1101, type: str, length: 2, poll: slow}
  - {key: firmware, label: 'Software version, communication chip (stage, major, custom, minor)', table: holding, address: 1103, type: str, length: 4, poll: slow, note: 'Stage letter in the low byte of the first register (''V'' for a release), then major, custom and minor version as two ASCII digits each.'}
  - {key: x.firmware_master, label: 'Software version, master controller chip', table: holding, address: 1107, type: str, length: 4, poll: slow}
  - {key: x.firmware_slave, label: 'Software version, slave controller chip', table: holding, address: 1111, type: str, length: 4, poll: slow}
  - {key: x.safety_version, label: Safety_Version_Major / Minor, table: holding, address: 1115, type: str, length: 2, poll: slow, note: 'ASCII digits, e.g. 0x3036 = 06.'}
  - {key: x.serial_ext, label: Serial_Number8-9 (serial characters 17-20), table: holding, address: 1136, type: str, length: 2, poll: slow, note: Only used by 20-character serial numbers.}

  # Grid output (0x0484…0x04BD)
  - {key: frequency, label: Frequency_Grid, table: holding, address: 1156, type: u16, unit: Hz, scale: 0.01}
  - {key: x.inverter_power, label: ActivePower_Output_Total, table: holding, address: 1157, type: s16, unit: W, scale: 10, note: 'Inverter AC output power: + = delivering (discharging), − = taking in (charging).'}
  - {key: reactive_power, label: ReactivePower_Output_Total, table: holding, address: 1158, type: s16, unit: var, scale: 10, note: The document gives the unit as kW; kvar assumed. + = leading.}
  - {key: apparent_power, label: ApparentPower_Output_Total, table: holding, address: 1159, type: s16, unit: VA, scale: 10, note: The document gives the unit as kW; kVA assumed.}
  - {key: grid_power, label: ActivePower_PCC_Total, table: holding, address: 1160, type: s16, unit: W, scale: 10, positive: export, note: 'Grid power at the connection point (meter or CT). + = selling (export), − = buying (import). Some models need a meter for it.'}
  - {key: x.grid_power_coarse, label: ActivePower_PCC_Total2, table: holding, address: 1163, type: s16, unit: W, scale: 100, note: Same as grid_power with 0.1 kW resolution; for when 0x0488 overflows.}
  - {key: l1_voltage, label: Voltage_Phase_R, table: holding, address: 1165, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Current_Output_R, table: holding, address: 1166, type: u16, unit: A, scale: 0.01}
  - {key: l1_power, label: ActivePower_Output_R, table: holding, address: 1167, type: s16, unit: W, scale: 10, positive: export, note: '+ = delivering, − = charging.'}
  - {key: x.grid_l1_current, label: Current_PCC_R, table: holding, address: 1170, type: u16, unit: A, scale: 0.01}
  - {key: x.grid_l1_power, label: ActivePower_PCC_R, table: holding, address: 1171, type: s16, unit: W, scale: 10, note: Not stated for the phase values; the same direction as the total (+ = export) assumed., verified: false}
  - {key: l2_voltage, label: Voltage_Phase_S, table: holding, address: 1176, type: u16, unit: V, scale: 0.1}
  - {key: l2_current, label: Current_Output_S, table: holding, address: 1177, type: u16, unit: A, scale: 0.01}
  - {key: l2_power, label: ActivePower_Output_S, table: holding, address: 1178, type: s16, unit: W, scale: 10, positive: export, note: Direction stated for phase R only; the same assumed., verified: false}
  - {key: x.grid_l2_current, label: Current_PCC_S, table: holding, address: 1181, type: u16, unit: A, scale: 0.01}
  - {key: x.grid_l2_power, label: ActivePower_PCC_S, table: holding, address: 1182, type: s16, unit: W, scale: 10, note: Not stated; + = export assumed., verified: false}
  - {key: l3_voltage, label: Voltage_Phase_T, table: holding, address: 1187, type: u16, unit: V, scale: 0.1}
  - {key: l3_current, label: Current_Output_T, table: holding, address: 1188, type: u16, unit: A, scale: 0.01}
  - {key: l3_power, label: ActivePower_Output_T, table: holding, address: 1189, type: s16, unit: W, scale: 10, positive: export, note: Direction stated for phase R only; the same assumed., verified: false}
  - {key: x.grid_l3_current, label: Current_PCC_T, table: holding, address: 1192, type: u16, unit: A, scale: 0.01}
  - {key: x.grid_l3_power, label: ActivePower_PCC_T, table: holding, address: 1193, type: s16, unit: W, scale: 10, note: Not stated; + = export assumed., verified: false}
  - {key: x.external_pv_power, label: ActivePower_PV_Ext (external generation), table: holding, address: 1198, type: u16, unit: W, scale: 10}
  - {key: load_power, label: ActivePower_Load_Sys (total system load), table: holding, address: 1199, type: u16, unit: W, scale: 10, note: Needs a load connected; the house load of the energy flow diagram.}
  - {key: x.line_voltage_rs, label: Voltage_Line_L1 (R-S), table: holding, address: 1210, type: u16, unit: V, scale: 0.1}
  - {key: x.line_voltage_st, label: Voltage_Line_L2 (S-T), table: holding, address: 1211, type: u16, unit: V, scale: 0.1}
  - {key: x.line_voltage_tr, label: Voltage_Line_L3 (T-R), table: holding, address: 1212, type: u16, unit: V, scale: 0.1}
  - {key: power_factor, label: Power_Factor (total), table: holding, address: 1213, type: s16, unit: '', scale: 0.001, note: '+ = leading, − = lagging.'}

  # Emergency (off-grid) output (0x0504…0x0520)
  - {key: x.eps_load_power, label: ActivePower_Load_Total, table: holding, address: 1284, type: s16, unit: W, scale: 10, note: '+ = consumed by the load, − = fed back.'}
  - {key: x.eps_frequency, label: Frequency_Output, table: holding, address: 1287, type: u16, unit: Hz, scale: 0.01}
  - {key: x.eps_l1_voltage, label: Voltage_Output_R, table: holding, address: 1290, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_l1_current, label: Current_Load_R, table: holding, address: 1291, type: s16, unit: A, scale: 0.01}
  - {key: x.eps_l1_power, label: ActivePower_Load_R, table: holding, address: 1292, type: s16, unit: W, scale: 10}
  - {key: x.eps_l2_voltage, label: Voltage_Output_S, table: holding, address: 1298, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_l2_current, label: Current_Load_S, table: holding, address: 1299, type: s16, unit: A, scale: 0.01}
  - {key: x.eps_l2_power, label: ActivePower_Load_S, table: holding, address: 1300, type: s16, unit: W, scale: 10}
  - {key: x.eps_l3_voltage, label: Voltage_Output_T, table: holding, address: 1306, type: u16, unit: V, scale: 0.1}
  - {key: x.eps_l3_current, label: Current_Load_T, table: holding, address: 1307, type: s16, unit: A, scale: 0.01}
  - {key: x.eps_l3_power, label: ActivePower_Load_T, table: holding, address: 1308, type: s16, unit: W, scale: 10}

  # PV inputs (0x0584…, three registers per input; 1…16, the first four here)
  - {key: x.pv1_voltage, label: Voltage_PV1, table: holding, address: 1412, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: Current_PV1, table: holding, address: 1413, type: u16, unit: A, scale: 0.01}
  - {key: x.pv1_power, label: Power_PV1, table: holding, address: 1414, type: u16, unit: W, scale: 10}
  - {key: x.pv2_voltage, label: Voltage_PV2, table: holding, address: 1415, type: u16, unit: V, scale: 0.1}
  - {key: x.pv2_current, label: Current_PV2, table: holding, address: 1416, type: u16, unit: A, scale: 0.01}
  - {key: x.pv2_power, label: Power_PV2, table: holding, address: 1417, type: u16, unit: W, scale: 10}
  - {key: x.pv3_voltage, label: Voltage_PV3, table: holding, address: 1418, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: x.pv3_current, label: Current_PV3, table: holding, address: 1419, type: u16, unit: A, scale: 0.01, optional: true}
  - {key: x.pv3_power, label: Power_PV3, table: holding, address: 1420, type: u16, unit: W, scale: 10, optional: true}
  - {key: x.pv4_voltage, label: Voltage_PV4, table: holding, address: 1421, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: x.pv4_current, label: Current_PV4, table: holding, address: 1422, type: u16, unit: A, scale: 0.01, optional: true}
  - {key: x.pv4_power, label: Power_PV4, table: holding, address: 1423, type: u16, unit: W, scale: 10, optional: true}
