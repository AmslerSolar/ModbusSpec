  # Battery (pack 1 at 0x0604…; seven registers per pack, packs 1…8)
  - {key: battery_voltage, label: Voltage_Bat1, table: holding, address: 1540, type: u16, unit: V, scale: 0.1, optional: true}
  - {key: battery_current, label: Current_Bat1, table: holding, address: 1541, type: s16, unit: A, scale: 0.01, positive: charge, optional: true, note: 'Pack 1. + = charging, − = discharging.'}
