  - {key: apparent_power, label: Total AC apparent power, table: input, address: 23, type: s32, unit: VA, scale: 0.1}
  - {key: x.ac_power, label: Total AC active power, table: input, address: 25, type: s32, unit: W, scale: 0.1, verified: false, note: The inverter's own output. Sign not stated in the document.}
