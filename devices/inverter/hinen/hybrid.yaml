# Written from the Hinen Inverter Modbus RTU Protocol (V1.62, 2024-09-27).

modbusspec: 0
id: hinen-hybrid
manufacturer: Hinen
name: Hybrid / off-grid / on-grid inverters (RS485 protocol)
kind: inverter

sources:
- title: Hinen Inverter Modbus RTU Protocol
  version: V1.62 (2024-09-27)
  url: https://github.com/user-attachments/files/17622814/Inverter.Modbus.RTU.Protocol.V1.62.20240927.xlsx
  sha256: 1d45b17280ac342e8f38a39188f2d3ea73e4a074a8a777a1092f99c096e0f71e
- id: solarman
  title: ha-solarman (Home Assistant integration)
  url: https://github.com/davidrapan/ha-solarman
  license: MIT
  commit: ac1d88b83268beeb0511b8a1b7fc8e17deddc044
  path: custom_components/solarman/inverter_definitions/hinen_hybrid.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 850

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 5
    type: str
    length: 15
    chars: low
  checks:
  # device type
  - table: holding
    address: 2
    type: u16
    in:
    - 1001
    - 1101
    - 1201
    - 1301
    - 1401
    - 1501
    - 1601

points:
  # Holding registers: identity
  - {key: x.device_type, label: Device type, table: holding, address: 2, type: u16, enum: device_type, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 5, type: str, length: 15, chars: low, poll: slow, verified: false, note: '15 registers, one character each (registers named serial number 15 down to 1). Character placement within the register and the character order aren''t stated; one character in the low byte, first register first, is assumed.'}
  - {key: x.rated_power, label: Rated power of the inverter, table: holding, address: 20, type: u32, unit: VA, scale: 0.1, poll: slow}
  - {key: x.rated_battery_power, label: Rated power of the battery, table: holding, address: 22, type: u32, unit: W, scale: 0.1, poll: slow}
  - {key: x.clock, label: System time, table: holding, address: 25, type: datetime, length: 6, datetime: {year: {register: 0, offset: 2000}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, writable: true, poll: slow}
  - {key: firmware, label: Firmware version (certified version), table: holding, address: 33, type: str, length: 3, poll: slow}
  - {key: x.comm_firmware_name, label: Communication firmware version name, table: holding, address: 36, type: str, length: 2, poll: slow}
  - {key: x.comm_firmware_number, label: Communication firmware version number, table: holding, address: 38, type: u16, poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 39, type: u16, poll: slow}
  - {key: x.manufacturer_info, label: Manufacturer information, table: holding, address: 40, type: str, length: 8, poll: slow, note: 'The last register (47) can be set to pick the manufacturer name shown (0–4), so the text may name another brand.'}
  - {key: x.modbus_version, label: Modbus protocol version, table: holding, address: 54, type: u16, poll: slow}
  # Holding registers: settings
  - {key: x.on_off, label: Remote on / off, table: holding, address: 0, type: u16, enum: on_off, writable: true, poll: slow, note: 0xA5 restarts the inverter (not stored).}
  - {key: x.modbus_address, label: RS485 device address, table: holding, address: 3, type: u16, writable: true, poll: slow}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 4, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.backup_mode, label: Backup option, table: holding, address: 24, type: u16, enum: backup_mode, writable: true, poll: slow}
  - {key: x.active_power_limit, label: Maximum output active power, table: holding, address: 63, type: u16, unit: '%', writable: true, min: 0, max: 100, poll: slow, note: Default 100.}
  - {key: x.reactive_power_limit, label: Maximum output reactive power, table: holding, address: 64, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.pv_power_limit, label: Maximum PV output power, table: holding, address: 68, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.meter_ct_mode, label: Meter / CT mode, table: holding, address: 73, type: u16, enum: ct_mode, writable: true, poll: slow}
  - {key: x.export_limit_enable, label: Anti-reverse current (export limit) enable, table: holding, address: 74, type: u16, enum: export_limit_enable, writable: true, poll: slow}
  - {key: x.export_limit, label: Export power limit, table: holding, address: 75, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Percentage of rated power; 0.1 % steps since protocol V1.32 (1 % before).}
  - {key: x.export_limit_failed, label: Export limit failure flag, table: holding, address: 76, type: u16, enum: normal_fail, poll: slow}
  - {key: x.install_mode, label: Installation mode, table: holding, address: 79, type: u16, enum: install_mode, writable: true, poll: slow}
  - {key: x.battery_protocol, label: Battery protocol, table: holding, address: 82, type: u16, enum: battery_protocol, writable: true, poll: slow}
  - {key: x.eps_nominal_voltage, label: Rated off-grid voltage, table: holding, address: 88, type: u16, enum: eps_voltage, writable: true, poll: slow}
  - {key: x.eps_nominal_frequency, label: Rated off-grid frequency, table: holding, address: 89, type: u16, enum: eps_frequency, writable: true, poll: slow}
  - {key: x.eps_enable, label: Off-grid function enable, table: holding, address: 90, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.battery_type_setting, label: Battery type, table: holding, address: 125, type: u16, enum: battery_type_setting, writable: true, poll: slow}
  - {key: x.offgrid_discharge_stop_soc, label: Off-grid discharge cutoff SOC, table: holding, address: 135, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.charge_stop_soc, label: Charge cutoff SOC (battery priority), table: holding, address: 138, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.grid_first_stop_soc, label: Discharge cutoff SOC (grid priority), table: holding, address: 139, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.load_first_stop_soc, label: Discharge cutoff SOC (load priority), table: holding, address: 140, type: u16, unit: '%', writable: true, poll: slow}
  - {key: x.remote_power_enable, label: Charge / discharge quick setting enable, table: holding, address: 141, type: u16, writable: true, poll: slow}
  - {key: x.remote_power_time, label: Charge / discharge quick setting duration, table: holding, address: 142, type: u16, unit: s, writable: true, poll: slow}
  - {key: x.remote_power_rate, label: Charge / discharge quick setting power, table: holding, address: 143, type: s16, unit: '%', writable: true, min: -100, max: 100, poll: slow, note: 'Percent of rated power; positive = charge, negative = discharge. Listed as uint16; read as signed because of the negative range.'}
  - {key: x.ac_charge_enable, label: AC charge enable, table: holding, address: 144, type: u16, enum: disable_enable, writable: true, poll: slow}
  # Input registers: system
  - {key: state, label: Inverter status, table: input, address: 0, type: u16, enum: status}
  - {key: pv_power, label: Total PV input power, table: input, address: 1, type: u32, unit: W, scale: 0.1}
  - {key: x.pv1_voltage, label: PV1 voltage, table: input, address: 3, type: u16, unit: V, scale: 0.1}
  - {key: x.pv1_current, label: PV1 current, table: input, address: 4, type: u16, unit: A, scale: 0.1}
