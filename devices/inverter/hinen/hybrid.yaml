  - {key: battery_power, label: Battery power (discharge − charge), unit: W, positive: discharge, sum: [{key: x.battery_discharge_power}, {key: x.battery_charge_power, factor: -1}]}

enums:
  status: {'0': Standby, '1': Grid-connected, '2': Off-grid, '3': Fault, '4': Update, '5': Charging, '6': Discharging, '7': Bypass}
  device_type: {'1001': Single-phase hybrid all-in-one, '1101': Three-phase hybrid all-in-one, '1201': Single-phase off-grid inverter, '1301': Three-phase off-grid inverter, '1401': Commercial and industrial ESS, '1501': Single-phase on-grid inverter, '1601': Three-phase on-grid inverter}
  on_off: {'0': 'Off', '1': 'On', '165': Restart}
  baud_rate: {'0': '9600', '1': '38400', '2': '115200', '3': '19200', '4': '56000', '5': '256000'}
  backup_mode: {'0': UPS, '1': EPS}
  ct_mode: {'0': Meter, '1': CT, '2': CT not used}
  export_limit_enable: {'0': Disabled, '1': Enabled, '3': Enabled per phase}
  normal_fail: {'0': Normal, '1': Failed}
  install_mode: {'0': DC coupled, '1': AC coupled, '2': Hybrid}
  battery_protocol: {'0': Pylon, '1': Hinen, '2': Growatt, '3': Growcol, '4': Shoto, '5': GoodWe, '6': Yuzei}
  eps_voltage: {'0': 230 V, '1': 240 V, '2': 220 V, '3': 208 V, '4': 200 V}
  eps_frequency: {'0': 50 Hz, '1': 60 Hz}
  disable_enable: {'0': Disabled, '1': Enabled}
  battery_type_setting: {'0': Lead-acid, '1': Lithium, '2': Other}
  battery_type: {'0': Lead-acid, '1': Lithium}
  priority: {'0': Load priority, '1': Battery priority, '2': Grid priority}

flags:
  heat_pump_status: {'0': Heat pump 1 on, '1': Heat pump 2 on, '2': Heat pump 3 on}

problems:
  - {when: {key: state, equals: 3}, kind: fault, text: Inverter fault (state 3)}
  - {when: {key: state, equals: 2}, kind: backup_mode, text: Off-grid operation}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Inverter fault code {value} (sub-code in register 148)'}
  - {when: {key: x.bms_error1, not: 0}, kind: fault, text: 'Battery error (master battery, 0x{value:X})'}
  - {when: {key: x.bms_warning1, not: 0}, kind: warning, text: 'Battery warning (master battery, 0x{value:X})'}

notes:
- Register numbers in the document are the protocol addresses (0-based) and are used as they are.
- 32-bit values are two registers, high word first.
- The document's 0.01 unit for percentages means 1 raw = 1 % (settings range 0–100 with default 100); percentages are therefore
  read unscaled.
- 'RS485: 9600 baud default (settable in holding 4), 8 data bits, no parity, 1 stop bit; at least 850 ms between requests;
  at most 125 registers per read.'
- 'Left out: grid code and protection settings (holding 83–123, 250–322), the 20 charge / discharge time periods (holding
  147–207, 327–346), off-grid inverter settings (210–239), lead-acid battery limits, auto-test, debug and per-slave battery
  registers, PV per-input daily energies, the year and month energy counters (input 350–373), and the ''extra'', ''system''
  and ''self'' energy counters (input 288–299).'
- Holding 5–19 (serial) and 40–47 (manufacturer) are ASCII registers; how the characters sit in the registers isn't stated.
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
