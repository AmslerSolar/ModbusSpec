  - {key: x.pv2_power, label: PV2 power, table: input, address: 11, type: u32, unit: W, scale: 0.1, conflicts: [{sources: [solarman], scale: 1, label: PV2 Power}]}
  - {key: x.pv3_voltage, label: PV3 voltage, table: input, address: 13, type: u16, unit: V, scale: 0.1}
