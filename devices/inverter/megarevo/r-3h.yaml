notes:
- Addresses are the document's hexadecimal register IDs, used as 0-based protocol addresses. All registers are read with function
  03; settings are written with function 06.
- 'The document''s "Byte" column counts bytes: 2 = one register, 4 = two registers. 32-bit values are stored low word first
  ("CD AB").'
- Serial settings are from the document (address 1, 9600 8N1; register 0x3468 can switch to 19200). Modbus TCP port 502 is
  not stated in the document; assumed for gateways.
- Single-phase models report grid and load values on phase B (the L2 registers); split-phase models on phases A and B.
- The document itself does not name its maker (its manufacturer-name register is blank); it is listed as a Megarevo document.
- 'Left out: monthly and yearly energy counters (0x3159–0x3163, 0x3171–0x317B), the parallel-operation block (0x31C0 ff.),
  debug and test words (0x31B0 ff.), grid-code protection settings (0x2200 ff., 0x3407–0x340A, 0x3600 ff.), time-of-use schedule
  and clock (0x3500 ff.), generator, parallel and RS485-battery settings.'
- The sheet "English" holds a separate PLC mapping (40001 ff., raw values scaled 0–27648) for a PCS; it is not part of this
  register map and is left out.
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
