# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.115–3.117 (Liebert EXS and Liebert ITA2).

modbusspec: 0
id: vertiv-exs-ita2
manufacturer: Vertiv
name: Liebert EXS / ITA2 UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 0, type: bool}
  - {key: x.bypass_voltage_fault, label: Bypass Input Voltage Fault, table: discrete, address: 1, type: bool}
  - {key: x.bypass_backfeed, label: Bypass Backfeed Detected, table: discrete, address: 2, type: bool}
  - {key: x.bypass_abnormal_eco, label: Bypass Abnormal In ECO Mode, table: discrete, address: 3, type: bool}
  - {key: x.bypass_overcurrent_shutdown, label: Shutdown Due To Bypass Overcurrent Timeout, table: discrete, address: 4, type: bool}
  - {key: x.bypass_backfeed_shutdown, label: Shutdown Due To Bypass Backfeed Fault, table: discrete, address: 5, type: bool}
  - {key: x.eco_bypass_mode, label: ECO Bypass Mode, table: discrete, address: 6, type: bool}
  - {key: x.parallel_bypass_cable_abnormal, label: Parallel Bypass Cable Connection Abnormal, table: discrete, address: 7, type: bool}
  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 11, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 12, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 13, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 14, type: bool}
  - {key: x.battery_not_qualified, label: Battery Not Qualified, table: discrete, address: 15, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 16, type: bool}
  - {key: x.battery_deep_discharge, label: Battery Deep Discharge, table: discrete, address: 17, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature, table: discrete, address: 18, type: bool}
  - {key: x.battery_ground_fault, label: Battery Ground Fault, table: discrete, address: 19, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 25, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 26, type: bool}
  - {key: x.output_fault, label: System Output Fault, table: discrete, address: 27, type: bool}
  - {key: x.output_short_shutdown, label: System Shutdown - Output Short, table: discrete, address: 28, type: bool}
  - {key: x.output_inhibit_external, label: System output Inhibit - Ext, table: discrete, address: 29, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 37, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 38, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 39, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 40, type: bool}
  - {key: x.input_frequency_deviation, label: Input Frequency Deviation, table: discrete, address: 41, type: bool}
  - {key: x.shutdown_pending, label: Shutdown Pending, table: discrete, address: 42, type: bool}
  - {key: x.general_event, label: Unspecified General Event, table: discrete, address: 43, type: bool}
  - {key: x.parallel_comm_warning, label: Parallel Comm Warning, table: discrete, address: 44, type: bool}
  - {key: x.loss_of_redundancy, label: Loss of Redundancy, table: discrete, address: 45, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 46, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 47, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 48, type: bool}
  - {key: x.maintenance_bypass_closed, label: Maintenance Bypass Breaker Closed, table: discrete, address: 49, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 50, type: bool}
  - {key: x.epo_latched, label: Emergency Power Off - Latched, table: discrete, address: 51, type: bool}
  - {key: x.input_wiring_fault, label: Input Wiring Fault, table: discrete, address: 52, type: bool}
  - {key: x.dc_dc_fault, label: DC to DC Converter Fault, table: discrete, address: 53, type: bool}
  - {key: x.dc_bus_abnormal, label: DC Bus Abnormal, table: discrete, address: 54, type: bool}
  - {key: x.load_sharing_fault, label: Load Sharing Fault, table: discrete, address: 55, type: bool}
  - {key: x.inverter_relay_fault, label: Inverter Relay Fault, table: discrete, address: 56, type: bool}
  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 57, type: bool}
  - {key: x.input_current_limit, label: System Input Current Limit, table: discrete, address: 58, type: bool}
  - {key: x.fan_replacement_required, label: Fan Replacement Required, table: discrete, address: 59, type: bool}
  - {key: x.load_off_shutdown_on_battery, label: Load Off Due To Shutdown On Battery, table: discrete, address: 60, type: bool}
  - {key: x.redundant_overload, label: System Redundant Overload, table: discrete, address: 61, type: bool}
  - {key: x.dsp_fault, label: DSP Fault Condition, table: discrete, address: 62, type: bool}
  - {key: x.intelligent_sleep, label: On Intelligent Sleep Mode, table: discrete, address: 63, type: bool}
  - {key: x.module_over_temperature_shutdown, label: Power Module Shutdown - Over Temperature, table: discrete, address: 65, type: bool}
  - {key: x.input_current_imbalance, label: System Input Current Imbalance, table: discrete, address: 66, type: bool}
  - {key: x.on_inverter, label: UPS Output on Inverter, table: discrete, address: 68, type: bool}
  - {key: x.auxiliary_power_fault, label: Auxiliary power fault, table: discrete, address: 69, type: bool}
  - {key: x.battery_cabinet_connection_abnormal, label: Battery cabinet connection abnormal, table: discrete, address: 70, type: bool}
  - {key: x.general_fault, label: General Fault, table: discrete, address: 71, type: bool}
  - {key: x.parallel_cable_failure, label: Parallel Cable Failure, table: discrete, address: 72, type: bool}
  - {key: x.bypass_disabled, label: Bypass disabled, table: discrete, address: 73, type: bool}
  - {key: x.remote_shutdown, label: System Shutdown - Remote Shutdown, table: discrete, address: 77, type: bool}
  - {key: x.output_off_bypass_abnormal, label: Output off due to abnormal bypass, table: discrete, address: 80, type: bool}
  - {key: x.local_output_disconnected, label: Local output is disconnected, table: discrete, address: 81, type: bool}
  - {key: x.output_off_voltage_not_zero, label: Output off voltage is not zero, table: discrete, address: 82, type: bool}
  - {key: x.lbs_cable_failure, label: LBS Cable Failure, table: discrete, address: 83, type: bool}
  - {key: x.low_battery_shutdown, label: System Shutdown - Low Battery, table: discrete, address: 84, type: bool}
  - {key: x.parallel_output_frequency_abnormal, label: Parallel output frequency abnormal, table: discrete, address: 85, type: bool}
  - {key: x.output_breaker_open, label: Output Breaker Open, table: discrete, address: 86, type: bool}
  - {key: x.service_mode, label: UPS is in Service Mode, table: discrete, address: 87, type: bool}
  - {key: x.input_backfeed, label: Input Source Backfeed, table: discrete, address: 100, type: bool}
  - {key: x.input_backfeed_shutdown, label: Shutdown Due To System Input Backfeed Fault, table: discrete, address: 101, type: bool}
  - {key: x.input_neutral_ground_abnormal, label: Input Neutral Ground Abnormall, table: discrete, address: 102, type: bool}
  - {key: x.li_cabinet_serial_illegal, label: Battery Cabinet Serial Number Illegal Error, table: discrete, address: 461, type: bool, optional: true}
  - {key: x.li_cabinet_online_number_error, label: Lithium Battery Cabinet Online Number Error, table: discrete, address: 462, type: bool, optional: true}
  - {key: x.li_cabinet_comm_failure, label: Lithium Battery Cabinet Communication Failure, table: discrete, address: 463, type: bool, optional: true}
  - {key: x.li_cabinet_mismatch, label: Lithium Battery Cabinet mismatch the unit., table: discrete, address: 464, type: bool, optional: true}
  - {key: x.li_cabinet_address_error, label: Lithium Battery Cabinet Address Set Error, table: discrete, address: 465, type: bool, optional: true}
  - {key: x.li_cabinet_count_over_limit, label: Number of Lithium Battery Cabinets Over Limit, table: discrete, address: 466, type: bool, optional: true}
  - {key: x.li_cable_connection_issue, label: Lithium Battery Cable Connection Issue, table: discrete, address: 469, type: bool, optional: true}
  - {key: x.li_dischargeable_count_low, label: Dischargeable Battery Count Less Than Configured Number, table: discrete, address: 470, type: bool, optional: true}
  - {key: x.ambient_temperature_low, label: Ambient temperature lower than recommended, table: discrete, address: 471, type: bool}
  - {key: x.ambient_temperature_high, label: Ambient temperature higher than recommended, table: discrete, address: 472, type: bool}
  - {key: x.ambient_temperature_low_prealarm, label: Ambient temperature low pre-alarm, table: discrete, address: 473, type: bool}
  - {key: x.ambient_temperature_high_prealarm, label: Ambient temperature high pre-alarm, table: discrete, address: 474, type: bool}
  # Protocol
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS L1-N, table: input, address: 395, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l2, label: System Input RMS L2-N, table: input, address: 396, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l3, label: System Input RMS L3-N, table: input, address: 397, type: u16, unit: V, scale: 0.1}
  - {key: x.input_current_l1, label: System Input RMS Current L1, table: input, address: 401, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l2, label: System Input RMS Current L2, table: input, address: 402, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l3, label: System Input RMS Current L3, table: input, address: 403, type: u16, unit: A, scale: 0.1}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 404, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_power_factor_l1, label: System Input Power Factor L1, table: input, address: 405, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l2, label: System Input Power Factor L2, table: input, address: 406, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l3, label: System Input Power Factor L3, table: input, address: 407, type: u16, scale: 0.01}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 414, type: u16, unit: V, poll: slow}
  - {key: x.input_phase_count, label: System Input Phase Count, table: input, address: 417, type: u16, poll: slow}
  - {key: x.input_energy, label: Input Energy, table: input, address: 418, type: u32, unit: kWh, scale: 0.1, poll: slow}
  - {key: x.input_power_l1, label: System Input Power Phase A, table: input, address: 420, type: u16, unit: W, scale: 100, note: The document gives kW with scale 10.}
  - {key: x.input_power_l2, label: System Input Power Phase B, table: input, address: 421, type: u16, unit: W, scale: 100}
  - {key: x.input_power_l3, label: System Input Power Phase C, table: input, address: 422, type: u16, unit: W, scale: 100}
  - {key: x.dc_bus_voltage_positive, label: Positive DC Bus Voltage, table: input, address: 423, type: s16, unit: V}
  - {key: x.dc_bus_voltage_negative, label: Negative DC Bus Voltage, table: input, address: 424, type: s16, unit: V}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS L1-N, table: input, address: 430, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage RMS L2-N, table: input, address: 431, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage RMS L3-N, table: input, address: 432, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 436, type: u16, unit: Hz, scale: 0.1, note: The document prints VAC as the unit; Hz by the glossary.}
  # Battery
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 448, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery Charge Status, table: input, address: 449, type: u16, enum: charge_status}
  - {key: x.battery_test_result, label: Battery Test Result, table: input, address: 452, type: u16, enum: test_result, poll: slow}
  - {key: x.battery_cabinet_type, label: Battery Cabinet Type, table: input, address: 453, type: u16, enum: cabinet_type, poll: slow}
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 454, type: u16, unit: min}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 455, type: u16, unit: '%'}
  - {key: battery_current, label: Battery Current, table: input, address: 456, type: s16, unit: A, scale: 0.1, positive: charge}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 457, type: u16, unit: V, note: DC bus voltage at the battery input.}
  - {key: x.dc_bus_nominal_voltage, label: DC Bus Nominal Voltage, table: input, address: 458, type: u16, unit: V, poll: slow}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 459, type: s16, unit: °C, scale: 0.1, note: The register after it holds the same in °F.}
  - {key: x.battery_rating, label: Battery Rating, table: input, address: 461, type: u16, unit: Ah, poll: slow}
  - {key: x.ebc_count, label: Number of EBC Installed, table: input, address: 463, type: u16, poll: slow, note: External battery cabinets.}
  - {key: x.battery_discharge_time, label: Battery Discharge Time, table: input, address: 465, type: u16, unit: min}
  - {key: x.battery_total_discharge_time, label: Battery Total Discharge Time, table: input, address: 466, type: u16, unit: h, scale: 0.1, poll: slow}
  - {key: x.battery_discharge_count, label: Total Number of Battery Discharges, table: input, address: 467, type: u16, poll: slow}
  - {key: x.battery_type, label: Battery type, table: input, address: 469, type: u16, enum: battery_type, poll: slow}
  - {key: battery_soh, label: Battery State of Health, table: input, address: 474, type: s16, unit: '%', poll: slow}
  - {key: x.max_cell_voltage, label: Maximum Cell Voltage, table: input, address: 801, type: u16, unit: V, scale: 0.001, optional: true, note: Lithium battery systems only.}
  - {key: x.min_cell_voltage, label: Minimum Cell Voltage, table: input, address: 802, type: u16, unit: V, scale: 0.001, optional: true}
  # Output
  - {key: l1_voltage, label: System Output Voltage RMS L1-N, table: input, address: 479, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: System Output Voltage RMS L2-N, table: input, address: 480, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: System Output Voltage RMS L3-N, table: input, address: 481, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current L1, table: input, address: 485, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: System Output RMS Current L2, table: input, address: 486, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: System Output RMS Current L3, table: input, address: 487, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 488, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power, label: System Output Power, table: input, address: 489, type: u16, unit: W}
  - {key: x.output_power_l1, label: System Output Power L1, table: input, address: 490, type: u16, unit: W}
  - {key: x.output_power_l2, label: System Output Power L2, table: input, address: 491, type: u16, unit: W}
  - {key: x.output_power_l3, label: System Output Power L3, table: input, address: 492, type: u16, unit: W}
  - {key: x.output_load, label: System Output Pct Power, table: input, address: 493, type: u16, unit: '%'}
  - {key: x.output_load_l1, label: System Output Pct Power L1, table: input, address: 494, type: u16, unit: '%'}
  - {key: x.output_load_l2, label: System Output Pct Power L2, table: input, address: 495, type: u16, unit: '%'}
  - {key: x.output_load_l3, label: System Output Pct Power L3, table: input, address: 496, type: u16, unit: '%'}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 497, type: u16, unit: VA}
  - {key: x.output_apparent_power_l1, label: System Output Apparent Power L1, table: input, address: 498, type: u16, unit: VA}
  - {key: x.output_apparent_power_l2, label: System Output Apparent Power L2, table: input, address: 499, type: u16, unit: VA}
  - {key: x.output_apparent_power_l3, label: System Output Apparent Power L3, table: input, address: 500, type: u16, unit: VA}
  - {key: power_factor, label: System Output Power Factor L1, table: input, address: 504, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l2, label: System Output Power Factor L2, table: input, address: 505, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l3, label: System Output Power Factor L3, table: input, address: 506, type: u16, scale: 0.01}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 507, type: u16, unit: V, poll: slow}
  - {key: x.output_energy, label: Output Energy, table: input, address: 508, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Writable at 40509 (resets the counter).}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 510, type: u16, unit: VA, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 511, type: u16, unit: Hz, poll: slow}
  - {key: state, label: UPS Output Source, table: input, address: 520, type: u16, enum: output_source}
  - {key: x.eco_mode, label: ECO Mode Status, table: input, address: 543, type: u16, enum: off_on}
  # System
  - {key: x.system_status, label: System Status, table: input, address: 555, type: u16, enum: system_status}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 556, type: u16, poll: slow}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 557, type: u16, poll: slow}
  - {key: x.inverter_state, label: Inverter On/Off State, table: input, address: 560, type: u16, enum: off_on}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 561, type: s16, unit: °C, note: The register after it holds the same in °F.}
  - {key: x.shutdown_reason, label: Shutdown Reason, table: input, address: 563, type: u16, enum: shutdown_reason}
  - {key: x.topology, label: UPS Topology, table: input, address: 564, type: u16, enum: topology, poll: slow}
  - {key: x.operating_time, label: Total System Operating Time, table: input, address: 568, type: u32, unit: h, poll: slow}
  - {key: x.system_capacity, label: System Capacity, table: input, address: 570, type: u16, unit: VA, scale: 1000, poll: slow, note: Capacity supported by the installed power modules.}
  # Settings (read as input registers, written to the holding register at the same address)
  - {key: x.automatic_battery_test, label: Automatic Battery Test, table: input, address: 450, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_battery_test_interval, label: Auto Battery Test Interval, table: input, address: 451, type: u16, enum: test_interval, poll: slow, writable: true}
  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 462, type: u16, unit: min, poll: slow, writable: true}
  - {key: x.eco_mode_setting, label: ECO Mode Operation State, table: input, address: 544, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart, label: Auto Restart, table: input, address: 558, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart_delay, label: Auto Restart Delay, table: input, address: 559, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.audible_alarm, label: Audible Alarm Control, table: input, address: 565, type: u16, enum: off_on, poll: slow, writable: true}

enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_result: {'0': Unknown, '1': Passed, '2': Failed, '3': In progress, '4': System failure, '5': Inhibited}
  cabinet_type: {'0': Internal, '1': External, '2': LRT}
  battery_type: {'0': VRLA, '1': Lithium}
  test_interval: {'0': 8 weeks, '1': 12 weeks, '2': 16 weeks, '3': 20 weeks, '4': 26 weeks}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  shutdown_reason: {'0': None, '1': Over temperature, '2': Overload, '3': DC bus overload, '4': Output short, '5': Line swap, '6': Low battery, '7': Remote command, '8': Input under voltage, '9': Power factor correction fail, '10': External signal command}
  topology: {'0': Unknown, '1': Offline, '2': Line interactive, '3': Online}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: state, equals: 5}, kind: backup_mode, text: Output on battery}
  - {when: {key: x.input_power_problem, equals: 1}, kind: mains_lost, text: Input power problem}
  - {when: {key: x.system_status, equals: 32}, kind: fault, text: Abnormal operation}
  - {when: {key: x.bypass_not_available, equals: 1}, kind: warning, text: Bypass not available}
  - {when: {key: x.bypass_voltage_fault, equals: 1}, kind: warning, text: Bypass voltage fault}
  - {when: {key: x.bypass_backfeed, equals: 1}, kind: fault, text: Bypass backfeed detected}
  - {when: {key: x.bypass_overcurrent_shutdown, equals: 1}, kind: fault, text: Shutdown by bypass overcurrent}
  - {when: {key: x.bypass_backfeed_shutdown, equals: 1}, kind: fault, text: Shutdown by bypass backfeed}
