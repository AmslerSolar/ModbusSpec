notes:
- One register map covers both the Liebert EXS and the Liebert ITA2.
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU120 network card in the UPS, over Modbus TCP or RTU
  (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1). Input powers per phase are given in
  kW with scale 10; here converted to W (× 100).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current: + = charging, − = discharging (stated in the glossary).'
- The document prints the units of Battery Run Time (30471, %), Relative Humidity (30472, seconds since epoch) and Battery
  Commission Date (30473, 2 registers, %) in a way that cannot be right; they are left out until checked on a unit.
- 'Left out: line-to-line input, bypass and output voltages, min/max input voltages, nominal input current and frequency,
  bypass nominal voltage, nominal battery capacity, output current crest factors, output delays (40513–40515), nominal power
  factor, parallel-system values (30517–30520), outlet group control, the second Output Off bit (10068), the event-only bits
  (10065, 10075–10077, 10079 and 10080), the per-cabinet lithium battery groups (16 × alarms at 10142 ff. and SOC/SOH/status
  at 30580 ff.), lithium cabinet check and wake-up event bits, the °F duplicates of the temperatures and the write-only commands
  (battery test 40469, reset statistics, silence alarm, lithium battery wake-up).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
