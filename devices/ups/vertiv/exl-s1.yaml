enums:
  module_type: {'0': Single module system, '1': Module (1 + 1), '2': Module (1 + N), '3': Module (N + 1), '4': System control cabinet, '5': Main static switch}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  sync_source: {'0': External, '1': Self clock (internal)}
  operating_mode: {'0': Idle, '1': Double conversion (VFI), '2': Interactive (VI), '3': Stand-by (VFD), '4': CR mode, '5': ECO mode (DIM)}
  bypass_qualification: {'0': Fail, '1': Marginal low, '2': Normal, '3': Marginal high}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  bypass_status: {'0': Not present, '1': 'On', '2': 'Off', '3': Fault, '4': Not ready}
  inverter_status: {'0': 'Off', '1': Turning on, '2': 'On', '3': Stopped by fault, '4': Stand-by, '5': Ready and in sync, '6': Not ready}
  charger_status: {'0': Standby, '1': 'On', '2': Switched off, '3': Forced on, '4': Stopped by fault}
  rectifier_status: {'0': 'Off', '1': Turning on, '2': 'On', '3': Fault}
  breaker: {'0': Open, '1': Closed, '2': Not installed}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

