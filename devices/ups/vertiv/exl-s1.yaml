  - {key: x.bypass_breaker_closed, label: Bypass Breaker Closed, table: discrete, address: 13, type: bool}
  - {key: x.bypass_breaker_sbb_open, label: Bypass Breaker (SBB) Open, table: discrete, address: 14, type: bool}
