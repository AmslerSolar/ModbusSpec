- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) network card in the UPS, over Modbus TCP or RTU (RS485, 9600,
  19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current: + = charging, − = discharging (stated in the glossary).'
- The document also lists, next to most values, the matching register of the older Chloride map (holding registers 40002–40148,
  with alarms packed as bits in 40087–40097 and partly other scales or units, e.g. battery time in seconds). That is a separate
  addressing scheme; the document doesn't say how it is selected or whether the card serves both at once, so only the IntelliSlot
  map is described here.
- Battery voltage, DC bus voltage and DC bus current have no scale in the IntelliSlot map (whole volts and amperes), while
  the Chloride map gives them with scale 10.
- Discrete input 10054 is not used (the list goes from 10053 to 10055).
- There are no writable settings apart from the system clock.
- 'Left out: the UPS manufacturer code (shared by several Vertiv maps), battery circuit breakers 1–8 (10006–10013), the line-to-line
  bypass voltages, bypass power factors and powers, the °F duplicates, the rectifier, booster-charger and inverter module
  temperatures (up to 4 rectifier, 8 booster-charger and 4 inverter modules, three phase sensors each), circular redundancy
  status, the grid services values (30782–30793) and the static switch, inverter/rectifier and booster fan speeds (30804–30866).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
