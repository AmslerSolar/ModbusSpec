modbusspec: 0
id: vertiv-exl-s1
manufacturer: Vertiv
name: Liebert EXL S1 UPS (IntelliSlot card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Switch gear (discrete inputs 10001 ff.; 1 = active)
  - {key: x.backfeed_breaker_open, label: Backfeed Breaker Open, table: discrete, address: 0, type: bool}
