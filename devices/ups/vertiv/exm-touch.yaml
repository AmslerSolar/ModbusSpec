  - {key: x.output_power_l3, label: System Output Power Phase C, table: input, address: 596, type: u16, unit: W, scale: 1000}
  - {key: x.output_apparent_power_l1, label: System Output Apparent Power Phs A, table: input, address: 597, type: u16, unit: VA, scale: 1000}
