  - {key: x.module1_over_temperature, label: Power Module 1 Over Temperature, table: discrete, address: 103, type: bool}
  - {key: x.module1_lever_unlocked, label: Power Module 1 Lever Unlocked, table: discrete, address: 104, type: bool}
  # System
