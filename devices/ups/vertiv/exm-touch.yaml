  - {key: x.output_power_factor_l2, label: System Output Power Factor Phs B, table: input, address: 584, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l3, label: System Output Power Factor Phs C, table: input, address: 585, type: u16, scale: 0.01}
  - {key: x.output_load_l1, label: System Output Pct Power Phase A, table: input, address: 586, type: u16, unit: '%'}
  - {key: x.output_load_l2, label: System Output Pct Power Phase B, table: input, address: 587, type: u16, unit: '%'}
