  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 577, type: bool}
  - {key: x.mms_overload, label: MMS Overload, table: discrete, address: 578, type: bool}
  - {key: x.parallel_comm_warning, label: Parallel Comm Warning, table: discrete, address: 579, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 580, type: bool}
  - {key: x.lbs_inhibited, label: LBS Inhibited, table: discrete, address: 581, type: bool}
  - {key: x.on_generator, label: On Generator, table: discrete, address: 582, type: bool}
  - {key: x.lbs_active, label: LBS Active, table: discrete, address: 583, type: bool}
  - {key: x.epo_shutdown, label: System Shutdown - EPO, table: discrete, address: 584, type: bool}
  - {key: x.top_fan_fault, label: Top Outlet Fan Fault, table: discrete, address: 585, type: bool}
  - {key: x.hardware_mismatch, label: Hardware Mismatch, table: discrete, address: 586, type: bool}
  - {key: x.mms_capacity_exceeded, label: MMS Capacity Exceeded, table: discrete, address: 587, type: bool}
  # Input
  - {key: x.input_current_l1, label: System Input RMS Current Phase A, table: input, address: 387, type: u16, unit: A}
  - {key: x.input_current_l2, label: System Input RMS Current Phase B, table: input, address: 388, type: u16, unit: A}
  - {key: x.input_current_l3, label: System Input RMS Current Phase C, table: input, address: 389, type: u16, unit: A}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 390, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_voltage_l1, label: System Input RMS A-N, table: input, address: 391, type: u16, unit: V}
  - {key: x.input_voltage_l2, label: System Input RMS B-N, table: input, address: 392, type: u16, unit: V}
  - {key: x.input_voltage_l3, label: System Input RMS C-N, table: input, address: 393, type: u16, unit: V}
