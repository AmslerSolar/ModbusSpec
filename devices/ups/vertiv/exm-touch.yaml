  - {key: x.li_ion_system_abnormal, label: Lithium-Ion Battery System Abnormal, table: discrete, address: 61, type: bool}
  - {key: x.li_ion_disconnect_request, label: Lithium-Ion Battery System Disconnect Request, table: discrete, address: 62, type: bool}
  # Inverter and output
  - {key: x.loss_of_sync, label: Loss of Synchronization, table: discrete, address: 67, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 78, type: bool}
  - {key: x.output_fault, label: System Output Fault, table: discrete, address: 79, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 80, type: bool}
  # Power module 1 (modules 2–20 follow every 24 addresses)
  - {key: x.module1_input_current_abnormal, label: Power Module 1 Input Current Abnormal, table: discrete, address: 90, type: bool}
  - {key: x.module1_rectifier_failure, label: Power Module 1 Rectifier Failure, table: discrete, address: 91, type: bool}
  - {key: x.module1_inverter_failure, label: Power Module 1 Inverter Failure, table: discrete, address: 92, type: bool}
  - {key: x.module1_dc_bus_abnormal, label: Power Module 1 DC Bus Abnormal, table: discrete, address: 93, type: bool}
  - {key: x.module1_load_sharing_fault, label: Power Module 1 Load Sharing Fault, table: discrete, address: 94, type: bool}
  - {key: x.module1_inverter_relay_fault, label: Power Module 1 Inverter Relay Fault, table: discrete, address: 95, type: bool}
  - {key: x.module1_battery_charging_error, label: Power Module 1 Battery Charging Error, table: discrete, address: 96, type: bool}
  - {key: x.module1_battery_converter_failure, label: Power Module 1 Battery Converter Failure, table: discrete, address: 97, type: bool}
