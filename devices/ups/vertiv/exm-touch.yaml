  - {key: x.input_power_factor_l2, label: System Input Power Factor Phs B, table: input, address: 395, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l3, label: System Input Power Factor Phs C, table: input, address: 396, type: u16, scale: 0.01}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 397, type: u16, unit: V, poll: slow}
  - {key: x.input_nominal_frequency, label: System Input Nominal Frequency, table: input, address: 398, type: u16, unit: Hz, scale: 0.1, poll: slow}
  - {key: x.input_nominal_current, label: System Input Nominal Current, table: input, address: 399, type: u16, unit: A, poll: slow}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 400, type: u16, poll: slow}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 401, type: u16, poll: slow}
