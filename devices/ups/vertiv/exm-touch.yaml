  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 439, type: u16, unit: min, poll: slow}
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 440, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery charge status, table: input, address: 441, type: u16, enum: charge_status}
  - {key: x.auto_battery_test, label: Automatic Battery Test, table: input, address: 442, type: u16, enum: disabled_enabled, poll: slow}
  - {key: x.battery_test_cycle, label: Battery Self Test Cycle Time, table: input, address: 443, type: u16, unit: d, poll: slow}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 444, type: u16, unit: V, note: DC bus voltage at the battery input.}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 445, type: s16, unit: °C, note: The register after it holds the same in °F.}
