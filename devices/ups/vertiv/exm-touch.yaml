  - {key: x.system_time, label: System Date and Time, table: input, address: 9997, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow, note: UTC; writable at 49998.}

enums:
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  breaker: {'0': Open, '1': Closed, '2': Not installed}
  module_status: {'0': Normal, '1': Warning, '2': Alarm, '4': Fault}
  sleep_status: {'0': Sleeping, '1': Not sleeping}
  inactive_active: {'0': Inactive, '1': Active}
  redundancy: {'0': No redundancy, '1': Redundancy}
  ups_application_mode: {'0': UPS mode, '1': Frequency converter mode}
  application_mode: {'0': UPS mode, '1': Frequency converter mode, '2': Intelligent paralleling mode, '3': Intelligent paralleling mode demo, '4': ECO mode, '5': Intelligent ECO mode, '6': Intelligent ECO mode demo, '7': Testing mode, '8': Regen mode, '9': Power conditioner mode}
  offline_online: {'0': Offline, '1': Online}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: state, equals: 5}, kind: backup_mode, text: Output on battery}
  - {when: {key: x.input_power_problem, equals: 1}, kind: mains_lost, text: Input power problem}
  - {when: {key: x.system_status, equals: 32}, kind: fault, text: Abnormal operation}
  - {when: {key: x.input_neutral_lost, equals: 1}, kind: warning, text: Input neutral lost}
  - {when: {key: x.input_phase_rotation_error, equals: 1}, kind: warning, text: Input phase rotation error}
  - {when: {key: x.input_backfeed, equals: 1}, kind: fault, text: Battery backfeeding the input}
  - {when: {key: x.bypass_not_available, equals: 1}, kind: warning, text: Bypass not available}
