# tables 3.97–3.99 (Liebert EXM, controller with touchscreen HMI).

modbusspec: 0
id: vertiv-exm-touch
manufacturer: Vertiv
name: Liebert EXM UPS with touchscreen HMI controller (IntelliSlot card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  # Input
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 0, type: bool}
  - {key: x.input_phase_rotation_error, label: System Input Phs Rotation Error, table: discrete, address: 1, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 2, type: bool}
  - {key: x.input_backfeed, label: Input Source Backfeed, table: discrete, address: 3, type: bool}
  # Bypass
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 14, type: bool}
  - {key: x.static_switch_unavailable, label: Bypass Static Switch Unavailable, table: discrete, address: 15, type: bool}
  - {key: x.bypass_excess_retransfers, label: Bypass - Excess Auto Retransfers, table: discrete, address: 16, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 17, type: bool}
  - {key: x.on_maintenance_bypass, label: Output Load on Maint. Bypass, table: discrete, address: 18, type: bool}
  - {key: x.bypass_voltage_fault, label: Bypass Input Voltage Fault, table: discrete, address: 19, type: bool}
  - {key: x.bypass_backfeed, label: Bypass Backfeed Detected, table: discrete, address: 20, type: bool}
  # Battery
  - {key: x.main_battery_disconnect_open, label: Main Battery Disconnect Open, table: discrete, address: 31, type: bool}
  - {key: x.battery_breaker_4_open, label: Battery Circuit Breaker 4 Open, table: discrete, address: 32, type: bool}
  - {key: x.battery_breaker_3_open, label: Battery Circuit Breaker 3 Open, table: discrete, address: 33, type: bool}
  - {key: x.battery_breaker_2_open, label: Battery Circuit Breaker 2 Open, table: discrete, address: 34, type: bool}
  - {key: x.battery_breaker_1_open, label: Battery Circuit Breaker 1 Open, table: discrete, address: 35, type: bool}
  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 36, type: bool}
  - {key: x.battery_charging_inhibited, label: Battery Charging Inhibited, table: discrete, address: 37, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 38, type: bool}
  - {key: x.battery_manual_test, label: Battery Manual Test In Progress, table: discrete, address: 39, type: bool}
  - {key: x.battery_auto_test, label: Battery Auto Test In Progress, table: discrete, address: 40, type: bool}
  - {key: x.battery_test_passed, label: Battery Test Passed, table: discrete, address: 41, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 42, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature, table: discrete, address: 43, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 44, type: bool}
  - {key: x.battery_ground_fault, label: Battery Ground Fault, table: discrete, address: 45, type: bool}
  - {key: x.battery_not_qualified, label: Battery Not Qualified, table: discrete, address: 46, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 47, type: bool}
  - {key: x.battery_capacity_low, label: Battery Capacity Low, table: discrete, address: 48, type: bool}
  - {key: x.battery_converter_current_limit, label: Battery Converter Current Limit, table: discrete, address: 49, type: bool}
  - {key: x.battery_equalize_timeout, label: Battery Charge Equalization Timeout, table: discrete, address: 50, type: bool}
  - {key: x.battery_room_alarm, label: Battery Room Alarm, table: discrete, address: 51, type: bool}
  - {key: x.battery_breaker_1_open_failure, label: Battery Breaker 1 Open Failure, table: discrete, address: 52, type: bool}
  - {key: x.battery_breaker_2_open_failure, label: Battery Breaker 2 Open Failure, table: discrete, address: 53, type: bool}
  - {key: x.battery_breaker_3_open_failure, label: Battery Breaker 3 Open Failure, table: discrete, address: 54, type: bool}
  - {key: x.battery_breaker_4_open_failure, label: Battery Breaker 4 Open Failure, table: discrete, address: 55, type: bool}
  - {key: x.battery_equalize, label: Battery Equalize, table: discrete, address: 56, type: bool}
  - {key: x.all_chargers_shutdown, label: All Chargers Shutdown, table: discrete, address: 687, type: bool}
  - {key: x.battery_system_warning, label: Battery System Warning, table: discrete, address: 688, type: bool}
  - {key: x.battery_system_fault, label: Battery System Fault, table: discrete, address: 689, type: bool}
