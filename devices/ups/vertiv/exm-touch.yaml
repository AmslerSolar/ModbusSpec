  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage RMS C-N, table: input, address: 415, type: u16, unit: V}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 416, type: u16, unit: Hz, scale: 0.1}
  - {key: x.bypass_nominal_voltage, label: Bypass Nominal Voltage, table: input, address: 420, type: u16, unit: V, poll: slow}
  - {key: x.external_bypass_breaker, label: External Bypass Breaker, table: input, address: 421, type: u16, enum: breaker}
  # Battery
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 432, type: u16, unit: min}
  - {key: battery_current, label: DC Bus Current, table: input, address: 433, type: s16, unit: A, positive: charge, note: Current at the battery input terminals.}
