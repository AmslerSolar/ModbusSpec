  - {key: x.application_mode, label: Application Mode For UPS, table: input, address: 905, type: u16, enum: application_mode, poll: slow}
  - {key: x.operating_time, label: Total System Operating Time, table: input, address: 915, type: u32, unit: h, poll: slow}
