  - {key: x.output_load_va_l2, label: System Output Pct Pwr (VA) Phs B, table: input, address: 603, type: u16, unit: '%'}
  - {key: x.output_load_va_l3, label: System Output Pct Pwr (VA) Phs C, table: input, address: 604, type: u16, unit: '%'}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 605, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 606, type: u16, unit: Hz, scale: 0.1, poll: slow}
