notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the UPS, over Modbus TCP
  or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current (the document calls it DC bus current): + = charging, − = discharging (stated in the glossary).'
- Powers are in kW / kVA as the document gives them. The total input real and apparent power (30427, 30428) and the battery
  voltage have no scale in the document, so they read in whole kW, kVA and volts.
- 'The map has no settings: apart from the system clock, all registers are read-only, including the ECO mode state.'
- 'Left out: line-to-line input, bypass and output voltages, bypass currents, power factors and powers, the °F duplicates
  of the temperatures, and the breaker states of the five cores (QS1, QS4 and battery breaker per core, 30757–30771).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
