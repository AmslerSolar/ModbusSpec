  - {key: x.output_apparent_power_l3, label: System Output Apparent Power Phs C, table: input, address: 485, type: u16, unit: VA, scale: 100}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 486, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 487, type: u16, unit: Hz, scale: 0.1, poll: slow}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 488, type: s16, unit: VA, scale: 1000, poll: slow, note: The document gives kVA.}
  - {key: x.nominal_power_factor, label: Nominal Power Factor, table: input, address: 489, type: s16, scale: 0.01, poll: slow}
  - {key: x.eco_mode, label: ECO Mode Status, table: input, address: 500, type: u16, enum: off_on}
  - {key: x.eco_mode_setting, label: ECO Mode Operation State, table: input, address: 501, type: u16, enum: disabled_enabled, poll: slow}
  # System
  - {key: x.system_status, label: System Status, table: input, address: 512, type: u16, enum: system_status}
  - {key: state, label: UPS Output Source, table: input, address: 513, type: u16, enum: output_source}
  - {key: x.pfc_state, label: Power Factor Correction, table: input, address: 514, type: u16, enum: off_on}
  - {key: x.dc_converter_state, label: DC Converter Status, table: input, address: 515, type: u16, enum: off_on}
  - {key: x.shutdown_reason, label: Shutdown Reason, table: input, address: 516, type: u16, enum: shutdown_reason}
  - {key: x.outside_air_temperature, label: Outside Air Temperature, table: input, address: 517, type: s16, unit: °C, note: The register after it holds the same in °F.}
  - {key: x.topology, label: UPS Topology, table: input, address: 529, type: u16, enum: topology, poll: slow}
  # Settings (read as input registers, written to the holding register at the same address)
  - {key: x.battery_eod_voltage, label: Battery EoD Voltage, table: input, address: 440, type: u16, unit: V, scale: 0.1, poll: slow, writable: true, note: End-of-discharge voltage; below it the battery can no longer carry the load.}
  - {key: x.auto_restart, label: Auto Restart, table: input, address: 530, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.audible_alarm, label: Audible Alarm Control, table: input, address: 532, type: u16, enum: off_on, poll: slow, writable: true}
  - {key: x.epo_logic, label: Emergency Power Off (EPO) Logic, table: input, address: 533, type: u16, enum: epo_logic, poll: slow, writable: true}

enums:
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_result: {'0': Unknown, '1': Passed, '2': Failed, '3': In progress, '4': System failure, '5': Inhibited}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  shutdown_reason: {'0': None, '1': Over temperature, '2': Overload, '3': DC bus overload, '4': Output short, '5': Line swap, '6': Low battery, '7': Remote command, '8': Input under voltage, '9': Power factor correction fail, '10': External signal command}
  topology: {'0': Unknown, '1': Offline, '2': Line interactive, '3': Online}
  epo_logic: {'1': Active open, '2': Active close}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

