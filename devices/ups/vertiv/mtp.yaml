  - {key: x.battery_float_voltage, label: Battery Float Voltage, table: input, address: 438, type: s16, unit: V, scale: 0.1, poll: slow, note: The glossary calls it a cell voltage.}
  - {key: x.battery_test_result, label: Battery Test Result, table: input, address: 439, type: u16, enum: test_result, poll: slow}
