  - {key: x.output_power_l1, label: System Output Power Phase A, table: input, address: 479, type: u16, unit: W, scale: 100}
  - {key: x.output_power_l2, label: System Output Power Phase B, table: input, address: 480, type: u16, unit: W, scale: 100}
  - {key: x.output_power_l3, label: System Output Power Phase C, table: input, address: 481, type: u16, unit: W, scale: 100}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 482, type: u16, unit: VA, scale: 100, note: The document gives kVA with scale 10.}
  - {key: x.output_apparent_power_l1, label: System Output Apparent Power Phs A, table: input, address: 483, type: u16, unit: VA, scale: 100}
