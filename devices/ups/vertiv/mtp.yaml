  - {key: x.inverter_state, label: Inverter On/Off State, table: input, address: 451, type: u16, enum: off_on}
  - {key: temperature, label: Inverter Temperature, table: input, address: 452, type: s16, unit: °C, scale: 0.1, note: The register after it holds the same in °F.}
  # Output
