# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.118–3.120 (Liebert MTP).

modbusspec: 0
id: vertiv-mtp
manufacturer: Vertiv
name: Liebert MTP UPS (IntelliSlot card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 0, type: bool}
  - {key: x.input_phase_rotation_error, label: System Input Phs Rotation Error, table: discrete, address: 1, type: bool}
  - {key: x.input_undervoltage, label: Input Undervoltage, table: discrete, address: 2, type: bool}
  - {key: x.input_overvoltage, label: Input Overvoltage, table: discrete, address: 3, type: bool}
  - {key: x.input_frequency_deviation, label: Input Frequency Deviation, table: discrete, address: 4, type: bool}
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 15, type: bool}
  - {key: x.bypass_excess_retransfers, label: Bypass - Excess Auto Retransfers, table: discrete, address: 16, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 17, type: bool}
  - {key: x.on_maintenance_bypass, label: Output Load on Maint. Bypass, table: discrete, address: 18, type: bool}
  - {key: x.bypass_scr_open, label: Bypass SCR Open, table: discrete, address: 19, type: bool}
  - {key: x.bypass_scr_short, label: Bypass SCR Short, table: discrete, address: 20, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 31, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 32, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 33, type: bool}
  - {key: x.battery_fault, label: Battery Fault, table: discrete, address: 34, type: bool, note: Short circuit in the battery system.}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 35, type: bool}
  - {key: x.precharge_failed, label: Precharge Circuit Failed, table: discrete, address: 36, type: bool}
  - {key: x.rectifier_overcurrent, label: Rectifier Overcurrent Warning, table: discrete, address: 37, type: bool}
  - {key: x.rectifier_over_temperature, label: Rectifier Over Temperature, table: discrete, address: 38, type: bool}
  - {key: x.rectifier_comm_failure, label: Rectifier Communications Failure, table: discrete, address: 39, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 40, type: bool}
  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 41, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 42, type: bool}
  - {key: x.dc_bus_low, label: DC Bus Low Fault, table: discrete, address: 53, type: bool}
  - {key: x.inverter_overload, label: Inverter Overload, table: discrete, address: 54, type: bool}
  - {key: x.inverter_over_temperature, label: Inverter Over Temperature, table: discrete, address: 55, type: bool}
  - {key: x.inverter_comm_failure, label: Inverter Communications Failure, table: discrete, address: 56, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 57, type: bool}
  - {key: x.output_undervoltage, label: Output Undervoltage, table: discrete, address: 68, type: bool}
  - {key: x.output_overvoltage, label: Output Overvoltage, table: discrete, address: 69, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 70, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 81, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 82, type: bool}
  - {key: x.shutdown_pending, label: Shutdown Pending, table: discrete, address: 83, type: bool}
  - {key: x.general_event, label: Unspecified General Event, table: discrete, address: 84, type: bool}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS A-N, table: input, address: 384, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l2, label: System Input RMS B-N, table: input, address: 385, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l3, label: System Input RMS C-N, table: input, address: 386, type: u16, unit: V, scale: 0.1}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 387, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_current_l1, label: System Input RMS Current Phase A, table: input, address: 391, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l2, label: System Input RMS Current Phase B, table: input, address: 392, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l3, label: System Input RMS Current Phase C, table: input, address: 393, type: u16, unit: A, scale: 0.1}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 394, type: u16, unit: V, scale: 0.1, poll: slow}
  - {key: x.input_nominal_frequency, label: System Input Nominal Frequency, table: input, address: 395, type: u16, unit: Hz, scale: 0.1, poll: slow}
  - {key: x.input_nominal_current, label: System Input Nominal Current, table: input, address: 396, type: u16, unit: A, scale: 0.1, poll: slow}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS A-N, table: input, address: 407, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage RMS B-N, table: input, address: 408, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage RMS C-N, table: input, address: 409, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 410, type: u16, unit: Hz, scale: 0.1}
  - {key: x.bypass_current_l1, label: Bypass Input RMS Current Phase A, table: input, address: 414, type: s16, unit: A, scale: 0.1}
  - {key: x.bypass_current_l2, label: Bypass Input RMS Current Phase B, table: input, address: 415, type: s16, unit: A, scale: 0.1}
  - {key: x.bypass_current_l3, label: Bypass Input RMS Current Phase C, table: input, address: 416, type: s16, unit: A, scale: 0.1}
  # Battery
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 427, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery Charge Status, table: input, address: 428, type: u16, enum: charge_status}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 429, type: u16, unit: '%'}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 430, type: s16, unit: V, scale: 0.1, note: DC bus voltage at the battery input.}
