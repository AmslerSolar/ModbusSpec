  - {key: l2_voltage, label: System Output Voltage RMS B-N, table: input, address: 465, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: System Output Voltage RMS C-N, table: input, address: 466, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 467, type: u16, unit: Hz, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current Phs A, table: input, address: 471, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: System Output RMS Current Phs B, table: input, address: 472, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: System Output RMS Current Phs C, table: input, address: 473, type: u16, unit: A, scale: 0.1}
  - {key: x.output_load, label: System Output Pct Power, table: input, address: 474, type: u16, unit: '%'}
  - {key: x.output_load_l1, label: System Output Pct Power Phase A, table: input, address: 475, type: u16, unit: '%'}
  - {key: x.output_load_l2, label: System Output Pct Power Phase B, table: input, address: 476, type: u16, unit: '%'}
  - {key: x.output_load_l3, label: System Output Pct Power Phase C, table: input, address: 477, type: u16, unit: '%'}
