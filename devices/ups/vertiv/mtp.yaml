  - {when: {key: x.input_undervoltage, equals: 1}, kind: warning, text: Input undervoltage}
  - {when: {key: x.input_overvoltage, equals: 1}, kind: warning, text: Input overvoltage}
  - {when: {key: x.input_frequency_deviation, equals: 1}, kind: warning, text: Input frequency out of range}
  - {when: {key: x.bypass_not_available, equals: 1}, kind: warning, text: Bypass not available}
  - {when: {key: x.bypass_excess_retransfers, equals: 1}, kind: warning, text: Too many automatic retransfers}
  - {when: {key: x.on_bypass, equals: 1}, kind: warning, text: Output on bypass}
  - {when: {key: x.on_maintenance_bypass, equals: 1}, kind: warning, text: Load on maintenance bypass}
  - {when: {key: x.bypass_scr_open, equals: 1}, kind: fault, text: Bypass SCR open}
  - {when: {key: x.bypass_scr_short, equals: 1}, kind: fault, text: Bypass SCR short}
  - {when: {key: x.charger_failure, equals: 1}, kind: fault, text: Charger failure}
  - {when: {key: x.battery_low, equals: 1}, kind: warning, text: Battery low}
  - {when: {key: x.battery_fault, equals: 1}, kind: fault, text: Battery fault (short circuit)}
  - {when: {key: x.replace_battery, equals: 1}, kind: warning, text: Replace battery}
  - {when: {key: x.precharge_failed, equals: 1}, kind: fault, text: DC bus precharge failed}
  - {when: {key: x.rectifier_overcurrent, equals: 1}, kind: warning, text: Rectifier overcurrent}
  - {when: {key: x.rectifier_over_temperature, equals: 1}, kind: fault, text: Rectifier over temperature}
  - {when: {key: x.rectifier_comm_failure, equals: 1}, kind: fault, text: Rectifier communication failure}
  - {when: {key: x.rectifier_failure, equals: 1}, kind: fault, text: Rectifier failure}
  - {when: {key: x.battery_test_failed, equals: 1}, kind: warning, text: Battery test failed}
  - {when: {key: x.dc_bus_low, equals: 1}, kind: fault, text: DC bus voltage critically low}
  - {when: {key: x.inverter_overload, equals: 1}, kind: fault, text: Inverter overload}
  - {when: {key: x.inverter_over_temperature, equals: 1}, kind: fault, text: Inverter over temperature}
  - {when: {key: x.inverter_comm_failure, equals: 1}, kind: fault, text: Inverter communication failure}
  - {when: {key: x.inverter_failure, equals: 1}, kind: fault, text: Inverter failure}
  - {when: {key: x.output_undervoltage, equals: 1}, kind: warning, text: Output undervoltage}
  - {when: {key: x.output_overvoltage, equals: 1}, kind: warning, text: Output overvoltage}
  - {when: {key: x.output_overload, equals: 1}, kind: warning, text: Output overload}
  - {when: {key: x.over_temperature, equals: 1}, kind: warning, text: Equipment over temperature}
