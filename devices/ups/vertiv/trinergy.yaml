  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage Phase B, table: input, address: 436, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage Phase C, table: input, address: 437, type: u16, unit: V, scale: 0.1}
