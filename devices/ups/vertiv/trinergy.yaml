notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the UPS, over Modbus TCP
  or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current (the document calls it DC bus current): + = charging, − = discharging (stated in the glossary). It and
  the battery cabinet voltage have no scale in the document, so they read in whole amps and volts.'
- Powers are in kW / kVA as the document gives them, except the total apparent power, which is given here in VA.
- The map has no UPS Output Source register; the Load Status register (what supplies the load) serves as the state.
- Two enum texts are cut short in the document (bypass status 4 "Bypass not read", inverter status 4 "Inverter in Stand B"
  in the system block); read here as not ready and stand-by, as the per-core inverter status and the Trinergy Cube map spell
  them.
- 'The map has no settings: apart from the system clock, all registers are read-only, including the ECO mode state.'
- 'Left out: bypass currents, powers and apparent powers, the °F duplicates of the temperatures, and the per-core blocks for
  up to ten cores: status and KM1/KM4 breakers (30547 ff.), rectifier input values and temperatures (30727 ff.), output values
  and inverter temperatures (31057 ff.), battery voltage, current and running time (31467 ff.) and buck-booster temperatures
  (31607 ff.).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
