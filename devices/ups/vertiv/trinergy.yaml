  - {key: x.dc_bus_voltage, label: DC Bus Voltage, table: input, address: 418, type: s16, unit: V, scale: 0.1, note: DC bus voltage at the battery input.}
  - {key: x.input_apparent_power_l1, label: System Input Apparent Power Phs A, table: input, address: 419, type: u16, unit: VA, scale: 100}
  - {key: x.input_apparent_power_l2, label: System Input Apparent Power Phs B, table: input, address: 420, type: u16, unit: VA, scale: 100}
  - {key: x.input_apparent_power_l3, label: System Input Apparent Power Phs C, table: input, address: 421, type: u16, unit: VA, scale: 100}
  - {key: x.input_power_l1, label: System Input Power Phase A, table: input, address: 422, type: u16, unit: W, scale: 100}
  - {key: x.input_power_l2, label: System Input Power Phase B, table: input, address: 423, type: u16, unit: W, scale: 100}
  - {key: x.input_power_l3, label: System Input Power Phase C, table: input, address: 424, type: u16, unit: W, scale: 100}
  # Bypass
