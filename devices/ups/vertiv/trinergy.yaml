modbusspec: 0
id: vertiv-trinergy
manufacturer: Vertiv
name: Trinergy UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.general_warning, label: General Warning, table: discrete, address: 0, type: bool}
  - {key: x.general_fault, label: General Fault, table: discrete, address: 1, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 2, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 3, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 4, type: bool}
  - {key: x.booster_failure, label: Booster Failure, table: discrete, address: 5, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 6, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 7, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 8, type: bool}
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 9, type: bool}
  - {key: x.epo_shutdown, label: System Shutdown - EPO, table: discrete, address: 10, type: bool}
  - {key: x.input_breaker_open, label: Input Breaker Open, table: discrete, address: 11, type: bool}
  - {key: x.output_breaker_open, label: Output Breaker Open, table: discrete, address: 12, type: bool}
  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 13, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 14, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 15, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 16, type: bool}
  - {key: x.output_off_pending, label: Output Off Pending, table: discrete, address: 17, type: bool}
  - {key: x.bypass_out_of_sync, label: Bypass out of sync, table: discrete, address: 18, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 19, type: bool}
  - {key: x.bypass_voltage_fault, label: Bypass Input Voltage Fault, table: discrete, address: 20, type: bool}
  - {key: x.bypass_overload, label: Bypass Overload, table: discrete, address: 21, type: bool}
  - {key: x.battery_charging, label: Battery Charging, table: discrete, address: 22, type: bool}
  - {key: x.fuse_failure, label: Fuse Failure, table: discrete, address: 23, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature Limit, table: discrete, address: 24, type: bool}
  - {key: x.output_fault, label: System Output Fault, table: discrete, address: 25, type: bool}
  - {key: x.battery_test_passed, label: Battery Test Passed, table: discrete, address: 26, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 27, type: bool}
  - {key: x.battery_ground_fault, label: Battery Ground Fault, table: discrete, address: 28, type: bool}
  # Protocol and ratings
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 395, type: u16, unit: VA, scale: 1000, poll: slow}
  - {key: x.input_nominal_frequency, label: System Input Nominal Frequency, table: input, address: 396, type: u16, unit: Hz, poll: slow}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 397, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 398, type: u16, unit: Hz, poll: slow}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 399, type: u16, unit: V, poll: slow}
  - {key: x.input_nominal_current, label: System Input Nominal Current, table: input, address: 400, type: u16, unit: A, poll: slow}
  # Input
  - {key: x.input_voltage_l1, label: System Rectifier Mains Voltage Phase A, table: input, address: 411, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l2, label: System Rectifier Mains Voltage Phase B, table: input, address: 412, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l3, label: System Rectifier Mains Voltage Phase C, table: input, address: 413, type: u16, unit: V, scale: 0.1}
  - {key: x.input_current_l1, label: System Input RMS Current Phase A, table: input, address: 414, type: u16, unit: A, scale: 0.1}
