  - {key: l2_voltage, label: System Load Voltage Phase B, table: input, address: 481, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: System Load Voltage Phase C, table: input, address: 482, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current Phs A, table: input, address: 483, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: System Output RMS Current Phs B, table: input, address: 484, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: System Output RMS Current Phs C, table: input, address: 485, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 486, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power_l1, label: System Output Power Phase A, table: input, address: 487, type: u16, unit: W, scale: 100}
