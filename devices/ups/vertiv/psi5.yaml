# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.127–3.129 (Liebert PSI5 / Vertiv Edge, including the lithium-ion short-depth models).

modbusspec: 0
id: vertiv-psi5
manufacturer: Vertiv
name: Liebert PSI5 / Edge UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.input_undervoltage, label: Input Undervoltage, table: discrete, address: 0, type: bool}
  - {key: x.input_overvoltage, label: Input Overvoltage, table: discrete, address: 1, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 13, type: bool}
  - {key: x.battery_undervoltage, label: Battery Under Voltage, table: discrete, address: 14, type: bool}
  - {key: x.battery_overvoltage, label: Battery Over Voltage, table: discrete, address: 15, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 16, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 17, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 28, type: bool}
  - {key: x.output_undervoltage, label: Output Undervoltage, table: discrete, address: 29, type: bool}
  - {key: x.output_overvoltage, label: Output Overvoltage, table: discrete, address: 30, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 31, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 42, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 43, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 44, type: bool}
  - {key: x.input_frequency_deviation, label: Input Frequency Deviation, table: discrete, address: 45, type: bool}
  - {key: x.shutdown_pending, label: Shutdown Pending, table: discrete, address: 46, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 49, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 50, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 51, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 52, type: bool}
  - {key: x.epo_latched, label: Emergency Power Off - Latched, table: discrete, address: 53, type: bool}
  - {key: x.input_wiring_fault, label: Input Wiring Fault, table: discrete, address: 54, type: bool}
  - {key: x.dc_dc_fault, label: DC to DC Converter Fault, table: discrete, address: 55, type: bool}
  # Protocol
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  # Input
  - {key: x.input_voltage, label: System Input RMS L1-N, table: input, address: 395, type: u16, unit: V, scale: 0.1}
  - {key: x.input_current, label: System Input RMS Current L1, table: input, address: 396, type: u16, unit: A, scale: 0.1}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 397, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 398, type: u16, unit: V, poll: slow}
  # Battery
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 411, type: u16, enum: battery_status}
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 412, type: u16, unit: min}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 413, type: u16, unit: '%'}
  - {key: x.battery_charge_status, label: Battery Charge Status, table: input, address: 414, type: u16, enum: charge_status}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 415, type: u16, unit: V}
  - {key: x.battery_test_result, label: Battery Test Result, table: input, address: 420, type: u16, enum: test_result, poll: slow}
  # Output
  - {key: l1_voltage, label: System Output Voltage RMS L1-N, table: input, address: 433, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current L1, table: input, address: 434, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 435, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power, label: System Output Power, table: input, address: 436, type: u16, unit: W}
  - {key: x.output_load, label: System Output Pct Power, table: input, address: 437, type: u16, unit: '%'}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 438, type: u16, unit: VA}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 440, type: u16, unit: VA, poll: slow}
  - {key: state, label: UPS Output Source, table: input, address: 445, type: u16, enum: output_source}
  # System
  - {key: x.system_status, label: System Status, table: input, address: 481, type: u16, enum: system_status}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 484, type: s16, unit: °C, note: The register after it holds the same in °F.}
  - {key: x.topology, label: UPS Topology, table: input, address: 487, type: u16, enum: topology, poll: slow}
  # Settings (read as input registers, written to the holding register at the same address)
  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 417, type: u16, unit: min, poll: slow, writable: true}
  - {key: x.auto_restart, label: Auto Restart, table: input, address: 482, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart_delay, label: Auto Restart Delay, table: input, address: 483, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.audible_alarm, label: Audible Alarm Control, table: input, address: 488, type: u16, enum: off_on, poll: slow, writable: true}

enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_result: {'0': Unknown, '1': Passed, '2': Failed, '3': In progress, '4': System failure, '5': Inhibited}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  topology: {'0': Unknown, '1': Offline, '2': Line interactive, '3': Online}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: state, equals: 5}, kind: backup_mode, text: Output on battery}
  - {when: {key: x.input_power_problem, equals: 1}, kind: mains_lost, text: Input power problem}
  - {when: {key: x.system_status, equals: 32}, kind: fault, text: Abnormal operation}
  - {when: {key: x.input_undervoltage, equals: 1}, kind: warning, text: Input undervoltage}
  - {when: {key: x.input_overvoltage, equals: 1}, kind: warning, text: Input overvoltage}
  - {when: {key: x.input_frequency_deviation, equals: 1}, kind: warning, text: Input frequency deviation}
  - {when: {key: x.battery_low, equals: 1}, kind: warning, text: Battery low}
  - {when: {key: x.battery_undervoltage, equals: 1}, kind: warning, text: Battery undervoltage}
  - {when: {key: x.battery_overvoltage, equals: 1}, kind: warning, text: Battery overvoltage}
  - {when: {key: x.battery_test_failed, equals: 1}, kind: warning, text: Battery test failed}
  - {when: {key: x.replace_battery, equals: 1}, kind: warning, text: Replace battery}
  - {when: {key: x.output_overload, equals: 1}, kind: warning, text: Output overload}
  - {when: {key: x.output_undervoltage, equals: 1}, kind: warning, text: Output undervoltage}
  - {when: {key: x.output_overvoltage, equals: 1}, kind: warning, text: Output overvoltage}
  - {when: {key: x.output_off, equals: 1}, kind: warning, text: Output off}
  - {when: {key: x.over_temperature, equals: 1}, kind: warning, text: Equipment over temperature}
  - {when: {key: x.shutdown_pending, equals: 1}, kind: warning, text: Shutdown pending}
  - {when: {key: x.charger_failure, equals: 1}, kind: fault, text: Charger failure}
  - {when: {key: x.rectifier_failure, equals: 1}, kind: fault, text: Rectifier failure}
  - {when: {key: x.inverter_failure, equals: 1}, kind: fault, text: Inverter failure}
  - {when: {key: x.fan_failure, equals: 1}, kind: warning, text: Fan failure}
  - {when: {key: x.epo_latched, equals: 1}, kind: fault, text: Emergency power off (latched)}
  - {when: {key: x.input_wiring_fault, equals: 1}, kind: warning, text: Input wiring fault}
  - {when: {key: x.dc_dc_fault, equals: 1}, kind: fault, text: DC/DC converter fault}

notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU120 network card in the UPS, over Modbus TCP or RTU
  (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Left out: nominal values, battery discharge time, number of external battery cabinets, output delays, outlet groups and
  programmable-outlet settings, EPO logic, waveform sensitivity, the °F duplicate of the temperature and the write-only commands
  (battery test 40423, abort, reset statistics, silence alarm).'
- The card has no model or serial number registers, so there is no identify block.
