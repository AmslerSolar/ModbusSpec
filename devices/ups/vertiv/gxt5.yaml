# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.112–3.114 (Liebert GXT5).

modbusspec: 0
id: vertiv-gxt5
manufacturer: Vertiv
name: Liebert GXT5 UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 0, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 12, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 13, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 14, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 17, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature, table: discrete, address: 18, type: bool}
  - {key: x.battery_deep_discharge, label: Battery Deep Discharge, table: discrete, address: 20, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 25, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 26, type: bool}
  - {key: x.output_fault, label: System Output Fault, table: discrete, address: 27, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 37, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 38, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 39, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 40, type: bool}
  - {key: x.shutdown_pending, label: Shutdown Pending, table: discrete, address: 42, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 46, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 47, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 48, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 50, type: bool}
  - {key: x.epo_latched, label: Emergency Power Off - Latched, table: discrete, address: 51, type: bool}
  - {key: x.input_wiring_fault, label: Input Wiring Fault, table: discrete, address: 52, type: bool}
  - {key: x.dc_dc_fault, label: DC to DC Converter Fault, table: discrete, address: 53, type: bool}
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 57, type: bool}
  - {key: x.output_short_shutdown, label: System Shutdown - Output Short, table: discrete, address: 58, type: bool}
  - {key: x.on_inverter, label: UPS Output on Inverter, table: discrete, address: 59, type: bool}
  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 73, type: bool}
  - {key: x.general_fault, label: General Fault, table: discrete, address: 74, type: bool}
  # Protocol
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS L1-N, table: input, address: 395, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l2, label: System Input RMS L2-N, table: input, address: 396, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l3, label: System Input RMS L3-N, table: input, address: 397, type: u16, unit: V, scale: 0.1}
  - {key: x.input_current_l1, label: System Input RMS Current L1, table: input, address: 401, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l2, label: System Input RMS Current L2, table: input, address: 402, type: u16, unit: A, scale: 0.1}
  - {key: x.input_current_l3, label: System Input RMS Current L3, table: input, address: 403, type: u16, unit: A, scale: 0.1}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 404, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_power_factor_l1, label: System Input Power Factor L1, table: input, address: 405, type: u16, scale: 0.01}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 414, type: u16, unit: V, poll: slow}
  - {key: x.input_phase_count, label: System Input Phase Count, table: input, address: 417, type: u16, poll: slow}
  - {key: x.input_energy, label: Input Energy, table: input, address: 418, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Since the last reset of the power statistics.}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS L1-N, table: input, address: 430, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 433, type: u16, unit: Hz, scale: 0.1}
  # Battery
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 445, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery Charge Status, table: input, address: 446, type: u16, enum: charge_status}
  - {key: x.battery_test_result, label: Battery Test Result, table: input, address: 449, type: u16, enum: test_result, poll: slow}
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 451, type: u16, unit: min, scale: 0.1}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 452, type: u16, unit: '%'}
  - {key: battery_current, label: Battery Current, table: input, address: 453, type: s16, unit: A, scale: 0.1, positive: charge}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 454, type: u16, unit: V, note: DC bus voltage at the battery input.}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 456, type: s16, unit: °C, scale: 0.1}
  - {key: x.battery_rating, label: Battery Rating, table: input, address: 458, type: u16, unit: Ah, poll: slow}
  - {key: x.battery_discharge_count, label: Total Number of Battery Discharges, table: input, address: 464, type: u16, poll: slow}
  - {key: x.battery_last_replaced, label: Battery last replaced time, table: input, address: 469, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: battery_soh, label: Battery State of Health, table: input, address: 471, type: u16, unit: '%', poll: slow}
  - {key: x.battery_expiration, label: Battery expiration date, table: input, address: 475, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.battery_type, label: Battery type, table: input, address: 477, type: u16, enum: battery_type, poll: slow}
  - {key: x.max_cell_voltage, label: Maximum Cell Voltage, table: input, address: 835, type: u16, unit: V, scale: 0.001, optional: true, note: Lithium battery systems only.}
  - {key: x.min_cell_voltage, label: Minimum Cell Voltage, table: input, address: 836, type: u16, unit: V, scale: 0.001, optional: true}
  # Output
  - {key: l1_voltage, label: System Output Voltage RMS L1-N, table: input, address: 479, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: System Output Voltage RMS L2-N, table: input, address: 480, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current L1, table: input, address: 482, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: System Output RMS Current L2, table: input, address: 483, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 484, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power, label: System Output Power, table: input, address: 485, type: u16, unit: W}
  - {key: x.output_power_l1, label: System Output Power L1, table: input, address: 486, type: u16, unit: W}
  - {key: x.output_power_l2, label: System Output Power L2, table: input, address: 487, type: u16, unit: W}
  - {key: x.output_load, label: System Output Pct Power, table: input, address: 488, type: u16, unit: '%'}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 491, type: u16, unit: VA}
  - {key: x.output_energy, label: Output Energy, table: input, address: 497, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Since the last energy reset.}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 499, type: u16, unit: VA, poll: slow}
  - {key: state, label: UPS Output Source, table: input, address: 509, type: u16, enum: output_source}
  - {key: x.eco_mode, label: ECO Mode Status, table: input, address: 568, type: u16, enum: off_on}
  # System
  - {key: x.system_status, label: System Status, table: input, address: 580, type: u16, enum: system_status}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 581, type: u16, poll: slow}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 582, type: u16, poll: slow}
  - {key: x.inverter_state, label: Inverter On/Off State, table: input, address: 585, type: u16, enum: off_on}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 586, type: s16, unit: °C, note: The register after it holds the same in °F.}
  - {key: x.shutdown_reason, label: Shutdown Reason, table: input, address: 588, type: u16, enum: shutdown_reason}
  - {key: x.topology, label: UPS Topology, table: input, address: 589, type: u16, enum: topology, poll: slow}
  - {key: x.efficiency, label: Average system efficiency, table: input, address: 593, type: u16, unit: '%'}
  # Settings (read as input registers, written to the holding register at the same address)
  - {key: x.automatic_battery_test, label: Automatic Battery Test, table: input, address: 447, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 459, type: u16, unit: min, poll: slow, writable: true}
  - {key: x.auto_restart, label: Auto Restart, table: input, address: 583, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart_delay, label: Auto Restart Delay, table: input, address: 584, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.audible_alarm, label: Audible Alarm Control, table: input, address: 590, type: u16, enum: off_on, poll: slow, writable: true}

enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_result: {'0': Unknown, '1': Passed, '2': Failed, '3': In progress, '4': System failure, '5': Inhibited}
  battery_type: {'0': VRLA, '1': Lithium}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  shutdown_reason: {'0': None, '1': Over temperature, '2': Overload, '3': DC bus overload, '4': Output short, '5': Line swap, '6': Low battery, '7': Remote command, '8': Input under voltage, '9': Power factor correction fail, '10': External signal command}
  topology: {'0': Unknown, '1': Offline, '2': Line interactive, '3': Online}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

problems:
  - {when: {key: state, equals: 5}, kind: backup_mode, text: Output on battery}
  - {when: {key: x.input_power_problem, equals: 1}, kind: mains_lost, text: Input power problem}
  - {when: {key: x.system_status, equals: 32}, kind: fault, text: Abnormal operation}
  - {when: {key: x.bypass_not_available, equals: 1}, kind: warning, text: Bypass not available}
  - {when: {key: x.battery_low, equals: 1}, kind: warning, text: Battery low}
  - {when: {key: x.battery_test_failed, equals: 1}, kind: warning, text: Battery test failed}
  - {when: {key: x.replace_battery, equals: 1}, kind: warning, text: Replace battery}
  - {when: {key: x.battery_terminals_reversed, equals: 1}, kind: fault, text: Battery terminals reversed}
  - {when: {key: x.battery_over_temperature, equals: 1}, kind: warning, text: Battery over temperature}
  - {when: {key: x.battery_deep_discharge, equals: 1}, kind: warning, text: Battery deep discharge}
  - {when: {key: x.output_overload, equals: 1}, kind: warning, text: Output overload}
  - {when: {key: x.output_off, equals: 1}, kind: warning, text: Output off}
  - {when: {key: x.output_fault, equals: 1}, kind: fault, text: Output fault}
  - {when: {key: x.on_bypass, equals: 1}, kind: warning, text: Output on bypass}
  - {when: {key: x.over_temperature, equals: 1}, kind: warning, text: Equipment over temperature}
  - {when: {key: x.shutdown_pending, equals: 1}, kind: warning, text: Shutdown pending}
  - {when: {key: x.charger_failure, equals: 1}, kind: fault, text: Charger failure}
  - {when: {key: x.rectifier_failure, equals: 1}, kind: fault, text: Rectifier failure}
  - {when: {key: x.inverter_failure, equals: 1}, kind: fault, text: Inverter failure}
  - {when: {key: x.fan_failure, equals: 1}, kind: warning, text: Fan failure}
  - {when: {key: x.epo_latched, equals: 1}, kind: fault, text: Emergency power off (latched)}
  - {when: {key: x.input_wiring_fault, equals: 1}, kind: warning, text: Input wiring fault}
  - {when: {key: x.dc_dc_fault, equals: 1}, kind: fault, text: DC/DC converter fault}
  - {when: {key: x.input_neutral_lost, equals: 1}, kind: warning, text: Input neutral lost}
  - {when: {key: x.output_short_shutdown, equals: 1}, kind: fault, text: Shutdown by output short circuit}
  - {when: {key: x.internal_comm_failure, equals: 1}, kind: fault, text: Internal communication failure}
  - {when: {key: x.general_fault, equals: 1}, kind: fault, text: General fault}

notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the UPS, over Modbus TCP
  or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current: + = charging, − = discharging (stated in the glossary).'
- 'Left out: per-phase L2/L3 power factors, min/max input voltages, line-to-line voltages, bypass details, the °F duplicates
  of the temperatures, outlet group control, ECO, sleep-mode and dry-contact settings, the per-cabinet lithium battery groups
  (16 × SOC/SOH/status and alarms), parallel-system values, the event control/type settings (30953 ff.) and the write-only
  commands (battery test 40467, silence alarm, clear faults, turn to bypass).'
- The card has no model or serial number registers, so there is no identify block.
