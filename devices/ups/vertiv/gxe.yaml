# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.106–3.108 (Liebert GXE / GXE3).

modbusspec: 0
id: vertiv-gxe
manufacturer: Vertiv
name: Liebert GXE / GXE3 UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.input_current_limit, label: System Input Current Limit, table: discrete, address: 0, type: bool}
  - {key: x.input_wiring_fault, label: Input Wiring Fault, table: discrete, address: 1, type: bool}
  - {key: x.dc_bus_abnormal, label: DC Bus Abnormal, table: discrete, address: 2, type: bool}
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 13, type: bool}
  - {key: x.bypass_backfeed, label: Bypass Backfeed Detected, table: discrete, address: 14, type: bool}
  - {key: x.bypass_disabled, label: Bypass disabled, table: discrete, address: 15, type: bool}
  - {key: x.bypass_abnormal_eco, label: Bypass Abnormal In ECO Mode, table: discrete, address: 16, type: bool}
  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 27, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 28, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 29, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 30, type: bool}
  - {key: x.battery_not_qualified, label: Battery Not Qualified, table: discrete, address: 31, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 32, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature, table: discrete, address: 33, type: bool}
  - {key: x.battery_deep_discharge, label: Battery Deep Discharge, table: discrete, address: 34, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 45, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 46, type: bool}
  - {key: x.turn_on_failed, label: Turn on failed, table: discrete, address: 47, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 58, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 59, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 60, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 61, type: bool}
  - {key: x.shutdown_pending, label: Shutdown Pending, table: discrete, address: 62, type: bool}
  - {key: x.charger_failure, label: Charger Failure, table: discrete, address: 63, type: bool}
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 64, type: bool}
  - {key: x.inverter_failure, label: Inverter Failure, table: discrete, address: 65, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 67, type: bool}
  - {key: x.epo_latched, label: Emergency Power Off - Latched, table: discrete, address: 68, type: bool}
  - {key: x.dc_dc_fault, label: DC to DC Converter Fault, table: discrete, address: 69, type: bool}
  - {key: x.module_over_temperature_shutdown, label: Power Module Shutdown - Over Temperature, table: discrete, address: 70, type: bool}
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 71, type: bool}
  - {key: x.output_short_shutdown, label: System Shutdown - Output Short, table: discrete, address: 72, type: bool}
  - {key: x.on_inverter, label: UPS Output on Inverter, table: discrete, address: 73, type: bool}
  - {key: x.remote_shutdown, label: System Shutdown - Remote Shutdown, table: discrete, address: 74, type: bool}
  - {key: x.auxiliary_power_fault, label: Auxiliary power fault, table: discrete, address: 75, type: bool}
  - {key: x.output_off_bypass_abnormal, label: Output off due to abnormal bypass, table: discrete, address: 76, type: bool}
  - {key: x.output_off_voltage_not_zero, label: Output off voltage is not zero, table: discrete, address: 77, type: bool}
  - {key: x.inverter_relay_fault, label: Inverter Relay Fault, table: discrete, address: 83, type: bool}
  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 84, type: bool}
  - {key: x.general_fault, label: General Fault, table: discrete, address: 85, type: bool}
  # Protocol
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS L1-N, table: input, address: 395, type: u16, unit: V, scale: 0.1}
  - {key: x.input_current_l1, label: System Input RMS Current L1, table: input, address: 396, type: u16, unit: A, scale: 0.1}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 397, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_power_factor_l1, label: System Input Power Factor L1, table: input, address: 398, type: u16, scale: 0.01}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 401, type: u16, unit: V, poll: slow}
  - {key: x.input_phase_count, label: System Input Phase Count, table: input, address: 404, type: u16, poll: slow}
  - {key: x.input_energy, label: Input Energy, table: input, address: 405, type: u32, unit: kWh, scale: 0.1, poll: slow}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS L1-N, table: input, address: 417, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 418, type: u16, unit: Hz, scale: 0.1}
  # Battery
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 430, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery Charge Status, table: input, address: 431, type: u16, enum: charge_status}
  - {key: x.battery_test_result, label: Battery Test Result, table: input, address: 432, type: u16, enum: test_result, poll: slow}
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 433, type: u16, unit: min, scale: 0.1}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 434, type: u16, unit: '%'}
  - {key: battery_current, label: Battery Current, table: input, address: 435, type: s16, unit: A, scale: 0.1, positive: charge}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 436, type: u16, unit: V, note: DC bus voltage at the battery input.}
  - {key: x.battery_rating, label: Battery Rating, table: input, address: 438, type: u16, unit: Ah, poll: slow}
  - {key: x.ebc_count, label: Number of EBC Installed, table: input, address: 439, type: u16, poll: slow, note: External battery cabinets.}
  - {key: x.battery_discharge_count, label: Total Number of Battery Discharges, table: input, address: 441, type: u16, poll: slow}
  - {key: battery_soh, label: Battery State of Health, table: input, address: 442, type: u16, unit: '%', poll: slow}
  - {key: x.charger_state, label: Battery Charger State, table: input, address: 443, type: u16, enum: off_on}
  - {key: x.battery_float_voltage, label: Battery Float Voltage, table: input, address: 444, type: u16, unit: V, scale: 0.01, poll: slow}
  - {key: x.battery_type, label: Battery type, table: input, address: 445, type: u16, enum: battery_type, poll: slow}
  - {key: x.battery_last_replaced, label: Battery last replaced time, table: input, address: 458, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  # Output
  - {key: l1_voltage, label: System Output Voltage RMS L1-N, table: input, address: 493, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: System Output RMS Current L1, table: input, address: 494, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: System Output Frequency, table: input, address: 495, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power, label: System Output Power, table: input, address: 496, type: u16, unit: W}
  - {key: x.output_load, label: System Output Pct Power, table: input, address: 498, type: u16, unit: '%'}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 500, type: u16, unit: VA}
  - {key: power_factor, label: System Output Power Factor L1, table: input, address: 502, type: u16, scale: 0.01}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 503, type: u16, unit: V, poll: slow}
  - {key: x.output_energy, label: Output Energy, table: input, address: 504, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Writable at 40505 (resets the counter).}
  - {key: x.output_va_rating, label: Output Apparent Power Rating, table: input, address: 506, type: u16, unit: VA, poll: slow}
  - {key: state, label: UPS Output Source, table: input, address: 512, type: u16, enum: output_source}
  - {key: x.eco_mode, label: ECO Mode Status, table: input, address: 523, type: u16, enum: off_on}
  # System
  - {key: x.system_status, label: System Status, table: input, address: 538, type: u16, enum: system_status}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 539, type: u16, poll: slow}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 540, type: u16, poll: slow}
  - {key: x.inverter_state, label: Inverter On/Off State, table: input, address: 541, type: u16, enum: off_on}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 542, type: s16, unit: °C, note: The register after it holds the same in °F.}
  - {key: x.shutdown_reason, label: Shutdown Reason, table: input, address: 544, type: u16, enum: shutdown_reason}
  - {key: x.topology, label: UPS Topology, table: input, address: 545, type: u16, enum: topology, poll: slow}
  - {key: x.system_time, label: System Date and Time, table: input, address: 9997, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow, writable: true, note: UTC.}
  # Settings (read as input registers, written to the holding register at the same address)
  - {key: x.auto_battery_test_interval, label: Auto Battery Test Interval, table: input, address: 470, type: u16, enum: test_interval, poll: slow, writable: true}
  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 474, type: u16, unit: min, poll: slow, writable: true}
  - {key: x.max_charge_current, label: Max Charge Current, table: input, address: 481, type: u16, unit: A, scale: 0.1, poll: slow, writable: true}
  - {key: x.eco_mode_setting, label: ECO Mode Operation State, table: input, address: 524, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.audible_alarm, label: Audible Alarm Control, table: input, address: 558, type: u16, enum: off_on, poll: slow, writable: true}
  - {key: x.auto_restart, label: Auto Restart, table: input, address: 559, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart_delay, label: Auto Restart Delay, table: input, address: 560, type: u16, unit: s, poll: slow, writable: true}

enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_result: {'0': Unknown, '1': Passed, '2': Failed, '3': In progress, '4': System failure, '5': Inhibited}
  battery_type: {'0': VRLA, '1': Lithium}
  test_interval: {'0': Disabled, '1': 8 weeks, '2': 12 weeks, '3': 16 weeks, '4': 20 weeks, '5': 26 weeks}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  shutdown_reason: {'0': None, '1': Over temperature, '2': Overload, '3': DC bus overload, '4': Output short, '5': Line swap, '6': Low battery, '7': Remote command, '8': Input under voltage, '9': Power factor correction fail, '10': External signal command}
  topology: {'0': Unknown, '1': Offline, '2': Line interactive, '3': Online}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

