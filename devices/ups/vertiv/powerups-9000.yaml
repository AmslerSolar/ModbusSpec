notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the UPS, over Modbus TCP
  or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current: + = charging, − = discharging (stated in the glossary).'
- 'AC voltages and currents have no scale in this map: whole volts and amperes. Powers are in kW (per phase with one decimal,
  the total in whole kW) and apparent power in kVA.'
- The type cell of System Output Power (30060) is split across two lines in the document ("U" / "int16"); read as Uint16 like
  its neighbours.
- The only holding register is the system clock (49998); the map has no settings or commands.
- 'Left out: line-to-line voltages, per-phase input, bypass and output apparent power, bypass powers, output crest factors
  and per-phase percent apparent power; the per-module blocks (power modules, rectifiers, DC buses, inverters, chargers and
  dischargers 1–10: alarm bits 10031–10240 and status registers 30074–30153), the multi-module totals (30154–30156), battery
  breakers 1–12 (10290–10314), the battery cabinet blocks 1–12 (10315–10470, 30199–30390) and the per-cell values (up to 200
  cells per cabinet, 30391–39990); the ECO suspend timer, the flywheel / ultra-capacitor / lithium-ion connection flags, the
  °F duplicates and pure status bits (manual and automatic battery test in progress, equalize, LBS active and inhibited, user
  operation invalid).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
