# Written from the Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170, 2026),
# tables 3.121–3.123 (Vertiv PowerUPS 9000).

modbusspec: 0
id: vertiv-powerups-9000
manufacturer: Vertiv
name: PowerUPS 9000 UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms (discrete inputs 10001 ff.; 1 = active)
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 0, type: bool}
  - {key: x.input_phase_rotation_error, label: System Input Phs Rotation Error, table: discrete, address: 1, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 2, type: bool}
  - {key: x.input_undervoltage, label: Input Under Voltage, table: discrete, address: 3, type: bool}
  - {key: x.input_backfeed, label: Input Source Backfeed, table: discrete, address: 4, type: bool, note: The battery feeds back into the input source.}
  - {key: x.input_surge_protection_alarm, label: Input Surge Protection Device Alarm, table: discrete, address: 5, type: bool}
  - {key: x.bypass_out_of_sync, label: Bypass out of sync, table: discrete, address: 6, type: bool}
  - {key: x.bypass_voltage_fault, label: Bypass Input Voltage Fault, table: discrete, address: 7, type: bool}
  - {key: x.backfeed_breaker_open, label: Backfeed Breaker Open, table: discrete, address: 8, type: bool}
  - {key: x.maintenance_bypass_breaker_closed, label: Maintenance Bypass Breaker Closed, table: discrete, address: 9, type: bool}
  - {key: x.bypass_phase_rotation_error, label: System Bypass Phase Rotation Error, table: discrete, address: 10, type: bool}
  - {key: x.bypass_surge_protection_alarm, label: Bypass Surge Protection Device Alarm, table: discrete, address: 11, type: bool}
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 12, type: bool}
  - {key: x.output_fault, label: System Output Fault, table: discrete, address: 13, type: bool}
  - {key: x.module_output_breaker_open, label: Module Output Breaker Open, table: discrete, address: 14, type: bool}
  - {key: x.control_card1_not_ready, label: System Control Card 1 Not Ready, table: discrete, address: 15, type: bool}
  - {key: x.control_card1_power_supply_failure, label: System Control Card 1 Power Supply Failure, table: discrete, address: 16, type: bool}
  - {key: x.control_card1_comm_failure, label: System Control Card 1 Communication Fail, table: discrete, address: 17, type: bool}
  - {key: x.control_card2_not_ready, label: System Control Card 2 Not Ready, table: discrete, address: 18, type: bool}
  - {key: x.control_card2_power_supply_failure, label: System Control Card 2 Power Supply Failure, table: discrete, address: 19, type: bool}
  - {key: x.control_card2_comm_failure, label: System Control Card 2 Communication Fail, table: discrete, address: 20, type: bool}
  - {key: x.bypass_module_not_ready, label: Bypass Module Not Ready, table: discrete, address: 21, type: bool}
  - {key: x.bypass_module_power_supply_failure, label: Bypass Module Power Supply Failure, table: discrete, address: 22, type: bool}
  - {key: x.bypass_module_comm_fault, label: Bypass Module Communication Fault, table: discrete, address: 23, type: bool}
  - {key: x.bypass_not_available, label: Bypass Static Switch Unavailable, table: discrete, address: 24, type: bool}
  - {key: x.bypass_backfeed, label: Bypass Backfeed Detected, table: discrete, address: 25, type: bool}
  - {key: x.bypass_scr_autonomous, label: Bypass controlling the SCR autonomously, table: discrete, address: 26, type: bool, note: Set while not all inverters are online.}
  - {key: x.bypass_excess_retransfers, label: Bypass - Excess Auto Retransfers, table: discrete, address: 27, type: bool}
  - {key: x.bypass_module_over_temperature, label: Bypass Module Over Temperature, table: discrete, address: 28, type: bool}
  - {key: x.bypass_module_fan_fault, label: Bypass Module Fan Fault, table: discrete, address: 29, type: bool}
  - {key: x.parallel_cable_failure, label: Parallel Cable Failure, table: discrete, address: 240, type: bool}
  - {key: x.parallel_comm_warning, label: Parallel Comm Warning, table: discrete, address: 241, type: bool}
  - {key: x.mms_capacity_exceeded, label: MMS Capacity Exceeded, table: discrete, address: 242, type: bool}
  - {key: x.loss_of_redundancy, label: Loss of Redundancy, table: discrete, address: 243, type: bool}
  - {key: x.hardware_mismatch, label: Hardware Mismatch, table: discrete, address: 244, type: bool}
  - {key: x.lbs_cable_failure, label: LBS Cable Failure, table: discrete, address: 245, type: bool, note: Load bus sync link.}
  - {key: x.bypass_transfer_overload, label: Transfer to Bypass - System Overload, table: discrete, address: 246, type: bool}
  - {key: x.excess_eco_suspends, label: Excess ECO Suspends, table: discrete, address: 247, type: bool}
  - {key: x.load_impact_transfer, label: Load Impact Transfer, table: discrete, address: 249, type: bool}
  - {key: x.internal_comm_failure, label: Internal Communications Failure, table: discrete, address: 250, type: bool}
  - {key: x.over_temperature, label: Equipment Over Temperature, table: discrete, address: 251, type: bool}
  - {key: x.on_generator, label: On Generator, table: discrete, address: 253, type: bool}
  - {key: x.epo_shutdown, label: System Shutdown - EPO, table: discrete, address: 255, type: bool}
  - {key: x.fuse_failure, label: Fuse Failure, table: discrete, address: 256, type: bool}
  - {key: x.ground_fault, label: Ground Fault, table: discrete, address: 257, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 258, type: bool}
  - {key: x.parameter_config_failed, label: Parameter Configuration Failed, table: discrete, address: 259, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 260, type: bool}
  - {key: x.output_disabled, label: Output Disabled, table: discrete, address: 261, type: bool}
  - {key: x.top_fan_fault, label: Top Outlet Fan Fault, table: discrete, address: 262, type: bool}
  - {key: x.eco_inhibited, label: ECO mode Inhibited, table: discrete, address: 263, type: bool}
  - {key: x.inverter_transfer_inhibit, label: Inverter Transfer Inhibit - Ext, table: discrete, address: 264, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 265, type: bool}
  - {key: x.on_maintenance_bypass, label: Output Load on Maint. Bypass, table: discrete, address: 266, type: bool}
  - {key: x.transformer_over_temperature, label: Transformer Overtemperature, table: discrete, address: 267, type: bool}
  - {key: x.control_cards_missing, label: System Control Cards Missing, table: discrete, address: 268, type: bool}
  - {key: x.loss_of_control_redundancy, label: Loss of Control Redundancy, table: discrete, address: 269, type: bool}
  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 270, type: bool}
  - {key: x.battery_charging_inhibited, label: Battery Charging Inhibited, table: discrete, address: 271, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 272, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 275, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 276, type: bool}
  - {key: x.battery_ground_fault, label: Battery Ground Fault, table: discrete, address: 277, type: bool}
  - {key: x.battery_not_qualified, label: Battery Not Qualified, table: discrete, address: 278, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 279, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 280, type: bool}
  - {key: x.battery_equalize_timeout, label: Battery Charge Equalization Timeout, table: discrete, address: 281, type: bool}
  - {key: x.battery_room_alarm, label: Battery Room Alarm, table: discrete, address: 282, type: bool}
  - {key: x.battery_terminal_abnormal, label: Battery Terminal Abnormal, table: discrete, address: 284, type: bool}
  - {key: x.battery_comm_abnormal, label: Battery System Communication Abnormal, table: discrete, address: 285, type: bool}
  - {key: x.battery_system_warning, label: Battery System Warning, table: discrete, address: 286, type: bool}
  - {key: x.battery_system_fault, label: Battery System Fault, table: discrete, address: 287, type: bool}
  - {key: x.main_battery_breaker_open, label: Main Battery Circuit Breaker is Open, table: discrete, address: 288, type: bool}
  - {key: x.main_battery_breaker_open_failure, label: Main Battery Breaker Open Failure, table: discrete, address: 301, type: bool}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS A-N, table: input, address: 3, type: u16, unit: V}
  - {key: x.input_voltage_l2, label: System Input RMS B-N, table: input, address: 4, type: u16, unit: V}
  - {key: x.input_voltage_l3, label: System Input RMS C-N, table: input, address: 5, type: u16, unit: V}
  - {key: x.input_current_l1, label: System Input RMS Current Phase A, table: input, address: 6, type: u16, unit: A}
  - {key: x.input_current_l2, label: System Input RMS Current Phase B, table: input, address: 7, type: u16, unit: A}
  - {key: x.input_current_l3, label: System Input RMS Current Phase C, table: input, address: 8, type: u16, unit: A}
  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 9, type: u16, unit: Hz, scale: 0.1}
  - {key: x.input_power_factor_l1, label: System Input Power Factor Phs A, table: input, address: 10, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l2, label: System Input Power Factor Phs B, table: input, address: 11, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l3, label: System Input Power Factor Phs C, table: input, address: 12, type: u16, scale: 0.01}
  - {key: x.input_power_l1, label: System Input Power Phase A, table: input, address: 13, type: u16, unit: W, scale: 100}
  - {key: x.input_power_l2, label: System Input Power Phase B, table: input, address: 14, type: u16, unit: W, scale: 100}
  - {key: x.input_power_l3, label: System Input Power Phase C, table: input, address: 15, type: u16, unit: W, scale: 100}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 19, type: u16, poll: slow}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 20, type: u16, poll: slow}
  - {key: x.rectifier_isolation_breaker, label: Rectifier Isolation Breaker, table: input, address: 21, type: u16, enum: breaker}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS A-N, table: input, address: 25, type: u16, unit: V}
  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage RMS B-N, table: input, address: 26, type: u16, unit: V}
  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage RMS C-N, table: input, address: 27, type: u16, unit: V}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 28, type: u16, unit: Hz, scale: 0.1}
  - {key: x.bypass_isolation_breaker, label: Bypass Isolation Breaker, table: input, address: 35, type: u16, enum: breaker}
  - {key: x.maintenance_bypass_breaker, label: Maintenance Bypass Breaker, table: input, address: 36, type: u16, enum: breaker}
  # Output
  - {key: l1_voltage, label: System Output Voltage RMS A-N, table: input, address: 40, type: u16, unit: V}
  - {key: l2_voltage, label: System Output Voltage RMS B-N, table: input, address: 41, type: u16, unit: V}
  - {key: l3_voltage, label: System Output Voltage RMS C-N, table: input, address: 42, type: u16, unit: V}
  - {key: l1_current, label: System Output RMS Current Phs A, table: input, address: 43, type: u16, unit: A}
  - {key: l2_current, label: System Output RMS Current Phs B, table: input, address: 44, type: u16, unit: A}
  - {key: l3_current, label: System Output RMS Current Phs C, table: input, address: 45, type: u16, unit: A}
  - {key: frequency, label: System Output Frequency, table: input, address: 49, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_power_factor_l1, label: System Output Power Factor Phs A, table: input, address: 50, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l2, label: System Output Power Factor Phs B, table: input, address: 51, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l3, label: System Output Power Factor Phs C, table: input, address: 52, type: u16, scale: 0.01}
  - {key: x.output_power_l1, label: System Output Power Phase A, table: input, address: 53, type: u16, unit: W, scale: 100}
  - {key: x.output_power_l2, label: System Output Power Phase B, table: input, address: 54, type: u16, unit: W, scale: 100}
  - {key: x.output_power_l3, label: System Output Power Phase C, table: input, address: 55, type: u16, unit: W, scale: 100}
  - {key: x.output_power, label: System Output Power, table: input, address: 59, type: u16, unit: W, scale: 1000}
  - {key: apparent_power, label: System Output Apparent Power, table: input, address: 60, type: u16, unit: VA, scale: 1000, note: The document gives this in whole kVA.}
  - {key: x.output_load_l1, label: System Output Pct Power Phase A, table: input, address: 64, type: u16, unit: '%'}
  - {key: x.output_load_l2, label: System Output Pct Power Phase B, table: input, address: 65, type: u16, unit: '%'}
  - {key: x.output_load_l3, label: System Output Pct Power Phase C, table: input, address: 66, type: u16, unit: '%'}
  - {key: x.module_output_breaker, label: Module Output Breaker, table: input, address: 67, type: u16, enum: breaker}
  - {key: x.maintenance_isolation_breaker, label: Maintenance Isolation Breaker, table: input, address: 68, type: u16, enum: breaker}
  # Control cards and bypass module
  - {key: x.control_card1_status, label: System Control Card 1 Operating Status, table: input, address: 69, type: u16, enum: operating_status}
  - {key: x.control_card2_status, label: System Control Card 2 Operating Status, table: input, address: 70, type: u16, enum: operating_status}
  - {key: x.bypass_module_status, label: Bypass Module Operating Status, table: input, address: 71, type: u16, enum: operating_status}
  - {key: x.static_bypass_switch, label: Static Bypass Switch, table: input, address: 72, type: u16, enum: off_on}
  # System
  - {key: x.active_power_modules, label: Number Of Active Power Modules, table: input, address: 156, type: u16}
  - {key: x.installed_power_modules, label: Number of Installed Power Modules, table: input, address: 157, type: u16, poll: slow}
  - {key: x.redundant_power_modules, label: Redundant Count of Power Module, table: input, address: 158, type: u16, poll: slow}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 159, type: s16, unit: °C, note: The document types it Uint16; the register after it holds the same in °F.}
  - {key: x.efficiency, label: Average system efficiency, table: input, address: 161, type: u16, unit: '%', scale: 0.1}
  - {key: x.operating_time, label: Total System Operating Time, table: input, address: 163, type: u32, unit: h, poll: slow}
  - {key: x.application_mode, label: Application Mode For UPS, table: input, address: 165, type: u16, enum: application_mode, poll: slow}
  - {key: x.loading_status, label: UPS Loading Status, table: input, address: 166, type: u16, enum: loading_status}
  - {key: state, label: UPS Output Source, table: input, address: 167, type: u16, enum: output_source}
  - {key: x.system_status, label: System Status, table: input, address: 168, type: u16, enum: system_status}
  - {key: x.inverter_state, label: Inverter On/Off State, table: input, address: 169, type: u16, enum: off_on}
  - {key: x.system_time, label: System Date and Time, table: input, address: 9997, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow, note: UTC; writable at 49998.}
  # Configuration
  - {key: x.system_capacity, label: System Capacity, table: input, address: 170, type: u16, unit: VA, scale: 1000, poll: slow, note: Capacity of the installed power modules.}
  - {key: x.input_nominal_voltage, label: System Input Nominal Voltage, table: input, address: 171, type: u16, unit: V, poll: slow}
  - {key: x.input_nominal_current, label: System Input Nominal Current, table: input, address: 172, type: u16, unit: A, poll: slow}
  - {key: x.bypass_nominal_voltage, label: Bypass Nominal Voltage, table: input, address: 173, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 174, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 175, type: u16, unit: Hz, scale: 0.1, poll: slow}
  # Battery
  - {key: x.battery_type, label: Battery type, table: input, address: 176, type: u16, enum: battery_type, poll: slow}
  - {key: x.main_battery_breaker, label: Main Battery Circuit Breaker, table: input, address: 180, type: u16, enum: breaker}
  - {key: x.ebc_count, label: External Battery Cabinet Count, table: input, address: 181, type: u16, poll: slow}
  - {key: x.battery_string_count, label: Battery String Count, table: input, address: 182, type: u16, poll: slow}
  - {key: battery_voltage, label: DC Bus Voltage, table: input, address: 183, type: u16, unit: V, note: DC bus voltage at the battery input.}
  - {key: battery_current, label: DC Bus Current, table: input, address: 184, type: s16, unit: A, scale: 0.1, positive: charge, note: Current at the battery input terminals.}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 185, type: s16, unit: °C, scale: 0.1, note: The register after it holds the same in °F.}
  - {key: battery_soc, label: Battery Percentage Charge, table: input, address: 187, type: u16, unit: '%'}
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 188, type: u16, unit: min}
  - {key: x.battery_discharge_count, label: Number of Discharge Cycles, table: input, address: 189, type: u16, poll: slow}
  - {key: x.battery_discharge_time, label: Accumulated Discharge Time, table: input, address: 190, type: u16, unit: h, scale: 0.01, poll: slow}
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 191, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery is, table: input, address: 192, type: u16, enum: charge_status}
  - {key: x.automatic_battery_test, label: Automatic Battery Test, table: input, address: 193, type: u16, enum: disabled_enabled, poll: slow}
  - {key: x.battery_test_cycle, label: Battery Self Test Cycle Time, table: input, address: 194, type: u16, unit: d, poll: slow}
  - {key: x.next_battery_test, label: Time Until Next Auto Battery Test, table: input, address: 195, type: u32, unit: min, poll: slow}
  - {key: x.low_battery_warning_time, label: Low Battery Warning Time, table: input, address: 197, type: u16, unit: min, poll: slow}

enums:
  breaker: {'0': Open, '1': Closed, '2': Not installed}
  operating_status: {'0': Normal, '1': Warning, '2': Alarm, '4': Fault}
  application_mode: {'0': UPS, '1': Frequency converter, '2': Intelligent paralleling, '3': Intelligent paralleling demo, '4': ECO, '5': Intelligent ECO, '6': Intelligent ECO demo, '7': Testing, '8': Regen, '9': Power conditioner, '10': Frequency converter without battery, '11': Dynamic online, '12': Dynamic online demo}
  loading_status: {'1': Load on other module, '2': Load off, '3': Load on inverter, '4': Load on bypass, '5': Load on maintenance bypass, '6': Load on battery, '7': Load on shared source}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  battery_type: {'0': VRLA, '1': Lithium}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

problems:
