notes:
- Covers the Liebert EXM2 and the APM Plus, which share one register map in the document.
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU120 network card in the UPS, over Modbus TCP or RTU
  (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1). Voltages and currents have no scale
  (1 V, 1 A). Per-phase powers come in 0.1 kW / kVA, the output totals in whole kW / kVA.
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current (DC Bus Current): + = charging, − = discharging (stated in the glossary).'
- The rectifier, inverter and fuse alarms of the power modules exist only per module. Only module 1 is listed here; modules
  2–20 repeat its alarms every 28 discrete inputs (10092, 10120 … 10624) and its status registers every 14 input registers
  (30630, 30644 … 30896).
- 'Left out: line-to-line input, bypass and output voltages, the bypass active and apparent powers per phase (30426–30431),
  the output current crest factors, the alarms and status of power modules 2–20, the per-cabinet battery values (cabinets
  1–8 at 30469 ff. and 9–20 at 30975 ff., every 13 registers: temperature, °F temperature, voltage), the °F duplicates of
  the temperatures and the event-only discrete input User Operation Invalid (10658). The map has no settings or commands apart
  from the clock.'
- The card has no model or serial number registers, so there is no identify block.
