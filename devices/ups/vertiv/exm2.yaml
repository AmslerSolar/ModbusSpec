  - {key: x.battery_self_test, label: Battery Self Test, table: discrete, address: 35, type: bool}
  - {key: x.battery_charging_inhibited, label: Battery Charging Inhibited, table: discrete, address: 36, type: bool}
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 37, type: bool}
