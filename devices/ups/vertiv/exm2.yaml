  # Input
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 0, type: bool}
  - {key: x.input_phase_rotation_error, label: System Input Phs Rotation Error, table: discrete, address: 1, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 2, type: bool}
  - {key: x.input_backfeed, label: Input Source Backfeed, table: discrete, address: 3, type: bool}
  # Bypass
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 14, type: bool}
  - {key: x.static_switch_unavailable, label: Bypass Static Switch Unavailable, table: discrete, address: 15, type: bool}
  - {key: x.bypass_excess_retransfers, label: Bypass - Excess Auto Retransfers, table: discrete, address: 16, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 17, type: bool}
