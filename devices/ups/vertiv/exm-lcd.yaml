notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) network card in the UPS, over Modbus TCP or RTU (RS485, 9600,
  19200 or 38400 baud, 8N1).
- This map is for the Liebert EXM with the LCD HMI controller. The EXM with the touchscreen HMI controller has a different
  map (vertiv-exm-touch). The first input registers (30385–30397) are the same in both, and the card has no register that
  tells the two apart, so pick the file by the controller type of the UPS.
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1). Voltages and currents have no scale
  (1 V, 1 A); powers come in whole kW / kVA.
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current (DC Bus Current): + = charging, − = discharging (stated in the glossary). Battery voltage and temperature
  are the values of a battery cabinet.'
- 'Left out: line-to-line input, bypass and output voltages, the output current crest factors, the °F duplicates of the temperatures
  and the event-only discrete input User Operation Invalid (10050). The map has no settings or commands apart from the clock.'
- The card has no model or serial number registers, so there is no identify block.
