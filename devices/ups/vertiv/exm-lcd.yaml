  - {key: x.efficiency_mode, label: Advanced Efficiency Mode, table: input, address: 490, type: u16, enum: efficiency_mode}
  - {key: x.application_mode, label: Application Mode For UPS, table: input, address: 491, type: u16, enum: application_mode, poll: slow}
