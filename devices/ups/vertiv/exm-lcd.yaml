  - {key: x.bypass_nominal_voltage, label: Bypass Nominal Voltage, table: input, address: 504, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_voltage, label: System Output Nominal Voltage, table: input, address: 505, type: u16, unit: V, poll: slow}
  - {key: x.output_nominal_frequency, label: System Output Nominal Frequency, table: input, address: 506, type: u16, unit: Hz, scale: 0.1, poll: slow}
  # System
  - {key: x.operating_time, label: Total System Operating Time, table: input, address: 517, type: u32, unit: h, poll: slow}
  - {key: x.efficiency, label: Average system efficiency, table: input, address: 519, type: u16, unit: '%', scale: 0.1}
  - {key: temperature, label: Inlet Air Temperature, table: input, address: 520, type: u16, unit: °C, note: 'The document gives Uint16, so temperatures below 0 °C can''t be shown. The register after it holds the same in °F.'}
  - {key: x.system_time, label: System Date and Time, table: input, address: 9997, type: u32, unit: s, epoch: {start: '1970-01-01', unit: s}, poll: slow, note: UTC; writable at 49998.}

enums:
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  breaker: {'0': Open, '1': Closed, '2': Not installed}
  ups_application_mode: {'0': UPS mode, '1': Frequency converter mode}
  efficiency_mode: {'0': Unknown, '1': ECO mode, '2': Intelligent ECO mode, '3': Active inverter ECO mode}
  application_mode: {'0': UPS mode, '1': Frequency converter mode, '2': Intelligent paralleling mode, '3': Intelligent paralleling mode demo, '4': ECO mode, '5': Intelligent ECO mode, '6': Intelligent ECO mode demo, '7': Testing mode, '8': Regen mode, '9': Power conditioner mode}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

