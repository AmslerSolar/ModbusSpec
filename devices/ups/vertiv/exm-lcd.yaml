  - {key: x.input_power_factor_l2, label: System Input Power Factor Phs B, table: input, address: 395, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l3, label: System Input Power Factor Phs C, table: input, address: 396, type: u16, scale: 0.01}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS A-N, table: input, address: 407, type: u16, unit: V}
