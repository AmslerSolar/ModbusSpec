  - {key: x.battery_discharge_time, label: Accumulated Discharge Time, table: input, address: 181, type: u16, unit: h, scale: 0.01, poll: slow}
  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 182, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery is, table: input, address: 183, type: u16, enum: charge_status}
