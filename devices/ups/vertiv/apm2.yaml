  - {key: x.ground_fault, label: Ground Fault, table: discrete, address: 245, type: bool}
  - {key: x.fan_failure, label: System Fan Failure, table: discrete, address: 246, type: bool}
  - {key: x.parameter_config_failed, label: Parameter Configuration Failed, table: discrete, address: 247, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 248, type: bool}
  - {key: x.output_disabled, label: Output Disabled, table: discrete, address: 249, type: bool}
  - {key: x.top_outlet_fan_fault, label: Top Outlet Fan Fault, table: discrete, address: 250, type: bool}
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 253, type: bool}
