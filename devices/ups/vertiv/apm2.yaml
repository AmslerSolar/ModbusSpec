enums:
  breaker: {'0': Open, '1': Closed, '2': Not installed}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  loading_status: {'1': Load on other module, '2': Load off, '3': Load on inverter, '4': Load on bypass, '5': Load on maintenance bypass, '6': Load on battery, '7': Load on shared source}
  application_mode: {'0': UPS, '1': Frequency converter, '2': Intelligent paralleling, '3': Intelligent paralleling demo, '4': ECO, '5': Intelligent ECO, '6': Intelligent ECO demo, '7': Testing, '8': Regen, '9': Power conditioner, '10': Frequency converter without battery, '11': Dynamic online, '12': Dynamic online demo}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  battery_type: {'0': VRLA, '1': Lithium}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}

