notes:
- One register map covers the Liebert APM2, Liebert Industry S, Liebert EPM and Liebert EXL-P1 UPS.
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the UPS, over Modbus TCP
  or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1). Powers the document gives in kW / kVA
  are converted to W / VA here.
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- This map has no UPS Output Source register; state is the UPS Loading Status (6 = load on battery).
- 'DC bus current: + = charging, − = discharging (stated in the glossary).'
- 'Left out: line-to-line input, bypass and output voltages, input and bypass apparent powers, bypass powers, output crest
  factors, per-phase output apparent powers and VA percentages, the isolation breaker states, the °F duplicates, the per-unit
  blocks (2 system control cards, bypass module status alarms, 10 power modules with their rectifier, DC bus, inverter, charger
  and discharger alarms and states, the battery circuit breakers 1–12, battery cabinets 2–9, battery modules, lithium-ion
  modules, cells and the 12 battery strings) and the event-only alarms (self test, manual and auto test in progress, equalize,
  ECO suspends, user operation invalid, load impact transfer, LBS states, ECO inhibited, external transfer inhibit).'
- 'The document has doubtful spots: the battery cabinet blocks start at cabinet 2 (alarms 10312 ff., registers 30207 ff.;
  cabinet 1 is not listed), the lithium-ion / flywheel / ultra-capacitor connected and main battery breaker registers are
  numbered 39342–39345 without a register count, the battery string registers are numbered 309346–309513 (six digits), and
  the first string''s battery temperature is given twice in °F.'
- The card has no model or serial number registers, so there is no identify block.
