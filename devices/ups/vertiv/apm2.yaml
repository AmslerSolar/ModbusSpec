  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 261, type: bool}
  - {key: x.battery_low, label: Battery Low, table: discrete, address: 262, type: bool}
  - {key: x.battery_ground_fault, label: Battery Ground Fault, table: discrete, address: 263, type: bool}
  - {key: x.battery_not_qualified, label: Battery Not Qualified, table: discrete, address: 264, type: bool}
  - {key: x.battery_terminals_reversed, label: Battery Terminals Reversed, table: discrete, address: 265, type: bool}
  - {key: x.replace_battery, label: Replace Battery, table: discrete, address: 266, type: bool}
  - {key: x.battery_equalization_timeout, label: Battery Charge Equalization Timeout, table: discrete, address: 267, type: bool}
  - {key: x.battery_room_alarm, label: Battery Room Alarm, table: discrete, address: 268, type: bool}
  - {key: x.battery_terminal_abnormal, label: Battery Terminal Abnormal, table: discrete, address: 270, type: bool}
  - {key: x.battery_system_comm_abnormal, label: Battery System Communication Abnormal, table: discrete, address: 271, type: bool}
