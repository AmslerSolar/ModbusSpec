  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 20, type: u16, poll: slow}
  - {key: x.rectifier_isolation_breaker, label: Rectifier Isolation Breaker, table: input, address: 21, type: u16, enum: breaker}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS A-N, table: input, address: 25, type: u16, unit: V}
  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage RMS B-N, table: input, address: 26, type: u16, unit: V}
  - {key: x.bypass_voltage_l3, label: Bypass Input Voltage RMS C-N, table: input, address: 27, type: u16, unit: V}
