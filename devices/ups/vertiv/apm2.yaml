modbusspec: 0
id: vertiv-apm2
manufacturer: Vertiv
name: Liebert APM2 / Industry S / EPM / EXL-P1 UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms: Input
  - {key: x.input_neutral_lost, label: Mains Input Neutral Lost, table: discrete, address: 0, type: bool}
  - {key: x.input_phase_rotation_error, label: System Input Phs Rotation Error, table: discrete, address: 1, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 2, type: bool}
  - {key: x.input_under_voltage, label: Input Under Voltage, table: discrete, address: 3, type: bool}
  - {key: x.input_source_backfeed, label: Input Source Backfeed, table: discrete, address: 4, type: bool}
  - {key: x.input_spd_alarm, label: Input Surge Protection Device Alarm, table: discrete, address: 639, type: bool}
  # Bypass
  - {key: x.bypass_out_of_sync, label: Bypass out of sync, table: discrete, address: 5, type: bool}
  - {key: x.bypass_voltage_fault, label: Bypass Input Voltage Fault, table: discrete, address: 6, type: bool}
  - {key: x.backfeed_breaker_open, label: Backfeed Breaker Open, table: discrete, address: 7, type: bool}
  - {key: x.maintenance_bypass_closed, label: Maintenance Bypass Breaker Closed, table: discrete, address: 8, type: bool}
  - {key: x.bypass_phase_rotation_error, label: System Bypass Phase Rotation Error, table: discrete, address: 9, type: bool}
  - {key: x.bypass_switch_unavailable, label: Bypass Static Switch Unavailable, table: discrete, address: 22, type: bool}
  - {key: x.bypass_backfeed, label: Bypass Backfeed Detected, table: discrete, address: 23, type: bool}
  - {key: x.bypass_excess_retransfers, label: Bypass - Excess Auto Retransfers, table: discrete, address: 25, type: bool}
  - {key: x.bypass_module_over_temperature, label: Bypass Module Over Temperature, table: discrete, address: 26, type: bool}
  - {key: x.bypass_module_fan_fault, label: Bypass Module Fan Fault, table: discrete, address: 27, type: bool}
  - {key: x.bypass_spd_alarm, label: Bypass Surge Protection Device Alarm, table: discrete, address: 640, type: bool}
