  - {key: x.output_power, label: System Output Power, table: input, address: 474, type: u16, unit: W, scale: 10, note: The document gives kW with scale 100.}
  - {key: x.output_power_l1, label: System Output Power L1, table: input, address: 475, type: u16, unit: W, scale: 10}
  - {key: x.output_power_l2, label: System Output Power L2, table: input, address: 476, type: u16, unit: W, scale: 10}
