  - {key: x.input_frequency, label: System Input Frequency, table: input, address: 404, type: u16, unit: Hz, scale: 0.01}
  - {key: x.input_power_factor_l1, label: System Input Power Factor L1, table: input, address: 405, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l2, label: System Input Power Factor L2, table: input, address: 406, type: u16, scale: 0.01}
  - {key: x.input_power_factor_l3, label: System Input Power Factor L3, table: input, address: 407, type: u16, scale: 0.01}
  - {key: x.brownout_count, label: System Input Brown Out Count, table: input, address: 408, type: u16, poll: slow}
  - {key: x.blackout_count, label: System Input Black Out Count, table: input, address: 409, type: u16, poll: slow}
  # Bypass
  - {key: x.bypass_voltage_l1, label: Bypass Input Voltage RMS L1-N, table: input, address: 420, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_voltage_l2, label: Bypass Input Voltage RMS L2-N, table: input, address: 421, type: u16, unit: V, scale: 0.1}
  - {key: x.bypass_frequency, label: Bypass Input Frequency, table: input, address: 423, type: u16, unit: Hz, scale: 0.01}
  - {key: x.bypass_transfer_count, label: Number Of Transfers To Bypass, table: input, address: 424, type: u16, poll: slow}
  - {key: x.bypass_qualification, label: Bypass Qualification Status, table: input, address: 425, type: u16, enum: qualification}
  # Battery
  - {key: x.battery_time_remaining, label: Battery Time Remaining, table: input, address: 436, type: u16, unit: min}
  - {key: battery_voltage, label: Battery Volts for Cabinet, table: input, address: 437, type: u16, unit: V, scale: 0.1}
