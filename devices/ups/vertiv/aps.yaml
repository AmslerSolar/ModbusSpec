  - {key: x.battery_status, label: UPS Battery Status, table: input, address: 440, type: u16, enum: battery_status}
  - {key: x.battery_charge_status, label: Battery is, table: input, address: 441, type: u16, enum: charge_status}
  - {key: battery_temperature, label: Battery Temperature, table: input, address: 442, type: s16, unit: °C, scale: 0.1, note: Highest temperature of all installed battery modules.}
