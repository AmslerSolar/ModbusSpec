  - {key: x.output_power_factor_l1, label: System Output Power Factor L1, table: input, address: 469, type: u16, scale: 0.01}
  - {key: x.output_power_factor_l2, label: System Output Power Factor L2, table: input, address: 470, type: u16, scale: 0.01}
