  - {key: x.auto_restart, label: Auto Restart, table: input, address: 518, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.auto_restart_delay, label: Auto Restart Delay, table: input, address: 519, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.auto_restart_min_battery, label: Auto Restart Minimum Battery Setting, table: input, address: 520, type: u16, enum: restart_min_battery, poll: slow, writable: true}
  - {key: x.no_load_warning_current, label: No Load Warning Current Threshold, table: input, address: 521, type: s16, unit: A, poll: slow, writable: true}
  - {key: x.no_load_warning_delay, label: No Load Warning Delay, table: input, address: 522, type: u16, unit: min, poll: slow, writable: true}

enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  qualification: {'0': Fail, '1': Marginal low, '2': Normal, '3': Marginal high}
  battery_status: {'1': Unknown, '2': Normal, '3': Low, '4': Depleted}
  charge_status: {'0': Fully charged, '1': Charging, '2': Discharging, '3': Not charging (charger off)}
  test_interval: {'0': 8 weeks, '1': 12 weeks, '2': 16 weeks, '3': 20 weeks, '4': 26 weeks}
  output_source: {'1': Other, '2': 'Off', '3': Normal, '4': Bypass, '5': Battery, '6': Booster, '7': Reducer}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  module_status: {'0': Normal, '1': Warning, '2': Alarm, '4': Fault}
  charger_mode: {'0': Not charging, '1': Float charging, '2': Current limit charging, '3': Equalize charging}
  redundancy: {'0': No redundancy, '1': Redundancy}
  restart_min_battery: {'0': 0 %, '1': 10 %, '2': 20 %, '3': 30 %, '4': 40 %, '5': 50 %, '6': 60 %, '7': 70 %, '8': 80 %, '9': 90 %}
  off_on: {'0': 'Off', '1': 'On'}
  disabled_enabled: {'0': Disabled, '1': Enabled}

