modbusspec: 0
id: vertiv-aps
manufacturer: Vertiv
name: Liebert APS UPS (IntelliSlot / RDU card)
kind: ups

sources:
- title: Vertiv Liebert IntelliSlot Modbus and BACnet Protocols Reference Guide (SL-28170)
  version: '2026'
  url: https://www.vertiv.com/4a4eab/globalassets/shared/vertiv-liebert-intellislot-modbus-and-bacnet-protocols-reference-guide-sl-28170.pdf
  sha256: 603a4e0dcf3949ffebc49a9741fac5c73cf8558f5d984284db9d892f3394ca19

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    min_interval_ms: 500

encoding:
  byte_order: big
  word_order: big

points:
  # Alarms: Input
  - {key: x.rectifier_failure, label: Rectifier Failure, table: discrete, address: 0, type: bool}
  - {key: x.input_power_problem, label: System Input Power Problem, table: discrete, address: 1, type: bool}
  - {key: x.input_current_imbalance, label: System Input Current Imbalance, table: discrete, address: 2, type: bool}
  # Bypass
  - {key: x.on_bypass, label: UPS Output on Bypass, table: discrete, address: 13, type: bool}
  - {key: x.on_maintenance_bypass, label: Output Load on Maint. Bypass, table: discrete, address: 14, type: bool}
  - {key: x.bypass_not_available, label: Bypass Not Available, table: discrete, address: 15, type: bool}
  - {key: x.bypass_overload, label: Bypass Overload, table: discrete, address: 16, type: bool}
  - {key: x.bypass_frequency_error, label: Bypass Frequency Error, table: discrete, address: 17, type: bool}
  - {key: x.bypass_retransfer_failed, label: Bypass Auto Retransfer Failed, table: discrete, address: 18, type: bool}
  # Battery
  - {key: x.battery_discharging, label: Battery Discharging, table: discrete, address: 29, type: bool}
  - {key: x.battery_test_passed, label: Battery Test Passed, table: discrete, address: 32, type: bool}
  - {key: x.battery_test_failed, label: Battery Test Failed, table: discrete, address: 33, type: bool}
  - {key: x.battery_low_shutdown_imminent, label: Low Battery - Shutdown Imminent, table: discrete, address: 34, type: bool}
  - {key: x.battery_module_fault, label: Battery Module Fault, table: discrete, address: 35, type: bool}
  - {key: x.battery_module_warning, label: Battery Module Warning, table: discrete, address: 36, type: bool}
  - {key: x.battery_over_temperature, label: Battery Over Temperature, table: discrete, address: 37, type: bool}
  - {key: x.battery_temperature_imbalance, label: Battery Temperature Imbalance, table: discrete, address: 38, type: bool}
  # Output
  - {key: x.output_overload, label: Output Overload, table: discrete, address: 49, type: bool}
  - {key: x.output_off_pending, label: Output Off Pending, table: discrete, address: 50, type: bool}
  - {key: x.output_off, label: System Output Off, table: discrete, address: 51, type: bool}
  - {key: x.transformer_over_temperature_shutdown, label: System Shutdown - Transformer Over Temperature, table: discrete, address: 52, type: bool}
  - {key: x.inverter_overload_shutdown, label: Inverter Shutdown - Overload, table: discrete, address: 53, type: bool}
  - {key: x.output_short_shutdown, label: System Shutdown - Output Short, table: discrete, address: 54, type: bool}
  - {key: x.low_battery_shutdown, label: System Shutdown - Low Battery, table: discrete, address: 55, type: bool}
  - {key: x.remote_shutdown, label: System Shutdown - Remote Shutdown, table: discrete, address: 56, type: bool}
  - {key: x.hardware_fault_shutdown, label: System Shutdown - Hardware Fault, table: discrete, address: 57, type: bool}
  - {key: x.max_load_alarm, label: Maximum Load Alarm, table: discrete, address: 58, type: bool}
  # Inverter
  - {key: x.loss_of_redundancy, label: Loss of Redundancy, table: discrete, address: 69, type: bool}
  - {key: x.power_module_failure, label: Power Module Failure, table: discrete, address: 70, type: bool}
  - {key: x.power_module_warning, label: Power Module Warning, table: discrete, address: 71, type: bool}
  # System status
  - {key: x.general_event, label: Unspecified General Event, table: discrete, address: 82, type: bool}
  - {key: x.check_air_filter, label: Check Air Filter, table: discrete, address: 83, type: bool}
  - {key: x.frame_fan_fault, label: Frame Fan Fault, table: discrete, address: 84, type: bool}
  - {key: x.transformer_fan_fault, label: Transformer Fan Fault, table: discrete, address: 85, type: bool}
  - {key: x.transformer_over_temperature, label: Transformer Overtemperature, table: discrete, address: 86, type: bool}
  - {key: x.no_load_warning, label: No Load Warning, table: discrete, address: 87, type: bool}
  - {key: x.charger_module_fan_fault, label: Charger Module Fan Fault, table: discrete, address: 1268, type: bool}
  # Protocol
  - {key: x.server_class, label: Server Class, table: input, address: 384, type: u16, enum: server_class, poll: slow}
  # Input
  - {key: x.input_voltage_l1, label: System Input RMS L1-N, table: input, address: 395, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l2, label: System Input RMS L2-N, table: input, address: 396, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_l3, label: System Input RMS L3-N, table: input, address: 397, type: u16, unit: V, scale: 0.1}
