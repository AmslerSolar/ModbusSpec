notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU120 network card in the UPS, over Modbus TCP or RTU
  (RS485, 9600, 19200 or 38400 baud, 8N1).
- The map covers the Liebert EXS 15–30 kVA (208 V) and 30–80 kVA (400 V) models; the other Liebert EXS models have a different
  map.
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1). Voltages and currents here have no
  scale (whole volts and amperes).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'Battery current: + = charging, − = discharging (stated in the glossary).'
- The document marks 30434 (DC bus current with scale 100) as deprecated; the current is read from 30448 (scale 10).
- Replace Battery (10156) is listed with the battery alarms although its number comes after the system status block (10128–10145).
- The map has two power module alarm blocks (modules 1 and 2) and no system-wide rectifier or inverter failure bits.
- There are no writable settings apart from the system clock and a lithium battery wake-up command.
- 'Left out: the per-group lithium battery alarms and values (16 groups, discrete 10167 ff. in steps of 25, input 30629 ff.
  in steps of 13; only group 1 values are included), battery cabinets 2–4 (30471 ff. in steps of 13), the °F duplicates, the
  line-to-line bypass voltages, output current crest factors, power module sleep status, the lithium manual wake-up event
  and command (10573, 40839) and the informational LBS and user operation bits (kept as points without problems).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
