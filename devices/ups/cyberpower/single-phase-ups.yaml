modbusspec: 0
id: cyberpower-single-phase-ups
manufacturer: CyberPower
name: Single-phase UPS (network management card)
kind: ups

sources:
- id: cyberpower-modbus-ha
  title: cyberpower-modbus-ha (Home Assistant integration)
  url: https://github.com/aburow/cyberpower-modbus-ha
  license: AGPL-3.0-or-later
  commit: 60f69e3a0701bb58ece108a1d10faa0ff533a293
  path: custom_components/cyberpower_modbus/registers_single_phase.py, custom_components/cyberpower_modbus/sensor_catalog_unified.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - cyberpower-modbus-ha

points:
  - {key: x.hardware_fault, label: Hardware Fault, table: holding, address: 8192, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.utility_frequency_out_of_range, label: Utility Frequency Out of Range, table: holding, address: 8200, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.inverter_off, label: Inverter Off, table: holding, address: 8201, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.battery_not_present, label: Battery Not Present, table: holding, address: 8206, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.battery_discharging, label: On Battery, table: holding, address: 8209, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.battery_charging, label: Battery Charging, table: holding, address: 8210, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.battery_fully_charged, label: Battery Fully Charged, table: holding, address: 8212, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.buzzer_muted, label: Buzzer Muted, table: holding, address: 8224, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.runtime_low, label: Runtime Low, table: holding, address: 8225, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.no_output, label: No Output, table: holding, address: 8226, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.over_temperature, label: Over Temperature, table: holding, address: 8860, type: u16, note: 'State register: 0 = no, non-zero = yes.'}
  - {key: x.utility_voltage, label: Input Voltage, table: holding, address: 12288, type: u16, unit: V, scale: 0.1}
  - {key: x.utility_frequency, label: Input Frequency, table: holding, address: 12289, type: u16, unit: Hz, scale: 0.1}
  - {key: x.output_voltage, label: Output Voltage, table: holding, address: 12320, type: u16, unit: V, scale: 0.1}
  - {key: x.output_load_percent, label: Output Load, table: holding, address: 12327, type: u16, unit: '%'}
  - {key: battery_soc, label: Battery State of Charge, table: holding, address: 12418, type: u16, unit: '%'}
  - {key: x.runtime_remaining, label: Runtime Remaining, table: holding, address: 12419, type: u32, unit: min, scale: 0.1, word_order: little}
  - {key: x.battery_threshold, label: Battery Threshold, table: holding, address: 12435, type: u16, unit: '%'}
  - {key: x.runtime_threshold, label: Runtime Threshold, table: holding, address: 12436, type: u16, unit: s}

notes:
- Only holding registers (FC03) work; the project reports input-register reads fail.
- Output power and energy are read over SNMP by the project, not Modbus.
- The project checked this map on a real device (network card RMCARD205).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
