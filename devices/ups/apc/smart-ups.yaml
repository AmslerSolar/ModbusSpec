modbusspec: 0
id: apc-smart-ups
manufacturer: APC
name: Smart-UPS (older models, not SMT / SMX / SRT)
kind: ups

sources:
- id: apc-modbus-snmp-ha
  title: apc-modbus-snmp-ha (Home Assistant integration)
  url: https://github.com/aburow/apc-modbus-snmp-ha
  license: AGPL-3.0-or-later
  commit: 41e9a6b22a4c63a713e8aa8ef25a54a5a1e41622
  path: custom_components/apc_modbus/registers_smart_ups.py
- id: modbus-devices
  title: Modbus_Devices (Home Assistant integration)
  url: https://github.com/dk-1983/Modbus_Devices
  license: MIT
  commit: 88460d5b9db9b7cb3abb0032de81a562522ec8b7
  path: custom_components/modbus_devices/equipment/apc.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - apc-modbus-snmp-ha

points:
  - {key: x.status_word_0, label: Status word 0, table: holding, address: 0, type: u16}
  - {key: x.status_word_1, label: Status word 1, table: holding, address: 1, type: u16, flags: status_word_1}
  - {key: x.status_word_2, label: Status word 2, table: holding, address: 2, type: u16, flags: status_word_2}
  - {key: x.status_word_3, label: Status word 3, table: holding, address: 3, type: u16, flags: status_word_3, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.line_quality, label: Line quality, table: holding, address: 4, type: u16}
  - {key: battery_soc, label: Battery State of Charge, table: holding, address: 5, type: u16, unit: '%', sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.runtime_remaining, label: Runtime Remaining, table: holding, address: 6, type: u16, unit: min, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 7, type: u16, unit: V, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: temperature, label: UPS Internal Temperature, table: holding, address: 8, type: u16, unit: °C, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.load_amps, label: Load Current, table: holding, address: 9, type: u16, unit: A}
  - {key: x.bad_battery_packs, label: Bad Battery Packs, table: holding, address: 10, type: u16}
  - {key: x.total_battery_packs, label: Total Battery Packs, table: holding, address: 11, type: u16, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.load_percent, label: Load Percent, table: holding, address: 12, type: u16, unit: '%', sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.nominal_output_voltage, label: Nominal Output Voltage, table: holding, address: 13, type: u16, unit: V}
  - {key: x.actual_output_voltage, label: Output Voltage, table: holding, address: 14, type: u16, unit: V, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.max_input_voltage, label: Max Input Voltage, table: holding, address: 15, type: u16, unit: V}
  - {key: x.min_input_voltage, label: Min Input Voltage, table: holding, address: 16, type: u16, unit: V}
  - {key: x.input_voltage, label: Input Voltage, table: holding, address: 17, type: u16, unit: V, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.input_frequency, label: Input Frequency, table: holding, address: 18, type: u16, unit: Hz, sources: [apc-modbus-snmp-ha, modbus-devices]}
  - {key: x.measure_ups_temp_probe1, label: Measure ups temp probe1, table: holding, address: 19, type: u16}
  - {key: x.measure_ups_humidity_probe1, label: Measure ups humidity probe1, table: holding, address: 20, type: u16}
  - {key: x.measure_ups_temp_probe2, label: Measure ups temp probe2, table: holding, address: 21, type: u16}
  - {key: x.measure_ups_humidity_probe2, label: Measure ups humidity probe2, table: holding, address: 22, type: u16}
  - {key: x.measure_ups_contact_position, label: Measure ups contact position, table: holding, address: 23, type: u16}
  - {key: x.minimum_return_battery_capacity, label: Minimum return battery capacity, table: holding, address: 26, type: u16}
  - {key: x.lower_transfer_point, label: Lower Transfer Point, table: holding, address: 27, type: u16, unit: V}
  - {key: x.upper_transfer_point, label: Upper Transfer Point, table: holding, address: 28, type: u16, unit: V}
  - {key: x.nominal_output_voltage_setting, label: Nominal output voltage setting, table: holding, address: 29, type: u16}
  - {key: x.shutdown_delay, label: Shutdown Delay, table: holding, address: 30, type: u16, unit: s}
  - {key: x.low_battery_duration, label: Low Battery Duration, table: holding, address: 31, type: u16, unit: min}
  - {key: x.turn_on_delay, label: Turn On Delay, table: holding, address: 32, type: u16, unit: s}
  - {key: x.sensitivity, label: Sensitivity, table: holding, address: 33, type: u16}
  - {key: x.status_word_4, label: Status word 4, table: holding, address: 42, type: u16}
  - {key: x.status_word_5, label: Status word 5, table: holding, address: 43, type: u16}
  - {key: x.nominal_battery_voltage, label: Nominal battery voltage, table: holding, address: 44, type: u16}
  - {key: x.actual_battery_voltage, label: Actual battery voltage, table: holding, address: 45, type: u16}
  - {key: x.utility_input_voltage_phase_a, label: Utility input voltage phase a, table: holding, address: 46, type: u16}
  - {key: x.battery_current, label: Battery current, table: holding, address: 77, type: s16}

flags:
  status_word_1: {'0': Low Battery Shutdown, '1': Unable to Transfer (Overload), '2': Main Relay Fault, '5': Battery Charger Fault, '7': Temperature Fault}
  status_word_2: {'4': Bypass Fault, '7': Inverter Fault}
  status_word_3: {'3': UPS Online, '4': UPS On Battery, '5': UPS Overload, '6': UPS Low Battery, '7': UPS Replace Battery}

notes:
- The project bases this map on APC document 990-5702A (Smart-UPS other than SMT, SMX, SURTD and SRT) and reads the values
  unscaled.
- Registers 0x0018 and 0x0019 are reserved; the project says reading them fails.
- The project reads these registers through an AP9630 Network Management Card 2 and publishes the raw register values with
  the units shown (no scaling).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
