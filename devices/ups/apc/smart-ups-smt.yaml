modbusspec: 0
id: apc-smart-ups-smt
manufacturer: APC
name: Smart-UPS SMT / SMX / SURTD / SRT
kind: ups

sources:
- id: apc-modbus-snmp-ha
  title: apc-modbus-snmp-ha (Home Assistant integration)
  url: https://github.com/aburow/apc-modbus-snmp-ha
  license: AGPL-3.0-or-later
  commit: 41e9a6b22a4c63a713e8aa8ef25a54a5a1e41622
  path: custom_components/apc_modbus/registers_smt_ups.py, custom_components/apc_modbus/coordinator.py, custom_components/apc_modbus/date.py,
    custom_components/apc_modbus/modbus_commands.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - apc-modbus-snmp-ha

points:
  - {key: x.ups_status_bf, label: UPS status bits, table: holding, address: 0, type: u32, flags: ups_status_bf}
  - {key: x.ups_status_change_cause, label: Last UPS Status Change Cause, table: holding, address: 2, type: u16, enum: ups_status_change_causes}
  - {key: x.simple_signaling_status_bf, label: Simple signaling status bits, table: holding, address: 18, type: u16, flags: simple_signaling_status_bf}
  - {key: x.general_error_bf, label: General error bits, table: holding, address: 19, type: u16}
  - {key: x.power_system_error_bf, label: Power system error bits, table: holding, address: 20, type: u32}
  - {key: x.battery_system_error_bf, label: Battery system error bits, table: holding, address: 22, type: u16, flags: battery_system_error_bf}
  - {key: x.battery_lifetime_status_bf, label: Battery lifetime status bits, table: holding, address: 25, type: u16, flags: battery_lifetime_status_bf}
  - {key: x.runtime_remaining, label: Runtime Remaining, table: holding, address: 128, type: u32, unit: s}
  - {key: battery_soc, label: Battery State of Charge, table: holding, address: 130, type: u16, unit: '%', scale: 0.001953125}
  - {key: battery_voltage, label: Battery Voltage, table: holding, address: 131, type: s16, unit: V, scale: 0.03125}
  - {key: x.battery_voltage_negative, label: Battery Voltage (Negative), table: holding, address: 132, type: s16, unit: V, scale: 0.03125}
  - {key: x.battery_replacement_date_days, label: Battery Replacement Date, table: holding, address: 133, type: u16, epoch: {start: '2000-01-01', unit: d}}
  - {key: battery_temperature, label: Battery Temperature, table: holding, address: 135, type: s16, unit: °C, scale: 0.0078125}
  - {key: x.output_load_percent, label: Output Load, table: holding, address: 136, type: u16, unit: '%', scale: 0.00390625}
  - {key: x.output_load_percent_l2, label: Output Load (Phase 2), table: holding, address: 137, type: u16, unit: '%', scale: 0.00390625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.output_apparent_power_percent, label: Output Apparent Power, table: holding, address: 138, type: u16, unit: '%', scale: 0.00390625}
  - {key: x.output_apparent_power_percent_l2, label: Output Apparent Power (Phase 2), table: holding, address: 139, type: u16, unit: '%', scale: 0.00390625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.output_current, label: Output Current, table: holding, address: 140, type: u16, unit: A, scale: 0.03125}
  - {key: x.output_current_l2, label: Output Current (Phase 2), table: holding, address: 141, type: u16, unit: A, scale: 0.03125, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.output_voltage, label: Output Voltage, table: holding, address: 142, type: u16, unit: V, scale: 0.015625}
  - {key: x.output_voltage_l2, label: Output Voltage (Phase 2), table: holding, address: 143, type: u16, unit: V, scale: 0.015625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.output_frequency, label: Output Frequency, table: holding, address: 144, type: u16, unit: Hz, scale: 0.0078125}
  - {key: x.output_energy, label: Output Energy, table: holding, address: 145, type: u32, unit: kWh, scale: 0.001}
  - {key: x.bypass_input_status_bf, label: Bypass input status bits, table: holding, address: 147, type: u16}
  - {key: x.bypass_voltage, label: Bypass Voltage, table: holding, address: 148, type: u16, unit: V, scale: 0.015625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.bypass_frequency, label: Bypass Frequency, table: holding, address: 149, type: u16, unit: Hz, scale: 0.0078125, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.input_status_bf, label: Input status bits, table: holding, address: 150, type: u16}
  - {key: x.input_voltage, label: Input Voltage, table: holding, address: 151, type: u16, unit: V, scale: 0.015625}
  - {key: x.input_voltage_l2, label: Input Voltage (Phase 2), table: holding, address: 152, type: u16, unit: V, scale: 0.015625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.input_voltage_l3, label: Input Voltage (Phase 3), table: holding, address: 153, type: u16, unit: V, scale: 0.015625, invalid: [65535], note: SmartConnect models answer 0xFFFF here (not supported).}
  - {key: x.input_efficiency, label: UPS Efficiency, table: holding, address: 154, type: s16, unit: '%', scale: 0.0078125, enum: efficiency_status, note: Values ≥ 0 are the efficiency (raw / 128 %); negative values are status codes (enum).}
  - {key: firmware, label: Firmware version, table: holding, address: 516, type: str, length: 8}
  - {key: x.model, label: Model, table: holding, address: 532, type: str, length: 16}
  - {key: x.sku, label: SKU, table: holding, address: 548, type: str, length: 16}
  - {key: serial, label: Serial number, table: holding, address: 564, type: str, length: 8}
  - {key: x.battery_installation_date_days, label: Battery installation date, table: holding, address: 595, type: u16, epoch: {start: '2000-01-01', unit: d}, writable: true}
  - {key: x.command_0600, label: Command register 0x0600, table: holding, address: 1536, type: u32, flags: command_0600, writable: true}
  - {key: x.outlet_command, label: Outlet command, table: holding, address: 1538, type: u32, flags: outlet_command, writable: true, note: One action bit together with one target bit.}
  - {key: x.command_0605, label: Command register 0x0605, table: holding, address: 1541, type: u16, flags: command_0605, writable: true}
  - {key: x.command_0606, label: Command register 0x0606, table: holding, address: 1542, type: u16, flags: command_0606, writable: true}
  - {key: x.command_0607, label: Command register 0x0607, table: holding, address: 1543, type: u16, flags: command_0607, writable: true}

enums:
  ups_status_change_causes: {'0': System Initialization, '1': High Input Voltage, '2': Low Input Voltage, '3': Distorted Input, '4': Rapid Change of Input Voltage, '5': High Input Frequency, '6': Low Input Frequency, '7': Frequency and/or Phase Difference, '8': Acceptable Input, '9': Automatic Test, '10': Test Ended, '11': Local UI Command, '12': Protocol Command, '13': Low Battery Voltage, '14': General Error, '15': Power System Error, '16': Battery System Error, '17': Error Cleared, '18': Automatic Restart, '19': Distorted Inverter Output, '20': Inverter Output Acceptable, '21': EPO Interface, '22': Input Phase Delta Out of Range, '23': Input Neutral Not Connected, '24': ATS Transfer, '25': Configuration Change, '26': Alert Asserted, '27': Alert Cleared, '28': Plug Rating Exceeded, '29': Outlet Group State Change, '30': Failure Bypass Expired}
  efficiency_status: {'-8': Battery Disconnected, '-7': Poor AC Input, '-6': Battery Charging, '-5': In Bypass, '-4': On Battery, '-3': Output Off, '-2': Load Too Low, '-1': Not Available}

flags:
  ups_status_bf: {'1': UPS Online, '2': UPS On Battery, '3': UPS On Bypass, '4': UPS Output Off, '5': UPS Fault, '6': Input Bad, '15': UPS Fault State, '21': UPS Overload}
  simple_signaling_status_bf: {'1': Shutdown Imminent}
  battery_lifetime_status_bf: {'0': Battery Lifetime OK, '1': Battery Lifetime Near End, '2': Battery Lifetime Exceeded, '3': Battery Lifetime Near End Acknowledged, '4': Battery Lifetime Exceeded Acknowledged, '5': Battery Measured Lifetime Near End, '6': Battery Measured Lifetime Near End Acknowledged}
  battery_system_error_bf: {'0': Battery Disconnected, '1': Battery Overvoltage, '2': Battery Needs Replacement, '3': Battery Overtemperature Critical, '4': Battery Charger Fault, '5': Battery Temperature Sensor Fault, '6': Battery Bus Soft-Start Fault, '7': Battery Overtemperature Warning, '8': Battery General Error, '9': Battery Communication Error, '10': Battery Frame Disconnected, '11': Battery Firmware Mismatch, '12': Battery Voltage Sense Error, '13': Battery Incompatible Pack}
  command_0600: {'4': Enter bypass, '5': Return from bypass}
  command_0605: {'0': Start battery self-test, '1': Abort battery self-test}
  command_0606: {'0': Start runtime calibration, '1': Abort runtime calibration}
  command_0607: {'2': Mute alarms, '3': Cancel alarm mute, '5': Acknowledge battery alarms}
  outlet_command: {'0': Outlet cancel, '1': Outlet on, '2': Outlet off, '3': Outlet shutdown, '4': Outlet reboot, '8': 'Target: main outlet group', '9': 'Target: switched outlet group 1', '10': 'Target: switched outlet group 2', '11': 'Target: switched outlet group 3', '17': Set in every outlet command by the project}

notes:
- The project bases this map on APC document 990-9840B (Smart-UPS SMT, SMX, SURTD and SRT); the same map is used for SmartConnect
  models, which lack some registers.
- 'The project tells the families apart by probing: the SMT map answers at 0x0080 while the older map''s register 0x0021 gives
  exception 2 (illegal address).'
- Reached through a network management card (NMC2 / NMC3), the SmartConnect Ethernet port, or the RS232 port with Modbus enabled
  behind a serial-to-TCP gateway.
- Some units accept only one request per TCP connection.
- Command registers (0x0600 and up) are write only; write the whole value, 32-bit ones high word first.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
