notes:
- 'Addresses are the protocol addresses the manuals give (0x0001 = register 1, function 3). Status and alarm words: bit 0
  is the lowest acronym of the word (0x0030 bit 0 = S000); a set bit means the condition is on. Text registers hold two characters
  each, the first in the high byte.'
- 'Each range uses part of the map: the manuals mark bits and measurements a range doesn''t have as unused. Whether the UPS
  manages a measurement Mnnn is shown by bit (nnn mod 16) of 0x00C0 + nnn / 16; read that before trusting a value. Points
  with `models` are listed only for the ranges whose table has them.'
- 'Measurement factor (0x000E): with 1, kVA, kW, A, battery V and Ah values have one decimal (scale above); with 0 they are
  whole units (multiply the readings here by 10). The Modulys / Masterys manual says it is set to 1; the Delphys manual doesn''t
  give the default, so the scales above are unverified there. A reader can''t switch scales by this register yet.'
- Frequencies and temperatures always have one decimal, power factors two, crest factors one; voltages and load rates are
  whole units with either factor.
- 'Data at 0x00nn is the UPS / system view. On modular and parallel systems the unit and module tables sit at other addresses
  with the same layout: 0x10nn unit, 0x1mnn module m (0x1Dnn bypass) of a single unit, 0xu0nn and 0xumnn unit u of a parallel
  system. A Modulys XM 650 kW unit is read at 0x01nn instead of 0x00nn; that variant is not described here.'
- 'Delphys MX Elite+: Modbus RTU on RS485 or RS232 (set on the UPS panel), Modbus TCP on port 502 through the NET VISION box
  (enabled in its web interface). Modulys / Masterys: Modbus RTU through the ADC+SL card (2400 / 9600 / 19200 baud, parity
  none / even / odd, 8 data bits, 1 stop bit, set on the panel) or the Modbus TCP card; the default serial settings and unit
  id aren''t stated, unit 1 is assumed (the frame examples use slave 1).'
- 'Commands (0x00C9–0x00CA, write only, function 6: eco mode on / off, battery test, alarm reset) are left out; they need
  remote control enabled on the panel (permission P000).'
