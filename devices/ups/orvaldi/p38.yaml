  - {key: x.va_percent_s, label: S VA percent, table: holding, address: 787, type: u16, unit: '%', scale: 0.1}
  - {key: x.va_percent_t, label: T VA percent, table: holding, address: 788, type: u16, unit: '%', scale: 0.1}
  - {key: x.watt_percent_r, label: R Watt percent, table: holding, address: 789, type: u16, unit: '%', scale: 0.1}
  - {key: x.watt_percent_s, label: S Watt percent, table: holding, address: 790, type: u16, unit: '%', scale: 0.1}
  - {key: x.watt_percent_t, label: T Watt percent, table: holding, address: 791, type: u16, unit: '%', scale: 0.1}
