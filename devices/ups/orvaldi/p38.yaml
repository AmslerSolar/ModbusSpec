modbusspec: 0
id: orvaldi-p38
manufacturer: Orvaldi
name: UPS with the P38 Modbus protocol
kind: ups

sources:
- title: Modbus Protocol For P38
  version: '2024-01-15'
  url: https://lv.orvaldi.com/assets/img/702,,Modbus%20Protocol%20For%20P38_20240115.pdf
  sha256: f03d76df4a92139ee192c0e3681ccd6ab93076e456c414c1d3d7c6a367f8cc2b

connection:
  default_port: 502
  default_unit: 1

encoding:
  byte_order: big
  word_order: big

points:
  # Warnings (only the bits the document marks as used on the P38)
  - {key: x.warnings_0, label: Warning item 0x0000, table: holding, address: 0, type: u16, flags: warnings_0}
  - {key: x.warnings_2, label: Warning item 0x0002, table: holding, address: 2, type: u16, flags: warnings_2}
  - {key: x.warnings_3, label: Warning item 0x0003, table: holding, address: 3, type: u16, flags: warnings_3}
  - {key: x.warnings_4, label: Warning item 0x0004, table: holding, address: 4, type: u16, flags: warnings_4}
  # Capability settings (one enable bit each)
  - {key: x.capability_settings_1, label: Capability setting 0x0006, table: holding, address: 6, type: u16, flags: capability_1, poll: slow, writable: true}
  - {key: x.capability_settings_2, label: Capability setting 0x0007, table: holding, address: 7, type: u16, flags: capability_2, poll: slow, writable: true}
  # State
  - {key: state, label: UPS Mode inquiry, table: holding, address: 208, type: u16, bits: [8, 15], enum: mode}
  - {key: x.ups_type, label: Status bits 15–14 (UPS type), table: holding, address: 815, type: u16, bits: [14, 15], enum: ups_type, poll: slow}
  - {key: x.status, label: status, table: holding, address: 815, type: u16, flags: status}
  - {key: error_code, label: Fault kind, table: holding, address: 675, type: u16, enum: fault_kind, note: Two ASCII characters (e.g. 0x3031 = "01"); what the register holds without a fault isn't stated.}
  # Input, output (working status)
  - {key: x.input_voltage_r, label: R Input voltage, table: holding, address: 798, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_s, label: S Input voltage, table: holding, address: 799, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_t, label: T Input voltage, table: holding, address: 800, type: u16, unit: V, scale: 0.1}
  - {key: x.input_frequency, label: Input frequency, table: holding, address: 801, type: u16, unit: Hz, scale: 0.1}
  - {key: l1_voltage, label: R Output voltage, table: holding, address: 802, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: S Output voltage, table: holding, address: 803, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: T Output voltage, table: holding, address: 804, type: u16, unit: V, scale: 0.1}
  - {key: frequency, label: Output frequency, table: holding, address: 805, type: u16, unit: Hz, scale: 0.1}
  - {key: l1_current, label: R Output current, table: holding, address: 806, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: S Output current, table: holding, address: 807, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: T Output current, table: holding, address: 808, type: u16, unit: A, scale: 0.1}
  - {key: x.load_percent_r, label: R Output load percent, table: holding, address: 809, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_percent_s, label: S Output load percent, table: holding, address: 810, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_percent_t, label: T Output load percent, table: holding, address: 811, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_percent, label: Total Output load percent, table: holding, address: 175, type: u16, unit: '%', scale: 0.1}
  - {key: x.battery_voltage_positive, label: P Battery voltage, table: holding, address: 812, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_voltage_negative, label: N Battery voltage, table: holding, address: 813, type: u16, unit: V, scale: 0.1}
  - {key: temperature, label: Max Temperature of the detecting pointers, table: holding, address: 814, type: u16, unit: °C, scale: 0.1, verified: false, note: Unsigned is assumed.}
  # Battery
  - {key: x.battery_voltage_positive_sys, label: P Battery voltage (battery information), table: holding, address: 188, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_charge_current_positive, label: P Battery Charging Current, table: holding, address: 189, type: u16, unit: A, verified: false, note: No unit or scale is given; A assumed.}
  - {key: x.battery_discharge_current_positive, label: P Battery Discharging Current, table: holding, address: 190, type: u16, unit: A, verified: false, note: 'The unit is given as Ah; A assumed, scale not stated.'}
  - {key: battery_soc, label: Battery Capacity, table: holding, address: 191, type: u16, unit: '%'}
  - {key: x.backup_time, label: Battery Remain time, table: holding, address: 192, type: u16, unit: min}
  - {key: x.battery_voltage_negative_sys, label: N Battery voltage (battery information), table: holding, address: 193, type: u16, unit: V, scale: 0.1}
  - {key: x.battery_charge_current_negative, label: N Battery Charging Current, table: holding, address: 194, type: u16, unit: A, verified: false, note: No unit or scale is given; A assumed.}
  - {key: x.battery_discharge_current_negative, label: N Battery Discharging Current, table: holding, address: 195, type: u16, unit: A, verified: false, note: 'The unit is given as Ah; A assumed, scale not stated.'}
  - {key: x.time_on_battery, label: Battery mode work time, table: holding, address: 749, type: u16, unit: min}
  - {key: x.battery_capacity_ah, label: Battery AH Number, table: holding, address: 775, type: u16, unit: Ah, poll: slow}
  - {key: x.battery_shutdown_voltage, label: Battery shutdown voltage, table: holding, address: 868, type: u16, unit: V, scale: 0.1, poll: slow, writable: true}
  - {key: x.battery_low_voltage, label: Battery Low voltage, table: holding, address: 874, type: u16, unit: V, scale: 0.1, poll: slow, writable: true}
  - {key: x.battery_high_voltage, label: Battery High voltage, table: holding, address: 1456, type: u16, unit: V, scale: 0.1, poll: slow, writable: true}
  - {key: x.battery_max_charge_current, label: Battery max charging current, table: holding, address: 1457, type: u16, unit: A, scale: 0.1, poll: slow}
  - {key: x.battery_bulk_voltage, label: Battery Bulk voltage, table: holding, address: 1493, type: u16, unit: V, scale: 0.1, poll: slow}
  # Temperatures
  - {key: x.heatsink_temperature_1, label: heatsink temperature 1, table: holding, address: 204, type: u16, unit: °C, verified: false, note: Unsigned and scale 1 assumed.}
  - {key: x.heatsink_temperature_2, label: heatsink temperature 2, table: holding, address: 205, type: u16, unit: °C, verified: false}
  - {key: x.cabinet_temperature, label: cabinet temperature, table: holding, address: 206, type: u16, unit: °C, verified: false}
  - {key: battery_temperature, label: battery temperature, table: holding, address: 207, type: u16, unit: °C, verified: false}
  # Load
  - {key: x.phase_load_r, label: R phase of load, table: holding, address: 221, type: u16, unit: '%', scale: 0.1}
  - {key: x.phase_load_s, label: S phase of load, table: holding, address: 252, type: u16, unit: '%', scale: 0.1}
  - {key: x.phase_load_t, label: T phase of load, table: holding, address: 253, type: u16, unit: '%', scale: 0.1}
  - {key: x.whole_load, label: The whole load, table: holding, address: 254, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_va_percent, label: Total VA percent, table: holding, address: 183, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_watt_percent, label: Total Watt percent, table: holding, address: 184, type: u16, unit: '%', scale: 0.1}
  - {key: x.apparent_power_r, label: Load VA R, table: holding, address: 780, type: u16, unit: VA}
  - {key: x.apparent_power_s, label: Load VA S, table: holding, address: 781, type: u16, unit: VA}
  - {key: x.apparent_power_t, label: Load VA T, table: holding, address: 782, type: u16, unit: VA}
