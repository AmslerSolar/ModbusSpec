notes:
- 'The document doesn''t name the maker or the UPS models; it is published by Orvaldi. It gives no connection settings (interface,
  port, unit id, serial format): port 502 and unit 1 are only defaults. Orvaldi''s separate Modbus card quick guide (V.2.5,
  RTU over RS-485, 19200 baud 8N1 by default, unit id by DIP switch) has no register map and doesn''t say it speaks this protocol.'
- Read with function 03, written with function 16; the addresses are the protocol addresses given in hex (the document's request
  frames use them directly). Byte order big-endian, as the document's example 0x0889 = 218.5 V shows.
- 'The document shades the registers and bits unused on the P38: of the warning words 0x0000–0x0004 only the unshaded bits
  are listed (0x0001 is entirely unused); 0x048B (rating output current), 0x048E (parallel number), 0x048D as battery cell
  number and 0x03AD are unused. 0x048D is the rating output voltage.'
- The capability settings 0x0006 / 0x0007 are written as masks (e.g. 0x8000 enables the audible alarm, 0x7FFF disables it);
  bit 2 of 0x0006 has no name. The document's example for the audible alarm names both 0x0006 and 0x000E as the target.
- 'Not taken over: the control word 0x001A (silence buzzer, remote on / off, battery tests) with its result flags 0x0025,
  the reset to defaults 0x0030 / 0x003B, the setting result flags 0x0384, and the remote shutdown and test commands 0x03AB–0x03AF
  with their flags 0x03DA (minutes written as ASCII). Registers 0x00C4, 0x00C5, 0x0318 and 0x0319 have no name in the document.'
- The mode at 0x00D0 is an ASCII letter in the high byte (e.g. 'L' = line mode, 'B' = battery mode). The fault kind at 0x02A3
  is a two-character ASCII code; codes 0x3441–0x3446 are listed without a name.
