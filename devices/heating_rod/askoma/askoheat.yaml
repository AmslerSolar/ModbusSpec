modbusspec: 0
id: askoma-askoheat
manufacturer: Askoma
name: ASKOHEAT+ heating rod
kind: heating_rod

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/askoheat.yaml, templates/definition/charger/askoheat.yaml
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.heat.askoma/src/io/openems/edge/heat/askoma/HeatAskomaImpl.java
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/askoma/askoheat/consumer.py, packages/modules/smarthome/askoheat/watt.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.power_setpoint, label: Power setpoint, table: holding, address: 201, type: u16, unit: W, writable: true, sources: [openwb]}
  - {key: x.target_grid_active_power, label: Target grid active power, table: holding, address: 202, type: s16, unit: W, writable: true}
  - {key: x.setmaxpower_319, label: Power limit (write), table: holding, address: 319, type: s16, unit: W, writable: true, sources: [evcc]}
  - {key: x.target_temperature, label: Target temperature, table: holding, address: 597, type: u16, unit: °C}
  - {key: x.heater1_active, label: Heater 1 is active, table: input, address: 109, type: u16, bits: [0, 0]}
  - {key: x.heater2_active, label: Heater 2 is active, table: input, address: 109, type: u16, bits: [1, 1]}
  - {key: x.heater3_active, label: Heater 3 is active, table: input, address: 109, type: u16, bits: [2, 2]}
  - {key: x.pump_active, label: Pump is active, table: input, address: 109, type: u16, bits: [3, 3]}
  - {key: x.relayboard_is_connected, label: Relayboard is connected, table: input, address: 109, type: u16, bits: [4, 4]}
  - {key: x.heater_1_2_3_current_flow, label: Heater 1-3 current flow, table: input, address: 109, type: u16, bits: [5, 5]}
  - {key: x.heat_pump_request_active, label: Heat pump request is active, table: input, address: 109, type: u16, bits: [6, 6]}
  - {key: x.emergency_mode_active, label: Emergency mode is active, table: input, address: 109, type: u16, bits: [7, 7]}
  - {key: x.legionella_protection_active, label: Legionella protection is active, table: input, address: 109, type: u16, bits: [8, 8]}
  - {key: x.analog_input_active, label: Analog input 0-10V is active, table: input, address: 109, type: u16, bits: [9, 9]}
  - {key: x.load_setpoint_active, label: Load setpoint is active, table: input, address: 109, type: u16, bits: [10, 10]}
  - {key: x.load_feedin_active, label: Load feed-in value is active, table: input, address: 109, type: u16, bits: [11, 11]}
  - {key: x.auto_heater_off_active, label: Auto heater off is active, table: input, address: 109, type: u16, bits: [12, 12]}
  - {key: x.pump_relay_follow_up_active, label: Pump relay follow-up time is active, table: input, address: 109, type: u16, bits: [13, 13]}
  - {key: x.temperature_limit_reached, label: 'Temperature limit reached, heaters are switched off', table: input, address: 109, type: u16, bits: [14, 14]}
  - {key: x.any_error_occurred, label: Any error occurred, table: input, address: 109, type: u16, bits: [15, 15]}
  - {key: consumer_power, label: Active power, table: input, address: 110, type: u16, unit: W, positive: consumption, conflicts: [{sources: [openwb], type: s16, label: Electrical power}]}
  - {key: x.aux_power, label: Consumer power, table: input, address: 317, type: u16, unit: W, sources: [evcc]}
  - {key: x.getmaxpower, label: Power limit, table: input, address: 319, type: s16, unit: W, sources: [evcc]}
  - {key: x.temp, label: Temperature, table: input, address: 325, type: f32, unit: °C, sources: [evcc]}
  - {key: x.temperature, label: Temperature, table: input, address: 638, type: u16, unit: °C, conflicts: [{sources: [openwb], type: s16, label: Water temperature}]}
  - {key: x.limittemp, label: Temperature limit, table: input, address: 640, type: u16, unit: °C, sources: [evcc]}

notes:
- 'evcc template `askoheat` (aux) lists: Askoma ASKOHEAT+.'
- 'evcc template `askoheat` (single device) lists: Askoma ASKOHEAT+.'
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
