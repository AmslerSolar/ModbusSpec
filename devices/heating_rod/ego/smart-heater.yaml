modbusspec: 0
id: ego-smart-heater
manufacturer: E.G.O.
name: Smart Heater
kind: heating_rod

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/ego/ego/consumer.py

connection:
  default_port: 502
  default_unit: 247
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: x.stage1_power, label: Stage 1 power, table: holding, address: 4096, type: u16, unit: W}
  - {key: x.stage2_power, label: Stage 2 power, table: holding, address: 4128, type: u16, unit: W}
  - {key: x.stage3_power, label: Stage 3 power, table: holding, address: 4160, type: u16, unit: W}
  - {key: x.power_setpoint, label: Power setpoint, table: holding, address: 4864, type: s16, unit: W, writable: true, note: 'The heater spreads it over its 500, 1000 and 2000 W stages. -1: the heater regulates on the grid balance in register 4865 itself.'}
  - {key: x.grid_balance, label: Grid balance, table: holding, address: 4865, type: s32, unit: W, writable: true, note: 'openWB writes its grid power: negative = surplus (export).'}
  - {key: x.stage_status, label: Stage status, table: holding, address: 5128, type: u16, flags: ego_stages}

flags:
  ego_stages: {'0': Stage 1 on (power in register 4096), '1': Stage 2 on (register 4128), '2': Stage 3 on (register 4160)}

notes:
- openWB adds the powers of the stages whose bits are set in register 5128 to get the heater's power.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
