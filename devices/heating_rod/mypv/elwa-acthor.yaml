enums:
  elwa_e_status: {'2': Heating, '3': Standby, '4': Boost heating, '5': Heat finished, '9': Setup, '201': 'Error: overtemperature, fuse blown', '202': 'Error: overtemperature measured', '203': 'Error: overtemperature electronics', '204': 'Error: hardware fault', '205': 'Error: temperature sensor', '209': 'Error: mainboard'}
  elwa_2_status: {'1': No control signal, '2': Heating, '3': Standby, '4': Boost heating, '5': Heat finished, '20': Legionella boost active, '21': Device disabled, '22': Device blocked, '201': 'Error: safety thermostat (STL) triggered', '202': 'Error: power stage overtemperature', '203': 'Error: power stage temperature probe', '204': 'Error: hardware fault', '205': 'Error: immersion heater temperature sensor', '209': 'Error: mainboard'}
  thor_status: {'0': 'Off', '1': Starting up, '2': Starting up, '3': Starting up, '4': Starting up, '5': Starting up, '6': Starting up, '7': Starting up, '8': Starting up, '9': Operation}
  status: {'0': Standby, '1': Excess, '2': Control is not allowed, '3': Temperature reached, '4': No control signal, '5': Error}

flags:
  elwa_2_relays: {'0': AUX relay on, '1': SELV relay on}
  thor_load_state: {'1': Load on output 1 (9s), '2': Load on output 2 (9s), '3': Load on output 3 (9s)}

problems:
  - {when: {key: state, range: [200, 65535]}, kind: fault, text: 'Device error (status {value})'}

notes:
- Set the control type ("kind of control") to Modbus TCP in the web interface to accept power commands. Reading without it
  is assumed to work (unverified).
- Port 502 and unit id 1 are in none of the documents (unverified).
- Addresses are the documents' real (0-based) addresses. Read with FC 03. Every register is a 16-bit unsigned value except
  1069 (signed), 1078/1079 and 1087/1088 (32-bit, high word at the lower address).
- Model detection uses the 16-digit serial number's first six digits (1018–1020); my-PV discourages this but lists the prefixes.
  Other prefixes (e.g. SOL•THOR 140100) get the common registers 1000–1028 only.
- 'Power drawn: 1082 where the firmware has it; otherwise the sum of the output powers (ELWA 2: 1074 + 1075, AC•THOR 9s: 1074
  + 1075 + 1076); otherwise the power setpoint 1000, which is only the commanded value (unverified as a measurement).'
- 'AC•THOR status: 0 off, 1–8 start-up, 9 operation, every value ≥ 200 is a power stage error. The ELWA-E and ELWA 2 documents
  list error codes 201–205 and 209 only; the problem covers every status ≥ 200 on all models.'
- The ELWA-E status list in its document has 2–5, 9 and 201–209.
- 'Firmware: main version in 1016, sub version in 1028.'
- Writable registers other than 1000 (and on the ELWA 2 / AC•THOR 1009–1012, 1078–1080) must not be written more than once
  a day (non-volatile memory).
- Models acthor come from projects and are listed after a model without a match, so detection never reaches them; their points
  apply only when a reader selects such a model by hand.
- HeatMyPvAcThor9sImpl.java reads holding register 1001 as temperature with type s16; HeatMyPvImpl.java (kept here) reads
  type u16.
- 'openWB scales the power it writes to register 1000 of an AC•THOR / ELWA 2 by the model''s full power over the configured
  maximum: 9s45 45000 W, 9s27 27000 W, 9s18 18000 W, 9s 9000 W, M3 6000 W, E2M3 6500 W, E2M1 3500 W, M1 3000 W.'
- openWB caps the power written to an AC ELWA-E at 4000 W and writes nothing during boost heat (state 4).
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
