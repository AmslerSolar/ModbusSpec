connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125
    max_gap: 4

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 1018
    type: str
    length: 8
  checks:
  - table: holding
    address: 1018
    type: u16
    range:
    - 12336
    - 14649
  - table: holding
    address: 1025
    type: u16
    range:
    - 12336
    - 14649

models:
  - {id: elwa_e, name: AC ELWA-E, match: {table: holding, address: 1018, type: str, length: 3, in: ['160124', '160140', '160129', '160142']}}
  - {id: elwa_2, name: AC ELWA 2, match: {table: holding, address: 1018, type: str, length: 3, in: ['160150', '160151', '160152']}}
  - {id: thor, name: AC•THOR (also CH and i), match: {table: holding, address: 1018, type: str, length: 3, in: ['200100', '200101', '200103']}}
  - {id: thor_9s, name: AC•THOR 9s, match: {table: holding, address: 1018, type: str, length: 3, equals: '200300'}}
  - {id: other, name: Other my-PV device (common registers only)}
  - {id: acthor, name: AC•THOR / AC ELWA 2 (openWB "my-PV Acthor oder Elwa2")}

