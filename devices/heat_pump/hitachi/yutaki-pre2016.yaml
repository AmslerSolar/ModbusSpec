flags:
  system_configuration_bits_before_2016: {'0': Circuit 1 Heating Available, '1': Circuit 2 Heating Available, '2': Circuit 1 Cooling Available, '3': Circuit 2 Cooling Available, '4': DHWT Available, '5': SWP Available, '6': Room thermostat available Circuit 1, '7': Room thermostat available Circuit 2}
  system_status_2_bits_before_2016: {'0': Defrost, '1': Solar, '2': Water Pump 1, '3': Water Pump 2, '4': Water Pump 3, '5': Compressor ON, '6': Boiler ON, '7': DHW Heater, '8': Space Heater, '9': Tarrif input enable}

notes:
- 'hass-hitachi_yutaki reads every register on its own (one holding register per request) and first reads the H-LINK communication
  state: while it is 1 (desynchronised, line-up 2016 and HC-A(16/64)MB only) or 2 (initialising), or reads 0xFFFF, the other
  values are not valid.'
- hass-hitachi_yutaki treats a raw 0xFFFF as a sensor error on the temperature, tenths and pressure registers, also on the
  signed temperatures (where it would read as −1 °C).
- Values for modules the system configuration register doesn't list (DHW, pool, circuit 2) are defaults, not measurements;
  hass-hitachi_yutaki ignores them.
- Control registers (R/W) take commands; the matching status registers report the state. hass-hitachi_yutaki writes to the
  control register and reads the status register.
- ATW-MBS-02 Modbus gateway with first-generation Yutaki S and S Combi units (before line-up 2016); the register layout differs
  from line-up 2016. hass-hitachi_yutaki marks this map as beta, based on the documentation and not tested on a unit.
- ECO mode is one setting for all circuits here (space mode and ECO offset), and there is no auto mode.
- H-LINK state 1 (no communication for more than 180 s) doesn't stop hass-hitachi_yutaki from reading on this map; only 2
  (initialising) does.
- hass-hitachi_yutaki also lists the S80 secondary compressor registers at the line-up 2016 addresses (1224-1231) for this
  map; the project's table for this generation has other registers there, so they are left out.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
