  comfort_eco: {'0': Comfort, '1': ECO}
  standard_high_demand: {'0': Standard, '1': High demand}
  no_available_available: {'0': No available, '1': Available}
  local_air_water_full: {'0': Local, '1': Air, '2': Water, '3': Full}
  off_cool_demand_off_cool_thermo_off_cool_thermo: {'0': 'OFF', '1': Cool Demand–OFF, '2': Cool Thermo-OFF, '3': Cool Thermo-ON, '4': Heat Demand-OFF, '5': Heat Thermo-OFF, '6': Heat Thermo-ON, '7': DHW-OFF, '8': DHW-ON, '9': SWP-OFF, '10': SWP-ON, '11': Alarm}
