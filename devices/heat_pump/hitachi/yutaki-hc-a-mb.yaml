notes:
- 'hass-hitachi_yutaki reads every register on its own (one holding register per request) and first reads the H-LINK communication
  state: while it is 1 (desynchronised, line-up 2016 and HC-A(16/64)MB only) or 2 (initialising), or reads 0xFFFF, the other
  values are not valid.'
- hass-hitachi_yutaki treats a raw 0xFFFF as a sensor error on the temperature, tenths and pressure registers, also on the
  signed temperatures (where it would read as −1 °C).
- Values for modules the system configuration register doesn't list (DHW, pool, circuit 2) are defaults, not measurements;
  hass-hitachi_yutaki ignores them.
- Control registers (R/W) take commands; the matching status registers report the state. hass-hitachi_yutaki writes to the
  control register and reads the status register.
- HC-A(16/64)MB gateway (several indoor units). Each indoor unit has its own block at 5000 + 200 × unit id + offset; the addresses
  here are for unit id 0. The outdoor unit (refrigerant cycle) block is at 30000 + 100 × cycle + offset; the addresses here
  are for cycle 0.
- 'Unit table: input registers 200 + 4 × slot hold presence, outdoor cycle, indoor H-LINK address and slot index (0xFF on
  an empty slot); the slot keys the indoor block. Only slot 0 is listed here. The slot can change when the gateway re-enumerates
  the bus; hass-hitachi_yutaki finds a unit by its (cycle, indoor address) pair.'
- 'The status mode register is a bitfield: bit 0 = heat (else cool), bit 1 = auto. The control mode register takes 0 = cool,
  1 = heat (no auto).'
- 'Field reports in the project: on a gateway with several refrigerant cycles, outdoor offsets 3-10 (pressures, current, frequency,
  valves) stay 0 except for cycle 0.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
