  system_status_2_bits_2016: {'0': Defrost, '1': Solar, '2': Water Pump 1, '3': Water Pump 2, '4': Water Pump 3, '5': Compressor ON, '6': Boiler ON, '7': DHW Heater, '8': Space Heater, '9': Smart function input enable}

notes:
- 'hass-hitachi_yutaki reads every register on its own (one holding register per request) and first reads the H-LINK communication
  state: while it is 1 (desynchronised, line-up 2016 and HC-A(16/64)MB only) or 2 (initialising), or reads 0xFFFF, the other
  values are not valid.'
- hass-hitachi_yutaki treats a raw 0xFFFF as a sensor error on the temperature, tenths and pressure registers, also on the
  signed temperatures (where it would read as −1 °C).
- Values for modules the system configuration register doesn't list (DHW, pool, circuit 2) are defaults, not measurements;
  hass-hitachi_yutaki ignores them.
- Control registers (R/W) take commands; the matching status registers report the state. hass-hitachi_yutaki writes to the
  control register and reads the status register.
- ATW-MBS-02 Modbus gateway, one Yutaki unit per gateway; Modbus TCP or RTU (RS485, 9600 or 19200 baud, 8 data bits, 1 stop
  bit, parity selectable).
- A Yutampo R32 reports unit model 1 (S Combi); hass-hitachi_yutaki recognises it by having DHW and no heating circuits.
- Room temperature written to the control registers (thermostat room temperature) is only used when a Modbus thermostat is
  enabled for the circuit.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
