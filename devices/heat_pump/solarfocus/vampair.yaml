notes:
- The document covers the ecomanager-touch controller in the vampair heat pump, the pellet boilers (pelletelegance, octoplus,
  pellettop), the therminator II boiler and the standalone ecomanager-touch; Modbus TCP needs a 7" display and software from
  V19.050 (therminator V19.072), and is switched on in the installer menu. Only the sections for the installed products and
  modules answer meaningfully.
- Input registers are read with function 04, holding registers with 03 and written with 06 / 16. The document's addresses
  are used as 0-based protocol addresses as given (not stated; assumed). 32-bit values are two registers, high word first
  (word order not stated; assumed).
- Status values of the therminator boiler carry an offset of 200; the enums hold both ranges.
- 'Left out: solar circuits 2…4, the difference modules (2200…) and the documented heating / cooling write examples. Problems
  for heating circuits, DHW tanks and fresh water modules are given for the first one only.'
- Writing a flow setpoint for cooling turns off the controller's dew point monitoring; the external system then has to keep
  the flow above the dew point.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
