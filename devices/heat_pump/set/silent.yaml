modbusspec: 0
id: set-silent
manufacturer: SET
name: Silent heat pumps (Dixell iChill IC121 controller)
kind: heat_pump

sources:
- id: fhem
  title: FHEM (home automation; Modbus modules)
  url: https://github.com/fhem/fhem-mirror
  license: GPL-2.0
  commit: e2587e9591116d5022de3c556c817cf6b23b5f42
  path: fhem/FHEM/98_ModbusSET.pm

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    min_interval_ms: 700

defaults:
  verified: false
  sources:
  - fhem

points:
  - {key: x.temp_wasser_ein, label: Temp Wasser Ein (Pb1), table: holding, address: 256, type: s16, unit: °C, scale: 0.1}
  - {key: x.temp_wasser_aus, label: Temp Wasser Aus (Pb2), table: holding, address: 258, type: s16, unit: °C, scale: 0.1}
  - {key: x.temp_verdampfer, label: Temp Verdampfer (Pb3), table: holding, address: 260, type: s16, unit: °C, scale: 0.1}
  - {key: x.temp_luft, label: Temp Luft (Pb4), table: holding, address: 262, type: s16, unit: °C, scale: 0.1}
  - {key: x.temp_soll, label: Temp Soll (ST03), table: holding, address: 770, type: s16, unit: °C, scale: 0.1, writable: true, note: FHEM accepts set values from 10 to 32.}
  - {key: x.hysterese, label: Hysterese (ST04), table: holding, address: 771, type: s16, scale: 0.1, writable: true, note: FHEM accepts set values from 0.5 to 3.}
  - {key: x.hyst_mode, label: Hyst Mode (ST10), table: holding, address: 777, type: s16, enum: hyst_mode, writable: true}
  - {key: x.temp_wasser_ein_off, label: Temp Wasser Ein Off (CF24), table: holding, address: 801, type: s16, unit: °C, scale: 0.1, writable: true}
  - {key: x.temp_wasser_aus_off, label: Temp Wasser Aus Off (CF25), table: holding, address: 802, type: s16, unit: °C, scale: 0.1, writable: true}
  - {key: x.temp_verdampfer_off, label: Temp Verdampfer Off (CF26), table: holding, address: 803, type: s16, unit: °C, scale: 0.1, writable: true}
  - {key: x.temp_luft_off, label: Temp Luft Off (CF27), table: holding, address: 804, type: s16, unit: °C, scale: 0.1, writable: true}

enums:
  hyst_mode: {'0': mittig, '1': über, '2': unterhalb}

notes:
- Written for the SET Silent 10 heat pump; per FHEM the controller is a Dixell iChill IC121, so other heat pumps with that
  controller may use the same registers.
- The register names in the labels (Pb1…Pb4 probes, ST setpoint parameters, CF configuration parameters) are those of the
  controller's documentation.
- All registers are read as signed 16-bit values.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
