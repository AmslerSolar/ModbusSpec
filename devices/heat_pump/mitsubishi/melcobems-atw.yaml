  - {key: x.dhw_temperature_drop, label: DHW Temperature Drop (signed), table: holding, address: 91, type: s16, unit: °C, scale: 0.1, poll: slow}
  - {key: x.zone1_room_temperature, label: Room Temperature – Zone 1 (signed), table: holding, address: 93, type: s16, unit: °C, scale: 0.01}
  - {key: x.zone2_room_temperature, label: Room Temperature – Zone 2 (signed), table: holding, address: 95, type: s16, unit: °C, scale: 0.01}
