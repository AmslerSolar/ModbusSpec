  - {key: x.return_temperature, label: Return Temperature / Water Inlet Temperature (signed), table: holding, address: 103, type: s16, unit: °C, scale: 0.01, note: 'Return temperature with an FTC controller, water inlet temperature with CAHV / CRHV / EAHV / QAHV units.'}
  - {key: x.tank_temperature, label: Tank Water Temperature (signed), table: holding, address: 105, type: s16, unit: °C, scale: 0.01}
