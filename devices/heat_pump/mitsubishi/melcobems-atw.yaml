problems:
  - {when: {key: error_code, equals: 6999}, kind: fault, text: No communication between the interface and the heat pump}
  - {when: {key: error_code, not_in: [8000, 6999]}, kind: fault, text: 'Heat pump fault code {value}'}
  - {when: {key: x.refrigerant_error, in: [1, 2]}, kind: fault, text: 'Refrigerant system error ({text})'}
  - {when: {key: x.refrigerant_error, equals: 3}, kind: warning, text: Refrigerant system maintenance error}
  - {when: {key: x.system_on_off, equals: 2}, kind: warning, text: Running in emergency mode}

notes:
- 'The MelcoBEMS MINI is an RS-485 Modbus RTU (or BACnet MS/TP) interface for Mitsubishi Electric units; this is its register
  map with an air-to-water system connected: Ecodan FTC4 … FTC7 controllers or CAHV / CRHV / EAHV / EACV / QAHV / PWFY outdoor
  units.'
- Addresses are the 0-based addresses the document lists; its Modicon references (00001, 10001, 30001, 40001) are these +
  1.
- Every input register, coil and discrete input is mirrored in a holding register, so only holding registers are listed here.
  Signed temperatures have an unsigned twin in the next register (for controllers that can't read negative values); the signed
  ones are used.
- Which registers a unit fills depends on the controller or outdoor unit type (the document has a column per type); unsupported
  values read 0. Several registers change meaning by unit type (e.g. 101 / 103 are flow / return with FTC and water outlet
  / inlet with CAHV-type units). The type is in Model Profile 1 (holding 270).
- Temperatures in °C × 100 cover −327.68 … 327.67 °C (signed) or 0 … 327.67 °C (unsigned twin); outdoor temperature and DHW
  temperature drop are × 10.
- The energy registers 279 … 298 hold the last measured day's values with its date; each consumed / produced energy is a kWh
  part plus a part in 10 Wh steps, added here as derived values. The year's coding (e.g. 0 … 99) is not stated.
- 'The operating mode values 4 and 7 … 11 appear only in the 2020 A1M document; the 2026 A1M+ document lists 0 … 3, 5 and
  6. Digit 2 of the 7-segment error code: 1 … 15 stand for the hex digits 1 … F; 0 is taken as the digit 0 (not stated).'
- Serial settings and unit id are set in registers 4 … 6; the document doesn't give the factory values. 9600 baud, no parity
  and unit 1 are assumed.
- The document gives no registers that single the interface out (no serial number or fixed identifier); `identify` is left
  out. The system type (holding 13) reads 1 with an air-to-water system.
- 'Left out: the unsigned temperature twins, MRC prohibit (36, must not be written to some models), DHW / heating / cooling
  prohibit flags (39 … 43), clock setting (48, 49), BMS outdoor temperature (50), H/C control type (58), refrigerant addresses,
  slave unit frequencies, run times and error digits (74 … 79, 128 … 143, 155 … 229, 271), room thermostat and flow switch
  inputs (119 … 126), DIP switches (126, 389 … 393), electric energy 1 … 16 (234 … 249, 0.01 kWh each; meaning not stated),
  brine and second-circuit temperatures (250 … 261), protocol / model versions (265 … 268), the boiler hybrid cost / CO2 settings
  (367 … 376), the consumed / produced power registers (379, 380; unit kW or Wh not resolved) and the error status table (398
  … 429).'
