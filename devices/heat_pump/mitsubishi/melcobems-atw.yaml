modbusspec: 0
id: mitsubishi-melcobems-atw
manufacturer: Mitsubishi Electric
name: Procon MelcoBEMS MINI (A1M / A1M+ / A1M R5) interface, air-to-water heat pumps
kind: heat_pump

sources:
- title: Procon MelcoBEMS MINI (A1M+) / MelcoBEMS MINI (A1M R5) Modbus Register Tables (A1M+ firmware 4.1.2, A1M R5 firmware
    3.1.05)
  version: 1.0.2 (13/05/26)
  url: https://www.nukumi.cz/data/files/67/procon-a1m-modbus-bacnet-adapter-1790325742.pdf?v=31f986df
  sha256: 312bb6ff9e0bb082fd3a3c3eaf7fccbaede4a4bcce034ff1662ff2be8bea59ca
- title: Procon MelcoBEMS MINI (A1M) ATW Modbus Register Tables (firmware 3.0.25)
  version: 1.0.4 (30/11/20)
  url: https://www.nukumi.cz/data/files/51/procon-a1m-modbus-bacnet-adapter-1790327447.pdf?v=31f986df
  sha256: 9b699b1670fa1c020b393617a9d836c6409fa921701307e51385402f19167a77

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  # Interface (holding registers, function 03, write 06 / 16)
  - {key: x.modbus_slave_id, label: Modbus Slave ID, table: holding, address: 4, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.baud_rate, label: Modbus RS-485 Baud Rate, table: holding, address: 5, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: RS-485 Parity Type, table: holding, address: 6, type: u16, enum: parity, writable: true, poll: slow}
  - {key: x.fault_code_hex, label: Fault/Error Code (hex), table: holding, address: 9, type: u16, poll: slow, note: '0x8000 = no error, 0x6999 = no communication with the unit. Also input register 1.'}
  - {key: firmware, label: A1M+ Firmware Version, table: holding, address: 10, type: u16, poll: slow, note: Coding not stated.}
  - {key: x.comms_counter, label: Modbus Comms Counter, table: holding, address: 11, type: u16, note: +1 per valid Modbus command; wraps after 65535.}
  - {key: error_code, label: Fault Code (decimal), table: holding, address: 12, type: u16, enum: fault_code, note: 8000 = no error. Also input register 8.}
  - {key: x.system_type, label: System Type Detected, table: holding, address: 13, type: u16, enum: system_type, poll: slow}

  # Control and settings
  - {key: x.system_on_off, label: System On/Off, table: holding, address: 25, type: u16, enum: system_on_off, writable: true, note: Only 0 and 1 can be written. Also coil 1.}
  - {key: state, label: Operating Mode, table: holding, address: 26, type: u16, enum: operating_mode, note: Read only.}
  - {key: x.dhw_mode, label: Operating Mode (DHW), table: holding, address: 27, type: u16, enum: dhw_mode, writable: true}
  - {key: x.zone1_mode, label: A/C Mode – Zone 1, table: holding, address: 28, type: u16, enum: zone_mode, writable: true}
  - {key: x.zone2_mode, label: A/C Mode – Zone 2, table: holding, address: 29, type: u16, enum: zone_mode, writable: true}
  - {key: x.tank_setpoint, label: Set Tank Water Temperature (signed), table: holding, address: 30, type: s16, unit: °C, scale: 0.01, writable: true, note: On some outdoor unit models this is the thermo-off temperature. Register 31 holds it without sign.}
  - {key: x.zone1_hc_target, label: H/C Thermostat Target Temperature – Zone 1 (signed), table: holding, address: 32, type: s16, unit: °C, scale: 0.01, writable: true}
  - {key: x.zone2_hc_target, label: H/C Thermostat Target Temperature – Zone 2 (signed), table: holding, address: 34, type: s16, unit: °C, scale: 0.01, writable: true}
  - {key: x.force_dhw, label: Force DHW, table: holding, address: 37, type: u16, enum: force_dhw, writable: true}
  - {key: x.holiday, label: Holiday, table: holding, address: 38, type: u16, enum: holiday, writable: true}
  - {key: x.capacity_mode, label: Capacity Mode, table: holding, address: 45, type: u16, enum: capacity_mode, writable: true, poll: slow}
  - {key: x.capacity_ratio, label: Capacity Control Ratio, table: holding, address: 46, type: u16, unit: '%', writable: true, min: 0, max: 100}
  - {key: x.water_setpoint, label: Setting Water Temperature (signed), table: holding, address: 52, type: s16, unit: °C, scale: 0.01, writable: true, note: Used by the CAHV / CRHV / EAHV / QAHV outdoor units; the range depends on the model.}
  - {key: x.zone1_thermostat_target, label: Thermostat Target Temperature – Zone 1 (signed), table: holding, address: 54, type: s16, unit: °C, scale: 0.01, writable: true}
  - {key: x.zone2_thermostat_target, label: Thermostat Target Temperature – Zone 2 (signed), table: holding, address: 56, type: s16, unit: °C, scale: 0.01, writable: true}

  # Status (read only)
  - {key: x.defrost, label: Defrost, table: holding, address: 67, type: u16, enum: defrost}
  - {key: x.refrigerant_error, label: Refrigerant Error Info, table: holding, address: 69, type: u16, enum: refrigerant_error}
  - {key: x.error_digit1, label: 7-Segment Display Error Code Digit 1, table: holding, address: 70, type: u16, enum: error_digit1}
  - {key: x.error_digit2, label: 7-Segment Display Error Code Digit 2, table: holding, address: 71, type: u16, enum: error_digit2}
  - {key: x.compressor_frequency, label: Heat Pump Frequency – Master, table: holding, address: 73, type: u16, unit: Hz}
  - {key: x.heat_source, label: Heat Source Status, table: holding, address: 80, type: u16, enum: heat_source}
