notes:
- The DDC (Direct Digital Controller) controls a plant of Robur gas absorption units (GAHP heat pumps, ACF / AY chillers and
  boilers); it speaks Modbus RTU as a slave on RS-232 (front DB9 or rear RJ-45) or RS-485. Default 19200 8N1; also 19200 8E1,
  9600 8N1 / 8E1, and 8N2 on RS-232 only. Default slave address 1. Port 502 is for a gateway.
- Addresses are the document's "real" (0-based, hex) addresses; it also lists them in prefix notation (00001 / 10001 / 30001
  / 40001 = 0).
- 'Signed values: 0x7FFE (32766) = field doesn''t exist / not configured, 0x7FFF (32767) = not available because of a fault
  (e.g. a broken probe). Unsigned: 0xFFFF = not provided. Temperatures and voltages are in tenths, working times in seconds,
  flow in l/h, power feedback 0–10000.'
- The DDC fills module slots 0 … n − 1 in ascending order of the units' network ID; the number of configured modules is at
  input 0x0008 (cooling) and 0x0009 (heating). Only module 00 is described here. Each further module has the same layout at
  + 250 registers (input registers; module 00 at 0x03E8 cooling, 0x1388 heating), + 64 (discrete inputs; 0x03E8 cooling, 0x07E8
  heating) and + 20 (the 'excluded' coil; 0x03E8 cooling, 0x0528 heating).
- Alarms exist in a single-client and a multi-client area with the same content. Reading a slot in the single-client area
  unlocks it for the next alarm, so that area suits only one Modbus master; this file reads the multi-client area, where a
  slot may change from one alarm to another without passing through 0.
- 'Alarm string codes are the 10 low bits of their register. Each string code has an alarm error code in the register after
  it (not described here): from the top, source 2 bits (cooling / heating / both modules / electronics), rank 2 bits (info
  / warning / error), a duplicate flag (the same alarm also reported on the unit''s cooling module) and the 11-bit code. The
  bit order of that layout is read from the document''s drawing (most significant first), not stated.'
- 'Module general alarm registers: bits 0–1 rank, bit 2 = module excluded by the user (alarms of excluded modules are better
  not shown). Plant general alarms hold the rank only.'
- Several registers are only mapped (answer) when the matching plant or service is configured on this DDC and the DDC is its
  master (`optional` here).
- The plant and module working data begin with two time-stamp registers (seconds 6 bits, minutes 6 bits, hours 4 high bits
  | hours low bit, year since 2000 6 bits, month 4 bits, day 5 bits; 24 h clock). Only the base heating plant's is described
  here (0x00FA/0x00FB), its hour joined as a derived value; the others (cooling plant 0x0064, separable heating plant 0x2328,
  each module at + 0x14 from its first register) have the same layout.
- Left out the command access flags, the working-mode and probe-installed flags, the water timer and quiet mode timer schedules,
  weather compensation and chrono settings, the event logger, alarm semaphores, reset commands (alarm, ignition box, maintenance
  counters), external request setpoints, the single-client alarm areas, the per-module maintenance intervals and dates, rarely
  used module counters, and modules 01–15.
