  - {key: x.primary_pump_hours, label: Primärpumpe / Ventilator (M11) Laufzeit, table: input, address: 74, type: u16, unit: h}
  - {key: x.heating_pump_hours, label: Heizungspumpe (M13) Laufzeit, table: input, address: 76, type: u16, unit: h}
  - {key: x.hot_water_pump_hours, label: Warmwasserpumpe (M18) Laufzeit, table: input, address: 77, type: u16, unit: h}
