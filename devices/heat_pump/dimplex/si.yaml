  - {key: x.sensor_status, label: Sensorfehler, table: input, address: 106, type: u16, enum: sensor_status}
  - {key: x.limittemp, label: Temperature limit, table: input, address: 5048, type: s16, unit: °C, scale: 0.1, sources: [evcc]}
  - {key: x.heating_energy_0, label: Wärmemenge Heizung (register 1), table: input, address: 5096, type: u16, unit: kWh}
  - {key: x.heating_energy_1, label: Wärmemenge Heizung (register 2), table: input, address: 5097, type: u16, unit: kWh, scale: 10000}
  - {key: x.heating_energy_2, label: Wärmemenge Heizung (register 3), table: input, address: 5098, type: u16, unit: kWh, scale: 100000000}
  - {key: x.hot_water_energy_0, label: Wärmemenge Warmwasser (register 1), table: input, address: 5099, type: u16, unit: kWh}
  - {key: x.hot_water_energy_1, label: Wärmemenge Warmwasser (register 2), table: input, address: 5100, type: u16, unit: kWh, scale: 10000}
  - {key: x.hot_water_energy_2, label: Wärmemenge Warmwasser (register 3), table: input, address: 5101, type: u16, unit: kWh, scale: 100000000}
  - {key: consumer_power, label: Power, table: input, address: 5170, type: u16, unit: W, scale: 10, positive: consumption, sources: [evcc]}

derived:
  - {key: x.heating_energy, label: Wärmemenge Heizung, unit: kWh, sum: [{key: x.heating_energy_0}, {key: x.heating_energy_1}, {key: x.heating_energy_2}]}
  - {key: x.hot_water_energy, label: Wärmemenge Warmwasser, unit: kWh, sum: [{key: x.hot_water_energy_0}, {key: x.hot_water_energy_1}, {key: x.hot_water_energy_2}]}

