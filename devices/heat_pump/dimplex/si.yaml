modbusspec: 0
id: dimplex-si
manufacturer: Glen Dimplex
name: Heat pumps with WPM controller
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/glen-dimplex.yaml
- id: modbus-local-gateway
  title: modbus_local_gateway (Home Assistant integration)
  url: https://github.com/timlaing/modbus_local_gateway
  license: MIT
  commit: e770d6c91220d98b8f0be22b103fdb607c3c67f4
  path: custom_components/modbus_local_gateway/device_configs/Dimplex-SI-11TU.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - modbus-local-gateway

points:
