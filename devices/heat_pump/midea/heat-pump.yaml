# Written from the Nordis OPTIMUS PRO wired controller manual (16110600A04631 V1.0, Lithuanian), chapter 8 "Modbus
# atitikmenų lentelė" (Modbus mapping table).

modbusspec: 0
id: midea-heat-pump
manufacturer: Midea
name: Air-to-water heat pump (hydraulic module with wired controller; also sold as Nordis OPTIMUS PRO)
kind: heat_pump

sources:
- title: OPTIMUS PRO laidinis valdiklis, naudojimo ir montavimo vadovas su Modbus lentele (wired controller manual, LT)
  version: 16110600A04631 V1.0
  url: https://nordis-ac.com/file/2025/11/16110600A04631-OPTIMUS-PRO-laidinis-valdiklis-120mm-su-Modbus-lentele-LT.pdf
  sha256: 659e6f4c3e2dc6eec37fc3dfaa1472c46cfcb56ffff3698112f095042d12e4c9
- id: modbus-local-gateway
  title: modbus_local_gateway (Home Assistant integration)
  url: https://github.com/timlaing/modbus_local_gateway
  license: MIT
  commit: e770d6c91220d98b8f0be22b103fdb607c3c67f4
  path: custom_components/modbus_local_gateway/device_configs/midea_heat_pump.yaml

connection:
  default_port: 502
  default_unit: 16
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # equipment type 0x07 (central heating) in the high byte
  - table: holding
    address: 200
    type: u16
    range:
    - 1792
    - 2047

points:
  # Wired controller registers (0 ff.; read 03, write 06 / 16)
  - {key: x.control_flags, label: On / off, table: holding, address: 0, type: u16, writable: true}
  - {key: x.floor_heating, label: Floor heating on / off (bit 0), table: holding, address: 0, type: u16, bits: [0, 0], writable: true}
  - {key: x.heating, label: Heat pump on / off zone 1 (bit 1), table: holding, address: 0, type: u16, bits: [1, 1], writable: true}
  - {key: x.dhw, label: DHW heating (T5S) on / off (bit 2), table: holding, address: 0, type: u16, bits: [2, 2], writable: true}
  - {key: x.heating_zone2, label: Heat pump on / off zone 2 (bit 3), table: holding, address: 0, type: u16, bits: [3, 3], writable: true}
  - {key: x.mode_set, label: Mode setting, table: holding, address: 1, type: u16, enum: mode_set, writable: true}
  - {key: x.heating_water_setpoint_raw, label: Water temperature setting T1S, table: holding, address: 2, type: u16, writable: true, note: '°C. The document doesn''t say whether the high byte holds a second value (e.g. zone 2). Ranges: cooling 5–25 °C (low) / 18–25 °C (high), heating 22–55 °C (low) / 35–60 °C (high) setting.'}
  - {key: x.room_air_setpoint_raw, label: Air temperature setting Ts, table: holding, address: 3, type: u16, writable: true, note: 'Room temperature 17–30 °C, used when room temperature control (Ta) is set; the document gives no resolution.'}
  - {key: x.dhw_setpoint, label: DHW tank temperature setting T5S, table: holding, address: 4, type: u16, unit: °C, writable: true, min: 40, max: 60}
  - {key: x.function_setting, label: Function setting, table: holding, address: 5, type: u16, writable: true}
  - {key: x.disinfect, label: Disinfection (bit 4), table: holding, address: 5, type: u16, bits: [4, 4], writable: true}
  - {key: x.holiday_away, label: Holiday away (bit 5; read only), table: holding, address: 5, type: u16, bits: [5, 5]}
  - {key: x.silent_mode, label: Silent mode (bit 6), table: holding, address: 5, type: u16, bits: [6, 6], writable: true}
  - {key: x.silent_level, label: Silent mode level (bit 7), table: holding, address: 5, type: u16, bits: [7, 7], enum: silent_level, writable: true}
  - {key: x.holiday_home, label: Holiday at home (bit 8; read only), table: holding, address: 5, type: u16, bits: [8, 8]}
  - {key: x.eco_mode, label: ECO mode (bit 10), table: holding, address: 5, type: u16, bits: [10, 10], writable: true}
  - {key: x.dhw_pump_recirculation, label: DHW pump in constant-temperature recirculation (bit 11), table: holding, address: 5, type: u16, bits: [11, 11], writable: true}
  - {key: x.climate_curve, label: Temperature curve setting on (bit 12), table: holding, address: 5, type: u16, bits: [12, 12], writable: true}
  - {key: x.curve_selection, label: Curve selection, table: holding, address: 6, type: u16, writable: true, min: 1, max: 8}
  - {key: x.fast_dhw, label: Forced DHW heating, table: holding, address: 7, type: u16, writable: true}
  - {key: x.forced_tbh, label: Forced tank heater (TBH) on, table: holding, address: 8, type: u16, writable: true}
  - {key: x.forced_ibh1, label: Forced indoor unit heater (IBH1) on, table: holding, address: 9, type: u16, writable: true}
  - {key: x.sg_max, label: t_SG_MAX, table: holding, address: 10, type: u16, unit: h, writable: true, min: 0, max: 24}

  # Operating parameters (100 ff.)
  - {key: x.operating_frequency, label: Operating frequency (compressor), table: holding, address: 100, type: u16, unit: Hz}
  - {key: x.operating_mode, label: Operating mode (actual), table: holding, address: 101, type: u16, enum: operating_mode}
  - {key: x.fan_speed, label: Fan speed, table: holding, address: 102, type: u16, unit: rpm}
  - {key: x.pmv_openness, label: PMV opening (outdoor unit electronic expansion valve), table: holding, address: 103, type: u16, note: Shown in multiples of 8 only., conflicts: [{sources: [modbus-local-gateway], unit: steps, label: PMV Openness}]}
  - {key: x.water_inlet_temperature, label: Return water temperature TW_in, table: holding, address: 104, type: s16, unit: °C}
  - {key: x.water_outlet_temperature, label: Supply water temperature TW_out, table: holding, address: 105, type: s16, unit: °C}
  - {key: x.condenser_temperature, label: T3 temperature (condenser), table: holding, address: 106, type: s16, unit: °C}
  - {key: x.outdoor_temperature, label: T4 temperature (outdoor ambient), table: holding, address: 107, type: s16, unit: °C}
  - {key: x.discharge_temperature, label: Discharge gas temperature Tp, table: holding, address: 108, type: s16, unit: °C}
  - {key: x.return_air_temperature, label: Suction gas temperature Th, table: holding, address: 109, type: s16, unit: °C}
  - {key: x.total_water_outlet_temperature, label: T1 (supply water temperature), table: holding, address: 110, type: s16, unit: °C}
  - {key: x.water_outlet_after_backup_heater_temperature, label: T1B (system supply water temperature after the backup heater), table: holding, address: 111, type: s16, unit: °C}
  - {key: x.refrigerant_liquid_temperature, label: T2 (refrigerant liquid side), table: holding, address: 112, type: s16, unit: °C}
  - {key: x.refrigerant_gas_temperature, label: T2B (refrigerant gas side), table: holding, address: 113, type: s16, unit: °C}
  - {key: x.room_temperature, label: Ta (room temperature), table: holding, address: 114, type: s16, unit: °C}
  - {key: x.water_tank_temperature, label: T5 (DHW tank temperature), table: holding, address: 115, type: s16, unit: °C}
  - {key: x.high_pressure, label: Pressure 1 (outdoor unit high pressure), table: holding, address: 116, type: u16, unit: kPa}
  - {key: x.low_pressure, label: Pressure 2 (outdoor unit low pressure), table: holding, address: 117, type: u16, unit: kPa}
  - {key: x.outdoor_current, label: Outdoor unit current, table: holding, address: 118, type: u16, unit: A}
  - {key: x.outdoor_voltage, label: Outdoor unit voltage, table: holding, address: 119, type: u16, unit: V}
  - {key: x.compressor_runtime, label: Compressor operating time, table: holding, address: 122, type: u16, unit: h, poll: slow}
  - {key: x.status_1, label: Status bits 1, table: holding, address: 128, type: u16}
  - {key: x.defrosting, label: Defrost running (bit 1), table: holding, address: 128, type: u16, bits: [1, 1]}
  - {key: x.anti_freezing, label: Anti-freeze running (bit 2), table: holding, address: 128, type: u16, bits: [2, 2]}
  - {key: x.oil_return, label: Oil return (bit 3), table: holding, address: 128, type: u16, bits: [3, 3]}
