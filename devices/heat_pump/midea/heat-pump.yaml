  - {key: x.outdoor_test_mode, label: Outdoor unit test mode flag (bit 5), table: holding, address: 128, type: u16, bits: [5, 5]}
  - {key: x.thermostat_heat_call, label: Room thermostat heating (bit 6), table: holding, address: 128, type: u16, bits: [6, 6]}
  - {key: x.thermostat_cool_call, label: Room thermostat cooling (bit 7), table: holding, address: 128, type: u16, bits: [7, 7]}
  - {key: x.solar_signal, label: Solar energy signal input (bit 8), table: holding, address: 128, type: u16, bits: [8, 8]}
  - {key: x.sg_signal, label: SG signal (bit 10), table: holding, address: 128, type: u16, bits: [10, 10], enum: sg_price, note: Only meaningful while EUV (bit 11) is 0.}
  - {key: x.euv_signal, label: EUV signal (bit 11), table: holding, address: 128, type: u16, bits: [11, 11], enum: euv}
  - {key: x.outputs, label: Status bits 2 (outputs), table: holding, address: 129, type: u16}
  - {key: x.ibh1, label: Indoor unit heater IBH1 (bit 0), table: holding, address: 129, type: u16, bits: [0, 0]}
  - {key: x.tbh, label: DHW tank heater TBH (bit 2), table: holding, address: 129, type: u16, bits: [2, 2]}
  - {key: x.internal_water_pump, label: Water circulation pump PUMP_I (bit 3), table: holding, address: 129, type: u16, bits: [3, 3]}
  - {key: x.dhw_diverter_valve, label: Three-way valve SV1 (bit 4), table: holding, address: 129, type: u16, bits: [4, 4]}
  - {key: x.external_water_pump, label: Secondary circuit pump P_o (bit 6), table: holding, address: 129, type: u16, bits: [6, 6]}
  - {key: x.dhw_recirculation_pump, label: DHW recirculation pump P_d (bit 7), table: holding, address: 129, type: u16, bits: [7, 7]}
  - {key: x.mixing_pump, label: Mixing circuit pump P_c (bit 8), table: holding, address: 129, type: u16, bits: [8, 8]}
  - {key: x.valve_sv2, label: Three-way valve SV2 (bit 9), table: holding, address: 129, type: u16, bits: [9, 9]}
  - {key: x.heat4_output, label: HEAT4 (bit 10), table: holding, address: 129, type: u16, bits: [10, 10]}
  - {key: x.solar_pump, label: Solar collector circulation pump (bit 11), table: holding, address: 129, type: u16, bits: [11, 11]}
  - {key: x.alarm, label: ALARM (bit 12), table: holding, address: 129, type: u16, bits: [12, 12]}
  - {key: x.unit_running, label: RUN (system running) (bit 13), table: holding, address: 129, type: u16, bits: [13, 13]}
  - {key: x.aux_heat_source, label: External heater (bit 14), table: holding, address: 129, type: u16, bits: [14, 14]}
  - {key: x.defrost_output, label: Defrost (bit 15), table: holding, address: 129, type: u16, bits: [15, 15]}
  - {key: x.unit_version, label: Unit (indoor unit) version number, table: holding, address: 130, type: u16, poll: slow, note: 1–99.}
  - {key: x.wired_controller_version, label: Wired controller version number, table: holding, address: 131, type: u16, poll: slow, note: 1–99.}
  - {key: x.target_frequency, label: Unit target frequency, table: holding, address: 132, type: u16, unit: Hz}
  - {key: x.dc_bus_current, label: DC bus current, table: holding, address: 133, type: u16, unit: A}
  - {key: x.dc_bus_voltage, label: DC bus voltage, table: holding, address: 134, type: u16, unit: V, scale: 10, note: The register holds the voltage / 10.}
  - {key: x.inverter_module_temperature, label: TF module temperature (feedback from the outdoor unit), table: holding, address: 135, type: s16, unit: °C}
  - {key: x.curve_calculated_water_setpoint, label: Temperature curve T1S calculated value zone 1, table: holding, address: 136, type: s16, unit: °C}
  - {key: x.curve_calculated_water_setpoint_zone2, label: Temperature curve T1S calculated value zone 2, table: holding, address: 137, type: s16, unit: °C}
  - {key: x.water_flow, label: Water flow, table: holding, address: 138, type: u16, unit: m³/h, scale: 0.01}
  - {key: x.current_limit, label: Outdoor unit current limiting, table: holding, address: 139, type: u16}
  - {key: x.hydraulic_power, label: Hydraulic module capacity, table: holding, address: 140, type: u16, unit: W, scale: 10, note: kW × 100 in the register.}

  # Parameter settings (200 ff.)
  - {key: x.equipment_type, label: Equipment type, table: holding, address: 200, type: u16, bits: [8, 15], enum: equipment_type, poll: slow}
  - {key: x.cooling_upper_limit, label: T1S cooling upper limit, table: holding, address: 201, type: u16, unit: °C, poll: slow}
  - {key: x.cooling_lower_limit, label: T1S cooling lower limit, table: holding, address: 202, type: u16, unit: °C, poll: slow}
  - {key: x.heating_upper_limit, label: T1S heating upper limit, table: holding, address: 203, type: u16, unit: °C, poll: slow}
  - {key: x.heating_lower_limit, label: T1S heating lower limit, table: holding, address: 204, type: u16, unit: °C, poll: slow}
