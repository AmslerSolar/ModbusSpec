notes:
- 'RS-485 on the wired controller''s H1 / H2 terminals (A+ / B−); Modbus RTU only (no ASCII), 9600 baud, 8 data bits, no parity,
  1 stop bit. The address follows the hydraulic module''s rotary switch S3 (0–F): position 0, the factory setting, is address
  16; other positions are their own number. Port 502 is for a gateway.'
- All registers are holding registers (function 03; write with 06 / 16). The document gives 0-based addresses together with
  their PLC numbers (0 = 40001).
- 'The document gives no data types: temperatures are taken as signed whole °C, everything else as unsigned.'
- Current fault (124) and faults 1–3 (125–127) refer to a fault code table the document doesn't contain; they are left to
  the other sources.
- 'The `reserved` registers are, in the document: 120 and 121 indoor unit current 1 / 2, 123, and 247–254 ECO and comfort
  parameters (these answer with an illegal-address error); bits 1 and 5 of 129 (no IBH2 output, no valve SV3 here).'
- 'Left out: the floor drying settings (255–260), power input limitation type (269), the T4 fresh times stored × 2 (270, 271)
  and the emission types (272, four 4-bit fields).'
- 'Left out: Buffer Tank Upper Temperature (holding 120) from modbus-local-gateway: the documents mark it reserved.'
- 'Left out: Buffer Tank Lower Temperature (holding 121) from modbus-local-gateway: the documents mark it reserved.'
- 'Left out: Unit Capacity (holding 123) from modbus-local-gateway: the documents mark it reserved.'
- 'Left out: Backup Heater IBH2 (holding 129 bit 1) from modbus-local-gateway: the documents mark it reserved.'
- 'Left out: Valve SV2 (holding 129 bit 5) from modbus-local-gateway: the documents mark it reserved.'
