enums:
  mode_set: {'1': Auto, '2': Cool, '3': Heat}
  operating_mode: {'0': 'Off', '2': Cool, '3': Heat}
  silent_level: {'0': Level 1, '1': Level 2}
  sg_price: {'0': High-price electricity, '1': Normal-price electricity}
