notes:
- The document lists a 0-based address and a 1-based "de facto" address (00001 / 10001 / 30001 / 40001 style) for each register;
  the 0-based ones are used here.
- The document doesn't say how the two models can be told apart over Modbus, so the user picks the model. Registers marked
  for only one of them carry `models`; the rest apply to both.
- Analog registers use two's complement for negative values; the document doesn't say per register which are signed. Temperatures,
  set points and powers are read as signed, positions, speeds and counters as unsigned.
- '32-bit counters are split into MSB and LSB registers: the operating hours MSB first, the electric meter total LSB first.'
- The alarm classes (A–E) are not explained in the document; which alarms are faults and which warnings here is assumed. Mega
  systems with Genesis or legacy secondary units have further per-unit alarm bit fields (input 153–173) that are left out.
- 'Left out: the heat curve coordinates, the mixing valve 2–5 curves and limits, the extension-module (EM) cooling, surplus
  heat, WCS and TWC registers, PID values, pump speed limits and most enable coils.'
- 'Factory settings: RTU 19200 baud, even parity, 1 stop bit, address 1; TCP port 502 (the unit id is ignored on TCP).'
- openwb give word order little; the documents' setting (big) is used.
