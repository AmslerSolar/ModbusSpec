- title: Modbus protocol for Genesis platform (User Guide VSJSD1002)
  version: '10.0'
  url: https://www.tcmadmin.thermia.se/docroot/dokumentbank/Modbus%20protocol%20for%20Genesis%20platform%2010.pdf
  sha256: b02ad7d21a2e34b69c0e4f051936385b9e3e169478db66edc46f43898b05b2a3
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/thermia/thermia

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
