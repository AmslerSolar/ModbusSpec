  operating_status: {'0': Heating circuit 1 pump, '1': Heating circuit 2 pump, '2': Heat-up program, '3': Electric emergency / booster heater, '4': Heating, '5': DHW heating, '6': Compressor, '7': Summer mode, '8': Cooling mode, '9': Defrost, '10': Silent mode 1, '11': Silent mode 2 (off)}

problems:
  - {when: {key: x.fault_status, equals: 1}, kind: fault, text: System fault (fatal error)}
  - {when: {key: x.bus_status, in: [-1, -2]}, kind: warning, text: 'Bus fault (bus status {value})'}
  - {when: {key: x.bus_status, equals: -3}, kind: warning, text: 'CAN bus error (bus status {value})'}
  - {when: {key: x.bus_status, equals: -4}, kind: warning, text: 'Bus line fault (bus status {value})'}

notes:
- Read through the ISG (web, plus or Connect) with the Modbus TCP/IP software extension. It can't be combined with other ISG
  software extensions, except read-only use alongside EMI energy management.
- The document numbers registers from 1 ("to read 30501, address 501 with function 04"); the protocol addresses here are one
  lower. The document adds that some configurations need an offset of 1, so a reader may have to try both.
- Raw 0x8000 (32768) is the ISG's "not available" value for every register, signed or unsigned.
- 'Data types: 2 = signed × 0.1, 6 = unsigned × 1, 7 = signed × 0.01, 8 = 0…255.'
- Only WPM 3, WPM 3i and WPMsystem use this register map. Integral ventilation units (LWZ, codes 103/104) and older managers
  (WPM I/2/X …) use other maps.
- Energy totals are split into a kWh part (0…999) and an MWh part in the next register (see derived). Day counters are whole
  kWh. The booster heater has no electrical counter.
- The ISG reports no instantaneous electrical power for WPM 3 / WPM 3i (WPMsystem has inverter power for IWS units only, not
  covered here).
- The document gives no request limit; reading 501…548 as one 48-register block (single registers when refused) is assumed
  to work. The current edition names no port or unit id; the older editions (Stand 9046, 9535) give TCP port 502 and slave
  id 1, fixed.
- Active cooling can be taken as B8 (cooling mode) and B6 (compressor) both set; reading B8 as active cooling is unconfirmed.
- In documented numbers, 539 (WPM 3i hot gas) can stand in when 544 is missing and 609 when 515 is missing; whether a WPM
  3i refuses or answers 0x8000 for the heat pump 1 registers 542…548 is unconfirmed.
- 'Bus status texts differ between editions: the current one has OK, fault, fault, CAN error, line fault (0 … −4); the older
  ones (Stand 9046, 9535) name them Status OK, Status error, Error passive, Bus off, Physical error.'
- 'WPMsystem only (left out): dew points of heating circuits 1–5 (documented 587, 591 … 603), cooling circuit 1–5 room set
  temperatures (604 … 608), heating circuit 3–5 actual / set temperatures (610 … 615), the WPE expansion outputs (2528 … 2541)
  and the source pump states (2561 ff., with IWS units only). Documented 608 is the cooling circuit 5 set temperature in every
  edition; the WPM 3i flow temperature at documented 609 is only in the current one.'
- 'WPM 3 (left out): energy and run times per heat pump in blocks of 26 registers from documented 3523 (heat pump 1: heat
  amounts 3523 … 3532, power consumption 3533 … 3538, run times 3539 … 3548), laid out like the totals.'
- Heat-pump-specific energy and runtime values repeat every 26 registers per heat pump (and system values per heat pump in
  their own spacing); only heat pump 1 is listed.
- The binding treats 0x8000 (−32768 signed) as 'not available' and then stops reading that feature.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Read through the STIEBEL ELTRON ISG web gateway (Modbus TCP; the Modbus module of the ISG must be enabled).
- Addresses are 0-based protocol addresses; the manual numbers the registers from 1 (one higher).
- Raw 0x8000 means the value is not available on this machine.
- 'Input 5001 holds the controller identification: 103 = LWZ, 104 = LWZ x04 SOL, 390 = WPM 3, 391 = WPM 3i, 449 = WPMsystem,
  551 = LWZ R290.'
- The 'extended' blocks (energy management, efficiency, inverter power and, on WPM, versions and extra circuits) are not served
  by every controller and firmware; such a controller answers with an illegal data address exception, so read them separately
  from the rest.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
