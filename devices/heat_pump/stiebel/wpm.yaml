  path: api/wpm_*.csv, pystiebeleltron/wpm.py, pystiebeleltron/__init__.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 48

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # outdoor −60…80 °C
  - - table: input
      address: 506
      type: s16
      range:
      - -600
      - 800
    # or not available
    - table: input
      address: 506
      type: s16
      equals: -32768
  # status bits only B0–B11
  - table: input
    address: 2500
    type: u16
    range:
    - 0
    - 4095
  # fatal error
  - table: input
    address: 2503
    type: u16
    in:
    - 0
    - 1
  # bus status
  - table: input
    address: 2504
    type: s16
    range:
    - -4
    - 0
  any:
  # controller identification
  - table: input
    address: 5001
    type: u16
    in:
    - 390
    - 391
    - 449
  # or none: the checks above decide
  - table: input
    address: 5001
    type: u16
    answers: false

models:
  - {id: wpmsystem, name: WPMsystem, match: {table: input, address: 5001, type: u16, equals: 449}}
  - {id: wpm3, name: WPM 3, match: {table: input, address: 5001, type: u16, equals: 390}}
  - {id: wpm3i, name: WPM 3i, match: {table: input, address: 5001, type: u16, equals: 391}}

