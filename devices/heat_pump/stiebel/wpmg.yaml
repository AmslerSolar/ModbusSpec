notes:
- Read through the ISG web with the Modbus TCP/IP software extension (order no. 316303); port 502, fixed slave id 1.
- 'Addresses: the document lists each register as a 3xxxx (input) or 4xxxx (holding) reference and as a plain number (e.g.
  36000 / 6000), and says the ISG addressing is 1-based. The protocol addresses here are the plain number minus 1, as for
  the other ISG maps; that this also holds for WPM G is not stated, so every point is unverified and a reader may have to
  try the plain number itself.'
- 'The document gives a factor per register: the raw value is the real value times the factor (10 → scale 0.1, 100 → scale
  0.01). Types and signs are not stated: temperatures and temperature differences are taken as signed, everything else as
  unsigned. Booleans are 0 / 1.'
- Values split into LSW and MSW registers are combined as MSW × 65536 + LSW (see derived).
- Only the primary heat pump is described here. Block 1 values exist for secondary heat pumps 1…5 at the primary's number
  + 150 × n (e.g. 6150, 6300 … for 6000), and the collective level 1/2/3 notifications (9000…9002) at + 150 × n as well; reset
  all alarms is 7200 for the primary and 7201…7205 for secondary 1…5.
- 'Left out: the heating curve set values and per-circuit maximum / minimum temperatures (documented 7029…7079).'
- The document gives no severity for the notification levels; level 1 (refrigerant circuit and compressor protections) is
  taken as a fault, levels 2 and 3 and the collective notification as warnings.
- The document names no "not available" value for this map and no controller identification register, so the map can't be
  identified on the network.
