notes:
- Read through the ISG web with the Modbus TCP/IP software extension (order no. 316303). It can't be combined with other ISG
  software extensions. The ISG answers on port 502 with the fixed slave id 1.
- The document numbers registers from 1 (register 30001 / 40001 = its address 1) and says the ISG addressing is 1-based; the
  protocol addresses here are the document's numbers minus 1. The document adds that some configurations need an offset of
  1, so a reader may have to try both.
- Raw 0x8000 (32768) is the ISG's "not available" value. On LWZ units a missing or open sensor reads −60 °C and a shorted
  one −50 °C (newer edition).
- 'Data types: 2 = signed × 0.1, 6 = unsigned × 1, 7 = signed × 0.01, 8 = 0…255.'
- Energy totals are split into a kWh part (0…999) and an MWh part in the next register (see derived). Day counters are whole
  kWh.
- Not every register is served by every unit; the document marks LWZ-only and model-specific registers (noted per point).
- The older edition (Stand 9046) lacks 2004/2005 (defrost, status 2) and blocks 5 and 6.
- Controller identification (documented 5002) 103 / 104 tells this map from the WPM heat pump managers (390, 391, 449), which
  use another map.
- The ISG reports no instantaneous electrical power for these units.
- 'evcc template `stiebel-lwa` (single device) lists: Stiebel Eltron LWA/LWZ (SG Ready); Tecalor THZ (SG Ready).'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Read through the STIEBEL ELTRON ISG web gateway (Modbus TCP; the Modbus module of the ISG must be enabled).
- Addresses are 0-based protocol addresses; the manual numbers the registers from 1 (one higher).
- Raw 0x8000 means the value is not available on this machine.
- 'Input 5001 holds the controller identification: 103 = LWZ, 104 = LWZ x04 SOL, 390 = WPM 3, 391 = WPM 3i, 449 = WPMsystem,
  551 = LWZ R290.'
- The 'extended' blocks (energy management, efficiency, inverter power and, on WPM, versions and extra circuits) are not served
  by every controller and firmware; such a controller answers with an illegal data address exception, so read them separately
  from the rest.
- Identification as pystiebeleltron recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
