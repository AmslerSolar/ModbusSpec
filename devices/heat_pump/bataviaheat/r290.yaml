enums:
  working_mode: {'1': Cool, '2': Heat, '3': Auto}
  power_mode: {'0': Standard, '1': Powerful, '2': Eco, '3': Auto}
  auxiliary_heater_mode: {'0': 'Off', '1': Heating only, '2': DHW only, '3': Heating + DHW}
  external_heat_source_mode: {'0': 'Off', '1': Heating only, '2': DHW only, '3': Heating + DHW}
  pump_operating_mode: {'0': Continuous, '1': Stop at temp, '2': Intermittent}
  pump_control_type: {'1': Speed, '2': Flow, '3': On-Off, '4': Power}
  lower_return_pump_sterilization: {'0': 'Off', '1': 'On'}
  lower_return_pump_timed: {'0': 'Off', '1': 'On'}

notes:
- BataviaHeat R290 3-8 kW monobloc, made by Newntide; other Newntide-based heat pumps may share this map. The map was found
  by bus sniffing and register scans, not from a manufacturer document.
- 'RS485 behind the heat pump''s tablet controller: only one Modbus master may poll the bus. BataviaHeat-Heat-Pump either
  shares it with the tablet (timing its requests to the tablet''s cycle) or uses the secondary RS485 port on the mainboard.'
- Raw values 32834 and 32836 (0x8042, 0x8044) mean a disconnected sensor.
- 'Holding 768, 772, 773 and 776 must be read one at a time: a block read returns too few registers and 0 for 772. They read
  0 while the compressor is off.'
- Holding registers 5, 72, 74-76 and 187-189 look like sensor values but are not kept up to date by the heat pump; live sensor
  data is in the input registers.
- The coils are write-only pulses (function 05, value 0xFF00), one coil to switch on and another to switch off; they cannot
  be read back. The state is in holding 912 (unit power) and 913 (silent mode).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
