- id: bataviaheat-heat-pump
  title: BataviaHeat-Heat-Pump (Home Assistant integration)
  url: https://github.com/RSloot2000/BataviaHeat-Heat-Pump
  license: MIT
  commit: 3146477cc9812b05322a8a39a3ebcda6ade31839
  path: custom_components/batavia_heat/const.py, custom_components/batavia_heat/translations/en.json

connection:
  default_port: 502
  default_unit: 1
  transports:
