enums:
  system_mode: {'0': Standby, '1': Automatic, '2': Absent, '4': Hot Water Only, '5': Heating/Cooling Only}
  smart_grid: {'0': Red, '1': Yellow, '2': Green, '4': Supergreen}
  variable_input: {'0': Not configured, '1': External DHW Charging, '2': PV / Digital Input, '3': External Heat/Cool Switch}
  hp_operating_mode: {'0': Standby, '1': Heating, '2': Cooling, '4': DHW, '8': Defrost}
  evu_lock: {'0': Locked, '1': Not Locked}
  bivalence_state: {'0': 'Off', '1': Bivalence 1 Active, '2': Bivalence 2 Active, '3': Bivalence 1+2 Active}
  booster_fault: {'0': No fault, '1': Booster A fault, '2': Booster B fault, '3': Booster A + B fault}
  solar_mode: {'0': Automatic, '1': DHW, '2': Heating, '3': DHW + Heating, '4': Heat Source / Pool}
  isc_mode: {'0': No Waste Heat, '1': Heating, '4': DHW, '8': Heat Source, '255': Not configured / Unavailable}
  circuit_mode: {'0': 'Off', '1': Time Program, '2': Normal, '3': Eco, '4': Manual Heat, '5': Manual Cool, '255': Not configured / Unavailable}
  active_hc_mode: {'0': 'Off', '1': Heating, '2': Cooling, '255': Not configured / Unavailable}
  zone_module_mode: {'0': Cooling, '1': Heating}
  room_mode: {'0': 'Off', '1': Automatic, '2': Eco, '3': Normal, '4': Comfort}

notes:
- 'evcc template `idm` (single device) lists: IDM.'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Floats span two registers with the low word first.
- Single-byte values (UCHAR in iDM's list) sit in the low byte of the register (bits 0-7).
- 'idm-heatpump-api tells the controller generations apart by which addresses are rejected with Illegal Data Address: Navigator
  10 answers the 4001+ booster and 4108/4122/4126 power registers, Navigator 2.0 / Pro reject them; Navigator 1.0/1.7 rejects
  the heating-circuit block at 1350 (see the separate device).'
- 'Heating circuits A-G repeat the same registers per circuit: floats at a stride of 2 registers, single bytes at a stride
  of 1.'
- Zone modules 1-10 start at 2000 + 65 × (n − 1); each room n uses 7 registers from module base + 2 + 7 × (n − 1). Current
  Navigator 10 modules have 6 rooms, older ones up to 8; all 8 are listed.
- Optional blocks (solar 1850+, ISC 1870+, PV 74+, cascade) exist only when installed; idm-heatpump-api probes them before
  polling.
- When a register has no explicit no-value marker, idm-heatpump-api treats −1.0 (float), 255 (byte), 65535 (UINT16) and −1
  / −32768 (INT16) as "not configured"; only explicit markers are listed as `invalid` here.
- The PV / energy-management registers (74-88) and the GLT registers (1690+) are inputs a building management system writes
  to the heat pump.
- The values openWB writes (registers 74-86) go to the building management (Smartfox) interface; the controller plans its
  surplus use from them.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- 'Left out: hc_a_mode (input 1393, u16) from idm-heatpump-api overlaps humidity_sensor (input 1392, f32); check a document.'
- 'Left out: hc_a_heating_limit (input 1442, u16) from idm-heatpump-api overlaps hc_g_heating_curve (input 1441, f32); check
  a document.'
- 'Left out: hc_a_cooling_limit (input 1484, u16) from idm-heatpump-api overlaps hc_g_room_setpoint_cool_eco (input 1483,
  f32); check a document.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
