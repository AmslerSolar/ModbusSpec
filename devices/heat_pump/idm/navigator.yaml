modbusspec: 0
id: idm-navigator
manufacturer: IDM
name: Navigator heat pump controllers
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/idm.yaml
- id: idm-heatpump-api
  title: idm-heatpump-api (Python library for iDM Navigator heat pumps)
  url: https://github.com/Xerolux/idm-heatpump-api
  license: MIT
  commit: a370c173aa7930cd607b80f37028119cb63a42b5
  path: idm_heatpump/registers.py, idm_heatpump/const.py
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/idm/idm, packages/modules/consumers/idm/idm/consumer.py, packages/modules/smarthome/idm/watt.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - idm-heatpump-api

models:
  - {id: idm_heatpump_api_navigator_10, name: Navigator 10}

