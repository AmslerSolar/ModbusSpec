enums:
  hp_operating_mode: {'0': Standby, '1': Heating, '2': Cooling, '4': DHW, '8': Defrost}
  pump_status: {'0': 'Off', '1': Running, '2': Fault}
  system_mode_17: {'0': Standby, '1': Automatic, '2': Hot Water, '3': Hot Water Once}
  hc_operating_mode_17: {'0': 'Off', '1': Time Program, '2': Normal, '3': ECO, '4': Heating Only}
  solar_operating_mode_17: {'0': Automatic, '1': Domestic Water, '2': Heat Storage, '3': Domestic Water + Heat Storage, '4': Heat Source / Pool}

notes:
- Navigator 1.0 / 1.7 use a register layout of their own, not the Navigator 2.0 / 10 one. idm-heatpump-api detects them when
  address 1000 answers but 1350, 1498 and 2000 are rejected with Illegal Data Address.
- Floats span two registers with the low word first. Values from 1000 and status words from 1500 are input registers; the
  settings from 2000 are holding registers (all stored in EEPROM).
- The PV registers 74-82 and the power value at 4122 exist only on controllers with the later PV extension (address 74 answers).
- 'Coils 3000 (acknowledge fault) and 3003 (request hot-water priority charge) are momentary commands: the controller acts
  when the bit is set and clears it again itself. Coils 3001/3002 (heating / cooling request) are left out by idm-heatpump-api;
  the operating-mode registers serve that purpose.'
- Identification as idm-heatpump-api recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
