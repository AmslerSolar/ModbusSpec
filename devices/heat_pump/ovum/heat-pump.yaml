modbusspec: 0
id: ovum-heat-pump
manufacturer: OVUM
name: Heat pumps (CubeSpeicher / MPlus)
kind: heat_pump

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/ovum/ovum/consumer.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: consumer_power, label: Electrical power, table: holding, address: 708, type: s16, unit: W, scale: 10, positive: consumption}
  - {key: x.control_mode, label: Control mode, table: holding, address: 709, type: s16, enum: ovum_control_mode, writable: true}
  - {key: x.grid_balance, label: Grid balance (PV-Watch TCP), table: holding, address: 710, type: s16, unit: W, scale: 10, writable: true, note: openWB writes its grid power here; whether the heat pump only shows it is unverified per openWB.}
  - {key: x.power_target, label: Power target, table: holding, address: 711, type: s16, unit: W, scale: 10, writable: true}
  - {key: x.sg_ready_tcp, label: SG Ready via Modbus, table: holding, address: 1250, type: s16, writable: true, note: 1 = SG Ready contacts from registers 1251 and 1252.}
  - {key: x.sg_ready_contact_1, label: SG Ready contact 1, table: holding, address: 1251, type: s16, writable: true}
  - {key: x.sg_ready_contact_2, label: SG Ready contact 2, table: holding, address: 1252, type: s16, writable: true}

enums:
  ovum_control_mode: {'0': Own PV-Watch control, '2': External power target (register 711)}

notes:
- For SG Ready over Modbus openWB sets register 1250 to 1 and then contact 1 = 0, contact 2 = 1 (on recommendation) or both
  0 (normal).
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
