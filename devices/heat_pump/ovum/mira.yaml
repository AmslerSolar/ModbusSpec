modbusspec: 0
id: ovum-mira
manufacturer: OVUM
name: MIRA
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/ovum-mira.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.limittemp, label: Temperature limit, table: holding, address: 55002, type: s16, unit: °C, unit_id: 110, note: Used by evcc only with the template option tempsource = warmwater.}
  - {key: x.temp, label: Temperature, table: holding, address: 55007, type: f32, unit: °C, unit_id: 110, note: Used by evcc only with the template option tempsource = warmwater.}
  - {key: x.limittemp_55021, label: Temperature limit, table: holding, address: 55021, type: s16, unit: °C, unit_id: 110, note: Used by evcc only with the template option tempsource = buffer.}
  - {key: x.temp_55026, label: Temperature, table: holding, address: 55026, type: f32, unit: °C, unit_id: 110, note: Used by evcc only with the template option tempsource = buffer.}
  - {key: x.getmode, label: Operating mode, table: holding, address: 55070, type: s16, unit_id: 110, writable: true, note: 'evcc translates the raw values 0→2, 1→3, 2→1 for the operating mode. evcc writes operating mode: 2/0/1.'}
  - {key: x.setmaxpower_55076, label: Power limit (write), table: holding, address: 55076, type: s32, unit: W, unit_id: 110, writable: true}
  - {key: consumer_power, label: Power, table: holding, address: 56021, type: f32, unit: W, scale: 1000, unit_id: 111, positive: consumption}

notes:
- 'evcc template `ovum-mira` (single device) lists: OVUM MIRA.'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
