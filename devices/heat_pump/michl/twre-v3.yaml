#
# Written from the Michl "Modbus Beschreibung Michl TWRE V3 Monoblock Serie" (no version; PDF dated 2026-04-22).
# The document is a German translation of the controller maker's protocol; where its wording is unclear, the label
# here says what the register most likely is and the note says so.

modbusspec: 0
id: michl-twre-v3
manufacturer: Michl
name: TWRE V3 monoblock heat pumps
kind: heat_pump

sources:
- title: Modbus Beschreibung Michl TWRE V3 Monoblock Serie
  version: undated (PDF of 2026-04-22)
  url: https://michl.com/bilder/intern/downloads/Modbus%20Beschreibung%20Michl%20TWRE%20V3%20Monoblock%20Serie.pdf
  sha256: 79e6533649e5d636de489cfba2ef43447978803e8dd321c1624be8b99990ccbe

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 120
    min_interval_ms: 200

encoding:
  byte_order: big
  word_order: big

points:
  # Unit status (0x0000 ff., read only)
  - {key: firmware, label: Motherboard version, table: holding, address: 1, type: u16, poll: slow}
  - {key: x.switch_status, label: Switch status, table: holding, address: 2, type: u16, flags: switch_status, note: 'Each input: 0 = closed, 1 = open (bit 2: 1 = energy-saving mode).'}
  - {key: x.work_status, label: Working status, table: holding, address: 3, type: u16, flags: work_status}
  - {key: x.outputs_1, label: Output flags 1, table: holding, address: 4, type: u16, flags: outputs_1}
  - {key: x.outputs_2, label: Output flags 2, table: holding, address: 5, type: u16, flags: outputs_2}
  - {key: x.outputs_3, label: Output flags 3, table: holding, address: 6, type: u16, flags: outputs_3}
  - {key: x.fault_1, label: Fault flags 1, table: holding, address: 7, type: u16, flags: fault_1}
  - {key: x.fault_2, label: Fault flags 2, table: holding, address: 8, type: u16, flags: fault_2}
  - {key: x.fault_3, label: Fault flags 3, table: holding, address: 9, type: u16, flags: fault_3}
  - {key: x.fault_4, label: Fault flags 4, table: holding, address: 10, type: u16, flags: fault_4}
  - {key: x.fault_5, label: Fault flags 5, table: holding, address: 11, type: u16, flags: fault_5}
  - {key: x.fault_6, label: Fault flags 6, table: holding, address: 12, type: u16, flags: fault_6}
  - {key: x.fault_7, label: Fault flags 7, table: holding, address: 13, type: u16, flags: fault_7}
  - {key: x.inlet_water_temperature, label: Inlet water temperature, table: holding, address: 14, type: s16, unit: °C, scale: 0.1}
  - {key: x.tank_temperature, label: Water tank temperature, table: holding, address: 15, type: s16, unit: °C, scale: 0.1}
  - {key: x.outdoor_temperature, label: Ambient temperature, table: holding, address: 17, type: s16, unit: °C, scale: 0.5}
  - {key: x.outlet_water_temperature, label: Outlet water temperature, table: holding, address: 18, type: s16, unit: °C, scale: 0.1}
  - {key: x.suction_temperature, label: Suction (return gas) temperature, table: holding, address: 21, type: s16, unit: °C, scale: 0.5}
  - {key: x.outer_coil_temperature, label: External coil temperature, table: holding, address: 22, type: s16, unit: °C, scale: 0.5}
  - {key: x.total_outlet_water_temperature, label: Total outlet water temperature, table: holding, address: 24, type: s16, unit: °C, scale: 0.1}
  - {key: x.coil_temperature, label: Coil temperature, table: holding, address: 26, type: s16, unit: °C, scale: 0.5}
  - {key: x.discharge_temperature, label: Discharge (exhaust gas) temperature, table: holding, address: 27, type: s16, unit: °C}
  - {key: x.main_eev_opening, label: Main expansion valve opening, table: holding, address: 28, type: u16, note: Unit not stated (the valve settings count in steps of 2 P).}
  - {key: x.aux_eev_opening, label: Auxiliary expansion valve opening, table: holding, address: 29, type: u16, note: Unit not stated.}
  - {key: x.compressor_frequency, label: Compressor actual frequency, table: holding, address: 30, type: u16, unit: Hz, verified: false, note: Unit not stated in the document; assumed Hz (the frequency settings are in Hz).}
  - {key: x.drive_fault_low, label: 'Inverter drive fault, low byte', table: holding, address: 31, type: u16, flags: drive_fault_low}
  - {key: x.drive_fault_high, label: 'Inverter drive fault, high byte', table: holding, address: 32, type: u16, flags: drive_fault_high}
  - {key: x.dc_bus_voltage, label: DC voltage, table: holding, address: 33, type: u16, note: Unit and scale not stated.}
  - {key: x.heatsink_temperature, label: Heat sink temperature, table: holding, address: 34, type: s16, note: Unit and scale not stated.}
  - {key: x.compressor_current, label: Compressor current, table: holding, address: 35, type: u16, note: Unit and scale not stated.}
  - {key: x.compressor_target_frequency, label: Target frequency, table: holding, address: 36, type: u16, note: Unit not stated.}
  - {key: x.fan1_speed, label: DC fan 1 speed, table: holding, address: 38, type: u16, note: Unit not stated.}
  - {key: x.fan2_speed, label: DC fan 2 speed, table: holding, address: 39, type: u16, note: Unit not stated.}
  - {key: x.low_pressure_saturation_temperature, label: Low pressure converted to temperature, table: holding, address: 40, type: s16, unit: °C, scale: 0.1}
  - {key: x.pump_speed, label: DC water pump actual speed, table: holding, address: 42, type: u16, unit: '%'}
  - {key: x.low_pressure, label: Low pressure, table: holding, address: 43, type: u16, unit: bar, scale: 0.1}
  - {key: x.auto_target_temperature, label: Automatically adjusted target temperature, table: holding, address: 45, type: s16, note: Unit and scale not stated.}
  - {key: x.water_flow, label: Water flow, table: holding, address: 48, type: u16, unit: m³/h, scale: 0.01}
  - {key: x.supply_voltage, label: Total voltage, table: holding, address: 49, type: u16, unit: V}
  - {key: l1_current, label: Phase A current (single-phase current), table: holding, address: 50, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase B current, table: holding, address: 51, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase C current, table: holding, address: 52, type: u16, unit: A, scale: 0.1}
  - {key: consumer_power, label: Total power, table: holding, address: 53, type: u16, unit: W, positive: consumption, verified: false, note: 'Electrical input power. The document gives no direction; the register is taken as unsigned, so positive = consumption (assumed).'}
  - {key: x.thermal_power, label: Heating / cooling capacity, table: holding, address: 54, type: u16, unit: kW, scale: 0.1}
  - {key: x.cop, label: COP, table: holding, address: 55, type: u16, scale: 0.1}
  - {key: x.pump_target_speed, label: Water pump target speed, table: holding, address: 56, type: u16, unit: '%'}
  - {key: state, label: Machine status, table: holding, address: 57, type: u16, enum: machine_status}

  # Common status of the cascade (0x0800 ff.), served by unit 1
  - {key: x.common_status, label: Common status 1, table: holding, address: 2048, type: u16, flags: common_status}
  - {key: x.common_fault, label: Common fault 1, table: holding, address: 2050, type: u16, flags: common_fault}
  - {key: x.common_tank_temperature, label: Common water tank temperature, table: holding, address: 2052, type: s16, unit: °C, scale: 0.1, verified: false, note: Scale not stated in the document; assumed 0.1 °C like the unit's own tank temperature (0x000F).}
  - {key: x.common_outdoor_temperature, label: Common ambient temperature, table: holding, address: 2054, type: s16, unit: °C, scale: 0.5, verified: false, note: Scale not stated in the document; assumed 0.5 °C like the unit's own ambient temperature (0x0011).}
  - {key: x.common_outlet_water_temperature, label: Common total outlet water temperature, table: holding, address: 2055, type: s16, unit: °C, scale: 0.1, verified: false, note: Scale not stated in the document; assumed 0.1 °C like 0x0018.}
  - {key: x.sg_mode, label: Common SG / EVU mode, table: holding, address: 2057, type: u16, enum: sg_mode}
  - {key: x.units_defrosting, label: Units defrosting now, table: holding, address: 2058, type: u16}
  - {key: x.units_allowed_on, label: Cascaded units allowed to run, table: holding, address: 2059, type: u16}

  # User parameters (0x2000 ff.); writes only on unit 1
  - {key: x.control_flags_1, label: Control flags 1, table: holding, address: 8192, type: u16, flags: control_flags_1, writable: true, poll: slow, persistent: true}
  - {key: x.on_off, label: On / off, table: holding, address: 8192, type: u16, bits: [0, 0], enum: on_off, writable: true, poll: slow, persistent: true}
  - {key: x.mode, label: Operating mode, table: holding, address: 8194, type: u16, enum: mode, writable: true, poll: slow, persistent: true}
  - {key: x.heating_hysteresis, label: P01 Heating / cooling hysteresis, table: holding, address: 8195, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 2, max: 18, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.hot_water_hysteresis, label: P02 Hot water hysteresis, table: holding, address: 8196, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 2, max: 18, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.hot_water_setpoint, label: P03 Hot water set temperature, table: holding, address: 8197, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 28, max: 60, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.cooling_setpoint, label: P04 Cooling set temperature, table: holding, address: 8198, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 7, max: 30, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.heating_setpoint, label: P05 Heating set temperature, table: holding, address: 8199, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 15, max: 50, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.holiday_setpoint, label: Holiday mode set temperature, table: holding, address: 8200, type: u16, unit: °C, writable: true, poll: slow, verified: false, min: 7, max: 50, persistent: true, note: Scale not stated; assumed whole degrees.}
  - {key: x.sg_run_time, label: SG run time, table: holding, address: 8229, type: u16, unit: min, scale: 10, writable: true, poll: slow, min: 0, max: 600, persistent: true}
  - {key: x.external_heat_source, label: H01 External heat source, table: holding, address: 8237, type: u16, enum: external_heat_source, writable: true, poll: slow, persistent: true}

  # Unit parameters (0x8000 ff.)
  - {key: x.host_address, label: Address of the host interface, table: holding, address: 33001, type: u16, writable: true, poll: slow, min: 1, max: 8, persistent: true}
  - {key: x.power_limit, label: User power limit, table: holding, address: 33002, type: u16, unit: kW, scale: 0.1, writable: true, poll: slow, persistent: true}

  # Commands (0xF000 ff.), written with function 06
  - {key: x.cmd_reset_parameters, label: Reset all parameters, table: holding, address: 61440, type: u16, writable: true, note: Write 1. Restores all parameters; broadcast allowed.}
  - {key: x.cmd_force_defrost, label: Forced defrost, table: holding, address: 61441, type: u16, writable: true, note: Write 1; broadcast allowed.}
  - {key: x.cmd_disinfection, label: Disinfection mode, table: holding, address: 61442, type: u16, writable: true, note: Write 1; broadcast allowed.}
  - {key: x.cmd_silent_mode, label: Silent mode, table: holding, address: 61443, type: u16, writable: true, note: Write 1; broadcast allowed.}
  - {key: x.cmd_clock, label: Clock, table: holding, address: 61444, type: u16, writable: true, note: 'Bits 0–7 minute (0–59), bits 8–12 hour (0–23), bits 13–15 weekday (0 = Sunday … 6 = Saturday). Sent as a broadcast (unit 0). The controller must send it at power-up and then every minute, or time-dependent functions (e.g. the external heat source) don''t work.'}
  - {key: x.cmd_fault_reset, label: Fault reset, table: holding, address: 61445, type: u16, writable: true, note: Write 1; broadcast allowed.}

enums:
  machine_status: {'0': 'Off', '1': Standby, '2': Preparing compressor start, '3': Compressor running, '4': Compressor running at maximum frequency, '5': Fault shutdown, '6': Defrosting}
  sg_mode: {'1': Super mode, '2': Energy-saving mode, '3': Normal mode, '4': Extended mode}
  on_off: {'0': 'Off', '1': 'On'}
  mode: {'0': Hot water, '1': Heating, '2': Cooling, '3': Hot water + heating, '4': Hot water + cooling}
  external_heat_source: {'0': Not used, '1': Heating only, '2': Hot water only, '3': Heating and hot water}

flags:
  switch_status: {'0': SG signal open, '1': EVU signal open, '2': Energy-saving mode, '3': Emergency stop switch open, '4': Air-conditioning demand switch open, '5': Water flow switch open, '6': Low-pressure switch open, '7': High-pressure switch open}
  work_status: {'0': Hot water, '2': Heating, '3': Cooling, '4': DC fan, '5': DC fan, '7': Defrosting}
  outputs_1: {'0': Compressor, '5': Fan, '6': Four-way valve}
  outputs_2: {'0': Chassis heater, '5': Electric heater (heating), '6': Three-way valve, '7': Electric heater (water tank)}
  outputs_3: {'0': External heat source, '1': Crankcase heater, '2': Circulation pump, '4': Air-conditioning water pump}
  fault_1: {'0': Er14 water tank temperature sensor, '1': Er21 ambient temperature sensor, '2': Er16 external coil temperature sensor, '3': Return water temperature sensor, '4': Er27 outlet water temperature sensor, '5': Er05 high pressure, '6': Er06 low pressure, '7': Er01 phase sequence}
  fault_2: {'0': Er03 water flow, '1': DC water pump communication, '2': Er32 heating outlet temperature too high, '3': Current fault, '5': DC water pump undervoltage, '6': DC water pump blocked, '7': 'DC water pump, other fault'}
  fault_3: {'5': Er73 power expansion board communication, '6': Er18 discharge temperature sensor}
  fault_4: {'0': Er15 inlet water temperature sensor, '1': Er12 discharge overheat protection, '5': Er23 cooling outlet water too cold, '6': Er29 return gas temperature sensor}
  fault_5: {'0': Er69 low pressure protection, '1': Pressure too high, '2': Er33 coil temperature too high, '3': Er42 cooling coil temperature sensor, '5': Er72 DC fan communication, '7': Er67 low pressure sensor}
  fault_6: {'0': Total outlet water temperature sensor}
  fault_7: {'0': Ambient temperature too high, '1': Ambient temperature too low, '4': Inverter module communication, '5': Er66 DC fan 2, '6': Er64 DC fan 1}
  drive_fault_low: {'0': IPM overcurrent, '1': Drive synchronisation fault, '3': Compressor output phase loss, '4': DC bus voltage low, '5': DC bus voltage high, '6': Heat sink overtemperature, '7': Heat sink temperature sensor}
  drive_fault_high: {'0': Communication, '1': AC input phase loss, '2': AC input overcurrent, '3': AC input voltage low, '4': High voltage, '5': IPM overtemperature, '6': Compressor peak current too high, '7': PFC module overtemperature}
  common_status: {'0': Hot water demand, '1': Heating / air-conditioning demand, '2': Cooling demand, '3': Antifreeze stage 1, '4': Antifreeze stage 2, '8': Emergency stop switch open, '9': Air-conditioning switch open, '10': SG signal open, '11': EVU signal open}
  common_fault: {'0': Water tank temperature sensor, '2': Ambient temperature sensor, '3': Total outlet water temperature sensor}
  control_flags_1: {'0': 'On', '1': Fahrenheit / Celsius, '2': Automatic heating target temperature, '3': No frequency reduction at temperature, '4': Smart grid function active, '5': Outlet water control, '6': Powerful mode, '7': Silent mode}

problems:
  - {when: {key: state, equals: 5}, kind: fault, text: Heat pump stopped by a fault}
  - {when: {key: x.fault_1, bit: 0}, kind: fault, text: Er14 water tank temperature sensor fault}
  - {when: {key: x.fault_1, bit: 1}, kind: fault, text: Er21 ambient temperature sensor fault}
  - {when: {key: x.fault_1, bit: 2}, kind: fault, text: Er16 external coil temperature sensor fault}
  - {when: {key: x.fault_1, bit: 3}, kind: fault, text: Return water temperature sensor fault}
  - {when: {key: x.fault_1, bit: 4}, kind: fault, text: Er27 outlet water temperature sensor fault}
  - {when: {key: x.fault_1, bit: 5}, kind: fault, text: Er05 high pressure fault}
  - {when: {key: x.fault_1, bit: 6}, kind: fault, text: Er06 low pressure fault}
  - {when: {key: x.fault_1, bit: 7}, kind: fault, text: Er01 phase sequence fault}
  - {when: {key: x.fault_2, bit: 0}, kind: fault, text: Er03 water flow fault}
  - {when: {key: x.fault_2, bit: 1}, kind: fault, text: DC water pump communication fault}
  - {when: {key: x.fault_2, bit: 2}, kind: fault, text: Er32 heating outlet temperature too high}
  - {when: {key: x.fault_2, bit: 3}, kind: fault, text: Current fault}
  - {when: {key: x.fault_2, bit: 5}, kind: fault, text: DC water pump undervoltage}
  - {when: {key: x.fault_2, bit: 6}, kind: fault, text: DC water pump blocked}
  - {when: {key: x.fault_2, bit: 7}, kind: fault, text: DC water pump fault}
  - {when: {key: x.fault_3, bit: 5}, kind: fault, text: Er73 power expansion board communication fault}
  - {when: {key: x.fault_3, bit: 6}, kind: fault, text: Er18 discharge temperature sensor fault}
  - {when: {key: x.fault_4, bit: 0}, kind: fault, text: Er15 inlet water temperature sensor fault}
  - {when: {key: x.fault_4, bit: 1}, kind: fault, text: Er12 discharge overheat protection}
  - {when: {key: x.fault_4, bit: 5}, kind: fault, text: Er23 cooling outlet water too cold}
  - {when: {key: x.fault_4, bit: 6}, kind: fault, text: Er29 return gas temperature sensor fault}
  - {when: {key: x.fault_5, bit: 0}, kind: fault, text: Er69 low pressure protection}
  - {when: {key: x.fault_5, bit: 1}, kind: fault, text: Pressure too high}
  - {when: {key: x.fault_5, bit: 2}, kind: fault, text: Er33 coil temperature too high}
  - {when: {key: x.fault_5, bit: 3}, kind: fault, text: Er42 cooling coil temperature sensor fault}
  - {when: {key: x.fault_5, bit: 5}, kind: fault, text: Er72 DC fan communication fault}
  - {when: {key: x.fault_5, bit: 7}, kind: fault, text: Er67 low pressure sensor fault}
  - {when: {key: x.fault_6, bit: 0}, kind: fault, text: Total outlet water temperature sensor fault}
  - {when: {key: x.fault_7, bit: 0}, kind: warning, text: Ambient temperature too high}
  - {when: {key: x.fault_7, bit: 1}, kind: warning, text: Ambient temperature too low}
  - {when: {key: x.fault_7, bit: 4}, kind: fault, text: Inverter module communication fault}
  - {when: {key: x.fault_7, bit: 5}, kind: fault, text: Er66 DC fan 2 fault}
  - {when: {key: x.fault_7, bit: 6}, kind: fault, text: Er64 DC fan 1 fault}
  - {when: {key: x.drive_fault_low, not: 0}, kind: fault, text: 'Compressor drive fault (low byte 0x{value:X})'}
  - {when: {key: x.drive_fault_high, not: 0}, kind: fault, text: 'Compressor drive fault (high byte 0x{value:X})'}

notes:
- All registers are read with function 03 and written with 06 / 16. Addresses are the hex protocol addresses as the document
  gives them (0-based). Every register is one 16-bit value.
- RS485 only (Modbus RTU, 9600 Bd, 8N1). Units are addresses 1–8, set with DIP switches 2–4. Port 502 applies only behind
  a gateway. Requests at least 200 ms apart, at most 120 registers each.
- Only unit 1 accepts parameter writes; the others can only be read. Units 2–8 start answering only after they got the common
  parameters from unit 1; the controller must read unit 1's common status (0x0800) every cycle.
- 'The document gives no signedness: temperatures are taken as signed (s16), everything else as unsigned (assumed). Where
  it gives no unit or scale, the point has none.'
- Fault bits the document strikes through (0x000B bit 6, 0x000C bits 2–5) are left out. 0x0008 bit 3 is translated as "current
  fault"; it is probably an overcurrent.
- 'Left out: the timer schedule (0x1000–0x102A), installer parameters 0x2009–0x203A other than those above (defrost, disinfection,
  compensation, pump, external heat source and tariff settings), the refrigerant-circuit parameters 0x8000–0x80E8 (expansion
  valves, fan curves, compressor frequencies, pressure limits, calibration), and the price registers 0x003A / 0x003B (in yuan).'
