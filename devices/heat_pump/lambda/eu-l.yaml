problems:
  - {when: {key: x.hp1_error_state, equals: 2}, kind: warning, text: 'Heat pump warning (error state {value})'}
  - {when: {key: x.hp1_error_state, in: [3, 4]}, kind: fault, text: 'Heat pump {text} (error state {value})'}
  - {when: {key: x.ambient_error_number, not: 0}, kind: warning, text: 'Ambient module error {value}'}
  - {when: {key: x.emgr_error_number, not: 0}, kind: warning, text: 'E-Manager error {value}'}

notes:
- Modbus TCP on port 502, unit id 1, up to 16 clients; keep the connection open (opening one per request disturbs the controller).
  The controller closes a connection after 1 min without requests. RS485 on the display unit; 9600 8N1, slave id 1 are the
  values shown in the document's configuration example.
- Reads only with function 03 (read holding registers).
- 'Register = index × 1000 + subindex × 100 + number: index 0 general (subindex 0 ambient, 1 E-Manager), 1 heat pump (1 …
  3), 2 boiler (1 … 5), 3 buffer (1 … 5), 4 solar (1 … 2), 5 heating circuit (1 … 12). The subindex follows the order in which
  modules of that type are configured. Only the first instance of each module is listed; the others are 100 registers further
  on. Modules that aren''t configured are marked optional.'
- Numbers 00 … 49 written over Modbus must be refreshed regularly (timeout 5 min), else the controller falls back to a default;
  numbers 50 and above are stored permanently.
- The document names no heat pump series; the id follows the existing Lambda file. Addresses are taken as given; that they
  are 0-based protocol addresses is not stated, and the projects read them that way.
- 'evcc template `lambda-zewotherm` (single device) lists: Lambda EU-L Series; Zewotherm EU-L Series.'
- The template has the option `excess` (default plus); points used only with another value say so in their note.
- The template has the option `firmware` (default <1.1.3); points used only with another value say so in their note.
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- 'Module blocks: heat pump n at 1000 + 100 × (n − 1) (up to 3), boiler at 2000 (up to 5), buffer at 3000 (up to 5), solar
  at 4000 (up to 2), heating circuit at 5000 (up to 12); within a block the relative address is the same for every instance.
  lambda_heat_pumps finds the installed modules by reading the first register of each block: a block that answers without
  an error is present.'
- '32-bit values: lambda_heat_pumps reads the high word first up to firmware V0.0.9-3K and the low word first from V0.0.10-3K
  on (configurable). The encoding here says high word first.'
- The integration writes the PV surplus (or E-manager power) into register 102; it offers unsigned (only positive) and signed
  variants.
- 'lambda_heat_pumps reads some registers one at a time because batch reads gave wrong values: the 32-bit counters at 1n20-1n23,
  1n50-1n60, and 5n07.'
- The Lambda controller needs a 1-minute Modbus timeout; lambda_heat_pumps polls every 30 s on unit id 1.
- The binding reads every block with function 03. Heat pumps, boilers, buffers, solar modules and heating circuits repeat
  every 100 registers (subindex); only the first instance of each is listed.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- The E-Manager must be set to the data source "Modbus Client" on the heat pump itself before it uses register 102.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
