  - {key: x.limittemp_3050, label: 'Set.: Maximum buffer temp.', table: holding, address: 3050, type: s16, unit: °C, scale: 0.1, writable: true, min: 25, max: 65, persistent: true, optional: true, poll: slow}
  # Solar 1 (4000 ff.; up to 2, every 100)
  - {key: x.sol1_error_number, label: Solar error number, table: holding, address: 4000, type: s16, optional: true, note: 0 = no error.}
  - {key: x.sol1_operating_state, label: Solar operating state, table: holding, address: 4001, type: u16, enum: sol_operating_state, optional: true}
  - {key: x.sol1_collector_temperature, label: Collector temp., table: holding, address: 4002, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.sol1_storage_temperature, label: Buffer 1 temp., table: holding, address: 4003, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.sol1_buffer2_temperature, label: Buffer 2 temp., table: holding, address: 4004, type: s16, unit: °C, scale: 0.1, optional: true, conflicts: [{sources: [lambda-heat-pumps], unit: W, scale: 100, label: SOL1 Power Current}]}
  - {key: x.sol1_maximum_buffer_temperature, label: 'Set.: Maximum buffer temp.', table: holding, address: 4050, type: s16, unit: °C, scale: 0.1, writable: true, min: 25, max: 90, persistent: true, optional: true, poll: slow}
  - {key: x.sol1_buffer_changeover_temperature, label: 'Set.: Buffer changeover temp.', table: holding, address: 4051, type: s16, unit: °C, scale: 0.1, writable: true, min: 25, max: 90, persistent: true, optional: true, poll: slow}
  # Heating circuit 1 (5000 ff.; up to 12, every 100)
  - {key: x.hc1_error_number, label: Heating circuit error number, table: holding, address: 5000, type: s16, optional: true, note: 0 = no error.}
  - {key: x.hc1_operating_state, label: Heating circuit operating state, table: holding, address: 5001, type: u16, enum: hc_operating_state, optional: true}
  - {key: x.hc1_flow_line_temperature, label: Flow line temp., table: holding, address: 5002, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.hc1_return_line_temperature, label: Return line temp., table: holding, address: 5003, type: s16, unit: °C, scale: 0.1, optional: true}
