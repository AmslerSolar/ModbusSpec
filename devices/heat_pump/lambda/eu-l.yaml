  - {key: x.hc1_target_room_temperature, label: 'Set.: Setpoint room heating temp.', table: holding, address: 5051, type: s16, unit: °C, scale: 0.1, writable: true, min: 15, max: 40, persistent: true, optional: true, poll: slow}
  - {key: x.hc1_set_cooling_mode_room_temperature, label: 'Set.: Setpoint room cooling temp.', table: holding, address: 5052, type: s16, unit: °C, scale: 0.1, writable: true, min: 15, max: 40, persistent: true, optional: true, poll: slow}
