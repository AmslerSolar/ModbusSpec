connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:
  # General: ambient (0 ff.)
  - {key: x.ambient_error_number, label: Ambient error number, table: holding, address: 0, type: s16, note: 0 = no error.}
  - {key: x.ambient_operating_state, label: Ambient operating state, table: holding, address: 1, type: u16, enum: main_ambient_operating_state}
  - {key: x.ambient_temperature, label: Actual ambient temperature, table: holding, address: 2, type: s16, unit: °C, scale: 0.1, writable: true, min: -50, max: 80, note: Can be written when the Modbus client is set as the outdoor temperature source.}
  - {key: x.ambient_temperature_1h, label: Average ambient temperature 1 h, table: holding, address: 3, type: s16, unit: °C, scale: 0.1}
  - {key: x.ambient_temperature_calculated, label: Calculated ambient temperature, table: holding, address: 4, type: s16, unit: °C, scale: 0.1}
  # General: E-Manager (100 ff.)
  - {key: x.emgr_error_number, label: E-Manager error number, table: holding, address: 100, type: s16, note: 0 = no error.}
  - {key: x.emgr_operating_state, label: E-Manager operating state, table: holding, address: 101, type: u16, enum: main_e_manager_operating_state}
  - {key: x.setmaxpower_102, label: Actual power (input or excess), table: holding, address: 102, type: s16, unit: W, writable: true, note: 'Input power as UINT16 (0 … 65535 W) or excess power as INT16 (−32768 … 32767 W), by the E-Manager setting; signed taken. Used when the Modbus client is the PV surplus source; values written to registers 00 … 49 of a module must be refreshed within 5 min.', verified: false}
  - {key: consumer_power, label: Actual power consumption, table: holding, address: 103, type: s16, unit: W, positive: consumption, note: All configured heat pumps together.}
  - {key: x.emgr_power_consumption_setpoint, label: Power consumption setpoint, table: holding, address: 104, type: s16, unit: W, note: Sum for all heat pumps.}
  # Heat pump 1 (1000 ff.; heat pump 2 at 1100, 3 at 1200)
  - {key: x.hp1_error_state, label: Hp error state, table: holding, address: 1000, type: u16, enum: hp_error_state}
  - {key: x.hp1_error_number, label: Hp error number, table: holding, address: 1001, type: s16, note: Cycles through all active error numbers (1 … 99).}
  - {key: x.hp1_state, label: Hp state, table: holding, address: 1002, type: u16, enum: hp_state}
  - {key: state, label: Operating state, table: holding, address: 1003, type: u16, enum: hp_operating_state}
  - {key: x.hp1_flow_line_temperature, label: T-flow, table: holding, address: 1004, type: s16, unit: °C, scale: 0.01}
  - {key: x.hp1_return_line_temperature, label: T-return, table: holding, address: 1005, type: s16, unit: °C, scale: 0.01}
  - {key: x.hp1_volume_flow_heat_sink, label: Vol. sink, table: holding, address: 1006, type: s16, unit: l/min, scale: 0.01, conflicts: [{sources: [lambda-heat-pumps], unit: l/h, scale: 1, label: HP1 Volume Flow Heat Sink}]}
  - {key: x.hp1_energy_source_inlet_temperature, label: T-EQin, table: holding, address: 1007, type: s16, unit: °C, scale: 0.01}
  - {key: x.hp1_energy_source_outlet_temperature, label: T-EQout, table: holding, address: 1008, type: s16, unit: °C, scale: 0.01}
  - {key: x.hp1_volume_flow_energy_source, label: Vol. source, table: holding, address: 1009, type: s16, unit: l/min, scale: 0.01}
  - {key: x.hp1_compressor_unit_rating, label: Compressor-Rating, table: holding, address: 1010, type: u16, unit: '%', scale: 0.01}
  - {key: x.hp1_actual_heating_capacity, label: Qp heating, table: holding, address: 1011, type: s16, unit: W, scale: 100}
  - {key: x.power_1012, label: FI power consumption, table: holding, address: 1012, type: s16, unit: W, note: Power drawn by the frequency inverter of this heat pump.}
  - {key: x.hp1_cop, label: COP, table: holding, address: 1013, type: s16, scale: 0.01, note: The document gives the unit as 0.01 %; read as a plain number × 0.01.}
  - {key: x.heat_pump_request_password, label: Modbus request release password, table: holding, address: 1014, type: u16, writable: true, note: Releases the request registers 1015 … 1018; at most 10 tries.}
  - {key: x.hp1_request_type, label: Request type, table: holding, address: 1015, type: s16, enum: hp_request_type, writable: true}
  - {key: x.hp1_requested_flow_line_temperature, label: Request flow line temp, table: holding, address: 1016, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 70}
  - {key: x.hp1_requested_return_line_temperature, label: Request return line temp, table: holding, address: 1017, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 65}
  - {key: x.hp1_requested_flow_to_return_line_temperature_difference, label: Request heat sink temp. diff, table: holding, address: 1018, type: s16, unit: K, scale: 0.1, writable: true, min: 0, max: 35, conflicts: [{sources: [lambda-heat-pumps], unit: °C, label: HP1 Requested Flow to Return Line Temperature Difference}]}
  - {key: x.hp1_relais_state_2nd_heating_stage, label: Relais state for 2nd heating stage, table: holding, address: 1019, type: s16, enum: hp_relais_state_2nd_heating_stage, note: 1 = the NO relay of the 2nd heating stage is on.}
  - {key: consumer_energy, label: Statistic VdA E since last reset, table: holding, address: 1020, type: s32, unit: kWh, scale: 0.001, poll: slow, note: Electrical energy of the compressor unit since the last statistics reset (not lifetime). Word order not stated; high word first assumed., verified: false}
  - {key: x.hp1_compressor_thermal_energy_output_accumulated, label: Statistic VdA Q since last reset, table: holding, address: 1022, type: s32, unit: kWh, scale: 0.001, poll: slow, note: Thermal energy of the compressor unit since the last statistics reset. Word order not stated; high word first assumed., verified: false}
  # Boiler 1 (2000 ff.; up to 5, every 100)
  - {key: x.boil1_error_number, label: Boiler error number, table: holding, address: 2000, type: s16, optional: true, note: 0 = no error.}
  - {key: x.boil1_operating_state, label: Boiler operating state, table: holding, address: 2001, type: u16, enum: boil_operating_state, optional: true}
  - {key: x.temp, label: Boiler actual high temp., table: holding, address: 2002, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.temp_2003, label: Boiler actual low temp., table: holding, address: 2003, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.limittemp, label: 'Set.: Maximum boiler temp.', table: holding, address: 2050, type: s16, unit: °C, scale: 0.1, writable: true, min: 25, max: 65, persistent: true, optional: true, poll: slow}
  # Buffer 1 (3000 ff.; up to 5, every 100)
  - {key: x.buff1_error_number, label: Buffer error number, table: holding, address: 3000, type: s16, optional: true, note: 0 = no error.}
  - {key: x.buff1_operating_state, label: Buffer operating state, table: holding, address: 3001, type: u16, enum: buff_operating_state, optional: true}
  - {key: x.temp_3002, label: Buffer actual high temp., table: holding, address: 3002, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.temp_3003, label: Buffer actual low temp., table: holding, address: 3003, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.buff1_buffer_temperature_high_setpoint, label: Modbus buffer temp. high, table: holding, address: 3004, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 90, optional: true, note: Buffer temperature supplied over Modbus.}
  - {key: x.buff1_request_type, label: Buffer request type, table: holding, address: 3005, type: s16, enum: buff_request_type, writable: true, optional: true, note: −1 ends a Modbus request at once.}
  - {key: x.buff1_request_flow_line_temp_setpoint, label: Request flow line temp. setpoint, table: holding, address: 3006, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 65, optional: true, note: A valid value is required.}
  - {key: x.buff1_request_return_line_temp_setpoint, label: Request return line temp. setpoint, table: holding, address: 3007, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 60, optional: true, note: A valid value is required.}
  - {key: x.buff1_request_heat_sink_temp_diff_setpoint, label: Request heat sink temp. diff setpoint, table: holding, address: 3008, type: s16, unit: K, scale: 0.1, writable: true, min: 0, max: 35, optional: true, note: A valid value is required.}
