  - {key: x.outdoor_temperature_2, label: Außentemperatur 2, table: input, address: 30002, type: s16, unit: °C, scale: 0.1, invalid: [-32768, -32767, -32766, -32758, -32757]}
  - {key: error_code, label: Fehler, table: input, address: 30003, type: u16, note: Error code from the connected unit's code table; 65535 = no error active.}
  - {key: x.warning_code, label: Warnung, table: input, address: 30004, type: u16, note: Warning code from the connected unit's code table; 65535 = none active.}
  - {key: x.fault_free, label: Fehlerfrei, table: input, address: 30005, type: u16, verified: false, note: 'The document gives it the error-code format (0 … 65534 code, 65535 = none) although its name suggests a fault-free flag; taken as given.'}
  - {key: state, label: Betriebsstatusanzeige, table: input, address: 30006, type: u16, enum: operating_status}
  - {key: x.system_mode, label: Systembetriebsart, table: holding, address: 40001, type: u16, enum: system_mode, writable: true, persistent: true, poll: slow}
  - {key: x.pv_setpoint, label: SollwertPV, table: holding, address: 40002, type: u16, unit: W, writable: true, persistent: false, note: Electrical power the heat pump may use; 0 ends it. Overrides SG Ready (also a utility block).}
