  - {key: x.hot_water_push, label: Warmwasser Push, table: holding, address: 42102, type: u16, unit: min, writable: true, min: 0, max: 240, persistent: true, note: '0 = off, 5 … 240 minutes.', conflicts: [{sources: [weishaupt-modbus], label: Hot water Push}]}
