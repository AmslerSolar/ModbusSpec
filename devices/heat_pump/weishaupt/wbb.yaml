problems:
  - {when: {key: error_code, not: 65535}, kind: fault, text: 'Heat pump error (code {value})'}
  - {when: {key: x.warning_code, not: 65535}, kind: warning, text: 'Heat pump warning (code {value})'}
  - {when: {key: x.hp_fault, equals: 0}, kind: fault, text: Heat pump fault active}
  - {when: {key: state, equals: 2}, kind: fault, text: Emergency stop (Notaus)}

notes:
- The document gives register numbers (30 001 = input register, function 04; 40 001 = holding register, read 03). They are
  used as protocol addresses unchanged, without subtracting 30001 / 40001; the document itself warns that some software needs
  them one higher or lower. Not verified here.
- Unit id 1 on every device; several heat pumps are told apart by their IP address. Modbus TCP must be switched on in the
  system unit (Settings → Modbus TCP). At most 5 consecutive, all defined registers per request.
- 'Temperatures are tenths of °C. Sensor values: −32768 no sensor, −32767 sensor open, −32766 sensor short circuit, −32758
  / −32757 digital status off / on. Setpoints: −32768 or 1 = no setpoint request active.'
- The document lists the holding setpoints as unsigned although they use −32768; they are read as signed here.
- Settings are stored in EEPROM with a lifetime limit of about 100,000 writes; write them rarely. SollwertPV and the digital
  SG Ready inputs are not stored and may change often.
- The analog power input AE1 (4–20 mA, 20–100 %) exists on WAB, WGB and WBB only; it is not a Modbus register.
- Registers missing from older controller software may need a software update.
- 'evcc template `weishaupt-wpm` (single device) lists: Weishaupt WPM (SG Ready).'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- 'Addresses are the register numbers of Weishaupt''s list sent unchanged: weishaupt_modbus reads 30001 as input register
  30001 (function 04) and 40001 as holding register 40001 (function 03); there is no 30001/40001 offset.'
- weishaupt_modbus reads at most 5 registers per request, on unit id 1.
- Each heating circuit n (2-5) repeats the registers of circuit 1 at +100 × (n − 1). weishaupt_modbus defines circuit 5 but
  does not poll it.
- weishaupt_modbus marks some settings as read-only on purpose to protect the heat pump although the device accepts writes
  there; only the registers it writes are marked writable.
- Temperatures read 0x8000 when no sensor value is available; weishaupt_modbus shows 0x8001 as −999 (sensor fault).
- Status texts are in German as the project gives them; the error list (30003, 30004) uses 65535 for "no error".
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
