modbusspec: 0
id: ochsner-bwwp
manufacturer: Ochsner
name: BWWP Genius 333 heat pump water heater
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/ochsner-bwwp.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.setmaxpower_2201, label: Power limit (write), table: holding, address: 2201, type: s16, unit: W, writable: true}
  - {key: x.limittemp, label: Temperature limit, table: holding, address: 2203, type: s16, unit: °C, scale: 0.1}
  - {key: x.temp, label: Temperature, table: input, address: 2000, type: s16, unit: °C, scale: 0.1}
  - {key: x.setmaxpower, label: Power limit, table: input, address: 2012, type: s16, unit: W}

notes:
- 'evcc template `ochsner-bwwp` (single device) lists: Ochsner BWWP Genius 333.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
