  - {when: {key: x.alarm_compressor, equals: 1}, kind: fault, text: Compressor (inverter) alarm}
  - {when: {key: x.alarm_source, equals: 1}, kind: fault, text: Source side alarm}
  - {when: {key: x.alarm_flow, equals: 1}, kind: fault, text: CV flow alarm}
  - {when: {key: x.alarm_underfloor, equals: 1}, kind: warning, text: CV supply temperature too high}
  - {when: {key: x.alarm_dewpoint, equals: 1}, kind: warning, text: Dew point alarm}
  - {when: {key: x.alarm_antilegionella_time, equals: 1}, kind: warning, text: Anti-legionella program took too long}
  - {when: {key: x.alarm_dhw_time, equals: 1}, kind: warning, text: DHW program took too long}
  - {when: {key: x.alarm_working_hours, equals: 1}, kind: warning, text: Working hours alarm (service due)}

notes:
- 'The list gives only the table, the 0-based index, the variable name and a Dutch description; it marks 32-bit values as
  "2 values" (two registers). Data types, units (except flow in l/min and energies in kWh) and the word order aren''t stated:
  two-register values are taken as 32-bit floats, high word first, working hour counters as 32-bit unsigned integers, single
  registers as unsigned 16-bit; all such points are `verified: false`. Temperatures are assumed in °C.'
- Connection details (port, unit id, transport) aren't stated; 502 and unit 1 are assumed.
- Several setpoints only apply with the internal room thermostat, not with the LinQ room controller; Qube-Hybrid registers
  (boiler, gas price, COP switch-over) only apply to the hybrid model.
- SG Ready is set through the two coils 65 and 66.
- 'Left out: Working hours DHW (input 50, s16) from python-qube-heatpump overlaps x.hours_dhw from the documents.'
- 'Left out: Working hours heating (input 52, s16) from python-qube-heatpump overlaps x.hours_heating from the documents.'
- 'Left out: Working hours cooling (input 54, s16) from python-qube-heatpump overlaps x.hours_cooling from the documents.'
- 'Left out: Working hours heater 1 (input 56, s16) from python-qube-heatpump overlaps x.hours_heater1 from the documents.'
- 'Left out: Working hours heater 2 (input 58, s16) from python-qube-heatpump overlaps x.hours_heater2 from the documents.'
- 'Left out: Working hours heater 3 (input 60, s16) from python-qube-heatpump overlaps x.hours_heater3 from the documents.'
- '32-bit values (float32) are big word order: high word first.'
- 'SG Ready is set through two coils (65 and 66): neither = off, 65 = block, 66 = plus, both = max.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
