notes:
- 'itho_amber talks Modbus TCP on port 502 to unit id 1 (fixed) and reads only holding registers, as signed 16-bit values,
  in blocks of up to 60 registers: settings 0-459 and live values 499-546 and 703-715.'
- Settings (below 499) are used unscaled; live values use the scales given per point.
- Register 499 holds the operating state as bits; itho_amber shows the text of the highest set bit.
- Registers 540-543 hold the P/F/E/S fault bits. In 540, bits 3, 6 and 11 (P04, P07, P12) are shown as active/inactive rather
  than as alarms.
- itho_amber writes single registers (function 06) and waits 2 s before reading again.
- The software version is register 501 × 0.01 (shown as V<value>) together with register 503 shifted right by 5 bits; the
  outdoor unit's version is register 504 × 0.01.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
