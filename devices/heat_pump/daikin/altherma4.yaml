notes:
- Register numbers in Daikin's guide (and in ha_daikin_altherma4_modbus) start at 1; the addresses here are 0-based protocol
  addresses (guide number − 1).
- Raw values 32765 (waiting for data), 32766 (not available in this configuration) and 32767 (not supported) mean no value
  on every register.
- 'Register map versions (guide numbers): MMI v2/v3 (guide 4P773396 revisions 1B/1C) has discrete input 26 (imposed limit
  acceptance); MMI v4.x (revision 1D) drops it and adds holding 81 and input 138/139. ha_daikin_altherma4_modbus tells them
  apart by which of these reads the unit refuses with an illegal-address exception; there is no version register.'
- 'Fault code: input address 21 holds two ASCII characters (e.g. "7H") and 22 the sub code; together they form the code shown
  on the unit (e.g. 7H-19).'
- ha_daikin_altherma4_modbus reads input 21-87 and holding 1-80 (1-81 on v4; guide numbers) in one request each, and falls
  back to smaller blocks (input 21-53 and 54-87; holding 1-25, 26-50, 51-80) when a unit rejects them.
- Register numbers in Daikin's guide (and in daikin-ha-ekrhh-modbus) start at 1; the addresses here are 0-based protocol addresses
  (number − 1).
- 'Fault code: input address 21 holds two ASCII characters and 22 the sub code (32766 when there is no error). daikin-ha-ekrhh-modbus
  treats unit error (input address 20) 0 and 2 as normal.'
- The Home Hub must be set to use case 3 (Altherma) or 4 (air-to-air) with Modbus TCP; it offers Modbus/TCP Security (TLS,
  port 802) as well, which the project lists as not tested.
- daikin-ha-ekrhh-modbus reads holding 0-79, input 20-86, coils 0-6 and discrete inputs 0-25 in one request each; it calls
  Altherma 4 support experimental.
- 'evcc template `daikin-homehub` (single device) lists: Daikin HomeHub (SG Ready); Daikin Altherma 4 (SG Ready).'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
