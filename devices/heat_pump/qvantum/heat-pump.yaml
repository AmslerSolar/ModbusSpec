notes:
- 'qvantum_modbus defaults: Modbus TCP port 502 or RTU at 9600 baud 8N1, unit id 1, polling every 5 s.'
- qvantum_modbus reads neighbouring registers of the same table in one request and reads across a gap of one unused register.
- 'Input register 165 (electricity price region, two ASCII characters, high byte first) is marked in qvantum_modbus as not
  working: the region may need more than two characters.'
- 'Some holding registers are only meaningful in a given mode: the manual allow switches (2-5) in operation mode manual (holding
  1 = 1), the user heating curve points (24-30) with curve type user defined (holding 22 = 1).'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
