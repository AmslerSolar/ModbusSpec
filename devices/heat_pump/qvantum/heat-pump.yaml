modbusspec: 0
id: qvantum-heat-pump
manufacturer: Qvantum
name: Heat pumps (Modbus)
kind: heat_pump

sources:
- id: qvantum-modbus
  title: qvantum_modbus (Home Assistant integration)
  url: https://github.com/majorfrog/qvantum_modbus
  license: MIT
  commit: 9ad7952dd7e600b9be41a597168cec0d9ad53ba2
  path: custom_components/qvantum_modbus/models.py, custom_components/qvantum_modbus/alarm_codes.py, custom_components/qvantum_modbus/translations/en.json

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - qvantum-modbus

