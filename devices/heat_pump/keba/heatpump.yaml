enums:
  operating_mode: {'0': Standby, '1': Hot Water, '2': Auto Heat, '3': Auto Cool, '4': Full Auto}
  heat_pump_state: {'0': Standby, '1': PreRun, '2': Auto, '3': Defrost, '4': AutoCool, '5': PostRun, '7': Shutdown, '8': Error}
  operating_mode_heat_pump: {'0': 'Off', '1': 'On', '2': Backup}
  operating_mode_dhw_tank1: {'0': 'Off', '1': Auto, '2': 'On', '3': Heat Up}
  circuit_operating_mode: {'0': Standby, '1': Timer, '2': Day, '3': Night, '4': Vacation, '5': Party, '8': Extern}
  circuit_heat_request: {'0': 'Off', '1': 'On', '2': Off (Reflow), '3': Paused, '5': Off (Outdoor Temperature)}
  circuit_cool_request_set_external: {'0': 'Off', '1': 'On'}
  circuit_heat_request_set_external: {'0': 'Off', '1': 'On'}

notes:
- The integration was tested with an M-TEC WPS412 heat pump, which uses a KEBA controller.
- Heating circuits 2–4 repeat circuit 1's registers at offsets of 50 (circuit 2 at 51…, circuit 3 at 101…, circuit 4 at 151…);
  only the circuits that are installed answer meaningfully.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
