modbusspec: 0
id: lg-therma-v
manufacturer: LG
name: Therma V R290 Monobloc (SG Ready)
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/lg-therma.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/lg_therma/lg_therma/consumer.py

connection:
  default_port: 502
  default_unit: 33
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc
  - openwb

points:
  - {key: x.getmode, label: Operating mode, table: holding, address: 9, type: u16, writable: true, note: 'evcc translates the raw values 0→2, 1→1, 2→2, 3→3, 4→3, 5→3, 6→3, 7→1, 8→1 for the operating mode. evcc writes operating mode: 1/2/3.'}
  - {key: x.temp_2, label: Temperature, table: input, address: 2, type: u16, unit: °C, scale: 0.1, note: Used by evcc only with the template option tempsource = water_inlet., sources: [evcc]}
  - {key: x.temp, label: Temperature, table: input, address: 5, type: u16, unit: °C, scale: 0.1, sources: [evcc]}
  - {key: consumer_power, label: Power, table: input, address: 35, type: u16, unit: W, positive: consumption}

notes:
- 'evcc template `lg-therma` (single device) lists: LG Therma V R290 Monobloc (SG Ready).'
- The template has the option `energystate` (default SGReady); points used only with another value say so in their note.
- The template has the option `tempsource` (default water_tank); points used only with another value say so in their note.
- The template has the option `haspower` (default true); points used only with another value say so in their note.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
