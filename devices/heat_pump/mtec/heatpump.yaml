modbusspec: 0
id: mtec-heatpump
manufacturer: M-Tec
name: Heat pumps
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/mtec.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/mtec/mtec/consumer.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.temp, label: Temperature, table: holding, address: 401, type: s16, unit: °C, scale: 0.1, note: Used by evcc only with the template option tempsource = warmwater_top.}
  - {key: x.temp_601, label: Temperature, table: holding, address: 601, type: s16, unit: °C, scale: 0.1, note: Used by evcc only with the template option tempsource = buffer.}
  - {key: consumer_power, label: Power, table: holding, address: 707, type: s16, unit: W, positive: consumption, sources: [evcc, openwb]}
  - {key: x.setmaxpower_1000, label: Power limit (write), table: holding, address: 1000, type: s16, unit: W, writable: true, sources: [evcc, openwb]}

notes:
- 'evcc template `MTec` (single device) lists: M-Tec.'
- The template has the option `tempsource` (default unset); points used only with another value say so in their note.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
