notes:
- Register ids in Nibe's lists are 3xxxx (input registers) and 4xxxx (holding registers); the protocol address is the id's
  last four digits minus 1 (40004 → holding 3). Point names keep Nibe's id at the end.
- '32-bit values: the nibe library reads the low word first when word swap is on, which is the default (service menu 5.3.11
  on F-series); with word swap off the high word comes first.'
- 8-bit values (u8 / s8 in Nibe's lists) take a whole register; the library treats 255 (u8) and −128 (s8) and anything beyond
  as "no value".
- The nibe library also talks to F-series pumps through NibeGW (a UDP gateway, not Modbus); those register ids are the same
  as here.
- Home Assistant's nibe_heatpump suggests unit id 0 in its setup form; the nibe library's examples use 1.
- 'The nibe library has no model detection: the user picks the model (model_choice: user). Each model is one of the library''s
  data files; a point without `models` is in every one of them.'
- 'F-series and SMO / VVM F-generation: Modbus RTU through the NIBE MODBUS 40 accessory (the library''s example uses 9600
  baud).'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
