notes:
- Enable Modbus TCP/IP in menu 7.5.9 (software 2.2.1 or later); "Reading Modbus only" can be ticked there. Only clients from
  private address ranges are accepted, and the menu can restrict access to one IP address.
- Measurements are input registers (FC 04), settings holding registers (FC 03). The document's register IDs are the protocol
  addresses.
- 32-bit values come low word first when read; the document says to write them with function 16 (write multiple).
- At most 20 registers per request and 100 registers per second; 200 ms between 20-register requests is the same rate (derived).
- The pump only serves the registers of its own product and installed accessories; read in blocks and fall back to single
  registers when a block is refused (that a missing register is refused rather than answered with 0 is unconfirmed).
- Unit id 1 is assumed; the document doesn't give one.
- There is no model or serial register; recognise the pump by plausible values. The models therefore have no detection (model_choice
  user); the user selects the product. BT1 may read −32768 (not connected, assumed); the identify check accepts that.
- Bytes stored as u8 / s8 in the document take a whole register; they are given as u16 here.
- 'S1155 / S1255, S1156 / S1256: the document lists input 19, 20, 301, 1621, 1803, 1805 only for other products, so they are
  left out for them.'
- 'S2125: the document lists input 5, 7, 10, 11, 12, 13, 14, 16, 19, 20, 26, 39, 1046, 1100, 1102, 2014 only for other products,
  so they are left out for it.'
- 'S320 / S325, S330 / S332: the document lists input 10, 11, 12, 13, 14, 16, 19, 20, 26, 39, 1046, 1100, 1102 only for other
  products, so they are left out for them.'
- 'Older editions (TIF EN 2118-1 of 2021, TIF EN 2335) have degree minutes at holding 18 (s16, factor 10), degree minutes
  start additional heat at holding 97 and start compressor at 159 (2608: 679 and 97); 2118-1 also marks the operating mode
  (holding 237) read-only. Which software changed the addresses isn''t stated.'
- 'Left out: the S2125 / F2120 cascade slave 2 … 4 tables (same values as slave 1 at other addresses, e.g. requested compressor
  frequency 300 / 299 / 298, current compressor frequency 1789 / 1775 / 1761, defrost 1791 / 1777 / 1763), the S1155 master/slave
  tables, and the AUX relay settings.'
- 'evcc template `nibe-s-series` (single device) lists: NIBE Nibe S-Series (SG Ready).'
- The template has the option `powercontrol` (default true); points used only with another value say so in their note.
- The template has the option `tempsource` (default water_mid); points used only with another value say so in their note.
- Register ids in Nibe's lists are 3xxxx (input registers) and 4xxxx (holding registers); the protocol address is the id's
  last four digits minus 1 (40004 → holding 3). Point names keep Nibe's id at the end.
- '32-bit values: the nibe library reads the low word first when word swap is on, which is the default (service menu 5.3.11
  on F-series); with word swap off the high word comes first.'
- 8-bit values (u8 / s8 in Nibe's lists) take a whole register; the library treats 255 (u8) and −128 (s8) and anything beyond
  as "no value".
- The nibe library also talks to F-series pumps through NibeGW (a UDP gateway, not Modbus); those register ids are the same
  as here.
- Home Assistant's nibe_heatpump suggests unit id 0 in its setup form; the nibe library's examples use 1.
- 'The nibe library has no model detection: the user picks the model (model_choice: user). Each model is one of the library''s
  data files; a point without `models` is in every one of them.'
- 'S-series: Modbus TCP built in. Over Modbus TCP the pump answers 32-bit values low word first but expects writes high word
  first (per the nibe library); over Modbus RTU both directions use the same order.'
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- 'Left out: compressor_total_time_energy_storage_heat_pump_8_ep15_35198 (input 5197, u32) from nibe overlaps compressor_total_time_energy_storage_heat_pump_8_ep14_35197
  (input 5196, u32); check a document.'
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
