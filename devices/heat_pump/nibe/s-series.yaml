connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 20
    max_gap: 4
    min_interval_ms: 200

encoding:
  byte_order: big
  word_order: little

identify:
  checks:
  # outdoor temperature BT1
  - - table: input
      address: 1
      type: s16
      range:
      - -500
      - 700
    # or no outdoor sensor (assumed value)
    - table: input
      address: 1
      type: s16
      equals: -32768
  - table: input
    address: 1028
    type: u16
    in:
    - 10
    - 20
    - 30
    - 40
    - 60
  - table: input
    address: 2195
    type: u16
    in:
    - 0
    - 1

model_choice: user

models:
  - {id: s1155, name: S1155 / S1255 ground source heat pump}
  - {id: s1156, name: S1156 / S1256 ground source heat pump}
  - {id: s2125, name: S2125 air/water heat pump (read through its SMO S40 or VVM S indoor unit)}
  - {id: s320, name: 'S320 / S325 (VVM S320 / S325 indoor module, with S2125 / F2120 / F2040)'}
  - {id: s330, name: 'S330 / S332 (SVM S332 indoor module, with S2125 / F2120 / F2040)'}
  - {id: s735, name: S735 / S735C exhaust air heat pump}
  - {id: smos40, name: SMO S40 control module (with S2125 / F2120 / F2040)}
  - {id: vvms320, name: VVM S320 / S325 indoor module (with S2125 / F2120 / F2040)}
  - {id: vvms500, name: VVM S500 indoor module (with S2125 / F2120 / F2040)}

