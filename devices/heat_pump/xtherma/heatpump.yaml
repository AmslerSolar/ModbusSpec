modbusspec: 0
id: xtherma-heatpump
manufacturer: Xtherma
name: Heat pumps
kind: heat_pump

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/charger/xtherma.yaml
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/consumers/xtherma/xtherma/consumer.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: x.sg_ready, label: SG Ready mode, table: holding, address: 60, type: u16, enum: xtherma_sg_ready, writable: true, sources: [openwb]}
  - {key: x.dim, label: Dimming, table: holding, address: 65, type: u16}
  - {key: x.surplus_mode, label: PV surplus control, table: holding, address: 70, type: u16, enum: xtherma_surplus_mode, writable: true, sources: [openwb]}
  - {key: x.setmaxpower, label: Power limit, table: holding, address: 71, type: u16, unit: W, writable: true, sources: [evcc, openwb]}
  - {key: consumer_power, label: Power limit, table: holding, address: 177, type: u16, unit: W, scale: 10, positive: consumption, sources: [evcc, openwb]}
  - {key: x.limittemp, label: Temperature limit, table: input, address: 51, type: s16, unit: °C}
  - {key: x.dimmed, label: Dimming, table: input, address: 103, type: u16}
  - {key: x.temp, label: Temperature, table: input, address: 124, type: s16, unit: °C, scale: 10}

enums:
  xtherma_sg_ready: {'1': Normal operation, '2': Blocked}
  xtherma_surplus_mode: {'0': 'Off', '1': Use surplus in register 71}

notes:
- 'evcc template `xtherma` (single device) lists: Xtherma.'
- Registers 70 and 71 may be written at most once a minute, register 60 at most once every 30 minutes (per openWB).
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
