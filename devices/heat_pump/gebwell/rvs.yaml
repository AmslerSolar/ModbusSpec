  - {key: x.heat_energy, label: Cumulative heat production, table: holding, address: 29696, type: u32, unit: kWh, poll: slow}
  - {key: consumer_energy, label: Cumulative energy consumption, table: holding, address: 29699, type: u32, unit: kWh, poll: slow}
  - {key: x.cop_cumulative, label: Cumulative coefficient of efficiency, table: holding, address: 29702, type: u16, scale: 0.01, poll: slow}
  - {key: x.heat_power, label: Momentary heat production, table: holding, address: 20823, type: u32, unit: kW, scale: 0.01, note: The document gives the unit as kWh (32-bit); a momentary value is taken as kW. Assumed.}
  - {key: x.consumer_power_kw, label: Momentary energy consumption, table: holding, address: 20826, type: u32, unit: kW, note: The document gives kWh (32-bit) and no resolution; taken as kW with scale 1. Assumed; not given a standard key because the resolution is unclear.}
  - {key: x.cop, label: Momentary coefficient of efficiency, table: holding, address: 20832, type: u16, note: No resolution given (range 0 … 20).}
  # Run monitoring
