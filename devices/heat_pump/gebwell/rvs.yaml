modbusspec: 0
id: gebwell-rvs
manufacturer: Gebwell
name: Heat pumps Qi, T² and Gemini (RVS controller with Modbus module)
kind: heat_pump

sources:
- title: Gebwell Commissioning the Modbus communication bus, heat pumps Qi, T² and Gemini (58170 Modbus-commissioning-v12-EN-27012021-PRINT)
  version: v12 (27.01.2021)
  url: https://gebwell.fi/app/uploads/2026/09/58170__Modbus-commissioning-v12-EN-27012021-PRINT.pdf
  sha256: 6cd22ad2783759124d207ce3d73704ceefcf32dc37645403f095fcde2c3d3a2f

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1
  limits:
    max_registers: 22

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  # Operating temperatures (all values are raw / 64)
  - {key: x.dhw_temperature, label: Temperature of the domestic hot water storage tank (B3), table: holding, address: 11264, type: s16, unit: °C, scale: 0.015625}
  - {key: x.dhw_consumption_temperature, label: Domestic hot water consumption (B38), table: holding, address: 12302, type: s16, unit: °C, scale: 0.015625, optional: true}
  - {key: x.common_flow_temperature, label: Common flow temp (B10), table: holding, address: 18436, type: s16, unit: °C, scale: 0.015625}
  - {key: x.accumulator_temperature, label: Heating accumulator tank temperature (B4), table: holding, address: 17410, type: s16, unit: °C, scale: 0.015625, optional: true}
  - {key: x.outdoor_temperature, label: Outside temp (B9), table: holding, address: 35851, type: s16, unit: °C, scale: 0.015625}
  - {key: x.hc1_flow_temperature, label: 'LC 1, flow temp (B1)', table: holding, address: 1046, type: s16, unit: °C, scale: 0.015625}
  - {key: x.hc2_flow_temperature, label: 'LC2, flow temp (B12)', table: holding, address: 4118, type: s16, unit: °C, scale: 0.015625, optional: true}
  # Heat pump temperatures (also on devices 2, 3 …)
  - {key: x.flow_temperature, label: Flow temp HP (B21), table: holding, address: 20484, type: s16, unit: °C, scale: 0.015625}
  - {key: x.return_temperature, label: Heat pump return water (B71), table: holding, address: 20480, type: s16, unit: °C, scale: 0.015625}
  - {key: x.brine_in_temperature, label: Liquid circuit in (B91), table: holding, address: 20871, type: s16, unit: °C, scale: 0.015625}
  - {key: x.brine_out_temperature, label: Liquid circuit out (B92), table: holding, address: 20877, type: s16, unit: °C, scale: 0.015625}
  - {key: x.hot_gas_temperature, label: Hot gas (B81), table: holding, address: 20856, type: s16, unit: °C, scale: 0.015625}
  - {key: x.condenser_delta_t, label: Condenser temperature difference, table: holding, address: 20867, type: s16, unit: K, scale: 0.015625}
  - {key: x.evaporator_delta_t, label: Temp diff evaporator, table: holding, address: 20869, type: s16, unit: K, scale: 0.015625}
  # Readable setpoints
  - {key: x.common_flow_setpoint, label: Common flow temp setpoint (B10), table: holding, address: 18432, type: s16, unit: °C, scale: 0.015625}
  - {key: x.accumulator_setpoint, label: Heating accumulator tank temperature setpoint (B4), table: holding, address: 17408, type: s16, unit: °C, scale: 0.015625, optional: true}
  - {key: x.aux_heat_setpoint, label: Additional heat source setpoint, table: holding, address: 30724, type: s16, unit: °C, scale: 0.015625}
  - {key: x.hc1_flow_setpoint, label: 'LC1, flow temp setpoint (B1)', table: holding, address: 1048, type: s16, unit: °C, scale: 0.015625}
  - {key: x.hc2_flow_setpoint, label: 'LC2, flow temp setpoint (B12)', table: holding, address: 4120, type: s16, unit: °C, scale: 0.015625, optional: true}
  - {key: x.return_setpoint, label: Heat pump return water setpoint (B71), table: holding, address: 20482, type: s16, unit: °C, scale: 0.015625}
