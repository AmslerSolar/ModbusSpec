enums:
  off_on: {'0': 'Off', '1': 'On'}
  no_yes: {'0': 'No', '1': 'Yes'}
  diverter_valve: {'0': Heating, '1': Domestic hot water}
  step_control: {'0': Released, '1': Prevented}
  prevention: {'0': Prevented, '1': Released}
  free_cooling: {'0': Free cooling, '1': Normal}
  heat_pump_status: {'2': Error, '10': Locked, '17': Overrun active, '25': 'Off', '26': Emergency operation, '27': 'Locked, externally', '29': High heat pump pressure, '30': Heat source flow switch, '31': Heat source pressure switch, '32': Hot gas limit, '34': Maximum limit for switch-off temperature, '35': Compressor minimum idle time active, '37': Active limit time, '38': Compressor minimum run time active, '44': Compressor and electric heater on, '46': Compressor on, '49': Flow active, '50': Standby, '51': No request, '128': Passive cooling mode, '139': Minimum limit for switch-off temperature, '176': 'Locked, outside temperature limit', '180': 3-phase current asymmetric, '181': Under pressure, '183': Compressor overload, '185': Liquid pump overload, '189': Liquid temperature minimum limit (PILP), '190': Liquid temperature minimum limit (source), '191': Liquid temperature maximum limit}
  alarm_code: {'0': No fault, '10': Outdoor sensor (B9), '26': Total output flow sensor (B10), '30': Output water sensor 1 (B1), '31': Cooling output water sensor (B16), '32': Output water sensor 2 (B12), '33': Flow temp HP (B21), '35': Source liquid input sensor (B91), '36': Hot gas sensor (B81), '44': Heat pump return sensor (B71), '45': Source liquid output sensor (B92), '50': Domestic hot water sensor (B3), '70': Auxiliary accumulator sensor 1 (B4), '71': Auxiliary accumulator sensor 2 (B41), '72': Auxiliary accumulator sensor 3 (B42), '73': Solar collector sensor 1 (B6), '74': Solar collector sensor 2 (B61), '81': LPB short circuit, '82': LPB address conflict, '83': BSB short circuit (internal bus), '98': Extra module 1, '99': Extra module 2, '100': Two time hosts, '102': No backup clock running, '105': Maintenance notification, '106': Source liquid temperature too low, '107': Hot gas, '117': Water pressure too high, '118': Water pressure too low, '121': Output flow temperature LP1, '126': Domestic hot water charging temperature, '127': Legionella prevention temperature, '134': Heat pump connection fault, '138': No heat pump control sensor, '171': Alarm contact 1 active, '172': 'Alarm contact 2 active (H2, H21, H22, H32)', '173': Alarm contact 3 active (EX), '174': Alarm contact 4 active (H3), '201': Frost alarm (B21), '222': Heat pump pressure too high (E10), '223': Overpressure in heating circuit start-up (E10), '224': Overpressure in domestic hot water start-up (E10), '225': Underpressure (E9), '226': Compressor overload (E10), '229': Collector circuit pressure switch (E15), '230': Source pump overload (E14), '307': Emergency use, '321': Domestic hot water output sensor (B38), '353': Missing cascade sensor, '355': 'Asymmetric 3-phase current (E21, E22, E23)', '358': Soft starter (E25), '489': No cascade master, '490': Cascade source missing, '491': Maximum evaporation temperature, '495': No Modbus communication connection}

problems:
  - {when: {key: error_code, in: [82, 100, 102, 105, 121, 138, 353, 489, 490]}, kind: warning, text: 'Heat pump alarm {value}: {text}'}
  - {when: {key: error_code, not_in: [0, 82, 100, 102, 105, 121, 138, 353, 489, 490]}, kind: fault, text: 'Heat pump alarm {value}: {text}'}
  - {when: {key: state, equals: 2}, kind: fault, text: 'Heat pump status: error'}

notes:
- The document covers Gebwell Qi, T² and Gemini heat pumps run by an RVS controller with a Siemens OCI350 Modbus module (RS485,
  Modbus RTU slave). Gemini has two controllers, each with its own Modbus address.
- 'Function codes 03 (read), 06 and 16 (write): every register here is a holding register. The register addresses are used
  as given; whether they are 0-based protocol addresses isn''t stated (assumed), hence `verified: false` throughout.'
- Serial settings are made on the controller (parameters 6651 address 1 … 247, 6652 baud 1200 … 115200, 6653 parity, 6654
  stop bits); defaults 19200 baud, even parity, 1 stop bit, address 1. At most 44 data bytes per telegram (22 registers);
  response timeout 300 ms.
- 'Values are 16- or 32-bit, most significant first. Registers of a 32-bit value must be read in one request. Signedness isn''t
  stated: temperatures and temperature differences are taken as signed, the rest as unsigned (assumed).'
- 'Resolution: the document lists 1/64 for all temperatures (raw ÷ 64), 1/100 for pump speeds and COP, and 1/3600 for running
  times (raw in seconds).'
- 'Pump speed limits are given as 100 (10): the speed signal is 0 … 10 V for 0 … 100 %.'
- The energy counters at 29696, 29699 and 29702 are three registers apart although the 32-bit values take two; the third register
  isn't described.
- 'Heating circuit setpoints have no unit in the document; °C (limits 4 … 35, 8 … 95) and K for the parallel shift (''directional
  transfer'', −4.5 … 4.5) are assumed. Heating circuit 1 lists 1026 for both the reduced and the protection setpoint (probably
  a typo); only the reduced setpoint is kept. The heating curve slopes (1028, 4100, 0.1 … 4.0) are left out: their resolution
  isn''t given.'
- 'The ''Device 1'' / ''Devices 2, 3 …'' columns: the heat pump temperatures, compressor, pumps, energy and running times
  are available on every unit of a cascade, the system and hot water values on the first only. In cascades the heating electric
  heaters K25 / K26 are on the first unit that doesn''t make hot water.'
- Additional heat source status (K27) is listed without a register and is left out.
- Alarm codes have a priority 1 … 9 in the document; priorities 5 … 9 switch the alarm relay K10. Codes of priority 1 … 3
  and the maintenance notice (105) are reported as warnings here, the others as faults (assumed).
