  - {key: x.compressor, label: Compressor status info (K1), table: holding, address: 20834, type: u16, enum: off_on}
  - {key: x.dhw_heater, label: Domestic hot water resistor status (K6), table: holding, address: 11371, type: u16, enum: off_on}
  - {key: x.electric_heater_1, label: Electric heater 1 status (K25), table: holding, address: 20838, type: u16, enum: off_on}
  - {key: x.electric_heater_2, label: Electric heater 2 status (K26), table: holding, address: 20840, type: u16, enum: off_on}
  - {key: x.diverter_valve, label: Change-over valve status (Q3), table: holding, address: 38420, type: u16, enum: diverter_valve}
  - {key: x.brine_pump_speed, label: Liquid pump speed (Q8), table: holding, address: 20844, type: u16, unit: '%', scale: 0.01}
  - {key: x.brine_pump, label: Liquid pump status (Q8), table: holding, address: 20842, type: u16, enum: off_on}
  - {key: x.charge_pump_speed, label: Charging pump speed (Q9), table: holding, address: 20848, type: u16, unit: '%', scale: 0.01}
