  - {key: x.operation_prevention, label: HP operation prevention (EX3), table: holding, address: 36914, type: u16, enum: prevention, writable: true, poll: slow}
  - {key: x.switching_differential, label: Switching differential HP (B71), table: holding, address: 20569, type: s16, unit: K, scale: 0.015625, writable: true, min: 1, max: 20, poll: slow, note: Factory setting 6 K.}
  - {key: x.source_pump_startup, label: 'Source pump start-up (free cooling, for one pump)', table: holding, address: 45077, type: u16, enum: free_cooling, writable: true, poll: slow}
  # Heating circuits (only used when the heat pumps control the building's heating groups)
