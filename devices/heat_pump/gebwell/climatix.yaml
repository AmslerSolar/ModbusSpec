notes:
- 'The document (Swedish) lists the registers of Gebwell heat pumps run by a Siemens Climatix controller; it names no heat
  pump models. It gives the table as 0x (coils, function 01 / 05 / 15), 1x (discrete inputs, 02), 3x (input registers, 04)
  and 4x (holding registers, 03 / 06 / 16) and a register number. Whether these numbers are 1-based isn''t stated; they were
  taken as 1-based (Modicon style, 3x 901 = input register 900) and every address here is that number − 1. That is an assumption,
  hence `verified: false` on all points: if readings are off by one register, use the numbers as given.'
- 'Values are divided by the document''s resolution (10 = scale 0.1). Data types aren''t stated: temperatures and temperature
  differences are taken as signed, everything else as unsigned (assumed).'
- 32-bit counters (energy, running hours) are 'unsigned integer, little endian, byte swap' in the document; taken here as
  low word first with each register's bytes high byte first (word_order little). Not verified.
- The document has a column for the master unit (unit 1) and one for slave units in a cascade (unit 2, 3 …); the heat pump
  circuit, energy, run-time and compressor registers are available on both, the system, hot water, auxiliary heat and heating
  circuit registers on the master only. Whether 'unit' means the Modbus unit id isn't stated.
- Transport, port, unit id and serial settings aren't stated; port 502 and unit 1 are assumed.
- Registers 4x 901, 902, 709, 708 and 711 accept temperatures from a building automation system (BAS) in place of the controller's
  own sensors.
- 'Left out: heating and cooling curve points, summer / winter and building time constant settings, pump speed limits, brine
  and charge circuit dT setpoints, the cooling and cooling circuit settings (4x 1202 ff., 4x 1251 ff.; some show resolution
  11, apparently a typo), and the superheat circuit (3x 1101 ff.). Of the discrete alarm inputs, the main ones are here; the
  others (sensor alarms for the hot water and heating circuits, pressure ratio, evaporator / condenser temperature, superheat,
  inverter communication, cascade communication, I/O modules, memory full) sit at their 1x number − 1 as well.'
- The Swedish edition shows many rows without a name (as 0); the English edition of the same date (70368) names them, and
  those names are used here. It also names the DHW setpoints 4x 702 … 704 Protection, Reduced, Comfort (Normal at 4x 712)
  and the sum alarms 1x 191 / 192 High alarm / Low alarm.
- Heat pump mode value 2 is shown as '----' in the document; heating-curve mode tables (note 8) aren't used here.
- Which alarms are A (stopping) or B (warning) per alarm isn't stated; the problem kinds here are assumptions.
