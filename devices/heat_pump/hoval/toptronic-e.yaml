# Written from the Hoval Modbus guideline and the TopTronic E gateway (TTE-GW) Modbus data points list (V2-11-12).

modbusspec: 0
id: hoval-toptronic-e
manufacturer: Hoval
name: Heat pumps with WFA (e.g. UltraSource, Belaria pro) via the TopTronic E Modbus gateway
kind: heat_pump

sources:
- title: Hoval Modbus guideline (sheet "Heat generator/heat pump information values")
  version: retrieved 2026-10-21
  url: https://cdn.hoval.com/modbus-guideline_en_hybris_original.xlsx
  sha256: 1f70d7e3b24f643a387e6cecf731efa4a6443a8093537021bb3d6f3b9b0c9e09
- title: TopTronic E gateway (TTE-GW) Modbus data points list
  version: V2-11-12 (gateway SW ≥ V2.38)
  url: https://cdn.hoval.com/toptronice-gateway-modbus-datapoints_hybris_original.xlsx
  sha256: 2dcad281e350fc6811b4b5f034d3baa101b854c977447b1ff2a50fd9d0fcf53c
  archive_url: https://web.archive.org/web/20260303213217/https://cdn.hoval.com/toptronice-gateway-modbus-datapoints_hybris_original.xlsx

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 16
    max_gap: 4

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 18722
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 15
    - 16
    - 17
    - 21
    - 22
    - 26
    - 27
    - 28
    - 29
    - 32
    - 33
    - 34
    - 42
    - 43
    - 44
  - table: holding
    address: 18723
    type: u16
    range:
    - 0
    - 99
  - table: holding
    address: 18726
    type: u16
    range:
    - 0
    - 100

points:
  # Heat generator (UnitName WEZ, UnitId 1)
  - {key: x.outdoor_temperature, label: AF1 outdoor sensor 1, table: holding, address: 1477, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.flow_setpoint, label: Heat generator setpoint, table: holding, address: 18724, type: s16, unit: °C, scale: 0.1, invalid: [-32768], verified: false, note: 'The data point list gives 0 decimals, the guideline /10; /10 used.'}
  - {key: x.flow_temperature, label: Heat generator actual (flow), table: holding, address: 18725, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.return_temperature, label: Return temperature, table: holding, address: 1535, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.modulation, label: Modulation, table: holding, address: 18726, type: u16, unit: '%'}
  - {key: x.operating_message, label: Operating message, table: holding, address: 18737, type: u16, enum: off_on}
  - {key: x.generator_status, label: Status heat generator control, table: holding, address: 18722, type: u16, enum: generator_status}
  - {key: state, label: FA status (WFA), table: holding, address: 18723, type: u16, enum: wfa_status}
  - {key: x.operation_choice, label: Heat generator operation choice, table: holding, address: 1561, type: u16, enum: operation_choice, writable: true, poll: slow}
  - {key: x.operating_hours, label: Operating hours heat generator, table: holding, address: 1516, type: u32, unit: h, poll: slow}
  - {key: x.switching_cycles, label: Switching cycles heat generator, table: holding, address: 1518, type: u32, poll: slow}
  - {key: consumer_power, label: Electrical power WEZ, table: holding, address: 25611, type: s16, unit: W, scale: 10, positive: consumption, invalid: [-32768], verified: false, note: kW with 2 decimals (raw × 10 W). Neither document gives a sign; positive = the heat pump's electrical consumption (derived).}
  - {key: x.heating_power, label: Heating power WEZ, table: holding, address: 25612, type: s16, unit: kW, invalid: [-32768], note: Whole kW (0 decimals in both documents).}
  - {key: x.current_output_heating, label: Current output heating, table: holding, address: 18731, type: u32, unit: kW, scale: 0.1}
  - {key: x.cop, label: Coefficient of Performance, table: holding, address: 27490, type: u16, unit: '', scale: 0.1}
  - {key: x.total_efficiency, label: Total energy efficiency H-Gen, table: holding, address: 27467, type: u16, unit: '', scale: 0.1, poll: slow}
  - {key: x.volume_flow, label: Volume flow averaged (low register), table: holding, address: 31708, type: s16, unit: l/min, scale: 0.1, invalid: [-32768], verified: false, note: 'An S32 in the data point list; like the guideline only the low register is read, as S16 /10.', optional: true}
  - {key: consumer_energy, label: Electrical energy WEZ, table: holding, address: 25613, type: u32, unit: kWh, poll: slow, note: 'MWh with 3 decimals = kWh. The guideline calls it S32, the data point list U32.'}
  - {key: x.heat_heating_energy, label: Heat quantity heating, table: holding, address: 27484, type: u32, unit: kWh, poll: slow, note: MWh with 3 decimals = kWh.}
  - {key: x.heat_cooling_energy, label: Heat quantity cooling, table: holding, address: 27486, type: u32, unit: kWh, poll: slow, note: MWh with 3 decimals = kWh.}
  - {key: x.heat_dhw_energy, label: Heat quantity DHW, table: holding, address: 27488, type: u32, unit: kWh, poll: slow, note: MWh with 3 decimals = kWh.}
  - {key: error_code, label: Error code from controller (WFA), table: holding, address: 1534, type: u16, enum: error_code, note: 255 = no error (0 is treated as none too).}

  # Heating circuit 1 and hot water (same module)
  - {key: x.hc1_flow_temperature, label: Heating circuit 1 supply actual, table: holding, address: 1513, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.hc1_status, label: Status heating circuit 1, table: holding, address: 1501, type: u16, enum: circuit_status}
  - {key: x.dhw_setpoint, label: Hot water setpoint, table: holding, address: 1499, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.dhw_temperature_top, label: Hot water actual SF, table: holding, address: 1500, type: s16, unit: °C, scale: 0.1, invalid: [-32768]}
  - {key: x.dhw_temperature_bottom, label: Hot water actual SF2, table: holding, address: 27483, type: s16, unit: °C, scale: 0.1, invalid: [-32768], optional: true}
  - {key: x.dhw_status, label: Status domestic hot water, table: holding, address: 1504, type: u16, enum: dhw_status}
  - {key: x.buffer_temperature, label: Heat pump buffer sensor WPF (low register), table: holding, address: 27494, type: s16, unit: °C, scale: 0.1, invalid: [-32768], verified: false, note: 'An S32 in the data point list; like the guideline only the low register is read, as S16 /10.', optional: true}

