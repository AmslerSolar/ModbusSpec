  wfa_status: {'0': Heat pump off, '1': Heating with heat pump, '2': Active cooling, '3': 'Blocked (bivalence, DHW, …)', '4': Hot water with heat pump, '5': Heat pump frost protection, '6': Heat pump temperature too low, '7': Heat pump flow too high, '8': Defrosting, '9': Passive cooling, '11': Heat pump fault (sensor or switch), '12': Low-pressure fault, '16': Re-engage switching delay, '17': Power supply / energy provider block, '18': Flow time primary, '19': Follow-up time primary, '44': MOP, '49': Unsuccessful defrosting, '51': Flow time condenser pump, '55': Inverter fault / Modbus communication, '72': Ground water frost protection, '73': Flow source / ground water circuit, '77': Compressor limitation, '96': Electrical power limit, '97': Preheating compressor oil, '98': Cold start, '99': Machine not configured}
  operation_choice: {'0': Heat generator off, '1': Automatic, '4': Manual heating, '5': Manual cooling, '8': Manual hot water}
  circuit_status: {'0': Switched off, '1': Normal heating, '2': Comfort heating, '3': Economy heating, '4': Frost operation, '5': Forced acceptance, '6': Forced throttling, '7': Holiday, '8': Party, '9': Normal cooling, '10': Comfort cooling, '11': Economy cooling, '12': Fault, '13': Manual operation, '14': Protection cooling, '15': Party cooling, '16': 'Drying, heating-up phase', '17': 'Drying, stationary phase', '18': 'Drying, cooling-down phase', '19': 'Drying, end phase', '22': 'Cooling, external / constant request', '23': 'Heating, external / constant request', '24': 'Absent, heating', '25': 'Absent, cooling', '26': Smart Grid preferential heating, '27': Smart Grid preferential cooling}
  dhw_status: {'0': Switched off, '1': Normal charging, '2': Comfort charging, '3': Forced throttling, '4': Forced charging, '5': Fault, '6': Hot water draw-off, '7': Warning, '8': Reduced charging, '9': Frost operation, '12': Smart Grid preferential, '13': Smart Grid forced acceptance}
  error_code: {'255': No error, '74': W11, '76': W13, '80': W17, '81': W18, '82': W19, '83': W20, '84': W21, '85': W22, '86': W23, '87': W24, '88': W25, '89': W26, '90': W27, '100': W37, '101': W38, '102': W39, '103': W40, '104': W41, '106': W43, '121': W58, '122': W59, '126': W63, '128': B01, '129': B02, '130': B03, '131': B04, '132': B05, '134': B07, '135': B08, '136': B09, '137': B10, '138': B11, '139': B12, '140': B13, '142': B15, '147': B20, '148': B21, '149': B22, '150': B23, '151': B24, '152': B25, '153': B26, '159': B32, '160': B33, '161': B34, '162': B35, '163': B36, '164': B37, '171': B44, '172': B45, '173': B46, '174': B47, '175': B48, '176': B49, '177': B50, '178': B51, '181': B54, '182': B55, '183': B56, '184': B57, '185': B58, '188': B61, '189': B62, '190': B63, '192': E01, '193': E02, '194': E03, '195': E04, '198': E07, '199': E08, '200': E09, '202': E11, '203': E12, '204': E13, '206': E15, '207': E16, '213': E22, '216': E25, '217': E26, '218': E27, '219': E28, '220': E29, '221': E30, '222': E31, '230': E39, '231': E40, '234': E43, '235': E44, '236': E45, '247': E56, '252': E61, '253': E62}

problems:
  - {when: {key: state, in: [11, 12, 49, 55, 99]}, kind: fault, text: 'Heat pump fault (WFA status {value})'}
  - {when: {key: x.generator_status, equals: 15}, kind: fault, text: Heat generator alarm (status 15)}
  - {when: {key: x.generator_status, equals: 16}, kind: fault, text: Heat generator fault (status 16)}
  - {when: {key: x.hc1_status, equals: 12}, kind: fault, text: Heating circuit 1 fault (status 12)}
  - {when: {key: x.dhw_status, equals: 5}, kind: fault, text: Hot water fault (status 5)}
  - {when: {key: x.dhw_status, equals: 7}, kind: warning, text: Hot water warning (status 7)}
  - {when: {key: error_code, in: [192, 193, 194, 195, 198, 199, 200, 202, 203, 204, 206, 207, 213, 216, 217, 218, 219, 220, 221, 222, 230, 231, 234, 235, 236, 247, 252, 253]}, kind: fault, text: 'Heat pump error {text} (code {value})'}
  - {when: {key: error_code, range: [192, 254], not_in: [192, 193, 194, 195, 198, 199, 200, 202, 203, 204, 206, 207, 213, 216, 217, 218, 219, 220, 221, 222, 230, 231, 234, 235, 236, 247, 252, 253]}, kind: fault, text: 'Heat pump error code {value}'}
  - {when: {key: error_code, in: [74, 76, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 100, 101, 102, 103, 104, 106, 121, 122, 126, 128, 129, 130, 131, 132, 134, 135, 136, 137, 138, 139, 140, 142, 147, 148, 149, 150, 151, 152, 153, 159, 160, 161, 162, 163, 164, 171, 172, 173, 174, 175, 176, 177, 178, 181, 182, 183, 184, 185, 188, 189, 190]}, kind: warning, text: 'Heat pump message {text} (code {value})'}
  - {when: {key: error_code, range: [64, 191], not_in: [74, 76, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 100, 101, 102, 103, 104, 106, 121, 122, 126, 128, 129, 130, 131, 132, 134, 135, 136, 137, 138, 139, 140, 142, 147, 148, 149, 150, 151, 152, 153, 159, 160, 161, 162, 163, 164, 171, 172, 173, 174, 175, 176, 177, 178, 181, 182, 183, 184, 185, 188, 189, 190]}, kind: fault, text: 'Heat pump error code {value}'}
  - {when: {key: error_code, range: [1, 63]}, kind: fault, text: 'Heat pump error code {value}'}
  - {when: {key: error_code, range: [256, 65535]}, kind: fault, text: 'Heat pump error code {value}'}

notes:
- Only for heat pumps with the WFA automatic firing device; heat pumps with the old ECR device (e.g. Thermalia, Belaria twin)
  use other data points.
- Registers are those of the first heat generator's basic module (UnitName WEZ, UnitId = CAN address 1); further heat generators
  and modules have their own ranges and aren't covered. Everything is read with FC 03.
- Port 502, unit id 1 and that the list addresses are sent unchanged as protocol addresses are stated in neither document
  (unverified).
- Decimal in the data point list = decimal places (263 with 1 decimal → 26.3). U8 and LIST values are read as whole 16-bit
  registers; 32-bit values are split into _high (lower address) and _low registers.
- 0x8000 (−32768) as "no value" for S16 temperatures and powers is assumed, not documented.
- 'The gateway relays every request over the CAN bus: read slowly.'
- The data point list has no product or serial register; the device is recognised only by plausible status and modulation
  values.
- 'Error code 1534: the guideline lists W, B and E codes (W = code − 63, B = code − 127, E = code − 191) without texts or
  severities. The problems here treat E codes as faults, W and B as warnings, and any other code except 0 and 255 as a fault;
  the generator alarm/fault (18722) only when the WFA status shows no fault. This classification is not stated in the documents.
  Operation choice 8 (manual hot water) is in neither document.'
