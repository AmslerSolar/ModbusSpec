notes:
- FHEM's ModbusTrovis5576 module is written for the TROVIS 5576; holding register 0 reports the model number.
- 'Level coils ("Ebene", e.g. coil 88 for the Rk1 operating mode): 0 = GLT (remote control over Modbus), 1 = autonomous (the
  controller decides).'
- Holding register addresses are the HR4xxxx numbers minus 40001; coil addresses are the CL numbers minus 1. The project reads
  both in blocks; registers a model doesn't have are answered with an error and skipped.
- The project's table is one list for the models with Modbus (5571, 5573, 5576, 5578, 5579); which values exist depends on
  the model and the configured system. Its read ranges are marked for the 5576 (an alternative set for the 5579 is commented
  out).
- Per the project, 32767 means invalid, off or not available (e.g. no sensor).
- The project defaults to unit 247 and 19200 baud; the controller's factory station address is 255, which must be changed
  to 247 or lower.
- The unit of the heat meter (WMZ) energy, volume, flow and power comes from the meter's unit registers.
- SmartHomeNG plugin trovis557x.
- Register addresses are the manufacturer's HR4xxxx references minus 40001 (holding registers); coil addresses are the CLxxxx
  numbers minus 1.
- 'Holding register 0 (HR40001) reports the model: 5573, 55731 (5573-1), 5575, 5576, 5578, 55781 (5578-E), 5579. Compatible
  OEM controllers (SAUTER EQJW, YADOS YADO|MATIC, PEWO PCR06) report the TROVIS model they are based on, per the library''s
  README.'
- Temperatures and sensor inputs read 0x7FFF when no sensor is connected.
- 'Writes are only accepted while write access is enabled: per the library, HR40145 must hold the access code (default 1732);
  writing 0 disables it again. Some set points (e.g. the special DHW set point) also need their level coil switched to remote
  control first.'
- 'Pump AUTO/ON/OFF per the library: ON and OFF write the pump''s output coil (the controller then marks the pump as remotely
  controlled, level coil 0 = GLT); AUTO writes 1 (autonomous) to the pump''s level coil.'
- 'The CO/F function-selector coils (CL139, CL402-905, CL1025/1026/1035 per circuit, CL2125) tell how the controller is configured:
  which sensors are enabled and whether an input is a sensor or a binary input.'
- Which values exist depends on the model, the configured hydronic system and how each input is configured; the library reads
  only the documented ranges of each model (5573 Rev. 2.54 for the two-circuit models, 5578 Rev. 2.62 for the three-circuit
  models).
- Connection defaults (unit 246, TCP port 502, serial 19200 baud 8N1, alternatively 9600) are those of the Home Assistant
  integration samson_trovis_557x, which uses this library.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
- 'Identification: one of the model matches must hold.'
