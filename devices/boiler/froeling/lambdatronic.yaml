notes:
- Register numbers in Fröling's document B1200522 are 30001-style (input, function 04) and 40001-style (holding, function
  03); the addresses here are those numbers minus 30001 / 40001.
- 'The controller talks Modbus RTU on its COM2 port (RS232 according to froeling-lambdatronic-modbus, which needs a null-modem
  cable to a serial-to-Ethernet converter). Enable on the controller under General settings > MODBUS settings: COM2 as MODBUS
  interface, MODBUS protocol RTU (1), and ''use MODBUS protocol 2014''; without the 2014 protocol reads work but writes fail
  with Illegal Function.'
- The unit id is set on the controller (1-247); both integrations default to 2.
- Per froeling-modbus, a function-04 read of more than 122 registers is rejected; gaps inside a read are allowed (registers
  the document does not list read as -1). Only single-register writes (function 06) are accepted, not function 16.
- 'Remote control registers 48001-48046 (flow set points of heating circuits 1-18, DHW tank set points, heating circuit release):
  per froeling-modbus, one write switches remote set points on for all circuits and tanks at once; without a write for about
  two minutes the controller returns to its own control, and an on/off change is accepted at most every ten minutes (a refused
  write is answered with 0xFFFF). Reading these registers returns the last accepted value, not whether remote control is active.'
- froeling-modbus warns that other Fröling controllers (P5 / Lambdatronic P3200 with an offset of 1000, S3100) use different
  addresses; it was tested on an SP Dual compact with Lambdatronic S3200.
- Error buffer 33001-33020 holds the pending fault messages as codes (65535 = no message).
- Coils (function 01) are addressed by their plain number from the document; discrete inputs (function 02) are 10001-style,
  so 10001 is address 0. Both integrations only read them.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
