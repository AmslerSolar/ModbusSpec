notes:
- aio-remeha-modbus reads the GTW-26 with function 03 (holding registers), at most 40 registers per request and at least 50
  ms between requests, on unit id 100 by default (its query tool's default).
- 'The controller answers one of two register layouts, which the library detects by reading identity blocks: the base layout
  (registers 1…472) or the iSystem layout (600…746, with installer settings and schedules). The models here are the layouts;
  the type code (457) names the controller.'
- Temperatures and other tenths are sign and magnitude (bit 15 = minus); 0xFFFF and 0x8CCC mean no sensor.
- The library writes settings with function 16, also single registers.
- 'Weekly comfort schedules (iSystem: hot water from 189, circuits A/B/C program 4 from 126 / 147 / 168, auxiliary from 210)
  are 48 half-hour bits per day in three registers, most significant bit first; they are not listed here.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
