modbusspec: 0
id: remeha-gtw26
manufacturer: Remeha
name: GTW-26 Modbus gateway (Diematic controllers)
kind: boiler

sources:
- id: aio-remeha-modbus
  title: aio-remeha-modbus (Python library behind remeha-modbus)
  url: https://github.com/houthacker/aio-remeha-modbus
  license: LGPL-3.0-or-later
  commit: 686fedfc7a296e7931e9916e401891b90151aabd
  path: src/aio_remeha_modbus/gtw26/climate_zone.py, src/aio_remeha_modbus/gtw26/config.py, src/aio_remeha_modbus/gtw26/hot_water.py,
    src/aio_remeha_modbus/gtw26/sensors.py, src/aio_remeha_modbus/gtw26/system_discovery_table.py

connection:
  default_port: 502
  default_unit: 100
  limits:
    max_registers: 40
    min_interval_ms: 50

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - aio-remeha-modbus

models:
  - {id: base, name: Base register layout}
  - {id: isystem, name: iSystem register layout}

