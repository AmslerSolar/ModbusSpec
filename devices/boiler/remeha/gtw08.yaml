modbusspec: 0
id: remeha-gtw08
manufacturer: Remeha
name: GTW-08 Modbus gateway (heat pumps and boilers with the Remeha control platform)
kind: boiler

sources:
- id: aio-remeha-modbus
  title: aio-remeha-modbus (Python library behind remeha-modbus)
  url: https://github.com/houthacker/aio-remeha-modbus
  license: LGPL-3.0-or-later
  commit: 686fedfc7a296e7931e9916e401891b90151aabd
  path: src/aio_remeha_modbus/gtw08/appliance.py, src/aio_remeha_modbus/gtw08/buffer_tank.py, src/aio_remeha_modbus/gtw08/climate_zone.py,
    src/aio_remeha_modbus/gtw08/main_control_monitoring.py, src/aio_remeha_modbus/gtw08/system_discovery_table.py

connection:
  default_port: 502
  default_unit: 100
  transports:
  - tcp
  - rtu
  - ascii
  limits:
    max_registers: 40

encoding:
  word_order: big

identify:
  checks:
  - - table: holding
      address: 129
      type: u16
      equals: 7688
    - table: holding
      address: 135
      type: u16
      equals: 7688
    - table: holding
      address: 141
      type: u16
      equals: 7688
    - table: holding
      address: 147
      type: u16
      equals: 7688
    - table: holding
      address: 153
      type: u16
      equals: 7688
