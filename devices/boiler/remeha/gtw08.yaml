      address: 159
      type: u16
      equals: 7688
    - table: holding
      address: 165
      type: u16
      equals: 7688
    - table: holding
      address: 171
      type: u16
      equals: 7688
    - table: holding
      address: 177
      type: u16
      equals: 7688
    - table: holding
      address: 183
      type: u16
      equals: 7688

