notes:
- aio-remeha-modbus reads the GTW-08 with function 03 (holding registers), at most 40 registers per request, on unit id 100
  by default; the gateway is reached over Modbus TCP, RTU over TCP or a serial line (RTU or ASCII).
- 'Device boards: the number of boards is in the low byte of 128; board n (1-based) uses registers 129 + 6 × (n − 1) … 134
  + 6 × (n − 1). Only board 1 is listed here. A board whose type is CU-GH, CU-OH, EHC, CU-HW, EEC or EHC (alternate) is the
  appliance main board; the GTW-08 itself shows up as type GTW, generation 8.'
- 'Climate zones: the number of zones is in the low byte of 189; zone n (1-based) repeats the zone 1 registers (640…1120)
  at + 512 × (n − 1). A zone whose function (641) is 0 is disabled.'
- Each zone holds four weekly time programs of 70 registers (7 days × 10 registers) from 689; they are binary time-slot lists
  and are not listed here. The selected program is in 688.
- On CU-HW main boards (heat pump water heaters) the outside, flow, return and heat pump flow/return temperatures (384, 400,
  401, 403, 404) are not available; the digital input settings 9009…9012 exist only there.
- 'The current error (277) is shown as two bytes, high byte and low byte, e.g. 0x0207 = 02.07, with a prefix from the error
  priority (278): E = locking, H = blocking, A = warning.'
- The library spaces requests by at least 1.75 ms.
- Identification as aio-remeha-modbus recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
