notes:
- The register map goes back to the reverse-engineered Ingramz/ecl110 project (application 116/130, software 1.06); Danfoss_ecl110
  checked part of it on one controller with application 130 and kept the rest as unconfirmed.
- Addresses are the controller's menu line numbers minus one (menu 2175 = register 11174).
- Which application key (116 or 130) is installed is chosen by the user; the models have no match.
- Danfoss_ecl110 reads only runs of adjacent registers, at most 16 at a time, and waits 0.1 s between requests; it was used
  through a Modbus TCP gateway in front of the 19200 baud RS485 side.
- 'Weekly schedule: four times per day (start 1, stop 1, start 2, stop 2) from 1109 (Monday), 10 registers per day; minutes
  00 or 30, 24:00 = end of day.'
- S1–S4 read 1920 (192.0 °C) when the sensor is not connected.
- 'Left out 26 registers the project lists without a known function: 2002, 2010, 2014, 2102, 2103, 2104, 2105, 2106, 2107,
  2108, 2109, 2110, 4614, 11099, 11180, 11189, 11190, 11220, 11221, 11222, 11223, 60007, 60020, 60025, 65534, 65535.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
