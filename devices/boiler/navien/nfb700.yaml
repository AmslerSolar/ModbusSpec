notes:
- "Addresses: the document writes references with a table digit in front (00009, 10073, 30039, 40002 appear in its text), so they are 1-based references: 00001 is coil 0, 10011 is discrete input 10, 30001 is input 0, 40001 is holding 0. It has no frame example and no function codes, so the subtraction of 1 rests on the usual meaning of these references and on FORMAT.md, not on a frame (unverified)."
- "The document lists no function codes; its data model only says coils and holding registers can be read and written, which is why they are marked writable. Function 16 is not mentioned. It does not say which settings are stored in non-volatile memory, so `persistent` is left out; treat the settings as not meant for a control loop until checked."
- "Interlocks: Modbus RTU is off by default and has to be enabled in the EMS menu. To switch the boilers from a building automation system, main DIP switch 7 must be ON (space heating thermostat unused) or the T/S ZONE3 port shorted. In a cascade the RS-485 line goes to the main unit."
- "Temperatures: every temperature register is listed in °C. Coil 7 chooses Celsius or Fahrenheit for the display type; the document does not say whether the registers follow it, so check on a device before relying on °C while it is set to Fahrenheit."
- "Word registers have no stated sign. Those with a negative minimum are s16 (unverified), the rest u16. Real value = raw × Resolution column. BTU is the document's unit for capacity and current gas, without a per-hour; the total gas register is in litres."
- "Serial: 9600 baud, no parity are the defaults; the baud rate menu also offers 19200, a value printed as 34800 (probably 38400), 57600 and 115200, and parity even or odd. Data 8, stop 1, unit 1 (1–100 settable), reply timeout setting 100–1000 ms, default 100 ms."
- "No Modbus TCP in the document: the port and 125 registers per request are assumed, for gateways. Only addresses in the document are listed, with gaps; max_gap stays 0 since gaps may not answer."
- "Models: pick `cascade` on the main unit of a cascade to read the cascade totals and per-unit values, and `single` otherwise. The file can't tell them apart from the device: the document does not say what the cascade registers read on a single boiler."
- "Left out: the second cascade view organised by data rather than unit (discrete 10073–10200, input 30101–30356), whose rows repeat values in the per-unit blocks here; and units beyond sub 7. The address ranges allow for 32 units (discrete 10201 + 16 × n, 32 blocks to 10712; input 30401 + 22 × n, 32 blocks to 31104) and the document says later blocks use the main unit's layout, but it only prints rows up to sub 7."
- "Per-unit layout: the water pressure row is printed only for the main unit (offset 6), not for the subs, so the subs have no pressure point here."
- "Document inconsistencies: the second data-view table for input registers is headed as discrete inputs; its header says 8 data sets in 30101–30356 and 10073–10200 is said to hold 4, and not all are printed. DHW call signal has different value meanings in the single and cascade tables. Holding 2 (SH return setpoint) allows up to 90 °C, while the return limits end at 70 °C, and DHW setpoint allows 85 °C against a DHW maximum of 70 °C. The hour and minute registers allow 24 and 60. Sub 6 prints its total gas rows as Word instead of Dword."
- "identify uses the system date registers together with the control method registers: the document has no model, serial or firmware register. This is a fit of ranges rather than a true identification, and no serial is available."
- "The fault classification of the error bit and of the cascade error code is ours; the document only says error status. The document gives no list of error codes."
