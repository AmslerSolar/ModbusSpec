modbusspec: 0
id: navien-nfb700
manufacturer: Navien
name: NFB700 boiler
kind: boiler

sources:
- title: Navien Modbus RTU Installation & Operation Manual
  version: '1.0'
  url: https://www.navieninc.ca/app/W1siZiIsIjIwMjYvMDcvMjAvMTcvMzEvMzMvNGRjYTMyNjItODYzZi00NWM1LTk2ZGQtMjAyMDg1NzRjODdjL01vZGJ1cyBSVFVfTkZCNzAwX0luc3RhbGxhdGlvbl9PcGVyYXRpb25fTWFudWFsX0VOXzI1MTIxMCAoMSkucGRmIl1d/Modbus%20RTU_NFB700_Installation_Operation_Manual_EN_251210%20%281%29.pdf?sha=091ec5f493184aed
  sha256: 3fa25506f7d32d889246f8a82cf759cd2463e17dbed3eee2b442b9f429057944
  date: 2025-12
  language: en
  devices:
  - NFB700-500C
  - NFB700-600C
  - NFB700-800C
  - NFB700-1000C

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

models:
- id: single
  name: Single boiler
- id: cascade
  name: Main unit of a cascade

model_choice: user

identify:
  checks:
  - table: holding
    address: 19
    type: u16
    range:
    - 2018
    - 2099
  - table: holding
    address: 20
    type: u16
    range:
    - 1
    - 12
  - table: holding
    address: 21
    type: u16
    range:
    - 1
    - 31
  - table: input
    address: 38
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
  - table: input
    address: 39
    type: u16
    in:
    - 0
    - 1

points:
  # Coils
  - {key: x.sh_operation, label: SH operation on/off control, table: coil, address: 0, type: bool, writable: true, poll: slow, note: 'Single mode. Writing 1 can start heating. Needs Modbus RTU enabled in the EMS menu and, to switch the boiler from the BAS, main DIP switch 7 ON or the T/S ZONE3 port shorted.'}
  - {key: x.outdoor_reset_enable, label: Outdoor reset curve usage enable, table: coil, address: 1, type: bool, writable: true, poll: slow, note: Single and cascade mode.}
  - {key: x.wwsd_enable, label: WWSD enable, table: coil, address: 2, type: bool, writable: true, poll: slow, note: Warm weather shutdown; single and cascade mode.}
  - {key: x.dhw_operation, label: DHW operation ON/OFF control, table: coil, address: 3, type: bool, writable: true, poll: slow, note: Single mode. Writing 1 can start domestic hot water heating.}
  - {key: x.touch_lock, label: Touch lock ON/OFF control, table: coil, address: 5, type: bool, writable: true, poll: slow}
  - {key: x.temperature_display, label: Temperature display type, table: coil, address: 7, type: bool, enum: temperature_display, writable: true, poll: slow, note: '1 = Fahrenheit, 0 = Celsius. The document lists every temperature register in °C and does not say whether this switch changes them (unverified).', verified: false}
  - {key: x.reset_duration_data, label: Reset Duration Data, table: coil, address: 8, type: bool, writable: true, poll: slow, note: 'Writing 1 clears the accumulated data (operation times, gas consumption and the like); the coil then goes back to 0 by itself.'}
