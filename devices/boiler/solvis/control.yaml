  circulation_mode_sc2: {'1': 'Off', '2': Pulse, '3': Temperature, '4': Waiting}
  analog_out_mode: {'0': Auto PWM, '1': Manual PWM, '2': Auto analog, '3': Manual analog}
  circuit_mode: {'1': 'Off', '2': Automatic, '3': Day mode, '4': Set-back mode, '5': Standby, '6': Eco, '7': Holiday, '8': Hot water priority, '9': Frost protection, '10': Pump protection, '11': Screed drying}
  flow_type: {'0': Heating curve, '1': Fixed}

flags:
  digin_error: {'0': Mains module fuse, '1': Burner fault, '2': STB 1 fault (safety temperature limiter), '3': STB 2 fault (safety temperature limiter), '4': Burner CM424, '5': Solar pressure, '7': System pressure, '8': Condensate}

problems:
  - {when: {key: x.digin_error, bit: 0}, kind: fault, text: Mains module fuse (bit 0)}
  - {when: {key: x.digin_error, bit: 1}, kind: fault, text: Burner fault (bit 1)}
  - {when: {key: x.digin_error, bit: 2}, kind: fault, text: Safety temperature limiter 1 tripped (bit 2)}
  - {when: {key: x.digin_error, bit: 3}, kind: fault, text: Safety temperature limiter 2 tripped (bit 3)}
  - {when: {key: x.digin_error, bit: 4}, kind: fault, text: Burner CM424 fault (bit 4)}
  - {when: {key: x.digin_error, bit: 5}, kind: warning, text: Solar circuit pressure (bit 5)}
  - {when: {key: x.digin_error, bit: 7}, kind: fault, text: System pressure (bit 7)}
  - {when: {key: x.digin_error, bit: 8}, kind: warning, text: Condensate (bit 8)}

notes:
- Modbus TCP on port 502, on the controller itself (SolvisControl 3, LAN or WLAN) or through the SolvisRemote (SolvisControl
  2, controller version MA205 or later). Modbus is off by default and is switched to read-only or read/write in the installer
  menu.
- The unit id is not stated in the documents; 1 is assumed.
- Addresses are the documents' decimal (and hex) protocol addresses, used as they are.
- Register types (signed / unsigned) are not stated; temperatures and settings are read as signed 16-bit numbers.
- Nothing on the bus tells SolvisControl 2 and 3 apart in the documents; the user picks the controller.
- 'Sensors S1–S16: 220 °C means an open circuit and −30 °C a short circuit (the SolvisControl 2 document says this for S1–S10).'
- SolvisControl 2 does not answer writes of out-of-range values or writes in read-only mode with a Modbus error; the value
  is simply not taken.
- The two documents place some registers differently (hot water mode 2304 / 2054, reheat start 2328 / 2322, heating curve
  slope 2832 / 2826 and holiday settings); these points have one entry per model.
- Messages (33793 ff.) are 10 blocks of 5 registers (code, Unix time high, low, parameter 1, parameter 2); the parameters
  are left out. The meaning of the message codes is not described.
- Left out the holiday settings (e.g. 2870–2883 on SolvisControl 3, 2852–2859 on SolvisControl 2) and the weekly schedules
  (34048–34299, quarter hours 0…95).
- 'evcc template `solvis` (single device) lists: Solvis SolvisControl 2/3.'
- The template has the option `tempsource` (default warmwater); points used only with another value say so in their note.
- hassio-solvis-modbus is written for SolvisControl 3 and reads one register per request with function 04.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- hass_solvis_control reads one register per request, every value as a signed 16-bit number, and writes with function 06 to
  unit id 1.
- Which controller is connected (SolvisControl 2 or 3) is chosen by the user; nothing on the bus tells them apart in the project.
  On SolvisControl 2 the project reconnects before every poll and waits 0.3 s after each read.
- On SolvisControl 2 the flow sensors S17 (33040) and S18 (33041) give a raw sensor value; the project turns it into l/min
  as 60 / raw × 1000 / 42 (S17) and 60 / raw × 1000 / 84 (S18).
- 'Firmware versions (32770, 32771) are 5-digit decimal numbers: 32016 means 3.20.16.'
- The analog outputs O1–O6 (33294–33299) report a percentage; their mode (auto/manual, PWM/analog) is in 3840 + 5 × (n − 1).
- 'Relay outputs A1–A14 (33280–33293) are 0 = off, anything else = on. On several of them the project swaps the two bytes
  of the register before reading it (byte_order: little).'
- Optional parts (heating circuits 2 and 3, solar, heat pump, heat meter, PV2Heat, room sensors) are only polled when the
  user enables them; the registers are the same for every installation.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
