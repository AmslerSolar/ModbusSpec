  - {key: x.fw_date, label: FW Date, table: holding, address: 0, type: u16, poll: slow, note: (month × 40 + day) × 100 + year.}
  - {key: x.fw_time, label: FW Time, table: holding, address: 1, type: u16, poll: slow, note: Hour × 100 + minute.}
  - {key: x.fw_major, label: FW Version Major, table: holding, address: 2, type: u16, poll: slow}
  - {key: x.fw_minor, label: FW Version Minor, table: holding, address: 3, type: u16, poll: slow}
  - {key: x.fw_revision, label: FW Version Revision, table: holding, address: 4, type: u16, poll: slow}
  - {key: x.pcb_version, label: PCB Version, table: holding, address: 5, type: u16, poll: slow}
  - {key: serial, label: Tech serial number (High / Low), table: holding, address: 6, type: u32, poll: slow, note: 'Two registers, high word first.'}
  - {key: x.bootloader_major, label: Bootloader FW Version Major, table: holding, address: 8, type: u16, poll: slow}
  - {key: x.bootloader_minor, label: Bootloader FW Version Minor, table: holding, address: 9, type: u16, poll: slow}
  - {key: x.bootloader_revision, label: Bootloader FW Version Revision, table: holding, address: 10, type: u16, poll: slow}

