modbusspec: 0
id: roth-touchline-sl
manufacturer: Roth
name: Touchline SL floor heating controller (generation 2, Modbus RTU)
kind: boiler

sources:
- title: Roth Touchline SL ModBus RTU (Modbus RTU integration NO)
  version: '2024-07-12'
  url: https://www.roth-norge.no/fileadmin/user_upload/Roth_North_Europe/Images_for_Roth_North_Europe/Norway/PDF_files_for_Norway/PDF_files_for_Support_Norway/Firmware/Modbus_RTU_integration_NO_20240712.pdf
  sha256: c9a2b08223fb4679f3e73b18bc706f08cceca5e6636a86f071fbcded290a7cb1
  archive_url: https://web.archive.org/web/20240804192735/https://www.roth-norge.no/fileadmin/user_upload/Roth_North_Europe/Images_for_Roth_North_Europe/Norway/PDF_files_for_Norway/PDF_files_for_Support_Norway/Firmware/Modbus_RTU_integration_NO_20240712.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 6
    type: u32

defaults:
  verified: false

points:
