  - {key: x.clock_year, label: Year, table: holding, address: 13, type: u16, writable: true, poll: slow}
  - {key: x.clock_hour, label: Hour, table: holding, address: 14, type: u16, writable: true, poll: slow}
  - {key: x.clock_minute, label: Minute, table: holding, address: 15, type: u16, writable: true, poll: slow}
  - {key: x.clock_second, label: Second, table: holding, address: 16, type: u16, writable: true, poll: slow}

  # System settings
  - {key: x.quick_action, label: Setting QuickActions, table: holding, address: 17, type: u16, enum: quick_action, writable: true, poll: slow}
  - {key: x.heat_cool_mode_master, label: Setting HeatCoolMode - Master L-12, table: holding, address: 18, type: u16, enum: heat_cool_mode, writable: true, poll: slow}
