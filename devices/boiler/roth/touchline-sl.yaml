notes:
- The document numbers registers from 1 (Reg. 1 = FW Date) and doesn't state whether these are protocol addresses or 1-based
  numbers, nor the function code. The addresses here assume 1-based numbering (address = Reg. − 1) and holding registers (function
  03, writes 06/16); neither is verified. The bit tables are numbered 1…16 the same way; bit 1 (zone 1, 17, 33) is taken as
  the least significant bit, as the document's example shows.
- Needs controller firmware 1.0.11 and extension module firmware 1.0.12G or newer (generation 2 controllers with a BMS/Modbus
  connector).
- 'Modbus settings are in the service menu: slave address 1 (1…247), even parity, one stop bit by default; the baud rate is
  fixed at 19200 (8E1).'
- Zone values are in blocks of 48 consecutive registers, zone 1 first; the document's range for the zone 2…48 set temperatures
  is printed as '2…28' but spans 47 registers. Values for zones without a sensor are not described.
- 'Left out: per-zone signal levels (Reg. 318–365), actuator 1…6 signal and battery levels (382–957), window sensor 1…6 signal
  and battery levels (958–1533), floor sensor signal and battery levels (1534–1629), the MW-1 and extension module signal
  levels (1630–1656) and the floor sensor mode and upper / lower floor temperature limits (1657–1800).'
- All values are listed as uint16 (the 0/1 states as bool). Temperatures are °C × 10, humidity % × 10.
