  disabled_enabled: {'0': Disabled, '1': Enabled}
  off_on: {'0': 'Off', '1': 'On'}
  local_remote: {'0': Local, '1': Remote}
  setpoint_mode: {'0': ModSync, '1': Remote setpoint, '2': BMS, '3': Manual}
  fuel: {'0': Fuel 0 (gas), '1': Fuel 1 (oil)}
  boiler_status: {'0': Disabled by ModSync, '1': Temperature override, '2': Remote disable, '3': Outside temperature cutoff, '4': Standby, '5': Purging, '6': Gas valve energized, '7': Modulating, '8': Air switch alarm, '9': Monitor alarm, '10': Heat demand, '11': Low gas pressure, '12': Interlock alarm, '13': Safety loop alarm, '14': LMV error, '15': Disabled by BMS, '16': Modbus communication error, '17': Post purge, '18': Boiler alarm, '19': Limit string open, '20': Communication disabled, '21': Warming active, '22': Primary low water, '23': Secondary low water, '24': High water}
  boiler_lead_lag: {'0': Manual, '1': Disabled, '2': Lead, '3': Lag 1, '4': Lag 2, '5': Lag 3, '6': Lag 4, '7': Lag 5, '8': Lag 6, '9': Lag 7}
  pump_status: {'0': Disabled, '1': Standby, '2': Command, '3': Running, '4': Alarm}

