notes:
- Every value is a holding register (read with function 03, written with 06 or 16). The addresses are the protocol (0-based,
  "PDU") addresses as the document lists them; a master that counts from 1 must add one.
- Temperatures, pressures and the BMS setpoint are in tenths (1200 = 120.0). Temperatures are °F or °C depending on a setting
  on the ModSync that isn't readable here; `°C` is only the unit if the ModSync is set to Celsius.
- 'RS485, RTU, 8N1; 9600, 19200, 38400 or 57600 baud selectable (9600 here is an assumption). The document gives no default
  Modbus address: unit 1 is assumed, port 502 is for a gateway.'
- Registers marked in the document as depending on an option answer only when that option is enabled on the ModSync (`optional`
  here).
- Boilers 1–8 each have a block of 14 registers (1812 + 14 × (n − 1)). The status table of boiler 1 lists all values 0–24;
  those of boilers 2–8 omit 9 (monitor alarm) and 12 (interlock alarm); one table is used for all.
- The document lists boiler 7's outlet temperature range as 0 to 25000, the others 0.0 to 250.0; taken as the same scaling.
- Left out the per-boiler isolation valve command / status and pump command / status / speed registers (1924–1963) and the
  system pump lead-lag positions (1976–1979).
