modbusspec: 0
id: fulton-modsync-se
manufacturer: Fulton
name: ModSync SE boiler sequencer (hydronic)
kind: boiler

sources:
- title: ModSync SE Modbus Interface Manual (hydronic)
  version: 6.6.1.X
  url: https://fulton.com/app/uploads/2021/02/ModSync-SE-Hydronic-V661X-Modbus.pdf
  sha256: 1916f812002de009ef78c0a810fdc4f4d0c5d989fd741c286b7111b1750cc96d

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

