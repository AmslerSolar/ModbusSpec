notes:
- The gateway translates the LON bus of Viessmann boiler controls (Vitocontrol-S MW1/MW2, Vitotronic 300-K MW1B/MW2B, Vitotronic
  100 GC1/GC1B, Vitotronic 300 GW2/GW5B, Vitotronic 200 HO1, Vitodens 200 B2HA) to Modbus RTU. KWE makes the gateway; Viessmann
  makes the controls. Up to four boilers plus one zone/cascade control (heating circuits A1, M2, M3); registers of boilers
  or zones that aren't there carry no meaningful value.
- 'Addresses: the document numbers holding registers from 1 (= 40001); converted to 0-based protocol addresses (register n
  → n − 1). Holding and input registers hold the same data. Read at most 40 registers at a time and nothing beyond register
  77 (address 76); coils and discrete inputs aren''t used.'
- RS485 (COM1 A/B), RTU, 9600 8N1, no termination resistor fitted. Unit id 88 with the rotary dial at its factory position
  0, otherwise 1–9 as dialled. Port 502 is for a gateway.
- 'Data types and signs aren''t stated: registers are taken as signed 16-bit whole units (s16) except addresses, counts, relay
  states (stated unsigned) and fault codes. Not stated in the document; assumed.'
- Temperatures are °C or °F depending on register 23 (0 = °C, 1 = °F); the units here hold only for °C. Curve shift is in
  K, curve slope in 0.1 steps.
- Registers 1–23 (addresses 0–22) are stored in the gateway's EEPROM. 1–6 (LON addresses of the boilers and zone control,
  zone count) must be set at commissioning; 7–22 are writeable set-points of the zone/cascade control, mirrored read-only
  at 57–77.
- Boiler state (registers 25–28) is given only as a percentage; burner modulation is assumed (not stated).
- 'Relay state bits differ by control: where a bit has two meanings, the second applies to Vitodens 200 / Vitotronic 200 HO1
  (and the internal pump also to Vitotronic 300-K); which bits a given control reports depends on its configuration.'
- Fault codes are Viessmann control codes, given in hex in the document and as decimal register values; the document lists
  bd as 186, which is taken as 189 (0xBD).
