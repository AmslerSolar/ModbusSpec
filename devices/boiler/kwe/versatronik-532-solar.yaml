id: kwe-versatronik-532-solar
manufacturer: KWE Technologies
name: Versatronik 532 / 532D Solar Modbus gateway (RESOL VBus solar controllers)
kind: boiler

sources:
- title: Versatronik 532 & 532D Solar Communication Gateway for solar controls – Modbus (P/N 394047)
  version: V1.0 (09/2013)
  url: http://kwe-tech.com/files/Versatronik/Versatronik_532_Solar_Modbus_User_Guide.pdf
  sha256: 4df07a09adde9ba4c98cfd52cb8e7ef8d41c4aaa45077acc19a4c8b0655d244f
  archive_url: https://web.archive.org/web/20200930061530/http://kwe-tech.com/files/Versatronik/Versatronik_532_Solar_Modbus_User_Guide.pdf

