notes:
- The gateway translates the RESOL VBus of the connected solar controller to Modbus RTU. RESOL makes the controllers; Viessmann
  sells some of them under its own names (Vitosolic 200, SCU 124 / 224 / 345). Which registers carry data depends on the controller
  (`models`); the gateway gives no way to tell them apart, so the user picks the controller.
- 'Addresses: the document numbers coils from 1, discrete inputs from 10001 and input registers from 30001; converted to 0-based
  protocol addresses (coil 97 → 96, 10001 → 0, 30001 → 0).'
- All input registers are signed 16-bit with a multiplier of 1 (whole units). Temperatures are °C or °F, irradiation W/m²
  or W/ft² and flow l/h or gpm, as the controller sends them; the units here hold only for metric settings.
- 'RS485 (COM1 A/B), RTU, 9600 8N1, no termination resistor fitted. The document gives the address as "88, 1-9" (a rotary
  dial for several gateways, left at 0 with RESOL controllers): unit 88 is assumed for dial 0. Port 502 is for a gateway.'
- In the document's table the DeltaSol BX Plus column has blanks rather than dashes for some rows; blanks are taken as "not
  available".
