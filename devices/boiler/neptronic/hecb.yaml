# Written from the Neptronic HECB-Modbus Guide-150630 (2015-06-30).

modbusspec: 0
id: neptronic-hecb
manufacturer: Neptronic
name: HECB series electric duct heater controller
kind: boiler

sources:
- title: Electric Duct Heater HECB Series, Modbus Communication Module User Guide (HECB-Modbus Guide-150630)
  version: '2015-06-30'
  url: http://www.neptronic.com/Heaters/pdf/HECB-Modbus%20Guide-150630.pdf
  sha256: d1b19e19a431e5d7ecfc54f064ff383f476a8e2fb48b2c210c2420ec3331a9f1
  archive_url: https://web.archive.org/web/20171026060758/http://neptronic.com:80/Heaters/pdf/HECB-Modbus%20Guide-150630.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:
  # Identification (0)
  - {key: x.modbus_address, label: 'Identification, address - Neptronic id and Modbus address', table: holding, address: 0, type: u16, bits: [0, 7], poll: slow, note: Modbus address 1–247.}
  - {key: x.product_id, label: Neptronic product id, table: holding, address: 0, type: u16, bits: [8, 15], poll: slow, note: Value for the HECB not given.}

  # Inputs (1–13)
  - {key: x.control_input, label: Analog control input, table: holding, address: 1, type: u16, unit: mV, verified: false, note: 'Range 0–10000 mV; the document also gives a factor of 100 in its example. Read as mV, unverified. Meaning depends on the control mode.'}
  - {key: x.pneumatic_pressure, label: Pneumatic pressure measured from the analog input signal, table: holding, address: 3, type: u16, unit: psi, scale: 0.1, optional: true, verified: false, note: Scale from the document's example (200 PSI = 2000); its text also says value / 100. Pneumatic control mode only.}
  - {key: x.input_temperature, label: Input temperature measured by thermistor on the analog input, table: holding, address: 5, type: u16, unit: °C, scale: 0.01, optional: true, verified: false, note: °C or °F per bit 0 of the system options (register 87); °C assumed.}
  - {key: x.heater_temperature1, label: Heater temperature sensor 1, table: holding, address: 6, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.heater_temperature2, label: Heater temperature sensor 2, table: holding, address: 7, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.ssr_temperature, label: Solid state relay temperature, table: holding, address: 8, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.discharge_temperature, label: Duct temperature discharge side, table: holding, address: 9, type: u16, unit: °C, scale: 0.01, optional: true, verified: false, note: °C assumed (see register 87).}
  - {key: x.supply_temperature, label: Duct temperature supply side, table: holding, address: 10, type: u16, unit: °C, scale: 0.01, optional: true, verified: false, note: °C assumed (see register 87).}
  - {key: x.potentiometer_setpoint, label: On board setpoint read from the potentiometer, table: holding, address: 11, type: u16, unit: °C, scale: 0.01, poll: slow, verified: false, note: °C assumed (see register 87).}
  - {key: x.board_temperature, label: Circuit board temperature, table: holding, address: 12, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.trl_temperature, label: Temperature read on the TRL, table: holding, address: 13, type: u16, unit: °C, scale: 0.01, optional: true, verified: false, note: Room sensor. °C assumed (see register 87).}

  # Power (14–25)
  - {key: l1_current, label: Power phase 1 current measurement, table: holding, address: 14, type: u16, unit: A, scale: 0.1}
  - {key: l2_current, label: Power phase 2 current measurement, table: holding, address: 15, type: u16, unit: A, scale: 0.1}
  - {key: l3_current, label: Power phase 3 current measurement, table: holding, address: 16, type: u16, unit: A, scale: 0.1}
  - {key: frequency, label: Measured line frequency, table: holding, address: 17, type: u16, unit: Hz}
  - {key: x.demand, label: System demand in all control modes, table: holding, address: 18, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, verified: false, note: Scale 0.1 % assumed.}
  - {key: x.modulated_duty, label: Modulated stage duty cycle, table: holding, address: 19, type: u16, unit: '%', scale: 0.1, verified: false, note: Range 0–1000; scale 0.1 % assumed.}
  - {key: x.output, label: Instant system output, table: holding, address: 20, type: u16, unit: '%', scale: 0.1, verified: false, note: Range 0–1000; scale 0.1 % assumed.}
  - {key: x.power_target, label: Instant system power target, table: holding, address: 21, type: u16, unit: kW, scale: 0.1}
  - {key: consumer_power, label: Instant system power measurement, table: holding, address: 22, type: u16, unit: W, scale: 100, positive: consumption, note: kW × 10 in the document.}
  - {key: x.heater_differential_temperature, label: Heater sensors' differential temperature, table: holding, address: 23, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.duct_differential_temperature, label: Duct sensors' differential temperature, table: holding, address: 24, type: u16, unit: °C, scale: 0.01, verified: false, note: °C assumed (see register 87).}
  - {key: x.audit_energy, label: Energy over the last energy audit period, table: holding, address: 25, type: u16, unit: kWh, scale: 0.1, poll: slow, note: Running average period in register 75.}

  # Settings
  - {key: x.unoccupied_setpoint, label: Unoccupancy setpoint, table: holding, address: 29, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: °C assumed (see register 87).}
  - {key: x.vacant_setpoint, label: Vacant setpoint, table: holding, address: 30, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: °C assumed (see register 87).}
  - {key: x.max_output, label: Maximum system output as per user setting, table: holding, address: 31, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, poll: slow, verified: false, note: Scale 0.1 % assumed.}
  - {key: x.duct_working_setpoint, label: Duct working temperature setpoint, table: holding, address: 42, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: The document gives two different ranges. °C assumed.}
  - {key: x.duct_cutout_setpoint, label: Duct cutout temperature setpoint, table: holding, address: 43, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: °C assumed.}
  - {key: x.tpm_stage_rating, label: Time pulse modulating stage power rating, table: holding, address: 51, type: u16, unit: kW, scale: 0.1, poll: slow}
  - {key: x.fan_rating, label: Fan power rating, table: holding, address: 66, type: u16, unit: hp, scale: 0.1, poll: slow}
  - {key: x.trl_setpoint, label: TRL user setpoint, table: holding, address: 67, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C assumed (see register 87).}
  - {key: x.trl_setpoint_min, label: TRL minimum setpoint value, table: holding, address: 68, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: °C assumed.}
  - {key: x.trl_setpoint_max, label: TRL maximum setpoint value, table: holding, address: 69, type: u16, unit: °C, scale: 0.01, writable: true, poll: slow, verified: false, note: °C assumed.}
  - {key: x.network_temperature, label: Temperature provided by a network service, table: holding, address: 70, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C assumed (see register 87).}
  - {key: x.network_setpoint, label: Setpoint provided by a network service, table: holding, address: 71, type: u16, unit: °C, scale: 0.01, writable: true, verified: false, note: °C assumed (see register 87).}
  - {key: x.remote_timeout, label: Maximum interval between two remote value updates, table: holding, address: 72, type: u16, unit: min, writable: true, min: 1, max: 15, poll: slow}
  - {key: x.remote_timeout_remaining, label: Remaining seconds before remote timeout, table: holding, address: 73, type: u16, unit: s}

  # States and alarms (84–95)
  - {key: x.input_states, label: Input states, table: holding, address: 84, type: u16, flags: input_states}
  - {key: x.output_states, label: Output states, table: holding, address: 85, type: u16, flags: output_states}
  - {key: x.system_status, label: System status, table: holding, address: 86, type: u16, flags: system_status}
  - {key: x.options, label: System options, table: holding, address: 87, type: u16, flags: options, writable: true, poll: slow}
  - {key: x.temperature_unit, label: Network user temperature units, table: holding, address: 87, type: u16, bits: [0, 0], enum: temperature_unit, writable: true, poll: slow}
  - {key: x.system_off, label: System on/off, table: holding, address: 87, type: u16, bits: [15, 15], enum: on_off, writable: true}
  - {key: x.alarms1, label: System alarms (1), table: holding, address: 88, type: u16, flags: alarms1}
  - {key: x.alarms2, label: System alarms (2), table: holding, address: 89, type: u16, flags: alarms2}
  - {key: x.control_mode, label: Control mode, table: holding, address: 90, type: u16, enum: control_mode}
  - {key: x.airflow_status, label: Air flow status, table: holding, address: 91, type: u16, enum: airflow_status}
  - {key: x.temperature_source, label: Temperature source, table: holding, address: 92, type: u16, enum: temperature_source, writable: true, poll: slow}
  - {key: x.setpoint_source, label: Setpoint source, table: holding, address: 93, type: u16, enum: setpoint_source, writable: true, poll: slow}
  - {key: x.occupancy, label: Occupancy, table: holding, address: 94, type: u16, enum: occupancy}
  - {key: x.stages, label: Number of ON/OFF stages, table: holding, address: 95, type: u16, poll: slow}

enums:
  temperature_unit: {'0': °C, '1': °F}
  on_off: {'0': 'On', '1': 'Off'}
  control_mode: {'0': External, '1': Internal, '2': Neptronic signal, '3': Remote, '4': Pneumatic, '5': TPM}
  airflow_status: {'0': No heat, '1': No flow, '2': Low flow, '3': Regular flow}
  temperature_source: {'0': External, '1': Internal, '2': TRL, '3': Supply, '4': Discharge}
  setpoint_source: {'0': Onboard potentiometer, '1': Remote, '2': TRL}
  occupancy: {'0': Occupied, '1': Unoccupied, '2': Vacant}

flags:
  input_states: {'0': Thermal cutout, '1': Air flow cutout, '2': Interlock cutout}
  output_states: {'0': Fan, '1': Stage 1, '2': Stage 2, '3': Stage 3, '4': Stage 4, '5': Stage 5, '6': Stage 6, '7': Stage 7, '8': Stage 8, '9': Stage 9, '10': Stage 10, '11': Stage 11, '12': Stage 12}
  system_status: {'0': Limited by heater box temperature, '1': Limited by SSR temperature, '2': Limited by board temperature, '3': Limited by duct temperature}
  options: {'0': Network temperatures in °F, '1': Network control override, '2': TRL shows °F, '3': TRL setpoint locked, '4': TRL on/off locked, '5': Changeover monitoring, '6': Auto PID, '8': Heater safety active, '9': SSR temperature safety active, '10': Board temperature safety active, '11': Duct temperature safety active, '15': System off}
  alarms1: {'0': Thermal cutout open, '1': Air flow cutout open, '2': Interlock cutout open, '3': Heater high temperature cutout, '4': Board high temperature cutout, '5': SSR high temperature cutout, '6': Duct high temperature cutout, '7': Heater sensor 1 failure, '8': Heater sensor 2 failure, '9': Board sensor failure, '10': SSR sensor failure, '11': TRL communication timeout, '12': Remote management timeout}
  alarms2: {'0': External sensor failure, '1': Supply sensor failure, '2': Discharge sensor failure, '3': TRL sensor failure, '9': Current sensor 0 failure, '10': Current sensor 1 failure, '11': Current sensor 2 failure, '12': Measured power too high, '13': Measured power too low, '14': Air flow not detected, '15': Heat not detected}

problems:
  - {when: {key: x.alarms1, bit: 0}, kind: fault, text: Thermal cutout open}
  - {when: {key: x.alarms1, bit: 1}, kind: fault, text: Air flow cutout open}
  - {when: {key: x.alarms1, bit: 2}, kind: fault, text: Interlock cutout open}
  - {when: {key: x.alarms1, bit: 3}, kind: fault, text: Heater high temperature cutout}
  - {when: {key: x.alarms1, bit: 4}, kind: fault, text: Board high temperature cutout}
  - {when: {key: x.alarms1, bit: 5}, kind: fault, text: SSR high temperature cutout}
  - {when: {key: x.alarms1, bit: 6}, kind: fault, text: Duct high temperature cutout}
  - {when: {key: x.alarms1, bit: 7}, kind: fault, text: Heater sensor 1 failure}
  - {when: {key: x.alarms1, bit: 8}, kind: fault, text: Heater sensor 2 failure}
  - {when: {key: x.alarms1, bit: 9}, kind: warning, text: Board sensor failure}
  - {when: {key: x.alarms1, bit: 10}, kind: warning, text: SSR sensor failure}
  - {when: {key: x.alarms1, bit: 11}, kind: warning, text: TRL communication timeout}
  - {when: {key: x.alarms1, bit: 12}, kind: warning, text: Remote management timeout}
  - {when: {key: x.alarms2, bit: 0}, kind: warning, text: External sensor failure}
  - {when: {key: x.alarms2, bit: 1}, kind: warning, text: Supply sensor failure}
  - {when: {key: x.alarms2, bit: 2}, kind: warning, text: Discharge sensor failure}
  - {when: {key: x.alarms2, bit: 3}, kind: warning, text: TRL sensor failure}
  - {when: {key: x.alarms2, bit: 9}, kind: warning, text: Current sensor 0 failure}
  - {when: {key: x.alarms2, bit: 10}, kind: warning, text: Current sensor 1 failure}
  - {when: {key: x.alarms2, bit: 11}, kind: warning, text: Current sensor 2 failure}
  - {when: {key: x.alarms2, bit: 12}, kind: warning, text: Measured power too high}
  - {when: {key: x.alarms2, bit: 13}, kind: warning, text: Measured power too low}
  - {when: {key: x.alarms2, bit: 14}, kind: fault, text: Air flow not detected (temperature differential)}
  - {when: {key: x.alarms2, bit: 15}, kind: warning, text: Heat not detected (temperature differential)}

notes:
- 'Addresses: the document numbers registers from 40000 (40000 = protocol address 0, the address register); the protocol address
  is the number minus 40000.'
- Holding registers only, read with function 03.
- RS485 Modbus RTU, unit id 1–247 set on the device menu or in register 0; the device also always answers on unit id 247.
  Default unit id not stated; 1 assumed.
- 'Serial: automatic baud rate detection by default (9600–57600); parity and stop bits set on the device menu. Default framing
  not stated; 9600 8N1 assumed.'
- Temperatures are in °C or °F per bit 0 of the system options (register 87); °C assumed. The document's temperature ranges
  are given for both units.
- Register 0 is marked read-only in the document although the text says the address can be set there.
- The control mode, air flow status, source and occupancy registers (90–95) are typed as bit strings in the document but list
  single values; read as enums.
- System options bits 8–11 are read-only; bit 15 = 1 turns the system off.
- 'Kind: an electric heater for air ducts, listed as other heating (`boiler`).'
- 'Left out: PID and damping parameters (26–28, 32–41, 44–46), stage timing and thresholds (47–50, 64, 65), the twelve stage
  power ratings (52–63), duct changeover setpoint and audit period (74, 75), sensor offsets (76–83) and the TPM duty registers
  (2, 4).'
