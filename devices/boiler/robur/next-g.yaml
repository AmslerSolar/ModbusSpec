# Written from the Robur GEN10 Modbus Interface, f/w 1.003 (V.1.003.MB0, 22/04/2022).

modbusspec: 0
id: robur-next-g
manufacturer: Robur
name: Next-G gas-fired warm air heater (GEN10 controller)
kind: boiler

sources:
- title: The Robur GEN10 Modbus Interface, f/w 1.003
  version: V.1.003.MB0 (22/04/2022)
  url: https://www.orfejas.lt/dokumentacija/robur/instrukcijos/Robur_Next-G_GEN10_Modbus_interface_EN.pdf
  sha256: c0c5e49b85a6d1e753ce3ab9be2cc0f6b9944a859a99f726f437f66c64d44714
  archive_url: https://web.archive.org/web/20230204144747/https://www.orfejas.lt/dokumentacija/robur/instrukcijos/Robur_NEXT-G_GEN10_Modbus_interface_EN.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 100
    type: u32
  checks:
  # platform type 3 (GEN10) in bits 15–10, network id 0
  - table: input
    address: 0
    type: u16
    equals: 3072
  # appliance type (0x7FFF = never configured)
  - table: holding
    address: 110
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 32767

points:
  # Identification (input 0x0000, holding 0x0000 ff.)
  - {key: x.platform_type, label: Platform type, table: input, address: 0, type: u16, bits: [10, 15], enum: platform_type, poll: slow}
  - {key: x.oem_code, label: OEM code, table: holding, address: 0, type: u16, enum: oem_code, poll: slow}
  - {key: x.oem_compatibility_major, label: OEM compatibility code major, table: holding, address: 1, type: u16, poll: slow, note: 0 for this firmware.}
  - {key: x.oem_compatibility_minor, label: OEM compatibility code minor, table: holding, address: 2, type: u16, poll: slow, note: 1 for this firmware.}
  # Board parameters (0x0064 ff.)
  - {key: serial, label: P000 Board serial number, table: holding, address: 100, type: u32, poll: slow}
  - {key: x.firmware_major, label: P002 Firmware version major, table: holding, address: 102, type: u16, poll: slow}
  - {key: x.firmware_minor, label: P003 Firmware version minor, table: holding, address: 103, type: u16, poll: slow}
  - {key: x.hardware_version, label: P004 Hardware version, table: holding, address: 104, type: u16, poll: slow}
  - {key: x.bootloader_version, label: P005 Bootloader version, table: holding, address: 105, type: u16, poll: slow}
  - {key: x.firmware_subminor, label: P006 Firmware version sub-minor (internal), table: holding, address: 106, type: u16, poll: slow}
  - {key: x.serial_check, label: P008 Serial number / HW key check result, table: holding, address: 108, type: u16, enum: serial_check, poll: slow}
  # Appliance type configuration (0x006E ff.)
  - {key: x.appliance_type, label: P010 Appliance type, table: holding, address: 110, type: u16, enum: appliance_type, invalid: [32767], poll: slow, note: 0x7FFF = never configured.}
  - {key: x.module_type_major, label: P030 Heating module type major, table: holding, address: 170, type: u16, enum: appliance_type, invalid: [32767], poll: slow}
  - {key: x.module_type_minor, label: P031 Heating module type minor, table: holding, address: 173, type: u16, enum: fan_type, invalid: [32767], poll: slow}
  - {key: x.module_serial, label: P032 Heating module serial number, table: holding, address: 176, type: u32, poll: slow}
  # Appliance status (0x02BC ff.)
  - {key: x.operating_status, label: Appliance operating status, table: holding, address: 700, type: u16, flags: operating_status}
  - {key: x.digital_inputs, label: Appliance digital inputs status, table: holding, address: 701, type: u16, flags: digital_inputs, note: A set bit = contact closed. The limit and flue thermostats are in error when open.}
  - {key: x.digital_outputs, label: Appliance digital outputs status, table: holding, address: 702, type: u16, flags: digital_outputs}
  - {key: state, label: Appliance functional status, table: holding, address: 703, type: u16, enum: functional_status}
  - {key: x.burner_status, label: Burner functional status, table: holding, address: 704, type: u16, enum: burner_status}
  - {key: x.fan_status, label: Fan functional status, table: holding, address: 705, type: u16, enum: fan_status}
  # Modbus controller commands (0x0320 ff.): only take effect with P42 = 1 (remote controller installed)
  - {key: x.operation_request, label: Operation request, table: holding, address: 800, type: u16, enum: operation_request, writable: true, note: Falls back to Off when the Modbus timeout (P41) elapses without traffic.}
  - {key: x.ventilation_speed_request, label: Ventilation speed in ventilation (summer) mode, table: holding, address: 801, type: u16, enum: ventilation_speed, writable: true}
  - {key: x.heating_setpoint, label: Heating ambient setpoint, table: holding, address: 802, type: s16, unit: °C, scale: 0.1, writable: true, min: -20, max: 50, poll: slow}
  - {key: x.power_level_request, label: Heating discrete power level, table: holding, address: 803, type: u16, enum: power_level, writable: true, poll: slow}
  - {key: x.ambient_temperature_external, label: Ambient regulation temperature (from the master), table: holding, address: 804, type: s16, unit: °C, scale: 0.1, invalid: [32766, 32767], writable: true, note: 'Written by the master when the appliance has no ambient probe of its own. 0x7FFF = not available, 0x7FFE = probe fault.'}
  - {key: x.power_request, label: Heating power modulation request, table: holding, address: 805, type: u16, unit: '%', writable: true, min: 0, max: 100, note: Clipped to the modulation bounds set by parameters.}
  - {key: x.alarm_reset, label: Alarms reset request, table: holding, address: 806, type: u16, writable: true, write_only: true, poll: slow, note: 'Write 0x55AA to reset alarms (always available, also without P42), then read the acknowledgment at 0x0327.'}
  - {key: x.alarm_reset_ack, label: Alarms reset acknowledgment, table: holding, address: 807, type: u16, enum: reset_ack, poll: slow}
  - {key: x.destratification_request, label: Destratification request, table: holding, address: 808, type: u16, enum: off_on, writable: true, poll: slow}
  # Modbus controller data (0x03A0 ff.)
  - {key: x.clock, label: Unix real time clock, table: holding, address: 928, type: u32, epoch: {start: '1970-01-01', unit: s}, writable: true, poll: slow, note: Set by the master (the appliance has no RTC of its own); writing the low word commits the value.}
  - {key: x.rtc_updated, label: RTC updated since power on, table: holding, address: 930, type: u16, enum: false_true, poll: slow}
  - {key: x.rtc_ever_written, label: RTC written since commissioning, table: holding, address: 931, type: u16, enum: false_true, poll: slow}
  # Currently active leading event (0x03E8 ff.)
  - {key: x.leading_event, label: Leading event string code, table: holding, address: 1000, type: u16, enum: event, note: 0 = no event.}
  - {key: error_code, label: Leading event code, table: holding, address: 1001, type: u16, note: The 3-digit code the appliance shows on its display; 0 = no event.}
  - {key: x.leading_event_category, label: Leading event category, table: holding, address: 1002, type: u16, enum: event_category}
  # Currently active events (0x03F2 ff.): up to five
  - {key: x.active_events, label: General status (active events), table: holding, address: 1010, type: u16, enum: false_true, note: 0 = no active event; the slots need not be read.}
  - {key: x.event1, label: Event slot 1 string code, table: holding, address: 1011, type: u16, enum: event}
  - {key: x.event1_code, label: Event slot 1 event code, table: holding, address: 1012, type: u16, bits: [6, 15]}
  - {key: x.event1_category, label: Event slot 1 category, table: holding, address: 1012, type: u16, bits: [2, 3], enum: event_category}
  - {key: x.event2, label: Event slot 2 string code, table: holding, address: 1013, type: u16, enum: event}
  - {key: x.event2_code, label: Event slot 2 event code, table: holding, address: 1014, type: u16, bits: [6, 15]}
  - {key: x.event2_category, label: Event slot 2 category, table: holding, address: 1014, type: u16, bits: [2, 3], enum: event_category}
  - {key: x.event3, label: Event slot 3 string code, table: holding, address: 1015, type: u16, enum: event}
  - {key: x.event3_code, label: Event slot 3 event code, table: holding, address: 1016, type: u16, bits: [6, 15]}
  - {key: x.event3_category, label: Event slot 3 category, table: holding, address: 1016, type: u16, bits: [2, 3], enum: event_category}
  - {key: x.event4, label: Event slot 4 string code, table: holding, address: 1017, type: u16, enum: event}
  - {key: x.event4_code, label: Event slot 4 event code, table: holding, address: 1018, type: u16, bits: [6, 15]}
  - {key: x.event4_category, label: Event slot 4 category, table: holding, address: 1018, type: u16, bits: [2, 3], enum: event_category}
  - {key: x.event5, label: Event slot 5 string code, table: holding, address: 1019, type: u16, enum: event}
  - {key: x.event5_code, label: Event slot 5 event code, table: holding, address: 1020, type: u16, bits: [6, 15]}
  - {key: x.event5_category, label: Event slot 5 category, table: holding, address: 1020, type: u16, bits: [2, 3], enum: event_category}
  # Appliance statistics (0x04B0 ff.)
  - {key: x.power_on_time, label: Total electrical power on time, table: holding, address: 1200, type: u32, unit: s, poll: slow}
  - {key: x.flame_on_time, label: Total flame on time, table: holding, address: 1202, type: u32, unit: s, poll: slow}
  - {key: x.ignitions, label: Total ignitions number, table: holding, address: 1204, type: u32, poll: slow}
  - {key: x.missed_ignitions, label: Total missed ignitions number, table: holding, address: 1206, type: u16, poll: slow}

enums:
  platform_type: {'0': T10 DDC, '1': T10 CCI, '2': GHP10/11, '3': GEN10}
  oem_code: {'0': Robur}
  serial_check: {'0': OK, '1': Missing serial number, '2': Missing HW key, '3': Missing serial number and HW key}
  appliance_type: {'0': NEXT-G 20, '1': NEXT-G 30, '2': NEXT-G 35, '3': NEXT-G 45, '4': NEXT-G 60, '5': NEXT-G 75, '6': NEXT-G 90}
  fan_type: {'0': Axial fan multi speed, '1': Centrifugal/axial fan single speed, '2': Brushless fan}
  functional_status: {'0': 'Off', '1': Ventilation, '2': Heating}
  burner_status: {'0': Stand-by, '1': Pre-purge, '2': Ignition, '3': Flame stabilization, '4': Full operation, '5': Post-ventilation, '6': Post-ventilation, '7': Forced post-ventilation}
  fan_status: {'0': Standby, '1': Pre-ventilation wait, '2': Pre-ventilation, '3': Full operation, '4': Normal post-ventilation start, '5': Forced post-ventilation, '6': Summer ventilation, '7': Destratification}
  operation_request: {'0': 'Off', '1': Ventilation (summer), '2': Heating – discrete power levels, '3': Heating – modulating (setpoint), '4': Heating – modulating (power)}
  ventilation_speed: {'1': Speed 1, '2': Speed 2, '3': Speed 3, '4': Speed 4}
  power_level: {'1': Power level 1, '2': Power level 2, '3': Power level 3}
  reset_ack: {'0': Request accepted, '1': Request not supported, '2': Request refused (user interface not idle), '3': Function disabled (too many flame lockout resets; retry after 15 minutes)}
  off_on: {'0': 'Off', '1': 'On'}
  false_true: {'0': 'No', '1': 'Yes'}
  event_category: {'0': No event, '1': Information, '2': Warning, '3': Error}
  event: {'0': No event, '1': Appliance powered on, '2': New appliance configuration, '6': Limit thermostat trip, '7': Flue gas thermostat trip, '14': Flame controller lockout, '15': Flame controller communication error, '21': Flue gas temperature probe fault, '26': Blower fault, '30': Parasitic flame lockout, '31': Heat exchanger overtemperature, '32': Low flue temperature, '33': Ambient probe required, '34': Heat exchanger probe fault, '35': Ambient probe fault, '36': Modbus communication lost, '37': Invalid parameter set – corrupted memory, '38': Parameter memory fault, '41': Incomplete functional parameters, '42': Invalid configuration parameters, '46': Invalid module type configuration parameters, '53': Flame controller not compatible, '54': Flame controller parameters error, '55': Internal flame controller error, '56': Flame loss, '57': Flame controller communication error, '58': Destratification probe fault, '59': Missing board serial or HW key}

flags:
  operating_status: {'0': Appliance can operate, '1': Error condition active, '2': Warning condition active, '3': Flame on, '4': Post-ventilation fan on, '5': Thermostat fan on, '6': Chimney sweep function active}
  digital_inputs: {'0': Limit thermostat closed, '1': Flue thermostat closed (unused), '3': Heating request, '4': Ventilation request / heating power level select, '5': Alarms reset request}
  digital_outputs: {'0': Gas valve, '1': Combustion blower fan, '2': Ignition transformer, '3': Alarm relay, '4': Ventilation speed 1, '5': Ventilation speed 2, '6': Ventilation speed 3, '7': Ventilation speed 4}

problems:
  - {when: {key: x.leading_event_category, equals: 3}, kind: fault, text: Heater error (see the leading event code)}
  - {when: {key: x.leading_event_category, equals: 2}, kind: warning, text: Heater warning (see the leading event code)}
  - {when: {key: x.operating_status, bit: 1}, kind: fault, text: Error condition active (bit 1)}
  - {when: {key: x.operating_status, bit: 2}, kind: warning, text: Warning condition active (bit 2)}

notes:
- 'The GEN10 is the on-board controller of Robur Next-G gas-fired warm air heaters (models 20 … 90, see the appliance type).
  It is a Modbus RTU slave on an isolated RS-485 port (permanent) or an RS-232 service port; a master on RS-232 with DTR active
  takes over from RS-485. Settings per port by P82 / P83: 9600, 19200 (default) or 38400 baud, 8N1 (default), 8N2 or 8E1.
  Address by P40, default 1. Port 502 is for a gateway.'
- Addresses are the document's "real" hex addresses (0-based); its prefix notation (30001 / 40001) is the same minus 1 and
  the prefix.
- Reads of unmapped or write-only registers return undefined values; writes to read-only or unmapped registers are refused.
  Configuration parameters (P010, P030–P032) can only be written inside a configuration phase (0x00CB); never-written parameters
  read 0x7FFF.
- Control (0x0320 ff.) needs P42 = 1 (remote controller installed); without Modbus traffic for the P41 timeout (default 60
  s) the operation request falls back to Off.
- 'Event slot code registers: bits 15–6 event code, bits 3–2 category (0 none, 1 information, 2 warning, 3 error), bit 0 =
  masked (not meant for the end user). The string-code tables are written as two-digit text in the document; this file assumes
  the register holds the same number. Not stated in the document; assumed.'
- 'Left out: the indexed functional parameters (0x00CC ff.: write an index, then read range, type, string code and value)
  and analog data (0x01F4 ff.: heat exchanger, flue, ambient, destratification and outdoor temperatures, external voltage,
  power percentage, blower and ventilation speed, current setpoint, ionisation current), because their location is only known
  after writing an index; the configuration phase registers; and the permanent and temporary event loggers (0x044C ff.).'
