# Written from the Ouman MODBUS-200 and Modbus-200-DIN, EH-200 controllers' Modbus interface (2.18, 14.02.2014).

modbusspec: 0
id: ouman-eh200
manufacturer: Ouman
name: EH-200 heating controllers (MODBUS-200 interface)
kind: boiler

sources:
- title: MODBUS-200 and Modbus-200-DIN – EH-200 controllers' Modbus interface, installation and use
  version: 2.18 (2014-02-14)
  url: http://sp-armatura.ru/wp-content/uploads/2017/03/17MODBUS-200__manual__en.pdf
  sha256: 0e1b7e5bea3ee7d4e98fa0e49c10cc7b1f485e32d9ad3b625f0e90ca7786c378

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big


points:
  # Clock (holding 0 … 3)
  - {key: x.clock, label: Year / month / day / hour / minute / second, table: holding, address: 0, type: datetime, length: 4, datetime: {year: {register: 0}, month: {register: 1, bits: [8, 15]}, day: {register: 1, bits: [0, 7]}, hour: {register: 2, bits: [8, 15]}, minute: {register: 2, bits: [0, 7]}, second: {register: 3, bits: [8, 15]}}, poll: slow, writable: true}

  # Analog measurements
  - {key: x.outdoor_temperature, label: Outdoor temperature, table: holding, address: 231, type: s16, unit: °C, scale: 0.01, note: 'Range −50.00 … +50.00 °C; the scale (hundredths) is assumed from the two decimals, not stated.', verified: false}
  - {key: x.h1_supply_temperature, label: H1 supply water, table: holding, address: 232, type: s16, unit: °C, scale: 0.01, note: Scale assumed (see outdoor temperature)., verified: false}
  - {key: x.h1_room_temperature, label: H1 room temperature, table: holding, address: 233, type: s16, unit: °C, scale: 0.01, note: Scale assumed., verified: false}
  - {key: x.h1_return_temperature, label: H1 return, table: holding, address: 234, type: s16, unit: °C, scale: 0.01, note: Scale assumed., verified: false}
  - {key: x.dhw_temperature, label: Domestic hot water, table: holding, address: 235, type: s16, unit: °C, scale: 0.01, note: Scale assumed., verified: false}
  - {key: x.dhw_anticipate_temperature, label: Domestic hot water anticipate, table: holding, address: 236, type: s16, unit: °C, scale: 0.01, note: Scale assumed., verified: false}
  - {key: x.h2_supply_temperature, label: H2 supply water, table: holding, address: 237, type: s16, unit: °C, scale: 0.01, note: Scale assumed., verified: false}
  - {key: x.measurement_6, label: Measurement 6 (EH-203) / measurement 3 (EH-201L), table: holding, address: 238, type: s16, unit: °C, scale: 0.01, note: Free-text measurement; scale assumed., verified: false}
  - {key: x.measurement_9, label: Measurement 9, table: holding, address: 239, type: s16, unit: °C, scale: 0.01, note: Free-text measurement; scale assumed., verified: false}
  - {key: x.measurement_10, label: Measurement 10, table: holding, address: 240, type: s16, unit: °C, scale: 0.01, note: Free-text measurement; scale assumed., verified: false}
  - {key: x.measurement_11, label: Measurement 11, table: holding, address: 241, type: s16, unit: °C, scale: 0.01, note: Free-text measurement; scale assumed., verified: false}
  - {key: x.h1_valve_position, label: H1 valve position, table: holding, address: 242, type: u16, unit: '%', note: Range 0 … 100 %; scale 1 assumed., verified: false}
  - {key: x.h2_valve_position, label: H2 valve position, table: holding, address: 243, type: u16, unit: '%', note: Scale 1 assumed., verified: false}
  - {key: x.dhw_valve_position, label: HW valve position, table: holding, address: 244, type: u16, unit: '%', note: Scale 1 assumed., verified: false}
  - {key: x.h1_supply_target, label: H1 supply water setting, table: holding, address: 223, type: u16, bits: [0, 7], unit: °C, note: Low byte; whole degrees assumed., verified: false}
  - {key: x.h2_supply_target, label: H2 supply water setting, table: holding, address: 229, type: u16, bits: [0, 7], unit: °C, note: Low byte; whole degrees assumed. Not on the EH-201L., verified: false}

  # District heating (EH-203 2.0 and later)
  - {key: x.dh_supply_temperature, label: DH supply, table: holding, address: 290, type: s16, unit: °C, scale: 0.01, optional: true, note: 'EH-203 2.0 and later; range 0 … 130 °C, scale assumed as for the other temperatures.', verified: false}
  - {key: x.dh_return_temperature, label: DH return, table: holding, address: 291, type: s16, unit: °C, scale: 0.01, optional: true, note: EH-203 2.0 and later; scale assumed., verified: false}
  - {key: x.network_pressure, label: Network pressure measurement, table: holding, address: 292, type: u16, unit: bar, scale: 0.01, optional: true, note: 'EH-203 2.0 and later; range 0 … 16 bar, scale assumed.', verified: false}
  - {key: x.dh_meter_energy, label: DH energy from the energy meter, table: holding, address: 308, type: u32, unit: kWh, poll: slow, optional: true, note: EH-203 2.0 and later; range 0 … 999999 kWh. Word order not stated (high word first assumed)., verified: false}
  - {key: x.dh_meter_water, label: DH water from the energy meter, table: holding, address: 310, type: u32, unit: m³, scale: 0.01, poll: slow, optional: true, note: 'EH-203 2.0 and later; range 0 … 999999.99 m³, scale and word order assumed.', verified: false}

  # Counters
  - {key: x.dh_energy, label: DH energy measurement, table: holding, address: 247, type: u32, unit: MWh, scale: 0.1, poll: slow, note: Range 0 … 99999.9 MWh; scale and word order (high first) assumed., verified: false}
  - {key: x.dh_water, label: DH water measurement, table: holding, address: 249, type: u32, unit: m³, scale: 0.1, poll: slow, note: Range 0 … 9999999.9 m³; scale and word order assumed., verified: false}
  - {key: x.facility_water, label: Facility water measurement, table: holding, address: 251, type: u32, unit: m³, scale: 0.1, poll: slow, note: Range 0 … 99999.9 m³; scale and word order assumed., verified: false}

  # States and alarms
  - {key: x.digital_states, label: Digital states, table: holding, address: 253, type: u16, flags: digital_states}
  - {key: x.alarms_1, label: Alarms (register 254), table: holding, address: 254, type: u16, flags: alarms_1}
  - {key: x.alarms_2, label: Alarms (register 255), table: holding, address: 255, type: u16, flags: alarms_2}
  - {key: x.general_alarm, label: General alarm, table: holding, address: 272, type: u16, flags: general_alarm}
  - {key: x.update_busy, label: 'Settings update in progress (0x00FF = busy, 0 = ready)', table: holding, address: 400, type: u16, poll: slow}

  # Operating modes and settings
  - {key: x.h1_mode, label: H1 circuit operation mode, table: holding, address: 340, type: u16, enum: circuit_mode, writable: true, poll: slow, note: MODBUS-200 2.12 and later.}
  - {key: x.h2_mode, label: H2 circuit operation mode, table: holding, address: 341, type: u16, enum: circuit_mode, writable: true, poll: slow, note: MODBUS-200 2.12 and later.}
  - {key: x.dhw_mode, label: HW circuit operation mode, table: holding, address: 342, type: u16, enum: circuit_mode, writable: true, poll: slow, note: '0, 4 or 5 only. MODBUS-200 2.12 and later.'}
  - {key: x.h1_room_setpoint, label: H1 room temperature setting, table: holding, address: 143, type: u16, unit: °C, scale: 0.1, writable: true, min: 5, max: 45, poll: slow, note: Scale assumed from the decimal., verified: false}
  - {key: x.h2_room_setpoint, label: H2 room temperature setting, table: holding, address: 148, type: u16, unit: °C, scale: 0.1, writable: true, poll: slow, note: Not on the EH-201L; scale assumed., verified: false}
  - {key: x.dhw_setpoint, label: HW temperature setting, table: holding, address: 172, type: u16, unit: °C, scale: 0.1, writable: true, min: 5, max: 95, poll: slow, note: Not on the EH-201L; scale assumed., verified: false}
  - {key: x.h1_supply_max, label: H1 supply water maximum, table: holding, address: 130, type: u16, bits: [0, 7], unit: °C, writable: true, min: 5, max: 125, poll: slow, note: Low byte.}
  - {key: x.h1_supply_min, label: H1 supply water minimum, table: holding, address: 129, type: u16, bits: [8, 15], unit: °C, writable: true, min: 5, max: 95, poll: slow, note: High byte.}
  - {key: x.relay_1_control, label: Relay 1 time control mode, table: holding, address: 214, type: u16, bits: [12, 15], enum: relay_control, writable: true, poll: slow, note: EH-203 1.30 / EH-201L 1.30 and later; bits 0 … 11 hold the timer in minutes.}
  - {key: x.relay_2_control, label: Relay 2 time control mode, table: holding, address: 215, type: u16, bits: [12, 15], enum: relay_control, writable: true, poll: slow, note: As relay 1.}

enums:
  circuit_mode: {'0': Automatic, '1': Continuous day, '2': Continuous night, '3': Stand-by, '4': 'Manual control, mechanical', '5': 'Manual control, electric'}
  relay_control: {'0': Time control, '1': Continuous on, '2': Continuous off, '3': Timer on, '4': Timer off}

flags:
  digital_states: {'0': Digital input 1, '1': Digital input 2, '2': Digital input 3, '3': Relay output 1 on, '4': Relay output 2 on, '5': H1 output inhibited, '9': Category poll request N1, '10': Category poll request N2, '11': Category poll request N3, '12': Category poll request N4, '13': Category poll request N5, '14': Category poll request N6, '15': Category poll request N7}
  alarms_1: {'0': Sensor fault channel 1 (A), '1': Sensor fault channel 2 (A), '2': Sensor fault channel 3 (B), '3': Sensor fault channel 4 (B), '4': Sensor fault channel 5 (A), '5': Sensor fault channel 6 (B), '6': Sensor fault channel 7 (B), '7': Sensor fault channel 8 (B), '8': Sensor fault channel 9 (B), '9': Sensor fault channel 10 (B), '10': Sensor fault channel 11 (B), '11': Freeze protect alarm H1 (A), '12': Freeze protect alarm H2 (A), '13': Domestic hot water overheat (B), '14': Pump stopped / pump 1 alarm (A), '15': 'External alarm, digital input 1 (A)'}
  alarms_2: {'0': 'External alarm, digital input 2 (A)', '1': 'External alarm, digital input 3 (A)', '2': Freeze protect alarm H1 return water (A), '3': Fault in LON sensor (B), '4': H1 supply water alarm (B), '5': H2 supply water alarm (B), '6': HW supply water alarm (B), '7': Measurement 11 difference alarm (B), '8': Exhaust temperature maximum limit alarm (B), '9': Exhaust temperature minimum limit alarm (B), '10': Ground liquid temperature minimum limit alarm (B), '11': Pressure upper limit alarm (B), '12': Pressure fill alarm (A), '13': Pressure lower limit alarm (A), '14': Water consumption alarm (B), '15': Pump 2 alarm (A)}
  general_alarm: {'0': A general alarm, '1': B general alarm}

problems:
  - {when: {key: x.alarms_1, bit: 0}, kind: warning, text: Sensor fault channel 1 (A alarm)}
  - {when: {key: x.alarms_1, bit: 1}, kind: warning, text: Sensor fault channel 2 (A alarm)}
  - {when: {key: x.alarms_1, bit: 2}, kind: warning, text: Sensor fault channel 3 (B alarm)}
  - {when: {key: x.alarms_1, bit: 3}, kind: warning, text: Sensor fault channel 4 (B alarm)}
  - {when: {key: x.alarms_1, bit: 4}, kind: warning, text: Sensor fault channel 5 (A alarm)}
  - {when: {key: x.alarms_1, bit: 5}, kind: warning, text: Sensor fault channel 6 (B alarm)}
  - {when: {key: x.alarms_1, bit: 6}, kind: warning, text: Sensor fault channel 7 (B alarm)}
  - {when: {key: x.alarms_1, bit: 7}, kind: warning, text: Sensor fault channel 8 (B alarm)}
  - {when: {key: x.alarms_1, bit: 8}, kind: warning, text: Sensor fault channel 9 (B alarm)}
  - {when: {key: x.alarms_1, bit: 9}, kind: warning, text: Sensor fault channel 10 (B alarm)}
  - {when: {key: x.alarms_1, bit: 10}, kind: warning, text: Sensor fault channel 11 (B alarm)}
  - {when: {key: x.alarms_1, bit: 11}, kind: fault, text: Freeze protection alarm H1}
  - {when: {key: x.alarms_1, bit: 12}, kind: fault, text: Freeze protection alarm H2}
  - {when: {key: x.alarms_1, bit: 13}, kind: warning, text: Domestic hot water overheat}
  - {when: {key: x.alarms_1, bit: 14}, kind: fault, text: Pump stopped / pump 1 alarm}
  - {when: {key: x.alarms_1, bit: 15}, kind: warning, text: 'External alarm, digital input 1'}
  - {when: {key: x.alarms_2, bit: 0}, kind: warning, text: 'External alarm, digital input 2'}
  - {when: {key: x.alarms_2, bit: 1}, kind: warning, text: 'External alarm, digital input 3'}
  - {when: {key: x.alarms_2, bit: 2}, kind: fault, text: Freeze protection alarm H1 return water}
  - {when: {key: x.alarms_2, bit: 3}, kind: warning, text: LON sensor fault}
  - {when: {key: x.alarms_2, bit: 4}, kind: warning, text: H1 supply water alarm}
  - {when: {key: x.alarms_2, bit: 5}, kind: warning, text: H2 supply water alarm}
  - {when: {key: x.alarms_2, bit: 6}, kind: warning, text: HW supply water alarm}
  - {when: {key: x.alarms_2, bit: 7}, kind: warning, text: Measurement 11 difference alarm}
  - {when: {key: x.alarms_2, bit: 8}, kind: warning, text: Exhaust temperature above maximum}
  - {when: {key: x.alarms_2, bit: 9}, kind: warning, text: Exhaust temperature below minimum}
  - {when: {key: x.alarms_2, bit: 10}, kind: warning, text: Ground liquid temperature below minimum}
  - {when: {key: x.alarms_2, bit: 11}, kind: warning, text: Pressure above upper limit}
  - {when: {key: x.alarms_2, bit: 12}, kind: warning, text: Pressure fill alarm}
  - {when: {key: x.alarms_2, bit: 13}, kind: warning, text: Pressure below lower limit}
  - {when: {key: x.alarms_2, bit: 14}, kind: warning, text: Water consumption alarm}
  - {when: {key: x.alarms_2, bit: 15}, kind: fault, text: Pump 2 alarm}

notes:
- The MODBUS-200 card (plugged into the controller) and the MODBUS-200-DIN unit (wired to the controller's RS-232 port) give
  the EH-200 controllers (EH-203, EH-201L, EH-201V …) an RS-485 Modbus RTU interface. Which registers exist depends on the
  controller type and its version; the document marks the differences per register.
- 'Addresses are the document''s decimal register numbers, used as 0-based protocol addresses. Read with function 03 (measurements
  also with 04), write with 06 / 16. Many settings pack two values in one register (MSB / LSB): those here use bits. The document
  also offers mirror registers (2000 … 2271 MSB, 4000 … 4271 LSB, 6000 … 6543 both) to write single bytes, and a 16-register
  window at 500 … 516; neither is listed.'
- Unit id 1 … 247 (MODBUS-200, DIP 5 … 12) or 1 … 31 (DIN version, DIP 5 … 9); the default isn't stated (1 assumed). Baud
  rate 4800 / 9600 / 19200 / 38400 by DIP 3 … 4; the character format isn't stated (8N1 assumed). The card doesn't answer
  for about 13 s after power-up.
- 'Scales are not stated in the document; they are assumed from the decimals in its ranges (e.g. −50.00 … +50.00 °C → hundredths,
  5.0 … 45.0 °C → tenths, whole numbers → 1). Two-register counters: word order not stated.'
- 'Settings categories N1 … N7: bits 9 … 15 of register 253 show that settings were changed on the controller; write 0xFE
  to register 265 to clear them. While register 400 reads 0x00FF, the settings registers are being updated and shouldn''t
  be read.'
- The alarm classes A and B come from the document; which alarms stop the heating isn't stated, so the fault / warning split
  here is assumed. Alarm bits are acknowledged on the controller automatically when the card reads them.
- 'Left out: time programs (4 … 115), curve and control parameters (128 … 211, 320 … 329), measurement configuration (186
  … 197), supply water calculation details (216 … 230), network measurement inputs (256 … 264), text transfer (265 … 271)
  and the broadcast outdoor temperature at 450. Device type and program version are only available with function 43 (object
  ids 0 … 2: ''OUMAN'', type, version), hence no identify.'
