  # Statistics
  - {key: x.r1_switch_cycles, label: Switch cycles output R1, table: holding, address: 922, type: u32, poll: slow}
  - {key: x.r2_switch_cycles, label: Switch cycles output R2, table: holding, address: 924, type: u32, poll: slow}
  - {key: x.r3_switch_cycles, label: Switch cycles output R3, table: holding, address: 926, type: u32, poll: slow}
