  - {key: x.firmware_minor, label: FW Version - Minor release, table: holding, address: 4, type: u16, poll: slow}
  - {key: x.firmware_patch, label: FW Version - patch level, table: holding, address: 5, type: u16, poll: slow}
  - {key: x.firmware_build, label: FW Build number, table: holding, address: 6, type: u16, poll: slow}
  - {key: x.pcb_version, label: PCB Version, table: holding, address: 7, type: u16, poll: slow}
  - {key: x.clock, label: Date and time, table: holding, address: 90, type: datetime, length: 6, datetime: {day: {register: 0}, month: {register: 1}, year: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, poll: slow, writable: true}
