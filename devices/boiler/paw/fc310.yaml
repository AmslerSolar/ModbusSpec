  - {key: x.s3, label: S3, table: holding, address: 502, type: s16, unit: °C, scale: 0.1, invalid: [9999, -9999]}
  - {key: x.s4, label: S4, table: holding, address: 503, type: s16, unit: °C, scale: 0.1, invalid: [9999, -9999]}
  - {key: x.vfs1_temperature, label: VFS/US 1 T, table: holding, address: 504, type: s16, unit: °C, scale: 0.1, invalid: [9999, -9999], optional: true}
  - {key: x.vfs1_flow, label: VFS/US 1 V, table: holding, address: 505, type: s16, unit: l/min, scale: 0.1, invalid: [9999, -9999], optional: true}
