modbusspec: 0
id: paw-fc310
manufacturer: PAW
name: FC3.10 fresh water station controller
kind: boiler

sources:
- title: Modbus Register FC3.10
  version: '2022-07-18'
  url: https://nau-gmbh.ch/wp-content/uploads/2025/09/FC3.10_Modbus_Register_de-komprimiert.pdf
  sha256: 96f936064026f42b7afbaa831c394f9703c1f106b083b1ce29e4e77fc959f75e
  archive_url: https://web.archive.org/web/20260513085934/https://nau-gmbh.ch/wp-content/uploads/2025/09/FC3.10_Modbus_Register_de-komprimiert.pdf

connection:
  default_port: 502
  default_unit: 64
  transports:
  - rtu
  serial:
    baud: 38400
    format: 8O1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

