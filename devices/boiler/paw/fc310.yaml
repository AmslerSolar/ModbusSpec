notes:
- 'Modbus RTU. The controller''s defaults: unit id 64, 38400 baud, odd parity, 8 data bits, 1 stop bit (settable: 1200–57600
  baud, none / even / odd, 8 or 9 data bits, 1 or 2 stop bits). Function codes 03, 06 and 16 only, so everything is a holding
  register; up to 125 registers per request. Register numbers in the document are used as addresses unchanged (the document''s
  own examples read and write them so).'
- 'With the MB3.10 gateway module (registers 5000–5005 hold its BMS-side settings: default 38400 baud, no parity, 2 stop bits,
  unit 64, 1800 s timeout) the building management system talks to the gateway; port 502 is only for a Modbus TCP gateway,
  which the document doesn''t name.'
- Temperatures are tenths of a degree, flows tenths of a litre per minute; 9999 means an open sensor, −9999 a short circuit.
  Sensor registers 500–507 can be overwritten in manual mode (whole degrees), for testing.
- Whether an optional sensor that isn't fitted (stratification, circulation, flow sensor 2) also sets its error bit isn't
  stated, so those are warnings here; the problem kinds are assumed.
- Many registers are stored in EEPROM (the document marks them); write them no more often than every 12 minutes.
- 'Writing parameters with installer rights needs a login: write the installer code to 1901, change the parameter, then write
  0 to 1901 to return to the customer level.'
- 'Cascade: up to three controllers; the registers of server 1, 2 and 3 are mirrored at +6000, +7000 and +8000 (e.g. Tkw of
  server 1 at 6516).'
- 'Left out: the control parameters 100–499 (circulation, comfort, disinfection, stratification timers and limits), the parameter
  range values 1000–1099, the daily / weekly / monthly statistics (939–952, coded like the totals), the min / max statistics
  900–921, the disinfection log 1100–1120, the parameter change history 4000–4799, the system parameters 1900–1942 and the
  Modbus communication counters 580–595.'
- There is no model or serial number register, so the file has no identify.
