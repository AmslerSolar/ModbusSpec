notes:
- 'The document lists 1-based register numbers per table (input registers, holding registers, discrete inputs, coils): its
  reading example enters ''point address 54'' in a Modbus tool that counts from 1. Every address here is the listed number
  minus 1. The document doesn''t say so outright, so every point is unverified; if all values look shifted by one register,
  use the listed numbers unchanged.'
- 'Scaling: real (R) signals are sent ×10 (scale 0.1), time settings ×100 and air flows ×1; integer, index and logic signals
  unscaled. Signed 16-bit assumed for real values (outdoor temperatures go below zero).'
- 'RS485 Modbus RTU, default address 1, 9600 baud 8N1. The same port also speaks EXOline: after an EXOline request it stays
  in EXOline mode until 10 s without traffic. Up to 47 registers per read. The controller answers only 10 requests quickly
  per 30 s, later ones after about 1 s; leave 3.5 characters between messages (14 characters when switching to another controller
  on the bus).'
- Alarm points (input registers 88-250 in the document) each give the alarm state 0-7; a problem is reported only for 7 (alarm
  active). Acknowledged alarms (3) that are still active are not reported. 'Manual', 'blocked for priority', deviation and
  limit alarms are classed as warnings, malfunctions, sensor and communication errors as faults (own classification).
- 'Several values have no unit in the document: average power (assumed kW like the instant power), humidity (assumed %), boiler
  run time (assumed hours).'
- 'Left out: heating curve and controller parameters, time-channel settings, manual/auto switches and manual output values,
  the I/O configuration (connected signal per input/output), raw analogue/digital I/O and expansion-unit values, the boiler
  run mode codes (sent as real values ×10 with the codes 0 off, 1 on, 2 high effect, so the scaling of the code is unclear)
  and the day-before-yesterday and lowest-usage counters.'
- The 2.1 document (revision 7) has the same addresses for the registers checked (outdoor and supply temperatures, energy,
  alarms); the 3.2 document is used. The boiler temperature (input 18) and the two boiler start signals exist only up to software
  3.1.
- No register identifies the controller or its software version, so there is no identify.
