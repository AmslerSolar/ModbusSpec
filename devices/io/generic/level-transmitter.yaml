# Written from the unbranded MODBUS Level transmitter communication protocol (RS485 modbus for pressure level sensor, no version).

modbusspec: 0
id: generic-level-transmitter
manufacturer: Generic
name: Pressure / liquid level transmitter, RS485
kind: io

sources:
- title: MODBUS Level transmitter communication protocol (RS485 modbus for pressure level sensor)
  version: no version
  url: https://dl.artronshop.co.th/RS485%20Sensor/RS485%20modbus%20for%20pressure%20level%20sensor.pdf
  sha256: ceeb191145f64bb77616cbc9f7385f0c7692e8850153794e918f34cd9ad25014

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

points:
  - {key: x.level, label: Measure the output value, table: holding, address: 4, type: s16, scale_exponent_from: {table: holding, address: 3, type: u16, negate: true}, note: 'Measured value in the unit given by register 2, divided by 10 to the power of register 3 (e.g. 2500 with one decimal = 250.0 cm).'}
  - {key: x.unit, label: pressure unit, table: holding, address: 2, type: u16, enum: unit, poll: slow}
  - {key: x.decimals, label: decimal point, table: holding, address: 3, type: u16, poll: slow, note: 0–3 decimals.}
  - {key: x.range_zero, label: Transmitter range zero, table: holding, address: 5, type: s16, scale_exponent_from: {table: holding, address: 3, type: u16, negate: true}, poll: slow, verified: false, note: That the range limits use the same decimals as the measured value is assumed.}
  - {key: x.range_full, label: Transmitter range full point, table: holding, address: 6, type: s16, scale_exponent_from: {table: holding, address: 3, type: u16, negate: true}, poll: slow, verified: false, note: That the range limits use the same decimals as the measured value is assumed.}
  # Settings
  - {key: x.modbus_address, label: Slave address, table: holding, address: 0, type: u16, writable: true, poll: slow, min: 1, max: 255}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 1, type: u16, enum: baud_rate, writable: true, poll: slow}

enums:
  unit: {'0': none, '1': cm, '2': mm, '3': MPa, '4': Pa, '5': kPa, '6': mA}
  baud_rate: {'0': 1200 bps, '1': 2400 bps, '2': 4800 bps, '3': 9600 bps, '4': 19200 bps, '5': 38400 bps, '6': 57600 bps, '7': 115200 bps}

notes:
- Unbranded document (hosted by a Thai reseller); the maker is not stated.
- Addresses are the start addresses of the document's request frames (0-based protocol addresses). Function 03 to read, 06
  to write.
- The unit of the measured value is set by the unit register (cm, mm, MPa, Pa, kPa or mA) and can't be expressed here; read
  register 2 to know it.
- 'Not stated in the document: the default baud rate; 9600 (the document''s example setting) is assumed. 8 data bits, no parity,
  1 stop bit.'
