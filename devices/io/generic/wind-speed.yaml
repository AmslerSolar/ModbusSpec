# Written from the unbranded Polycarbon wind speed transmitter (Model 485) manual (Wind-Speed-RS485_EN, no version).

modbusspec: 0
id: generic-wind-speed
manufacturer: Generic
name: Wind speed transmitter (cup anemometer), RS485
kind: io

sources:
- title: Polycarbon wind speed transmitter (Model 485) (Wind-Speed-RS485_EN)
  version: no version
  url: https://dl.artronshop.co.th/RS485%20Sensor/Wind-Speed-RS485_EN.docx.pdf
  sha256: c08600abd0f99e79b8e5d44384919616f700a99fe016efc0d2b6fd492cd8200e

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 4800
    format: 8N1
  input_equals_holding: true

points:
  - {key: x.wind_speed, label: Instantaneous wind speed, table: holding, address: 0, type: u16, unit: m/s, scale: 0.1}
  # Settings
  - {key: x.modbus_address, label: Device Address, table: holding, address: 2000, type: u16, writable: true, min: 1, max: 254, poll: slow, note: Default 1.}
  - {key: x.baud_rate, label: Device Baud rate, table: holding, address: 2001, type: u16, enum: baud_rate, writable: true, poll: slow}

enums:
  baud_rate: {'0': 2400 bps, '1': 4800 bps, '2': 9600 bps, '3': 19200 bps, '4': 38400 bps, '5': 57600 bps, '6': 115200 bps, '7': 1200 bps}

notes:
- Unbranded document (hosted by a Thai reseller); the maker is not stated.
- Addresses are the document's register addresses (0-based; PLC 40001-based). Registers are read with 03 or 04; settings written
  with 06 or 10.
- The document's parameter table says 2400, 4800 (default) or 9600 baud, while the register table lists codes up to 115200.
