# Written from the AVC-010 Oxygen Transmitter Instruction Manual (3WIA-0B2680-00AR).

modbusspec: 0
id: generic-avc-010
manufacturer: Generic
name: AVC-010 oxygen transmitter, RS485
kind: io

sources:
- title: AVC-010 Oxygen Transmitter Instruction Manual (AVC-010-O2 4-20mA / 2-10V / RS485 / LoRa)
  version: 3WIA-0B2680-00AR (copy from the Vietnamese distributor, 2024)
  url: https://bkic.vn/wp-content/uploads/2024/10/AVC-010-O2-4-20mA-2-10V-RS485-LoRa_Manual-1.pdf
  sha256: 1b922b4fcfc179ff9bccf580451a016313625dcdf1c92411022e1e7c29fbdfae

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.oxygen, label: Oxygen, table: holding, address: 0, type: u16, unit: '%', scale: 0.01, note: e.g. 2095 = 20.95 %.}
  # Settings
  - {key: x.o2_calibration, label: O2 manual calibration, table: holding, address: 1, type: s16, unit: '%', scale: 0.01, writable: true, min: -15, max: 15, poll: slow, note: Offset added to the reading.}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 2, type: u16, enum: baud_rate, writable: true, poll: slow, note: Keep 9600 when the transmitter is set to wireless mode.}

enums:
  baud_rate: {'0': 9600 bps, '16': 19200 bps, '32': 38400 bps, '48': 57600 bps, '64': 115200 bps}

notes:
- The manual names no maker; the copy read is the Vietnamese distributor's (Bach Khoa Equipment International).
- Addresses are protocol addresses as in the manual's frames (0x0000 …). The oxygen value is read with function 03; settings
  are written with 06.
- The unit id is set with DIP switches (1–247), not over Modbus; 1 is only an example default. RS485 needs jumper J3 set to
  RS485 (the other setting is the LoRa wireless module).
