# Written from the unbranded Polycarbon wind direction transmitter (Model 485) manual (Wind-Direction-RS485_EN, no version).

modbusspec: 0
id: generic-wind-direction
manufacturer: Generic
name: Wind direction transmitter, 8 directions, RS485
kind: io

sources:
- title: Polycarbon wind direction transmitter (Model 485) (Wind-Direction-RS485_EN)
  version: no version
  url: https://dl.artronshop.co.th/RS485%20Sensor/Wind-Direction-RS485_EN.docx.pdf
  sha256: b57290333592b002eab1bfd319cd9060e5f4926e429de991bb7460e19c11364a

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 4800
    format: 8N1

points:
  - {key: x.wind_direction_sector, label: Wind direction (0-7 gear), table: holding, address: 0, type: u16, enum: direction}
  - {key: x.wind_direction, label: Wind direction (0-360°), table: holding, address: 1, type: u16, unit: °, note: 'Multiples of 45° (0 = north, 90 = east).'}

enums:
  direction: {'0': North, '1': Northeast, '2': East, '3': Southeast, '4': South, '5': Southwest, '6': West, '7': Northwest}

notes:
- Unbranded document (hosted by a Thai reseller); the maker is not stated.
- Addresses are the document's register addresses (0-based; PLC 40001-based). Only function 03 is supported.
- Baud rate 2400, 4800 (default) or 9600, set with the maker's configuration software; the document gives no setting registers.
