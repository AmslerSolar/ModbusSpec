# From Creasol's DomBus31 product page (sections "DomBus31 Modbus RTU capabilities" and "Ports parameters").

modbusspec: 0
id: creasol-dombus31
manufacturer: Creasol
name: DomBus31 module (8 relays), Modbus firmware
kind: io

sources:
- title: 'Creasol DomBus31 (product page: Modbus RTU capabilities, ports parameters)'
  version: web page, retrieved 2026-10-24
  url: https://www.creasol.it/en/domotics/creasol-dombus31-8-relays-module-for-home-automation-system-with-very-low-power-consumption
  sha256: 39f2ddbf121840dc8e718e4326592571d12e10f5ed7298a4ff9f52054845207d

connection:
  default_port: 502
  default_unit: 49
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 10

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 8193
    type: u16
    range:
    - 0
    - 7
  - table: holding
    address: 8194
    type: u16
    range:
    - 0
    - 2
  # revision text; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 8198
    type: str
    length: 2
    printable: true

points:
  # Ports (holding register = port number − 1)
  - {key: x.rl1, label: RL1, table: holding, address: 0, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl2, label: RL2, table: holding, address: 1, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl3, label: RL3, table: holding, address: 2, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl4, label: RL4, table: holding, address: 3, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl5, label: RL5, table: holding, address: 4, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl6, label: RL6, table: holding, address: 5, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl7, label: RL7, table: holding, address: 6, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.rl8, label: RL8, table: holding, address: 7, type: u16, writable: true, note: '0 off, 65280 on, 1–65279 on for a time (see notes).'}
  - {key: x.all_ports, label: All relays, table: holding, address: 255, type: u16, flags: port_bits, writable: true, note: Bit n = port at address n; writing sets all outputs at once (no timer).}
  # Port configuration
  - {key: x.rl1_config, label: Port config RL1, table: holding, address: 256, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl2_config, label: Port config RL2, table: holding, address: 257, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl3_config, label: Port config RL3, table: holding, address: 258, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl4_config, label: Port config RL4, table: holding, address: 259, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl5_config, label: Port config RL5, table: holding, address: 260, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl6_config, label: Port config RL6, table: holding, address: 261, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl7_config, label: Port config RL7, table: holding, address: 262, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl8_config, label: Port config RL8, table: holding, address: 263, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl1_option, label: Port option RL1, table: holding, address: 512, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl2_option, label: Port option RL2, table: holding, address: 513, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl3_option, label: Port option RL3, table: holding, address: 514, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl4_option, label: Port option RL4, table: holding, address: 515, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl5_option, label: Port option RL5, table: holding, address: 516, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl6_option, label: Port option RL6, table: holding, address: 517, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl7_option, label: Port option RL7, table: holding, address: 518, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl8_option, label: Port option RL8, table: holding, address: 519, type: u16, enum: port_option, writable: true, poll: slow}
  # Module settings
  - {key: x.slave_address, label: Slave Address, table: holding, address: 8192, type: u16, writable: true, poll: slow, min: 1, max: 247}
  - {key: x.bitrate, label: Serial bitrate, table: holding, address: 8193, type: u16, enum: bitrate, writable: true, poll: slow}
  - {key: x.parity, label: Serial parity, table: holding, address: 8194, type: u16, enum: parity, writable: true, poll: slow}
  - {key: firmware, label: Revision, table: holding, address: 8198, type: str, length: 2, poll: slow, note: 'ASCII, e.g. "02h1" (8198 major, 8199 minor).'}

enums:
  port_type: {'1': OUT_DIGITAL, '2': OUT_RELAY_LP, '3': OUT_LEDSTATUS, '4': OUT_DIMMER, '5': OUT_BUZZER / OUT_FLASH, '6': IN_AC, '7': IN_DIGITAL, '8': IN_ANALOG, '9': IN_TWINBUTTON, '10': IN_COUNTER, '11': IN_DIGITAL_PULLDOWN, '13': DISTANCE, '17': SENSOR_ALARM, '24': OUT_BLIND, '25': OUT_ANALOG}
  port_option: {'0': NORMAL, '1': INVERTED, '2': PULLUP, '4': PULLDOWN}
  bitrate: {'0': 115200 bps, '1': 57600 bps, '2': 38400 bps, '3': 19200 bps, '4': 9600 bps, '5': 4800 bps, '6': 2400 bps, '7': 1200 bps}
  parity: {'0': None, '1': Even, '2': Odd}

flags:
  port_bits: {'0': RL1, '1': RL2, '2': RL3, '3': RL4, '4': RL5, '5': RL6, '6': RL7, '7': RL8}

notes:
- Creasol sells each DomBus module with either the proprietary DomBus protocol or Modbus RTU firmware, chosen at purchase;
  this file is for the Modbus firmware only.
- RS485 Modbus RTU, default 115200 baud 8N1; address, speed and parity are set by writing 8192–8194 and are flashed on the
  LEDs at power-on. The module only answers after that LED sequence.
- The page's addresses are 0-based protocol addresses (its mbpoll examples use -0); all values are holding registers (functions
  03, 06, 16). Outputs can also be read and set as coils (functions 01, 15), coil n = port at address n.
- The page shows at most 10 registers written in one command; it gives no read limit.
- 'Timed outputs: 2–1920 = value × 31.25 ms (up to 60 s); 1921–5460 = 61 s…1 h in seconds; 5461–6840 = up to 24 h in minutes;
  above 6840 = hours (up to 1500 days); 65280 (0xFF00) = on forever.'
- Inputs configured as SENSOR_ALARM read 0 closed, 1 open, 2 masked zone, 3 tamper, 4 short circuit; as IN_TWINBUTTON 0 none,
  10 down, 20 up.
- Writing 32901 to register 10000 resets to factory settings keeping the address; 32907 also resets the address.
- Only the port types the page lists are in port_type; which types a port supports depends on the port (see the page's port
  table).
- Port config (256…) takes only OUT_DIGITAL (1) or OUT_RELAY_LP (2); port option (512…) only NORMAL (0) or INVERTED (1).
