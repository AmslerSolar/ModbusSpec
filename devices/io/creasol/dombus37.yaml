# From Creasol's DomBus37 product page (sections "DomBus37 Modbus RTU capabilities" and "Ports parameters").

modbusspec: 0
id: creasol-dombus37
manufacturer: Creasol
name: DomBus37 DIN-rail module (3 relays, 12 inputs, 3 AC inputs), Modbus firmware
kind: io

sources:
- title: 'Creasol DomBus37 (product page: Modbus RTU capabilities, ports parameters)'
  version: web page, retrieved 2026-10-24
  url: https://www.creasol.it/en/domotics/creasol-dombus37-din-rail-module-with-3-relays-12-analog-digital-inputs-3-ac-inputs-for-home-automation-systems
  sha256: 0b7821b5738033104aab292bc58aef8770cc08a8254826655a2282e93382ee25

connection:
  default_port: 502
  default_unit: 55
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 10

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 8193
    type: u16
    range:
    - 0
    - 7
  - table: holding
    address: 8194
    type: u16
    range:
    - 0
    - 2
  # revision text; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 8198
    type: str
    length: 2
    printable: true

points:
  # Ports (holding register = port number − 1)
  - {key: x.in1, label: IN1, table: holding, address: 0, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in2, label: IN2, table: holding, address: 1, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in3, label: IN3, table: holding, address: 2, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in4, label: IN4, table: holding, address: 3, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in5, label: IN5, table: holding, address: 4, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in6, label: IN6, table: holding, address: 5, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in7, label: IN7, table: holding, address: 6, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in8, label: IN8, table: holding, address: 7, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in9, label: IN9, table: holding, address: 8, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in10, label: IN10, table: holding, address: 9, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in11, label: IN11, table: holding, address: 10, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.in12, label: IN12, table: holding, address: 11, type: u16, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.inac1, label: INAC1, table: holding, address: 12, type: u16, note: '0 no voltage, 1 100–250 V AC detected.'}
  - {key: x.inac2, label: INAC2, table: holding, address: 13, type: u16, note: '0 no voltage, 1 100–250 V AC detected.'}
  - {key: x.inac3, label: INAC3, table: holding, address: 14, type: u16, note: '0 no voltage, 1 100–250 V AC detected.'}
  - {key: x.rl1, label: RL1, table: holding, address: 15, type: u16, writable: true, note: '0 off, 1 or 65280 on, 2–65279 on for a time (see notes).'}
  - {key: x.rl2, label: RL2, table: holding, address: 16, type: u16, writable: true, note: '0 off, 1 or 65280 on, 2–65279 on for a time (see notes).'}
  - {key: x.rl3, label: RL3, table: holding, address: 17, type: u16, writable: true, note: '0 off, 1 or 65280 on, 2–65279 on for a time (see notes).'}
  - {key: x.bus_voltage, label: Bus voltage, table: holding, address: 18, type: u16, unit: V, scale: 0.001}
  - {key: x.siren_voltage, label: Siren voltage, table: holding, address: 19, type: u16, unit: V, scale: 0.001, note: Voltage on the siren port (IN12).}
  - {key: x.invert_all_inputs, label: Invert logic on all 12 inputs, table: holding, address: 9000, type: u16, writable: true, poll: slow, note: '1 sets, 0 clears the INVERTED option on IN1–IN12.'}
  - {key: x.all_ports, label: All input ports, table: holding, address: 255, type: u16, flags: port_bits, writable: true, note: Bit n = port at address n; writing sets all outputs at once (no timer).}
