# From Creasol's DomBus23 product page (sections "DomBus23 Modbus RTU capabilities" and "Ports parameters").

modbusspec: 0
id: creasol-dombus23
manufacturer: Creasol
name: DomBus23 module (2 relays, MOSFET dimmer, 2 analog outputs, 2 I/Os, 3 opto inputs), Modbus firmware
kind: io

sources:
- title: 'Creasol DomBus23 (product page: Modbus RTU capabilities, ports parameters)'
  version: web page, retrieved 2026-10-24
  url: https://www.creasol.it/en/domotics/creasol-dombus23-smart-home-rs485-module-with-2x-relays-1x-mosfet-with-dimming-function-2x-i-os-2x-0-10v-analog-outputs-that-can-be-configured-as-open-drain-outputs-2x-12-24v-opto-inputs-1x-230v-opto-input
  sha256: be1c5281162f518be730f1cd85b7019562e4bebea786a63cf874efed5de0df60

connection:
  default_port: 502
  default_unit: 35
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 10

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 8193
    type: u16
    range:
    - 0
    - 7
  - table: holding
    address: 8194
    type: u16
    range:
    - 0
    - 2
  # revision text; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 8198
    type: str
    length: 2
    printable: true

points:
  # Ports (holding register = port number − 1)
  - {key: x.rl1, label: RL1, table: holding, address: 0, type: u16, writable: true, note: '0 off, 1 or 65280 on, 2–65279 on for a time (see notes).'}
  - {key: x.rl2, label: RL2, table: holding, address: 1, type: u16, writable: true, note: '0 off, 1 or 65280 on, 2–65279 on for a time (see notes).'}
  - {key: x.mos, label: MOS, table: holding, address: 2, type: u16, writable: true, note: 'MOSFET output: 0 off, 100 on, 5–95 PWM duty in %.'}
  - {key: x.v1, label: V1/OD1, table: holding, address: 3, type: u16, writable: true, note: '0–10 V output: 0–100 = 0–10 V; as open-drain output (jumper od1) 0 off, 1 on, 2–65279 on for a time.'}
  - {key: x.v2, label: V2/OD2, table: holding, address: 4, type: u16, writable: true, note: '0–10 V output: 0–100 = 0–10 V; as open-drain output (jumper od2) 0 off, 1 on, 2–65279 on for a time.'}
  - {key: x.io1, label: IO1, table: holding, address: 5, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); as SENSOR_ALARM 0 closed, 1 open, 2 masked, 3 tamper, 4 short circuit.'}
  - {key: x.io2, label: IO2, table: holding, address: 6, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); as SENSOR_ALARM 0 closed, 1 open, 2 masked, 3 tamper, 4 short circuit.'}
  - {key: x.in1, label: IN1, table: holding, address: 7, type: u16, note: 'Opto input 9–40 V AC/DC: 0 no voltage, 1 voltage.'}
  - {key: x.in2, label: IN2, table: holding, address: 8, type: u16, note: 'Opto input 9–40 V AC/DC: 0 no voltage, 1 voltage.'}
  - {key: x.in3, label: IN3, table: holding, address: 9, type: u16, note: '230 V opto input: 0 no voltage, 1 100–250 V AC detected.'}
  # Port configuration
  - {key: x.rl1_config, label: Port config RL1, table: holding, address: 256, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl2_config, label: Port config RL2, table: holding, address: 257, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.mos_config, label: Port config MOS, table: holding, address: 258, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.v1_config, label: Port config V1/OD1, table: holding, address: 259, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.v2_config, label: Port config V2/OD2, table: holding, address: 260, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io1_config, label: Port config IO1, table: holding, address: 261, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io2_config, label: Port config IO2, table: holding, address: 262, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.in1_config, label: Port config IN1, table: holding, address: 263, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.in2_config, label: Port config IN2, table: holding, address: 264, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.in3_config, label: Port config IN3, table: holding, address: 265, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.rl1_option, label: Port option RL1, table: holding, address: 512, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.rl2_option, label: Port option RL2, table: holding, address: 513, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.mos_option, label: Port option MOS, table: holding, address: 514, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.v1_option, label: Port option V1/OD1, table: holding, address: 515, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.v2_option, label: Port option V2/OD2, table: holding, address: 516, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io1_option, label: Port option IO1, table: holding, address: 517, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io2_option, label: Port option IO2, table: holding, address: 518, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.in1_option, label: Port option IN1, table: holding, address: 519, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.in2_option, label: Port option IN2, table: holding, address: 520, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.in3_option, label: Port option IN3, table: holding, address: 521, type: u16, enum: port_option, writable: true, poll: slow}
  # Module settings
  - {key: x.slave_address, label: Slave Address, table: holding, address: 8192, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.bitrate, label: Serial bitrate, table: holding, address: 8193, type: u16, enum: bitrate, writable: true, poll: slow}
  - {key: x.parity, label: Serial parity, table: holding, address: 8194, type: u16, enum: parity, writable: true, poll: slow}
  - {key: firmware, label: Revision, table: holding, address: 8198, type: str, length: 2, poll: slow, note: 'ASCII, e.g. "02h1" (8198 major, 8199 minor).'}

enums:
  port_type: {'1': OUT_DIGITAL, '2': OUT_RELAY_LP, '3': OUT_LEDSTATUS, '4': OUT_DIMMER, '5': OUT_BUZZER / OUT_FLASH, '6': IN_AC, '7': IN_DIGITAL, '8': IN_ANALOG, '9': IN_TWINBUTTON, '10': IN_COUNTER, '11': IN_DIGITAL_PULLDOWN, '13': DISTANCE, '17': SENSOR_ALARM, '24': OUT_BLIND, '25': OUT_ANALOG}
  port_option: {'0': NORMAL, '1': INVERTED, '2': PULLUP, '4': PULLDOWN}
  bitrate: {'0': 115200 bps, '1': 57600 bps, '2': 38400 bps, '3': 19200 bps, '4': 9600 bps, '5': 4800 bps, '6': 2400 bps, '7': 1200 bps}
  parity: {'0': None, '1': Even, '2': Odd}

notes:
- Creasol sells each DomBus module with either the proprietary DomBus protocol or Modbus RTU firmware, chosen at purchase;
  this file is for the Modbus firmware only.
- RS485 Modbus RTU, default 115200 baud 8N1; address, speed and parity are set by writing 8192–8194 and are flashed on the
  LEDs at power-on. The module only answers after that LED sequence.
- The page's addresses are 0-based protocol addresses (its mbpoll examples use -0); all values are holding registers (functions
  03, 06, 16). Outputs can also be read and set as coils (functions 01, 15), coil n = port at address n.
- The page shows at most 10 registers written in one command; it gives no read limit.
- 'Timed outputs: 2–1920 = value × 31.25 ms (up to 60 s); 1921–5460 = 61 s…1 h in seconds; 5461–6840 = up to 24 h in minutes;
  above 6840 = hours (up to 1500 days); 65280 (0xFF00) = on forever.'
- Inputs configured as SENSOR_ALARM read 0 closed, 1 open, 2 masked zone, 3 tamper, 4 short circuit; as IN_TWINBUTTON 0 none,
  10 down, 20 up.
- Writing 32901 to register 10000 resets to factory settings keeping the address; 32907 also resets the address.
- Only the port types the page lists are in port_type; which types a port supports depends on the port (see the page's port
  table).
