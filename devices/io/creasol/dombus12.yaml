# From Creasol's DomBus12 product page (sections "DomBus12 Modbus RTU capabilities" and "Ports parameters").

modbusspec: 0
id: creasol-dombus12
manufacturer: Creasol
name: DomBus12 module (9 configurable I/Os), Modbus firmware
kind: io

sources:
- title: 'Creasol DomBus12 (product page: Modbus RTU capabilities, ports parameters)'
  version: web page, retrieved 2026-10-24
  url: https://www.creasol.it/en/domotics/creasol-dombus12-compact-module-for-home-automation-system-with-9-configurable-i-o
  sha256: 25dcde5033cce46b3af3f61587eb02e39af55fb9effc7fb03c0260b06d3a0cc4

connection:
  default_port: 502
  default_unit: 18
  transports:
  - rtu
  serial:
    baud: 115200
    format: 8N1
  limits:
    max_registers: 10

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 8193
    type: u16
    range:
    - 0
    - 7
  - table: holding
    address: 8194
    type: u16
    range:
    - 0
    - 2
  # revision text; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 8198
    type: str
    length: 2
    printable: true

points:
  # Ports (holding register = port number − 1)
  - {key: x.io1, label: IO1, table: holding, address: 0, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io2, label: IO2, table: holding, address: 1, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io3, label: IO3, table: holding, address: 2, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io4, label: IO4, table: holding, address: 3, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io5, label: IO5, table: holding, address: 4, type: u16, writable: true, note: 'Open-drain output: 0 off, 1 on, 2–65279 on for a time (see notes); 0–20 when configured as dimmer.'}
  - {key: x.io6, label: IO6, table: holding, address: 5, type: u16, writable: true, note: 'Open-drain output: 0 off, 1 on, 2–65279 on for a time (see notes); 0–20 when configured as dimmer.'}
  - {key: x.io7, label: IO7, table: holding, address: 6, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io8, label: IO8, table: holding, address: 7, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.io9, label: IO9, table: holding, address: 8, type: u16, writable: true, note: '0 off, 1 on (inverted with the INVERTED option); other values when configured as analog (0–65535) or alarm sensor (0–4).'}
  - {key: x.all_ports, label: All ports, table: holding, address: 255, type: u16, flags: port_bits, writable: true, note: Bit n = port at address n; writing sets all outputs at once (no timer).}
  # Port configuration
  - {key: x.io1_config, label: Port config IO1, table: holding, address: 256, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io2_config, label: Port config IO2, table: holding, address: 257, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io3_config, label: Port config IO3, table: holding, address: 258, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io4_config, label: Port config IO4, table: holding, address: 259, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io5_config, label: Port config IO5, table: holding, address: 260, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io6_config, label: Port config IO6, table: holding, address: 261, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io7_config, label: Port config IO7, table: holding, address: 262, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io8_config, label: Port config IO8, table: holding, address: 263, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io9_config, label: Port config IO9, table: holding, address: 264, type: u16, enum: port_type, writable: true, poll: slow}
  - {key: x.io1_option, label: Port option IO1, table: holding, address: 512, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io2_option, label: Port option IO2, table: holding, address: 513, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io3_option, label: Port option IO3, table: holding, address: 514, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io4_option, label: Port option IO4, table: holding, address: 515, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io5_option, label: Port option IO5, table: holding, address: 516, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io6_option, label: Port option IO6, table: holding, address: 517, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io7_option, label: Port option IO7, table: holding, address: 518, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io8_option, label: Port option IO8, table: holding, address: 519, type: u16, enum: port_option, writable: true, poll: slow}
  - {key: x.io9_option, label: Port option IO9, table: holding, address: 520, type: u16, enum: port_option, writable: true, poll: slow}
  # Module settings
  - {key: x.slave_address, label: Slave Address, table: holding, address: 8192, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.bitrate, label: Serial bitrate, table: holding, address: 8193, type: u16, enum: bitrate, writable: true, poll: slow}
  - {key: x.parity, label: Serial parity, table: holding, address: 8194, type: u16, enum: parity, writable: true, poll: slow}
  - {key: firmware, label: Revision, table: holding, address: 8198, type: str, length: 2, poll: slow, note: 'ASCII, e.g. "02h1" (8198 major, 8199 minor).'}

enums:
  port_type: {'1': OUT_DIGITAL, '2': OUT_RELAY_LP, '3': OUT_LEDSTATUS, '4': OUT_DIMMER, '5': OUT_BUZZER / OUT_FLASH, '6': IN_AC, '7': IN_DIGITAL, '8': IN_ANALOG, '9': IN_TWINBUTTON, '10': IN_COUNTER, '11': IN_DIGITAL_PULLDOWN, '13': DISTANCE, '17': SENSOR_ALARM, '24': OUT_BLIND, '25': OUT_ANALOG}
  port_option: {'0': NORMAL, '1': INVERTED, '2': PULLUP, '4': PULLDOWN}
  bitrate: {'0': 115200 bps, '1': 57600 bps, '2': 38400 bps, '3': 19200 bps, '4': 9600 bps, '5': 4800 bps, '6': 2400 bps, '7': 1200 bps}
  parity: {'0': None, '1': Even, '2': Odd}

flags:
  port_bits: {'0': IO1, '1': IO2, '2': IO3, '3': IO4, '4': IO5, '5': IO6, '6': IO7, '7': IO8, '8': IO9}

notes:
- Creasol sells each DomBus module with either the proprietary DomBus protocol or Modbus RTU firmware, chosen at purchase;
  this file is for the Modbus firmware only.
- RS485 Modbus RTU, default 115200 baud 8N1; address, speed and parity are set by writing 8192–8194 and are flashed on the
  LEDs at power-on. The module only answers after that LED sequence.
- The page's addresses are 0-based protocol addresses (its mbpoll examples use -0); all values are holding registers (functions
  03, 06, 16). Outputs can also be read and set as coils (functions 01, 15), coil n = port at address n.
- The page shows at most 10 registers written in one command; it gives no read limit.
- 'Timed outputs: 2–1920 = value × 31.25 ms (up to 60 s); 1921–5460 = 61 s…1 h in seconds; 5461–6840 = up to 24 h in minutes;
  above 6840 = hours (up to 1500 days); 65280 (0xFF00) = on forever.'
- Inputs configured as SENSOR_ALARM read 0 closed, 1 open, 2 masked zone, 3 tamper, 4 short circuit; as IN_TWINBUTTON 0 none,
  10 down, 20 up.
- Writing 32901 to register 10000 resets to factory settings keeping the address; 32907 also resets the address.
- Only the port types the page lists are in port_type; which types a port supports depends on the port (see the page's port
  table).
