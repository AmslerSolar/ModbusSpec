modbusspec: 0
id: fenecon-masterbox
manufacturer: FENECON
name: MasterBox 2.0
kind: io

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.system.fenecon/src/io/openems/edge/system/fenecon/masterbox2v0/MasterBox2v0Impl.java

connection:
  default_port: 502
  default_unit: 10

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.relay_1, label: Relay 1, table: holding, address: 1, type: u16, writable: true}
  - {key: x.relay_2, label: Relay 2, table: holding, address: 2, type: u16, writable: true}
  - {key: x.relay_3, label: Relay 3, table: holding, address: 3, type: u16, writable: true}
  - {key: x.relay_4, label: Relay 4, table: holding, address: 4, type: u16, writable: true}
  - {key: x.relay_5, label: Relay 5, table: holding, address: 5, type: u16, writable: true}
  - {key: x.relay_6, label: Relay 6, table: holding, address: 6, type: u16, writable: true}
  - {key: x.analog_out_voltage, label: Analog out voltage, table: holding, address: 8, type: u16, unit: V, scale: 0.1, writable: true}
  - {key: x.analog_out_control, label: Analog out control, table: holding, address: 9, type: u16, writable: true}
  - {key: x.hw_startup, label: Hw startup, table: holding, address: 101, type: u16, bits: [0, 0]}
  - {key: x.hw_temperature_sensor_type, label: Hw temperature sensor type, table: holding, address: 101, type: u16, bits: [1, 1]}
  - {key: x.hw_analog_out_mode, label: Hw analog out mode, table: holding, address: 101, type: u16, bits: [2, 2]}
  - {key: x.hw_spi_energy_enable, label: Hw spi energy enable, table: holding, address: 101, type: u16, bits: [3, 3]}
  - {key: x.hw_can_tower_enable, label: Hw can tower enable, table: holding, address: 101, type: u16, bits: [4, 4]}
  - {key: x.grid_state, label: Grid state, table: holding, address: 102, type: u16, enum: grid_state}
  - {key: x.temperature, label: Temperature, table: holding, address: 103, type: u16, unit: °C, scale: 0.1, offset: -40}
  - {key: x.humidity, label: Humidity, table: holding, address: 104, type: u16, unit: '%', scale: 0.1}
  - {key: x.relay_1_105, label: Relay 1, table: holding, address: 105, type: u16}
  - {key: x.relay_2_106, label: Relay 2, table: holding, address: 106, type: u16}
  - {key: x.relay_3_107, label: Relay 3, table: holding, address: 107, type: u16}
  - {key: x.relay_4_108, label: Relay 4, table: holding, address: 108, type: u16}
  - {key: x.relay_5_109, label: Relay 5, table: holding, address: 109, type: u16}
  - {key: x.relay_6_110, label: Relay 6, table: holding, address: 110, type: u16}
  - {key: x.voltage_l1_energymeter, label: Voltage L1 energymeter, table: holding, address: 301, type: u16, unit: V, scale: 0.01}
  - {key: x.voltage_l2_energymeter, label: Voltage L2 energymeter, table: holding, address: 302, type: u16, unit: V, scale: 0.01}
  - {key: x.voltage_l3_energymeter, label: Voltage L3 energymeter, table: holding, address: 303, type: u16, unit: V, scale: 0.01}
  - {key: x.current_l1_energymeter, label: Current L1 energymeter, table: holding, address: 304, type: u16, unit: A, scale: 0.01}
  - {key: x.current_l2_energymeter, label: Current L2 energymeter, table: holding, address: 305, type: u16, unit: A, scale: 0.01}
  - {key: x.current_l3_energymeter, label: Current L3 energymeter, table: holding, address: 306, type: u16, unit: A, scale: 0.01}
  - {key: x.active_power_l1_energymeter, label: Active power L1 energymeter, table: holding, address: 307, type: u16, unit: W}
  - {key: x.active_power_l2_energymeter, label: Active power L2 energymeter, table: holding, address: 308, type: u16, unit: W}
  - {key: x.active_power_l3_energymeter, label: Active power L3 energymeter, table: holding, address: 309, type: u16, unit: W}
  - {key: x.time_stamp_energymeter, label: Time stamp energymeter, table: holding, address: 313, type: u32}
  - {key: x.status_energymeter, label: Status energymeter, table: holding, address: 315, type: u16, enum: state_energy_meter}

enums:
  grid_state: {'0': power from the battery, '1': power from power supply/grid}
  state_energy_meter: {'0': No Error, '1': Error, '256': Undefined}

notes:
- OpenEMS switches relay n by writing register n (1–6) and reads the relay states at 105–110.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
