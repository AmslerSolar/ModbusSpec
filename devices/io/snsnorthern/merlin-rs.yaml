# Written from the S&S Northern Merlin RS Series Modbus Functionality (Rev 05).

modbusspec: 0
id: snsnorthern-merlin-rs
manufacturer: S&S Northern
name: Merlin RS CO2 / temperature / humidity sensor
kind: io

sources:
- title: S&S Northern Merlin RS Series Modbus Functionality
  version: Rev 05
  url: https://snsnorthern.com/wp-content/uploads/2026/07/SS-RS-Modbus-Functionality-Rev-05.pdf
  sha256: 6da56da560a4c13d8f1e8f6036b8029337b9c550e4184d036c65dbdcc34a9be8

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  # Identity and bus settings
  - {key: x.baud_rate, label: Baud Rate, table: holding, address: 20, type: u16, poll: slow, note: '9600 (default), 19200, 38400 or 57600, set by DIP switch.'}
  - {key: x.address, label: Address, table: holding, address: 21, type: u16, poll: slow, note: '0…127, set by DIP switch.'}
  - {key: x.name, label: Name, table: holding, address: 22, type: str, length: 2, poll: slow, note: ASCII; content not described.}
  # Measurements
  - {key: x.co2, label: CO2, table: holding, address: 25, type: s16, unit: ppm}
  - {key: x.room_temperature, label: Temperature, table: holding, address: 26, type: s16, unit: °C, scale: 0.1, note: °C or °F by the Temperature Unit setting (39); °C assumed.}
  - {key: x.humidity, label: Humidity, table: holding, address: 27, type: s16, unit: '%', scale: 0.1}
  # 0–10 V outputs
  - {key: x.co2_output_voltage, label: CO2 +10V O/P, table: holding, address: 28, type: s16, unit: V, scale: 0.1, writable: true, note: Writable when register 60 is 0 (output follows the written value).}
  - {key: x.temperature_output_voltage, label: Temperature +10V O/P, table: holding, address: 29, type: s16, unit: V, scale: 0.1, writable: true, note: Writable when register 61 is 0.}
  - {key: x.humidity_output_voltage, label: Humidity +10V O/P, table: holding, address: 30, type: s16, unit: V, scale: 0.1, writable: true, note: Writable when register 62 is 0.}
  # Settings
  - {key: x.co2_offset, label: CO2 Offset, table: holding, address: 31, type: s16, unit: ppm, writable: true, poll: slow, min: -5000, max: 5000}
  - {key: x.temperature_offset, label: Temperature Offset, table: holding, address: 32, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.humidity_offset, label: Humidity Offset, table: holding, address: 33, type: s16, unit: '%', scale: 0.1, writable: true, poll: slow}
  - {key: x.co2_pre_alarm_level, label: Pre-Alarm Level (Low), table: holding, address: 34, type: s16, unit: ppm, writable: true, poll: slow, min: 0, max: 5000}
  - {key: x.co2_alarm_level, label: Alarm Level (High), table: holding, address: 35, type: s16, unit: ppm, writable: true, poll: slow, min: 0, max: 5000}
  - {key: x.relay_set_point, label: Relay Set Point, table: holding, address: 36, type: s16, unit: ppm, writable: true, poll: slow, min: 0, max: 5000}
  - {key: x.relay_alarm, label: Relay Alarm, table: holding, address: 37, type: s16, enum: relay_alarm}
  - {key: x.relay_polarity, label: Relay Polarity, table: holding, address: 38, type: s16, enum: relay_polarity, writable: true, poll: slow}
  - {key: x.temperature_unit, label: Temperature Unit, table: holding, address: 39, type: s16, enum: temperature_unit, writable: true, poll: slow}
  - {key: x.co2_alarm_status, label: CO2 Alarm Status, table: holding, address: 40, type: s16, enum: alarm_status}
  - {key: x.co2_max, label: CO2 Maximum, table: holding, address: 41, type: u16, unit: ppm, writable: true, poll: slow, min: 0, max: 5000, note: Range end mapped to the output.}
  - {key: x.co2_min, label: CO2 Minimum, table: holding, address: 42, type: u16, unit: ppm, writable: true, poll: slow}
  - {key: x.co2_voltage_max, label: CO2 Voltage Max, table: holding, address: 43, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.co2_voltage_min, label: CO2 Voltage Min, table: holding, address: 44, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.temperature_max, label: Temperature Max, table: holding, address: 45, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow, min: -20, max: 60}
  - {key: x.temperature_min, label: Temperature Min, table: holding, address: 46, type: s16, unit: °C, scale: 0.1, writable: true, poll: slow}
  - {key: x.temperature_voltage_max, label: Temp Voltage Max, table: holding, address: 47, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.temperature_voltage_min, label: Temp Voltage Min, table: holding, address: 48, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.humidity_max, label: Humidity Max, table: holding, address: 49, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow}
  - {key: x.humidity_min, label: Humidity Min, table: holding, address: 50, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow}
  - {key: x.humidity_voltage_max, label: Humidity Voltage Max, table: holding, address: 51, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.humidity_voltage_min, label: Humidity Voltage Min, table: holding, address: 52, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  # Output feedback and alarms
  - {key: x.co2_voltage_feedback, label: CO2 Voltage Feedback, table: holding, address: 53, type: u16, unit: V, scale: 0.1}
  - {key: x.temperature_voltage_feedback, label: Temp Voltage Feedback, table: holding, address: 54, type: u16, unit: V, scale: 0.1}
  - {key: x.humidity_voltage_feedback, label: Humidity Voltage Feedback, table: holding, address: 55, type: u16, unit: V, scale: 0.1}
  - {key: x.co2_voltage_alarm, label: CO2 Voltage Alarm, table: holding, address: 56, type: s16, enum: voltage_alarm}
  - {key: x.temperature_voltage_alarm, label: Temperature Voltage Alarm, table: holding, address: 57, type: s16, enum: voltage_alarm}
  - {key: x.humidity_voltage_alarm, label: Humidity Voltage Alarm, table: holding, address: 58, type: s16, enum: voltage_alarm}
  - {key: x.co2_output_source, label: CO2 +10V O/P (40028), table: holding, address: 60, type: s16, enum: output_source, writable: true, poll: slow}
  - {key: x.temperature_output_source, label: Temperature +10V O/P (40029), table: holding, address: 61, type: s16, enum: output_source, writable: true, poll: slow}
  - {key: x.humidity_output_source, label: Humidity +10V O/P (40030), table: holding, address: 62, type: s16, enum: output_source, writable: true, poll: slow}
  # Set point model only
  - {key: x.set_point, label: Set Point, table: holding, address: 64, type: u16, unit: °C, scale: 0.1, writable: true, optional: true, poll: slow, min: 10, max: 25, note: Only on the RS Set Point model.}
  - {key: x.adjusted_value, label: Adjusted Value, table: holding, address: 65, type: s16, unit: °C, scale: 0.1, writable: true, optional: true, min: -2, max: 2, note: Only on the RS Set Point model.}

enums:
  relay_alarm: {'0': No alarm, '1': Alarm (relay changed state)}
  relay_polarity: {'0': Normal (N/O), '1': Reversed (N/C)}
  temperature_unit: {'1': °C, '2': °F}
  alarm_status: {'1': No alarm, '2': Pre-alarm, '3': Alarm}
  voltage_alarm: {'0': No alarm, '1': Output more than 10 % off}
  output_source: {'0': Written value, '1': Sensor}

problems:
  - {when: {key: x.co2_alarm_status, equals: 2}, kind: warning, text: CO2 pre-alarm level reached}
  - {when: {key: x.co2_alarm_status, equals: 3}, kind: fault, text: CO2 alarm level reached}
  - {when: {key: x.co2_voltage_alarm, equals: 1}, kind: warning, text: CO2 output voltage more than 10 % off}
  - {when: {key: x.temperature_voltage_alarm, equals: 1}, kind: warning, text: Temperature output voltage more than 10 % off}
  - {when: {key: x.humidity_voltage_alarm, equals: 1}, kind: warning, text: Humidity output voltage more than 10 % off}

notes:
- 'Addresses: the document numbers registers 40000 upwards and lists 40000–40019 as reserved, so 40000 is taken as protocol
  address 0 (address = number − 40000) in the holding table. Not stated in the document; assumed, hence every point is `verified:
  false`. If the device uses the common 40001 = 0 convention, all addresses are one lower.'
- Serial line 9600 baud (19200, 38400 or 57600 by DIP switch), no parity, 8 data bits, 1 stop bit. The address (0…127) is
  set by DIP switch; the default is not stated, 1 is assumed.
- Temperature values follow the Temperature Unit setting (register 39, °C or °F); °C is assumed here.
- The document gives no product code or serial number, so there is no identification. The Name registers (22–23) hold ASCII
  text whose content isn't described.
- Registers 64–65 exist only on the RS Set Point model.
