modbusspec: 0
id: raritan-emx
manufacturer: Raritan
name: EMX environmental monitoring controller
kind: io

sources:
- title: Raritan EMX Modbus Interface
  version: 3.6.2 (47076)
  url: https://cdn.raritan.com/download/EMX/version-3.6.2/EMX_Modbus_3.6.2_47076.pdf
  sha256: fec5aa166f1aa74d7152362cb0ba34f000c1d3537b986bcdf878407e0cfedaf6

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.register_set_version, label: Register set version, table: holding, address: 0, type: u16, poll: slow, note: 'High byte major, low byte minor.'}
  - {key: x.sensor1_type, label: Peripheral sensor 1 type, table: holding, address: 4096, type: u16, enum: sensor_type, poll: slow, note: 'Sensor n at 1000h + (n−1) × 10h, up to 130.'}
  - {key: x.sensor1_state, label: Peripheral sensor 1 state, table: holding, address: 4097, type: u16, note: 'Discrete sensors only: the state as given by the sensor type (e.g. water leak 1 = alarm).'}
  - {key: x.sensor1_value, label: Peripheral sensor 1 reading, table: holding, address: 4098, type: f32, note: Numeric sensors only; the unit follows the sensor type.}
  - {key: x.sensor1_actuator, label: Peripheral sensor 1 actuator control, table: holding, address: 4100, type: u16, writable: true, poll: slow, note: 'For actuator types (10, 14); the values to write are not described in the document.'}
  - {key: x.sensor2_type, label: Peripheral sensor 2 type, table: holding, address: 4112, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor2_state, label: Peripheral sensor 2 state, table: holding, address: 4113, type: u16}
  - {key: x.sensor2_value, label: Peripheral sensor 2 reading, table: holding, address: 4114, type: f32}
  - {key: x.sensor2_actuator, label: Peripheral sensor 2 actuator control, table: holding, address: 4116, type: u16, writable: true, poll: slow}
  - {key: x.sensor3_type, label: Peripheral sensor 3 type, table: holding, address: 4128, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor3_state, label: Peripheral sensor 3 state, table: holding, address: 4129, type: u16}
  - {key: x.sensor3_value, label: Peripheral sensor 3 reading, table: holding, address: 4130, type: f32}
  - {key: x.sensor3_actuator, label: Peripheral sensor 3 actuator control, table: holding, address: 4132, type: u16, writable: true, poll: slow}
  - {key: x.sensor4_type, label: Peripheral sensor 4 type, table: holding, address: 4144, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor4_state, label: Peripheral sensor 4 state, table: holding, address: 4145, type: u16}
  - {key: x.sensor4_value, label: Peripheral sensor 4 reading, table: holding, address: 4146, type: f32}
  - {key: x.sensor4_actuator, label: Peripheral sensor 4 actuator control, table: holding, address: 4148, type: u16, writable: true, poll: slow}
  - {key: x.sensor5_type, label: Peripheral sensor 5 type, table: holding, address: 4160, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor5_state, label: Peripheral sensor 5 state, table: holding, address: 4161, type: u16}
  - {key: x.sensor5_value, label: Peripheral sensor 5 reading, table: holding, address: 4162, type: f32}
  - {key: x.sensor5_actuator, label: Peripheral sensor 5 actuator control, table: holding, address: 4164, type: u16, writable: true, poll: slow}
  - {key: x.sensor6_type, label: Peripheral sensor 6 type, table: holding, address: 4176, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor6_state, label: Peripheral sensor 6 state, table: holding, address: 4177, type: u16}
  - {key: x.sensor6_value, label: Peripheral sensor 6 reading, table: holding, address: 4178, type: f32}
  - {key: x.sensor6_actuator, label: Peripheral sensor 6 actuator control, table: holding, address: 4180, type: u16, writable: true, poll: slow}
  - {key: x.sensor7_type, label: Peripheral sensor 7 type, table: holding, address: 4192, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor7_state, label: Peripheral sensor 7 state, table: holding, address: 4193, type: u16}
  - {key: x.sensor7_value, label: Peripheral sensor 7 reading, table: holding, address: 4194, type: f32}
  - {key: x.sensor7_actuator, label: Peripheral sensor 7 actuator control, table: holding, address: 4196, type: u16, writable: true, poll: slow}
  - {key: x.sensor8_type, label: Peripheral sensor 8 type, table: holding, address: 4208, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor8_state, label: Peripheral sensor 8 state, table: holding, address: 4209, type: u16}
  - {key: x.sensor8_value, label: Peripheral sensor 8 reading, table: holding, address: 4210, type: f32}
  - {key: x.sensor8_actuator, label: Peripheral sensor 8 actuator control, table: holding, address: 4212, type: u16, writable: true, poll: slow}

enums:
  sensor_type: {'0': unassigned, '1': temperature (°C), '2': relative humidity (%), '3': air flow (m/s), '4': air pressure (Pa), '5': 'contact closure (0 off, 1 on)', '6': vibration (G), '7': 'water leak (0 normal, 1 alarm)', '8': 'smoke detector (0 normal, 1 alarm)', '9': ambient light (lux), '10': 'dry contact actuator (0 off, 1 on)', '11': 'magnetic contact (0 off, 1 on)', '12': 'passive IR motion detector (0 off, 1 on)', '13': 'tamper detector (0 normal, 1 alarm)', '14': 'powered dry contact actuator (0 off, 1 on)', '15': absolute humidity (g/m³), '16': acceleration (G), '17': 'door state (0 open, 1 closed)', '18': 'door lock state (0 open, 1 closed)', '19': 'door handle lock switch (0 open, 1 closed)'}

notes:
- 'The EMX is Raritan''s environmental monitoring controller: it carries no power measurement, only peripheral sensors and
  actuators (temperature, humidity, contacts, leak, smoke, door and the like).'
- 'Modbus/TCP only; the service is off until enabled in the device''s network services settings. The document gives neither
  a unit id nor request size limits: unit 1 is assumed. There is no identity register: identity is only available through
  Read Device Identification (function 2Bh), which this format can''t express, so the file has no `identify`.'
- Addresses in the document are already 0-based protocol addresses (written in hex) and taken as they are; all registers are
  holding registers (function 03). Multi-register values are big-endian (Float = f32).
- 'Up to 130 sensors, each a block of 16 registers at 1000h + i × 10h (i = 0…129): type, state, reading (float), actuator
  control. Only sensors 1–8 are listed here; the others follow the same layout. Unassigned slots report type 0.'
- The peripheral sensor block has the same layout as on Raritan PDUs (see raritan-px), but starts at 1000h instead of 0800h.
  The document gives no threshold-state values for numeric sensors, so no problem rules are defined.
