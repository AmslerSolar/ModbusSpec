# Written from the JXCT JXBS-3001-TH-RS Temperature Humidity Sensor User Manual (2.0).

modbusspec: 0
id: jxct-jxbs-3001-th
manufacturer: JXCT
name: JXBS-3001-TH-RS temperature / humidity sensor
kind: io

sources:
- title: JXBS-3001-TH-RS Temperature Humidity Sensor User Manual (RS485 Modbus; copy on empere.in)
  version: 2.0 (2020-01-01)
  url: https://empere.in/wp-content/uploads/2022/04/RS485-Temperature-and-Humidity.pdf
  sha256: cbae4759da6a1c15f757f16bf952db5ae152944d27e35349cfff0b4a4fee4784

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.humidity, label: Humidity, table: holding, address: 0, type: u16, unit: '%', scale: 0.1}
  - {key: x.temperature, label: Temperature, table: holding, address: 1, type: s16, unit: °C, scale: 0.1, note: 'Signed: the document''s example 0xFF9B reads −10.1 °C.'}
  - {key: x.modbus_address, label: Device Address, table: holding, address: 256, type: u16, writable: true, min: 0, max: 252, poll: slow}
  - {key: x.baud_rate, label: Baud Rate, table: holding, address: 257, type: u16, writable: true, poll: slow, verified: false, note: 2400 / 4800 / 9600 bps; the document does not say whether the register holds the rate itself or a code.}

notes:
- The manual names JXCT (jxct-iot.com) as its source; the copy used here is hosted by a reseller.
- Registers are listed as 0000H / 40001 style; the hex addresses are protocol addresses and are used as they are. The example
  reads them with function 03 (holding).
- The factory default address is not stated; the document's example uses address 1 (assumed default).
- Probe variants -S20, -S30, -S31 and -S75 (SHT20 / SHT30 / SHT31 / SHT75) share this register map.
