# Written from the Kaiterra Square Modbus User Manual (May 2023).

modbusspec: 0
id: kaiterra-square
manufacturer: Kaiterra
name: Square air quality monitor
kind: io

sources:
- title: Kaiterra Square Modbus User Manual
  version: May 2023
  url: https://support.kaiterra.com/hubfs/CX%20Documentation/Kaiterra%20Square%20Modbus%20User%20Manual%20-%20April%202023.pdf?hsLang=en
  sha256: 6c907eacc0ec34d057da0e328696633231e8cc4ece640a2fde80d33705293348

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8E1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.pm2_5, label: PM2.5, table: input, address: 0, type: u16, unit: µg/m³, note: 0 … 999.}
  - {key: x.tvoc, label: TVOC, table: input, address: 1, type: u16, unit: ppb, note: 0 … 60000.}
  - {key: x.temperature, label: Temperature, table: input, address: 2, type: u16, unit: °C, scale: 0.1, offset: -273.2, note: 'Sent in tenths of a kelvin; the document converts with raw − 2732, then ÷ 10. Range −30.0 … 50.0 °C.'}
  - {key: x.humidity, label: Humidity, table: input, address: 3, type: u16, unit: '%', scale: 0.1, note: 0.0 … 100 % RH.}
  - {key: x.co2, label: CO2, table: input, address: 4, type: u16, unit: ppm, note: 0 … 9999.}
  - {key: x.pm10, label: PM10, table: input, address: 5, type: u16, unit: µg/m³, note: 0 … 999.}
  - {key: x.hcho, label: HCHO (formaldehyde), table: input, address: 6, type: u16, unit: ppb, note: 0 … 2000.}
  - {key: x.co, label: CO, table: input, address: 7, type: u16, unit: ppm, scale: 0.1, verified: false, note: 'Range given as 0.0 … 500.0 ppm; the document states a 0.1 resolution only for temperature and humidity, so the scale is assumed from the range.'}
  - {key: x.o3, label: O3, table: input, address: 8, type: u16, unit: ppm, scale: 0.1, verified: false, note: Range given as 0.0 … 100.0 ppm; scale assumed as for CO.}
  - {key: x.aqi, label: AQI, table: input, address: 14, type: u16, note: 0 … 500; standard and pollutants are chosen in the configuration tool.}
  - {key: x.modbus_address, label: Modbus address code, table: holding, address: 0, type: u16, writable: true, poll: slow, min: 1, max: 247}

notes:
- Modbus RTU on the RS485 port; defaults 9600 baud, 8 data bits, even parity, 1 stop bit, address 1. Parity and address are
  set with the configuration tool.
- Input registers 9 … 13 are reserved. Sensors the unit isn't fitted with are not marked in the document.
- The document gives no serial number or model register, so there is no identify.
