# Written from the Daviteq User guide for RS485 fuel level sensor CAP10CNR (CAP10CNR-MN-EN-01, revision 31, 2024-03-15).

modbusspec: 0
id: daviteq-cap10cnr
manufacturer: Daviteq
name: CAP10CNR RS485 fuel level sensor
kind: io

sources:
- title: Daviteq User guide for RS485 fuel level sensor CAP10CNR (CAP10CNR-MN-EN-01)
  version: revision 31, 2024-03-15
  url: https://daviteq.com/en/manuals/books/fuel-level-sensor-for-industrial-applications-cap10/page/user-guide-for-rs485-fuel-level-sensor-cap10cnr/export/pdf
  sha256: fc2b4bdd2a8925db69d1935386f331e3c3c76f06d0e13eec4f216710fc640938

connection:
  default_port: 502
  default_unit: 30
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.level, label: Damping output, table: input, address: 0, type: u16, unit: '%', scale: 0.1, poll: fast, note: 'Fuel level as parts per thousand of the probe length (0–1000), damped; given here in %.'}
  - {key: x.level_raw, label: Non damping output, table: input, address: 1, type: u16, unit: '%', scale: 0.1, poll: fast, note: 'Undamped level, parts per thousand of the probe length (0–1000); given here in %.'}
  - {key: x.capacitance, label: Value of C, table: input, address: 2, type: u16, poll: slow, note: Raw capacitance value; unit not stated.}
  - {key: firmware, label: FW_version, table: input, address: 4, type: u16, poll: slow}
  - {key: x.level_rate, label: Level Rate, table: input, address: 5, type: s16, unit: ‰/min, poll: fast, note: 'Change of level per minute in parts per thousand of the length; negative = fuel flowing out (consumption), positive = refilling. Times the tank area gives the flow rate.'}
  - {key: x.slave_address, label: Address of slave, table: holding, address: 6, type: u16, writable: true, min: 1, max: 247, poll: slow, note: Default 30.}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 7, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: Parity, table: holding, address: 8, type: u16, enum: parity, writable: true, poll: slow}

enums:
  baud_rate: {'0': 9600 bps, '1': 19200 bps}
  parity: {'0': None, '1': Odd, '2': Even}

notes:
- 'Addresses: 3xxxx → input register xxxx − 1 (function 04), 4xxxx → holding register xxxx − 1 (function 03). The register
  table lists function code 4 for the 3xxxx rows and 3 for the 4xxxx rows, while its heading says reads use function 03; the
  table''s codes are used here (not verified).'
- The settings registers continue the numbering of the measurement registers (40007–40009), so they sit at holding addresses
  6–8.
- No register identifies the sensor; there is no identification check.
