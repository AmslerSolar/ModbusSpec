# Written from the CS Instruments FA 5xx Modbus RTU Installation manual, version 1.01 (2016-06-16).

modbusspec: 0
id: cs-instruments-fa5xx
manufacturer: CS Instruments
name: FA 510 / FA 515 dew point sensor
kind: io

sources:
- title: CS Instruments FA 5xx Modbus RTU Installation
  version: "1.01"
  url: https://fensor.com/download/fa-510-fa-515-notice-modbus-rtu-v100-en/
  sha256: 7f9eebb83ae678706451dfed7fd6381e8614ee6a8adde18bfa541252c627397d
  date: '2016-06-16'
  language: en
  devices: [FA 510, FA 515]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1
  write_multiple: true
  limits:
    max_registers: 27

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 0
    type: u32
  checks:
  # registers made to test the data format
  - table: holding
    address: 64000
    type: u32
    equals: 1000000
  - table: holding
    address: 64002
    type: f32
    equals: 1000000.0

points:
  - {key: serial, label: Serial Number, table: holding, address: 0, type: u32, poll: slow}
  - {key: firmware, label: Software Version, table: holding, address: 2, type: u32, poll: slow, note: High 16 bits and low 16 bits are the two parts of the version (see notes).}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 4, type: u32, poll: slow, note: High 16 bits and low 16 bits are the two parts of the version (see notes).}
  - {key: x.production_code, label: Production Code, table: holding, address: 6, type: u32, poll: slow}
  - {key: x.production_date, label: Production date, table: holding, address: 8, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.calibration_date, label: Calibration date, table: holding, address: 10, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.part_number, label: Part Number, table: holding, address: 12, type: u32, poll: slow}
  - {key: x.run_time, label: Run Time Counter, table: holding, address: 14, type: u32, unit: s, poll: slow}
  - {key: x.code_signature, label: Code signature, table: holding, address: 16, type: u32, poll: slow}
  - {key: x.atex_number, label: Atex Number, table: holding, address: 18, type: u32, poll: slow}
  - {key: x.temperature, label: Temperature, table: holding, address: 1000, type: f32, unit: °C}
  - {key: x.temperature_f, label: Temperature, table: holding, address: 1002, type: f32, unit: °F}
  - {key: x.relative_humidity, label: Relative Humidity, table: holding, address: 1004, type: f32, unit: '%'}
  - {key: x.dew_point, label: Dew Point, table: holding, address: 1006, type: f32, unit: °Ctd}
  - {key: x.dew_point_f, label: Dew Point, table: holding, address: 1008, type: f32, unit: °Ftd}
  - {key: x.absolute_humidity, label: Absolute Humidity, table: holding, address: 1010, type: f32, unit: g/m³}
  - {key: x.absolute_humidity_mg, label: Absolute Humidity, table: holding, address: 1012, type: f32, unit: mg/m³}
  - {key: x.humidity_grade, label: Humidity Grade, table: holding, address: 1014, type: f32, unit: g/kg}
  - {key: x.vapor_ratio, label: Vapor Ratio (Volume), table: holding, address: 1016, type: f32, unit: ppm}
  - {key: x.saturation_vapor_pressure, label: Saturation vapor pressure, table: holding, address: 1018, type: f32, unit: hPa}
  - {key: x.partial_vapor_pressure, label: Partial Vapor Pressure, table: holding, address: 1020, type: f32, unit: hPa}
  - {key: x.atmospheric_dew_point, label: Atmospheric DewPoint, table: holding, address: 1022, type: f32, unit: °Ctd}
  - {key: x.atmospheric_dew_point_f, label: Atmospheric DewPoint, table: holding, address: 1024, type: f32, unit: °Ftd}
  - {key: x.modbus_id, label: Modbus ID, table: holding, address: 2000, type: u16, poll: slow, writable: true, min: 1, max: 247}
  - {key: x.baud_rate, label: Baudrate, table: holding, address: 2001, type: u16, enum: baud_rate, poll: slow, writable: true}
  - {key: x.parity, label: Parity, table: holding, address: 2002, type: u16, enum: parity, poll: slow, writable: true}
  - {key: x.stop_bits, label: Number of Stopbits, table: holding, address: 2003, type: u16, enum: stop_bits, poll: slow, writable: true}
  - {key: x.word_order, label: Word Order, table: holding, address: 2004, type: u16, enum: word_order, poll: slow, writable: true, note: Changing it makes this file read 32-bit values wrongly; it describes the default.}
  - {key: x.modbus_enabled, label: Modbus Enabled, table: holding, address: 2005, type: u16, enum: off_on, poll: slow, writable: true, note: 'Default 1 on the FA 510, 0 on the FA 515.'}
  - {key: x.analog_output_value, label: Output Value, table: holding, address: 2006, type: u32, enum: analog_output, poll: slow, writable: true}
  - {key: x.analog_scale_low, label: '4mA Scale Low', table: holding, address: 2008, type: f32, poll: slow, writable: true}
  - {key: x.analog_scale_high, label: '20mA Scale High', table: holding, address: 2010, type: f32, poll: slow, writable: true}
  - {key: x.system_pressure_enabled, label: System Pressure Settings, table: holding, address: 2012, type: u32, enum: off_on, poll: slow, writable: true}
  - {key: x.system_pressure, label: System Pressure, table: holding, address: 2014, type: f32, unit: hPa, poll: slow, writable: true, note: Relative pressure.}
  - {key: x.reference_pressure, label: Reference Pressure, table: holding, address: 2016, type: f32, unit: hPa, poll: slow, writable: true, note: Absolute pressure.}
  - {key: x.calibration_value, label: Calibration Value, table: holding, address: 2018, type: f32, unit: °Ctd, writable: true, write_only: true, note: 'One point calibration: reads give 0. Write NaN to reset; an existing calibration has to be reset before a new value. This changes the measurement.'}
  - {key: x.humidity_offset, label: Relative Hum Offset, table: holding, address: 2020, type: f32, unit: '%', poll: slow}
  - {key: x.calibration_counter, label: Calibration Counter, table: holding, address: 2022, type: u32, poll: slow}
  - {key: x.sensor_location, label: Sensor Location, table: holding, address: 2024, type: str, length: 8, poll: slow, writable: true}
  - {key: x.next_calibration, label: Next Calibration Date, table: holding, address: 2032, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow, writable: true}
  - {key: x.format_test_u32, label: Format test for Dword, table: holding, address: 64000, type: u32, poll: slow}
  - {key: x.format_test_float, label: Format test for float, table: holding, address: 64002, type: f32, poll: slow}

enums:
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400'}
  parity: {'0': None, '1': Even, '2': Odd}
  stop_bits: {'0': 1 stop bit, '1': 2 stop bits}
  word_order: {'43981': Big endian (ABCD), '52651': Middle endian (CDAB)}
  off_on: {'0': 'Off', '1': 'On'}
  analog_output: {'0': 4-20 mA disabled, '1': Temperature °C, '2': Temperature °F, '3': Relative humidity %, '4': Dew point °C, '5': Dew point °F, '6': Absolute humidity g/m³, '7': Absolute humidity mg/m³, '8': Humidity grade g/kg, '9': Vapor ratio ppm, '10': Saturation vapor pressure hPa, '11': Partial vapor pressure hPa, '12': Atmospheric dew point °C, '13': Atmospheric dew point °F}

notes:
- 'The maker is CS Instruments; the manual is hosted by Fensor, a distributor, as FA 510 – FA 515 notice.'
- 'Modbus is off by default on the FA 515 (register 2005), so it answers only after it is enabled, for example with CS Instruments'' service software.'
- 'The manual lists both the register and the 0-based address (1 and 0, 1009 and 1008); this file uses the address column.'
- 'Defaults given are 19200 baud (index 4), even parity and unit 1. No default is given for the stop bits, so one is assumed. Port 502 only applies through a gateway: the manual has a chapter titled Modbus TCP, but it repeats the RTU data.'
- 'Function 3 reads and 16 writes; there is no function 6, so settings are written with 16. Messages can hold 27 registers at most.'
- 'The formatting hints for the version numbers are printed next to the serial number and software version rows; they read as belonging to software and hardware version, one row lower, which is how they are used here (unverified).'
- 'The text says to test the data format at 64000 and 64004; the table has the float at 64002, which fits a 32-bit value. The table is used.'
- 'The manual says only 2001–2064 can be written. Those marked R/W there are writable here. The 20 free registers at 2500–2519 are left out (user defined, 0xFF by default). Exception codes are also left out. The manual calls itself V1.00 on some pages and V1.01 on others, and names the DS 500 in places.'
