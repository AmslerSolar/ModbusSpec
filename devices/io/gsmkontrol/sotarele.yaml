notes:
- Addresses are 0-based as the document lists them. Coils are switched with function 05 (FF00 = on, 0000 = off); writing several
  coils (0F) and registers (06, 10) isn't implemented.
- Each extension block has 8 coil addresses but 6 relays (relays 1–6 taken as the first six addresses), and 8 discrete-input
  addresses.
- 'Left out: the temperatures (input register 0–1 for the main block, 7 and 15 for the extension blocks) because the document
  gives neither their data type nor scaling; the input-register copies of the input states (2–6, 8–14, 16–22); and the temperature
  (holding 0–79) and humidity (holding 80–159) thresholds.'
- The document states neither the transport (RTU or TCP), serial settings, port nor unit id; 502 and 1 are placeholders.
- The document comes from gsmkontrol.ru and doesn't name the maker; GSM Kontrol is taken as the maker.
