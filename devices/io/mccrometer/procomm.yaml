# Written from the McCrometer MODBUS Protocol User Manual for ProComm Converter, 30124-76 Rev. 1.1 (2 December 2020), a legacy document.

modbusspec: 0
id: mccrometer-procomm
manufacturer: McCrometer
name: ProComm flow meter converter
kind: io

sources:
- title: McCrometer MODBUS Protocol User Manual for ProComm Converter (legacy document)
  version: '1.1'
  url: https://www.mccrometer.com/wp-content/uploads/2026/04/Modbus_Protocol_User_Manual_for_ProComm_Converter_-_legacy_document.pdf
  sha256: 70d14d69e28de69c185bff8bd6cced9bc0fd5dfaef7c1ae7a18f51284b715132
  date: '2020-12-02'
  number: 30124-76
  language: en
  devices:
  - ProComm
  related:
  - title: ProComm Electromagnetic Flow Meter Installation, Operation and Maintenance manual, 30124-62
    what: menu settings

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.full_scale_flow, label: Full scale flow rate, table: input, address: 0, type: f32, poll: slow, note: In the unit chosen on the converter (see the display); no register gives it.}
  - {key: x.flow_percent, label: Flow rate value in percentage, table: input, address: 2, type: f32, unit: '%'}
  - {key: x.flow_rate, label: Flow rate value, table: input, address: 4, type: f32, note: 'In the unit chosen on the converter; averaged since the last read. The sign is also given by a flag bit (register 20 bit 13): the document doesn''t say whether this value is signed.'}
  - {key: x.flow_speed, label: Flow speed, table: input, address: 6, type: f32, note: 'm/s or ft/s, whichever is chosen on the converter; no register gives it.'}
  - {key: x.totalizer_t_plus, label: Totalizer T+, table: input, address: 8, type: u32, poll: slow, scale_exponent_from: {table: input, address: 10, type: u16, bits: [0, 7], negate: true}, note: Integer; the decimal point comes from the low byte of the next register. Volume unit is the one chosen on the converter.}
  - {key: x.totalizer_t_plus_overflows, label: Totalizer T+ overflows, table: input, address: 10, type: u16, bits: [8, 15], poll: slow, note: Number of overflows recorded. The document doesn't say how they add to the total.}
  - {key: x.totalizer_t_plus_decimals, label: Totalizer T+ decimal places, table: input, address: 10, type: u16, bits: [0, 7], poll: slow}
  - {key: x.totalizer_p_plus, label: Totalizer P+, table: input, address: 11, type: u32, poll: slow, scale_exponent_from: {table: input, address: 13, type: u16, bits: [0, 7], negate: true}, note: Integer; the decimal point comes from the low byte of the next register. Volume unit is the one chosen on the converter.}
  - {key: x.totalizer_p_plus_overflows, label: Totalizer P+ overflows, table: input, address: 13, type: u16, bits: [8, 15], poll: slow, note: Number of overflows recorded. The document doesn't say how they add to the total.}
  - {key: x.totalizer_p_plus_decimals, label: Totalizer P+ decimal places, table: input, address: 13, type: u16, bits: [0, 7], poll: slow}
  - {key: x.totalizer_t_minus, label: Totalizer T-, table: input, address: 14, type: u32, poll: slow, scale_exponent_from: {table: input, address: 16, type: u16, bits: [0, 7], negate: true}, note: Integer; the decimal point comes from the low byte of the next register. Volume unit is the one chosen on the converter.}
  - {key: x.totalizer_t_minus_overflows, label: Totalizer T- overflows, table: input, address: 16, type: u16, bits: [8, 15], poll: slow, note: Number of overflows recorded. The document doesn't say how they add to the total.}
  - {key: x.totalizer_t_minus_decimals, label: Totalizer T- decimal places, table: input, address: 16, type: u16, bits: [0, 7], poll: slow}
  - {key: x.totalizer_p_minus, label: Totalizer P-, table: input, address: 17, type: u32, poll: slow, scale_exponent_from: {table: input, address: 19, type: u16, bits: [0, 7], negate: true}, note: Integer; the decimal point comes from the low byte of the next register. Volume unit is the one chosen on the converter.}
  - {key: x.totalizer_p_minus_overflows, label: Totalizer P- overflows, table: input, address: 19, type: u16, bits: [8, 15], poll: slow, note: Number of overflows recorded. The document doesn't say how they add to the total.}
  - {key: x.totalizer_p_minus_decimals, label: Totalizer P- decimal places, table: input, address: 19, type: u16, bits: [0, 7], poll: slow}
  - {key: x.process_flags, label: Process flags, table: input, address: 20, type: u16, flags: process, note: 'Flags 1 in the high byte, flags 2 in the low byte.'}
  - {key: x.average_samples, label: Number of measure samples, table: input, address: 21, type: u16}
  - {key: x.e1_resistance, label: Electrode E1 resistance, table: input, address: 22, type: u16, unit: kΩ}
  - {key: x.e2_resistance, label: Electrode E2 resistance, table: input, address: 23, type: u16, unit: kΩ}
  - {key: x.e1_voltage, label: Electrode E1 voltage, table: input, address: 24, type: s16, unit: mV}
  - {key: x.e2_voltage, label: Electrode E2 voltage, table: input, address: 25, type: s16, unit: mV}
  - {key: x.recharge_voltage, label: Voltage at rechargeable terminals, table: input, address: 26, type: u16, unit: mV}
  - {key: x.residual_battery, label: Residual battery capacity, table: input, address: 27, type: u16, unit: '%'}
  - {key: x.cpu_temperature, label: CPU temperature, table: input, address: 28, type: s16, note: In the temperature unit chosen on the converter; the document gives no scale.}
  - {key: x.board_temperature_t1, label: Board temperature T1, table: input, address: 29, type: s16, note: In the temperature unit chosen on the converter; the document gives no scale.}
  - {key: x.board_temperature_t2, label: Board temperature T2, table: input, address: 30, type: s16, note: In the temperature unit chosen on the converter; the document gives no scale.}
  - {key: x.coil_temperature, label: Flow sensor coil temperature, table: input, address: 31, type: s16, note: In the temperature unit chosen on the converter; the document gives no scale.}
  - {key: x.sensor_test_result, label: Latest sensor test result code, table: input, address: 32, type: u16, flags: sensor_test, verified: false, note: 'The document''s bit list says it belongs to register 21, which is the sample count; it can only fit this register, the test result (unverified).'}
  - {key: x.active_alarms, label: Number of alarms currently active, table: input, address: 33, type: u16}
  - {key: x.reset_totalizers, label: Reset totalizers, table: coil, address: 0, type: bool, writable: true, write_only: true, poll: slow, note: 'Function 05 with value FF00h: resets the totalizers enabled for reset from the digital input. There is no read function for this coil.'}

flags:
  process:
    "0": "Pipe empty"
    "1": "Coils excitation error"
    "2": "Input signal error"
    "3": "Signal out of amplifier capability"
    "4": "Signal out of A/D converter range"
    "5": "Pulse channel 1 overflow"
    "6": "Pulse channel 2 overflow"
    "7": "Flow rate overflow"
    "9": "Volume counters locked"
    "10": "Flow rate measure forced to zero"
    "11": "Measure range 2 active"
    "12": "Flow rate below cut-off"
    "13": "Flow rate sign negative"
    "14": "Flow rate alarm MAX"
    "15": "Flow rate alarm MIN"
  sensor_test:
    "0": "Coil driver generator value out of tolerance, phase 1"
    "1": "Coil driver generator value out of tolerance, phase 2"
    "2": "Coil driver generator voltage out of tolerance, phase 1"
    "3": "Coil driver generator voltage out of tolerance, phase 2"
    "4": "Coil driver output 1 voltage out of tolerance, phase 1"
    "5": "Coil driver output 2 voltage out of tolerance, phase 1"
    "6": "Coil driver output 1 voltage out of tolerance, phase 2"
    "7": "Coil driver output 2 voltage out of tolerance, phase 2"
    "8": "Coil driver output 1 voltage out of tolerance, phase 3"
    "9": "Coil driver output 2 voltage out of tolerance, phase 3"
    "10": "Coil leakage current outside limit"
    "11": "Coil temperature outside limits"
    "12": "Coil time A outside limits"
    "13": "Coil time B outside limits"
    "14": "E1 resistance outside limits"
    "15": "E2 resistance outside limits"

reserved:
  - {table: input, address: 20, bits: [8, 8]}

problems:
  - {when: {key: x.process_flags, bit: 15}, kind: warning, text: Flow below minimum threshold}
  - {when: {key: x.process_flags, bit: 14}, kind: warning, text: Flow above maximum threshold}
  - {when: {key: x.process_flags, bit: 7}, kind: warning, text: Flow rate above full scale}
  - {when: {key: x.process_flags, bit: 6}, kind: warning, text: Pulse channel 2 overflow}
  - {when: {key: x.process_flags, bit: 5}, kind: warning, text: Pulse channel 1 overflow}
  - {when: {key: x.process_flags, bit: 4}, kind: fault, text: Measure signal out of A/D converter range}
  - {when: {key: x.process_flags, bit: 3}, kind: fault, text: Measure signal out of amplifier capability}
  - {when: {key: x.process_flags, bit: 2}, kind: fault, text: Input signal error}
  - {when: {key: x.process_flags, bit: 1}, kind: fault, text: Coils excitation error}
  - {when: {key: x.process_flags, bit: 0}, kind: warning, text: Pipe empty}
  - {when: {key: x.sensor_test_result, not: 0}, kind: warning, text: 'Sensor test failed (code 0x{value:X})'}

notes:
- "Kind io: this is the converter of an electromagnetic flow meter, a measuring instrument that reports flow, totals and its own sensor state over RS-485, so it fits io's sensors; it controls nothing except a totalizer reset."
- "Addresses: the document's addresses are the protocol addresses, not references. Its frame example asks with function 04 for start address 0004 and 2 registers, the row 0004-0005 of the map, and the reply is a float (4247FFCFh, about 50). So 0010 is input 10 (the numbers run on decimally from 0009), and nothing is subtracted. The request's CRC in the example is correct (the reply's is not, 5E4Dh by calculation against 5FFAh printed). The totalizer reset is function 05 at 0000, so coil 0."
- "Encoding: big-endian in bytes; two-register values with the high register first, shown by the same float example. Floats are IEEE 754."
- "Connection: the document gives no default. Unit 1, 9600 baud and no parity are what its example communications screen shows. Parity and speed are set on the converter (speed 1200 to 115200, parity even, none or odd; unit 1–247 without 232); the map section lists only 4800, 9600, 19200 and 38400, for another series name. The 10-bit word it describes leaves no room for a parity bit. No Modbus TCP in the document: port and 125 registers per request are assumed, for gateways. The document says the converter has Modbus only when factory-configured for it."
- "Units: flow, flow speed, totals and temperatures are in whatever is chosen on the converter, and no register says which, so those points have no unit. Totals: raw ÷ 10^decimals, from the low byte of the following register; how the overflow count in its high byte adds to the total is not stated."
- "Problems: the fault or warning classification of the process flags and of the sensor test is ours. The sensor test rule fires on any set bit. Register 33 (active alarms) has no rule since the alarms are reported by the flags."
- "Register 20 bit 8 is reserved (flags 1 bit 0: internal use, no meaning). Flags 1 bit 7 down to 1 are register bits 15 to 9, flags 2 are bits 7 to 0."
- "Left out: function 08 diagnostics (sub-functions and counters, not registers), the data log and events log read with function 04 and reset with 05 (no map given), and function 110 ETP commands (no format given). The function list has no holding registers and no coil reads."
- "Document inconsistencies: the query example with errors prints function 03 in its frame but names it function 04, and 03 is not in the function list. Delay options run 0, 20, 4, 60, with 4 probably meaning 40. The sensor test flags name register 0021, see that point. The section on the data format names the millennium series instead of ProComm, and the communications menu is numbered 7 in one place and 8 in another."
- "identify is left out: the map has only live measurements and flags, with no model, serial or firmware register or any fixed value, so no check would tell this device from others."
- "All registers of the process data map are here."
