# Written from the Fluidwell F193-X Modbus slave display operating manual (HF193XEN_v0501_04).

modbusspec: 0
id: fluidwell-f193x
manufacturer: Fluidwell
name: F193-X Modbus slave display with alarm and analog output
kind: io

sources:
- title: F193-X Modbus slave display, signal input Modbus RTU / ASCII, signal outputs 4-20mA and switch outputs (operating
    manual)
  version: HF193XEN_v0501_04
  url: https://www.selemark.it/wp-content/uploads/2017/09/F193X_Modbus_Display_with_Alarm_and_Analog_Output_EN_V1151_MI__v0501_04_en.pdf
  sha256: 23f7be84bebf37d10c46063056f551a566ebf99e7a54995dacfe2f4fbe687aed
  archive_url: https://web.archive.org/web/20220524154929/https://www.selemark.it/wp-content/uploads/2017/09/F193X_Modbus_Display_with_Alarm_and_Analog_Output_EN_V1151_MI__v0501_04_en.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - ascii
  serial:
    baud: 2400

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 2
    type: u32
  checks:
  - table: holding
    address: 1
    type: u16
    equals: 193

points:
  # Displayed product values (written by the master, shown on the display)
  - {key: x.product1_value, label: Value product 1, table: holding, address: 1536, type: u32, writable: true, min: 0, max: 9999999, poll: fast, verified: false, note: 3-byte value; read as two registers (assumed). Shown with the number of decimals set for the product.}
  - {key: x.product2_value, label: Value product 2, table: holding, address: 1552, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product3_value, label: Value product 3, table: holding, address: 1568, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product4_value, label: Value product 4, table: holding, address: 1584, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product5_value, label: Value product 5, table: holding, address: 1600, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product6_value, label: Value product 6, table: holding, address: 1616, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product7_value, label: Value product 7, table: holding, address: 1632, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product8_value, label: Value product 8, table: holding, address: 1648, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product9_value, label: Value product 9, table: holding, address: 1664, type: u32, writable: true, poll: fast, verified: false}
  - {key: x.product1_unit, label: Unit product 1, table: holding, address: 1540, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product2_unit, label: Unit product 2, table: holding, address: 1556, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product3_unit, label: Unit product 3, table: holding, address: 1572, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product4_unit, label: Unit product 4, table: holding, address: 1588, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product5_unit, label: Unit product 5, table: holding, address: 1604, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product6_unit, label: Unit product 6, table: holding, address: 1620, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product7_unit, label: Unit product 7, table: holding, address: 1636, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product8_unit, label: Unit product 8, table: holding, address: 1652, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product9_unit, label: Unit product 9, table: holding, address: 1668, type: u16, enum: unit, writable: true, poll: slow}
  - {key: x.product1_decimals, label: Decimals product 1, table: holding, address: 1541, type: u16, writable: true, poll: slow}
  - {key: x.product2_decimals, label: Decimals product 2, table: holding, address: 1557, type: u16, writable: true, poll: slow}
  - {key: x.product3_decimals, label: Decimals product 3, table: holding, address: 1573, type: u16, writable: true, poll: slow}
  - {key: x.product4_decimals, label: Decimals product 4, table: holding, address: 1589, type: u16, writable: true, poll: slow}
  - {key: x.product5_decimals, label: Decimals product 5, table: holding, address: 1605, type: u16, writable: true, poll: slow}
  - {key: x.product6_decimals, label: Decimals product 6, table: holding, address: 1621, type: u16, writable: true, poll: slow}
  - {key: x.product7_decimals, label: Decimals product 7, table: holding, address: 1637, type: u16, writable: true, poll: slow}
  - {key: x.product8_decimals, label: Decimals product 8, table: holding, address: 1653, type: u16, writable: true, poll: slow}
  - {key: x.product9_decimals, label: Decimals product 9, table: holding, address: 1669, type: u16, writable: true, poll: slow}
  - {key: x.product1_alarm_output, label: Alarm output product 1, table: holding, address: 1542, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product2_alarm_output, label: Alarm output product 2, table: holding, address: 1558, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product3_alarm_output, label: Alarm output product 3, table: holding, address: 1574, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product4_alarm_output, label: Alarm output product 4, table: holding, address: 1590, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product5_alarm_output, label: Alarm output product 5, table: holding, address: 1606, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product6_alarm_output, label: Alarm output product 6, table: holding, address: 1622, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product7_alarm_output, label: Alarm output product 7, table: holding, address: 1638, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product8_alarm_output, label: Alarm output product 8, table: holding, address: 1654, type: u16, enum: alarm_output, writable: true, poll: slow}
  - {key: x.product9_alarm_output, label: Alarm output product 9, table: holding, address: 1670, type: u16, enum: alarm_output, writable: true, poll: slow}

  # Alarms, outputs and display state
  - {key: x.alarm_status, label: Alarm status (bitfield), table: holding, address: 1562, type: u16, flags: products, writable: true, poll: fast, note: Packed copy of the per-product alarm-set registers (0x0607 … 0x0687); writing sets and clears all of them.}
  - {key: x.relay_outputs, label: Relay outputs (bitfield), table: holding, address: 1564, type: u16, flags: relays, writable: true, poll: fast, note: 'Packed copy of the relay registers 0x0609 … 0x0639; 2, 3 or 4 relays depending on the hardware.'}
  - {key: x.product_displayed, label: Product displayed, table: holding, address: 1551, type: u16, writable: true, min: 0, max: 8, poll: fast, note: 0 = product 1 … 8 = product 9.}
  - {key: x.products_count, label: Products, table: holding, address: 1548, type: u16, writable: true, min: 0, max: 8, poll: slow, note: 0 = one product … 8 = nine products.}

  # Analog output
  - {key: x.analog_output_enable, label: Analog output disable / enable, table: holding, address: 112, type: u16, enum: disable_enable, writable: true, poll: slow}
  - {key: x.analog_output_min, label: Analog output minimum value, table: holding, address: 113, type: u32, writable: true, poll: slow, verified: false, note: 3-byte value; read as two registers (assumed).}
  - {key: x.analog_output_max, label: Analog output maximum value, table: holding, address: 116, type: u32, writable: true, poll: slow, verified: false, note: 3-byte value; read as two registers (assumed).}
  - {key: x.analog_output_value, label: Analog output set value, table: holding, address: 200, type: u32, writable: true, poll: fast, verified: false, note: 'The value to transmit, within the minimum and maximum. 3-byte value; read as two registers (assumed).'}

  # Power management and communication
  - {key: x.lcd_update, label: LCD update, table: holding, address: 80, type: u16, enum: lcd_update, writable: true, poll: slow}
  - {key: x.battery_mode, label: Battery mode, table: holding, address: 81, type: u16, enum: battery_mode, writable: true, poll: slow}
  - {key: x.baud_rate, label: Baudrate, table: holding, address: 10, type: u16, enum: baud, writable: true, poll: slow}
  - {key: x.bus_address, label: Bus address, table: holding, address: 9, type: u16, writable: true, min: 1, max: 255, poll: slow}
  - {key: x.comm_mode, label: Mode, table: holding, address: 11, type: u16, enum: comm_mode, writable: true, poll: slow}
  - {key: x.comm_timeout, label: Time out, table: holding, address: 205, type: u16, unit: s, scale: 0.1, writable: true, poll: slow, note: 0 = no time-out; otherwise "NO COMM'S" is shown when the master stays silent this long.}

  # Identity
  - {key: x.model_type, label: Type of model, table: holding, address: 1, type: u16, poll: slow, note: '193.'}
  - {key: serial, label: Serial number, table: holding, address: 2, type: u32, poll: slow, verified: false, note: '4 bytes; read as two registers, most significant first (assumed).'}
  - {key: firmware, label: Version software, table: holding, address: 4, type: u32, poll: slow, verified: false, note: 4 bytes; read as two registers (assumed).}
  - {key: x.tag_number, label: Tagnumber, table: holding, address: 170, type: u32, writable: true, min: 0, max: 9999999, poll: slow, verified: false, note: 4 bytes read as two registers (assumed).}

enums:
  unit: {'0': L, '1': m³, '2': kg, '3': lb, '4': gal, '5': US gal, '6': bbl, '7': none}
  alarm_output: {'0': None (disabled), '1': Relay 1, '2': Relay 2, '3': Relay 3, '4': Relay 4}
  disable_enable: {'0': Disable, '1': Enable}
  lcd_update: {'0': Fast, '1': 1 s, '2': 3 s, '3': 15 s, '4': 30 s, '5': 'Off'}
  battery_mode: {'0': Operational, '1': Shelf}
  baud: {'0': '1200', '1': '2400', '2': '4800', '3': '9600'}
  comm_mode: {'0': ASCII, '1': RTU, '2': 'Off'}

flags:
  products: {'0': Product 1 alarm, '1': Product 2 alarm, '2': Product 3 alarm, '3': Product 4 alarm, '4': Product 5 alarm, '5': Product 6 alarm, '6': Product 7 alarm, '7': Product 8 alarm, '8': Product 9 alarm}
  relays: {'0': Relay 1, '1': Relay 2, '2': Relay 3, '3': Relay 4}

notes:
- The manual is Fluidwell's (copyright Fluidwell bv); the copy came from the Italian site selemark.it.
- 'The F193-X has no inputs of its own: the Modbus master writes up to nine values to show, sets alarms and switches up to
  four relays and an analog output. All of it is therefore writable.'
- The manual gives each variable's address (hexadecimal) and size in bytes, but neither the function code nor how multi-byte
  values map onto registers; it refers to a separate Modbus protocol description that is not included. Holding registers (function
  03) are assumed, 1- and 2-byte values as one register, 3- and 4-byte values as two registers with the most significant word
  first. These points are unverified.
- 'Serial: RS232 or RS485 (2- or 4-wire), Modbus ASCII or RTU, 1200–9600 baud (2400 in the factory settings), address 1–255
  (1 in the factory settings). Data format and parity are not stated.'
- 'Left out: the per-product alarm-set registers (0x0607 + 0x10 × n) and per-relay registers (0x0609 … 0x0639), which the
  two bitfields already cover; scroll, toggle, alarm auto-output, alarm clearing and product/tank display settings; analog
  output tuning and filter; password.'
