modbusspec: 0
id: jumo-hydrotrans-s20
manufacturer: JUMO
name: hydroTRANS S20 humidity/temperature/CO2 transmitter
kind: io

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.temperature.jumo/src/io/openems/edge/temperature/jumo/JumoHydroTransS20Impl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.temperature_unit, label: Temperature unit, table: holding, address: 1001, type: u16, enum: temperature_unit, writable: true}
  - {key: x.humidity_unit, label: Humidity unit, table: holding, address: 1002, type: u16, enum: humidity_unit, writable: true}
  - {key: x.relative_humidity, label: Relative humidity, table: holding, address: 6000, type: f32, unit: '%'}
  - {key: x.temperature, label: Temperature, table: holding, address: 6002, type: f32, unit: °C}
  - {key: x.carbon_dioxide, label: Carbon dioxide, table: holding, address: 6004, type: f32, unit: ppm}
  - {key: x.dew_point, label: Dew point, table: holding, address: 6006, type: f32, unit: °C}
  - {key: x.mixing_ration, label: Mixing ration, table: holding, address: 6008, type: f32}
  - {key: x.absolute_humidity, label: Absolute humidity, table: holding, address: 6010, type: f32, unit: g/m³}
  - {key: x.specific_enthalpy, label: Specific enthalpy, table: holding, address: 6012, type: f32, unit: kJ/kg}
  - {key: x.wet_bulb_temperature, label: Wet bulb temperature, table: holding, address: 6014, type: f32, unit: °C}
  - {key: x.frost_point, label: Frost point, table: holding, address: 6016, type: f32, unit: °C}
  - {key: x.partial_water_vapor_pressure, label: Partial water vapor pressure, table: holding, address: 6018, type: f32, unit: mbar}
  - {key: x.general_error, label: 'General error ', table: holding, address: 6400, type: u16}
  - {key: x.configuration_fault, label: 'Configuration faulty, The checksum of the configuration data is faulty (CRC).', table: holding, address: 6401, type: u16}
  - {key: x.calibration_fault, label: 'Calibration faulty, The checksum of the calibration data is faulty (CRC).', table: holding, address: 6402, type: u16}
  - {key: x.device_not_calibrated, label: 'Either, The calibration flag has not been set or there is no calibration data.', table: holding, address: 6403, type: u16}
  - {key: x.humidity_sensor_faulty, label: 'Either, The humidity and temperature sensor is faulty or the communication to the sensor is impaired.', table: holding, address: 6404, type: u16}
  - {key: x.co2_sensor_faulty, label: CO2 sensor faulty or the communication to the sensor is impaired., table: holding, address: 6405, type: u16}

enums:
  temperature_unit: {'0': Degree Celsius, '1': Degree Fahrenheit}
  humidity_unit: {'0': Gram per cubic meter g/m³, '1': Gram per cubic foot g/ft³}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
