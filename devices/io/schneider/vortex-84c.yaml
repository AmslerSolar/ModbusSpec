modbusspec: 0
id: schneider-vortex-84c
manufacturer: Schneider Electric
name: Model 84C vortex flowmeter (Modbus)
kind: io

sources:
- title: MI 019-224 Intelligent Vortex Flowmeters Model 84C with Modbus Communication, Master Instruction
  version: '2020-02-25'
  url: https://www.disai.net/wp-content/uploads/catalogos_pdf/MI_019-224_f-VORTEX_84C_MODBUS.pdf
  sha256: 440b464055456e1cfe3b8751436de4edf6f90e5f417db8f6d6ac00ee05a1908d
  archive_url: https://web.archive.org/web/20240626233211/https://www.disai.net/wp-content/uploads/catalogos_pdf/MI_019-224_f-VORTEX_84C_MODBUS.pdf

connection:
  default_port: 502
  default_unit: 99
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 124
  input_equals_holding: true

encoding:
  byte_order: detect
  word_order: detect
  detect:
    table: holding
    address: 6604
    type: f32
    plausible:
    - 1233.9
    - 1234.1

identify:
  serial:
    table: holding
    address: 10999
    type: str
    length: 8
    byte_order: big
  checks:
  - table: holding
    address: 6604
    type: f32
    range:
    - 1233.9
    - 1234.1

points:
  # Measurements (floats; units as configured, see the unit text registers)
  - {key: x.totalizer_1, label: Totalizer 1, table: holding, address: 499, type: f32, poll: slow}
  - {key: x.totalizer_1_rollover, label: Totalizer 1 Rollover, table: holding, address: 501, type: f32, poll: slow, note: Number of times totalizer 1 rolled over (assumed from the name; not explained in the document)., verified: false}
  - {key: x.totalizer_2, label: Totalizer 2, table: holding, address: 503, type: f32, poll: slow}
  - {key: x.totalizer_2_rollover, label: Totalizer 2 Rollover, table: holding, address: 505, type: f32, poll: slow}
  - {key: x.totalizer_3, label: Totalizer 3, table: holding, address: 507, type: f32, poll: slow}
  - {key: x.totalizer_3_rollover, label: Totalizer 3 Rollover, table: holding, address: 509, type: f32, poll: slow}
  - {key: x.pulse_output, label: Pulse Output, table: holding, address: 511, type: f32, poll: fast}
  - {key: x.volume_rate, label: Volume Rate, table: holding, address: 513, type: f32, poll: fast}
  - {key: x.volume_base_rate, label: Volume Base Rate, table: holding, address: 515, type: f32, poll: fast}
  - {key: x.mass_rate, label: Mass Rate, table: holding, address: 517, type: f32, poll: fast}
  - {key: x.process_temperature, label: Process Temperature, table: holding, address: 519, type: f32, poll: fast}
  - {key: x.velocity, label: Velocity, table: holding, address: 521, type: f32, poll: fast}
  - {key: x.heat_power, label: Power, table: holding, address: 523, type: f32, poll: fast, note: Rate of heat flow (steam / energy measurement).}
  - {key: x.pressure, label: Pressure, table: holding, address: 525, type: f32, poll: fast}
  - {key: x.density, label: Density, table: holding, address: 527, type: f32, poll: fast}
  - {key: x.viscosity, label: Viscosity, table: holding, address: 529, type: f32, poll: fast}
  - {key: x.enthalpy, label: Enthalpy, table: holding, address: 531, type: f32, poll: fast}
  - {key: x.reynolds, label: Reynolds, table: holding, address: 533, type: f32, poll: fast}
  - {key: x.electronics_temperature, label: Electronics Temperature, table: holding, address: 535, type: f32, poll: fast}
  - {key: x.k_corrected, label: K Corrected, table: holding, address: 537, type: f32, poll: slow}
