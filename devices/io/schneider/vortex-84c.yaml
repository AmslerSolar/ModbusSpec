  - {key: x.user_time_in_service, label: User Time In Service, table: holding, address: 9002, type: u16, byte_order: big, poll: slow, note: Unit not stated in the document; cleared with coil 100.}
  - {key: x.config_change_counter, label: Configuration Change Counter, table: holding, address: 9499, type: u16, byte_order: big, poll: slow}
  - {key: x.last_return_code, label: Detailed Return Code, table: holding, address: 9501, type: u16, byte_order: big, poll: slow, note: Detail of the last configuration access (e.g. 0x76 = write protected); the document lists the codes.}
  - {key: error_code, label: Malfunction Code, table: holding, address: 9503, type: u16, byte_order: big, poll: fast, verified: false, note: The document gives no codes; 0 = no malfunction is assumed.}
  - {key: serial, label: Tube Serial Number, table: holding, address: 10999, type: str, length: 8, byte_order: big, poll: slow}
  - {key: x.long_tag, label: Long Tag, table: holding, address: 11999, type: str, length: 16, byte_order: big, poll: slow, writable: true}
