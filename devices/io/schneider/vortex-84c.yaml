  - {key: x.self_test, label: User Self Test, table: coil, address: 106, type: bool, writable: true, poll: slow, note: Write 1 to start; reads 1 while running. Result in SelfTestResult.}

enums:
  status: {'96': OK, '97': Input fixed, '98': Paused, '99': Overridden, '100': Default, '101': Input overridden, '128': Under soft lower limit, '129': Over soft upper limit, '130': Input issue, '131': Pulse and totals stopped (configuration change), '132': RTD shorted, '133': RTD open, '134': Override outside the soft limits, '135': 'Offline, pulse and totals stopped', '136': Using default value, '144': 'Alert, under hard lower limit', '145': 'Alert, over hard upper limit', '146': 'Alert, input bad', '147': 'Alert, input turned off by user', '148': 'Alert, input turned off by factory', '149': 'Alert, internal error', '150': 'Alert, RTD shorted', '151': 'Alert, RTD open', '152': 'Alert, override outside the hard limits', '153': 'Alert, measurement not ready'}
  fluid: {'32768': User liquid, '32769': User gas, '32770': User vapor, '32772': Saturated steam, '32773': Superheated steam}
  totalizer_action: {'0': 'Off', '1': 'On', '2': Resume, '3': Reset}
  self_test: {'0': Failed or not run, '1': Passed}
  byte_format: {'0': Full swap (default), '1': Word swap, '2': Word and byte swap, '3': No swap}

problems:
  - {when: {key: x.volume_rate_status, range: [144, 153]}, kind: fault, text: 'Volume rate: {text}'}
  - {when: {key: x.volume_rate_status, range: [128, 136]}, kind: warning, text: 'Volume rate: {text}'}
  - {when: {key: x.mass_rate_status, range: [144, 153]}, kind: fault, text: 'Mass rate: {text}'}
  - {when: {key: x.mass_rate_status, range: [128, 136]}, kind: warning, text: 'Mass rate: {text}'}
  - {when: {key: x.process_temperature_status, range: [144, 153]}, kind: fault, text: 'Process temperature: {text}'}
  - {when: {key: x.process_temperature_status, range: [128, 136]}, kind: warning, text: 'Process temperature: {text}'}
  - {when: {key: x.vortex_signal_status, range: [144, 153]}, kind: fault, text: 'Vortex signal: {text}'}
  - {when: {key: x.vortex_signal_status, range: [128, 136]}, kind: warning, text: 'Vortex signal: {text}'}
  - {when: {key: x.rtd_status, range: [144, 153]}, kind: fault, text: 'RTD: {text}'}
  - {when: {key: x.rtd_status, range: [128, 136]}, kind: warning, text: 'RTD: {text}'}
  - {when: {key: x.electronics_temperature_status, range: [144, 153]}, kind: fault, text: 'Electronics temperature: {text}'}
  - {when: {key: x.electronics_temperature_status, range: [128, 136]}, kind: warning, text: 'Electronics temperature: {text}'}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Flowmeter malfunction (code {value})'}

notes:
- The document numbers registers from 1 (it says so); 1 was subtracted for the protocol addresses here. Coil addresses (100-107)
  are used as given, since the document's frame examples put them into the request unchanged; not verified.
- Functions 03 and 04 read the same registers. Floats take two registers that must be read in one request. A request may hold
  up to 125 registers (123 for writes), one less when floats are involved.
- 'Float byte order is a setting (Byte Format, 6604): the device works little-endian internally; the default (full swap) gives
  standard big-endian floats. The test register (6604, protocol address) always holds 1234.0 in the matching order, so both
  orders are detected from it. Text and 16-bit registers are always most significant byte first.'
- Units of all measurements and totals are configurable (unit code registers 3300-3314, codes in the document's EGU tables);
  the unit text registers (3000-3064) give the unit in use, so no units are set on the points.
- RS485 Modbus RTU only; unit 1-247 (default 99); 4800/9600/19200 Bd (default 9600), parity none (default) / odd / even, 1
  (default) or 2 stop bits. Port 502 only applies behind a gateway.
- 'Left out: user default, remote input, damping, range limit, custom unit, alert strategy, calculation method, override,
  fluid compensation, base, pulse and totalizer mapping, LFCI and K-factor registers; the RTD calibration and auto-LFCI coils
  (104, 105, 107).'
- 'Problems: alert states (0x90-0x99) of the main measurements are reported as faults, soft-limit and input issues (0x80-0x88)
  as warnings.'
