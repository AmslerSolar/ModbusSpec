  - {key: x.totalizer_3_unit, label: Totalizer 3 Units, table: holding, address: 3011, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.volume_rate_unit, label: Volume Rate Units, table: holding, address: 3019, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.volume_base_rate_unit, label: Volume Base Rate Units, table: holding, address: 3023, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.mass_rate_unit, label: Mass Rate Units, table: holding, address: 3027, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.process_temperature_unit, label: Process Temperature Units, table: holding, address: 3031, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.velocity_unit, label: Velocity Units, table: holding, address: 3035, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.heat_power_unit, label: Power Units, table: holding, address: 3039, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.pressure_unit, label: Pressure Units, table: holding, address: 3043, type: str, length: 4, byte_order: big, poll: slow}
  - {key: x.density_unit, label: Density Units, table: holding, address: 3047, type: str, length: 4, byte_order: big, poll: slow}
