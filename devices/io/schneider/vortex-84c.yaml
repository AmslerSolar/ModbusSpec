  - {key: x.totalizer_2_status, label: Totalizer 2 Status, table: holding, address: 3500, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.totalizer_3_status, label: Totalizer 3 Status, table: holding, address: 3501, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.pulse_output_status, label: Pulse Output Status, table: holding, address: 3502, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.volume_rate_status, label: Volume Rate Status, table: holding, address: 3503, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.volume_base_rate_status, label: Volume Base Rate Status, table: holding, address: 3504, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.mass_rate_status, label: Mass Rate Status, table: holding, address: 3505, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.process_temperature_status, label: Process Temperature Status, table: holding, address: 3506, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.velocity_status, label: Velocity Status, table: holding, address: 3507, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.heat_power_status, label: Power Status, table: holding, address: 3508, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.pressure_status, label: Pressure Status, table: holding, address: 3509, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.density_status, label: Density Status, table: holding, address: 3510, type: u16, byte_order: big, poll: fast, enum: status}
  - {key: x.electronics_temperature_status, label: Electronics Temperature Status, table: holding, address: 3514, type: u16, byte_order: big, poll: fast, enum: status}
