# Written from the Kuntze Neon Multi / Krypton Multi Short manual modbus RTU (version 2019/04).

modbusspec: 0
id: kuntze-multi
manufacturer: Kuntze Instruments
name: Neon Multi / Krypton Multi water analysis and dosing controller
kind: io

sources:
- title: Kuntze Neon Multi / Krypton Multi Short manual modbus RTU
  version: 2019/04
  url: https://www.kuntze.com/wp-content/uploads/2021/05/2019_Manual_Modbus-RTU_ENG.pdf
  sha256: 66667e157c8791be884dd65d7f78fd5d096aa42b907e60d894588ebdab8c6dd9
  archive_url: https://web.archive.org/web/20210927100939/https://www.kuntze.com/wp-content/uploads/2021/05/2019_Manual_Modbus-RTU_ENG.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 1024
    type: str
    length: 12
  checks:
  # unit code of the measured pH value: pH
  - table: holding
    address: 4138
    type: u16
    equals: 1422

points:
  # Measured values: value, then decimals (bits 0-7) / percentage flag (bit 8), then unit code (, range min, max)
  - {key: x.ph, label: Measured pH value, table: holding, address: 4136, type: s16, unit: pH, scale_exponent_from: {table: holding, address: 4137, type: u16, bits: [0, 7], negate: true}}
  - {key: x.water_temperature, label: Measured temperature value, table: holding, address: 4160, type: s16, unit: °C, scale_exponent_from: {table: holding, address: 4161, type: u16, bits: [0, 7], negate: true}, note: °C or °F by the temperature unit setting (10280); the unit code follows in 4162. °C taken.}
  - {key: x.dis1, label: Measured DIS 1 value, table: holding, address: 4680, type: s16, scale_exponent_from: {table: holding, address: 4681, type: u16, bits: [0, 7], negate: true}, note: 'Disinfectant (chlorine, chlorine dioxide, ozone or H2O2, by 4464); unit in x.dis1_unit.'}
  - {key: x.dis1_unit, label: Measured DIS 1 value unit, table: holding, address: 4682, type: u16, enum: unit_code, poll: slow}
  - {key: x.dis2, label: Measured DIS 2 value, table: holding, address: 6000, type: s16, scale_exponent_from: {table: holding, address: 6001, type: u16, bits: [0, 7], negate: true}, optional: true, note: Only with the DIS 2 add-on; unit in x.dis2_unit.}
  - {key: x.dis2_unit, label: Measured DIS 2 value unit, table: holding, address: 6002, type: u16, enum: unit_code, poll: slow, optional: true}
  - {key: x.redox, label: Measured Redox value, table: holding, address: 4688, type: s16, unit: mV, scale_exponent_from: {table: holding, address: 4689, type: u16, bits: [0, 7], negate: true}, optional: true, verified: false, note: Only with the Rx add-on. Unit not stated for this register; mV taken from the unit table.}
  - {key: x.ec, label: Measured EC value, table: holding, address: 4728, type: s16, scale_exponent_from: {table: holding, address: 4729, type: u16, bits: [0, 7], negate: true}, optional: true, note: Only with the EC add-on; unit in x.ec_unit.}
  - {key: x.ec_unit, label: Measured EC value unit, table: holding, address: 4730, type: u16, enum: unit_code, poll: slow, optional: true}
  - {key: x.ocl, label: Measured OCl value, table: holding, address: 5832, type: s16, scale_exponent_from: {table: holding, address: 5833, type: u16, bits: [0, 7], negate: true}, optional: true, note: Unit in x.ocl_unit.}
  - {key: x.ocl_unit, label: Measured OCl value unit, table: holding, address: 5834, type: u16, enum: unit_code, poll: slow, optional: true}
  # Controller outputs (5 registers each, same layout)
  - {key: x.controller_s1_ph, label: Controller S1 pH, table: holding, address: 7608, type: s16, scale_exponent_from: {table: holding, address: 7609, type: u16, bits: [0, 7], negate: true}, verified: false, note: Unit (code in 7610) not stated; may be a percentage of the range (see notes).}
  - {key: x.controller_s2_ph, label: Controller S2 pH, table: holding, address: 7616, type: s16, scale_exponent_from: {table: holding, address: 7617, type: u16, bits: [0, 7], negate: true}, verified: false}
  - {key: x.controller_s1_dis1, label: Controller S1 DIS 1, table: holding, address: 7624, type: s16, scale_exponent_from: {table: holding, address: 7625, type: u16, bits: [0, 7], negate: true}, verified: false}
  - {key: x.controller_s2_dis1, label: Controller S2 DIS 1, table: holding, address: 7632, type: s16, scale_exponent_from: {table: holding, address: 7633, type: u16, bits: [0, 7], negate: true}, verified: false}
  - {key: x.controller_s1_redox, label: Controller S1 Redox, table: holding, address: 7640, type: s16, scale_exponent_from: {table: holding, address: 7641, type: u16, bits: [0, 7], negate: true}, verified: false, optional: true}
  - {key: x.controller_s2_redox, label: Controller S2 Redox, table: holding, address: 7648, type: s16, scale_exponent_from: {table: holding, address: 7649, type: u16, bits: [0, 7], negate: true}, verified: false, optional: true}
  - {key: x.controller_s1_ec, label: Controller S1 EC, table: holding, address: 7656, type: s16, scale_exponent_from: {table: holding, address: 7657, type: u16, bits: [0, 7], negate: true}, verified: false, optional: true}
  # Digital inputs and relays (value register of a 3-register variable)
  - {key: x.digital_input_1, label: Status digital input 1, table: holding, address: 6152, type: u16}
  - {key: x.digital_input_2, label: Status digital input 2, table: holding, address: 6184, type: u16}
  - {key: x.digital_input_3, label: Status digital input 3, table: holding, address: 7536, type: u16}
  - {key: x.digital_input_4, label: Status digital input 4, table: holding, address: 7544, type: u16}
  - {key: x.digital_input_5, label: Status digital input 5, table: holding, address: 7552, type: u16}
  - {key: x.digital_input_6, label: Status digital input 6, table: holding, address: 7560, type: u16}
  - {key: x.relay_1, label: Status Relay 1, table: holding, address: 6544, type: u16}
  - {key: x.relay_2, label: Status Relay 2, table: holding, address: 6568, type: u16}
  - {key: x.relay_3, label: Status Relay 3, table: holding, address: 6592, type: u16, note: Relay 3 is the alarm relay (event 101).}
  - {key: x.relay_4, label: Status Relay 4, table: holding, address: 7568, type: u16}
  - {key: x.relay_5, label: Status Relay 5, table: holding, address: 7576, type: u16}
  - {key: x.relay_6, label: Status Relay 6, table: holding, address: 7584, type: u16}
  - {key: x.relay_7, label: Status Relay 7, table: holding, address: 7592, type: u16}
  - {key: x.relay_8, label: Status Relay 8, table: holding, address: 7600, type: u16}
  # Event and calibration logs
  - {key: x.event_log_index, label: 'Event log, index of the first entry', table: holding, address: 200, type: u16, note: 'Up to 100 entries of 4 registers (day+month, year+hour, minute+second, code) from 201 to 600.'}
  - {key: x.event_1_time, label: Event log first entry time, table: holding, address: 201, type: datetime, length: 3, datetime: {day: {register: 0, bits: [8, 15]}, month: {register: 0, bits: [0, 7]}, year: {register: 1, bits: [8, 15], offset: 2000}, hour: {register: 1, bits: [0, 7]}, minute: {register: 2, bits: [8, 15]}, second: {register: 2, bits: [0, 7]}}, verified: false, note: The year is one byte; the 2000 offset is assumed.}
  - {key: x.event_1_code, label: Event log first entry code, table: holding, address: 204, type: u16, enum: event_code, note: Events listed as going have the code + 126.}
  - {key: x.calibration_log_index, label: 'Calibration log, index of the first entry', table: holding, address: 100, type: u16, poll: slow, note: 'Up to 10 entries of 5 registers (day+month, year+hour, minute+second, slope, zero point) from 101 to 150.'}
  # Instrument data
  - {key: serial, label: Serial number, table: holding, address: 1024, type: str, length: 12, poll: slow}
  - {key: firmware, label: Software version, table: holding, address: 1056, type: str, length: 10, poll: slow}
  - {key: x.instrument_id, label: ID, table: holding, address: 2056, type: u32, poll: slow, verified: false, note: 'Listed as 4 registers, type u32; only the first two are taken.'}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 2464, type: u32, poll: slow, verified: false}
  - {key: x.production_date, label: Production date, table: holding, address: 2448, type: u32, poll: slow, verified: false, note: Format not stated.}
  - {key: x.addons, label: Activated add-ons, table: holding, address: 2128, type: u32, flags: addons, poll: slow, verified: false, note: Word order of the 32-bit values isn't stated; big taken.}
  - {key: x.operating_hours, label: Operating hours, table: holding, address: 2080, type: u32, unit: h, poll: slow, verified: false}
  - {key: x.time, label: Time, table: holding, address: 0, type: u32, poll: slow, writable: true, verified: false, note: Format not stated.}
  # Settings
  - {key: x.operation_mode, label: Operation mode, table: holding, address: 2240, type: u16, poll: slow, note: Read only. Its texts aren't listed; the unit-code register (2242) names the text table.}
  - {key: x.dis1_measurement, label: DIS 1 measurement, table: holding, address: 4464, type: u16, enum: disinfectant, poll: slow, writable: true, verified: false, note: Enum taken from text table 3019; which table applies is given in 4466.}
  - {key: x.temperature_unit, label: Temperature unit, table: holding, address: 10280, type: u16, enum: temperature_unit, poll: slow, writable: true, verified: false, note: Enum taken from text table 3035; which table applies is given in 10282.}
  - {key: x.ph_lower_limit, label: Lower limit pH, table: holding, address: 11512, type: s16, poll: slow, writable: true, note: 'Given as a percentage of the range (flag set): value = min + raw / 10000 × (max − min), range in 11515 / 11516.'}
  - {key: x.ph_upper_limit, label: Upper limit pH, table: holding, address: 11520, type: s16, poll: slow, writable: true, verified: false, note: Assumed to be a percentage of the range like the lower limit.}
  - {key: x.ph_setpoint, label: pH Std setpoint, table: holding, address: 8312, type: s16, poll: slow, writable: true, verified: false, note: Value register of a 5-register variable; check decimals and percentage flag in 8313.}
  - {key: x.dis1_setpoint, label: DIS 1 Std setpoint, table: holding, address: 8576, type: s16, poll: slow, writable: true, verified: false, note: Value register of a 5-register variable; check decimals and percentage flag in 8577.}
  - {key: x.redox_setpoint, label: Rx Std setpoint, table: holding, address: 8864, type: s16, poll: slow, writable: true, verified: false, optional: true}
  - {key: x.alarm_delay, label: Alarm delay, table: holding, address: 6328, type: u16, poll: slow, writable: true, verified: false}
  - {key: x.bus_address, label: Bus address, table: holding, address: 6608, type: u16, poll: slow, note: 1 … 31; read only over Modbus.}
  - {key: x.test_mode, label: Test mode, table: holding, address: 2152, type: u16, writable: true, poll: slow, note: Switches the test menu on and off; relays and mA outputs can then be set (6552 ff.).}

