  unit_code: {'1001': °C, '1054': s, '1058': min, '1059': h, '1060': days, '1211': mA, '1243': mV, '1283': MOhm, '1302': mS/cm, '1342': '%', '1353': l/h, '1422': pH, '1423': ppm, '1552': µS/cm, '1558': mg/l, '1559': g/l, '1660': Times per week, '1661': Ppk, '1662': g/l, '1663': m³/h, '1664': nA/ppm, '1670': /cm, '1671': m³, '1672': m³/h, '1673': ml/m³, '1993': Pulse/h, '1994': l/Pulse, '1995': l/l, '1996': no unit}
  disinfectant: {'0': Chlorine, '1': Chlorine dioxide, '2': Ozone, '3': H2O2}
  temperature_unit: {'0': °C, '1': °F}
  event_code: {'3': Start, '4': Internal error, '5': Internal error, '6': Internal error, '7': Internal error, '8': Internal error, '9': Internal error, '10': Internal error, '11': Internal error, '12': Internal error, '14': Check pH input, '15': Check temperature input, '16': Check DIS 1 input, '17': Check Rx input, '18': Check DIS 2 input, '19': Check EC input, '20': Below measurement range pH, '21': Above measurement range pH, '22': Below measurement range temperature, '23': Above measurement range temperature, '24': Below measurement range DIS 1, '25': Above measurement range DIS 1, '26': Below measurement range Rx, '27': Above measurement range Rx, '28': Below measurement range DIS 2, '29': Above measurement range DIS 2, '30': Below measurement range EC, '31': Above measurement range EC, '32': Internal error, '33': Zero point pH, '34': Zero point Rx, '35': Zero point DIS 1, '36': Zero point EC, '38': Zero point DIS 2, '39': Slope pH, '40': Slope DIS 1, '41': Slope Rx, '42': Slope EC, '44': Slope DIS 2, '45': Calibration pH, '46': Calibration DIS 1, '47': Calibration Rx, '48': Calibration temperature, '49': Calibration EC, '51': Calibration DIS 2, '52': Clean filter, '53': Clean armature, '54': Clean sensors, '55': Clean seals, '56': Check safety functions, '57': Change sensor pH, '58': Change sensor DIS 1, '59': Change sensor Rx, '62': Change sensor DIS 2, '65': 'SD card: logging stop', '66': No SD card for saving, '67': No SD card, '68': 'SD card: invalid format', '69': 'SD card: full', '70': 'SD card: load error', '71': 'SD card: saving error', '72': 'SD card: write error', '73': 'SD card: read error', '75': No communication with the measurement module, '76': Unknown measurement module, '77': No program file, '78': Unknown program file, '80': Lower limit pH, '81': Upper limit pH, '82': Lower limit DIS 1, '83': Upper limit DIS 1, '84': Lower limit Rx, '85': Upper limit Rx, '86': Lower limit temperature, '87': Upper limit temperature, '88': Lower limit EC, '89': Upper limit EC, '92': Lower limit DIS 2, '93': Upper limit DIS 2, '94': Digital input 1 no water, '95': Digital input 2 external stop, '96': Digital input 3 level, '97': Digital input 4 level, '98': Digital input 5 eco mode, '99': Digital input 6 leakage, '100': Dosage surveillance, '101': Relay 3 (alarm relay), '102': Error RS485, '103': Delay-time controller, '104': Delay-time controller pH, '105': Delay-time controller DIS 1, '106': Delay-time controller Rx, '107': Delay-time controller EC, '109': Delay-time controller DIS 2, '110': mA 1 out of range, '111': mA 2 out of range, '112': mA 3 out of range, '113': mA 4 out of range, '114': mA 5 out of range, '115': Load impedance mA 1 too high, '116': Load impedance mA 2 too high, '117': Load impedance mA 3 too high, '118': Load impedance mA 4 too high, '119': Load impedance mA 5 too high, '120': Calibration, '122': Delay time cleaning, '123': Cleaning, '124': 'Cleaning, base load dosing'}

flags:
  addons: {'9': pH, '10': Rx, '11': DIS 1, '12': EC, '14': DIS 2, '19': Analog outputs, '20': Controller, '22': Modbus RTU, '24': Data log, '25': ASR}

notes:
- 'Modbus RTU only (RS485 add-on): 19200 baud, 8E1, bus address 1 … 31 (default 1). Function 03 reads, 06 / 16 write; at most
  125 registers per request. Addresses are the document''s register numbers, which it gives as protocol addresses (0x0000
  … 0xFFFF).'
- Every numeric variable spans 3 registers (value; decimals in bits 0-7 and a percentage flag in bit 8; unit code) or 5 (plus
  range minimum and maximum). With the percentage flag set the value is 0 … 10000 = 0 … 100 % of the range, and the real value
  is min + value / 10000 × (max − min); this file can't express that and assumes the flag is clear for measured values. Text
  variables are one ASCII character per register.
- Unit codes 1000 … 1996 are units; codes 3001 … 3044 name text tables, where the value is an index (from 0) into that table.
- There is no register for the active alarms; the event log (200 ff.) and the alarm relay (relay 3) are what the document
  offers, so there are no problems here.
- 'Left out: raw sensor values (4440, 4448, 4656, 4664, 4736), the log entries after the first, most configuration parameters
  (measurement, controller parameter sets, data log, analog outputs, expert menu, maintenance intervals, codes) and the test
  outputs. Which exist depends on the activated add-ons.'
