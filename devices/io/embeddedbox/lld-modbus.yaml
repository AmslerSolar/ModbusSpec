notes:
- The boards are carriers for plug-in ModIO modules (4DI, 4DO open collector, 2-relay DO, 4AI, 4AO, 2AI+2AO, and 12DI / 12DO
  for the expansion slot). Which channels exist and whether a slot holds inputs or outputs depends on the modules fitted and
  on the port setup made with the vendor's configuration tool, so every point is optional; read only the slots you have fitted.
- 'Address layout (both manuals): each module slot (port) n = 1…5 takes four bit addresses 4·(n − 1)…4·(n − 1) + 3 and four
  registers at the same numbers; the expansion slot (ports 6–8) takes 0x14…0x1F. The manuals print these as hex protocol addresses
  starting at 0x0000; taken as 0-based as printed.'
- 'Digital outputs are coils (function 01 read, 05 / 15 write); digital inputs are read with function 02. The address table
  only names the coil column, so placing inputs at the same numbers in the discrete-input table is assumed (verified: false).'
- Analog inputs and outputs are holding registers (function 03 read, 06 / 16 write) at the slot's addresses. The modules have
  12-bit (LLD-Modbus32E-01 also 16-bit) converters for 4–20 mA, 0–10 V or 10 kΩ NTC (chosen by jumper); the raw register's
  scaling and unit are not stated.
- 'Modbus RTU: factory setting 9600 bit/s, 8 data bits, no parity, 2 stop bits; unit id set on DIP switch SW01 (LLD-ModbusIO-01
  1…247, LLD-Modbus32E-01 1…63), factory address 1. All switches on (255) is a firmware loader mode.'
- 'LLD-Modbus32E-01: Ethernet with factory IP address 192.168.1.100; it speaks Modbus TCP, but the manual does not state the
  TCP port, so 502 is assumed. Its two RS-485 ports can each be a slave (to a PC / HMI) or a master to expansion LLD-ModbusIO-01
  boards (DIP switches SW01 7 / 8); the addressing of I/O on such expansion boards is not described. The LLD-Modbus32E-01
  manual repeats the LLD-ModbusIO-01 slot table even though its board has six module slots plus an expansion slot.'
- No identification, version, status or fault registers are documented, so the boards can't be recognised in a network search.
