# Written from the Sensorex CX105 MODBUS protocol (CX105 Instructions, Modbus supplement).

modbusspec: 0
id: sensorex-cx105
manufacturer: Sensorex
name: CX105 conductivity controller
kind: io

sources:
- title: CX105 Instructions, Modbus Supplement (CX105 MODBUS protocol)
  version: undated (published 2025-07)
  url: https://sensorex.com/wp-content/uploads/2025/07/CX105-Instructions-Modbus-Supplement.pdf
  sha256: 7091ac36b1c5ee14bfefac2bfb95a1ee02499567a81cc07fc7e721807acec3fd

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big


points:
  # Measurements (input registers, function 04)
  - {key: x.conductivity, label: Conductivity Reading, table: input, address: 0, type: f32, poll: fast, note: In the unit chosen by the conductivity unit setting (holding 4); the document gives neither the unit nor the setting's values. Word order not stated; assumed., verified: false}
  - {key: x.temperature, label: Temperature Reading, table: input, address: 2, type: f32, unit: °C, poll: fast, note: In the unit chosen by the temperature unit setting (holding 5); °C is assumed. Word order not stated; assumed., verified: false}

  # Open-collector output (discrete input, function 02)
  - {key: x.oc_output, label: OC Output, table: discrete, address: 0, type: bool, poll: fast, note: '0 = no output, 1 = output active.'}

  # Settings (coils)
  - {key: x.password_protection, label: Password Protection, table: coil, address: 0, type: bool, writable: true, poll: slow}
  - {key: x.analog_source, label: 4-20mA Source, table: coil, address: 1, type: bool, writable: true, poll: slow, note: '0 = conductivity, 1 = temperature.'}
  - {key: x.oc_source, label: OC Source, table: coil, address: 2, type: bool, writable: true, poll: slow, note: '0 = conductivity, 1 = temperature.'}

  # Settings (holding registers)
  - {key: x.filter_time, label: Filter Time, table: holding, address: 2, type: u16, writable: true, poll: slow}
  - {key: x.oc_setup, label: OC Setup, table: holding, address: 3, type: u16, writable: true, poll: slow}
  - {key: x.conductivity_unit, label: Conductivity Unit, table: holding, address: 4, type: u16, writable: true, poll: slow}
  - {key: x.temperature_unit, label: Temperature Unit, table: holding, address: 5, type: u16, writable: true, poll: slow}
  - {key: x.cell_constant, label: Cell, table: holding, address: 6, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_4ma, label: Conductivity 4mA Set Value, table: holding, address: 8, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_20ma, label: Conductivity 20mA Set Value, table: holding, address: 10, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_low_alarm, label: Conductivity Low Alarm Set Point, table: holding, address: 12, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_low_hysteresis, label: Conductivity Low Alarm Hysteresis, table: holding, address: 14, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_high_alarm, label: Conductivity High Alarm Set Point, table: holding, address: 16, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.conductivity_high_hysteresis, label: Conductivity High Alarm Hysteresis, table: holding, address: 18, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_4ma, label: Temperature 4mA Set Value, table: holding, address: 25, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_20ma, label: Temperature 20mA Set Value, table: holding, address: 27, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_low_alarm, label: Temperature Low Alarm Set Point, table: holding, address: 29, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_low_hysteresis, label: Temperature Low Alarm Hysteresis, table: holding, address: 31, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_high_alarm, label: Temperature High Alarm Set Point, table: holding, address: 33, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.temperature_high_hysteresis, label: Temperature High Alarm Hysteresis, table: holding, address: 35, type: f32, writable: true, poll: slow, verified: false}

notes:
- 'Addresses: the document''s 30001 / 40001 style references (and coil / input bit 0) converted to 0-based addresses (30001
  → input 0, 40001 → holding 0).'
- 'Serial: RS485, Modbus RTU, 8N1, 9600 (default), 14400, 19200 or 38400 baud; unit id 1 by default.'
- The document gives neither the float word order nor the meanings of the unit and OC setup values; floats are assumed most
  significant word first.
- 'Left out: display contrast and backlight (holding 0–1) and the proportional-pulse settings of the open-collector output
  (holding 20–24, 37–40).'
