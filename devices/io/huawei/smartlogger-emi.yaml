# Written from the Huawei SmartLogger ModBus Interface Definitions (issue 35, 2020-02-20).

modbusspec: 0
id: huawei-smartlogger-emi
manufacturer: Huawei
name: Environmental monitor instrument connected to a SmartLogger
kind: io

sources:
- title: SmartLogger ModBus Interface Definitions
  version: Issue 35 (2020-02-20)
  url: https://github.com/bohdan-s/Sungrow-Inverter/blob/755ae6fda3e9f2c897ccd11427e2d5df050409ee/Modbus%20Information/SmartLogger%20ModBus%20Interface%20Definitions.pdf
  sha256: 87a0b6d3b183df1d558659be610f865f0b0941387461d21e048e7212cc88dadb

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.wind_speed, label: Wind speed (WSP), table: holding, address: 40031, type: s16, unit: m/s, scale: 0.1, optional: true}
  - {key: x.wind_direction, label: Wind direction (WD), table: holding, address: 40032, type: s16, unit: °, optional: true}
  - {key: x.module_temperature, label: PV module temperature, table: holding, address: 40033, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.ambient_temperature, label: Ambient temperature, table: holding, address: 40034, type: s16, unit: °C, scale: 0.1, optional: true}
  - {key: x.irradiance, label: Total irradiance, table: holding, address: 40035, type: s16, unit: W/m2, scale: 0.1}
  - {key: x.irradiation_today_mj, label: Daily irradiation amount, table: holding, address: 40036, type: u32, unit: MJ/m2, scale: 0.001}
  - {key: x.irradiance_2, label: Total irradiance 2, table: holding, address: 40038, type: s16, unit: W/m2, scale: 0.1, optional: true}
  - {key: x.irradiation_today_mj_2, label: Daily irradiation amount 2, table: holding, address: 40039, type: u32, unit: MJ/m2, scale: 0.001, optional: true}
  - {key: x.custom_1, label: Custom 1, table: holding, address: 40041, type: s16, scale: 0.1, optional: true}
  - {key: x.custom_2, label: Custom 2, table: holding, address: 40042, type: s16, scale: 0.1, optional: true}
  - {key: x.irradiation_today, label: Daily irradiation amount, table: holding, address: 40043, type: u32, unit: kWh/m2, scale: 0.001}
  - {key: x.irradiation_today_2, label: Daily irradiation amount 2, table: holding, address: 40045, type: u32, unit: kWh/m2, scale: 0.001, optional: true}

notes:
- 'Read through the SmartLogger over Modbus TCP: the unit id is the instrument''s RS485 address as set on the SmartLogger
  (not fixed; 1 assumed here). All registers are holding registers (function 03).'
- Which values an installation has depends on the sensors fitted; the ones marked optional are assumed to be missing on some
  installations (not stated in the document).
- No identification registers in the document.
