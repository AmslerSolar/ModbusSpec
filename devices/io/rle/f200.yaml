# Written from the RLE Technologies F200 Modbus Communications guide (v4.0, 04/2016).

modbusspec: 0
id: rle-f200
manufacturer: RLE Technologies
name: Falcon F200 monitoring appliance
kind: io

sources:
- title: F200 - Modbus Communications
  version: 4.0 (04/2016), firmware 4100.1 and later
  url: https://fmssi.com/wp-content/uploads/2022/04/F200_Modbus_Registers4-0.pdf
  sha256: 2c56b34dec652f3cc2b12fddb4d57bfcd68c0fcced41dd7c8856fea67eef4a34
  archive_url: https://web.archive.org/web/20220627135939/https://fmssi.com/wp-content/uploads/2022/04/F200_Modbus_Registers4-0.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  # Digital input bit registers
  - {key: x.di_alarm_condition, label: Digital Input Alarm Condition, table: holding, address: 2, type: u16, bits: [0, 7], flags: di_alarm_on_closed, poll: slow, note: 'One bit per input: 1 = alarms when the contact is closed, 0 = when it is open.'}
  - {key: x.di_alarm_status, label: Digital Input Alarm Status, table: holding, address: 3, type: u16, bits: [0, 7], flags: di_alarm, poll: fast, note: 'One bit per input: 1 = in alarm. Only set when the input''s notification is enabled in the web interface.'}
  - {key: x.di_state, label: Digital Input Current State, table: holding, address: 4, type: u16, bits: [0, 7], flags: di_closed, poll: fast, note: 'One bit per input: 1 = closed, 0 = open.'}
  # External sensor 1
  - {key: x.sensor1_family_code, label: Family Code (External Sensor 1), table: holding, address: 8, type: u16, poll: slow, note: Sensor type code; the document lists no values.}
  - {key: x.sensor1_temperature, label: Current Temperature Reading (External Sensor 1), table: holding, address: 9, type: u16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.sensor1_temperature_high, label: High Temperature Threshold (External Sensor 1), table: holding, address: 10, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor1_temperature_low, label: Low Temperature Threshold (External Sensor 1), table: holding, address: 11, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor1_humidity, label: Current Humidity Reading (External Sensor 1), table: holding, address: 12, type: u16, unit: '%', poll: fast, optional: true, verified: false, note: Unit % RH as stated; the document gives no scale (assumed 1). Only for sensors with humidity.}
  - {key: x.sensor1_humidity_high, label: High Humidity Threshold (External Sensor 1), table: holding, address: 13, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  - {key: x.sensor1_humidity_low, label: Low Humidity Threshold (External Sensor 1), table: holding, address: 14, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  # External sensor 2
  - {key: x.sensor2_family_code, label: Family Code (External Sensor 2), table: holding, address: 15, type: u16, poll: slow, note: Sensor type code; the document lists no values.}
  - {key: x.sensor2_temperature, label: Current Temperature Reading (External Sensor 2), table: holding, address: 16, type: u16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.sensor2_temperature_high, label: High Temperature Threshold (External Sensor 2), table: holding, address: 17, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor2_temperature_low, label: Low Temperature Threshold (External Sensor 2), table: holding, address: 18, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor2_humidity, label: Current Humidity Reading (External Sensor 2), table: holding, address: 19, type: u16, unit: '%', poll: fast, optional: true, verified: false, note: Unit % RH as stated; the document gives no scale (assumed 1). Only for sensors with humidity.}
  - {key: x.sensor2_humidity_high, label: High Humidity Threshold (External Sensor 2), table: holding, address: 20, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  - {key: x.sensor2_humidity_low, label: Low Humidity Threshold (External Sensor 2), table: holding, address: 21, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  # External sensor 3
  - {key: x.sensor3_family_code, label: Family Code (External Sensor 3), table: holding, address: 22, type: u16, poll: slow, note: Sensor type code; the document lists no values.}
  - {key: x.sensor3_temperature, label: Current Temperature Reading (External Sensor 3), table: holding, address: 23, type: u16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.sensor3_temperature_high, label: High Temperature Threshold (External Sensor 3), table: holding, address: 24, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor3_temperature_low, label: Low Temperature Threshold (External Sensor 3), table: holding, address: 25, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor3_humidity, label: Current Humidity Reading (External Sensor 3), table: holding, address: 26, type: u16, unit: '%', poll: fast, optional: true, verified: false, note: Unit % RH as stated; the document gives no scale (assumed 1). Only for sensors with humidity.}
  - {key: x.sensor3_humidity_high, label: High Humidity Threshold (External Sensor 3), table: holding, address: 27, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  - {key: x.sensor3_humidity_low, label: Low Humidity Threshold (External Sensor 3), table: holding, address: 28, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  # External sensor 4
  - {key: x.sensor4_family_code, label: Family Code (External Sensor 4), table: holding, address: 29, type: u16, poll: slow, note: Sensor type code; the document lists no values.}
  - {key: x.sensor4_temperature, label: Current Temperature Reading (External Sensor 4), table: holding, address: 30, type: u16, unit: °C, scale: 0.01, poll: fast}
  - {key: x.sensor4_temperature_high, label: High Temperature Threshold (External Sensor 4), table: holding, address: 31, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor4_temperature_low, label: Low Temperature Threshold (External Sensor 4), table: holding, address: 32, type: u16, unit: °C, scale: 0.01, poll: slow}
  - {key: x.sensor4_humidity, label: Current Humidity Reading (External Sensor 4), table: holding, address: 33, type: u16, unit: '%', poll: fast, optional: true, verified: false, note: Unit % RH as stated; the document gives no scale (assumed 1). Only for sensors with humidity.}
  - {key: x.sensor4_humidity_high, label: High Humidity Threshold (External Sensor 4), table: holding, address: 34, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  - {key: x.sensor4_humidity_low, label: Low Humidity Threshold (External Sensor 4), table: holding, address: 35, type: u16, unit: '%', poll: slow, optional: true, verified: false, note: No scale stated; assumed 1.}
  # Leak detection
  - {key: x.leak_detected, label: Leak is Detected, table: holding, address: 70, type: u16, enum: leak, poll: fast}
  - {key: x.no_cable, label: No Sensing Cable is Connected to Controller, table: holding, address: 71, type: u16, enum: no_cable, poll: fast}
  - {key: x.cable_break, label: Cable Break Alarm, table: holding, address: 72, type: u16, enum: cable_break, poll: fast}

enums:
  leak: {'0': No leak, '1': Leak detected}
  no_cable: {'0': Cable is connected, '1': No cable}
  cable_break: {'0': No cable break, '1': Cable break}

flags:
  di_alarm_on_closed: {'0': Digital input 1 alarms when closed, '1': Digital input 2 alarms when closed, '2': Digital input 3 alarms when closed, '3': Digital input 4 alarms when closed, '4': Digital input 5 alarms when closed, '5': Digital input 6 alarms when closed, '6': Digital input 7 alarms when closed, '7': Digital input 8 alarms when closed}
  di_alarm: {'0': Digital input 1 in alarm, '1': Digital input 2 in alarm, '2': Digital input 3 in alarm, '3': Digital input 4 in alarm, '4': Digital input 5 in alarm, '5': Digital input 6 in alarm, '6': Digital input 7 in alarm, '7': Digital input 8 in alarm}
  di_closed: {'0': Digital input 1 closed, '1': Digital input 2 closed, '2': Digital input 3 closed, '3': Digital input 4 closed, '4': Digital input 5 closed, '5': Digital input 6 closed, '6': Digital input 7 closed, '7': Digital input 8 closed}

problems:
  - {when: {key: x.leak_detected, equals: 1}, kind: warning, text: Leak detected}
  - {when: {key: x.no_cable, equals: 1}, kind: warning, text: No leak sensing cable connected}
  - {when: {key: x.cable_break, equals: 1}, kind: warning, text: Leak sensing cable break}
  - {when: {key: x.di_alarm_status, bit: 0}, kind: warning, text: Digital input 1 alarm (bit 0)}
  - {when: {key: x.di_alarm_status, bit: 1}, kind: warning, text: Digital input 2 alarm (bit 1)}
  - {when: {key: x.di_alarm_status, bit: 2}, kind: warning, text: Digital input 3 alarm (bit 2)}
  - {when: {key: x.di_alarm_status, bit: 3}, kind: warning, text: Digital input 4 alarm (bit 3)}
  - {when: {key: x.di_alarm_status, bit: 4}, kind: warning, text: Digital input 5 alarm (bit 4)}
  - {when: {key: x.di_alarm_status, bit: 5}, kind: warning, text: Digital input 6 alarm (bit 5)}
  - {when: {key: x.di_alarm_status, bit: 6}, kind: warning, text: Digital input 7 alarm (bit 6)}
  - {when: {key: x.di_alarm_status, bit: 7}, kind: warning, text: Digital input 8 alarm (bit 7)}

notes:
- The document numbers registers 40001-style without naming a function code; they are taken as holding registers (function
  03) with address = number − 40001 (40009 → 8). Not confirmed on a device.
- The document names neither the unit id nor the port; 502 and unit 1 are assumptions. The F200 is Modbus TCP only.
- 'Temperatures are given twice: in °C × 100 at 40010… (here) and in °F × 100 at 40038/40045/40052/40059 (current, high, low
  threshold per sensor, three registers each), left out here.'
- Registers are listed as unsigned (0–65535); the document doesn't say how temperatures below 0 °C appear.
- 'Left out the per-input registers 40080–40087 (state), 40090–40097 (alarm) and 40100–40107 (alarm condition): each holds
  one bit of the bit registers 40005, 40004 and 40003.'
- No register identifies the device model or serial number, so there is no identify.
