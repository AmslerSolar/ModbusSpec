# Written from the Bolid М3000-ВВ-1020 operating manual (АЦДР.421459.003 РЭп, revision 3 of 2025-09-03).

modbusspec: 0
id: bolid-m3000-vv-1020
manufacturer: Bolid
name: M3000-VV-1020 I/O module (6 relays, 6 dry-contact and 6 × 220 V inputs)
kind: io

sources:
- title: Модуль ввода-вывода «М3000-ВВ-1020», руководство по эксплуатации АЦДР.421459.003 РЭп
  version: Изм.3, 2025-09-03
  url: https://bolid.ru/files/373/566/m3000_vv_1020_rep_sep_25.pdf
  sha256: 663cf64050c81909275453730ed7716f007cac931573fd8b046fe1782cbf6f88
  archive_url: https://web.archive.org/web/20260315090035/https://bolid.ru/files/373/566/m3000_vv_1020_rep_sep_25.pdf

connection:
  default_port: 502
  default_unit: 16
  transports:
  - rtu
  - ascii
  serial:
    baud: 115200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 36867
    type: u32
  checks:
  - table: input
    address: 36864
    type: u16
    equals: 74

points:
  # Discrete inputs: 24 V dry-contact inputs 1-6, then 220 V inputs 1-6 (base 0x80 apart)
  - {key: x.in1_24v, label: Input 1 24 V state, table: discrete, address: 0, type: bool, enum: input_state}
  - {key: x.in2_24v, label: Input 2 24 V state, table: discrete, address: 128, type: bool, enum: input_state}
  - {key: x.in3_24v, label: Input 3 24 V state, table: discrete, address: 256, type: bool, enum: input_state}
  - {key: x.in4_24v, label: Input 4 24 V state, table: discrete, address: 384, type: bool, enum: input_state}
  - {key: x.in5_24v, label: Input 5 24 V state, table: discrete, address: 512, type: bool, enum: input_state}
  - {key: x.in6_24v, label: Input 6 24 V state, table: discrete, address: 640, type: bool, enum: input_state}
  - {key: x.in1_220v, label: Input 1 220 V state, table: discrete, address: 768, type: bool, enum: input_state}
  - {key: x.in2_220v, label: Input 2 220 V state, table: discrete, address: 896, type: bool, enum: input_state}
  - {key: x.in3_220v, label: Input 3 220 V state, table: discrete, address: 1024, type: bool, enum: input_state}
  - {key: x.in4_220v, label: Input 4 220 V state, table: discrete, address: 1152, type: bool, enum: input_state}
  - {key: x.in5_220v, label: Input 5 220 V state, table: discrete, address: 1280, type: bool, enum: input_state}
  - {key: x.in6_220v, label: Input 6 220 V state, table: discrete, address: 1408, type: bool, enum: input_state}
  - {key: x.in1_24v_count, label: Input 1 24 V pulse counter, table: input, address: 1, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in2_24v_count, label: Input 2 24 V pulse counter, table: input, address: 129, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in3_24v_count, label: Input 3 24 V pulse counter, table: input, address: 257, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in4_24v_count, label: Input 4 24 V pulse counter, table: input, address: 385, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in5_24v_count, label: Input 5 24 V pulse counter, table: input, address: 513, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in6_24v_count, label: Input 6 24 V pulse counter, table: input, address: 641, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in1_220v_count, label: Input 1 220 V pulse counter, table: input, address: 769, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in2_220v_count, label: Input 2 220 V pulse counter, table: input, address: 897, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in3_220v_count, label: Input 3 220 V pulse counter, table: input, address: 1025, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in4_220v_count, label: Input 4 220 V pulse counter, table: input, address: 1153, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in5_220v_count, label: Input 5 220 V pulse counter, table: input, address: 1281, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in6_220v_count, label: Input 6 220 V pulse counter, table: input, address: 1409, type: u16, note: Counts 0→1 changes since start or reset; wraps to 0 after 65535.}
  - {key: x.in1_24v_count_reset, label: Input 1 24 V counter reset, table: coil, address: 1, type: bool, writable: true, write_only: true, note: 'Write 1 to clear the counter. The same coil sits at input base + 1 for the other inputs (0x0081 … 0x0281 for 24 V, 0x0301 … 0x0581 for 220 V).'}
  - {key: x.in1_24v_filter, label: Input 1 24 V debounce filter, table: coil, address: 2, type: bool, enum: filter_type, writable: true, poll: slow, note: 24 V inputs only; same coil at input base + 2 for inputs 2-6 (0x0082 … 0x0282).}
  # Relay outputs 1-6 (base 0x1000, 0x80 apart)
  - {key: x.out1, label: Output 1 state, table: coil, address: 4096, type: bool, enum: output_state, writable: true, note: Writing sets the PWM duty to 100 % (1) or 0 % (0).}
  - {key: x.out2, label: Output 2 state, table: coil, address: 4224, type: bool, enum: output_state, writable: true}
  - {key: x.out3, label: Output 3 state, table: coil, address: 4352, type: bool, enum: output_state, writable: true}
  - {key: x.out4, label: Output 4 state, table: coil, address: 4480, type: bool, enum: output_state, writable: true}
  - {key: x.out5, label: Output 5 state, table: coil, address: 4608, type: bool, enum: output_state, writable: true}
  - {key: x.out6, label: Output 6 state, table: coil, address: 4736, type: bool, enum: output_state, writable: true}
  - {key: x.out1_duty, label: Output 1 PWM duty, table: holding, address: 4101, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out2_duty, label: Output 2 PWM duty, table: holding, address: 4229, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out3_duty, label: Output 3 PWM duty, table: holding, address: 4357, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out4_duty, label: Output 4 PWM duty, table: holding, address: 4485, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out5_duty, label: Output 5 PWM duty, table: holding, address: 4613, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out6_duty, label: Output 6 PWM duty, table: holding, address: 4741, type: u16, unit: '%', scale: 0.1, writable: true, min: 0, max: 100, persistent: false}
  - {key: x.out1_pwm_period, label: Output 1 PWM period, table: holding, address: 4104, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out2_pwm_period, label: Output 2 PWM period, table: holding, address: 4232, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out3_pwm_period, label: Output 3 PWM period, table: holding, address: 4360, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out4_pwm_period, label: Output 4 PWM period, table: holding, address: 4488, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out5_pwm_period, label: Output 5 PWM period, table: holding, address: 4616, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out6_pwm_period, label: Output 6 PWM period, table: holding, address: 4744, type: u16, unit: s, scale: 0.1, writable: true, min: 0.1, poll: slow, note: Default 10 s.}
  - {key: x.out1_safe_duty, label: Output 1 safe PWM duty, table: holding, address: 4105, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  - {key: x.out2_safe_duty, label: Output 2 safe PWM duty, table: holding, address: 4233, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  - {key: x.out3_safe_duty, label: Output 3 safe PWM duty, table: holding, address: 4361, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  - {key: x.out4_safe_duty, label: Output 4 safe PWM duty, table: holding, address: 4489, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  - {key: x.out5_safe_duty, label: Output 5 safe PWM duty, table: holding, address: 4617, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  - {key: x.out6_safe_duty, label: Output 6 safe PWM duty, table: holding, address: 4745, type: u16, unit: '%', scale: 0.1, writable: true, poll: slow, note: Duty used after start-up and on network timeout; default 0.}
  # Network settings (take effect after a restart)
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 28672, type: u16, enum: baud_rate, writable: true, poll: slow, note: 'Factory setting 115200 Bd (value 9); the document''s table gives the default as "3 (115200)", but 3 is 9600 in its own list.'}
  - {key: x.serial_mode, label: Transmission mode and character format, table: holding, address: 28673, type: u16, enum: serial_mode, writable: true, poll: slow}
  - {key: x.modbus_address, label: RS-485 address, table: holding, address: 28676, type: u16, writable: true, min: 1, max: 247, poll: slow, note: Default 16.}
  - {key: x.network_timeout, label: Network timeout for safe output states, table: holding, address: 28680, type: u16, unit: s, writable: true, min: 0, max: 600, poll: slow, note: 0 = off (default); otherwise without a valid request in this time the outputs go to their safe duty.}
  - {key: x.interface_mode, label: Interface mode, table: holding, address: 28682, type: u16, enum: interface_mode, writable: true, poll: slow}
  # Clock
  - {key: x.clock, label: Current date and time, table: holding, address: 32768, type: datetime, length: 6, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}, writable: true, poll: slow, note: 'Year 2017-2080, one value per register.'}
  # Service data
  - {key: x.restart, label: Restart request, table: holding, address: 36864, type: u16, writable: true, poll: slow, note: Write 0x55AA (21930) to restart the module.}
  - {key: x.wifi_watchdog, label: WiFi module watchdog, table: holding, address: 36865, type: u16, unit: s, writable: true, poll: slow, note: Seconds after which the WiFi module is reset; default 40; reads back the last value written.}
  - {key: x.device_type, label: Device type, table: input, address: 36864, type: u16, poll: slow, note: 74 for this module.}
  - {key: x.hardware_version, label: Hardware version, table: input, address: 36865, type: u16, poll: slow, note: 100 per the document.}
  - {key: x.serial_high, label: Serial number bytes 5-4, table: input, address: 36866, type: u16, poll: slow}
  - {key: x.serial_low, label: Serial number bytes 3-0, table: input, address: 36867, type: u32, poll: slow}
  - {key: firmware, label: Firmware version (main firmware), table: input, address: 36869, type: u16, poll: slow, verified: false, note: Encoding not stated in the document.}

derived:
  - {key: serial, label: Serial number, sum: [{key: x.serial_high, factor: 4294967296}, {key: x.serial_low}], note: 'The serial number is 6 bytes over three registers, most significant first.'}

enums:
  input_state: {'0': Open (high voltage level), '1': Closed (low voltage level)}
  output_state: {'0': Open, '1': Closed}
  filter_type: {'0': Basic (1 kHz), '1': Extended (90 Hz)}
  baud_rate: {'0': 1200 Bd, '1': 2400 Bd, '2': 4800 Bd, '3': 9600 Bd, '4': 14400 Bd, '5': 19200 Bd, '6': 28800 Bd, '7': 38400 Bd, '8': 57600 Bd, '9': 115200 Bd}
  serial_mode: {'1': 'ASCII, 7O1', '2': 'ASCII, 7E1', '3': 'ASCII, 7N2', '4': 'RTU, 8N1', '5': 'RTU, 8O1', '6': 'RTU, 8E1', '7': 'RTU, 8N2'}
  interface_mode: {'0': Standard (WiFi and RS-485 commands kept apart), '1': Transparent (WiFi requests forwarded to the RS-485 bus)}

notes:
- Addresses are the document's Modbus data addresses, which are 0-based protocol addresses (its request examples use them
  directly, e.g. coil 0x1000 for output 1). The document lists them in decimal with the hex in brackets.
- For 220 V input 1 the 0-based addresses start at 0x0300 (state = discrete input, counter = input register, counter reset
  = coil at base + 1); each further input or output is 0x80 higher.
- 'Functions 1-6, 15, 16, 22 and 23. Factory RS-485 settings: 115200 Bd, RTU, 8N1, address 16. In firmware-update mode the
  module answers no Modbus at all and all relays are open.'
- Over WiFi the module accepts Modbus RTU frames inside TCP ("Modbus over TCP", not Modbus TCP/MBAP); the server port is set
  in the web interface and not given in the text, so 502 here is a placeholder.
- 'A copy of the most used registers sits in one holding block at 60000-60082 (0xEA60-0xEAB2) for single-request reads and
  writes (function 23): identity, clock, network settings, PWM and logic settings, output and counter-reset bit masks, and
  the 12 pulse counters at 60071-60082. The document warns its layout may move between firmware versions; it is left out here.'
- 'Left out: the per-output logic-block settings (function type, X/Y sources, delay type and time, output inversion). The
  document prints their addresses with decimal and hex swapped (e.g. "1010 (0x4112)"); read as hex 0x1010 = 4112 they follow
  the output blocks at base + 0x10 … 0x14, but this is not certain.'
- identify.serial takes only the low 4 bytes of the 6-byte serial number (the derived `serial` has all of it).
- The request examples in the document read discrete input 1 with function 1 and swap the labels of the PWM period and duty
  writes; the register tables are followed here.
