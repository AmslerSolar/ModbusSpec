# Written from the Calypso Instruments ULP STD wind meter user manual, MODBUS RTU/RS485 protocol (English version 3.0, 30.05.2023).

modbusspec: 0
id: calypso-ulp
manufacturer: Calypso Instruments
name: ULP STD ultrasonic wind meter
kind: io

sources:
- title: Ultra-Low-Power Ultrasonic STD (ULP STD) Wind Meter, User manual – MODBUS RTU/RS485 Protocol
  version: English version 3.0 (30.05.2023)
  url: https://marine-products-direct.com/wp-content/uploads/2025/04/ULP-User-Manual-Eng.-V.3-MODBUS-RS485-Protocol.pdf
  sha256: 0e86f0a3640908bd3f631d8b18bf5a7005079fb31d259a9d31b2dcf9b25e40f2

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.system_status, label: System status, table: input, address: 200, type: s16, note: 0 … 15; the document has no table for the values.}
  - {key: x.wind_speed, label: Wind speed (3 second moving average), table: input, address: 201, type: s16, unit: m/s, scale: 0.1, poll: fast}
  - {key: x.wind_direction, label: Wind direction (3 second moving average), table: input, address: 202, type: s16, unit: °, scale: 0.1, poll: fast}
  - {key: x.wind_speed_2min, label: 2 min avg wind speed, table: input, address: 203, type: s16, unit: m/s, scale: 0.1}
  - {key: x.wind_direction_2min, label: 2 min avg wind direction, table: input, address: 204, type: s16, unit: °, scale: 0.1}
  - {key: x.wind_speed_10min, label: 10 min avg wind speed, table: input, address: 205, type: s16, unit: m/s, scale: 0.1}
  - {key: x.wind_direction_10min, label: 10 min avg wind direction, table: input, address: 206, type: s16, unit: °, scale: 0.1}
  - {key: x.gust_speed, label: Wind gust speed, table: input, address: 207, type: s16, unit: m/s, scale: 0.1}
  - {key: x.gust_direction, label: Wind gust direction, table: input, address: 208, type: s16, unit: °, scale: 0.1}
  - {key: x.wind_speed_5min, label: 5 min avg wind speed, table: input, address: 210, type: s16, unit: m/s, scale: 0.1}
  - {key: x.wind_direction_5min, label: 5 min avg wind direction, table: input, address: 211, type: s16, unit: °, scale: 0.1}
  - {key: x.gust_speed_5min, label: 5 min wind gust speed, table: input, address: 212, type: s16, unit: m/s, scale: 0.1}
  - {key: x.gust_direction_5min, label: 5 min wind gust direction, table: input, address: 213, type: s16, unit: °, scale: 0.1}

notes:
- Register numbers are given from a base of 30001 (input registers, function 04); the document's own address column (200 …)
  is used as the 0-based protocol address.
- 'All values are tenths: speed 0 … 500 = 0 … 50.0, direction 0 … 3599 = 0 … 359.9°.'
- The speed unit can be set to m/s, knots or km/h with the vendor's configurator; m/s is assumed here (the register table
  names m/s for the 3 s wind speed only).
- The sensor is switched between NMEA (RS485) and Modbus output with the configurator; baud rate 2400 … 115200, 8N1. The Modbus
  section gives no default baud rate or unit id (the NMEA mode defaults to 38400); unit id 1 is assumed.
- The manual was taken from a reseller's site; the maker named in it is Calypso Instruments.
