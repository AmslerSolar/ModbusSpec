modbusspec: 0
id: openwb-dimm-kit
manufacturer: openWB
name: Dimm- & Control-Kit
kind: io

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/io_devices/dimm_kit/api.py, packages/modules/io_devices/dimm_kit/config.py

connection:
  default_port: 8899
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: x.di1, label: Digital input DI1, table: coil, address: 0, type: bool}
  - {key: x.di2, label: Digital input DI2, table: coil, address: 1, type: bool}
  - {key: x.di3, label: Digital input DI3, table: coil, address: 2, type: bool}
  - {key: x.di4, label: Digital input DI4, table: coil, address: 3, type: bool}
  - {key: x.di5, label: Digital input DI5, table: coil, address: 4, type: bool}
  - {key: x.di6, label: Digital input DI6, table: coil, address: 5, type: bool}
  - {key: x.di7, label: Digital input DI7, table: coil, address: 6, type: bool}
  - {key: x.di8, label: Digital input DI8, table: coil, address: 7, type: bool}
  - {key: x.do1, label: Digital output DO1, table: coil, address: 16, type: bool, writable: true}
  - {key: x.do2, label: Digital output DO2, table: coil, address: 17, type: bool, writable: true}
  - {key: x.do3, label: Digital output DO3, table: coil, address: 18, type: bool, writable: true}
  - {key: x.do4, label: Digital output DO4, table: coil, address: 19, type: bool, writable: true}
