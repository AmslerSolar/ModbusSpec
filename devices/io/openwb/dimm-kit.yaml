  - {key: x.do7, label: Digital output DO7, table: coil, address: 22, type: bool, writable: true}
  - {key: x.do8, label: Digital output DO8, table: coil, address: 23, type: bool, writable: true}
  - {key: x.ai1, label: Analog input AI1, table: input, address: 0, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai2, label: Analog input AI2, table: input, address: 1, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai3, label: Analog input AI3, table: input, address: 2, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai4, label: Analog input AI4, table: input, address: 3, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai5, label: Analog input AI5, table: input, address: 4, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai6, label: Analog input AI6, table: input, address: 5, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai7, label: Analog input AI7, table: input, address: 6, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}
  - {key: x.ai8, label: Analog input AI8, table: input, address: 7, type: u16, scale: 5, note: 'Raw 0-1024; openWB multiplies by 5. AI1-AI4 default to 0-5 V, AI5-AI8 to 0-25 mA.'}

notes:
- openWB reads the digital inputs and outputs in one coil read (function 01) from 0 to 23.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
