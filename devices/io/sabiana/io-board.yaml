# Written from the Sabiana MODBUS Protocol, MB EXT (v0.14, rev. 14, 2021-05-12), section "MODBUS data – I/O Board".

modbusspec: 0
id: sabiana-io-board
manufacturer: Sabiana
name: I/O board (8 digital inputs, 8 relays)
kind: io

sources:
- title: MODBUS Protocol – modbus sabiana MB EXT (fan coil)
  version: v0.14 (rev. 14, 2021-05-12)
  url: https://www.sabiana.it/sites/default/files/downloads-legacy/products/262/6189160c3b3c8_modbus-sabiana-fan-coil-ext-v014-engpdf.pdf
  sha256: b11f873109a1a5e96f93d19d628c943df10555c724a78fa7a0ae4e9434208d22

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  # controller model: I/O board
  - table: holding
    address: 256
    type: u16
    equals: 20737

points:
  - {key: x.controller_model, label: Controller model, table: holding, address: 256, type: u16, poll: slow, note: 0x5101 = I/O board.}
  - {key: x.firmware_major, label: 'Firmware release, major', table: holding, address: 257, type: u16, bits: [8, 15], poll: slow}
  - {key: x.firmware_minor, label: 'Firmware release, minor', table: holding, address: 257, type: u16, bits: [0, 7], poll: slow}
  - {key: x.in1, label: Digital input IN1, table: holding, address: 258, type: u16, enum: closed_open}
  - {key: x.in2, label: Digital input IN2, table: holding, address: 259, type: u16, enum: closed_open}
  - {key: x.in3, label: Digital input IN3, table: holding, address: 260, type: u16, enum: closed_open}
  - {key: x.in4, label: Digital input IN4, table: holding, address: 261, type: u16, enum: closed_open}
  - {key: x.in5, label: Digital input IN5, table: holding, address: 262, type: u16, enum: closed_open}
  - {key: x.in6, label: Digital input IN6, table: holding, address: 263, type: u16, enum: closed_open}
  - {key: x.in7, label: Digital input IN7, table: holding, address: 264, type: u16, enum: closed_open}
  - {key: x.in8, label: Digital input IN8, table: holding, address: 265, type: u16, enum: closed_open}
  - {key: x.relay1, label: Relay 1 state, table: holding, address: 266, type: u16, enum: relay, writable: true}
  - {key: x.relay2, label: Relay 2 state, table: holding, address: 267, type: u16, enum: relay, writable: true}
  - {key: x.relay3, label: Relay 3 state, table: holding, address: 268, type: u16, enum: relay, writable: true}
  - {key: x.relay4, label: Relay 4 state, table: holding, address: 269, type: u16, enum: relay, writable: true}
  - {key: x.relay5, label: Relay 5 state, table: holding, address: 270, type: u16, enum: relay, writable: true}
  - {key: x.relay6, label: Relay 6 state, table: holding, address: 271, type: u16, enum: relay, writable: true}
  - {key: x.relay7, label: Relay 7 state, table: holding, address: 272, type: u16, enum: relay, writable: true}
  - {key: x.relay8, label: Relay 8 state, table: holding, address: 273, type: u16, enum: relay, writable: true}

enums:
  closed_open: {'0': Closed, '1': Open}
  relay: {'0': Not active, '1': Active}

notes:
- Modbus RTU on RS485 (connectors M8 and M9), 9600 baud, 8 data bits, no parity, 1 stop bit. The slave address is set with
  DIP switches, 1…60; unit 1 here is only a default (the document's examples use 2). Port 502 only applies behind a gateway.
- Only holding registers (functions 03, 06, 16). Addresses are the document's hexadecimal addresses, used unchanged.
- Firmware release in 0x0101 is the major release in the high byte and the minor release in the low byte (0x0106 = 1.06).
