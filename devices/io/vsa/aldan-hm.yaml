notes:
- The document gives 0-based protocol addresses (decimal and hex); used as they are.
- Input register 0 says how 32-bit values are ordered, one bit per order (bit 0 ABCD = default, bit 1 DCBA, bit 2 BADC, bit
  3 CDAB). The word-order detection here covers ABCD and CDAB only; DCBA and BADC also swap the bytes within each register,
  which a reader must handle itself.
- Each channel gives the HART primary, secondary, tertiary and quaternary variables (PV, SV, TV, QV) of the connected field
  device as 32-bit floats, plus a HART status word and one unit code per variable. The unit codes and the status bits are
  HART codes the document doesn't list; the values' units therefore depend on the field device.
- Left out - the per-channel HART transaction and error counters (holding 19–82, 32-bit), the pass-through registers for arbitrary
  HART commands (holding 94–223, input 230–359), the field-device data block (tag, descriptor, message, long tag, date, final
  assembly number, device id at holding 224–273) and the coils that reset the per-channel counters (coils 2–17).
- Transport, serial settings and default unit id are not stated in the document; RS485 / Modbus RTU and unit 1 are assumed.
- The module type register's value is not given, and the serial number's encoding is not stated, so the file has no identify
  section.
