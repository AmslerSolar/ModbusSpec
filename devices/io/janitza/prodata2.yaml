enums:
  off_on:
    '0': 'Off'
    '1': 'On'
  no_yes:
    '0': 'No'
    '1': 'Yes'
  sensor:
    '0': PT100
    '1': PT1000
    '2': KTY83
    '3': KTY84
  disable_active:
    '0': Disable
    '1': Active
  polarity:
    '0': Current flow if active (NOC)
    '1': Current flow if not active (NCC)
flags:
  battery:
    '0': Battery capacity exhausted, clock has stopped
    '1': Battery capacity nearly exhausted
    '2': Battery capacity low
problems:
- when:
    key: x.overtemperature
    equals: 1
  kind: warning
  text: Overtemperature at the temperature input
- when:
    key: x.battery
    bit: 0
  kind: fault
  text: Battery exhausted, clock has stopped (bit 0)
- when:
    key: x.battery
    bit: 1
  kind: warning
  text: 'Battery nearly exhausted: replace it (bit 1)'
- when:
    key: x.battery
    bit: 2
  kind: warning
  text: 'Battery low: should be replaced (bit 2)'
notes:
- The list names function 03 and 04 for reading and 06, 16 and 23 for writing, and starts at address 0, so these are taken
  as protocol addresses. It doesn't state this in words, and doesn't say that 03 and 04 read the same registers; the holding
  table is used here, unverified like every point.
- The listed addresses deliver big-endian data; add 32768 to an address for little-endian. The device also converts Modbus
  TCP to Modbus RTU for devices behind it, so what answers on another unit id may be one of those.
- 'Serial: 8 data bits, no parity. The list gives 2 stop bits for the ProData 2 and 1 or 2 external, while register 4 has
  default 0 = 1 bit; 115200 baud is the default of register 2, whose range says 0–7 though only 0–4 are explained. The list
  of rates has 11500 where the register has 115.2 kbps. Port 502 and unit 1 and 125 registers per request are not documented;
  assumed.'
- 'Identification: the device name must be printable, plus the ranges of communication and input settings; the only fixed
  values anywhere are these narrow settings. The serial number at 100 isn''t checked.'
- 'String lengths: the device name''s unit column says 64, the description''s 256, which match the row spacing at two characters
  per register. Names and units have 16 registers by spacing; not stated otherwise. Which unit a scaled value has is configured
  by the user, not fixed.'
- 'Only some RD/WR rows are writable here: pulse counters and names are marked RD/WR too but are read-only in this file,
  as writing them isn''t needed to read values and destroys counts. Writing an output or temperature setting changes what
  the outputs do; input scale factors change every scaled value afterwards.'
- 'Left out: network and NTP settings (2–14), counter and energy resets (116–117), value descriptions (700–1179), tariff
  settings (1700–1707, 1940–1979), daylight saving settings (1925–1937), clock timer channels (9000–9188), the 32-bit pulse
  counts (2060–2088), the float copies of scaled values (2150–2178), the counts and scaled values per tariff (2240–3678),
  and the event log of 16 events per input (3680–4879).'
