# Written from the Brainboxes Modbus TCP Manual ("Using Modbus TCP with Brainboxes products", no version).

modbusspec: 0
id: brainboxes-ed
manufacturer: Brainboxes
name: ED Ethernet I/O modules (ED-588, ED-516, ED-538, ED-527)
kind: io

sources:
- title: Brainboxes Modbus TCP Manual (Using Modbus TCP with Brainboxes products)
  version: no version
  url: https://www.brainboxes.com/files/catalog/product/ED/ED-516/documents/Brainboxes%20Modbus%20TCP%20Manual.pdf
  sha256: 7fe3af1bf165f8c2f1fa25df39adcc59ede03364d2a9d3c80eedf8772d4026f8
  archive_url: https://web.archive.org/web/20250811131200/https://www.brainboxes.com/files/catalog/product/ED/ED-516/documents/Brainboxes%20Modbus%20TCP%20Manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: ed588, name: 'ED-588 (8 digital inputs, 8 digital outputs)'}
  - {id: ed516, name: ED-516 (16 digital inputs)}
  - {id: ed538, name: 'ED-538 (8 digital inputs, 4 digital outputs)'}
  - {id: ed527, name: ED-527 (16 digital outputs)}

points:
  - {key: x.digital_inputs, label: Read digital inputs, table: input, address: 32, type: u16, flags: inputs, models: [ed588, ed516, ed538], note: Bit n = input n. Also as discrete inputs 0x0000 ff. and coils 0x0020 ff.}
  - {key: x.di0_counter, label: DI counter value 0, table: input, address: 0, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di1_counter, label: DI counter value 1, table: input, address: 1, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di2_counter, label: DI counter value 2, table: input, address: 2, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di3_counter, label: DI counter value 3, table: input, address: 3, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di4_counter, label: DI counter value 4, table: input, address: 4, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di5_counter, label: DI counter value 5, table: input, address: 5, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di6_counter, label: DI counter value 6, table: input, address: 6, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di7_counter, label: DI counter value 7, table: input, address: 7, type: u16, models: [ed588, ed516, ed538]}
  - {key: x.di8_counter, label: DI counter value 8, table: input, address: 8, type: u16, models: [ed516]}
  - {key: x.di9_counter, label: DI counter value 9, table: input, address: 9, type: u16, models: [ed516]}
  - {key: x.di10_counter, label: DI counter value 10, table: input, address: 10, type: u16, models: [ed516]}
  - {key: x.di11_counter, label: DI counter value 11, table: input, address: 11, type: u16, models: [ed516]}
  - {key: x.di12_counter, label: DI counter value 12, table: input, address: 12, type: u16, models: [ed516]}
  - {key: x.di13_counter, label: DI counter value 13, table: input, address: 13, type: u16, models: [ed516]}
  - {key: x.di14_counter, label: DI counter value 14, table: input, address: 14, type: u16, models: [ed516]}
  - {key: x.di15_counter, label: DI counter value 15, table: input, address: 15, type: u16, models: [ed516]}
  - {key: x.digital_outputs, label: Set/read digital outputs, table: holding, address: 32, type: u16, flags: outputs, writable: true, models: [ed588, ed538, ed527], note: 'Bit n = output n (ED-538: bits 0–3). Also as coils 0x0000 ff., written with function 05 / 15.'}
  - {key: x.output_overload, label: Output overload flags, table: input, address: 1024, type: u16, flags: overload, models: [ed588, ed538, ed527], note: Bit n = output n overloaded. Also as discrete inputs 0x0400 ff.}

flags:
  inputs: {'0': Input 0, '1': Input 1, '2': Input 2, '3': Input 3, '4': Input 4, '5': Input 5, '6': Input 6, '7': Input 7, '8': Input 8, '9': Input 9, '10': Input 10, '11': Input 11, '12': Input 12, '13': Input 13, '14': Input 14, '15': Input 15}
  outputs: {'0': Output 0, '1': Output 1, '2': Output 2, '3': Output 3, '4': Output 4, '5': Output 5, '6': Output 6, '7': Output 7, '8': Output 8, '9': Output 9, '10': Output 10, '11': Output 11, '12': Output 12, '13': Output 13, '14': Output 14, '15': Output 15}
  overload: {'0': Output 0 overload, '1': Output 1 overload, '2': Output 2 overload, '3': Output 3 overload, '4': Output 4 overload, '5': Output 5 overload, '6': Output 6 overload, '7': Output 7 overload, '8': Output 8 overload, '9': Output 9 overload, '10': Output 10 overload, '11': Output 11 overload, '12': Output 12 overload, '13': Output 13 overload, '14': Output 14 overload, '15': Output 15 overload}

problems:
  - {when: {key: x.output_overload, not: 0}, kind: fault, text: 'Digital output overload (flags 0x{value:X})'}

notes:
- The modules speak an ASCII protocol by default; Modbus TCP has to be switched on in their web page (port 502, up to 8 connections,
  idle timeout 0 = never).
- Addresses are the manual's logical (0-based) addresses. The DI counters are also holding registers 0x0000 ff.; coil 0x0200
  + n (functions 05 / 15) clears counter n.
- The manual's worked example for the ED-527 numbers the outputs from coil 0x0001, which disagrees with its own table (0x0000
  ff.); the table is used.
- No register tells the models apart, so the user picks the model. The unit id isn't stated; 1 is assumed.
