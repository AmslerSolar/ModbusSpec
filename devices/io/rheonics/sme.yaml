  - {key: error_code, label: Error value, table: input, address: 514, type: u16, poll: fast, note: Error state of the sensor; the document gives no code table.}

  # Parameter 0: Viscosity median
  - {key: x.viscosity_median, label: Parameter 0 value as float (Viscosity median), table: input, address: 40, type: f32, unit: cP, poll: fast, verified: false, note: 'In the unit set for the parameter (unit register, enum unit); cP is assumed as the default.'}
  - {key: x.viscosity_median_status, label: Parameter 0 status, table: input, address: 43, type: u16, flags: parameter_status, poll: fast}
  - {key: x.viscosity_median_unit, label: Parameter 0 Unit, table: input, address: 46, type: u16, enum: unit, poll: slow}
  # Parameter 1: Density median
  - {key: x.density_median, label: Parameter 1 value as float (Density median), table: input, address: 48, type: f32, unit: g/cm³, poll: fast, verified: false, note: 'In the unit set for the parameter (unit register, enum unit); g/cm³ is assumed as the default.'}
  - {key: x.density_median_status, label: Parameter 1 status, table: input, address: 51, type: u16, flags: parameter_status, poll: fast}
  - {key: x.density_median_unit, label: Parameter 1 Unit, table: input, address: 54, type: u16, enum: unit, poll: slow}
