flags:
  sensor_status: {'0': PLL frequency mismatch (E10), '1': PLL not locked (E01), '2': PLL locked on a wrong frequency (E02), '3': ASB communication error (sensor electronics), '4': Temperature sensor failed, '5': Sensor too hot, '6': Communication error between the SME boards, '7': Serial changed, '8': Sensor not clean (SRV only), '9': Sensor in air}
  parameter_status: {'0': General error, '1': Config error, '2': Hardware error, '3': Dependent error, '4': Not ready, '5': Internal error, '6': Calibration error, '7': Further use, '8': Parameter calibrated, '9': Model loaded, '10': Filtering active, '11': Not stable, '12': Warning lower, '13': Warning upper, '14': Alarm lower, '15': Alarm upper}

problems:
  - {when: {key: x.sensor_status, bit: 0}, kind: fault, text: PLL frequency mismatch (E10)}
  - {when: {key: x.sensor_status, bit: 1}, kind: fault, text: PLL not locked (E01)}
  - {when: {key: x.sensor_status, bit: 2}, kind: fault, text: PLL locked on a wrong frequency (E02)}
  - {when: {key: x.sensor_status, bit: 3}, kind: fault, text: Sensor electronics communication error (ASB)}
  - {when: {key: x.sensor_status, bit: 4}, kind: fault, text: Temperature sensor failed}
  - {when: {key: x.sensor_status, bit: 5}, kind: fault, text: Sensor too hot}
  - {when: {key: x.sensor_status, bit: 6}, kind: fault, text: Communication error between the electronics boards}
  - {when: {key: x.sensor_status, bit: 7}, kind: warning, text: Sensor serial changed}
  - {when: {key: x.sensor_status, bit: 8}, kind: warning, text: Sensor not clean}
  - {when: {key: x.sensor_status, bit: 9}, kind: warning, text: Sensor in air}
  - {when: {key: x.viscosity_median_status, bit: 0}, kind: warning, text: 'Viscosity median: parameter error (status 0x{value:X})'}
  - {when: {key: x.density_median_status, bit: 0}, kind: warning, text: 'Density median: parameter error (status 0x{value:X})'}
  - {when: {key: x.temperature_median_status, bit: 0}, kind: warning, text: 'Temperature median: parameter error (status 0x{value:X})'}

notes:
- Addresses are the document's 0-based PDU addresses (its 3000xx register numbers minus 300001). Measurements are input registers
  (function 04); the density coefficients are holding registers (function 03 / 16).
- Unit identifier 255; Modbus TCP on port 502. The SME also has an RS-485 Modbus RTU port, whose settings (address, baud rate,
  parity) are set with the configuration software; this document covers Modbus TCP only.
- 'Each of the 23 parameters takes eight registers from 40 + 8 × n: value as f32 (+0), value × 100 as s16 (+2), status (+3),
  uncalibrated value as f32 (+4) and unit index (+6). The s16 scaled values and the uncalibrated values are left out here.
  The document''s table has two typos for parameter 12 (uncalibrated value and unit printed as 300041 / 300043); the addresses
  here follow the pattern (140, 142).'
- Units follow the parameter's unit register (enum unit). Temperature defaults to °C (stated); viscosity cP and density g/cm³
  are assumed defaults (the examples show cP and unit index 24 = g/cc). An SRV sensor's viscosity is dynamic viscosity × density,
  with a density of 1 g/cc assumed unless the density coefficients are set.
- The 32-bit floats are big-endian, high word first (the document's example 0x41B15C29 = 22.17 °C); the document warns some
  masters need byte or word swapping.
- The document gives no identifying register (model, serial), so a network search cannot recognise the device.
