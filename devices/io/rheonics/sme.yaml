modbusspec: 0
id: rheonics-sme
manufacturer: Rheonics
name: SME sensor electronics for SRV, SRD, DVP and DVM viscosity / density sensors (Modbus TCP)
kind: io

sources:
- title: ModTCP Operators Manual – Modbus TCP field device specification, Rheonics SME (MTCP-OP-2403)
  version: 1 (16.02.2024, firmware 3.30/15)
  url: https://rheonics.com/wp-content/uploads/2024/04/Rheonics-Modbus-TCP-Manual_MTCP-OP-2403.pdf
  sha256: 28aa3a4c803c79f0147e844d176e3b7abdb72b7c9a5e0cf57bb548f8e2b4a7ed
  archive_url: https://web.archive.org/web/20250906003551/https://rheonics.com/wp-content/uploads/2024/04/Rheonics-Modbus-TCP-Manual_MTCP-OP-2403.pdf

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
