notes:
- The document gives holding register references with the 40001 offset ("40101" is protocol address 100); the addresses here
  are those minus 40001. Functions 01, 03, 05 and 06. A register a device doesn't have answers with exception 02.
- Floats are IEEE 754 single precision in two consecutive registers; the word order isn't stated, high word first is assumed.
  Texts hold two characters per register (8 characters here).
- Most sensors also give their readings as scaled 16-bit integers at 100… (e.g. temperature × 100, humidity × 10, pH × 100);
  only the float copies at 200… are listed, as their scaling doesn't change with the unit setting. Temperatures follow the
  °C / °F unit setting (toggle register 1001); °C is the default assumed here.
- Devices sit on a GrowNET bus behind an LX2 ModLINK (RS485, 19200–115200 bit/s, any format, set with the PC utility) or an
  LX1 USB link (115200 8N1). The LX2's default is 19200 8N1; unit 1 is an assumption.
- The device type can't be read reliably (the model text register's values aren't listed), so the user picks it. The same
  register means different things on different device types.
- 'Left out: calibration registers (offset, span and analog-output trim at 1100…1401), the SXQ spectral bin values F1–F13
  (200 + 6…30), and the integer copies of the readings.'
- A GCX controller makes the same devices available over Modbus TCP (port 502 or 4040), each device on its own unit id (1–100
  bus 0, 101–200 bus 1) with a generic layout (name text at 0, integer values at 100…, floats at 200…, throttle at 300…, output
  status / force-off / force-on coils), plus control function, recipe and workspace registers on unit ids 201–204 and 301+
  at user-chosen index registers. That layout isn't described here.
