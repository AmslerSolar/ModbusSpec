modbusspec: 0
id: agrowtek-grownet
manufacturer: Agrowtek
name: GrowNET sensors, relay / I/O modules, dosing pumps and light modules (Modbus RTU)
kind: io

sources:
- title: Agrowtek Instruction Manual – MODBUS (GrowNET devices, GCX and BDX)
  version: undated
  url: https://www.agrowtek.com/doc/im/IM_MODBUS.pdf
  sha256: a30ddc9a6e272bd9e8fe96235b7aa4d759022d0db0eed5d4cb7d58c326c77e22

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 3
    type: str
    length: 4

model_choice: user

models:
  - {id: climate, name: 'Environment / weather sensors (SXC, SXE, SXW)'}
  - {id: gas, name: CO2 gas sensor (SXG)}
  - {id: hydro, name: 'Hydroponics sensors (SXH, PHX)'}
  - {id: oxygen, name: Dissolved oxygen sensor (SXO2)}
  - {id: vwc, name: 'VWC sensor hubs (HXT, HXG)'}
  - {id: pump, name: Dosing pumps (ADi)}
  - {id: io, name: 'Relay and I/O modules (RX, RD, DX, VX series)'}
  - {id: light, name: Digital light module (LXD)}
  - {id: quantum, name: Quantum light sensor (SXQ)}

