notes:
- Addresses are the document's decimal protocol addresses (its "Dec" column); its 6-digit references add 300001 (input registers,
  function 04) or 400001 (holding registers, function 03).
- The document does not state the byte and word order of the 32-bit floats, nor the unit id; big-endian and unit 1 are assumed,
  so all points are unverified.
- Values of the inputs and outputs are in the units of their configuration (input type and range), which the register map
  does not fix.
- Default IP address 192.168.0.34 (holding 4802, four bytes); the Modbus port is settable.
- 'Left out: the outputs of the internal function blocks (PID, constants, lookup tables, logic, math, latches, DTC reactions),
  CAN and Modbus receive signals, and the whole configuration section (inputs, outputs, function blocks, diagnostics, J1939,
  CAN messages, network).'
- The register map has no identification registers and no fault or alarm status registers.
