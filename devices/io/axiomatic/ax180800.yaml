notes:
- Addresses are the document's decimal protocol addresses (its "Dec" column); its 6-digit references add 300001 (input registers,
  function 04), 400001 (holding registers, function 03) or 100001 (discrete inputs, function 02).
- The document does not state the byte and word order of the 32-bit floats, nor the unit id; big-endian and unit 1 are assumed,
  so all points are unverified.
- The output states are also readable as discrete inputs 1024–1027.
- Default IP address 192.168.0.34 (holding 4050, four bytes); the Modbus port and timeout are settable.
- 'Left out: thermocouple mV and raw readings (input 1089–1127, 1137–1175), RTD raw readings (1217, 1219), the outputs of
  the internal function blocks (math, logic, latches, lookup tables, programmable logic), CAN receive signals, constant signals,
  and the configuration section (inputs, RTD and thermocouple blocks, relays, function blocks, fault reactions, J1939, CAN
  messages, network).'
- The register map has no identification registers and no fault or alarm status registers; the relay states are not readable.
