notes:
- 'Values aren''t live: write a command to holding 0 (0-based; 40001 in the document), wait until input 1 is no longer 1, then read the cooked values. Salinity readings also fill the moisture values.'
- 'To set a mask and start a reading in one write, write the command and masks together with function 16: the probe applies the higher addresses first.'
- 'The document''s addresses are 30001 and 40001 style with relative addresses given; 30001 and 40001 are address 0 here. It gives relative 0x0019 for 30025; 30025 is relative 0x0018 by its own rule and by the layout, so that is used.'
- '32-bit values, floats and masks alike, have the low word in the lower register; each register is big-endian. So the word order here is little.'
- 'The interface sleeps after 15 seconds without traffic. The message that wakes it is not recognised, so a reader has to send it again. It answers 1 second after power on.'
- 'Register contents are lost when power goes. Depths, the detected masks and 30100 come back from the configuration at power on.'
- 'A cooked value reads Not-a-Number for a failed sensor or a value out of range, and 0.0 for a sensor not scanned. Moisture is +0.0 to +101.0. The document gives no units for the cooked values, so none are given here. Depth has no unit either.'
- 'The map has room for 32 sensors per type, but the document says probes have at most 16 and the second word of each mask is unused; this file has sensors 1–16.'
- 'The probe''s address has no stated default; 1 is assumed. It is set with Sentek''s configuration tool, as are the serial settings. Defaults from the document: RTU, 9600, no parity, 2 stop bits.'
- 'At most 32 input registers in a read, and 9 holding registers in a read or write.'
- 'Interface firmware before 1.4.1 answers only input 0–17, 99, 100–163 and 256–383, and holding 0–4: no temperature or humidity values. Points marked optional may then be refused with an illegal address.'
- 'Not in points: function 17 Report Slave ID gives the text SENTEK, revision and probe serial number; the format has no point for it. Modbus TCP is not in the document; the port is only a placeholder.'
