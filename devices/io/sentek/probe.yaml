  - {key: x.salinity_sampled_mask, label: 'Salinity: Mask of sampled sensors', table: input, address: 16, type: u32, flags: sensors, poll: slow}
  - {key: x.temperature_selected_mask, label: 'Temperature: Sensor Selection for current scan', table: input, address: 6, type: u32, flags: sensors, poll: slow}
  - {key: x.temperature_detected_mask, label: 'Temperature: Mask of detected sensors', table: input, address: 12, type: u32, flags: sensors, poll: slow}
  - {key: x.temperature_sampled_mask, label: 'Temperature: Mask of sampled sensors', table: input, address: 18, type: u32, flags: sensors, poll: slow, optional: true, note: Needs interface firmware 1.4.1 or later.}
  - {key: x.humidity_selected_mask, label: 'Humidity: Sensor Selection for current scan', table: input, address: 20, type: u32, flags: sensors, poll: slow, optional: true, note: Needs interface firmware 1.4.1 or later.}
