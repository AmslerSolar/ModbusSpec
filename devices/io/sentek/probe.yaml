modbusspec: 0
id: sentek-probe
manufacturer: Sentek
name: Soil probe with Modbus interface
kind: io

sources:
- title: Sentek Modbus Interface Manual, RS232 / RS485 Hardware Manual
  version: "3.7"
  url: https://sentektechnologies.com/download/sentek-modbus-manual-rs485-232-ver-3-6/
  sha256: 08438316a26ddbdbaf0a40b9630d328b402e313af92b1a34a11b32b785a4cc58
  date: '2025-05'
  language: en

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - ascii
  serial:
    baud: 9600
    format: 8N2
  limits:
    max_registers: 32

encoding:
  byte_order: big
  word_order: little

identify:
  checks:
  # low byte 32 sensors per type, high byte 0
  - table: input
    address: 99
    type: u16
    equals: 32
  - table: input
    address: 1
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
  - table: holding
    address: 0
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5

points:
  - {key: x.last_command, label: Last measurement selection, table: input, address: 0, type: u16, enum: command}
  - {key: state, label: Measurement Status, table: input, address: 1, type: u16, enum: status}
  - {key: x.moisture_selected_mask, label: 'Moisture: Sensor Selection for current scan', table: input, address: 2, type: u32, flags: sensors, poll: slow}
  - {key: x.moisture_detected_mask, label: 'Moisture: Mask of detected sensors', table: input, address: 8, type: u32, flags: sensors, poll: slow}
  - {key: x.moisture_sampled_mask, label: 'Moisture: Mask of sampled sensors', table: input, address: 14, type: u32, flags: sensors, poll: slow}
