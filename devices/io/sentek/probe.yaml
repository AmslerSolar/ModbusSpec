  command: {'0': No action, '1': Read sensors in the masks, '2': Read all moisture sensors, '3': Read all salinity sensors, '4': Read all temperature sensors, '5': Read all humidity sensors}
  status: {'0': No measurement, '1': Measurement in progress, '2': Completed with no errors, '3': Completed with errors}

