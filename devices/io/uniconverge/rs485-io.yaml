notes:
- One file for Uniconverge's 'Legacy Converter (IO to RS485)' module range; all five datasheets use the same address layout
  (inputs from discrete input 1000, relay outputs from coil 3000, analog inputs from input register 4000) and differ only
  in channel counts. Pick the model; it can't be read from the device.
- Addresses are taken as the datasheets print them, per function code, as 0-based protocol addresses (they are round numbers,
  not 1xxxx/3xxxx-style references). Not stated in the documents; assumed.
- Modbus RTU over 2-wire RS485 only. Baud rate, framing, default unit id and request limits are not stated in the datasheets;
  unit 1 is assumed.
- Digital inputs are isolated 24 V DC sink/source inputs; outputs are form A (NO) relays rated 5 A at 240 V AC / 30 V DC;
  analog inputs take 4–20 mA. A 5-second system and communication watchdog is mentioned but not described.
- No identification, serial number, status or fault registers are documented.
