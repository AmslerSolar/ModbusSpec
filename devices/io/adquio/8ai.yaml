# Written from the Adquio 8 analog inputs Modbus module datasheet (V 1.0, 12/10/2023).

modbusspec: 0
id: adquio-8ai
manufacturer: Adquio
name: 8 analog inputs Modbus module (ADQ-SA-8AI)
kind: io

sources:
- title: Datasheet Adquio 8 analog inputs Modbus module
  version: 1.0 (12/10/2023)
  url: https://adquio.com/wp-content/uploads/2023/11/Datasheet-Adquio-8-Analog-Inputs-modbus-module-1.0-en_uk.pdf
  sha256: 89f62bac53e2f6a61cae46a2a09f38d1d4e9f78dce652603c971aa52a881ecc8

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.input_1_voltage, label: Analog input 1 (0-24 V), table: holding, address: 9, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_2_voltage, label: Analog input 2 (0-24 V), table: holding, address: 10, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_3_voltage, label: Analog input 3 (0-24 V), table: holding, address: 11, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_4_voltage, label: Analog input 4 (0-24 V), table: holding, address: 12, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_5_voltage, label: Analog input 5 (0-24 V), table: holding, address: 13, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_6_voltage, label: Analog input 6 (0-24 V), table: holding, address: 14, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_7_voltage, label: Analog input 7 (0-24 V), table: holding, address: 15, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_8_voltage, label: Analog input 8 (0-24 V), table: holding, address: 16, type: u16, unit: V, scale: 0.01, poll: fast}
  - {key: x.input_1_raw, label: Analog input 1 RAW, table: holding, address: 1, type: u16, note: 0–16383 over 0–24 V.}
  - {key: x.input_2_raw, label: Analog input 2 RAW, table: holding, address: 2, type: u16}
  - {key: x.input_3_raw, label: Analog input 3 RAW, table: holding, address: 3, type: u16}
  - {key: x.input_4_raw, label: Analog input 4 RAW, table: holding, address: 4, type: u16}
  - {key: x.input_5_raw, label: Analog input 5 RAW, table: holding, address: 5, type: u16}
  - {key: x.input_6_raw, label: Analog input 6 RAW, table: holding, address: 6, type: u16}
  - {key: x.input_7_raw, label: Analog input 7 RAW, table: holding, address: 7, type: u16}
  - {key: x.input_8_raw, label: Analog input 8 RAW, table: holding, address: 8, type: u16}
  - {key: x.power_led, label: Power LED, table: holding, address: 0, type: u16, writable: true, min: 0, max: 1, poll: slow}
  - {key: x.error_led, label: Error LED, table: holding, address: 17, type: u16, writable: true, min: 0, max: 1, poll: slow}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 18, type: u16, poll: slow, note: The address currently set on the DIP switches.}

notes:
- Addresses are the document's register addresses, used as 0-based protocol addresses (function 03, writes with 06).
- The Modbus address 1–64 is set with six DIP switches (all off = 1, binary count + 1); register 18 shows the active one.
- The datasheet gives no serial settings, no identification registers and no fault registers.
- The technical data name a 0–10 V input range, the register table 0–24 V; the voltage registers hold volts × 100 either way.
