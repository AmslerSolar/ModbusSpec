# Written from the RS485 750cm Ultrasonic Level Sensor (V1.0) and RS485 500cm Ultrasonic Level Sensor (v1.0) manuals.

modbusspec: 0
id: seeed-ultrasonic
manufacturer: Seeed Studio
name: A01 / A12 ultrasonic distance / level sensor, RS485
kind: io

sources:
- title: RS485 750cm Ultrasonic Level Sensor (A01A)
  version: V1.0
  url: https://files.seeedstudio.com/wiki/RS485-Ultrasonic-Level-Sensor/RS485-750cm-Ultrasonic-Level-Sensor.pdf
  sha256: f5884a433a84721692ecf5c6cc434f2bf433fa44780c959d4e73269ddcd827f6
  archive_url: https://web.archive.org/web/20230320140019/https://files.seeedstudio.com/wiki/RS485-Ultrasonic-Level-Sensor/RS485-750cm-Ultrasonic-Level-Sensor.pdf
- title: RS485 500cm Ultrasonic Level Sensor (A12A)
  version: v1.0
  url: https://files.seeedstudio.com/wiki/RS485-Ultrasonic-Level-Sensor/RS485-500cm-Ultrasonic-Level-Sensor.pdf
  sha256: b9d1b963e97d01bfa20a9d1df8da6b1c82cf962c148f2c9ef40af4d8710b94de
  archive_url: https://web.archive.org/web/20230315223933/https://files.seeedstudio.com/wiki/RS485-Ultrasonic-Level-Sensor/RS485-500cm-Ultrasonic-Level-Sensor.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

model_choice: user

models:
  - {id: a01, name: A01A (750 cm)}
  - {id: a12, name: A12A (500 cm)}

points:
  - {key: x.distance, label: The calculated value of distance, table: holding, address: 256, type: u16, unit: mm, note: 'Filtered distance to the target; the sensor measures on request and answers after about 500 ms. Range 28–750 cm (A01A, with bell mouth) or 25–500 cm (A12A).'}
  - {key: x.distance_realtime, label: Real-time distance value, table: holding, address: 257, type: u16, unit: mm, note: 'Single unfiltered measurement, answer after about 100 ms.'}
  - {key: temperature, label: Temperature, table: holding, address: 258, type: s16, unit: °C, scale: 0.1, note: Module temperature (used for its compensation).}
  # Settings
  - {key: x.modbus_address, label: Slave address, table: holding, address: 512, type: u16, writable: true, min: 1, max: 254, poll: slow, note: Default 1; 0xFF is the broadcast address.}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 513, type: u16, enum: baud_rate, writable: true, poll: slow, models: [a01], note: Listed in the 750 cm (A01A) manual only.}

enums:
  baud_rate: {'1': 2400 bps, '2': 4800 bps, '3': 9600 bps, '4': 14400 bps, '5': 19200 bps, '6': 38400 bps, '7': 57600 bps, '8': 76800 bps}

notes:
- Seeed Studio's manuals; they name the modules A01A (750 cm) and A12A (500 cm) but no module maker.
- Both manuals give the same register map; the 750 cm one adds the baud rate register. The models can't be told apart over
  Modbus.
- Addresses are the document's hex register addresses (0-based protocol addresses). Read with function 03, write with 06.
  Big-endian (high byte first).
- The distance is from the sensor to the surface; a level needs the mounting height, which the sensor doesn't know.
