# Written from the Denkovi USB 16 Relay Board RTU ModBus Controlled user manual (21 Aug 2017).

modbusspec: 0
id: denkovi-usb16-relay
manufacturer: Denkovi
name: USB 16 relay board, Modbus RTU (DAE-RO16-…-MODBUS-USB)
kind: io

sources:
- title: USB 16 Relay Board RTU ModBus Controlled - User Manual
  version: 21 Aug 2017
  url: http://denkovi.com/Documents/USB-16-Relay-ModBus-RTU/current-version/UserManual_USB16_ModBus.pdf
  sha256: f37bb1122ffaae94ce9664ba19d6a75ba96cdc4707bc003f7a30aa0897a454d1
  archive_url: https://web.archive.org/web/20240629065039/https://denkovi.com/Documents/USB-16-Relay-ModBus-RTU/current-version/UserManual_USB16_ModBus.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    min_interval_ms: 20

encoding:
  byte_order: big
  word_order: big

points:
  # Relays (coils 0-15 = relay 1-16; read with 01, write with 05 / 15)
  - {key: x.relay_1, label: Relay 1, table: coil, address: 0, type: bool, writable: true}
  - {key: x.relay_2, label: Relay 2, table: coil, address: 1, type: bool, writable: true}
  - {key: x.relay_3, label: Relay 3, table: coil, address: 2, type: bool, writable: true}
  - {key: x.relay_4, label: Relay 4, table: coil, address: 3, type: bool, writable: true}
  - {key: x.relay_5, label: Relay 5, table: coil, address: 4, type: bool, writable: true}
  - {key: x.relay_6, label: Relay 6, table: coil, address: 5, type: bool, writable: true}
  - {key: x.relay_7, label: Relay 7, table: coil, address: 6, type: bool, writable: true}
  - {key: x.relay_8, label: Relay 8, table: coil, address: 7, type: bool, writable: true}
  - {key: x.relay_9, label: Relay 9, table: coil, address: 8, type: bool, writable: true}
  - {key: x.relay_10, label: Relay 10, table: coil, address: 9, type: bool, writable: true}
  - {key: x.relay_11, label: Relay 11, table: coil, address: 10, type: bool, writable: true}
  - {key: x.relay_12, label: Relay 12, table: coil, address: 11, type: bool, writable: true}
  - {key: x.relay_13, label: Relay 13, table: coil, address: 12, type: bool, writable: true}
  - {key: x.relay_14, label: Relay 14, table: coil, address: 13, type: bool, writable: true}
  - {key: x.relay_15, label: Relay 15, table: coil, address: 14, type: bool, writable: true}
  - {key: x.relay_16, label: Relay 16, table: coil, address: 15, type: bool, writable: true}

  # Holding registers (read with 03, write with 06 / 16)
  - {key: x.relay_1_auto_off_time, label: Relay 1 Auto Off Time Units, table: holding, address: 0, type: u16, writable: true, poll: slow, note: 0–65535 timer units; the unit per relay is set in register 17.}
  - {key: x.relay_2_auto_off_time, label: Relay 2 Auto Off Time Units, table: holding, address: 1, type: u16, writable: true, poll: slow}
  - {key: x.relay_3_auto_off_time, label: Relay 3 Auto Off Time Units, table: holding, address: 2, type: u16, writable: true, poll: slow}
  - {key: x.relay_4_auto_off_time, label: Relay 4 Auto Off Time Units, table: holding, address: 3, type: u16, writable: true, poll: slow}
  - {key: x.relay_5_auto_off_time, label: Relay 5 Auto Off Time Units, table: holding, address: 4, type: u16, writable: true, poll: slow}
  - {key: x.relay_6_auto_off_time, label: Relay 6 Auto Off Time Units, table: holding, address: 5, type: u16, writable: true, poll: slow}
  - {key: x.relay_7_auto_off_time, label: Relay 7 Auto Off Time Units, table: holding, address: 6, type: u16, writable: true, poll: slow}
  - {key: x.relay_8_auto_off_time, label: Relay 8 Auto Off Time Units, table: holding, address: 7, type: u16, writable: true, poll: slow}
  - {key: x.relay_9_auto_off_time, label: Relay 9 Auto Off Time Units, table: holding, address: 8, type: u16, writable: true, poll: slow}
  - {key: x.relay_10_auto_off_time, label: Relay 10 Auto Off Time Units, table: holding, address: 9, type: u16, writable: true, poll: slow}
  - {key: x.relay_11_auto_off_time, label: Relay 11 Auto Off Time Units, table: holding, address: 10, type: u16, writable: true, poll: slow}
  - {key: x.relay_12_auto_off_time, label: Relay 12 Auto Off Time Units, table: holding, address: 11, type: u16, writable: true, poll: slow}
  - {key: x.relay_13_auto_off_time, label: Relay 13 Auto Off Time Units, table: holding, address: 12, type: u16, writable: true, poll: slow}
  - {key: x.relay_14_auto_off_time, label: Relay 14 Auto Off Time Units, table: holding, address: 13, type: u16, writable: true, poll: slow}
  - {key: x.relay_15_auto_off_time, label: Relay 15 Auto Off Time Units, table: holding, address: 14, type: u16, writable: true, poll: slow}
  - {key: x.relay_16_auto_off_time, label: Relay 16 Auto Off Time Units, table: holding, address: 15, type: u16, writable: true, poll: slow}
  - {key: x.relays_mode, label: Relays Mode Register, table: holding, address: 16, type: u16, writable: true, poll: slow, note: 'One bit per relay (bit 0 = relay 1 … bit 15 = relay 16): 0 = manual, 1 = auto off.'}
  - {key: x.timer_units, label: Timer Units Register, table: holding, address: 17, type: u16, writable: true, poll: slow, note: 'One bit per relay (bit 0 = relay 1): 0 = 100 ms per unit, 1 = 1 s per unit.'}
  - {key: x.slave_id, label: Slave ID Register, table: holding, address: 18, type: u16, writable: true, min: 1, max: 247, poll: slow, note: Values outside this range make the board misbehave.}
  - {key: x.relays_state, label: Relays State Register, table: holding, address: 19, type: u16, writable: true, poll: slow, note: 'One bit per relay (bit 0 = relay 1): the states applied at power-up when the startup mode is 1.'}
  - {key: x.startup_mode, label: Relays Startup Mode Register, table: holding, address: 20, type: u16, enum: startup_mode, writable: true, poll: slow}
  - {key: firmware, label: Version Register, table: holding, address: 21, type: u16, scale: 0.01, poll: slow, note: Read only; 100 = v1.00.}

enums:
  startup_mode: {'0': All relays off, '1': States from the relays state register, '2': States of the last change}

notes:
- Addresses are the document's coil and register numbers, which it uses as 0-based protocol addresses (coil 0 = relay 1, holding
  register 0 = relay 1 auto off time).
- The board is a USB device (FTDI FT232RL virtual COM port) speaking Modbus RTU; there is no RS485 or TCP interface. Default
  unit id 1.
- At least 20 ms between two commands.
- Function 17 (report slave id) answers with the unit id and the version (×100); sent to unit id 0xF8 it always answers, to
  recover a forgotten unit id.
- The document has no serial number, model or fault registers, so the board can't be identified on the bus.
