enums:
  comport_config: {'0': 'No parity, 2 stop bits', '1': 'Even parity, 1 stop bit', '2': 'Odd parity, 1 stop bit'}
  ui_function: {'1': 0-10 V, '2': 4-20 mA, '3': 10K type 3/G, '4': 10K type 3A1, '5': 10K type 4A1, '6': 10K type 2, '7': 20K type 6A1, '8': 30K type 6A1, '9': Digital input, '10': Scaled value (V), '11': Scaled value (mA), '12': 10K NTC Carel}
  system_unit: {'0': °C, '1': °F}
  timeout_status: {'0': Inactive, '1': Active}

flags:
  status1: {'0': System fault}
  digital_inputs: {'0': DI1 on, '1': DI2 on}
  relays: {'0': Relay 1 on, '1': Relay 2 on, '2': Relay 3 on, '3': Relay 4 on, '4': Relay 5 on, '5': Relay 6 on}
  overrides: {'0': Relay 1 overridden, '1': Relay 2 overridden, '2': Relay 3 overridden, '3': Relay 4 overridden, '4': Relay 5 overridden, '5': Relay 6 overridden, '6': AO1 overridden, '7': AO2 overridden, '8': AO3 overridden, '9': AO4 overridden}
  system_options: {'0': AO1 reverse, '1': AO2 reverse, '2': AO3 reverse, '3': AO4 reverse, '4': AI1 reverse, '5': AI2 reverse, '6': AI3 reverse, '7': AI4 reverse, '8': AI5 reverse, '9': AI6 reverse, '10': AI7 reverse, '11': AI8 reverse, '12': DI1 reverse, '13': DI2 reverse, '14': Inhibit output override, '15': Fahrenheit}

problems:
  - {when: {key: x.status1, bit: 0}, kind: fault, text: System fault}
  - {when: {key: x.timeout_status, equals: 1}, kind: warning, text: Network timeout active (outputs in fail-safe mode)}
  - {when: {key: x.output_override, not: 0}, kind: warning, text: 'Output overridden by a hardware switch (0x{value:X})'}

notes:
- 'Addresses: the document gives the protocol (0-based) address next to the 4xxxx number (40001 = 0); the protocol address
  is used.'
- 'Holding registers only (functions 03, 06, 16). Bit string registers: read, modify, write; reserved bits are ignored on
  write.'
- DIP switch DS1-4 selects BACnet (off) or Modbus (on). Modbus unit id = DS2 binary value + 1 (all off = 1, the default),
  up to 247.
- 'Serial: 9600, 19200, 38400 or 57600 baud, by DS1-1 / DS1-2 (all off = 9600); default framing no parity, 2 stop bits.'
- 'Universal inputs (11–18): unit and scale follow the input function. 0-10 V and 4-20 mA: × 0.01 V / mA; thermistors: × 0.01
  °C or °F (system unit, register 54 bit 15); digital input and scaled values: scale 1 (the 0.01 here is then wrong). 32767
  is the default value, read here as no value (assumed).'
- 'Pulse counts and accumulators are two registers each, ''(0)'' and ''(1)''; which one is the high word isn''t stated: ''(0)''
  read as the low word (assumed). The accumulator counts prescaler rollovers of the pulse count.'
- The document labels register 142 'DI1 Pulse Count (1)'; by its position it is the second half of DI2's count.
- 'Left out: input offsets and scaling (34–41, 55–86), analog output modes and voltage limits (42–53), fail-safe modes and
  presets (87–100) and pulse prescalers (103–122). The BACnet object list of the same document isn''t described here.'
- 'Identification: the high byte of register 0 is the Neptronic device id, 105 for the CMMB.'
