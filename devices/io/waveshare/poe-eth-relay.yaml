notes:
- The board accepts only one Modbus TCP connection at a time.
- 'No register tells the model: reading more coils than the board has relays gives an exception, so the project finds the
  relay count by reading 30, 16, 8 coils from address 0 until one succeeds.'
- Relay coils also take 0x5500 (FC05) to toggle; 0x0100 + channel toggles one relay and 0x01FF all relays (write only).
- 'Timed pulses: FC05 to 0x0200 + channel switches the relay on and 0x0400 + channel off, and the board switches back by itself;
  the value field is the time in 100 ms steps (at most 0x7FFF) instead of 0xFF00 / 0x0000.'
- There is no serial number register; the project uses the MAC address as the identity.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
