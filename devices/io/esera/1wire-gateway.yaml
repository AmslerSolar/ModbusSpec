notes:
- 'The addresses are taken as the document lists them, as 0-based protocol addresses: its request example reads 61030 with
  start address bytes 238/102. Whether the 40100… sensor addresses are meant the same way (and not as 4xxxx references) is
  not stated; assumed.'
- The document allows function codes 3 and 4 for words, 1 and 2 for bits, 5, 6 and 16 for writing; that both read the same
  registers is assumed.
- Default unit id not stated; the request examples use 1. Assumed.
- Words and double words are big-endian (HL LH, HH HL LH LL).
- Each 1-Wire device (OWD) n = 1…30 has a block at 40000 + n × 100. What each register holds depends on the sensor or actuator
  type in that slot (Auto-E-Connect); only the temperature, status and part number are generic. Scaling and units of sensor
  values are not stated, so they are given raw.
- Actuator slots (switch modules, 8-fold outputs) hold input / output status words instead of sensor values; their bits can
  also be read as coils / discrete inputs at register × 16 (e.g. 1632–1639 for OWD 1). Writing outputs uses the same blocks.
  Left out here.
- Status 10 (no device present) is normal for unused slots.
- Time and date can be set by writing 61030 / 61035.
- For gateways without web server (up to manufacturing year 2023). Newer gateways with web server use esera-eco.
- Modbus TCP via port 5000 by default (configurable, e.g. 502, with the Network Config Tool). RTU is fixed at 19200 baud 8N1.
  At most 20 data points per request; poll no faster than every 500 ms, and wait at least 25 ms between requests.
- ECO 100 and Station 200 detect the protocol (ESERA ASCII or Modbus) from the first command received; after power-on they
  talk Modbus.
- Per slot the document also lists operating voltage / input status (+1), humidity (+3), dew point (+5), brightness (+7),
  air quality (+9) and error counter (+13), varying with the sensor type; left out.
