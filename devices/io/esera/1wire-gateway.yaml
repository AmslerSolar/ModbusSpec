modbusspec: 0
id: esera-1wire-gateway
manufacturer: ESERA
name: 1-Wire Gateway 10 / 11 / 20, ECO 100, Station 200 (without web server)
kind: io

sources:
- title: ESERA Interface-Manual Modbus V1.0
  version: V1.0 R1.2 (2023)
  url: https://download.esera.de/esera_doku/Handbuecher/Interface-Manual_Modbus_V1.0.pdf
  sha256: 2e33ff3de47725bd9a0b6f8ea3cb66fd20629904da0e446b2d8cfa5f6fca07cd

connection:
  default_port: 5000
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 20
    min_interval_ms: 500
  input_equals_holding: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 61020
    type: str
    length: 9
  checks:
  - table: holding
    address: 61039
    type: u16
    range:
    - 0
    - 30
  - table: holding
    address: 40111
    type: u32
    in:
    - 0
    - 5
    - 10
  # serial number; a device answering 0 or FFFFh everywhere is not this one
  - table: holding
    address: 61020
    type: str
    length: 9
    printable: true

points:
  # System variables
  - {key: x.gateway_number, label: Gateway no., table: holding, address: 60000, type: u16, poll: slow}
  - {key: x.item_number, label: Item no., table: holding, address: 60001, type: u16, poll: slow, note: ESERA part number of the gateway.}
  - {key: firmware, label: Firmware version, table: holding, address: 61000, type: str, length: 4, poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 61010, type: str, length: 3, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 61020, type: str, length: 9, poll: slow}
  - {key: x.rtc_time, label: Time (RTC), table: holding, address: 61030, type: str, length: 4, poll: slow, note: 'Text hh:mm:ss.'}
  - {key: x.rtc_date, label: Date (RTC), table: holding, address: 61035, type: str, length: 4, poll: slow, note: Text dd.mm.yy.}
  - {key: x.owd_count, label: OWD quantity, table: holding, address: 61039, type: u16, poll: slow, note: Number of 1-Wire sensors / actuators stored.}
  # Gateway I/O (only some gateways, see notes)
  - {key: x.binary_inputs, label: Binary inputs (Gateway 2 / 20), table: holding, address: 1, type: u16, optional: true}
  - {key: x.binary_outputs, label: Binary outputs (Gateway 2 / 20), table: holding, address: 2, type: u16, optional: true, writable: true, note: Also coils 32–36.}
  - {key: x.analog_output, label: Analog output (Gateway 2 / 20), table: holding, address: 3, type: u16, optional: true, writable: true}
  # OWD 1 (1-Wire device slot 1)
  - {key: x.owd1_temperature, label: OWD 1 temperature, table: holding, address: 40100, type: s16, optional: true, verified: false, note: Raw value; unit and scaling not stated.}
  - {key: x.owd1_status, label: OWD 1 status, table: holding, address: 40111, type: u32, enum: owd_status, optional: true}
  - {key: x.owd1_part_number, label: OWD 1 part number / type, table: holding, address: 40115, type: u32, optional: true, poll: slow}
