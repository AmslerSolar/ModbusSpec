# Written from the Zhongsheng User Manual for Temperature and Humidity Acquisition Series (RS485 version) (V1.2).

modbusspec: 0
id: zhongsheng-temperature-humidity
manufacturer: Zhongsheng
name: Temperature and humidity acquisition module (SHT30), RS485
kind: io

sources:
- title: Zhongsheng User Manual for Temperature and Humidity Acquisition Series (RS485 version) (温湿度采集系列使用手册(RS485版), machine-translated
    English copy)
  version: V1.2
  url: https://dl.artronshop.co.th/%E6%B8%A9%E6%B9%BF%E5%BA%A6%E9%87%87%E9%9B%86%E7%B3%BB%E5%88%97%E4%BD%BF%E7%94%A8%E6%89%8B%E5%86%8C(RS485%E7%89%88).pdf
  sha256: 1a9e4be3ebc5170cb0f98627bd9954c08c38e9cb23ddb44b1c9a401885aff147
  archive_url: https://web.archive.org/web/20240805220505/https://dl.artronshop.co.th/%E6%B8%A9%E6%B9%BF%E5%BA%A6%E9%87%87%E9%9B%86%E7%B3%BB%E5%88%97%E4%BD%BF%E7%94%A8%E6%89%8B%E5%86%8C(RS485%E7%89%88).pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.temperature, label: temperature value (float), table: input, address: 2, type: f32, unit: °C}
  - {key: x.humidity, label: humidity value (float), table: input, address: 4, type: f32, unit: '%'}
  - {key: x.temperature_coded, label: temperature value, table: input, address: 0, type: u16, poll: slow, note: '0.1 °C; values of 10000 and more are negative: −(raw − 10000) × 0.1 (10250 = −25.0 °C). Use the float register 2 instead.'}
  - {key: x.humidity_tenths, label: humidity value, table: input, address: 1, type: u16, unit: '%', scale: 0.1, poll: slow, note: 'Same value as the float at 4, one decimal.'}
  # Settings
  - {key: x.modbus_address, label: RS485 bus address, table: holding, address: 10, type: u16, writable: true, poll: slow, min: 1, max: 255, note: Default 1; takes effect after a power cycle.}
  - {key: x.baud_rate, label: Baud rate setting, table: holding, address: 11, type: u16, enum: baud_rate, writable: true, poll: slow, note: Default 1 (9600); takes effect after a power cycle.}

enums:
  baud_rate: {'0': 4800 bps, '1': 9600 bps, '2': 14400 bps, '3': 19200 bps, '4': 38400 bps, '5': 56000 bps, '6': 57600 bps, '7': 115200 bps}

notes:
- Made by Zhongsheng Technology (Dongguan) Co., Ltd.; the copy read is a machine-translated English version of the Chinese
  manual.
- The document gives protocol addresses (0000H) next to PLC addresses (30001 / 40011); the protocol addresses are used. The
  six measurement registers 0–5 can be read as input registers (04) or holding registers (03); the settings are holding registers
  10 and 11 (written with 06 or 10).
- The 16-bit temperature uses an offset coding for negative values (see the point), which can't be expressed as a scale; the
  32-bit float copies (big-endian) are used as the main values.
- The module also comes with CAN or Ethernet interfaces; this file covers the RS485 Modbus RTU version only.
