# Written from the Gipen GP32 Modbus/TCP beállítási leírás (V1.0.1, valid from 2020-03-01).

modbusspec: 0
id: gipen-gp32
manufacturer: Gipen
name: GP32 IP temperature / humidity measuring systems
kind: io

sources:
- title: GP32 IP alapú mérőrendszerek Modbus/TCP beállítási leírás
  version: V1.0.1 (2020-03-01)
  url: https://www.gipen.hu/docs/GP32_Modbus_TCP_beallitas.pdf
  sha256: 27f99604badf8d1296f09642939f8ddab12e4f0bdb530b63183248d81cec35e6

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: t2, name: GP32-T2 / H2}
  - {id: t4, name: GP32-T4 / H4}
  - {id: t6, name: GP32-T6 / H6}
  - {id: t2h1, name: GP32-T2H1}

points:
  - {key: x.sensor1_temperature, label: Sensor 1 temperature, table: holding, address: 0, type: u16, unit: °C, scale: 0.1, models: [t2, t4, t6]}
  - {key: x.sensor2_temperature, label: Sensor 2 temperature, table: holding, address: 1, type: u16, unit: °C, scale: 0.1, models: [t2, t4, t6]}
  - {key: x.sensor3_temperature, label: Sensor 3 temperature, table: holding, address: 2, type: u16, unit: °C, scale: 0.1, models: [t4, t6]}
  - {key: x.sensor4_temperature, label: Sensor 4 temperature, table: holding, address: 3, type: u16, unit: °C, scale: 0.1, models: [t2, t4, t6], verified: false, note: The document lists this register for the 2-sensor models too (while sensor 3 is only on T4/T6); possibly a slip in the document.}
  - {key: x.sensor5_temperature, label: Sensor 5 temperature, table: holding, address: 4, type: u16, unit: °C, scale: 0.1, models: [t6]}
  - {key: x.sensor6_temperature, label: Sensor 6 temperature, table: holding, address: 5, type: u16, unit: °C, scale: 0.1, models: [t6]}
  - {key: x.sensor1_humidity, label: Sensor 1 humidity, table: holding, address: 1, type: u16, unit: '%', scale: 0.1, models: [t2h1]}
  - {key: x.sensor2_temperature, label: Sensor 2 temperature, table: holding, address: 2, type: u16, unit: °C, scale: 0.1, models: [t2h1]}

notes:
- Registers are given as 40001 ff. (holding, function 03); converted to 0-based addresses by subtracting 40001.
- 'Scaling: the register table says divide by 10, the text below it says by 100, but its examples (220 → 22.0 °C) use 10;
  0.1 is taken.'
- The values are stated as UINT16; how temperatures below 0 °C are coded is not stated.
- The models can't be told apart over Modbus; the register layout differs per model (the T2H1 has humidity in 40002).
- Port (default 502) and unit id (default 1) can be changed in the device's web interface. Only one Modbus client may be connected
  at a time.
- The document doesn't say whether H2/H4/H6 models also have humidity registers; it lists only temperatures for them.
