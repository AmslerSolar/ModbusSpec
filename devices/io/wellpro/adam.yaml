notes:
- The document is a one-page table from Shanghai Wellpro Electric Technology (上海纬朴电气科技有限公司), re-hosted by TapHome. It gives
  per module only the channel type, function codes and address range.
- 'Addresses converted from the document''s 1-based references: 00001 → coil 0, 10001 → discrete input 0, 40001 → holding
  register 0.'
- Relays and digital outputs are coils (read 01, write 05 / 15); digital inputs are discrete inputs (02); the register channels
  are holding registers (read 03; the WP3076 analog output also write 06).
- The document doesn't say what the DS and T channels measure, nor the type, unit or scale of the register channels; they
  are given as raw unsigned 16-bit values (assumed).
- Serial settings and the default unit id aren't stated; unit 1 is assumed.
- The modules can't be told apart from the bus and have no serial number register; the user picks the model.
