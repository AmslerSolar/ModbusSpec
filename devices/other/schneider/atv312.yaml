  eti_extended_status_word: {'0': Write parameters not authorized, '1': Parameter consistency check enabled, '2': Fault reset authorized, '4': Motor running, '5': DC injection active, '6': Transient state, '7': Motor thermal overload alarm, '8': Excessive braking alarm, '9': Accelerating, '10': Decelerating, '11': Current limit alarm, '12': Fast stop in progress}
  lrs1_extended_status: {'1': Drive detected fault, '2': Motor running, '4': Frequency threshold reached, '5': High speed reached, '6': Current threshold reached, '7': Speed reference reached, '8': Motor thermal overload alarm, '9': Brake control in progress, '12': Loss of 4-20 mA, '14': Drive thermal overload alarm}
  lrs3_channel_status: {'0': Reference uses Fr2, '1': Command uses Fr2/Cd2, '2': ACC2/dE2 active, '3': CL2 current limit active, '11': Motor 1 active, '12': Motor 2 active}
