notes:
- The document is a bare register map published by EMSNI; it names no product. The registers describe a monitoring unit for
  up to three measured circuits, 16 circuit breakers, a station battery, a modem and GPS.
- Addresses are given as 1-based 40001 / 10001 references; converted to 0-based protocol addresses (40100 = holding 99, 10100
  = discrete 99).
- 'Function 03 (holding registers) and 02 (discrete inputs) only. Serial: 19200 or 9600 bps, no parity; address 1–127. Data
  and stop bits, default address and the TCP port are not stated (8N1, 1 and 502 assumed).'
- Every register is one 16-bit value. Signedness is not stated; power factor, kW and kvar are assumed signed, their direction
  is unknown. kW / kvar / kVA have no stated scale (whole units assumed).
- Energies are split into a kWh and an MWh register; the derived totals assume the kWh register holds the part below 1 MWh
  (not stated).
- 'Left out: per-phase kvar / kVA, reactive and apparent energy, the per-breaker trip / close statistics (40500…42040: operation
  counters, current and I²t accumulators, operate / aux times, coil currents, pulse widths) and the trip battery statistics
  (42200…42209).'
- 'Circuit fault and breaker fault indicators are reported as warnings: they describe the monitored network, not the unit
  itself.'
