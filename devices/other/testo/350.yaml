notes:
- 'The testo 350 analyser box speaks Modbus RTU through the testo Modbus adapter (RS485 on screw terminals, powered from the
  instrument''s probe socket; the adapter must be the last device on the bus). 9600 baud 8N1, fixed. All data are input registers:
  read with function 04 (function 03 is not supported). The document gives 0-based hex register addresses, used here as they
  are. The unit id is the testo bus address (3 when none is set; restart the analyser box after changing it). Answers take
  up to 400 ms; leave at least 10 ms between frames. Without a Control Unit attached a watchdog switches the instrument off
  (battery) or to standby (mains) when no Modbus command arrives for 60 s.'
- 'Measured values are a list of up to 25 "ViewValues" whose content depends on the selected measurement and display settings:
  each slot has an ident (0x3100…, enum value_id; the document says more idents exist on request), a float value (0x3200…)
  and a unit code (0x3400…, enum unit; 0xFFFF or 99 = slot not used). Unused slots read 0xFFFFFFFF (NaN). A value that cannot
  be shown reads a raw code instead of a float: 0x81 over range, 0x82 under range, 0x83 out of range, 0x84 defect, 0x85 not
  yet available, 0x86 sensor waking up (as floats these are tiny denormal numbers, ~1e-43), 0xFFFFFFFF other.'
- 'Not included: the recommended display resolution per slot (0x3500…0x3518, exponent of the last digit in the low byte, 0x80
  = unused), the dilution factor per slot (0x3600…0x3631, f32), and the write-only registers 0x2008 (dilution setting, needs
  the fresh-air valve and range extension options) and 0x4020 (write 0x5A to acknowledge the bias-voltage warning after a
  mains interruption).'
- Messages 0x4001…0x400A list up to ten active messages, most severe first; the problems use the first one's category (2 =
  error, the instrument no longer works; 1 = warning). The document's code tables for device and gas sensor errors are not
  reproduced; the instrument's own message text is at 0x4010.
