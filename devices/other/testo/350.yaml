modbusspec: 0
id: testo-350
manufacturer: Testo
name: testo 350 flue gas analyser with Modbus adapter
kind: other

sources:
- title: Modbus-Adapter für testo 350, Bedienungsanleitung
  version: 0970 3570 de 02, 03.2026
  url: https://static.testo.com/image/upload/Instruction-manual-and-Software/Instruction-manuals/Modbus-adapter-for-testo-350-de-Bedienungsanleitung.pdf
  sha256: d59eb5bd8934ba1f4c1bea2538f99ad318effee951c66d0adb9dea1a4d63ddd8
- title: Adaptateur Modbus pour testo 350, Mode d'emploi
  version: '03.2026'
  url: https://static.testo.com/image/upload/Instruction-manual-and-Software/Instruction-manuals/Modbus-adapter-for-testo-350-fr-Mode-d-emploi.pdf
  sha256: 5d9d445f8a3dbe705351d603483989f859f573ce2b6f87ecc0f0353c92f7ea31

connection:
  default_port: 502
  default_unit: 3
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 125
    max_gap: 0
    min_interval_ms: 10
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 4097
    type: u32
  checks:
  - table: input
    address: 4096
    type: u16
    equals: 350

points:
  # Identity
  - {key: x.device_type, label: Device type, table: input, address: 4096, type: u16, poll: slow, note: Always 350 (0x015E) on a testo 350.}
  - {key: serial, label: Device serial number, table: input, address: 4097, type: u32, poll: slow}
  - {key: x.firmware_major, label: Firmware version (major), table: input, address: 4099, type: u16, bits: [8, 15], poll: slow}
  - {key: x.firmware_minor, label: Firmware version (minor), table: input, address: 4099, type: u16, bits: [0, 7], poll: slow}

  # Measuring system state and settings
  - {key: x.application, label: Measurement application, table: input, address: 8192, type: u16, enum: application, writable: true, poll: slow}
  - {key: x.measurement_type, label: Measurement type, table: input, address: 8193, type: u16, enum: measurement_type, writable: true, poll: slow, note: Only single (spot) measurements; measurement programs are not reachable over Modbus.}
  - {key: state, label: Measurement status, table: input, address: 8194, type: u16, enum: measurement_state, writable: true, poll: fast, note: 'Reading gives the state of the current measurement. Writing sends a command instead: 0 start, 1 stop and save, 2 cancel, 3 zero (skipped if already done), 4 rinse until clean, 6 forced zero, 7 endless rinse, 9 forced zero of the pressure sensor during a measurement; 5 and 8 are blocked.'}
  - {key: x.fuel_id, label: Fuel ID, table: input, address: 8195, type: u16, enum: fuel, writable: true, poll: slow, note: The fuel names listed are those of US instruments; other country versions have further fuels (not listed in the document). Read back after writing to confirm.}
  - {key: x.fresh_air_valve, label: Fresh air valve, table: input, address: 8196, type: u16, enum: fresh_air_valve, writable: true, poll: slow, note: 'Normally switched by the instrument. Write only 0 or 1, and only when the read state is not 2 (switching not allowed).'}
  - {key: x.standby, label: Standby, table: input, address: 8198, type: u16, enum: standby, writable: true, poll: slow, note: 1 = standby on mains (battery charging) or switched off on battery; 0 = operate (needs mains; at least 5 s without Modbus afterwards).}
  - {key: x.cxhy_sensor_on, label: CxHy sensor on/off, table: input, address: 9547, type: u16, enum: on_off, writable: true, poll: slow, note: Switching the sensor on starts a zeroing; wait for it and check for errors before starting a measurement.}

  # Measured values ("ViewValues"): up to 25 slots in display order. What a slot holds depends on the measurement
  # and the user's settings: read the slot's ident and unit before reading values.
  - {key: x.view_value_count, label: Number of ViewValues, table: input, address: 12288, type: u16, poll: slow}
  - {key: x.view_value_1_id, label: 'ViewValue[0] ident', table: input, address: 12544, type: u32, enum: value_id, invalid: [4294967295], poll: slow}
  - {key: x.view_value_1, label: 'ViewValue[0] value', table: input, address: 12800, type: f32, poll: fast}
  - {key: x.view_value_1_unit, label: 'ViewValue[0] unit', table: input, address: 13312, type: u16, enum: unit, invalid: [65535], poll: slow}
