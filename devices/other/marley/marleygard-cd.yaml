# Written from the MarleyGard CD controller supplemental Modbus/TCP user manual Z1069148 (issued 4/2018, data dictionary rev. JA. 12.1).

modbusspec: 0
id: marley-marleygard-cd
manufacturer: Marley
name: MarleyGard CD water treatment controller (conductivity, pH, ORP)
kind: other

sources:
- title: 'MarleyGard CD controller supplemental: Modbus/TCP communications, user manual Z1069148'
  version: data dictionary rev. JA. 12.1
  url: https://spxcooling.com/wp-content/uploads/Z1069148.pdf
  sha256: 0646f55967ab8f8066becd2cc78261b241a2485b5b4862c926fe890303e14e47
  date: 2018-04
  number: Z1069148
  language: en
  devices:
  - MarleyGard CD

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

identify:
  serial:
    table: holding
    address: 16
    type: str
    length: 16
  checks:
  - table: holding
    address: 32
    type: str
    length: 16
    printable: true
  - table: holding
    address: 48
    type: str
    length: 4
    printable: true
  - table: holding
    address: 52
    type: str
    length: 4
    printable: true
  - table: holding
    address: 56
    type: s16
    range:
    - 0
    - 7

points:
  # Controller data
  - {key: x.controller_name, label: Name, table: holding, address: 0, type: str, length: 16, poll: slow}
  - {key: serial, label: Serial Number, table: holding, address: 16, type: str, length: 16, poll: slow}
  - {key: firmware, label: Firmware Version, table: holding, address: 32, type: str, length: 16, poll: slow}
  - {key: x.date, label: Date, table: holding, address: 48, type: str, length: 4, poll: slow}
  - {key: x.time, label: Time, table: holding, address: 52, type: str, length: 4, poll: slow}
  - {key: x.day_of_week, label: Day of Week, table: holding, address: 56, type: s16, poll: slow}
