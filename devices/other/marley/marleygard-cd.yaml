notes:
- "The document gives neither function codes nor frame examples, nor a table for any register, and says nothing about writing. Everything here is unverified (`defaults`), and nothing is marked writable, also not the configuration data."
- "Addresses: read as 1-based, since the map starts at 0001 and every block at x001: address 0001 is holding 0, 1001 is holding 1000, 3001 is holding 3000. This, and function 03 for all of them, are assumptions."
- "Types: Short and Long are read as signed 16 and 32 bit integers, the document only says integer. Float is IEEE 32 bit, big-endian word order assumed. Strings have two characters per register, high byte first assumed. Controller Data sizes come from the columns, e.g. Name at 0001 takes 16 registers for 32 characters."
- "No units or scales are given for any register, and none are added. System and auxiliary temperatures follow the Temperature Scale register (holding 1168) at most: the document gives neither the unit nor the values of that register."
- "Multi-count rows are expanded: each row gives a start address, register size and count, and each next row starts right after it. `_1` to `_4` are the row's [1-4], which likely match SYS1 to SYS4 of the alarm table, though the document doesn't say so."
- "Alarm bits: the document numbers bits 1 to 16 in each register (2001:1 to 2001:16). They are mapped to bit 0 (least significant) to bit 15, assumed: the document doesn't say which end is bit 1. If they count from the top instead, each alarm sits at another bit. Each system has five words: SYS1 2001–2005, SYS2 2008–2012, SYS3 2015–2019, SYS4 2022–2026; mA inputs 2029 and 2030. The flags tables are shared since the layout is the same for each system. Registers 2006, 2007 etc. are not listed."
- "Problems: only the high, low, limit and no flow bits are reported, all as warnings. That choice is ours: the document doesn't explain the bits or say which are alarms. The bits named just COND, pH, ORP, TIMER, DIGITAL INPUT, NOTE, ALL ALARMS, MCND and pH2 are kept as flags with no problem rule since their meaning isn't explained."
- "The name describes the controller from its registers (conductivity, pH, ORP and temperature setpoints and sensors, makeup water, relays, water meters, flow meters): the document itself never says what the controller is for, only that it talks to SCADA, HMI and building systems and to a browser service."
- "Connection: the transport is Modbus/TCP over Ethernet per the document. Port 502, unit 1 and 125 registers per request are assumed; a building system must be on the same subnet as the controller."
- "Document inconsistencies: the introduction calls it a CP controller once while the title says CD. The 4-20 mA input row is named 1–6 but counts 8 (see those points). The spelling of pH varies between the systems. Controller Data has no column headers; they are taken from the later tables."
- "identify: firmware, date and time must be printable text and the day of week a small number. The document gives no fixed value (the name and serial have no documented content), so this is a structural fit only, resting on the assumed table and addressing; the 0–7 range for the day of week is assumed."
