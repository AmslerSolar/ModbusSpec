enums:
  server_class: {'1': UPS, '2': Air, '3': PMP, '4': PDU, '5': Monitor}
  system_status: {'1': Normal operation, '2': Startup, '8': Normal with warning, '16': Normal with alarm, '32': Abnormal operation}
  restart_procedure: {'0': Auto, '1': Manual}
  active_source: {'0': None, '1': Input 1, '2': Input 2}
  preferred_source: {'0': No source, '1': Source 1, '2': Source 2}
  switch_state: {'0': Unknown, '1': Open, '2': Closed, '3': Not installed}

problems:
