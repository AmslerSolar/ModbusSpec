notes:
- The registers are served by a Vertiv IntelliSlot (IS-UNITY-DP) or RDU101 / RDU120 network card in the switch, over Modbus
  TCP or RTU (RS485, 9600, 19200 or 38400 baud, 8N1).
- 'Addresses: the document numbers registers 1-based per table (10001 discrete inputs, 30001 input registers, 40001 holding
  registers); here number − 10001, − 30001 or − 40001.'
- Where the document gives a scale, the raw value is divided by it (scale 10 → × 0.1).
- Default unit id and TCP port aren't stated in the document; 1 and 502 assumed.
- Vertiv asks for no more than two reads and two writes per second on average. The document allows up to 127 registers per
  read; 125 is the Modbus maximum used here.
- 'The PowerSwitch 7000 is a static transfer switch: it feeds the load from one of two sources. state is the source that feeds
  the load now; the l1–l3 values and powers are the load side.'
- 'The map has two sets of input values: "STS Input 1/2" (at the static switch, kept here as source1/source2) and "Input 1/2"
  (the source inputs; only their alarm bits are kept). The glossary describes the three groups of under/overvoltage alarms
  as source input, static switch input and static switch output.'
- The document types the output voltages (30650–30655) as Int16, unlike the input voltages; kept as given.
- 'Left out: the line-to-line voltages, the ground currents of the STS inputs, all alarm thresholds (in %, and the frequency
  deviation thresholds), the Input 1/2 voltage and frequency registers (30614–30640), the heatsink temperatures of both sources
  (30420–30492), the System Diagnostic board blocks 1–17 (10001–10262: communication, configuration, firmware and power supply
  alarms per board), the 32 individual fan speed alarms, the external and internal input contacts (10490–10655), the summary
  alarm bits in the problem rules (they repeat the alarms above) and the write-only event acknowledge/reset command (40398).'
- The card has no model or serial number registers, so there is no identify block.
- Power values the document gives in kW, kVA or kvar are given here in W, VA and var (scale × 1000).
