modbusspec: 0
id: vertiv-uxim
manufacturer: Vertiv
name: Albér Universal Xplorer battery monitors (UXIM, UXTM)
kind: other

sources:
- title: Albér MODBUS Protocol for Universal Xplorer Industrial Monitor (UXIM) and Universal Xplorer Telecom Monitor (UXTM)
    – Reference Guide and Release Notes (4200-102)
  version: '3.1'
  url: http://downloads1.vertivco.com/Alber/AlberModbus/4200_102_UXIM_UXTM_Modbus_Protocol_Reference_Guide.pdf
  sha256: 89dd11edfd2677e2b25bdb01a19f573bde4b84def6ae82ef1332e8007ed89a47
  archive_url: https://web.archive.org/web/20240807155017/http://downloads1.vertivco.com/Alber/AlberModbus/4200_102_UXIM_UXTM_Modbus_Protocol_Reference_Guide.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - ascii
  serial:
    format: 7N2
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 9689
    type: str
    length: 10

model_choice: user

models:
  - {id: uxim, name: UXIM (Universal Xplorer Industrial Monitor)}
  - {id: uxtm, name: UXTM (Universal Xplorer Telecom Monitor)}

points:
  # Status (input registers)
  - {key: x.system_status, label: System status, table: input, address: 384, type: u16, flags: system_status}
  - {key: x.string_discharge, label: String status (discharge), table: input, address: 385, type: u16, flags: string_discharge}
  - {key: x.string_alarm, label: String alarm status, table: input, address: 386, type: u16, flags: string_alarm}
  - {key: x.major_high_alarms, label: Major high alarm status, table: input, address: 9026, type: u16, flags: high_alarms}
  - {key: x.major_low_alarms, label: Major low alarm status, table: input, address: 9027, type: u16, flags: low_alarms}
  - {key: x.minor_high_alarms, label: Minor high alarm status, table: input, address: 9028, type: u16, flags: high_alarms}
  - {key: x.minor_low_alarms, label: Minor low alarm status, table: input, address: 9029, type: u16, flags: low_alarms, note: The document names bit 0 here "Minor Low Alarm"; read as cell voltage like the other alarm words.}
  # String values (strings 1–4 of up to 16)
  - {key: x.ambient_temperature_1, label: Ambient temperature 1, table: input, address: 1921, type: s16, unit: °C, scale: 0.0009765625, verified: false, note: Raw / 1024. Signedness not stated; signed assumed.}
  - {key: x.ambient_temperature_2, label: Ambient temperature 2, table: input, address: 1922, type: s16, unit: °C, scale: 0.0009765625, models: [uxim], verified: false, note: Raw / 1024. Signedness not stated; signed assumed.}
  - {key: x.string1_voltage, label: OV String 1, table: input, address: 2049, type: u16, unit: V, scale: 0.01}
  - {key: x.string2_voltage, label: OV String 2, table: input, address: 2050, type: u16, unit: V, scale: 0.01, optional: true}
  - {key: x.string3_voltage, label: OV String 3, table: input, address: 2051, type: u16, unit: V, scale: 0.01, optional: true}
  - {key: x.string4_voltage, label: OV String 4, table: input, address: 2052, type: u16, unit: V, scale: 0.01, optional: true}
  - {key: x.string1_current, label: String 1 current, table: input, address: 2081, type: sm16, unit: A, note: Top bit = sign (1 = negative). Which direction is positive (charge or discharge) is not stated.}
  - {key: x.string2_current, label: String 2 current, table: input, address: 2082, type: sm16, unit: A, optional: true}
  - {key: x.string3_current, label: String 3 current, table: input, address: 2083, type: sm16, unit: A, optional: true}
  - {key: x.string4_current, label: String 4 current, table: input, address: 2084, type: sm16, unit: A, optional: true}
  - {key: x.string1_float_current, label: String 1 float current, table: input, address: 2113, type: u16, unit: mA}
  - {key: x.string2_float_current, label: String 2 float current, table: input, address: 2114, type: u16, unit: mA, optional: true}
  - {key: x.string3_float_current, label: String 3 float current, table: input, address: 2115, type: u16, unit: mA, optional: true}
  - {key: x.string4_float_current, label: String 4 float current, table: input, address: 2116, type: u16, unit: mA, optional: true}
  - {key: x.string1_ripple, label: String 1 ripple, table: input, address: 2145, type: u16, note: Unit and scale not stated.}
  - {key: x.string2_ripple, label: String 2 ripple, table: input, address: 2146, type: u16, optional: true}
  - {key: x.string3_ripple, label: String 3 ripple, table: input, address: 2147, type: u16, optional: true}
  - {key: x.string4_ripple, label: String 4 ripple, table: input, address: 2148, type: u16, optional: true}
  - {key: x.cell1_voltage, label: Cell voltage 1, table: input, address: 3585, type: u16, unit: V, scale: 0.001, note: Cell n is at 0x0E00 + n (n = 1 … 256); the document's "0E1H" for cell 1 is read as 0E01H (reference 33586).}
  - {key: x.cell1_temperature, label: Cell temperature 1, table: input, address: 3905, type: s16, unit: °C, scale: 0.0009765625, verified: false, note: Cell n is at 0x0F40 + n. Raw / 1024; signedness not stated.}
  - {key: x.positive_charger_cable_resistance, label: Positive charger cable resistance, table: input, address: 9241, type: u16, unit: µΩ, models: [uxim], poll: slow}
  - {key: x.negative_charger_cable_resistance, label: Negative charger cable resistance, table: input, address: 9242, type: u16, unit: µΩ, models: [uxim], poll: slow}
  - {key: x.digital_inputs, label: Digital inputs, table: input, address: 9499, type: u16, flags: digital_inputs}
  - {key: x.ground_fault_resistance_positive, label: Ground fault resistance at battery system positive, table: input, address: 9706, type: u32, unit: Ω, models: [uxim], verified: false, note: Two registers; word order not stated (high word first assumed).}
  - {key: x.ground_fault_resistance_negative, label: Ground fault resistance at battery system negative, table: input, address: 9708, type: u32, unit: Ω, models: [uxim], verified: false, note: Two registers; word order not stated (high word first assumed).}
  # Unit information
  - {key: x.model, label: Model number, table: input, address: 9685, type: str, length: 4, poll: slow}
  - {key: serial, label: Serial number, table: input, address: 9689, type: str, length: 10, poll: slow}
  - {key: firmware, label: Firmware version, table: input, address: 9699, type: str, length: 4, poll: slow}
  - {key: x.pcb_revision, label: PCB version, table: input, address: 9703, type: u16, poll: slow, note: 'Bits 4–7 base revision (0 = A … 7 = H), bits 0–3 sub revision.'}
  # Holding registers
  - {key: x.system_configuration, label: System configuration, table: holding, address: 9689, type: u16, enum: system_configuration, poll: slow}
  - {key: x.command, label: Firmware control register, table: holding, address: 3489, type: u16, enum: command, writable: true, note: Command register; write the value of the command.}

enums:
  system_configuration: {'0': 'NiCd 24 V, 1×18×1 V', '1': '2 V cells 24 V, 1×12×2 V', '2': '2 V cells 24 V, 2×12×2 V', '3': '2 V cells 48 V, 1×24×2 V', '4': '4 V blocks 24 V, 1×6×4 V', '5': '4 V blocks 24 V, 2×6×4 V', '6': '4 V blocks 24 V, 3×6×4 V', '7': '4 V blocks 24 V, 4×6×4 V', '8': '4 V blocks 48 V, 1×12×4 V', '9': '4 V blocks 48 V, 2×12×4 V', '10': '6 V blocks 24 V, 1×4×6 V', '11': '6 V blocks 24 V, 2×4×6 V', '12': '6 V blocks 24 V, 3×4×6 V', '13': '6 V blocks 24 V, 4×4×6 V', '14': '6 V blocks 48 V, 1×8×6 V', '15': '6 V blocks 48 V, 2×8×6 V', '16': '6 V blocks 48 V, 3×8×6 V', '17': '8 V blocks 24 V, 1×3×8 V', '18': '8 V blocks 24 V, 2×3×8 V', '19': '8 V blocks 24 V, 3×3×8 V', '20': '8 V blocks 24 V, 4×3×8 V', '21': '8 V blocks 48 V, 1×6×8 V', '22': '8 V blocks 48 V, 2×6×8 V', '23': '8 V blocks 48 V, 3×6×8 V', '24': '8 V blocks 48 V, 4×6×8 V', '25': '12 V blocks 24 V, 1×2×12 V', '26': '12 V blocks 24 V, 2×2×12 V', '27': '12 V blocks 24 V, 3×2×12 V', '28': '12 V blocks 24 V, 4×2×12 V', '29': '12 V blocks 48 V, 1×4×12 V', '30': '12 V blocks 48 V, 2×4×12 V', '31': '12 V blocks 48 V, 3×4×12 V', '32': '12 V blocks 48 V, 4×4×12 V', '33': '16 V blocks 48 V, 1×3×16 V', '34': '16 V blocks 48 V, 2×3×16 V', '35': '16 V blocks 48 V, 3×3×16 V', '36': '16 V blocks 48 V, 4×3×16 V'}
  command: {'0': Start resistance test, '1': Stop resistance test, '2': Alarm reset, '3': Delete discharge data, '4': Alarm acknowledge}

flags:
  system_status: {'0': Monitor mode, '1': Resistance test in progress, '2': Discharge in progress, '3': Calibration in progress, '4': Diagnostic in progress, '5': Maintenance mode, '6': Major alarm in progress, '7': Hardware failure, '8': Alarm acknowledged, '9': Minor alarm in progress}
  string_discharge: {'0': String 1 discharging, '1': String 2 discharging, '2': String 3 discharging, '3': String 4 discharging}
  string_alarm: {'0': String 1 in alarm, '1': String 2 in alarm, '2': String 3 in alarm, '3': String 4 in alarm}
  high_alarms: {'0': Cell voltage, '1': String voltage, '2': Float current, '3': Ripple current, '4': Cell temperature, '5': Cell resistance, '6': Intercell, '7': Discharge current, '8': Charger cable, '9': Digital input, '11': Ambient temperature, '12': Inter-tier, '13': Cell to ambient, '14': Thermal runaway (cell to ambient), '15': Thermal runaway (float current)}
  low_alarms: {'0': Cell voltage, '1': String voltage, '2': Float current, '3': Ripple current, '4': Cell temperature, '5': Cell resistance, '9': Digital input, '10': Ground fault, '11': Ambient temperature, '12': Inter-tier}
  digital_inputs: {'0': DI-1, '1': DI-2, '2': DI-3}

problems:
  - {when: {key: x.system_status, bit: 7}, kind: fault, text: Hardware failure (status bit 7)}
  - {when: {key: x.system_status, bit: 6}, kind: warning, text: Major battery alarm (status bit 6)}
  - {when: {key: x.system_status, bit: 9}, kind: warning, text: Minor battery alarm (status bit 9)}
  - {when: {key: x.major_high_alarms, bit: 14}, kind: warning, text: 'Thermal runaway alarm, cell to ambient (major high bit 14)'}
  - {when: {key: x.major_high_alarms, bit: 15}, kind: warning, text: 'Thermal runaway alarm, float current (major high bit 15)'}
  - {when: {key: x.major_low_alarms, bit: 10}, kind: warning, text: Ground fault alarm (major low bit 10)}

notes:
- Addresses are the document's data addresses (0-based); its references are data address + 30001 for input registers (3xxxx,
  function 04) and + 40001 for holding registers (4xxxx, functions 03 / 16). Both tables overlap in address (e.g. 0x2342 is
  an alarm status word in the input table and an alarm threshold in the holding table).
- 'Modbus ASCII: 7 data bits, no parity, 2 stop bits; 1200 … 19200 baud (default not stated). Addresses 1 … 254; the default
  address is not stated (1 assumed).'
- 'Scaling as the document''s transformation table gives it: string (overall) voltage / 100 V, cell voltage / 1000 V, string
  current A, float and ground fault current mA, resistances µΩ, temperatures / 1024 °C.'
- Up to 16 strings (string n voltage at 0x0800 + n, current 0x0820 + n, float current 0x0840 + n, ripple 0x0860 + n) and 256
  cells (voltage 0x0E00 + n, temperature 0x0F40 + n, internal resistance 0x11C0 + n, intercell 0x1300 + n, ground fault current
  0x241A + n); only strings 1–4 and cell 1 are listed here.
- 'Not taken: alarm thresholds, alarm enable / latch words, alarm and discharge event pages, inter-tier configuration, site
  and string names, password, installation date and clock (packed two values per register; formats not fully stated).'
- Text registers hold two ASCII characters each, first character in the high byte (assumed from the byte 1 / byte 2 layout).
- UXIM and UXTM can't be told apart from a stated register value; the model number text (0x25D5) may show it.
