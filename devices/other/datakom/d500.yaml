notes:
- Addresses are the document's decimal register addresses, which it uses directly as protocol addresses (its example reads
  address 20h with 01 03 00 20 …), so they are 0-based already. All registers are read with function 03; writes use 06 / 16.
- At most 16 registers per request; longer requests are cut to the first 16.
- 'Word order: the document contradicts itself (one section says the least significant register comes first, another that
  the high 16 bits are in the first register). Readers detect it from the mains L1 voltage; without mains voltage they fall
  back to high word first. Unverified.'
- Units of the power registers are not stated in the document (coefficient x10); kW assumed, like the kWh counters. Signedness
  of powers, power factors and temperatures assumed.
- Temperatures are in °C and oil pressure in bar as transmitted.
- Alarm bits are arrays of 256 bits over 16 registers (bit 0 = bit 0 of the first register); bits 142–255 are reserved, so
  only the first 9 registers of each array are listed. Bits 0–47 are the digital input alarms, whose meaning depends on the
  configuration. The function flags are an array of 224 bits over 14 registers; only flags 0–111 are defined, in the first
  7 registers.
- 'The document lists the mains energy counters twice: at 11569–11577 (directly after the function flags) and again at 11555–11561,
  which overlaps the function flags. The first set is used here.'
- 'Left out: harmonics and scopemeter data (10386–10503, channel selected with 8194), second set of senders (10367–10372),
  analog input readings, digital input / LED / output status bits, GPS position, remaining service 2 and 3 counters, graphic
  display buffer, MAC address, controller unique ID (96 bits), modem IMEI, multi-genset load share values (11175–11378) and
  the hard reset register 8210.'
- Default unit id 1 (recommended for Modbus TCP); serial baud rate is selectable (2400–115200), no default stated. Over GPRS
  the document says to use port 80.
- 'Identification: one of the model matches must hold.'
