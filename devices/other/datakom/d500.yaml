modbusspec: 0
id: datakom-d500
manufacturer: Datakom
name: D-300 / D-500 / D-700 genset controllers
kind: other

sources:
- title: Datakom D-300 / D-500 / D-700 Modbus Application Manual
  version: 5.6 (25.04.2016)
  url: https://datakom.kiev.ua/upload/iblock/583/i3qt9r5v60iix8mlu3o0rfvftnecmb83/DATAKOM-D500-MODBUS-application-manual.pdf
  sha256: 8222940774f059a875e73c313f7c781285b122400fe71eb09b164f95f73eb407
  archive_url: https://web.archive.org/web/20251114061632/https://www.datakom.kiev.ua/upload/iblock/583/i3qt9r5v60iix8mlu3o0rfvftnecmb83/DATAKOM-D500-MODBUS-application-manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 10240
    type: u32
    plausible:
    - 1
    - 1000000

identify:
  any:
  - table: holding
    address: 10609
    type: u16
    equals: 54016
  - table: holding
    address: 10609
    type: u16
    equals: 54528
  - table: holding
    address: 10609
    type: u16
    equals: 55040

models:
  - {id: d300, name: D-300, match: {table: holding, address: 10609, type: u16, equals: 54016}}
  - {id: d500, name: D-500, match: {table: holding, address: 10609, type: u16, equals: 54528}}
  - {id: d700, name: D-700, match: {table: holding, address: 10609, type: u16, equals: 55040}}

