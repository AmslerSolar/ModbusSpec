enums:
  operation_status: {'0': Genset at rest, '1': Wait before fuel, '2': Engine preheat, '3': Wait oil flash off, '4': Crank rest, '5': Cranking, '6': Engine run idle speed, '7': Engine heating, '8': Running off load, '9': Synchronizing to mains, '10': Load transfer to genset, '11': Genset CB activation, '12': Genset CB timer, '13': Master genset on load, '14': Peak lopping, '15': Power exporting, '16': Slave genset on load, '17': Synchronizing back to mains, '18': Load transfer to mains, '19': Mains CB activation, '20': Mains CB timer, '21': Stop with cooldown, '22': Cooling down, '23': Engine stop idle speed, '24': Immediate stop, '25': Engine stopping}
  unit_mode: {'1': Stop, '2': Run (D-500) / Manual (D-700), '4': Auto, '8': Test}

flags:
  alarm_bits_3: {'0': Genset low frequency, '1': Genset high frequency, '2': Genset low RPM, '3': Genset high RPM, '4': Genset low voltage, '5': Genset high voltage, '6': Low oil pressure, '7': High oil pressure, '8': Low engine temperature, '9': High engine temperature, '10': Low fuel level, '11': High fuel level, '12': Low oil temperature, '13': High oil temperature, '14': Low canopy temperature, '15': High canopy temperature}
  alarm_bits_4: {'0': Low ambient temperature, '1': High ambient temperature, '2': Sender 1 low level, '3': Sender 2 low level, '4': Sender 3 low level, '5': Sender 4 low level, '6': Sender 5 low level, '7': Sender 6 low level, '8': Sender 7 low level, '9': Sender 8 low level, '10': Sender 1 high level, '11': Sender 2 high level, '12': Sender 3 high level, '13': Sender 4 high level, '14': Sender 5 high level, '15': Sender 6 high level}
  alarm_bits_5: {'0': Sender 7 high level, '1': Sender 8 high level, '2': Oil pressure sender open, '3': Engine temperature sender open, '4': Fuel level sender open, '5': Oil temperature sender open, '6': Canopy temperature sender open, '7': Ambient temperature sender open, '8': Sender 1 open circuit, '9': Sender 2 open circuit, '10': Sender 3 open circuit, '11': Sender 4 open circuit, '12': Sender 5 open circuit, '13': Sender 6 open circuit, '14': Sender 7 open circuit, '15': Sender 8 open circuit}
  alarm_bits_6: {'0': Low battery voltage, '1': High battery voltage, '2': Fail to start, '3': Fail to stop, '4': Low charge voltage, '5': J1939 ECU error, '6': High air inlet temperature, '7': Low coolant level, '8': Voltage unbalance, '9': Current unbalance, '10': Overcurrent, '11': Overload, '12': Reverse power, '13': Genset phase order fail, '14': Mains phase order fail, '15': Genset CB fail to close}
  alarm_bits_7: {'0': Genset CB fail to open, '1': Mains CB fail to close, '2': Mains CB fail to open, '3': Device address fail, '4': Communication bus error, '5': Excitation lost, '6': Service 1 request, '7': Service 2 request, '8': Service 3 request, '9': 'G59: no mains frequency', '10': 'G59: mains frequency fail', '11': 'G59: mains reverse power', '12': 'G59: ROCOF df/dt', '13': 'G59: vector shift', '14': NVM function failure, '15': Communication lost}
  alarm_bits_8: {'0': Synchronization fail, '1': Loss of pick-up signal, '2': Unit not tested, '3': Wrong expansion order, '4': Busbar voltage fail, '5': Busbar frequency fail, '6': Minimum gensets not reached, '7': Dead bus voltage exceeded, '8': Insufficient start-up power, '9': Fuel pump failure, '10': Unit locked, '11': EEPROM write fault, '12': Low battery 2 voltage, '13': High battery 2 voltage}
  function_flags_0: {'0': Fuel, '1': Horn, '2': Crank, '3': Stop solenoid, '4': Genset contactor, '5': Mains contactor, '6': Idle speed, '7': Preheat, '8': Alternate crank, '9': Fuel main winding, '10': Genset close pulse, '11': Genset open pulse, '12': Genset UV coil, '13': Mains close pulse, '14': Mains open pulse, '15': Mains UV coil}
  function_flags_1: {'0': Flashing relay, '1': Gas solenoid, '2': Fuel pump control, '3': Choke, '4': Block heater, '5': Coolant cooler, '6': Coolant heater, '7': Fan control, '8': Air flap control, '9': Canopy fan control, '10': Ambient fan control, '11': Remote start output, '12': Genset ready, '13': Busbar contactor, '14': Busbar close pulse, '15': Busbar open pulse}
  function_flags_2: {'0': Busbar UV coil, '1': Load shedding, '2': Load add, '3': Load subtract, '4': Service 1 request, '5': Service 2 request, '6': Service 3 request, '7': Mains phase order fail, '8': Genset phase order fail, '9': Auto ready, '10': Weekly schedule on, '11': Exerciser on, '12': Mains fail, '13': Program mode active, '14': Engine running, '15': Genset voltage OK}
