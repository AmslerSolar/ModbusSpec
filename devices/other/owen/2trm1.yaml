# Written from the OWEN 2TRM1 (USB modification) Modbus registers (КУВФ.421210.002 РЭ7, undated).

modbusspec: 0
id: owen-2trm1
manufacturer: OWEN
name: 2TRM1 two-channel measuring controller (USB modification)
kind: other

sources:
- title: 2ТРМ1 (модификация с USB). Измеритель-регулятор микропроцессорный двухканальный. Регистры Modbus, КУВФ.421210.002
    РЭ7
  version: undated
  url: https://gekoms.org/wp-content/uploads/2026/04/kr_2trm1_modbus.pdf
  sha256: 00e74334cb40f25d9724e669c11735390576e6f7452eca3b4c3496f29e526e07

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - ascii
  input_equals_holding: true
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:
  # Identity
  - {key: x.device_type, label: DEVICE (device type), table: holding, address: 4096, type: str, length: 4, poll: slow}
  - {key: firmware, label: VERSION (firmware version), table: holding, address: 4100, type: str, length: 4, poll: slow}
  # Live values (common operating registers)
  - {key: x.status, label: STATUS (device status), table: holding, address: 4104, type: u16, flags: status, poll: fast}
  - {key: x.pv1, label: PV1 input 1 value (before function), table: holding, address: 4105, type: f32, poll: fast, verified: false, note: 'In the unit of the configured sensor (°C for temperature sensors, scaled units for current / voltage inputs).'}
  - {key: x.pv2, label: PV2 input 2 value (before function), table: holding, address: 4107, type: f32, poll: fast, verified: false}
  - {key: x.fun1, label: Fun1 input 1 measured value (after function), table: holding, address: 4109, type: f32, poll: fast, verified: false}
  - {key: x.fun2, label: Fun2 input 2 measured value (after function), table: holding, address: 4111, type: f32, poll: fast, verified: false}
  - {key: x.sp1, label: SP1 channel 1 setpoint, table: holding, address: 4113, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.sp2, label: SP2 channel 2 setpoint, table: holding, address: 4115, type: f32, writable: true, poll: slow, verified: false}
  - {key: x.out_p1, label: out.P1 output 1 power, table: holding, address: 4117, type: f32, unit: '%', writable: true, min: 0, max: 100, poll: fast, verified: false}
  - {key: x.out_p2, label: out.P2 output 2 power, table: holding, address: 4119, type: f32, unit: '%', writable: true, poll: fast, verified: false}
  - {key: x.control_mode, label: CtrL control mode, table: holding, address: 4121, type: u16, enum: control_mode, writable: true, poll: fast}
  # Settings
  - {key: x.input1_type, label: tYPE input 1 sensor type, table: holding, address: 4, type: u16, enum: sensor_type, writable: true, poll: slow}
  - {key: x.input2_type, label: tYPE input 2 sensor type, table: holding, address: 260, type: u16, enum: sensor_type, writable: true, poll: slow}
  - {key: x.output1_logic, label: LoG.d output 1 logic (discrete), table: holding, address: 544, type: u16, enum: output_logic, writable: true, poll: slow}
  - {key: x.output2_logic, label: LoG.d output 2 logic (discrete), table: holding, address: 800, type: u16, enum: output_logic, writable: true, poll: slow}
  - {key: x.protocol, label: Prot protocol, table: holding, address: 1280, type: u16, enum: protocol, writable: true, poll: slow}
  - {key: x.modbus_address, label: Addr Modbus address, table: holding, address: 1281, type: u16, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.baud, label: bAud baud rate, table: holding, address: 1282, type: u16, enum: baud, writable: true, poll: slow}
  - {key: x.data_format, label: dPS data format, table: holding, address: 1283, type: u16, enum: data_format, writable: true, poll: slow}
  - {key: x.byte_order, label: b.ord byte order in a register, table: holding, address: 1285, type: u16, enum: byte_order, writable: true, poll: slow}

enums:
  control_mode: {'0': Stop, '1': Run, '2': Manual}
  sensor_type: {'0': 'Off', '1': C 50, '2': C 53, '3': C 100, '4': C 500, '5': C 1.0, '6': 50 C, '7': 100 C, '8': 500 C, '9': 1.0 C, '10': P 50, '11': P 100, '12': P 500, '13': P 1.0, '14': 50 P, '15': 100 P, '16': 500 P, '17': 1.0 P, '18': 100 N, '19': 500 N, '20': 1.0 N, '21': Thermocouple L, '22': Thermocouple K, '23': Thermocouple J, '24': Thermocouple N, '25': Thermocouple T, '26': Thermocouple S, '27': Thermocouple R, '28': Thermocouple B, '29': Thermocouple A1, '30': Thermocouple A2, '31': Thermocouple A3, '32': Thermocouple DL, '33': Thermocouple E, '34': Pyrometer 1, '35': Pyrometer 2, '36': Pyrometer 3, '37': Pyrometer 4, '38': Current 0…5 mA, '39': Current 0…20 mA, '40': Current 4…20 mA, '41': Voltage −50…50 mV, '42': Voltage 0…1 V, '43': Voltage 0…5 V, '44': Voltage 0…10 V}
  output_logic: {'0': 'Off', '1': Heating, '2': Cooling, '3': Alarm}
  protocol: {'0': Modbus RTU, '1': Modbus ASCII}
  baud: {'0': '2400', '1': '4800', '2': '9600', '3': '14400', '4': '19200', '5': '28800', '6': '38400', '7': '57600', '8': '115200'}
  data_format: {'0': 8N1, '1': 8O1, '2': 8E1, '3': 8N2, '4': 8O2, '5': 8E2, '6': 7O1, '7': 7E1, '8': 7O2, '9': 7E2}
  byte_order: {'0': Most significant byte first, '1': Least significant byte first}

flags:
  status: {'0': Input 1 error, '1': Input 2 error, '2': Input 1 function calculation error, '3': Input 2 function calculation error, '4': Internal device error, '5': Output 1 switched on (discrete outputs only), '6': Output 2 switched on (discrete outputs only), '7': Manual control mode on, '8': Stop mode on, '9': Control loop 1 break, '10': Control loop 2 break}

problems:
  - {when: {key: x.status, bit: 0}, kind: fault, text: Input 1 error (STATUS bit 0)}
  - {when: {key: x.status, bit: 1}, kind: fault, text: Input 2 error (STATUS bit 1)}
  - {when: {key: x.status, bit: 2}, kind: fault, text: Input 1 function calculation error (STATUS bit 2)}
  - {when: {key: x.status, bit: 3}, kind: fault, text: Input 2 function calculation error (STATUS bit 3)}
  - {when: {key: x.status, bit: 4}, kind: fault, text: Internal device error (STATUS bit 4)}
  - {when: {key: x.status, bit: 9}, kind: fault, text: Control loop 1 break (STATUS bit 9)}
  - {when: {key: x.status, bit: 10}, kind: fault, text: Control loop 2 break (STATUS bit 10)}

notes:
- Addresses are the document's hex register addresses as they are. Read with function 03 or 04 (same registers).
- The 32-bit float word order is not stated; most significant register first is assumed. The byte order within a register
  can be switched with b.ord (0x0505, default not stated; most significant byte first assumed).
- Default unit id and serial settings are not stated; unit id 1 is assumed. RTU or ASCII is selected with Prot (0x0500); settings
  take effect after writing 1 to APLY (0x0506).
- Sensor types 1…20 are the document's short codes for resistance thermometers (presumably C… copper, P… platinum, N… nickel,
  the number the nominal resistance in ohms with 1.0 = 1000, and the two spellings per metal two different characteristics;
  the document doesn't explain them).
- 'Write-only RESET (0x101A, remote restart) left out. Also left out: the per-input filter, scaling, correction and math function
  settings (0x0005…0x0024, 0x0105…0x0124), per-output regulator settings (0x0200…0x0368), display (0x0400…0x0408), setpoint
  curve (0x0600…0x0627) and hidden menu (0x0800…0x0803).'
- The device type text (0x1000) would identify the controller, but the document doesn't give its value.
