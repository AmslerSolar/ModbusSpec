modbusspec: 0
id: himoinsa-c4lan
manufacturer: Himoinsa
name: Generator controllers with C4LAN Modbus interface
kind: other

sources:
- id: himoinsa-c4lan
  title: himoinsa-c4lan (Home Assistant integration)
  url: https://github.com/spiri439/himoinsa-c4lan
  license: MIT
  commit: f6cd49e0c4997c500870100061137fd2a2c208a5
  path: custom_components/himoinsa_c4lan/sensor.py, custom_components/himoinsa_c4lan/binary_sensor.py, custom_components/himoinsa_c4lan/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - himoinsa-c4lan

points:
  - {key: x.reset, label: Reset, table: coil, address: 0, type: bool, note: Named in the project's coil map; no entity reads it.}
  - {key: x.generator_running, label: Generator running, table: coil, address: 1, type: bool}
  - {key: x.generator_stopped, label: Generator stopped, table: coil, address: 2, type: bool}
  - {key: x.auto_mode, label: Auto mode, table: coil, address: 3, type: bool}
  - {key: x.manual_mode, label: Manual mode, table: coil, address: 4, type: bool}
  - {key: x.test_mode, label: Test mode, table: coil, address: 5, type: bool}
  - {key: x.lock_mode, label: Lock mode, table: coil, address: 6, type: bool}
  - {key: x.transfer_pump, label: Transfer pump, table: coil, address: 7, type: bool}
  - {key: x.group_contactor, label: Group contactor, table: coil, address: 8, type: bool}
  - {key: x.grid_contactor, label: Grid contactor, table: coil, address: 9, type: bool}
  - {key: frequency, label: Group frequency, table: input, address: 7, type: u16, unit: Hz, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.voltage_l12, label: Voltage L1-L2, table: input, address: 8, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: x.voltage_l23, label: Voltage L2-L3, table: input, address: 9, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: x.voltage_l31, label: Voltage L3-L1, table: input, address: 10, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: l1_voltage, label: Voltage L1-N, table: input, address: 11, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: l2_voltage, label: Voltage L2-N, table: input, address: 12, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: l3_voltage, label: Voltage L3-N, table: input, address: 13, type: u16, unit: V, invalid: [65534, 65535]}
  - {key: l1_current, label: Current L1, table: input, address: 14, type: u16, unit: A, invalid: [65534, 65535]}
  - {key: l2_current, label: Current L2, table: input, address: 15, type: u16, unit: A, invalid: [65534, 65535]}
  - {key: l3_current, label: Current L3, table: input, address: 16, type: u16, unit: A, invalid: [65534, 65535]}
  - {key: x.active_power, label: Active power, table: input, address: 22, type: u16, unit: W, scale: 1000, invalid: [65534, 65535]}
  - {key: apparent_power, label: Apparent power, table: input, address: 23, type: u16, unit: VA, scale: 1000, invalid: [65534, 65535]}
  - {key: reactive_power, label: Reactive power, table: input, address: 24, type: u16, unit: var, scale: 1000, invalid: [65534, 65535]}
  - {key: x.engine_speed, label: Engine speed, table: input, address: 25, type: u16, unit: rpm, invalid: [65534, 65535]}
  - {key: x.fuel_level, label: Fuel level, table: input, address: 26, type: u16, unit: '%', scale: 0.1, invalid: [65534, 65535]}
  - {key: x.charge_alternator_voltage, label: Charge alternator voltage, table: input, address: 27, type: u16, unit: V, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.battery_voltage, label: Battery voltage, table: input, address: 28, type: u16, unit: V, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.coolant_temperature, label: Coolant temperature, table: input, address: 29, type: u16, unit: °C, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.oil_pressure, label: Oil pressure, table: input, address: 30, type: u16, unit: bar, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.auxiliary_temperature, label: Auxiliary temperature, table: input, address: 31, type: u16, unit: °C, scale: 0.1, invalid: [65534, 65535]}
  - {key: x.engine_hours, label: Engine hours, table: input, address: 42, type: u16, unit: h, invalid: [65534, 65535]}

notes:
- The C4LAN MODBUS interface serves Himoinsa CE7-family generator controllers (CEM7 / CEA7 / C4) over Modbus TCP. The unit
  id is the controller's slave offset (1) plus the generator index, so generator 0 is unit 1.
- Input registers 0-6 hold grid measurements that only the central CEA7 has; on a plain genset reading them fails with exception
  4, so reads should start at address 7.
- Input register 41 holds the minutes:seconds part of the engine hours in register 42 (encoding not given by the project).
- Generator status is in coils 0-9 (function 01); the project only reads them.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
