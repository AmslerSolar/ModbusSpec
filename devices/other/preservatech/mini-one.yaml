# Written from the Preservatech ModbustoLocal (no version) document.

modbusspec: 0
id: preservatech-mini-one
manufacturer: Preservatech
name: Mini One / PMCG humidity controllers
kind: other

sources:
- title: Connecting Mini One and PMCG machines to the BMS (ModbustoLocal)
  version: '-'
  url: http://www.preservatech.com/dwl/ModbustoLocal.pdf
  sha256: 94954690810ac3235ea17252ffb63721db787c390628163ab3f2b435f44a72ad
  archive_url: https://web.archive.org/web/20240301031956/http://www.preservatech.com/dwl/ModbustoLocal.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  - {key: x.device_mode, label: Device mode, table: holding, address: 8192, type: u16, enum: device_mode, poll: slow}
  - {key: x.humidity, label: Humidity, table: holding, address: 8193, type: u16, scale: 0.1, unit: '%'}
  - {key: x.air_temperature, label: Temperature, table: holding, address: 8194, type: s16, scale: 0.1, unit: °C, note: Signedness not stated; assumed signed.}
  - {key: x.humidity_setpoint, label: Humidity preset, table: holding, address: 8448, type: u16, scale: 0.1, unit: '%', writable: true, poll: slow}
  - {key: x.humidity_alarm_offset, label: Humidity alarm error offset, table: holding, address: 8449, type: u16, scale: 0.1, unit: '%', writable: true, poll: slow}
  - {key: x.temperature_error, label: Temperature error (air pump), table: holding, address: 8704, type: u16, scale: 0.1, unit: °C, writable: true, poll: slow}
  - {key: x.temperature_alarm_delay, label: Temperature alarm error delay (air pump), table: holding, address: 8705, type: u16, writable: true, poll: slow, note: Unit not stated.}
  - {key: x.pid_kp, label: PID kP, table: holding, address: 8960, type: u16, writable: true, poll: slow}
  - {key: x.pid_ki, label: PID kI, table: holding, address: 8961, type: u16, writable: true, poll: slow}
  - {key: x.pid_kd, label: PID kD, table: holding, address: 8962, type: u16, writable: true, poll: slow}
  - {key: x.wifi_send_interval, label: WiFi send interval, table: holding, address: 9472, type: u16, unit: s, writable: true, poll: slow}
  - {key: x.sd_log_interval, label: External SD log interval, table: holding, address: 9473, type: u16, unit: s, writable: true, poll: slow}

enums:
  device_mode: {'0': PID, '1': HUM}

notes:
- The document is a one-page note for connecting the machines to a building management system over the RJ45 Modbus RTU socket
  (not Ethernet); a Modbus TCP gateway is needed for TCP. With Modbus in use the machines can't run in master/slave mode.
- The document lists hex addresses marked read (r) or read/write (rw) but doesn't name the function code or register table;
  holding registers (function 03) are assumed, and all points are unverified for that reason.
- Signedness of the scaled values isn't stated; unsigned is assumed except for the temperature. The unit id isn't stated either;
  1 is assumed.
