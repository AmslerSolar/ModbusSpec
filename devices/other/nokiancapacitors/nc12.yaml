# Written from the Nokian Capacitors NC-12 Modbus application user's manual (version 0.02, 05.11.2004).

modbusspec: 0
id: nokiancapacitors-nc12
manufacturer: Nokian Capacitors
name: NC-12 power factor controller
kind: other

sources:
- title: NC-12 Modbus application – User's manual
  version: 0.02 (05.11.2004)
  url: https://nepsi.com/resource/Nokian-Capacitor-NC12-Controller-Modbus-Manual.pdf
  sha256: f6d7ee9816b60c928d6c620e41a777ca526c55ce9eb3a5bd9422f10af40549b7
  archive_url: https://web.archive.org/web/20250617032412/https://nepsi.com/resource/Nokian-Capacitor-NC12-Controller-Modbus-Manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 40
    type: u32

points:
  # Function 4 (input registers); the document's index n is address n − 1
  - {key: x.active_power, label: Active Power, table: input, address: 0, type: s32, unit: W, note: Direction not stated; input 68 tells whether power flows directly or in reverse (generator).}
  - {key: reactive_power, label: Reactive Power, table: input, address: 2, type: s32, unit: var}
  - {key: apparent_power, label: Apparent Power, table: input, address: 4, type: s32, unit: VA}
  - {key: x.active_current, label: Active Current, table: input, address: 6, type: s32, unit: A, scale: 0.001}
  - {key: x.reactive_current, label: Reactive Current, table: input, address: 8, type: s32, unit: A, scale: 0.001}
  - {key: x.apparent_current, label: Apparent current, table: input, address: 10, type: s32, unit: A, scale: 0.001}
  - {key: x.voltage, label: Voltage, table: input, address: 12, type: u32, unit: V, note: The voltage measured as set by the wiring parameter (line-to-line or line-to-neutral).}
  - {key: x.step1_connections, label: 'Step 1: Number of connections', table: input, address: 14, type: u32, poll: slow}
  - {key: x.step2_connections, label: 'Step 2: Number of connections', table: input, address: 16, type: u32, poll: slow}
  - {key: x.step3_connections, label: 'Step 3: Number of connections', table: input, address: 18, type: u32, poll: slow}
  - {key: x.step4_connections, label: 'Step 4: Number of connections', table: input, address: 20, type: u32, poll: slow}
  - {key: x.step5_connections, label: 'Step 5: Number of connections', table: input, address: 22, type: u32, poll: slow}
  - {key: x.step6_connections, label: 'Step 6: Number of connections', table: input, address: 24, type: u32, poll: slow}
  - {key: x.step7_connections, label: 'Step 7: Number of connections', table: input, address: 26, type: u32, poll: slow}
  - {key: x.step8_connections, label: 'Step 8: Number of connections', table: input, address: 28, type: u32, poll: slow}
  - {key: x.step9_connections, label: 'Step 9: Number of connections', table: input, address: 30, type: u32, poll: slow}
  - {key: x.step10_connections, label: 'Step 10: Number of connections', table: input, address: 32, type: u32, poll: slow}
  - {key: x.step11_connections, label: 'Step 11: Number of connections', table: input, address: 34, type: u32, poll: slow}
  - {key: x.step12_connections, label: 'Step 12: Number of connections', table: input, address: 36, type: u32, poll: slow}
  - {key: x.operating_hours, label: Operation time of the regulator, table: input, address: 38, type: u32, unit: h, poll: slow}
  - {key: serial, label: Serial Number, table: input, address: 40, type: u32, poll: slow}
  - {key: firmware, label: Software version, table: input, address: 42, type: u16, poll: slow}
  - {key: x.voltage_thd, label: Voltage distortion, table: input, address: 43, type: u16, unit: '%', scale: 0.1}
  - {key: x.cos_phi, label: Cos φ, table: input, address: 44, type: s16, scale: 0.01, note: 'Positive = inductive, negative = capacitive (100 = 1.00).'}
  - {key: x.step_status, label: Status of steps, table: input, address: 45, type: u16, note: One bit per step relay (bit 0 = step 1); 1 = on.}
  - {key: x.latched_alarms, label: Latched alarms (alarms in memory), table: input, address: 46, type: u16, flags: alarm_bits}
  - {key: temperature, label: Internal temperature, table: input, address: 47, type: s16, unit: °C, note: A sign-extended 8-bit value.}
  - {key: x.external_temperature, label: External temperature, table: input, address: 48, type: s16, unit: °C, optional: true, note: A sign-extended 8-bit value.}
  - {key: x.voltage_h3, label: Voltage harmonics 3rd, table: input, address: 49, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h5, label: Voltage harmonics 5th, table: input, address: 50, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h7, label: Voltage harmonics 7th, table: input, address: 51, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h9, label: Voltage harmonics 9th, table: input, address: 52, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h11, label: Voltage harmonics 11th, table: input, address: 53, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h13, label: Voltage harmonics 13th, table: input, address: 54, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h15, label: Voltage harmonics 15th, table: input, address: 55, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h17, label: Voltage harmonics 17th, table: input, address: 56, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h19, label: Voltage harmonics 19th, table: input, address: 57, type: u16, unit: '%', scale: 0.1}
  - {key: x.voltage_h21, label: Voltage harmonics 21st, table: input, address: 58, type: u16, unit: '%', scale: 0.1}
  - {key: x.irms_i1, label: IRMS/I1, table: input, address: 59, type: u16, scale: 0.01}
  - {key: x.broken_steps, label: Broken status of steps, table: input, address: 60, type: u16, note: One bit per step relay (bit 0 = step 1); 1 = broken.}
  - {key: x.active_alarms, label: Active alarms, table: input, address: 61, type: u16, flags: alarm_bits}
  - {key: x.last_alarm, label: 'Alarm table, last alarm', table: input, address: 62, type: u16, note: PFC alarm code; 0 = no alarm.}
  - {key: x.alarm_2, label: 'Alarm table, 2nd alarm in alarm log', table: input, address: 63, type: u16, poll: slow}
  - {key: x.alarm_3, label: 'Alarm table, 3rd alarm in alarm log', table: input, address: 64, type: u16, poll: slow}
  - {key: x.alarm_4, label: 'Alarm table, 4th alarm in alarm log', table: input, address: 65, type: u16, poll: slow}
  - {key: x.alarm_5, label: 'Alarm table, 5th (earliest) alarm', table: input, address: 66, type: u16, poll: slow}
  - {key: x.detected_frequency, label: Detected frequency, table: input, address: 67, type: u16, enum: detected_frequency, poll: slow}
  - {key: x.power_flow, label: 'Cos φ sign: flow of power', table: input, address: 68, type: s16, enum: power_flow, note: A sign-extended 8-bit value.}
  - {key: x.fan_relay, label: Status of fan relay, table: input, address: 69, type: u16, enum: on_off}

  # Functions 3 and 6 (holding registers); number n is address n − 1
  - {key: x.reset_latched_alarms, label: Latched alarms (alarms in memory), table: holding, address: 0, type: u16, writable: true, min: 0, max: 0, note: Writing 0 clears the latched alarms.}
  - {key: x.alarm_mask, label: Alarm mask, table: holding, address: 1, type: u16, flags: alarm_bits, writable: true, poll: slow, note: 1 = alarm enabled.}
  - {key: x.step_shutdown_mask, label: Step shutdown mask of alarms, table: holding, address: 2, type: u16, flags: alarm_bits, writable: true, poll: slow, note: '1 = the alarm switches the steps off. Only bits 0, 1 and 9 (PFC alarms 9, 10, 2) can be changed; the others read fixed.'}
  - {key: x.temperature_limit, label: Temperature limit (temperature alarm), table: holding, address: 3, type: u16, unit: °C, writable: true, min: 20, max: 60, poll: slow}
  - {key: x.fan_offset_limit, label: Fan offset limit, table: holding, address: 4, type: u16, unit: °C, writable: true, min: 0, max: 50, poll: slow}
  - {key: x.thd_limit, label: Voltage distortion limit (alarm 10), table: holding, address: 5, type: u16, unit: '%', scale: 0.01, writable: true, min: 0.5, max: 2, poll: slow, note: 'The document gives the unit as 0.01 %, while the measured distortion is in 0.1 %.'}
  - {key: x.irms_i1_limit, label: Irms/I1 limit, table: holding, address: 6, type: u16, scale: 0.01, writable: true, min: 1, max: 1.5, poll: slow}
  - {key: x.application, label: Application, table: holding, address: 7, type: u16, enum: application, writable: true, poll: slow}
  - {key: x.ct_primary, label: Current transformer, table: holding, address: 8, type: u16, unit: A, writable: true, min: 25, max: 30000, poll: slow, note: With a 1 A secondary the value is the primary × 5.}
  - {key: x.input_voltage, label: Input voltage, table: holding, address: 9, type: u16, unit: V, writable: true, min: 80, max: 800, poll: slow}
  - {key: x.wiring, label: Wiring, table: holding, address: 10, type: u16, writable: true, min: 1, max: 54, poll: slow, note: 'Measured phase (L1, L2, L3) × voltage (L2-L3, L3-L1, L1-L2, L1-N, L2-N, L3-N) × current polarity (direct, reverse, auto detection), as in the document''s table 14.'}
  - {key: x.target_cos_phi_1, label: Target cos φ 1, table: holding, address: 11, type: u16, scale: 0.01, writable: true, min: 0.8, max: 1, poll: slow}
  - {key: x.target_cos_phi_1_sign, label: Target cos φ 1 sign, table: holding, address: 12, type: s16, enum: ind_cap, writable: true, poll: slow}
  - {key: x.target_cos_phi_2, label: Target cos φ 2, table: holding, address: 13, type: u16, scale: 0.01, writable: true, min: 0.8, max: 1, poll: slow}
  - {key: x.target_cos_phi_2_sign, label: Target cos φ 2 sign, table: holding, address: 14, type: s16, enum: ind_cap, writable: true, poll: slow}
  - {key: x.inductive_response, label: Inductive response value, table: holding, address: 15, type: u16, scale: 0.01, writable: true, poll: slow}
  - {key: x.capacitive_response, label: Capacitive response value, table: holding, address: 16, type: u16, scale: 0.01, writable: true, poll: slow}
  - {key: x.reconnection_delay, label: Reconnection delay, table: holding, address: 17, type: u16, unit: s, writable: true, min: 10, max: 900, poll: slow}
  - {key: x.step_program, label: Step program, table: holding, address: 18, type: u16, enum: step_program, writable: true, poll: slow}
  - {key: x.number_of_steps, label: Number of steps, table: holding, address: 19, type: u16, writable: true, min: 1, max: 12, poll: slow}
  - {key: x.step_sequence, label: Step sequence, table: holding, address: 20, type: u16, enum: step_sequence, writable: true, poll: slow}
  - {key: x.step_nominal_voltage, label: 'Step size monitoring: nominal voltage of steps', table: holding, address: 33, type: u16, unit: V, writable: true, min: 200, max: 800, poll: slow, note: Line-to-line.}
  - {key: x.ct_secondary, label: Current transformer secondary current, table: holding, address: 34, type: u16, enum: ct_secondary, writable: true, poll: slow}

enums:
  detected_frequency: {'1': 50 Hz, '2': 60 Hz}
  power_flow: {'0': Direct, '-1': Reverse (generator)}
  on_off: {'0': 'Off', '1': 'On'}
  application: {'1': 2 quadrants, '2': 4 quadrants}
  ind_cap: {'0': Inductive, '-1': Capacitive}
  ct_secondary: {'1': 1 A, '2': 5 A}
  step_program: {'1': Normal (sequence 1.2.4.), '2': Circular 1.1.1, '3': Circular 1.2.2, '4': Stack, '5': Optimal}
  step_sequence: {'1': 1.1.1.1.1.1., '2': 1.1.2.2.2.2., '3': 1.1.2.3.3.3., '4': 1.1.2.4.4.4., '5': 1.2.2.2.2.2., '6': 1.2.3.3.3.3., '7': 1.2.3.4.4.4., '8': 1.2.3.6.6.6., '9': 1.2.4.4.4.4., '10': 1.2.4.8.8.8.}

flags:
  alarm_bits: {'0': PFC alarm 9, '1': PFC alarm 10 (voltage distortion), '2': PFC alarm 11, '3': PFC alarm 12, '8': PFC alarm 1, '9': PFC alarm 2, '10': PFC alarm 3, '11': PFC alarm 4, '12': PFC alarm 5, '13': PFC alarm 6, '14': PFC alarm 7, '15': PFC alarm 8}

problems:
  - {when: {key: x.active_alarms, not: 0}, kind: warning, text: 'Power factor controller alarm active (bits 0x{value:X})'}
  - {when: {key: x.broken_steps, not: 0}, kind: warning, text: 'Capacitor step reported broken (bits 0x{value:X})'}

notes:
- The register tables count from 1 (input index 1, holding number 1); addresses here are that number − 1.
- '32-bit values: most significant register first. 8-bit values sit in a 16-bit register; the signed ones are sign-extended,
  so they read as s16.'
- The document numbers the alarm bits 1…16 (here bits 0…15) and maps them to the controller's own alarm numbers; bits 5…8
  (here 4…7) always read 0. What each PFC alarm number means is in the controller's manual, not in this document (alarm 10
  is the voltage distortion alarm).
- The controller needs a CCA fibre adapter; an MCU module converts the fibre to RS485 (or RS-232). Address 1…247 and baud
  rate 1200…38400 are set on the controller (Parameters → Modbus Setup), whose Modbus mode must be READ/WRITE for writes (READ/RESET
  allows resetting alarms only). Default address and serial format are not stated; unit 1 assumed. Port 502 only applies behind
  a Modbus TCP gateway.
- The sign of the active power and currents isn't stated.
- 'Left out: step size monitoring per step (holding 21…32, kvar per step 1…12).'
