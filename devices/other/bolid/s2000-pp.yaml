  modbus_system_state: {'85': Fault, '170': Restored}
  orion_state: {'1': Mains 220 V restored, '2': Mains 220 V failure, '3': Intrusion alarm, '4': Interference, '6': Interference cleared, '17': Arming failed, '18': Duress code entered, '19': Test (detector test triggered), '20': Test mode entered, '21': Test mode left, '22': Monitoring restored, '23': Arming delay, '24': Input armed, '34': Identification, '35': Technological input restored, '36': Technological input violated, '37': Fire, '38': Second technological input violated, '39': Equipment back to normal, '40': Fire 2, '41': Equipment fault, '42': Unknown device, '44': Attention (pre-alarm), '45': Input open circuit, '46': Two-wire line (DPLS) broken, '47': Two-wire line (DPLS) restored, '58': Silent alarm, '71': Level low, '72': Level normal, '74': Level high, '75': Level critically high, '76': Temperature high, '77': Level critically low, '78': Temperature normal, '79': Flood alarm, '80': Flood sensor restored, '82': Thermometer fault, '83': Thermometer restored, '84': Local programming started, '109': Input disarmed, '110': Alarm reset, '117': Disarmed input restored, '118': Entry alarm, '119': Disarmed input violated, '121': Output open circuit, '122': Output short circuit, '123': Output restored, '126': Output communication lost, '127': Output communication restored, '128': Output state changed, '130': Pump on, '131': Pump off, '135': Self-test error, '137': Start, '139': Extinguishing start failed, '140': Test, '141': Extinguishing start delay, '142': Extinguishing automation off, '143': Extinguishing start cancelled, '144': Extinguishing in progress, '145': Emergency extinguishing start, '146': Extinguishing started, '147': Extinguishing start blocked, '148': Extinguishing automation on, '149': Housing opened, '150': Voice alarm started, '151': Voice alarm cancelled, '152': Housing closed, '153': Actuator in working position, '154': Actuator in initial position, '155': Actuator failure, '156': Actuator error, '158': Internal zone restored, '161': Extinguishing start delay stopped, '165': Input configuration error, '187': Input communication lost, '188': Input communication restored, '189': Communication lost on DPLS branch 1, '190': Communication lost on DPLS branch 2, '191': Communication restored on DPLS branch 1, '192': Output voltage switched off, '193': Output voltage switched on, '194': Power supply overload, '195': Power supply overload cleared, '196': Charger fault, '197': Charger restored, '198': Power supply fault, '199': Power supply restored, '200': Battery restored, '201': Communication restored on DPLS branch 2, '202': Battery fault, '203': Device restarted, '204': Maintenance required, '205': Battery test failed, '206': Temperature low, '211': Battery low, '212': Backup battery low, '213': Backup battery restored, '214': Input short circuit, '215': Two-wire line (DPLS) short circuit, '216': Detector triggered (unconfirmed), '217': RS-485 ring branch off, '218': RS-485 ring branch restored, '220': Smoke control sensor triggered, '221': Smoke control sensor failure, '222': Two-wire line (DPLS) overvoltage, '223': Guard patrol mark, '237': Partition disarmed under duress, '241': Partition armed, '242': Partition disarmed, '250': Device communication lost, '251': Device communication restored, '253': S2000M console switched on}

problems:
  - {when: {key: x.zone1_state, in: [37, 40, 44, 216]}, kind: warning, text: 'Zone 1: {text}'}
  - {when: {key: x.zone1_state, in: [3, 18, 58, 79, 118, 149]}, kind: warning, text: 'Zone 1 alarm: {text}'}
  - {when: {key: x.zone1_state, in: [139, 141, 144, 145, 146, 147]}, kind: warning, text: 'Zone 1 extinguishing: {text}'}
  - {when: {key: x.zone1_state, in: [2, 41, 45, 46, 82, 121, 122, 126, 135, 155, 156, 165, 187, 189, 190, 194, 196, 198, 202, 205, 211, 212, 214, 215, 221, 222, 250]}, kind: warning, text: 'Zone 1 fault: {text}'}

notes:
- 'The S2000-PP is a gateway: it maps detectors, partitions and relays of a Bolid Orion system (polled itself in Orion master
  mode, or fed by an S2000M console in slave mode) to Modbus zones 1-512, partitions 1-64 and relays 1-255, as set up in its
  database with the UProg program. Which zone is which detector is site configuration; only zone 1, partition 1 and relay
  1 are listed here, the others follow at the stated offsets.'
- Addresses are the protocol addresses as the document gives them (its request examples send 0x9C48 for zone 9 = 40008, 0x2710
  for relay 1 = 10000).
- 'Functions 1, 3, 5, 6, 15 and 16. Exception 15 means the requested data (e.g. a zone''s state) hasn''t arrived from the
  Orion side yet: repeat the request later. Exception 6 = busy.'
- Modbus address 1-247, 1200-115200 Bd, parity none/even/odd and 1 or 2 stop bits are set with UProg; the document gives no
  factory defaults, so unit 1, 9600 Bd and 8N1 here are assumptions. Packets are at most 256 bytes.
- 'Zone states are written to the zone register with function 6: 109 disarm, 24 arm, 142 / 148 automation off / on, 143 reset
  extinguishing start, 146 extinguishing start (as the zone type allows).'
- Each zone and partition state register carries the two highest-priority current states (table 5 gives every state a priority,
  1 = highest). The problems here look at zone 1 only.
- 'Left out: the extended zone / partition states (46192, 46200) and the event records (46264 oldest unread, 46296 by number),
  which are variable-length byte structures (event number, length, code, then typed fields: user, partition, zone, relay,
  relay state, time, partition id).'
- Events 90 / 91 (Modbus channel lost / restored) go to the Orion side only and don't change zone states.
