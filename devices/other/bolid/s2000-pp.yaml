modbusspec: 0
id: bolid-s2000-pp
manufacturer: Bolid
name: S2000-PP protocol converter (Orion security and fire system to Modbus RTU)
kind: other

sources:
- title: Преобразователь протокола «С2000-ПП», руководство по эксплуатации АЦДР.426469.020 РЭп (firmware 1.31)
  version: Изм.1, 2018-02-06
  url: https://bolid.ru/files/373/566/s2000_pp_re_v.1.31_apr_18.pdf
  sha256: e26cbd3b6449f28ddafd2c9e1fedd210df87c24924e5e17f9429284bbe47c29a
  archive_url: https://web.archive.org/web/20220314074455/https://bolid.ru/files/373/566/s2000_pp_re_v.1.31_apr_18.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 46152
    type: u16
    equals: 36

points:
  # Identity and database sizes
  - {key: x.device_type, label: Device type, table: holding, address: 46152, type: u16, poll: slow, note: 36 for the S2000-PP.}
  - {key: firmware, label: Device version, table: holding, address: 46153, type: u16, scale: 0.01, poll: slow, note: 'Version × 100, e.g. 131 = 1.31.'}
  - {key: x.max_relays, label: Maximum number of relays, table: holding, address: 46144, type: u16, poll: slow}
  - {key: x.max_zones, label: Maximum number of zones, table: holding, address: 46145, type: u16, poll: slow}
  - {key: x.max_partitions, label: Maximum number of partitions, table: holding, address: 46146, type: u16, poll: slow}
  - {key: x.max_zone_states, label: Maximum number of zone states, table: holding, address: 46147, type: u16, poll: slow}
  - {key: x.max_partition_states, label: Maximum number of partition states, table: holding, address: 46148, type: u16, poll: slow}
  - {key: x.max_events, label: Maximum number of events, table: holding, address: 46149, type: u16, poll: slow}
  - {key: x.max_event_length, label: Maximum event description length, table: holding, address: 46150, type: u16, poll: slow}
  # Zones, partitions, relays (first of each; see notes for the others)
  - {key: x.zone1_state, label: Zone 1 state (highest priority), table: holding, address: 40000, type: u16, bits: [8, 15], enum: orion_state, note: 'Zone n is at 40000 + n − 1 (up to 40511). High byte = the zone''s highest-priority state, low byte = the next one (table 5 codes).'}
  - {key: x.zone1_state2, label: Zone 1 state (second), table: holding, address: 40000, type: u16, bits: [0, 7], enum: orion_state}
  - {key: x.zone1_value, label: Zone 1 temperature / humidity / CO, table: holding, address: 30000, type: s16, scale: 0.00390625, optional: true, note: 'Signed fixed point, high byte integer part, low byte fraction (raw ÷ 256); °C, % or ppm depending on the detector. Only in Orion master mode and for zones of type 6; zone n at 30000 + n − 1 (up to 30511), at most 12 registers per request, all from one Orion device. Otherwise the device answers exception 2 or 3.'}
  - {key: x.partition1_state, label: Partition 1 state (highest priority), table: holding, address: 44096, type: u16, bits: [8, 15], enum: orion_state, writable: true, note: 'Partition n is at 44096 + n − 1 (up to 44159). Write 24 to arm, 109 to disarm.'}
  - {key: x.partition1_state2, label: Partition 1 state (second), table: holding, address: 44096, type: u16, bits: [0, 7], enum: orion_state}
  - {key: x.relay1, label: Relay 1, table: coil, address: 10000, type: bool, enum: relay_state, writable: true, note: Relay n is coil 10000 + n − 1 (up to 10254). Only relays not used by the Orion device's own tactics can be switched.}
  # Event buffer
  - {key: x.newest_event, label: Number of the newest event, table: holding, address: 46160, type: u16}
  - {key: x.oldest_event, label: Number of the oldest event, table: holding, address: 46161, type: u16}
  - {key: x.unread_events, label: Number of unread events, table: holding, address: 46162, type: u16}
  - {key: x.mark_event_read, label: Mark event as read, table: holding, address: 46163, type: u16, writable: true, poll: slow, note: Write the event number.}
  - {key: x.clear_events, label: Clear event buffer, table: holding, address: 46164, type: u16, writable: true, poll: slow, note: Write 0.}
  # Clock
  - {key: x.clock, label: Device time and date, table: holding, address: 46165, type: datetime, length: 3, datetime: {hour: {register: 0, bits: [8, 15]}, minute: {register: 0, bits: [0, 7]}, second: {register: 1, bits: [8, 15]}, day: {register: 1, bits: [0, 7]}, month: {register: 2, bits: [8, 15]}, year: {register: 2, bits: [0, 7], offset: 2000}}, writable: true, write_multiple: true, poll: slow, verified: false, note: 'Bytes hour, minute, second, day, month, year. The year is two digits (the document''s event example has 17 for 2017); the offset 2000 is assumed. Setting the time works only in Orion master mode.'}
  # Modbus system state and selectors for two-step reads
  - {key: x.modbus_system_state, label: Modbus system state, table: holding, address: 46136, type: u16, enum: modbus_system_state, writable: true, poll: slow, note: 'Written by the Modbus master: 85 makes the S2000-PP send event 90 (no communication channel) to the Orion system, 170 event 91 (restored). Firmware 1.31 and later.'}
  - {key: x.select_zone, label: Zone number for the extended zone state, table: holding, address: 46176, type: u16, writable: true, poll: slow}
  - {key: x.select_partition, label: Partition number for the extended partition state, table: holding, address: 46177, type: u16, writable: true, poll: slow}
  - {key: x.select_event, label: Event number for reading by number, table: holding, address: 46178, type: u16, writable: true, poll: slow}
  - {key: x.select_value_zone, label: Zone number for temperature / humidity / CO, table: holding, address: 46179, type: u16, writable: true, poll: slow}
  - {key: x.select_counter_zone, label: Zone number for a pulse counter, table: holding, address: 46180, type: u16, writable: true, poll: slow}
  - {key: x.select_rip_zone, label: Zone number for power supply voltage / current, table: holding, address: 46181, type: u16, writable: true, poll: slow}
  - {key: x.selected_value, label: Value of the selected zone, table: holding, address: 46328, type: s16, scale: 0.00390625, optional: true, note: 'After writing a zone number to 46179 or 46181: temperature °C, humidity %, CO ppm, or a RIP power supply''s voltage V / current A / battery charge %. Signed fixed point (raw ÷ 256). Exception 15 means the value isn''t there yet: ask again later.'}
  - {key: x.selected_counter_high, label: Pulse counter of the selected zone (bytes 1-2), table: holding, address: 46332, type: u16, optional: true}
  - {key: x.selected_counter_low, label: Pulse counter of the selected zone (bytes 3-6), table: holding, address: 46333, type: u32, optional: true}

derived:
  - {key: x.selected_counter, label: Pulse counter of the selected zone, sum: [{key: x.selected_counter_high, factor: 4294967296}, {key: x.selected_counter_low}], note: '6-byte counter, most significant byte first, after writing a zone number to 46180 (S2000-ASR counters).'}

