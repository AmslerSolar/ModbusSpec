modbusspec: 0
id: dab-esyline
manufacturer: DAB Pumps
name: Esyline pump system (Esy.Max via Esy I/O)
kind: other

sources:
- title: Modbus specifications for Esyline products (60203693 ESYBOX-LINE-MODBUS)
  version: 03/21 (cod. 60203693)
  url: https://dabpumps.co.za/wp-content/uploads/2024/01/60203693_ESYBOX-LINE-MODBUS.pdf
  sha256: 5b710fe5d68f670e14fc09f1f3f06f9ba575959b8ea9148c560d504faf02656e

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

points:
  # System
  - {key: x.system_status, label: System Status, table: holding, address: 0, type: u16, enum: system_status, poll: fast}
  - {key: x.pump_count, label: Pump Numbers, table: holding, address: 1, type: u16, poll: slow, note: Number of connected pumps.}
  - {key: x.pumps_running, label: Pump Running Numbers, table: holding, address: 2, type: u16, poll: fast}
  - {key: x.pumps_faulted, label: Pump Fault Number, table: holding, address: 3, type: u16, poll: fast}
  - {key: x.active_inverters, label: NA-Active Inverter Number, table: holding, address: 4, type: u16, poll: slow}
  - {key: x.max_simultaneous_inverters, label: NC-Contemporary Inverter, table: holding, address: 5, type: u16, poll: slow}
  - {key: x.system_power, label: System Power, table: holding, address: 6, type: u16, unit: W, poll: fast, note: Power delivered by the pumping system.}
  - {key: x.delivery_pressure, label: VP Sys Press Bar, table: holding, address: 16, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.suction_pressure, label: VPin Sys Suct Press Bar, table: holding, address: 17, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.remote_pressure, label: VPr Remote Press Bar, table: holding, address: 18, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast, note: Remote sensor; answers with an error when it is off.}
  - {key: x.flow, label: System Flow Liter, table: holding, address: 19, type: u16, unit: l/min, optional: true, poll: fast}
  - {key: x.delivery_pressure_psi, label: VP Sys Press Psi, table: holding, address: 25, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.suction_pressure_psi, label: VPin Sys Suct Press Psi, table: holding, address: 26, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.remote_pressure_psi, label: VPr Remote Press Psi, table: holding, address: 27, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.flow_gal, label: System Flow GAL, table: holding, address: 28, type: u16, unit: gal/min, optional: true, poll: fast}
  - {key: x.input_1, label: I1 Input 1 State, table: holding, address: 32, type: u16, enum: input, poll: fast}
  - {key: x.input_2, label: I2 Input 2 state, table: holding, address: 33, type: u16, enum: input, poll: fast}
  - {key: x.input_3, label: I3 Input 3 state, table: holding, address: 34, type: u16, enum: input, poll: fast}
  - {key: x.input_4, label: I4 Input 4 state, table: holding, address: 35, type: u16, enum: input, poll: fast}
  - {key: x.output_1, label: O1 Output 1 state, table: holding, address: 48, type: u16, enum: output, poll: fast}
  - {key: x.output_2, label: O2 Output 2 state, table: holding, address: 49, type: u16, enum: output, poll: fast}

  # Pumps 1–4 (status, delivery pressure, flow)
  - {key: x.pump1_status, label: Pump 1 status, table: holding, address: 64, type: u16, enum: pump_status, poll: fast}
  - {key: x.pump1_pressure, label: VP Pump 1 Press Bar, table: holding, address: 66, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.pump1_flow, label: Pump 1 Flow Liter, table: holding, address: 68, type: u16, unit: l/min, optional: true, poll: fast}
  - {key: x.pump1_pressure_psi, label: VP Pump 1 Press Psi, table: holding, address: 73, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.pump1_flow_gal, label: Pump 1 Flow Gal, table: holding, address: 75, type: u16, unit: gal/min, optional: true, poll: fast}
  - {key: x.pump2_status, label: Pump 2 status, table: holding, address: 80, type: u16, enum: pump_status, poll: fast}
  - {key: x.pump2_pressure, label: VP Pump 2 Press Bar, table: holding, address: 82, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.pump2_flow, label: Pump 2 Flow Liter, table: holding, address: 84, type: u16, unit: l/min, optional: true, poll: fast}
  - {key: x.pump2_pressure_psi, label: VP Pump 2 Press Psi, table: holding, address: 89, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.pump2_flow_gal, label: Pump 2 Flow Gal, table: holding, address: 91, type: u16, unit: gal/min, optional: true, poll: fast}
  - {key: x.pump3_status, label: Pump 3 status, table: holding, address: 96, type: u16, enum: pump_status, poll: fast}
  - {key: x.pump3_pressure, label: VP Pump 3 Press Bar, table: holding, address: 98, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.pump3_flow, label: Pump 3 Flow Liter, table: holding, address: 100, type: u16, unit: l/min, optional: true, poll: fast}
  - {key: x.pump3_pressure_psi, label: VP Pump 3 Press Psi, table: holding, address: 105, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.pump3_flow_gal, label: Pump 3 Flow Gal, table: holding, address: 107, type: u16, unit: gal/min, optional: true, poll: fast}
  - {key: x.pump4_status, label: Pump 4 status, table: holding, address: 112, type: u16, enum: pump_status, poll: fast}
  - {key: x.pump4_pressure, label: VP Pump 4 Press Bar, table: holding, address: 114, type: u16, unit: bar, scale: 0.1, optional: true, poll: fast}
  - {key: x.pump4_flow, label: Pump 4 Flow Liter, table: holding, address: 116, type: u16, unit: l/min, optional: true, poll: fast}
  - {key: x.pump4_pressure_psi, label: VP Pump 4 Press Psi, table: holding, address: 121, type: u16, unit: psi, optional: true, poll: fast}
  - {key: x.pump4_flow_gal, label: Pump 4 Flow Gal, table: holding, address: 123, type: u16, unit: gal/min, optional: true, poll: fast}

  # Controls (written with function 06)
  - {key: x.reset_fault, label: Reset Fault, table: holding, address: 256, type: u16, writable: true, write_only: true, poll: slow, note: Any value other than 0 resets the faults of all connected inverters.}
  - {key: x.restart_pressure_drop, label: RP Pressure fall to Restart Bar, table: holding, address: 288, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_pressure, label: SP Setpoint Pressure Bar, table: holding, address: 289, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux1, label: P1 Setpoint Aux 1 Bar, table: holding, address: 290, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux2, label: P2 Setpoint Aux 2 Bar, table: holding, address: 291, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux3, label: P3 Setpoint Aux 3 Bar, table: holding, address: 292, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux4, label: P4 Setpoint Aux 4 Bar, table: holding, address: 293, type: u16, unit: bar, scale: 0.1, writable: true, optional: true, poll: slow}
  - {key: x.restart_pressure_drop_psi, label: RP Pressure fall to Restart Psi, table: holding, address: 304, type: u16, unit: psi, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_pressure_psi, label: SP Setpoint Pressure Psi, table: holding, address: 305, type: u16, unit: psi, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux1_psi, label: P1 Setpoint Aux 1 Psi, table: holding, address: 306, type: u16, unit: psi, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux2_psi, label: P2 Setpoint Aux 2 Psi, table: holding, address: 307, type: u16, unit: psi, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux3_psi, label: P3 Setpoint Aux 3 Psi, table: holding, address: 308, type: u16, unit: psi, writable: true, optional: true, poll: slow}
  - {key: x.setpoint_aux4_psi, label: P4 Setpoint Aux 4 Psi, table: holding, address: 309, type: u16, unit: psi, writable: true, optional: true, poll: slow}

enums:
  system_status: {'0': Working correctly, '1': Not aligned (connection to all devices of the multi-inverter system could not be re-established), '2': One or more devices need assistance}
  pump_status: {'0': Disabled, '1': Standby, '2': 'Active, pumping', '3': Set as standby pump, '4': Error, '5': Not present in the pumping system}
  input: {'0': Open (not energised), '1': Closed (energised)}
  output: {'0': Open, '1': Closed}

problems:
  - {when: {key: x.system_status, equals: 1}, kind: warning, text: 'Pump system not aligned: not all devices could be reconnected'}
  - {when: {key: x.system_status, equals: 2}, kind: warning, text: One or more pumps need assistance}
  - {when: {key: x.pumps_faulted, not: 0}, kind: fault, text: '{value} pump(s) in fault'}
  - {when: {key: x.pump1_status, equals: 4}, kind: fault, text: Pump 1 in error}
  - {when: {key: x.pump2_status, equals: 4}, kind: fault, text: Pump 2 in error}
  - {when: {key: x.pump3_status, equals: 4}, kind: fault, text: Pump 3 in error}
  - {when: {key: x.pump4_status, equals: 4}, kind: fault, text: Pump 4 in error}

notes:
- The Esy.Max pump is reached over Modbus RTU through the Esy I/O accessory, which acts as a gateway to the pump and to the
  pump set it belongs to. Esy I/O and Esy.Max need current firmware for Modbus.
- Addresses are the hex register numbers of the document (starting at 0x00), taken as protocol addresses. Registers are read
  with function 03 and written with 06.
- 'The pressure and flow registers answer only in the unit system set on the pump (parameter MS Measure System): bar and l/min,
  or psi and gal/min; the other ones answer with exception 02. All of them are therefore optional.'
- Exception 04 means the Esy I/O got no answer from the pump (no wireless link or pump off).
- 'Serial: RS485 on a terminal block, unit 1 by default (1–247), 2400–115200 baud, parity none/even/odd, 1 or 2 stop bits;
  the default baud rate and parity aren''t stated. The document asks for a poll interval under a minute for reading and under
  2 s for writing (exact meaning unclear).'
- Per-pump pressure is labelled 'system pressure in delivery' for every pump in the document. No register identifies the device,
  so there is no identify.
