notes:
- The document names no brand (it speaks of the original equipment manufacturer); filed under Cascade, whose site publishes
  it. Possibly an OEM product.
- 'Addresses: the document''s Modbus addresses start at 1 and are sent minus 1 (register 1 is protocol address 0); AI 1 (document
  2) is address 1, DI 1 (50) is 49, DO 1 (74) is 73, AO 1 (98) is 97, Math 1 (201, 202) is 200.'
- The recorder can be a Modbus RTU slave or Modbus TCP server (or master / client); the unit id, serial settings and port
  are set in the recorder and not stated in the document. Up to 120 registers per read (function 04) or write (function 10).
  The document's function-code table swaps 03 and 04; its communication examples read these values as input registers with
  04.
- 'Values are raw and must be scaled with the channel''s scale low (SL) and high (SH) set in the recorder (Menu > More > Config
  > AI): AI value = raw × (SH − SL) / 65535 + SL; Math value = raw × (SH − SL) / 4294967295 + SL; AO value = raw × 65.535
  / 65535 − 32.768. These settings-dependent scales can''t be expressed here; DI and DO process values are given without a
  scale.'
- 65534 (2-register values) and 4294967294 (Math) mean a communication error.
- Math values are high word first according to the register table; the document's data type table calls all values little
  endian, which contradicts the register table and the byte order of its examples. Not checked; word order taken from the
  register table.
- 'Left out: the External channel holding registers a master writes into the recorder (1–96 two-byte, 200–391 four-byte low
  word first).'
- The document gives no identification registers and no serial number.
