notes:
- The document doesn't name the maker. It uses the same register list layout and address scheme as Vzlet's own register lists
  and is published by the same distributor; Vzlet is assumed (unverified).
- A heat calculator for up to 3 heat systems with 6 measuring points (flow, temperature, pressure) and 7 calculation channels
  (0–6); each heat system computes heats W1, W2 and W3 by configurable formulas.
- 'The document numbers registers with six-digit logical references starting at 1: 400001 = holding 0, 416385 = holding 16384,
  432769 = holding 32768, 449153 = holding 49152; 300001 = input 0; 100001 = discrete input 0. The addresses here are those
  references minus 400001 / 300001 (the D and F prefixes only mark 32-bit and float values).'
- 'Not stated in the document; assumed: 32-bit values and floats high word first, one-byte (''unsigned char'') values in the
  low byte of their register, the serial format (baud rate by index, default not given), the default unit id and port 502
  for a Modbus TCP gateway.'
- 'Units depend on settings that can''t be expressed yet: heat in GJ or Gcal (holding 211), heat power in MW, GJ/h or Gcal/h
  (holding 212), and a 1:1000 scale (holding 214) that turns GJ into TJ, MW into GW, tonnes into kilotonnes. The defaults
  as labelled in the document (GJ, MW, t) are used.'
- Heat and mass totals are split into an integer part and a fraction, both floats; the derived values add them.
- 'Left out: the discrete inputs (100001 ff., they repeat the status bits per sensor and channel), heat-system and abnormal-situation
  configuration, sensor types and correction coefficients, contract values, hourly / daily / monthly averages and states,
  density and enthalpy per channel, ADC codes, resistance and current per point, frequency output settings.'
