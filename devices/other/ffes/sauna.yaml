modbusspec: 0
id: ffes-sauna
manufacturer: FFES
name: Sauna controllers
kind: other

sources:
- id: ffes-sauna-modbus-home-assistant
  title: ffes_sauna__modbus_home_assistant (Home Assistant integration)
  url: https://github.com/LeszekWroblowski/ffes_sauna__modbus_home_assistant
  license: MIT
  commit: c238da0b356d9dd19968a78083c706b835beb644
  path: custom_components/ffes_sauna/const.py, custom_components/ffes_sauna/coordinator.py, custom_components/ffes_sauna/sensor.py,
    custom_components/ffes_sauna/number.py, custom_components/ffes_sauna/switch.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - ffes-sauna-modbus-home-assistant

points:
  - {key: x.controller_state, label: Controller state, table: coil, address: 1, type: bool}
  - {key: x.session_state, label: Session state, table: coil, address: 2, type: bool}
  - {key: x.ventilation_state, label: Ventilation, table: coil, address: 3, type: bool, writable: true}
  - {key: x.out1_state, label: Out1 state, table: coil, address: 4, type: bool}
  - {key: x.out2_state, label: Out2 state, table: coil, address: 5, type: bool}
  - {key: x.out3_state, label: Light (output 3), table: coil, address: 6, type: bool, writable: true, note: The project drives the sauna light through this output.}
  - {key: x.out4_state, label: Out4 state, table: coil, address: 7, type: bool}
  - {key: x.out5_state, label: Out5 state, table: coil, address: 8, type: bool}
  - {key: x.out6_state, label: Out6 state, table: coil, address: 9, type: bool}
  - {key: x.out7_state, label: Fan Output, table: coil, address: 10, type: bool, writable: true, note: The project drives the physical fan output through this coil.}
  - {key: x.wifi_connection, label: WiFi Connected, table: coil, address: 40, type: bool}
  - {key: x.server_connection, label: Server Connected, table: coil, address: 41, type: bool}
  - {key: x.pairing_mode, label: Pairing mode, table: coil, address: 42, type: bool}
  - {key: x.frost_protection, label: Frost Protection, table: coil, address: 51, type: bool, writable: true}
  - {key: x.frost_protection_status, label: Frost Protection Active, table: coil, address: 52, type: bool, note: Whether frost protection is currently active (the setting is coil 51).}
  - {key: x.infrared_mix_status, label: Infrared Mix, table: coil, address: 53, type: bool, writable: true, note: The project reads and writes this coil to switch infrared MIX on and off.}
  - {key: x.infrared_mix_mode, label: Infrared mix mode, table: coil, address: 54, type: bool}
  - {key: x.second_temp_function_status, label: Second temp function status, table: coil, address: 56, type: bool}
  - {key: x.temperature_set, label: Target Temperature, table: holding, address: 1, type: u16, unit: °C, writable: true}
  - {key: x.temperature_actual, label: Current Temperature, table: holding, address: 2, type: u16, unit: °C, note: Read unsigned by the project; FFES gives a range of -20 to 125 °C.}
  - {key: x.clock, label: Clock, table: holding, address: 3, type: u16}
  - {key: x.sauna_profile, label: Sauna profile, table: holding, address: 4, type: u16, enum: profile, writable: true, note: Can only be changed while the controller status (20) is off or standby.}
  - {key: x.session_time, label: Session Time, table: holding, address: 5, type: u16, unit: min, writable: true, note: 'The project treats the value as minutes (1-2000); the FFES sheet in the project shows session time as HH:MM 00:00-20:00, so it may be HHMM. Unverified.'}
  - {key: x.ventilation_time, label: Ventilation Time, table: holding, address: 6, type: u16, unit: min, writable: true, note: Minutes per the project; may be HHMM like 5. Unverified.}
  - {key: x.vaporizer_preheat_time, label: Vaporizer preheat time, table: holding, address: 7, type: u16}
  - {key: x.aroma_cycle_time, label: Aroma cycle time, table: holding, address: 8, type: u16}
  - {key: x.aroma_set_value, label: Aromatherapy, table: holding, address: 9, type: u16, unit: '%', writable: true}
  - {key: x.vaporizer_humidity, label: Target Humidity, table: holding, address: 10, type: u16, unit: '%', writable: true}
  - {key: error_code, label: Error code, table: holding, address: 11, type: u16, enum: error}
  - {key: x.cpir_group_1_set, label: Cpir group 1 set, table: holding, address: 12, type: u16}
  - {key: x.cpir_group_2_set, label: Cpir group 2 set, table: holding, address: 13, type: u16}
  - {key: x.temp2_actual, label: Temp2 actual, table: holding, address: 14, type: u16}
  - {key: x.humidity_actual, label: Humidity, table: holding, address: 15, type: u16, unit: '%'}
  - {key: state, label: Controller status, table: holding, address: 20, type: u16, enum: status, writable: true, note: 'Write 1 to start heating (a session), 0 to stop.'}
  - {key: x.main_board_sv, label: Main board sv, table: holding, address: 21, type: u16}
  - {key: x.cpir_g1_power, label: CPIR Group 1 Power, table: holding, address: 26, type: u16, unit: '%', writable: true}
  - {key: x.cpir_g2_power, label: CPIR Group 2 Power, table: holding, address: 27, type: u16, unit: '%', writable: true}
  - {key: x.cpir_g3_power, label: CPIR Group 3 Power, table: holding, address: 28, type: u16, unit: '%', writable: true}
  - {key: x.cpir_g4_power, label: CPIR Group 4 Power, table: holding, address: 29, type: u16, unit: '%', writable: true}
  - {key: x.module_software_version, label: Software Version, table: holding, address: 49, type: u16}
  - {key: x.controller_model, label: Controller model, table: holding, address: 50, type: u16, flags: model, note: Bit set of the functions the controller supports; decides which profiles are offered (infrared MIX needs both heater and infrared).}

enums:
  profile: {'1': Infrared Sauna, '2': Dry Sauna, '3': Wet Sauna, '4': Ventilation, '5': Steam Bath, '6': Infrared CPIR, '7': Infrared MIX}
  status: {'0': 'Off', '1': Heating, '2': Ventilation, '3': Standby}
  error: {'0': No Error, '1': Temperature sensor disconnected or thermal fuse damaged, '2': Temperature exceeded maximum (125°C or 80°C for Wet/IR/Bath), '3': Invalid temperature sensor reading, '4': Rapid temperature increase, '5': Low water level in heater tank, '6': Humidity sensor reading error, '7': Emergency switch active, '8': Door open too long during session, '11': CPIR module error L1, '12': CPIR module error L2, '13': CPIR module error L3}

flags:
  model: {'0': IR, '1': Heater, '2': Steam Bath, '3': Wet, '4': Aroma, '5': Fan, '6': IR CPIR}

notes:
- Addresses are FFES's REG numbers used as protocol addresses (REG[1] = address 1); the project fixed an earlier off-by-one
  and reads registers 1-50 in one request.
- Switching outputs, ventilation, frost protection and infrared MIX are coils (function 01/05) with the same numbering; the
  project reads coils 1-56 in one request.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
