modbusspec: 0
id: selco-s6100
manufacturer: SELCO
name: SIGMA S6100 S/LS module (synchroniser and load sharer)
kind: other

sources:
- title: SIGMA S6100 MODBUS Memory Map (S6100 SIGMA S/LS Module)
  version: Revision 09-07-2009
  url: https://www.selco.com/selco2016/wp-content/uploads/2016/04/S6100-Modbus-RTU.pdf
  sha256: 346e325b0b6655a454c851828850a685a0487ea18a015c61c4267b388ea5ef74
  archive_url: https://web.archive.org/web/20190923181323/http://www.selco.com/selco2016/wp-content/uploads/2016/04/S6100-Modbus-RTU.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  # Measurements
  - {key: x.u12_voltage, label: Phase 1-2 Voltage (U12), table: holding, address: 0, type: u16, unit: V, poll: fast}
  - {key: x.u23_voltage, label: Phase 2-3 Voltage (U23), table: holding, address: 1, type: u16, unit: V, poll: fast}
  - {key: x.u31_voltage, label: Phase 3-1 Voltage (U31), table: holding, address: 2, type: u16, unit: V, poll: fast}
  - {key: l1_voltage, label: Phase 1-N Voltage (U1N), table: holding, address: 3, type: u16, unit: V, poll: fast}
  - {key: l2_voltage, label: Phase 2-N Voltage (U2N), table: holding, address: 4, type: u16, unit: V, poll: fast}
  - {key: l3_voltage, label: Phase 3-N Voltage (U3N), table: holding, address: 5, type: u16, unit: V, poll: fast}
  - {key: frequency, label: Frequency, table: holding, address: 6, type: u16, unit: Hz, scale: 0.1, poll: fast}
  - {key: x.phase_deviation, label: Phase Deviation, table: holding, address: 7, type: u16, unit: °, poll: fast}

  # Status (each register 0 or 1)
  - {key: x.gov_idle, label: Gov Idle, table: holding, address: 29, type: u16, poll: fast}
  - {key: x.gov_freq_ctrl, label: Gov Freq Ctrl, table: holding, address: 30, type: u16, poll: fast}
  - {key: x.gov_sync, label: Gov Sync, table: holding, address: 31, type: u16, poll: fast}
  - {key: x.gov_ramp_up, label: Gov Ramp Up, table: holding, address: 32, type: u16, poll: fast}
  - {key: x.gov_ls, label: Gov Ls, table: holding, address: 33, type: u16, poll: fast}
  - {key: x.gov_unload, label: Gov Unload, table: holding, address: 34, type: u16, poll: fast}
  - {key: x.avr_idle, label: Avr Idle, table: holding, address: 35, type: u16, poll: fast}
  - {key: x.avr_volt_ctrl, label: Avr Volt Ctrl, table: holding, address: 36, type: u16, poll: fast}
  - {key: x.avr_match, label: Avr Matching, table: holding, address: 37, type: u16, poll: fast}
  - {key: x.avr_ramp_up, label: Avr Ramp Up, table: holding, address: 38, type: u16, poll: fast}
  - {key: x.avr_ls, label: Avr Ls, table: holding, address: 39, type: u16, poll: fast}
  - {key: x.avr_unload, label: Avr Unload, table: holding, address: 40, type: u16, poll: fast}
  - {key: x.engine_start, label: Engine Start, table: holding, address: 41, type: u16, poll: fast}

  # Trips and errors (each register 0 or 1)
  - {key: x.ve_upper_trip, label: Voltage Establish Upper Trip, table: holding, address: 54, type: u16, poll: fast}
  - {key: x.ve_lower_trip, label: Voltage Establish Lower Trip, table: holding, address: 55, type: u16, poll: fast}
  - {key: x.fe_upper_trip, label: Frequency Establish Upper Trip, table: holding, address: 56, type: u16, poll: fast}
  - {key: x.fe_lower_trip, label: Frequency Establish Lower Trip, table: holding, address: 57, type: u16, poll: fast}
  - {key: x.cb_close_error, label: Circuit Breaker Close Error, table: holding, address: 58, type: u16, poll: fast}
  - {key: x.sync_error, label: Sync Error, table: holding, address: 59, type: u16, poll: fast}
  - {key: x.engine_start_error, label: Engine Start Error, table: holding, address: 60, type: u16, poll: fast}
  - {key: x.engine_error, label: Engine Error, table: holding, address: 61, type: u16, poll: fast}

  # Faults (each register 0 or 1)
  - {key: x.power_supply_1_fault, label: Powersupply 1 Fault, table: holding, address: 68, type: u16, poll: fast}
  - {key: x.power_supply_2_fault, label: Powersupply 2 Fault, table: holding, address: 69, type: u16, poll: fast}
  - {key: x.canbus_fault, label: Canbus Fault, table: holding, address: 70, type: u16, poll: fast}
  - {key: x.measure_head_fault, label: Measurehead Fault, table: holding, address: 71, type: u16, poll: fast}
  - {key: x.ext_sync_fault, label: External Sync Fault, table: holding, address: 72, type: u16, poll: fast}
  - {key: x.int_sync_fault, label: Internal Sync Fault, table: holding, address: 73, type: u16, poll: fast}
  - {key: x.deadbus_wire_fault, label: Deadbus Wire Fault, table: holding, address: 74, type: u16, poll: fast}
  - {key: x.ct_wire_fault, label: CT Wire Fault, table: holding, address: 75, type: u16, poll: fast}

  # Bit masks and control states
  - {key: x.led_on, label: LED On/Off Status, table: holding, address: 79, type: u16, flags: leds, poll: fast}
  - {key: x.led_flash, label: LED Flash Status, table: holding, address: 80, type: u16, flags: leds, poll: fast}
  - {key: x.inputs, label: Input Status, table: holding, address: 81, type: u16, flags: inputs, poll: fast}
  - {key: x.outputs, label: Output Status, table: holding, address: 82, type: u16, flags: outputs, writable: true, poll: fast}
  - {key: x.relays, label: Relay Status, table: holding, address: 83, type: u16, flags: relays, poll: fast}
  - {key: state, label: Status information for Speed Control, table: holding, address: 86, type: u16, enum: speed_ctrl_status, poll: fast}
  - {key: x.volt_ctrl_status, label: Status information for Voltage Control, table: holding, address: 87, type: u16, enum: volt_ctrl_status, poll: fast}
  - {key: x.alarm_mask, label: Alarm Error Status, table: holding, address: 88, type: u16, flags: alarms, poll: fast}

  # Important settings
  - {key: x.power_source, label: Power Source, table: holding, address: 243, type: u16, enum: power_source, poll: slow, note: The document gives no read/write access for this register.}
  - {key: x.power_import_enabled, label: Power Import Enabled, table: holding, address: 244, type: u16, enum: no_yes, writable: true, poll: slow}
  - {key: x.power_import_max, label: Power Import Max, table: holding, address: 245, type: u16, unit: '%', writable: true, min: 1, max: 100, poll: slow}
  - {key: x.power_import_mode, label: Power Import Mode, table: holding, address: 246, type: u16, enum: import_mode, writable: true, poll: slow}
  - {key: x.power_import_value, label: Power Import Value, table: holding, address: 247, type: u16, unit: '%', writable: true, min: 1, max: 100, poll: slow}
  - {key: x.power_export_enabled, label: Power Export Enabled, table: holding, address: 248, type: u16, enum: no_yes, writable: true, poll: slow}
  - {key: x.power_export_max, label: Power Export Max, table: holding, address: 249, type: u16, unit: '%', writable: true, min: 1, max: 100, poll: slow}
  - {key: x.power_export_mode, label: Power Export Mode, table: holding, address: 250, type: u16, enum: export_mode, writable: true, poll: slow}
  - {key: x.power_export_value, label: Power Export Value, table: holding, address: 251, type: u16, unit: '%', writable: true, min: 1, max: 100, poll: slow}
  - {key: x.volt_ok_window, label: Voltage OK Window, table: holding, address: 253, type: u16, unit: '%', writable: true, min: 0, max: 20, poll: slow}
  - {key: x.duty_hours_low, label: Duty Hours (x 1), table: holding, address: 255, type: u16, unit: h, writable: true, min: 0, max: 999, poll: slow}
  - {key: x.duty_hours_high, label: Duty Hours (x 1000), table: holding, address: 256, type: u16, unit: h, scale: 1000, writable: true, min: 0, max: 999000, poll: slow}
  - {key: x.priority, label: Priority, table: holding, address: 257, type: u16, writable: true, min: 1, max: 15, poll: slow}
  - {key: x.cb_trip_contact, label: C/B Trip Relay Normal State, table: holding, address: 191, type: u16, enum: trip_contact, writable: true, poll: slow}
  - {key: x.start_timeout, label: Start Timeout, table: holding, address: 194, type: u16, unit: s, writable: true, min: 0, max: 255, poll: slow}
  - {key: x.cool_down, label: Cool Down delay, table: holding, address: 197, type: u16, unit: s, writable: true, min: 0, max: 5000, poll: slow}
  - {key: x.speed_ctrl_mode, label: Speed Control Mode, table: holding, address: 210, type: u16, enum: speed_ctrl_mode, writable: true, poll: slow}
  - {key: x.volt_ctrl_mode, label: Voltage Control Mode, table: holding, address: 230, type: u16, enum: volt_ctrl_mode, writable: true, poll: slow}
  - {key: x.rs232_baud, label: RS232 Baud Rate, table: holding, address: 259, type: u16, enum: baud, writable: true, poll: slow}
  - {key: x.rs232_parity, label: RS232 Parity, table: holding, address: 260, type: u16, enum: parity, writable: true, poll: slow}

derived:
  - {key: x.duty_hours, label: Duty hours, unit: h, sum: [{key: x.duty_hours_high}, {key: x.duty_hours_low}]}

enums:
  speed_ctrl_status: {'0': Stopped, '1': Power-up, '2': Frequency to preset, '3': Frequency to net, '4': Synchronizing, '5': Synchronization OK, '6': Active load sharing ramp up, '7': Active load sharing ramp up ended, '8': Active load sharing, '9': Active load sharing ramp down, '10': Active load sharing ramp down ended, '17': Active load sharing frequency control}
  volt_ctrl_status: {'0': Stopped, '1': Power-up, '11': Voltage to preset, '12': Voltage to net, '13': Reactive load sharing, '14': Reactive load sharing ramp up, '15': Reactive load sharing ramp down, '16': Voltage control deactivated}
  power_source: {'0': Auxiliary, '1': Shaft, '2': Grid}
  no_yes: {'0': 'No', '1': 'Yes'}
  import_mode: {'0': Fixed, '1': Peak}
  export_mode: {'0': Fixed, '1': Excess}
  trip_contact: {'0': Normally de-energized (ND), '1': Normally energized (NE)}
  speed_ctrl_mode: {'0': Governor, '1': Frequency out}
  volt_ctrl_mode: {'0': AVR, '1': Voltage out}
  baud: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200'}
  parity: {'0': None, '1': Even, '2': Odd}

flags:
  leds: {'0': Primary supply, '1': Backup supply, '2': Manual, '3': Voltage OK, '4': Phase OK, '5': Unload, '6': C/B block, '7': C/B closed, '8': C/B trip, '9': Speed +, '10': Speed -, '11': Volt +, '12': Volt -, '13': Alarm}
  inputs: {'0': Volt increase, '1': Volt decrease, '2': Speed increase, '3': Speed decrease, '4': F/V control disable, '5': Manual control, '6': C/B close block, '7': Unload, '8': Engine failed}
  outputs: {'0': Engine start, '1': Engine stop}
  relays: {'0': C/B close, '1': C/B trip, '2': Speed +, '3': Speed -, '4': Volt +, '5': Volt -, '6': Alarm}
  alarms: {'0': Primary supply, '1': Backup supply, '2': CAN bus, '3': Measure head, '4': Sync external signal, '5': Sync internal signal, '7': Main loop}

problems:
  - {when: {key: x.ve_upper_trip, equals: 1}, kind: fault, text: Voltage establish upper trip}
  - {when: {key: x.ve_lower_trip, equals: 1}, kind: fault, text: Voltage establish lower trip}
  - {when: {key: x.fe_upper_trip, equals: 1}, kind: fault, text: Frequency establish upper trip}
  - {when: {key: x.fe_lower_trip, equals: 1}, kind: fault, text: Frequency establish lower trip}
  - {when: {key: x.cb_close_error, equals: 1}, kind: fault, text: Circuit breaker close error}
  - {when: {key: x.sync_error, equals: 1}, kind: fault, text: Synchronisation error}
  - {when: {key: x.engine_start_error, equals: 1}, kind: fault, text: Engine start error}
  - {when: {key: x.engine_error, equals: 1}, kind: fault, text: Engine error}
  - {when: {key: x.power_supply_1_fault, equals: 1}, kind: warning, text: Power supply 1 fault}
  - {when: {key: x.power_supply_2_fault, equals: 1}, kind: warning, text: Power supply 2 fault}
  - {when: {key: x.canbus_fault, equals: 1}, kind: fault, text: CAN bus fault}
  - {when: {key: x.measure_head_fault, equals: 1}, kind: fault, text: Measure head fault}
  - {when: {key: x.ext_sync_fault, equals: 1}, kind: fault, text: External sync fault}
  - {when: {key: x.int_sync_fault, equals: 1}, kind: fault, text: Internal sync fault}
  - {when: {key: x.deadbus_wire_fault, equals: 1}, kind: fault, text: Dead bus wire fault}
  - {when: {key: x.ct_wire_fault, equals: 1}, kind: fault, text: CT wire fault}

notes:
- The document numbers registers from 1 and states neither the function code nor the addressing base; holding registers (function
  03) and address = document number − 1 are assumed, so every point is unverified.
- 'Serial settings are those of the RS232 port''s defaults (registers 260–263: 9600 baud, no parity, 8 data bits, 1 stop bit).
  The document names Modbus RTU only in its file name.'
- Status, trip and fault registers (document 30–76) each hold 0 or 1. The power-supply faults are reported as warnings since
  the module has two supplies.
- Duty hours are split into units (0–999) and thousands; x.duty_hours combines them.
- 'Left out: the tuning parameters (stability, deadband, PID, ramp and level settings of the frequency/voltage establishment,
  synchroniser, load sharers and stabilisers, registers 100–186) and the analog/PWM output ranges of the speed and voltage
  control (registers 210–242, apart from the two mode settings); document register numbers.'
