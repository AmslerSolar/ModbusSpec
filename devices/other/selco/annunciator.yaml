notes:
- The document gives addresses as hex protocol addresses (its examples read LED 8 at 0x0008 and run the LED test with coil
  0x0042); they're used as given. Words are read with function 03 or 04, bits with 01 or 02.
- 'Each model has its own map: pick the model, the device can''t be told apart by registers. The unit type is only reported
  by function 07 (read exception status, bits 0-4: 1 = M1000, 2 = M2000, 4 = M3000, 5 = H3000/H3010, 8 = M4700-80, 9 = H1500;
  bit 7 = new events since the last read), which this format can''t express, so there is no identify.'
- RS485 Modbus RTU only (no ASCII). Unit 1-64; 1200-19200 Bd, 7 or 8 data bits, 1 or 2 stop bits, no parity; delivered as
  9600 8N1. Port 502 only applies behind a gateway.
- Requests of at most 12 words (stated for the M3000, applied to all here). The M3000 repeats its packed output and alarm
  states at 0x90-0x9D so that outputs and up to 48 alarms can be read in one 12-word request; those copies are left out.
- 'Only the packed state words are listed (five states of 3 bits per word; the top bit is unused). The single per-alarm /
  per-LED words at 0x01 onward hold the same state for one channel and are left out. On alarm annunciators an alarm''s state
  can''t be written; writing 0x0A (reset), 0x0B (block) or 0x0C (unblock) to the single alarm word applies that function instead
  (M1000: through the LED words 0x01-0x0A; M3000: alarm words 0x01-0x18 and 0x1E-0x35). On the M4700-80 and H1500 the LEDs
  can be set by Modbus and then override the physical input until switched off again.'
- 'H3010: the packed words 0x19-0x1C cover 20 states; only alarms 1-16 are listed, the meaning of positions 17-20 isn''t stated
  (possibly the supply and fan words 0x11-0x14).'
- 'Analog inputs (M3000, H3000) are raw unsigned values the reader has to scale for the input type: 20 mA = 1860, 10 V = 1706,
  24 V = 1445; the maximum 2047 means 22 mA, 12 V or 34 V.'
- 'Left out: the virtual inputs (VIRINP, 0xA1 onward on the M1000 and M4700-80), which act like contacts in parallel to the
  physical inputs and are only set by Modbus.'
- 'Problems: every active alarm is reported as a warning (steady, quick flash or flash, and short flash = cable failure);
  which flash pattern means unacknowledged is not stated.'
