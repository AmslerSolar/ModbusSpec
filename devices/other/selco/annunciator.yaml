modbusspec: 0
id: selco-annunciator
manufacturer: SELCO
name: M1000 / M2000 / M3000 / M4700-80 / H1500 / H3000 / H3010 alarm and indicator panels
kind: other

sources:
- title: MODBUS Protocol User's Manual (M1000C, M2000C, M3000, M4700-80, H1500, H3000, H3010)
  version: Revision 050714
  url: http://dsl-electronic.de/pdf/selco/ESM/M2000/manuals/Alarm%20MODBUS%20Protocol%20UK%20pdf.pdf
  sha256: c781a8c3cc1d99bf4ddb1bc9252627e76915fef3f478e3e7082ee26ce83a54ab
  archive_url: https://web.archive.org/web/20250324030820/http://dsl-electronic.de/pdf/selco/ESM/M2000/manuals/Alarm%20MODBUS%20Protocol%20UK%20pdf.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 12
  input_equals_holding: true

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: m1000, name: M1000 alarm annunciator}
  - {id: m2000, name: M2000 engine controller}
  - {id: m3000, name: M3000 analog alarm annunciator}
  - {id: m4700, name: M4700-80 indicator panel}
  - {id: h1500, name: H1500 indicator panel}
  - {id: h3000, name: H3000 analog alarm annunciator}
  - {id: h3010, name: H3010 smoke alarm annunciator}

