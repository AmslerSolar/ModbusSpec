notes:
- Protege GX is an access control, intrusion detection and building automation controller. With a Modbus service set up on
  it (controller firmware 2.08.1342 or later) it serves its inputs and outputs over Modbus TCP on port 502; the unit id is
  the service's client address (any value except 0x00 and 0xFF; 1 as in the document's examples is assumed).
- The document numbers coils and inputs from 1; addresses here are number − 1. Coils are the outputs (1 = on; write 1 / 0
  to activate / deactivate), discrete inputs the inputs (1 = closed; any state other than open or closed reads as open). What
  each controller input and output is wired to depends on the installation.
- At most 512 coils or inputs per read and 16 coils per write (one per function 05). Requests outside the registered modules
  or ranges get an exception.
- 'Left out: the outputs and inputs of up to 128 each of the keypads (coils 5–516, inputs 17–528), input expanders (coils
  517–1028, inputs 529–2576), reader expanders (coils 1029–2052, inputs 2577–3600), output expanders (coils 2053–4100) and
  analog expanders (coils 4101–4612), each module in a fixed slot whether fitted or not; and the trouble inputs (input numbers
  10001–17232, 64 for the controller from 10001), whose meaning depends on the model. It isn''t stated whether the trouble
  input numbers are protocol addresses 10000 ff. or a 1x reference.'
- No registers identify the controller; a network search can't recognise it.
