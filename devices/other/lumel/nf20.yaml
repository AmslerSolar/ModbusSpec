# Written from the Lumel NF20 power factor controller user's manual - Modbus (NF20-09-2).

modbusspec: 0
id: lumel-nf20
manufacturer: Lumel
name: NF20 power factor controller (RS485 option)
kind: other

sources:
- title: Power factor controller NF20 - User's manual - Modbus
  version: NF20-09-2 (file dated 2020)
  url: https://www.lumel.com.pl/resources/Pliki%20do%20pobrania/NF20/NF20_service_manual_Modbus.pdf
  sha256: 64d4a00f32b90281a2ed5c6eb5cb7c637fd1558135159c4b0014ae79e482a82c

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N2
  limits:
    max_registers: 80

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: input
    address: 70
    type: f32
    plausible:
    - 40
    - 70

identify:
  serial:
    table: holding
    address: 96
    type: f32
  checks:
  - table: holding
    address: 98
    type: f32
    equals: 4000

points:
  # Measurements (input registers, function 04; every value an IEEE 754 float in two registers)
  - {key: x.line_voltage, label: Line Voltage, table: input, address: 0, type: f32, unit: V, note: 'L-N or L-L, depending on the voltage input connection (PHASE V setting).'}
  - {key: x.line_current, label: Line Current, table: input, address: 6, type: f32, unit: A, note: Current of the one measured phase (PHASE I setting).}
  - {key: x.active_power, label: Active Power, table: input, address: 12, type: f32, unit: W, verified: false, note: Unit and sign not stated in the document; W assumed. Import and export energy are counted separately.}
  - {key: x.apparent_power, label: Apparent Power, table: input, address: 18, type: f32, unit: VA, verified: false, note: Unit not stated; assumed.}
  - {key: x.reactive_power, label: Reactive Power, table: input, address: 24, type: f32, unit: var, verified: false, note: Unit and sign not stated; assumed.}
  - {key: power_factor, label: Power Factor, table: input, address: 30, type: f32, unit: '', verified: false, note: 'Sign convention not stated (the target power factor setting uses + inductive, − capacitive).'}
  - {key: x.phase_angle, label: Phase Angle, table: input, address: 36, type: f32, unit: °, verified: false, note: Unit not stated; assumed.}
  - {key: frequency, label: Frequency, table: input, address: 70, type: f32, unit: Hz}
  - {key: x.active_import_energy, label: Active Import Energy, table: input, address: 72, type: f32, unit: kWh, poll: slow, verified: false, note: 'Unit follows the energy unit setting (holding 0x04: Wh / kWh / MWh); the factory setting kWh is taken. Rolls over at the energy digit count (holding 0x26); overflow counters from input 0x6C on are left out.'}
  - {key: x.active_export_energy, label: Active Export Energy, table: input, address: 74, type: f32, unit: kWh, poll: slow, verified: false, note: Unit follows the energy unit setting; factory kWh taken.}
  - {key: x.inductive_reactive_energy, label: Inductive Reactive Energy, table: input, address: 76, type: f32, unit: kvarh, poll: slow, verified: false, note: Unit follows the energy unit setting; factory k-unit taken.}
  - {key: x.capacitive_reactive_energy, label: Capacitive Reactive Energy, table: input, address: 78, type: f32, unit: kvarh, poll: slow, verified: false, note: Unit follows the energy unit setting; factory k-unit taken.}
  - {key: x.apparent_energy, label: Apparent Energy, table: input, address: 80, type: f32, unit: kVAh, poll: slow, verified: false, note: Unit follows the energy unit setting; factory k-unit taken.}
  - {key: temperature, label: System temperature, table: input, address: 134, type: f32, unit: °C, verified: false, note: Unit not stated; °C assumed from the temperature alarm defaults.}
  - {key: x.voltage_thd, label: System Voltage THD %, table: input, address: 218, type: f32, unit: '%'}
  - {key: x.current_thd, label: System Current THD %, table: input, address: 220, type: f32, unit: '%'}
  - {key: x.run_hours, label: Run Hour, table: input, address: 226, type: f32, unit: h, poll: slow}
  - {key: x.on_hours, label: ON Hour, table: input, address: 228, type: f32, unit: h, poll: slow}
  - {key: x.power_down_count, label: Power Down Interruption Count, table: input, address: 230, type: f32, poll: slow}
  - {key: x.pf_difference, label: Difference to Power Factor, table: input, address: 244, type: f32, verified: false, note: Meaning and unit not explained in the document.}
  - {key: x.bank1_kvar, label: Capacitor Bank 1 KVAr value, table: input, address: 246, type: f32, unit: kvar, poll: slow}
  - {key: x.bank2_kvar, label: Capacitor Bank 2 KVAr value, table: input, address: 248, type: f32, unit: kvar, poll: slow}
  - {key: x.bank3_kvar, label: Capacitor Bank 3 KVAr value, table: input, address: 250, type: f32, unit: kvar, poll: slow}
  - {key: x.bank4_kvar, label: Capacitor Bank 4 KVAr value, table: input, address: 252, type: f32, unit: kvar, poll: slow}
  - {key: x.bank5_kvar, label: Capacitor Bank 5 KVAr value, table: input, address: 254, type: f32, unit: kvar, poll: slow}
  - {key: x.bank6_kvar, label: Capacitor Bank 6 KVAr value, table: input, address: 256, type: f32, unit: kvar, poll: slow}
  - {key: x.bank7_kvar, label: Capacitor Bank 7 KVAr value, table: input, address: 258, type: f32, unit: kvar, poll: slow}
  - {key: x.bank8_kvar, label: Capacitor Bank 8 KVAr value, table: input, address: 260, type: f32, unit: kvar, poll: slow}
  - {key: x.bank9_kvar, label: Capacitor Bank 9 KVAr value, table: input, address: 262, type: f32, unit: kvar, poll: slow}
  - {key: x.bank10_kvar, label: Capacitor Bank 10 KVAr value, table: input, address: 264, type: f32, unit: kvar, poll: slow}
  - {key: x.bank11_kvar, label: Capacitor Bank 11 KVAr value, table: input, address: 266, type: f32, unit: kvar, poll: slow}
  - {key: x.bank12_kvar, label: Capacitor Bank 12 KVAr value, table: input, address: 268, type: f32, unit: kvar, poll: slow}
  - {key: x.bank1_switchings, label: Bank 1 No. of Switching operations, table: input, address: 294, type: f32, poll: slow}
  - {key: x.bank2_switchings, label: Bank 2 No. of Switching operations, table: input, address: 296, type: f32, poll: slow}
  - {key: x.bank3_switchings, label: Bank 3 No. of Switching operations, table: input, address: 298, type: f32, poll: slow}
  - {key: x.bank4_switchings, label: Bank 4 No. of Switching operations, table: input, address: 300, type: f32, poll: slow}
  - {key: x.bank5_switchings, label: Bank 5 No. of Switching operations, table: input, address: 302, type: f32, poll: slow}
  - {key: x.bank6_switchings, label: Bank 6 No. of Switching operations, table: input, address: 304, type: f32, poll: slow}
  - {key: x.bank7_switchings, label: Bank 7 No. of Switching operations, table: input, address: 306, type: f32, poll: slow}
  - {key: x.bank8_switchings, label: Bank 8 No. of Switching operations, table: input, address: 308, type: f32, poll: slow}
  - {key: x.bank9_switchings, label: Bank 9 No. of Switching operations, table: input, address: 310, type: f32, poll: slow}
  - {key: x.bank10_switchings, label: Bank 10 No. of Switching operations, table: input, address: 312, type: f32, poll: slow}
  - {key: x.bank11_switchings, label: Bank 11 No. of Switching operations, table: input, address: 314, type: f32, poll: slow}
  - {key: x.bank12_switchings, label: Bank 12 No. of Switching operations, table: input, address: 316, type: f32, poll: slow}
  - {key: x.bank1_operation_time, label: Capacitor1 Operation Time, table: input, address: 460, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank2_operation_time, label: Capacitor2 Operation Time, table: input, address: 462, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank3_operation_time, label: Capacitor3 Operation Time, table: input, address: 464, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank4_operation_time, label: Capacitor4 Operation Time, table: input, address: 466, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank5_operation_time, label: Capacitor5 Operation Time, table: input, address: 468, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank6_operation_time, label: Capacitor6 Operation Time, table: input, address: 470, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank7_operation_time, label: Capacitor7 Operation Time, table: input, address: 472, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank8_operation_time, label: Capacitor8 Operation Time, table: input, address: 474, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank9_operation_time, label: Capacitor9 Operation Time, table: input, address: 476, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank10_operation_time, label: Capacitor10 Operation Time, table: input, address: 478, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank11_operation_time, label: Capacitor11 Operation Time, table: input, address: 480, type: f32, poll: slow, verified: false, note: Unit not stated.}
  - {key: x.bank12_operation_time, label: Capacitor12 Operation Time, table: input, address: 482, type: f32, poll: slow, verified: false, note: Unit not stated.}

  # Settings (holding registers, function 03 read, 16 write; floats)
  - {key: x.demand_period, label: Demand Integration Time, table: holding, address: 2, type: f32, unit: min, writable: true, poll: slow, note: '8, 15, 20 or 30.'}
  - {key: x.energy_unit, label: Energy unit, table: holding, address: 4, type: f32, enum: energy_unit, writable: true, poll: slow}
  - {key: x.nominal_voltage, label: System Nominal Voltage, table: holding, address: 6, type: f32, unit: V, writable: true, min: 50, max: 550, poll: slow, note: The alarm limits are relative to it.}
  - {key: x.system_type, label: System Type, table: holding, address: 10, type: f32, enum: system_type, writable: true, poll: slow}
  - {key: x.reset, label: Reset Parameters, table: holding, address: 14, type: f32, writable: true, write_only: true, note: '1 energy, 2 demand, 3 minimum values, 4 maximum values, 5 run / on hours, 6 power-down records, 7 all switching counts, 8 all operation times, 10 all; 11–22 switching count of bank 1–12, 23–34 operation time of bank 1–12.'}
  - {key: x.rs485_setup, label: RS 485 Setup Code, table: holding, address: 18, type: f32, enum: rs485_setup, writable: true, poll: slow}
  - {key: x.device_address, label: Device Address, table: holding, address: 20, type: f32, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.ct_primary, label: CT primary, table: holding, address: 34, type: f32, unit: A, writable: true, min: 1, max: 9999, poll: slow}
  - {key: x.register_order, label: Register order, table: holding, address: 40, type: f32, enum: register_order, writable: true, poll: slow}
  - {key: x.ct_secondary, label: CT Secondary, table: holding, address: 42, type: f32, unit: A, writable: true, poll: slow, note: 1 or 5 A.}
  - {key: serial, label: Serial Number, table: holding, address: 96, type: f32, poll: slow}
  - {key: x.model_number, label: Model Number, table: holding, address: 98, type: f32, poll: slow, note: The document gives 4000 as its value.}
  - {key: firmware, label: Version Number, table: holding, address: 100, type: f32, poll: slow}
  - {key: x.switch_on_time, label: Capacitor switch On time, table: holding, address: 124, type: f32, unit: s, writable: true, min: 10, max: 1800, poll: slow}
  - {key: x.switch_off_time, label: Capacitor switch Off time, table: holding, address: 126, type: f32, unit: s, writable: true, min: 10, max: 1800, poll: slow}
  - {key: x.discharge_time, label: Capacitor discharge time, table: holding, address: 128, type: f32, unit: s, writable: true, min: 60, max: 1800, poll: slow}
  - {key: x.target_power_factor, label: Target power factor, table: holding, address: 132, type: f32, writable: true, poll: slow, note: '+0.8 … 1 inductive, −0.8 … 1 capacitive; factory 0.995.'}
  - {key: x.bank_count, label: No. of Cap bank selection, table: holding, address: 134, type: f32, writable: true, poll: slow, note: '1 … 12 depending on the model (4/6/8 relays for 96×96, 6/8/12 for 144×144).'}
  - {key: x.system_frequency, label: System Frequency, table: holding, address: 206, type: f32, unit: Hz, writable: true, poll: slow, note: 50 or 60.}

enums:
  energy_unit: {'1': Wh, '2': kWh, '3': MWh}
  system_type: {'0': 1 phase, '1': 3 phase}
  register_order: {'0': Normal (most significant first), '1': Reversed}
  rs485_setup: {'0': 4800 8N1, '1': 4800 8N2, '2': 4800 8E1, '3': 4800 8O1, '4': 9600 8N1, '5': 9600 8N2, '6': 9600 8E1, '7': 9600 8O1, '8': 19200 8N1, '9': 19200 8N2, '10': 19200 8E1, '11': 19200 8O1, '12': 38400 8N1, '13': 38400 8N2, '14': 38400 8E1, '15': 38400 8O1, '16': 57600 8N1, '17': 57600 8N2, '18': 57600 8E1, '19': 57600 8O1}

notes:
- Addresses are the document's hex start addresses (0-based); its 3xxxx / 4xxxx register numbers are these plus 30001 / 40001.
  Where the two columns disagree, the hex value was checked against the register number; the points here are not affected.
- Every value is an IEEE 754 float in two registers, also in the holding registers. Most significant first by default; the
  register order setting (holding 0x28) can reverse it, so readers detect the order from the frequency.
- 'At most 40 values (80 registers) per request; answers within 200 ms. Factory serial setting code 5 = 9600 baud 8N2, address
  1. Settings are write-protected while a password is set (password registers 0x46 / 0xCC: reads 0 when locked, 1 when not).'
- The controller measures one voltage and one current; per-phase and three-phase totals aren't available. The document doesn't
  state the units of power values or the sign of active / reactive power; they are marked unverified.
- No unit id is fixed in the document beyond the factory address 1. Identification uses the model number register, which the
  document lists with the value 4000 (unverified on a real device).
- 'Left out: demand values and their maxima (input 0x54–0x6A), energy overflow counters and energies ''on update rate'' (0x6C–0xA4),
  old energies (0xA6–0xBA; the register numbers and hex addresses there disagree), min / max values (0xBC–0xD8), power-down
  time and date, test-run bank kvar values (0x10E–0x124), voltage and current harmonics 2nd–31st (from 0x140), the optional
  RTC (input 0x82 / 0x84 hold hhmm and ddmmyy as floats; holding 0x16–0x1E set it), alarm and relay assignment settings (0x2E–0x3C),
  display and password settings, capacitor health test settings, the alarm relay status (the document''s address for it is
  inconsistent and its bits aren''t described) and the user-assignable registers (input 0x200–0x227, mapping at holding 0x200–0x213).'
