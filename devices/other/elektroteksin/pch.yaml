# Written from the Elektroteks-IN PCh Modbus table description (Описание таблицы ModBus, version 2.3, 2016-05-20), for
# the transistor frequency converters 5.5 … 315 kW (panel PG-v5.1.01, controller FC-v5.1.01).

modbusspec: 0
id: elektroteksin-pch
manufacturer: Elektroteks-IN (Электротекс-ИН)
name: EIN-PCh04 frequency converter 5.5 … 315 kW (motor drive)
kind: other

sources:
- title: 'ПЧ05: Описание таблицы ModBus (frequency converters, Modbus table description)'
  version: 2.3 (2016-05-20)
  url: https://etx-in.ru/files/%D0%9F%D0%A705%20%D0%9E%D0%BF%D0%B8%D1%81%D0%B0%D0%BD%D0%B8%D0%B5%20%D1%82%D0%B0%D0%B1%D0%BB%D0%B8%D1%86%D1%8B%20modbus%20%D1%80%D0%B5%D0%B4.2.3.pdf
  sha256: ccc17818da13c1d9fe011ebd7c89cef60bba933bd4b62329d30bfba0b0d0c380
  archive_url: https://web.archive.org/web/20180517130807/http://etx-in.ru:80/files/ETX-IN-FCseries-04-Modbus-guide_v2.3.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - ascii
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 32
    type: str
    length: 8

points:
  # Identity
  - {key: firmware, label: Controller software version, table: holding, address: 0, type: str, length: 8, poll: slow, note: 'Up to 16 characters, zero-terminated, KOI8 encoding.'}
  - {key: serial, label: Controller serial number, table: holding, address: 32, type: str, length: 8, poll: slow, note: 'Up to 16 characters, zero-terminated, KOI8 encoding.'}
  - {key: x.rated_power, label: Converter rated power, table: holding, address: 583, type: u16, unit: W, scale: 100, poll: slow, note: 0.1 kW per step.}
  # State
  - {key: state, label: Overall converter state, table: holding, address: 264, type: u16, enum: state}
  - {key: x.alarm_flags, label: Alarm flags, table: holding, address: 272, type: u16, flags: alarm_flags}
  - {key: x.general_alarm, label: Generalised alarm, table: holding, address: 276, type: u16, flags: general_alarm}
  - {key: x.controller_flags, label: Controller flags, table: holding, address: 296, type: u16, flags: controller_flags}
  - {key: x.inverter_flags, label: Inverter flags, table: holding, address: 304, type: u16, flags: inverter_flags}
  - {key: x.setpoint_source, label: Current setpoint source, table: holding, address: 416, type: u16, enum: setpoint_source, poll: slow}
  - {key: x.command_source, label: Current command source, table: holding, address: 417, type: u16, enum: command_source, poll: slow}
  - {key: x.active_stop_commands, label: Active stop commands, table: holding, address: 418, type: u16, flags: stop_commands}
  - {key: x.control_mode, label: Current control mode, table: holding, address: 419, type: u16, enum: control_mode, poll: slow}
  - {key: x.active_frequency_setpoint, label: Active frequency setpoint, table: holding, address: 420, type: s16, unit: Hz, scale: 0.01, verified: false, note: Signed assumed (setpoints range −65 … +65 Hz).}
  - {key: x.active_rated_current, label: Actual rated current, table: holding, address: 422, type: u16, unit: A, scale: 0.1, poll: slow}
  - {key: x.clock, label: Current date and time, table: holding, address: 496, type: datetime, length: 4, datetime: {second: {register: 0, bits: [0, 7]}, minute: {register: 0, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, day: {register: 2, bits: [0, 7]}, month: {register: 2, bits: [8, 15], offset: 1}, year: {register: 3}}, poll: slow, note: Register 0x01F1 bits 8 … 15 hold the weekday (0 = Sunday); the month is stored 0 … 11.}
  # Measurements
  - {key: x.output_frequency, label: Output frequency, table: holding, address: 512, type: s16, unit: Hz, scale: 0.01, verified: false, note: Signed assumed (not stated).}
  - {key: x.output_current, label: Output current, table: holding, address: 528, type: u16, unit: A, scale: 0.1}
  - {key: x.output_l1_current, label: Output current phase A, table: holding, address: 529, type: u16, unit: A, scale: 0.1}
  - {key: x.output_l2_current, label: Output current phase B, table: holding, address: 530, type: u16, unit: A, scale: 0.1}
  - {key: x.output_l3_current, label: Output current phase C, table: holding, address: 531, type: u16, unit: A, scale: 0.1}
  - {key: x.output_voltage, label: Output voltage, table: holding, address: 544, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage, label: Input voltage (line-to-line), table: holding, address: 545, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_uv, label: Input voltage U-V, table: holding, address: 546, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_vw, label: Input voltage V-W, table: holding, address: 547, type: u16, unit: V, scale: 0.1}
  - {key: x.input_voltage_wu, label: Input voltage W-U, table: holding, address: 548, type: u16, unit: V, scale: 0.1}
  - {key: x.dc_voltage, label: DC link voltage, table: holding, address: 549, type: u16, unit: V, scale: 0.1}
  - {key: temperature, label: Heatsink temperature, table: holding, address: 561, type: s16, unit: °C, verified: false, note: Signed assumed (not stated).}
  - {key: x.output_power, label: Output active power, table: holding, address: 576, type: s16, unit: W, scale: 100, verified: false, note: 0.1 kW per step. Signed assumed (not stated).}
  - {key: power_factor, label: Power factor, table: holding, address: 578, type: s16, scale: 0.0001, verified: false, note: Signed assumed (not stated).}
  - {key: x.session_energy, label: Energy consumed in the session, table: holding, address: 579, type: u32, unit: kWh, poll: slow, verified: false, note: 32-bit; word order not stated (high word first assumed).}
  - {key: consumer_energy, label: Total energy consumed, table: holding, address: 581, type: u32, unit: kWh, poll: slow, verified: false, note: 32-bit; word order not stated (high word first assumed).}
  - {key: x.process_value, label: Current process value (PID feedback), table: holding, address: 592, type: s16, verified: false, note: Scale depends on the setting at holding 0x08B4; raw value given. Signed assumed.}
  - {key: x.motor_overheat, label: Motor overheat, table: holding, address: 600, type: u16, unit: '%'}
  - {key: x.restarts_left, label: Remaining restarts, table: holding, address: 608, type: u16}
  - {key: x.digital_inputs, label: Digital inputs DIN1 … DIN8, table: holding, address: 640, type: u16, note: 'Bit 0 = DIN1 … bit 7 = DIN8, physical state (no inversion applied).'}
  - {key: x.digital_outputs, label: Digital outputs DOUT1 … DOUT3, table: holding, address: 648, type: u16, note: Bit 0 = DOUT1 … bit 2 = DOUT3.}
  - {key: x.ain1_frequency, label: Analog input AIN1 (frequency), table: holding, address: 672, type: s16, unit: Hz, scale: 0.01, verified: false, note: Signed assumed (not stated).}
  - {key: x.ain2_frequency, label: Analog input AIN2 (frequency), table: holding, address: 673, type: s16, unit: Hz, scale: 0.01, verified: false, note: Signed assumed (not stated).}
  - {key: x.earth_fault_sensor, label: Zero-sequence current sensor state, table: holding, address: 1784, type: u16, enum: earth_fault_sensor}
  # Commands (coils)
  - {key: x.cmd_stop, label: STOP command (remote panel / network), table: coil, address: 2048, type: bool, writable: true, poll: slow}
  - {key: x.cmd_start, label: START command (remote panel / network), table: coil, address: 2049, type: bool, writable: true, poll: slow}
  - {key: x.cmd_reverse, label: REVERSE command, table: coil, address: 2050, type: bool, writable: true, poll: slow}
  - {key: x.cmd_emergency_stop, label: EMERGENCY STOP command (remote panel / network), table: coil, address: 2051, type: bool, writable: true, poll: slow}
  - {key: x.cmd_fault_reset, label: FAULT RESET command, table: coil, address: 2052, type: bool, writable: true, poll: slow}
  # Settings
