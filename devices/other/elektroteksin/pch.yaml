  - {key: x.command_source_setting, label: Command source, table: holding, address: 2082, type: u16, enum: command_source, writable: true, poll: slow}
  - {key: x.motor_rated_power, label: Motor rated power, table: holding, address: 2096, type: u16, unit: W, scale: 100, writable: true, poll: slow, note: 0.1 kW per step.}
  - {key: x.motor_rated_voltage, label: Motor rated voltage, table: holding, address: 2097, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.motor_rated_frequency, label: Motor rated frequency, table: holding, address: 2098, type: u16, unit: Hz, writable: true, poll: slow}
  - {key: x.motor_rated_current, label: Motor rated current, table: holding, address: 2099, type: u16, unit: A, scale: 0.1, writable: true, poll: slow}
  - {key: x.motor_rated_cos_phi, label: Motor rated cos φ, table: holding, address: 2101, type: u16, scale: 0.0001, writable: true, poll: slow}
  - {key: x.stop_type, label: Stop type, table: holding, address: 2118, type: u16, enum: stop_type, writable: true, poll: slow}
  - {key: x.accel_rate, label: Acceleration rate (linear curve), table: holding, address: 2121, type: u16, unit: Hz/s, scale: 0.01, writable: true, poll: slow}
  - {key: x.decel_rate, label: Deceleration rate (linear curve), table: holding, address: 2122, type: u16, unit: Hz/s, scale: 0.01, writable: true, poll: slow}

enums:
  state: {'0': No communication, '1': Blocked, '2': Stopped, '3': Ready, '4': Flying start, '5': Running, '6': Holding, '7': Braking, '8': Waiting, '9': Fault, '10': Critical fault, '11': Service, '12': Calibration, '13': Unknown, '14': Supply fault, '15': Sleep mode, '16': Current limiting, '17': Emergency braking}
  setpoint_source: {'0': Panel, '1': Network, '2': Analog input AIN1, '3': Analog input AIN2, '4': Analog inputs AIN1+AIN2, '5': Digital inputs, '6': Schedule}
  command_source: {'0': Panel, '1': Network, '2': Digital inputs, '3': Schedule}
  control_mode: {'0': Frequency (PID off), '1': Process value (PID on)}
  earth_fault_sensor: {'0': Zero-sequence current normal, '1': Zero-sequence current exceeded}
  stop_type: {'0': By selected curve, '1': DC brake, '2': Coast}

flags:
  alarm_flags: {'0': Emergency stop, '1': Emergency stop / lockout, '2': Normal stop / lockout, '3': Warning, '5': Fault reset required}
  general_alarm: {'0': Internal error, '1': Wrong DIN sequence, '2': Communication fault, '3': Analog input fault, '4': External fault, '5': Load loss, '6': Temperature fault, '7': Current imbalance, '8': Schedule fault, '9': Input voltage fault, '10': Converter failure, '11': Low DC link voltage, '12': DC link overvoltage, '13': I²t overheat, '14': Critical current, '15': Hardware current protection}
  controller_flags: {'0': Acceleration requested, '1': Acceleration inhibited, '2': Deceleration requested, '3': Deceleration inhibited, '4': Output current imbalance, '5': Load loss, '6': Brake chopper on, '7': Alternative setpoint source, '8': Alternative command source, '10': Mains OK, '13': Alternative rated current, '14': Alternative frequency limit}
  inverter_flags: {'0': Zero speed, '1': Speed OK, '2': Process value OK, '3': Upper frequency limit, '4': Lower frequency limit, '6': Flying start, '7': Auxiliary motor changeover, '10': PID sleep mode}
  stop_commands: {'0': Panel (stop), '1': Panel (emergency stop), '2': Network / remote panel (stop), '3': Network / remote panel (emergency stop), '4': DIN (stop), '5': DIN (emergency stop), '6': Schedule (stop), '7': Schedule (emergency stop)}

problems:
  - {when: {key: state, equals: 9}, kind: fault, text: Converter fault (state 9)}
  - {when: {key: state, equals: 10}, kind: fault, text: Converter critical fault (state 10)}
  - {when: {key: state, equals: 14}, kind: fault, text: Converter supply fault (state 14)}
  - {when: {key: x.alarm_flags, bit: 3}, kind: warning, text: Converter warning (bit 3)}
  - {when: {key: x.alarm_flags, bit: 5}, kind: warning, text: Fault reset required (bit 5)}
  - {when: {key: x.general_alarm, bit: 0}, kind: warning, text: Internal error (bit 0)}
  - {when: {key: x.general_alarm, bit: 1}, kind: warning, text: Wrong DIN sequence (bit 1)}
  - {when: {key: x.general_alarm, bit: 2}, kind: warning, text: Communication fault (bit 2)}
  - {when: {key: x.general_alarm, bit: 3}, kind: warning, text: Analog input fault (bit 3)}
  - {when: {key: x.general_alarm, bit: 4}, kind: warning, text: External fault (bit 4)}
  - {when: {key: x.general_alarm, bit: 5}, kind: warning, text: Load loss (bit 5)}
  - {when: {key: x.general_alarm, bit: 6}, kind: warning, text: Temperature fault (bit 6)}
  - {when: {key: x.general_alarm, bit: 7}, kind: warning, text: Current imbalance (bit 7)}
  - {when: {key: x.general_alarm, bit: 8}, kind: warning, text: Schedule fault (bit 8)}
  - {when: {key: x.general_alarm, bit: 9}, kind: warning, text: Input voltage fault (bit 9)}
  - {when: {key: x.general_alarm, bit: 10}, kind: warning, text: Converter failure (bit 10)}
  - {when: {key: x.general_alarm, bit: 11}, kind: warning, text: Low DC link voltage (bit 11)}
  - {when: {key: x.general_alarm, bit: 12}, kind: warning, text: DC link overvoltage (bit 12)}
  - {when: {key: x.general_alarm, bit: 13}, kind: warning, text: I²t overheat (bit 13)}
  - {when: {key: x.general_alarm, bit: 14}, kind: warning, text: Critical current (bit 14)}
  - {when: {key: x.general_alarm, bit: 15}, kind: warning, text: Hardware current protection (bit 15)}

notes:
- Elektroteks-IN (ООО «Электротекс-ИН», Oryol). The file is titled ПЧ05, its text names the converters EIN-PCh04 (ЭИН-ПЧ04).
- The hex addresses of the document are taken as 0-based protocol addresses. Status values are read from holding registers;
  many (voltages, temperature, process value, inputs) are also readable as input registers at the same address.
- Data types aren't stated except for the strings and the 32-bit energy counters; 16-bit unsigned is assumed unless a point
  says otherwise.
- 'Generalised alarm bits are reported as warnings: the overall state (9, 10) tells whether the converter stopped.'
- 'Detail: the active alarms are a bit field at holding 0x0120 … 0x0124 (bits 0 … 77) and, bit by bit, 76 coils from 0x0200;
  not included here.'
- RS485 with Modbus RTU or ASCII (selectable), 600 … 115200 baud, 8N1, addresses 1 … 126; set at holding 0x0EE0 … 0x0EE3 (write-only).
  Default baud rate and address aren't stated; 9600 and 1 assumed.
- 'Left out: U/f curve, acceleration tables, PID controller, protection, schedule, I/O function and expansion-module settings.'
