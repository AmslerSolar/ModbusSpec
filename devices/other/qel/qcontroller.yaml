  - {key: x.bi_box3_switches, label: BI-Box-3 Switch1 to Switch4 Statuses, table: holding, address: 104, type: u16, bits: [0, 7], flags: switch_bits, poll: fast}
  - {key: x.bi_box3_running, label: BI-Box-3 running status, table: holding, address: 104, type: u16, bits: [8, 15], enum: box_state, poll: fast}

