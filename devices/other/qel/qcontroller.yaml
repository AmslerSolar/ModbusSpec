  - {key: x.onboard_relays, label: Onboard Relay1 to Relay4 Statuses, table: holding, address: 0, type: u16, bits: [0, 7], flags: relay_bits, poll: fast}
  - {key: x.onboard_relays_running, label: Onboard Relay1 to Relay4 Statuses (running status), table: holding, address: 0, type: u16, bits: [8, 15], enum: box_state, poll: fast}
  - {key: x.bo_box0_relays, label: BO-Box-0 Relay1 to Relay4 Statuses, table: holding, address: 1, type: u16, bits: [0, 7], flags: relay_bits, poll: fast}
  - {key: x.bo_box0_running, label: BO-Box-0 running status, table: holding, address: 1, type: u16, bits: [8, 15], enum: box_state, poll: fast}
  - {key: x.bo_box1_relays, label: BO-Box-1 Relay1 to Relay4 Statuses, table: holding, address: 2, type: u16, bits: [0, 7], flags: relay_bits, poll: fast}
  - {key: x.bo_box1_running, label: BO-Box-1 running status, table: holding, address: 2, type: u16, bits: [8, 15], enum: box_state, poll: fast}
  - {key: x.bo_box2_relays, label: BO-Box-2 Relay1 to Relay4 Statuses, table: holding, address: 3, type: u16, bits: [0, 7], flags: relay_bits, poll: fast}
  - {key: x.bo_box2_running, label: BO-Box-2 running status, table: holding, address: 3, type: u16, bits: [8, 15], enum: box_state, poll: fast}
  - {key: x.bo_box3_relays, label: BO-Box-3 Relay1 to Relay4 Statuses, table: holding, address: 4, type: u16, bits: [0, 7], flags: relay_bits, poll: fast}
  - {key: x.bo_box3_running, label: BO-Box-3 running status, table: holding, address: 4, type: u16, bits: [8, 15], enum: box_state, poll: fast}
  - {key: x.buzzer_strobe_horn, label: 'Buzzer, Strobe and Horn Statuses', table: holding, address: 32, type: u16, flags: annunciator_bits, poll: fast}
  - {key: x.scheduler_outputs, label: Scheduler 1 To Scheduler 8 Output Statuses, table: holding, address: 33, type: u16, flags: scheduler_bits, poll: fast}

  # Switch inputs (BI)
  - {key: x.onboard_switches, label: Onboard Switch1 to Switch4 Statuses, table: holding, address: 100, type: u16, bits: [0, 7], flags: switch_bits, poll: fast}
  - {key: x.onboard_switches_running, label: Onboard Switch1 to Switch4 Statuses (running status), table: holding, address: 100, type: u16, bits: [8, 15], enum: box_state, poll: fast}
