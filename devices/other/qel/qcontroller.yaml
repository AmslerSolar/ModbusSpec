  - {key: x.ai_box0_ch5, label: AI-Box-0 Analog Input CH5 status and Reading x 10, table: holding, address: 204, type: u16, scale: 0.1, invalid: [65533, 65534, 65535], poll: fast, note: 'Unit as configured for the channel (not given). 65535 = channel disabled, 65534 = offline, 65533 = 4-20 mA loop disconnected.'}
  - {key: x.ai_box0_ch6, label: AI-Box-0 Analog Input CH6 status and Reading x 10, table: holding, address: 205, type: u16, scale: 0.1, invalid: [65533, 65534, 65535], poll: fast, note: 'Unit as configured for the channel (not given). 65535 = channel disabled, 65534 = offline, 65533 = 4-20 mA loop disconnected.'}
  - {key: x.ai_box0_ch7, label: AI-Box-0 Analog Input CH7 status and Reading x 10, table: holding, address: 206, type: u16, scale: 0.1, invalid: [65533, 65534, 65535], poll: fast, note: 'Unit as configured for the channel (not given). 65535 = channel disabled, 65534 = offline, 65533 = 4-20 mA loop disconnected.'}
  - {key: x.ai_box0_ch8, label: AI-Box-0 Analog Input CH8 status and Reading x 10, table: holding, address: 207, type: u16, scale: 0.1, invalid: [65533, 65534, 65535], poll: fast, note: 'Unit as configured for the channel (not given). 65535 = channel disabled, 65534 = offline, 65533 = 4-20 mA loop disconnected.'}

