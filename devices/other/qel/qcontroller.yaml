notes:
- Read only, function 03; broadcast is not supported. The document numbers holding registers from 40001 = protocol address
  0; the addresses here are those numbers minus 40001.
- Modbus RTU slave, default slave address 214. Baud rate (19.2k, 28.8k, 38.4k, 57.6k) and parity (even, odd, none) are set
  in the controller's system menu; the document names no default, 19200 8E1 here is an assumption (not verified). Port 502
  only applies to a gateway in front of it.
- 'Left out: BO-Box-4 to 30 (holding 5–31, same layout as BO-Box-0), BI-Box-4 to 30 (104–131), AI-Box-1 to 15 analog inputs
  (208–327, eight channels per box), AO-Box-1 to 15 (408–527) and digital sensors 32 to 127 (632–727). Each continues its
  first box or sensor at consecutive addresses.'
- The units of analog input and gas readings depend on the configured channel or sensor and are not given.
- The document gives no identifying register (model, serial), so a network search cannot recognise the controller.
