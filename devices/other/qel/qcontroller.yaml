modbusspec: 0
id: qel-qcontroller
manufacturer: QEL
name: Q-Controller gas detection controller
kind: other

sources:
- title: Q-Controller Modbus Protocol (86540-001-001)
  version: Rev A
  url: http://www.qelsafety.com/wp-content/uploads/2012/09/86540-001-000-RA-Modbus-protocol.pdf
  sha256: bc7e07d24031b709eb1a1ef1d243b0af94d6d8e306f7e95c866cf436202a83cf

connection:
  default_port: 502
  default_unit: 214
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

points:
