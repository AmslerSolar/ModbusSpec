notes:
- The document numbers addresses 1-based (x0037 = data address 37 in any of the four tables); here they are 0-based (36).
  All data can be read as holding or input registers (function 03 or 04 return the same); the booleans can also be read as
  coils or discrete inputs at the same numbers.
- Every object (system, network, each I/O channel) has a block of 36 addresses. The per-channel blocks sit at addresses that
  depend on the model (EP200, EP200N, EP1000, EP2100) and the I/O card in each slot; they aren't listed here. This file uses
  the system and network blocks and the alternate maps, which number sensors, digital inputs and relays consecutively (up
  to 32 sensors and 16 each of the others; only the first 8 sensors, 4 digital inputs and 8 relays are listed, the rest follow
  the same pattern). Virtual inputs, analog and control outputs, setpoints and the per-mode control settings are left out.
- Sensor values are in the sensor's configured unit (pH, µS/cm, mV, °C, ppm …), which the controller doesn't report over Modbus;
  no unit is given. Channels that aren't fitted are expected not to answer, so they are optional.
- 32-bit values are sent low word first by default; a setting (inverse data format) swaps the words, so readers detect the
  order from the firmware version (a float such as 3.xx).
- Alarm bitfields use the low byte; the document numbers bits 1–8 from the least significant, here 0–7. Sensor alarm bits
  4 and 5 meant out-of-range and sensor fault in firmware up to 3.09.
- Modbus/TCP only (no RTU), port 502 by default (configurable); unit id 1 normally, 0 (broadcast) is not supported. The client
  should not poll faster than once every 5 s. Supported from controller software 3.01.
- The models can't be told apart over Modbus and there is no serial number register, so there is no identify.
