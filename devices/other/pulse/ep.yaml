modbusspec: 0
id: pulse-ep
manufacturer: Pulse Instruments
name: EP200 / EP200N / EP1000 / EP2100 water treatment controllers (Modbus/TCP)
kind: other

sources:
- title: Modbus Manual EP2100/EP200N, EP1000/EP200 (180676)
  version: Rev I (April 2022)
  url: https://pulseinstruments.net/content/EP%20PDFs/NEW%20EP%20Controllers/EP%20Modbus%20Manual.pdf
  sha256: 6882b24a059aa83605d6e3f2d75c285743fe168463937b1569a9b5f69d3f0b2f
  archive_url: https://web.archive.org/web/20240806013201/https://pulseinstruments.net/content/EP%20PDFs/NEW%20EP%20Controllers/EP%20Modbus%20Manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125
    min_interval_ms: 5000
  input_equals_holding: true

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 38
    type: f32
    plausible:
    - 3
    - 20

points:
  # System (block starting at 1-based x0037)
  - {key: x.controller_time, label: Controller time, table: holding, address: 36, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: firmware, label: Controller firmware version, table: holding, address: 38, type: f32, poll: slow}
  - {key: x.last_data_log, label: Date of last data log, table: holding, address: 40, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: temperature, label: Controller processor temperature, table: holding, address: 42, type: f32, unit: °C}
  - {key: x.network_card_temperature, label: Network card temperature, table: holding, address: 44, type: f32, unit: °C, poll: slow}
  - {key: x.di_card_temperature, label: Digital input card temperature, table: holding, address: 46, type: f32, unit: °C, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.io_card1_temperature, label: I/O card 1 temperature, table: holding, address: 48, type: f32, unit: °C, poll: slow, optional: true}
  - {key: x.io_card2_temperature, label: I/O card 2 temperature, table: holding, address: 50, type: f32, unit: °C, poll: slow, optional: true}
  - {key: x.io_card3_temperature, label: I/O card 3 temperature, table: holding, address: 52, type: f32, unit: °C, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.io_card4_temperature, label: I/O card 4 temperature, table: holding, address: 54, type: f32, unit: °C, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.battery_voltage, label: Battery power, table: holding, address: 62, type: f32, unit: V, poll: slow, note: Clock button cell.}
  - {key: x.supply_3v3, label: +3.3 V supply, table: holding, address: 64, type: f32, unit: V, poll: slow}
  - {key: x.supply_5v, label: +5 V supply, table: holding, address: 66, type: f32, unit: V, poll: slow}
  - {key: x.supply_12v, label: +12 V supply, table: holding, address: 68, type: f32, unit: V, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.system_alarms, label: System alarm bitfield, table: holding, address: 71, type: u16, flags: system_alarms}

  # Network (block starting at 1-based x0145)
  - {key: x.fluent_last_data, label: Fluent last data time, table: holding, address: 144, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.liveconnect_status, label: Fluent LiveConnect status, table: holding, address: 150, type: u16, enum: status, poll: slow}
  - {key: x.webserver_status, label: WebServer status, table: holding, address: 151, type: u16, enum: status, poll: slow}
  - {key: x.wifi_signal, label: WiFi signal strength, table: holding, address: 162, type: f32, unit: dBm, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.wifi_status, label: WiFi status, table: holding, address: 169, type: u16, enum: status, poll: slow, optional: true, note: EP1000 and EP2100 only.}
  - {key: x.network_alarms, label: Network alarm bitfield, table: holding, address: 179, type: u16, flags: network_alarms}

  # Sensor inputs, alternate map (numbered in the order the controller finds them)
  - {key: x.sensor1_value, label: Sensor 1 primary value, table: holding, address: 9216, type: f32, optional: true}
  - {key: x.sensor1_status, label: Sensor 1 status, table: holding, address: 9280, type: u16, enum: status, optional: true}
  - {key: x.sensor1_alarms, label: Sensor 1 alarm bitfield, table: holding, address: 9312, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor2_value, label: Sensor 2 primary value, table: holding, address: 9218, type: f32, optional: true}
  - {key: x.sensor2_status, label: Sensor 2 status, table: holding, address: 9281, type: u16, enum: status, optional: true}
  - {key: x.sensor2_alarms, label: Sensor 2 alarm bitfield, table: holding, address: 9313, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor3_value, label: Sensor 3 primary value, table: holding, address: 9220, type: f32, optional: true}
  - {key: x.sensor3_status, label: Sensor 3 status, table: holding, address: 9282, type: u16, enum: status, optional: true}
  - {key: x.sensor3_alarms, label: Sensor 3 alarm bitfield, table: holding, address: 9314, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor4_value, label: Sensor 4 primary value, table: holding, address: 9222, type: f32, optional: true}
  - {key: x.sensor4_status, label: Sensor 4 status, table: holding, address: 9283, type: u16, enum: status, optional: true}
  - {key: x.sensor4_alarms, label: Sensor 4 alarm bitfield, table: holding, address: 9315, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor5_value, label: Sensor 5 primary value, table: holding, address: 9224, type: f32, optional: true}
  - {key: x.sensor5_status, label: Sensor 5 status, table: holding, address: 9284, type: u16, enum: status, optional: true}
  - {key: x.sensor5_alarms, label: Sensor 5 alarm bitfield, table: holding, address: 9316, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor6_value, label: Sensor 6 primary value, table: holding, address: 9226, type: f32, optional: true}
  - {key: x.sensor6_status, label: Sensor 6 status, table: holding, address: 9285, type: u16, enum: status, optional: true}
  - {key: x.sensor6_alarms, label: Sensor 6 alarm bitfield, table: holding, address: 9317, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor7_value, label: Sensor 7 primary value, table: holding, address: 9228, type: f32, optional: true}
  - {key: x.sensor7_status, label: Sensor 7 status, table: holding, address: 9286, type: u16, enum: status, optional: true}
  - {key: x.sensor7_alarms, label: Sensor 7 alarm bitfield, table: holding, address: 9318, type: u16, flags: sensor_alarms, optional: true}
  - {key: x.sensor8_value, label: Sensor 8 primary value, table: holding, address: 9230, type: f32, optional: true}
  - {key: x.sensor8_status, label: Sensor 8 status, table: holding, address: 9287, type: u16, enum: status, optional: true}
  - {key: x.sensor8_alarms, label: Sensor 8 alarm bitfield, table: holding, address: 9319, type: u16, flags: sensor_alarms, optional: true}

  # Digital inputs, alternate map
