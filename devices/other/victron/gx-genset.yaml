# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-genset
manufacturer: Victron Energy
name: 'GX Modbus-TCP: AC genset (com.victronenergy.genset)'
kind: other

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  - {key: l1_voltage, label: Phase 1 voltage, table: holding, address: 3200, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Phase 2 voltage, table: holding, address: 3201, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Phase 3 voltage, table: holding, address: 3202, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Phase 1 current, table: holding, address: 3203, type: s16, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase 2 current, table: holding, address: 3204, type: s16, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase 3 current, table: holding, address: 3205, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_l1_power_3206, label: Phase 1 power, table: holding, address: 3206, type: s16, unit: W, note: 16-bit version of 3230.}
  - {key: x.ac_l2_power_3207, label: Phase 2 power, table: holding, address: 3207, type: s16, unit: W, note: 16-bit version of 3232.}
  - {key: x.ac_l3_power_3208, label: Phase 3 power, table: holding, address: 3208, type: s16, unit: W, note: 16-bit version of 3234.}
  - {key: frequency, label: AC Frequency, table: holding, address: 3209, type: u16, unit: Hz, scale: 0.01}
  - {key: x.product_id, label: Generator model, table: holding, address: 3212, type: u16, poll: slow}
  - {key: state, label: Status, table: holding, address: 3213, type: u16, enum: state}
  - {key: error_code, label: Error, table: holding, address: 3214, type: u16, enum: error_code}
  - {key: x.remote_start_mode_enabled, label: Auto start, table: holding, address: 3215, type: u16, enum: remote_start_mode_enabled}
  - {key: x.engine_load, label: Engine load, table: holding, address: 3216, type: u16, unit: '%'}
  - {key: x.engine_speed, label: Engine speed, table: holding, address: 3217, type: u16, unit: rpm}
  - {key: x.engine_operating_hours, label: Engine operating hours, table: holding, address: 3218, type: u16, unit: s, scale: 100}
  - {key: x.engine_coolant_temperature, label: Engine coolant temperature, table: holding, address: 3219, type: s16, unit: °C, scale: 0.1}
  - {key: x.engine_winding_temperature, label: Engine winding temperature, table: holding, address: 3220, type: s16, unit: °C, scale: 0.1}
  - {key: x.engine_exhaust_temperature, label: Engine exhaust temperature, table: holding, address: 3221, type: s16, unit: °C, scale: 0.1}
  - {key: x.starter_voltage, label: Starter voltage, table: holding, address: 3222, type: u16, unit: V, scale: 0.01}
  - {key: x.start, label: Start generator, table: holding, address: 3223, type: u16, enum: start, writable: true, note: Prefer the generator service's manual start (3500) on Venus OS 3.00 and later.}
  - {key: x.engine_oil_pressure, label: Oil pressure, table: holding, address: 3224, type: s16, unit: kPa}
  - {key: x.engine_oil_temperature, label: Engine oil temperature, table: holding, address: 3228, type: s16, unit: °C, conflicts: [{sources: [hass-victron], scale: 0.1, label: genset engine oiltemperature}]}
  - {key: x.ac_l1_power, label: Phase 1 power, table: holding, address: 3230, type: s32, unit: W}
  - {key: x.ac_l2_power, label: Phase 2 power, table: holding, address: 3232, type: s32, unit: W}
  - {key: x.ac_l3_power, label: Phase 3 power, table: holding, address: 3234, type: s32, unit: W}
  - {key: x.ac_l1_power_factor, label: L1 Power Factor, table: holding, address: 3236, type: s16, scale: 0.001}
  - {key: x.ac_l2_power_factor, label: L2 Power Factor, table: holding, address: 3237, type: s16, scale: 0.001}
  - {key: x.ac_l3_power_factor, label: L3 Power Factor, table: holding, address: 3238, type: s16, scale: 0.001}
  - {key: power_factor, label: Total Power Factor, table: holding, address: 3239, type: s16, scale: 0.001}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 3250, type: str, length: 8, writable: true, poll: slow}
  - {key: x.error_0_id, label: 1st Error string (for third party gensets), table: holding, address: 5000, type: str, length: 16, poll: slow}
  - {key: x.error_1_id, label: 2nd Error string (for third party gensets), table: holding, address: 5016, type: str, length: 16, poll: slow}
  - {key: x.error_2_id, label: 3rd Error string (for third party gensets), table: holding, address: 5032, type: str, length: 16, poll: slow}
  - {key: x.error_3_id, label: 4th Error string (for third party gensets), table: holding, address: 5048, type: str, length: 16, poll: slow}
  - {key: x.error_4_id, label: 5th Error string (for third party gensets), table: holding, address: 5064, type: str, length: 16, poll: slow}
  - {key: x.error_5_id, label: 6th Error string (for third party gensets), table: holding, address: 5080, type: str, length: 16, poll: slow}
  - {key: x.error_6_id, label: 7th Error string (for third party gensets), table: holding, address: 5096, type: str, length: 16, poll: slow}
  - {key: x.error_7_id, label: 8th Error string (for third party gensets), table: holding, address: 5112, type: str, length: 16, poll: slow}
  - {key: x.genset_l2_frequency, label: genset L2 frequency, table: holding, address: 3210, type: u16, unit: Hz, scale: 0.01, verified: false, sources: [hass-victron]}
  - {key: x.genset_l3_frequency, label: genset L3 frequency, table: holding, address: 3211, type: u16, unit: Hz, scale: 0.01, verified: false, sources: [hass-victron]}

enums:
  state: {'0': Standby, '1': Startup 1, '2': Startup 2, '3': Startup 3, '4': Startup 4, '5': Startup 5, '6': Startup 6, '7': Startup 7, '8': Running, '9': Stopping, '10': Error}
  error_code: {'0': No error, '1': AC voltage L1 too low, '2': AC frequency L1 too low, '3': AC current too low, '4': AC power too low, '5': Emergency stop, '6': Servo current too low, '7': Oil pressure too low, '8': Engine temperature too low, '9': Winding temperature too low, '10': Exhaust temperature too low, '13': Starter current too low, '14': Glow current too low, '15': Glow current too low, '16': Fuel holding magnet current too low, '17': Stop solenoid hold coil current too low, '18': Stop solenoid pull coil current too low, '19': Optional DC out current too low, '20': 5V output voltage too low, '21': Boost output current too low, '22': Panel supply current too high, '25': Starter battery voltage too low, '26': Startup aborted (rotation too low), '28': Rotation too low, '29': Power contactor current too low, '30': AC voltage L2 too low, '31': AC frequency L2 too low, '32': AC current L2 too low, '33': AC power L2 too low, '34': AC voltage L3 too low, '35': AC frequency L3 too low, '36': AC current L3 too low, '37': AC power L3 too low, '62': Fuel temperature too low, '63': Fuel level too low, '65': AC voltage L1 too high, '66': AC frequency too high, '67': AC current too high, '68': AC power too high, '70': Servo current too high, '71': Oil pressure too high, '72': Engine temperature too high, '73': Winding temperature too high, '74': Exhaust temperature too low, '77': Starter current too low, '78': Glow current too high, '79': Glow current too high, '80': Fuel holding magnet current too high, '81': Stop solenoid hold coil current too high, '82': Stop solenoid pull coil current too high, '83': Optional DC out current too high, '84': 5V output voltage too high, '85': Boost output current too high, '89': Starter battery voltage too high, '90': Startup aborted (rotation too high), '92': Rotation too high, '93': Power contactor current too high, '94': AC voltage L2 too high, '95': AC frequency L2 too high, '96': AC current L2 too high, '97': AC power L2 too high, '98': AC voltage L3 too high, '99': AC frequency L3 too high, '100': AC current L3 too high, '101': AC power L3 too high, '126': Fuel temperature too high, '127': Fuel level too high, '130': Lost control unit, '131': Lost panel, '132': Service needed, '133': Lost 3-phase module, '134': Lost AGT module, '135': Synchronization failure, '137': Intake airfilter, '139': Lost sync. module, '140': Load-balance failed, '141': Sync-mode deactivated, '142': Engine controller, '148': Rotating field wrong, '149': Fuel level sensor lost, '150': Init failed, '151': Watchdog, '152': 'Out: winding', '153': 'Out: exhaust', '154': 'Out: Cyl. head', '155': Inverter over temperature, '156': Inverter overload, '157': Inverter communication lost, '158': Inverter sync failed, '159': CAN communication lost, '160': L1 overload, '161': L2 overload, '162': L3 overload, '163': DC overload, '164': DC overvoltage, '165': Emergency stop, '166': No connection, '65280': Unknown error}
  remote_start_mode_enabled: {'0': Disabled, '1': Enabled}
  start: {'0': Stop, '1': Start}

problems:
  - {when: {key: state, equals: 10}, kind: fault, text: Genset error (status 10)}
  - {when: {key: error_code, not: 0}, kind: fault, text: 'Genset error {value}'}

notes:
- 'No fixed unit id: the GX assigns them (since Venus OS 2.60), normally the device instance; see Settings → Integrations
  → Modbus TCP server → Available services. 1 is only a placeholder.'
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
