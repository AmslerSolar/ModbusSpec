notes:
- Registers 0x009E–0x00A2 give the number of phases, metered phases, banks, outlets and metered outlets; only that many phase,
  bank and outlet registers exist.
- 'Only outlets 1–8 are imported: the project''s address table for outlets 9–64 is marked as an example that may vary by model,
  and its blocks overlap the outlet 1–8 registers.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
