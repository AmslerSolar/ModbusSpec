# Written from the Sigma Net "Integracja sterownika AM-8.3 z Modbus TCP/IP" (ver. 1.0).

modbusspec: 0
id: sigmanet-am8
manufacturer: Sigma Net
name: E-NODE AM-8.3 MK2 Art-Net node / recorder (lighting controller)
kind: other

sources:
- title: Integracja sterownika AM-8.3 z Modbus TCP/IP (E-NODE AM-8.3 MK2)
  version: '1.0'
  url: https://sigma.net.pl/down/AM8_3%20Modbus%20TCP%20IP%201_0.pdf
  sha256: 356949fc07ab50baab6fa91ed72b2eed0f7bdd2920e7003ede0fbea63cef1a45
  archive_url: https://web.archive.org/web/20221204083304/http://www.sigma.net.pl/down/AM8_3%20Modbus%20TCP%20IP%201_0.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.program, label: Current program, table: holding, address: 0, type: u16, writable: true, min: 0, max: 63, poll: fast, note: '0 = program off (source switched to Art-Net), 1…63 = program stored on the SD card.'}
  - {key: x.intensity, label: Current intensity, table: holding, address: 100, type: u16, writable: true, min: 0, max: 255, poll: fast, note: 0 = minimum … 255 = maximum (0…100 %).}
  - {key: x.rtc_state, label: Astronomical clock (RTC) state, table: holding, address: 200, type: u16, enum: rtc_state, poll: fast, note: 'Writing 0 stops the clock, 1 resumes it (the read values differ: see the enum).', writable: true}

enums:
  rtc_state: {'0': RTC off, '1': RTC stopped, '2': RTC program off, '3': Program started by an RTC event}

notes:
- Read with function 03, written with function 06 only. The document gives start addresses 0, 100 and 200, taken as 0-based
  protocol addresses.
- The document doesn't state the port or unit id; 502 and 1 are assumed (not verified).
