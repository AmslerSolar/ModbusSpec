modbusspec: 0
id: soyal-701server
manufacturer: Soyal
name: 701Server Modbus bridge for access controllers
kind: other

sources:
- title: 701Server MODBUS IO Mapping
  version: 1.02 (2025-12-05)
  url: https://files.soyal.com.tw/TW/download/Cross-System%20Integration/701Server%20Modbus%20IO%20Mapping.pdf
  sha256: 8f045d7585b5f6d8136711eb47bf9b0b3a6429f250c9cf0b7f77fa625b37a509

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: home, name: 'Home series (AR-721H, AR-727HV3)'}
  - {id: enterprise, name: 'Enterprise series (AR-725E, AR-837E, AR-716-E16 / AR-721Ev2)'}
  - {id: ar727cm_io, name: AR-727CM-IO}
  - {id: ar403mo, name: AR-403MO}

points:
  # Home series
  - {key: x.door_relay, label: Door Relay, table: coil, address: 0, type: bool, models: [home], writable: true}
  - {key: x.alarm_relay, label: Alarm Relay, table: coil, address: 1, type: bool, models: [home], writable: true}
  - {key: x.door_sensor, label: Door Sensor (1 = open), table: discrete, address: 0, type: bool, models: [home]}
  - {key: x.armed, label: Arm Status (1 = armed), table: discrete, address: 1, type: bool, models: [home]}
  - {key: x.egress, label: Egress, table: discrete, address: 2, type: bool, models: [home], note: The document lists the states as Close/Open for 1/0.}
  - {key: x.alarm, label: Alarm Status (forced or open too long), table: discrete, address: 3, type: bool, models: [home]}
  - {key: x.door_open_too_long, label: Door Open too Long, table: discrete, address: 4, type: bool, models: [home]}
  - {key: x.force_open_alarm, label: Force Open Alarm, table: discrete, address: 5, type: bool, models: [home]}
  - {key: x.duress_alarm, label: Duress Alarm, table: discrete, address: 6, type: bool, models: [home]}
  - {key: x.online, label: Online (under a multi-door control panel), table: discrete, address: 15, type: bool, models: [home]}

  # Enterprise series: main door at 256 …, the Wiegand reader port's door at 272 …
  - {key: x.door_relay, label: Door Relay (main), table: coil, address: 256, type: bool, models: [enterprise], writable: true}
  - {key: x.alarm_relay, label: Alarm Relay (main), table: coil, address: 257, type: bool, models: [enterprise], writable: true}
  - {key: x.wg_door_relay, label: Door Relay (WG), table: coil, address: 272, type: bool, models: [enterprise], writable: true}
  - {key: x.wg_alarm_relay, label: Alarm Relay (WG), table: coil, address: 273, type: bool, models: [enterprise], writable: true}
  - {key: x.door_sensor, label: Door Sensor (main), table: discrete, address: 256, type: bool, models: [enterprise]}
  - {key: x.armed, label: Arm Status (main), table: discrete, address: 257, type: bool, models: [enterprise]}
  - {key: x.egress, label: Egress (main), table: discrete, address: 258, type: bool, models: [enterprise]}
  - {key: x.alarm, label: 'Alarm Status (forced or open too long, main)', table: discrete, address: 259, type: bool, models: [enterprise]}
  - {key: x.door_open_too_long, label: Door Open too Long (main), table: discrete, address: 260, type: bool, models: [enterprise]}
  - {key: x.force_open_alarm, label: Force Open Alarm (main), table: discrete, address: 261, type: bool, models: [enterprise]}
  - {key: x.duress_alarm, label: Duress Alarm (main), table: discrete, address: 262, type: bool, models: [enterprise]}
  - {key: x.online, label: On Line / Off Line (main), table: discrete, address: 271, type: bool, models: [enterprise]}
  - {key: x.wg_door_sensor, label: Door Sensor (WG), table: discrete, address: 272, type: bool, models: [enterprise]}
  - {key: x.wg_alarm, label: Alarm Status (WG), table: discrete, address: 275, type: bool, models: [enterprise]}
  - {key: x.wg_online, label: On Line / Off Line (WG), table: discrete, address: 287, type: bool, models: [enterprise]}

  # AR-727CM-IO: 8 outputs, 8 inputs
  - {key: x.do_0, label: DO-0, table: coil, address: 0, type: bool, models: [ar727cm_io, ar403mo], writable: true}
  - {key: x.do_1, label: DO-1, table: coil, address: 1, type: bool, models: [ar727cm_io, ar403mo], writable: true}
  - {key: x.do_2, label: DO-2, table: coil, address: 2, type: bool, models: [ar727cm_io, ar403mo], writable: true}
  - {key: x.do_3, label: DO-3, table: coil, address: 3, type: bool, models: [ar727cm_io, ar403mo], writable: true}
  - {key: x.do_4, label: DO-4, table: coil, address: 4, type: bool, models: [ar727cm_io], writable: true}
  - {key: x.do_5, label: DO-5, table: coil, address: 5, type: bool, models: [ar727cm_io], writable: true}
  - {key: x.do_6, label: DO-6, table: coil, address: 6, type: bool, models: [ar727cm_io], writable: true}
  - {key: x.do_7, label: DO-7, table: coil, address: 7, type: bool, models: [ar727cm_io], writable: true}
  - {key: x.di_0, label: DI-0, table: discrete, address: 0, type: bool, models: [ar727cm_io, ar403mo]}
  - {key: x.di_1, label: DI-1, table: discrete, address: 1, type: bool, models: [ar727cm_io, ar403mo]}
  - {key: x.di_2, label: DI-2, table: discrete, address: 2, type: bool, models: [ar727cm_io, ar403mo]}
  - {key: x.di_3, label: DI-3, table: discrete, address: 3, type: bool, models: [ar727cm_io, ar403mo]}
  - {key: x.di_4, label: DI-4, table: discrete, address: 4, type: bool, models: [ar727cm_io]}
  - {key: x.di_5, label: DI-5, table: discrete, address: 5, type: bool, models: [ar727cm_io]}
  - {key: x.di_6, label: DI-6, table: discrete, address: 6, type: bool, models: [ar727cm_io]}
  - {key: x.di_7, label: DI-7, table: discrete, address: 7, type: bool, models: [ar727cm_io]}
  - {key: x.online, label: Online (RS485 reader on line), table: discrete, address: 15, type: bool, models: [ar727cm_io, ar403mo]}

  # All except the AR-403MO
  - {key: x.fire_state, label: Fire State, table: discrete, address: 511, type: bool, models: [home, enterprise, ar727cm_io]}

problems:
  - {when: {key: x.force_open_alarm, equals: 1}, kind: warning, text: Door forced open}
  - {when: {key: x.door_open_too_long, equals: 1}, kind: warning, text: Door open too long}
  - {when: {key: x.duress_alarm, equals: 1}, kind: warning, text: Duress alarm}
  - {when: {key: x.fire_state, equals: 1}, kind: warning, text: Fire alarm state}

notes:
- '701Server (701ServerSQL) is Soyal''s server software; its built-in Modbus TCP to RTU bridge makes each access controller
  answer on the Modbus unit id equal to its node id (1 … 254). The register map depends on the controller type, which the
  bridge doesn''t report: the user picks the model.'
- The document numbers the points DO / DI with plain decimal addresses (0-based assumed). DO points are taken as coils and
  DI points as discrete inputs; the document doesn't name the Modbus tables or function codes (assumed).
- 'The bridge serves up to 16 areas: the area code (0 … 15) sits in bits 12 … 15 of the address, i.e. address = area × 4096
  + point. The addresses here are for area 0.'
- 'Left out: the per-node tables of controllers wired under an AR-716-E16 (16 points per node in two channels of 8 nodes,
  addresses 0 … 255), and DO/DI points the document lists without a function. The Modbus TCP port of the bridge isn''t stated
  (502 assumed); ''TCP port 1601'' in the document is the AR-727CM-IO''s own controller port.'
