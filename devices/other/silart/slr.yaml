# Written from the SILART SLR-002B-001 Modbus RTU remote control description (undated).

modbusspec: 0
id: silart-slr
manufacturer: SILART
name: SLR-002B-001 enclosure temperature controller
kind: other

sources:
- title: Удаленное управление контроллером SILART модели SLR-002B-001 по протоколу Modbus RTU
  version: undated
  url: https://gekoms.org/wp-content/uploads/2026/07/silart-slr-modbus.pdf
  sha256: af326d2f46069df1ffcf75e8f0db94b0640649ad251ddfbd30756a1feba2c883

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: temperature, label: Enclosure temperature (sensor T1), table: holding, address: 0, type: s16, unit: °C, scale: 0.1, poll: fast, note: Register 1. −40…130 °C.}
  - {key: x.temperature_t2, label: Temperature sensor T2, table: holding, address: 1, type: s16, unit: °C, scale: 0.1, poll: fast, optional: true, note: 'Register 2. Monitoring only, not used for control; enabled with register 30.'}
  - {key: x.cooling_on_temperature, label: Cooling switch-on temperature, table: holding, address: 8, type: s16, unit: °C, scale: 0.1, writable: true, min: 1, max: 50, poll: slow, note: Register 9.}
  - {key: x.heating_on_temperature, label: Heating switch-on temperature, table: holding, address: 9, type: s16, unit: °C, scale: 0.1, writable: true, min: 0, max: 50, poll: slow, note: Register 10.}
  - {key: x.hysteresis, label: Hysteresis, table: holding, address: 10, type: s16, unit: °C, scale: 0.1, writable: true, min: 1, max: 20, poll: slow, note: Register 11.}
  - {key: x.high_alarm_temperature, label: High temperature alarm threshold, table: holding, address: 11, type: s16, unit: °C, scale: 0.1, writable: true, min: -5, max: 90, poll: slow, note: Register 12.}
  - {key: x.low_alarm_temperature, label: Low temperature alarm threshold, table: holding, address: 12, type: s16, unit: °C, scale: 0.1, writable: true, min: -5, max: 89, poll: slow, note: Register 13.}
  - {key: x.t1_calibration, label: Sensor T1 calibration, table: holding, address: 18, type: s16, unit: °C, scale: 0.1, writable: true, min: -9.9, max: 9.9, poll: slow, note: Register 19.}
  - {key: x.t2_calibration, label: Sensor T2 calibration, table: holding, address: 19, type: s16, unit: °C, scale: 0.1, writable: true, min: -9.9, max: 9.9, poll: slow, note: Register 20.}
  - {key: x.high_alarm_enable, label: High temperature alarm on/off, table: holding, address: 20, type: u16, enum: off_on, writable: true, poll: slow, note: Register 21.}
  - {key: x.low_alarm_enable, label: Low temperature alarm on/off, table: holding, address: 21, type: u16, enum: off_on, writable: true, poll: slow, note: Register 22.}
  - {key: x.compressor_control, label: Compressor control, table: holding, address: 22, type: u16, enum: off_on, writable: true, poll: slow, note: Register 23. Only for use in an air conditioner; must be 0 otherwise.}
  - {key: x.t2_enable, label: Sensor T2 on/off, table: holding, address: 29, type: u16, enum: off_on, writable: true, poll: slow, note: Register 30.}
  - {key: x.force_cooling, label: Forced cooling on/off, table: holding, address: 30, type: u16, enum: off_on, writable: true, poll: fast, note: Register 31.}
  - {key: x.force_heating, label: Forced heating on/off, table: holding, address: 31, type: u16, enum: off_on, writable: true, poll: fast, verified: false, note: 'Register 32. Range 0/1; the document''s value column says 2 for on, which looks like a misprint.'}
  - {key: x.digital_input_logic, label: Digital input logic, table: holding, address: 34, type: u16, enum: input_logic, writable: true, poll: slow, verified: false, note: 'Register 35. Range 0/1; the document''s value column says 3 for NO, which looks like a misprint.'}
  - {key: x.buzzer, label: Buzzer on/off, table: holding, address: 36, type: u16, enum: off_on, writable: true, poll: slow, verified: false, note: 'Register 37. Range 0/1; the document''s value column says 4 for on, which looks like a misprint.'}
  - {key: x.cooling_delay, label: Cooling switch-on delay, table: holding, address: 37, type: u16, unit: min, writable: true, min: 0, max: 5, poll: slow, note: 'Register 38. Only for use in an air conditioner, 0 otherwise.'}
  - {key: x.cooling_min_run, label: Minimum cooling run time, table: holding, address: 38, type: u16, unit: min, writable: true, min: 0, max: 5, poll: slow, note: 'Register 39. Only for use in an air conditioner, 0 otherwise.'}

enums:
  off_on: {'0': 'Off', '1': 'On'}
  input_logic: {'0': Normally closed (NC), '1': Normally open (NO)}

notes:
- The document numbers registers from 1; the addresses here are the register number − 1 (e.g. register 1 = address 0). The
  original numbers are in each point's note.
- Read with function 03, write with 06 or 16. Modbus RTU over RS485 only; a Modbus TCP gateway is needed for a network.
- Default unit id 1 and 19200 baud are stated; the data format (8N1) is not stated and assumed.
- Temperatures are in units of 0.1 °C (27.5 °C = 275); negative values as two's complement are assumed.
- The registers give no alarm or output state, so no problems are described.
