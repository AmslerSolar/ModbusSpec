  - {key: x.dp1_value, label: Current value of digital sensor 1, table: holding, address: 1001, type: s16, poll: fast, note: 'Raw integer: divide by the factor of the sensor''s measuring range (dp1_range: 1–9 → 1000, 10–99 → 100, 100–999 → 10, 1000 and above → 1). Below −16385 it is an error code (read it as hex). The gas unit depends on the sensor.'}
  - {key: x.dp1_range, label: Measuring range of digital sensor 1, table: holding, address: 5001, type: u16, poll: slow}
  - {key: x.dp1_alarms, label: Alarms of digital sensor 1, table: holding, address: 1201, type: u16, bits: [0, 7], flags: alarms, poll: fast}
  - {key: x.dp1_latching, label: Latching bits of digital sensor 1, table: holding, address: 1201, type: u16, bits: [8, 15], flags: latching, poll: fast}
