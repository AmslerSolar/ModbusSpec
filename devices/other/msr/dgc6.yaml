notes:
- 'Addresses: the document gives the register addresses as they are sent on the bus (its screenshots show the controller''s
  own address at register 0, the first digital sensor at 1001), so they are used unchanged as 0-based holding addresses (function
  03).'
- Sensor n has its current value at 1000 + n (digital, n = 1…96) or 2000 + n (analog, n = 1…32), its average value at 3000
  + n / 4000 + n, its measuring range at 5000 + n / 6000 + n and its alarm and latching word at 1200 + n / 2200 + n. Only
  sensors 1–8 of each kind and connected devices 1–8 (9001–9008) are listed here; the averages, signal relays (7001–7096),
  alarm relays above 8 and analog outputs 1–16 (output data block addresses 9–24, 0…10000 = 0…full scale of the sensor) are
  left out.
- The measured values are integers whose scale depends on the sensor's measuring range (factor 1000, 100, 10 or 1, see the
  value points); this can't be expressed here, so the values are raw.
- 'Alarm word per sensor: bits 0–3 are the four alarm stages raised by the controller, bits 4–7 the local alarms, bits 8–11
  the controller''s latching bits and bits 12–15 the local latching bits.'
- 'Writing: function 05 (coil, value 0xFF00) on a sensor''s alarm word address (1201… / 2201…) acknowledges latching, on 0x7000
  acknowledges the horn, and on 51–57 switches a single watch output; function 15 on 50 sets all seven watch outputs. Other
  settings can''t be changed over Modbus.'
- The Modbus RTU slave port is the controller's X-BUS, available from display firmware 1.00.06. No default slave address is
  stated; 1 (as in the document's screenshots) is assumed.
- The controller gives no identification registers, so it can't be recognised in a network search.
- The document is published by INTEC Controls together with MSR-Electronic GmbH.
