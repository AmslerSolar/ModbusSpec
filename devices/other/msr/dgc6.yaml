  - {key: x.relays_module_7, label: Relay bits of the extension module 6, table: holding, address: 7, type: u16, flags: relays_7, poll: fast}
  - {key: x.relays_module_8, label: Relay bits of the extension module 7, table: holding, address: 8, type: u16, flags: relays_8, poll: fast}
  # Watch outputs (WI)
  - {key: x.watch_outputs, label: 'Watch outputs (all, as a byte)', table: holding, address: 50, type: u16, poll: fast, note: Bit n−1 = watch output n.}
  - {key: x.watch_output_1, label: Watch output 1, table: holding, address: 51, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_2, label: Watch output 2, table: holding, address: 52, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_3, label: Watch output 3, table: holding, address: 53, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_4, label: Watch output 4, table: holding, address: 54, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_5, label: Watch output 5, table: holding, address: 55, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_6, label: Watch output 6, table: holding, address: 56, type: u16, enum: watch_output, poll: fast}
  - {key: x.watch_output_7, label: Watch output 7, table: holding, address: 57, type: u16, enum: watch_output, poll: fast}
