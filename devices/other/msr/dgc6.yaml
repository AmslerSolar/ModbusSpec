modbusspec: 0
id: msr-dgc6
manufacturer: MSR-Electronic
name: PolyGard2 DGC6 gas controller (GC-06, Modbus at the X-BUS)
kind: other

sources:
- title: DGC6 Modbus Supplement User Manual (PolyGard2 DGC6, Digital Gas-Controller-Series GC-06 Modbus)
  version: 2022-04, revision 2026-04-16
  url: https://inteccontrols.com/wp-content/uploads/2025/04/DGC6_Modbus-Supplement_UserManual.pdf
  sha256: 9bd86f84b94c3173edb8d5c17642a283555e99624ad49ff5b9df63681f2db3f7
- title: DGC6 Modbus Supplement User Manual (PolyGard2 DGC6, Digital Gas-Controller-Series GC-06 Modbus)
  version: 2022-04, revision 2022-12-09
  url: https://inteccontrols.com/wp-content/uploads/2025/04/DGC6_Modbus-Supplement_UserManual-1.pdf
  sha256: fd268a54d9be6ad82214c02d7a066a5db71b00d46d0704e02eaa02865f056f0c

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 19200
    format: 8E1

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.unit_address, label: Own Modbus slave address at the X-BUS, table: holding, address: 0, type: u16, poll: slow, writable: true, note: The only register that can be written (functions 06 and 16).}
  # Relay information bits per module (output data block, addresses 1–8)
  - {key: x.relays_module_1, label: Relay bits of the controller module (GC06), table: holding, address: 1, type: u16, flags: relays_1, poll: fast}
  - {key: x.relays_module_2, label: Relay bits of the extension module 1, table: holding, address: 2, type: u16, flags: relays_2, poll: fast}
