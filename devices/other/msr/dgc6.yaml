enums:
  watch_output: {'0': 'Off', '1': On by clock, '256': On by Modbus, '257': On by Modbus and clock}
  fault_relay: {'-1': Relay not active, '0': 'Relay active, not energised', '1': 'Relay active, energised'}

flags:
  alarms: {'0': Controller alarm stage 1, '1': Controller alarm stage 2, '2': Controller alarm stage 3, '3': Controller alarm stage 4, '4': Local alarm stage 1, '5': Local alarm stage 2, '6': Local alarm stage 3, '7': Local alarm stage 4}
  latching: {'0': Controller latching stage 1, '1': Controller latching stage 2, '2': Controller latching stage 3, '3': Controller latching stage 4, '4': Local latching stage 1, '5': Local latching stage 2, '6': Local latching stage 3, '7': Local latching stage 4}
  controller_error: {'0': UPS error, '2': 'Power failure, battery mode', '4': Configuration error or EEPROM / flash failure, '7': Maintenance information, '8': Failure in connected devices, '9': UPS detected (information only), '11': Special mode on, '14': Error indicator (always 0 for failures), '15': Error indicator (always 1 for failures)}
  module_error: {'1': AD converter failure, '2': Over- / undervoltage failure, '3': CPU diagnostic error, '4': Configuration error or EEPROM / flash failure, '5': Wrong analog output current or relay failure, '6': Over- / undertemperature failure, '7': Maintenance information, '8': Failure in connected devices, '11': Special mode on, '12': Warning sign feedback error, '13': Horn feedback error, '14': Error indicator (always 0 for failures), '15': Error indicator (always 1 for failures)}
  relays_1: {'0': Relay 1, '1': Relay 2, '2': Relay 3, '3': Relay 4}
  relays_2: {'0': Relay 5, '1': Relay 6, '2': Relay 7, '3': Relay 8}
  relays_3: {'0': Relay 9, '1': Relay 10, '2': Relay 11, '3': Relay 12}
  relays_4: {'0': Relay 13, '1': Relay 14, '2': Relay 15, '3': Relay 16}
  relays_5: {'0': Relay 17, '1': Relay 18, '2': Relay 19, '3': Relay 20}
  relays_6: {'0': Relay 21, '1': Relay 22, '2': Relay 23, '3': Relay 24}
  relays_7: {'0': Relay 25, '1': Relay 26, '2': Relay 27, '3': Relay 28}
  relays_8: {'0': Relay 29, '1': Relay 30, '2': Relay 31, '3': Relay 32}

