# Written from the Agrowtek IM MODBUS instruction manual (undated), section "BDX MODBUS TCP/IP".

modbusspec: 0
id: agrowtek-bdx
manufacturer: Agrowtek
name: BDX fertigation system (Modbus TCP)
kind: other

sources:
- title: Agrowtek Instruction Manual – MODBUS (GrowNET devices, GCX and BDX)
  version: undated
  url: https://www.agrowtek.com/doc/im/IM_MODBUS.pdf
  sha256: a30ddc9a6e272bd9e8fe96235b7aa4d759022d0db0eed5d4cb7d58c326c77e22

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  - {key: state, label: System status, table: holding, address: 0, type: s16, enum: system_status, writable: true, note: 'Writable (0, 1 or 3; 2 is refused). The I/O coils and pump speeds can only be written in diagnostic mode (3).'}
  - {key: x.job_status, label: Job status, table: holding, address: 1, type: s16, enum: job_status}
  - {key: x.current_event, label: Current event, table: holding, address: 2, type: s16, note: Index of the schedule event running or pending.}
  - {key: x.current_recipe, label: Current recipe, table: holding, address: 3, type: s16, note: Index of the recipe running or pending.}
  - {key: x.tank_volume, label: Current tank volume, table: holding, address: 4, type: s16, unit: gal, note: Water in the mixing tank (0–1000 gal); not accurate while feeding.}
  - {key: x.events, label: Number of events, table: holding, address: 5, type: s16, poll: slow}
  - {key: x.recipes, label: Number of recipes, table: holding, address: 6, type: s16, poll: slow}
  - {key: x.events_queued, label: Number of events queued, table: holding, address: 7, type: s16}
  - {key: x.temperature_1, label: Temperature 1, table: holding, address: 100, type: s16, unit: °C, scale: 0.01, optional: true}
  - {key: x.temperature_2, label: Temperature 2, table: holding, address: 101, type: s16, unit: °C, scale: 0.01, optional: true}
  - {key: x.ph_1, label: pH 1, table: holding, address: 102, type: s16, unit: '', scale: 0.01, optional: true}
  - {key: x.ph_2, label: pH 2, table: holding, address: 103, type: s16, unit: '', scale: 0.01, optional: true}
  - {key: x.ec_1, label: EC 1, table: holding, address: 104, type: s16, unit: uS/cm, optional: true}
  - {key: x.ec_2, label: EC 2, table: holding, address: 105, type: s16, unit: uS/cm, optional: true}
  - {key: x.orp_1, label: ORP 1, table: holding, address: 106, type: s16, unit: mV, optional: true}
  - {key: x.orp_2, label: ORP 2, table: holding, address: 107, type: s16, unit: mV, optional: true}
  - {key: x.flow_1, label: Flow 1, table: holding, address: 108, type: s16, unit: gpm, scale: 0.01, optional: true}
  - {key: x.flow_2, label: Flow 2, table: holding, address: 109, type: s16, unit: gpm, scale: 0.01, optional: true}
  - {key: x.pump_speed_1, label: Dosing pump 1 speed, table: holding, address: 200, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true, note: 'Writable in diagnostic mode only, and only 0 or 100 (pump test and priming).'}
  - {key: x.pump_speed_2, label: Dosing pump 2 speed, table: holding, address: 201, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_3, label: Dosing pump 3 speed, table: holding, address: 202, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_4, label: Dosing pump 4 speed, table: holding, address: 203, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_5, label: Dosing pump 5 speed, table: holding, address: 204, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_6, label: Dosing pump 6 speed, table: holding, address: 205, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_7, label: Dosing pump 7 speed, table: holding, address: 206, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_8, label: Dosing pump 8 speed, table: holding, address: 207, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_9, label: Dosing pump 9 speed, table: holding, address: 208, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_10, label: Dosing pump 10 speed, table: holding, address: 209, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_11, label: Dosing pump 11 speed, table: holding, address: 210, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.pump_speed_12, label: Dosing pump 12 speed, table: holding, address: 211, type: s16, unit: '%', writable: true, min: 0, max: 100, optional: true}
  - {key: x.main_pump, label: RX1 main pump relay, table: coil, address: 0, type: bool, writable: true, verified: false, note: Coils are numbered 1–17 in the document; coil 1 is taken as protocol address 0 (assumed). Writable in diagnostic mode only.}
  - {key: x.fill_valve, label: Fill valve, table: coil, address: 1, type: bool, writable: true}
  - {key: x.mixing_valve, label: Mixing valve, table: coil, address: 2, type: bool, writable: true}
  - {key: x.zone_valve_1, label: Zone valve 1, table: coil, address: 3, type: bool, writable: true}
  - {key: x.zone_valve_2, label: Zone valve 2, table: coil, address: 4, type: bool, writable: true}
  - {key: x.zone_valve_3, label: Zone valve 3, table: coil, address: 5, type: bool, writable: true}
  - {key: x.zone_valve_4, label: Zone valve 4, table: coil, address: 6, type: bool, writable: true}
  - {key: x.zone_valve_5, label: Zone valve 5, table: coil, address: 7, type: bool, writable: true}
  - {key: x.zone_valve_6, label: Zone valve 6, table: coil, address: 8, type: bool, writable: true}
  - {key: x.zone_valve_7, label: Zone valve 7, table: coil, address: 9, type: bool, writable: true}
  - {key: x.zone_valve_8, label: Zone valve 8, table: coil, address: 10, type: bool, writable: true}
  - {key: x.zone_valve_9, label: Zone valve 9, table: coil, address: 11, type: bool, writable: true}
  - {key: x.zone_valve_10, label: Zone valve 10, table: coil, address: 12, type: bool, writable: true}
  - {key: x.zone_valve_11, label: Zone valve 11, table: coil, address: 13, type: bool, writable: true}
  - {key: x.zone_valve_12, label: Zone valve 12, table: coil, address: 14, type: bool, writable: true}
  - {key: x.zone_valve_13, label: Zone valve 13, table: coil, address: 15, type: bool, writable: true}
  - {key: x.zone_valve_14, label: Zone valve 14, table: coil, address: 16, type: bool, writable: true}
  - {key: x.tank_low, label: Tank low level sensor, table: discrete, address: 0, type: bool}
  - {key: x.tank_high, label: Tank high level sensor, table: discrete, address: 1, type: bool}
  - {key: x.trigger_input_1, label: Trigger input 1, table: discrete, address: 2, type: bool, note: Trigger inputs 1–2 are BDX inputs 3–4; 3–18 come from DXI8 input modules.}
  - {key: x.trigger_input_2, label: Trigger input 2, table: discrete, address: 3, type: bool}
  - {key: x.trigger_input_3, label: Trigger input 3, table: discrete, address: 4, type: bool, optional: true}
  - {key: x.trigger_input_4, label: Trigger input 4, table: discrete, address: 5, type: bool, optional: true}
  - {key: x.trigger_input_5, label: Trigger input 5, table: discrete, address: 6, type: bool, optional: true}
  - {key: x.trigger_input_6, label: Trigger input 6, table: discrete, address: 7, type: bool, optional: true}
  - {key: x.trigger_input_7, label: Trigger input 7, table: discrete, address: 8, type: bool, optional: true}
  - {key: x.trigger_input_8, label: Trigger input 8, table: discrete, address: 9, type: bool, optional: true}
  - {key: x.trigger_input_9, label: Trigger input 9, table: discrete, address: 10, type: bool, optional: true}
  - {key: x.trigger_input_10, label: Trigger input 10, table: discrete, address: 11, type: bool, optional: true}
  - {key: x.trigger_input_11, label: Trigger input 11, table: discrete, address: 12, type: bool, optional: true}
  - {key: x.trigger_input_12, label: Trigger input 12, table: discrete, address: 13, type: bool, optional: true}
  - {key: x.trigger_input_13, label: Trigger input 13, table: discrete, address: 14, type: bool, optional: true}
  - {key: x.trigger_input_14, label: Trigger input 14, table: discrete, address: 15, type: bool, optional: true}
  - {key: x.trigger_input_15, label: Trigger input 15, table: discrete, address: 16, type: bool, optional: true}
  - {key: x.trigger_input_16, label: Trigger input 16, table: discrete, address: 17, type: bool, optional: true}
  - {key: x.trigger_input_17, label: Trigger input 17, table: discrete, address: 18, type: bool, optional: true}
  - {key: x.trigger_input_18, label: Trigger input 18, table: discrete, address: 19, type: bool, optional: true}

enums:
  system_status: {'0': Paused, '1': Automatic run, '2': Error (paused), '3': Manual diagnostic mode}
  job_status: {'0': Pending, '1': Filling, '2': Dosing, '3': Feeding, '4': Draining (job aborted), '5': Completed, '6': Waiting (no job scheduled)}

problems:
  - {when: {key: state, equals: 2}, kind: fault, text: Fertigation system in error (paused)}
  - {when: {key: x.job_status, equals: 4}, kind: warning, text: 'Job aborted, tank draining'}

notes:
- The document gives references with the 40001 / 10001 offsets ("40101" is holding register 100, "10001" discrete input 0);
  the addresses here are those minus the offset. Coils are numbered from 1; coil 1 is assumed to be protocol address 0. Functions
  01, 02, 03, 05 and 06; all registers are signed 16-bit.
- The Modbus TCP server must be enabled and may use any port; port 502 and unit id 1 are assumptions.
- 'Sensor scaling as given in the document: temperature and pH × 100, EC in µS/cm, ORP in mV, flow × 100 in gpm (0–60 gpm).'
- 'Left out: the recipe, event, recipe part and queue property registers (300…, 400…, 500…, 600…), which show one entry at
  a time after its index is written, the enqueue register (1000) and the property coils (100, 101).'
