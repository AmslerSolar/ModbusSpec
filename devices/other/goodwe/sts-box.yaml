modbusspec: 0
id: goodwe-sts-box
manufacturer: GoodWe
name: STS box (backup switch, genset input)
kind: other

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.goodwe

connection:
  default_port: 502
  default_unit: 247

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: serial, label: Serial number, table: holding, address: 33288, type: str, length: 8}
  - {key: x.version, label: Version, table: holding, address: 35039, type: u16}
  - {key: x.sub_version, label: Sub version, table: holding, address: 35040, type: u16}
  - {key: x.genset_backup_power, label: GENSET backup power, table: holding, address: 35169, type: s32, unit: W}
  - {key: x.genset_genset_operating_mode, label: GENSET genset operating mode, table: holding, address: 36197, type: u16}
  - {key: x.port_mutliplexing_mode, label: Port mutliplexing mode, table: holding, address: 45300, type: u16, enum: multiplexing_mode, writable: true}
  - {key: x.genset_upper_voltage_limit, label: Genset upper voltage limit, table: holding, address: 45593, type: u16, unit: V, writable: true}
  - {key: x.genset_lower_voltage_limit, label: Genset lower voltage limit, table: holding, address: 45594, type: u16, unit: V, writable: true}
  - {key: x.genset_upper_frequency_limit, label: Genset upper frequency limit, table: holding, address: 45595, type: u16, unit: Hz, scale: 0.01, writable: true}
  - {key: x.genset_lower_frequency_limit, label: Genset lower frequency limit, table: holding, address: 45596, type: u16, unit: Hz, scale: 0.01, writable: true}
  - {key: x.delay_before_load, label: Delay before load, table: holding, address: 45597, type: u16, unit: s, writable: true}
  - {key: x.genset_start_mode_selection, label: Genset start mode selection, table: holding, address: 47745, type: u16, enum: genset_installed_status, writable: true}
  - {key: x.one_click_enable, label: One click enable, table: holding, address: 47746, type: u16, enum: enable_disable, writable: true}
  - {key: x.genset_charge_limit, label: Genset charge limit, table: holding, address: 47747, type: u16, unit: '%', scale: 0.1, writable: true}
  - {key: x.open_voltage, label: Open voltage, table: holding, address: 47756, type: u16, unit: '%', writable: true}
  - {key: x.closed_voltage, label: Closed voltage, table: holding, address: 47757, type: u16, unit: '%', writable: true}
  - {key: x.genset_run_time, label: Genset run time, table: holding, address: 47758, type: u16, writable: true}
  - {key: x.genset_rated_power, label: Genset rated power, table: holding, address: 47759, type: u16, unit: W, scale: 10, writable: true}

enums:
  multiplexing_mode: {'0': GENSET, '1': LARGE_LOAD, '2': BACKUP}
  genset_installed_status: {'0': INSTALLED, '2': NOT_INSTALLED}
  enable_disable: {'0': Disable, '1': Enable}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
