enums:
  device_type:
    '51': RCM 202-AB
  transformer:
    '0': DW18
    '1': CT-AC RCM 35N (IME TDGB2)
    '2': CT-AC RCM 80N (IME TDGC2)
    '3': CT-AC RCM 110N (IME TDGD2)
    '4': CT-AC RCM 140N (IME TDGE2)
    '5': CT-AC RCM 210N (IME TDGF2)
    '6': MBS KBU23D
    '7': MBS KBU58D
    '8': MBS KBU812D
    '9': DACT20
    '10': CT-AC RCM A110N
    '11': CT-AC RCM A150N
    '12': CT-AC RCM A310N
    '13': Bender W1-S35
    '14': Bender W3-S105
    '15': Bender W4-S140
    '16': Socomec ΔIC200
    '17': ABB TR4
    '18': DACT35
    '19': DACT60
    '20': DACT120
    '250': Transformer parameters analyzed
    '251': Transformer parameters over GridVis
  on_off:
    '0': 'Off'
    '1': 'On'
flags:
  current_channels:
    '0': Current
    '1': CurrentAC2k
    '2': CurrentAC20k
    '3': CurrentDC
    '4': CurrentAC50
    '5': Current2k
  output_faults:
    '0': Current
    '1': CurrentAC2k
    '2': CurrentAC20k
    '3': CurrentDC
    '4': CurrentAC50
    '5': Current2k
    '6': OverdriveErr
    '7': TrafoErr
    '8': AmplifierErr
  channels:
    '0': Current channel I1
    '1': Current channel I2
  channel_control:
    '0': Channel active
    '1': Transformer connection monitoring on
    '3': Automatic reset of the limit value message off
  do_inverted:
    '0': Digital output 1 inverted
    '1': Digital output 2 inverted
problems:
- when:
    key: x.device_faults
    not: 0
  kind: fault
  text: Device fault (code {value})
- when:
    key: x.errors_flash
    not: 0
  kind: warning
  text: SPI flash errors (code {value})
- when:
    key: x.errors_parameters
    not: 0
  kind: warning
  text: Parameter errors (code {value})
- when:
    key: x.errors_mutex
    not: 0
  kind: warning
  text: Mutex errors (code {value})
- when:
    key: x.i1_warnings
    bit: 0
  kind: warning
  text: 'Channel I1 warning level: Current (bit 0)'
- when:
    key: x.i1_warnings
    bit: 1
  kind: warning
  text: 'Channel I1 warning level: CurrentAC2k (bit 1)'
- when:
    key: x.i1_warnings
    bit: 2
  kind: warning
  text: 'Channel I1 warning level: CurrentAC20k (bit 2)'
- when:
    key: x.i1_warnings
    bit: 3
  kind: warning
  text: 'Channel I1 warning level: CurrentDC (bit 3)'
- when:
    key: x.i1_warnings
    bit: 4
  kind: warning
  text: 'Channel I1 warning level: CurrentAC50 (bit 4)'
- when:
    key: x.i1_warnings
    bit: 5
  kind: warning
  text: 'Channel I1 warning level: Current2k (bit 5)'
- when:
    key: x.i2_warnings
    bit: 0
  kind: warning
  text: 'Channel I2 warning level: Current (bit 0)'
- when:
    key: x.i2_warnings
    bit: 1
  kind: warning
  text: 'Channel I2 warning level: CurrentAC2k (bit 1)'
- when:
    key: x.i2_warnings
    bit: 2
  kind: warning
  text: 'Channel I2 warning level: CurrentAC20k (bit 2)'
- when:
    key: x.i2_warnings
    bit: 3
  kind: warning
  text: 'Channel I2 warning level: CurrentDC (bit 3)'
- when:
    key: x.i2_warnings
    bit: 4
  kind: warning
