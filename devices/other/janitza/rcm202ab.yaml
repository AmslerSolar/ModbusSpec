  - {key: x.i2_transformer, label: 'Current transformer[1]', table: holding, address: 3023, type: s16, enum: transformer, poll: slow}
  - {key: x.i1_trigger_delay, label: 'Trigger delay[0]', table: holding, address: 3100, type: s16, scale: 10, unit: ms, poll: slow, note: 'Listed unit 10 ms, range in ms: read as 10 ms per count.'}
  - {key: x.i2_trigger_delay, label: 'Trigger delay[1]', table: holding, address: 3101, type: s16, scale: 10, unit: ms, poll: slow, note: 'Listed unit 10 ms, range in ms: read as 10 ms per count.'}
  - {key: x.i1_current_warning_level, label: 'Current warning level[0]', table: holding, address: 3120, type: f32, unit: A, poll: slow}
