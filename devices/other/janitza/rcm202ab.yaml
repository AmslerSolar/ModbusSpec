  - {key: x.save_settings, label: Save settings, table: holding, address: 3000, type: s16, note: Stores the settings in non-volatile memory., writable: true, write_only: true, min: 4951, max: 4951}
  - {key: x.reset_settings, label: Reset settings, table: holding, address: 3001, type: s16, note: Returns the settings to the delivery condition., writable: true, write_only: true, min: 4951, max: 4951}
