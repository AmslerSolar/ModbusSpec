  - {key: x.transformer_faults, label: Flags current transformer faults, table: holding, address: 2185, type: s16, flags: channels, note: Bit meaning taken from the row above; not given for this row.}
  - {key: x.amplifier_faults, label: Flags amplifier faults, table: holding, address: 2186, type: s16, flags: channels, note: Bit meaning taken from the row above; not given for this row.}
  - {key: x.reset_limit_messages, label: Reset limit messages, table: holding, address: 2187, type: s16, writable: true, write_only: true, min: 4951, max: 4951}

