  # Limit value monitoring status
  - {key: x.i1_warnings, label: 'Flags current warnings[0]', table: holding, address: 2180, type: s16, flags: current_channels, note: 'Current2k: the table says bit 4 twice; bit 5 taken from the digital output tables.'}
