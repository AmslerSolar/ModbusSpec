  - {key: x.i2_ac20k_warning_level, label: 'CurrentAC20k warning level[1]', table: holding, address: 3130, type: f32, unit: A, poll: slow}
  - {key: x.i1_dc_warning_level, label: 'CurrentDC warning level[0]', table: holding, address: 3132, type: f32, unit: A, poll: slow}
  - {key: x.i2_dc_warning_level, label: 'CurrentDC warning level[1]', table: holding, address: 3134, type: f32, unit: A, poll: slow}
  - {key: x.i1_ac50_warning_level, label: 'CurrentAC50 warning level[0]', table: holding, address: 3136, type: f32, unit: A, poll: slow}
  - {key: x.i2_ac50_warning_level, label: 'CurrentAC50 warning level[1]', table: holding, address: 3138, type: f32, unit: A, poll: slow}
  - {key: x.i1_current_fault_level, label: 'Current fault level[0]', table: holding, address: 3140, type: f32, unit: A, poll: slow}
  - {key: x.i2_current_fault_level, label: 'Current fault level[1]', table: holding, address: 3142, type: f32, unit: A, poll: slow}
  - {key: x.i1_ac2k_fault_level, label: 'CurrentAC2k fault level[0]', table: holding, address: 3144, type: f32, unit: A, poll: slow}
  - {key: x.i2_ac2k_fault_level, label: 'CurrentAC2k fault level[1]', table: holding, address: 3146, type: f32, unit: A, poll: slow}
  - {key: x.i1_ac20k_fault_level, label: 'CurrentAC20k fault level[0]', table: holding, address: 3148, type: f32, unit: A, poll: slow}
  - {key: x.i2_ac20k_fault_level, label: 'CurrentAC20k fault level[1]', table: holding, address: 3150, type: f32, unit: A, poll: slow}
  - {key: x.i1_dc_fault_level, label: 'CurrentDC fault level[0]', table: holding, address: 3152, type: f32, unit: A, poll: slow}
  - {key: x.i2_dc_fault_level, label: 'CurrentDC fault level[1]', table: holding, address: 3154, type: f32, unit: A, poll: slow}
  - {key: x.i1_ac50_fault_level, label: 'CurrentAC50 fault level[0]', table: holding, address: 3156, type: f32, unit: A, poll: slow}
  - {key: x.i2_ac50_fault_level, label: 'CurrentAC50 fault level[1]', table: holding, address: 3158, type: f32, unit: A, poll: slow}
  - {key: x.i1_2k_warning_level, label: 'Current2k warning level[0]', table: holding, address: 3160, type: f32, unit: A, poll: slow}
