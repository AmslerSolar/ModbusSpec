  - {key: x.i1_faults, label: 'Flags current faults[0]', table: holding, address: 2182, type: s16, flags: current_channels}
  - {key: x.i2_faults, label: 'Flags current faults[1]', table: holding, address: 2183, type: s16, flags: current_channels}
