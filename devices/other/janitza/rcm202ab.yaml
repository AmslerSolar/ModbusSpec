modbusspec: 0
id: janitza-rcm202ab
manufacturer: Janitza
name: RCM 202-AB residual current monitor
kind: other
sources:
- title: Janitza RCM 202-AB (from firmware V1.5.0), Modbus address list, doc. no. 2.002.183.1.c
  version: 04/2025
  url: https://assets.janitza.com/ce18jq9ih0x6/1ymbn3SRNlH1Mybpc57aob/e810c632c242b721ad504c2d416d44a6/janitza-mal-rcm202ab-en.pdf
  sha256: 5d9c0bf04bee933c15ba6c50621ffceb986aedb65f2fa5e1a4f3e153475c1f50
  number: 2.002.183.1.c
  language: en
- title: Janitza RCM 202-AB (from firmware V1.3.0), Modbus address list, doc. no. 2.002.183.1.b
  version: 05/2023
  url: https://assets.janitza.com/ce18jq9ih0x6/0c924921d3eb12c7ec4045/2e40a47c36fb5803a0f86b8ca228b42b/janitza-mal-rcm202ab_fw130-en.pdf
  sha256: d5ee7c0dfcf30d9d81dbf7bde6ae3af38aa95cbed662ee740517abb15ed5cd10
  number: 2.002.183.1.b
  language: en
connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 125
encoding:
  byte_order: big
  word_order: big
defaults:
  verified: false
identify:
  serial:
    table: holding
    address: 911
    type: u32
  checks:
  - table: holding
    address: 915
    type: u16
    equals: 51
  - table: holding
    address: 3800
    type: u16
    range:
    - 1
    - 247
  - table: holding
    address: 3801
    type: u32
    in:
    - 9600
    - 19200
    - 38400
    - 57600
    - 115200

points:
  # Device
  - {key: x.reset_device, label: Reset device, table: holding, address: 700, type: s16, note: Restarts the device., writable: true, write_only: true, min: 4951, max: 4951}
  - {key: x.time_of_day, label: Time of day, table: holding, address: 701, type: u32, poll: slow, note: Listed as UTC; the epoch isn't given.}

  # Firmware error codes
  - {key: x.device_faults, label: Device faults, table: holding, address: 703, type: s16}
  - {key: x.errors_flash, label: Errors spi-flash, table: holding, address: 704, type: s16}
  - {key: x.errors_parameters, label: Errors parameters, table: holding, address: 705, type: s16}
  - {key: x.errors_mutex, label: Errors mutex, table: holding, address: 706, type: s16}

  # Identity
  - {key: serial, label: Serial number, table: holding, address: 911, type: u32, poll: slow}
  - {key: x.firmware_major, label: Firmware version, table: holding, address: 913, type: s16, bits: [8, 15], poll: slow}
  - {key: x.firmware_minor, label: Firmware version, table: holding, address: 913, type: s16, bits: [0, 7], poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 914, type: u16, poll: slow}
  - {key: x.device_type, label: Device type, table: holding, address: 915, type: u16, enum: device_type, poll: slow}

  # Measured values
  - {key: x.i1_current, label: 'Current[0]', table: holding, address: 1012, type: f32, unit: A}
  - {key: x.i2_current, label: 'Current[1]', table: holding, address: 1014, type: f32, unit: A}
  - {key: x.i1_ac2k, label: 'CurrentAC2k[0]', table: holding, address: 1016, type: f32, unit: A}
  - {key: x.i2_ac2k, label: 'CurrentAC2k[1]', table: holding, address: 1018, type: f32, unit: A}
  - {key: x.i1_ac20k, label: 'CurrentAC20k[0]', table: holding, address: 1020, type: f32, unit: A}
  - {key: x.i2_ac20k, label: 'CurrentAC20k[1]', table: holding, address: 1022, type: f32, unit: A}
  - {key: x.i1_dc, label: 'CurrentDC[0]', table: holding, address: 1024, type: f32, unit: A}
  - {key: x.i2_dc, label: 'CurrentDC[1]', table: holding, address: 1026, type: f32, unit: A}
  - {key: x.i1_ac50, label: 'CurrentAC50[0]', table: holding, address: 1028, type: f32, unit: A}
  - {key: x.i2_ac50, label: 'CurrentAC50[1]', table: holding, address: 1030, type: f32, unit: A}
  - {key: x.i1_2k, label: 'Current2k[0]', table: holding, address: 1032, type: f32, unit: A}
  - {key: x.i2_2k, label: 'Current2k[1]', table: holding, address: 1034, type: f32, unit: A}
  - {key: x.i1_crest_factor, label: 'Crest factor[0]', table: holding, address: 1100, type: f32}
  - {key: x.i2_crest_factor, label: 'Crest factor[1]', table: holding, address: 1102, type: f32}
  - {key: x.i1_thd, label: 'Total harmonic distortion[0]', table: holding, address: 1104, type: f32, unit: A, note: Listed in A; both editions.}
  - {key: x.i2_thd, label: 'Total harmonic distortion[1]', table: holding, address: 1106, type: f32, unit: A, note: Listed in A; both editions.}

  # Extreme value memory (time stamps left out)
  - {key: x.i1_min_current, label: 'Minimum current[0]', table: holding, address: 2000, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_current, label: 'Minimum current[1]', table: holding, address: 2002, type: f32, unit: A, poll: slow}
  - {key: x.i1_min_ac2k, label: 'Minimum currentAC2k[0]', table: holding, address: 2004, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_ac2k, label: 'Minimum currentAC2k[1]', table: holding, address: 2006, type: f32, unit: A, poll: slow}
  - {key: x.i1_min_ac20k, label: 'Minimum currentAC20k[0]', table: holding, address: 2008, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_ac20k, label: 'Minimum currentAC20k[1]', table: holding, address: 2010, type: f32, unit: A, poll: slow}
  - {key: x.i1_min_dc, label: 'Minimum currentDC[0]', table: holding, address: 2012, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_dc, label: 'Minimum currentDC[1]', table: holding, address: 2014, type: f32, unit: A, poll: slow}
  - {key: x.i1_min_ac50, label: 'Minimum currentAC50[0]', table: holding, address: 2016, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_ac50, label: 'Minimum currentAC50[1]', table: holding, address: 2018, type: f32, unit: A, poll: slow}
  - {key: x.i1_min_2k, label: 'Minimum current2k[0]', table: holding, address: 2020, type: f32, unit: A, poll: slow}
  - {key: x.i2_min_2k, label: 'Minimum current2k[1]', table: holding, address: 2022, type: f32, unit: A, poll: slow}
  - {key: x.i1_max_current, label: 'Maximum current[0]', table: holding, address: 2040, type: f32, unit: A, poll: slow}
  - {key: x.i2_max_current, label: 'Maximum current[1]', table: holding, address: 2042, type: f32, unit: A, poll: slow}
  - {key: x.i1_max_ac2k, label: 'Maximum currentAC2k[0]', table: holding, address: 2044, type: f32, unit: A, poll: slow}
  - {key: x.i2_max_ac2k, label: 'Maximum currentAC2k[1]', table: holding, address: 2046, type: f32, unit: A, poll: slow}
  - {key: x.i1_max_ac20k, label: 'Maximum currentAC20k[0]', table: holding, address: 2048, type: f32, unit: A, poll: slow}
  - {key: x.i2_max_ac20k, label: 'Maximum currentAC20k[1]', table: holding, address: 2050, type: f32, unit: A, poll: slow}
  - {key: x.i1_max_dc, label: 'Maximum currentDC[0]', table: holding, address: 2052, type: f32, unit: A, poll: slow}
