  - {key: x.i1_hysteresis, label: 'Hysteresis[0]', table: holding, address: 3200, type: f32, unit: A, poll: slow}
  - {key: x.i2_hysteresis, label: 'Hysteresis[1]', table: holding, address: 3202, type: f32, unit: A, poll: slow}
  - {key: x.i1_release_delay, label: 'Release delay[0]', table: holding, address: 3240, type: s16, scale: 10, unit: ms, poll: slow, note: 'Listed unit 10 ms, range in ms: read as 10 ms per count.'}
  - {key: x.i2_release_delay, label: 'Release delay[1]', table: holding, address: 3241, type: s16, scale: 10, unit: ms, poll: slow, note: 'Listed unit 10 ms, range in ms: read as 10 ms per count.'}
