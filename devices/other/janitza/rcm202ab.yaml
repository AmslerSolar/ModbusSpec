  - {key: x.i1_max_2k, label: 'Maximum current2k[0]', table: holding, address: 2060, type: f32, unit: A, poll: slow}
  - {key: x.i2_max_2k, label: 'Maximum current2k[1]', table: holding, address: 2062, type: f32, unit: A, poll: slow}
  - {key: x.i1_reset_extremes, label: 'Reset minimum and maximum current[0]', table: holding, address: 2160, type: s16, writable: true, write_only: true, min: 4951, max: 4951}
