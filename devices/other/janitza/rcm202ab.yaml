notes:
- Function codes 03, 06, 16 and 23 only, so everything is in the holding table. The list doesn't say whether addresses are
  0-based; they are used as listed, as protocol addresses (unverified, like every point here). Big-endian is documented;
  the word order of 32-bit values is assumed to match.
- 'Both editions have the same register map, so there are no models. The V1.5.0 edition only adds transformer types 17–20
  (ABB TR4, DACT35, DACT60, DACT120). Types 13–16 and the read-only values 250 and 251 depend on firmware too, as the enum''s
  source table says: 13 from V1.0.3, 14–15 from V1.3.1, 16 and 250–251 from V1.4.0.'
- 'The list has no read/write column. Only rows whose comment says that writing triggers or controls something are writable
  here: the commands (write 0x1357 = 4951) and the digital output controls. The settings have value ranges and a save command,
  so they are probably writable, but they aren''t marked so and stay read-only in this file. A writer would need 3000 afterwards
  to keep a change.'
- Commands at 700 (restart), 3000 and 3001 change device behaviour; 3818/3819 switch the outputs directly.
- 'Rows of type char occupy one register each, and are read as whole 16-bit registers (unverified). That includes the device
  type at 915, which is the identification: it fails if the value sits in the high byte.'
- 'Flag bits: 2180–2183 share one comment which gives bit 4 twice, for CurrentAC50 and Current2k, in English and German.
  The digital output tables have Current2k at bit 5, used here. 2185 and 2186 have no comment of their own; bit 0 = I1 and
  bit 1 = I2 is carried over from 2184. Warning and fault here mean the channel''s limit levels; which kind each rule gets
  is this file''s judgement. The meaning of the error codes at 703–706 isn''t documented.'
- 'Serial: 9600, 19200, 38400, 57600 or 115200 baud, 8 data bits, no parity, 1 stop bit; no default baud rate or unit id
  is given. The list doesn''t name the interface; RS485 is assumed from these parameters. Unit 1, port 502 and 125 registers
  per request are assumptions.'
- 'Left out: harmonics 1 to 41 per channel (1108–1270), RMS values at 3–20 kHz (1400–1470), time stamps of the extreme values
  (2080–2142), free comment strings (5000–5419), the measured value memory (6000–6027) and firmware update (9900–10029).'
