# Written from the Janitza RCM 201-ROGO Modbus address list (doc. no. 2.353.057.1.c, 10/2023).

modbusspec: 0
id: janitza-rcm201-rogo
manufacturer: Janitza
name: RCM 201-ROGO residual current monitor
kind: other
sources:
- title: Janitza RCM 201-ROGO, Modbus address list, doc. no. 2.353.057.1.c
  version: 10/2023
  url: https://assets.janitza.com/ce18jq9ih0x6/e5384b0d149e667f6f1c76/59791f5cd59b2571867078ebe4dfe297/janitza-mal-rcm201-rogo-en.pdf
  sha256: 1cd63d60ed035f094c9f9b37d20ddd40dd46fccfe7c0b96e92ee85abb4ddc05a
  number: 2.353.057.1.c
  language: en
connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
  limits:
    max_registers: 125
encoding:
  byte_order: big
  word_order: big
defaults:
  verified: false
identify:
  checks:
  - table: holding
    address: 101
    type: u16
    in:
    - 1
    - 2
    - 3
    - 4
  - table: holding
    address: 102
    type: u16
    in:
    - 0
    - 1
  - table: holding
    address: 103
    type: u16
    range:
    - 20
    - 200
  - table: holding
    address: 104
    type: u16
    range:
    - 1
    - 255
  - table: holding
    address: 105
    type: u16
    in:
    - 0
    - 1
  - table: holding
    address: 106
    type: u16
    range:
    - 20
    - 200
  - table: holding
    address: 107
    type: u16
    range:
    - 1
    - 255
  - table: holding
    address: 108
    type: u16
    range:
    - 0
    - 60
  - table: holding
    address: 109
    type: u16
    range:
    - 1
    - 255
  - table: holding
    address: 110
    type: u16
    range:
    - 0
    - 5
  - table: holding
    address: 111
    type: u16
    in:
    - 0
    - 1

points:
  # Measured values and status
  - {key: x.residual_current_a, label: Residual current (LEVEL-F), table: holding, address: 10, type: f32, unit: A}
  - {key: x.status, label: Status, table: holding, address: 13, type: s16, flags: status}
  - {key: x.residual_current_ma, label: Residual current (LEVEL-F), table: holding, address: 14, type: f32, unit: mA}

  # Settings. Listed as format byte, one register per row; the value is taken as the whole register.
  - {key: x.measuring_range, label: Measuring range, table: holding, address: 101, type: u16, poll: slow, writable: true, enum: measuring_range, note: Changes what the device measures.}
  - {key: x.report_function, label: Reporting function, table: holding, address: 102, type: u16, poll: slow, writable: true, enum: normal_inverse}
  - {key: x.report_level, label: Reporting level, table: holding, address: 103, type: u16, poll: slow, writable: true, unit: '%', scale: 0.5, min: 10, max: 100, note: Raw 20–200 stands for 10–100 % of the nominal current.}
  - {key: x.report_delay, label: Reporting delay, table: holding, address: 104, type: u16, poll: slow, writable: true, unit: s, min: 1, max: 255}
  - {key: x.alarm_function, label: Alarm function, table: holding, address: 105, type: u16, poll: slow, writable: true, enum: normal_inverse}
  - {key: x.alarm_level, label: Alarm level, table: holding, address: 106, type: u16, poll: slow, writable: true, unit: '%', scale: 0.5, min: 10, max: 100, note: Raw 20–200 stands for 10–100 % of the nominal current.}
  - {key: x.alarm_delay, label: Alarm delay, table: holding, address: 107, type: u16, poll: slow, writable: true, min: 1, max: 255, note: No unit in either edition (the reporting delay has seconds).}
  - {key: x.hysteresis, label: Hysteresis, table: holding, address: 108, type: u16, poll: slow, writable: true, unit: '%', scale: 0.5, min: 0, max: 30, note: Raw 0–60 stands for 0–30 % of the level.}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 109, type: u16, poll: slow, writable: true, min: 1, max: 255, note: Writing this moves the device to another unit id.}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 110, type: u16, poll: slow, writable: true, enum: baud_rate, note: Writing this changes the serial speed; the master has to follow.}
  - {key: x.key_lock, label: Key lock, table: holding, address: 111, type: u16, poll: slow, writable: true, enum: key_lock, note: Locks the buttons on the device.}

  # Identity
  - {key: x.firmware_main, label: Firmware version, table: holding, address: 3145, type: u16, bits: [8, 15], poll: slow}
  - {key: x.firmware_sub, label: Firmware version, table: holding, address: 3145, type: u16, bits: [0, 7], poll: slow}
  - {key: x.hardware_main, label: Hardware version, table: holding, address: 3146, type: u16, bits: [8, 15], poll: slow}
  - {key: x.hardware_sub, label: Hardware version, table: holding, address: 3146, type: u16, bits: [0, 7], poll: slow}
  - {key: x.device_id_1, label: Device identification part 1, table: holding, address: 3147, type: u16, poll: slow, note: Marked for internal use; no values given.}
  - {key: x.device_id_2, label: Device identification part 2, table: holding, address: 3148, type: u16, poll: slow, note: Marked for internal use; no values given.}

enums:
  measuring_range:
    '1': 125 A
    '2': 25 A
    '3': 10 A
    '4': 5 A
  normal_inverse:
    '0': Normal
    '1': Inverse
  baud_rate:
    '0': 9600 baud
    '1': 19200 baud
    '2': 38400 baud
    '3': 57600 baud
    '4': 115200 baud
    '5': 250000 baud
  key_lock:
    '0': No lock
    '1': Lock active
flags:
  status:
    '0': Switch-on phase
    '1': Wire break, Rogowski coil
    '2': Short circuit, Rogowski coil
    '3': Overtemperature
    '4': +5 V error
    '5': -5 V error
    '6': Overcurrent
    '7': Under-current
    '8': Program
    '9': Button
    '10': Message
    '11': Alarm
problems:
- when:
    key: x.status
    bit: 0
  kind: warning
  text: Switch-on phase (bit 0)
- when:
    key: x.status
    bit: 1
  kind: fault
  text: Wire break, Rogowski coil (bit 1)
- when:
    key: x.status
    bit: 2
  kind: fault
  text: Short circuit, Rogowski coil (bit 2)
- when:
    key: x.status
    bit: 3
  kind: fault
  text: Overtemperature (bit 3)
- when:
    key: x.status
    bit: 4
  kind: fault
  text: +5 V error (bit 4)
- when:
    key: x.status
    bit: 5
  kind: fault
  text: -5 V error (bit 5)
- when:
    key: x.status
    bit: 6
  kind: fault
  text: Overcurrent (bit 6)
- when:
    key: x.status
    bit: 7
  kind: fault
  text: Under-current (bit 7)
- when:
    key: x.status
    bit: 10
  kind: warning
  text: Residual current message (bit 10)
- when:
    key: x.status
    bit: 11
  kind: fault
  text: Residual current alarm (bit 11)
reserved:
- table: holding
  address: 12
  count: 1
notes:
- The list gives addresses but no function codes and doesn't say whether they are 0-based. They are used as listed, as protocol
  addresses in the holding table; unverified, like every point here.
- 'Status: the list numbers bits per byte. High byte bits 0–3 (program, button, message, alarm) are register bits 8–11 here,
  low byte bits 0–7 (errors) register bits 0–7. Which bits count as a fault or a warning is this file''s judgement.'
- Rows of format byte each have an address of their own, so they are read as whole 16-bit registers (unverified). Firmware
  and hardware version are also listed as byte, but one register holds main version in the high byte and sub-version in
  the low byte. Level 103/106 and hysteresis 108 are stored doubled, as the list's examples show.
- Settings 101–111 are marked RD/WR. No save command is listed, so whether they survive a restart isn't documented. No float
  byte or word order is stated; big-endian is assumed.
- 'Identification: only ranges of the settings 101–111, since no register has a documented fixed value. A device with the
  settings at documented values passes; another device with small values in these registers could too.'
- 'Serial: the baud rate is the factory setting of register 110; data bits, parity and stop bits aren''t documented. The
  factory unit id 1 is from register 109. The list doesn''t name the interface; RS485 is assumed from the baud rate setting.
  Port 502 and 125 registers per request are assumptions.'
- 'The English and German editions list the same registers. Nothing left out: address 12 is the only table row without a
  point, marked reserved.'
