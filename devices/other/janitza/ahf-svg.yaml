notes:
- 'Addressing: the protocol''s examples show the listed numbers on the wire (a read of analog data starts at 00 00, setting
  the working mode at 20 1C), so the listed addresses are the PDU addresses with no offset, for status bits as for registers.
  Byte is the size of a value: 4 bytes = 2 registers, 2 bytes = 1 register, 1 for a status row is one bit (function 02),
  so these are discrete points of type bool and not a flags word.'
- 'Function 03 and 04 are both listed for every register range, hence input_equals_holding; the holding table is used. Setting
  is function 16 only, also for one value, and setting values are always floats. Writable rows are those in the four setting
  groups the protocol names. Everything is marked unverified: the list has no read/write column, and nothing has been read
  from a device.'
- 'Data types: the rows give only byte counts. The protocol defines integers as 2 bytes and floats as 4 (high byte first,
  IEEE 754), and its settings examples are floats, so all 4-byte rows are f32 and 2-byte rows u16. Inferred for the analog
  data.'
- 'Models: the AHF-PRO / SVG-PRO document (German only) has the same registers, byte counts, descriptions and ranges as
  the German AHF/SVG edition, line for line. So there is one file. Models are by AHF or SVG alone, since only the working
  mode''s meaning differs; a user picks one. A PRO unit can''t be told from a standard one from the registers. 0x1203 reports
  a type, but its name is Reserved and SVG600 and ASVG have no working mode table, so it isn''t used to detect the model.'
- 'List oddities, the same in all editions: 0x1203 is named Reserved though it has a value table; the frame example reads
  61 status bits but the table has 73; 0x201C points to appendix II for working modes, which are in appendix I; the 0x2058
  default of 10 % is outside its range; 0x2030 is named PPL; 0.01A is a unit at 0x00A0; defaults at 0x2030 onward are 1,
  listed as Disable; the 0x202E default is written 50Hz.'
- Which bits are faults and which warnings is this file's judgement; the list only says normal or abnormal. Temperature
  1–6, the Grid and Load power values and L1 Active Power have no direction or location in the list, so no direction keys
  are used. Frequency here is L1's.
- 'Physical interfaces listed: two-wire RS485 and an Ethernet port. RS485: 19200 baud by default (or 9600, 38400), 8N1;
  default address 1. Ethernet gets transport tcp, but the protocol only describes RTU framing, so Modbus TCP and port 502
  are assumptions. A reply is expected within 100 ms. Analog reads take at most 50 values per frame, hence 100 registers;
  a setting frame takes up to 60 values. The DSP module''s own line is fixed at 19200.'
- 'Identification: the protocol version in hundreds, the address range and three settings that are exactly 0.0 or 1.0 as
  floats. A monitor and a DSP module are told apart nowhere; 0x1000 is the DSP module''s block, and 0x1200 onward (monitor)
  isn''t checked.'
- 'Left out: waveforms (0x0500–0x07C0, one byte per point), histograms (0x0B00–0x0C40), phase angle offsets (0x2500–0x250C),
  harmonic compensation degrees 2–50 (0x2A00–0x2A60), calibration values (0x2C00–0x2C18) and the fault record at 0xF000,
  whose layout the protocol doesn''t give.'
