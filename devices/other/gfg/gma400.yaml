# Written from the GfG GMA400 MT6/16 Modbus implementation appendix (236-000.36, version 2, 2025-01-21).

modbusspec: 0
id: gfg-gma400
manufacturer: GfG
name: GMA400 gas warning controller (MT6, MT16, MW16)
kind: other

sources:
- title: Appendix to the operation manual – GMA400 MT6/16 Modbus implementation (236-000.36)
  version: 2 (2025-01-21)
  url: https://www.gfgsafety.com/fileadmin/templates/img/GfG-Branches/GfG-USA/Manuals/Fixed/236-000.36_2025-01-21_AOM_GMA400-Modbus_EN_v02.pdf
  sha256: b0bcb8401ebd80c41feca57646a68ac56856b08b01dd522a6da0e09319af7e8c

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8E1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 33
    type: str
    length: 20
  any:
  - table: input
    address: 1
    type: u16
    equals: 30
  - table: input
    address: 1
    type: u16
    equals: 31
  - table: input
    address: 1
    type: u16
    equals: 32

models:
  - {id: mt16, name: GMA400-MT16, match: {table: input, address: 1, type: u16, equals: 30}}
  - {id: mt6, name: GMA400-MT6, match: {table: input, address: 1, type: u16, equals: 31}}
  - {id: mw16, name: GMA400-MW16, match: {table: input, address: 1, type: u16, equals: 32}}

points:
  # Administrative data
  - {key: x.gma_type, label: GMA type, table: input, address: 1, type: u16, bits: [0, 7], enum: gma_type, poll: slow}
  - {key: x.structure_version, label: GMA type (structure version), table: input, address: 1, type: u16, bits: [8, 15], poll: slow, note: Currently 0.}
  - {key: x.connection_id, label: Connection ID, table: input, address: 2, type: u16, bits: [0, 7], enum: connection_id, poll: slow}
  - {key: x.gma_status, label: GMA status, table: input, address: 3, type: u16, bits: [0, 7], flags: gma_status, poll: fast}
  - {key: x.config_change_counter, label: GMA status (configuration change counter), table: input, address: 3, type: u16, bits: [8, 15], poll: fast, note: Counts up with each configuration change; reread the slowly polled values when it changes.}
  - {key: x.digital_inputs, label: Digital entrances, table: input, address: 4, type: u16, flags: digital_inputs, poll: fast}
  - {key: x.fw_main1_major, label: FW Version Main 1 (main version), table: input, address: 5, type: u16, bits: [0, 7], poll: slow}
  - {key: x.fw_main1_patch, label: FW Version Main 1 (patch version), table: input, address: 6, type: u16, bits: [0, 7], poll: slow}
  - {key: x.fw_main1_minor, label: FW Version Main 1 (sub version), table: input, address: 6, type: u16, bits: [8, 15], poll: slow}
  - {key: x.fw_display_major, label: FW Version Display (main version), table: input, address: 9, type: u16, bits: [0, 7], poll: slow}
  - {key: x.fw_display_patch, label: FW Version Display (patch version), table: input, address: 10, type: u16, bits: [0, 7], poll: slow}
  - {key: x.fw_display_minor, label: FW Version Display (sub version), table: input, address: 10, type: u16, bits: [8, 15], poll: slow}
  - {key: serial, label: Serial number, table: input, address: 33, type: str, length: 20, poll: slow, note: '10 characters UTF-8, zero-terminated when shorter (up to 40 bytes).'}
  - {key: x.designation, label: GMA designation, table: input, address: 81, type: str, length: 40, poll: slow, note: 20 characters UTF-8 (up to 80 bytes).}

  # Alarm acknowledgment (write only)
  - {key: x.acknowledge_all, label: Global alarm acknowledgment, table: holding, address: 2561, type: u16, writable: true, write_only: true, write_multiple: true, note: Function 16 or 23. Bit 0 = 1 acknowledges the alarms of all measuring points. The document only lists function 04 for reading; the table for writes is taken as holding.}

