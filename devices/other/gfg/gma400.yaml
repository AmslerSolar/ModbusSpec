  - {key: x.group1_gas, label: Group 1 gas, table: input, address: 4100, type: u16, bits: [0, 7], poll: slow, note: Gas code from the document's table 5.2.}
  - {key: x.group1_unit, label: Group 1 unit, table: input, address: 4100, type: u16, bits: [8, 15], enum: unit, poll: slow}
