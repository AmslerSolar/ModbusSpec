notes:
- Registers are read with function 04 (input registers); writes use function 16 or 23. Addresses are 0-based as given. Each
  block starts with a signature register (0x0000, 0x0020, 0x0050, 0x0100 …) that counts down after each read; it can be written
  with function 23 to match requests and responses, and is left out here.
- 'Modbus TCP: port 502 by default (the document prints 02), unit id fixed to 1. Modbus RTU (COM-Bus and GMA-Bus): address
  1…247, 9600…230400 Bd, 8E1, 8O1 or 8N2 set in the configuration program; no default is stated, 9600 8E1 here is an assumption.
  The GMA-Bus doesn''t carry the relay, horn and digital input designations.'
- The GMA type register (0x0001) carries the structure version in its high byte (currently 0); the model matches assume it
  is 0.
- 'Measured values: the document only gives the raw range 0…10000. Each group (0x1000 block) has a scaling factor (decimal
  exponent) and a unit/gas code; the measuring point''s group is set in its assignment register (0x0101 + n − 1, bits 0…4;
  zone bits 8…11; bit 15 active). The value presumably is raw × 10^(group scaling factor) in the group''s unit; not stated
  in the document, not verified.'
- 'Only measuring points 1…16 (block 0x3000) are listed. Further blocks of 16 points start at 0x3500, 0x3A00, 0x3F00, 0x4400,
  0x4900, 0x4E00, 0x5300, 0x5800 and 0x5D00 (up to 160 points), same layout: status #1, status #2 and value per point from
  offset 1, mean value 1 at offset 0x31…0x40, mean value 2 at 0x41…0x50.'
- 'Left out: group alarm thresholds AL1…AL4, measuring ranges and averaging intervals (0x1000 block, per group offsets 1…13),
  designation texts of groups, zones, measuring points, inputs, relays and modules (UTF-8, from 0x1100), the per-point acknowledgment
  registers 0x0A11…0x0A1A (one bit per point), the relay modules (0xA003…0xA012), display modules (0xA021…0xA030) and alarm
  panels (from 0xA041), and the gas code table (186 entries).'
- 'Group register offsets: groups 1…8 at 0x1001 + 13 × (n − 1), groups 9…16 at 0x1081 + 13 × (n − 9); within a group: MRB,
  MRE, scaling factor, unit/gas, alarm directions, AL1…AL4, unassigned, interval 1, interval 2, unassigned.'
- 'Identification: one of the model matches must hold.'
