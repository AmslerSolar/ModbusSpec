notes:
- 'Addresses: the document lists register numbers (1, 12, 110, 3000 …) without saying whether they are 0- or 1-based; they
  are taken as the protocol addresses sent in the request. Unverified (all points are verified: false for this reason).'
- Only function 03 (read holding registers) and 16 (write multiple registers) are supported; at most 100 registers per request.
  The panel answers 50 … 400 ms after a request.
- RS485, 9600 baud, 8 data bits, no parity, 2 stop bits. The unit address is set with the VortexPC software; no default is
  stated, 1 is assumed. The TCP port is the usual default for a gateway.
- Booleans read 0x0000 (false) and 0xFFFF (true); any non-zero value counts as true.
- Each of the 12 detector inputs has a configuration block every 20 registers from 110 and a live block every 10 registers
  from 3000. Inputs that are not configured or not enabled carry no valid data.
- Detector level and alarm levels are per mille of the detector's full scale (set by units and range); this file gives them
  in % of full scale. For gas detectors each alarm can trip rising or falling; for fire detectors alarm 1 is the open-circuit
  level, 2 the fire alarm level, 3 the short-circuit level.
- 'Left out: Accept / Reset (write-only, register 9), the alarm 1–3 levels and directions (configuration offsets 4 … 9), the
  serial number (33), the system name (34) and the per-detector inhibit (write-only, live block offset 4; inhibits are not
  kept over a power cycle).'
- 'The document gives the serial number at register 33 and the system name at 34, each 8 registers (16 characters), and the
  next value at 39: the two overlap each other and the registers after them, so at least one number or length is wrong. Both
  are left out, and the panel is identified by its unit type text only.'
- Strings are null padded, two characters per register, high byte first.
