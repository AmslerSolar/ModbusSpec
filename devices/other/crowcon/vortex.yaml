modbusspec: 0
id: crowcon-vortex
manufacturer: Crowcon
name: Vortex gas and fire detection control panel
kind: other

sources:
- title: Vortex OEM MODBUS Specification (GC012)
  version: Issue 2, 2001-01-29
  url: https://www.crowcon.com/wp-content/uploads/2024/08/Vortex-Modbus-Map.pdf
  sha256: 193d0871570af6803bd83eba51d249713016f690a31ef8b08323d3ad4e8c20a1
  archive_url: https://web.archive.org/web/20250904131927/https://www.crowcon.com/wp-content/uploads/2024/08/Vortex-Modbus-Map.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N2
  limits:
    max_registers: 100
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 1
    type: str
    length: 8
    prefix: Vortex

defaults:
  verified: false

points:
  # System
  - {key: x.unit_type, label: Unit Type, table: holding, address: 1, type: str, length: 8, poll: slow, note: '16 characters, null padded; typically "Vortex".'}
  - {key: x.system_status, label: System Status, table: holding, address: 12, type: u16, flags: system_status, poll: fast}
  - {key: x.power_status, label: Power Status, table: holding, address: 13, type: u16, enum: power_status, poll: fast}
  - {key: x.system_fault_inhibit, label: System Fault Inhibit, table: holding, address: 17, type: u16, enum: inhibit, writable: true, poll: slow, note: Keeps system faults from the relay outputs (for maintenance); the front panel shows no warning.}
  - {key: x.system_sounder_inhibit, label: System Sounder Inhibit, table: holding, address: 18, type: u16, enum: inhibit, writable: true, poll: slow, note: Keeps sounder events from the relay outputs; the front panel shows no warning.}
  - {key: x.detector_inputs, label: Number of installed Detector Inputs, table: holding, address: 39, type: u16, poll: slow, note: 1 … 12.}
  - {key: x.digital_outputs, label: Number of installed Digital Outputs, table: holding, address: 40, type: u16, poll: slow, note: 1 … 32.}

  # Detector 1
  - {key: x.detector_1_level, label: Detector 1 Level, table: holding, address: 3000, type: s16, unit: '%', scale: 0.1, poll: fast, note: Per mille of full scale (−100 … 1000 = −10 … 100 %); for fire detectors 1000 = 60 mA.}
  - {key: x.detector_1_status, label: Detector 1 Status, table: holding, address: 3001, type: u16, flags: detector_status, poll: fast}
  - {key: x.detector_1_enable, label: Detector 1 Enable, table: holding, address: 110, type: u16, enum: enable, poll: slow}
  - {key: x.detector_1_type, label: Detector 1 Type, table: holding, address: 111, type: u16, enum: detector_type, poll: slow}
  - {key: x.detector_1_units, label: Detector 1 Units, table: holding, address: 122, type: u16, enum: units, poll: slow}
  - {key: x.detector_1_range, label: Detector 1 Range, table: holding, address: 123, type: u16, enum: range, poll: slow}
