enums:
  power_status: {'0': OK, '1': 'Main supply OK, battery low', '2': 'Main supply fail, battery good', '3': 'Main supply OK, battery disconnected', '4': 'Main supply fail, battery low', '5': No comms to power card}
  inhibit: {'0': Not inhibited, '65535': Inhibited}
  enable: {'0': Disabled, '65535': Enabled}
  detector_type: {'0': Not configured, '6': Gas, '8': Fire}
  units: {'0': '% LEL', '1': '% VOL', '2': ppm, '3': Fire}
  range: {'9': 0 to 1, '10': 0 to 2, '11': 0 to 2.5, '12': 0 to 5, '13': 0 to 10, '14': 0 to 20, '15': 0 to 25, '16': 0 to 50, '17': 0 to 100, '18': 0 to 200, '19': 0 to 250, '20': 0 to 500, '21': '0 to 1,000', '22': '0 to 2,000', '23': '0 to 2,500', '24': '0 to 5,000', '25': '0 to 10,000'}

flags:
  system_status: {'0': Channel test, '1': Jump hold, '2': System fault, '3': 'Fault: battery', '4': 'Fault: FRAM data integrity', '5': 'Fault: internal I2C bus', '6': 'Fault: display access', '7': 'Fault: power monitor access', '8': 'Fault: external I2C bus', '9': 'Fault: relay board'}
  detector_status: {'0': Alarm level 1, '1': Alarm level 2, '2': Alarm level 3, '3': Level read as inhibit, '4': Level read as low info, '5': Level read as high info, '6': Low end fault, '7': High end fault, '8': Detector I2C fault, '9': Detector inhibited from controller}

problems:
  - {when: {key: x.system_status, bit: 2}, kind: fault, text: System fault (bit 2)}
  - {when: {key: x.power_status, in: [1, 3]}, kind: warning, text: 'Power: {text}'}
  - {when: {key: x.power_status, in: [2, 4]}, kind: mains_lost, text: 'Power: {text}'}
  - {when: {key: x.power_status, equals: 5}, kind: fault, text: 'Power: {text}'}
  - {when: {key: x.detector_1_status, bit: 0}, kind: warning, text: 'Detector 1: alarm level 1 (bit 0)'}
