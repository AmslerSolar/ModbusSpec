# Written from the EL.CO. ELK22S / ELK22MS communication protocol user's guide (version 02, 2021-07-21).

modbusspec: 0
id: elco-elk22
manufacturer: EL.CO.
name: ELK22S / ELK22MS temperature controllers
kind: other

sources:
- title: ELK22S / ELK22MS Communication protocol, user's guide (ELK22xS.ManualeProtocollo.ENG)
  version: 02 (2021-07-21)
  url: https://www.elco-italy.com/wp-content/uploads/2024/03/MODBUS_-ELK22xS-GB-02-06-A-1.pdf
  sha256: fc1775f60af2b81c76d006bcc90924be81ae3cdf618f5dadbb0f6f7e3e9f44a4

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 28
    min_interval_ms: 1000

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: elk22s, name: ELK22S}
  - {id: elk22ms, name: ELK22MS}

points:
  - {key: x.process_value, label: Measure read on input, table: holding, address: 512, type: s16, unit: °C, verified: false, note: 'The document gives neither type nor scaling. Shown with the number of decimals set in DP (address 2: 0 or 1); with DP = 1 the raw value is presumably tenths. Unit °C or °F by UNIT (address 5); °C assumed.'}
  - {key: x.setpoint, label: Setpoint 1, table: holding, address: 0, type: s16, unit: °C, writable: true, verified: false, note: Limited to SSP … FSP. Same decimals and unit as the measure (assumed).}
  - {key: x.input_type, label: Input type, table: holding, address: 1, type: u16, enum: input_type_elk22s, models: [elk22s], writable: true, poll: slow}
  - {key: x.input_type, label: Input type, table: holding, address: 1, type: u16, enum: input_type_elk22ms, models: [elk22ms], writable: true, poll: slow}
  - {key: x.decimals, label: Number of decimals, table: holding, address: 2, type: u16, writable: true, min: 0, max: 1, poll: slow}
  - {key: x.display_min, label: Minimum visualization, table: holding, address: 3, type: s16, writable: true, min: -999, max: 1000, poll: slow}
  - {key: x.display_max, label: Maximum visualization, table: holding, address: 4, type: s16, writable: true, min: -999, max: 1000, poll: slow}
  - {key: x.unit, label: Measure unit, table: holding, address: 5, type: u16, writable: true, poll: slow, verified: false, note: °C or °F; the document doesn't give the raw values.}
  - {key: x.offset, label: Measure offset, table: holding, address: 6, type: s16, writable: true, min: -100, max: 100, poll: slow}
  - {key: x.control_type, label: Type of regulation, table: holding, address: 8, type: u16, enum: control_type, writable: true, poll: slow}
  - {key: x.autotuning, label: Enabling autotuning, table: holding, address: 9, type: u16, enum: autotuning, writable: true, poll: slow}
  - {key: x.proportional_band, label: Proportional band, table: holding, address: 10, type: u16, writable: true, min: 1, max: 1000, poll: slow}
  - {key: x.integral_time, label: Integral time, table: holding, address: 11, type: u16, writable: true, min: 0, max: 1000, poll: slow}
  - {key: x.derivative_time, label: Derivative time, table: holding, address: 12, type: u16, writable: true, min: 0, max: 1000, poll: slow}
  - {key: x.cycle_time, label: Time period out, table: holding, address: 13, type: u16, writable: true, min: 50, max: 200, poll: slow}
  - {key: x.hysteresis_positive, label: Positive hysteresis, table: holding, address: 14, type: u16, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.hysteresis_negative, label: Negative hysteresis, table: holding, address: 15, type: u16, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.setpoint_min, label: Minimum setpoint, table: holding, address: 16, type: s16, writable: true, poll: slow}
  - {key: x.setpoint_max, label: Maximum setpoint, table: holding, address: 17, type: s16, writable: true, poll: slow}
  - {key: x.out1_function, label: Function mode out 1, table: holding, address: 18, type: u16, enum: out1_function, writable: true, poll: slow}
  - {key: x.out2_function, label: Function mode out 2, table: holding, address: 19, type: u16, enum: out2_function, writable: true, poll: slow}
  - {key: x.alarm1_function, label: Function mode alarm 1, table: holding, address: 20, type: u16, enum: alarm_function, writable: true, poll: slow}
  - {key: x.alarm1_setpoint, label: Alarm setpoint, table: holding, address: 21, type: s16, writable: true, poll: slow}
  - {key: x.alarm1_hysteresis, label: Hysteresis alarm 1, table: holding, address: 22, type: u16, writable: true, min: 0, max: 100, poll: slow}
  - {key: x.alarm1_delay, label: Delay alarm 1, table: holding, address: 23, type: u16, writable: true, min: 0, max: 1000, poll: slow}
  - {key: x.module_address, label: Module address, table: holding, address: 24, type: u16, models: [elk22ms], writable: true, min: 1, max: 16, poll: slow}
  - {key: x.node_address, label: Modbus address, table: holding, address: 25, type: u16, models: [elk22ms], writable: true, min: 1, max: 250, poll: slow}
  - {key: x.node_address, label: Modbus address, table: holding, address: 24, type: u16, models: [elk22s], writable: true, min: 1, max: 250, poll: slow}
  - {key: x.baud_rate, label: Modbus baud, table: holding, address: 26, type: u16, enum: baud_rate, models: [elk22ms], writable: true, poll: slow}
  - {key: x.baud_rate, label: Modbus baud, table: holding, address: 25, type: u16, enum: baud_rate, models: [elk22s], writable: true, poll: slow}
  - {key: firmware, label: Firmware revision, table: holding, address: 28, type: u16, models: [elk22ms], poll: slow}
  - {key: firmware, label: Firmware revision, table: holding, address: 27, type: u16, models: [elk22s], poll: slow}

enums:
  input_type_elk22s: {'1': TC J, '2': TC K, '3': NTC, '4': PTC, '5': PT100}
  input_type_elk22ms: {'1': TC J, '2': TC K, '3': TC S, '4': NTC, '7': 0-10 V}
  control_type: {'0': PID, '1': ON/OFF, '2': Neutral zone}
  autotuning: {'0': 'Off', '1': Start at every power-up, '2': Start at next power-up, '3': Manual start}
  out1_function: {'0': Not used, '1': Heating, '2': Cooling, '3': Always on}
  out2_function: {'0': Not used, '1': Heating, '2': Cooling, '3': Alarm, '4': Always on}
  alarm_function: {'0': Not used, '1': Minimum, '2': Maximum}
  baud_rate: {'0': '1200', '1': '2400', '2': '9600', '3': '19200', '4': '38400'}

notes:
- Addresses are the document's decimal addresses, read with function 03 and written one at a time with function 06; at most
  28 registers per read, and at most one request per second.
- 'The two models can''t be told apart over Modbus: the user picks one. From address 24 on the ELK22S lacks the module address,
  so its Modbus address, baud rate, menu password and firmware revision sit one lower (24–27) than on the ELK22MS (25–28).'
- 'ELK22MS input types: the document''s list is garbled for PTC / PT100 (both numbered 6) and 4-20 mA (0 or 8); those are
  left out of the table.'
- 'Setting the top bit of a parameter word hides it from the user menu (password menu only). Left out: the menu password (writing
  9999 resets to factory defaults), the display refresh time, the output status (function 01) and the alarm status (function
  07), which the document describes without register numbers.'
- 'Settings-dependent decimals and °C/°F can''t be expressed: the measure, setpoints and alarm setpoint are given unscaled
  in °C (assumed).'
