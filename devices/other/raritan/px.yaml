notes:
- Covers Raritan intelligent PDUs (PX2, PX3, PXC, PXE), PX3TS transfer switches and the Legrand and Servertech PRO3X PDUs
  built on the same platform. The BCM2 / PMC branch circuit monitors offer only the basic parameters and peripheral sensors
  at their main controller unit id.
- 'Modbus/TCP only; the service is off until enabled in the device''s network services settings. The document gives neither
  a unit id nor request size limits: unit 1 is assumed. There is no identity register: identity is only available through
  Read Device Identification (function 2Bh), which this format can''t express, so the file has no `identify`.'
- 'Addresses in the document are already 0-based protocol addresses (written in hex) and taken as they are. All values are
  holding registers (function 03), plus coils for overcurrent protector trips (0000h ff.) and outlet relays (0100h ff.). Multi-register
  values are big-endian: Word = u16, DWord = u32, QWord = u64 (unsigned), Float = f32.'
- 'The map is built of repeating blocks: up to 16 inlets (3000h + i × 100h), 64 overcurrent protectors (4000h + i × 100h)
  and 128 outlets (8000h + i × 100h), each with up to 4 pole blocks at offsets 40h, 70h, A0h and D0h holding per-phase values;
  32 peripheral sensors (0800h + i × 10h); transfer switches at 2000h (+ i × 100h in the 3.5.x editions, up to 16). Which
  blocks exist is given by the counts at 0001h–0004h and each block''s capabilities word.'
- 'Listed here: inlet 1 with its poles, inlet 2''s main values, transfer switch 1, overcurrent protector 1, outlet 1 and sensors
  1–4; the others follow the same layouts. Left out: peak currents, per-pole apparent / reactive / phase-angle values, outlet
  and protector ratings and status words, the sensor actuator register (offset 04h), the transfer switch voltage and frequency
  thresholds (2022h–203Dh) and the write-only transfer command (2003h).'
- 'Edition differences: the surge protector status (inlet 30h) is in every edition from 3.2.1 on. The 3.2.x editions have
  no residual current registers; the 3.2.x and 3.5.x editions lack the door sensor types (17–19) and the numeric-sensor threshold
  states; the per-value status words (inlet 3Ah–3Eh, protector 3Ah, outlet 3Ah–3Dh, pole 02h–05h) and the phase sync angle
  status (200Ah) first appear in 3.6.10; residual AC current (inlet 36h, pole 10h) and the pole peak current (pole 0Ch) from
  3.6.30 on; the protector residual current block (capabilities 2 at 01h, status 31h, readings 32h–37h, status 5 at 3Eh) from
  3.6.60 on. The 4.x (Xerus) editions add displacement power factor (06h), crest factor (07h), peak current (0Ch), voltage
  / current THD (38h / 39h) and status 6 (3Fh) to inlets and outlets, inrush current (0Eh) to outlets, and name the pole voltage
  at 08h line-to-line with the line-to-neutral voltage at 0Eh; they rename the ''+12 V power supply fault'' (2005h / 2006h
  bit 0) to ''power supply fault''; 4.2.10 adds the sensor battery voltage (sensor offset 05h), 4.3.14 the PX4TS install fault
  bit (2004h bit 2). Reserved registers usually read 0, so status-based problems simply don''t fire on older firmware.'
- 'From 4.1.1 on the document states that reading outside a defined block gives an Illegal Data Address exception (code 2),
  and so does an undefined coil; single reserved registers inside a block read 0. It also gives the basic parameter block
  as 0000h–0004h (3.x: 0000h–0010h).'
- 'The document doesn''t state the sign of active power; positive = power drawn through the PDU is assumed (verified: false).'
