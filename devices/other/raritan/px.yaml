connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

points:
  # Basic parameters (0000h)
  - {key: x.register_set_version, label: Register set version, table: holding, address: 0, type: u16, poll: slow, note: 'High byte major, low byte minor.'}
  - {key: x.inlet_count, label: Number of inlets, table: holding, address: 1, type: u16, poll: slow}
  - {key: x.ocp_count, label: Number of overcurrent protectors, table: holding, address: 2, type: u16, poll: slow}
  - {key: x.outlet_count, label: Number of outlets, table: holding, address: 3, type: u16, poll: slow}
  - {key: x.transfer_switch_count, label: Number of transfer switches, table: holding, address: 4, type: u16, poll: slow}

  # Inlet 1 (block 3000h); inlet-wide values
  - {key: x.inlet1_capabilities, label: Inlet 1 capabilities, table: holding, address: 12288, type: u16, flags: inlet_capabilities, poll: slow}
  - {key: x.inlet1_capabilities_2, label: Inlet 1 capabilities (continued), table: holding, address: 12289, type: u16, flags: inlet_capabilities_2, poll: slow}
  - {key: x.inlet1_poles, label: Number of inlet 1 poles, table: holding, address: 12290, type: u16, poll: slow}
  - {key: x.inlet1_min_voltage_rating, label: Inlet 1 minimum voltage rating, table: holding, address: 12291, type: u16, unit: V, poll: slow}
  - {key: x.inlet1_max_voltage_rating, label: Inlet 1 maximum voltage rating, table: holding, address: 12292, type: u16, unit: V, poll: slow}
  - {key: x.inlet1_current_rating, label: Inlet 1 current rating, table: holding, address: 12293, type: u16, unit: A, poll: slow}
  - {key: x.inlet1_displacement_pf, label: Inlet 1 displacement power factor, table: holding, address: 12294, type: u16, scale: 0.01, optional: true, note: '4.1.1 and later (capabilities 2, bit 4); reserved (0) before.'}
  - {key: x.inlet1_crest_factor, label: Inlet 1 crest factor, table: holding, address: 12295, type: u16, scale: 0.01, optional: true, note: '4.1.1 and later (capabilities 2, bit 5).'}
  - {key: x.inlet1_voltage, label: Inlet 1 RMS voltage, table: holding, address: 12296, type: f32, unit: V, note: 'Three-phase inlet: the lowest of the line-to-line voltages.'}
  - {key: x.inlet1_current, label: Inlet 1 RMS current, table: holding, address: 12298, type: f32, unit: A, note: 'Three-phase inlet: the highest phase current.'}
  - {key: x.inlet1_peak_current, label: Inlet 1 peak current, table: holding, address: 12300, type: f32, unit: A, optional: true, note: Listed from 4.1.1 on (capability bit 2); reserved in the 3.x tables.}
  - {key: x.inlet1_unbalanced_current, label: Inlet 1 unbalanced current, table: holding, address: 12304, type: f32, unit: '%'}
  - {key: consumer_power, label: Inlet 1 active power, table: holding, address: 12306, type: f32, unit: W, positive: consumption, verified: false, note: 'Three-phase inlet: the sum of all phases. The sign is not stated in the document; positive = power drawn by the PDU assumed.'}
  - {key: apparent_power, label: Inlet 1 apparent power, table: holding, address: 12308, type: f32, unit: VA}
  - {key: power_factor, label: Inlet 1 power factor, table: holding, address: 12310, type: f32}
  - {key: consumer_energy, label: Inlet 1 active energy, table: holding, address: 12312, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Counted in Wh.}
  - {key: x.inlet1_apparent_energy, label: Inlet 1 apparent energy, table: holding, address: 12316, type: u64, unit: kVAh, scale: 0.001, poll: slow, note: Counted in VAh.}
  - {key: x.inlet1_phase_angle, label: Inlet 1 phase angle between voltage and current, table: holding, address: 12320, type: f32, unit: °}
  - {key: frequency, label: Inlet 1 line frequency, table: holding, address: 12322, type: f32, unit: Hz}
  - {key: reactive_power, label: Inlet 1 reactive power, table: holding, address: 12324, type: f32, unit: var}
  - {key: x.inlet1_reactive_energy, label: Inlet 1 reactive energy, table: holding, address: 12326, type: u64, unit: kvarh, scale: 0.001, poll: slow, note: Counted in varh.}
  - {key: x.inlet1_power_quality, label: Inlet 1 power quality, table: holding, address: 12330, type: u16, enum: power_quality}
  - {key: x.inlet1_surge_protector, label: Inlet 1 surge protector status, table: holding, address: 12336, type: u16, enum: surge_status, note: Capability bit 15; in every edition from 3.2.1 on.}
  - {key: x.inlet1_residual_current_status, label: Inlet 1 residual current status, table: holding, address: 12337, type: u16, enum: residual_status, note: 'Only on inlets with residual current monitoring (capabilities 2, bit 0).'}
  - {key: x.inlet1_residual_current, label: Inlet 1 residual current, table: holding, address: 12338, type: f32, unit: A, optional: true}
  - {key: x.inlet1_residual_dc_current, label: Inlet 1 residual DC current, table: holding, address: 12340, type: f32, unit: A, optional: true}
  - {key: x.inlet1_residual_ac_current, label: Inlet 1 residual AC current, table: holding, address: 12342, type: f32, unit: A, optional: true, note: 3.6.30 and later.}
  - {key: x.inlet1_voltage_thd, label: Inlet 1 voltage total harmonic distortion, table: holding, address: 12344, type: u16, unit: '%', scale: 0.1, optional: true, note: '4.1.1 and later (capabilities 2, bit 6).'}
  - {key: x.inlet1_current_thd, label: Inlet 1 current total harmonic distortion, table: holding, address: 12345, type: u16, unit: '%', scale: 0.1, optional: true, note: '4.1.1 and later (capabilities 2, bit 7).'}
  # Inlet 1 threshold states: one 4-bit sensor state per value (3.6.10 and later)
  - {key: x.inlet1_status_1, label: Inlet 1 status 1, table: holding, address: 12346, type: u16, poll: slow, note: Raw word; the sensor states are split out below. Not in editions before 3.6.10.}
  - {key: x.inlet1_voltage_state, label: Inlet 1 RMS voltage state, table: holding, address: 12346, type: u16, bits: [0, 3], enum: sensor_state}
  - {key: x.inlet1_current_state, label: Inlet 1 RMS current state, table: holding, address: 12346, type: u16, bits: [4, 7], enum: sensor_state}
  - {key: x.inlet1_power_state, label: Inlet 1 active power state, table: holding, address: 12347, type: u16, bits: [4, 7], enum: sensor_state}
  - {key: x.inlet1_frequency_state, label: Inlet 1 line frequency state, table: holding, address: 12348, type: u16, bits: [12, 15], enum: sensor_state}
  - {key: x.inlet1_residual_current_state, label: Inlet 1 residual current state, table: holding, address: 12350, type: u16, bits: [0, 3], enum: sensor_state}
  - {key: x.inlet1_status_6, label: Inlet 1 status 6, table: holding, address: 12351, type: u16, poll: slow, note: '4.1.1 and later: states of displacement power factor (bits 0–3), crest factor (4–7), voltage THD (8–11) and current THD (12–15).'}
  - {key: x.inlet1_voltage_thd_state, label: Inlet 1 voltage THD state, table: holding, address: 12351, type: u16, bits: [8, 11], enum: sensor_state}
  - {key: x.inlet1_current_thd_state, label: Inlet 1 current THD state, table: holding, address: 12351, type: u16, bits: [12, 15], enum: sensor_state}

  # Inlet 1 poles (3040h, 3070h, 30A0h): per-phase values of a multi-phase inlet
  - {key: x.inlet1_pole1_voltage, label: Inlet 1 pole 1 RMS voltage, table: holding, address: 12360, type: f32, unit: V, note: Line-to-line voltage (named so from 4.1.1 on; the 3.x editions just say RMS voltage). The line-to-neutral voltage is at pole offset 0Eh.}
  - {key: x.inlet1_pole1_ln_voltage, label: Inlet 1 pole 1 RMS L-N voltage, table: holding, address: 12366, type: f32, unit: V, optional: true, note: 4.1.1 and later (pole capability bit 3); reserved (0) before.}
  - {key: l1_current, label: Inlet 1 pole 1 RMS current, table: holding, address: 12362, type: f32, unit: A}
  - {key: l1_power, label: Inlet 1 pole 1 active power, table: holding, address: 12370, type: f32, unit: W, positive: consumption, verified: false, note: Sign not stated; assumed like the inlet power.}
  - {key: x.inlet1_pole1_energy, label: Inlet 1 pole 1 active energy, table: holding, address: 12376, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.inlet1_pole2_voltage, label: Inlet 1 pole 2 RMS voltage, table: holding, address: 12408, type: f32, unit: V}
  - {key: x.inlet1_pole2_ln_voltage, label: Inlet 1 pole 2 RMS L-N voltage, table: holding, address: 12414, type: f32, unit: V, optional: true}
  - {key: l2_current, label: Inlet 1 pole 2 RMS current, table: holding, address: 12410, type: f32, unit: A}
  - {key: l2_power, label: Inlet 1 pole 2 active power, table: holding, address: 12418, type: f32, unit: W, positive: consumption, verified: false, note: Sign not stated; assumed like the inlet power.}
  - {key: x.inlet1_pole2_energy, label: Inlet 1 pole 2 active energy, table: holding, address: 12424, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.inlet1_pole3_voltage, label: Inlet 1 pole 3 RMS voltage, table: holding, address: 12456, type: f32, unit: V}
  - {key: x.inlet1_pole3_ln_voltage, label: Inlet 1 pole 3 RMS L-N voltage, table: holding, address: 12462, type: f32, unit: V, optional: true}
  - {key: l3_current, label: Inlet 1 pole 3 RMS current, table: holding, address: 12458, type: f32, unit: A}
  - {key: l3_power, label: Inlet 1 pole 3 active power, table: holding, address: 12466, type: f32, unit: W, positive: consumption, verified: false, note: Sign not stated; assumed like the inlet power.}
  - {key: x.inlet1_pole3_energy, label: Inlet 1 pole 3 active energy, table: holding, address: 12472, type: u64, unit: kWh, scale: 0.001, poll: slow}

  # Inlet 2 (block 3100h), e.g. the second inlet of a PX3TS transfer switch
  - {key: x.inlet2_voltage, label: Inlet 2 RMS voltage, table: holding, address: 12552, type: f32, unit: V, optional: true, note: Only on devices with two inlets (register 0001h).}
  - {key: x.inlet2_current, label: Inlet 2 RMS current, table: holding, address: 12554, type: f32, unit: A, optional: true}
  - {key: x.inlet2_power, label: Inlet 2 active power, table: holding, address: 12562, type: f32, unit: W, optional: true}
  - {key: x.inlet2_energy, label: Inlet 2 active energy, table: holding, address: 12568, type: u64, unit: kWh, scale: 0.001, optional: true, poll: slow}
  - {key: x.inlet2_frequency, label: Inlet 2 line frequency, table: holding, address: 12578, type: f32, unit: Hz, optional: true}

  # Transfer switch 1 (block 2000h, PX3TS only)
  - {key: x.ts_active_inlet, label: Active inlet, table: holding, address: 8193, type: u16, enum: active_inlet, optional: true, note: PX3TS only (register 0004h > 0).}
  - {key: x.ts_preferred_inlet, label: Preferred inlet, table: holding, address: 8194, type: u16, optional: true, poll: slow}
  - {key: x.ts_fault_flags, label: Transfer switch fault flags, table: holding, address: 8196, type: u16, flags: ts_faults, optional: true}
  - {key: x.ts_inlet1_fault_flags, label: Inlet 1 fault flags, table: holding, address: 8197, type: u16, flags: ts_inlet_faults, optional: true}
  - {key: x.ts_inlet2_fault_flags, label: Inlet 2 fault flags, table: holding, address: 8198, type: u16, flags: ts_inlet_faults, optional: true}
  - {key: x.ts_phase_sync_angle, label: Inlet phase sync angle, table: holding, address: 8200, type: f32, unit: °, optional: true}
  - {key: x.ts_settings, label: Transfer settings, table: holding, address: 8224, type: u16, flags: ts_settings, optional: true, writable: true, poll: slow}
  - {key: x.ts_retransfer_wait, label: Automatic retransfer wait time, table: holding, address: 8225, type: u16, unit: s, optional: true, writable: true, poll: slow}

  # Overcurrent protector 1 (block 4000h) and its trip coil
  - {key: x.ocp1_current, label: Overcurrent protector 1 RMS current, table: holding, address: 16394, type: f32, unit: A, optional: true, note: Only on PDUs with overcurrent protectors (register 0002h); protector n at 4000h + (n−1) × 100h.}
  - {key: x.ocp1_residual_current_status, label: Overcurrent protector 1 residual current status, table: holding, address: 16433, type: u16, enum: residual_status, optional: true, note: 3.6.60 and later; only on protectors with residual current monitoring (capabilities 2 at 4001h).}
  - {key: x.ocp1_residual_current, label: Overcurrent protector 1 residual current, table: holding, address: 16434, type: f32, unit: A, optional: true}
  - {key: x.ocp1_closed, label: Overcurrent protector 1 status, table: coil, address: 0, type: bool, optional: true, note: '1 = closed (good), 0 = tripped. Protector n at coil n−1. No problem rule: on PDUs without protectors the coil may read 0.'}

  # Outlet 1 (block 8000h) and its relay coil
  - {key: x.outlet1_current, label: Outlet 1 RMS current, table: holding, address: 32778, type: f32, unit: A, optional: true, note: 'Only on metered-outlet models; outlet n at 8000h + (n−1) × 100h, same layout as the inlet.'}
  - {key: x.outlet1_peak_current, label: Outlet 1 peak current, table: holding, address: 32780, type: f32, unit: A, optional: true, note: 4.1.1 and later (outlet capability bit 2).}
  - {key: x.outlet1_inrush_current, label: Outlet 1 inrush current, table: holding, address: 32782, type: f32, unit: A, optional: true, note: 4.1.1 and later (outlet capability bit 3).}
  - {key: x.outlet1_power, label: Outlet 1 active power, table: holding, address: 32786, type: f32, unit: W, optional: true}
  - {key: x.outlet1_energy, label: Outlet 1 active energy, table: holding, address: 32792, type: u64, unit: kWh, scale: 0.001, optional: true, poll: slow}
  - {key: x.outlet1_on, label: Outlet 1 state, table: coil, address: 256, type: bool, optional: true, writable: true, note: Switched-outlet models only (outlet capabilities bit 15). 1 = on. Outlet n at coil 0100h + n − 1.}

  # Peripheral sensors 1–4 (block 0800h + i × 10h)
  - {key: x.sensor1_type, label: Peripheral sensor 1 type, table: holding, address: 2048, type: u16, enum: sensor_type, poll: slow, note: 'Sensor n at 0800h + (n−1) × 10h, up to 32.'}
  - {key: x.sensor1_state, label: Peripheral sensor 1 state, table: holding, address: 2049, type: u16, note: 'Numeric sensors: a threshold state (values as the sensor_state enum; the 3.5.x and 3.6.1 editions document it for discrete sensors only). Discrete sensors: the type''s own state (see the sensor_type enum), 0xFFFF = unavailable.'}
  - {key: x.sensor1_value, label: Peripheral sensor 1 reading, table: holding, address: 2050, type: f32, note: Numeric sensors only; the unit follows the sensor type.}
  - {key: x.sensor1_battery_voltage, label: Peripheral sensor 1 battery voltage, table: holding, address: 2053, type: u16, unit: V, scale: 0.001, optional: true, note: 'Zigbee sensors only, 0 otherwise; listed from 4.2.10 on.'}
  - {key: x.sensor2_type, label: Peripheral sensor 2 type, table: holding, address: 2064, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor2_state, label: Peripheral sensor 2 state, table: holding, address: 2065, type: u16}
  - {key: x.sensor2_value, label: Peripheral sensor 2 reading, table: holding, address: 2066, type: f32}
  - {key: x.sensor3_type, label: Peripheral sensor 3 type, table: holding, address: 2080, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor3_state, label: Peripheral sensor 3 state, table: holding, address: 2081, type: u16}
  - {key: x.sensor3_value, label: Peripheral sensor 3 reading, table: holding, address: 2082, type: f32}
  - {key: x.sensor4_type, label: Peripheral sensor 4 type, table: holding, address: 2096, type: u16, enum: sensor_type, poll: slow}
  - {key: x.sensor4_state, label: Peripheral sensor 4 state, table: holding, address: 2097, type: u16}
  - {key: x.sensor4_value, label: Peripheral sensor 4 reading, table: holding, address: 2098, type: f32}

enums:
  sensor_state: {'0': unavailable, '1': normal, '2': below lower critical threshold, '3': below lower warning threshold, '4': above upper warning threshold, '5': above upper critical threshold}
  power_quality: {'0': unknown, '1': normal, '2': warning, '3': critical}
  surge_status: {'0': OK, '1': alarm}
  residual_status: {'0': unknown, '1': normal, '2': warning, '3': critical, '4': self-test, '5': failure}
  active_inlet: {'0': no active inlet, '1': inlet 1, '2': inlet 2}
