  - {when: {key: x.err_tuning_heating, not: 0}, kind: warning, text: 'Self-tuning heating failed ({text})'}
  - {when: {key: x.err_tuning_cooling, not: 0}, kind: warning, text: 'Self-tuning cooling failed ({text})'}
  - {when: {key: x.err_limit1, in: [1, 2]}, kind: warning, text: 'Limit 1 exceeded ({text})'}
  - {when: {key: x.err_limit2, in: [1, 2]}, kind: warning, text: 'Limit 2 exceeded ({text})'}
  - {when: {key: x.err_limit3, in: [1, 2]}, kind: warning, text: 'Limit 3 exceeded ({text})'}
