  - {when: {key: x.msg_switching_cycles, equals: 1}, kind: warning, text: 'Maintenance: switching cycles limit reached'}

notes:
- PMA Prozeß- und Maschinen-Automation GmbH. One document and one register table for the KS 40-1, KS 41-1 and KS 42-1 (operating
  version 2); the models can't be told apart from the listed registers.
- Addresses are protocol addresses as the document gives them (its examples send the listed number unchanged). Function codes
  3 and 4 read the same data; writes use 6 (integers) or 16 (floats and several values). A read that starts at an undefined
  address fails; undefined addresses inside a read return -32500 (integer) or -1.5E37 (float).
- 'Every value exists at several addresses: as an integer (base address), as an integer with 1, 2 or 3 decimals (base + 8192,
  + 16384, + 24576) and as an IEEE float (32768 + 2 × base). Measured values and settings are taken here as floats, status
  and enum values as plain integers. Integer special values: -31000 sensor fault, -32000 switched off, -32500 undefined, -32768
  out of range.'
- Big-endian byte order is stated; the order of the two registers of a float is not stated and assumed most significant first,
  so the float points are unverified.
- 'The unit of the process value, setpoints and limits follows the configured physical unit (x.unit: none, °C or °F) and the
  input scaling; no unit is given for them here.'
- The interface is RS-485 / RS-422 (two- or four-wire), 2400–38400 Bd (the bit rate table lists up to 19200), even, odd or
  no parity, address 1–247. Default bit rate, parity and address are not stated in the document; 9600 8N1 and address 1 are
  assumed. Port 502 is for a Modbus TCP gateway in front of it. A message may be at most 256 bytes, so max_registers 125 is
  derived from that.
- The device identifies itself only through Uident (an order number) and the Unit code, whose values the document doesn't
  give, so there is no identify.
- 'Left out: PID parameters (Pb, ti, td, cycle times), self-tuning results (Tu, Vmax, Kp), input configuration and scaling,
  limit settings, logic input sources, output function assignments, forcing, programmer segments and times, timer settings,
  Modbus master settings and the per-module duplicates of the process values (In.1 is also at 1172 and 232 as integers, 35112
  and 33232 as floats).'
