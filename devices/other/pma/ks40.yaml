enums:
  operating_state: {'0': Automatic, '1': Self-tuning running, '2': Self-tuning faulty (waiting for operator), '3': Sensor error, '5': Manual, '8': Manual with external output value, '9': Outputs switched off (neutral), '10': Self-tuning aborted}
  tuning_result: {'0': No message / attempt running, '1': Successful, '2': Successful with warning (setpoint overshoot risk), '3': Process reacts in the wrong direction, '4': No response from the process, '5': Turning point too low, '6': 'Aborted, setpoint overshoot risk, no parameters', '7': Output step too small, '8': Waiting for setpoint reserve}
  tuning_error: {'0': No error, '3': Process reacts in the wrong direction, '4': No response from the process, '5': Turning point too low, '6': 'Aborted, setpoint overshoot risk', '7': Output step too small, '8': Setpoint reserve missing, '9': Impulse tuning failed}
  input_fault: {'0': No error, '1': Sensor break, '2': Incorrect polarity, '4': Short circuit}
  limit_status: {'0': No alarm, '1': Alarm stored, '2': Limit exceeded}
  defect: {'0': No fault, '2': Device defective}
  stored: {'0': No fault, '1': Fault occurred and stored}
  fault_3: {'0': No fault, '1': Fault occurred and stored, '2': Fault present}
  message: {'0': No message, '1': 'Limit reached, please acknowledge'}
  segment_type: {'0': Rising, '1': Falling, '2': Hold}
  off_on: {'0': 'Off', '1': 'On'}
  start_stop: {'0': Stop, '1': Start}
  unit: {'0': No unit, '1': °C, '2': °F}
  control_function: {'0': On/off controller or signaller, '1': 'PID, one output', '2': Delta / star / off, '3': 2 × PID (heating / cooling), '4': 3-point stepping controller}
  control_action: {'0': Inverse (e.g. heating), '1': Direct (e.g. cooling)}
  baud: {'0': '2400', '1': '4800', '2': '9600', '3': '19200'}
  parity: {'0': 'No parity, 2 stop bits', '1': Even, '2': Odd, '3': 'No parity, 1 stop bit'}

flags:
  controller_status: {'0': Switching signal heating on, '1': Switching signal cooling on, '2': Sensor error, '3': Manual, '4': Y2 active, '5': External output value active, '6': Controller off, '7': Parameter set 2 active, '8': Loop alarm, '9': Soft start active, '10': Setpoint ramp active}
  tuning_status: {'0': Process lined out, '1': Self-tuning on, '2': Self-tuning result faulty}
  alarm_status: {'0': Limit 1 present or stored, '1': Limit 2 present or stored, '2': Limit 3 present or stored, '4': Loop alarm present or stored, '5': Heating current alarm present or stored, '6': SSR alarm present or stored, '8': Limit 1 present, '9': Limit 2 present, '10': Limit 3 present, '12': Loop alarm present, '13': Heating current alarm present, '14': SSR alarm present}
  digital_outputs: {'0': Output 1, '1': Output 2, '2': Output 3, '3': Output 4, '4': Output 5, '5': Output 6}
  analog_input_status: {'0': Input 1 break, '1': Input 1 reversed polarity, '2': Input 1 short circuit, '4': Input 2 break, '5': Input 2 reversed polarity, '6': Input 2 short circuit}
  digital_inputs: {'0': Input 1, '1': Input 2, '2': Input 3, '8': F key, '9': A/M key, '10': Sel key, '11': Down key, '12': Up key, '13': Loc key}
  program_status: {'3': Program run, '4': Program end, '5': Program reset, '6': Start edge missing, '7': Band hold / fail hold, '8': Program active}

