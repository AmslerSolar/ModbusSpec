  - {key: x.err_limit3, label: Lim.3 limit 3 exceeded, table: holding, address: 225, type: u16, enum: fault_3, poll: fast}
  - {key: x.msg_operating_hours, label: InF.1 operating hours limit reached, table: holding, address: 226, type: u16, enum: message, poll: slow}
  - {key: x.msg_switching_cycles, label: InF.2 switching cycles limit reached, table: holding, address: 227, type: u16, enum: message, poll: slow}
  - {key: x.err_hardware, label: E.4 hardware error, table: holding, address: 228, type: u16, enum: stored, poll: slow}

  # Programmer
  - {key: x.program_status, label: St.Prog programmer status, table: holding, address: 6170, type: u16, flags: program_status, poll: slow}
  - {key: x.program_segment_type, label: St.Prog segment type, table: holding, address: 6170, type: u16, bits: [0, 2], enum: segment_type, poll: slow}
  - {key: x.program_setpoint, label: SP.Pr programmer setpoint, table: holding, address: 45110, type: f32, poll: slow, verified: false}
  - {key: x.program_segment, label: SG.Pr segment number, table: holding, address: 6176, type: u16, poll: slow}

  # Identity
