  - {key: x.setpoint_shift, label: SP.d setpoint shift, table: holding, address: 39130, type: f32, writable: true, min: -1999, max: 9999, poll: slow, verified: false}
  - {key: x.setpoint2, label: SP.2 second (safety) setpoint, table: holding, address: 38972, type: f32, writable: true, min: -1999, max: 9999, poll: slow, verified: false}
  - {key: x.setpoint_min, label: SP.LO lower setpoint limit, table: holding, address: 38968, type: f32, writable: true, min: -1999, max: 9999, poll: slow, verified: false}
  - {key: x.setpoint_max, label: SP.Hi upper setpoint limit, table: holding, address: 38970, type: f32, writable: true, min: -1999, max: 9999, poll: slow, verified: false}
  - {key: x.setpoint_ramp, label: r.SP setpoint gradient, table: holding, address: 38974, type: f32, unit: /min, writable: true, min: 0.01, max: 9999, poll: slow, verified: false}
  - {key: x.manual_output, label: Yman manual output value, table: holding, address: 43070, type: f32, unit: '%', writable: true, min: -110, max: 110, poll: slow, verified: false}
