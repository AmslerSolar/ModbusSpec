modbusspec: 0
id: yaskawa-v1000
manufacturer: Yaskawa
name: V1000 drive with SI-EM3/V Modbus TCP/IP option
kind: other

sources:
- title: YASKAWA AC Drive V1000 Option SI-EM3/V Modbus TCP/IP Installation Manual
  version: TOBP C730600 59B
  url: https://www.yaskawa.fr/Global%20Assets/Downloads/Technical_Documentation/Inverter_Drives/1000_Inverter_Series_AccessoriesOptions/SI-EM3V%20ModbusTCP/SI-EM3V_ModbusTCP_IM_EN.pdf
  sha256: d529682760f854c54e2f7c1324512bccd03e80fdcbe9ae1ad1390b66a1b98dc9
  archive_url: https://web.archive.org/web/20250910104456/https://www.yaskawa.fr/Global%20Assets/Downloads/Technical_Documentation/Inverter_Drives/1000_Inverter_Series_AccessoriesOptions/SI-EM3V%20ModbusTCP/SI-EM3V_ModbusTCP_IM_EN.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 16

encoding:
  byte_order: big
  word_order: big

points:
  - {key: x.status_word, label: Status Word (U1-12), table: holding, address: 8192, type: u16, flags: status_word, poll: fast}
  - {key: x.motor_speed, label: Motor Speed Monitor (U1-05), table: holding, address: 8193, type: s16, verified: false, note: 'Unit and scaling are in the drive''s technical manual, not this document; raw value. Signed type assumed.'}
  - {key: x.torque_reference, label: Torque Reference Monitor (U1-09), table: holding, address: 8194, type: s16, verified: false, note: Raw value; unit not stated here. Signed type assumed.}
  - {key: x.pg_count_1, label: PG Count Channel 1, table: holding, address: 8195, type: u16}
  - {key: x.frequency_reference, label: Frequency Reference Monitor (U1-01), table: holding, address: 8196, type: u16, verified: false, note: Raw value; unit and scaling are in the drive's technical manual.}
  - {key: x.output_frequency, label: Output Frequency Monitor (U1-02), table: holding, address: 8197, type: u16, poll: fast, verified: false, note: Raw value; unit and scaling are in the drive's technical manual.}
  - {key: x.output_current, label: Output Current, table: holding, address: 8198, type: u16, unit: A, scale: 0.01, poll: fast, verified: false, note: '0.01 A per unit for drives set to 11 kW or less (Heavy or Normal Duty), 0.1 A for 15 kW and above; the scale depends on the drive, 0.01 is taken here.'}
  - {key: x.a2_input_level, label: Terminal A2 Input Level Monitor (U1-14), table: holding, address: 8199, type: u16}
  - {key: x.dc_bus_voltage, label: DC Bus Voltage Monitor (U1-07), table: holding, address: 8200, type: u16, unit: V, poll: fast, verified: false, note: Unit and scaling not stated in this document; 1 V assumed.}
  - {key: x.error_signal_1, label: Error Signal 1, table: holding, address: 8201, type: u16, flags: error_signal_1, poll: fast}
  - {key: x.error_signal_2, label: Error Signal 2, table: holding, address: 8202, type: u16, flags: error_signal_2, poll: fast}
  - {key: x.error_signal_3, label: Error Signal 3, table: holding, address: 8203, type: u16, flags: error_signal_3, poll: fast}
  - {key: x.a1_input_level, label: Terminal A1 Input Level Monitor (U1-13), table: holding, address: 8204, type: u16}
  - {key: x.digital_inputs, label: Digital Input Terminal Status (U1-10), table: holding, address: 8205, type: u16}
  - {key: x.a3_input_level, label: Terminal A3 Input Level Monitor (U1-15), table: holding, address: 8206, type: u16}
  - {key: x.pg_count_2, label: PG Count Channel 2, table: holding, address: 8207, type: u16}
  - {key: firmware, label: Drive Software Number (Flash) (U1-25), table: holding, address: 8208, type: u16, poll: slow}

flags:
  status_word: {'0': During Run, '1': During Zero Speed, '2': During Reverse Direction, '3': During Fault Reset Signal Input, '4': During Speed Agree, '5': Drive Ready, '6': Alarm, '7': Fault, '8': During Operation Error (oPE), '9': During Momentary Power Loss, '10': Motor 2 Selected, '14': 'ComRef Status, NetRef Status', '15': 'ComCtrl Status, NetCtrl Status'}
  error_signal_1: {'1': Undervoltage (Uv1), '2': Control Power Supply Undervoltage (Uv2), '3': Soft Charge Circuit Fault (Uv3), '5': Ground Fault (GF), '6': Overcurrent (oC), '7': Overvoltage (ov), '8': Heatsink Overheat (oH), '9': Heatsink Overheat (oH1), '10': Motor Overload (oL1), '11': Drive Overload (oL2), '12': Overtorque Detection 1 (oL3), '13': Overtorque Detection 2 (oL4), '14': Dynamic Braking Transistor Fault (rr), '15': Braking Resistor Overheat (rH)}
  error_signal_2: {'0': External Fault at input terminal S3 (EF3), '1': External Fault at input terminal S4 (EF4), '2': External Fault at input terminal S5 (EF5), '3': External Fault at input terminal S6 (EF6), '4': External Fault at input terminal S7 (EF7), '7': Overspeed (os), '8': Excessive Speed Deviation (dEv), '9': PG Disconnected (PGo), '10': Input Phase Loss (PF), '11': Output Phase Loss (LF), '12': Motor Overheat (PTC input) (oH3), '13': Digital Operator Connection Fault (oPr), '14': EEPROM Write Error (Err), '15': Motor Overheat Fault (PTC input) (oH4)}
  error_signal_3: {'0': MEMOBUS/Modbus Communication Error (CE), '1': Option Communication Error (bUS), '4': Control Fault (CF), '6': Option External Fault (EF0), '7': PID Feedback Loss (FbL), '8': Undertorque Detection 1 (UL3), '9': Undertorque Detection 2 (UL4), '10': High Slip Braking Overload (oL7), '15': Hardware Fault (includes oF)}

problems:
  - {when: {key: x.status_word, bit: 7}, kind: fault, text: Drive fault (status bit 7)}
  - {when: {key: x.status_word, bit: 6}, kind: warning, text: Drive alarm (status bit 6)}
  - {when: {key: x.status_word, bit: 8}, kind: fault, text: Operation error oPE (status bit 8)}
  - {when: {key: x.error_signal_1, not: 0}, kind: fault, text: 'Drive error signal 1 (0x{value:X})'}
  - {when: {key: x.error_signal_2, not: 0}, kind: fault, text: 'Drive error signal 2 (0x{value:X})'}
  - {when: {key: x.error_signal_3, not: 0}, kind: fault, text: 'Drive error signal 3 (0x{value:X})'}

notes:
- 'This document is for the SI-EM3/V Modbus TCP/IP option card of the V1000 drive. It lists only the option''s high-speed
  register area: drive command registers at 0x0001–0x001F and the monitors at 0x2000–0x2010 taken here. All command, monitor
  and parameter registers of the drive''s own MEMOBUS map (in the drive''s technical manual, not used here) are reachable
  through the option as well; each monitor here mirrors a drive register (status 0x004B, motor speed 0x0044, torque reference
  0x0048, frequency reference 0x0040, output frequency 0x0041, output current 0x0026, DC bus 0x0046, error signals 0x00C0–0x00C2,
  software number 0x004D).'
- Hexadecimal register numbers are used as protocol addresses (0-based) as given. Functions 03, 06, 16 and 23; at most 16
  registers per request; up to 10 Modbus TCP connections.
- Writing 0 to 0x0900 stores parameter changes in EEPROM (and RAM), to 0x0910 in RAM only (an Enter command; whether it is
  needed depends on parameter H5-11). Not included as points.
- The drive's own units and scaling of the monitors (speed, frequency, torque, analogue inputs, DC bus) are not in this document;
  those points are raw values.
- The unit id is not stated in the document; 1 is assumed. The IP settings are drive parameters F7-01 to F7-13 (static, BOOTP
  or DHCP).
