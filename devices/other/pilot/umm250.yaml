modbusspec: 0
id: pilot-umm250
manufacturer: Pilot Elektronik
name: UMM-250 Modbus TCP/IP M-Bus master
kind: other

sources:
- title: UMM-250-Modbus TCP/IP M-Bus master user manual
  version: 1.1 (29.09.2018)
  url: https://pilotelektronik.com/datasheets/UMM-250-MODBUS.pdf
  sha256: 77b0d1480ac769152d1f204996f5ea8ea9a6047be0b283c27d305c95d3dd3c10

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  - {key: x.mbus_slave_id, label: Mbus Slave ID, table: holding, address: 0, type: u32, writable: true, poll: slow, note: The M-Bus meter (secondary / ID number) whose data the input registers then show.}
  - {key: x.data_length, label: Data Length, table: input, address: 0, type: u32, poll: slow, note: Number of unit / value records that follow.}
  - {key: x.record1_unit, label: Unit 1, table: input, address: 2, type: u32, enum: mbus_unit, poll: slow}
  - {key: x.record1_value, label: Data 1, table: input, address: 4, type: f32, poll: fast}
  - {key: x.record2_unit, label: Unit 2, table: input, address: 6, type: u32, enum: mbus_unit, poll: slow}
  - {key: x.record2_value, label: Data 2, table: input, address: 8, type: f32, poll: fast}
  - {key: x.record3_unit, label: Unit 3, table: input, address: 10, type: u32, enum: mbus_unit, poll: slow}
  - {key: x.record3_value, label: Data 3, table: input, address: 12, type: f32, poll: fast}
  - {key: x.record4_unit, label: Unit 4, table: input, address: 14, type: u32, enum: mbus_unit, poll: slow}
  - {key: x.record4_value, label: Data 4, table: input, address: 16, type: f32, poll: fast}
  - {key: x.record5_unit, label: Unit 5, table: input, address: 18, type: u32, enum: mbus_unit, poll: slow}
  - {key: x.record5_value, label: Data 5, table: input, address: 20, type: f32, poll: fast}

enums:
  mbus_unit: {'0': Energy (kWh), '1': Energy (kJ), '2': Volume (m³), '3': Mass (kg), '4': On time, '5': Operating time, '6': Power (W), '7': Power (J/h), '8': Volume flow (m³/h), '9': Volume flow ext. (m³/min), '10': Volume flow ext. (ml/s), '11': Mass flow (kg/h), '12': Flow temperature (°C), '13': Return temperature (°C), '14': Temperature difference (mK), '15': External temperature (°C), '16': Pressure (mbar), '17': Time point, '18': Time point, '19': Units for H.C.A, '20': Reserved, '21': Averaging duration, '22': Actuality duration, '23': Fabrication no, '24': Enhanced, '25': Bus address, '26': Manufacturer code}

notes:
- A gateway that reads up to 250 M-Bus meters (2400 baud) and shows one at a time over Modbus TCP. Writing a meter's ID (as
  a 32-bit number) to holding registers 1–2 selects it; the input registers then hold a record count followed by pairs of
  a unit code (32-bit integer) and a value (32-bit float), four registers per pair.
- What each record means depends on the selected meter; only the first five records are listed here, more follow in the same
  pattern. The value's unit is given by the record's unit code.
- The manual numbers registers from 1 (its examples use a tool whose start register 0001 is protocol address 0); converted
  to 0-based protocol addresses.
- Word order of the 32-bit values is not stated; high word first assumed (not verified). The examples read the gateway at
  unit 255, so that is taken as default unit (assumed). The Ethernet module's default parameter list names local port 20108
  while the Modbus TCP configuration screen shows 502; 502 taken.
- No register identifies the device.
