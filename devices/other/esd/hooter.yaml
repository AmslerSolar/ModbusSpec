# Written from the ESD Modbus Hooter manual (undated).

modbusspec: 0
id: esd-hooter
manufacturer: ESD (Electronics Systems and Devices)
name: Modbus Hooter (RS-485 sounder)
kind: other

sources:
- title: ESD make MODBUS HOOTER MANUAL
  version: undated
  url: https://www.esd-india.com/media/catalogs/annunciator/ESD-Modbus-Hooter.pdf
  sha256: d35c5205689279bc395567eb9ecbb3cb0d0e052e4918ca27e10b005114ba9655

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 2400
    format: 8N1

points:
  - {key: x.hooter, label: Hooter on / off, table: coil, address: 35351, type: bool, writable: true, write_only: true, note: Function 05 (write single coil) is the only function supported. The document's example writes 0x0000; that 0xFF00 switches the hooter on follows from function 05 but isn't stated.}

notes:
- The device only accepts function 05 (write single coil) on coil 35351 (0x8A17, used as the protocol address as printed).
  It answers no reads, so it can't be monitored or found by a network search.
- Unit id 1–255 set with DIP switch 1; all switches off gives address 1. Baud rate 2400 / 4800 / 9600 / 19200 set with DIP
  switch 2; both switches off gives 2400. 8 data bits, no parity, 1 stop bit. The unit must be restarted after changing the
  switches. Port 502 only applies behind an RS485-to-TCP gateway.
- The master should wait at least 200 ms for the response.
