modbusspec: 0
id: dynadrive-dn310
manufacturer: Dyna Drive
name: DN310
kind: other

sources:
- id: modbus-devices
  title: Modbus_Devices (Home Assistant integration)
  url: https://github.com/dk-1983/Modbus_Devices
  license: MIT
  commit: 88460d5b9db9b7cb3abb0032de81a562522ec8b7
  path: custom_components/modbus_devices/equipment/dyna_drive.py

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - modbus-devices

points:
  - {key: x.running_frequency_raw, label: Running frequency (raw), table: holding, address: 4097, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.bus_voltage_raw, label: Bus voltage (raw), table: holding, address: 4098, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.output_voltage_raw, label: Output voltage (raw), table: holding, address: 4099, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.output_current_raw, label: Output current (raw), table: holding, address: 4100, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.output_power_raw, label: Output power (raw), table: holding, address: 4101, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.output_torque_raw, label: Output torque (raw), table: holding, address: 4102, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.running_speed_raw, label: Running speed (raw), table: holding, address: 4103, type: u16, note: The project publishes the raw word; the drive's manual gives no reliable scale for it.}
  - {key: x.command, label: Command, table: holding, address: 8192, type: u16, enum: command, writable: true}
  - {key: x.status_code, label: Running status, table: holding, address: 12288, type: u16, enum: status_code}
  - {key: x.fault_code, label: Current fault, table: holding, address: 32768, type: u16, enum: fault_code}

enums:
  status_code: {'1': forward_run, '2': reverse_run, '3': stop}
  fault_code: {'0': no_fault, '2': overcurrent_during_acceleration, '3': overcurrent_during_deceleration, '4': overcurrent_at_constant_speed, '5': overvoltage_during_acceleration, '6': overvoltage_during_deceleration, '7': overvoltage_at_constant_speed, '8': buffer_resistor_overload, '9': undervoltage, '10': inverter_overload, '11': motor_overload, '12': power_input_phase_loss, '13': power_output_phase_loss, '14': igbt_overheat, '15': external_fault, '16': communication_fault, '17': contactor_fault, '18': current_detection_fault, '19': motor_auto_tuning_fault, '20': encoder_pg_card_fault, '21': parameter_read_write_fault, '22': inverter_hardware_fault, '23': motor_short_to_ground, '26': accumulated_running_time_reached, '27': user_defined_fault_1, '28': user_defined_fault_2, '29': accumulated_power_on_time_reached, '30': load_lost, '31': pid_feedback_lost_during_running, '40': fast_current_limit_timeout, '41': motor_switchover_error_during_running, '42': too_large_speed_deviation, '43': motor_overspeed, '90': incorrect_encoder_ppr_setting, '94': speed_feedback_error}
  command: {'1': forward run, '2': reverse run, '5': coast stop, '6': decelerate stop, '7': fault reset}

notes:
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
