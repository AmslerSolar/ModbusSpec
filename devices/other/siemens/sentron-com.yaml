modbusspec: 0
id: siemens-sentron-com
manufacturer: Siemens
name: SENTRON COM circuit-protection devices behind a Powercenter (MCB, AFDD, RCM, ECPD, RCA, …)
kind: other

sources:
- id: siemens-sentron
  title: ha-siemens-sentron (Home Assistant integration)
  url: https://github.com/powerassistant/ha-siemens-sentron
  license: MIT
  commit: dfb1773af007be60193f1a4ad83770d3400c057f
  path: custom_components/siemens_sentron/const.py, custom_components/siemens_sentron/profiles.py, custom_components/siemens_sentron/coordinator.py,
    custom_components/siemens_sentron/discovery.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - siemens-sentron

models:
  - {id: 5st3_com_as_fc, name: 5ST3 COM AS+FC, match: {table: holding, address: 111, type: u16, equals: 1}}
  - {id: 3na3_com_fuse, name: 3NA3 COM Fuse, match: {table: holding, address: 111, type: u16, equals: 2}}
  - {id: 5sl6_com_mcb, name: 5SL6 COM MCB, match: {table: holding, address: 111, type: u16, equals: 3}}
  - {id: 5sv6_com_afdd, name: 5SV6 COM AFDD, match: {table: holding, address: 111, type: u16, equals: 4}}
  - {id: 5st3_com_rca_standard, name: 5ST3 COM RCA Standard, match: {table: holding, address: 111, type: u16, equals: 5}}
  - {id: 5st3_com_rca_mit_rcd_ir_test, name: 5ST3 COM RCA mit RCD/IR Test, match: {table: holding, address: 111, type: u16, equals: 6}}
  - {id: 5sl6_com_mcb_rcm, name: 5SL6 COM MCB RCM, match: {table: holding, address: 111, type: u16, equals: 7}}
  - {id: 5sv8_com_rcm, name: 5SV8 COM RCM, match: {table: holding, address: 111, type: u16, in: [8, 10]}}
  - {id: 3rv2_com_msp, name: 3RV2 COM MSP, match: {table: holding, address: 111, type: u16, equals: 9}}
  - {id: 5ty1_com_ecpd, name: 5TY1 COM ECPD, match: {table: holding, address: 111, type: u16, equals: 11}}
  - {id: 5tt4_com_dido, name: 5TT4 COM DIDO, match: {table: holding, address: 111, type: u16, equals: 18}}
  - {id: 3na6_com_fuse, name: 3NA6 COM Fuse, match: {table: holding, address: 111, type: u16, equals: 19}}

points:
