enums:
  connection_state: {'0': Idle, '1': Offline, '2': Connecting, '3': Connected}
  breaker_state: {'0': Unknown, '1': 'Off', '2': 'On', '3': Tripped, '4': 'Tripped, but handle blocked', '5': Standby (ECPD), '6': Standby tripped (ECPD)}
  variant: {'1': 5ST3 COM AS+FC, '2': 3NA3 COM Fuse, '3': 5SL6 COM MCB, '4': 5SV6 COM AFDD, '5': 5ST3 COM RCA Standard, '6': 5ST3 COM RCA mit RCD/IR Test, '7': 5SL6 COM MCB RCM, '8': 5SV8 COM RCM, '9': 3RV2 COM MSP, '10': 5SV8 COM RCM, '11': 5TY1 COM ECPD, '14': SENTRON Powercenter 1100, '16': SENTRON Powercenter 2000, '18': 5TT4 COM DIDO, '19': 3NA6 COM Fuse}

notes:
- The gateway answers on unit 255; the connected end devices on units 1–24 (one per slot, see siemens-sentron-com). Slot n's
  status registers are at base + n − 1.
- A Powercenter 1000 reports end-device presence by pairing status and has no breaker-state registers; the end devices report
  their breaker state themselves.
- 'Write-only command registers (not listed as points; register numbers here are protocol addresses): 96 on the gateway (unit
  255) = localize on/off; on end devices 2677 = start RCD self test (ECPD, write 0x0815), 5225 = start RCM test (MCB RCM,
  0x0815), 3693 = test (0x0815), 3689 = reset manual off (0x0815), 3692 = ECPD electronic switching (0 standby, 1 on), 3694
  = ECPD unlock protected settings, 3688 = RCA handle (0 off, 1 on; needs remote control selector = communication), 3697 =
  DIDO output forcing (two registers: output number byte, state byte, then seconds).'
- Identification as siemens-sentron recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
