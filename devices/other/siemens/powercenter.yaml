modbusspec: 0
id: siemens-powercenter
manufacturer: Siemens
name: SENTRON Powercenter 1000 / 1100 / 2000
kind: other

sources:
- id: siemens-sentron
  title: ha-siemens-sentron (Home Assistant integration)
  url: https://github.com/powerassistant/ha-siemens-sentron
  license: MIT
  commit: dfb1773af007be60193f1a4ad83770d3400c057f
  path: custom_components/siemens_sentron/const.py, custom_components/siemens_sentron/coordinator.py, custom_components/siemens_sentron/discovery.py,
    custom_components/siemens_sentron/gateway.py

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp

encoding:
  word_order: big

identify:
  checks:
  - - table: input
      address: 1
      type: u16
      equals: 42
    - table: holding
      address: 1
      type: u16
      equals: 42
  any:
  - table: holding
    address: 111
    type: u16
    in:
    - 14
    - 16
  - table: input
    address: 111
    type: u16
    in:
    - 14
    - 16
  - - table: holding
      address: 21
      type: u32
      answers: true
    - - table: input
        address: 1025
        type: u16
        answers: true
      - table: input
        address: 1050
        type: u16
        answers: true

defaults:
  verified: false
  sources:
  - siemens-sentron

models:
  - {id: poc1100, name: SENTRON Powercenter 1100, match: {table: holding, address: 111, type: u16, equals: 14}}
  - {id: poc2000, name: SENTRON Powercenter 2000, match: {table: holding, address: 111, type: u16, equals: 16}}
  - {id: poc1000, name: SENTRON Powercenter 1000}

