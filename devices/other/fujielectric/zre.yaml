modbusspec: 0
id: fujielectric-zre
manufacturer: Fuji Electric
name: ZRE infrared gas analyzer
kind: other

sources:
- title: Instruction Manual Infrared Gas Analyzer Communication Functions (Modbus), type ZRE
  version: INZ-TN5A0204a-E
  url: https://www.fujielectric.fr/wp-content/uploads/2024/04/instruction-manual-product-gas-analysis-infrared-gas-analyzer-communication-modbus-ZRE-TN5A0204a-en.pdf
  sha256: e26402b6fa6e2674eb12fd6221bf19304c7728e683448afb52c65ec860fb3185
  archive_url: https://web.archive.org/web/20251231122031/https://www.fujielectric.fr/wp-content/uploads/2024/04/instruction-manual-product-gas-analysis-infrared-gas-analyzer-communication-modbus-ZRE-TN5A0204a-en.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 38400
    format: 8N1
  limits:
    max_registers: 64

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: input
    address: 1096
    type: str
    length: 1
    chars: low
    equals: Z
  - table: input
    address: 1098
    type: str
    length: 1
    chars: low
    equals: E

