notes:
- Register numbers in the document are 3xxxx (function 04) and 4xxxx (function 03 / 06 / 16) references; the addresses here
  are the relative addresses the document gives next to them (reference minus 30001 / 40001).
- RS-485 (up to 31 analyzers) or USB (virtual COM port), RTU, fixed 38400 bit/s 8N1. Station No. 1 at delivery, 0 switches
  communication off. At most 64 registers per request. Port 502 is for a Modbus TCP gateway in front of it.
- Concentrations are integers (−9999…9999) without a decimal point; the decimal point position (0…3) and unit follow in the
  next two registers. Over-range values are still sent as measured. Which components channels 1…12 carry depends on the analyzer's
  configuration (an unused channel is optional); only channels 1…5 have range, alarm, calibration and error registers.
- The identification checks use the fixed "Z" and "E" of the type code (digits 1 and 3); one ASCII character in the low byte
  of each register is assumed, the document doesn't say how a character is encoded.
- The meaning of the error numbers (Error 1…10) is in the analyzer's instruction manual, not in this document; each of those
  registers is 1 while that error is present.
- 'Left out: the rest of the error log (0x0042…0x0082, 14 entries of number, day, hour, minute and channel), calibration concentrations,
  alarm limits and modes, response and average times, auto calibration / blowback / measurement point schedules, hold values,
  the key and display commands, display information (3) and the manual calibration channel.'
