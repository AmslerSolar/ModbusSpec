  no_yes: {'0': 'no', '1': 'yes'}
  off_on: {'0': 'off', '1': 'on'}
  range3: {'0': Range 1, '1': Range 2, '2': Range 3}

problems:
  - {when: {key: x.instrument_error, equals: 1}, kind: fault, text: Instrument error}
  - {when: {key: x.calibration_error, equals: 1}, kind: warning, text: Calibration error}

notes:
- Register numbers in the document are 3xxxx (function 04) and 4xxxx (function 03 / 06 / 16) references; the addresses here
  are the relative addresses the document gives next to them (reference minus 30001 / 40001).
- The interface is RS-232 with fixed 9600 bit/s 8N1, RTU; through an RS-232/RS-485 converter up to 31 analyzers share a line.
  Station No. 1 at delivery, 0 switches communication off. At most 64 registers per request. Port 502 is for a Modbus TCP
  gateway in front of it.
- Concentrations are integers (−9999…9999) without a decimal point; the decimal point position (0…3) and unit follow in the
  next two registers. Over-range values are still sent as measured.
- 'ZSVF and ZSVS can''t be told apart over Modbus: choose the model. Points marked zsvf exist only on the ZSVF. The document
  gives no register that identifies the analyzer, so there is no identify.'
- Channels 6…8 have no range, calibration or error registers; which components a channel carries depends on the analyzer's
  configuration (an unused channel is optional).
- The meaning of the error numbers (Error code No. 1…8) is in the analyzer's instruction manual, not in this document; each
  of those registers is 1 while that error is present.
