modbusspec: 0
id: fujielectric-zsv
manufacturer: Fuji Electric
name: ZSV compact gas analyzer
kind: other

sources:
- title: Instruction Manual Compact Type Gas Analyzer Communication Functions (Modbus), type ZSV
  version: INZ-TN514400b-E
  url: https://www.fujielectric.fr/wp-content/uploads/2024/04/instruction-manual-product-gas-analysis-compact-type-gas-analyzer-ZSV-modbus-TN514400b-en.pdf
  sha256: 25d94f1b95b5a629243fa654be23b337b3433447b5b61b3593098d999d7ed514
  archive_url: https://web.archive.org/web/20251231122241/https://www.fujielectric.fr/wp-content/uploads/2024/04/instruction-manual-product-gas-analysis-compact-type-gas-analyzer-ZSV-modbus-TN514400b-en.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 64

encoding:
  byte_order: big
  word_order: big

model_choice: user

models:
  - {id: zsvf, name: ZSVF}
  - {id: zsvs, name: ZSVS}

