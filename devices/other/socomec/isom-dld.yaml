notes:
- Addresses are protocol addresses as the document gives them (hex and decimal). Reading uses function 3 (holding registers;
  the document calls them input registers in one place), settings are written with function 16. The register-count column
  gives 2 for many 1-register settings; they are read as single registers here. Values are sent most significant byte first;
  for the 2-register floats the high word first is assumed.
- 'Modbus TCP: at most 100 requests per second; the unit id is the device''s bus address. Modbus RTU on RS485 (protocol register
  0x30F0 = 2): default address 100, 19200 baud, even parity; with stop bits on auto the frame is always 11 bits (8E1).'
- The DLD 240 and DLD 440 share the map; they differ in the threshold ranges (0x3200, 0x3201) only. The document doesn't say
  how to tell them apart over Modbus (the device model text at 0x0510 likely does).
- 'Left out: the induction (0x2030–0x2046), relative capacitance (0x2078 ff.) and relative resistance (0x2090 ff.) floats
  per channel, the signal-quality alarm values (0x20E0–0x20EB), digital input / output, buzzer and relay settings (0x3120–0x3169,
  0x3300–0x3304). The induction range is printed as 0x2004–0x2046 in the document; the decimal addresses (8240–8262) give
  0x2030.'
- 'Write-only commands: 0x4803 self test (64260), 0x4804 reset (64770 = insulation fault values and alarms, 65025 = alarms
  only), 0x480B buzzer mute, 0x48A1 factory setting (65025).'
- The general section of the document names the ISOM ALD 495/395 family; the register tables are for the DLD 240/440.
