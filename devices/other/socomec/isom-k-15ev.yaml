# Written from the Socomec ISOM K-15EV Modbus register set (version 02, 553489).

modbusspec: 0
id: socomec-isom-k-15ev
manufacturer: Socomec
name: ISOM K-15EV insulation monitor for EV chargers (47250105)
kind: other

sources:
- title: ISOM K-15EV Modbus register set
  version: 02 (553489)
  url: https://www.socomec.co.uk/sites/default/files/2025-09/ISOM-K-15EV---MODBUS-REGISTER-SET_COMMUNICATION-TABLE_2025-09-12-08-39-59_553489_English_PLURI_137.pdf
  sha256: ddd81aeffa2457b7f9a409a87c19cf92ed304b36785c65082cd0ccc5e87b02cf
  date: 2025-09
  language: en
  devices:
  - ISOM K-15EV (47250105)

connection:
  default_port: 502
  default_unit: 3
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 9800
    type: str
    length: 10
    byte_order: little
    prefix: SOCOMEC

points:
  # Measured values (read only): channels of 4 registers; the last register holds the channel state
  - {key: x.insulation_resistance, label: Insulation measurement, table: holding, address: 1000, type: f32, unit: kΩ, verified: false, note: The document only describes the channel's last register. The first two registers are taken to hold the value as a float in kΩ (the unit of the thresholds); not stated.}
  - {key: x.insulation_state, label: Insulation measurement state, table: holding, address: 1003, type: u16, enum: insulation_state}
  - {key: x.voltage, label: Under / over voltage, table: holding, address: 1008, type: f32, unit: V, verified: false, note: Value as float in V assumed (see 1000).}
  - {key: x.voltage_state, label: Under / over voltage state, table: holding, address: 1011, type: u16, enum: voltage_state}
  - {key: x.voltage_pe_plus, label: Voltage PE to L+, table: holding, address: 1016, type: f32, unit: V, verified: false, note: Value as float in V assumed (see 1000).}
  - {key: x.voltage_pe_plus_state, label: Voltage PE to L+ state, table: holding, address: 1019, type: u16, enum: voltage_state}
  - {key: x.voltage_pe_minus, label: Voltage PE to L-, table: holding, address: 1020, type: f32, unit: V, verified: false, note: Value as float in V assumed (see 1000).}
  - {key: x.voltage_pe_minus_state, label: Voltage PE to L- state, table: holding, address: 1023, type: u16, enum: voltage_state}
  - {key: x.device_status, label: Device status, table: holding, address: 1035, type: u16, enum: device_status}
  # Parameters
  - {key: x.test_status, label: Test status, table: holding, address: 3000, type: u16, enum: test_status}
  - {key: x.alarm_threshold, label: Insulation resistance alarm value (Ran2), table: holding, address: 3005, type: u16, unit: kΩ, poll: slow, writable: true, note: Ran1 … 500 kΩ.}
  - {key: x.fault_threshold, label: Insulation resistance fault value (Ran1), table: holding, address: 3007, type: u16, unit: kΩ, poll: slow, writable: true, note: 1 … Ran2 kΩ.}
  - {key: x.undervoltage_enabled, label: Undervoltage detection, table: holding, address: 3008, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.undervoltage_level, label: Undervoltage detection level U<, table: holding, address: 3009, type: u16, unit: V, poll: slow, writable: true, note: 30 V … U>.}
  - {key: x.overvoltage_enabled, label: Overvoltage detection, table: holding, address: 3010, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.overvoltage_level, label: Overvoltage detection level U>, table: holding, address: 3011, type: u16, unit: V, poll: slow, writable: true, note: U< … 1150 V.}
  - {key: x.latch_on_fault, label: Unit latches on fault condition, table: holding, address: 3012, type: u16, enum: disabled_enabled, poll: slow, writable: true}
  - {key: x.relay1_mode, label: Operating mode of RLY1, table: holding, address: 3013, type: u16, enum: relay_mode, poll: slow, writable: true}
  - {key: x.relay2_mode, label: Operating mode of RLY2, table: holding, address: 3014, type: u16, enum: relay_mode, poll: slow, writable: true}
  - {key: x.bus_address, label: Bus address, table: holding, address: 3015, type: u16, poll: slow, writable: true, min: 0, max: 247, note: Default 3.}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 3016, type: u16, enum: baud_rate, poll: slow, writable: true}
  - {key: x.parity, label: Parity, table: holding, address: 3017, type: u16, enum: parity, poll: slow, writable: true}
  - {key: x.startup_delay, label: Startup delay t, table: holding, address: 3018, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.response_delay, label: Response delay ton (relays 1 and 2), table: holding, address: 3019, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.release_delay, label: Delay on release toff (relays 1 and 2), table: holding, address: 3020, type: u16, unit: s, poll: slow, writable: true}
  - {key: x.self_test_period, label: Repetition period for automatic self-test, table: holding, address: 3021, type: u16, enum: self_test_period, poll: slow, writable: true}
  - {key: x.monitoring_mode, label: Monitoring mode, table: holding, address: 3023, type: u16, enum: monitoring_mode, poll: slow, writable: true}
  - {key: x.request_stop_mode, label: Request stop mode, table: holding, address: 3026, type: u16, enum: request_stop_mode, poll: slow, writable: true}
  - {key: x.relay1_function, label: Function assignment for RLY1, table: holding, address: 3027, type: u16, poll: slow, writable: true, note: Bit field; the bit meanings are in a section the document refers to but doesn't contain. Default 0x0004.}
  - {key: x.relay2_function, label: Function assignment for RLY2, table: holding, address: 3028, type: u16, poll: slow, writable: true, note: Default 0x0010.}
  - {key: x.lock, label: Anti-tamper lock, table: holding, address: 8010, type: u16, poll: slow, note: 0xAA55 = locked.}
  # Identity
  - {key: x.device_name, label: Device name, table: holding, address: 9800, type: str, length: 10, byte_order: little, poll: slow, note: '"SOCOMEC K15EV"; the low byte holds the first character.'}
  - {key: x.software_id, label: Software ID number, table: holding, address: 9820, type: u16, poll: slow}
  - {key: firmware, label: Software version, table: holding, address: 9821, type: u16, poll: slow}
  - {key: x.software_year, label: Software version year, table: holding, address: 9822, type: u16, poll: slow}
  - {key: x.software_month, label: Software version month, table: holding, address: 9823, type: u16, poll: slow}
  - {key: x.software_day, label: Software version day, table: holding, address: 9824, type: u16, poll: slow}
  - {key: x.modbus_driver_version, label: Modbus driver version, table: holding, address: 9825, type: u16, poll: slow}

enums:
  insulation_state: {'1': Alarm or fault, '71': No fault, '102': PE disconnected}
  voltage_state: {'76': No fault, '77': Undervoltage, '78': Overvoltage}
  device_status: {'115': Device error, '1022': Measured value update counter}
  test_status: {'0': None, '1': Self test, '2': Relay}
  disabled_enabled: {'0': Disabled, '1': Enabled}
  relay_mode: {'0': Normally open, '1': Normally closed}
  baud_rate: {'1': '1200', '2': '2400', '3': '4800', '4': '9600', '5': '19200', '6': '38400', '7': '57600', '8': '115200'}
  parity: {'0': 8N1, '1': 8O1, '2': 8E1, '3': 8N2}
  self_test_period: {'0': 'Off', '1': 1 h, '2': 24 h}
  monitoring_mode: {'0': CCS / DC, '1': CHAdeMO 1, '2': CHAdeMO 2}
  request_stop_mode: {'0': Stop, '1': Enable}

problems:
  - {when: {key: x.insulation_state, equals: 1}, kind: fault, text: Insulation alarm or fault}
  - {when: {key: x.insulation_state, equals: 102}, kind: fault, text: PE connection lost}
  - {when: {key: x.voltage_state, equals: 77}, kind: warning, text: Undervoltage}
  - {when: {key: x.voltage_state, equals: 78}, kind: warning, text: Overvoltage}
  - {when: {key: x.device_status, equals: 115}, kind: fault, text: Device error}

notes:
- Register numbers are used as protocol addresses as the document gives them; the function code isn't stated for reading,
  holding registers (function 3) are assumed. Settings are written with function 16.
- Measured values are channels of 4 registers (1000–1003, 1008–1011, 1016–1019, 1020–1023, 1032–1035). The document describes
  only each channel's last register (its state code); the value registers are an assumption (see the points).
- 'Device status 1035: the document lists 1022 as ''measured value update counter'' among the state codes; its meaning is
  unclear.'
- 'Serial defaults: address 3, 9600 baud, 8N1 (parity register 0).'
- 'Write-only commands left out: 8003 factory setting incl. comms (0x6661), 8004 factory setting of user parameters (0x4653),
  8005 device test (0x5445), 8006 clear alarms and faults (0x434C). The anti-tamper lock is set by writing 8010–8013 in one
  request (0xAA55 + three passcode digits) and removed with 0x1122 + the passcode; once locked, setting writes are refused
  (exception 01).'
