# Written from Socomec's Modbus RTU / TCP manual for STATYS (French). No reading from a real device yet.

modbusspec: 0
id: socomec-statys
manufacturer: Socomec
name: STATYS static transfer systems
kind: other

sources:
- title: Modbus RTU / TCP for STATYS, installation and operating manual
  version: 552993B (2025-01)
  url: https://www.socomec.fr/sites/default/files/2025-01/MODBUS-RTU---TCP-FOR-STATYS_INSTALLATION-AND-OPERATING-MANUAL_2025-01_552993B_FR_0.pdf
  sha256: 2a1153ed7df9b799b1ede00e640968223524c2396556844ccbf8b91070e4ab4d
  language: fr
  devices: [STATYS]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  # Status (S00-S63) and alarm words (A00-A31): bit meanings are in the manual
  - {key: x.status_word_1, label: "Status word 1", table: holding, address: 0x0140, type: u16, note: "Bit 0 is the lowest acronym of the word."}
  - {key: x.status_word_2, label: "Status word 2", table: holding, address: 0x0141, type: u16}
  - {key: x.status_word_3, label: "Status word 3", table: holding, address: 0x0142, type: u16}
  - {key: x.status_word_4, label: "Status word 4", table: holding, address: 0x0143, type: u16}
  - {key: x.alarm_word_1, label: "Alarm word 1", table: holding, address: 0x0148, type: u16}
  - {key: x.alarm_word_2, label: "Alarm word 2", table: holding, address: 0x0149, type: u16}

  # Measurements (0x0220, M00-M63)
  - {key: x.source1_voltage_l1n, label: "Source 1 voltage L1-N", table: holding, address: 0x0220, type: u16, unit: "V"}
  - {key: x.source1_voltage_l2n, label: "Source 1 voltage L2-N", table: holding, address: 0x0221, type: u16, unit: "V"}
  - {key: x.source1_voltage_l3n, label: "Source 1 voltage L3-N", table: holding, address: 0x0222, type: u16, unit: "V"}
  - {key: x.source1_voltage_u12, label: "Source 1 voltage U12", table: holding, address: 0x0223, type: u16, unit: "V"}
  - {key: x.source1_voltage_u23, label: "Source 1 voltage U23", table: holding, address: 0x0224, type: u16, unit: "V"}
  - {key: x.source1_voltage_u31, label: "Source 1 voltage U31", table: holding, address: 0x0225, type: u16, unit: "V"}
  - {key: x.source1_frequency, label: "Source 1 frequency", table: holding, address: 0x0226, type: u16, unit: "Hz", scale: 0.1}
  - {key: x.source1_ambient_temperature, label: "Ambient temperature SS1", table: holding, address: 0x0227, type: u16, unit: "°C", scale: 0.1}
  - {key: x.source2_voltage_l1n, label: "Source 2 voltage L1-N", table: holding, address: 0x0228, type: u16, unit: "V"}
  - {key: x.source2_voltage_l2n, label: "Source 2 voltage L2-N", table: holding, address: 0x0229, type: u16, unit: "V"}
  - {key: x.source2_voltage_l3n, label: "Source 2 voltage L3-N", table: holding, address: 0x022A, type: u16, unit: "V"}
  - {key: x.source2_voltage_u12, label: "Source 2 voltage U12", table: holding, address: 0x022B, type: u16, unit: "V"}
  - {key: x.source2_voltage_u23, label: "Source 2 voltage U23", table: holding, address: 0x022C, type: u16, unit: "V"}
  - {key: x.source2_voltage_u31, label: "Source 2 voltage U31", table: holding, address: 0x022D, type: u16, unit: "V"}
  - {key: x.source2_frequency, label: "Source 2 frequency", table: holding, address: 0x022E, type: u16, unit: "Hz", scale: 0.1}
  - {key: x.source2_ambient_temperature, label: "Ambient temperature SS2", table: holding, address: 0x022F, type: u16, unit: "°C", scale: 0.1}
  - {key: l1_voltage, label: "Output voltage L1", table: holding, address: 0x0230, type: u16, unit: "V"}
  - {key: l2_voltage, label: "Output voltage L2", table: holding, address: 0x0231, type: u16, unit: "V"}
  - {key: l3_voltage, label: "Output voltage L3", table: holding, address: 0x0232, type: u16, unit: "V"}
  - {key: x.output_voltage_u12, label: "Output voltage U12", table: holding, address: 0x0233, type: u16, unit: "V"}
  - {key: x.output_voltage_u23, label: "Output voltage U23", table: holding, address: 0x0234, type: u16, unit: "V"}
  - {key: x.output_voltage_u31, label: "Output voltage U31", table: holding, address: 0x0235, type: u16, unit: "V"}
  - {key: frequency, label: "Output frequency", table: holding, address: 0x0236, type: u16, unit: "Hz", scale: 0.1}
  - {key: l1_current, label: "Output current I1", table: holding, address: 0x0238, type: u16, unit: "A"}
  - {key: l2_current, label: "Output current I2", table: holding, address: 0x0239, type: u16, unit: "A"}
  - {key: l3_current, label: "Output current I3", table: holding, address: 0x023A, type: u16, unit: "A"}
  - {key: x.output_current_n, label: "Output current IN", table: holding, address: 0x023B, type: u16, unit: "A"}
  - {key: x.phase_shift_s1_s2, label: "Phase shift S1-S2", table: holding, address: 0x023F, type: s16, unit: "°", scale: 0.1}
  - {key: x.output_apparent_power_l1, label: "Output apparent power L1", table: holding, address: 0x0240, type: u16, unit: "kVA"}
  - {key: x.output_apparent_power_l2, label: "Output apparent power L2", table: holding, address: 0x0241, type: u16, unit: "kVA"}
  - {key: x.output_apparent_power_l3, label: "Output apparent power L3", table: holding, address: 0x0242, type: u16, unit: "kVA"}
  - {key: x.output_power_factor_l1, label: "Output power factor L1", table: holding, address: 0x0243, type: s16, scale: 0.01}
  - {key: x.output_power_factor_l2, label: "Output power factor L2", table: holding, address: 0x0244, type: s16, scale: 0.01}
  - {key: x.output_power_factor_l3, label: "Output power factor L3", table: holding, address: 0x0245, type: s16, scale: 0.01}
  - {key: x.output_crest_factor_l1, label: "Output crest factor L1", table: holding, address: 0x0248, type: u16, scale: 0.1}
  - {key: x.output_crest_factor_l2, label: "Output crest factor L2", table: holding, address: 0x0249, type: u16, scale: 0.1}
  - {key: x.output_crest_factor_l3, label: "Output crest factor L3", table: holding, address: 0x024A, type: u16, scale: 0.1}
  - {key: x.output_crest_factor_n, label: "Output crest factor N", table: holding, address: 0x024B, type: u16, scale: 0.1}
  - {key: temperature, label: "Ambient temperature", table: holding, address: 0x024F, type: u16, unit: "°C", scale: 0.1}
  - {key: x.output_active_power_l1, label: "Output active power L1", table: holding, address: 0x0250, type: u16, unit: "kW"}
  - {key: x.output_active_power_l2, label: "Output active power L2", table: holding, address: 0x0251, type: u16, unit: "kW"}
  - {key: x.output_active_power_l3, label: "Output active power L3", table: holding, address: 0x0252, type: u16, unit: "kW"}
  - {key: x.output_active_power, label: "Output active power, global", table: holding, address: 0x0253, type: u16, unit: "kW"}
  - {key: x.output_load_rate_l1, label: "Output load rate L1", table: holding, address: 0x0258, type: u16, unit: "%"}
  - {key: x.output_load_rate_l2, label: "Output load rate L2", table: holding, address: 0x0259, type: u16, unit: "%"}
  - {key: x.output_load_rate_l3, label: "Output load rate L3", table: holding, address: 0x025A, type: u16, unit: "%"}
  - {key: x.output_load_rate_n, label: "Output load rate N", table: holding, address: 0x025B, type: u16, unit: "%"}

  # Date and time
  - {key: x.clock, label: "Date and time", table: holding, address: 0x0360, type: datetime, length: 4, datetime: {minute: {register: 0, bits: [8, 15]}, second: {register: 0, bits: [0, 7]}, day: {register: 1, bits: [8, 15]}, hour: {register: 1, bits: [0, 7]}, month: {register: 2, bits: [8, 15]}, year: {register: 3, offset: 2000}}, poll: slow}

notes:
- The manual's measurements are 16-bit words; its format column gives the decimals used here. It marks M23, M28-M30, M38, M39, M44-M46, M52-M55 and M60-M63 unused or leaves them blank; M29 and M61 have a format or unit but no name there, so they are left out.
- "Read only here. The commands (0x0190, with the permission word at 0x0150) are left out on purpose: they include transferring the load and interrupting it. Writing the clock is also left out."
- The manual gives no identification rule, so this file has no identification. The default unit id isn't stated here; unit 1 is assumed.
