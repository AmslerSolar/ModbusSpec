  - {key: x.non_resettable_counter_1, label: Non-resettable counter 1, table: input, address: 414, type: s32, scale_exponent_from: {table: input, address: 405, type: s16}, models: [wm3], note: 'What it counts (active / reactive / apparent energy, import / export) is configured in the meter; see the counter''s unit and direction settings.'}

enums:
  counter_unit: {'0': none, '1': Wh, '2': varh, '3': VAh}
  counter_direction: {'3': export, '6': import, '9': export, '12': import, '15': bidirectional}
  inductive_capacitive: {'0': inductive}
  import_export: {'0': import}

notes:
- 'WM3: pyiskra''s settings read doesn''t cover non-resettable counter 1 (holding 461–462).'
- 'WM3: non-resettable counter 2 left out — pyiskra reads its exponent at 406, inside another counter''s value registers.'
- 'WM3: non-resettable counter 3 left out — pyiskra reads its exponent at 407, inside another counter''s value registers.'
- 'WM3: non-resettable counter 4 left out — pyiskra reads its exponent at 408, inside another counter''s value registers.'
- 'pyiskra''s defaults: unit 33, TCP port 10001, serial 115200 baud 8N2; at most 120 registers per request.'
- The averaged, maximum and minimum measurements are the same block shifted by 5400, 5500 and 5600 (not listed).
- Identification as pyiskra recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
