  - {key: x.resettable_counter_1, label: Resettable counter 1, table: input, address: 406, type: s32, scale_exponent_from: {table: input, address: 401, type: s16}, models: [wm1, wm3], note: 'What it counts (active / reactive / apparent energy, import / export) is configured in the meter; see the counter''s unit and direction settings.'}
  - {key: x.non_resettable_counter_2, label: Non-resettable counter 2, table: input, address: 408, type: s32, scale_exponent_from: {table: input, address: 402, type: s16}, models: [wm3m4], note: 'What it counts (active / reactive / apparent energy, import / export) is configured in the meter; see the counter''s unit and direction settings.'}
  - {key: x.resettable_counter_2, label: Resettable counter 2, table: input, address: 408, type: s32, scale_exponent_from: {table: input, address: 402, type: s16}, models: [wm1, wm3], note: 'What it counts (active / reactive / apparent energy, import / export) is configured in the meter; see the counter''s unit and direction settings.'}
  - {key: x.resettable_counter_3, label: Resettable counter 3, table: input, address: 410, type: s32, scale_exponent_from: {table: input, address: 403, type: s16}, models: [wm1, wm3], note: 'What it counts (active / reactive / apparent energy, import / export) is configured in the meter; see the counter''s unit and direction settings.'}
