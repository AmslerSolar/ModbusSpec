modbusspec: 0
id: iskra-wm
manufacturer: Iskra
name: WM energy meters (WM1, WM3, WM3M4)
kind: meter

sources:
- id: pyiskra
  title: pyiskra (Python library, used by Home Assistant's iskra)
  url: https://github.com/Iskramis/pyiskra
  license: MIT
  commit: cd23e27a44a8265b406c426dad21efead22e39f9
  path: pyiskra/devices/WM.py, pyiskra/adapters/Modbus.py, pyiskra/helper.py

connection:
  default_port: 10001
  default_unit: 33
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N2
  limits:
    max_registers: 120

encoding:
  word_order: big

identify:
  serial:
    table: input
    address: 9
    type: str
    length: 4
  any:
  - table: input
    address: 1
    type: str
    length: 8
    prefix: WM3M4
  - table: input
    address: 1
    type: str
    length: 8
    prefix: WM3
  - table: input
    address: 1
    type: str
    length: 8
    prefix: WM1

defaults:
  verified: false
  sources:
  - pyiskra

models:
  - {id: wm3m4, name: WM3M4, match: {table: input, address: 1, type: str, length: 8, prefix: WM3M4}}
  - {id: wm3, name: WM3, match: {table: input, address: 1, type: str, length: 8, prefix: WM3}}
  - {id: wm1, name: WM1, match: {table: input, address: 1, type: str, length: 8, prefix: WM1}}

points:
  - {key: x.description, label: Description, table: holding, address: 101, type: str, length: 20}
  - {key: x.location, label: Location, table: holding, address: 121, type: str, length: 20}
  - {key: x.reverse_connection, label: Reverse connection, table: holding, address: 151, type: u16, bits: [1, 1], note: 'When set, pyiskra swaps the import and export direction of the counters.'}
  - {key: x.non_resettable_counter_1_unit, label: Non-resettable counter 1 unit, table: holding, address: 421, type: u16, bits: [0, 1], enum: counter_unit, models: [wm3m4]}
  - {key: x.resettable_counter_1_unit, label: Resettable counter 1 unit, table: holding, address: 421, type: u16, bits: [0, 1], enum: counter_unit, models: [wm1, wm3]}
  - {key: x.non_resettable_counter_1_direction, label: Non-resettable counter 1 quadrants, table: holding, address: 422, type: u16, bits: [0, 3], enum: counter_direction, models: [wm3m4]}
  - {key: x.resettable_counter_1_direction, label: Resettable counter 1 quadrants, table: holding, address: 422, type: u16, bits: [0, 3], enum: counter_direction, models: [wm1, wm3]}
  - {key: x.non_resettable_counter_2_unit, label: Non-resettable counter 2 unit, table: holding, address: 431, type: u16, bits: [0, 1], enum: counter_unit, models: [wm3m4]}
  - {key: x.resettable_counter_2_unit, label: Resettable counter 2 unit, table: holding, address: 431, type: u16, bits: [0, 1], enum: counter_unit, models: [wm1, wm3]}
  - {key: x.non_resettable_counter_2_direction, label: Non-resettable counter 2 quadrants, table: holding, address: 432, type: u16, bits: [0, 3], enum: counter_direction, models: [wm3m4]}
  - {key: x.resettable_counter_2_direction, label: Resettable counter 2 quadrants, table: holding, address: 432, type: u16, bits: [0, 3], enum: counter_direction, models: [wm1, wm3]}
  - {key: x.resettable_counter_3_unit, label: Resettable counter 3 unit, table: holding, address: 441, type: u16, bits: [0, 1], enum: counter_unit, models: [wm1, wm3]}
  - {key: x.resettable_counter_3_direction, label: Resettable counter 3 quadrants, table: holding, address: 442, type: u16, bits: [0, 3], enum: counter_direction, models: [wm1, wm3]}
