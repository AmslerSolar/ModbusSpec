  - {key: x.power_factor_l2_inductive_capacitive, label: Power factor L2 inductive/capacitive, table: input, address: 168, type: u32, bits: [16, 23], enum: inductive_capacitive, models: [wm3, wm3m4]}
  - {key: x.power_factor_l2_import_export, label: Power factor L2 import/export, table: input, address: 168, type: u32, bits: [24, 31], enum: import_export, models: [wm3, wm3m4]}
  - {key: x.power_factor_l3, label: Power factor L3, table: input, address: 170, type: u32, scale: 0.0001, bits: [0, 15], models: [wm3, wm3m4], note: 'Iskra T7: power factor magnitude in bits 0–15; bits 16–23 say inductive (0) or capacitive, bits 24–31 import (0) or export.'}
