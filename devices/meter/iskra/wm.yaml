  - {key: x.non_resettable_counter_1_direction, label: Non-resettable counter 1 quadrants, table: holding, address: 462, type: u16, bits: [0, 3], enum: counter_direction, models: [wm3]}
  - {key: x.model, label: Model, table: input, address: 1, type: str, length: 8}
  - {key: serial, label: Serial, table: input, address: 9, type: str, length: 4}
  - {key: firmware, label: Sw ver, table: input, address: 13, type: u16, scale: 0.01}
  - {key: frequency, label: Frequency, table: input, address: 105, type: u32, unit: Hz, scale_exponent_from: {table: input, address: 105, type: u16, bits: [8, 15], signed: true}, bits: [0, 23]}
