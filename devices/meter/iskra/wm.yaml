  - {key: l3_current, label: Current L3, table: input, address: 130, type: u32, unit: A, scale_exponent_from: {table: input, address: 130, type: u16, bits: [8, 15], signed: true}, bits: [0, 23], models: [wm3, wm3m4]}
  - {key: x.active_power_total, label: Active power total, table: input, address: 140, type: u32, unit: W, scale_exponent_from: {table: input, address: 140, type: u16, bits: [8, 15], signed: true}, bits: [0, 23], signed: true}
  - {key: x.active_power_l1, label: Active power L1, table: input, address: 142, type: u32, unit: W, scale_exponent_from: {table: input, address: 142, type: u16, bits: [8, 15], signed: true}, bits: [0, 23], signed: true}
  - {key: x.active_power_l2, label: Active power L2, table: input, address: 144, type: u32, unit: W, scale_exponent_from: {table: input, address: 144, type: u16, bits: [8, 15], signed: true}, bits: [0, 23], signed: true, models: [wm3, wm3m4]}
