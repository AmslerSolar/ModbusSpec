  - {key: x.apparent_power_l2, label: Apparent power L2, table: input, address: 160, type: u32, unit: VA, scale_exponent_from: {table: input, address: 160, type: u16, bits: [8, 15], signed: true}, bits: [0, 23], models: [wm3, wm3m4]}
