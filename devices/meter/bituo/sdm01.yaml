modbusspec: 0
id: bituo-sdm01
manufacturer: Bituo Technik
name: SDM01 series three-phase smart meter
kind: meter

sources:
- title: Bituo Technik SDM01 Modbus RTU Map
  url: https://docs.bituo-technik.com/device-api/sdm01-modbus-rtu-map.md
  sha256: 8bdac97aad5d6c22f80fecf469ead5069b11280cbe299e9b7821ffeb33862910
  date: '2026-04-01'
  language: en
  devices: [SDM01-TWM-12TS, SDM01-TWM-20TS, SDM01-TWM-12, SDM01-TWM-20, SDM01-TZM-12, SDM01-TZM-20, SDM01-EWM-12, SDM01-EWM-20, SDM01-TZM-12-U01, SDM01-TZM-20-U01]

connection:
  default_port: 502
  default_unit: 247
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  input_equals_holding: true
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 125
    type: str
    length: 5
  checks:
  # "or custom": a meter sold under another name won't pass this
  - table: holding
    address: 120
    type: str
    length: 5
    prefix: SDM01
  - table: holding
    address: 1052
    type: f32
    range:
    - 0
    - 70

