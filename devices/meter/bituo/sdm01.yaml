  - {key: x.l2_export_energy, label: Phase B Export Active Energy, table: holding, address: 1068, type: f32, unit: kWh, poll: slow}
  - {key: x.l2_import_export_energy, label: 'Phase B Import & Export Active Energy', table: holding, address: 1070, type: f32, unit: kWh, poll: slow}
  - {key: x.l3_import_energy, label: Phase C Import Active Energy, table: holding, address: 1072, type: f32, unit: kWh, poll: slow}
  - {key: x.l3_export_energy, label: Phase C Export Active Energy, table: holding, address: 1074, type: f32, unit: kWh, poll: slow}
  - {key: x.l3_import_export_energy, label: 'Phase C Import & Export Active Energy', table: holding, address: 1076, type: f32, unit: kWh, poll: slow}
