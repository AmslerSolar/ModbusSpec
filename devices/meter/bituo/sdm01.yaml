  - {key: x.reset_energy, label: Reset Energy Accumulators, table: holding, address: 10001, type: u16, writable: true, write_only: true, min: 20906, max: 20906, note: 'Write 0x51AA: clears the energy counters.'}

enums:
  baud_rate: {'0': '9600', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400'}
  framing: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}

notes:
- 'The document says addresses are 0-based protocol addresses, floats are big-endian (ABCD), and functions 03 and 04 both read, 06 and 16 write.'
- 'The factory default address is 247, outside the 1–246 the document calls valid for writing.'
- 'The product id, manufacturer and meter type can be customised; the identify check needs the product id to start with SDM01.'
- 'Broadcast address assignment isn''t a point: to unit 0, function 16, register 30000, write 0x55AA and the new address; only a meter with its reset button held takes it.'
- 'The document says the meters also answer other register maps by themselves (all: Eastron SDM630MCT and ABB B23; EWM and TZM-U01 models also CHINT DTSU666) for core values. Those maps aren''t described here, and a search could report such a meter as one of those.'
- 'RS485 is the only Modbus connection in the document; the Wi-Fi and Zigbee links aren''t Modbus. The port and 125 registers per request are assumed.'
- The serial number register is writable with function 16 per the document; it is read only here on purpose.
