modbusspec: 0
id: studer-next-acsource
manufacturer: Studer Innotec
name: Next AC source / grid values (unit id 7)
kind: meter

sources:
- id: studer-innotec-next3-ha
  title: Studer-Innotec-next3-HA (Home Assistant integration)
  url: https://github.com/anakinch75/Studer-Innotec-next3-HA
  license: MIT
  commit: 1c2a5eedb9816928609ba0bfb789fd128a774f7c
  path: custom_components/studer_next3/const.py

connection:
  default_port: 502
  default_unit: 7
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - studer-innotec-next3-ha

points:
  - {key: frequency, label: Grid Frequency, table: holding, address: 0, type: f32, unit: Hz}
  - {key: x.grid_voltage, label: Grid Voltage, table: holding, address: 2, type: f32, unit: V}
  - {key: grid_power, label: AC-Source Active Power, table: holding, address: 8, type: f32, unit: W, positive: import}
  - {key: grid_import_energy, label: AC-Source Consumed Energy, table: holding, address: 24, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: grid_export_energy, label: AC-Source Produced Energy, table: holding, address: 36, type: f64, unit: kWh, scale: 0.001, note: The register holds Wh.}
  - {key: x.grid_feeding_allowed, label: Grid-Feeding Allowed, table: holding, address: 1815, type: u16, writable: true, note: '0 = off, 1 = on.'}

notes:
- 'A Next system answers on several unit ids: 1 = system totals, 2 = battery, 7 = AC source (grid), 14 = the Next3 device,
  29 = the Next1 device. Each is its own device here.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
