modbusspec: 0
id: wago-879-30xx
manufacturer: WAGO
name: 879-30xx energy meters
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/wago87930.go

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  checks:
  - - table: holding
      address: 20480
      type: f32
      range:
      - 99.0
      - 121.0
    - table: holding
      address: 20480
      type: f32
      range:
      - 207.0
      - 253.0

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: x.voltage, label: Voltage, table: holding, address: 20480, type: f32, unit: V}
  - {key: l1_voltage, label: L1 Voltage, table: holding, address: 20482, type: f32, unit: V}
  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 20484, type: f32, unit: V}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 20486, type: f32, unit: V}
  - {key: frequency, label: Frequency, table: holding, address: 20488, type: f32, unit: Hz}
  - {key: x.current, label: Current, table: holding, address: 20490, type: f32, unit: A}
  - {key: l1_current, label: L1 Current, table: holding, address: 20492, type: f32, unit: A}
  - {key: l2_current, label: L2 Current, table: holding, address: 20494, type: f32, unit: A}
  - {key: l3_current, label: L3 Current, table: holding, address: 20496, type: f32, unit: A}
  - {key: x.power, label: Power, table: holding, address: 20498, type: f32, unit: W, scale: 1000}
  - {key: x.power_l1, label: L1 Power, table: holding, address: 20500, type: f32, unit: W, scale: 1000}
  - {key: x.power_l2, label: L2 Power, table: holding, address: 20502, type: f32, unit: W, scale: 1000}
  - {key: x.power_l3, label: L3 Power, table: holding, address: 20504, type: f32, unit: W, scale: 1000}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 20506, type: f32, unit: var, scale: 1000}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: holding, address: 20508, type: f32, unit: var, scale: 1000}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: holding, address: 20510, type: f32, unit: var, scale: 1000}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: holding, address: 20512, type: f32, unit: var, scale: 1000}
  - {key: apparent_power, label: Apparent Power, table: holding, address: 20514, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l1, label: L1 Apparent Power, table: holding, address: 20516, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l2, label: L2 Apparent Power, table: holding, address: 20518, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l3, label: L3 Apparent Power, table: holding, address: 20520, type: f32, unit: VA, scale: 1000}
  - {key: power_factor, label: Cosphi, table: holding, address: 20522, type: f32}
  - {key: x.cosphi_l1, label: L1 Cosphi, table: holding, address: 20524, type: f32}
  - {key: x.cosphi_l2, label: L2 Cosphi, table: holding, address: 20526, type: f32}
  - {key: x.cosphi_l3, label: L3 Cosphi, table: holding, address: 20528, type: f32}
  - {key: grid_import_energy, label: Total Import, table: holding, address: 24588, type: f32, unit: kWh}
  - {key: x.import_l1, label: L1 Import, table: holding, address: 24594, type: f32, unit: kWh}
  - {key: x.import_l2, label: L2 Import, table: holding, address: 24596, type: f32, unit: kWh}
  - {key: x.import_l3, label: L3 Import, table: holding, address: 24598, type: f32, unit: kWh}
  - {key: grid_export_energy, label: Total Export, table: holding, address: 24600, type: f32, unit: kWh}
  - {key: x.export_l1, label: L1 Export, table: holding, address: 24606, type: f32, unit: kWh}
  - {key: x.export_l2, label: L2 Export, table: holding, address: 24608, type: f32, unit: kWh}
  - {key: x.export_l3, label: L3 Export, table: holding, address: 24610, type: f32, unit: kWh}

notes:
- mbmd (type code WAGO87930) detects the meter by reading Voltage (holding register 20480, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
