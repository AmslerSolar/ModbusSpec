# Written from the Huawei SmartLogger ModBus Interface Definitions (issue 35, 2020-02-20).

modbusspec: 0
id: huawei-smartlogger-meter
manufacturer: Huawei
name: Power meter connected to a SmartLogger
kind: meter

sources:
- title: SmartLogger ModBus Interface Definitions
  version: Issue 35 (2020-02-20)
  url: https://github.com/bohdan-s/Sungrow-Inverter/blob/755ae6fda3e9f2c897ccd11427e2d5df050409ee/Modbus%20Information/SmartLogger%20ModBus%20Interface%20Definitions.pdf
  sha256: 87a0b6d3b183df1d558659be610f865f0b0941387461d21e048e7212cc88dadb
- id: huawei-solar
  title: huawei-solar-lib (Python library used by Home Assistant)
  url: https://github.com/wlcrs/huawei-solar-lib
  license: AGPL-3.0
  commit: 19dfcfb642f362890b037ce781fb93c396fabc2e
  path: src/huawei_solar/registers.py, src/huawei_solar/register_names.py, src/huawei_solar/register_values.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  any:
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: PowerMeter
  - table: holding
    address: 30000
    type: str
    length: 15
    prefix: Meter
  - - table: holding
      address: 30000
      type: str
      length: 15
      answers: false
    - table: holding
      address: 40713
      type: str
      length: 10
      answers: false
    - table: holding
      address: 32278
      type: s32
      answers: true


points:
  - {key: l1_voltage, label: Phase A voltage, table: holding, address: 32260, type: u32, unit: V, scale: 0.01}
  - {key: l2_voltage, label: Phase B voltage, table: holding, address: 32262, type: u32, unit: V, scale: 0.01}
  - {key: l3_voltage, label: Phase C voltage, table: holding, address: 32264, type: u32, unit: V, scale: 0.01}
  - {key: x.line_voltage_l1_l2, label: A-B line voltage, table: holding, address: 32266, type: u32, unit: V, scale: 0.01}
  - {key: x.line_voltage_l2_l3, label: B-C line voltage, table: holding, address: 32268, type: u32, unit: V, scale: 0.01}
  - {key: x.line_voltage_l3_l1, label: C-A line voltage, table: holding, address: 32270, type: u32, unit: V, scale: 0.01}
  - {key: l1_current, label: Phase A current, table: holding, address: 32272, type: s32, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase B current, table: holding, address: 32274, type: s32, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase C current, table: holding, address: 32276, type: s32, unit: A, scale: 0.1}
  - {key: grid_power, label: Active power, table: holding, address: 32278, type: s32, unit: W, positive: import, note: The document gives no sign; positive = import (from the grid) assumed., verified: false}
  - {key: reactive_power, label: Reactive power, table: holding, address: 32280, type: s32, unit: var}
  - {key: power_factor, label: Power factor, table: holding, address: 32284, type: s16, scale: 0.001}
  - {key: apparent_power, label: Apparent power, table: holding, address: 32287, type: s32, unit: VA}
  - {key: l1_power, label: Phase A active power, table: holding, address: 32335, type: s32, unit: W, positive: import, note: Sign not stated; taken like 32278 (assumed)., verified: false}
  - {key: l2_power, label: Phase B active power, table: holding, address: 32337, type: s32, unit: W, positive: import, note: Sign not stated; taken like 32278 (assumed)., verified: false}
  - {key: l3_power, label: Phase C active power, table: holding, address: 32339, type: s32, unit: W, positive: import, note: Sign not stated; taken like 32278 (assumed)., verified: false}
  - {key: x.total_active_energy, label: Total active electricity, table: holding, address: 32341, type: s64, unit: kWh, scale: 0.01, poll: slow}
