notes:
- 'Read through the SmartLogger over Modbus TCP: the unit id is the meter''s RS485 address as set on the SmartLogger (not
  fixed; 1 assumed here). All registers are holding registers (function 03).'
- Signs of the active power and which of the positive / negative energy counters is import aren't stated in the document;
  the assumptions are marked unverified.
- 'Left out: the registers the document marks as reserved (32282, 32285, 32289, 32291), the price-segment counters 32299–32313
  (DL/T 645 meters only) and the ten custom values 32315–32333.'
- 'No identification registers: the meter''s model and serial number are only known from the SmartLogger''s device list.'
- Identification as huawei-solar recognises the device (not checked against a document).
- huawei-solar-lib reads and writes everything as holding registers (function 03, writes 06/16).
- Huawei devices accept only one Modbus TCP connection at a time.
- The library waits 1 s after connecting and 50 ms between requests.
- Read at the meter's own unit id behind a SmartLogger; detected by reading 32278 (active power). Model name and serial number
  are only available through the SmartLogger's device list.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
