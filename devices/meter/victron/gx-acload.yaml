# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-acload
manufacturer: Victron Energy
name: 'GX Modbus-TCP: AC load meter (com.victronenergy.acload)'
kind: meter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/victron-gx.yaml
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 3903
    type: str
    length: 7

points:
  - {key: x.ac_l1_power_3900, label: L1 Power, table: holding, address: 3900, type: u16, unit: W, verified: false, note: attributes.csv gives int16.}
  - {key: x.ac_l2_power_3901, label: L2 Power, table: holding, address: 3901, type: u16, unit: W, verified: false, note: attributes.csv gives int16.}
  - {key: x.ac_l3_power_3902, label: L3 Power, table: holding, address: 3902, type: u16, unit: W, verified: false, note: attributes.csv gives int16.}
  - {key: serial, label: Serial number, table: holding, address: 3903, type: str, length: 7, poll: slow}
  - {key: l1_voltage, label: L1 Voltage, table: holding, address: 3910, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: L1 Current, table: holding, address: 3911, type: s16, unit: A, scale: 0.1}
  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 3912, type: u16, unit: V, scale: 0.1}
  - {key: l2_current, label: L2 Current, table: holding, address: 3913, type: s16, unit: A, scale: 0.1}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 3914, type: u16, unit: V, scale: 0.1}
  - {key: l3_current, label: L3 Current, table: holding, address: 3915, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_l1_energy_forward, label: L1 Energy, table: holding, address: 3916, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l2_energy_forward, label: L2 Energy, table: holding, address: 3918, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l3_energy_forward, label: L3 Energy, table: holding, address: 3920, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: frequency, label: AC Frequency, table: holding, address: 3922, type: u16, unit: Hz, scale: 0.01}
  - {key: x.ac_l1_power, label: L1 Power, table: holding, address: 3924, type: s32, unit: W}
  - {key: x.ac_l2_power, label: L2 Power, table: holding, address: 3926, type: s32, unit: W}
  - {key: x.ac_l3_power, label: L3 Power, table: holding, address: 3928, type: s32, unit: W}
  - {key: x.ac_l1_power_factor, label: L1 Power Factor, table: holding, address: 3930, type: s16, scale: 0.001}
  - {key: x.ac_l2_power_factor, label: L2 Power Factor, table: holding, address: 3931, type: s16, scale: 0.001}
  - {key: x.ac_l3_power_factor, label: L3 Power Factor, table: holding, address: 3932, type: s16, scale: 0.001}
  - {key: power_factor, label: Total Power Factor, table: holding, address: 3933, type: s16, scale: 0.001}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 3940, type: str, length: 8, writable: true, poll: slow}
  - {key: x.charge_l1_voltage, label: Charger meter L1 voltage, table: input, address: 3910, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_l1_current, label: Charger meter L1 current, table: input, address: 3911, type: s16, unit: A, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_l2_voltage, label: Charger meter L2 voltage, table: input, address: 3912, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_l2_current, label: Charger meter L2 current, table: input, address: 3913, type: s16, unit: A, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_l3_voltage, label: Charger meter L3 voltage, table: input, address: 3914, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_l3_current, label: Charger meter L3 current, table: input, address: 3915, type: s16, unit: A, scale: 0.1, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_energy_1, label: Charger meter energy (part 1), table: input, address: 3916, type: u32, unit: kWh, scale: 0.01, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_energy_2, label: Charger meter energy (part 2), table: input, address: 3918, type: u32, unit: kWh, scale: 0.01, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_energy_3, label: Charger meter energy (part 3), table: input, address: 3920, type: u32, unit: kWh, scale: 0.01, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_power_1, label: Charger meter power (part 1), table: input, address: 3924, type: s32, unit: W, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_power_2, label: Charger meter power (part 2), table: input, address: 3926, type: s32, unit: W, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}
  - {key: x.charge_power_3, label: Charger meter power (part 3), table: input, address: 3928, type: s32, unit: W, note: 'evcc reads it for the usages charge, aux.', verified: false, sources: [evcc]}

derived:
  - {key: x.charge_power, label: Charger meter power, unit: W, sum: [{key: x.charge_power_1}, {key: x.charge_power_2}, {key: x.charge_power_3}], verified: false, sources: [evcc]}
  - {key: x.charge_energy, label: Charger meter energy, unit: kWh, sum: [{key: x.charge_energy_1}, {key: x.charge_energy_2}, {key: x.charge_energy_3}], verified: false, sources: [evcc]}

notes:
- 'No fixed unit id: the GX assigns them (since Venus OS 2.60), normally the device instance; see Settings → Integrations
  → Modbus TCP server → Available services. 1 is only a placeholder.'
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- 'evcc template `victron-gx` (charge, aux) lists: Victron AC load meter on GX device.'
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
