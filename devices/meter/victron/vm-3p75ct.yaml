modbusspec: 0
id: victron-vm-3p75ct
manufacturer: Victron Energy
name: Energy Meter VM-3P75CT
kind: meter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/victron/victron_3p75ct

connection:
  default_port: 502
  default_unit: 1
  transports:
  - udp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: frequency, label: Counter frequency, table: holding, address: 12338, type: u16, unit: Hz, scale: 0.01}
  - {key: grid_import_energy, label: Counter imported energy, table: holding, address: 12340, type: u32, unit: kWh, scale: 0.01}
  - {key: grid_export_energy, label: Counter exported energy, table: holding, address: 12342, type: u32, unit: kWh, scale: 0.01}
  - {key: l1_voltage, label: Counter voltage L1, table: holding, address: 12352, type: s16, unit: V, scale: 0.01}
  - {key: l1_current, label: Counter current L1, table: holding, address: 12353, type: s16, unit: A, scale: 0.01}
  - {key: x.counter_power_factors_l1, label: Counter power factor L1, table: holding, address: 12359, type: s16, scale: 0.001}
  - {key: l2_voltage, label: Counter voltage L2, table: holding, address: 12360, type: s16, unit: V, scale: 0.01}
  - {key: l2_current, label: Counter current L2, table: holding, address: 12361, type: s16, unit: A, scale: 0.01}
  - {key: x.counter_power_factors_l2, label: Counter power factor L2, table: holding, address: 12367, type: s16, scale: 0.001}
  - {key: l3_voltage, label: Counter voltage L3, table: holding, address: 12368, type: s16, unit: V, scale: 0.01}
  - {key: l3_current, label: Counter current L3, table: holding, address: 12369, type: s16, unit: A, scale: 0.01}
  - {key: x.counter_power_factors_l3, label: Counter power factor L3, table: holding, address: 12375, type: s16, scale: 0.001}
  - {key: l1_power, label: Counter power L1, table: holding, address: 12418, type: s32, unit: W, positive: import}
  - {key: l2_power, label: Counter power L2, table: holding, address: 12422, type: s32, unit: W, positive: import}
  - {key: l3_power, label: Counter power L3, table: holding, address: 12426, type: s32, unit: W, positive: import}

derived:
  - {key: grid_power, label: Counter power, unit: W, positive: import, sum: [{key: l1_power}, {key: l2_power}, {key: l3_power}]}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
