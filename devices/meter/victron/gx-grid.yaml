# Written from Victron's GX Modbus-TCP register list dbus_modbustcp 744e228 (revision 55) and dbus_modbustcp's attributes.csv.

modbusspec: 0
id: victron-gx-grid
manufacturer: Victron Energy
name: 'GX Modbus-TCP: grid meter (com.victronenergy.grid)'
kind: meter

sources:
- title: Victron GX Modbus-TCP register list (CCGX-Modbus-TCP-register-list)
  version: dbus_modbustcp 744e228 (revision 55)
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/CCGX-Modbus-TCP-register-list.xlsx
- title: dbus_modbustcp attributes.csv (Victron's register table in the Modbus-TCP service source)
  version: commit 744e228
  url: https://github.com/victronenergy/dbus_modbustcp/blob/744e228f4124c233367d00e3a7d245e0139bfcb6/attributes.csv
- id: hass-victron
  title: hass-victron (Home Assistant integration)
  url: https://github.com/sfstar/hass-victron
  license: Apache-2.0
  commit: 3d3ec1e6cb7768d3c6d49ed23e9b52814477c205
  path: custom_components/victron/const.py
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.victron
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/victron/victron

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 2609
    type: str
    length: 7

points:
  - {key: x.ac_l1_power, label: Grid L1 - Power, table: holding, address: 2600, type: s16, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: x.ac_l2_power, label: Grid L2 - Power, table: holding, address: 2601, type: s16, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: x.ac_l3_power, label: Grid L3 - Power, table: holding, address: 2602, type: s16, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: x.ac_l1_energy_forward_2603, label: Grid L1 - Energy from net, table: holding, address: 2603, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l2_energy_forward_2604, label: Grid L2 - Energy from net, table: holding, address: 2604, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l3_energy_forward_2605, label: Grid L3 - Energy from net, table: holding, address: 2605, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l1_energy_reverse_2606, label: Grid L1 - Energy to net, table: holding, address: 2606, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l2_energy_reverse_2607, label: Grid L2 - Energy to net, table: holding, address: 2607, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l3_energy_reverse_2608, label: Grid L3 - Energy to net, table: holding, address: 2608, type: u16, unit: kWh, scale: 0.01, poll: slow}
  - {key: serial, label: Serial, table: holding, address: 2609, type: str, length: 7, poll: slow}
  - {key: l1_voltage, label: Grid L1 – Voltage, table: holding, address: 2616, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Grid L1 – Current, table: holding, address: 2617, type: s16, unit: A, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 – Voltage, table: holding, address: 2618, type: u16, unit: V, scale: 0.1}
  - {key: l2_current, label: Grid L2 – Current, table: holding, address: 2619, type: s16, unit: A, scale: 0.1}
  - {key: l3_voltage, label: Grid L3 – Voltage, table: holding, address: 2620, type: u16, unit: V, scale: 0.1}
  - {key: l3_current, label: Grid L3 – Current, table: holding, address: 2621, type: s16, unit: A, scale: 0.1}
  - {key: x.ac_l1_energy_forward, label: Grid L1 - Energy from net, table: holding, address: 2622, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l2_energy_forward, label: Grid L2 - Energy from net, table: holding, address: 2624, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l3_energy_forward, label: Grid L3 - Energy from net, table: holding, address: 2626, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l1_energy_reverse, label: Grid L1 - Energy to net, table: holding, address: 2628, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l2_energy_reverse, label: Grid L2 - Energy to net, table: holding, address: 2630, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.ac_l3_energy_reverse, label: Grid L3 - Energy to net, table: holding, address: 2632, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_import_energy, label: Total Energy from net, table: holding, address: 2634, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'May differ from the sum of the phase counters, depending on the meter.'}
  - {key: grid_export_energy, label: Total Energy to net, table: holding, address: 2636, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: l1_power, label: Grid L1 - Power, table: holding, address: 2638, type: s32, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: l2_power, label: Grid L2 - Power, table: holding, address: 2640, type: s32, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: l3_power, label: Grid L3 - Power, table: holding, address: 2642, type: s32, unit: W, positive: import, verified: false, note: 'The list gives no sign for grid meter power; positive = import as in the system service''s grid values (820–822, 908–912), which the list states.'}
  - {key: frequency, label: AC Frequency, table: holding, address: 2644, type: u16, unit: Hz, scale: 0.01}
  - {key: x.ac_l1_power_factor, label: L1 Power Factor, table: holding, address: 2645, type: s16, scale: 0.001}
  - {key: x.ac_l2_power_factor, label: L2 Power Factor, table: holding, address: 2646, type: s16, scale: 0.001}
  - {key: x.ac_l3_power_factor, label: L3 Power Factor, table: holding, address: 2647, type: s16, scale: 0.001}
  - {key: power_factor, label: Total Power Factor, table: holding, address: 2648, type: s16, scale: 0.001}
  - {key: x.custom_name, label: Custom Name, table: holding, address: 2650, type: str, length: 8, writable: true, poll: slow}

derived:
  - {key: grid_power, label: Counter power, unit: W, positive: import, sum: [{key: x.ac_l1_power}, {key: x.ac_l2_power}, {key: x.ac_l3_power}], verified: false, sources: [openwb]}

notes:
- 'No fixed unit id: the GX assigns them (since Venus OS 2.60), normally the device instance; see Settings → Integrations
  → Modbus TCP server → Available services. 1 is only a placeholder.'
- Addresses are the list's numbers, which are the protocol addresses (no 30001/40001 offset); read them as holding registers
  (function 03). Strings carry two characters per register, first character in the high byte.
- Registers the device or firmware doesn't have make the GX answer the whole request with an exception; read them in separate
  requests or skip them.
- Taken from the register list dbus_modbustcp 744e228 (revision 55); attributes.csv (Victron's dbus_modbustcp source) filled
  in what the list leaves out.
- The unit id is the GX device instance of this service; hass-victron finds it by scanning a fixed list of unit ids.
- hass-victron decodes each register set by position and lists L3 forward energy (2605) before L2 (2604), so it shows the
  two swapped. The declared addresses are used here.
