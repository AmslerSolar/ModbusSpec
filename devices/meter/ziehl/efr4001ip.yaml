modbusspec: 0
id: ziehl-efr4001ip
manufacturer: Ziehl
name: EFR4001IP energy meter
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.ziehl/src/io/openems/edge/meter/ziehl/efr4001ip/MeterZiehlEfr4001IpImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 176, type: u32, unit: V, scale: 0.1, word_order: little}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 178, type: u32, unit: V, scale: 0.1, word_order: little}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 180, type: u32, unit: V, scale: 0.1, word_order: little}
  - {key: l1_current, label: Current L1, table: holding, address: 182, type: u32, unit: A, scale: 0.001, word_order: little}
  - {key: l2_current, label: Current L2, table: holding, address: 184, type: u32, unit: A, scale: 0.001, word_order: little}
  - {key: l3_current, label: Current L3, table: holding, address: 186, type: u32, unit: A, scale: 0.001, word_order: little}
  - {key: l1_power, label: Active Power L1, table: holding, address: 188, type: s32, unit: W, word_order: little, positive: import}
  - {key: l2_power, label: Active Power L2, table: holding, address: 190, type: s32, unit: W, word_order: little, positive: import}
  - {key: l3_power, label: Active Power L3, table: holding, address: 192, type: s32, unit: W, word_order: little, positive: import}
  - {key: grid_power, label: Active Power, table: holding, address: 194, type: s32, unit: W, word_order: little, positive: import}
  - {key: x.reactive_power_l1, label: Reactive Power L1, table: holding, address: 196, type: s32, unit: var, word_order: little}
  - {key: x.reactive_power_l2, label: Reactive Power L2, table: holding, address: 198, type: s32, unit: var, word_order: little}
  - {key: x.reactive_power_l3, label: Reactive Power L3, table: holding, address: 200, type: s32, unit: var, word_order: little}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 202, type: s32, unit: var, word_order: little}
  - {key: frequency, label: Frequency, table: holding, address: 218, type: s32, unit: Hz, scale: 0.01, word_order: little}
  - {key: x.active_production_energy_l1, label: Active Production Energy L1, table: holding, address: 342, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_production_energy_l2, label: Active Production Energy L2, table: holding, address: 344, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_production_energy_l3, label: Active Production Energy L3, table: holding, address: 346, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_production_energy, label: Active Production Energy, table: holding, address: 348, type: s32, unit: kWh, scale: 0.001, word_order: little, note: 'No import/export key: the block the driver names ''feed-in'' is read as OpenEMS production energy.'}
  - {key: x.active_consumption_energy_l1, label: Active Consumption Energy L1, table: holding, address: 350, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_consumption_energy_l2, label: Active Consumption Energy L2, table: holding, address: 352, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_consumption_energy_l3, label: Active Consumption Energy L3, table: holding, address: 354, type: s32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_consumption_energy, label: Active Consumption Energy, table: holding, address: 356, type: s32, unit: kWh, scale: 0.001, word_order: little, note: 'No import/export key: the block the driver names ''feed-in'' is read as OpenEMS production energy.'}

notes:
- The driver notes that the EFR4000IP has the same blocks at 0x0000 and 0x0084 instead of 0x00B0 and 0x0156.
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
