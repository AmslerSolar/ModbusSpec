modbusspec: 0
id: kostal-ksem
manufacturer: KOSTAL
name: KOSTAL Smart Energy Meter (KSEM G1 / G2)
kind: meter

sources:
- title: KSEM G1/G2 KOSTAL Smart Energy Meter, Interface Description MODBUS
  version: 13.03.2025, SW 2.6.0
  url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/BA_KOSTAL_Interface_KSEM_EN.pdf
  sha256: 1bd9a850dd89524648fae1aaecd55b007eadb5b4db7af7cfebc83c8cf0cacb90
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/keba/keba_e10, packages/modules/devices/kostal/kostal_sem
- id: smarthomeng
  title: SmartHomeNG plugins
  url: https://github.com/smarthomeNG/plugins
  license: GPL-3.0-or-later
  commit: 0176a8684934aab9a52f905cdea80f8410200c2f
  path: ksemmodbus/ksem.py
- id: universal-modbus
  title: HA-Universal-Modbus (Home Assistant integration)
  url: https://github.com/Idelmaeaen/HA-Universal-Modbus
  license: MIT
