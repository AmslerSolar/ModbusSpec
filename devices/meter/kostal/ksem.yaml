  path: profiles/kostal/ksem-g2.json

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - tls
  ports:
    tls: 802
  limits:
    max_registers: 125
    max_gap: 0

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 8228
    type: str
    length: 16
  checks:
  - table: holding
    address: 8192
    type: u16
    equals: 21043

points:
  # Totals (internal instantaneous registers 0–147)
  - {key: x.active_power_plus, label: 'Active power+ (1-0:1.4.0)', table: holding, address: 0, type: u32, unit: W, scale: 0.1, note: Drawn from the grid (A+).}
  - {key: x.active_power_minus, label: 'Active power- (1-0:2.4.0)', table: holding, address: 2, type: u32, unit: W, scale: 0.1, note: Fed into the grid (A−).}
  - {key: x.reactive_power_plus, label: 'Reactive power+ (1-0:3.4.0)', table: holding, address: 4, type: u32, unit: var, scale: 0.1}
  - {key: x.reactive_power_minus, label: 'Reactive power- (1-0:4.4.0)', table: holding, address: 6, type: u32, unit: var, scale: 0.1}
  - {key: x.apparent_power_plus, label: 'Apparent power+ (1-0:9.4.0)', table: holding, address: 16, type: u32, unit: VA, scale: 0.1}
  - {key: x.apparent_power_minus, label: 'Apparent power- (1-0:10.4.0)', table: holding, address: 18, type: u32, unit: VA, scale: 0.1}
  - {key: power_factor, label: 'Power factor (1-0:13.4.0)', table: holding, address: 24, type: s32, unit: '', scale: 0.001, verified: true, note: A real KSEM read 0.463 with 6.8 W and 14.7 VA (6.8 / 14.7 = 0.463)., conflicts: [{sources: [smarthomeng], type: f32, scale: 1, word_order: little, label: Power Factor}]}
  - {key: frequency, label: 'Supply frequency (1-0:14.4.0)', table: holding, address: 26, type: u32, unit: Hz, scale: 0.001}
  - {key: x.min_active_power_plus, label: Minimum active power+, table: holding, address: 146, type: u32, unit: W, scale: 0.1, poll: slow}
  # L1
  - {key: x.l1_active_power_plus, label: 'Active power+ (L1) (1-0:21.4.0)', table: holding, address: 40, type: u32, unit: W, scale: 0.1}
  - {key: x.l1_active_power_minus, label: 'Active power- (L1) (1-0:22.4.0)', table: holding, address: 42, type: u32, unit: W, scale: 0.1}
  - {key: x.l1_reactive_power_plus, label: Reactive power+ (L1), table: holding, address: 44, type: u32, unit: var, scale: 0.1}
  - {key: x.l1_reactive_power_minus, label: Reactive power- (L1), table: holding, address: 46, type: u32, unit: var, scale: 0.1}
  - {key: x.l1_apparent_power_plus, label: Apparent power+ (L1), table: holding, address: 56, type: u32, unit: VA, scale: 0.1}
  - {key: x.l1_apparent_power_minus, label: Apparent power- (L1), table: holding, address: 58, type: u32, unit: VA, scale: 0.1}
  - {key: l1_current, label: Current (L1), table: holding, address: 60, type: u32, unit: A, scale: 0.001}
  - {key: l1_voltage, label: Voltage (L1), table: holding, address: 62, type: u32, unit: V, scale: 0.001}
  - {key: x.l1_power_factor, label: Power factor (L1), table: holding, address: 64, type: s32, unit: '', scale: 0.001}
  # L2
  - {key: x.l2_active_power_plus, label: 'Active power+ (L2) (1-0:41.4.0)', table: holding, address: 80, type: u32, unit: W, scale: 0.1}
  - {key: x.l2_active_power_minus, label: 'Active power- (L2) (1-0:42.4.0)', table: holding, address: 82, type: u32, unit: W, scale: 0.1}
  - {key: x.l2_reactive_power_plus, label: Reactive power+ (L2), table: holding, address: 84, type: u32, unit: var, scale: 0.1}
