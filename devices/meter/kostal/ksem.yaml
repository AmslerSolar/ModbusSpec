  - {key: x.l2_apparent_power_plus, label: Apparent power+ (L2), table: holding, address: 96, type: u32, unit: VA, scale: 0.1}
  - {key: x.l2_apparent_power_minus, label: Apparent power- (L2), table: holding, address: 98, type: u32, unit: VA, scale: 0.1}
  - {key: l2_current, label: Current (L2), table: holding, address: 100, type: u32, unit: A, scale: 0.001}
  - {key: l2_voltage, label: Voltage (L2), table: holding, address: 102, type: u32, unit: V, scale: 0.001}
  - {key: x.l2_power_factor, label: Power factor (L2), table: holding, address: 104, type: s32, unit: '', scale: 0.001}
  # L3
  - {key: x.l3_active_power_plus, label: 'Active power+ (L3) (1-0:61.4.0)', table: holding, address: 120, type: u32, unit: W, scale: 0.1}
  - {key: x.l3_active_power_minus, label: 'Active power- (L3) (1-0:62.4.0)', table: holding, address: 122, type: u32, unit: W, scale: 0.1}
  - {key: x.l3_reactive_power_plus, label: Reactive power+ (L3), table: holding, address: 124, type: u32, unit: var, scale: 0.1}
  - {key: x.l3_reactive_power_minus, label: Reactive power- (L3), table: holding, address: 126, type: u32, unit: var, scale: 0.1}
  - {key: x.l3_apparent_power_plus, label: Apparent power+ (L3), table: holding, address: 136, type: u32, unit: VA, scale: 0.1}
  - {key: x.l3_apparent_power_minus, label: Apparent power- (L3), table: holding, address: 138, type: u32, unit: VA, scale: 0.1}
  - {key: l3_current, label: Current (L3), table: holding, address: 140, type: u32, unit: A, scale: 0.001}
  - {key: l3_voltage, label: Voltage (L3), table: holding, address: 142, type: u32, unit: V, scale: 0.001}
  - {key: x.l3_power_factor, label: Power factor (L3), table: holding, address: 144, type: s32, unit: '', scale: 0.001}

  # Energy counters (internal energy registers 512–791), 0.1 Wh / varh / VAh
  - {key: grid_import_energy, label: 'Active energy+ (1-0:1.8.0)', table: holding, address: 512, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: grid_export_energy, label: 'Active energy- (1-0:2.8.0)', table: holding, address: 516, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.reactive_energy_plus, label: 'Reactive energy+ (1-0:3.8.0)', table: holding, address: 520, type: u64, unit: kvarh, scale: 0.0001, poll: slow, verified: true, note: A real KSEM read 1904.5 kvarh beside 4033.7 kWh of active energy; read as varh it would be 1.9 kvarh., conflicts: [{sources: [smarthomeng], unit: varh, label: Reactive energy+}]}
  - {key: x.reactive_energy_minus, label: 'Reactive energy- (1-0:4.8.0)', table: holding, address: 524, type: u64, unit: kvarh, scale: 0.0001, poll: slow, verified: true, note: As 520., conflicts: [{sources: [smarthomeng], unit: varh, label: Reactive energy-}]}
  - {key: x.apparent_energy_plus, label: 'Apparent energy+ (1-0:9.8.0)', table: holding, address: 544, type: u64, unit: kVAh, scale: 0.0001, poll: slow, verified: true, note: As 520., conflicts: [{sources: [smarthomeng], unit: VAh, label: Apparent energy+}]}
  - {key: x.apparent_energy_minus, label: 'Apparent energy- (1-0:10.8.0)', table: holding, address: 548, type: u64, unit: kVAh, scale: 0.0001, poll: slow, verified: true, note: As 520., conflicts: [{sources: [smarthomeng], unit: VAh, label: Apparent energy-}]}
  - {key: x.l1_active_energy_plus, label: Active energy+ (L1), table: holding, address: 592, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l1_active_energy_minus, label: Active energy- (L1), table: holding, address: 596, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l1_reactive_energy_plus, label: Reactive energy+ (L1), table: holding, address: 600, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l1_reactive_energy_minus, label: Reactive energy- (L1), table: holding, address: 604, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l1_apparent_energy_plus, label: Apparent energy+ (L1), table: holding, address: 624, type: u64, unit: kVAh, scale: 0.0001, poll: slow}
  - {key: x.l1_apparent_energy_minus, label: Apparent energy- (L1), table: holding, address: 628, type: u64, unit: kVAh, scale: 0.0001, poll: slow}
  - {key: x.l2_active_energy_plus, label: Active energy+ (L2), table: holding, address: 672, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l2_active_energy_minus, label: Active energy- (L2), table: holding, address: 676, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l2_reactive_energy_plus, label: Reactive energy+ (L2), table: holding, address: 680, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l2_reactive_energy_minus, label: Reactive energy- (L2), table: holding, address: 684, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l2_apparent_energy_plus, label: Apparent energy+ (L2), table: holding, address: 704, type: u64, unit: kVAh, scale: 0.0001, poll: slow}
  - {key: x.l2_apparent_energy_minus, label: Apparent energy- (L2), table: holding, address: 708, type: u64, unit: kVAh, scale: 0.0001, poll: slow}
  - {key: x.l3_active_energy_plus, label: Active energy+ (L3), table: holding, address: 752, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l3_active_energy_minus, label: Active energy- (L3), table: holding, address: 756, type: u64, unit: kWh, scale: 0.0001, poll: slow}
  - {key: x.l3_reactive_energy_plus, label: Reactive energy+ (L3), table: holding, address: 760, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l3_reactive_energy_minus, label: Reactive energy- (L3), table: holding, address: 764, type: u64, unit: kvarh, scale: 0.0001, poll: slow}
  - {key: x.l3_apparent_energy_plus, label: Apparent energy+ (L3), table: holding, address: 784, type: u64, unit: kVAh, scale: 0.0001, poll: slow}
  - {key: x.l3_apparent_energy_minus, label: Apparent energy- (L3), table: holding, address: 788, type: u64, unit: kVAh, scale: 0.0001, poll: slow}

  # KSEM/RM PnP identity (8192–8252)
  - {key: x.manufacturer_id, label: ManufacturerID, table: holding, address: 8192, type: u16, poll: slow, note: Always 0x5233.}
  - {key: x.product_id, label: ProductID, table: holding, address: 8193, type: u16, enum: product_id, poll: slow, note: Hardware type.}
  - {key: x.product_version, label: ProductVersion, table: holding, address: 8194, type: u16, poll: slow, note: Hardware revision of the processor board. The same real KSEM read 512 with firmware 1.3 and 5 after an update to 2.7.}
  - {key: firmware, label: FirmwareVersion, table: holding, address: 8195, type: u16, poll: slow, note: 'High byte major, low byte minor: 0x0103 = 1.3.x.'}
  - {key: x.vendor_name, label: VendorName, table: holding, address: 8196, type: str, length: 16, poll: slow, note: '"KOSTAL" on a real KSEM with firmware 1.3, "KOSTAL Solar Electric GmbH" after an update to 2.7.'}
  - {key: x.product_name, label: ProductName, table: holding, address: 8212, type: str, length: 16, poll: slow}
  - {key: serial, label: SerialNumber, table: holding, address: 8228, type: str, length: 16, poll: slow}
  - {key: x.measuring_interval, label: MeasuringInterval, table: holding, address: 8244, type: u16, unit: ms, poll: slow}
  - {key: x.unix_timestamp, label: UNIXTimestamp, table: holding, address: 8245, type: u64, unit: ms, poll: slow, verified: true, note: Device time in ms since 1970 (UTC); 0 while the clock isn't set.}
  - {key: x.modbus_spec_version, label: ModbusSpecVersion, table: holding, address: 8249, type: u16, poll: slow}
  - {key: x.mac_address, label: Ethernet MAC address, table: holding, address: 8250, type: str, length: 3, poll: slow, note: 'Six raw bytes (uchar[6]), not text: format them as hex. A real KSEM read 0 here and 0 at 8249 with firmware 1.3; after an update to 2.7 the address was filled in and 8249 read 11.'}

  # Energy-flow block of the static Modbus (40960–41159).
  - {key: x.ef_grid_power, label: Grid power Total, table: holding, address: 40972, type: s32, unit: W, positive: import, verified: true, note: INT32; the document states no sign. A real KSEM (firmware 2.7) read +7 W while drawing 7.1 W from the grid (registers 0 / 2). Filled by the energy-flow app (KSEM managing KOSTAL inverters).}
  - {key: x.ef_inverter_ac_power, label: Sum output inverter AC, table: holding, address: 40974, type: s32, unit: W, note: INT32; no sign stated., conflicts: [{sources: [universal-modbus], type: u32, label: Wechselrichter Leistung AC}]}
  - {key: x.ef_pv_dc_power, label: Sum pv power inverter DC, table: holding, address: 40976, type: s32, unit: W, note: INT32., conflicts: [{sources: [universal-modbus], type: u32, label: Solar Leistung DC}]}
  - {key: load_power, label: Home consumption, table: holding, address: 40982, type: s32, unit: W, note: INT32., conflicts: [{sources: [universal-modbus], type: u32, label: Eigenverbrauch}]}
  - {key: x.ef_battery_dc_power, label: Sum battery charge / discharge DC, table: holding, address: 40984, type: s32, unit: W, note: INT32; no sign stated.}
  - {key: x.ef_system_soc, label: System state of charge, table: holding, address: 40986, type: u16, unit: '%'}

derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: x.active_power_plus}, {key: x.active_power_minus, factor: -1}], note: Active power+ (drawn) minus active power− (fed in).}
  - {key: l1_power, label: Power L1, unit: W, positive: import, sum: [{key: x.l1_active_power_plus}, {key: x.l1_active_power_minus, factor: -1}]}
  - {key: l2_power, label: Power L2, unit: W, positive: import, sum: [{key: x.l2_active_power_plus}, {key: x.l2_active_power_minus, factor: -1}]}
  - {key: l3_power, label: Power L3, unit: W, positive: import, sum: [{key: x.l3_active_power_plus}, {key: x.l3_active_power_minus, factor: -1}]}
  - {key: reactive_power, label: Reactive power, unit: var, sum: [{key: x.reactive_power_plus}, {key: x.reactive_power_minus, factor: -1}], note: Reactive power+ minus reactive power−.}

enums:
  product_id: {'18498': HWv1, '18514': HWv2, '18530': HWv3}

notes:
- Modbus TCP slave on port 502, and Modbus/TCP Security (TLS) on port 802; it has to be activated in the KSEM web interface.
  The document doesn't describe the TLS certificates. The document gives no unit id; a real KSEM (HWv2) answered on unit 1,
  71 and 255 with firmware 1.3, and on 0 as well after an update to 2.7. Modbus RTU over the RS485 ports exists too (settings
  in the KSEM), not covered here.
- Function 03 for everything; addresses as listed (0-based). Multi-register values have the most significant register first,
  bytes big-endian. Power 0.1 W / var / VA, current, voltage and frequency 0.001, power factor INT32 × 0.001, energies UINT64
  × 0.1 Wh / varh / VAh.
- Reading a register that isn't in the table is answered with exception 2, so requests must not span the gaps (max_gap 0).
  A real KSEM with firmware 1.3 (the document is for 2.6.0) answered every holding register 0–65534 instead, those not in
  the table as 0; only a request reaching 65535 was refused, and function 04 was refused. After an update to firmware 2.7
  the same meter refused requests reaching outside 0–147, 512–791, 8192–8252, 40000–40178 and 40960–41167, as documented (registers
  inside these stretches but not in the table read 0), and answered function 04 with the same registers and values as 03.
  61312 and 65280 answered alone, as 0.
- 'SunSpec mirror (not in this file), read on a real KSEM: "SunS" at 40000, common model 1 at 40002, model 203 (three-phase
  wye meter, length 105) after it, then the end marker. With firmware 1.3 model 1 had length 65 (manufacturer "KOSTAL", version
  "1.3.0"), model 203 at 40069, end at 40176; with 2.7 length 66 (manufacturer "KOSTAL Solar Electric GmbH", version "2.7.2"),
  model 203 at 40070, end at 40177.'
- 'The static area names its blocks in text: "Energyfl1" at 40960 (energy flow) and "E-Mobili1" at 41160 (an e-mobility block
  the document doesn''t cover; on a real KSEM without a wallbox only its name answered).'
- 'Sign: there is no signed grid power. Power, reactive and apparent power and the energies come as two unsigned registers
  per direction: "+" (OBIS x.4.0 / x.8.0 with C = 1, 21, 41, 61) = drawn from the grid, "−" (C = 2, 22, 42, 62) = fed in.
  Grid power (positive = export) is P− − P+ (registers 2 − 0), per phase likewise.'
- The energy-flow block (40960 ff.) holds system values from the KSEM's energy-flow app (with KOSTAL inverters managed by
  the KSEM); the document types its powers INT32 without giving their signs. Its place in the static area is shown in the
  web interface (Modbus mapping).
- All strings are padded with NUL bytes and spaces.
- The project reads every value with function 03 on unit 71; port 502 is the one its README configures.
- SmartHomeNG plugin ksemmodbus.
