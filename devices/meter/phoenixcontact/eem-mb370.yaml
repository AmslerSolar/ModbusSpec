modbusspec: 0
id: phoenixcontact-eem-mb370
manufacturer: Phoenix Contact
name: EEM-MB370-24DC energy meter
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.phoenixcontact/src/io/openems/edge/meter/phoenixcontact/PhoenixContactMeterImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 32774, type: f32, unit: V, word_order: little}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 32776, type: f32, unit: V, word_order: little}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 32778, type: f32, unit: V, word_order: little}
  - {key: frequency, label: Frequency, table: holding, address: 32780, type: f32, unit: Hz, word_order: little}
  - {key: l1_current, label: Current L1, table: holding, address: 32782, type: f32, unit: A, word_order: little}
  - {key: l2_current, label: Current L2, table: holding, address: 32784, type: f32, unit: A, word_order: little}
  - {key: l3_current, label: Current L3, table: holding, address: 32786, type: f32, unit: A, word_order: little}
  - {key: x.current, label: Current, table: holding, address: 32788, type: f32, unit: A, word_order: little}
  - {key: x.active_power, label: Active Power, table: holding, address: 32790, type: f32, unit: W, word_order: little}
  - {key: x.active_power_l1, label: Active Power L1, table: holding, address: 32798, type: f32, unit: W, word_order: little}
  - {key: x.active_power_l2, label: Active Power L2, table: holding, address: 32800, type: f32, unit: W, word_order: little}
  - {key: x.active_power_l3, label: Active Power L3, table: holding, address: 32802, type: f32, unit: W, word_order: little}
  - {key: x.voltage, label: Voltage, table: holding, address: 32829, type: f32, unit: V, word_order: little}
  - {key: x.active_production_energy, label: Active Production Energy, table: holding, address: 33024, type: f32, unit: kWh, scale: 0.001, word_order: little}
  - {key: x.active_consumption_energy, label: Active Consumption Energy, table: holding, address: 33030, type: f32, unit: kWh, scale: 0.001, word_order: little}

notes:
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
