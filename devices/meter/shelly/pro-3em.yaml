connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: input
    address: 1033
    type: f32
    plausible:
    - 40
    - 70

identify:
  serial:
    table: input
    address: 0
    type: str
    length: 6
  checks:
  - table: input
    address: 1033
    type: f32
    range:
    - 0
    - 70
  - table: input
    address: 1020
    type: f32
    range:
    - 0
    - 1000
  # device model; a device answering 0 or FFFFh everywhere is not this one
  - table: input
    address: 6
    type: str
    length: 10
    printable: true

models:
  - {id: spem_003cebeu120, name: Shelly Pro 3EM-120 (SPEM-003CEBEU120), match: {table: input, address: 6, type: str, length: 10, prefix: PSME0-30ECEB1U02}}
  - {id: spem_003cebeu400, name: Shelly Pro 3EM-400 (SPEM-003CEBEU400), match: {table: input, address: 6, type: str, length: 10, prefix: PSME0-30ECEB4U00}}
