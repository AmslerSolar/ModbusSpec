notes:
- Enable the Modbus TCP server first (Modbus.SetConfig with enable = true, or in the web interface); it listens on port 502.
- The pages number the registers 30000 / 31000 ff.; the protocol address is that number minus 30000 (their own modbus_cli
  examples read the EM timestamp at input 1000 and phase A voltage at input 1020).
- The function code isn't stated; the examples use input registers (function 04).
- Word order isn't stated and can differ; the examples decode floats and uint32 with low word first ("mixed"). It is detected
  from phase A frequency (1033, 40–70 Hz).
- Booleans take one register each; any non-zero value means set.
- The unit id isn't stated; 1 is assumed.
- The per-phase overpower / overvoltage / overcurrent flags follow the user's own alarm thresholds, so they aren't listed
  as problems.
- A second EM / EMData component would sit 80 / 70 registers higher; the Pro 3EM in the three-phase profile has one. In the
  monophase profile the EM1 / EM1Data registers (2000 ff.) apply instead; they aren't described here.
- Reads may span the reserved registers between blocks (up to 16); if the meter refuses such a read, read the values one block
  at a time. Unverified.
- 'Byte order of the ASCII registers isn''t stated: high byte first is assumed here; shelly-modbus-home-assistant reads the
  bytes of each register swapped, and its model prefixes depend on that.'
- Values are input registers (function 04); holding registers aren't implemented. Relay outputs are switched through coils
  (function 05), physical inputs are discrete inputs (function 02).
- 32-bit values have the low word first. Strings (MAC, model, name) have the two bytes of each register swapped (byte order
  little); the model match strings are written in that swapped form.
- The unit id is ignored by the device.
- The device runs either as one three-phase meter (em/emdata registers from 1000) or as three single-phase meters (em1/em1data
  registers from 2000), depending on its profile; only the registers of the active profile carry data.
- Identification as shelly-modbus-home-assistant recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
