  - {key: x.model, label: Device model, table: input, address: 6, type: str, length: 10, poll: slow, verified: false, note: 'ASCII, zero padded; byte order within a register not stated, high byte first assumed.', conflicts: [{sources: [shelly-modbus-home-assistant], byte_order: little, label: Model}]}
