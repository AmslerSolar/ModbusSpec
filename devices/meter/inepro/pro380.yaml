modbusspec: 0
id: inepro-pro380
manufacturer: inepro Metering
name: PRO380-Mod three-phase energy meter
kind: meter

sources:
- title: inepro PRO380 Series MID three phase energy meter, user manual (appendix 3, A3.2 Modbus register map)
  version: 2.18-8
  url: https://cdn.prod.website-files.com/6617f74190bf0a53bfd776e8/69f0b42e8df8da5157fb250d_PRO380%20user%20manual%20V2.18-8.pdf
  sha256: 95d86483e85bc92836cba6713d0c271ec247bf5fecaa1a5edc8f6e5539b1b83d
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/inepro.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8E1
  limits:
    max_registers: 50
    max_gap: 12

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 16384
    type: u32
  checks:
  - table: holding
    address: 20488
    type: f32
    range:
    - 40
    - 70

points:
  # Measurements
  - {key: l1_voltage, label: L1 Voltage, table: holding, address: 20482, type: f32, unit: V}
  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 20484, type: f32, unit: V}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 20486, type: f32, unit: V}
  - {key: frequency, label: Grid frequency, table: holding, address: 20488, type: f32, unit: Hz}
  - {key: l1_current, label: L1 Current, table: holding, address: 20492, type: f32, unit: A}
  - {key: l2_current, label: L2 Current, table: holding, address: 20494, type: f32, unit: A}
  - {key: l3_current, label: L3 Current, table: holding, address: 20496, type: f32, unit: A}
  - {key: grid_power, label: Total active power, table: holding, address: 20498, type: f32, unit: W, scale: 1000, positive: import, verified: false, note: 'The register map gives no sign. The manual calls consumed energy "forward" and shows reverse flow as negative in its combination code example; derived: positive = forward = import.'}
  - {key: l1_power, label: L1 Active power, table: holding, address: 20500, type: f32, unit: W, scale: 1000, positive: import, verified: false, note: Derived like the total power.}
  - {key: l2_power, label: L2 Active power, table: holding, address: 20502, type: f32, unit: W, scale: 1000, positive: import, verified: false, note: Derived like the total power.}
  - {key: l3_power, label: L3 Active power, table: holding, address: 20504, type: f32, unit: W, scale: 1000, positive: import, verified: false, note: Derived like the total power.}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 20506, type: f32, unit: var, scale: 1000}
  - {key: x.l1_reactive_power, label: L1 Reactive power, table: holding, address: 20508, type: f32, unit: var, scale: 1000}
  - {key: x.l2_reactive_power, label: L2 Reactive power, table: holding, address: 20510, type: f32, unit: var, scale: 1000}
  - {key: x.l3_reactive_power, label: L3 Reactive power, table: holding, address: 20512, type: f32, unit: var, scale: 1000}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 20514, type: f32, unit: VA, scale: 1000}
  - {key: x.l1_apparent_power, label: L1 Apparent power, table: holding, address: 20516, type: f32, unit: VA, scale: 1000}
  - {key: x.l2_apparent_power, label: L2 Apparent power, table: holding, address: 20518, type: f32, unit: VA, scale: 1000}
  - {key: x.l3_apparent_power, label: L3 Apparent power, table: holding, address: 20520, type: f32, unit: VA, scale: 1000}
  - {key: power_factor, label: Power factor, table: holding, address: 20522, type: f32, unit: ''}
  - {key: x.l1_power_factor, label: L1 Power factor, table: holding, address: 20524, type: f32, unit: ''}
  - {key: x.l2_power_factor, label: L2 Power factor, table: holding, address: 20526, type: f32, unit: ''}
  - {key: x.l3_power_factor, label: L3 Power factor, table: holding, address: 20528, type: f32, unit: ''}

  # Energy
