  - {key: x.import_energy_t2, label: T2 Forward active energy, table: holding, address: 24592, type: f32, unit: kWh}
  - {key: x.l1_import_energy, label: L1 Forward active energy, table: holding, address: 24594, type: f32, unit: kWh}
  - {key: x.l2_import_energy, label: L2 Forward active energy, table: holding, address: 24596, type: f32, unit: kWh}
  - {key: x.l3_import_energy, label: L3 Forward active energy, table: holding, address: 24598, type: f32, unit: kWh}
