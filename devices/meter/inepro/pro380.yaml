enums:
  combination_code: {'1': Forward only, '4': Reverse only, '5': Forward + reverse, '6': Reverse − forward, '9': Forward − reverse, '10': Forward − reverse (C-10), '11': Forward − reverse (C-11)}
  parity: {'1': Even, '2': None, '3': Odd}

notes:
- All registers are holding registers (FC 03; writes with 06 / 16). Addresses are the hex values printed in the map and go
  into the frame as they are (the write example sends 4003h).
- 'Floats are IEEE 754 "ABCD": most significant word first. Power is in kW / kvar / kVA, energy in kWh / kvarh.'
- This is the new register map of manual 2.18; the old V1.14 map still works but isn't used. Voltage* (5000h), Current* (500Ah)
  and Error code* (4015h) are PRO1 only.
- The meter can be recognised by a readable information block 4000h–401Fh and a plausible grid frequency at 5008h.
- 'RS485 defaults: address 1, 9600 baud, 8 data bits, even parity, 1 stop bit. The manual gives no limit per request.'
- mbmd (type code INEPRO) detects the meter by reading L1 Voltage (holding register 20482, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.
- Identification as mbmd recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
