  license: MIT
  commit: 80b4627ceb2f748d4a0a627b022e13034d3cba3b
  path: custom_components/enecess/const.py, custom_components/enecess/ecomain/model.py, custom_components/enecess/ecomain/phase.py
- id: evcc
