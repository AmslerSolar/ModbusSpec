  phase: {'0': L1, '1': L2, '2': L3}
  online: {'0': Offline, '1': Online}

notes:
- Reached over Modbus TCP at the unit id given here; the device announces itself over mDNS as enecess-main-<serial>.
- Channels ch1…ch10 of the main unit and of each ecoSub (sub1…sub3) are CT inputs; which phase each one measures is set in
  the phase registers (2000 + 10 × device + channel − 1). An ecoSub's registers are only valid while its online flag (3101…3103)
  reads 1.
- The project requires firmware 136 or newer (register 3009); every value other than power and forward / reverse energy needs
  firmware 139.
- The project does not say which current direction is forward.
- 'evcc template `enecess-ecomain` (grid, pv, charge, aux) lists: enecess ecoMain.'
- The template has the option `phasecount` (default 1); points used only with another value say so in their note.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
