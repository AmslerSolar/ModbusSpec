derived:
  - {key: grid_power, label: Grid power, unit: W, positive: import, sum: [{key: l1_power}, {key: l2_power}]}
  - {key: load_power, label: Load power, unit: W, sum: [{key: x.load_l1_power}, {key: x.load_l2_power}]}
  - {key: x.gen_power, label: Generator power, unit: W, sum: [{key: x.gen_l1_power}, {key: x.gen_l2_power}]}
  - {key: x.ups_power, label: UPS power, unit: W, sum: [{key: x.ups_l1_power}, {key: x.ups_l2_power}]}

notes:
- Holding register 19 (device type code) reads 50 on a GridBOSS.
- 32-bit values are two registers, low word first.
- All power and energy values are per leg of a US split-phase supply.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
