modbusspec: 0
id: eg4-gridboss
manufacturer: EG4
name: GridBOSS (microgrid interconnect device)
kind: meter

sources:
- id: pylxpweb
  title: pylxpweb (Python library for EG4 / LuxPower inverters, used by eg4_web_monitor)
  url: https://github.com/joyfulhouse/pylxpweb
  license: MIT
  commit: bce390936f2068000b7a53e2e981e9399139753f
  path: src/pylxpweb/registers/gridboss.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8N1
  limits:
    max_registers: 40

encoding:
  word_order: little

defaults:
  verified: false
  sources:
  - pylxpweb

points:
  - {key: x.grid_voltage, label: Grid aggregate RMS voltage, table: input, address: 1, type: u16, unit: V, scale: 0.1}
  - {key: x.ups_voltage, label: UPS (inverter output) aggregate RMS voltage, table: input, address: 2, type: u16, unit: V, scale: 0.1}
  - {key: x.gen_voltage, label: Generator aggregate RMS voltage, table: input, address: 3, type: u16, unit: V, scale: 0.1}
  - {key: l1_voltage, label: Grid L1 (leg 1) RMS voltage, table: input, address: 4, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Grid L2 (leg 2) RMS voltage, table: input, address: 5, type: u16, unit: V, scale: 0.1}
  - {key: x.ups_l1_voltage, label: UPS L1 output voltage (= load L1 voltage), table: input, address: 6, type: u16, unit: V, scale: 0.1}
