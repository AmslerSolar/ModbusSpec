modbusspec: 0
id: kdk-2pu-ct
manufacturer: KDK
name: 420506PRO20-U (2PU CT) energy meter
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.kdk/src/io/openems/edge/meter/kdk/puct2/MeterKdk2puctImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.software_version, label: Software Version, table: holding, address: 16391, type: f32}
  - {key: x.primary_current, label: Primary Current, table: holding, address: 16415, type: s16, unit: A}
  - {key: x.secondary_current, label: Secondary Current, table: holding, address: 16416, type: s16, unit: A}
  - {key: x.software_version_check_sum, label: Software Version Check Sum, table: holding, address: 16419, type: u32}
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 20482, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 20484, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 20486, type: f32, unit: V}
  - {key: frequency, label: Frequency, table: holding, address: 20488, type: f32, unit: Hz}
  - {key: l1_current, label: Meter Current L1, table: holding, address: 20492, type: f32, unit: A, note: OpenEMS copies it to its CURRENT_L1 channel.}
  - {key: l2_current, label: Meter Current L2, table: holding, address: 20494, type: f32, unit: A, note: OpenEMS copies it to its CURRENT_L2 channel.}
  - {key: l3_current, label: Meter Current L3, table: holding, address: 20496, type: f32, unit: A, note: OpenEMS copies it to its CURRENT_L3 channel.}
  - {key: grid_power, label: Meter Active Power, table: holding, address: 20498, type: f32, unit: W, positive: import, note: OpenEMS copies it to its ACTIVE_POWER channel.}
  - {key: l1_power, label: Meter Active Power L1, table: holding, address: 20500, type: f32, unit: W, positive: import, note: OpenEMS copies it to its ACTIVE_POWER_L1 channel.}
  - {key: l2_power, label: Meter Active Power L2, table: holding, address: 20502, type: f32, unit: W, positive: import, note: OpenEMS copies it to its ACTIVE_POWER_L2 channel.}
  - {key: l3_power, label: Meter Active Power L3, table: holding, address: 20504, type: f32, unit: W, positive: import, note: OpenEMS copies it to its ACTIVE_POWER_L3 channel.}
  - {key: x.meter_reactive_power, label: Meter Reactive Power, table: holding, address: 20506, type: f32, unit: W, note: OpenEMS copies it to its REACTIVE_POWER channel.}
  - {key: x.meter_reactive_power_l1, label: Meter Reactive Power L1, table: holding, address: 20508, type: f32, unit: W, note: OpenEMS copies it to its REACTIVE_POWER_L1 channel.}
  - {key: x.meter_reactive_power_l2, label: Meter Reactive Power L2, table: holding, address: 20510, type: f32, unit: W, note: OpenEMS copies it to its REACTIVE_POWER_L2 channel.}
  - {key: x.meter_reactive_power_l3, label: Meter Reactive Power L3, table: holding, address: 20512, type: f32, unit: W, note: OpenEMS copies it to its REACTIVE_POWER_L3 channel.}
  - {key: grid_import_energy, label: Active Production Energy, table: holding, address: 24588, type: f32, unit: kWh}
  - {key: x.active_production_energy_l1, label: Active Production Energy L1, table: holding, address: 24594, type: f32, unit: kWh}
  - {key: x.active_production_energy_l2, label: Active Production Energy L2, table: holding, address: 24596, type: f32, unit: kWh}
  - {key: x.active_production_energy_l3, label: Active Production Energy L3, table: holding, address: 24598, type: f32, unit: kWh}
  - {key: grid_export_energy, label: Active Consumption Energy, table: holding, address: 24600, type: f32, unit: kWh}
  - {key: x.active_consumption_energy_l1, label: Active Consumption Energy L1, table: holding, address: 24606, type: f32, unit: kWh}
  - {key: x.active_consumption_energy_l2, label: Active Consumption Energy L2, table: holding, address: 24608, type: f32, unit: kWh}
  - {key: x.active_consumption_energy_l3, label: Active Consumption Energy L3, table: holding, address: 24610, type: f32, unit: kWh}

notes:
- OpenEMS multiplies current and power by the CT ratio (primary / secondary current, registers 0x401F / 0x4020) only for an
  old firmware, recognised by its software checksum (0x4023).
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
