# Written from the Sungrow DTSU666 Meter Communication Protocol (2021-06-01).

modbusspec: 0
id: sungrow-dtsu666
manufacturer: Sungrow
name: DTSU666 (80 A)
kind: meter

sources:
- title: DTSU666 Meter Communication Protocol
  version: '2021-06-01'
  url: https://github.com/bohdan-s/Sungrow-Inverter/blob/755ae6fda3e9f2c897ccd11427e2d5df050409ee/Modbus%20Information/DTSU666%20Meter%20Communication%20Protocol_20210601.pdf
  sha256: 4311b0dc01135afabf14996b95a3e735fd7857126b5ea0d9073a77b1067ef6c3
- title: DTSD1352 Installation and operation instruction
  version: V3.1
  url: https://www.acrelenergy.com/uploads/file/acrel-dtsd1352-manual.pdf
  sha256: c08741e7d6339cc1d6001ce5d9d29a4baf0ef7ad0144b76a085f646205ceed0c
  language: en
  devices: [DTSD1352]
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/sungrow-meter.yaml

connection:
  default_port: 502
  default_unit: 254
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 20480
    type: u16
    equals: 8405


points:
  # Identity and setup
  - {key: x.device_type_code, label: Device type coding, table: holding, address: 20480, type: u16, poll: slow, note: '0x20D5: read-only, tells Sungrow equipment this is its meter.'}
  - {key: x.modbus_address, label: 'First communication path: address', table: holding, address: 63, type: u16, bits: [8, 15], writable: true, poll: slow, note: 1–247 (default 254 at the factory per the document's table).}
  - {key: x.baud_rate, label: 'First communication path: baud rate', table: holding, address: 63, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: 'First communication path: parity', table: holding, address: 149, type: u16, bits: [8, 15], enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits, label: 'First communication path: stop bits', table: holding, address: 149, type: u16, bits: [0, 7], enum: stop_bits, writable: true, poll: slow}
  - {key: x.pulse_constant, label: Pulse constant, table: holding, address: 64, type: u16, poll: slow}
  - {key: x.pt_ratio, label: Voltage transfer (PT), table: holding, address: 141, type: u16, writable: true, poll: slow}
  - {key: x.ct_ratio, label: Current transfer (CT), table: holding, address: 142, type: u16, writable: true, poll: slow}
  # Energy
  - {key: x.total_active_energy, label: Current total active energy, table: holding, address: 0, type: u32, unit: kWh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  - {key: grid_import_energy, label: Current forward active total energy, table: holding, address: 10, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Scale and unit from the Acrel DTSD1352 manual. Forward = import, assumed.', verified: false}
  - {key: grid_export_energy, label: Current reversing active total energy, table: holding, address: 20, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Scale and unit from the Acrel DTSD1352 manual. Reverse = export, assumed.', verified: false}
  - {key: x.forward_reactive_energy, label: Current forward reactive total energy, table: holding, address: 40, type: u32, unit: kvarh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  - {key: x.reverse_reactive_energy, label: Current reversing reactive total energy, table: holding, address: 50, type: u32, unit: kvarh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l1_import_energy, label: Forward active energy of A phase, table: holding, address: 135, type: u32, unit: kWh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l2_import_energy, label: Forward active energy of B phase, table: holding, address: 137, type: u32, unit: kWh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l3_import_energy, label: Forward active energy of C phase, table: holding, address: 139, type: u32, unit: kWh, scale: 0.01, poll: slow, note: Scale and unit from the Acrel DTSD1352 manual., verified: false}
  # Voltage, current, frequency
  - {key: l1_voltage, label: Voltage of A phase, table: holding, address: 97, type: u16, unit: V, scale: 0.1, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: l2_voltage, label: Voltage of B phase, table: holding, address: 98, type: u16, unit: V, scale: 0.1, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: l3_voltage, label: Voltage of C phase, table: holding, address: 99, type: u16, unit: V, scale: 0.1, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: l1_current, label: Current of A phase, table: holding, address: 100, type: u16, unit: A, scale: 0.01, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: l2_current, label: Current of B phase, table: holding, address: 101, type: u16, unit: A, scale: 0.01, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: l3_current, label: Current of C phase, table: holding, address: 102, type: u16, unit: A, scale: 0.01, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: frequency, label: Frequency, table: holding, address: 119, type: u16, unit: Hz, scale: 0.01, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l1_l2_voltage, label: Voltage between A-B, table: holding, address: 120, type: u16, unit: V, scale: 0.1, note: Scale not stated in the document; assumed 0.1 V., verified: false}
  - {key: x.l3_l2_voltage, label: Voltage between C-B, table: holding, address: 121, type: u16, unit: V, scale: 0.1, note: Scale not stated in the document; assumed 0.1 V., verified: false}
  - {key: x.l1_l3_voltage, label: Voltage between A-C, table: holding, address: 122, type: u16, unit: V, scale: 0.1, note: Scale not stated in the document; assumed 0.1 V., verified: false}
  - {key: x.zero_sequence_current, label: Zero sequence current, table: holding, address: 146, type: u16, unit: A, scale: 0.01, note: Scale not stated in the document; assumed as for the phase currents., verified: false}
  - {key: x.voltage_imbalance, label: Voltage imbalance, table: holding, address: 147, type: u16, unit: '%', scale: 0.1}
  - {key: x.current_imbalance, label: Current imbalance, table: holding, address: 148, type: u16, unit: '%', scale: 0.1, note: Unit from the Acrel DTSD1352 manual., verified: false}
  # Power
  - {key: l1_power, label: Active power of A phase, table: holding, address: 356, type: s32, unit: W, positive: import, note: 'Scale and signedness from the Acrel DTSD1352 manual; + = import assumed.', verified: false}
  - {key: l2_power, label: Active power of B phase, table: holding, address: 358, type: s32, unit: W, positive: import, note: 'Scale and signedness from the Acrel DTSD1352 manual; + = import assumed.', verified: false}
  - {key: l3_power, label: Active power of C phase, table: holding, address: 360, type: s32, unit: W, positive: import, note: 'Scale and signedness from the Acrel DTSD1352 manual; + = import assumed.', verified: false}
  - {key: grid_power, label: Total active power, table: holding, address: 362, type: s32, unit: W, positive: import, note: 'Scale and signedness from the Acrel DTSD1352 manual; + = import assumed.', verified: false}
  - {key: x.l1_reactive_power, label: Reactive power of A phase, table: holding, address: 364, type: s32, unit: var, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l2_reactive_power, label: Reactive power of B phase, table: holding, address: 366, type: s32, unit: var, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l3_reactive_power, label: Reactive power of C phase, table: holding, address: 368, type: s32, unit: var, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 370, type: s32, unit: var, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l1_apparent_power, label: Apparent power of A phase, table: holding, address: 372, type: s32, unit: VA, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l2_apparent_power, label: Apparent power of B phase, table: holding, address: 374, type: s32, unit: VA, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l3_apparent_power, label: Apparent power of C phase, table: holding, address: 376, type: s32, unit: VA, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 378, type: s32, unit: VA, note: Scale from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l1_power_factor, label: Power factor of A phase, table: holding, address: 380, type: s16, scale: 0.001, note: Scale and signedness from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l2_power_factor, label: Power factor of B phase, table: holding, address: 381, type: s16, scale: 0.001, note: Scale and signedness from the Acrel DTSD1352 manual., verified: false}
  - {key: x.l3_power_factor, label: Power factor of C phase, table: holding, address: 382, type: s16, scale: 0.001, note: Scale and signedness from the Acrel DTSD1352 manual., verified: false}
  - {key: power_factor, label: Total power factor, table: holding, address: 383, type: s16, scale: 0.001, note: Scale and signedness from the Acrel DTSD1352 manual., verified: false}
  # State
  - {key: x.voltage_loss_state, label: State of loss voltage, table: holding, address: 143, type: u16, bits: [0, 7], note: Bit meanings not given in the document.}
  - {key: x.voltage_loss_threshold, label: Threshold of voltage, table: holding, address: 143, type: u16, bits: [8, 15], writable: true, poll: slow}
  - {key: x.running_state_1, label: Running state 1, table: holding, address: 145, type: u16, bits: [8, 15], note: Bit meanings not given in the document.}
  - {key: x.running_state_2, label: Running state 2, table: holding, address: 145, type: u16, bits: [0, 7], note: Bit meanings not given in the document.}

enums:
  baud_rate: {'1': '9600', '2': '4800', '3': '2400', '4': '1200'}
  parity: {'0': None, '2': Even}
  stop_bits: {'0': '1', '1': '2'}

notes:
- Addresses are the document's hex register addresses (0-based protocol addresses); every register is read with function 03.
  The document gives lengths in bytes (4 = two registers).
- "Sungrow's document gives no scales, units, signedness or word order for any value. Acrel's DTSD1352 manual has the same register map, except 0x5000, and states the scales, units and signedness used here. All stay `verified: false` here: they are checked only on a meter that reads 0x102F, see acrel/dtsd1352. The scale of the line voltages and the zero sequence current is in neither document. Two-register values are taken as most significant register first."
- "Sungrow's version of the DTSU666, not the Chint factory map. Factory default unit id 254, 9600 Bd, no parity, 1 stop bit. evcc lists it as Chint hardware with Sungrow firmware. No document here says so, and at least one Sungrow-labelled meter with this map is an Acrel DTSD1352, which reads 0x102F at 0x5000 and so doesn't match this file's identification."
- 'Left out: tariff (spike / peak / flat / valley) energies, maximum demand values and their times, daily and historic max
  / min values, the clock (0x003C, three registers, layout not given), the time zone and period tables, the second communication
  path (0x0096–0x0097) and the T1–T3 temperatures (0x2000–0x2002, scale not given).'
- 'evcc template `sungrow-meter` (grid, pv, charge) lists: Sungrow DTSU666 (80 A); CHINT DTSU666 (Sungrow firmware).'
