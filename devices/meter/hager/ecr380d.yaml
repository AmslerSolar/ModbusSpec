enums:
  tariff_mode: {'0': Physical input, '1': Modbus}
  network_type: {'1': Single-phase (1BL), '4': Three-phase four-wire (4NBL)}
  mid: {'0': Not MID, '1': MID}
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400'}
  parity: {'0': 'No parity, 1 stop bit', '1': 'No parity, 2 stop bits', '2': 'Odd parity, 1 stop bit', '3': 'Odd parity, 2 stop bits', '4': 'Even parity, 1 stop bit', '5': 'Even parity, 2 stop bits'}

notes:
- Addresses are the document's hex addresses (0-based protocol addresses; the decimal column is the same number). All registers
  are read with function 03.
- 'Registers a model doesn''t have read as 0xFFFF / 0xFFFFFFFF (unsigned) or 0x7FFF / 0x7FFFFFFF (signed), given as `invalid`:
  phase 2 / 3 and line-to-line values on single-phase meters, totals on triple meters, partial energies on 1P 40 A, vector-sum
  and per-phase energies on all but three-phase meters.'
- On the triple single-phase meters (ECR180T, ECA180T, ECR300T, ECA300T) L1, L2 and L3 are three separate meters (meter 1–3);
  their total power and total energies aren't available.
- CT meters give currents, powers and energies referred to the primary side; the same values referred to the secondary side
  are at 0xB270 ff. and 0xB2B0 ff. and are left out, as are the per-tariff and partial per-tariff energies (0xB0C0 ff., 0xB140
  ff., 0xB1B0 ff., 0xB210 ff.), the overflow event counters and the partial-energy reset registers (0xC020 ff.).
- Three-phase models sum energies either by phase magnitude (ECR380D/381D-type references) or by vector (ECR382D-type); the
  vector-sum registers 0xB070 ff. are available on all three-phase models with firmware 1.2 or later.
- The serial settings default isn't stated (set on the meter or in 0xC041); default unit id 1 is assumed. The meters speak
  Modbus RTU on screw terminals or (Agardio versions) RJ45.
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
