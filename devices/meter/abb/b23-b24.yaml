notes:
- Holding registers (FC 03); the meter also accepts 06 and 16. Addresses in the manual are sent on the bus as printed (no
  40001 offset, no −1).
- Registers 1000h–8EFFh can be read in any request of 1–125 registers; reads outside that range give exception 2. Unused registers
  inside the range answer with "invalid" (FFFFh in every register for unsigned values, the highest positive value for signed
  ones), so a reader may read across gaps.
- Multi-register values are most significant byte and word first.
- 'Identification: a real B23 212-100 (firmware B1.28.0, mapping version 3.0) answered Read Device Identification (function
  43/14) with exception 1, so the meter is told by its registers: serial 8900, firmware 8908, type designation 8960. Next
  to them it answered two registers the manuals don''t list: 8911 (0x0102) and 8966–896D, a 16-character text starting with
  "ABB" and ending with the serial number. Function 04 gave exception 1 too.'
- Modbus has to be selected as the meter's RS485 protocol (it can also run EQ-Bus). Address 1–247, 1200–115200 baud, parity
  none / odd / even; the manual gives no factory defaults, so unit 1 is an assumption.
- With 1-element metering (number of elements = 1) only the phase with a voltage is meaningful; phases whose voltage is invalid
  or 0 can be skipped.
- The meter has no daily counters; the resettable accumulators are reset by hand.
- B21 is the single-phase meter (1 + N, direct up to 65 A); B23 three-phase direct up to 65 A; B24 three-phase via current
  transformers. On a B21 the L2/L3 and line-to-line values read invalid.
- The Janitza-branded meters (type designations ending in -10J) also have a float block at 19000–19108 (decimal) laid out
  like the Janitza UMG registers (x.umg_* points); the ABB manuals don't list it, so on ABB-branded meters those registers
  read invalid (NaN). In the Janitza block, 19018 and 19052 are unused; energies there are in Wh / VAh / varh.
- 'The Janitza manual (2.100.006.2) differs from the ABB manuals: only tariffs 1–2 (registers 5170, 5174, 5190, 5194, 51B0,
  51B4, 51D0, 51D4; current tariff 1–2), inputs and outputs numbered 1–2, and it calls the resettable counters (552C–5538)
  and their reset counters (8A48–8A54) not available on its B21/B23/B24. In the ABB manual the resettable counters belong
  to the Silber variants (B2x 3..-1..).'
- 'Inputs and outputs (6300–631C): outputs are writable 0/1; the ABB German manual numbers the inputs 3 and 4, the Janitza
  manual 1 and 2.'
- 'Power outage time at 8A39: bytes 0–2 days (byte 0 the high byte of the first register), byte 3 hours, byte 4 minutes, byte
  5 seconds; the table gives a size of 2 registers though the layout needs 3, so it isn''t a point here. A real B23 (firmware
  B1.28.0) read FFFFh in all of 8A30–8A5F, the outage time and the reset counters at 8A48–8A57 included, as the Janitza manual
  says (not available).'
- CO2 (5024) and currency (5034) are imported active energy times factors set in the meter (kg per kWh and currency per kWh,
  each × 0.001).
- mbmd (type code ABB) detects the meter by reading L1 Voltage (holding register 23296, u32, scale 0.1); its bus scan accepts
  a value within 10% of 110 or 230 V.
- openWB reads a B23 as charge point meter at unit 201 (charge point 0 only).
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Identification as mbmd recognises the device (not checked against a document).
