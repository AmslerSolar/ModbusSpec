modbusspec: 0
id: sbc-ald1
manufacturer: Saia-Burgess Controls
name: ALD1 single-phase energy meter
kind: meter

sources:
- id: openhab
  title: openHAB add-ons (Modbus bindings)
  url: https://github.com/openhab/openhab-addons
  license: EPL-2.0
  commit: 391d63d8597d9b5b535ee83c85f557cad4fba2c7
  path: bundles/org.openhab.binding.modbus.sbc/src/main/java/org/openhab/binding/modbus/sbc/internal/ALD1Registers.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openhab

models:
  - {id: unidirectional, name: ALD1 unidirectional}
  - {id: bidirectional, name: ALD1 bidirectional}

points:
  - {key: x.total_energy, label: Energy Total, table: holding, address: 27, type: u32, unit: kWh, scale: 0.01}
  - {key: x.partial_energy, label: Energy Counter Resettable, table: holding, address: 29, type: u32, unit: kWh, scale: 0.01, models: [unidirectional]}
  - {key: x.feeding_back_energy, label: Energy Feeding Back, table: holding, address: 29, type: u32, unit: kWh, scale: 0.01, models: [bidirectional]}
  - {key: x.voltage, label: Effective Voltage, table: holding, address: 35, type: u16, unit: V}
  - {key: x.current, label: Effective Current, table: holding, address: 36, type: u16, unit: A, scale: 0.1}
  - {key: x.active_power, label: Effective Active Power, table: holding, address: 37, type: s16, unit: W, scale: 10, note: Negative while feeding back.}
  - {key: x.reactive_power, label: Effective Reactive Power, table: holding, address: 38, type: s16, unit: var, scale: 10, note: Negative while feeding back.}
  - {key: x.power_factor, label: Power Factor, table: holding, address: 39, type: s16, scale: 0.01}

notes:
- The binding gives 1-based register numbers (28…40) and reads them from 0-based address 27 with function 03.
- Register 30 is the resettable partial counter on unidirectional meters and the fed-back energy on bidirectional ones; the
  binding cannot tell them apart, the user picks the thing type.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
