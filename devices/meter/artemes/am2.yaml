modbusspec: 0
id: artemes-am2
manufacturer: Artemes
name: AM-2 energy meter
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.artemes.am2/src/io/openems/edge/meter/artemes/am2/MeterArtemesAM2Impl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: l1_voltage, label: Voltage L1, table: input, address: 0, type: u32, unit: V, scale: 0.001}
  - {key: l2_voltage, label: Voltage L2, table: input, address: 2, type: u32, unit: V, scale: 0.001}
  - {key: l3_voltage, label: Voltage L3, table: input, address: 4, type: u32, unit: V, scale: 0.001}
  - {key: x.voltage, label: Voltage, table: input, address: 12, type: u32, unit: V, scale: 0.001}
  - {key: l1_current, label: Current L1, table: input, address: 14, type: s32, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: input, address: 16, type: s32, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: input, address: 18, type: s32, unit: A, scale: 0.001}
  - {key: x.current, label: Current, table: input, address: 22, type: s32, unit: A, scale: 0.001}
  - {key: x.active_power_l1, label: Active Power L1, table: input, address: 24, type: s64, unit: W, scale: 0.001}
  - {key: x.active_power_l2, label: Active Power L2, table: input, address: 28, type: s64, unit: W, scale: 0.001}
  - {key: x.active_power_l3, label: Active Power L3, table: input, address: 32, type: s64, unit: W, scale: 0.001}
  - {key: x.active_power, label: Active Power, table: input, address: 36, type: s64, unit: W, scale: 0.001}
  - {key: x.reactive_power_l1, label: Reactive Power L1, table: input, address: 56, type: s64, unit: var, scale: 0.001}
  - {key: x.reactive_power_l2, label: Reactive Power L2, table: input, address: 60, type: s64, unit: var, scale: 0.001}
  - {key: x.reactive_power_l3, label: Reactive Power L3, table: input, address: 64, type: s64, unit: var, scale: 0.001}
  - {key: reactive_power, label: Reactive Power, table: input, address: 68, type: s64, unit: var, scale: 0.001}
  - {key: frequency, label: Frequency, table: input, address: 114, type: u32, unit: Hz, scale: 0.001}
  - {key: x.active_production_energy, label: Active Production Energy, table: input, address: 1048, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_consumption_energy, label: Active Consumption Energy, table: input, address: 1052, type: u64, unit: kWh, scale: 0.0001}

notes:
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
