# Written from the KWS KWS-306L modbus register table (spreadsheet, commit 9274a74c).

modbusspec: 0
id: kws-306l
manufacturer: KWS
name: KWS-306L three-phase power meter with output relay
kind: meter

sources:
- title: KWS-306L modbus (register table, spreadsheet)
  version: commit 9274a74c848d41b9dab4eb3876a138721525f031
  url: https://github.com/nygma2004/km/blob/9274a74c848d41b9dab4eb3876a138721525f031/KWS-306L%20modbus.xlsx
  sha256: d05c18afcf3843a357bdfcb51ba754c217e9698d150a04447c82c6379731fb00

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

points:
  - {key: l1_voltage, label: Phase A voltage, table: holding, address: 14, type: u16, unit: V, scale: 0.01}
  - {key: l2_voltage, label: Phase B voltage, table: holding, address: 15, type: u16, unit: V, scale: 0.01}
  - {key: l3_voltage, label: Phase C voltage, table: holding, address: 16, type: u16, unit: V, scale: 0.01}
  - {key: l1_current, label: Phase A current, table: holding, address: 17, type: u32, unit: A, scale: 0.001}
  - {key: l2_current, label: Phase B current, table: holding, address: 19, type: u32, unit: A, scale: 0.001}
  - {key: l3_current, label: Phase C current, table: holding, address: 21, type: u32, unit: A, scale: 0.001}
  - {key: grid_power, label: Total active power, table: holding, address: 23, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'Sum of the three phases. Neither the sign nor signedness is stated: signed and import-positive are assumed.'}
  - {key: l1_power, label: Phase A active power, table: holding, address: 25, type: s32, unit: W, scale: 0.1, positive: import, verified: false}
  - {key: l2_power, label: Phase B active power, table: holding, address: 27, type: s32, unit: W, scale: 0.1, positive: import, verified: false}
  - {key: l3_power, label: Phase C active power, table: holding, address: 29, type: s32, unit: W, scale: 0.1, positive: import, verified: false}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 31, type: s32, unit: var, scale: 0.1, verified: false, note: Signedness not stated; assumed signed.}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 39, type: u32, unit: VA, scale: 0.1}
  - {key: power_factor, label: Total power factor, table: holding, address: 47, type: s16, unit: '', scale: 0.001, verified: false, note: Signedness not stated; assumed signed.}
  - {key: frequency, label: Frequency, table: holding, address: 51, type: u16, unit: Hz, scale: 0.01}
  - {key: grid_import_energy, label: Total power (energy), table: holding, address: 52, type: u32, unit: kWh, scale: 0.01, poll: slow, verified: false, note: Total energy; whether it counts import only isn't stated.}
  - {key: x.l1_energy, label: Phase A electricity, table: holding, address: 54, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.l2_energy, label: Phase B electricity, table: holding, address: 56, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.l3_energy, label: Phase C electricity, table: holding, address: 58, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: temperature, label: Temperature, table: holding, address: 60, type: s16, unit: °C, verified: false, note: Signedness not stated; assumed signed.}
  - {key: x.runtime, label: Runtime, table: holding, address: 61, type: u16, unit: min, poll: slow}
  - {key: x.alarms, label: Alarm marker, table: holding, address: 62, type: u16, flags: alarms}
  - {key: x.output, label: Meter status (output), table: holding, address: 63, type: u16, enum: output, writable: true, note: Write as a single register.}
  # Protection limits (may be read and written together)
  - {key: x.overvoltage_limit, label: Overvoltage, table: holding, address: 64, type: u16, unit: V, scale: 0.1, writable: true, max: 290, poll: slow}
  - {key: x.undervoltage_limit, label: Undervoltage, table: holding, address: 65, type: u16, unit: V, scale: 0.1, writable: true, max: 220, poll: slow}
  - {key: x.overcurrent_limit, label: Overcurrent, table: holding, address: 66, type: u16, unit: A, scale: 0.01, writable: true, max: 99, poll: slow}
  - {key: x.overpower_limit, label: Overpower, table: holding, address: 67, type: u16, unit: kW, scale: 0.01, writable: true, max: 23.2, poll: slow}
  - {key: x.voltage_imbalance_limit, label: Voltage imbalance, table: holding, address: 68, type: u16, unit: V, scale: 0.1, writable: true, poll: slow}
  - {key: x.current_imbalance_limit, label: Current imbalance, table: holding, address: 69, type: u16, unit: A, scale: 0.1, writable: true, poll: slow}
  - {key: x.countdown, label: Countdown, table: holding, address: 70, type: u16, unit: min, writable: true, max: 59999, poll: slow}
  - {key: x.overtemperature_limit, label: Over temperature, table: holding, address: 72, type: u16, unit: °C, writable: true, max: 150, poll: slow}
  - {key: x.energy_limit, label: Over electricity, table: holding, address: 73, type: u32, unit: kWh, writable: true, max: 9999999, poll: slow}
  - {key: x.address_baud, label: Baud rate status word, table: holding, address: 12, type: u16, bits: [8, 15], writable: true, poll: slow, note: 'A code, not the rate; the codes aren''t listed.'}
  - {key: x.unit_address, label: Communication address, table: holding, address: 12, type: u16, bits: [0, 7], writable: true, poll: slow}

enums:
  output: {'0': Output off, '1': Output on}

flags:
  alarms: {'0': Overvoltage, '1': Undervoltage, '2': Overcurrent, '3': Overpower, '4': Over-current (second entry), '5': Over-temperature, '6': Voltage imbalance, '7': Current imbalance}

problems:
  - {when: {key: x.alarms, bit: 0}, kind: warning, text: Overvoltage (alarm bit 0)}
  - {when: {key: x.alarms, bit: 1}, kind: warning, text: Undervoltage (alarm bit 1)}
  - {when: {key: x.alarms, bit: 2}, kind: warning, text: Overcurrent (alarm bit 2)}
  - {when: {key: x.alarms, bit: 3}, kind: warning, text: Overpower (alarm bit 3)}
  - {when: {key: x.alarms, bit: 4}, kind: warning, text: Over-current (alarm bit 4)}
  - {when: {key: x.alarms, bit: 5}, kind: warning, text: Over-temperature (alarm bit 5)}
  - {when: {key: x.alarms, bit: 6}, kind: warning, text: Voltage imbalance (alarm bit 6)}
  - {when: {key: x.alarms, bit: 7}, kind: warning, text: Current imbalance (alarm bit 7)}

notes:
- The register table gives decimal and hex addresses (12 = 0x000C …); they are taken as 0-based protocol addresses. Function
  03 per the table's example response; 32-bit values are high word first (stated).
- The table lists bit 4 of the alarm word as over-current like bit 2, and bit 7 as "current balance"; read here as current
  imbalance.
- 'Register 12: high byte = baud rate code, low byte = unit address. Neither the baud rate codes, the serial format nor the
  factory address is given: unit 1 is assumed, and no serial settings are stated here.'
- 'Write-only registers left out: 75 (clear energy usage) and 76 (meter cleared), both take 0x5AA5 as a single-register write.
  Also left out: per-phase reactive power (33–37), per-phase apparent power (41–45), per-phase power factor (48–50) and the
  screensaver time (71).'
- Writes to the output state (63) and the clear registers must be single-register writes; the protection limits 64 ff. may
  be written together.
