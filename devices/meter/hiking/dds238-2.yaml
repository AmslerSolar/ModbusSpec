modbusspec: 0
id: hiking-dds238-2
manufacturer: Hiking
name: DDS238-2 ZN/S single-phase energy meter
kind: meter

sources:
- id: tasmota
  title: Tasmota (energy meter drivers)
  url: https://github.com/arendst/Tasmota
  license: GPL-3.0
  commit: 4df6fa1d4bf6c4e98765eb76a096a597fb5af709
  path: tasmota/tasmota_xnrg_energy/xnrg_09_dds2382.ino

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600

defaults:
  verified: false
  sources:
  - tasmota

models:
  - {id: v1, name: DDS238-2 ZN/S version 1}
  - {id: v2, name: DDS238-2 ZN/S version 2}

points:
  - {key: x.export_active_v1, label: Export active energy, table: holding, address: 4, type: u32, unit: kWh, scale: 0.01, models: [v1]}
  - {key: x.import_active_v1, label: Import active energy, table: holding, address: 6, type: u32, unit: kWh, scale: 0.01, models: [v1]}
  - {key: x.export_active_v2, label: Export active energy, table: holding, address: 8, type: u32, unit: kWh, scale: 0.01, models: [v2]}
  - {key: x.import_active_v2, label: Import active energy, table: holding, address: 10, type: u32, unit: kWh, scale: 0.01, models: [v2]}
  - {key: l1_voltage, label: Voltage, table: holding, address: 12, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Current, table: holding, address: 13, type: u16, unit: A, scale: 0.01}
  - {key: x.active_power, label: Active power, table: holding, address: 14, type: u16, unit: W}
  - {key: reactive_power, label: Reactive power, table: holding, address: 15, type: s16, unit: var}
  - {key: power_factor, label: Power factor, table: holding, address: 16, type: u16, scale: 0.001}
  - {key: frequency, label: Frequency, table: holding, address: 17, type: u16, unit: Hz, scale: 0.01}

notes:
- Two versions keep the export and import counters at different addresses; Tasmota can't tell them apart and lets the user
  choose (SetOption71).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
