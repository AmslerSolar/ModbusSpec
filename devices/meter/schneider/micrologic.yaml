modbusspec: 0
id: schneider-micrologic
manufacturer: Schneider Electric
name: MicroLogic trip units (ComPacT / MasterPacT)
kind: meter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/schneider-micrologic.yaml

connection:
  default_port: 502
  default_unit: 255
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
    format: 8E1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_current, label: Grid L1 current, table: holding, address: 32027, type: f32, unit: A, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l2_current, label: Grid L2 current, table: holding, address: 32029, type: f32, unit: A, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l3_current, label: Grid L3 current, table: holding, address: 32031, type: f32, unit: A, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l1_voltage, label: Grid L1 voltage, table: holding, address: 32061, type: f32, unit: V, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l2_voltage, label: Grid L2 voltage, table: holding, address: 32063, type: f32, unit: V, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l3_voltage, label: Grid L3 voltage, table: holding, address: 32065, type: f32, unit: V, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l1_power, label: Grid L1 power, table: holding, address: 32071, type: f32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l2_power, label: Grid L2 power, table: holding, address: 32073, type: f32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l3_power, label: Grid L3 power, table: holding, address: 32075, type: f32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: grid_power, label: Grid power, table: holding, address: 32077, type: f32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: grid_import_energy, label: Grid energy, table: holding, address: 32103, type: u64, unit: kWh, scale: 0.001, invalid: [18446744073709551615], note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: grid_export_energy, label: Grid return energy, table: holding, address: 32107, type: u64, unit: kWh, scale: 0.001, invalid: [18446744073709551615], note: 'evcc reads it for the usages grid, pv, charge.'}

notes:
- 'evcc template `schneider-micrologic` (grid, pv, charge) lists: Schneider Electric ComPacT NSX (MicroLogic E); Schneider
  Electric ComPacT NS (MicroLogic P/H); Schneider Electric MasterPacT NT/NW (MicroLogic P/H); Schneider Electric MasterPacT
  MTZ (MicroLogic X).'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
