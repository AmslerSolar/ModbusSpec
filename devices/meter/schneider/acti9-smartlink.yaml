modbusspec: 0
id: schneider-acti9-smartlink
manufacturer: Schneider Electric
name: Acti9 Smartlink
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.schneider.acti9.smartlink/src/io/openems/edge/meter/schneider/acti9/smartlink/MeterSchneiderActi9SmartlinkImpl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: l1_current, label: Current L1, table: input, address: 2999, type: f32, unit: A}
  - {key: l2_current, label: Current L2, table: input, address: 3001, type: f32, unit: A}
  - {key: l3_current, label: Current L3, table: input, address: 3003, type: f32, unit: A}
  - {key: l1_voltage, label: Voltage L1, table: input, address: 3027, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2, table: input, address: 3029, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3, table: input, address: 3031, type: f32, unit: V}
  - {key: x.active_power_l1, label: Active Power L1, table: input, address: 3053, type: f32, unit: W}
  - {key: x.active_power_l2, label: Active Power L2, table: input, address: 3055, type: f32, unit: W}
  - {key: x.active_power_l3, label: Active Power L3, table: input, address: 3057, type: f32, unit: W}
  - {key: x.active_power, label: Active Power, table: input, address: 3059, type: f32, unit: W}
  - {key: reactive_power, label: Reactive Power, table: input, address: 3067, type: f32, unit: var}
  - {key: frequency, label: Frequency, table: input, address: 3109, type: f32, unit: Hz}
  - {key: x.active_consumption_energy, label: Active Consumption Energy, table: input, address: 3207, type: u64, unit: kWh, scale: 0.001}
  - {key: x.active_production_energy, label: Active Production Energy, table: input, address: 3211, type: u64, unit: kWh, scale: 0.001}

notes:
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
