modbusspec: 0
id: fif-le01mr
manufacturer: F&F
name: LE-01MR single-phase energy meter
kind: meter

sources:
- id: tasmota
  title: Tasmota (energy meter drivers)
  url: https://github.com/arendst/Tasmota
  license: GPL-3.0
  commit: 4df6fa1d4bf6c4e98765eb76a096a597fb5af709
  path: tasmota/tasmota_xnrg_energy/xnrg_13_fif_le01mr.ino

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8E1

defaults:
  verified: false
  sources:
  - tasmota

points:
  - {key: frequency, label: Frequency, table: holding, address: 304, type: u16, unit: Hz, scale: 0.01}
  - {key: l1_voltage, label: Voltage, table: holding, address: 305, type: u16, unit: V, scale: 0.01}
  - {key: l1_current, label: Current, table: holding, address: 313, type: u32, unit: A, scale: 0.001}
  - {key: x.active_power, label: Active power, table: holding, address: 320, type: u32, unit: W}
  - {key: reactive_power, label: Reactive power, table: holding, address: 328, type: u32, unit: var}
  - {key: apparent_power, label: Apparent power, table: holding, address: 336, type: u32, unit: VA}
  - {key: power_factor, label: Power factor, table: holding, address: 344, type: s16, scale: 0.001}
  - {key: grid_import_energy, label: Active energy imported, table: holding, address: 40960, type: u32, unit: kWh, scale: 0.01}
  - {key: x.reactive_energy_imported, label: Reactive energy imported, table: holding, address: 40990, type: u32, unit: kvarh, scale: 0.01, note: When the meter is switched to bidirectional counting this register holds the exported active energy (kWh) instead.}

notes:
- Factory serial settings are 9600 baud 8E1; Tasmota needs the meter reconfigured (with F&F's LE-Config software) to 2400
  or 9600 baud without parity.
- 32-bit values are sent high word first.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
