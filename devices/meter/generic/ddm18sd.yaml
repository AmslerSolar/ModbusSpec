modbusspec: 0
id: generic-ddm18sd
manufacturer: Generic
name: DDM18SD single-phase energy meter
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/ddm18sd.go

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  checks:
  - - table: input
      address: 0
      type: f32
      range:
      - 99.0
      - 121.0
    - table: input
      address: 0
      type: f32
      range:
      - 207.0
      - 253.0

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: l1_voltage, label: Voltage, table: input, address: 0, type: f32, unit: V}
  - {key: l1_current, label: Current, table: input, address: 8, type: f32, unit: A}
  - {key: x.power, label: Power, table: input, address: 18, type: f32, unit: W}
  - {key: reactive_power, label: Reactive Power, table: input, address: 26, type: f32, unit: var}
  - {key: power_factor, label: Cosphi, table: input, address: 42, type: f32}
  - {key: frequency, label: Frequency, table: input, address: 54, type: f32, unit: Hz}
  - {key: x.sum, label: Total Sum, table: input, address: 256, type: f32, unit: kWh}
  - {key: x.reactive_sum, label: Total Reactive, table: input, address: 1024, type: f32, unit: kvarh}

notes:
- mbmd (type code DDM) detects the meter by reading Voltage (input register 0, f32); its bus scan accepts a value within 10%
  of 110 or 230 V.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
