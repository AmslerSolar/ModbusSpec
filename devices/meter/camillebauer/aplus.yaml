modbusspec: 0
id: camillebauer-aplus
manufacturer: Camille Bauer
name: APLUS power monitor
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.camillebauer.aplus/src/io/openems/edge/meter/camillebauer/aplus/MeterCamillebauerAplusImpl.java

connection:
  default_port: 502
  default_unit: 100

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.voltage, label: Voltage, table: holding, address: 99, type: f32, unit: V, word_order: little}
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 101, type: f32, unit: V, word_order: little}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 103, type: f32, unit: V, word_order: little}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 105, type: f32, unit: V, word_order: little}
  - {key: x.current, label: Current, table: holding, address: 115, type: f32, unit: A, word_order: little}
  - {key: l1_current, label: Current L1, table: holding, address: 117, type: f32, unit: A, word_order: little}
  - {key: l2_current, label: Current L2, table: holding, address: 119, type: f32, unit: A, word_order: little}
  - {key: l3_current, label: Current L3, table: holding, address: 121, type: f32, unit: A, word_order: little}
  - {key: grid_power, label: Active Power, table: holding, address: 133, type: f32, unit: W, word_order: little, positive: import}
  - {key: l1_power, label: Active Power L1, table: holding, address: 135, type: f32, unit: W, word_order: little, positive: import}
  - {key: l2_power, label: Active Power L2, table: holding, address: 137, type: f32, unit: W, word_order: little, positive: import}
  - {key: l3_power, label: Active Power L3, table: holding, address: 139, type: f32, unit: W, word_order: little, positive: import}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 141, type: f32, unit: var, word_order: little}
  - {key: x.reactive_power_l1, label: Reactive Power L1, table: holding, address: 143, type: f32, unit: var, word_order: little}
  - {key: x.reactive_power_l2, label: Reactive Power L2, table: holding, address: 145, type: f32, unit: var, word_order: little}
  - {key: x.reactive_power_l3, label: Reactive Power L3, table: holding, address: 147, type: f32, unit: var, word_order: little}
  - {key: frequency, label: Frequency, table: holding, address: 157, type: f32, unit: Hz, word_order: little}

notes:
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
