notes:
- 'A rail-mounted two-channel meter with six external CTs: channel 1 (CT1–3) at 0x0000…, channel 2 (CT4–6) at 0x1000…, each
  a full three-phase measurement. The document doesn''t say which channel goes where (e.g. grid or PV), so their powers and
  energies use device keys; the phase voltages and frequency of channel 1 use the standard keys.'
- Addresses are the spreadsheet's hex start addresses (0-based protocol addresses). The spreadsheet names no function codes;
  all registers are taken as holding registers (function 03), assumed. Two-register values are taken as high word first, assumed
  (not stated).
- Currents, powers and power factors marked signed in the document are sign-magnitude (top bit = sign). Powers are given in
  kW / kvar / kVA with three decimals, so the raw value is W / var / VA. Energies are unsigned, 0.01 kWh / kvarh.
- 'Alarm word: the document numbers bits per byte; bits 8…12 here are bits 0…4 of the high byte. Loss-of-current alarms (bits
  3…5) are not reported as problems, since an unloaded phase may trigger them.'
- 'Serial defaults: 9600 Bd is stated as the default; parity (none) and unit id 1 are assumed. Settings register 0x0103 also
  holds the baud and parity in bits 8…15; bits 0…7 are not described.'
- 'Identification: the channel 1 frequency must be plausible (45…65 Hz) and the model register must hold printable text; the
  model text itself is not given in the document.'
- 'Left out: tariff (sharp / peak / flat / valley) energies, storage-area counters (0x4019…), event counters other than power-down,
  the clock (0x0104…0x0106, layout not given), tariff time tables, settlement days, event thresholds, event and freeze records,
  the DL/T 645 and factory addresses. The PT / CT ratio registers are marked reserved.'
- The project reaches the device through a Solarman Wi-Fi / LAN data logger (its own V5 protocol on TCP 8899) or over plain
  Modbus TCP / RTU; the register map is the same.
