  alarm: {'0': Phase A loss of voltage, '1': Phase B loss of voltage, '2': Phase C loss of voltage, '3': Phase A loss of current, '4': Phase B loss of current, '5': Phase C loss of current, '6': Phase A overvoltage, '7': Phase B overvoltage, '8': Phase C overvoltage, '9': Phase A overcurrent, '10': Phase B overcurrent, '11': Phase C overcurrent, '12': Voltage reverse phase sequence}

