modbusspec: 0
id: eastron-sdm54
manufacturer: Eastron
name: SDM54 three-phase energy meter
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/sdm54.go

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  checks:
  - - table: input
      address: 0
      type: f32
      range:
      - 99.0
      - 121.0
    - table: input
      address: 0
      type: f32
      range:
      - 207.0
      - 253.0

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: l1_voltage, label: L1 Voltage, table: input, address: 0, type: f32, unit: V}
  - {key: l2_voltage, label: L2 Voltage, table: input, address: 2, type: f32, unit: V}
  - {key: l3_voltage, label: L3 Voltage, table: input, address: 4, type: f32, unit: V}
  - {key: l1_current, label: L1 Current, table: input, address: 6, type: f32, unit: A}
  - {key: l2_current, label: L2 Current, table: input, address: 8, type: f32, unit: A}
  - {key: l3_current, label: L3 Current, table: input, address: 10, type: f32, unit: A}
  - {key: x.power_l1, label: L1 Power, table: input, address: 12, type: f32, unit: W}
  - {key: x.power_l2, label: L2 Power, table: input, address: 14, type: f32, unit: W}
  - {key: x.power_l3, label: L3 Power, table: input, address: 16, type: f32, unit: W}
  - {key: x.apparent_power_l1, label: L1 Apparent Power, table: input, address: 18, type: f32, unit: VA}
  - {key: x.apparent_power_l2, label: L2 Apparent Power, table: input, address: 20, type: f32, unit: VA}
  - {key: x.apparent_power_l3, label: L3 Apparent Power, table: input, address: 22, type: f32, unit: VA}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: input, address: 24, type: f32, unit: var}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: input, address: 26, type: f32, unit: var}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: input, address: 28, type: f32, unit: var}
  - {key: x.cosphi_l1, label: L1 Cosphi, table: input, address: 30, type: f32}
  - {key: x.cosphi_l2, label: L2 Cosphi, table: input, address: 32, type: f32}
  - {key: x.cosphi_l3, label: L3 Cosphi, table: input, address: 34, type: f32}
  - {key: x.power, label: Power, table: input, address: 52, type: f32, unit: W}
  - {key: apparent_power, label: Apparent Power, table: input, address: 56, type: f32, unit: VA}
  - {key: reactive_power, label: Reactive Power, table: input, address: 60, type: f32, unit: var}
  - {key: power_factor, label: Cosphi, table: input, address: 62, type: f32}
  - {key: x.phase_angle, label: Phase Angle, table: input, address: 66, type: f32, unit: °}
  - {key: frequency, label: Frequency, table: input, address: 70, type: f32, unit: Hz}
  - {key: grid_import_energy, label: Total Import, table: input, address: 72, type: f32, unit: kWh}
  - {key: grid_export_energy, label: Total Export, table: input, address: 74, type: f32, unit: kWh}
  - {key: x.thd_l1, label: L1 Voltage to neutral THD, table: input, address: 234, type: f32, unit: '%'}
  - {key: x.thd_l2, label: L2 Voltage to neutral THD, table: input, address: 236, type: f32, unit: '%'}
  - {key: x.thd_l3, label: L3 Voltage to neutral THD, table: input, address: 238, type: f32, unit: '%'}
  - {key: x.thd, label: Average voltage to neutral THD, table: input, address: 248, type: f32, unit: '%'}
  - {key: x.sum, label: Total Sum, table: input, address: 342, type: f32, unit: kWh}
  - {key: x.reactive_sum, label: Total Reactive, table: input, address: 344, type: f32, unit: kvarh}
  - {key: x.import_l1, label: L1 Import, table: input, address: 346, type: f32, unit: kWh}
  - {key: x.import_l2, label: L2 Import, table: input, address: 348, type: f32, unit: kWh}
  - {key: x.import_l3, label: L3 Import, table: input, address: 350, type: f32, unit: kWh}
  - {key: x.export_l1, label: L1 Export, table: input, address: 352, type: f32, unit: kWh}
  - {key: x.export_l2, label: L2 Export, table: input, address: 354, type: f32, unit: kWh}
  - {key: x.export_l3, label: L3 Export, table: input, address: 356, type: f32, unit: kWh}
  - {key: x.sum_l1, label: L1 Sum, table: input, address: 358, type: f32, unit: kWh}
  - {key: x.sum_l2, label: L2 Sum, table: input, address: 360, type: f32, unit: kWh}
  - {key: x.sum_l3, label: L3 Sum, table: input, address: 362, type: f32, unit: kWh}
  - {key: x.sum_t1, label: Tariff 1 Sum, table: input, address: 4876, type: f32, unit: kWh}
  - {key: x.sum_t2, label: Tariff 2 Sum, table: input, address: 4878, type: f32, unit: kWh}
  - {key: x.import_t1, label: Tariff 1 Import, table: input, address: 4884, type: f32, unit: kWh}
  - {key: x.import_t2, label: Tariff 2 Import, table: input, address: 4886, type: f32, unit: kWh}
  - {key: x.export_t1, label: Tariff 1 Export, table: input, address: 4892, type: f32, unit: kWh}
  - {key: x.export_t2, label: Tariff 2 Export, table: input, address: 4894, type: f32, unit: kWh}
  - {key: x.reactive_sum_t1, label: Tariff 1 Reactive, table: input, address: 4900, type: f32, unit: kvarh}
  - {key: x.reactive_sum_t2, label: Tariff 2 Reactive, table: input, address: 4902, type: f32, unit: kvarh}
  - {key: x.reactive_import_t1, label: Tariff 1 Reactive Import, table: input, address: 4908, type: f32, unit: kvarh}
  - {key: x.reactive_import_t2, label: Tariff 2 Reactive Import, table: input, address: 4910, type: f32, unit: kvarh}
  - {key: x.reactive_export_t1, label: Tariff 1 Reactive Export, table: input, address: 4916, type: f32, unit: kvarh}
  - {key: x.reactive_export_t2, label: Tariff 2 Reactive Export, table: input, address: 4918, type: f32, unit: kvarh}

notes:
- mbmd (type code SDM54) detects the meter by reading L1 Voltage (input register 0, f32); its bus scan accepts a value within
  10% of 110 or 230 V.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
