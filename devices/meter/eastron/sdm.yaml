  - {key: x.l1_voltage_thd, label: Phase 1 L/N volts THD, table: input, address: 234, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l2_voltage_thd, label: Phase 2 L/N volts THD, table: input, address: 236, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l3_voltage_thd, label: Phase 3 L/N volts THD, table: input, address: 238, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l1_current_thd, label: Phase 1 current THD, table: input, address: 240, type: f32, unit: '%', models: [sdm630]}
