  - {key: l3_voltage, label: Phase 3 line to neutral volts, table: input, address: 4, type: f32, unit: V, models: [sdm630]}
  - {key: l1_current, label: Phase 1 current, table: input, address: 6, type: f32, unit: A, models: [sdm630, sdm120]}
  - {key: l2_current, label: Phase 2 current, table: input, address: 8, type: f32, unit: A, models: [sdm630]}
  - {key: l3_current, label: Phase 3 current, table: input, address: 10, type: f32, unit: A, models: [sdm630]}
  - {key: l1_power, label: Phase 1 power, table: input, address: 12, type: f32, unit: W, models: [sdm630], positive: import, verified: false}
  - {key: l2_power, label: Phase 2 power, table: input, address: 14, type: f32, unit: W, models: [sdm630], positive: import, verified: false}
  - {key: l3_power, label: Phase 3 power, table: input, address: 16, type: f32, unit: W, models: [sdm630], positive: import, verified: false}
  - {key: x.l1_apparent_power, label: Phase 1 volt amps, table: input, address: 18, type: f32, unit: VA, models: [sdm630]}
  - {key: x.l2_apparent_power, label: Phase 2 volt amps, table: input, address: 20, type: f32, unit: VA, models: [sdm630]}
