  - {key: x.l1_reactive_power, label: Phase 1 volt amps reactive, table: input, address: 24, type: f32, unit: var, models: [sdm630]}
  - {key: x.l2_reactive_power, label: Phase 2 volt amps reactive, table: input, address: 26, type: f32, unit: var, models: [sdm630]}
  - {key: x.l3_reactive_power, label: Phase 3 volt amps reactive, table: input, address: 28, type: f32, unit: var, models: [sdm630]}
  - {key: x.l1_power_factor, label: Phase 1 power factor, table: input, address: 30, type: f32, unit: '', models: [sdm630], note: 'Sign = current direction: positive forward, negative reverse.'}
  - {key: x.l2_power_factor, label: Phase 2 power factor, table: input, address: 32, type: f32, unit: '', models: [sdm630], note: 'Sign = current direction: positive forward, negative reverse.'}
  - {key: x.l3_power_factor, label: Phase 3 power factor, table: input, address: 34, type: f32, unit: '', models: [sdm630], note: 'Sign = current direction: positive forward, negative reverse.'}
  - {key: x.l1_phase_angle, label: Phase 1 phase angle, table: input, address: 36, type: f32, unit: °, models: [sdm630]}
  - {key: x.l2_phase_angle, label: Phase 2 phase angle, table: input, address: 38, type: f32, unit: °, models: [sdm630]}
  - {key: x.l3_phase_angle, label: Phase 3 phase angle, table: input, address: 40, type: f32, unit: °, models: [sdm630]}
  - {key: x.average_voltage, label: Average line to neutral volts, table: input, address: 42, type: f32, unit: V, models: [sdm630]}
  - {key: x.average_current, label: Average line current, table: input, address: 46, type: f32, unit: A, models: [sdm630]}
