  - {key: grid_power, label: Total system power, table: input, address: 52, type: f32, unit: W, models: [sdm630], positive: import, note: 'Neither document states the sign. SDM630 note 1: the power factor sign shows the current direction (positive = forward); note 2: power demand = import − export. Derived: positive = import.', verified: false}
