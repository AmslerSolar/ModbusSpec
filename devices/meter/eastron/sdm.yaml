connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 80
    even_address: true
    max_gap: 2
  write_multiple: true

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: input
    address: 70
    type: f32
    plausible:
    - 40
    - 70

identify:
  serial:
    table: holding
    address: 64512
    type: u32
  checks:
  - table: input
    address: 70
    type: f32
    range:
    - 40
    - 70


models:
  - {id: sdm120, name: SDM120, match: {table: holding, address: 64514, type: u16, equals: 32}}
  - {id: sdm630, name: SDM630, match: {table: holding, address: 10, type: f32, in: [1, 2, 3]}}
  - {id: eastron_sdm_sdm120, name: SDM120 / SDM120CT, match: {table: holding, address: 64514, type: u16, equals: 32}}
  - {id: eastron_sdm_sdm630, name: SDM630, match: {table: holding, address: 64514, type: u16, equals: 112}}
  - {id: mbmd_sdm630, name: SDM630}
  - {id: modbus_local_gateway_sdm630, name: SDM-630}
  - {id: openems_sdm630, name: SDM630 / SDM72D-M-2}

