notes:
- Measurements are input registers (FC 04); settings and the serial number are holding registers (FC 03).
- A real SDM630 answered holding registers no document lists (e.g. 0x8960) with 0 instead of an exception, and read 0 at 0xFC02
  / 0xFC03 (meter code, software version).
- Every value below 0xF000 is an IEEE 754 float in two registers; the SDM120's F900h / F910h / F920h settings and the demand
  reset are single 16-bit registers (read F900h ff. as a register pair to keep the address and count even; unverified that
  the meter accepts it). The meter's "Register order" setting can reverse the words; only the older Eastron Europe SDM630
  document gives its address (holding 0x0028), so readers detect the order from the frequency.
- 'SDM630 in 3 phase 3 wire: line-to-neutral values aren''t measured (read as 0).'
- Start address and count must be even; at most 40 values (80 registers) per request. The SDM630 1.7 overview says 30 values
  (60 registers), its register section 40.
- 'SDM630 1.7: in 3 phase 3 wire, per-phase power, VA, var, power factor, phase angle and line-to-neutral values read 0; in
  1 phase 2 wire, phase 2 and 3 values (and line-to-line values) read 0.'
- 'Older Eastron Europe SDM630 document (2018 v2.0): the power factor sign shows the load (positive capacitive, negative inductive)
  instead of the current direction; holding 0x0056 / 0x0058 are relay 1 / relay 2 energy types (0 = off, 37 = import Wh, 39
  = import varh; default 37) instead of the pulse energy type table; its pulse divisor is an index 2 … 6 (Wh / 10^n, default
  3); password at holding 0x0018 (default 0000), left out here. Its hex column is shifted for 40009 … 40013; the register
  numbers are used.'
- 'Older Eastron Europe SDM120 document (undated): 9600 baud default with 3 = 19200 and 4 = 38400 in the baud table; phase
  angle at input 0x0024; relay pulse width at holding 0x000A (default 200 ms); a BCD register at holding 0xF500 packing demand
  interval, slide time, scroll time and backlight time (min-min-s-min); holding 0xF930 a read-only pulse output and LED mode
  (0 = import and export, 1 = import only, 2 = export only). Newer editions list none of these.'
- 'Defaults: node address 1, 8N1; SDM630 9600 baud, SDM120 2400 baud. Parity, node address and baud rate take effect after
  a restart; the SDM630 system type needs the password.'
- Models modbus_local_gateway_sdm630, openems_sdm630 come from projects and are listed after a model without a match, so detection
  never reaches them; their points apply only when a reader selects such a model by hand.
- Measurements are input registers (function 04), settings and identity holding registers (function 03); every measurement
  is a 32-bit float, most significant register first.
- Network settings (parity, node address, baud rate) are floats holding small integers.
- 'evcc template `eastron-sdm120` (grid, pv, charge) lists: Eastron SDM120-Modbus.'
- 'SDM630: mbmd (type code SDM) detects the meter by reading L1 Voltage (input register 0, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.'
- 'SDM120: mbmd (type code SDM120) detects the meter by reading Voltage (input register 0, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.'
- OpenEMS lists the bundle as Eastron / Microcare SDM meters.
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Phase values are for the default phase rotation L1-L2-L3.
- openWB reads an SDM630/SDM72 as charge point meter at unit 105 (charge point 0) or 106 (charge point 1); some SDM72 answer
  only short block reads.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- Tasmota's default baud rate is 2400 for the SDM120 / SDM220 driver and 9600 for the SDM630 driver.
- Identification as eastron-sdm recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
