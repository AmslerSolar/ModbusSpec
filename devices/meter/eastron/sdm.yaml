  - {key: x.average_voltage_thd, label: Average line to neutral volts THD, table: input, address: 248, type: f32, unit: '%', models: [sdm630]}
  - {key: x.average_current_thd, label: Average line current THD, table: input, address: 250, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l1_l2_voltage_thd, label: Line 1 to line 2 volts THD, table: input, address: 334, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l2_l3_voltage_thd, label: Line 2 to line 3 volts THD, table: input, address: 336, type: f32, unit: '%', models: [sdm630]}
  - {key: x.l3_l1_voltage_thd, label: Line 3 to line 1 volts THD, table: input, address: 338, type: f32, unit: '%', models: [sdm630]}
  - {key: x.average_line_voltage_thd, label: Average line to line volts THD, table: input, address: 340, type: f32, unit: '%', models: [sdm630]}
  # SDM120 demand values (2.5, 2.8)
  - {key: x.total_power_demand, label: Total system power demand, table: input, address: 84, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.max_total_power_demand, label: Maximum total system power demand, table: input, address: 86, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.import_power_demand, label: Import system power demand, table: input, address: 88, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.max_import_power_demand, label: Maximum import system power demand, table: input, address: 90, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.export_power_demand, label: Export system power demand, table: input, address: 92, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.max_export_power_demand, label: Maximum export system power demand, table: input, address: 94, type: f32, unit: W, models: [sdm120], poll: slow}
  - {key: x.current_demand, label: Current demand, table: input, address: 258, type: f32, unit: A, models: [sdm120], poll: slow}
  - {key: x.max_current_demand, label: Maximum current demand, table: input, address: 264, type: f32, unit: A, models: [sdm120], poll: slow}
  - {key: x.total_active_energy, label: Total active energy, table: input, address: 342, type: f32, unit: kWh, poll: slow, note: 'SDM630: import + export. SDM120: what it counts depends on the measurement mode (holding 0xF920).'}
  - {key: x.total_reactive_energy, label: Total reactive energy, table: input, address: 344, type: f32, unit: kvarh, poll: slow}
  - {key: x.demand_period, label: Demand period, table: holding, address: 2, type: f32, unit: min, writable: true, poll: slow, note: '0, 5, 8, 10, 15, 20, 30 or 60, default 60; 0 = demand values show the present value. Listed for the SDM120 from manual 2.8 on.'}
  - {key: x.system_type, label: System type, table: holding, address: 10, type: f32, models: [sdm630], enum: system_type, poll: slow}
  - {key: x.pulse_width, label: Pulse 1 width, table: holding, address: 12, type: f32, unit: ms, writable: true, poll: slow, note: '60, 100 or 200. The SDM120 calls it relay pulse width; its manual 2.8 gives 60 ms as default (2.5: 100 ms).'}
  - {key: x.parity_stop, label: Network parity and stop bits, table: holding, address: 18, type: f32, enum: parity_stop, writable: true, poll: slow, verified: true, note: Takes effect after a restart. A real SDM630 talking 8N1 read 0.}
  - {key: x.node_address, label: Network node address, table: holding, address: 20, type: f32, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.pulse_divisor, label: Pulse 1 divisor, table: holding, address: 22, type: f32, models: [sdm630], enum: pulse_divisor, writable: true, poll: slow}
  - {key: x.baud_rate, label: Network baud rate, table: holding, address: 28, type: f32, models: [sdm630], enum: baud_rate_sdm630, writable: true, poll: slow, verified: true, note: 'An index into the table, not the rate itself. A real SDM630 talking 9600 baud read 2.'}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 28, type: f32, models: [sdm120], enum: baud_rate_sdm120, writable: true, poll: slow, note: 'An index into the table, not the rate itself.'}
  - {key: x.pulse_energy_type, label: Pulse 1 energy type, table: holding, address: 86, type: f32, enum: pulse_energy_type, writable: true, poll: slow, note: The SDM120 calls it pulse 1 output mode.}
  - {key: x.scroll_time, label: Time of scroll display, table: holding, address: 63744, type: bcd16, unit: s, models: [sdm120], writable: true, poll: slow, note: '0 … 60, BCD (manual 2.8); default 0 = the display doesn''t scroll. Editions 2.4 and 2.5 give 0 … 30 as hex.'}
  - {key: x.pulse_rate, label: Pulse 1 output, table: holding, address: 63760, type: u16, models: [sdm120], enum: pulse_rate, writable: true, poll: slow}
  - {key: x.measurement_mode, label: Measurement mode, table: holding, address: 63776, type: u16, models: [sdm120], enum: measurement_mode, writable: true, poll: slow, note: Sets what the total active energy (input 0x0156) counts.}
  - {key: x.demand_reset, label: Reset maximum demand, table: holding, address: 61456, type: u16, writable: true, write_only: true, note: Writing 0000h clears the maximum demand values. Listed for the SDM120 from manual 2.8 on.}
  - {key: serial, label: Serial number, table: holding, address: 64512, type: u32, poll: slow, verified: true, note: 'Most significant word first: a real SDM630 (register order 2141.0, the default) read its serial number here with the high word first.'}
  - {key: firmware, label: Software version, table: holding, address: 64514, type: u32, bits: [0, 15], word_order: big, models: [sdm120], poll: slow, note: 'A single register at 0xFC03 (2.5), read here as the low half of the pair from 0xFC02 (meter code) to keep the address even.'}
  # Only in the older Eastron Europe SDM630 document (2018 v2.0); not in 1.7 / 1.8
  - {key: x.energy_prefix, label: Energy units prefix, table: holding, address: 30, type: f32, enum: energy_prefix, models: [sdm630], optional: true, writable: true, poll: slow, note: 'With 1, the energy registers count MWh (kVArh as Mvarh, Ah as kAh) instead of kWh; default 0.'}
  - {key: x.register_order, label: Register order, table: holding, address: 40, type: f32, models: [sdm630], optional: true, writable: true, poll: slow, verified: true, note: Write 2141.0 in the wanted word order; the meter then uses that order for all floats. A real SDM630 read 2141.0 (0x4505 0xD000).}
  - {key: x.serial_hi, label: Serial number hi, table: holding, address: 42, type: f32, models: [sdm630], optional: true, poll: slow, note: 'Only in the older Eastron Europe document; a real SDM630 holds the ASCII text "eastron1" in 0x002A–0x002D instead, so these read as meaningless floats there. The serial number is at 0xFC00.'}
  - {key: x.serial_lo, label: Serial number lo, table: holding, address: 44, type: f32, models: [sdm630], optional: true, poll: slow, note: As 0x002A.}
  - {key: x.reset_logged_data, label: Reset logged data, table: holding, address: 216, type: f32, enum: reset_logged_data, models: [sdm630], optional: true, writable: true}
  - {key: x.network_baud_rate_28, label: Network baud rate, table: holding, address: 28, type: f32, enum: baud_rate, writable: true, note: 'Index into the baud-rate table, not the rate itself.', sources: [eastron-sdm, modbus-local-gateway], word_order: big, models: [eastron_sdm_sdm120, eastron_sdm_sdm630, mbmd_sdm630, modbus_local_gateway_sdm630, openems_sdm630], verified: false}
  - {key: x.unit_prefix, label: Energy Units Prefix, table: holding, address: 30, type: f32, enum: unit_prefix, models: [modbus_local_gateway_sdm630], writable: true, sources: [modbus-local-gateway], word_order: big, verified: false}
  - {key: x.software_version, label: Software version, table: holding, address: 64514, type: u32, bits: [0, 15], note: 'High byte = major, low byte = minor version.', sources: [eastron-sdm], word_order: big, models: [eastron_sdm_sdm120, eastron_sdm_sdm630, mbmd_sdm630, modbus_local_gateway_sdm630, openems_sdm630], verified: false}
  - {key: x.meter_code, label: Meter code, table: holding, address: 64514, type: u32, bits: [16, 31], enum: meter_code, note: 'Documented codes: SDM120 0x0020, SDM630MCT 0x0079, SDM72D-M-1 0x0084, SDM72DM-V2 0x0089; 0x0070 (SDM630) only from field reports. Some meters report other values (0x0004 on an SDM120, 0x1010 on an SDM630).', sources: [eastron-sdm], word_order: big, verified: false}
