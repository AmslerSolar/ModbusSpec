  - {key: apparent_power, label: Total system volt amps, table: input, address: 56, type: f32, unit: VA, models: [sdm630]}
  - {key: reactive_power, label: Total system VAr, table: input, address: 60, type: f32, unit: var, models: [sdm630]}
  - {key: power_factor, label: Total system power factor, table: input, address: 62, type: f32, unit: '', models: [sdm630], note: 'Sign = current direction: positive forward, negative reverse (1.7).'}
  - {key: x.phase_angle, label: Total system phase angle, table: input, address: 66, type: f32, unit: °, models: [sdm630]}
  - {key: apparent_power, label: Apparent power, table: input, address: 18, type: f32, unit: VA, models: [sdm120]}
  - {key: reactive_power, label: Reactive power, table: input, address: 24, type: f32, unit: var, models: [sdm120]}
  - {key: power_factor, label: Power factor, table: input, address: 30, type: f32, unit: '', models: [sdm120]}
