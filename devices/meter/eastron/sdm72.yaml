connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 60
    even_address: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 64512
    type: u32
  checks:
  # meter code
  - table: holding
    address: 64514
    type: u16
    in:
    - 132
    - 137

models:
  - {id: sdm72d_m1, name: SDM72D-M-1, match: {table: holding, address: 64514, type: u16, equals: 132}}
  - {id: sdm72d_m2, name: SDM72D-M-2, match: {table: holding, address: 64514, type: u16, equals: 137}}
  - {id: eastron_sdm_sdm72d_m_1, name: SDM72D-M-1, match: {table: holding, address: 64514, type: u16, equals: 132}}
  - {id: eastron_sdm_sdm72dm_v2, name: SDM72DM-V2, match: {table: holding, address: 64514, type: u16, equals: 137}}
  - {id: mbmd_sdm72dm_v2, name: SDM72DM-V2}

points:
