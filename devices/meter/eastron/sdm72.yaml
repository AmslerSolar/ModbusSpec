enums:
  parity_stop: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}
  baud_rate: {'0': '2400', '1': '4800', '2': '9600', '3': '19200', '5': '1200'}
  meter_code: {'132': SDM72D-M-1, '137': SDM72D-M-2}
  system_type: {'1': 1 phase 2 wire, '3': 3 phase 4 wire}
  kppa: {'0': Not authorised, '1': Authorised}
  pulse_constant: {'0': 1000 imp/kWh, '1': 100 imp/kWh, '2': 10 imp/kWh, '3': 1 imp/kWh}
  pulse_energy_type: {'1': Import active energy, '2': Total active energy, '4': Export active energy}

notes:
- 'Addresses: the manual numbers registers 30001 ff. (input) and 40001 ff. (holding) and also gives the hex start address;
  the hex address is used here (register number − 30001 or − 40001). For the F0xx / FCxx registers it numbers them 4xxxxx
  (e.g. 464513 = 0xFC00).'
- 'The models are told apart by the meter code at holding 0xFC02: 0x0084 SDM72D-M-1, 0x0089 SDM72D-M-2. The SDM72D-M-1 manual
  lists only the registers without `models` (no voltage, current or frequency registers); the SDM72D-M-2 manual adds the rest.'
- The SDM72D-M-2 table skips phase 3 line-to-neutral volts (input 0x0004) although the meter displays it; left out here as
  it isn't in the table (unverified whether the meter answers it).
- In 1 phase 2 wire mode (SDM72D-M-2) the values that don't apply to the wiring read 0.
- Every value is an IEEE 754 float in two registers, except the reset, meter code and software version (one register each)
  and the serial number (u32). At most 30 values (60 registers) per request.
- The manual says the word order switches itself between normal and reversed and can't be set; not stated how. Most significant
  register first assumed (unverified).
- 'Defaults: address 1, 9600 baud, no parity, 1 stop bit. 19200 baud (3) is in the SDM72D-M-2 table; the SDM72D-M-1 menu offers
  it too, though its register table doesn''t list it.'
- 'SDM72D-M-2 pulse output: default 1000 imp/kWh with a fixed 35 ms pulse.'
- 'Left out: the password register (holding 0x0018; default password 1000).'
- 'Left out: Software version (holding 64514, u32) from eastron-sdm overlaps x.meter_code from the documents.'
- 'Left out: Meter code (holding 64514, u32) from eastron-sdm overlaps x.meter_code from the documents.'
- Measurements are input registers (function 04), settings and identity holding registers (function 03); every measurement
  is a 32-bit float, most significant register first.
- Network settings (parity, node address, baud rate) are floats holding small integers.
- The SDM72D-M (first version) has no voltage register in mbmd, so mbmd can't detect it.
- 'SDM72DM-V2: mbmd (type code SDM72V2) detects the meter by reading L1 Voltage (input register 0, f32); its bus scan accepts
  a value within 10% of 110 or 230 V.'
- Identification as eastron-sdm recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
