  - {key: l1_power, label: Phase 1 active power, table: input, address: 12, type: f32, unit: W, positive: import, verified: false, note: Not stated in the document; assumed like the total power.}
  - {key: l2_power, label: Phase 2 active power, table: input, address: 14, type: f32, unit: W, positive: import, verified: false, note: Not stated in the document; assumed like the total power.}
  - {key: l3_power, label: Phase 3 active power, table: input, address: 16, type: f32, unit: W, positive: import, verified: false, note: Not stated in the document; assumed like the total power.}
  - {key: x.import_power, label: Total import active power, table: input, address: 1280, type: f32, unit: W}
  - {key: x.export_power, label: Total export active power, table: input, address: 1282, type: f32, unit: W}
