enums:
  phase_sequence: {'1': Normal, '2': Reverse, '3': Phase missing}
  load_nature: {'1': Resistive, '2': Inductive, '3': Capacitive}
  demand_method: {'0': Sliding window, '1': Fixed window}
  system_type: {'1': 1 phase 2 wire, '2': 3 phase 3 wire, '3': 3 phase 4 wire}
  kppa: {'0': Not authorized, '1': Authorized}
  parity_stop: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}
  baud_rate: {'0': '2400', '1': '4800', '2': '9600', '3': '19200', '4': '38400'}
  pulse_rate: {'0': 0.001 kWh/imp, '1': 0.01 kWh/imp, '2': 0.1 kWh/imp, '3': 1 kWh/imp, '4': 10 kWh/imp, '5': 100 kWh/imp, '6': 1000 kWh/imp}
  current_direction: {'0': All forward, '1': L1 reversed, '2': L2 reversed, '3': L1 and L2 reversed, '4': L3 reversed, '5': L1 and L3 reversed, '6': L2 and L3 reversed, '7': All reversed}
  pulse_energy_type: {'1': Import active energy, '2': Total active energy, '4': Export active energy, '5': Import reactive energy, '6': Total reactive energy, '8': Export reactive energy}
  reset: {'0': Clear demand values, '3': Clear energy counters (not on MID meters), '4': Clear maximum and minimum values}

notes:
- 'Addresses: the document numbers registers 30001 ff. (input) and 40001 ff. (holding) and gives the hex start address; the
  hex address is used here (register number − 30001 or − 40001). F004h, F010h and FC00h are numbered 4xxxxx (e.g. 461457 =
  0xF010).'
- Measurements are input registers (FC 04), settings holding registers (FC 03). Every value is an IEEE 754 float in two registers
  except the running time (BCD), the reset (one register) and the serial number (u32).
- The document gives no word order, no register-order setting, no serial defaults beyond 9600 baud and 8N1, and no request
  size limit; floats are assumed most significant register first like the other Eastron meters, and start address and count
  even. Not stated in the document; assumed.
- '3 phase 3 wire: line-to-neutral, per-phase power and neutral values read as 0; 1 phase 2 wire: only phase 1 values.'
- Power factor sign follows the current direction (positive = forward). The password (for KPPA) defaults to 1000 and can be
  read at holding 0x0018.
- 'Identification: frequency plausible and a PT1 value (holding 0x002E) in its documented range; the PT1 check is only an
  assumption that other Eastron meters don''t answer there with such a value.'
- 'Left out: the individual harmonics 2 … 63 (input 0x0192 ff., 62 floats per phase for voltage and current) and the maximum
  / minimum values of currents and voltages (input 0x0A70 … 0x0AB2).'
- mbmd (type code X961A) detects the meter by reading L1 Voltage (input register 0, f32); its bus scan accepts a value within
  10% of 110 or 230 V.
- Identification as mbmd recognises the device (not checked against a document).
