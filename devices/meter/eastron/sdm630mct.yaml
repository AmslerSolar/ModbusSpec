  url: https://github.com/LavermanJJ/home-assistant-eastron-sdm
  license: Apache-2.0
  commit: b857f063adcec4145cd27422137483ef89ab64f3
  path: custom_components/eastron_sdm/sdm/

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 60
    even_address: true
  write_multiple: true

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: input
    address: 70
    type: f32
    plausible:
    - 40
    - 70

identify:
  serial:
    table: holding
    address: 64512
    type: u32
    word_order: big
  checks:
  - table: holding
    address: 64514
    type: u16
    equals: 121

