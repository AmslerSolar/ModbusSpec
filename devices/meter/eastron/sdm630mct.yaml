  - {key: x.pt_ratio, label: PT ratio, table: holding, address: 64, type: f32, writable: true, min: 1, max: 2000, poll: slow, note: Primary ÷ secondary voltage. Needs the password; not on MID meters.}
  - {key: x.pulse_energy_type, label: Pulse 1 Energy Type, table: holding, address: 86, type: f32, enum: pulse_energy_type, writable: true, poll: slow, note: Default 39 (total kvarh).}
  - {key: x.reset, label: Reset, table: holding, address: 61456, type: u16, writable: true, write_only: true, note: '0x0000 clears the maximum demand values, 0x0003 the resettable energy counters.'}
  - {key: serial, label: Serial number, table: holding, address: 64512, type: u32, word_order: big, poll: slow, verified: false, note: Unsigned 32-bit. The Register Order setting is described for floats only; assumed not to swap this.}
  - {key: x.meter_code, label: Meter code, table: holding, address: 64514, type: u32, bits: [16, 31], word_order: big, poll: slow, note: 0x0079 on the SDM630MCT. The document gives it as one register at FC02h; read here as the upper half of the FC02h–FC03h pair to keep the request even.}
  - {key: x.software_version, label: Software version, table: holding, address: 64514, type: u32, bits: [0, 15], word_order: big, poll: slow, note: The document gives it as one hex register at FC03h; read as the lower half of the FC02h–FC03h pair.}

enums:
  system_type: {'1': 1 phase 2 wire, '2': 3 phase 3 wire, '3': 3 phase 4 wire}
  password_lock: {'0': Locked, '1': Unlocked}
  parity_stop: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}
  baud_rate: {'0': '2400', '1': '4800', '2': '9600', '3': '19200', '4': '38400'}
  pulse_divisor: {'1': 0.01 kWh/imp, '2': 0.1 kWh/imp, '3': 1 kWh/imp, '4': 10 kWh/imp, '5': 100 kWh/imp, '6': 1000 kWh/imp}
  pulse_energy_type: {'37': Total active energy, '39': Total reactive energy}

notes:
- 'Addresses: the document numbers registers 30001 ff. (input) and 40001 ff. (holding) and gives the hex start address; the
  hex address is used here (register number − 30001 or − 40001). The F010h and FCxxh registers are numbered 4xxxxx (e.g. 461457
  = 0xF010). PT2 and CT2 have only a hex address.'
- Measurements are input registers (FC 04), settings and identity holding registers (FC 03, write with FC 16, one value per
  write). Every value is an IEEE 754 float in two registers except the reset (one register), the serial number (u32) and the
  meter code / software version (one register each).
- Start address and count must be even. The document states at most 30 values (60 registers) per request in one place and
  40 values in another; the lower limit is used.
- The word order is most significant register first by default; the meter has a "Register Order" setting (write 2141.0 in
  the wanted order) whose address the document doesn't give, so readers detect the order from the frequency.
- '3 phase 3 wire: line-to-neutral, per-phase power and neutral values read as 0; 1 phase 2 wire: only phase 1 values.'
- 'Defaults: node address 1, 9600 baud, 8N1; 2400 … 38400 baud selectable. Broadcast (address 0) not supported. The password
  protecting system type and ratios is given as 1000 in the register table and 0000 in the text.'
- Power factor sign follows the current direction (positive = forward).
- 'Left out: a second total system power factor at input 0x00FE (unit given as degrees, meaning unclear).'
- Measurements are input registers (function 04), settings and identity holding registers (function 03); every measurement
  is a 32-bit float, most significant register first.
- Network settings (parity, node address, baud rate) are floats holding small integers.
- Identification as eastron-sdm recognises the device (not checked against a document).
