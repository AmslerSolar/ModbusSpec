notes:
- "Read on 2026-10-31 on one Sungrow-labelled DTSD1352, unit 254, 9600 8N1, function 03, L1 alone connected and no load: 235.3 V, 49.99 to 50.0 Hz, import 0.17 kWh (0.05 + 0.06 + 0.06), pulse constant 6400, PT and CT 1. Points marked verified were read with a meaningful value; zeros prove nothing, so current, power and power factor stay unchecked."
- "Identification: register 20480 (0x5000) is not in Acrel's manual. It read 0x102F on the one Sungrow-labelled unit, and a plain Acrel meter may read something else, so this rule may miss those. Sungrow's document gives 0x20D5 there; see sungrow/dtsu666."
- "The manual gives lengths in bytes (4 = two registers). Registers are read with function 03 and written with function 10; function 04 gets no answer. Two-register values are most significant register first, which the readings confirm."
- "The default unit and serial settings aren't in the manual; those here are what the unit checked uses. The manual's text also mentions 19200 baud, which its index table lacks."
- "Stop bits on the unit checked read index 1 (2 stop bits), and it answered a port set to 1 stop bit. The second path reads address 187, baud index 3."
- "The manual's address list has a slip: minimum apparent power on C phase is printed at 027EH, between 0278H and 0280H. The sequence requires 027CH, and the readings there show the same pattern as the neighbouring values."
- "The clock and the times of the maximum and minimum values read 0xA5A5 while unset. Byte order within the clock registers isn't stated, and the clock on this unit is unset, so they're given whole."
- "Each maximum and minimum value is followed by its time: 3 registers per voltage or current (value, month and day, hour and minute), 4 per power (two-register value, month and day, hour and minute). Each entry in the maximum demand block 0x007B to 0x0086 is followed by two registers (minute and hour, day and month); those in 0x0180 to 0x0197 by one (minute and hour). The times are left out as points."
- "Not in the manual, inferred from readings: max L1 voltage reads 411.4 V, max L1 current 31.49 A and max L1 power 1821 W, in the same units as the live values, though the unit has never been loaded here. They may date from factory testing."
- "Harmonics left out: voltage harmonics 2 to 31 at 0x05E3 (A), 0x0601 (B), 0x061F (C), three decimals; current harmonics 0x063D (A), 0x065B (B), 0x0679 (C), two decimals; 30 registers each. No unit is stated for them or for the distortion rates."
- "History left out: it must be read whole, 60 registers at once (a read of 6 gets no answer). Last 1 to 48 months at 0x1001 to 0x1030, last 1 to 90 days at 0x1101 to 0x115A. Layout: frozen time at +0 and +1, then two-register energies from +2 and maximum demands from +0x30. All read 0xFFFF on the unit checked."
- "Event log left out: last 1 to 100 events at 0x3001 to 0x3064, 6 registers each: year and month, day and hour, minute and second, event number at +3, details at +4, reserved at +5. The manual's list prints +4, +5, +6 for the last three; its worked example shows +3, +4, +5. All read 0xFFFF on the unit checked."
- "Left out: the time zone and period tables (0x0041 to 0x0060, 0x00B2 to 0x00C3), whose layout is hard to read from the manual's table."
