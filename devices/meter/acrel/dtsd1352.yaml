  - {key: x.l3_apparent_power, label: Apparent power of C phase, table: holding, address: 376, type: u32, unit: VA}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 378, type: u32, unit: VA}
  - {key: x.l1_power_factor, label: Power factor of A phase, table: holding, address: 380, type: s16, scale: 0.001}
  - {key: x.l2_power_factor, label: Power factor of B phase, table: holding, address: 381, type: s16, scale: 0.001}
  - {key: x.l3_power_factor, label: Power factor of C phase, table: holding, address: 382, type: s16, scale: 0.001}
  - {key: power_factor, label: Total power factor, table: holding, address: 383, type: s16, scale: 0.001}

