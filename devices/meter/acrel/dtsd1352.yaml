  - {key: x.total_active_spike_energy, label: Current total active spike energy, table: holding, address: 2, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_peak_energy, label: Current total active peak energy, table: holding, address: 4, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_flat_energy, label: Current total active flat energy, table: holding, address: 6, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_valley_energy, label: Current total active valley energy, table: holding, address: 8, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_import_energy, label: Current forward active total energy, table: holding, address: 10, type: u32, unit: kWh, scale: 0.01, poll: slow, verified: true, note: 'Forward = import, assumed.'}
  - {key: x.forward_active_spike_energy, label: Current forward active spike energy, table: holding, address: 12, type: u32, unit: kWh, scale: 0.01, poll: slow}
