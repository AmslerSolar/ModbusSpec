# Written from Acrel's DTSD1352 manual V3.1, and read on a real Sungrow-labelled DTSD1352.

modbusspec: 0
id: acrel-dtsd1352
manufacturer: Acrel
name: DTSD1352 three-phase energy meter
kind: meter

sources:
- title: DTSD1352 Installation and operation instruction
  version: V3.1
  url: https://www.acrelenergy.com/uploads/file/acrel-dtsd1352-manual.pdf
  sha256: c08741e7d6339cc1d6001ce5d9d29a4baf0ef7ad0144b76a085f646205ceed0c
  language: en
  devices: [DTSD1352]

connection:
  default_port: 502
  default_unit: 254
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 20480
    type: u16
    equals: 4143

points:
  # Identity and setup
  - {key: x.device_type_code, label: Device type code, table: holding, address: 20480, type: u16, poll: slow, verified: true, note: 'Not in the manual. Reads 0x102F on the one unit checked. Read this one register alone: a read of two gets no answer.'}
  - {key: x.modbus_address, label: 'First communication path: address', table: holding, address: 63, type: u16, bits: [8, 15], writable: true, poll: slow, verified: true, note: The manual gives 1–247; the unit checked reads 254 and answers there.}
  - {key: x.baud_rate, label: 'First communication path: baud rate', table: holding, address: 63, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow, verified: false, note: The unit checked reads 3 (2400) and talks at 9600.}
  - {key: x.parity, label: 'First communication path: parity', table: holding, address: 149, type: u16, bits: [8, 15], enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits, label: 'First communication path: stop bits', table: holding, address: 149, type: u16, bits: [0, 7], enum: stop_bits, writable: true, poll: slow}
  - {key: x.modbus_address_2, label: 'Second communication path: address', table: holding, address: 150, type: u16, bits: [8, 15], writable: true, poll: slow}
  - {key: x.baud_rate_2, label: 'Second communication path: baud rate', table: holding, address: 150, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity_2, label: 'Second communication path: parity', table: holding, address: 151, type: u16, bits: [8, 15], enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits_2, label: 'Second communication path: stop bits', table: holding, address: 151, type: u16, bits: [0, 7], enum: stop_bits, writable: true, poll: slow}
  - {key: x.pulse_constant, label: Pulse constant, table: holding, address: 64, type: u16, poll: slow, verified: true}
  - {key: x.pt_ratio, label: Voltage transfer (PT), table: holding, address: 141, type: u16, writable: true, poll: slow, verified: true}
  - {key: x.ct_ratio, label: Current transfer (CT), table: holding, address: 142, type: u16, writable: true, poll: slow, verified: true}
  - {key: x.clock_second_minute, label: 'Time: second, minute', table: holding, address: 60, type: u16, writable: true, poll: slow, invalid: [42405]}
  - {key: x.clock_hour_day, label: 'Time: hour, day', table: holding, address: 61, type: u16, writable: true, poll: slow, invalid: [42405]}
  - {key: x.clock_month_year, label: 'Time: month, year', table: holding, address: 62, type: u16, writable: true, poll: slow, invalid: [42405]}
  - {key: x.frozen_hour_daily, label: 'Frozen time by day: hour', table: holding, address: 289, type: u16, bits: [0, 7], writable: true, poll: slow}
  - {key: x.frozen_day_monthly, label: 'Frozen time by month: day', table: holding, address: 290, type: u16, bits: [8, 15], writable: true, poll: slow}
  - {key: x.frozen_hour_monthly, label: 'Frozen time by month: hour', table: holding, address: 290, type: u16, bits: [0, 7], writable: true, poll: slow}

  # Energy: E = data × PT × CT × 0.01
