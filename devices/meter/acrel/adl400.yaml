  - {key: x.max_l1_active_power, label: Maximum active power on A phase, table: holding, address: 530, type: s32, unit: W, scale: 0.1, poll: slow, verified: false}
  - {key: x.max_l2_active_power, label: Maximum active power on B phase, table: holding, address: 534, type: s32, unit: W, scale: 0.1, poll: slow, verified: false}
