  - {key: x.max_reverse_active_demand_yesterday, label: Maximum reversing active demand last day, table: holding, address: 394, type: u16, unit: kW, scale: 0.001, poll: slow, verified: false}
  - {key: x.max_forward_reactive_demand_yesterday, label: Maximum forward reactive demand last day, table: holding, address: 396, type: u16, unit: kvar, scale: 0.001, poll: slow, verified: false}
  - {key: x.max_reverse_reactive_demand_yesterday, label: Maximum reversing reactive demand last day, table: holding, address: 398, type: u16, unit: kvar, scale: 0.001, poll: slow, verified: false}
  - {key: x.max_forward_active_demand_2_days_ago, label: Maximum forward active demand last 2 days, table: holding, address: 400, type: u16, unit: kW, scale: 0.001, poll: slow, verified: false}
