enums:
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200'}
  parity: {'0': None, '1': Odd, '2': Even}
  stop_bits: {'0': '1', '1': '2'}

notes:
- "Same base map as acrel/dtsd1352, with differences: the baud index (3 = 9600 here, 2400 on the DTSD1352), an odd parity value, one-register powers at 0x0067, power resolution 0.0001 kW instead of 0.001 kW, and a float block at 0x5300."
- "Read with function 03, write with 10H. The manual gives no identification, default unit or default serial settings. Two-register values are taken as most significant register first."
- "The manual does not say how PT and CT apply to the values in the ADL400; on the DTSD1352 they multiply them."
- "The manual's labels for 0x0095 say address and baud; its notes describe parity and stop bits, which are followed here. It prints 0x027C (minimum apparent power on C phase) as 027EH, and repeats B phase for the maximum current on C phase at 020FH."
- "Each maximum and minimum value is followed by its time: 3 registers per voltage or current, 4 per power. Each entry of 0x007B to 0x0086 is followed by two time registers, those of 0x0180 to 0x0197 by one. The times are left out as points."
- "Left out: history (0x6000 to 0x6BD2, 0x7000 to 0x763E; the manual says 60 registers per record, but its addresses and field list give 34), time zone and period tables, code (0x00A6), harmonics 2 to 31 (0x05E3 to 0x0696, 30 registers each), harmonic and fundamental powers (0x06A3 to 0x06B2), and the event log."
