# Written from Acrel's ADL400 manual V1.3. No reading from a real device yet.

modbusspec: 0
id: acrel-adl400
manufacturer: Acrel
name: ADL400 three-phase energy meter
kind: meter

sources:
- title: ADL400 Installation and operation instruction
  version: V1.3
  url: https://www.acrelenergy.com/uploads/file/adl400-manual.pdf
  sha256: 94db5ed9dc98e1fbbd5de477bedfa8ef348f2b91834e6bc3b88854feaf5a9297
  language: en
  devices: [ADL400]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:

  # Setup
  - {key: x.modbus_address, label: 'First communication path: address', table: holding, address: 63, type: u16, bits: [8, 15], writable: true, poll: slow}
  - {key: x.baud_rate, label: 'First communication path: baud rate', table: holding, address: 63, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: 'First communication path: parity', table: holding, address: 149, type: u16, bits: [8, 15], enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits, label: 'First communication path: stop bits', table: holding, address: 149, type: u16, bits: [0, 7], enum: stop_bits, writable: true, poll: slow}
  - {key: x.pulse_constant, label: Pulse constant, table: holding, address: 64, type: u16, poll: slow}
  - {key: x.pt_ratio, label: PT, table: holding, address: 141, type: u16, writable: true, poll: slow}
  - {key: x.ct_ratio, label: CT, table: holding, address: 142, type: u16, writable: true, poll: slow}
  - {key: x.backlight_time, label: Backlight time, table: holding, address: 202, type: u16, unit: min, min: 0, max: 255, note: More than 250 stays on., writable: true, poll: slow}
  - {key: x.clock_second_minute, label: 'Time: second, minute', table: holding, address: 60, type: u16, writable: true, poll: slow}
  - {key: x.clock_hour_day, label: 'Time: hour, day', table: holding, address: 61, type: u16, writable: true, poll: slow}
  - {key: x.clock_month_year, label: 'Time: month, year', table: holding, address: 62, type: u16, writable: true, poll: slow}
  - {key: x.frozen_hour_daily, label: 'Frozen time by day: hour', table: holding, address: 289, type: u16, bits: [0, 7], writable: true, poll: slow}
  - {key: x.frozen_day_monthly, label: 'Frozen time by month: day', table: holding, address: 290, type: u16, bits: [8, 15], writable: true, poll: slow}
  - {key: x.frozen_hour_monthly, label: 'Frozen time by month: hour', table: holding, address: 290, type: u16, bits: [0, 7], writable: true, poll: slow}

  # Energy: two decimals
  - {key: x.total_active_energy, label: Current total active total energy, table: holding, address: 0, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_spike_energy, label: Current total active spike energy, table: holding, address: 2, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_peak_energy, label: Current total active peak energy, table: holding, address: 4, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_flat_energy, label: Current total active flat energy, table: holding, address: 6, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_active_valley_energy, label: Current total active valley energy, table: holding, address: 8, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_import_energy, label: Current forward active total energy, table: holding, address: 10, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Forward = import, assumed.'}
  - {key: x.forward_active_spike_energy, label: Current forward active spike energy, table: holding, address: 12, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_peak_energy, label: Current forward active peak energy, table: holding, address: 14, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_flat_energy, label: Current forward active flat energy, table: holding, address: 16, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_valley_energy, label: Current forward active valley energy, table: holding, address: 18, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_export_energy, label: Current reversing active total energy, table: holding, address: 20, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Reversing = export, assumed.'}
  - {key: x.reverse_active_spike_energy, label: Current reversing active spike energy, table: holding, address: 22, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_peak_energy, label: Current reversing active peak energy, table: holding, address: 24, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_flat_energy, label: Current reversing active flat energy, table: holding, address: 26, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_valley_energy, label: Current reversing active valley energy, table: holding, address: 28, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_energy, label: Current total reactive total energy, table: holding, address: 30, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_spike_energy, label: Current total reactive spike energy, table: holding, address: 32, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_peak_energy, label: Current total reactive peak energy, table: holding, address: 34, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_flat_energy, label: Current total reactive flat energy, table: holding, address: 36, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_valley_energy, label: Current total reactive valley energy, table: holding, address: 38, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_energy, label: Current forward reactive total energy, table: holding, address: 40, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_spike_energy, label: Current forward reactive spike energy, table: holding, address: 42, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_peak_energy, label: Current forward reactive peak energy, table: holding, address: 44, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_flat_energy, label: Current forward reactive flat energy, table: holding, address: 46, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_valley_energy, label: Current forward reactive valley energy, table: holding, address: 48, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_energy, label: Current reversing reactive total energy, table: holding, address: 50, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_spike_energy, label: Current reversing reactive spike energy, table: holding, address: 52, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_peak_energy, label: Current reversing reactive peak energy, table: holding, address: 54, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_flat_energy, label: Current reversing reactive flat energy, table: holding, address: 56, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_valley_energy, label: Current reversing reactive valley energy, table: holding, address: 58, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.l1_import_energy, label: Forward active energy of A phase, table: holding, address: 135, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.l2_import_energy, label: Forward active energy of B phase, table: holding, address: 137, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.l3_import_energy, label: Forward active energy of C phase, table: holding, address: 139, type: u32, unit: kWh, scale: 0.01, poll: slow}

  # Voltage, current, frequency
  - {key: l1_voltage, label: Voltage of A phase, table: holding, address: 97, type: u16, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Voltage of B phase, table: holding, address: 98, type: u16, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Voltage of C phase, table: holding, address: 99, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Current of A phase, table: holding, address: 100, type: u16, unit: A, scale: 0.01}
  - {key: l2_current, label: Current of B phase, table: holding, address: 101, type: u16, unit: A, scale: 0.01}
  - {key: l3_current, label: Current of C phase, table: holding, address: 102, type: u16, unit: A, scale: 0.01}
  - {key: frequency, label: Frequency, table: holding, address: 119, type: u16, unit: Hz, scale: 0.01}
  - {key: x.l1_l2_voltage, label: Voltage between A-B, table: holding, address: 120, type: u16, unit: V, scale: 0.1, verified: false, note: The manual gives no scale here; taken from the phase voltages.}
  - {key: x.l3_l2_voltage, label: Voltage between C-B, table: holding, address: 121, type: u16, unit: V, scale: 0.1, verified: false, note: The manual gives no scale here; taken from the phase voltages.}
  - {key: x.l1_l3_voltage, label: Voltage between A-C, table: holding, address: 122, type: u16, unit: V, scale: 0.1, verified: false, note: The manual gives no scale here; taken from the phase voltages.}
  - {key: x.zero_sequence_current, label: Zero sequence current, table: holding, address: 146, type: u16, unit: A, scale: 0.01, verified: false, note: The manual gives no scale; assumed as for the phase currents.}
  - {key: x.voltage_imbalance, label: Voltage imbalance, table: holding, address: 147, type: u16, scale: 0.001, note: 'Resolution 0.001, no unit in the manual.'}
  - {key: x.current_imbalance, label: Current imbalance, table: holding, address: 148, type: u16, scale: 0.001, note: 'Resolution 0.001, no unit in the manual.'}

  # Power: two-register values with resolution 0.0001 kW, kvar, kVA
  - {key: l1_power, label: Active power of A phase, table: holding, address: 356, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'Two''s complement in the manual, which does not say which direction is positive; import assumed.'}
  - {key: l2_power, label: Active power of B phase, table: holding, address: 358, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'Two''s complement in the manual, which does not say which direction is positive; import assumed.'}
  - {key: l3_power, label: Active power of C phase, table: holding, address: 360, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'Two''s complement in the manual, which does not say which direction is positive; import assumed.'}
  - {key: grid_power, label: Total active power, table: holding, address: 362, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'Two''s complement in the manual, which does not say which direction is positive; import assumed.'}
  - {key: x.l1_reactive_power, label: Reactive power of A phase, table: holding, address: 364, type: s32, unit: var, scale: 0.1}
  - {key: x.l2_reactive_power, label: Reactive power of B phase, table: holding, address: 366, type: s32, unit: var, scale: 0.1}
  - {key: x.l3_reactive_power, label: Reactive power of C phase, table: holding, address: 368, type: s32, unit: var, scale: 0.1}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 370, type: s32, unit: var, scale: 0.1}
  - {key: x.l1_apparent_power, label: Apparent power of A phase, table: holding, address: 372, type: s32, unit: VA, scale: 0.1}
  - {key: x.l2_apparent_power, label: Apparent power of B phase, table: holding, address: 374, type: s32, unit: VA, scale: 0.1}
  - {key: x.l3_apparent_power, label: Apparent power of C phase, table: holding, address: 376, type: s32, unit: VA, scale: 0.1}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 378, type: s32, unit: VA, scale: 0.1}
  - {key: x.l1_power_factor, label: Power factor of A phase, table: holding, address: 115, type: s16, scale: 0.001}
  - {key: x.l2_power_factor, label: Power factor of B phase, table: holding, address: 116, type: s16, scale: 0.001}
  - {key: x.l3_power_factor, label: Power factor of C phase, table: holding, address: 117, type: s16, scale: 0.001}
  - {key: power_factor, label: Total power factor, table: holding, address: 118, type: s16, scale: 0.001}

  # Power again: one-register values with resolution 0.001 kW, kvar, kVA
  - {key: x.l1_active_power_16, label: Active power of A phase (16 bit), table: holding, address: 103, type: s16, unit: W, note: The manual prints the resolution as 0.001 kWh; kW is meant.}
  - {key: x.l2_active_power_16, label: Active power of B phase (16 bit), table: holding, address: 104, type: s16, unit: W}
  - {key: x.l3_active_power_16, label: Active power of C phase (16 bit), table: holding, address: 105, type: s16, unit: W}
  - {key: x.total_active_power_16, label: Total active power (16 bit), table: holding, address: 106, type: s16, unit: W}
  - {key: x.l1_reactive_power_16, label: Reactive power of A phase (16 bit), table: holding, address: 107, type: s16, unit: var}
  - {key: x.l2_reactive_power_16, label: Reactive power of B phase (16 bit), table: holding, address: 108, type: s16, unit: var}
  - {key: x.l3_reactive_power_16, label: Reactive power of C phase (16 bit), table: holding, address: 109, type: s16, unit: var}
  - {key: x.total_reactive_power_16, label: Total reactive power (16 bit), table: holding, address: 110, type: s16, unit: var}
  - {key: x.l1_apparent_power_16, label: Apparent power of A phase (16 bit), table: holding, address: 111, type: s16, unit: VA}
  - {key: x.l2_apparent_power_16, label: Apparent power of B phase (16 bit), table: holding, address: 112, type: s16, unit: VA}
  - {key: x.l3_apparent_power_16, label: Apparent power of C phase (16 bit), table: holding, address: 113, type: s16, unit: VA}
  - {key: x.total_apparent_power_16, label: Total apparent power (16 bit), table: holding, address: 114, type: s16, unit: VA}

  # Maximum demand: resolution 0.001; the manual names no unit, kW and kvar assumed
  - {key: x.max_forward_active_demand, label: Forward active maximum demand, table: holding, address: 123, type: u16, unit: kW, scale: 0.001, poll: slow, verified: false}
  - {key: x.max_reverse_active_demand, label: Reversing active maximum demand, table: holding, address: 126, type: u16, unit: kW, scale: 0.001, poll: slow, verified: false}
  - {key: x.max_forward_reactive_demand, label: Forward reactive maximum demand, table: holding, address: 129, type: u16, unit: kvar, scale: 0.001, poll: slow, verified: false}
