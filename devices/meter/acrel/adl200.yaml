# Written from Acrel's ADL200 manual V1.1. No reading from a real device yet.

modbusspec: 0
id: acrel-adl200
manufacturer: Acrel
name: ADL200 single-phase energy meter
kind: meter

sources:
- title: ADL200 Installation and operation instruction
  version: V1.1
  url: https://www.acrelenergy.com/uploads/file/adl200-manual.pdf
  sha256: 9da74ee49af6a24cbdde380a4fa2b97b8523a4f8d7e713190f60ab37591d27d7
  language: en
  devices: [ADL200]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:

  # Setup
  - {key: x.modbus_address, label: Address, table: holding, address: 21, type: u16, bits: [8, 15], min: 0, max: 254, writable: true, poll: slow}
  - {key: x.baud_rate, label: Communication baud rate, table: holding, address: 21, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: Parity, table: holding, address: 72, type: u16, enum: parity, poll: slow}
  - {key: x.backlight_time, label: Light time, table: holding, address: 22, type: u16, unit: min, note: 0 = always on., writable: true, poll: slow}
  - {key: x.status, label: Status, table: holding, address: 69, type: u16, writable: true, poll: slow, note: 'Bit 0: 0 = EF, 1 = EEF. Bit 1: 0 = up and down, 1 = down and up. Bit 3: 0 = PQS, 1 = RMS. These are the manual labels.'}
  - {key: x.clock_year_month, label: 'Time: year, month', table: holding, address: 18, type: u16, writable: true, poll: slow}
  - {key: x.clock_day_hour, label: 'Time: day, hour', table: holding, address: 19, type: u16, writable: true, poll: slow}
  - {key: x.clock_minute_second, label: 'Time: minute, second', table: holding, address: 20, type: u16, writable: true, poll: slow}

  # Measurements
  - {key: l1_voltage, label: Voltage, table: holding, address: 11, type: u16, unit: V, scale: 0.1}
  - {key: l1_current, label: Current, table: holding, address: 12, type: u16, unit: A, scale: 0.01}
  - {key: l1_power, label: Active power, table: holding, address: 13, type: s16, unit: W, positive: import, verified: false, note: The manual gives neither signedness nor direction; signed and import assumed.}
  - {key: reactive_power, label: Reactive power, table: holding, address: 14, type: s16, unit: var, verified: false, note: The manual does not give the signedness; signed assumed.}
  - {key: apparent_power, label: Apparent power, table: holding, address: 15, type: u16, unit: VA}
  - {key: power_factor, label: Power factor, table: holding, address: 16, type: s16, scale: 0.001, verified: false, note: The manual does not give the signedness; signed assumed.}
  - {key: frequency, label: Frequency, table: holding, address: 17, type: u16, unit: Hz, scale: 0.01}

  # Energy: 0.01 kWh or kvarh
  - {key: x.combined_active_energy, label: Current combined active total energy, table: holding, address: 0, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.combined_active_spike_energy, label: Current combined active spike energy, table: holding, address: 2, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.combined_active_peak_energy, label: Current combined active peak energy, table: holding, address: 4, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.combined_active_flat_energy, label: Current combined active flat energy, table: holding, address: 6, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.combined_active_valley_energy, label: Current combined active valley energy, table: holding, address: 8, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_import_energy, label: Current forward active total energy, table: holding, address: 104, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Forward = import, assumed.'}
  - {key: x.forward_active_spike_energy, label: Current forward active spike energy, table: holding, address: 106, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_peak_energy, label: Current forward active peak energy, table: holding, address: 108, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_flat_energy, label: Current forward active flat energy, table: holding, address: 110, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.forward_active_valley_energy, label: Current forward active valley energy, table: holding, address: 112, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: grid_export_energy, label: Current reversing active total energy, table: holding, address: 114, type: u32, unit: kWh, scale: 0.01, poll: slow, note: 'Reversing = export, assumed.'}
  - {key: x.reverse_active_spike_energy, label: Current reversing active spike energy, table: holding, address: 116, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_peak_energy, label: Current reversing active peak energy, table: holding, address: 118, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_flat_energy, label: Current reversing active flat energy, table: holding, address: 120, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.reverse_active_valley_energy, label: Current reversing active valley energy, table: holding, address: 122, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_energy, label: Current reactive total energy, table: holding, address: 176, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_spike_energy, label: Current reactive spike energy, table: holding, address: 178, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_peak_energy, label: Current reactive peak energy, table: holding, address: 180, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_flat_energy, label: Current reactive flat energy, table: holding, address: 182, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.total_reactive_valley_energy, label: Current reactive valley energy, table: holding, address: 184, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_energy, label: Current forward reactive total energy, table: holding, address: 186, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_spike_energy, label: Current forward reactive spike energy, table: holding, address: 188, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_peak_energy, label: Current forward reactive peak energy, table: holding, address: 190, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_flat_energy, label: Current forward reactive flat energy, table: holding, address: 192, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.forward_reactive_valley_energy, label: Current forward reactive valley energy, table: holding, address: 194, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_energy, label: Current reversing reactive total energy, table: holding, address: 196, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_spike_energy, label: Current reversing reactive spike energy, table: holding, address: 198, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_peak_energy, label: Current reversing reactive peak energy, table: holding, address: 200, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_flat_energy, label: Current reversing reactive flat energy, table: holding, address: 202, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.reverse_reactive_valley_energy, label: Current reversing reactive valley energy, table: holding, address: 204, type: u32, unit: kvarh, scale: 0.01, poll: slow}
  - {key: x.last_month_energy, label: Last month active total energy, table: holding, address: 34, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_month_spike_energy, label: Last month active spike energy, table: holding, address: 36, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_month_peak_energy, label: Last month active peak energy, table: holding, address: 38, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_month_flat_energy, label: Last month active flat energy, table: holding, address: 40, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_month_valley_energy, label: Last month active valley energy, table: holding, address: 42, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_2_months_energy, label: Last 2 months active total energy, table: holding, address: 44, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_2_months_spike_energy, label: Last 2 months active spike energy, table: holding, address: 46, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_2_months_peak_energy, label: Last 2 months active peak energy, table: holding, address: 48, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_2_months_flat_energy, label: Last 2 months active flat energy, table: holding, address: 50, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_2_months_valley_energy, label: Last 2 months active valley energy, table: holding, address: 52, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_3_months_energy, label: Last 3 months active total energy, table: holding, address: 54, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_3_months_spike_energy, label: Last 3 months active spike energy, table: holding, address: 56, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_3_months_peak_energy, label: Last 3 months active peak energy, table: holding, address: 58, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_3_months_flat_energy, label: Last 3 months active flat energy, table: holding, address: 60, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.last_3_months_valley_energy, label: Last 3 months active valley energy, table: holding, address: 62, type: u32, unit: kWh, scale: 0.01, poll: slow}

  # Floats: format and word order assumed, no units in the manual
  - {key: x.float_voltage, label: Voltage (float), table: holding, address: 21248, type: f32, verified: false}
  - {key: x.float_current, label: Current (float), table: holding, address: 21250, type: f32, verified: false}
  - {key: x.float_active_power, label: Active power (float), table: holding, address: 21252, type: f32, verified: false}
  - {key: x.float_reactive_power, label: Reactive power (float), table: holding, address: 21254, type: f32, verified: false}
  - {key: x.float_apparent_power, label: Apparent power (float), table: holding, address: 21256, type: f32, verified: false}
  - {key: x.float_pf, label: Power factor (float), table: holding, address: 21258, type: f32, verified: false}
  - {key: x.float_frequency, label: Frequency (float), table: holding, address: 21260, type: f32, verified: false}

enums:
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200'}
  parity: {'0': None, '2': Even}

notes:
- "The manual gives no identification, default unit or default serial settings, and doesn't name the Modbus function codes. Two-register values are taken as most significant register first. Tariff energies stay empty on meters without the multi-tariff function."
- "The setup menu offers odd parity as well, which register 0x0048 doesn't list. It gives the address range as 1 to 254, the register list as 0 to 254."
- "0x0015 holds address and baud rate in one register; the manual doesn't say which byte is which. High byte = address is assumed, as on Acrel's other meters."
- "Left out: code (0x000A)."
