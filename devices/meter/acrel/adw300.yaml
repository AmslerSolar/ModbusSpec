enums:
  baud_rate: {'1': '1200', '2': '2400', '3': '4800', '4': '9600'}
  parity: {'0': None, '1': Even, '2': Odd}
  stop_bits: {'0': '1', '1': '2'}

notes:
- "All 12 points of evcc's template (`acrel-adw300`, usages grid, pv, charge) agree with Acrel's manual on address and scale. evcc reads power and energy as signed; the manual doesn't state signedness. Its PV energy is register 64, grid_export_energy here."
- "The default unit 1 and 1200 8N1 come from evcc. The manual gives 1200 baud only for the infrared port, no RS485 default, and prints baud index 2 as 3400, taken here as 2400."
- "Read with function 03, write with 10H. Two-register values are taken as most significant register first. The manual gives no identification."
- "The manual's R/W column is empty for 0x0005 to 0x000F, so they are read-only here. It labels the first two harmonic blocks both THUa; the sequence is THUa, THUb, THUc, then the current ones."
- "Left out: code (0x0008), clock (0x0011 to 0x0013), demand times, harmonics 2 to 31 (0x007A to 0x012D, 30 registers each), and the time zone and period tables from 0x0167."
