  - {key: x.l2_fundamental_reactive_power, label: Fundamental reactive power on B phase, table: holding, address: 324, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l3_fundamental_reactive_power, label: Fundamental reactive power on C phase, table: holding, address: 326, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.total_fundamental_reactive_power, label: Fundamental reactive power, table: holding, address: 328, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l1_harmonic_active_power, label: Harmonic active power on A phase, table: holding, address: 330, type: s32, unit: W, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l2_harmonic_active_power, label: Harmonic active power on B phase, table: holding, address: 332, type: s32, unit: W, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l3_harmonic_active_power, label: Harmonic active power on C phase, table: holding, address: 334, type: s32, unit: W, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.total_harmonic_active_power, label: Harmonic active power, table: holding, address: 336, type: s32, unit: W, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l1_harmonic_reactive_power, label: Harmonic reactive power on A phase, table: holding, address: 338, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l2_harmonic_reactive_power, label: Harmonic reactive power on B phase, table: holding, address: 340, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
  - {key: x.l3_harmonic_reactive_power, label: Harmonic reactive power on C phase, table: holding, address: 342, type: s32, unit: var, poll: slow, verified: false, note: The manual says Int; signed assumed.}
