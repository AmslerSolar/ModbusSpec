modbusspec: 0
id: acrel-adw300
manufacturer: Acrel
name: ADW300
kind: meter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/acrel-adw300.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 1200
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_voltage, label: Grid L1 voltage, table: holding, address: 20, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l2_voltage, label: Grid L2 voltage, table: holding, address: 21, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l3_voltage, label: Grid L3 voltage, table: holding, address: 22, type: u16, unit: V, scale: 0.1, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l1_current, label: Grid L1 current, table: holding, address: 26, type: u16, unit: A, scale: 0.01, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l2_current, label: Grid L2 current, table: holding, address: 27, type: u16, unit: A, scale: 0.01, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l3_current, label: Grid L3 current, table: holding, address: 28, type: u16, unit: A, scale: 0.01, note: 'evcc reads it for the usages grid, pv, charge.'}
  - {key: l1_power, label: Grid L1 power, table: holding, address: 30, type: s32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge. evcc negates it for the PV L1 power.'}
  - {key: l2_power, label: Grid L2 power, table: holding, address: 32, type: s32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge. evcc negates it for the PV L2 power.'}
  - {key: l3_power, label: Grid L3 power, table: holding, address: 34, type: s32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge. evcc negates it for the PV L3 power.'}
  - {key: grid_power, label: Grid power, table: holding, address: 36, type: s32, unit: W, positive: import, note: 'evcc reads it for the usages grid, pv, charge. evcc negates it for the PV power.'}
  - {key: grid_import_energy, label: Grid energy, table: holding, address: 62, type: s32, unit: kWh, scale: 0.01, note: 'evcc reads it for the usages grid, charge.'}
  - {key: x.pv_energy, label: PV energy, table: holding, address: 64, type: s32, unit: kWh, scale: 0.01}

notes:
- 'evcc template `acrel-adw300` (grid, pv, charge) lists: Acrel ADW300.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
