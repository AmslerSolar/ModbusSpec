  - {key: x.l3_apparent_power, label: C-phase apparent power, table: holding, address: 8488, type: f32, unit: VA}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 8490, type: f32, unit: VA}
  - {key: x.l1_power_factor, label: A-phase power factor, table: holding, address: 8492, type: f32}
  - {key: x.l2_power_factor, label: B-phase power factor, table: holding, address: 8494, type: f32}
  - {key: x.l3_power_factor, label: C-phase power factor, table: holding, address: 8496, type: f32}
  - {key: power_factor, label: Total power factor, table: holding, address: 8498, type: f32}
  - {key: frequency, label: Frequency, table: holding, address: 8500, type: f32, unit: Hz}

  # Circuit 2: measurements, floats
  - {key: x.c2_l1_voltage, label: A-phase voltage, table: holding, address: 8960, type: f32, unit: V}
  - {key: x.c2_l2_voltage, label: B-phase voltage, table: holding, address: 8962, type: f32, unit: V}
  - {key: x.c2_l3_voltage, label: C-phase voltage, table: holding, address: 8964, type: f32, unit: V}
  - {key: x.c2_l1_l2_voltage, label: AB line voltage, table: holding, address: 8966, type: f32, unit: V}
  - {key: x.c2_l2_l3_voltage, label: BC line voltage, table: holding, address: 8968, type: f32, unit: V}
  - {key: x.c2_l3_l1_voltage, label: CA line voltage, table: holding, address: 8970, type: f32, unit: V}
  - {key: x.c2_l1_current, label: A-phase current, table: holding, address: 8972, type: f32, unit: A}
  - {key: x.c2_l2_current, label: B-phase current, table: holding, address: 8974, type: f32, unit: A}
