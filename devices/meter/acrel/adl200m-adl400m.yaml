enums:
  feature_code: {'44033': 'Single-channel CT, single-phase', '44034': 'Single-channel CT, three-phase', '44035': 'Dual-channel CT, single-phase', '44036': 'Dual-channel CT, three-phase'}
  phase_sequence: {'0': ABC, '1': BAC, '2': ACB, '3': CBA, '4': CAB, '5': BCA}
  parity: {'0': None, '1': Odd, '2': Even}
  stop_bits: {'0': '1', '1': '2'}

notes:
- "Identification: the manual gives 0x000B as the feature code, high byte fixed at 0xAC, low byte the meter type."
- "The manual gives no default unit or default serial settings. Float and double format, and word order, are assumed; it only names the types. Energies are called primary values."
- "Single-phase and single-channel models don't use all of these registers; the manual doesn't say what the unused ones return."
- "Left out: serial number (0x1009, 7 registers, ASCII, read/write)."
