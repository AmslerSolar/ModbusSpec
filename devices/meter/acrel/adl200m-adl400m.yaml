  - {key: x.c2_apparent_power, label: Total apparent power, table: holding, address: 9002, type: f32, unit: VA}
  - {key: x.c2_l1_power_factor, label: A-phase power factor, table: holding, address: 9004, type: f32}
  - {key: x.c2_l2_power_factor, label: B-phase power factor, table: holding, address: 9006, type: f32}
  - {key: x.c2_l3_power_factor, label: C-phase power factor, table: holding, address: 9008, type: f32}
