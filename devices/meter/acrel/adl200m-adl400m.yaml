  - {key: x.modbus_address, label: Slave address, table: holding, address: 4096, type: u16, min: 1, max: 247, note: Also at 0x0000., writable: true, poll: slow}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 4097, type: u16, note: 'The value itself: 1200 to 38400.', writable: true, poll: slow}
  - {key: x.parity, label: Parity, table: holding, address: 4098, type: u16, bits: [0, 7], enum: parity, writable: true, poll: slow}
  - {key: x.stop_bits, label: Stop bits, table: holding, address: 4098, type: u16, bits: [8, 15], enum: stop_bits, writable: true, poll: slow}
  - {key: x.c1_phase_sequence, label: 'Circuit 1: phase sequence detected', table: holding, address: 12, type: u16, bits: [0, 7], enum: phase_sequence, poll: slow}
  - {key: x.c1_ct_polarity_detected, label: 'Circuit 1: CT polarity detected', table: holding, address: 12, type: u16, bits: [8, 10], poll: slow, note: 'Bit 8 = A, 9 = B, 10 = C; 1 = reversed.'}
  - {key: x.c1_phase_sequence_adjust, label: 'Circuit 1: phase sequence adjustment', table: holding, address: 13, type: u16, enum: phase_sequence, writable: true, poll: slow}
  - {key: x.c1_ct_polarity_adjust, label: 'Circuit 1: CT polarity adjustment', table: holding, address: 14, type: u16, note: 'Bit 0 = A, 1 = B, 2 = C.', writable: true, poll: slow}
  - {key: x.c2_phase_sequence, label: 'Circuit 2: phase sequence detected', table: holding, address: 15, type: u16, bits: [0, 7], enum: phase_sequence, poll: slow}
  - {key: x.c2_ct_polarity_detected, label: 'Circuit 2: CT polarity detected', table: holding, address: 15, type: u16, bits: [8, 10], poll: slow, note: 'Bit 8 = A, 9 = B, 10 = C; 1 = reversed.'}
  - {key: x.c2_phase_sequence_adjust, label: 'Circuit 2: phase sequence adjustment', table: holding, address: 16, type: u16, enum: phase_sequence, writable: true, poll: slow}
  - {key: x.c2_ct_polarity_adjust, label: 'Circuit 2: CT polarity adjustment', table: holding, address: 17, type: u16, note: 'Bit 0 = A, 1 = B, 2 = C.', writable: true, poll: slow}

  # Circuit 1: measurements, floats
  - {key: l1_voltage, label: A-phase voltage, table: holding, address: 8448, type: f32, unit: V}
  - {key: l2_voltage, label: B-phase voltage, table: holding, address: 8450, type: f32, unit: V}
  - {key: l3_voltage, label: C-phase voltage, table: holding, address: 8452, type: f32, unit: V}
  - {key: x.l1_l2_voltage, label: AB line voltage, table: holding, address: 8454, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: BC line voltage, table: holding, address: 8456, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: CA line voltage, table: holding, address: 8458, type: f32, unit: V}
  - {key: l1_current, label: A-phase current, table: holding, address: 8460, type: f32, unit: A}
  - {key: l2_current, label: B-phase current, table: holding, address: 8462, type: f32, unit: A}
  - {key: l3_current, label: C-phase current, table: holding, address: 8464, type: f32, unit: A}
  - {key: x.neutral_current, label: N-phase current, table: holding, address: 8466, type: f32, unit: A}
