  - {key: x.c2_l2_power, label: B-phase active power, table: holding, address: 8982, type: f32, unit: W}
  - {key: x.c2_l3_power, label: C-phase active power, table: holding, address: 8984, type: f32, unit: W}
  - {key: x.c2_active_power, label: Total active power, table: holding, address: 8986, type: f32, unit: W}
  - {key: x.c2_l1_reactive_power, label: A-phase reactive power, table: holding, address: 8988, type: f32, unit: var}
  - {key: x.c2_l2_reactive_power, label: B-phase reactive power, table: holding, address: 8990, type: f32, unit: var}
  - {key: x.c2_l3_reactive_power, label: C-phase reactive power, table: holding, address: 8992, type: f32, unit: var}
  - {key: x.c2_reactive_power, label: Total reactive power, table: holding, address: 8994, type: f32, unit: var}
