# Written from Acrel's ADL200M / ADL400M manual V1.1. No reading from a real device yet.

modbusspec: 0
id: acrel-adl200m-adl400m
manufacturer: Acrel
name: ADL200M / ADL400M dual-circuit energy meters
kind: meter

sources:
- title: ADL200M ADL400M Series Dual-Circuit Electric Energy Meter With External Current Transformer, Installation and Operation Instructions
  version: V1.1
  url: https://www.acrelenergy.com/uploads/file/adl200m-adl400m-manual.pdf
  sha256: 4890710c1ab41f54ec84b3971e0fd35f3dd4ed4a107330bd7cbfb4dc89d4d34c
  language: en
  devices: [ADL200M, ADL400M]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 11
    type: u16
    in: [44033, 44034, 44035, 44036]

points:

  # Identity and setup
