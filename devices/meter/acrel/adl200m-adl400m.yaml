  - {key: l2_power, label: B-phase active power, table: holding, address: 8470, type: f32, unit: W, positive: import, verified: false, note: The manual does not say which direction is positive; import assumed.}
  - {key: l3_power, label: C-phase active power, table: holding, address: 8472, type: f32, unit: W, positive: import, verified: false, note: The manual does not say which direction is positive; import assumed.}
  - {key: grid_power, label: Total active power, table: holding, address: 8474, type: f32, unit: W, positive: import, verified: false, note: The manual does not say which direction is positive; import assumed.}
