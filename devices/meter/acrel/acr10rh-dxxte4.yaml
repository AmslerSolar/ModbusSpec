  - {key: x.baud_rate, label: Communication speed, table: holding, address: 1, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity, label: Check mode, table: holding, address: 2, type: u16, enum: parity, writable: true, poll: slow}
  - {key: x.wiring_mode, label: Wiring mode, table: holding, address: 3, type: u16, enum: wiring_mode, writable: true, poll: slow}
  - {key: x.rated_voltage, label: Secondary side rated voltage Ue, table: holding, address: 4, type: u16, enum: rated_voltage, writable: true, poll: slow}
  - {key: x.rated_current, label: Secondary side rated current Ie, table: holding, address: 5, type: u16, enum: rated_current, writable: true, poll: slow}
  - {key: x.primary_voltage, label: Primary side rated voltage PU, table: holding, address: 6, type: u16, unit: kV, scale: 0.01, min: 1, max: 65000, writable: true, poll: slow}
  - {key: x.primary_current, label: Primary side rated current PI, table: holding, address: 7, type: u16, unit: A, min: 1, max: 65000, writable: true, poll: slow}
