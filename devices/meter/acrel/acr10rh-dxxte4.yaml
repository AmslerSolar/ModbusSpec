  - {key: x.clock_month, label: 'Time: month', table: holding, address: 129, type: bcd16, writable: true, poll: slow}
  - {key: x.clock_day, label: 'Time: day', table: holding, address: 130, type: bcd16, writable: true, poll: slow}
  - {key: x.clock_hour, label: 'Time: hour', table: holding, address: 131, type: bcd16, writable: true, poll: slow}
