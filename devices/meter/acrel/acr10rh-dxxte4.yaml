enums:
  baud_rate: {'0': '4800', '1': '9600', '2': '19200', '3': '38400', '4': '2400', '5': '1200'}
  parity: {'0': None, '1': Odd, '2': Even, '3': 2 stop bits}
  wiring_mode: {'0': 3-phase 3-wire, '1': 3-phase 4-wire}
  rated_voltage: {'0': 100 V, '1': 400 V, '2': 660 V}
  rated_current: {'0': 1 A}
  sign: {'0': Positive, '1': Negative}

notes:
- "The manual's table name is ACR10RH-DxxT(R)E4; Acrel's site files it as ACR10R-D16TE4."
- "The register values are secondary-side values, and these scales give them as such. Primary-side values: voltage = value × PU / Ue, current = value × PI / 1000, power and energy = value × PI × PU / Ue / 10 (W, var, VA; kWh, kvarh). Registers 14 to 19 hold the same coefficients as floats. Two-register values are first word × 65536 + second word, as the manual says."
- "Function 03 reads and 10H writes. Reading addresses not listed, or listed without a read/write attribute, is forbidden by the manual, so don't sweep this device."
- "The manual gives no identification, and no default unit. The default serial settings are 38400 baud, no parity; the stop bits and the unit here are assumed."
- "Left out: alarm and transmission setup (1001 to 1051), DL/T 645 address (1100 to 1102), rate periods (21 to 44, 1200 to 1226), event records (143 to 238, layout in manual section 7.5.6), maximum demand time (303 to 306, BCD), harmonics 2 to 31 (373 to 552) and 2 to 63 (2000 to 2371), wave samples (559 to 750), month history (1250 to 1379), DIDO word (1000) and the primary-side averages and maxima (3000 to 3137). The manual doesn't explain how the decimal point registers (3000, 3001 high byte) apply to those."
