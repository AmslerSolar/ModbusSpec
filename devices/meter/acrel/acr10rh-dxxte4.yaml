# Written from Acrel's three-phase ACR10R manual V1.5. No reading from a real device yet.

modbusspec: 0
id: acrel-acr10rh-dxxte4
manufacturer: Acrel
name: ACR10RH-DxxTE4 three-phase harmonic meters
kind: meter

sources:
- title: External Roche Coil and Switched Transformer Harmonic Meter, Installation and operation instruction
  version: V1.5
  url: https://www.acrelenergy.com/uploads/file/three-phase-acr10r-d16te4-manual.pdf
  sha256: 062d5846446f6a1b25b37e3abd0d3d289824826362edd5732b35c7352889038e
  language: en
  devices: [ACR10RH-DxxTE4, ACR10RH-DxxTRE4]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 38400
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

points:

