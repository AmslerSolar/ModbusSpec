modbusspec: 0
id: voltaris-vdt45m
manufacturer: Voltaris
name: VDT45M three-phase energy meter
kind: meter

sources:
- title: Voltaris VDT45M Modbus Protocol (tpdvo45m-modbus-protocol)
  version: undated
  url: http://downloads.spwales.com/tpdvo45m-modbus-protocol.pdf
  sha256: e54e24520dd0ca32412c8bc4e176608ceb83a486ee2ad8b9ae14294850086212

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 64512
    type: u32

points:
  - {key: l1_voltage, label: Phase 1 line to neutral volts, table: input, address: 0, type: f32, unit: V}
  - {key: l2_voltage, label: Phase 2 line to neutral volts, table: input, address: 2, type: f32, unit: V}
  - {key: l3_voltage, label: Phase 3 line to neutral volts, table: input, address: 4, type: f32, unit: V}
  - {key: l1_current, label: Phase 1 current, table: input, address: 6, type: f32, unit: A}
  - {key: l2_current, label: Phase 2 current, table: input, address: 8, type: f32, unit: A}
  - {key: l3_current, label: Phase 3 current, table: input, address: 10, type: f32, unit: A}
  - {key: l1_power, label: Phase 1 active power, table: input, address: 12, type: f32, unit: W, positive: import, verified: false, note: Sign assumed like the total power.}
  - {key: l2_power, label: Phase 2 active power, table: input, address: 14, type: f32, unit: W, positive: import, verified: false, note: Sign assumed like the total power.}
  - {key: l3_power, label: Phase 3 active power, table: input, address: 16, type: f32, unit: W, positive: import, verified: false, note: Sign assumed like the total power.}
  - {key: x.l1_apparent_power, label: Phase 1 apparent power, table: input, address: 18, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Phase 2 apparent power, table: input, address: 20, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Phase 3 apparent power, table: input, address: 22, type: f32, unit: VA}
  - {key: x.l1_reactive_power, label: Phase 1 reactive power, table: input, address: 24, type: f32, unit: var}
  - {key: x.l2_reactive_power, label: Phase 2 reactive power, table: input, address: 26, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: Phase 3 reactive power, table: input, address: 28, type: f32, unit: var}
  - {key: x.l1_power_factor, label: Phase 1 power factor, table: input, address: 30, type: f32, unit: ''}
  - {key: x.l2_power_factor, label: Phase 2 power factor, table: input, address: 32, type: f32, unit: ''}
  - {key: x.l3_power_factor, label: Phase 3 power factor, table: input, address: 34, type: f32, unit: ''}
  - {key: x.average_voltage, label: Average line to neutral volts, table: input, address: 42, type: f32, unit: V}
  - {key: x.average_current, label: Average line current, table: input, address: 46, type: f32, unit: A}
  - {key: x.current_sum, label: Sum of line currents, table: input, address: 48, type: f32, unit: A}
  - {key: grid_power, label: Total system active power, table: input, address: 52, type: f32, unit: W, positive: import, verified: false, note: The document doesn't state the sign of the power. It says the power factor's sign follows the current direction (positive = forward) and that the power demand is import − export; positive = import is derived from that.}
  - {key: apparent_power, label: Total system apparent power, table: input, address: 56, type: f32, unit: VA}
  - {key: reactive_power, label: Total system reactive power, table: input, address: 60, type: f32, unit: var}
  - {key: power_factor, label: Total system power factor, table: input, address: 62, type: f32, unit: '', note: 'Sign = current direction: positive forward, negative reverse.'}
  - {key: frequency, label: Frequency of supply voltages, table: input, address: 70, type: f32, unit: Hz}
  - {key: grid_import_energy, label: Import active energy, table: input, address: 72, type: f32, unit: kWh, poll: slow}
  - {key: grid_export_energy, label: Export active energy, table: input, address: 74, type: f32, unit: kWh, poll: slow}
  - {key: x.import_reactive_energy, label: Import reactive energy, table: input, address: 76, type: f32, unit: kvarh, poll: slow}
  - {key: x.export_reactive_energy, label: Export reactive energy, table: input, address: 78, type: f32, unit: kvarh, poll: slow}
  - {key: x.apparent_energy, label: Total apparent energy, table: input, address: 80, type: f32, unit: kVAh, poll: slow}
  - {key: x.power_demand, label: Total system active power demand, table: input, address: 84, type: f32, unit: W, note: Import − export.}
  - {key: x.max_power_demand, label: Maximum total system active power demand, table: input, address: 86, type: f32, unit: W, poll: slow}
  - {key: x.load_nature, label: Nature of the system load, table: input, address: 198, type: f32, enum: load_nature}
  - {key: x.l1_l2_voltage, label: Line 1 to line 2 volts, table: input, address: 200, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Line 2 to line 3 volts, table: input, address: 202, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Line 3 to line 1 volts, table: input, address: 204, type: f32, unit: V}
  - {key: x.neutral_current, label: Neutral current, table: input, address: 224, type: f32, unit: A}
  - {key: x.l1_voltage_thd, label: Phase 1 L-N voltage THD, table: input, address: 234, type: f32, unit: '%'}
  - {key: x.l2_voltage_thd, label: Phase 2 L-N voltage THD, table: input, address: 236, type: f32, unit: '%'}
  - {key: x.l3_voltage_thd, label: Phase 3 L-N voltage THD, table: input, address: 238, type: f32, unit: '%'}
  - {key: x.l1_current_thd, label: Phase 1 current THD, table: input, address: 240, type: f32, unit: '%'}
  - {key: x.l2_current_thd, label: Phase 2 current THD, table: input, address: 242, type: f32, unit: '%'}
  - {key: x.l3_current_thd, label: Phase 3 current THD, table: input, address: 244, type: f32, unit: '%'}
  - {key: x.total_energy, label: Total active energy, table: input, address: 342, type: f32, unit: kWh, poll: slow}
  - {key: x.total_reactive_energy, label: Total reactive energy, table: input, address: 344, type: f32, unit: kvarh, poll: slow}
  - {key: x.l1_import_energy, label: L1 import active energy, table: input, address: 346, type: f32, unit: kWh, poll: slow}
  - {key: x.l2_import_energy, label: L2 import active energy, table: input, address: 348, type: f32, unit: kWh, poll: slow}
  - {key: x.l3_import_energy, label: L3 import active energy, table: input, address: 350, type: f32, unit: kWh, poll: slow}
  - {key: x.l1_export_energy, label: L1 export active energy, table: input, address: 352, type: f32, unit: kWh, poll: slow}
  - {key: x.l2_export_energy, label: L2 export active energy, table: input, address: 354, type: f32, unit: kWh, poll: slow}
  - {key: x.l3_export_energy, label: L3 export active energy, table: input, address: 356, type: f32, unit: kWh, poll: slow}
  # Settings (holding)
  - {key: x.demand_period, label: Demand period, table: holding, address: 2, type: f32, unit: min, writable: true, min: 0, max: 60, poll: slow, note: Default 60; 0 = updated every second.}
  - {key: x.system_type, label: System type, table: holding, address: 10, type: f32, enum: system_type, writable: true, poll: slow, note: Writing needs key parameter programming authorisation (password).}
  - {key: x.parity_stop, label: Parity and stop bit, table: holding, address: 18, type: f32, enum: parity_stop, writable: true, poll: slow}
  - {key: x.node_address, label: Modbus address, table: holding, address: 20, type: f32, writable: true, min: 1, max: 247, poll: slow, note: Default 1.}
  - {key: x.baud_rate, label: Network baud rate, table: holding, address: 28, type: f32, enum: baud_rate, writable: true, poll: slow, note: 'An index into the table, not the rate itself.'}
  - {key: x.ct_primary, label: CT1 (primary current), table: holding, address: 50, type: f32, unit: A, writable: true, min: 1, max: 9999, poll: slow, note: Default 1000; needs authorisation.}
  - {key: x.ct_secondary, label: CT2 (secondary current), table: holding, address: 52, type: f32, unit: A, writable: true, poll: slow, note: '1 or 5 A, default 5; needs authorisation.'}
  - {key: x.current_direction, label: Current direction correction, table: holding, address: 56, type: f32, enum: current_direction, writable: true, poll: slow, note: Reverses the current of single phases (CT connected the wrong way round); needs authorisation.}
  - {key: x.meter_code, label: Meter code, table: holding, address: 22017, type: u16, poll: slow, note: The document doesn't give the value.}
  - {key: firmware, label: Software version number, table: holding, address: 22020, type: u16, poll: slow, note: 'High byte = major (XX), low byte = minor (YY): XX.YY.'}
  - {key: x.hardware_version, label: Hardware version number, table: holding, address: 22021, type: u16, poll: slow, note: 'High byte = major, low byte = minor.'}
  - {key: x.running_time, label: Running time, table: holding, address: 63792, type: f32, unit: min, poll: slow, note: Since power-on; writing 0 resets it.}
  - {key: x.running_time_load, label: Running time with load, table: holding, address: 63794, type: f32, unit: min, poll: slow, note: Time with power above 0; writing 0 resets it.}
  - {key: serial, label: Serial number, table: holding, address: 64512, type: u32, poll: slow, note: The document also lists it at holding 0x002A.}

enums:
  load_nature: {'1': Resistive, '2': Inductive, '3': Capacitive, '4': No load}
  system_type: {'1': 1 phase 2 wire, '2': 3 phase 3 wire, '3': 3 phase 4 wire, '4': 2 phase 3 wire}
  parity_stop: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}
  baud_rate: {'0': '2400', '1': '4800', '2': '9600', '3': '19200', '4': '38400'}
  current_direction: {'0': all forward, '1': L1 reversed, '2': L2 reversed, '3': L1 and L2 reversed, '4': L3 reversed, '5': L1 and L3 reversed, '6': L2 and L3 reversed, '7': all reversed}

notes:
- Measurements are input registers (function 04), settings holding registers (read 03). The document gives 0-based hex addresses,
  used here unchanged.
- Values are IEEE 754 floats in two registers, high word first (the document's examples show it); meter code, versions and
  the reset register are single registers.
- Defaults per the document - Modbus address 1, 9600 baud, 8N1. Neither a TCP port nor a request size limit is stated; port
  502 is only the format's default for a gateway.
- 'Left out: per-phase phase angles, demand and maximum demand values other than the total power demand, line-to-line THD,
  per-phase total / reactive energies, pulse output, display, PT ratio and password settings, and the demand reset register
  (F010h).'
- In 3 phase 3 wire mode the line-to-neutral THD reads 0; in the other modes the line-to-line THD does.
- The measurement and settings registers sit at the same addresses, with the same types, as on the Eastron SDM630; the document
  names no other maker. Unlike the SDM630 it has the meter code and versions at holding 0x5601 … 0x5606 (no meter code at
  0xFC02), so a search that checks only the SDM630's frequency register can't tell the two apart.
