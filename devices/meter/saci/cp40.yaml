modbusspec: 0
id: saci-cp40
manufacturer: SACI
name: CP40 programmable electrical transducer (CP42 / CP43 / CP44)
kind: meter

sources:
- title: Convertidor programable de medidas eléctricas CP40 – manual de usuario y Modbus
  version: V06 (19.04.2024); appended protocol CP40-MODBUS.V04 (22.07.2021)
  url: https://www.saci.es/downloads/Convertidores/NV/CP40/SACI_CP40_MANUAL_DE_USUARIO_y_Modbus.pdf
  sha256: 613d6e71293ac4a3d3ffed5cc4bd4a1541c05fe8bece936c4ebe6f8834641d65
  archive_url: https://web.archive.org/web/20260729003856/https://saci.es/downloads/Convertidores/NV/CP40/SACI_CP40_MANUAL_DE_USUARIO_y_Modbus.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  input_equals_holding: true
  limits:
    max_registers: 100

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 811
    type: str
    length: 5

points:
