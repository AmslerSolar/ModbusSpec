  - {key: x.do2_mode, label: Relay output DO2 mode, table: holding, address: 211, type: u16, bits: [8, 15], enum: relay_mode, writable: true, poll: slow}
  - {key: x.do2_alarm_variable, label: Relay output DO2 alarm variable, table: holding, address: 211, type: u16, bits: [0, 7], enum: variable, writable: true, poll: slow}
