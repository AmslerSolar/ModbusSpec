  - {key: x.l1_reactive_power, label: Q1, table: holding, address: 34, type: f32, unit: var, scale: 1000}
  - {key: x.l2_reactive_power, label: Q2, table: holding, address: 36, type: f32, unit: var, scale: 1000}
  - {key: x.l3_reactive_power, label: Q3, table: holding, address: 38, type: f32, unit: var, scale: 1000}
  - {key: reactive_power, label: Q, table: holding, address: 40, type: f32, unit: var, scale: 1000}
  - {key: x.l1_apparent_power, label: S1, table: holding, address: 42, type: f32, unit: VA, scale: 1000}
  - {key: x.l2_apparent_power, label: S2, table: holding, address: 44, type: f32, unit: VA, scale: 1000}
  - {key: x.l3_apparent_power, label: S3, table: holding, address: 46, type: f32, unit: VA, scale: 1000}
  - {key: apparent_power, label: S, table: holding, address: 48, type: f32, unit: VA, scale: 1000}
  - {key: x.l1_power_factor, label: PF1, table: holding, address: 50, type: f32}
  - {key: x.l2_power_factor, label: PF2, table: holding, address: 52, type: f32}
  - {key: x.l3_power_factor, label: PF3, table: holding, address: 54, type: f32}
  - {key: power_factor, label: PF, table: holding, address: 56, type: f32, unit: ''}
