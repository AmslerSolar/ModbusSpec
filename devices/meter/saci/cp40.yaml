  - {key: l2_voltage, label: V2, table: holding, address: 8, type: f32, unit: V}
  - {key: l3_voltage, label: V3, table: holding, address: 10, type: f32, unit: V}
  - {key: x.l12_voltage, label: V12, table: holding, address: 12, type: f32, unit: V}
  - {key: x.l23_voltage, label: V23, table: holding, address: 14, type: f32, unit: V}
  - {key: x.l31_voltage, label: V31, table: holding, address: 16, type: f32, unit: V}
  - {key: l1_current, label: I1, table: holding, address: 18, type: f32, unit: A}
  - {key: l2_current, label: I2, table: holding, address: 20, type: f32, unit: A}
  - {key: l3_current, label: I3, table: holding, address: 22, type: f32, unit: A}
  - {key: x.neutral_current, label: In (3P4W), table: holding, address: 24, type: f32, unit: A}
  - {key: l1_power, label: P1, table: holding, address: 26, type: f32, unit: W, scale: 1000, positive: import, verified: false}
  - {key: l2_power, label: P2, table: holding, address: 28, type: f32, unit: W, scale: 1000, positive: import, verified: false}
  - {key: l3_power, label: P3, table: holding, address: 30, type: f32, unit: W, scale: 1000, positive: import, verified: false}
