  - {key: x.parity, label: Parity, table: holding, address: 801, type: u16, bits: [8, 15], enum: parity, writable: true, poll: slow}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 801, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {key: x.wiring, label: Wiring, table: holding, address: 802, type: u16, bits: [0, 7], enum: wiring, writable: true, poll: slow}
