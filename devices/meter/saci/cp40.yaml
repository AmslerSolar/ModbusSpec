  - {key: x.model, label: Model, table: holding, address: 816, type: u16, enum: model, poll: slow, verified: false, note: From the English protocol (V04). The newer Spanish map (V06) puts the firmware version (6 characters) at 816–818 instead and has no model register; the V04 protocol has the firmware at 819–824.}

enums:
  relay_mode: {'0': 'Off', '1': Controlled by communication, '2': Alarm, '3': Ep+ pulses, '4': Ep- pulses, '5': Eq+ pulses, '6': Eq- pulses}
  variable: {'0': 'Off', '1': V1, '2': V2, '3': V3, '4': V12, '5': V23, '6': V31, '7': I1, '8': I2, '9': I3, '10': In, '11': P1, '12': P2, '13': P3, '14': P, '15': Q1, '16': Q2, '17': Q3, '18': Q, '19': S1, '20': S2, '21': S3, '22': S, '23': PF1, '24': PF2, '25': PF3, '26': PF, '27': F, '28': Average V ph-ph, '29': Average V ph-n, '30': Average current}
  parity: {'0': 8N1, '1': 8O1, '2': 8E1, '3': 8N2}
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400'}
  wiring: {'0': 3P4W, '1': 3P3W, '2': 1P2W, '3': 1P3W}
  protocol: {'0': Modbus, '1': JBUS}
  model: {'42': CP42, '43': CP43, '44': CP44}

notes:
- Addresses in the document are decimal protocol addresses (its data-format examples give V3 at 000Ah and the EP+ hour meter
  at 0054h, matching 10 and 84 decimal).
- Functions 03 and 04 both read the registers; 06 and 16 write. Floats are IEEE 754, most significant word first. At most
  100 registers per request.
- RS485 1200…19200 baud (38400 in the English protocol), default 9600, 8 data bits without parity; the USB port runs fixed
  at 9600. Default unit 1. Port 502 only applies behind a Modbus TCP gateway.
- Measurements are primary values (CT and PT ratios applied).
- 'Left out: alarm delays, hysteresis and reference values of the relay outputs (202…220) and the analog output curve points
  (231…296 except the output values).'
- The protocol also lists coils (relay outputs), discrete inputs, a data-log file (function 20) and a reset function (14,
  password protected) that aren't described here.
