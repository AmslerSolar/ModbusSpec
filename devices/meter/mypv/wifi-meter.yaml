modbusspec: 0
id: mypv-wifi-meter
manufacturer: my-PV
name: WiFi Meter
kind: meter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/mypv-wifi-meter.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_current, label: Grid L1 current, table: holding, address: 1, type: u16, unit: A, scale: 0.01}
  - {key: l1_power, label: Grid L1 power, table: holding, address: 2, type: s32, unit: W, positive: import}
  - {key: l2_current, label: Grid L2 current, table: holding, address: 11, type: u16, unit: A, scale: 0.01}
  - {key: l2_power, label: Grid L2 power, table: holding, address: 12, type: s32, unit: W, positive: import}
  - {key: l3_current, label: Grid L3 current, table: holding, address: 21, type: u16, unit: A, scale: 0.01}
  - {key: l3_power, label: Grid L3 power, table: holding, address: 22, type: s32, unit: W, positive: import}
  - {key: grid_power, label: Grid power, table: holding, address: 32, type: s32, unit: W, positive: import}
  - {key: x.grid_energy, label: Grid energy, table: holding, address: 34, type: u32, note: evcc multiplies it by 0.00125 for the grid energy.}

notes:
- 'evcc template `mypv-wifi-meter` (grid) lists: my-PV WiFi Meter.'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
