modbusspec: 0
id: algodue-meter
manufacturer: Algodue
name: Energy meter (register map as read by openWB)
kind: meter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/algodue/algodue

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

points:
  - {key: l1_voltage, label: Counter voltage L1, table: input, address: 4096, type: f32, unit: V}
  - {key: l2_voltage, label: Counter voltage L2, table: input, address: 4098, type: f32, unit: V}
  - {key: l3_voltage, label: Counter voltage L3, table: input, address: 4100, type: f32, unit: V}
  - {key: l1_current, label: Counter current L1, table: input, address: 4110, type: f32, unit: A}
  - {key: l2_current, label: Counter current L2, table: input, address: 4112, type: f32, unit: A}
  - {key: l3_current, label: Counter current L3, table: input, address: 4114, type: f32, unit: A}
  - {key: x.counter_power_factors_l1, label: Counter power factor L1, table: input, address: 4120, type: f32}
  - {key: x.counter_power_factors_l2, label: Counter power factor L2, table: input, address: 4122, type: f32}
  - {key: x.counter_power_factors_l3, label: Counter power factor L3, table: input, address: 4124, type: f32}
  - {key: l1_power, label: Counter power L1, table: input, address: 4128, type: f32, unit: W, positive: import}
  - {key: l2_power, label: Counter power L2, table: input, address: 4130, type: f32, unit: W, positive: import}
  - {key: l3_power, label: Counter power L3, table: input, address: 4132, type: f32, unit: W, positive: import}
  - {key: frequency, label: Counter frequency, table: input, address: 4152, type: f32, unit: Hz}

derived:
  - {key: grid_power, label: Counter power, unit: W, positive: import, sum: [{key: l1_power}, {key: l2_power}, {key: l3_power}]}

notes:
- Taken from open-source projects (see sources); not checked against manufacturer documents.
