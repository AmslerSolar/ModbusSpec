  rtu_format: {'0': 8N2, '1': 8E1, '2': 8O1, '3': 8N1}

flags:
  device_status: {'8': 'Relevant parameter changes (stored, acknowledge)', '10': 'Maximum pulse rate was exceeded (stored, acknowledge)', '11': 'Restart of the device (stored, acknowledge)', '12': 'Energy counters reset by the user (stored, acknowledge)', '17': Maximum pulse rate exceeded, '21': Logbook full, '22': SNTP not synchronizing, '23': Wait for user interaction, '24': No synchronization pulse, '25': Device configuration menu is active, '26': Voltage out of range, '27': Current out of range, '28': Device time inaccurate, '29': Update status is active, '30': Hardware write protection is active, '31': Modbus communication is write-protected}

problems:
  - {when: {key: x.device_status, bit: 26}, kind: warning, text: Voltage out of range (status 0x04000000)}
  - {when: {key: x.device_status, bit: 27}, kind: warning, text: Current out of range (status 0x08000000)}
  - {when: {key: x.device_status, bit: 17}, kind: warning, text: Maximum pulse rate exceeded (status 0x00020000)}

notes:
- Function codes 03 and 04 both read every measured value (A.1.3) and the I&M 0 block; the points use input registers (04).
- The tables give each value's "offset" without saying whether it is 0- or 1-based; the offsets are used as protocol addresses
  (voltage L1-N = 1). A read that starts in the second register of a value is refused, so a wrong base fails instead of returning
  shifted data. Unverified on a device.
- Word order isn't stated for the registers (only the logbook example shows a Double big-endian); most significant word first
  is assumed. Unverified.
- Gaps in the map aren't documented as readable, so reads stay within consecutive values.
- Energies are Doubles in Wh (overflow at 1.0e12). The MID registers 961 / 965 (secondary side) and 969 / 973 (primary side)
  are the lifetime totals of tariffs 1 + 2.
- There are no daily energy counters over Modbus; the demand period values cover the current measuring period only.
- The default port is 502 and can be changed on the meter; the unit id isn't stated, 1 is used.
- 'Depending on the variant the PAC2200 has an Ethernet (Modbus TCP), RS485 (Modbus RTU) or M-Bus interface (05/2018 manual).
  RS485: address 1–247, 4800/9600/19200/38400 baud, 8N1/8N2/8E1/8O1, set on the meter; the manual gives no factory defaults.
  The register map is the same over both.'
- Points marked as from the 05/2018 manual (universal and parameter-change counters 215–219, demand values 501–519, apparent
  energies 833/837 and the per-phase reactive and apparent energies 857–877, 897–917, 937–957) aren't in the 12/2022 PAC2200CLP
  table; they are optional.
- The 05/2018 manual lists the MID registers as a single "secondary active energy (MID register)" at offset 964 (4 registers),
  which overlaps the 12/2022 layout (961 / 965 secondary, 969 / 973 primary); 964 looks like a misprint there. Unverified
  on a device.
- mbmd (type code PAC2200) detects the meter by reading L1 Voltage (input register 1, f32); its bus scan accepts a value within
  10% of 110 or 230 V.
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Measurements are read with function 04; the I&M0 identification block (holding registers 64001–64027) has to be read as
  one block.
- A PAC2200 answers with manufacturer ID 42 and profile ID 0xF600; its order number starts with 7KM2200.
- The project doesn't say which way active power is positive.
- Write-only command 65326 = localize on/off.
- Identification as mbmd recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
