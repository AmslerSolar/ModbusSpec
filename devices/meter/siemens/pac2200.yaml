connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125
    max_gap: 0
  input_equals_holding: true
  blocks:
  # I&M 0: the meter refuses partial reads
  - table: holding
    address: 64001
    count: 27

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 64012
    type: str
    length: 8
  checks:
  - table: holding
    address: 64001
    type: u16
    equals: 42

