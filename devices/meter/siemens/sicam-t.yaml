modbusspec: 0
id: siemens-sicam-t
manufacturer: Siemens
name: SICAM T 7KG966 power meter
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.siemens/src/io/openems/edge/meter/siemens/sicam/MeterSiemensSicamt7kg966Impl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 200, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 202, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 204, type: f32, unit: V}
  - {key: l1_current, label: Current L1, table: holding, address: 208, type: f32, unit: A}
  - {key: l2_current, label: Current L2, table: holding, address: 210, type: f32, unit: A}
  - {key: l3_current, label: Current L3, table: holding, address: 212, type: f32, unit: A}
  - {key: x.voltage, label: Voltage, table: holding, address: 222, type: f32, unit: V}
  - {key: x.current, label: Current, table: holding, address: 224, type: f32, unit: A}
  - {key: l1_power, label: Active Power L1, table: holding, address: 226, type: f32, unit: W, positive: import}
  - {key: l2_power, label: Active Power L2, table: holding, address: 228, type: f32, unit: W, positive: import}
  - {key: l3_power, label: Active Power L3, table: holding, address: 230, type: f32, unit: W, positive: import}
  - {key: grid_power, label: Active Power, table: holding, address: 232, type: f32, unit: W, positive: import}
  - {key: x.reactive_power_l1, label: Reactive Power L1, table: holding, address: 234, type: f32, unit: var}
  - {key: x.reactive_power_l2, label: Reactive Power L2, table: holding, address: 236, type: f32, unit: var}
  - {key: x.reactive_power_l3, label: Reactive Power L3, table: holding, address: 238, type: f32, unit: var}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 240, type: f32, unit: var}
  - {key: frequency, label: Frequency, table: holding, address: 274, type: f32, unit: Hz}

notes:
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
