  - {key: x.manufacturer_id, label: Manufacturer's ID, table: holding, address: 64001, type: u16, poll: slow, note: 42 = Siemens AG.}
  - {key: x.order_number, label: Order No., table: holding, address: 64002, type: str, length: 10, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 64012, type: str, length: 8, poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 64020, type: u16, poll: slow}
  - {key: firmware, label: Firmware version, table: holding, address: 64021, type: u32, poll: slow, note: 'Four bytes: a letter, then major, minor and patch.'}

derived:
  - {key: grid_import_energy, label: Active energy import (tariff 1 + 2), unit: kWh, sum: [{key: x.energy_import_t1}, {key: x.energy_import_t2}]}
  - {key: grid_export_energy, label: Active energy export (tariff 1 + 2), unit: kWh, sum: [{key: x.energy_export_t1}, {key: x.energy_export_t2}]}

enums:
  tariff: {'0': Tariff 1, '1': Tariff 2}
  connection_type: {'0': 3P4W, '1': 3P3W, '2': 3P4WB, '3': 3P3WB, '4': 1P2W}
  no_yes: {'0': 'No', '1': 'Yes'}
  ethernet_protocol: {'0': MODBUS TCP, '1': SEAbus TCP}
  baud: {'0': '4800', '1': '9600', '2': '19200', '3': '38400'}
  serial_format: {'0': 8N2, '1': 8E1, '2': 8O1, '3': 8N1}

flags:
  limits: {'0': Limit 0 violated, '1': Limit 1 violated, '2': Limit 2 violated, '3': Limit 3 violated, '4': Limit 4 violated, '5': Limit 5 violated, '24': Limit logic}
  device_status: {'8': 'Relevant parameter changes (stored, acknowledge)', '9': 'Upper or lower limit violation (stored, acknowledge)', '10': 'Maximum pulse rate exceeded (stored, acknowledge)', '11': 'Restart of the device (stored, acknowledge)', '12': 'Energy counter reset by user (stored, acknowledge)', '16': Module slot 1, '17': Maximum pulse rate exceeded, '24': No synchronization pulse, '25': Device configuration menu is active, '26': Voltage overload, '27': Current overload}

problems:
  - {when: {key: x.device_status, bit: 26}, kind: warning, text: Voltage overload (status 0x04000000)}
  - {when: {key: x.device_status, bit: 27}, kind: warning, text: Current overload (status 0x08000000)}
  - {when: {key: x.device_status, bit: 17}, kind: warning, text: Maximum pulse rate exceeded (status 0x00020000)}

notes:
- 'Modbus TCP must be switched on at the meter (SETTINGS > COMMUNICATION > PROTOCOL): out of the box the Ethernet port speaks
  SEAbus TCP. Port 502.'
- Function codes 03 and 04 both read the measured values, settings, communication parameters and the I&M 0 block; the measured
  values use input registers (04) here.
- The tables give each value's "offset"; the offsets are used as protocol addresses (voltage Va-n = 1). A read that starts
  in the second register of a value is refused, so a wrong base fails instead of returning shifted data. Unverified on a device.
- Byte and word order aren't stated; most significant first is assumed. Unverified.
- Energies are Doubles in Wh (overflow at 1.0e12), split by tariff only; the lifetime totals here are the sum of tariffs 1
  and 2.
- 'The order number check (prefix 7KM211, from the manual''s ordering data: 7KM2112-… and 7KM2111-…) tells the PAC3200 from
  other SENTRON PAC meters that share the same I&M layout.'
- 'RS485 (Modbus RTU) only with the PAC RS485 expansion module: unit id 1 … 247, 4800 … 38400 baud (default 19200); the default
  unit id and data format aren''t stated (unit 1 assumed). Without the module the 63017 … 63025 registers are meaningless.'
- The unit id over Modbus TCP isn't stated; 1 is used.
- 'Left out: maximum / minimum values (75 … 201), the remaining demand values (503, 507 … 519), parameter change counters
  (217 … 221), limit value, digital I/O, display and language settings (50025 … 50145), the expansion module''s I&M block
  (64117) and I&M 1-4 (64028). Write-only commands (function 06): 60002 / 60003 reset max / min values, 60004 reset energy
  counters, 60006 switch tariff, 60007 acknowledge stored status bits, 60008 switch output, 65300 activate changed IP settings.'
- 'Status registers can also be read as discrete inputs (function 02): 0 … 5 limits 0 … 5, 50 limit logic, 108 … 127 the device
  status bits, 200 digital input 0, 300 digital output 0.'
