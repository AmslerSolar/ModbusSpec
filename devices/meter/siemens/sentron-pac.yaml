  - {key: x.energy_apparent_t1, label: Apparent Energy Tariff 1, table: input, address: 833, type: f64, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.energy_apparent_t2, label: Apparent Energy Tariff 2, table: input, address: 837, type: f64, unit: kVAh, scale: 0.001, poll: slow}
