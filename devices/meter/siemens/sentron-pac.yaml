  - {key: x.l2_reactive_power, label: Reactive Power b, table: input, address: 33, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: Reactive Power c, table: input, address: 35, type: f32, unit: var}
  - {key: x.l1_power_factor, label: Power Factor a, table: input, address: 37, type: f32, note: 0 … 1 (unsigned).}
  - {key: x.l2_power_factor, label: Power Factor b, table: input, address: 39, type: f32, note: 0 … 1 (unsigned).}
  - {key: x.l3_power_factor, label: Power Factor c, table: input, address: 41, type: f32, note: 0 … 1 (unsigned).}
  - {key: x.l1_voltage_thd, label: THD-R Voltage a, table: input, address: 43, type: f32, unit: '%'}
  - {key: x.l2_voltage_thd, label: THD-R Voltage b, table: input, address: 45, type: f32, unit: '%'}
  - {key: x.l3_voltage_thd, label: THD-R Voltage c, table: input, address: 47, type: f32, unit: '%'}
  - {key: x.l1_current_thd, label: THD-R Current a, table: input, address: 49, type: f32, unit: '%'}
  - {key: x.l2_current_thd, label: THD-R Current b, table: input, address: 51, type: f32, unit: '%'}
  - {key: x.l3_current_thd, label: THD-R Current c, table: input, address: 53, type: f32, unit: '%'}
  - {key: frequency, label: Frequency, table: input, address: 55, type: f32, unit: Hz}
