  - {key: x.demand_export_power, label: Demand Active Power - Export, table: input, address: 505, type: f32, unit: W, poll: slow}
  - {key: x.energy_import_t1, label: Active Energy Import Tariff 1, table: input, address: 801, type: f64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.energy_import_t2, label: Active Energy Import Tariff 2, table: input, address: 805, type: f64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.energy_export_t1, label: Active Energy Export Tariff 1, table: input, address: 809, type: f64, unit: kWh, scale: 0.001, poll: slow}
