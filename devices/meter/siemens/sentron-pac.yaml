  - {key: x.vt_secondary, label: Secondary voltage, table: holding, address: 50007, type: u32, unit: V, poll: slow, writable: true, min: 1, max: 690}
  - {key: x.ct_primary, label: Primary current, table: holding, address: 50011, type: u32, unit: A, poll: slow, writable: true, min: 1, max: 99999}
