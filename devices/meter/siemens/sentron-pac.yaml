# Written from the Siemens SENTRON PAC3200 Power Monitoring Device Manual (A5E01168664B-04, 02/2008), section 3.9.

modbusspec: 0
id: siemens-sentron-pac
manufacturer: Siemens
name: SENTRON PAC3200 power monitoring device
kind: meter

sources:
- title: SENTRON PAC3200 Power Monitoring Device, Manual (A5E01168664B-04)
  version: 02/2008
  url: https://cache.industry.siemens.com/dl/files/150/26504150/att_906558/v1/A5E01168664B-04_EN-US_122016_201612221316360495.pdf
  sha256: b9efef1f28f8588d3f9b9ba04754e4914850fb0ec74373955d199d8f6b3de187
  archive_url: https://web.archive.org/web/20261015221331/https://cache.industry.siemens.com/dl/files/150/26504150/att_906558/v1/A5E01168664B-04_EN-US_122016_201612221316360495.pdf
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/siemens/siemens_sentron

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 19200
  limits:
    max_gap: 0
  input_equals_holding: true
  blocks:
  # I&M 0: only readable as a whole
  - table: holding
    address: 64001
    count: 27

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 64012
    type: str
    length: 8
  checks:
  - table: holding
    address: 64001
    type: u16
    equals: 42
  - table: holding
    address: 64002
    type: str
    length: 10
    prefix: 7KM211

points:
  - {key: l1_voltage, label: Voltage Va-n, table: input, address: 1, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage Vb-n, table: input, address: 3, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage Vc-n, table: input, address: 5, type: f32, unit: V}
  - {key: x.l1_l2_voltage, label: Voltage Va-b, table: input, address: 7, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Voltage Vb-c, table: input, address: 9, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Voltage Vc-a, table: input, address: 11, type: f32, unit: V}
  - {key: l1_current, label: Current a, table: input, address: 13, type: f32, unit: A}
  - {key: l2_current, label: Current b, table: input, address: 15, type: f32, unit: A}
  - {key: l3_current, label: Current c, table: input, address: 17, type: f32, unit: A}
  - {key: x.l1_apparent_power, label: Apparent Power a, table: input, address: 19, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Apparent Power b, table: input, address: 21, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Apparent Power c, table: input, address: 23, type: f32, unit: VA}
  - {key: l1_power, label: Active Power a, table: input, address: 25, type: f32, unit: W, positive: import, verified: false, note: Sign not stated in the register table; assumed as for the total active power.}
  - {key: l2_power, label: Active Power b, table: input, address: 27, type: f32, unit: W, positive: import, verified: false, note: Sign not stated in the register table; assumed as for the total active power.}
  - {key: l3_power, label: Active Power c, table: input, address: 29, type: f32, unit: W, positive: import, verified: false, note: Sign not stated in the register table; assumed as for the total active power.}
