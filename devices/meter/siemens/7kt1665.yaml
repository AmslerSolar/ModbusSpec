modbusspec: 0
id: siemens-7kt1665
manufacturer: Siemens
name: 7KT1665
kind: meter

sources:
- id: evcc
  title: evcc (EV charging and energy management)
  url: https://github.com/evcc-io/evcc
  license: MIT
  commit: bf5c276cdb395443fda4601b99151c0a962d0db4
  path: templates/definition/meter/siemens-7kt1665.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N1

defaults:
  verified: false
  sources:
  - evcc

points:
  - {key: l1_voltage, label: Grid L1 voltage, table: input, address: 1, type: u32, unit: V, scale: 0.01, note: 'evcc reads it for the usages grid, charge.'}
  - {key: l2_voltage, label: Grid L2 voltage, table: input, address: 3, type: u32, unit: V, scale: 0.01, note: 'evcc reads it for the usages grid, charge.'}
  - {key: l3_voltage, label: Grid L3 voltage, table: input, address: 5, type: u32, unit: V, scale: 0.01, note: 'evcc reads it for the usages grid, charge.'}
  - {key: l1_current, label: Grid L1 current, table: input, address: 7, type: u32, unit: A, scale: 0.0001, note: 'evcc reads it for the usages grid, charge.'}
  - {key: l2_current, label: Grid L2 current, table: input, address: 9, type: u32, unit: A, scale: 0.0001, note: 'evcc reads it for the usages grid, charge.'}
  - {key: l3_current, label: Grid L3 current, table: input, address: 11, type: u32, unit: A, scale: 0.0001, note: 'evcc reads it for the usages grid, charge.'}
  - {key: grid_power, label: Grid power, table: input, address: 57, type: s32, unit: W, scale: 0.01, positive: import, note: 'evcc reads it for the usages grid, charge.'}
  - {key: grid_import_energy, label: Grid energy, table: input, address: 6687, type: u32, unit: kWh, scale: 0.001, note: 'evcc reads it for the usages grid, charge.'}

notes:
- 'evcc template `siemens-7kt1665` (grid, charge) lists: Siemens 7KT1665; Siemens 7KT1666 (MID).'
- Taken from open-source projects (see sources); not checked against manufacturer documents.
