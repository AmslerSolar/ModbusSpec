modbusspec: 0
id: lovato-dmg610
manufacturer: Lovato
name: DMG610 multifunction meter
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/dmg610.go

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  checks:
  - - table: input
      address: 1
      type: u32
      range:
      - 9900
      - 12100
    - table: input
      address: 1
      type: u32
      range:
      - 20700
      - 25300

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: l1_voltage, label: L1 Voltage, table: input, address: 1, type: u32, unit: V, scale: 0.01}
  - {key: l2_voltage, label: L2 Voltage, table: input, address: 3, type: u32, unit: V, scale: 0.01}
  - {key: l3_voltage, label: L3 Voltage, table: input, address: 5, type: u32, unit: V, scale: 0.01}
  - {key: l1_current, label: L1 Current, table: input, address: 7, type: u32, unit: A, scale: 0.0001}
  - {key: l2_current, label: L2 Current, table: input, address: 9, type: u32, unit: A, scale: 0.0001}
  - {key: l3_current, label: L3 Current, table: input, address: 11, type: u32, unit: A, scale: 0.0001}
  - {key: x.power_l1, label: L1 Power, table: input, address: 19, type: s32, unit: W, scale: 0.01}
  - {key: x.power_l2, label: L2 Power, table: input, address: 21, type: s32, unit: W, scale: 0.01}
  - {key: x.power_l3, label: L3 Power, table: input, address: 23, type: s32, unit: W, scale: 0.01}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: input, address: 25, type: s32, unit: var, scale: 0.01}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: input, address: 27, type: s32, unit: var, scale: 0.01}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: input, address: 29, type: s32, unit: var, scale: 0.01}
  - {key: x.apparent_power_l1, label: L1 Apparent Power, table: input, address: 31, type: u32, unit: VA, scale: 0.01}
  - {key: x.apparent_power_l2, label: L2 Apparent Power, table: input, address: 33, type: u32, unit: VA, scale: 0.01}
  - {key: x.apparent_power_l3, label: L3 Apparent Power, table: input, address: 35, type: u32, unit: VA, scale: 0.01}
  - {key: frequency, label: Frequency, table: input, address: 49, type: u32, unit: Hz, scale: 0.001}
  - {key: x.power, label: Power, table: input, address: 57, type: s32, unit: W, scale: 0.01}
  - {key: reactive_power, label: Reactive Power, table: input, address: 59, type: s32, unit: var, scale: 0.01}
  - {key: apparent_power, label: Apparent Power, table: input, address: 61, type: u32, unit: VA, scale: 0.01}
  - {key: x.thd_l1, label: L1 Voltage to neutral THD, table: input, address: 83, type: u32, unit: '%', scale: 0.01}
  - {key: x.thd_l2, label: L2 Voltage to neutral THD, table: input, address: 85, type: u32, unit: '%', scale: 0.01}
  - {key: x.thd_l3, label: L3 Voltage to neutral THD, table: input, address: 87, type: u32, unit: '%', scale: 0.01}
  - {key: grid_import_energy, label: Total Import, table: input, address: 6943, type: u64, unit: kWh, scale: 0.01}
  - {key: grid_export_energy, label: Total Export, table: input, address: 6947, type: u64, unit: kWh, scale: 0.01}
  - {key: x.reactive_import, label: Reactive Import, table: input, address: 6951, type: u64, unit: kvarh, scale: 0.01}
  - {key: x.reactive_export, label: Reactive Export, table: input, address: 6955, type: u64, unit: kvarh, scale: 0.01}
  - {key: x.import_l1, label: L1 Import, table: input, address: 7711, type: u64, unit: kWh, scale: 0.01}
  - {key: x.export_l1, label: L1 Export, table: input, address: 7715, type: u64, unit: kWh, scale: 0.01}
  - {key: x.import_l2, label: L2 Import, table: input, address: 7751, type: u64, unit: kWh, scale: 0.01}
  - {key: x.export_l2, label: L2 Export, table: input, address: 7755, type: u64, unit: kWh, scale: 0.01}
  - {key: x.import_l3, label: L3 Import, table: input, address: 7791, type: u64, unit: kWh, scale: 0.01}
  - {key: x.export_l3, label: L3 Export, table: input, address: 7795, type: u64, unit: kWh, scale: 0.01}

notes:
- mbmd (type code DMG610) detects the meter by reading L1 Voltage (input register 1, u32, scale 0.01); its bus scan accepts
  a value within 10% of 110 or 230 V.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
