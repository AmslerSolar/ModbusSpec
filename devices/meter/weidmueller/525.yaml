notes:
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
