# Written from the Powertrac Energy Meter Modbus Electrical parameters sheet (3 line display, undated).

modbusspec: 0
id: powertrac-mfm
manufacturer: Powertrac
name: Multifunction energy meter (3 line display, mains / DG)
kind: meter

sources:
- title: Energy Meter Modbus Electrical parameters (3 line display)
  version: '-'
  url: https://powertracindia.com/images/digital-meter/multifunction-meter/modbus-mapping.pdf
  sha256: 65eadf069eb39ec527bf2a1f13cddb27c07a9ea7e697ebf4745a32a99047b66b
  archive_url: https://web.archive.org/web/20250215064956/https://powertracindia.com/images/digital-meter/multifunction-meter/modbus-mapping.pdf

connection:
  default_port: 502
  default_unit: 100
  transports:
  - rtu
  limits:
    max_registers: 62

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  - {key: x.id, label: id, table: input, address: 1, type: u32, poll: slow}
  - {key: x.ct_ratio, label: ct ratio, table: input, address: 3, type: u32, poll: slow}
  - {key: x.eb_dg_status, label: eb dg status, table: input, address: 5, type: u32, poll: fast, note: Mains (EB) or generator (DG) supply; the values are not given.}
  - {key: x.eb_energy, label: eb kwh, table: input, address: 13, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.eb_apparent_energy, label: kvah, table: input, address: 15, type: u32, unit: kVAh, scale: 0.01, poll: slow, note: Assumed to belong to the mains (EB) counters; the sheet only says kvah.}
  - {key: x.eb_reactive_energy, label: rkvah, table: input, address: 17, type: u32, unit: kvarh, scale: 0.01, poll: slow, note: Assumed to belong to the mains (EB) counters; the sheet only says rkvah.}
  - {key: x.dg_energy, label: Cum DG KWH, table: input, address: 19, type: u32, unit: kWh, scale: 0.01, poll: slow}
  - {key: x.dg_apparent_energy, label: kvah, table: input, address: 21, type: u32, unit: kVAh, scale: 0.01, poll: slow, note: Assumed to belong to the generator (DG) counters; the sheet only says kvah.}
  - {key: x.dg_reactive_energy, label: rkvah, table: input, address: 23, type: u32, unit: kvarh, scale: 0.01, poll: slow, note: Assumed to belong to the generator (DG) counters; the sheet only says rkvah.}
  - {key: l1_current, label: r current, table: input, address: 25, type: u32, unit: A, scale: 0.001, poll: fast}
  - {key: l2_current, label: y current, table: input, address: 27, type: u32, unit: A, scale: 0.001, poll: fast}
  - {key: l3_current, label: b current, table: input, address: 29, type: u32, unit: A, scale: 0.001, poll: fast}
  - {key: l1_voltage, label: r volt, table: input, address: 31, type: u32, unit: V, scale: 0.001, poll: fast}
  - {key: l2_voltage, label: y volt, table: input, address: 33, type: u32, unit: V, scale: 0.001, poll: fast}
  - {key: l3_voltage, label: b volt, table: input, address: 35, type: u32, unit: V, scale: 0.001, poll: fast}
  - {key: x.l1_active_power, label: r ph. kw, table: input, address: 37, type: u32, unit: kW, scale: 0.001, poll: fast}
  - {key: x.l2_active_power, label: y ph. kw, table: input, address: 39, type: u32, unit: kW, scale: 0.001, poll: fast}
  - {key: x.l3_active_power, label: b ph. kw, table: input, address: 41, type: u32, unit: kW, scale: 0.001, poll: fast}
  - {key: x.l1_apparent_power, label: R ph. kva, table: input, address: 43, type: u32, unit: kVA, scale: 0.001, poll: fast}
  - {key: x.l2_apparent_power, label: y ph. kva, table: input, address: 45, type: u32, unit: kVA, scale: 0.001, poll: fast}
  - {key: x.l3_apparent_power, label: b ph. kva, table: input, address: 47, type: u32, unit: kVA, scale: 0.001, poll: fast}
  - {key: x.l1_reactive_power, label: r ph. kvar, table: input, address: 49, type: u32, unit: kvar, scale: 0.001, poll: fast}
  - {key: x.l2_reactive_power, label: y ph. kvar, table: input, address: 51, type: u32, unit: kvar, scale: 0.001, poll: fast}
  - {key: x.l3_reactive_power, label: b ph. kvar, table: input, address: 53, type: u32, unit: kvar, scale: 0.001, poll: fast}
  - {key: x.l1_power_factor, label: r ph. Pf, table: input, address: 55, type: u32, scale: 0.001, poll: fast}
  - {key: x.l2_power_factor, label: y ph. Pf, table: input, address: 57, type: u32, scale: 0.001, poll: fast}
  - {key: x.l3_power_factor, label: b ph. Pf, table: input, address: 59, type: u32, scale: 0.001, poll: fast}
  - {key: frequency, label: fr, table: input, address: 61, type: u32, unit: Hz, scale: 0.1, poll: fast}
  - {key: x.modbus_address, label: id (write), table: holding, address: 100, type: u16, writable: true, poll: slow, note: Written with function 06.}
  - {key: x.ct_ratio_setting, label: ct ratio (write), table: holding, address: 101, type: u16, writable: true, poll: slow, note: Written with function 06.}

notes:
- A one-page sheet. It lists the values at every second register from 1 to 61 and reads them all with function 04 from address
  1, 62 registers (example frame to unit 0x64 = 100). The table numbers are used as 0-based protocol addresses because that
  example starts at address 1. Each value thus spans two registers; the sheet calls them 16-bit registers and gives neither
  the data type nor the word order. Unsigned 32-bit, high word first is assumed; check on a real device.
- The sheet gives only a divisor per value (100, 1000 or 10); the units (kWh, A, V, kW, Hz …) are assumed from the names.
  A divisor of 1000 on the voltage is as stated; verify.
- No signs are given for the per-phase powers or power factors.
- EB is the mains supply, DG the diesel generator; the meter keeps separate energy counters for each. The values of the EB/DG
  status register are not given.
- Default unit 100 is taken from the example frames; the actual factory default is not stated. Serial settings are not stated.
- The id and CT ratio are written with function 06 at holding registers 0x64 and 0x65 (from the example frames).
- No register identifies the device.
