notes:
- 'The table lists what the DIRIS-O''s BACnet and Profibus modules exchange in two profiles of 60 values: a name and a hexadecimal register for each. It gives no types, units, scales, table or function codes, and it isn''t a Modbus description of the device. All of that here is inferred, so every point is unverified. The registers are used as protocol addresses in the holding table, as in Socomec''s other tables.'
- 'Types, units and scales are taken from Socomec''s DIRIS B-30 table for the same quantities. They may not hold on a DIRIS-O.'
- 'Power registers disagree with the DIRIS B-30 table, by two addresses: here Ptot is 0x482E, Qtot 0x4830, Stot 0x4836, FPtot 0x4838 and P1 0x483A, where the B-30 table has them at 0x482C, 0x482E, 0x4834, 0x4836 and 0x4838. Voltages, currents and energies match. This file follows the DIRIS-O table; check on a real device before using power values. The direction isn''t stated.'
- 'N1 to N4 are the table''s names, taken to be four measurement channels; each is 0x800 registers on from the last. Es is taken to be apparent energy. Only N1 voltages and currents use standard keys.'
- 'The table lists no serial settings, unit id, identification or transport other than the modules. RS485, unit 1 and 125 registers per request are assumed. No identify: no register in the table is fixed.'
- 'The 60 values of each profile overlap in P1–P3 and Ptot. Everything else in the table is here. Other registers of the device aren''t in it.'
