notes:
- "Written from the M44 table; rows only the M44 has are optional. Measurements are input registers (function 04), settings holding registers (function 03): the same address means different things in the two tables. All values are 32-bit floats."
- "Changing settings needs the password (not in this file). The table gives no way to tell the model from its registers except a Product ID (64514) without values, so this file has no identification. The serial number at 64512 is taken to be in the holding table, as the table's Product block doesn't say."
- "The table gives no default unit id or serial settings; unit 1 is assumed."
- "Write-only commands (resets, configuration storage) are left out, as are fields the format can't express or that the table points elsewhere for."
