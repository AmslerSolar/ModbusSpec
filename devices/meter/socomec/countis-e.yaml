# Written from the Socomec Countis E43 JBUS / Modbus table (JBUS common table 1.01, index A), a spreadsheet for the
# Countis E43 (three-phase, 5 A current transformers). Rows the table marks as not applicable to the E43 are left out.

modbusspec: 0
id: socomec-countis-e
manufacturer: Socomec
name: Countis E3x / E4x energy meters
kind: meter

sources:
- title: Socomec .MODBUS E43 (Countis E43 JBUS common table, 538461 / 53633 index A)
  version: JBUS common table 1.01
  url: https://github.com/user-attachments/files/30981536/Socomec_.MODBUS_E43.XLS
  sha256: ff37054be27b7d90a99c5c055d356d7066cf3736d6a7f9028eaca0b74550e0cb
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/socomec.go
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.socomec/src/io/openems/edge/meter/socomec/threephase/MeterSocomecThreephaseImpl.java, io.openems.edge.meter.socomec/src/io/openems/edge/meter/socomec/singlephase/MeterSocomecSinglephaseImpl.java

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - - table: holding
      address: 50520
      type: u32
      range:
      - 9900
      - 12100
    - table: holding
      address: 50520
      type: u32
      range:
      - 20700
      - 25300

models:
  - {id: e23_e24_e27_e28, name: Countis E23 / E24 / E27 / E28}
  - {id: e14, name: Countis E14}

