notes:
- The table is the Socomec common JBUS / Modbus table filtered for the Countis E43 (three-phase meter on 5 A current transformers).
  Addresses are given in decimal and hex and are used here as protocol addresses (holding registers, function 3).
- 'Functions: 3 (read up to 125 registers), 6 and 16 (write). Values are high word first. A value not available reads as 0xFFFF
  / 0xFFFFFFFF (unsigned) or 0x7FFF / 0x7FFFFFFF (signed).'
- The E43 has no frequency, hour meter, apparent energy, negative reactive energy, pulse inputs or THD in this table (marked
  not applicable).
- 'A 16-bit copy of the main values (0xC850, 51280 ff.: voltages and currents, powers in kW / 100, energies in MWh) and the
  average / maximum statistics (0xC750) are left out.'
- The serial link settings, default unit id and the identification registers aren't in this table; unit 1 is assumed.
- 'Write-only actions left out: 0xE200 (0xA1 store configuration, 0xB2 reset), 0xE220–0xE224 (erase min/max, energies, counters),
  0x9E40 (reset max P / partial energies).'
- Models e14 come from projects and are listed after a model without a match, so detection never reaches them; their points
  apply only when a reader selects such a model by hand.
- Identification as mbmd recognises the device (not checked against a document).
- Voltages, currents and powers come from the metrology table and include the configured CT/VT ratio; total energies have
  1 kWh resolution.
- mbmd (type code SOCOMEC) detects the meter by reading L1 Voltage (holding register 50520, u32, scale 0.01); its bus scan
  accepts a value within 10% of 110 or 230 V.
- OpenEMS checks for 'SOCO' at 0xC350 and picks the model by the start of the product name at 0xC38A (8 registers, compared
  in lower case).
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
