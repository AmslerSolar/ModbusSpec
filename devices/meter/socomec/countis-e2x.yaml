notes:
- Socomec's tables of 2025 give the E23, E24, E27 and E28 the same rows (one description differs at 26368), and the table of 2017 for the E23 differs from them only there. A real Countis E24 answered exactly the tables' read blocks, with the same starts and lengths, and its values fit. E23, E27 and E28 were not read.
- 'Not the map of the E43 / E44 (socomec-countis-e): the same addresses differ. 57344-57347 are the serial settings here and network type and current transformer there, and the frequency is Hz / 1000 here and Hz / 100 there. Writing with the wrong file changes the wrong setting.'
- 'Functions: 3 (read up to 125 registers), 6 and 16 (write). Function 4 is refused. Values are high word first; a request reaching outside a block is refused with exception 2. Unused registers inside a block read 0 or FFFFh.'
- The table gives no default unit id or serial settings; unit 1 is assumed. A real E24 ran at 9600 8N1 and 115200 8N1.
- 'Write-only actions left out: 0xE200 (0xA1 store configuration, 0xB2 reset), 0xE222 and 0xE224 (reset partial energies, tariff counters), 0x9E40 (0x20 reset partial energies). The table does not say whether a changed setting needs 0xA1.'
- 'Not checked by a reading under load: the sign of the powers, and the currents and powers in general; the real E24 had no load.'
