# Written from Socomec's Modbus table for the Countis E23 (48503050, V103.18, 2017-08), checked on a real Countis E24.
# Socomec's tables of 2025 for the E23, E24, E27 and E28 have the same rows.

modbusspec: 0
id: socomec-countis-e2x
manufacturer: Socomec
name: Countis E23 / E24 / E27 / E28 energy meters
kind: meter

sources:
- title: Socomec Countis E23 Modbus communication table (48503050)
  version: V103.18, Modbus tables V1.1 (2017-08)
  url: https://www.socomec.fr/sites/default/files/2021-05/COUNTIS-E23-MODBUS-48503050-V103.18_COMMUNICATION-TABLE_2017-08_CMT_EN.html
  language: en
  devices: [Countis E23]
- title: Socomec Countis E24 Modbus communication table
  version: 2025-01
  url: https://www.socomec.fr/sites/default/files/2025-01/COUNTIS-E24-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-01_CMT_EN_0.html
  language: en
  devices: [Countis E24]
- title: Socomec Countis E23 Modbus communication table
  version: 2025-01
  url: https://www.socomec.fr/sites/default/files/2025-01/COUNTIS-E23-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-01_CMT_EN.html
  language: en
  devices: [Countis E23]
- title: Socomec Countis E27 Modbus communication table
  version: 2025-03
  url: https://www.socomec.fr/sites/default/files/2025-03/COUNTIS-E27-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-03_CMT_EN.html
  language: en
  devices: [Countis E27]
- title: Socomec Countis E28 Modbus communication table
  version: 2025-03
  url: https://www.socomec.fr/sites/default/files/2025-03/COUNTIS-E28-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-03_CMT_EN.html
  language: en
  devices: [Countis E28]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - {table: holding, address: 50000, type: str, length: 4, chars: low, equals: SOCO}
  - {table: holding, address: 50058, type: str, length: 8, prefix: Countis E2}

points:

  # Identification (0xC350)
  - {key: x.socomec_marker, label: "\"SOCO\" marker", table: holding, address: 50000, type: str, length: 4, chars: low, poll: slow, verified: true}
  - {key: x.product_order_id, label: "Product order ID (Countis 100, Protection 200, Atys 300, Diris 400)", table: holding, address: 50004, type: u16, poll: slow, verified: true}
  - {key: x.product_id, label: "Product ID", table: holding, address: 50005, type: u16, poll: slow}
  - {key: x.table_version, label: "JBUS table version", table: holding, address: 50006, type: u16, scale: 0.01, poll: slow, note: "101 = version 1.01."}
  - {key: firmware, label: "Product software version", table: holding, address: 50007, type: u16, scale: 0.01, poll: slow, note: "100 = version 1.00."}
  - {key: x.serial_year_week, label: "Serial AA SS", table: holding, address: 50008, type: u16, poll: slow, note: "Shown as hex."}
  - {key: x.serial_week_line, label: "Serial SST L", table: holding, address: 50009, type: u16, poll: slow, note: "Shown as hex."}
  - {key: x.serial_order, label: "Serial order", table: holding, address: 50010, type: u16, poll: slow}
  - {key: x.product_version_major, label: "Product version (major)", table: holding, address: 50018, type: u16, poll: slow}
  - {key: x.product_version_minor, label: "Product version (minor)", table: holding, address: 50019, type: u16, poll: slow}
  - {key: x.product_vlo, label: "Product VLO", table: holding, address: 50030, type: str, length: 4, poll: slow}
  - {key: x.vendor_name, label: "Vendor name", table: holding, address: 50042, type: str, length: 8, poll: slow, verified: true, note: "A real E24 read \"SOCOMEC\"."}
  - {key: x.product_name, label: "Product name", table: holding, address: 50050, type: str, length: 8, poll: slow, verified: true, note: "A real E24 read \"Countis\"."}
  - {key: x.extended_name, label: "Extended name", table: holding, address: 50058, type: str, length: 8, poll: slow, verified: true, note: "A real E24 read \"Countis E24\"."}

  # Modbus settings (0xE000)
  - {key: x.modbus_address, label: "Slave address", table: holding, address: 57344, type: u16, writable: true, poll: slow, verified: true, note: "A real E24 set to address 5 read 5."}
  - {key: x.baud_rate, label: "Baud rate", table: holding, address: 57345, type: u16, enum: baud_rate, writable: true, poll: slow, verified: true, note: "An index. A real E24 read 3 at 9600 and 7 at 115200 baud."}
  - {key: x.stop_bits, label: "Stop bits", table: holding, address: 57346, type: u16, enum: stop_bits, writable: true, poll: slow, verified: true, note: "A real E24 at 8N1 read 0."}
  - {key: x.parity, label: "Parity", table: holding, address: 57347, type: u16, enum: parity, writable: true, poll: slow, verified: true, note: "A real E24 at 8N1 read 0."}

  # Metrology, with the transformer ratios (0xC550)
  - {key: x.voltage_l1_l2, label: "Phase to phase voltage U12", table: holding, address: 50514, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: x.voltage_l2_l3, label: "Phase to phase voltage U23", table: holding, address: 50516, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: x.voltage_l3_l1, label: "Phase to phase voltage U31", table: holding, address: 50518, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: l1_voltage, label: "Simple voltage V1", table: holding, address: 50520, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: l2_voltage, label: "Simple voltage V2", table: holding, address: 50522, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: l3_voltage, label: "Simple voltage V3", table: holding, address: 50524, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: frequency, label: "Frequency", table: holding, address: 50526, type: u32, unit: "Hz", scale: 0.001, invalid: [4294967295], verified: true, note: "A real E24 read 50020 (50.02 Hz). The E43 table gives Hz / 100 at this register; mbmd follows that one."}
  - {key: l1_current, label: "Current I1", table: holding, address: 50528, type: u32, unit: "A", scale: 0.001, invalid: [4294967295]}
  - {key: l2_current, label: "Current I2", table: holding, address: 50530, type: u32, unit: "A", scale: 0.001, invalid: [4294967295]}
  - {key: l3_current, label: "Current I3", table: holding, address: 50532, type: u32, unit: "A", scale: 0.001, invalid: [4294967295]}
  - {key: x.neutral_current, label: "Neutral current In", table: holding, address: 50534, type: u32, unit: "A", scale: 0.001, invalid: [4294967295]}
  - {key: grid_power, label: "Sum active power P", table: holding, address: 50536, type: s32, unit: "W", scale: 10, positive: import, invalid: [2147483647], verified: False, note: "The table says +/- without a direction; import is assumed, as for the E43."}
  - {key: reactive_power, label: "Sum reactive power Q", table: holding, address: 50538, type: s32, unit: "var", scale: 10, invalid: [2147483647]}
  - {key: apparent_power, label: "Sum apparent power S", table: holding, address: 50540, type: u32, unit: "VA", scale: 10, invalid: [4294967295]}
  - {key: power_factor, label: "Sum power factor PF", table: holding, address: 50542, type: s32, scale: 0.001, invalid: [2147483647], note: "Negative leading, positive lagging."}
  - {key: l1_power, label: "Active power phase 1 P1", table: holding, address: 50544, type: s32, unit: "W", scale: 10, positive: import, invalid: [2147483647], verified: False}
  - {key: l2_power, label: "Active power phase 2 P2", table: holding, address: 50546, type: s32, unit: "W", scale: 10, positive: import, invalid: [2147483647], verified: False}
  - {key: l3_power, label: "Active power phase 3 P3", table: holding, address: 50548, type: s32, unit: "W", scale: 10, positive: import, invalid: [2147483647], verified: False}
  - {key: x.reactive_power_l1, label: "Reactive power phase 1 Q1", table: holding, address: 50550, type: s32, unit: "var", scale: 10, invalid: [2147483647]}
  - {key: x.reactive_power_l2, label: "Reactive power phase 2 Q2", table: holding, address: 50552, type: s32, unit: "var", scale: 10, invalid: [2147483647]}
  - {key: x.reactive_power_l3, label: "Reactive power phase 3 Q3", table: holding, address: 50554, type: s32, unit: "var", scale: 10, invalid: [2147483647]}
  - {key: x.apparent_power_l1, label: "Apparent power phase 1 S1", table: holding, address: 50556, type: u32, unit: "VA", scale: 10, invalid: [4294967295]}
  - {key: x.apparent_power_l2, label: "Apparent power phase 2 S2", table: holding, address: 50558, type: u32, unit: "VA", scale: 10, invalid: [4294967295]}
  - {key: x.apparent_power_l3, label: "Apparent power phase 3 S3", table: holding, address: 50560, type: u32, unit: "VA", scale: 10, invalid: [4294967295]}
  - {key: x.power_factor_l1, label: "Power factor phase 1 PF1", table: holding, address: 50562, type: s32, scale: 0.001, invalid: [2147483647]}
  - {key: x.power_factor_l2, label: "Power factor phase 2 PF2", table: holding, address: 50564, type: s32, scale: 0.001, invalid: [2147483647]}
  - {key: x.power_factor_l3, label: "Power factor phase 3 PF3", table: holding, address: 50566, type: s32, scale: 0.001, invalid: [2147483647]}
  - {key: x.current_system, label: "System value I Sys, (I1 + I2 + I3) / 3", table: holding, address: 50568, type: u32, unit: "A", scale: 0.001, invalid: [4294967295]}
  - {key: x.voltage_ll_system, label: "System value U Sys, (U12 + U23 + U31) / 3", table: holding, address: 50570, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}
  - {key: x.voltage_ln_system, label: "System value V Sys, (V1 + V2 + V3) / 3", table: holding, address: 50572, type: u32, unit: "V", scale: 0.01, invalid: [4294967295]}

  # Metrology, without the transformer ratios, 16 bits (0xC850)
  - {key: x.u12_raw, label: "Phase to phase voltage U12", table: holding, address: 51281, type: u16, unit: "V", scale: 0.01}
  - {key: x.u23_raw, label: "Phase to phase voltage U23", table: holding, address: 51282, type: u16, unit: "V", scale: 0.01}
  - {key: x.u31_raw, label: "Phase to phase voltage U31", table: holding, address: 51283, type: u16, unit: "V", scale: 0.01}
  - {key: x.v1_raw, label: "Simple voltage V1", table: holding, address: 51284, type: u16, unit: "V", scale: 0.01}
  - {key: x.v2_raw, label: "Simple voltage V2", table: holding, address: 51285, type: u16, unit: "V", scale: 0.01}
  - {key: x.v3_raw, label: "Simple voltage V3", table: holding, address: 51286, type: u16, unit: "V", scale: 0.01}
  - {key: x.frequency_raw, label: "Frequency", table: holding, address: 51287, type: u16, unit: "Hz", scale: 0.001}
  - {key: x.power_factor_raw, label: "Sum power factor PF", table: holding, address: 51295, type: s16, scale: 0.001}
  - {key: x.power_factor_l1_raw, label: "Power factor phase 1 PF1", table: holding, address: 51305, type: s16, scale: 0.001}
  - {key: x.power_factor_l2_raw, label: "Power factor phase 2 PF2", table: holding, address: 51306, type: s16, scale: 0.001}
  - {key: x.power_factor_l3_raw, label: "Power factor phase 3 PF3", table: holding, address: 51307, type: s16, scale: 0.001}
  - {key: x.current_system_raw, label: "System value I Sys", table: holding, address: 51308, type: u16, unit: "A", scale: 0.001}
  - {key: x.voltage_ll_system_raw, label: "System value U Sys", table: holding, address: 51309, type: u16, unit: "V", scale: 0.01}
  - {key: x.voltage_ln_system_raw, label: "System value V Sys", table: holding, address: 51310, type: u16, unit: "V", scale: 0.01}
  - {key: x.import_energy_mwh, label: "Total positive active energy Ea+", table: holding, address: 51311, type: u16, unit: "MWh", poll: slow}
  - {key: x.reactive_positive_mvarh, label: "Total positive reactive energy Er+", table: holding, address: 51312, type: u16, unit: "Mvarh", poll: slow}
  - {key: x.export_energy_mwh, label: "Total negative active energy Ea-", table: holding, address: 51313, type: u16, unit: "MWh", poll: slow}
  - {key: x.reactive_negative_mvarh, label: "Total negative reactive energy Er-", table: holding, address: 51314, type: u16, unit: "Mvarh", poll: slow}
  - {key: x.phase_sequence, label: "Phase sequence", table: holding, address: 51315, type: u16, enum: phase_sequence, poll: slow}

  # Energies (0xC650)
  - {key: grid_import_energy, label: "Total Ea+ (not resettable)", table: holding, address: 50770, type: u32, unit: "kWh", poll: slow, invalid: [4294967295], verified: true, note: "A real E24 read 30027 here and 3002726 at 50946."}
  - {key: x.total_reactive_positive_energy, label: "Total Er+ (not resettable)", table: holding, address: 50772, type: u32, unit: "kvarh", poll: slow, invalid: [4294967295]}
  - {key: x.total_apparent_energy, label: "Total Eap (not resettable)", table: holding, address: 50774, type: u32, unit: "kVAh", poll: slow, invalid: [4294967295]}
  - {key: grid_export_energy, label: "Total Ea- (not resettable)", table: holding, address: 50776, type: u32, unit: "kWh", poll: slow, invalid: [4294967295], verified: true, note: "A real E24 read 125642 here and 12564217 at 50952."}
  - {key: x.total_reactive_negative_energy, label: "Total Er- (not resettable)", table: holding, address: 50778, type: u32, unit: "kvarh", poll: slow, invalid: [4294967295]}
  - {key: x.partial_active_positive_energy, label: "Partial Ea+", table: holding, address: 50780, type: u32, unit: "kWh", poll: slow, invalid: [4294967295]}
  - {key: x.partial_reactive_positive_energy, label: "Partial Er+", table: holding, address: 50782, type: u32, unit: "kvarh", poll: slow, invalid: [4294967295]}
  - {key: x.partial_apparent_energy, label: "Partial Eap", table: holding, address: 50784, type: u32, unit: "kVAh", poll: slow, invalid: [4294967295]}
  - {key: x.partial_active_negative_energy, label: "Partial Ea-", table: holding, address: 50786, type: u32, unit: "kWh", poll: slow, invalid: [4294967295]}
  - {key: x.partial_reactive_negative_energy, label: "Partial Er-", table: holding, address: 50788, type: u32, unit: "kvarh", poll: slow, invalid: [4294967295]}

  # Energies in 10 Wh steps (0xC700)
  - {key: x.total_active_positive_energy_fine, label: "Total Ea+ (not resettable)", table: holding, address: 50946, type: u32, unit: "kWh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.total_reactive_positive_energy_fine, label: "Total Er+ (not resettable)", table: holding, address: 50948, type: u32, unit: "kvarh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.total_apparent_energy_fine, label: "Total Eap (not resettable)", table: holding, address: 50950, type: u32, unit: "kVAh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.total_active_negative_energy_fine, label: "Total Ea- (not resettable)", table: holding, address: 50952, type: u32, unit: "kWh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.total_reactive_negative_energy_fine, label: "Total Er- (not resettable)", table: holding, address: 50954, type: u32, unit: "kvarh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.partial_active_positive_energy_fine, label: "Partial Ea+", table: holding, address: 50956, type: u32, unit: "kWh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.partial_reactive_positive_energy_fine, label: "Partial Er+", table: holding, address: 50958, type: u32, unit: "kvarh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.partial_apparent_energy_fine, label: "Partial Eap", table: holding, address: 50960, type: u32, unit: "kVAh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.partial_active_negative_energy_fine, label: "Partial Ea-", table: holding, address: 50962, type: u32, unit: "kWh", scale: 0.01, poll: slow, invalid: [4294967295]}
  - {key: x.partial_reactive_negative_energy_fine, label: "Partial Er-", table: holding, address: 50964, type: u32, unit: "kvarh", scale: 0.01, poll: slow, invalid: [4294967295]}

  # Tariffs (0xC6A0, and 0xC800 in 10 Wh steps)
  - {key: x.tariff_count, label: "Number of tariffs (1 to 2)", table: holding, address: 50848, type: u16, poll: slow}
  - {key: x.tariff, label: "Tariff in progress (1 to 2)", table: holding, address: 50849, type: u16, poll: slow}
  - {key: x.tariff1_active_energy, label: "Positive active energy tariff 1", table: holding, address: 50850, type: u32, unit: "kWh", poll: slow}
  - {key: x.tariff2_active_energy, label: "Positive active energy tariff 2", table: holding, address: 50852, type: u32, unit: "kWh", poll: slow}
  - {key: x.tariff1_reactive_energy, label: "Positive reactive energy tariff 1", table: holding, address: 50866, type: u32, unit: "kvarh", poll: slow}
  - {key: x.tariff2_reactive_energy, label: "Positive reactive energy tariff 2", table: holding, address: 50868, type: u32, unit: "kvarh", poll: slow}
  - {key: x.tariff1_time, label: "Time counter 1", table: holding, address: 50882, type: u32, unit: "h", scale: 0.01, poll: slow}
  - {key: x.tariff2_time, label: "Time counter 2", table: holding, address: 50884, type: u32, unit: "h", scale: 0.01, poll: slow}
  - {key: x.tariff1_active_energy_fine, label: "Positive active energy tariff 1", table: holding, address: 51202, type: u32, unit: "kWh", scale: 0.01, poll: slow}
  - {key: x.tariff2_active_energy_fine, label: "Positive active energy tariff 2", table: holding, address: 51204, type: u32, unit: "kWh", scale: 0.01, poll: slow}
  - {key: x.tariff1_reactive_energy_fine, label: "Positive reactive energy tariff 1", table: holding, address: 51218, type: u32, unit: "kvarh", scale: 0.01, poll: slow}
  - {key: x.tariff2_reactive_energy_fine, label: "Positive reactive energy tariff 2", table: holding, address: 51220, type: u32, unit: "kvarh", scale: 0.01, poll: slow}
  - {key: x.tariff1_time_fine, label: "Time counter 1", table: holding, address: 51234, type: u32, unit: "h", scale: 0.01, poll: slow}
  - {key: x.tariff2_time_fine, label: "Time counter 2", table: holding, address: 51236, type: u32, unit: "h", scale: 0.01, poll: slow}
  - {key: x.tariff_count_2, label: "Number of tariffs (1 to 2)", table: holding, address: 51200, type: u16, poll: slow}
  - {key: x.tariff_2, label: "Tariff in progress (1 to 2)", table: holding, address: 51201, type: u16, poll: slow}
  - {key: x.set_tariff, label: "Tariff to set", table: holding, address: 40481, type: u16, writable: true, write_only: true, min: 1, max: 2, poll: slow}

  # Line 1: energies (0x4D80) and tariff meter (0x4F00)
  - {key: x.l1_active_positive_energy, label: "Line 1 Ea+", table: holding, address: 19843, type: u32, unit: "kWh", poll: slow}
  - {key: x.l1_active_positive_residual, label: "Line 1 residual Ea+", table: holding, address: 19845, type: u16, unit: "Wh", scale: 0.1, poll: slow}
  - {key: x.l1_active_negative_energy, label: "Line 1 Ea-", table: holding, address: 19846, type: u32, unit: "kWh", poll: slow}
  - {key: x.l1_active_negative_residual, label: "Line 1 residual Ea-", table: holding, address: 19848, type: u16, unit: "Wh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_positive_energy, label: "Line 1 Er+", table: holding, address: 19849, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_positive_residual, label: "Line 1 residual Er+", table: holding, address: 19851, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_negative_energy, label: "Line 1 Er-", table: holding, address: 19852, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_negative_residual, label: "Line 1 residual Er-", table: holding, address: 19854, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_apparent_energy, label: "Line 1 Eap", table: holding, address: 19855, type: u32, unit: "kVAh", poll: slow}
  - {key: x.l1_apparent_residual, label: "Line 1 residual Eap", table: holding, address: 19857, type: u16, unit: "VAh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_positive_lagging_energy, label: "Line 1 Er+ (lagging)", table: holding, address: 19858, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_positive_lagging_residual, label: "Line 1 residual Er+ (lagging)", table: holding, address: 19860, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_negative_lagging_energy, label: "Line 1 Er- (lagging)", table: holding, address: 19861, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_negative_lagging_residual, label: "Line 1 residual Er- (lagging)", table: holding, address: 19863, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_positive_leading_energy, label: "Line 1 Er+ (leading)", table: holding, address: 19864, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_positive_leading_residual, label: "Line 1 residual Er+ (leading)", table: holding, address: 19866, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_reactive_negative_leading_energy, label: "Line 1 Er- (leading)", table: holding, address: 19867, type: u32, unit: "kvarh", poll: slow}
  - {key: x.l1_reactive_negative_leading_residual, label: "Line 1 residual Er- (leading)", table: holding, address: 19869, type: u16, unit: "varh", scale: 0.1, poll: slow}
  - {key: x.l1_tariff, label: "Tariff in progress", table: holding, address: 20224, type: u16, poll: slow}
  - {key: x.l1_t1_active_positive, label: "Line 1 T1 Ea+", table: holding, address: 20225, type: u32, unit: "kWh", poll: slow}
  - {key: x.l1_t2_active_positive, label: "Line 1 T2 Ea+", table: holding, address: 20227, type: u32, unit: "kWh", poll: slow}
  - {key: x.l1_t1_active_negative, label: "Line 1 T1 Ea-", table: holding, address: 20241, type: u32, unit: "kWh", poll: slow}
