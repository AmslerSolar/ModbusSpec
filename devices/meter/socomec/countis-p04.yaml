# Written from Socomec's Modbus communication tables. No reading from a real device yet.

modbusspec: 0
id: socomec-countis-p04
manufacturer: Socomec
name: Countis P04 MID energy meter
kind: meter

sources:
- title: Socomec Countis P04 Modbus communication table
  version: 2025-12
  url: https://www.socomec.fr/sites/default/files/2025-12/COUNTIS-P04-COM-tables_COMMUNICATION-TABLE_2025-12-11-17-08-37_English_PLURI.html
  sha256: c824606838d94afb3cab9daf869aaf964943ef5e3e72229bb295a5481a5719d4
  language: en
  devices: [Countis P04]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - {table: holding, address: 50000, type: str, length: 4, chars: low, equals: SOCO}
  any:
  - {table: holding, address: 50058, type: str, length: 8, prefix: Countis P04}

