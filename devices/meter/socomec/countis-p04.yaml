notes:
- "The table is the P04's own; its baud rate index starts at 1 = 2400, unlike the E2x. Sections named Settings are writable as the table's functions say."
- "The table gives no default unit id or serial settings; unit 1 is assumed."
- "The model is told by the extended name at 50058. The tables only give examples for it; on a real E24 it reads \"Countis E24\", and the same pattern is assumed here."
- "Write-only commands (resets, configuration storage) are left out, as are fields the format can't express or that the table points elsewhere for."
