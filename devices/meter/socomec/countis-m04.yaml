#
# Written from Socomec's Modbus communication tables. No reading from a real device yet.

modbusspec: 0
id: socomec-countis-m04
manufacturer: Socomec
name: Countis M04 MID energy meter
kind: meter

sources:
- title: Socomec Countis M04 Modbus communication table
  version: 2024-11
  url: https://www.socomec.fr/sites/default/files/2024-11/COUNTIS-M04-MODBUS-MID---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2024-11_CMT_EN.html
  sha256: da38de89ad90355d49695197add6569a034978bfbc07f88865580a3ab75bed75
  language: en
  devices: [Countis M04]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:
  # Product
  - {key: x.serial_number, label: "Serial Number", table: holding, address: 64512, type: u32, poll: slow}
  - {key: x.product_id, label: "Product ID", table: holding, address: 64514, type: u16, poll: slow}
  - {key: x.product_software_version, label: "Product software version", table: holding, address: 64515, type: u16, poll: slow}

  # Metrology
  - {key: l1_voltage, label: "Simple voltage : V1", table: input, address: 0, type: f32, unit: "V"}
  - {key: l1_current, label: "Current : I1", table: input, address: 6, type: f32, unit: "A"}
  - {key: l1_power, label: "Active Power phase 1 +/- : P1", table: input, address: 12, type: f32, unit: "W", positive: import, verified: false, note: "As the total."}
  - {key: x.apparent_power_phase, label: "Apparent Power phase", table: input, address: 18, type: f32, unit: "VA", note: "The table: Apparent Power phase 1 : S1"}
  - {key: x.reactive_power_phase_1_plus_q1, label: "Reactive Power phase 1 +/- : Q1", table: input, address: 24, type: f32, unit: "var"}
  - {key: frequency, label: "Frequency : F", table: input, address: 70, type: f32, unit: "Hz"}

  # Energies 1
  - {key: grid_import_energy, label: "Total Positive Active Energy (no resetable) : Ea+", table: input, address: 72, type: f32, unit: "kWh"}
  - {key: grid_export_energy, label: "Total Negative Active Energy (no resetable) : Ea-", table: input, address: 74, type: f32, unit: "kWh"}
  - {key: x.total_positive_reactive_energy_no_resetable_er_plus, label: "Total Positive Reactive Energy (no resetable) : Er +", table: input, address: 76, type: f32, unit: "kvarh"}
  - {key: x.total_negative_reactive_energy_no_resetable_er_minus, label: "Total Negative Reactive Energy (no resetable) : Er -", table: input, address: 78, type: f32, unit: "kvarh"}

  # Energies 2
  - {key: x.total_kwh_ea, label: "Total kWh (ea)", table: input, address: 342, type: f32, unit: "kWh"}
  - {key: x.total_kvarh_er, label: "Total kvarh (er)", table: input, address: 344, type: f32, unit: "kvarh"}

  # Power demand 1
  - {key: x.total_system_power_demand, label: "Total system power demand", table: input, address: 84, type: f32, unit: "W"}
  - {key: x.maximum_total_system_power_demand, label: "Maximum total system power demand", table: input, address: 86, type: f32, unit: "VA"}
  - {key: x.import_system_power_demand, label: "Import system power demand", table: input, address: 88, type: f32, unit: "W"}
  - {key: x.maximum_import_power_system_demand, label: "Maximum import power system demand", table: input, address: 90, type: f32, unit: "W"}
  - {key: x.export_system_power_demand, label: "Export system power demand", table: input, address: 92, type: f32, unit: "W"}
  - {key: x.maximum_export_power_system_demand, label: "Maximum export power system demand", table: input, address: 94, type: f32, unit: "W"}

  # Power demand 2
  - {key: x.phase_1_current_demand, label: "Phase 1 current demand", table: input, address: 260, type: f32, unit: "A"}
  - {key: x.maximum_phase_1_current_demand, label: "Maximum phase 1 current demand", table: input, address: 264, type: f32, unit: "A"}

  # Measurement mode
  - {key: x.measurement_mode, label: "Measurement mode", table: holding, address: 63776, type: f32, enum: measurement_mode, writable: true}

  # General slave connection
  - {key: x.slave_address, label: "Slave Address", table: holding, address: 20, type: f32, writable: true, poll: slow}

  # Parity and stop bit
  - {key: x.parity_and_stop_bit, label: "Parity and stop bit", table: holding, address: 18, type: f32, enum: parity_and_stop_bit, writable: true, poll: slow}

  # Baudrate
  - {key: x.baudrate, label: "Baudrate", table: holding, address: 28, type: f32, enum: baudrate, writable: true, poll: slow}

  # Pulse1 width
  - {key: x.pulse_width, label: "Pulse Width", table: holding, address: 12, type: f32, enum: pulse_width, writable: true, poll: slow}

  # Pulse1 weight
  - {key: x.pulse_1_weight, label: "Pulse 1 weight", table: holding, address: 63760, type: f32, enum: pulse_1_weight, writable: true, poll: slow}

  # Pulse1 Energy Type
  - {key: x.pulse1_energy_type, label: "Pulse1 Energy Type", table: holding, address: 86, type: f32, enum: pulse1_energy_type, writable: true, poll: slow}

  # Demand period
  - {key: x.demand_period, label: "Demand Period", table: holding, address: 2, type: f32, enum: demand_period, writable: true, poll: slow}

enums:
  measurement_mode: {'1': "Mode 1 (total = import)", '2': "Mode 2 (total = import + export) (default)", '3': "Mode 3 (total = import - export)"}
  parity_and_stop_bit: {'0': "One stop bit and no parity", '1': "One stop bit and even parity", '2': "One stop bit and odd parity", '3': "Tw stop bits and no parity"}
  baudrate: {'0': "2400 baud", '1': "4800 baud", '2': "9600 baud", '3': "19200 baud", '4': "38400 baud"}
  pulse_width: {'60': "60 ms", '100': "100 ms", '200': "200 ms"}
  pulse_1_weight: {'0': "0.0025 kWh(kVArh)/imp", '1': "0.01 kWh(kVArh)/imp", '2': "0.1 kWh(kVArh)/imp", '3': "1 kWh(kVArh)/imp"}
  pulse1_energy_type: {'1': "Import active energy", '2': "Total active energy", '4': "Export active energy, default", '5': "Import reactive energy", '6': "Total reactive energy", '8': "Export reactive energy"}
  demand_period: {'5': "5 min", '8': "8 min", '10': "10 min", '15': "15 min", '20': "20 min", '30': "30 min", '60': "60 min"}

notes:
- "Measurements are input registers (function 04), settings holding registers (function 03): the same address means different things in the two tables. All values are 32-bit floats."
- "The table gives no way to tell the model from its registers except a Product ID (64514) without values, so this file has no identification. The serial number at 64512 is taken to be in the holding table, as the table's Product block doesn't say."
- "The table gives no default unit id or serial settings; unit 1 is assumed."
- "Write-only commands (resets, configuration storage) are left out, as are fields the format can't express or that the table points elsewhere for."
