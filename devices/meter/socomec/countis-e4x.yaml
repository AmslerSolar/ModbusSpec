# Written from the Socomec Countis E43 JBUS / Modbus table (JBUS common table 1.01, index A), a spreadsheet for the
# Countis E43 (three-phase, 5 A current transformers), and corrected from Socomec's E43 Modbus tables of 2019 and 2025.
# Rows the tables mark as not applicable to the E43 are left out. Countis E23 / E24 / E27 / E28: socomec-countis-e2x. E33 / E34 have a smaller table of their own: no file yet.

modbusspec: 0
id: socomec-countis-e4x
manufacturer: Socomec
name: Countis E43 / E44 energy meters
kind: meter

