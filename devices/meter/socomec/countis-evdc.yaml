# Written from Socomec's Modbus register set for the Countis EVDC 300 / 600. No reading from a real device yet.

modbusspec: 0
id: socomec-countis-evdc
manufacturer: Socomec
name: Countis EVDC 300 / 600 DC energy meters
kind: meter

sources:
- title: Socomec Countis EVDC 300/600 Modbus register set (Modbus RTU RD485)
  version: 553544A (2025-10)
  url: https://www.socomec.fr/sites/default/files/2025-10/Modbus-RTU-RD485_COMMUNICATION-TABLE_2025-10-08-10-22-17_English_PLURI.pdf
  sha256: 9364356d3ae3cc5e6d8b82dd8195f9740df148b55973701cc8e4475498ff0402
  language: en
  devices: [Countis EVDC 300, Countis EVDC 600]

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

points:

  # Input registers: measurements as floats
  - {key: x.voltage, label: Voltage, table: input, address: 0, type: f32, unit: V}
  - {key: x.current, label: Current, table: input, address: 6, type: f32, unit: A}
  - {key: x.power, label: Power, table: input, address: 12, type: f32, unit: W, note: The document states no direction.}
  - {key: x.import_energy, label: Import energy, table: input, address: 72, type: f32, unit: kWh, poll: slow}
  - {key: x.export_energy, label: Export energy, table: input, address: 74, type: f32, unit: kWh, poll: slow}
  - {key: x.total_power_demand, label: Total power demand, table: input, address: 84, type: f32, unit: W, note: Import minus export.}
  - {key: x.max_total_power_demand, label: Maximum total power demand, table: input, address: 86, type: f32, unit: W, poll: slow}
  - {key: x.total_energy, label: Total energy, table: input, address: 342, type: f32, unit: kWh, poll: slow}
  - {key: x.resettable_total_energy, label: Current resettable total energy, table: input, address: 384, type: f32, unit: kWh, poll: slow}

  # Input registers: energies as integers, with a residual (the decimal part of the kWh value)
  - {key: x.import_energy_int, label: Import energy, table: input, address: 11000, type: s32, unit: kWh, poll: slow}
  - {key: x.import_energy_residual, label: Residual import energy, table: input, address: 11002, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.export_energy_int, label: Export energy, table: input, address: 11004, type: s32, unit: kWh, poll: slow}
  - {key: x.export_energy_residual, label: Residual export energy, table: input, address: 11006, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.total_energy_int, label: Total energy, table: input, address: 11008, type: s32, unit: kWh, poll: slow}
  - {key: x.total_energy_residual, label: Residual total energy, table: input, address: 11010, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.import_energy_int_2, label: Import energy (second listing), table: input, address: 11012, type: s32, unit: kWh, poll: slow, note: "The document lists import, export and total twice and does not say how the two differ."}
  - {key: x.import_energy_residual_2, label: Residual import energy (second listing), table: input, address: 11014, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.export_energy_int_2, label: Export energy (second listing), table: input, address: 11016, type: s32, unit: kWh, poll: slow}
  - {key: x.export_energy_residual_2, label: Residual export energy (second listing), table: input, address: 11018, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.total_energy_int_2, label: Total energy (second listing), table: input, address: 11020, type: s32, unit: kWh, poll: slow}
  - {key: x.total_energy_residual_2, label: Residual total energy (second listing), table: input, address: 11022, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.line_loss_energy_int, label: Total line loss energy, table: input, address: 11032, type: s32, unit: kWh, poll: slow}
  - {key: x.line_loss_energy_residual, label: Residual total line loss energy, table: input, address: 11034, type: s32, unit: Wh, scale: 0.01, poll: slow}
  - {key: x.charging_gun_energy_int, label: Total charging gun energy, table: input, address: 11044, type: s32, unit: kWh, poll: slow}
  - {key: x.charging_gun_energy_residual, label: Residual total charging gun energy, table: input, address: 11046, type: s32, unit: Wh, scale: 0.01, poll: slow}

  # Input registers: the block commonly read at one time
  - {key: x.block_voltage, label: Voltage, table: input, address: 16384, type: f32, unit: V}
  - {key: x.block_current, label: Current, table: input, address: 16386, type: f32, unit: A}
  - {key: x.block_power, label: Power, table: input, address: 16388, type: f32, unit: W}
  - {key: x.block_total_power_demand, label: Total power demand, table: input, address: 16390, type: f32, unit: W}
  - {key: x.block_max_total_power_demand, label: Maximum total power demand, table: input, address: 16392, type: f32, unit: W, poll: slow}
  - {key: x.block_import_energy, label: Import energy, table: input, address: 16394, type: f32, unit: kWh, poll: slow}
  - {key: x.block_export_energy, label: Export energy, table: input, address: 16396, type: f32, unit: kWh, poll: slow, note: 'The document spells it "Emport".'}
  - {key: x.block_total_energy, label: Total energy, table: input, address: 16398, type: f32, unit: kWh, poll: slow}
  - {key: x.block_resettable_total_energy, label: Current resettable total energy, table: input, address: 16400, type: f32, unit: kWh, poll: slow}
  - {key: x.current_overload_alarm, label: Current overload alarm, table: input, address: 16402, type: u16, enum: overload_alarm}
  - {key: x.line_loss_power, label: Line loss power, table: input, address: 20008, type: f32, unit: W}
  - {key: x.block_line_loss_energy, label: Total line loss energy, table: input, address: 20010, type: f32, unit: kWh, poll: slow}
  - {key: x.charging_gun_power, label: Charging gun power, table: input, address: 20012, type: f32, unit: W}
  - {key: x.block_charging_gun_energy, label: Total charging gun energy, table: input, address: 20018, type: f32, unit: kWh, poll: slow}

  # Holding registers: settings
  - {key: x.demand_period, label: Demand period, table: holding, address: 2, type: f32, unit: min, writable: true, min: 0, max: 60, poll: slow}
  - {key: x.slide_time, label: Slide time, table: holding, address: 4, type: f32, unit: min, writable: true, poll: slow}
  - {key: x.pulse_width, label: Pulse width, table: holding, address: 12, type: f32, unit: ms, writable: true, poll: slow, note: '60, 100 or 200.'}
  - {key: x.parity_stop, label: Network parity and stop bits, table: holding, address: 18, type: f32, enum: parity_stop, writable: true, poll: slow}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 20, type: f32, writable: true, min: 1, max: 247, poll: slow}
  - {key: x.baud_rate, label: Baud rate, table: holding, address: 28, type: f32, enum: baud_rate, writable: true, poll: slow, note: An index into the table.}
  - {key: x.auto_scroll_time, label: Auto-scroll display time, table: holding, address: 58, type: f32, unit: s, writable: true, min: 0, max: 60, poll: slow}
  - {key: x.backlit_time, label: Backlit time, table: holding, address: 60, type: f32, unit: min, writable: true, min: 0, max: 60, poll: slow, note: 0 = always on.}
  - {key: x.pulse_output_type, label: Pulse output type, table: holding, address: 86, type: f32, enum: pulse_output_type, writable: true, poll: slow}
  - {key: x.line_loss_mode, label: Charging pile line loss mode, table: holding, address: 1536, type: u16, enum: line_loss_mode, writable: true, poll: slow}
  - {key: x.line_resistance, label: Charging pile line resistance, table: holding, address: 1537, type: u16, unit: mΩ, scale: 0.01, writable: true, poll: slow, note: '0x0A = 0.1 milliohm, 0x10 = 0.16 milliohms.'}
  - {key: x.shunt_connection, label: Connection method of shunt, table: holding, address: 8192, type: u16, enum: shunt_connection, writable: true, poll: slow}
  - {key: x.energy_measurement_mode, label: Energy measurement mode, table: holding, address: 63776, type: u16, enum: energy_mode, writable: true, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 64512, type: u32, poll: slow}
  - {key: x.meter_code, label: Meter code, table: holding, address: 64514, type: u16, poll: slow}
  - {key: x.display_version, label: Display version, table: holding, address: 64644, type: bcd16, poll: slow, note: 'XX.YY: the first byte is XX, the second YY.'}
  - {key: x.program_number, label: Program number, table: holding, address: 64646, type: bcd16, poll: slow}
  - {key: x.crc_code, label: Program CRC, table: holding, address: 64648, type: u32, poll: slow}

enums:
  overload_alarm: {'0': No alarm, '1': Current overload alarm}
  parity_stop: {'0': 1 stop bit and no parity, '1': 1 stop bit and even parity, '2': 1 stop bit and odd parity, '3': 2 stop bits and no parity}
  baud_rate: {'0': '2400', '1': '4800', '2': '9600', '3': '19200', '5': '1200'}
  pulse_output_type: {'1': Import energy, '2': Total energy, '4': Export energy}
  line_loss_mode: {'0': Line loss mode off, '1': 2-wire mode}
  shunt_connection: {'78': Negative type, '80': Positive type}
  energy_mode: {'1': Total = import, '2': Total = import + export, '3': Total = export}

notes:
- "The document numbers registers as 3xxxx / 3xxxxx (input) and 4xxxx / 4xxxxx (holding). Its hex column gives the holding addresses: register minus 40001 for 40003 to 48193, and 0x0600 / 0x0601 for 401536 / 401537, 0xF010 ff. for the 46xxxx ones. It has no hex column for the input registers: register minus 30001 or 300001 is assumed (16384 = 0x4000 fits), unverified."
- The document gives no identification rule and no meter code value, so this file has no identification.
- Defaults in the document are unit 1, 9600 baud, 1 stop bit and no parity.
- "Left out: the password (40025) and the reset command (461457)."
- "The shunt connection values are printed as 00 4E (negative, default) and 00 50 (positive)."
