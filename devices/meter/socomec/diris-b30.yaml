notes:
- "A DIRIS B-30 monitors up to four loads, and the table repeats its blocks for each; the standard value keys (voltages, currents, frequency) are Load #1, as in OpenEMS, and a load's own status says whether it is enabled."
- "The table has 5,565 rows in use. This file holds identification, operating hours, feeders, line settings, the instantaneous values per load and for the network, energies, total tariff meters and the two metrology tables. Left out, and only in the table: harmonics, fundamental values, averages, min / max, statistics, partial and historical energy, the Common blocks at 14336 ff., quality events, load curves, trends, fieldbus, analog and logical I/O, temperature, protection device and load shedding."
- "The table states no direction for the active power, so no direction is given."
- "The table has no Modbus settings block and gives no default unit id or serial settings; unit 1 is assumed."
- "The model is told by the extended name at 50058, with the spellings OpenEMS checks (B30) and the name of the product (B-30). The table only gives examples for it."
- "Write-only commands are left out, as are date fields the format can't express."
