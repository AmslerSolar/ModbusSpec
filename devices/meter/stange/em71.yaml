enums:
  phase_order: {'0': Unknown, '1': 1-2-3 (correct), '-1': 1-3-2 (reversed)}

flags:
  error_bits: {'0': RAM error, '1': Configuration error, '2': Calibration error, '3': Remote communication module error (WiFi / Zigbee), '4': Clock (RTC) error, '7': Archive error, '8': Flash memory error, '9': Display error}
  sample_range: {'0': Voltage channel 1 out of range, '1': Voltage channel 2 out of range, '2': Voltage channel 3 out of range, '3': Voltage channel 4 out of range, '4': Current channel 1 out of range, '5': Current channel 2 out of range, '6': Current channel 3 out of range, '7': Current channel 4 out of range}
  firmware_modules: {'0': RCS module, '1': GO module, '2': MM module, '3': ES module, '5': PQ-A or PQ-S module, '9': UP module}

problems:
  - {when: {key: error_code, bit: 0}, kind: fault, text: Meter RAM error (bit 0)}
  - {when: {key: error_code, bit: 1}, kind: fault, text: Meter configuration error (bit 1)}
  - {when: {key: error_code, bit: 2}, kind: fault, text: Meter calibration error (bit 2)}
  - {when: {key: error_code, bit: 3}, kind: warning, text: Meter communication module error (bit 3)}
  - {when: {key: error_code, bit: 4}, kind: warning, text: Meter clock error (bit 4)}
  - {when: {key: error_code, bit: 7}, kind: warning, text: Meter archive error (bit 7)}
  - {when: {key: error_code, bit: 8}, kind: fault, text: Meter flash memory error (bit 8)}
  - {when: {key: error_code, bit: 9}, kind: warning, text: Meter display error (bit 9)}
  - {when: {key: x.phase_order, equals: -1}, kind: warning, text: Phase sequence reversed (1-3-2)}
  - {when: {key: x.sample_range_flags, not: 0}, kind: warning, text: 'Measuring input out of range (flags 0x{value:X}); readings less precise'}

notes:
- The register map is the KMB-style instrument map (the document calls its time format 'KMB time'); possibly an OEM product.
- Addresses are the document's decimal addresses, used directly as 0-based protocol addresses (its modpoll examples read them
  as PDU addresses). Where the decimal and hex columns disagree (several typos, e.g. 0x1004 for 4356, 1916 for S3, 4900 for
  P2+), the value that fits the block is taken.
- Measurements, identification and read-only settings are input registers (function 04); the configurable settings (0x0700)
  are holding registers written with function 16. Some blocks (0x1350 import / export power, 0x4A00) give averages with function
  03 and actual values with function 04.
- 32- and 64-bit values are most significant word and byte first; floats IEEE 754, the 0x2000 energy counters doubles. 32-bit
  times are seconds, 64-bit times milliseconds since 2000-01-01.
- Modbus TCP on port 502 (configurable), at least three masters at a time, answer within 200 ms. Since firmware 3.0, Modbus
  RTU frames sent to the same port are answered as RTU. Unit id 0 addresses the device itself in multi-feeder setups; feeder
  X of a multi-channel device answers on unit (X − 1) × 20 + base address.
- When authentication is enabled (off by default), a user name and PIN must first be written to registers 0 … 8.
- 'Left out: harmonics and interharmonics (0x1400 …), per-phase four-quadrant energies and tariff counters (0x2010 …, 0x2400
  …, 0x2800 …), min / max / timestamp blocks (0x4200 …), residual current monitoring (0x4D00), PQ indices (0x5000 …), ripple
  control (0x5300), DC values (0x6200), inputs / outputs and hour counters (0x9000 …), PFC (0xA000 …), clock, archive and
  firmware update registers.'
