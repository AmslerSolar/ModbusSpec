  - {key: l3_voltage, label: ULN3, table: input, address: 4356, type: f32, unit: V}
  - {key: x.voltage_n, label: UN, table: input, address: 4358, type: f32, unit: V}
  - {key: x.voltage_l1_l2, label: ULL1, table: input, address: 4360, type: f32, unit: V}
