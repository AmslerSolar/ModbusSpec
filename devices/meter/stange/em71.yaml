  - {key: l3_current, label: I3, table: input, address: 4612, type: f32, unit: A}
  - {key: x.current_n, label: IN oder I4, table: input, address: 4614, type: f32, unit: A}
  - {key: x.thd_i1, label: THD I1, table: input, address: 4620, type: f32, unit: '%', verified: false, note: Unit as for THD U1.}
