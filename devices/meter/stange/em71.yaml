  - {key: frequency, label: Ist Frequenz (f), table: input, address: 4100, type: f32, unit: Hz}
  - {key: x.sample_range_flags, label: Abtast-Überlauf-/Unterlauf-Flags, table: input, address: 4104, type: u16, flags: sample_range}

