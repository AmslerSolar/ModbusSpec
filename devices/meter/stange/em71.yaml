modbusspec: 0
id: stange-em71
manufacturer: Stange Elektronik
name: EM-71 energy meter
kind: meter

sources:
- title: Technische Dokumentation EM-71 Energiemessgerät Modbus TCP Protokoll
  version: '2024-02-28'
  url: https://stange-elektronik.com/files/Stange-Elektronik/PDF/Deutsch/TD%20EM-71%20DE%20ModBus-Anleitung.pdf
  sha256: 4b51966b316b4c3e7e7c2f4bdf2a895ee2c4d5382588db081919b8abeaf37745

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 528
    type: u32
  checks:
  - table: input
    address: 520
    type: u16
    equals: 8193
  - table: input
    address: 521
    type: u16
    range:
    - 33024
    - 33279

points:
  # Device identification (0x0200)
  - {key: serial, label: GERÄTE_NUMMER, table: input, address: 528, type: u32, poll: slow}
  - {key: x.props_type, label: PROPS_TYP, table: input, address: 520, type: u16, poll: slow, note: 0x2001 = IO module family (as the document lists it for the EM-71).}
  - {key: x.device_type, label: GERÄTE_TYP, table: input, address: 521, type: u16, poll: slow, note: 0x81xx = EM-71.}
  - {key: firmware, label: Firmware-Version (generation a), table: input, address: 530, type: u16, poll: slow, note: 'Version a.b.c.d takes one register per part (530 … 533), per the document''s example; only the first part is here.'}
  - {key: x.firmware_major, label: Firmware-Version (b), table: input, address: 531, type: u16, poll: slow}
  - {key: x.firmware_release, label: Firmware-Version (c), table: input, address: 532, type: u16, poll: slow}
  - {key: x.firmware_revision, label: Firmware-Version (d), table: input, address: 533, type: u16, poll: slow}
  - {key: x.firmware_modules, label: Aktive Firmware-Module, table: input, address: 542, type: u32, flags: firmware_modules, poll: slow}

