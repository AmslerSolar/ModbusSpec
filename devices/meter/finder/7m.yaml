# Written from the Finder Modbus communication protocol 7M24 - 7M38 (v2, 30.06.2021).

modbusspec: 0
id: finder-7m
manufacturer: Finder
name: 7M.24 / 7M.38 energy meters
kind: meter

sources:
- title: Modbus communication protocol 7M24 - 7M38
  version: v2 30.06.2021
  url: https://cdn.findernet.com/app/uploads/2021/09/20090052/Modbus-7M24-7M38_v2_30062021.pdf
  sha256: 7c7c1fb3c8e2f709ebb755b58069a4a21067f6a1d1c6ef2b6ab3b9f916ecef80
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/finder7m24.go, meters/rs485/finder7m38.go
- id: modbus-local-gateway
  title: modbus_local_gateway (Home Assistant integration)
  url: https://github.com/timlaing/modbus_local_gateway
  license: MIT
  commit: e770d6c91220d98b8f0be22b103fdb607c3c67f4
  path: custom_components/modbus_local_gateway/device_configs/7M_24.yaml, custom_components/modbus_local_gateway/device_configs/7M_38.yaml

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: input
    address: 9
    type: str
    length: 4
  checks:
  - table: input
    address: 39000
    type: u16
    equals: 5
  - table: input
    address: 1
    type: str
    length: 8
    printable: true

model_choice: user

models:
  - {id: 7m24, name: 7M.24 (single phase)}
  - {id: 7m38, name: 7M.38 (three phase)}
  - {id: mbmd_7m24, name: 7M.24}
  - {id: mbmd_7m38, name: 7M.38}
  - {id: modbus_local_gateway_7m24, name: 7M.24}
  - {id: modbus_local_gateway_7m38, name: 7M.38}

points:
  # Identity (input registers)
  - {key: x.model_number, label: Model number, table: input, address: 1, type: str, length: 8, poll: slow}
  - {key: serial, label: Serial number, table: input, address: 9, type: str, length: 4, poll: slow}
  - {key: firmware, label: Software reference, table: input, address: 13, type: u16, poll: slow}
  - {key: x.hardware_version, label: Hardware reference, table: input, address: 14, type: str, length: 1, poll: slow}
  - {key: x.status, label: Status register, table: input, address: 44, type: u16, flags: status}
  - {key: x.mid_lock, label: MID lock status, table: input, address: 76, type: u16, enum: mid_lock, poll: slow}
  - {key: x.max_registers, label: Modbus max. registers read at once, table: input, address: 99, type: u16, poll: slow}
  - {key: x.device_group, label: Device group, table: input, address: 39000, type: u16, poll: slow, note: 5 = 7M.}

  # State
  - {key: x.phase_invalid, label: Phase valid measurement, table: input, address: 101, type: u16, flags: phase_invalid}
  - {key: x.alarm_flags_g1_g2, label: Alarm status flags G1 G2, table: input, address: 191, type: u16, note: 'Bits 0–4 group 1 limits 1–4, bits 8–12 group 2 limits 1–4 (the user''s own limit alarms).'}
  - {key: x.checksum_status, label: Checksum status, table: input, address: 400, type: u16, flags: checksum_status}
  - {key: x.active_tariff, label: Current active tariff, table: input, address: 405, type: u16}

  # Measurements (IEEE 754 floats)
  - {key: x.run_time, label: Run time, table: input, address: 2480, type: f32, unit: s, poll: slow}
  - {key: x.voltage_avg, label: Uavg (phase to neutral), table: input, address: 2484, type: f32, unit: V}
  - {key: x.voltage_ll_avg, label: Uavg (phase to phase), table: input, address: 2486, type: f32, unit: V, models: [7m38]}
