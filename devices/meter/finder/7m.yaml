  - {key: frequency, label: Frequency, table: input, address: 2498, type: f32, unit: Hz}
  - {key: l1_voltage, label: U1, table: input, address: 2500, type: f32, unit: V}
  - {key: l2_voltage, label: U2, table: input, address: 2502, type: f32, unit: V, models: [7m38]}
