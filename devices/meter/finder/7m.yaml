  - {key: x.l3_l1_voltage, label: U31, table: input, address: 2512, type: f32, unit: V, models: [7m38]}
  - {key: l1_current, label: I1, table: input, address: 2516, type: f32, unit: A}
  - {key: l2_current, label: I2, table: input, address: 2518, type: f32, unit: A, models: [7m38]}
  - {key: l3_current, label: I3, table: input, address: 2520, type: f32, unit: A, models: [7m38]}
  - {key: x.current_avg, label: Iavg, table: input, address: 2528, type: f32, unit: A, models: [7m38]}
  - {key: l1_power, label: Active Power Phase L1 (P1), table: input, address: 2530, type: f32, unit: W, positive: import, verified: false, note: Sign convention not stated; assumed positive = import.}
  - {key: l2_power, label: Active Power Phase L2 (P2), table: input, address: 2532, type: f32, unit: W, models: [7m38], positive: import, verified: false, note: Sign convention not stated; assumed positive = import.}
  - {key: l3_power, label: Active Power Phase L3 (P3), table: input, address: 2534, type: f32, unit: W, models: [7m38], positive: import, verified: false, note: Sign convention not stated; assumed positive = import.}
