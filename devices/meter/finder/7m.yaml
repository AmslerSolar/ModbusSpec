enums:
  mid_lock: {'0': Unlocked, '1': Locked}
  connection_mode: {'0': No mode, '1': 1b - single phase, '2': 3b - 3 phase 3 wire balanced, '3': 4b - 3 phase 4 wire balanced, '4': 3u - 3 phase 3 wire unbalanced, '5': 4u - 3 phase 4 wire unbalanced}
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400', '6': '57600', '7': '115200'}
  stop_bits: {'0': '1', '1': '2'}
  parity: {'0': None, '1': Odd, '2': Even}
  counter_parameter: {'0': No parameter, '1': Active power, '2': Reactive power, '3': Apparent power, '5': Active power phase 1, '6': Reactive power phase 1, '7': Apparent power phase 1}

flags:
  status: {'0': Locked, '4': Clock not set}
  phase_invalid: {'0': Invalid measurement phase 1, '1': Invalid measurement phase 2, '2': Invalid measurement phase 3}
  checksum_status: {'0': Parameter CRC error, '1': Firmware CRC error, '2': MID lock error, '3': Phase module 1 checksum error, '4': Phase module 2 checksum error, '5': Phase module 3 checksum error, '6': Measurement module checksum error, '7': Software checksum error, '8': Calibration data checksum error, '9': MID setting data checksum error, '10': Setting data checksum error, '11': Phase module 1 calibration data checksum error, '12': Phase module 2 calibration data checksum error, '13': Phase module 3 calibration data checksum error}
  counter_configuration: {'0': Quadrant I enabled, '1': Quadrant II enabled, '2': Quadrant III enabled, '3': Quadrant IV enabled, '4': Absolute value, '5': Invert value}

problems:
  - {when: {key: x.checksum_status, not: 0}, kind: fault, text: 'Meter checksum error (status 0x{value:X})'}
  - {when: {key: x.phase_invalid, bit: 0}, kind: warning, text: Invalid measurement on phase 1 (bit 0)}
  - {when: {key: x.phase_invalid, bit: 1}, kind: warning, text: Invalid measurement on phase 2 (bit 1)}
  - {when: {key: x.phase_invalid, bit: 2}, kind: warning, text: Invalid measurement on phase 3 (bit 2)}
  - {when: {key: x.status, bit: 4}, kind: warning, text: Clock not set (bit 4)}

notes:
- The document gives registers as 30000 + address (input, function 04) and 40000 + address (holding, function 03); its example
  reads 30107 at address 107. Addresses here have the 30000 / 40000 taken off.
- 'Only the IEEE 754 float copies of the measurements are listed (32480 ff.). The integer copies at 30105 ff. use the meter''s
  own formats (a decimal exponent in the top byte with a 24-bit value; a power factor with separate import/export and inductive/capacitive
  sign bytes) that this format can''t express; so do the energy counters at 30406 ff. (mantissa × 10^exponent register). Average,
  maximum and minimum interval values (35500 ff.), the configurable energy counters 1–8 (7M.38: 1–16), nominal values, alarm
  limits, logic functions, outputs and LCD settings are left out.'
- Energy counters n1 … n4 are configurable (quantity, quadrants, absolute value, inversion, tariffs); the document gives n1
  and n3 in Wh and n2 and n4 in varh but not the factory assignment.
- 'The models can''t be told apart from the registers the document describes (the model number text values aren''t given):
  pick the model. The 7M.38 has three phases, connection mode, three I/Os and Ethernet / WiFi; the 7M.24 is single phase.'
- 'Interfaces by order code: RS485, M-bus, Ethernet or WiFi (input register 24 gives the communication type). Default address,
  baud rate and TCP port are not stated; 1, 9600 8N1 and 502 are assumed.'
- The measurement registers refresh once per second, the energy counters every 40 ms. The meter reports how many registers
  it reads at once in input register 99.
