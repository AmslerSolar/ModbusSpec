# Written from the Wenzhou Taiye TAC4300CT series Modbus Protocol (v1.0).

modbusspec: 0
id: taiye-tac4300ct
manufacturer: Wenzhou Taiye Electric
name: TAC4300CT series three-phase CT energy meters
kind: meter

sources:
- title: TAC4300CT series Modbus Protocol
  version: '1.0'
  url: https://github.com/nmakel/sdm_modbus/blob/fead352846b36ff8ca9f89c1491ee047ab2b55d1/documents/taiyedq4300_modbus_protocol_v1.0.pdf
  sha256: cc716033686805be4c8fb51cfd81af4689794994f8b9feeb4538205b89f40b6b

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 22018
    type: u32
  checks:
  # frequency (float)
  - table: input
    address: 48
    type: f32
    range:
    - 40
    - 70
  # frequency (0.01 Hz)
  - table: holding
    address: 42
    type: u16
    range:
    - 4000
    - 7000

points:
  # Measurements, IEEE 754 floats (input registers, function 04)
  - {key: l1_voltage, label: Phase 1 line to neutral volts, table: input, address: 0, type: f32, unit: V}
  - {key: l2_voltage, label: Phase 2 line to neutral volts, table: input, address: 2, type: f32, unit: V}
  - {key: l3_voltage, label: Phase 3 line to neutral volts, table: input, address: 4, type: f32, unit: V}
  - {key: l1_current, label: Phase 1 current, table: input, address: 6, type: f32, unit: A}
  - {key: l2_current, label: Phase 2 current, table: input, address: 8, type: f32, unit: A}
  - {key: l3_current, label: Phase 3 current, table: input, address: 10, type: f32, unit: A}
  - {key: l1_power, label: Phase 1 active power, table: input, address: 12, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total (see grid_power).}
  - {key: l2_power, label: Phase 2 active power, table: input, address: 14, type: f32, unit: W, positive: import, verified: false}
  - {key: l3_power, label: Phase 3 active power, table: input, address: 16, type: f32, unit: W, positive: import, verified: false}
  - {key: x.l1_reactive_power, label: Phase 1 reactive power, table: input, address: 18, type: f32, unit: var}
  - {key: x.l2_reactive_power, label: Phase 2 reactive power, table: input, address: 20, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: Phase 3 reactive power, table: input, address: 22, type: f32, unit: var}
  - {key: x.l1_apparent_power, label: Phase 1 apparent power, table: input, address: 24, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Phase 2 apparent power, table: input, address: 26, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Phase 3 apparent power, table: input, address: 28, type: f32, unit: VA}
  - {key: x.l1_power_factor, label: Phase 1 power factor, table: input, address: 30, type: f32, unit: ''}
  - {key: x.l2_power_factor, label: Phase 2 power factor, table: input, address: 32, type: f32, unit: ''}
  - {key: x.l3_power_factor, label: Phase 3 power factor, table: input, address: 34, type: f32, unit: ''}
  - {key: x.l1_l2_voltage, label: Line 1 to Line 2 volts, table: input, address: 42, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Line 2 to Line 3 volts, table: input, address: 44, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Line 3 to Line 1 volts, table: input, address: 46, type: f32, unit: V}
  - {key: frequency, label: Frequency of supply voltages, table: input, address: 48, type: f32, unit: Hz}
  - {key: grid_power, label: Total system active power, table: input, address: 50, type: f32, unit: W, positive: import, verified: false, note: 'The document gives no sign for the power. It says the power factor''s sign shows the current direction (positive = forward) and the power demand is import − export; derived: positive = import.'}
  - {key: reactive_power, label: Total system reactive power, table: input, address: 52, type: f32, unit: var}
  - {key: apparent_power, label: Total system apparent power, table: input, address: 54, type: f32, unit: VA}
  - {key: power_factor, label: Total system power factor, table: input, address: 56, type: f32, unit: '', note: Sign = current direction (positive = forward).}
  - {key: x.neutral_current, label: Neutral current, table: input, address: 68, type: f32, unit: A}
  - {key: x.l1_voltage_thd, label: Phase 1 voltage THD, table: input, address: 124, type: f32, unit: '%', note: 'In 3P3W the three THD values are those of the line voltages L1-L2, L2-L3, L3-L1.'}
  - {key: x.l2_voltage_thd, label: Phase 2 voltage THD, table: input, address: 126, type: f32, unit: '%'}
  - {key: x.l3_voltage_thd, label: Phase 3 voltage THD, table: input, address: 128, type: f32, unit: '%'}
  - {key: x.l1_current_thd, label: Phase 1 current THD, table: input, address: 130, type: f32, unit: '%'}
  - {key: x.l2_current_thd, label: Phase 2 current THD, table: input, address: 132, type: f32, unit: '%'}
  - {key: x.l3_current_thd, label: Phase 3 current THD, table: input, address: 134, type: f32, unit: '%'}
  - {key: x.power_demand, label: Total system active power demand, table: input, address: 140, type: f32, unit: W, note: Import − export over the demand period.}
  - {key: x.max_power_demand, label: Maximum total system active power demand, table: input, address: 162, type: f32, unit: W, poll: slow}

  # Energy, 64-bit integers in Wh (holding registers, function 03)
  - {key: grid_import_energy, label: Total import active energy, table: holding, address: 7424, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: grid_export_energy, label: Total export active energy, table: holding, address: 7428, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.total_active_energy, label: Total active energy (import + export), table: holding, address: 7432, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.import_reactive_energy, label: Total import reactive energy, table: holding, address: 7440, type: s64, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.export_reactive_energy, label: Total export reactive energy, table: holding, address: 7444, type: s64, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_import_energy, label: L1 import active energy, table: holding, address: 7460, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_import_energy, label: L2 import active energy, table: holding, address: 7464, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_import_energy, label: L3 import active energy, table: holding, address: 7468, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_export_energy, label: L1 export active energy, table: holding, address: 7472, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_export_energy, label: L2 export active energy, table: holding, address: 7476, type: s64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_export_energy, label: L3 export active energy, table: holding, address: 7480, type: s64, unit: kWh, scale: 0.001, poll: slow}

  # Settings and identity (holding registers)
  - {key: x.system_type, label: System type, table: holding, address: 20481, type: u16, enum: system_type, writable: true, poll: slow, note: Writing needs the key-parameter authorisation (password written to 0x5000).}
  - {key: x.demand_period, label: Demand period, table: holding, address: 20482, type: u16, unit: min, writable: true, min: 0, max: 60, poll: slow, note: Default 60; 0 = updated every second.}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 20485, type: u16, writable: true, min: 1, max: 247, poll: slow, note: Default 1.}
  - {key: x.baud_rate, label: Network baud rate, table: holding, address: 20486, type: u16, enum: baud_rate, writable: true, poll: slow}
  - {key: x.parity_stop, label: Parity and stop bit, table: holding, address: 20487, type: u16, enum: parity_stop, writable: true, poll: slow}
  - {key: x.ct_direction, label: Current direction correction, table: holding, address: 20495, type: u16, enum: ct_direction, writable: true, poll: slow, note: Reverses the current of CTs that are fitted the wrong way round. Needs the key-parameter authorisation.}
  - {key: x.ct_primary, label: CT1 (primary current), table: holding, address: 20501, type: u16, unit: A, writable: true, min: 1, max: 9999, poll: slow, note: Default 5. Needs the key-parameter authorisation.}
  - {key: x.ct_secondary, label: CT2 (secondary current), table: holding, address: 20502, type: u16, unit: A, writable: true, poll: slow, note: '1 or 5 A, default 5.'}
  - {key: x.running_time, label: Running time, table: holding, address: 20540, type: u32, unit: min, poll: slow, note: Since power-on; writing 0 resets it.}
  - {key: x.running_time_load, label: Running time with load, table: holding, address: 20542, type: u32, unit: min, poll: slow, note: Time with power above 0; writing 0 resets it.}
  - {key: x.meter_code, label: Meter code, table: holding, address: 22017, type: u16, poll: slow, note: Shown as hex; the document gives no values.}
  - {key: serial, label: Serial number, table: holding, address: 22018, type: u32, poll: slow}
  - {key: firmware, label: Software version number, table: holding, address: 22020, type: u16, poll: slow, note: 'XX.YY: high byte XX, low byte YY.'}
  - {key: x.hardware_version, label: Hardware version number, table: holding, address: 22021, type: u16, poll: slow, note: 'XX.YY: high byte XX, low byte YY.'}

enums:
  system_type: {'1': 1 phase 2 wire, '2': 3 phase 3 wire, '3': 3 phase 4 wire, '4': 1 phase 3 wire}
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200', '5': '38400'}
  parity_stop: {'0': 8N1, '1': 8E1, '2': 8O1, '3': 8N2}
  ct_direction: {'0': All forward, '1': L1 reversed, '2': L2 reversed, '3': 'L1, L2 reversed', '4': L3 reversed, '5': 'L1, L3 reversed', '6': 'L2, L3 reversed', '7': 'L1, L2, L3 reversed'}

notes:
- Measurements exist twice, as IEEE 754 floats in input registers (function 04, used here) and as scaled integers in holding
  registers 0x0000 ff. (function 03, 0.01 V, 0.001 A, 0.001 kW, 0.01 Hz …) at different addresses. Energies exist as floats
  (input 0x0500 ff., kWh), as 32-bit integers (holding 0x0400 ff., 0.01 kWh) and as 64-bit integers in Wh (holding 0x1D00
  ff., used here for their resolution).
- Two-register values are high word first, high byte first (the document's examples).
- Holding addresses as given in hex are the protocol addresses (0-based).
- 'Defaults: Modbus address 1, 9600 baud, 8N1. The document describes RS485 (RTU) only; port 502 is for a gateway. Settings
  marked as needing authorisation are written after writing the password (default 0000) to 0x5000.'
- Left out the per-phase phase angles, load nature (resistive / inductive / capacitive), averages, demand and maximum-demand
  registers other than the total active power, the per-phase reactive and total energies, the pulse output, PT, display and
  backlight settings, and the reset command (0x5600).
