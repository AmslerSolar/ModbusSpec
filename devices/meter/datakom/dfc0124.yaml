modbusspec: 0
id: datakom-dfc0124
manufacturer: Datakom
name: DFC-0124 power factor controller
kind: meter

sources:
- title: Datakom DFC0124 Modbus Application Manual
  version: 1.0 (05.02.2017)
  url: https://www.datakom.kiev.ua/upload/iblock/003/uzusm5880yr8k6wtojstrt0rfs4dy9dx/DATAKOM-DFC0124-MODBUS-Guide.pdf
  sha256: ce8aedb2cd3871a1fbbfd15455730d3bbf67b94fdc25f023d3e65538ed30ef9f
  archive_url: https://web.archive.org/web/20250624033330/https://www.datakom.kiev.ua/upload/iblock/003/uzusm5880yr8k6wtojstrt0rfs4dy9dx/DATAKOM-DFC0124-MODBUS-Guide.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 20480
    type: u32
    plausible:
    - 1
    - 1000000

points:
  - {key: l1_voltage, label: Phase L1 voltage, table: holding, address: 20480, type: u32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Phase L2 voltage, table: holding, address: 20482, type: u32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Phase L3 voltage, table: holding, address: 20484, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l12, label: Phase L1-L2 voltage, table: holding, address: 20486, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l23, label: Phase L2-L3 voltage, table: holding, address: 20488, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l31, label: Phase L1-L3 voltage, table: holding, address: 20490, type: u32, unit: V, scale: 0.1}
  - {key: l1_current, label: Phase L1 current, table: holding, address: 20492, type: u32, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase L2 current, table: holding, address: 20494, type: u32, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase L3 current, table: holding, address: 20496, type: u32, unit: A, scale: 0.1}
  - {key: x.neutral_current, label: Neutral current, table: holding, address: 20498, type: u32, unit: A, scale: 0.1}
  - {key: l1_power, label: Phase L1 active power, table: holding, address: 20500, type: s32, unit: W, scale: 100, positive: import, verified: false}
  - {key: l2_power, label: Phase L2 active power, table: holding, address: 20502, type: s32, unit: W, scale: 100, positive: import, verified: false}
  - {key: l3_power, label: Phase L3 active power, table: holding, address: 20504, type: s32, unit: W, scale: 100, positive: import, verified: false}
  - {key: grid_power, label: Total active power, table: holding, address: 20506, type: s32, unit: W, scale: 100, positive: import, verified: false, note: 'Coefficient x10 with no unit stated; kW assumed (the demand value is called "Demand kW"), so one step is 100 W. Signedness and direction not stated; signed with import positive assumed (the min / max registers separate kW import and kW export).'}
  - {key: x.l1_reactive_power, label: Phase L1 reactive power, table: holding, address: 20508, type: s32, unit: var, scale: 100, verified: false}
  - {key: x.l2_reactive_power, label: Phase L2 reactive power, table: holding, address: 20510, type: s32, unit: var, scale: 100, verified: false}
  - {key: x.l3_reactive_power, label: Phase L3 reactive power, table: holding, address: 20512, type: s32, unit: var, scale: 100, verified: false}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 20514, type: s32, unit: var, scale: 100, verified: false, note: kvar assumed; signedness assumed.}
  - {key: x.l1_apparent_power, label: Phase L1 apparent power, table: holding, address: 20516, type: u32, unit: VA, scale: 100, verified: false}
  - {key: x.l2_apparent_power, label: Phase L2 apparent power, table: holding, address: 20518, type: u32, unit: VA, scale: 100, verified: false}
  - {key: x.l3_apparent_power, label: Phase L3 apparent power, table: holding, address: 20520, type: u32, unit: VA, scale: 100, verified: false}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 20522, type: u32, unit: VA, scale: 100, verified: false, note: kVA assumed.}
  - {key: x.l1_power_factor, label: Phase L1 power factor, table: holding, address: 20524, type: s16, scale: 0.001, verified: false}
  - {key: x.l2_power_factor, label: Phase L2 power factor, table: holding, address: 20525, type: s16, scale: 0.001, verified: false}
  - {key: x.l3_power_factor, label: Phase L3 power factor, table: holding, address: 20526, type: s16, scale: 0.001, verified: false}
  - {key: power_factor, label: Total power factor, table: holding, address: 20527, type: s16, scale: 0.001, verified: false, note: Signedness not stated; assumed signed.}
  - {key: frequency, label: Frequency, table: holding, address: 20528, type: u16, unit: Hz, scale: 0.01}
  - {key: x.temperature, label: Temperature, table: holding, address: 20529, type: s16, unit: °C, scale: 0.1, verified: false, note: Unit and signedness not stated; °C and signed assumed.}
  - {key: x.generator_input_voltage, label: Generator input voltage, table: holding, address: 20530, type: u16, unit: V, scale: 0.1}
  - {key: x.voltage_avg, label: Average Ph-N voltage, table: holding, address: 20532, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_ll_avg, label: Average Ph-Ph voltage, table: holding, address: 20534, type: u32, unit: V, scale: 0.1}
  - {key: x.current_avg, label: Average current, table: holding, address: 20536, type: u32, unit: A, scale: 0.1}
  - {key: x.tangent, label: Total tangent, table: holding, address: 20541, type: s16, scale: 0.1, verified: false}
  - {key: x.daily_inductive, label: Daily inductive, table: holding, address: 23340, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.daily_capacitive, label: Daily capacitive, table: holding, address: 23341, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.monthly_inductive, label: Monthly inductive, table: holding, address: 23342, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.monthly_capacitive, label: Monthly capacitive, table: holding, address: 23343, type: u16, unit: '%', scale: 0.1, poll: slow}
  - {key: x.svc_kvar_l1, label: SVC kVAr phase L1, table: holding, address: 1321, type: s16, unit: kvar, scale: 0.1, verified: false}
  - {key: x.svc_kvar_l2, label: SVC kVAr phase L2, table: holding, address: 1322, type: s16, unit: kvar, scale: 0.1, verified: false}
  - {key: x.svc_kvar_l3, label: SVC kVAr phase L3, table: holding, address: 1323, type: s16, unit: kvar, scale: 0.1, verified: false}
  # Counters (writable: they can be preset)
  - {key: grid_import_energy, label: kWh_1 import, table: holding, address: 12288, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: grid_export_energy, label: kWh_1 export, table: holding, address: 12290, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_ind, label: kVArh_1 inductive, table: holding, address: 12292, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_cap, label: kVArh_1 capacitive, table: holding, address: 12294, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.hour_counter_1, label: Group_1 hour counter, table: holding, address: 12296, type: u32, unit: h, scale: 0.1, poll: slow, writable: true}
  - {key: x.import_energy_2, label: kWh_2 import, table: holding, address: 12298, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.export_energy_2, label: kWh_2 export, table: holding, address: 12300, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_ind_2, label: kVArh_2 inductive, table: holding, address: 12302, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_cap_2, label: kVArh_2 capacitive, table: holding, address: 12304, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.hour_counter_2, label: Group_2 hour counter, table: holding, address: 12306, type: u32, unit: h, scale: 0.1, poll: slow, writable: true}
  - {key: x.demand_kw, label: Demand kW, table: holding, address: 12468, type: s32, unit: kW, scale: 0.01, poll: slow, verified: false}
  - {key: x.demand_kvar, label: Demand kVAr, table: holding, address: 12470, type: s32, unit: kvar, scale: 0.01, poll: slow, verified: false}
  # Status
  - {key: x.alarms_1, label: Alarms (first word), table: holding, address: 23325, type: u16, flags: alarms_1}
  - {key: x.alarms_2, label: Alarms (second word), table: holding, address: 23326, type: u16, flags: alarms_2}
  - {key: x.outputs_1, label: Output states (Out1-Out12), table: holding, address: 23914, type: u16, note: Bit 0 = Out1 (assumed).}
  - {key: x.outputs_2, label: Output states (Out13-Out24), table: holding, address: 23915, type: u16, note: Bit 0 = Out13 (assumed).}
  # Clock (local time)
  - {key: x.clock, label: Date and time, table: holding, address: 8192, type: datetime, length: 7, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 4}, minute: {register: 5}, second: {register: 6}}, poll: slow, writable: true, note: 'Register 8195 (day of week, 0–6) is read-only.'}
  # Control
  - {key: x.reset_counters, label: Reset counters, table: holding, address: 16387, type: u16, writable: true, write_only: true, note: The document says to write 0.}

flags:
  alarms_1: {'0': Not three phase, '1': First banks not three phase, '2': Current transformer error, '3': High voltage, '4': Low voltage, '5': High frequency, '6': Low frequency, '7': High kW, '8': Low kW, '9': High kVAr, '10': Low kVAr, '11': High cos, '12': Low cos, '13': High current, '14': High THDV, '15': High THDI}
  alarms_2: {'1': Voltage unbalance, '2': Current unbalance, '5': Phase sequence, '6': Capacitor error, '7': High temperature alarm, '8': High temperature warning, '9': Low temperature alarm, '10': Temperature fail alarm, '11': Current transformer error, '12': Daily ind/cap alarm, '13': Monthly ind/cap alarm, '14': Internal alarm, '15': SVC error}

problems:
  - {when: {key: x.alarms_1, bit: 0}, kind: warning, text: Not three phase (alarm 1 bit 0)}
  - {when: {key: x.alarms_1, bit: 1}, kind: warning, text: First banks not three phase (alarm 1 bit 1)}
  - {when: {key: x.alarms_1, bit: 2}, kind: fault, text: Current transformer error (alarm 1 bit 2)}
  - {when: {key: x.alarms_1, bit: 3}, kind: warning, text: High voltage (alarm 1 bit 3)}
  - {when: {key: x.alarms_1, bit: 4}, kind: warning, text: Low voltage (alarm 1 bit 4)}
  - {when: {key: x.alarms_1, bit: 5}, kind: warning, text: High frequency (alarm 1 bit 5)}
  - {when: {key: x.alarms_1, bit: 6}, kind: warning, text: Low frequency (alarm 1 bit 6)}
  - {when: {key: x.alarms_1, bit: 7}, kind: warning, text: High kW (alarm 1 bit 7)}
  - {when: {key: x.alarms_1, bit: 8}, kind: warning, text: Low kW (alarm 1 bit 8)}
  - {when: {key: x.alarms_1, bit: 9}, kind: warning, text: High kVAr (alarm 1 bit 9)}
  - {when: {key: x.alarms_1, bit: 10}, kind: warning, text: Low kVAr (alarm 1 bit 10)}
  - {when: {key: x.alarms_1, bit: 11}, kind: warning, text: High cos φ (alarm 1 bit 11)}
  - {when: {key: x.alarms_1, bit: 12}, kind: warning, text: Low cos φ (alarm 1 bit 12)}
  - {when: {key: x.alarms_1, bit: 13}, kind: warning, text: High current (alarm 1 bit 13)}
  - {when: {key: x.alarms_1, bit: 14}, kind: warning, text: High voltage THD (alarm 1 bit 14)}
  - {when: {key: x.alarms_1, bit: 15}, kind: warning, text: High current THD (alarm 1 bit 15)}
  - {when: {key: x.alarms_2, bit: 1}, kind: warning, text: Voltage unbalance (alarm 2 bit 1)}
  - {when: {key: x.alarms_2, bit: 2}, kind: warning, text: Current unbalance (alarm 2 bit 2)}
  - {when: {key: x.alarms_2, bit: 5}, kind: warning, text: Phase sequence (alarm 2 bit 5)}
  - {when: {key: x.alarms_2, bit: 6}, kind: fault, text: Capacitor error (alarm 2 bit 6)}
  - {when: {key: x.alarms_2, bit: 7}, kind: fault, text: High temperature alarm (alarm 2 bit 7)}
  - {when: {key: x.alarms_2, bit: 8}, kind: warning, text: High temperature warning (alarm 2 bit 8)}
  - {when: {key: x.alarms_2, bit: 9}, kind: warning, text: Low temperature alarm (alarm 2 bit 9)}
  - {when: {key: x.alarms_2, bit: 10}, kind: warning, text: Temperature fail alarm (alarm 2 bit 10)}
  - {when: {key: x.alarms_2, bit: 11}, kind: fault, text: Current transformer error (alarm 2 bit 11)}
  - {when: {key: x.alarms_2, bit: 12}, kind: warning, text: Daily inductive / capacitive alarm (alarm 2 bit 12)}
  - {when: {key: x.alarms_2, bit: 13}, kind: warning, text: Monthly inductive / capacitive alarm (alarm 2 bit 13)}
  - {when: {key: x.alarms_2, bit: 14}, kind: fault, text: Internal alarm (alarm 2 bit 14)}
  - {when: {key: x.alarms_2, bit: 15}, kind: fault, text: SVC error (alarm 2 bit 15)}

notes:
- Addresses are the document's decimal register addresses, used directly as protocol addresses (0-based). All registers are
  read with function 03; writes use 06 / 16.
- At most 16 registers per request; longer requests are cut to the first 16.
- 'Word order: the document contradicts itself (one section says the least significant register comes first, another that
  the high 16 bits are in the first register). Readers detect it from the L1 voltage; with no voltage they fall back to high
  word first. Unverified.'
- Power registers have a coefficient of x10 without a unit; kW / kvar / kVA assumed. Signedness of power, power factor, tangent,
  temperature and bank kvar assumed. Which alarms stop compensation is not stated; the fault / warning split above is an assumption.
- The document gives no device ID or serial number register, so there is no identification.
- 'Left out: capacitor bank kvar per phase (banks 1–24 at 1225–1296, three registers each: L1, L2, L3), per-phase tangent,
  demand currents, minimum and maximum values (12472–12531), the UTC clock (8199–8215), pushbutton simulation (16385) and
  factory reset (16386), and the harmonics / waveform buffers (273 registers each, first register = THD): the listed buffer
  start addresses are inconsistent (21415 before 21413, 22959 before 22232), so they are not used.'
- Default unit id 1 (recommended for Modbus TCP); serial baud rate is selectable (2400–115200), no default stated.
