modbusspec: 0
id: datakom-dkm411
manufacturer: Datakom
name: DKM-411 network analyser
kind: meter

sources:
- title: Datakom DKM-411 Modbus Application Manual
  version: 3.0 (15.01.2017)
  url: https://www.datakom.kiev.ua/upload/iblock/8f1/acj2qll2zkn8qbfd47pxrwowg18krz1i/DATAKOM-DKM411-MODBUS-application-manual.pdf
  sha256: 549de1f3fd397294d848ab93999c6cedd3a9d757bf8970821ff7262363688e91
  archive_url: https://web.archive.org/web/20250512110112/https://www.datakom.kiev.ua/upload/iblock/8f1/acj2qll2zkn8qbfd47pxrwowg18krz1i/DATAKOM-DKM411-MODBUS-application-manual.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 16

encoding:
  byte_order: big
  word_order: detect
  detect:
    table: holding
    address: 20480
    type: u32
    plausible:
    - 1
    - 1000000

identify:
  checks:
  - table: holding
    address: 23492
    type: u16
    equals: 1041

points:
  - {key: l1_voltage, label: Phase L1 voltage, table: holding, address: 20480, type: u32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Phase L2 voltage, table: holding, address: 20482, type: u32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Phase L3 voltage, table: holding, address: 20484, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l12, label: Phase L1-L2 voltage, table: holding, address: 20486, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l23, label: Phase L2-L3 voltage, table: holding, address: 20488, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l31, label: Phase L3-L1 voltage, table: holding, address: 20490, type: u32, unit: V, scale: 0.1}
  - {key: l1_current, label: Phase L1 current, table: holding, address: 20492, type: u32, unit: A, scale: 0.1}
  - {key: l2_current, label: Phase L2 current, table: holding, address: 20494, type: u32, unit: A, scale: 0.1}
  - {key: l3_current, label: Phase L3 current, table: holding, address: 20496, type: u32, unit: A, scale: 0.1}
  - {key: x.neutral_current, label: Neutral current, table: holding, address: 20498, type: u32, unit: A, scale: 0.1}
  - {key: l1_power, label: Phase L1 active power, table: holding, address: 20500, type: s32, unit: W, scale: 10, positive: import, verified: false}
  - {key: l2_power, label: Phase L2 active power, table: holding, address: 20502, type: s32, unit: W, scale: 10, positive: import, verified: false}
  - {key: l3_power, label: Phase L3 active power, table: holding, address: 20504, type: s32, unit: W, scale: 10, positive: import, verified: false}
  - {key: grid_power, label: Total active power, table: holding, address: 20506, type: s32, unit: W, scale: 10, positive: import, verified: false, note: 'Coefficient x100 with no unit stated; kW assumed (the demand value is called "Demand kW"), so one step is 10 W. Signedness and direction not stated; signed with import positive assumed (the min / max registers separate kW import and kW export).'}
  - {key: x.l1_reactive_power, label: Phase L1 reactive power, table: holding, address: 20508, type: s32, unit: var, scale: 10, verified: false}
  - {key: x.l2_reactive_power, label: Phase L2 reactive power, table: holding, address: 20510, type: s32, unit: var, scale: 10, verified: false}
  - {key: x.l3_reactive_power, label: Phase L3 reactive power, table: holding, address: 20512, type: s32, unit: var, scale: 10, verified: false}
  - {key: reactive_power, label: Total reactive power, table: holding, address: 20514, type: s32, unit: var, scale: 10, verified: false, note: kvar assumed; signedness assumed.}
  - {key: x.l1_apparent_power, label: Phase L1 apparent power, table: holding, address: 20516, type: u32, unit: VA, scale: 10, verified: false}
  - {key: x.l2_apparent_power, label: Phase L2 apparent power, table: holding, address: 20518, type: u32, unit: VA, scale: 10, verified: false}
  - {key: x.l3_apparent_power, label: Phase L3 apparent power, table: holding, address: 20520, type: u32, unit: VA, scale: 10, verified: false}
  - {key: apparent_power, label: Total apparent power, table: holding, address: 20522, type: u32, unit: VA, scale: 10, verified: false, note: kVA assumed.}
  - {key: x.l1_power_factor, label: Phase L1 power factor, table: holding, address: 20524, type: s16, scale: 0.001, verified: false}
  - {key: x.l2_power_factor, label: Phase L2 power factor, table: holding, address: 20525, type: s16, scale: 0.001, verified: false}
  - {key: x.l3_power_factor, label: Phase L3 power factor, table: holding, address: 20526, type: s16, scale: 0.001, verified: false}
  - {key: power_factor, label: Total power factor, table: holding, address: 20527, type: s16, scale: 0.001, verified: false, note: Signedness not stated; assumed signed.}
  - {key: frequency, label: Frequency, table: holding, address: 20528, type: u16, unit: Hz, scale: 0.01}
  - {key: x.voltage_avg, label: Average Ph-N voltage, table: holding, address: 20532, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_ll_avg, label: Average Ph-Ph voltage, table: holding, address: 20534, type: u32, unit: V, scale: 0.1}
  - {key: x.current_avg, label: Average current, table: holding, address: 20536, type: u32, unit: A, scale: 0.1}
  - {key: x.tangent, label: Total tangent(teta) Q/P, table: holding, address: 20541, type: s16, scale: 0.1, verified: false}
  - {key: x.voltage_unbalance, label: Voltage unbalance, table: holding, address: 20542, type: u16, unit: '%', scale: 0.1}
  - {key: x.current_unbalance, label: Current unbalance, table: holding, address: 20543, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_v_l1, label: THD of phase L1 voltage, table: holding, address: 20548, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_v_l2, label: THD of phase L2 voltage, table: holding, address: 20837, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_v_l3, label: THD of phase L3 voltage, table: holding, address: 21126, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_i_l1, label: THD of phase L1 current, table: holding, address: 22282, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_i_l2, label: THD of phase L2 current, table: holding, address: 22571, type: u16, unit: '%', scale: 0.1}
  - {key: x.thd_i_l3, label: THD of phase L3 current, table: holding, address: 22860, type: u16, unit: '%', scale: 0.1}
  # Counters (writable: they can be preset or cleared)
  - {key: grid_import_energy, label: kWh_1 import, table: holding, address: 12288, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: grid_export_energy, label: kWh_1 export, table: holding, address: 12290, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_ind, label: kVArh_1 inductive, table: holding, address: 12292, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_cap, label: kVArh_1 capacitive, table: holding, address: 12294, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.hour_counter_1, label: Group_1 hour counter, table: holding, address: 12296, type: u32, unit: h, scale: 0.1, poll: slow, writable: true}
  - {key: x.import_energy_2, label: kWh_2 import, table: holding, address: 12298, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.export_energy_2, label: kWh_2 export, table: holding, address: 12300, type: u32, unit: kWh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_ind_2, label: kVArh_2 inductive, table: holding, address: 12302, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.reactive_energy_cap_2, label: kVArh_2 capacitive, table: holding, address: 12304, type: u32, unit: kvarh, scale: 0.1, poll: slow, writable: true}
  - {key: x.hour_counter_2, label: Group_2 hour counter, table: holding, address: 12306, type: u32, unit: h, scale: 0.1, poll: slow, writable: true}
  - {key: x.input_1_counter, label: Digital input 1 counter, table: holding, address: 12332, type: u32, poll: slow, writable: true}
  - {key: x.input_2_counter, label: Digital input 2 counter, table: holding, address: 12334, type: u32, poll: slow, writable: true}
  - {key: x.demand_kw, label: Demand kW, table: holding, address: 12468, type: s32, unit: kW, scale: 0.01, poll: slow, verified: false}
  - {key: x.demand_kvar, label: Demand kVAr, table: holding, address: 12470, type: s32, unit: kvar, scale: 0.01, poll: slow, verified: false}
  # Status
  - {key: x.alarm_bits, label: Alarm bits 0–15, table: holding, address: 23440, type: u16, flags: alarm_bits, note: The alarm bits are 64 bits over 4 registers; bits 16–63 are reserved.}
  - {key: x.warning_bits, label: Warning bits 0–15, table: holding, address: 23444, type: u16, flags: input_bits}
  - {key: x.input_alarm_bits, label: Input alarm bits, table: holding, address: 23456, type: u16, flags: input_bits}
  - {key: x.topology, label: Topology, table: holding, address: 23469, type: u16, enum: topology, poll: slow}
  # Clock (local time)
  - {key: x.clock, label: Date and time, table: holding, address: 8192, type: datetime, length: 7, datetime: {year: {register: 0}, month: {register: 1}, day: {register: 2}, hour: {register: 4}, minute: {register: 5}, second: {register: 6}}, poll: slow, writable: true, note: 'Register 8195 (day of week, 0–6) is read-only.'}
  # Identity
  - {key: x.device_id, label: Device ID, table: holding, address: 23492, type: u16, poll: slow, note: 0411h.}
  - {key: x.hardware_version, label: Device hardware version, table: holding, address: 23493, type: u16, poll: slow}
  - {key: firmware, label: Device software version, table: holding, address: 23494, type: u16, poll: slow}

enums:
  topology: {'0': '3 phase, 4 wire star', '1': 'Single phase, 2 wire', '2': '2 phase, 3 wire L1-L2', '3': '3 phase, 3 wire', '4': '3 phase, 4 wire delta', '5': '3 phase, 3 wire, 2 CTs L1-L2', '6': '3 phase, 3 wire, 2 CTs L1-L3'}

flags:
  alarm_bits: {'0': High voltage, '1': Low voltage, '2': High frequency, '3': Low frequency, '4': High kW, '5': Low kW, '6': High kVAr, '7': Low kVAr, '8': High power factor, '9': Low power factor, '10': High current, '11': High THD-V, '12': High THD-I, '13': Voltage unbalance, '14': Current unbalance, '15': Wrong phase sequence}
  input_bits: {'0': Input 1, '1': Input 2}

problems:
  - {when: {key: x.alarm_bits, bit: 0}, kind: warning, text: High voltage alarm (bit 0)}
  - {when: {key: x.alarm_bits, bit: 1}, kind: warning, text: Low voltage alarm (bit 1)}
  - {when: {key: x.alarm_bits, bit: 2}, kind: warning, text: High frequency alarm (bit 2)}
  - {when: {key: x.alarm_bits, bit: 3}, kind: warning, text: Low frequency alarm (bit 3)}
  - {when: {key: x.alarm_bits, bit: 4}, kind: warning, text: High kW alarm (bit 4)}
  - {when: {key: x.alarm_bits, bit: 5}, kind: warning, text: Low kW alarm (bit 5)}
  - {when: {key: x.alarm_bits, bit: 6}, kind: warning, text: High kVAr alarm (bit 6)}
  - {when: {key: x.alarm_bits, bit: 7}, kind: warning, text: Low kVAr alarm (bit 7)}
  - {when: {key: x.alarm_bits, bit: 8}, kind: warning, text: High power factor alarm (bit 8)}
  - {when: {key: x.alarm_bits, bit: 9}, kind: warning, text: Low power factor alarm (bit 9)}
  - {when: {key: x.alarm_bits, bit: 10}, kind: warning, text: High current alarm (bit 10)}
  - {when: {key: x.alarm_bits, bit: 11}, kind: warning, text: High voltage THD alarm (bit 11)}
  - {when: {key: x.alarm_bits, bit: 12}, kind: warning, text: High current THD alarm (bit 12)}
  - {when: {key: x.alarm_bits, bit: 13}, kind: warning, text: Voltage unbalance alarm (bit 13)}
  - {when: {key: x.alarm_bits, bit: 14}, kind: warning, text: Current unbalance alarm (bit 14)}
  - {when: {key: x.alarm_bits, bit: 15}, kind: warning, text: Wrong phase sequence (bit 15)}
  - {when: {key: x.warning_bits, bit: 0}, kind: warning, text: Input 1 warning}
  - {when: {key: x.warning_bits, bit: 1}, kind: warning, text: Input 2 warning}
  - {when: {key: x.input_alarm_bits, bit: 0}, kind: warning, text: Input 1 alarm}
  - {when: {key: x.input_alarm_bits, bit: 1}, kind: warning, text: Input 2 alarm}

notes:
- Addresses are the document's decimal register addresses, used directly as protocol addresses (0-based). All registers are
  read with function 03; writes use 06 / 16.
- At most 16 registers per request; longer requests are cut to the first 16.
- 'Word order: the document contradicts itself (one section says the least significant register comes first, another that
  the high 16 bits are in the first register). Readers detect it from the L1 voltage; with no voltage they fall back to high
  word first. Unverified.'
- Power registers have a coefficient of x100 without a unit; kW / kvar / kVA assumed. Signedness of power, power factor and
  tangent assumed.
- The meter's own alarms are limit alarms on measured values, so they are reported as warnings; their severity is not stated.
- 'Left out: per-phase tangent, demand currents, minimum and maximum values (12472–12531), harmonics and waveform buffers
  (beyond the THD in each buffer''s first register), relay function bits (23448), phasor angles, K factors, the UTC clock
  (8199–8215), unique ID (12 bytes at 23475–23480, no text type fits), IP / IMEI registers.'
- Default unit id 1 (recommended for Modbus TCP); serial baud rate is selectable (2400–115200), no default stated.
