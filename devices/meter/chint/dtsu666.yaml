  sha256: a56a1bd913c11bf943c0893641a9e359ae4fd838691f6d4fde8714554887877f
  archive_url: https://web.archive.org/web/20260213055256/https://www.chintglobal.com/content/dam/chint/global/product-center/instruments-meters/electricity-meter/din-rail-meter/dtsu666/manual/DTSU666%20DSSU666%20User%20Manual.pdf
