connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - - table: holding
      address: 8198
      type: f32
      range:
      - 990.0
      - 1210.0
    - table: holding
      address: 8198
      type: f32
      range:
      - 2070.0
      - 2530.0

