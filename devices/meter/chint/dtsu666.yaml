enums:
  network: {'0': Three-phase four-wire, '1': Three-phase three-wire}
  protocol: {'1': DL/T 645, '2': Modbus 8N2, '3': Modbus 8N1, '4': Modbus 8E1, '5': Modbus 8O1}
  baud_rate: {'0': '1200', '1': '2400', '2': '4800', '3': '9600', '4': '19200'}

notes:
- Addresses are the manual's hex parameter addresses (0-based protocol addresses). Read with function 03; all registers are
  holding registers.
- Electricity values are IEEE 754 floats in two registers, high word and high byte first (ABCD), in units of 0.1 V, 0.001
  A, 0.1 W / var, 0.001 (power factor) and 0.01 Hz; the scales here turn them into V, A, W, var and Hz. Energies are floats
  in kWh. The settings are signed 16-bit integers.
- 'The manual says the values read over Modbus are secondary-side values: with current / voltage transformers, multiply by
  the CT ratio (0x0006) and PT ratio (0x0007). Whether this also applies to the energy registers is not stated.'
- 'Factory defaults: Modbus RTU, 9600 Bd, no parity, 1 stop bit, address 1. Baud rate 19200 is a customer option.'
- The DSSU666 is the three-phase three-wire variant with the same map; its phase voltages, B-phase power and per-phase power
  factors are not valid. The model can't be read from the meter.
- The manual lists only the common registers; it mentions a separate detailed protocol for primary-side data and further addresses.
- 'A meter with Huawei firmware (model text HW_DTSU666-HW at input 28672, see huawei-dtsu666-h) answers these values on input
  registers (the 8192 and 4096 blocks) and refuses them on holding registers; the identify check here then fails, which is
  right: it is the other file''s device.'
- Identification as mbmd recognises the device (not checked against a document).
- mbmd (type code DTSU666) detects the meter by reading L1 Voltage (holding register 8198, f32, scale 0.1); its bus scan accepts
  a value within 10% of 110 or 230 V.
- The driver's default meter type is GRID, for which OpenEMS defines active power as + = purchase from the grid, − = feed-in,
  and the production energy as the energy bought from the grid.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Phase values are for the default phase rotation L1-L2-L3.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
