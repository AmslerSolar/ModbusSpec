  - {key: x.energy_reset, label: Energy reset (CLr.E), table: holding, address: 2, type: s16, writable: true, poll: slow, note: Writing 1 clears the energy counters.}
  - {key: x.network, label: Network selection (net), table: holding, address: 3, type: s16, enum: network, writable: true, poll: slow}
  - {key: x.ct_ratio, label: Current transformer rate (IrAt), table: holding, address: 6, type: s16, writable: true, min: 1, max: 9999, poll: slow}
  - {key: x.pt_ratio, label: Voltage transformer rate (UrAt), table: holding, address: 7, type: s16, scale: 0.1, writable: true, min: 0.1, max: 999.9, poll: slow, conflicts: [{sources: [openwb], scale: 1, label: Counter urat}]}
  - {key: x.display_time, label: Rotating display time (Disp), table: holding, address: 10, type: s16, unit: s, writable: true, min: 0, max: 30, poll: slow, note: 0 = no rotation.}
  - {key: x.backlight_time, label: Backlight time control (B.LCD), table: holding, address: 11, type: s16, unit: min, writable: true, min: 0, max: 30, poll: slow, note: 0 = always on.}
