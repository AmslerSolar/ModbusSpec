modbusspec: 0
id: bcontrol-em300
manufacturer: B-control
name: EM300 energy meter (also sold by TQ-Systems)
kind: meter

sources:
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.bcontrol.em300/src/io/openems/edge/meter/bcontrol/em300/MeterBControlEM300Impl.java

connection:
  default_port: 502
  default_unit: 1

defaults:
  verified: false
  sources:
  - openems

points:
  - {key: x.active_power_pos, label: Active Power Pos, table: holding, address: 0, type: u32, unit: W, scale: 0.1}
  - {key: x.active_power_neg, label: Active Power Neg, table: holding, address: 2, type: u32, unit: W, scale: 0.1}
  - {key: x.reactive_power_pos, label: Reactive Power Pos, table: holding, address: 4, type: u32, unit: var, scale: 0.1}
  - {key: x.reactive_power_neg, label: Reactive Power Neg, table: holding, address: 6, type: u32, unit: var, scale: 0.1}
  - {key: frequency, label: Frequency, table: holding, address: 26, type: u32, unit: Hz, scale: 0.001}
  - {key: x.active_power_l1_pos, label: Active Power L1 Pos, table: holding, address: 40, type: u32, unit: W, scale: 0.1}
  - {key: x.active_power_l1_neg, label: Active Power L1 Neg, table: holding, address: 42, type: u32, unit: W, scale: 0.1}
  - {key: x.reactive_power_l1_pos, label: Reactive Power L1 Pos, table: holding, address: 44, type: u32, unit: var, scale: 0.1}
  - {key: x.reactive_power_l1_neg, label: Reactive Power L1 Neg, table: holding, address: 46, type: u32, unit: var, scale: 0.1}
  - {key: l1_current, label: Current L1, table: holding, address: 60, type: u32, unit: A, scale: 0.001}
  - {key: l1_voltage, label: Voltage L1, table: holding, address: 62, type: u32, unit: V, scale: 0.001}
  - {key: x.active_power_l2_pos, label: Active Power L2 Pos, table: holding, address: 80, type: u32, unit: W, scale: 0.1}
  - {key: x.active_power_l2_neg, label: Active Power L2 Neg, table: holding, address: 82, type: u32, unit: W, scale: 0.1}
  - {key: x.reactive_power_l2_pos, label: Reactive Power L2 Pos, table: holding, address: 84, type: u32, unit: var, scale: 0.1}
  - {key: x.reactive_power_l2_neg, label: Reactive Power L2 Neg, table: holding, address: 86, type: u32, unit: var, scale: 0.1}
  - {key: l2_current, label: Current L2, table: holding, address: 100, type: u32, unit: A, scale: 0.001}
  - {key: l2_voltage, label: Voltage L2, table: holding, address: 102, type: u32, unit: V, scale: 0.001}
  - {key: x.active_power_l3_pos, label: Active Power L3 Pos, table: holding, address: 120, type: u32, unit: W, scale: 0.1}
  - {key: x.active_power_l3_neg, label: Active Power L3 Neg, table: holding, address: 122, type: u32, unit: W, scale: 0.1}
  - {key: x.reactive_power_l3_pos, label: Reactive Power L3 Pos, table: holding, address: 124, type: u32, unit: var, scale: 0.1}
  - {key: x.reactive_power_l3_neg, label: Reactive Power L3 Neg, table: holding, address: 126, type: u32, unit: var, scale: 0.1}
  - {key: l3_current, label: Current L3, table: holding, address: 140, type: u32, unit: A, scale: 0.001}
  - {key: l3_voltage, label: Voltage L3, table: holding, address: 142, type: u32, unit: V, scale: 0.001}
  - {key: x.active_production_energy, label: Active Production Energy, table: holding, address: 512, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_consumption_energy, label: Active Consumption Energy, table: holding, address: 516, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_production_energy_l1, label: Active Production Energy L1, table: holding, address: 592, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_consumption_energy_l1, label: Active Consumption Energy L1, table: holding, address: 596, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_production_energy_l2, label: Active Production Energy L2, table: holding, address: 672, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_consumption_energy_l2, label: Active Consumption Energy L2, table: holding, address: 676, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_production_energy_l3, label: Active Production Energy L3, table: holding, address: 752, type: u64, unit: kWh, scale: 0.0001}
  - {key: x.active_consumption_energy_l3, label: Active Consumption Energy L3, table: holding, address: 756, type: u64, unit: kWh, scale: 0.0001}

derived:
  - {key: x.active_power, label: Active Power, unit: W, sum: [{key: x.active_power_pos}, {key: x.active_power_neg, factor: -1}]}
  - {key: x.active_power_l1, label: Active Power L1, unit: W, sum: [{key: x.active_power_l1_pos}, {key: x.active_power_l1_neg, factor: -1}]}
  - {key: x.active_power_l2, label: Active Power L2, unit: W, sum: [{key: x.active_power_l2_pos}, {key: x.active_power_l2_neg, factor: -1}]}
  - {key: x.active_power_l3, label: Active Power L3, unit: W, sum: [{key: x.active_power_l3_pos}, {key: x.active_power_l3_neg, factor: -1}]}
  - {key: reactive_power, label: Reactive Power, unit: var, sum: [{key: x.reactive_power_pos}, {key: x.reactive_power_neg, factor: -1}]}
  - {key: x.reactive_power_l1, label: Reactive Power L1, unit: var, sum: [{key: x.reactive_power_l1_pos}, {key: x.reactive_power_l1_neg, factor: -1}]}
  - {key: x.reactive_power_l2, label: Reactive Power L2, unit: var, sum: [{key: x.reactive_power_l2_pos}, {key: x.reactive_power_l2_neg, factor: -1}]}
  - {key: x.reactive_power_l3, label: Reactive Power L3, unit: var, sum: [{key: x.reactive_power_l3_pos}, {key: x.reactive_power_l3_neg, factor: -1}]}

notes:
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
