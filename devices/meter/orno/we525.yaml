  - {key: x.max_import_demand, label: Forward maximum active demand, table: input, address: 376, type: s32, unit: W, scale: 0.1, poll: slow, verified: false}
  - {key: x.export_demand, label: Reverse active demand, table: input, address: 378, type: s32, unit: W, scale: 0.1, poll: slow, verified: false}
  - {key: x.max_export_demand, label: Reverse maximum active demand, table: input, address: 380, type: s32, unit: W, scale: 0.1, poll: slow, verified: false}
  - {key: x.reactive_import_demand, label: Forward reactive demand, table: input, address: 384, type: s32, unit: var, scale: 0.1, poll: slow, verified: false}
  - {key: x.max_reactive_import_demand, label: Forward maximum reactive demand, table: input, address: 386, type: s32, unit: var, scale: 0.1, poll: slow, verified: false}
  - {key: x.reactive_export_demand, label: Reverse reactive demand, table: input, address: 388, type: s32, unit: var, scale: 0.1, poll: slow, verified: false}
  - {key: x.max_reactive_export_demand, label: Reverse maximum reactive demand, table: input, address: 390, type: s32, unit: var, scale: 0.1, poll: slow, verified: false}

