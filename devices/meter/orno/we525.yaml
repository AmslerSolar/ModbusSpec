  - {key: x.demand_cycle, label: Demand cycle, table: holding, address: 4113, type: u16, unit: min, writable: true, min: 1, max: 30, poll: slow, note: Default 15.}
  - {key: x.running_time, label: Meter running time, table: holding, address: 4120, type: u32, writable: true, poll: slow, note: OR-WE-526 tariff version only. Counts while the current is above the timing current (0x101A); writing 0 clears it. Unit not stated.}
  - {key: x.timing_current, label: Timing current value, table: holding, address: 4122, type: u32, unit: mA, writable: true, poll: slow, note: Default is the start-up current.}
  - {key: x.reactive_import_t1, label: Tariff 1 Reactive Import, table: input, address: 302, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}
  - {key: x.reactive_import_t2, label: Tariff 2 Reactive Import, table: input, address: 304, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}
  - {key: x.reactive_export_t1, label: Tariff 1 Reactive Export, table: input, address: 312, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}
  - {key: x.reactive_export_t2, label: Tariff 2 Reactive Export, table: input, address: 314, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}
  - {key: x.reactive_sum_t1, label: Tariff 1 Reactive, table: input, address: 322, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}
  - {key: x.reactive_sum_t2, label: Tariff 2 Reactive, table: input, address: 324, type: s32, unit: kvarh, scale: 0.01, sources: [mbmd], verified: false}

derived:
  - {key: serial, label: Serial number, sum: [{key: x.serial_upper, factor: 100000000}, {key: x.serial_lower}]}

enums:
  baud_rate: {'6': '9600', '7': '19200', '8': '38400', '9': '115200'}
  parity: {'0': None, '1': Odd, '2': Even}
  combined_code: {'1': Total = forward, '2': Total = reverse, '3': Total = forward + reverse, '4': Total = forward − reverse}
  demand_mode: {'0': Interval, '1': Slip}

notes:
- Addresses are the hex register addresses the document lists (0-based protocol addresses).
- 'Scaling: the document writes formats as INT32(i+d), i integer and d decimal digits; d decimals give scale 10^−d (e.g. voltage
  INT32(3+3) = 0.001 V, energy INT32(6+2) = 0.01 kWh, demand INT32(6+1) = 0.1 W).'
- The document doesn't name the function code for the measurement and energy registers; input registers (function 04) are
  assumed. The meter parameters are read/write and written with function 10h, so they are holding registers. Word order (high
  word first) is assumed too.
- 'Serial number: 12 decimal digits stored as hex digits (BCD) over three registers at 0x1000; it is read here as a BCD register
  plus a BCD double register. `identify.serial` uses only the last 8 digits.'
- 'Serial line: the document lists 9600, 19200, 38400 and 115200 baud, parity and 1 or 2 stop bits but not the defaults; the
  default Modbus ID is not stated either (1 assumed).'
- 'Left out: the reactive energy tariff registers (T1 … T4 after each reactive total), the clock at 0x1007 (four registers,
  OR-WE-526 tariff version only, byte coding not stated), the display cycle content (0x1012), the LCD password (0x1016), the
  write-only clear commands (0x2002 resettable energy, 0x2003 maximum demand) and the tariff tables at 0x1700 … 0x176C.'
- Identification as mbmd recognises the device (not checked against a document).
- mbmd (type code ORNO1p525) detects the meter by reading Voltage (input register 256, s32, scale 0.01); its bus scan accepts
  a value within 10% of 110 or 230 V.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
