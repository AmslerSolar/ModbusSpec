modbusspec: 0
id: orno-we525
manufacturer: ORNO
name: OR-WE-524 / OR-WE-525 / OR-WE-526 single-phase energy meters
kind: meter

sources:
- title: ORNO Rejestry OR-WE-524, OR-WE-525 i OR-WE-526 (OR-WE-525 rejestry)
  version: undated
  url: https://files.orno.pl/support/Others/ORNO/ORWE525_5908254827846/OR-WE-525_rejestry.pdf
  sha256: 2772abe683686f3502e403eed950ba08aa8a4507c85da8e8892be9b5ffb46d44
  archive_url: https://web.archive.org/web/20260924193922/https://files.orno.pl/support/Others/ORNO/ORWE525_5908254827846/OR-WE-525_rejestry.pdf
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/orno1p525.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - - table: input
      address: 256
      type: s32
      range:
      - 9900
      - 12100
    - table: input
      address: 256
      type: s32
      range:
      - 20700
      - 25300
  serial:
    table: holding
    address: 4097
    type: bcd32


points:
  # Instantaneous values. The document doesn't name the function code; input registers (04) assumed.
  - {key: l1_voltage, label: Voltage, table: input, address: 256, type: s32, unit: V, scale: 0.001, verified: false}
  - {key: l1_current, label: Current, table: input, address: 258, type: s32, unit: A, scale: 0.001, note: Signed by the energy direction (forward / reverse)., verified: false}
  - {key: grid_power, label: Active power, table: input, address: 260, type: s32, unit: W, positive: import, note: The document gives the power a sign by forward / reverse direction but doesn't say which is positive; assumed forward (import) = positive., verified: false}
  - {key: apparent_power, label: Apparent power, table: input, address: 262, type: s32, unit: VA, verified: false}
  - {key: reactive_power, label: Reactive power, table: input, address: 264, type: s32, unit: var, verified: false}
  - {key: frequency, label: Frequency, table: input, address: 266, type: s16, unit: Hz, scale: 0.1, verified: false}
  - {key: power_factor, label: Power factor, table: input, address: 267, type: s16, scale: 0.001, note: Carries the sign of the active power direction., verified: false}

  # Energy counters
  - {key: grid_import_energy, label: Total forward active energy, table: input, address: 270, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.import_t1, label: T1 total forward active energy, table: input, address: 272, type: s32, unit: kWh, scale: 0.01, poll: slow, note: Without tariffs T1 equals the total., verified: false}
  - {key: x.import_t2, label: T2 total forward active energy, table: input, address: 274, type: s32, unit: kWh, scale: 0.01, poll: slow, note: 0 without tariffs., verified: false}
  - {key: x.import_t3, label: T3 total forward active energy, table: input, address: 276, type: s32, unit: kWh, scale: 0.01, poll: slow, note: 0 without tariffs., verified: false}
  - {key: x.import_t4, label: T4 total forward active energy, table: input, address: 278, type: s32, unit: kWh, scale: 0.01, poll: slow, note: 0 without tariffs., verified: false}
  - {key: grid_export_energy, label: Total reverse active energy, table: input, address: 280, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.export_t1, label: T1 total reverse active energy, table: input, address: 282, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.export_t2, label: T2 total reverse active energy, table: input, address: 284, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.export_t3, label: T3 total reverse active energy, table: input, address: 286, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.export_t4, label: T4 total reverse active energy, table: input, address: 288, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.total_active_energy, label: Total active energy, table: input, address: 290, type: s32, unit: kWh, scale: 0.01, poll: slow, note: What it counts is set by the combined code (holding 0x100F)., verified: false}
  - {key: x.total_active_t1, label: T1 total active energy, table: input, address: 292, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.total_active_t2, label: T2 total active energy, table: input, address: 294, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.total_active_t3, label: T3 total active energy, table: input, address: 296, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.total_active_t4, label: T4 total active energy, table: input, address: 298, type: s32, unit: kWh, scale: 0.01, poll: slow, verified: false}
  - {key: x.reactive_import, label: Total forward reactive energy, table: input, address: 300, type: s32, unit: kvarh, scale: 0.01, poll: slow, verified: false}
  - {key: x.reactive_export, label: Total reverse reactive energy, table: input, address: 310, type: s32, unit: kvarh, scale: 0.01, poll: slow, verified: false}
  - {key: x.reactive_total, label: Total reactive energy, table: input, address: 320, type: s32, unit: kvarh, scale: 0.01, poll: slow, verified: false}
  - {key: x.reactive_q1, label: Total reactive energy in the first quadrant, table: input, address: 330, type: s32, unit: kvarh, scale: 0.01, poll: slow, verified: false}
  - {key: x.reactive_q2, label: Total reactive energy in the second quadrant, table: input, address: 340, type: s32, unit: kvarh, scale: 0.01, poll: slow, verified: false}
