modbusspec: 0
id: orno-we516
manufacturer: ORNO
name: OR-WE-516 / OR-WE-517 three-phase energy meters
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/orno3p.go
- id: tasmota
  title: Tasmota (energy meter drivers)
  url: https://github.com/arendst/Tasmota
  license: GPL-3.0
  commit: 4df6fa1d4bf6c4e98765eb76a096a597fb5af709
  path: tasmota/tasmota_xnrg_energy/xnrg_17_ornowe517.ino

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8E1

encoding:
  word_order: big

identify:
  checks:
  - - table: holding
      address: 14
      type: f32
      range:
      - 99.0
      - 121.0
    - table: holding
      address: 14
      type: f32
      range:
      - 207.0
      - 253.0

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: l1_voltage, label: L1 Voltage, table: holding, address: 14, type: f32, unit: V, sources: [mbmd, tasmota]}
  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 16, type: f32, unit: V, sources: [mbmd, tasmota]}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 18, type: f32, unit: V, sources: [mbmd, tasmota]}
  - {key: frequency, label: Frequency, table: holding, address: 20, type: f32, unit: Hz, sources: [mbmd, tasmota]}
  - {key: l1_current, label: L1 Current, table: holding, address: 22, type: f32, unit: A, sources: [mbmd, tasmota]}
  - {key: l2_current, label: L2 Current, table: holding, address: 24, type: f32, unit: A, sources: [mbmd, tasmota]}
  - {key: l3_current, label: L3 Current, table: holding, address: 26, type: f32, unit: A, sources: [mbmd, tasmota]}
  - {key: x.power, label: Power, table: holding, address: 28, type: f32, unit: W, scale: 1000}
  - {key: x.power_l1, label: L1 Power, table: holding, address: 30, type: f32, unit: W, scale: 1000, sources: [mbmd, tasmota]}
  - {key: x.power_l2, label: L2 Power, table: holding, address: 32, type: f32, unit: W, scale: 1000, sources: [mbmd, tasmota]}
  - {key: x.power_l3, label: L3 Power, table: holding, address: 34, type: f32, unit: W, scale: 1000, sources: [mbmd, tasmota]}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 36, type: f32, unit: var, scale: 1000}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: holding, address: 38, type: f32, unit: var, scale: 1000, conflicts: [{sources: [tasmota], scale: 1, label: Phase 1 volt amps reactive}]}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: holding, address: 40, type: f32, unit: var, scale: 1000, conflicts: [{sources: [tasmota], scale: 1, label: Phase 2 volt amps reactive}]}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: holding, address: 42, type: f32, unit: var, scale: 1000, conflicts: [{sources: [tasmota], scale: 1, label: Phase 3 volt amps reactive}]}
  - {key: apparent_power, label: Apparent Power, table: holding, address: 44, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l1, label: L1 Apparent Power, table: holding, address: 46, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l2, label: L2 Apparent Power, table: holding, address: 48, type: f32, unit: VA, scale: 1000}
  - {key: x.apparent_power_l3, label: L3 Apparent Power, table: holding, address: 50, type: f32, unit: VA, scale: 1000}
  - {key: power_factor, label: Cosphi, table: holding, address: 52, type: f32}
  - {key: x.cosphi_l1, label: L1 Cosphi, table: holding, address: 54, type: f32, sources: [mbmd, tasmota]}
  - {key: x.cosphi_l2, label: L2 Cosphi, table: holding, address: 56, type: f32, sources: [mbmd, tasmota]}
  - {key: x.cosphi_l3, label: L3 Cosphi, table: holding, address: 58, type: f32, sources: [mbmd, tasmota]}
  - {key: x.sum, label: Total Sum, table: holding, address: 256, type: f32, unit: kWh, sources: [mbmd, tasmota]}
  - {key: x.sum_l1, label: L1 Sum, table: holding, address: 258, type: f32, unit: kWh}
  - {key: x.sum_l2, label: L2 Sum, table: holding, address: 260, type: f32, unit: kWh}
  - {key: x.sum_l3, label: L3 Sum, table: holding, address: 262, type: f32, unit: kWh}
  - {key: grid_import_energy, label: Total Import, table: holding, address: 264, type: f32, unit: kWh}
  - {key: x.import_l1, label: L1 Import, table: holding, address: 266, type: f32, unit: kWh}
  - {key: x.import_l2, label: L2 Import, table: holding, address: 268, type: f32, unit: kWh}
  - {key: x.import_l3, label: L3 Import, table: holding, address: 270, type: f32, unit: kWh}
  - {key: grid_export_energy, label: Total Export, table: holding, address: 272, type: f32, unit: kWh}
  - {key: x.export_l1, label: L1 Export, table: holding, address: 274, type: f32, unit: kWh}
  - {key: x.export_l2, label: L2 Export, table: holding, address: 276, type: f32, unit: kWh}
  - {key: x.export_l3, label: L3 Export, table: holding, address: 278, type: f32, unit: kWh}
  - {key: x.reactive_sum, label: Total Reactive, table: holding, address: 280, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l1, label: L1 Reactive, table: holding, address: 282, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l2, label: L2 Reactive, table: holding, address: 284, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l3, label: L3 Reactive, table: holding, address: 286, type: f32, unit: kvarh}
  - {key: x.reactive_import, label: Reactive Import, table: holding, address: 288, type: f32, unit: kvarh}
  - {key: x.reactive_import_l1, label: L1 Reactive Import, table: holding, address: 290, type: f32, unit: kvarh}
  - {key: x.reactive_import_l2, label: L2 Reactive Import, table: holding, address: 292, type: f32, unit: kvarh}
  - {key: x.reactive_import_l3, label: L3 Reactive Import, table: holding, address: 294, type: f32, unit: kvarh}
  - {key: x.reactive_export, label: Reactive Export, table: holding, address: 296, type: f32, unit: kvarh}
  - {key: x.reactive_export_l1, label: L1 Reactive Export, table: holding, address: 298, type: f32, unit: kvarh}
  - {key: x.reactive_export_l2, label: L2 Reactive Export, table: holding, address: 300, type: f32, unit: kvarh}
  - {key: x.reactive_export_l3, label: L3 Reactive Export, table: holding, address: 302, type: f32, unit: kvarh}
  - {key: x.sum_t1, label: Tariff 1 Sum, table: holding, address: 304, type: f32, unit: kWh}
  - {key: x.import_t1, label: Tariff 1 Import, table: holding, address: 306, type: f32, unit: kWh}
  - {key: x.export_t1, label: Tariff 1 Export, table: holding, address: 308, type: f32, unit: kWh}
  - {key: x.reactive_sum_t1, label: Tariff 1 Reactive, table: holding, address: 310, type: f32, unit: kvarh}
  - {key: x.reactive_import_t1, label: Tariff 1 Reactive Import, table: holding, address: 312, type: f32, unit: kvarh}
  - {key: x.reactive_export_t1, label: Tariff 1 Reactive Export, table: holding, address: 314, type: f32, unit: kvarh}
  - {key: x.sum_t2, label: Tariff 2 Sum, table: holding, address: 316, type: f32, unit: kWh}
  - {key: x.import_t2, label: Tariff 2 Import, table: holding, address: 318, type: f32, unit: kWh}
  - {key: x.export_t2, label: Tariff 2 Export, table: holding, address: 320, type: f32, unit: kWh}
  - {key: x.reactive_sum_t2, label: Tariff 2 Reactive, table: holding, address: 322, type: f32, unit: kvarh}
  - {key: x.reactive_import_t2, label: Tariff 2 Reactive Import, table: holding, address: 324, type: f32, unit: kvarh}
  - {key: x.reactive_export_t2, label: Tariff 2 Reactive Export, table: holding, address: 326, type: f32, unit: kvarh}

notes:
- Serial defaults to 9600 baud 8E1, unit id 1. The WE-517 adds tariffs; the WE-516 has none.
- mbmd (type code ORNO3p) detects the meter by reading L1 Voltage (holding register 14, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.
- Tasmota's WE517 driver reads these registers.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
