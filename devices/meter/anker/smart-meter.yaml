enums:
  meter_type: {'1': Single Phase, '2': Three Phase}

notes:
- Modbus TCP must first be switched on in the Anker app (communication settings).
- The product number (5 registers from input 0x8000, spaces and NULs removed) tells the products apart.
- secondary_phase_1_voltage reads the same register as primary_phase_1_voltage (10632); listed once.
- secondary_phase_2_voltage reads the same register as primary_phase_2_voltage (10633); listed once.
- secondary_phase_3_voltage reads the same register as primary_phase_3_voltage (10634); listed once.
- 'AE1X0: the serial number''s product code (characters 4-6 of a 16-character serial, 4-7 of a 17-character one) names the
  product: DNSL = Anker SOLIX Smart Meter Gen 2, DNSM = Anker SOLIX Smart Meter Gen 2.'
- Two CT groups (primary, secondary) share the phase voltages 10632…10634.
- Taken from the openHAB binding (see sources); not checked against manufacturer documents.
- The sources don't state the default unit id; 1 is a guess.
- Identification as openhab recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
