  - {key: x.secondary_phase_b_forward_active_energy, label: Secondary CT Phase B Import, table: input, address: 10682, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_phase_c_forward_active_energy, label: Secondary CT Phase C Import, table: input, address: 10684, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_total_forward_active_energy, label: Secondary CT Total Import, table: input, address: 10686, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_phase_a_reverse_active_energy, label: Secondary CT Phase A Export, table: input, address: 10688, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_phase_b_reverse_active_energy, label: Secondary CT Phase B Export, table: input, address: 10690, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_phase_c_reverse_active_energy, label: Secondary CT Phase C Export, table: input, address: 10692, type: u32, unit: kWh, scale: 0.1}
  - {key: x.secondary_total_reverse_active_energy, label: Secondary CT Total Export, table: input, address: 10694, type: u32, unit: kWh, scale: 0.1}
