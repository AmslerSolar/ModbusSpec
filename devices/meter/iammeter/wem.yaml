enums:
  model: {'1': WEM3080, '2': WEM3080T, '3': WEM3046T, '4': WEM3050T, '5': WEM2067, '6': WEM3063T}

notes:
- Everything is read with function 03 from holding registers; unit id 1.
- WEM3046T and WEM3063T report phase currents in mA and powers in 0.1 W / 0.1 var; the other three-phase models in 0.01 A
  and W / var.
- The single-phase WEM3080 uses a different energy resolution (0.0003125 kWh per count) from the others (0.00125 kWh).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
