  - {key: x.power_b, label: Power B, table: holding, address: 12, type: s32, unit: W, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: x.power_b, label: Power B, table: holding, address: 12, type: s32, unit: W, models: [wem2067, wem3050t, wem3080t]}
  - {key: x.import_energy_b, label: Import Energy B, table: holding, address: 14, type: u32, unit: kWh, scale: 0.00125, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.export_energy_b, label: Export Energy B, table: holding, address: 16, type: u32, unit: kWh, scale: 0.00125, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
