  - {key: l3_current, label: Current C, table: holding, address: 21, type: u16, unit: A, scale: 0.001, models: [wem3046t, wem3063t]}
  - {key: l3_current, label: Current C, table: holding, address: 21, type: u16, unit: A, scale: 0.01, models: [wem3050t, wem3080t]}
  - {key: x.power_c, label: Power C, table: holding, address: 22, type: s32, unit: W, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: x.power_c, label: Power C, table: holding, address: 22, type: s32, unit: W, models: [wem3050t, wem3080t]}
