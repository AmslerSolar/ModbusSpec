  - {key: grid_export_energy, label: Total Export Energy, table: holding, address: 36, type: u32, unit: kWh, scale: 0.00125, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.reactive_power_a, label: Reactive Power A, table: holding, address: 38, type: s32, unit: var, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: x.reactive_power_a, label: Reactive Power A, table: holding, address: 38, type: s32, unit: var, models: [wem2067, wem3050t, wem3080t]}
