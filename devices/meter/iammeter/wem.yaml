  - {key: x.power_factor_c, label: Power Factor C, table: holding, address: 28, type: u16, scale: 0.001, models: [wem3046t, wem3050t, wem3063t, wem3080t], note: Unsigned in the project (no sign or inductive/capacitive information decoded).}
  - {key: frequency, label: Frequency, table: holding, address: 30, type: u16, unit: Hz, scale: 0.01, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.total_power, label: Total Power, table: holding, address: 32, type: s32, unit: W, scale: 0.1, models: [wem3046t, wem3063t]}
