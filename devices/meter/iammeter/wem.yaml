modbusspec: 0
id: iammeter-wem
manufacturer: IAMMETER
name: WEM energy meters (Modbus TCP)
kind: meter

sources:
- id: iammeter-modbus
  title: ha_iammeter_modbus (Home Assistant integration)
  url: https://github.com/lewei50/ha_iammeter_modbus
  license: Apache-2.0
  commit: 209d8c86f910498871b3d38ff5984c45808107ff
  path: custom_components/iammeter_modbus/__init__.py, custom_components/iammeter_modbus/const.py, custom_components/iammeter_modbus/models.py,
    custom_components/iammeter_modbus/scales.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - iammeter-modbus

models:
  - {id: wem3080, name: WEM3080, match: {table: holding, address: 9, type: u16, equals: 1}}
  - {id: wem3080t, name: WEM3080T, match: {table: holding, address: 9, type: u16, equals: 2}}
  - {id: wem3046t, name: WEM3046T, match: {table: holding, address: 9, type: u16, equals: 3}}
  - {id: wem3050t, name: WEM3050T, match: {table: holding, address: 9, type: u16, equals: 4}}
  - {id: wem2067, name: WEM2067, match: {table: holding, address: 9, type: u16, equals: 5}}
  - {id: wem3063t, name: WEM3063T, match: {table: holding, address: 9, type: u16, equals: 6}}

points:
  - {key: l1_voltage, label: Voltage, table: holding, address: 0, type: u16, unit: V, scale: 0.01, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080, wem3080t]}
  - {key: l1_current, label: Current, table: holding, address: 1, type: u16, unit: A, scale: 0.01, models: [wem2067, wem3050t, wem3080, wem3080t]}
  - {key: l1_current, label: Current A, table: holding, address: 1, type: u16, unit: A, scale: 0.001, models: [wem3046t, wem3063t]}
  - {key: x.power_a, label: Power, table: holding, address: 2, type: s32, unit: W, models: [wem2067, wem3050t, wem3080, wem3080t]}
  - {key: x.power_a, label: Power A, table: holding, address: 2, type: s32, unit: W, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: grid_import_energy, label: Import Energy, table: holding, address: 4, type: u32, unit: kWh, scale: 0.0003125, models: [wem3080]}
  - {key: x.import_energy_a, label: Import Energy A, table: holding, address: 4, type: u32, unit: kWh, scale: 0.00125, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: grid_export_energy, label: Export Energy, table: holding, address: 6, type: u32, unit: kWh, scale: 0.0003125, models: [wem3080]}
