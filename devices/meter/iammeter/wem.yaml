  - {key: x.reactive_power_b, label: Reactive Power B, table: holding, address: 44, type: s32, unit: var, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: x.reactive_power_b, label: Reactive Power B, table: holding, address: 44, type: s32, unit: var, models: [wem2067, wem3050t, wem3080t]}
  - {key: x.inductive_kvarh_b, label: Inductive KVARH B, table: holding, address: 46, type: u32, unit: kvarh, scale: 0.001, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.capacitive_kvarh_b, label: Capacitive KVARH B, table: holding, address: 48, type: u32, unit: kvarh, scale: 0.001, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.reactive_power_c, label: Reactive Power C, table: holding, address: 50, type: s32, unit: var, scale: 0.1, models: [wem3046t, wem3063t]}
  - {key: x.reactive_power_c, label: Reactive Power C, table: holding, address: 50, type: s32, unit: var, models: [wem3050t, wem3080t]}
  - {key: x.inductive_kvarh_c, label: Inductive KVARH C, table: holding, address: 52, type: u32, unit: kvarh, scale: 0.001, models: [wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: x.capacitive_kvarh_c, label: Capacitive KVARH C, table: holding, address: 54, type: u32, unit: kvarh, scale: 0.001, models: [wem3046t, wem3050t, wem3063t, wem3080t]}
