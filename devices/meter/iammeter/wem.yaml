  - {key: x.power_factor_a, label: Power Factor A, table: holding, address: 8, type: u16, scale: 0.001, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t], note: Unsigned in the project (no sign or inductive/capacitive information decoded).}
  - {key: x.model_id, label: Meter model, table: holding, address: 9, type: u16, enum: model}
  - {key: l2_voltage, label: Voltage B, table: holding, address: 10, type: u16, unit: V, scale: 0.01, models: [wem2067, wem3046t, wem3050t, wem3063t, wem3080t]}
  - {key: l2_current, label: Current B, table: holding, address: 11, type: u16, unit: A, scale: 0.001, models: [wem3046t, wem3063t]}
