enums:
  rotation_field: {'1': Right, '0': None, '-1': Left}

notes:
- 'The list says the listed addresses deliver big-endian data and that the same values little-endian are at address + 32768. It doesn''t say whether they are 0-based; the addresses are used as listed, as protocol addresses (unverified).'
- 'Values in float format include the transformer ratios; short-format values don''t.'
- Unlike other UMG lists, this one types the rotation field at 19052 as a 32-bit integer and names 19044–19048 power factor.
- RS485 rates, parity and stop bits are settable (registers 1 and 2), so no serial default is given.
- 'No identify: nothing in the list tells this device from other UMG analysers that use the same 19000 block; a reader picks this file by hand.'
- 'Transport isn''t stated in the list; RS485 follows the product, unverified. TCP port 502, unit id 1 and 125 registers per request are not stated in the list; assumed.'
- 'Left out: mean, minimum and maximum values, harmonics, tariffs other than noted, transformer and network settings, inputs and outputs, and the rest of the list; the list has far more registers than this file.'
