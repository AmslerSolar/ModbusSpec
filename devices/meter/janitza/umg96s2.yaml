  - {key: x.l2_reactive_power, label: reactive power L2, table: holding, address: 19038, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: reactive power L3, table: holding, address: 19040, type: f32, unit: var}
  - {key: reactive_power, label: reactive power sum, table: holding, address: 19042, type: f32, unit: var}
  - {key: x.l1_power_factor, label: power factor L1, table: holding, address: 19044, type: f32}
  - {key: x.l2_power_factor, label: power factor L2, table: holding, address: 19046, type: f32}
