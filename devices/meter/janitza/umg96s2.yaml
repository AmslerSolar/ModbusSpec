  - {key: x.net_energy, label: active energy sum, table: holding, address: 19060, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_import_energy, label: 'active energy L1, consumed', table: holding, address: 19062, type: f32, unit: kWh, scale: 0.001, poll: slow}
