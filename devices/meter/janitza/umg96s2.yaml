modbusspec: 0
id: janitza-umg96s2
manufacturer: Janitza
name: UMG 96-S2 energy analyser
kind: meter

sources:
- title: 'Janitza UMG 96-S2 Modbus-address list and Formulary, doc. no. 2.062.026.1.d'
  version: 06/2025
  url: https://assets.janitza.com/ce18jq9ih0x6/3cebf6c6c77c84c522119a/f47898f06dfabb379ddeee9ecde26d51/janitza-mal-umg96-s2-en.pdf
  sha256: f3438ef574876ab1693a7bb0fef5ea505df82892debc1688bea15d25c9223a32
  number: 2.062.026.1.d
  language: en

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

points:
