connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
  - table: holding
    address: 10176
    type: u32
    models:
    - umg604pro
  - table: holding
    address: 754
    type: u32
    models:
    - umg96rm
  checks:
  - table: holding
    address: 19050
    type: f32
    range:
    - 0
    - 70
  # rotation field: rejects word-swapped floats
  - table: holding
    address: 19052
    type: f32
    in:
    - -1
    - 0
    - 1
  any:
  - table: holding
    address: 10072
    type: str
    length: 32
    printable: true
  # module number and a serial: a meter answering 0 everywhere (an SDM630 does) is no 96RM
  - - table: holding
      address: 761
      type: u16
      in:
      - 0
      - 1
      - 2
      - 3
    - table: holding
      address: 754
      type: u32
      not: 0

