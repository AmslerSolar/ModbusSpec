notes:
- The lists name function 03 and 04 as slave functions. Addresses are used as listed; the lists don't say outright whether
  they are 0-based; they are assumed to be protocol addresses (unverified).
- The listed addresses deliver big-endian data (high byte and, for floats, high word first); the same values little-endian
  are at address + 32768. Floats already include the transformer ratios.
- The block 19000–19120 holds the frequently needed readings in all three lists.
- 'Telling the models apart: a printable device name at 10072 means a 604-PRO; otherwise a module number 0–3 at 761 means
  a 96RM, with module 1 / 2 / 3 meaning -P / -CBM / -E (inferred from the module names, unverified). On the 604-PRO, 761 is
  the high word of an FFT power float and can read 0–3, hence the order. A 604-PRO with an empty device name can''t be recognised.'
- The UMG 604-PRO's RS485 runs 8 data bits, no parity, 2 stop bits. The lists give no default Modbus address; 1 is assumed.
- No daily counters.
- Models openems_umg96pql, openems_umg801, openems_umg806, openems_umg604, openems_umg104, openems_umg511 come from projects
  and are listed after a model without a match, so detection never reaches them; their points apply only when a reader selects
  such a model by hand.
- mbmd reads this register map from Janitza's B-series meters (the B23 variant with Modbus); it is the same 19000-range float
  block as the UMG analysers.
- mbmd (type code JANITZA) detects the meter by reading L1 Voltage (holding register 19000, f32); its bus scan accepts a value
  within 10% of 110 or 230 V.
- 'UMG 801: current, power, frequency and energy addresses are for measurement 1 (the driver''s default); measurement 2 and
  up start at 19200 + (n − 2) × 100 instead of 19012.'
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Identification as mbmd recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
