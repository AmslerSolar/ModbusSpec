notes:
- The list names function 03 for reading and 06, 16, 23 for writing, and promises big-endian data (high byte first). It says nothing about whether addresses count from 0. Addresses are used as listed and taken as protocol addresses, unverified.
- 'The list has an 8-bit type (char) with one address per value, so each sits in a register of its own. It is read here as u16, assuming the upper byte is 0. Identification leans on this at 916 and 917. Unverified. The device type register (915) has no listed values, so identification can''t use it.'
- 'Twenty current channels are listed, I1 to I20. Registers 916 and 917 count up to 16 20CM-CT6 modules, but the list holds no channels beyond I20, so module channels aren''t described here.'
- 'The list doesn''t give the sign of the real power. A branch monitor has no grid connection of its own, so no grid_power key is used; which voltage each channel uses for power is set at 3080 to 3099 (0 V1-VN, 1 V2-VN, 2 V3-VN, 3 V2-V1, 4 V3-V2, 5 V1-V3). Power factor and cos(Phi) are listed as −1 to +1, no sign meaning given.'
- Channel values go up by 2 registers per channel. Voltage values are in the order V1-VN, V2-VN, V3-VN, V2-V1, V3-V2, V1-V3, so the line-to-line voltages are named that way round here. The registers update every 200 ms.
- 'RS485: 8 data bits, no parity, 1 stop bit; rates 9600, 19200, 38400, 57600, 115200 and 921600 baud, no default given. The list mentions no Modbus TCP, so only RTU is listed. Port 502, unit id 1 and 125 registers per request are assumed.'
- Many registers are left out (error details at 704 to 713, clock, fundamental current and voltage, phase angles, extreme values with time stamps, resets, sum channel setup and faults, analysis channel with crest factor, THD and harmonics, voltage error states, settings for transformers, burden, limits and channels, communication settings and output assignments, comment strings, recording, calibration and firmware update).
