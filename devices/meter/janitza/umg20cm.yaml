# Written from the Janitza UMG 20 CM Modbus address list (firmware 14.18, doc. no. 33.03.311.MOD-V3).

modbusspec: 0
id: janitza-umg20cm
manufacturer: Janitza
name: UMG 20 CM branch current monitor
kind: meter

sources:
- title: Janitza UMG 20 CM Power Analyser, Modbus Address List, doc. no. 33.03.311.MOD-V3
  version: firmware 14.18
  url: https://assets.janitza.com/ce18jq9ih0x6/9f1491f9603bb977fa58c2/3cdacf8b302c5550853015e7ed928cae/janitza-mal-umg20cm_en.pdf
  sha256: 53cf0ec02a572294125165bc761e985a257cb851691526bfbba9379b8ec01300

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    format: 8N1
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

identify:
  serial:
    table: holding
    address: 911
    type: u32
  checks:
  # serial number: a device answering every register with 0 isn't this one
  - table: holding
    address: 911
    type: u32
    not: 0
  # mains frequency: rejects word-swapped floats
  - table: holding
    address: 1272
    type: f32
    range:
    - 0
    - 70
  # expected and detected 20CM-CT6 modules
  - table: holding
    address: 916
    type: u16
    range:
    - 0
    - 16
  - table: holding
    address: 917
    type: u16
    range:
    - 0
    - 16
  # voltage V1-VN
  - table: holding
    address: 1000
    type: f32
    range:
    - 0
    - 1000

points:
  # Identity and status
  - {key: serial, label: Serial number, table: holding, address: 911, type: u32, poll: slow}
  - {key: firmware, label: Firmware version, table: holding, address: 913, type: s16, poll: slow, note: 'High byte functional range, low byte bug fix.'}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 914, type: u16, poll: slow}
  - {key: x.device_type, label: Device type, table: holding, address: 915, type: u16, poll: slow, note: The list gives no values.}
  - {key: x.expected_modules, label: Expected number of modules, table: holding, address: 916, type: u16, poll: slow}
  - {key: x.detected_modules, label: Number of detected modules, table: holding, address: 917, type: u16, poll: slow}
  - {key: x.device_faults, label: Device faults, table: holding, address: 703, type: u16}
  - {key: x.under_current_faults, label: Under current faults, table: holding, address: 2180, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.over_current_faults, label: Over current faults, table: holding, address: 2182, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.overdrive_faults, label: Overdrive faults, table: holding, address: 2184, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.under_current_warnings, label: Under current warnings, table: holding, address: 2186, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.over_current_warnings, label: Over current warnings, table: holding, address: 2188, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.ct_faults, label: Current transformer faults, table: holding, address: 2190, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}
  - {key: x.amplifier_faults, label: Amplifier faults, table: holding, address: 2192, type: u32, note: 'Bit 0 to 19: channel I1 to I20.'}

