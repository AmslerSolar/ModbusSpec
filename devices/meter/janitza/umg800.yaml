  # Voltage transformer ratio
  - {key: x.vt_primary, label: 'Device/Measurements/UG/TransformerRatio[0]', table: holding, address: 33000, type: f32, poll: slow, note: Also at 1664 and 1000 further per group; only this row has the comment calling it primary.}
  - {key: x.vt_secondary, label: 'Device/Measurements/UG/TransformerRatio[1]', table: holding, address: 33002, type: f32, poll: slow, note: Also at 1666 and 1000 further per group; only this row has the comment calling it secondary.}

notes:
- The UMG 800 keeps its Modbus map in a file. This file follows the fixed DefaultList; a device set to one of the two customer lists
  (CustomListA, CustomListB) answers differently, and this file does not apply. The maker adds that the real addresses also depend on the
  modules fitted and that the device's own web page has the exact list.
- The list gives no units, no signs and no value meanings for state, kind or rotation field; its scale column has no function. Units here
  come from the quantity names and from the UMG 801 list, where the same quantities are given (V, A, W, VA, var, Hz, and Wh for energy).
  That is why energy is read with scale 0.001. All of this is unverified.
- The sign of the power registers is not stated. `positive` import is an assumption, following the UMG 801 formulary.
- The list and its description say nothing about function codes, byte order, or whether addresses count from 0. Addresses are used as listed
  and taken as protocol addresses, with function 03 and big-endian data assumed. Address 0 is in the list, which fits 0-based counting.
- 'String length is taken in registers: the description reckons (length x size) / 2 without giving the size of a character, and the next row''s address leaves room for 32 registers
  for the name (0 to 31) and 8 for the software version (32 to 39), so a length of 32 is read as 32 registers, unverified. UInt64 rows say length 1 and take 4 registers.'
- 'Further measurement groups: the values of group 1 repeat at 1000 per group, for virtual meter groups up to 32 (group 2 current I1 at 2012,
  group 32 at 32012). Each group''s block also repeats the voltages and frequency. Module identity: 56 registers per module from 54, modules 1 to 13
  (state of module 1 at 98, of module 2 at 154). Digital inputs of modules from 37000. Harmonics of the voltage from 42000.'
- Each group has a 16-register name at 966 past the group's thousand (1966 for group 1), not included here.
- 'Connection: the documents give no serial parameters, port or unit. TCP port 502, unit id 1, 125 registers per request and the transports listed are assumed.'
- Many registers are left out (group 2 to 32, module identity and inputs, mean, minimum and maximum values with their time stamps, harmonics, the fourth current's other values, distortion and TDD, load percentage, complex current, tariffs other than Base, virtual measurements, comparators, current
  transformer ratios).
