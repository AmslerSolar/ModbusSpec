  - {key: x.inductive_reactive_energy, label: Device/VirtualMeter/Group1/Energies/Base/WQ_ConsInd, table: holding, address: 1104, type: f32, unit: kvarh, scale: 0.001, poll: slow, note: 'Unit assumed, as for the real energy.'}
