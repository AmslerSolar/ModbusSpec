# Written from the Janitza UMG 96-PQ-L Modbus address list from firmware 3.57 (doc. no. 2.061.072.1.e, 07/2025).

modbusspec: 0
id: janitza-umg96pql
manufacturer: Janitza
name: UMG 96-PQ-L / 96-PQ-L-LP power analyser
kind: meter

sources:
- title: 'Janitza UMG 96-PQ-L, UMG 96-PQ-L-LP Modbus address list, from firmware 3.57, doc. no. 2.061.072.1.e'
  version: 07/2025
  url: https://assets.janitza.com/ce18jq9ih0x6/50c92d51258e696c431039/afd98b7a611f6e4bd87f08b25d555db6/janitza-mal-umg96pq-l-en.zip
  sha256: 7bd49d8e57fc77775d1a5ad11fc091a67c2af108bb245ad64e3260548ebbc685   # of the ZIP; the list is 20610721e-mal-umg96pq-l-en_3.57.pdf inside it
  number: 2.061.072.1.e
  language: en

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 911
    type: u32
  checks:
  - table: holding
    address: 19050
    type: f32
    range:
    - 0
    - 70
  - table: holding
    address: 19052
    type: f32
    in:
    - -1
    - 0
    - 1
  - table: holding
    address: 25000
    type: str
    length: 32
    printable: true
  - table: holding
    address: 911
    type: u32
    not: 0

points:
  # Frequently required readings, 19000–19120
  - {key: l1_voltage, label: Voltage L1-N, table: holding, address: 19000, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2-N, table: holding, address: 19002, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3-N, table: holding, address: 19004, type: f32, unit: V}
  - {key: x.l1_l2_voltage, label: Voltage L1-L2, table: holding, address: 19006, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Voltage L2-L3, table: holding, address: 19008, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Voltage L3-L1, table: holding, address: 19010, type: f32, unit: V}
  - {key: l1_current, label: 'Current, L1', table: holding, address: 19012, type: f32, unit: A}
  - {key: l2_current, label: 'Current, L2', table: holding, address: 19014, type: f32, unit: A}
  - {key: l3_current, label: 'Current, L3', table: holding, address: 19016, type: f32, unit: A}
  - {key: x.neutral_current, label: 'Vector sum, IN=I1+I2+I3', table: holding, address: 19018, type: f32, unit: A}
  - {key: l1_power, label: Real power L1, table: holding, address: 19020, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l2_power, label: Real power L2, table: holding, address: 19022, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l3_power, label: Real power L3, table: holding, address: 19024, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: grid_power, label: 'Sum, Psum3=P1+P2+P3', table: holding, address: 19026, type: f32, unit: W, positive: import, verified: false, note: 'The list doesn''t state which way the power registers are positive. Taken like the other UMG analysers (P > 0 drawn from the grid at the grid connection); unverified.'}
  - {key: x.l1_apparent_power, label: Apparent power L1, table: holding, address: 19028, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Apparent power L2, table: holding, address: 19030, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Apparent power L3, table: holding, address: 19032, type: f32, unit: VA}
  - {key: apparent_power, label: 'Sum, Ssum3=S1+S2+S3', table: holding, address: 19034, type: f32, unit: VA}
  - {key: x.l1_reactive_power, label: Reactive power (mains frequ.) L1, table: holding, address: 19036, type: f32, unit: var}
  - {key: x.l2_reactive_power, label: Reactive power (mains frequ.) L2, table: holding, address: 19038, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: Reactive power (mains frequ.) L3, table: holding, address: 19040, type: f32, unit: var}
  - {key: reactive_power, label: 'Sum, Qsum3=Q1+Q2+Q3', table: holding, address: 19042, type: f32, unit: var}
  - {key: x.l1_cos_phi, label: 'Power factor fundamental oscill., Cos(ϕ), UL1', table: holding, address: 19044, type: f32}
  - {key: x.l2_cos_phi, label: 'Power factor fundamental oscill., Cos(ϕ),, UL2', table: holding, address: 19046, type: f32}
  - {key: x.l3_cos_phi, label: 'Power factor fundamental oscill., Cos(ϕ),, UL3', table: holding, address: 19048, type: f32}
  - {key: frequency, label: Measured frequency, table: holding, address: 19050, type: f32, unit: Hz}
  - {key: x.rotation_field, label: 'Rotation field, 1=right, 0=none, -1=left', table: holding, address: 19052, type: f32, enum: rotation_field}
  - {key: x.l1_net_energy, label: 'Real energy L1, consumed', table: holding, address: 19054, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_net_energy, label: 'Real energy L2, consumed', table: holding, address: 19056, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_net_energy, label: 'Real energy L3, consumed', table: holding, address: 19058, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.net_energy, label: Real energy L1..L3, table: holding, address: 19060, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_import_energy, label: 'Real energy L1, consumed', table: holding, address: 19062, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_import_energy, label: 'Real energy L2, consumed', table: holding, address: 19064, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_import_energy, label: 'Real energy L3, consumed', table: holding, address: 19066, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.import_energy_t1, label: 'Real energy L1..L3, consumed, rate 1', table: holding, address: 19068, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_export_energy, label: 'Real energy L1, delivered', table: holding, address: 19070, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_export_energy, label: 'Real energy L2, delivered', table: holding, address: 19072, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_export_energy, label: 'Real energy L3, delivered', table: holding, address: 19074, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_apparent_energy, label: Apparent energy L1, table: holding, address: 19078, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l2_apparent_energy, label: Apparent energy L2, table: holding, address: 19080, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l3_apparent_energy, label: Apparent energy L3, table: holding, address: 19082, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.apparent_energy, label: Apparent energy L1..L3, table: holding, address: 19084, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l1_reactive_energy, label: 'Reactive energy, inductive, L1', table: holding, address: 19086, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l2_reactive_energy, label: 'Reactive energy, inductive, L2', table: holding, address: 19088, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_reactive_energy, label: 'Reactive energy, inductive, L3', table: holding, address: 19090, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.reactive_energy, label: Reactive energy L1..L3, table: holding, address: 19092, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_inductive_reactive_energy, label: 'Reactive energy, inductive, L1', table: holding, address: 19094, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l2_inductive_reactive_energy, label: 'Reactive energy, inductive, L2', table: holding, address: 19096, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_inductive_reactive_energy, label: 'Reactive energy, inductive, L3', table: holding, address: 19098, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.inductive_reactive_energy, label: 'Reactive energy L1..L3, ind.', table: holding, address: 19100, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L1', table: holding, address: 19102, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l2_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L2', table: holding, address: 19104, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L3', table: holding, address: 19106, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.capacitive_reactive_energy, label: 'Reactive energy L1..L3, cap.', table: holding, address: 19108, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_thd_u, label: 'Harmonic, THD,U L1-N', table: holding, address: 19110, type: f32, unit: '%'}
  - {key: x.l2_thd_u, label: 'Harmonic, THD,U L2-N', table: holding, address: 19112, type: f32, unit: '%'}
  - {key: x.l3_thd_u, label: 'Harmonic, THD,U L3-N', table: holding, address: 19114, type: f32, unit: '%'}
  - {key: x.l1_thd_i, label: 'Harmonic, THD,I L1', table: holding, address: 19116, type: f32, unit: '%'}
  - {key: x.l2_thd_i, label: 'Harmonic, THD,I L2', table: holding, address: 19118, type: f32, unit: '%'}
  - {key: x.l3_thd_i, label: 'Harmonic, THD,I L3', table: holding, address: 19120, type: f32, unit: '%'}

  # Totals and identity
  - {key: grid_import_energy, label: 'Active energy sum, consumed', table: holding, address: 5006, type: f32, unit: kWh, scale: 0.001, poll: slow, note: The 19000 block only has the rate 1 part of this counter (19068).}
  - {key: grid_export_energy, label: 'Active energy sum, delivered', table: holding, address: 5078, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 911, type: u32, poll: slow}
  - {key: x.device_name, label: Device name, table: holding, address: 25000, type: str, poll: slow, length: 32, note: Freely programmable; only its first 64 characters are read here.}

enums:
  rotation_field: {'1': Right, '0': None, '-1': Left}

notes:
- 'The list says the listed addresses deliver big-endian data and that the same values little-endian are at address + 32768. It doesn''t say whether they are 0-based; the addresses are used as listed, as protocol addresses (unverified).'
- 'Values in float format include the transformer ratios; short-format values don''t.'
- The ZIP also holds a spreadsheet of the same list.
- The base device is RS485 (framing settable); other interfaces come with options, unverified. TCP port 502, unit id 1 and 125 registers per request are not stated in the list; assumed.
- 'Left out: mean, minimum and maximum values, harmonics, tariffs other than noted, transformer and network settings, inputs and outputs, and the rest of the list; the list has far more registers than this file.'
