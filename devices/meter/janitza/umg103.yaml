modbusspec: 0
id: janitza-umg103
manufacturer: Janitza
name: UMG 103 / UMG 103-CBM DIN rail meter
kind: meter

sources:
- title: 'Janitza UMG 103 Modbus-address list and Formulary, doc. no. 1.036.020.6.i'
  version: 06/2021
  url: https://assets.janitza.com/ce18jq9ih0x6/edc5dae41da20f8888beb3/2f1b4e9fbb7542ecb362f8edac5b1a67/janitza-mal-umg103-en.pdf
