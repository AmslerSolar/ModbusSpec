notes:
- 'The list says the listed addresses deliver big-endian data and that the same values little-endian are at address + 32768. It doesn''t say whether they are 0-based; the addresses are used as listed, as protocol addresses (unverified).'
- 'Values in float format include the transformer ratios; short-format values don''t.'
- The firmware 2 list is German only. The block at 19000–19120 and the energy totals at 5006 / 5078 are the same in all three lists; where a difference is known a point carries `models`.
- 'Choose the model by firmware: fw1 up to 1.12, fw2 from 2.0, fw3 from 3.54.'
- 'No identify: nothing in these lists tells this device from other UMG analysers; a reader picks this file by hand.'
- The base device is RS485 (framing settable); Ethernet comes from an optional module, unverified. TCP port 502, unit id 1 and 125 registers per request are not stated in the list; assumed.
- 'Left out: mean, minimum and maximum values, harmonics, tariffs other than noted, transformer and network settings, inputs and outputs, and the rest of the list; the list has far more registers than this file.'
