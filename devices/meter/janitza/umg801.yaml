modbusspec: 0
id: janitza-umg801
manufacturer: Janitza
name: UMG 801 modular power analyser
kind: meter

sources:
- title: Janitza UMG 801 and modules, Modbus address list (janitza-mal-umg801-table.xlsx, doc. no. 2.053.265.1.a) and formulary (doc. no. 2.053.016.1.b, from firmware 1.6.2); ZIP
  version: 06/2025
  url: https://assets.janitza.com/ce18jq9ih0x6/9oFDAvRhKg0ChTkaMScHy/454f74bd5ff65e3a5c2146eeeeee2673/janitza-mal-umg801-de-en.zip
  sha256: adf9899c34cc1a95a3fadfad675eee0cd8bf9cebb590c05048b179f05796f099  # of the ZIP

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    format: 8N2
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

identify:
  serial:
    table: holding
    address: 4174
    type: u64
  checks:
  # device name: registers filled with text
  - table: holding
    address: 4100
    type: str
    length: 32
    printable: true
  # device state
  - table: holding
    address: 4168
    type: u16
    in:
    - 0
    - 1
    - 2
    - 3
    - 4
  # device type
  - table: holding
    address: 4169
    type: u16
    in:
    - 0
    - 1
  # mains frequency
  - table: holding
    address: 19050
    type: f32
    range:
    - 0
    - 70

points:
  # Identity and state
  - {key: x.device_name, label: Name, table: holding, address: 4100, type: str, length: 32, poll: slow, note: 32 registers by the list's spacing; content not stated.}
  - {key: firmware, label: firmware version, table: holding, address: 4132, type: str, length: 32, poll: slow, note: 32 registers by the list's spacing.}
  - {key: x.hardware_version, label: hardware version, table: holding, address: 4164, type: u64, poll: slow}
  - {key: state, label: state, table: holding, address: 4168, type: u16, enum: state}
  - {key: x.device_type, label: device type, table: holding, address: 4169, type: u16, enum: device_type, poll: slow}
  - {key: x.product_number, label: product number, table: holding, address: 4170, type: u64, poll: slow}
  - {key: serial, label: serial number, table: holding, address: 4174, type: u64, poll: slow}

  # Voltages, for all measuring groups
  - {key: l1_voltage, label: Voltage L1-N, table: holding, address: 19000, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2-N, table: holding, address: 19002, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3-N, table: holding, address: 19004, type: f32, unit: V}
  - {key: x.l1_l2_voltage, label: Voltage L1-L2, table: holding, address: 19006, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Voltage L2-L3, table: holding, address: 19008, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Voltage L3-L1, table: holding, address: 19010, type: f32, unit: V}
  - {key: x.voltage_unbalance, label: Voltage Symmetric Unbalance in percent., table: holding, address: 21445, type: f32, unit: '%'}
  - {key: x.voltage_ln_average, label: Average Voltage ULN, table: holding, address: 21447, type: f32, unit: V}
  - {key: x.voltage_ll_average, label: Average Voltage ULL, table: holding, address: 21449, type: f32, unit: V}
  - {key: x.l1_thd_u, label: 'Harmonic, THD,U L1-N', table: holding, address: 19110, type: f32, unit: '%'}
  - {key: x.l2_thd_u, label: 'Harmonic, THD,U L2-N', table: holding, address: 19112, type: f32, unit: '%'}
  - {key: x.l3_thd_u, label: 'Harmonic, THD,U L3-N', table: holding, address: 19114, type: f32, unit: '%'}

  # Basic device, measuring group 1
  - {key: l1_current, label: 'Current, I1', table: holding, address: 19012, type: f32, unit: A}
  - {key: l2_current, label: 'Current, I2', table: holding, address: 19014, type: f32, unit: A}
  - {key: l3_current, label: 'Current, I3', table: holding, address: 19016, type: f32, unit: A}
  - {key: x.i4_current, label: 'Current, I4', table: holding, address: 19018, type: f32, unit: A}
  - {key: x.neutral_current, label: The calculated neutral line current of the measurement group 1, table: holding, address: 24662, type: f32, unit: A}
  - {key: x.current_sum, label: The RMS Current sum of the measurement group 1, table: holding, address: 24668, type: f32, unit: A}
  - {key: l1_power, label: Active power P1, table: holding, address: 19020, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l2_power, label: Active power P2, table: holding, address: 19022, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l3_power, label: Active power P3, table: holding, address: 19024, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: grid_power, label: Sum; Psum3=P1+P2+P3, table: holding, address: 19026, type: f32, unit: W, positive: import, verified: false, note: 'The list doesn''t give the sign of the power registers. The formulary gives cos phi (P1 / S1) a − sign when supplying and a + sign when obtaining real power, so P > 0 is drawn from the grid when the analyser sits at the grid connection. Derived.'}
  - {key: x.i4_power, label: Active power P4, table: holding, address: 21500, type: f32, unit: W, note: Fourth input of the group; the totals above don't include it.}
  - {key: x.l1_apparent_power, label: Apparent power S1, table: holding, address: 19028, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Apparent power S2, table: holding, address: 19030, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Apparent power S3, table: holding, address: 19032, type: f32, unit: VA}
  - {key: apparent_power, label: Sum; Ssum3=S1+S2+S3, table: holding, address: 19034, type: f32, unit: VA}
  - {key: x.l1_reactive_power_fund, label: Reactive power (fundamental frequency) Q1, table: holding, address: 19036, type: f32, unit: var}
  - {key: x.l2_reactive_power_fund, label: Reactive power (fundamental frequency) Q2, table: holding, address: 19038, type: f32, unit: var}
  - {key: x.l3_reactive_power_fund, label: Reactive power (fundamental frequency) Q3, table: holding, address: 19040, type: f32, unit: var}
  - {key: x.reactive_power_fund, label: Sum; Qsum3=Q1+Q2+Q3, table: holding, address: 19042, type: f32, unit: var}
  - {key: reactive_power, label: Reactive power measuring group 1 basic device, table: holding, address: 21451, type: f32, unit: var}
  - {key: x.fund_power, label: Fundamental real power measuring group 1 basic device, table: holding, address: 21457, type: f32, unit: W}
  - {key: x.l1_cos_phi, label: 'Fund.power factor, Cos(ϕ); UL1 IL1', table: holding, address: 19044, type: f32, note: '− when supplying, + when obtaining real power.'}
  - {key: x.l2_cos_phi, label: 'Fund.power factor, Cos(ϕ); UL2 IL2', table: holding, address: 19046, type: f32}
  - {key: x.l3_cos_phi, label: 'Fund.power factor, Cos(ϕ); UL3 IL3', table: holding, address: 19048, type: f32}
  - {key: x.cos_phi, label: Fundamental power factor (CosPhi) measuring group 1 basic device, table: holding, address: 21469, type: f32, note: '− when supplying, + when obtaining real power.'}
  - {key: power_factor, label: Power factor measuring group 1 basic device, table: holding, address: 21463, type: f32, note: The formulary says the power factor is unsigned.}
  - {key: x.l1_power_factor, label: The power factor L1, table: holding, address: 22240, type: f32}
  - {key: x.l2_power_factor, label: The power factor L2, table: holding, address: 22242, type: f32}
  - {key: x.l3_power_factor, label: The power factor L3, table: holding, address: 22244, type: f32}
  - {key: frequency, label: Frequency, table: holding, address: 19050, type: f32, unit: Hz}
  - {key: x.rotation_field, label: 'Rotary field; 1=right, 0=none, -1=left', table: holding, address: 19052, type: s32, enum: rotation_field, verified: false, note: 'Type RotationFieldKind in the list, two registers by its spacing; read as a signed 32-bit integer, assumed.'}
  - {key: x.current_unbalance, label: Current Unbalance measuring group 1 basic device, table: holding, address: 21475, type: f32, unit: '%'}
  - {key: x.l1_thd_i, label: 'Harmonic, THD, I1', table: holding, address: 19116, type: f32, unit: '%'}
  - {key: x.l2_thd_i, label: 'Harmonic, THD, I2', table: holding, address: 19118, type: f32, unit: '%'}
  - {key: x.l3_thd_i, label: 'Harmonic, THD, I3', table: holding, address: 19120, type: f32, unit: '%'}

  # Basic device, measuring group 1: energy (Wh, VAh, varh in the list, read as k-units)
  - {key: x.l1_net_energy, label: Active energy W1, table: holding, address: 19054, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_net_energy, label: Active energy W2, table: holding, address: 19056, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_net_energy, label: Active energy W3, table: holding, address: 19058, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.net_energy, label: Active energy W1..W3, table: holding, address: 19060, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_import_energy, label: 'Active energy W1, related', table: holding, address: 19062, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_import_energy, label: 'Active energy W2, drawn', table: holding, address: 19064, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_import_energy, label: 'Active energy W3, purchased', table: holding, address: 19066, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: grid_import_energy, label: 'Active energy W1..W3, purchased, tariff 1', table: holding, address: 19068, type: f32, unit: kWh, scale: 0.001, verified: false, note: 'The list names this total for tariff 1 and has no other consumed total for L1 to L3; it covers the whole consumption only with one tariff, which isn''t stated.'}
  - {key: x.l1_export_energy, label: 'Active energy W1, supplied', table: holding, address: 19070, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_export_energy, label: 'Active energy W2, supplied', table: holding, address: 19072, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_export_energy, label: 'Active energy W3, supplied', table: holding, address: 19074, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: grid_export_energy, label: 'Active energy W1..W3, supplied', table: holding, address: 19076, type: f32, unit: kWh, scale: 0.001}
  - {key: x.l1_apparent_energy, label: Apparent energy WS1, table: holding, address: 19078, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l2_apparent_energy, label: Apparent energy WS2, table: holding, address: 19080, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l3_apparent_energy, label: Apparent energy WS3, table: holding, address: 19082, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.apparent_energy, label: Apparent energy WS1..WS3, table: holding, address: 19084, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l1_reactive_energy, label: Reactive energy WQ1, table: holding, address: 19086, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l2_reactive_energy, label: Reactive energy WQ2, table: holding, address: 19088, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_reactive_energy, label: Reactive energy WQ3, table: holding, address: 19090, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.reactive_energy, label: Reactive energy WQ1..WQ3, table: holding, address: 19092, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.inductive_reactive_energy, label: 'Reactive energy WQ1..WQ3, inductive', table: holding, address: 19100, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.capacitive_reactive_energy, label: 'Reactive energy WQ1..WQ3, capacitive', table: holding, address: 19108, type: f32, unit: kvarh, scale: 0.001, poll: slow}

  # Transformers, events
  - {key: x.vt_primary, label: 'Voltage transformer, primary', table: holding, address: 24200, type: f32, poll: slow}
  - {key: x.vt_secondary, label: 'Voltage transformer, secondary', table: holding, address: 24202, type: f32, poll: slow}
  - {key: x.ct_primary_l1, label: 'Current transformer, primary - L1', table: holding, address: 24204, type: f32, poll: slow}
  - {key: x.ct_secondary_l1, label: 'Current transformer, secondary - L1', table: holding, address: 24206, type: f32, poll: slow}
  - {key: x.event_counter, label: Event Counter, table: holding, address: 41500, type: u32, poll: slow}
  - {key: x.transient_counter, label: Transients Counter, table: holding, address: 41502, type: u32, poll: slow}
  - {key: x.active_event_flags, label: Active Event Flags, table: holding, address: 41504, type: u64}

enums:
  state: {'0': unavailable, '1': initializing device, '2': initializing modules, '3': operating, '4': error}
  device_type: {'0': 5 A, '1': undefined}
  rotation_field: {'1': Right, '0': None, '-1': Left}

problems:
- when: {key: state, equals: 4}
  kind: fault
  text: Device reports an error state (4)

notes:
- The formulary names functions 03 and 04 for reading and 06, 16, 23 for writing, and promises big-endian data (high byte first). The list says nothing about
  whether addresses count from 0. Addresses are used as listed and taken as protocol addresses, unverified.
- Float and integer values include the transformer ratios; short values don't. The registers update every 200 ms.
- 'Strings have no length in the list; the 32 registers come from the distance to the next row. The list has its own type RotationFieldKind for the rotation field.'
- 'Further measuring groups repeat the layout of the basic device''s group 1 at 19012, without frequency and rotation field and without the voltage THD: group 2 of the
  basic device at 19200, group 3 at 19300, current modules from 19400 at 100 per group (group n at 19400 + 100 x (n − 1), up to group 20 at 21300). Each has the
  currents at +0, the real powers at +8, the sum at +14, apparent power at +16, reactive power at +24, cos phi at +32 and the energies from +38. Group 1''s fourth input and
  its energies are at 21500 to 21520.'
- 'In the list, the rows at 21000 to 21098 are labelled current module group 18 where group 17 belongs, by mistake judging by the order.'
- 'Module identity: 80 registers per module from 4178, modules 1 to 10 (state at 4246 for module 1, device type at 4247: 0 CT8 5 A, 1 DI 14, 2 CT24 LP, 3 CT8 LP). Digital inputs of DI 14 modules:
  71 registers per module from 37000, with a bit field at 37014.'
- 'In the list, the temperature of multifunction input 4 at 21426 is a float (two registers) and overlaps the short at 21427. Both left out.'
- 'RS485: 8 data bits, no parity, 2 stop bits; rates 9600, 19200, 38400, 57600 and 115200 baud, no default given. TCP port 502, unit id 1, 125 registers per request and TCP itself are not stated; assumed.'
- Many registers are left out (groups 2 and 3, current modules, module identity, mean, minimum and maximum values with their time stamps, harmonics, digital and multifunction inputs, RCM values and alarms,
  crest factor, load percentage, TDD, complex current, highest demand values, comparators, current transformer ratios for L2 to L4).
