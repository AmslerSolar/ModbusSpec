  - {key: x.l2_inductive_reactive_energy, label: 'Reactive energy, inductive, L2 (fundamental comp.)', table: holding, address: 19096, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_inductive_reactive_energy, label: 'Reactive energy, inductive, L3 (fundamental comp.)', table: holding, address: 19098, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.inductive_reactive_energy, label: 'Reactive energy L1..L3, ind. (fundamental comp.)', table: holding, address: 19100, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L1 (fundamental comp.)', table: holding, address: 19102, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l2_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L2 (fundamental comp.)', table: holding, address: 19104, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l3_capacitive_reactive_energy, label: 'Reactive energy, capacitive, L3 (fundamental comp.)', table: holding, address: 19106, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.capacitive_reactive_energy, label: 'Reactive energy L1..L3, cap. (fundamental comp.)', table: holding, address: 19108, type: f32, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.l1_thd_u, label: 'Harmonic, THD,U L1-N', table: holding, address: 19110, type: f32, unit: '%'}
  - {key: x.l2_thd_u, label: 'Harmonic, THD,U L2-N', table: holding, address: 19112, type: f32, unit: '%'}
  - {key: x.l3_thd_u, label: 'Harmonic, THD,U L3-N', table: holding, address: 19114, type: f32, unit: '%'}
  - {key: x.l1_thd_i, label: 'Harmonic, THD,I L1', table: holding, address: 19116, type: f32, unit: '%'}
