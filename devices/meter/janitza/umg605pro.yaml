  - {key: x.l3_thd_i, label: 'Harmonic, THD,I L3', table: holding, address: 19120, type: f32, unit: '%'}

  # Totals and identity
  - {key: grid_import_energy, label: 'Real energy L1+L2+L3, consumed', table: holding, address: 6508, type: f32, unit: kWh, scale: 0.001, poll: slow, note: The 19000 block only has the rate 1 part of this counter (19068).}
