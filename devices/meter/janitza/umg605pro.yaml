# Written from the Janitza UMG 605-PRO Modbus-address list and Formulary (doc. no. 1.038.009.7.i, 07/2025).

modbusspec: 0
id: janitza-umg605pro
manufacturer: Janitza
name: UMG 605-PRO power quality analyser
kind: meter

sources:
- title: 'Janitza UMG 605-PRO Modbus-address list and Formulary, doc. no. 1.038.009.7.i'
  version: 07/2025
  url: https://assets.janitza.com/ce18jq9ih0x6/b83ae2356a42a682591109/ef2bc2b24a6b7c77de4dbda20e43cebf/janitza-mal-umg605pro-en.pdf
  sha256: 5a463900f0438402f7321bf28751185d67f098738ca447ef7a141c0f7a36d6cd
  number: 1.038.009.7.i
  language: en

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 9600
    format: 8N2
  limits:
    max_registers: 125
    max_gap: 16

encoding:
  byte_order: big
  word_order: big

identify:
  checks:
  - table: holding
    address: 19050
    type: f32
    range:
    - 0
    - 70
  # rotation field: rejects word-swapped floats
  - table: holding
    address: 19052
    type: f32
    in:
    - -1
    - 0
    - 1
  # release text: no other UMG list has it at this address
  - table: holding
    address: 10089
    type: str
    length: 8
    printable: true

points:
  # Frequently required readings, 19000–19120
  - {key: l1_voltage, label: Voltage L1-N, table: holding, address: 19000, type: f32, unit: V}
  - {key: l2_voltage, label: Voltage L2-N, table: holding, address: 19002, type: f32, unit: V}
  - {key: l3_voltage, label: Voltage L3-N, table: holding, address: 19004, type: f32, unit: V}
  - {key: x.l1_l2_voltage, label: Voltage L1-L2, table: holding, address: 19006, type: f32, unit: V}
  - {key: x.l2_l3_voltage, label: Voltage L2-L3, table: holding, address: 19008, type: f32, unit: V}
  - {key: x.l3_l1_voltage, label: Voltage L3-L1, table: holding, address: 19010, type: f32, unit: V}
  - {key: l1_current, label: 'Apparent current, L1-N', table: holding, address: 19012, type: f32, unit: A}
  - {key: l2_current, label: 'Apparent current, L2-N', table: holding, address: 19014, type: f32, unit: A}
  - {key: l3_current, label: 'Apparent current, L3-N', table: holding, address: 19016, type: f32, unit: A}
  - {key: x.neutral_current, label: Vector sum; IN=I1+I2+I3, table: holding, address: 19018, type: f32, unit: A}
  - {key: l1_power, label: Real power L1-N, table: holding, address: 19020, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l2_power, label: Real power L2-N, table: holding, address: 19022, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: l3_power, label: Real power L3-N, table: holding, address: 19024, type: f32, unit: W, positive: import, verified: false, note: Sign derived like the total power.}
  - {key: grid_power, label: Psum3=P1+P2+P3, table: holding, address: 19026, type: f32, unit: W, positive: import, verified: false, note: 'The list doesn''t state which way the power registers are positive. Taken like the other UMG analysers (P > 0 drawn from the grid at the grid connection); unverified.'}
  - {key: x.l1_apparent_power, label: Apparent power L1-N, table: holding, address: 19028, type: f32, unit: VA}
  - {key: x.l2_apparent_power, label: Apparent power L2-N, table: holding, address: 19030, type: f32, unit: VA}
  - {key: x.l3_apparent_power, label: Apparent power L3-N, table: holding, address: 19032, type: f32, unit: VA}
  - {key: apparent_power, label: Sum; Ssum3=S1+S2+S3, table: holding, address: 19034, type: f32, unit: VA}
  - {key: x.l1_reactive_power, label: Reactive power L1 (fundamental comp.), table: holding, address: 19036, type: f32, unit: var}
  - {key: x.l2_reactive_power, label: Reactive power L2 (fundamental comp.), table: holding, address: 19038, type: f32, unit: var}
  - {key: x.l3_reactive_power, label: Reactive power L3 (fundamental comp.), table: holding, address: 19040, type: f32, unit: var}
  - {key: reactive_power, label: Qsum3=Q1+Q2+Q3 (fundamental comp.), table: holding, address: 19042, type: f32, unit: var}
  - {key: x.l1_cos_phi, label: CosPhi; UL1 IL1 (fundamental comp.), table: holding, address: 19044, type: f32}
  - {key: x.l2_cos_phi, label: CosPhi; UL2 IL2 (fundamental comp.), table: holding, address: 19046, type: f32}
  - {key: x.l3_cos_phi, label: CosPhi; UL3 IL3 (fundamental comp.), table: holding, address: 19048, type: f32}
  - {key: frequency, label: Measured frequency, table: holding, address: 19050, type: f32, unit: Hz}
  - {key: x.rotation_field, label: 'Rotation field; 1=right, 0=none, -1=left', table: holding, address: 19052, type: f32, enum: rotation_field}
  - {key: x.l1_net_energy, label: Real energy L1, table: holding, address: 19054, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_net_energy, label: Real energy L2, table: holding, address: 19056, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_net_energy, label: Real energy L3, table: holding, address: 19058, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.net_energy, label: Real energy L1..L3, table: holding, address: 19060, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_import_energy, label: 'Real energy L1, consumed', table: holding, address: 19062, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_import_energy, label: 'Real energy L2, consumed', table: holding, address: 19064, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_import_energy, label: 'Real energy L3, consumed', table: holding, address: 19066, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.import_energy_t1, label: 'Real energy L1..L3, consumed, rate 1', table: holding, address: 19068, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_export_energy, label: 'Real energy L1, delivered', table: holding, address: 19070, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l2_export_energy, label: 'Real energy L2, delivered', table: holding, address: 19072, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l3_export_energy, label: 'Real energy L3, delivered', table: holding, address: 19074, type: f32, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.l1_apparent_energy, label: Apparent energy L1, table: holding, address: 19078, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l2_apparent_energy, label: Apparent energy L2, table: holding, address: 19080, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l3_apparent_energy, label: Apparent energy L3, table: holding, address: 19082, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.apparent_energy, label: Apparent energy L1..L3, table: holding, address: 19084, type: f32, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.l1_reactive_energy, label: Reaktive energy L1 (fundamental comp.), table: holding, address: 19086, type: f32, unit: kvarh, scale: 0.001, poll: slow}
