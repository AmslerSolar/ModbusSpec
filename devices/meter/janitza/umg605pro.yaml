  - {key: temperature, label: Internal temperature, table: holding, address: 4209, type: f32, unit: °C, poll: slow}
  - {key: firmware, label: Release, table: holding, address: 10089, type: str, poll: slow, length: 8, note: Marked for internal use.}
  - {key: serial, label: Serial number, table: holding, address: 6856, type: u32, poll: slow, note: Marked for internal use.}

enums:
  rotation_field: {'1': Right, '0': None, '-1': Left}

notes:
- 'The list says the listed addresses deliver big-endian data and that the same values little-endian are at address + 32768. It doesn''t say whether they are 0-based; the addresses are used as listed, as protocol addresses (unverified).'
- 'Values in float format include the transformer ratios; short-format values don''t.'
- 'The plain UMG 605 has its own file (umg605.yaml), from a 2011 list; this file is the 605-PRO''s list.'
- Live values come from the block at 19000–19120; the consumed total from the energy block, because 19068 in the 19000 block is only rate 1.
- 'RS485: the list gives 8 data bits, no parity, 2 stop bits and several rates; 9600 baud as the default is assumed.'
- 'Transports aren''t stated in the list; they follow the product (RS485 and Ethernet), unverified. TCP port 502, unit id 1 and 125 registers per request are not stated in the list; assumed.'
- 'Left out: mean, minimum and maximum values, harmonics, tariffs other than noted, transformer and network settings, inputs and outputs, and the rest of the list; the list has far more registers than this file.'
