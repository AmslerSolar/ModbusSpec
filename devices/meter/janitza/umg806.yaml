notes:
- 'The list says the listed addresses deliver big-endian data and that the same values little-endian are at address + 32768. It doesn''t say whether they are 0-based; the addresses are used as listed, as protocol addresses (unverified).'
- 'Values in float format include the transformer ratios; short-format values don''t.'
- 'The 01/2022 list gives power in kW and energy in kWh in the 19000 block; the later lists give W and Wh. The model `fw_early` holds the older reading. Which firmware changed it isn''t stated, so pick the model by the list that fits the firmware and check on the device.'
- 'Unlike other UMG lists, 19018 is the L4 current here and 19052 is reserved: there is no rotation field.'
- 'No identify: nothing in these lists tells this device from other UMG analysers; a reader picks this file by hand.'
- 'Transports aren''t stated in the list; RS485 and Ethernet follow the product, unverified. TCP port 502, unit id 1 and 125 registers per request are not stated in the list; assumed.'
- The project-derived openems_umg806 model in umg.yaml is not checked against these lists.
- 'Left out: mean, minimum and maximum values, harmonics, tariffs other than noted, transformer and network settings, inputs and outputs, and the rest of the list; the list has far more registers than this file.'
