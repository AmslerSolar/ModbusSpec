# Written from the two Janitza UMG 804 Modbus address lists: firmware 1.126 or higher (09/2021) and firmware 1.049 or lower (07/2023).

modbusspec: 0
id: janitza-umg804
manufacturer: Janitza
name: UMG 804 branch circuit power analyser
kind: meter

sources:
- title: Janitza BCM Power Analyser UMG 804, Modbus address list, for firmware version 1.126 or higher, doc. no. 2.063.011.0.a
  version: 09/2021
  url: https://assets.janitza.com/ce18jq9ih0x6/35b84328429c16391ced17/f23d9f9f9cb3bbfc49862df1279766a4/janitza-mal-umg804_v1.126_-en.pdf
  sha256: b9f1b807362307849e6e8ec8e2905e501bd6e8214fa95803a6be04233797e112
- title: Janitza BCM Power Analyser UMG 804, Modbus address list, for firmware version 1.049 or lower, doc. no. 2.063.010.1.a
  version: 07/2023
  url: https://assets.janitza.com/ce18jq9ih0x6/622f600bcc3defed138c77/a918e258674866fe79baa75f59bd9d37/janitza-mal-umg804_v1.049_-en.pdf
  sha256: 259234c9feb2a8b375b485a2cb7aa6e17b52704f0bb8b171d8a2c80328d75e9b

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  - rtu
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

identify:
  serial:
    table: holding
    address: 1
    type: u32
  checks:
  # 22000 = Janitza point map, in both documents
  - table: holding
    address: 5
    type: u16
    equals: 22000
  # frequency: rejects word-swapped floats
  - table: holding
    address: 4900
    type: f32
    range:
    - 0
    - 70
  # model name: registers filled with text; its content isn't stated
  - table: holding
    address: 45
    type: str
    length: 16
    printable: true

points:
  # Identity
  - {key: serial, label: Serial Number, table: holding, address: 1, type: u32, poll: slow}
  - {key: firmware, label: Firmware Version, table: holding, address: 4, type: u16, poll: slow}
  - {key: x.device_id, label: Device ID, table: holding, address: 5, type: u16, poll: slow, note: '22000 is the Janitza point map, the only value firmware 1.126 lists; firmware 1.049 and lower also allows 15172 and the register is writable there.'}
  - {key: x.uptime, label: Uptime, table: holding, address: 7, type: u32, unit: s, poll: slow}
  - {key: x.brand_name, label: Brand Name (16 Registers), table: holding, address: 29, type: str, length: 16, poll: slow}
  - {key: x.model_name, label: Model Name (16 Register), table: holding, address: 45, type: str, length: 16, poll: slow}
  - {key: x.device_name, label: Device Name (16 Registers), table: holding, address: 61, type: str, length: 16, poll: slow}
  - {key: x.smart_port_1_id, label: 'Smart Port ID #1', table: holding, address: 10, type: u16, poll: slow, enum: smart_port_id, note: Called Smart Product ID in the document for firmware 1.126.}
  - {key: x.smart_port_2_id, label: 'Smart Port ID #2', table: holding, address: 11, type: u16, poll: slow, enum: smart_port_id}
  - {key: x.smart_port_3_id, label: 'Smart Port ID #3', table: holding, address: 12, type: u16, poll: slow, enum: smart_port_id}
  - {key: x.smart_port_4_id, label: 'Smart Port ID #4', table: holding, address: 13, type: u16, poll: slow, enum: smart_port_id}

  # Status
  - {key: x.smart_port_1_status, label: Smart Port 1 Status, table: holding, address: 1930, type: u16, enum: smart_port_status}
  - {key: x.smart_port_2_status, label: Smart Port 2 Status, table: holding, address: 1931, type: u16, enum: smart_port_status}
  - {key: x.smart_port_3_status, label: Smart Port 3 Status, table: holding, address: 1932, type: u16, enum: smart_port_status}
  - {key: x.smart_port_4_status, label: Smart Port 4 Status, table: holding, address: 1933, type: u16, enum: smart_port_status}
  - {key: x.global_latching_alarm, label: Global Latching Alarm Status, table: holding, address: 1200, type: u16}

  # Voltage (float registers, same in both documents)
