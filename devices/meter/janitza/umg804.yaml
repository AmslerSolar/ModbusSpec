notes:
- 'Two documents, and the file names mislead: the one dated 09/2021 is for firmware 1.126 or higher, the one dated 07/2023 for firmware 1.049 or lower. Nothing covers the firmware between them.'
- 'The two maps differ, but not for anything in this file, so it has no models. All float registers here have the same addresses and names in both. Only the 1.126 document has the scaled integer registers
  (4800 to 7687 and at each custom meter), the device health word at 9, the Pi check values at 153 to 155 and resettable kWh at 13648. The 1.049 document lists the integer columns empty for
  the readings. The older document calls meters True Meter, the newer Custom Meter (a true meter, or a virtual one that sums circuits).'
- 'Neither document names function codes, byte order or the base of its addresses. Registers start at 1 in the lists with nothing at 0, so the numbers may count from 1. Addresses are used as listed; function 03 and
  big-endian bytes are assumed. Only the word order is stated (MSW first, then LSW). On firmware 1.126 or higher, register 153 should read 31415 and 154 the float pi, which settles the question.'
- 'Identification rests on register 5 reading 22000. A device with the other point map (15172, possible on firmware 1.049 or lower) isn''t found.'
- 'Circuit values go up by 2 registers per circuit, 96 circuits: current from 11152, kW from 10576, power factor from 11344, kWh from 10000. Power factor: positive leading (capacitive), negative lagging (inductive). The
  documents don''t state the sign of kW; there is no main power or grid total unless a meter is configured.'
- 'Meter n is at meter 1 + 500 x (n − 1): the total values at 15300, then circuit values at 15350, 15400, 15450. A true meter takes up to 3 circuits, assigned from register 488. The newer document runs to 96 custom meters.'
- 'Modbus port 502 is stated in the document (register 125 lists it); slave address 1 to 254 (register 124). Baud rates 9600 to 76800 are selected in registers 140 and 141; the newer document has parity and stop bits in 142 and 143 without value
  meanings, and no default is given, so no serial parameters are stated here. Unit id 1 and 125 registers per request are assumed.'
- Many registers are left out (scaled integer readings, kVAR, kVA, kVARh, kVAh, current angle, THD, max and demand values, crest factor and utilisation per circuit, meters 2 onwards and meter circuit values, voltage angle, circuit
  and alarm configuration, per-circuit alarm status, waveform capture, digital inputs and outputs, clock, network settings, smart port daisy-chain details).
