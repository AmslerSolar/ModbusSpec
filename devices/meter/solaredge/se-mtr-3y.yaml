modbusspec: 0
id: solaredge-se-mtr-3y
manufacturer: SolarEdge
name: SE-MTR-3Y energy meter (direct RS485)
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/semtr3y.go

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: little

identify:
  checks:
  - - table: input
      address: 1018
      type: f32
      range:
      - 99.0
      - 121.0
    - table: input
      address: 1018
      type: f32
      range:
      - 207.0
      - 253.0

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: x.sum, label: Total Sum, table: input, address: 1000, type: f32, unit: kWh}
  - {key: grid_import_energy, label: Total Import, table: input, address: 1002, type: f32, unit: kWh}
  - {key: x.sum_t1, label: Tariff 1 Sum, table: input, address: 1004, type: f32, unit: kWh, note: mbmd files this under its tariff-1 measurement; per mbmd it is the counter that can't be reset.}
  - {key: x.import_t1, label: Tariff 1 Import, table: input, address: 1006, type: f32, unit: kWh, note: mbmd files this under its tariff-1 measurement; per mbmd it is the counter that can't be reset.}
  - {key: x.power, label: Power, table: input, address: 1008, type: f32, unit: W}
  - {key: x.power_l1, label: L1 Power, table: input, address: 1010, type: f32, unit: W}
  - {key: x.power_l2, label: L2 Power, table: input, address: 1012, type: f32, unit: W}
  - {key: x.power_l3, label: L3 Power, table: input, address: 1014, type: f32, unit: W}
  - {key: l1_voltage, label: L1 Voltage, table: input, address: 1018, type: f32, unit: V}
  - {key: l2_voltage, label: L2 Voltage, table: input, address: 1020, type: f32, unit: V}
  - {key: l3_voltage, label: L3 Voltage, table: input, address: 1022, type: f32, unit: V}
  - {key: frequency, label: Frequency, table: input, address: 1032, type: f32, unit: Hz}
  - {key: x.sum_l1, label: L1 Sum, table: input, address: 1100, type: f32, unit: kWh}
  - {key: x.sum_l2, label: L2 Sum, table: input, address: 1102, type: f32, unit: kWh}
  - {key: x.sum_l3, label: L3 Sum, table: input, address: 1104, type: f32, unit: kWh}
  - {key: x.import_l1, label: L1 Import, table: input, address: 1106, type: f32, unit: kWh}
  - {key: x.import_l2, label: L2 Import, table: input, address: 1108, type: f32, unit: kWh}
  - {key: x.import_l3, label: L3 Import, table: input, address: 1110, type: f32, unit: kWh}
  - {key: grid_export_energy, label: Total Export, table: input, address: 1112, type: f32, unit: kWh}
  - {key: x.export_t1, label: Tariff 1 Export, table: input, address: 1114, type: f32, unit: kWh, note: mbmd files this under its tariff-1 measurement; per mbmd it is the counter that can't be reset.}
  - {key: x.export_l1, label: L1 Export, table: input, address: 1116, type: f32, unit: kWh}
  - {key: x.export_l2, label: L2 Export, table: input, address: 1118, type: f32, unit: kWh}
  - {key: x.export_l3, label: L3 Export, table: input, address: 1120, type: f32, unit: kWh}
  - {key: x.reactive_sum, label: Total Reactive, table: input, address: 1122, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l1, label: L1 Reactive, table: input, address: 1124, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l2, label: L2 Reactive, table: input, address: 1128, type: f32, unit: kvarh}
  - {key: x.reactive_sum_l3, label: L3 Reactive, table: input, address: 1130, type: f32, unit: kvarh}
  - {key: power_factor, label: Cosphi, table: input, address: 1138, type: f32}
  - {key: x.cosphi_l1, label: L1 Cosphi, table: input, address: 1140, type: f32}
  - {key: x.cosphi_l2, label: L2 Cosphi, table: input, address: 1142, type: f32}
  - {key: x.cosphi_l3, label: L3 Cosphi, table: input, address: 1144, type: f32}
  - {key: reactive_power, label: Reactive Power, table: input, address: 1146, type: f32, unit: var}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: input, address: 1148, type: f32, unit: var}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: input, address: 1150, type: f32, unit: var}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: input, address: 1152, type: f32, unit: var}
  - {key: apparent_power, label: Apparent Power, table: input, address: 1154, type: f32, unit: VA}
  - {key: x.apparent_power_l1, label: L1 Apparent Power, table: input, address: 1156, type: f32, unit: VA}
  - {key: x.apparent_power_l2, label: L2 Apparent Power, table: input, address: 1158, type: f32, unit: VA}
  - {key: x.apparent_power_l3, label: L3 Apparent Power, table: input, address: 1160, type: f32, unit: VA}
  - {key: l1_current, label: L1 Current, table: input, address: 1162, type: f32, unit: A}
  - {key: l2_current, label: L2 Current, table: input, address: 1164, type: f32, unit: A}
  - {key: l3_current, label: L3 Current, table: input, address: 1166, type: f32, unit: A}

notes:
- mbmd's map was worked out from a third-party meter proxy, not a SolarEdge document. Behind a SolarEdge inverter the same
  meter is read through the inverter's SunSpec models instead.
- mbmd (type code SEMTR) detects the meter by reading L1 Voltage (input register 1018, f32, word order little); its bus scan
  accepts a value within 10% of 110 or 230 V.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
