  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/solaredge/solaredge
- id: solaredge-modbus-multi
  title: solaredge-modbus-multi (Home Assistant integration)
  url: https://github.com/WillCodeForCats/solaredge-modbus-multi
  license: Apache-2.0
  commit: 2bffb6ad39897991cec037ed2240032e41fab6a3
  path: custom_components/solaredge_modbus_multi/components.py, custom_components/solaredge_modbus_multi/const.py, custom_components/solaredge_modbus_multi/scanner.py,
