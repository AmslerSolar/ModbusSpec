notes:
- Meters are read through the inverter, at the inverter's unit id and port (see solaredge-inverter). Addresses are the document's
  base-0 protocol addresses (base-1 PLC addresses are one higher).
- The addresses here are meter 1 (from 40121). Meter 2 starts 174 registers higher (40295), meter 3 348 higher (40469). On
  three-phase Synergy inverters with the multiple-MPPT model, add 50 (2 units) or 70 (3 units) to every meter address.
- 'Only enabled meters are readable and they fill the slots in order: with meters 1 and 3 enabled, meter 3 reads as the second
  meter. C_Option tells the meter''s function.'
- 'Values with a SunSpec scale factor: real value = raw × 10^(scale factor register).'
- 'Left out: per-phase apparent / reactive power and power factor (40212–40214, 40217–40219, 40222–40224), apparent energy
  (40243–40259) and the four reactive energy quadrants (40260–40292).'
- 'M_Events: the document lists bits 2–7; bits 8–15 are reserved and the upper bits are for OEMs.'
- The meter 2 table in document 3.2 repeats meter 1's energy addresses; the 174-register offset is taken instead.
- openWB reads meter 1 at these addresses; meter 2 and 3 are 174 and 348 registers later, and inverters with Synergy technology
  move them by another 50 (2 units) or 70 (3 units), detected from holding 40121 = 160 and the unit count in holding 40129.
- Meters are read through the inverter, at the inverter's unit id. The addresses here are meter 1; meter 2 is 174 registers
  higher (40295…), meter 3 348 higher (40469…).
- 'With the multiple-MPPT model at 40121 (see solaredge-inverter) every meter block moves up by 10 + 20 × modules registers:
  50 with 2 modules, 70 with 3.'
- A meter is present when its common block reads 1 at the DID register (40121) and 65 at the length (40122), or when its model
  register (40188) reads 201–204.
- Kept apart from solaredge-inverter because up to three meters sit at different offsets and the first one shares its addresses
  with the inverter's multiple-MPPT model.
- Identification as solaredge-modbus-multi recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
