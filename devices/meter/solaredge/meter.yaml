  - {key: x.ac_voltage_ab, label: M_AC_Voltage_AB, table: holding, address: 40200, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}, note: Not from the SolarEdge meter.}
  - {key: x.ac_voltage_bc, label: M_AC_Voltage_BC, table: holding, address: 40201, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}, note: Not from the SolarEdge meter.}
  - {key: x.ac_voltage_ca, label: M_AC_Voltage_CA, table: holding, address: 40202, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}, note: Not from the SolarEdge meter.}
