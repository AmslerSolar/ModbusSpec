- id: solaredged
  title: solaredged (Python library used by the Home Assistant core solaredge_modbus integration)
  url: https://github.com/frenck/python-solaredged
  license: MIT
  commit: c80f8a8fa3e592e6bfa689063a4a372a5dd5cbea
  path: src/solaredged/components.py, src/solaredged/const.py

connection:
  default_port: 1502
  default_unit: 1
  transports:
  - tcp
  - rtu
  serial:
    baud: 115200
    format: 8N1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40171
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40004
    type: str
    length: 16
    prefix: SolarEdge
  - table: holding
    address: 40121
    type: u16
    equals: 1
  - table: holding
    address: 40122
    type: u16
    equals: 65
  - table: holding
    address: 40188
    type: u16
    in:
    - 201
    - 202
    - 203
    - 204

sunspec: true

models:
  - {id: single_phase, name: 'Single phase meter (AN or AB, SunSpec model 201)', match: {table: holding, address: 40188, type: u16, equals: 201}}
  - {id: split_phase, name: 'Split single phase meter (ABN, SunSpec model 202)', match: {table: holding, address: 40188, type: u16, equals: 202}}
  - {id: wye, name: 'Wye-connected three phase meter (ABCN, SunSpec model 203)', match: {table: holding, address: 40188, type: u16, equals: 203}}
  - {id: delta, name: 'Delta-connected three phase meter (ABC, SunSpec model 204)', match: {table: holding, address: 40188, type: u16, equals: 204}}
  - {id: solaredge_modbus_multi_single_phase, name: Single phase meter, match: {table: holding, address: 40188, type: u16, equals: 201}}
  - {id: solaredge_modbus_multi_split_phase, name: Split phase meter, match: {table: holding, address: 40188, type: u16, equals: 202}}
  - {id: solaredge_modbus_multi_wye, name: Three phase wye meter, match: {table: holding, address: 40188, type: u16, equals: 203}}
  - {id: solaredge_modbus_multi_delta, name: Three phase delta meter, match: {table: holding, address: 40188, type: u16, equals: 204}}
  - {id: solaredged_single_phase, name: Single phase meter, match: {table: holding, address: 40188, type: u16, equals: 201}}
  - {id: solaredged_split_phase, name: Split phase meter, match: {table: holding, address: 40188, type: u16, equals: 202}}
  - {id: solaredged_wye, name: Three phase wye meter, match: {table: holding, address: 40188, type: u16, equals: 203}}
  - {id: solaredged_delta, name: Three phase delta meter, match: {table: holding, address: 40188, type: u16, equals: 204}}

points:
  # Meter 1 common block
  - {key: x.common_did, label: C_SunSpec_DID, table: holding, address: 40121, type: u16, poll: slow, note: 1 = common block.}
  - {key: x.common_length, label: C_SunSpec_Length, table: holding, address: 40122, type: u16, poll: slow, note: 65 registers.}
  - {key: x.manufacturer, label: C_Manufacturer, table: holding, address: 40123, type: str, length: 16, poll: slow}
  - {key: x.model, label: C_Model, table: holding, address: 40139, type: str, length: 16, poll: slow}
  - {key: x.options, label: C_Option, table: holding, address: 40155, type: str, length: 8, poll: slow, note: 'The meter''s function as set in the inverter menus: Export+Import, Production or Consumption.'}
  - {key: firmware, label: C_Version, table: holding, address: 40163, type: str, length: 8, poll: slow}
  - {key: serial, label: C_SerialNumber, table: holding, address: 40171, type: str, length: 16, poll: slow}
  - {key: x.device_address, label: C_DeviceAddress, table: holding, address: 40187, type: u16, poll: slow, note: The inverter's Modbus id.}

  # Meter model 201–204
  - {key: x.meter_did, label: C_SunSpec_DID, table: holding, address: 40188, type: u16, enum: meter_did, poll: slow}
  - {key: x.meter_length, label: C_SunSpec_Length, table: holding, address: 40189, type: u16, poll: slow}
  - {key: x.ac_current, label: M_AC_Current, table: holding, address: 40190, type: s16, unit: A, scale_exponent_from: {table: holding, address: 40194, type: s16}, note: Sum of the active phases.}
