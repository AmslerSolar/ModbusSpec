  sha256: a93afea72570ec36bf2f23474b17fecce2b5abb6520a8a7542e7420f470ddbe8
  archive_url: https://web.archive.org/web/20221207064846/https://www.solaredge.com/sites/default/files/sunspec-implementation-technical-note.pdf
- title: Technical Note – SunSpec Logging in SolarEdge Inverters
