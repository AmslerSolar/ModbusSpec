  - {key: l2_current, label: M_AC_Current_B, table: holding, address: 40192, type: s16, unit: A, scale_exponent_from: {table: holding, address: 40194, type: s16}}
  - {key: l3_current, label: M_AC_Current_C, table: holding, address: 40193, type: s16, unit: A, scale_exponent_from: {table: holding, address: 40194, type: s16}}
  - {key: x.ac_current_sf, label: M_AC_Current_SF, table: holding, address: 40194, type: s16}
  - {key: x.ac_voltage_ln, label: M_AC_Voltage_LN, table: holding, address: 40195, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}, note: Average of the active phases.}
  - {key: l1_voltage, label: M_AC_Voltage_AN, table: holding, address: 40196, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}}
  - {key: l2_voltage, label: M_AC_Voltage_BN, table: holding, address: 40197, type: s16, unit: V, scale_exponent_from: {table: holding, address: 40203, type: s16}}
