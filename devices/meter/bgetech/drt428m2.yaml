# Written from the B+G e-tech DRT428M series user manual with the Modbus register map for the DRT428M-2/3 (undated).

modbusspec: 0
id: bgetech-drt428m2
manufacturer: B+G E-Tech
name: DRT428M-2 / -3 bidirectional three-phase meter
kind: meter

sources:
- title: B+G e-tech User Manual DRT428M Serie (with the Modbus register map for DRT428M-2/3)
  version: undated (copy in OpenEMS at commit c044448d6346209e4aa8dae7f4bde08a676ad0ed)
  url: https://github.com/OpenEMS/openems/blob/c044448d6346209e4aa8dae7f4bde08a676ad0ed/io.openems.edge.meter.bgetech/doc/DRT428M-Serie_manual-register.pdf
  sha256: 9f1f041001a52374149558f56e0ce035665d933bd669ba9cc7b6b40ad5639806
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.bgetech/src/io/openems/edge/meter/bgetech/MeterBgeTechDrt428M2Impl.java

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8E1

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 0
    type: bcd32
  checks:
  - table: holding
    address: 11
    type: u16
    in:
    - 1
    - 5
    - 9
  - table: holding
    address: 20
    type: f32
    range:
    - 45
    - 65


points:
  # Parameters and instantaneous values (function 03)
  - {key: serial, label: Serial number, table: holding, address: 0, type: bcd32, poll: slow, note: 8 digits; also the IR address.}
  - {key: x.modbus_id, label: Modbus ID, table: holding, address: 2, type: u16, writable: true, min: 1, max: 247, poll: slow, note: Default 1. Written with function 06.}
  - {key: x.baud_rate, label: Baud Rate, table: holding, address: 3, type: u16, writable: true, poll: slow, note: 300 … 9600 (default 9600); how the rate is coded in the register isn't stated.}
  - {key: firmware, label: Software Version, table: holding, address: 4, type: f32, poll: slow, note: 'Float word order not stated; assumed most significant register first, as for all floats here.', verified: false}
  - {key: x.hardware_version, label: Hardware Version, table: holding, address: 6, type: f32, poll: slow, verified: false}
  - {key: x.s0_rate, label: S0 output rate, table: holding, address: 9, type: f32, unit: imp/kWh, writable: true, min: 1, max: 1000, poll: slow, note: '1, 10, 100 or 1000. Written with function 16.', verified: false}
  - {key: x.combination_code, label: Combined Code, table: holding, address: 11, type: u16, enum: combination_code, writable: true, poll: slow}
