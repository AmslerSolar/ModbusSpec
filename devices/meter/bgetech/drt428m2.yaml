enums:
  combination_code: {'1': Forward only, '5': Forward + reverse, '9': Forward − reverse}

notes:
- 'Models: DRT428M-1 (infrared only, no Modbus), DRT428M-2 (RS485 Modbus) and DRT428M-3 (as -2, plus tariffs, holidays and
  a clock). The register map is for the -2 and -3.'
- 'Addresses: the document gives hex Modbus register addresses; they are used as they are (0-based). All registers are read
  with function 03; its length column counts bytes, not registers.'
- The document doesn't give units for the float values, the float word order or the power sign. Units are assumed as on the
  display (V, A, Hz, kW, kvar, kVA, kWh, kvarh); readers should check them on a device.
- 'Defaults: Modbus ID 1, 9600 baud, 8 data bits, even parity, 1 stop bit; 1200, 2400 and 4800 baud optional. Combined code
  default 5 (forward + reverse).'
- 'Left out: the per-phase reactive energy counters (0x011A … 0x012E), the tariff forward / reverse / reactive counters, the
  holiday / weekend table numbers (0x000C), the season switch (0x0040), the CRC code (0x0041) and the tariff tables (0x0300
  ff.).'
- The driver's default meter type is CONSUMPTION_METERED; OpenEMS doesn't say which way the device's own power value is positive,
  so no direction is given.
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
