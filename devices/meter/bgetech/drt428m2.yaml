  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 16, type: f32, unit: V, verified: false}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 18, type: f32, unit: V, verified: false}
  - {key: frequency, label: Grid Frequency, table: holding, address: 20, type: f32, unit: Hz, verified: false}
  - {key: l1_current, label: L1 Current, table: holding, address: 22, type: f32, unit: A, verified: false}
  - {key: l2_current, label: L2 Current, table: holding, address: 24, type: f32, unit: A, verified: false}
  - {key: l3_current, label: L3 Current, table: holding, address: 26, type: f32, unit: A, verified: false}
  - {key: grid_power, label: Total Active Power, table: holding, address: 28, type: f32, unit: W, scale: 1000, positive: import, note: Neither the unit nor the sign is stated. kW assumed (the display shows kW with three decimals); positive = import (forward) assumed., verified: false}
