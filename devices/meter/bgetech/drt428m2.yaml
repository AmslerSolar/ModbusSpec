  - {key: x.l1_reactive_power, label: L1 reactive power, table: holding, address: 38, type: f32, unit: var, scale: 1000, verified: false}
  - {key: x.l2_reactive_power, label: L2 reactive power, table: holding, address: 40, type: f32, unit: var, scale: 1000, verified: false}
