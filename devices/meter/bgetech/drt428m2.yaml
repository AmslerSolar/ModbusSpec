  - {key: x.clock, label: Time, table: holding, address: 60, type: datetime, length: 4, datetime: {second: {register: 0, bits: [8, 15], bcd: true}, minute: {register: 0, bits: [0, 7], bcd: true}, hour: {register: 1, bits: [8, 15], bcd: true}, day: {register: 2, bits: [8, 15], bcd: true}, month: {register: 2, bits: [0, 7], bcd: true}, year: {register: 3, bits: [8, 15], bcd: true, offset: 2000}}, optional: true, writable: true, poll: slow, note: 'DRT428M-3 only. BCD bytes second, minute, hour, weekday, day, month, year, 00; the first byte of each pair taken as the high byte, and the year as years after 2000 (both assumed).', verified: false}

