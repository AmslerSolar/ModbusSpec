# Written from the Entes MPR 3X-4X Register table (undated; file dated 2023-10-27).

modbusspec: 0
id: entes-mpr
manufacturer: Entes
name: MPR-3x / MPR-4x network analysers (MPR32(S), MPR34(S)-11 / -20, MPR45(S), MPR46(S), MPR47S, MPR47SE)
kind: meter

sources:
- title: Entes MPR 3X-4X Register table (MPR-3/4 Series Register Table)
  version: undated (file dated 2023-10-27)
  url: https://www.entes.com.tr/uploads/files/1698403357-20231027%20%20MPR-3_4_Series_Register_Table.pdf
  sha256: f65ba6dd4179b0648e3a1cde2d83e20783a25124c5d9ad0733aaa0e6bc88e2c7
  archive_url: https://web.archive.org/web/20260418131944/https://www.entes.com.tr/uploads/files/1698403791-20231027%20%20MPR-3_4_Series_Register_Table.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 60418
    type: u32
  checks:
  # measured frequency, 0.01 Hz
  - table: holding
    address: 24
    type: u32
    range:
    - 4500
    - 6500

defaults:
  verified: false

points:
  # Measurements (0–161)
  - {key: l1_voltage, label: Voltage L1-N, table: holding, address: 0, type: u32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: Voltage L2-N, table: holding, address: 2, type: u32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: Voltage L3-N, table: holding, address: 4, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l1_l2, label: Voltage L1-L2, table: holding, address: 8, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l2_l3, label: Voltage L2-L3, table: holding, address: 10, type: u32, unit: V, scale: 0.1}
  - {key: x.voltage_l3_l1, label: Voltage L3-L1, table: holding, address: 12, type: u32, unit: V, scale: 0.1}
  - {key: l1_current, label: Current L1, table: holding, address: 14, type: u32, unit: A, scale: 0.001}
  - {key: l2_current, label: Current L2, table: holding, address: 16, type: u32, unit: A, scale: 0.001}
  - {key: l3_current, label: Current L3, table: holding, address: 18, type: u32, unit: A, scale: 0.001}
  - {key: x.neutral_current, label: Neutral current (IL1 + IL2 + IL3), table: holding, address: 22, type: u32, unit: A, scale: 0.001}
  - {key: frequency, label: Measured frequency, table: holding, address: 24, type: u32, unit: Hz, scale: 0.01}
  - {key: l1_power, label: Active power L1-N, table: holding, address: 26, type: f32, unit: W, positive: import, note: 'Sign not stated in the document; assumed positive = import (consumed), as the separate import / export totals and consumed / delivered energies suggest.'}
  - {key: l2_power, label: Active power L2-N, table: holding, address: 28, type: f32, unit: W, positive: import}
  - {key: l3_power, label: Active power L3-N, table: holding, address: 30, type: f32, unit: W, positive: import}
  - {key: x.import_power, label: Total import active power, table: holding, address: 34, type: f32, unit: W}
  - {key: x.export_power, label: Total export active power, table: holding, address: 36, type: f32, unit: W}
  - {key: x.total_active_power, label: 'Total active power (P1 + P2 + P3, signed)', table: holding, address: 38, type: f32, unit: W, note: 'Signed sum; the direction isn''t stated, so grid power below is taken from the import and export registers instead.'}
  - {key: x.reactive_power_l1, label: Reactive power L1, table: holding, address: 40, type: f32, unit: var}
  - {key: x.reactive_power_l2, label: Reactive power L2, table: holding, address: 42, type: f32, unit: var}
  - {key: x.reactive_power_l3, label: Reactive power L3, table: holding, address: 44, type: f32, unit: var}
  - {key: reactive_power, label: 'Total reactive power (Q1 + Q2 + Q3, signed)', table: holding, address: 56, type: f32, unit: var}
  - {key: x.apparent_power_l1, label: Apparent power L1-N, table: holding, address: 58, type: f32, unit: VA}
  - {key: x.apparent_power_l2, label: Apparent power L2-N, table: holding, address: 60, type: f32, unit: VA}
  - {key: x.apparent_power_l3, label: Apparent power L3-N, table: holding, address: 62, type: f32, unit: VA}
  - {key: apparent_power, label: Total apparent power (S1 + S2 + S3), table: holding, address: 70, type: f32, unit: VA}
  - {key: x.power_factor_l1, label: Power factor L1, table: holding, address: 72, type: s32, unit: '', scale: 0.001}
  - {key: x.power_factor_l2, label: Power factor L2, table: holding, address: 74, type: s32, unit: '', scale: 0.001}
  - {key: x.power_factor_l3, label: Power factor L3, table: holding, address: 76, type: s32, unit: '', scale: 0.001}
  - {key: power_factor, label: Total power factor, table: holding, address: 80, type: s32, unit: '', scale: 0.001}
  - {key: x.cos_phi, label: Total cos phi, table: holding, address: 90, type: s32, unit: '', scale: 0.001}
  - {key: x.rotation_field, label: Rotation field, table: holding, address: 92, type: s32, enum: rotation_field}
  - {key: x.voltage_unbalance, label: Voltage unbalance, table: holding, address: 94, type: u32, unit: '%', scale: 0.1}
  - {key: x.current_unbalance, label: Current unbalance, table: holding, address: 96, type: u32, unit: '%', scale: 0.1}
  - {key: x.hour_meter, label: Hour meter (non-resettable), table: holding, address: 154, type: u32, unit: h, scale: 0.001, poll: slow}
  - {key: x.working_hours, label: Working hour counter, table: holding, address: 156, type: u32, unit: h, scale: 0.001, poll: slow}
  - {key: x.input_status, label: Input status, table: holding, address: 158, type: u32, note: 'Digital inputs, one bit each (models with inputs); the bit layout isn''t given.'}
  - {key: x.output_status, label: Output status, table: holding, address: 160, type: u32, note: 'Digital / alarm outputs, one bit each; the bit layout isn''t given.'}

  # Energy (200–377), 64-bit counters in Wh / varh
  - {key: x.import_energy_l1, label: Consumed active energy L1, table: holding, address: 200, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.import_energy_l2, label: Consumed active energy L2, table: holding, address: 204, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: x.import_energy_l3, label: Consumed active energy L3, table: holding, address: 208, type: u64, unit: kWh, scale: 0.001, poll: slow}
  - {key: grid_import_energy, label: Total consumed energy L1..L3, table: holding, address: 216, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Consumed taken as imported from the grid.}
  - {key: grid_export_energy, label: Total delivered energy L1..L3, table: holding, address: 236, type: u64, unit: kWh, scale: 0.001, poll: slow, note: Delivered taken as exported to the grid.}
  - {key: x.import_apparent_energy, label: Total consumed apparent energy L1..L3, table: holding, address: 256, type: u64, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.export_apparent_energy, label: Total delivered apparent energy L1..L3, table: holding, address: 276, type: u64, unit: kVAh, scale: 0.001, poll: slow}
  - {key: x.q1_reactive_energy, label: Quadrant 1 total reactive energy, table: holding, address: 296, type: u64, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.q2_reactive_energy, label: Quadrant 2 total reactive energy, table: holding, address: 316, type: u64, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.q3_reactive_energy, label: Quadrant 3 total reactive energy, table: holding, address: 336, type: u64, unit: kvarh, scale: 0.001, poll: slow}
  - {key: x.q4_reactive_energy, label: Quadrant 4 total reactive energy, table: holding, address: 356, type: u64, unit: kvarh, scale: 0.001, poll: slow}

  # Energy per tariff (500–541)
  - {key: x.tariff_count, label: Number of tariffs, table: holding, address: 500, type: u16, poll: slow}
  - {key: x.tariff_active, label: Tariff in progress, table: holding, address: 501, type: u16, poll: slow}
  - {key: x.tariff1_energy, label: Positive active energy tariff 1, table: holding, address: 502, type: u64, unit: kWh, poll: slow}
  - {key: x.tariff2_energy, label: Positive active energy tariff 2, table: holding, address: 506, type: u64, unit: kWh, poll: slow}
  - {key: x.tariff3_energy, label: Positive active energy tariff 3, table: holding, address: 510, type: u64, unit: kWh, poll: slow}
  - {key: x.tariff4_energy, label: Positive active energy tariff 4, table: holding, address: 514, type: u64, unit: kWh, poll: slow}
  - {key: x.generator_energy, label: Generator energies, table: holding, address: 534, type: u64, unit: kWh, poll: slow}
  - {key: x.tariff_total_energy, label: Total tariff energies, table: holding, address: 538, type: u64, unit: kWh, poll: slow}

  # THD (2000–2035)
  - {key: x.thd_voltage_l1, label: Total harmonic distortion VL1, table: holding, address: 2006, type: u32, unit: '%', scale: 0.1}
  - {key: x.thd_voltage_l2, label: Total harmonic distortion VL2, table: holding, address: 2008, type: u32, unit: '%', scale: 0.1}
  - {key: x.thd_voltage_l3, label: Total harmonic distortion VL3, table: holding, address: 2010, type: u32, unit: '%', scale: 0.1}
  - {key: x.thd_current_l1, label: Total harmonic distortion IL1, table: holding, address: 2014, type: u32, unit: '%', scale: 0.1}
  - {key: x.thd_current_l2, label: Total harmonic distortion IL2, table: holding, address: 2016, type: u32, unit: '%', scale: 0.1}
  - {key: x.thd_current_l3, label: Total harmonic distortion IL3, table: holding, address: 2018, type: u32, unit: '%', scale: 0.1}

  # Network settings (16384 ff.)
  - {key: x.network_type, label: Network type, table: holding, address: 16384, type: u16, enum: network_type, writable: true, poll: slow}
  - {key: x.ct_secondary, label: Current transformer secondary, table: holding, address: 16385, type: u16, enum: ct_secondary, writable: true, poll: slow}
  - {key: x.ct_primary, label: Current transformer primary, table: holding, address: 16386, type: u16, unit: A, writable: true, min: 5, max: 9999, poll: slow}
  - {key: x.vt_present, label: Voltage transformer present, table: holding, address: 16387, type: u16, enum: vt_present, writable: true, poll: slow}
  - {key: x.vt_secondary, label: Voltage transformer secondary, table: holding, address: 16388, type: u16, unit: V, writable: true, min: 50, max: 300, poll: slow}
  - {key: x.vt_primary, label: Voltage transformer primary, table: holding, address: 16389, type: u32, unit: V, writable: true, min: 50, max: 999999, poll: slow}

  # Date / time (6000 ff.)
  - {key: x.clock, label: Date and time, table: holding, address: 6000, type: datetime, length: 6, poll: slow, datetime: {day: {register: 0}, month: {register: 1}, year: {register: 2}, hour: {register: 3}, minute: {register: 4}, second: {register: 5}}}

  # Device identification (60416 ff.)
  - {key: x.device_id, label: Device ID, table: holding, address: 60416, type: u16, poll: slow}
  - {key: serial, label: Serial number, table: holding, address: 60418, type: u32, poll: slow}
  - {key: firmware, label: Software version, table: holding, address: 60420, type: u32, poll: slow}
  - {key: x.hardware_version, label: Hardware version, table: holding, address: 60422, type: u32, poll: slow}
  - {key: x.modbus_table_version, label: Modbus table version, table: holding, address: 60424, type: u32, poll: slow}
  - {key: x.fabrication_date, label: Fabrication date, table: holding, address: 60428, type: u32, epoch: {start: '1970-01-01', unit: s}, poll: slow}
  - {key: x.product_code, label: Product code (Entes identification), table: holding, address: 65032, type: str, length: 4, poll: slow}

derived:
  - {key: grid_power, label: Grid power, unit: W, positive: export, sum: [{key: x.export_power}, {key: x.import_power, factor: -1}], note: From the separate import and export totals.}

enums:
  rotation_field: {'1': Right, '0': None, '-1': Left}
  network_type: {'0': 3P4W, '1': 3P3W, '2': ARON, '3': 3P4W balanced, '4': 3P3W balanced}
  ct_secondary: {'0': 1 A, '1': 5 A}
  vt_present: {'0': None, '1': Present}

notes:
- All registers are holding registers (function 03). The document says its addresses are 0-based and used as printed; they
  are used as protocol addresses.
- Values are sent most significant byte and word first (the document's worked example).
- 'The document lists which features each model has in a graphical availability matrix that doesn''t survive as text; the
  per-model columns aren''t reproduced. By the feature list: tariffs and THD on MPR34(S), work hours, records and event logs
  on MPR45 and above, RS-485 on the S models, Ethernet on MPR47SE. Points a model lacks may not answer.'
- Port 502 and unit 1 are not stated as defaults; assumed. The Ethernet port number (18012) and the RS-485 address, baud rate
  (2400–115200) and parity (17156–17158) are settings; the default baud rate isn't stated.
- The fourth-channel registers (L4 voltage, current, power at 6, 20, 32 …) exist only on models with a fourth measuring channel
  and are left out.
- Tariff energies (502 ff.) are given in kWh, unlike the Wh counters at 200 ff.
- 'Left out: per-phase delivered and apparent energies, per-phase quadrant reactive energies, the writable energy presets
  (1500–1659), min / max / demand values with time stamps (800–1373), harmonic orders (3000–5150), phase angles (98–112, given
  as uint64 over two registers, which is contradictory), analog and temperature inputs of the I/O module (114–152), setup,
  Ethernet, tariff schedules, alarm settings (20000 ff.: these are alarm thresholds and causes, not live alarm states), event
  log and record registers.'
