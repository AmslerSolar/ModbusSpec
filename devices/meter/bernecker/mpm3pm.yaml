modbusspec: 0
id: bernecker-mpm3pm
manufacturer: Bernecker Engineering
name: MPM3PM three-phase energy meter
kind: meter

sources:
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/mpm3pm.go
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/common/mpm3pm.py, packages/modules/internal_chargepoint_handler/clients.py

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

identify:
  checks:
  - - table: holding
      address: 8
      type: u32
      range:
      - 990
      - 1210
    - table: holding
      address: 8
      type: u32
      range:
      - 2070
      - 2530

defaults:
  verified: false
  sources:
  - mbmd

points:
  - {key: x.sum, label: Total Sum, table: holding, address: 0, type: s32, unit: kWh, scale: 0.01}
  - {key: grid_import_energy, label: Total Import, table: holding, address: 2, type: u32, unit: kWh, scale: 0.01}
  - {key: grid_export_energy, label: Total Export, table: holding, address: 4, type: u32, unit: kWh, scale: 0.01}
  - {key: x.reactive_sum, label: Total Reactive, table: holding, address: 6, type: u32, unit: kvarh, scale: 0.01}
  - {key: l1_voltage, label: L1 Voltage, table: holding, address: 8, type: u32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: L2 Voltage, table: holding, address: 10, type: u32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: L3 Voltage, table: holding, address: 12, type: u32, unit: V, scale: 0.1}
  - {key: l1_current, label: L1 Current, table: holding, address: 14, type: u32, unit: A, scale: 0.01}
  - {key: l2_current, label: L2 Current, table: holding, address: 16, type: u32, unit: A, scale: 0.01}
  - {key: l3_current, label: L3 Current, table: holding, address: 18, type: u32, unit: A, scale: 0.01}
  - {key: x.power_l1, label: L1 Power, table: holding, address: 20, type: s32, unit: W, scale: 0.01}
  - {key: x.power_l2, label: L2 Power, table: holding, address: 22, type: s32, unit: W, scale: 0.01}
  - {key: x.power_l3, label: L3 Power, table: holding, address: 24, type: s32, unit: W, scale: 0.01}
  - {key: x.reactive_power_l1, label: L1 Reactive Power, table: holding, address: 26, type: s32, unit: var, scale: 0.01}
  - {key: x.reactive_power_l2, label: L2 Reactive Power, table: holding, address: 28, type: s32, unit: var, scale: 0.01}
  - {key: x.reactive_power_l3, label: L3 Reactive Power, table: holding, address: 30, type: s32, unit: var, scale: 0.01}
  - {key: x.cosphi_l1, label: L1 Cosphi, table: holding, address: 32, type: u32, scale: 0.001}
  - {key: x.cosphi_l2, label: L2 Cosphi, table: holding, address: 34, type: u32, scale: 0.001}
  - {key: x.cosphi_l3, label: L3 Cosphi, table: holding, address: 36, type: u32, scale: 0.001}
  - {key: x.power, label: Power, table: holding, address: 38, type: s32, unit: W, scale: 0.01}
  - {key: reactive_power, label: Reactive Power, table: holding, address: 40, type: s32, unit: var, scale: 0.01}
  - {key: power_factor, label: Cosphi, table: holding, address: 42, type: u32, scale: 0.001}
  - {key: frequency, label: Frequency, table: holding, address: 44, type: u32, unit: Hz, scale: 0.01}
  - {key: x.imported, label: Imported energy, table: input, address: 2, type: u32, unit: kWh, scale: 0.01, note: openWB notes the scaling differs from the manufacturer document., sources: [openwb]}
  - {key: x.exported, label: Exported energy, table: input, address: 4, type: u32, unit: kWh, scale: 0.01, note: openWB notes the scaling differs from the manufacturer document., sources: [openwb]}
  - {key: x.l1_voltage, label: Voltage L1, table: input, address: 8, type: u32, unit: V, scale: 0.1, sources: [openwb]}
  - {key: x.l2_voltage, label: Voltage L2, table: input, address: 10, type: u32, unit: V, scale: 0.1, sources: [openwb]}
  - {key: x.l3_voltage, label: Voltage L3, table: input, address: 12, type: u32, unit: V, scale: 0.1, sources: [openwb]}
  - {key: x.l1_current, label: Current L1, table: input, address: 14, type: u32, unit: A, scale: 0.01, sources: [openwb]}
  - {key: x.l2_current, label: Current L2, table: input, address: 16, type: u32, unit: A, scale: 0.01, sources: [openwb]}
  - {key: x.l3_current, label: Current L3, table: input, address: 18, type: u32, unit: A, scale: 0.01, sources: [openwb]}
  - {key: l1_power, label: Power L1, table: input, address: 20, type: s32, unit: W, scale: 0.01, positive: import, sources: [openwb]}
  - {key: l2_power, label: Power L2, table: input, address: 22, type: s32, unit: W, scale: 0.01, positive: import, sources: [openwb]}
  - {key: l3_power, label: Power L3, table: input, address: 24, type: s32, unit: W, scale: 0.01, positive: import, sources: [openwb]}
  - {key: x.l1_power_factor, label: Power factor L1, table: input, address: 32, type: u32, scale: 0.1, note: openWB divides by 1000 instead of 10 when any phase would exceed 1., sources: [openwb]}
  - {key: x.l2_power_factor, label: Power factor L2, table: input, address: 34, type: u32, scale: 0.1, note: openWB divides by 1000 instead of 10 when any phase would exceed 1., sources: [openwb]}
  - {key: x.l3_power_factor, label: Power factor L3, table: input, address: 36, type: u32, scale: 0.1, note: openWB divides by 1000 instead of 10 when any phase would exceed 1., sources: [openwb]}
  - {key: grid_power, label: Total power, table: input, address: 38, type: s32, unit: W, scale: 0.01, positive: import, sources: [openwb]}
  - {key: x.frequency, label: Frequency, table: input, address: 44, type: u32, unit: Hz, scale: 0.01, sources: [openwb]}
  - {key: serial, label: Serial number, table: input, address: 51, type: u32, sources: [openwb]}

notes:
- mbmd (type code MPM) detects the meter by reading L1 Voltage (holding register 8, u32, scale 0.1); its bus scan accepts
  a value within 10% of 110 or 230 V.
- openWB reads the MPM3PM with function 04 (input registers), as charge point meter at unit 5 (charge point 0) or 6 (charge
  point 1).
- openWB finds the charge point meter by trying MPM3PM, SDM and B23 at their unit ids and taking the first whose L1 voltage
  reads above 200 V.
- Taken from openWB 2 (open-source); not checked against manufacturer documents.
- The sources don't state the default unit id; 1 is a guess.
- Identification as mbmd recognises the device (not checked against a document).
- Taken from open-source projects (see sources); not checked against manufacturer documents.
