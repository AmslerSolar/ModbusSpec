modbusspec: 0
id: fronius-smart-meter
manufacturer: Fronius
name: Smart Meter behind a GEN24 (SunSpec meter, float or int + SF)
kind: meter

sources:
- title: Fronius GEN24 / GEN24 Plus Modbus TCP & RTU (operating instructions)
  version: 42,0410,2649
  url: http://www.fronius.com/QR-link/0024
  sha256: dc4c5d49362ee0c9721f21886f17fa18497e54c4d92bb5cc2c50472deb266b55
- title: Smart Meter Register Map with Float AC-Meter Model (Fronius workbook)
  url: https://github.com/user-attachments/files/16647659/Smart_Meter_Register_Map_Float.xlsx
  sha256: 033eedee427526527ad9027f0d40d4d095c2c7df2766cc132e01ef3fb6d935ff
- title: SunSpec Information Models (models workbook)
  version: models_workbook.xlsx, master 2026-10-21
  url: https://github.com/sunspec/models/raw/master/models_workbook.xlsx
- id: fronius-modbus
  title: fronius_modbus (Home Assistant integration)
  url: https://github.com/redpomodoro/fronius_modbus
  license: Apache-2.0
  commit: eafca35aa5f5caf01f9952d4f29dbdb9648a7a18
  path: custom_components/fronius_modbus/froniusmodbusclient.py, custom_components/fronius_modbus/froniusmodbusclient_const.py,
    custom_components/fronius_modbus/const.py

connection:
  default_port: 502
  default_unit: 200
  transports:
  - tcp
  limits:
    max_registers: 125

encoding:
  byte_order: big
  word_order: big

identify:
  serial:
    table: holding
    address: 40052
    type: str
    length: 16
  checks:
  - table: holding
    address: 40000
    type: u32
    equals: 1400204883
  - table: holding
    address: 40002
    type: u16
    equals: 1
  # a meter model
  - table: holding
    address: 40069
    type: u16
    in:
    - 201
    - 202
    - 203
    - 204
    - 211
    - 212
    - 213
    - 214

sunspec: true

models:
  - {id: int_sf, name: SunSpec model type "int + SF" (meter model 201-204), match: {table: holding, address: 40069, type: u16, in: [201, 202, 203, 204]}}
  - {id: float, name: SunSpec model type "float" (meter model 211-214), match: {table: holding, address: 40069, type: u16, in: [211, 212, 213, 214]}}

