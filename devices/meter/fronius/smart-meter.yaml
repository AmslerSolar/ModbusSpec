notes:
- 'The Smart Meter is read through the GEN24''s Modbus TCP server: unit id 200 for the first meter (Fronius default, settable
  1-247; meters 2-5 on 201-204).'
- 'Only the grid location (0) is described here. Fronius'' sign table: at the grid, + = consuming from the grid, − = feeding
  in; the ''plus'' energy counter is the import. At other locations (load, generator, sub-load) the signs mean other things.'
- Addresses are chain start + SunSpec offsets with a 65-register Common model (meter model at 40069); Fronius says to find
  the model by walking the chain. The 'SunSpec Model Type' setting of the inverter picks float or int + SF for the meter too.
- 'Fronius: scale factors can change at runtime; read them with every poll.'
- 'Fronius'' float workbook: phase B and C values (and the line-to-line voltages) exist only on meters with those phases;
  they read NaN otherwise. The reactive energy counters (varh, quadrants 1-4) are listed as not supported and the event flags
  as always 0, so they are left out.'
- 'SunSpec ''not implemented'' values: 0x8000 (s16), NaN (float); acc32 counters read 0 when not accumulated.'
- 'Left out: AC voltage Line to Line (holding 40080, s16) from fronius-modbus overlaps x.voltage_ln_avg from the documents.'
- The smart meter answers at its own unit id behind the inverter (project default 200; up to five meters).
- The project adds meter power to the inverter's AC power to get the house load, so meter power is positive when importing
  from the grid.
