modbusspec: 0
id: fronius-sunspec-meter
manufacturer: Fronius
name: Smart Meter behind an inverter, SunSpec float registers as read by openWB
kind: meter

sources:
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/fronius/fronius_sunspec

connection:
  default_port: 502
  default_unit: 1

encoding:
  word_order: big

defaults:
  verified: false
  sources:
  - openwb

sunspec: true

points:
  - {key: l1_current, label: Counter current L1, table: holding, address: 40073, type: f32, unit: A}
  - {key: l2_current, label: Counter current L2, table: holding, address: 40075, type: f32, unit: A}
  - {key: l3_current, label: Counter current L3, table: holding, address: 40077, type: f32, unit: A}
  - {key: l1_voltage, label: Counter voltage L1, table: holding, address: 40081, type: f32, unit: V}
  - {key: l2_voltage, label: Counter voltage L2, table: holding, address: 40083, type: f32, unit: V}
  - {key: l3_voltage, label: Counter voltage L3, table: holding, address: 40085, type: f32, unit: V}
  - {key: frequency, label: Counter frequency, table: holding, address: 40095, type: f32, unit: Hz}
  - {key: grid_power, label: Counter power, table: holding, address: 40097, type: f32, unit: W, positive: export}
  - {key: l1_power, label: Counter power L1, table: holding, address: 40099, type: f32, unit: W, positive: export}
  - {key: l2_power, label: Counter power L2, table: holding, address: 40101, type: f32, unit: W, positive: export}
  - {key: l3_power, label: Counter power L3, table: holding, address: 40103, type: f32, unit: W, positive: export}
  - {key: x.counter_power_factors_l1, label: Counter power factor L1, table: holding, address: 40123, type: f32}
  - {key: x.counter_power_factors_l2, label: Counter power factor L2, table: holding, address: 40125, type: f32}
  - {key: x.counter_power_factors_l3, label: Counter power factor L3, table: holding, address: 40127, type: f32}
  - {key: grid_export_energy, label: Counter exported energy, table: holding, address: 40129, type: f32, unit: kWh, scale: 0.001}
  - {key: grid_import_energy, label: Counter imported energy, table: holding, address: 40137, type: f32, unit: kWh, scale: 0.001}

notes:
- openWB reads these registers at Fronius's 1-based register numbers; the addresses here are those numbers minus 1, as in
  Fronius's register map.
- The sources don't state the default unit id; 1 is a guess.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
