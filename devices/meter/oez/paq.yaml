notes:
- The document lists the registers by plain address for function 03 (read holding registers) and 16 (write); it doesn't say
  whether they are 0- or 1-based. They are taken here as the protocol addresses as printed (unverified).
- Byte order big-endian is stated; the word order of 32- and 64-bit values isn't, most significant word first is assumed.
  "float" is read as f32, "long64" as s64, "unsigned long" as u32.
- No connection settings (port, unit id, interface, serial settings) and no identity registers (model, serial number, firmware)
  are given; port 502 and unit 1 are only defaults. The device can't be identified on the network from this map.
- The energy counters hold the value × 10 in kWh (the document's example); the same scaling and kvarh are assumed for the
  reactive counters. There is no total counter, only four tariffs; the totals are derived as their sum.
- The COM1 / COM2 registry lists the distributed reactive counters inductive first, then capacitive (e.g. 37016 / 37020);
  the COM3 registry, followed here, lists capacitive first. Its output state registers are given at 36000–36003 (overlapping
  the inputs) and the output set registers are missing; the COM3 addresses are used.
- 'Not taken over: the maximum (30200–30364), minimum (30400–30564) and average (30600–30776) blocks, which repeat the measured
  parameters 200, 400 and 600 registers higher (the minimum and maximum blocks hold only one kind of deviation, so the offsets
  differ after Frequency); the harmonics tables 1–40 (absolute and %, phase / line voltage and current, from 30800 up to 35238,
  live, maximum and average); and the flash-memory file access (42500–43005, function 23). The parameter registers are only
  available from the maker on request.'
