# Written from the DEIF Modbus Communication Manual, Multi-instrument MIB 7000C (4189320024C).

modbusspec: 0
id: deif-mib
manufacturer: DEIF
name: MIB 7000C multi-instrument
kind: meter

sources:
- title: Modbus Communication Manual, Multi-instrument MIB 7000C
  version: 4189320024C
  url: https://deif-cdn-umbraco.azureedge.net/media/wfkdikpb/mib-modbus-comm-manual-4189320024-uk.pdf
  sha256: b90d0d2e0d61e240c83cd48e91df9ecab8f2935feeae9b3332cd90db008ee76b

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big


points:
  # Basic analogue measurements (function 03)
  - {key: frequency, label: Frequency F, table: holding, address: 304, type: u16, unit: Hz, scale: 0.01}
  - {key: l1_voltage, label: Phase Voltage V1, table: holding, address: 305, type: u16, unit: V, scale: 0.1, note: 'Raw × PT1/PT2 / 10; the scale here is for direct connection (PT1 = PT2), see notes.', verified: false}
  - {key: l2_voltage, label: Phase Voltage V2, table: holding, address: 306, type: u16, unit: V, scale: 0.1, note: Raw × PT1/PT2 / 10 (direct connection assumed)., verified: false}
  - {key: l3_voltage, label: Phase Voltage V3, table: holding, address: 307, type: u16, unit: V, scale: 0.1, note: Raw × PT1/PT2 / 10 (direct connection assumed)., verified: false}
  - {key: x.voltage_l1_l2, label: Line Voltage V12, table: holding, address: 308, type: u16, unit: V, scale: 0.1, note: Raw × PT1/PT2 / 10 (direct connection assumed)., verified: false}
  - {key: x.voltage_l2_l3, label: Line Voltage V23, table: holding, address: 309, type: u16, unit: V, scale: 0.1, note: Raw × PT1/PT2 / 10 (direct connection assumed)., verified: false}
  - {key: x.voltage_l3_l1, label: Line Voltage V31, table: holding, address: 310, type: u16, unit: V, scale: 0.1, note: Raw × PT1/PT2 / 10 (direct connection assumed)., verified: false}
  - {key: l1_current, label: Current I1, table: holding, address: 311, type: u16, unit: A, scale: 0.001, note: 'Raw × CT1/5 / 1000; the scale here is for CT1 = 5, see notes.', verified: false}
  - {key: l2_current, label: Current I2, table: holding, address: 312, type: u16, unit: A, scale: 0.001, note: Raw × CT1/5 / 1000 (CT1 = 5 assumed)., verified: false}
  - {key: l3_current, label: Current I3, table: holding, address: 313, type: u16, unit: A, scale: 0.001, note: Raw × CT1/5 / 1000 (CT1 = 5 assumed)., verified: false}
  - {key: x.neutral_current, label: Neutral Line Current In, table: holding, address: 314, type: u16, unit: A, scale: 0.001, note: Raw × CT1/5 / 1000 (CT1 = 5 assumed)., verified: false}
  - {key: l1_power, label: Phase Power P1, table: holding, address: 315, type: s16, unit: W, positive: import, note: Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: l2_power, label: Phase Power P2, table: holding, address: 316, type: s16, unit: W, positive: import, note: Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: l3_power, label: Phase Power P3, table: holding, address: 317, type: s16, unit: W, positive: import, note: 'The register table gives 014DH, which breaks the run 013BH–013EH; taken as 013DH (assumed typo). Raw × PT1/PT2 × CT1/5 (direct connection assumed).', verified: false}
  - {key: grid_power, label: System Power Pcon, table: holding, address: 318, type: s16, unit: W, positive: import, note: Raw × PT1/PT2 × CT1/5 (direct connection assumed). The document says positive power is consumption (import)., verified: false}
  - {key: x.l1_reactive_power, label: Phase Reactive Power Q1, table: holding, address: 319, type: s16, unit: var, note: Positive = inductive. Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: x.l2_reactive_power, label: Phase Reactive Power Q2, table: holding, address: 320, type: s16, unit: var, note: Positive = inductive. Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: x.l3_reactive_power, label: Phase Reactive Power Q3, table: holding, address: 321, type: s16, unit: var, note: Positive = inductive. Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: reactive_power, label: System Reactive Power Qcon, table: holding, address: 322, type: s16, unit: var, note: Positive = inductive. Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: apparent_power, label: System Apparent Power Scon, table: holding, address: 323, type: u16, unit: VA, note: Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: x.l1_power_factor, label: Phase Power Factor PF1, table: holding, address: 324, type: s16, scale: 0.001}
  - {key: x.l2_power_factor, label: Phase Power Factor PF2, table: holding, address: 325, type: s16, scale: 0.001}
  - {key: x.l3_power_factor, label: Phase Power Factor PF3, table: holding, address: 326, type: s16, scale: 0.001}
  - {key: power_factor, label: System Power Factor PFcon, table: holding, address: 327, type: s16, scale: 0.001}
  - {key: x.voltage_unbalance, label: Voltage Unbalance Factor U_unbl, table: holding, address: 328, type: u16, unit: '%', scale: 0.1}
  - {key: x.current_unbalance, label: Current Unbalance Factor I_unbl, table: holding, address: 329, type: u16, unit: '%', scale: 0.1}
  - {key: x.load_type, label: Load Type RT (L/C/R), table: holding, address: 330, type: u16, bits: [0, 7], enum: load_type, note: ASCII letter in the low byte.}
  - {key: x.demand_power, label: Power Demand Dmd_P, table: holding, address: 336, type: s16, unit: W, note: Sliding-window average. Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: x.demand_reactive_power, label: Reactive power Demand Dmd_Q, table: holding, address: 337, type: s16, unit: var, note: Raw × PT1/PT2 × CT1/5 (direct connection assumed)., verified: false}
  - {key: x.l1_current_demand, label: Phase 1 current demand I1_Dmd, table: holding, address: 338, type: u16, unit: A, scale: 0.001, note: The table says signed but gives the range 0–65535; read as unsigned. Raw × CT1/5 / 1000 (CT1 = 5 assumed)., verified: false}
  - {key: x.l2_current_demand, label: Phase 2 current demand I2_Dmd, table: holding, address: 339, type: u16, unit: A, scale: 0.001, note: As I1_Dmd., verified: false}
  - {key: x.l3_current_demand, label: Phase 3 current demand I3_Dmd, table: holding, address: 340, type: u16, unit: A, scale: 0.001, note: As I1_Dmd., verified: false}

  # Energy (function 03; presettable with function 16)
  - {key: grid_import_energy, label: Import Energy Ep_imp, table: holding, address: 342, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Energy consumed.}
  - {key: grid_export_energy, label: Export Energy Ep_exp, table: holding, address: 344, type: u32, unit: kWh, scale: 0.1, poll: slow, note: Energy generated.}
  - {key: x.reactive_energy_import, label: Import Reactive Energy Eq_imp, table: holding, address: 346, type: u32, unit: kvarh, scale: 0.1, poll: slow, note: Inductive.}
  - {key: x.reactive_energy_export, label: Export Reactive Energy Eq_exp, table: holding, address: 348, type: u32, unit: kvarh, scale: 0.1, poll: slow, note: Capacitive.}
  - {key: x.apparent_energy, label: Apparent Energy Es, table: holding, address: 350, type: u32, unit: kVAh, scale: 0.1, poll: slow, note: The register table gives kVArh; the measurement chapter kVAh.}

  # Power quality
  - {key: x.thd_v1, label: Total Harmonic Distortion of V1 or V12, table: holding, address: 1024, type: u16, unit: '%', scale: 0.01, note: 'Register table: Rx/100 % (range 0–10000); the measurement chapter gives Rx/1000 × 100 %. The table is followed here. Line-to-line voltages with 2LL wiring.', verified: false}
  - {key: x.thd_v2, label: Total Harmonic Distortion of V2 or V23, table: holding, address: 1025, type: u16, unit: '%', scale: 0.01, note: See THD V1., verified: false}
  - {key: x.thd_v3, label: Total Harmonic Distortion of V3 or V31, table: holding, address: 1026, type: u16, unit: '%', scale: 0.01, note: See THD V1., verified: false}
  - {key: x.thd_i1, label: Total Harmonic Distortion of I1, table: holding, address: 1027, type: u16, unit: '%', scale: 0.01, note: See THD V1., verified: false}
  - {key: x.thd_i2, label: Total Harmonic Distortion of I2, table: holding, address: 1028, type: u16, unit: '%', scale: 0.01, note: See THD V1., verified: false}
  - {key: x.thd_i3, label: Total Harmonic Distortion of I3, table: holding, address: 1029, type: u16, unit: '%', scale: 0.01, note: See THD V1., verified: false}

  # Running hours
  - {key: x.running_hours, label: Running hour meter RH, table: holding, address: 1148, type: u32, unit: h, scale: 0.1, poll: slow, note: Hours the instrument has had auxiliary supply.}

  # Settings (function 03 / 16)
  - {key: x.modbus_address, label: Communication Address, table: holding, address: 257, type: u16, writable: true, min: 0, max: 247, poll: slow}
  - {key: x.baud_rate, label: Baud Rate, table: holding, address: 258, type: u16, unit: Bd, writable: true, min: 1200, max: 38400, poll: slow, note: The value is the baud rate itself.}
  - {key: x.voltage_wiring, label: Voltage Input Wiring Type, table: holding, address: 259, type: u16, enum: voltage_wiring, writable: true, poll: slow}
  - {key: x.current_wiring, label: Current Input Wiring Type, table: holding, address: 260, type: u16, enum: current_wiring, writable: true, poll: slow}
  - {key: x.pt1, label: PT1, table: holding, address: 261, type: u32, unit: V, writable: true, min: 50, max: 1000000, poll: slow, note: Voltage transformer primary. Unit not stated in the document; assumed V., verified: false}
  - {key: x.pt2, label: PT2, table: holding, address: 263, type: u16, unit: V, writable: true, min: 50, max: 400, poll: slow, note: Voltage transformer secondary. Unit not stated in the document; assumed V., verified: false}
  - {key: x.ct1, label: CT1, table: holding, address: 264, type: u16, unit: A, writable: true, poll: slow, note: Current transformer primary (the range column only says 5). Unit not stated in the document; assumed A., verified: false}
  - {key: x.demand_window, label: Time of Dmd slide window, table: holding, address: 268, type: u16, unit: min, writable: true, min: 1, max: 30, poll: slow}

enums:
  load_type: {'67': Capacitive (C), '76': Inductive (L), '82': Resistive (R)}
  voltage_wiring: {'0': 3LN, '1': 2LN, '2': 2LL, '3': 3LL}
  current_wiring: {'0': 3CT, '1': 1CT, '2': 2CT}

notes:
- Modbus RTU over RS485 only, function 03 for reading and 16 for presetting (01/02/05 for relay outputs and digital inputs,
  whose addresses the document doesn't list). The addresses are the protocol addresses as given (hex, 0-based). 32-bit values
  have the high word first.
- Port 502 (behind a gateway), unit id 1 and 9600 Bd are not stated in the document; assumed (address range 0–247, baud 1200–38400,
  8N1).
- 'Voltages, currents and powers are sent relative to the transformer ratios: voltage = raw × PT1/PT2 / 10, current = raw
  × CT1/5 / 1000, power = raw × PT1/PT2 × CT1/5. That product of registers can''t be expressed here; the scales assume a direct
  connection (PT1 = PT2, CT1 = 5). With transformers, multiply by the ratios read from 0x0105–0x0108.'
- Positive active power means consumption (import), negative generation; positive reactive power means inductive.
- 'Left out: the access code, the clear commands (max, energy, run time), backlight, CT2 and reactive-power definition settings,
  the max./min. statistics (0x0460–0x0478) and the individual harmonics 2nd–15th (0x0406–0x0459).'
- The document has no register that identifies the instrument or its serial number.
