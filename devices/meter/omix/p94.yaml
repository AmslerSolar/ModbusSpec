# Written from the Omix P94-ML-1-0.5-RS485 operating manual (2019-07-23).

modbusspec: 0
id: omix-p94
manufacturer: Omix
name: P94-ML-1-0.5-RS485 panel multimeter
kind: meter

sources:
- title: Щитовой однофазный мультиметр OMIX P94-ML-1-0.5-RS485, руководство по эксплуатации
  version: '2019-07-23'
  url: https://teplogazkip.ru/documentation/ark-energoservis/elektrika/elektroizmeritelnye-pribory/kombinirovannye-pribory/P94-ML-1-0.5-RS485-instrukciya.pdf
  sha256: ae0ffe7d02f465806e285dda66bc0fdf12d3556cc3169a56998ee287b3224c4f

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N1
  write_multiple: true

encoding:
  byte_order: big
  word_order: big

defaults:
  verified: false

points:
  # Settings (read 03, write 10)
  - {key: x.node_address, label: Network address (DZ), table: holding, address: 1, type: u16, bits: [8, 15], writable: true, min: 1, max: 247, poll: slow, note: 'Shares the register with the baud rate: high byte = address, low byte = baud rate (bytes per the document''s rule for shared registers; which byte holds which is inferred from its DISP / DISL example).'}
  - {key: x.baud_rate, label: Baud rate (TXK), table: holding, address: 1, type: u16, bits: [0, 7], enum: baud_rate, writable: true, poll: slow}
  - {verified: true, key: x.circuit_type, label: Circuit type (XS1), table: holding, address: 2, type: u16, writable: true, poll: slow, note: The document gives no value table.}
  - {verified: true, key: x.pt_ratio, label: Voltage transformer ratio (PT), table: holding, address: 3, type: u16, writable: true, poll: slow}
  - {verified: true, key: x.ct_ratio, label: Current transformer ratio (CT), table: holding, address: 4, type: u16, writable: true, poll: slow}
  - {verified: true, key: x.display_value, label: Displayed value (DISP), table: holding, address: 11, type: u16, bits: [8, 15], writable: true, poll: slow, note: '0 = cycle through all values; 1…10 = one value (V, A, Hz, W, var, cos φ, forward Wh, reverse Wh, forward varh, reverse varh).'}
  - {verified: true, key: x.backlight_off_time, label: Backlight auto-off time (DISL), table: holding, address: 11, type: u16, bits: [0, 7], unit: s, writable: true, poll: slow, note: 0 = always on.}
  # Measurements (read 03)
  - {verified: true, key: l1_voltage, label: Phase voltage A (Ua), table: holding, address: 37, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: l2_voltage, label: Phase voltage B (Ub), table: holding, address: 38, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: l3_voltage, label: Phase voltage C (Uc), table: holding, address: 39, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: x.voltage_l1_l2, label: Line voltage L1–L2 (Uab), table: holding, address: 40, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: x.voltage_l2_l3, label: Line voltage L2–L3 (Ubc), table: holding, address: 41, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: x.voltage_l3_l1, label: Line voltage L3–L1 (Uca), table: holding, address: 42, type: u16, unit: V, scale: 0.1}
  - {verified: true, key: l1_current, label: Current phase A (Ia), table: holding, address: 43, type: u16, unit: A, scale: 0.1}
  - {verified: true, key: l2_current, label: Current phase B (Ib), table: holding, address: 44, type: u16, unit: A, scale: 0.1}
  - {verified: true, key: l3_current, label: Current phase C (Ic), table: holding, address: 45, type: u16, unit: A, scale: 0.1}
  - {key: l1_power, label: Active power phase A (Pa), table: holding, address: 46, type: s16, unit: W, scale: 0.1, positive: import, note: Signed and direction not stated; assumed (forward = import). Unit W assumed.}
  - {key: l2_power, label: Active power phase B (Pb), table: holding, address: 47, type: s16, unit: W, scale: 0.1, positive: import, note: See phase A.}
  - {key: l3_power, label: Active power phase C (Pc), table: holding, address: 48, type: s16, unit: W, scale: 0.1, positive: import, note: See phase A.}
  - {key: grid_power, label: Total active power (Ps), table: holding, address: 49, type: s16, unit: W, scale: 0.1, positive: import, note: Signed and direction not stated in the document; assumed (forward = import). Unit W assumed.}
  - {key: x.reactive_power_a, label: Reactive power phase A (Qa), table: holding, address: 50, type: s16, unit: var, scale: 0.1, note: Signed and unit assumed.}
  - {key: x.reactive_power_b, label: Reactive power phase B (Qb), table: holding, address: 51, type: s16, unit: var, scale: 0.1, note: Signed and unit assumed.}
  - {key: x.reactive_power_c, label: Reactive power phase C (Qc), table: holding, address: 52, type: s16, unit: var, scale: 0.1, note: Signed and unit assumed.}
  - {key: reactive_power, label: Total reactive power (Qs), table: holding, address: 53, type: s16, unit: var, scale: 0.1, note: Signed and unit assumed.}
  - {key: x.power_factor_a, label: Power factor phase A (PFa), table: holding, address: 54, type: s16, unit: '', scale: 0.001, note: Signed assumed.}
  - {key: x.power_factor_b, label: Power factor phase B (PFb), table: holding, address: 55, type: s16, unit: '', scale: 0.001, note: Signed assumed.}
  - {key: x.power_factor_c, label: Power factor phase C (PFc), table: holding, address: 56, type: s16, unit: '', scale: 0.001, note: Signed assumed.}
  - {key: power_factor, label: Total power factor (PFs), table: holding, address: 57, type: s16, unit: '', scale: 0.001, note: Signed assumed.}
  - {key: x.apparent_power_a, label: Apparent power phase A (Sa), table: holding, address: 58, type: u16, unit: VA, scale: 0.1, note: Unit assumed.}
  - {key: x.apparent_power_b, label: Apparent power phase B (Sb), table: holding, address: 59, type: u16, unit: VA, scale: 0.1, note: Unit assumed.}
  - {key: x.apparent_power_c, label: Apparent power phase C (Sc), table: holding, address: 60, type: u16, unit: VA, scale: 0.1, note: Unit assumed.}
  - {key: apparent_power, label: Total apparent power (Ss), table: holding, address: 61, type: u16, unit: VA, scale: 0.1, note: Unit assumed.}
  - {verified: true, key: frequency, label: Frequency (F), table: holding, address: 62, type: u16, unit: Hz, scale: 0.1}
  - {key: grid_import_energy, label: Forward active energy (EPP), table: holding, address: 71, type: f32, unit: kWh, scale: 0.001, poll: slow, note: 'Float in Wh (the document writes the unit as W); word order not stated, assumed high word first.'}
  - {key: grid_export_energy, label: Reverse active energy (EPN), table: holding, address: 73, type: f32, unit: kWh, scale: 0.001, poll: slow, note: See forward active energy.}
  - {key: x.import_reactive_energy, label: Forward reactive energy (EQP), table: holding, address: 75, type: f32, unit: kvarh, scale: 0.001, poll: slow, note: See forward active energy.}
  - {key: x.export_reactive_energy, label: Reverse reactive energy (WQN), table: holding, address: 77, type: f32, unit: kvarh, scale: 0.001, poll: slow, note: See forward active energy.}

enums:
  baud_rate: {'0': '9600', '1': '4800', '2': '2400', '3': '1200'}

notes:
- The document names ООО «Автоматика» (St Petersburg) as producer of the Omix-branded meter.
- 'Addresses are the document''s hex register addresses, used as protocol addresses (it states no other numbering). All are
  holding registers: read 03, write 10.'
- The meter is single-phase, but its register table lists phases A, B and C, line voltages and totals; on this model presumably
  only phase A and the totals carry values (not stated).
- Points marked unverified have a sign, unit or word order the document doesn't state. The 16-bit values with scale 0.1 limit
  power to about 3.2 kW (signed) unless the readings are secondary values before the PT / CT ratio; the document doesn't say.
- 'Defaults: address 1, 9600 baud, 8N1 (the menu also offers 8O1 and 8E1). The register''s baud codes (0 = 9600 … 3 = 1200)
  differ from the front-panel menu codes (1 = 1200 … 4 = 9600).'
- No serial number or model register is documented, so a network search can't recognise the device.
