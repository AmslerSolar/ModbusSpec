modbusspec: 0
id: peacefair-pzem-dc
manufacturer: Peacefair
name: PZEM-003 / PZEM-017 DC energy meters
kind: meter

sources:
- id: tasmota
  title: Tasmota (energy meter drivers)
  url: https://github.com/arendst/Tasmota
  license: GPL-3.0
  commit: 4df6fa1d4bf6c4e98765eb76a096a597fb5af709
  path: tasmota/tasmota_xnrg_energy/xnrg_06_pzem_dc.ino

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  serial:
    baud: 9600
    format: 8N2

defaults:
  verified: false
  sources:
  - tasmota

points:
  - {key: x.current_range, label: Current range (shunt), table: holding, address: 3, type: u16, enum: current_range, writable: true, note: Tasmota writes (range in A / 50) shifted right by one bit.}
  - {key: x.modbus_address, label: Modbus address, table: holding, address: 2, type: u16, unit_id: 248, writable: true, note: Tasmota sets it with function 06; unit 0xF8 reaches any meter on the bus.}
  - {key: x.voltage, label: Voltage, table: input, address: 0, type: u16, unit: V, scale: 0.01}
  - {key: x.current, label: Current, table: input, address: 1, type: u16, unit: A, scale: 0.01}
  - {key: x.active_power, label: Active power, table: input, address: 2, type: u32, unit: W, scale: 0.1, word_order: little}
  - {key: x.import_active, label: Import active energy, table: input, address: 4, type: u32, unit: kWh, scale: 0.001, word_order: little}

enums:
  current_range: {'0': 50 A, '1': 100 A, '2': 200 A, '3': 300 A}

notes:
- 32-bit values are sent low word first.
- The meter counts consumed energy only; its readings are unsigned.
- Taken from open-source projects (see sources); not checked against manufacturer documents.
