# Written from the Carlo Gavazzi EM210_AV communication protocol (Version 4 Revision 3, 2018-05-10).

modbusspec: 0
id: carlogavazzi-em210
manufacturer: Carlo Gavazzi
name: EM210 energy meter
kind: meter

sources:
- title: Carlo Gavazzi EM210_AV Communication Protocol
  version: Version 4 Revision 3 (2018-05-10)
  url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM210_CP.pdf
  sha256: b1edeb5732c21bf32abf938c3848f3a4b247fca45b0e4551f35f0dbc5cd51dbc
  archive_url: https://web.archive.org/web/20250110111813/https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM210_CP.pdf

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  input_equals_holding: true
  write_single: true   # writing only with function 06 (no 16)
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 61
    max_gap: 0

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 20480
    type: str
    length: 7
  checks:
  - table: input
    address: 11
    type: u16
    equals: 210

points:
  # Instantaneous variables
  - {key: l1_voltage, label: V L1-N, table: input, address: 0, type: s32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: V L2-N, table: input, address: 2, type: s32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: V L3-N, table: input, address: 4, type: s32, unit: V, scale: 0.1}
  - {key: x.l1_l2_voltage, label: V L1-L2, table: input, address: 6, type: s32, unit: V, scale: 0.1}
  - {key: x.l2_l3_voltage, label: V L2-L3, table: input, address: 8, type: s32, unit: V, scale: 0.1}
  - {key: x.l3_l1_voltage, label: V L3-L1, table: input, address: 10, type: s32, unit: V, scale: 0.1}
  - {key: l1_current, label: A L1, table: input, address: 12, type: s32, unit: A, scale: 0.001}
  - {key: l2_current, label: A L2, table: input, address: 14, type: s32, unit: A, scale: 0.001}
  - {key: l3_current, label: A L3, table: input, address: 16, type: s32, unit: A, scale: 0.001}
  - {key: l1_power, label: W L1, table: input, address: 18, type: s32, unit: W, scale: 0.1, positive: import}
  - {key: l2_power, label: W L2, table: input, address: 20, type: s32, unit: W, scale: 0.1, positive: import}
  - {key: l3_power, label: W L3, table: input, address: 22, type: s32, unit: W, scale: 0.1, positive: import}
  - {key: x.l1_apparent_power, label: VA L1, table: input, address: 24, type: s32, unit: VA, scale: 0.1}
  - {key: x.l2_apparent_power, label: VA L2, table: input, address: 26, type: s32, unit: VA, scale: 0.1}
  - {key: x.l3_apparent_power, label: VA L3, table: input, address: 28, type: s32, unit: VA, scale: 0.1}
  - {key: x.l1_reactive_power, label: VAR L1, table: input, address: 30, type: s32, unit: var, scale: 0.1}
  - {key: x.l2_reactive_power, label: VAR L2, table: input, address: 32, type: s32, unit: var, scale: 0.1}
  - {key: x.l3_reactive_power, label: VAR L3, table: input, address: 34, type: s32, unit: var, scale: 0.1}
  - {key: x.system_voltage_ln, label: V L-N, table: input, address: 36, type: s32, unit: V, scale: 0.1}
  - {key: x.system_voltage_ll, label: V L-L, table: input, address: 38, type: s32, unit: V, scale: 0.1}
  - {key: grid_power, label: W, table: input, address: 40, type: s32, unit: W, scale: 0.1, positive: import, note: 'The document: negative values are exported, positive values imported active power.'}
  - {key: apparent_power, label: VA, table: input, address: 42, type: s32, unit: VA, scale: 0.1}
  - {key: reactive_power, label: VAR, table: input, address: 44, type: s32, unit: var, scale: 0.1}
  - {key: x.l1_power_factor, label: PF L1, table: input, address: 46, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: x.l2_power_factor, label: PF L2, table: input, address: 47, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: x.l3_power_factor, label: PF L3, table: input, address: 48, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: power_factor, label: PF, table: input, address: 49, type: s16, unit: '', scale: 0.001, invalid: [32767], note: Negative with exported active power.}
  - {key: x.phase_sequence, label: Phase sequence, table: input, address: 50, type: s16, enum: phase_sequence, invalid: [32767]}
  - {key: frequency, label: Hz, table: input, address: 51, type: s16, unit: Hz, scale: 1, invalid: [32767], verified: false, note: 'The document gives the value weight as Hz (×1), unlike the ×10 of the other Carlo Gavazzi meters. A reader may take a raw value above 100 as Hz × 10.'}
  - {key: grid_import_energy, label: kWh(+) TOT, table: input, address: 52, type: s32, unit: kWh, scale: 0.1}
  - {key: x.import_reactive_energy, label: kvarh(+) TOT, table: input, address: 54, type: s32, unit: kvarh, scale: 0.1}
  - {key: grid_export_energy, label: kWh(-) TOT, table: input, address: 78, type: s32, unit: kWh, scale: 0.1}
  - {key: x.run_hours, label: Hour counter meter, table: input, address: 90, type: s32, unit: h, scale: 0.01, poll: slow}

  # Identification and settings
  - {key: serial, label: Serial number (letters 1–13), table: input, address: 20480, type: str, length: 7, poll: slow}
  - {key: x.production_year, label: Instrument production year, table: input, address: 20487, type: u16, poll: slow}
  - {key: firmware, label: Version code, table: input, address: 770, type: u16, poll: slow, note: '0 = version A, 1 = B, …'}
  - {key: x.revision_code, label: Revision code, table: input, address: 771, type: u16, poll: slow}
  - {key: x.programming_lock, label: Programming lock, table: input, address: 772, type: u16, enum: programming_lock, poll: slow}
  - {key: x.measuring_system, label: Measuring system, table: input, address: 4098, type: u16, enum: measuring_system, poll: slow, writable: true}
  - {key: x.ct_ratio, label: Current transformer ratio, table: input, address: 4099, type: u32, scale: 0.1, poll: slow, writable: true, min: 1, max: 999}
  - {key: x.vt_ratio, label: Voltage transformer ratio, table: input, address: 4101, type: u32, scale: 0.1, poll: slow, writable: true, min: 1, max: 999}
  - {key: x.wrong_connection, label: Wrong connection (installing help) status, table: input, address: 4357, type: u16, flags: wrong_connection, poll: slow}
  - {key: x.application, label: Type of application, table: input, address: 4864, type: u16, enum: application, poll: slow, writable: true}
  - {key: x.rs485_address, label: RS485 instrument address, table: input, address: 8192, type: u16, poll: slow, writable: true, min: 1, max: 247}
  - {key: x.rs485_baud, label: RS485 baud rate, table: input, address: 8193, type: u16, enum: baud, poll: slow, writable: true}
  - {key: x.rs485_parity, label: RS485 parity, table: input, address: 8194, type: u16, enum: parity, poll: slow, writable: true}
  - {key: x.rs485_stop_bits, label: RS485 stop bit, table: input, address: 8195, type: u16, enum: stop_bits, poll: slow, writable: true}

enums:
  phase_sequence: {'-1': L1-L3-L2, '0': L1-L2-L3}
  measuring_system: {'0': 3Pn, '1': 3P, '2': 2P, '3': 1P, '4': 3P1}
  programming_lock: {'0': Programming unlocked, '1': Programming locked}
  application: {'0': A, '1': B, '2': C, '3': D, '4': E, '5': F}
  baud: {'0': '9600', '1': '19200', '2': '38400', '3': '57600', '4': '115200'}
  parity: {'0': None, '1': Even}
  stop_bits: {'0': '1', '1': '2'}

flags:
  wrong_connection: {'0': Wrong voltage sequence, '1': Phase 1 inverted, '2': Phase 2 inverted, '3': Phase 3 inverted, '4': Phases 1 and 2 exchanged, '5': Phases 1 and 3 exchanged, '6': Phases 2 and 3 exchanged, '7': 'Phases 1, 2, 3 exchanged'}

problems:
  - {when: {key: x.wrong_connection, bit: 0}, kind: warning, text: 'Wrong wiring: wrong voltage sequence (bit 0)'}
  - {when: {key: x.wrong_connection, bit: 1}, kind: warning, text: 'Wrong wiring: phase 1 inverted (bit 1)'}
  - {when: {key: x.wrong_connection, bit: 2}, kind: warning, text: 'Wrong wiring: phase 2 inverted (bit 2)'}
  - {when: {key: x.wrong_connection, bit: 3}, kind: warning, text: 'Wrong wiring: phase 3 inverted (bit 3)'}
  - {when: {key: x.wrong_connection, bit: 4}, kind: warning, text: 'Wrong wiring: phases 1 and 2 exchanged (bit 4)'}
  - {when: {key: x.wrong_connection, bit: 5}, kind: warning, text: 'Wrong wiring: phases 1 and 3 exchanged (bit 5)'}
  - {when: {key: x.wrong_connection, bit: 6}, kind: warning, text: 'Wrong wiring: phases 2 and 3 exchanged (bit 6)'}
  - {when: {key: x.wrong_connection, bit: 7}, kind: warning, text: 'Wrong wiring: phases 1, 2, 3 exchanged (bit 7)'}

notes:
- The addresses are the document's "physical address" (its 3xxxxx numbers minus 300001).
- 32-bit integers are least significant word first; bytes within a register most significant first.
- 'Overflow (display "EEE"): the most significant word of a variable reads 7FFFh; treat such values as not available.'
- At most 61 registers per request. Registers 0038h–004Dh aren't documented, so readers shouldn't read across them. There
  is no kvarh(−) register.
- The identification code 000Bh (210 for the standard EM210; special versions have other codes) overlaps V L3-L1 and must
  be read alone with length 1; so must 0302h–0304h.
- With the measuring system set to 1P or 2P the unused phases read 0.
- 'RS485 defaults: 9600 baud, no parity, 1 stop bit.'
