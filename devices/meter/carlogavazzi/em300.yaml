  - {key: x.import_l2, label: L2 Import, table: input, address: 66, type: s32, unit: kWh, scale: 0.1, verified: false, sources: [mbmd]}
  - {key: x.import_l3, label: L3 Import, table: input, address: 68, type: s32, unit: kWh, scale: 0.1, verified: false, sources: [mbmd]}

enums:
  phase_sequence: {'-1': L1-L3-L2, '0': L1-L2-L3, '1': L1-L3-L2}
  measuring_system: {'0': 3Pn, '1': 3P, '2': 2P}
  measurement_mode: {'0': A (easy connection), '1': B (bidirectional)}
  baud: {'1': '9600', '2': '19200', '3': '38400', '4': '57600', '5': '115200'}
  parity: {'1': None, '2': Even}
  stop_bits: {'0': '1', '1': '1', '2': '2'}
  off_on: {'0': 'Off', '1': 'On'}
  tariff_em341: {'0': Tariff 1, '1': Tariff 2, '2': Tariff 3, '3': Tariff 4}
  season: {'0': Spring, '1': Summer, '2': Autumn, '3': Winter}
  day_type: {'1': Working day, '2': Festive day, '3': Pre-festive day}
  time_slot: {'0': Slot 1, '1': Slot 2, '2': Slot 3, '3': Slot 4, '4': Slot 5, '5': Slot 6}

flags:
  wrong_connection: {'0': Wrong voltage sequence, '1': Phase 1 inverted, '2': Phase 2 inverted, '3': Phase 3 inverted, '4': Phases 1 and 2 exchanged, '5': Phases 1 and 3 exchanged, '6': Phases 2 and 3 exchanged, '7': 'Phases 1, 2, 3 exchanged'}
  output_status: {'0': Alarm 1 on, '1': Alarm 1 output closed, '2': Alarm 2 on, '3': Alarm 2 output closed}

problems:
  - {when: {key: x.wrong_connection, bit: 0}, kind: warning, text: 'Wrong wiring: wrong voltage sequence (bit 0)'}
  - {when: {key: x.wrong_connection, bit: 1}, kind: warning, text: 'Wrong wiring: phase 1 inverted (bit 1)'}
  - {when: {key: x.wrong_connection, bit: 2}, kind: warning, text: 'Wrong wiring: phase 2 inverted (bit 2)'}
  - {when: {key: x.wrong_connection, bit: 3}, kind: warning, text: 'Wrong wiring: phase 3 inverted (bit 3)'}
  - {when: {key: x.wrong_connection, bit: 4}, kind: warning, text: 'Wrong wiring: phases 1 and 2 exchanged (bit 4)'}
  - {when: {key: x.wrong_connection, bit: 5}, kind: warning, text: 'Wrong wiring: phases 1 and 3 exchanged (bit 5)'}
  - {when: {key: x.wrong_connection, bit: 6}, kind: warning, text: 'Wrong wiring: phases 2 and 3 exchanged (bit 6)'}
  - {when: {key: x.wrong_connection, bit: 7}, kind: warning, text: 'Wrong wiring: phases 1, 2, 3 exchanged (bit 7)'}

notes:
- The addresses are the document's "physical address" (its 3xxxxx numbers minus 300001).
- 32-bit integers are least significant word first; bytes within a register most significant first.
- 'Not covered: identification codes 330 and 340, EM330 / EM340 engineering samples that send the most significant word first
  (330 is listed in the Version 2 Revision 9 document).'
- 'Overflow (display "EEE"): the most significant word of a variable reads 7FFFh; treat such values as not available.'
- At most 50 registers per request (also readable at 2004h). The identification code 000Bh overlaps V L3-L1 and must be read
  alone with length 1.
- Measurement mode A (easy connection, PFA models) reports power and current always positive and kWh always increasing, so
  export can't be seen. Use mode B (bidirectional, PFB models) at the grid connection.
- With the measuring system 2P only L1 + L2 are in use.
- 'RS485 defaults: address 1, 9600 baud, no parity, 1 stop bit.'
- mbmd (type code CGEX3X0) detects the meter by reading L1 Voltage (input register 0, s32, word order little, scale 0.1);
  its bus scan accepts a value within 10% of 110 or 230 V.
- The driver's default meter type is PRODUCTION; OpenEMS doesn't say which way the device's own power value is positive, so
  no direction is given.
- OpenEMS has an 'Invert' option that negates the power values and swaps the two energy counters; the points here are the
  reading with it off.
- Identification as mbmd recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
