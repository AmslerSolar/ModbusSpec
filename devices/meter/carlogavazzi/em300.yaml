  - {key: x.l2_current_thd, label: THD A L2, table: input, address: 132, type: s32, unit: '%', scale: 0.01, models: [et330_av5, et330_av6, et340], note: 'Only ET series, with THD calculation on (1106h); Version 2 Revision 9 document.'}
