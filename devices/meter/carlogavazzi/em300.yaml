# ET-only energies and THD and the EM341 extras from the Version 2 Revision 9 edition.

modbusspec: 0
id: carlogavazzi-em300
manufacturer: Carlo Gavazzi
name: EM330 / EM331 / EM340 / EM341 / ET330 / ET340 energy meters
kind: meter

sources:
- title: Carlo Gavazzi EM300 / ET300 Series Communication Protocol
  version: Version 2 Revision 17 (2021-07-05)
  url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM330_EM340_ET330_ET340_CP.pdf
  sha256: df1a113bd360af4189cced7a369c59ebc3c59ee94991f91c2ff92945c2bc2b7d
  archive_url: https://web.archive.org/web/20260520065222/https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM330_EM340_ET330_ET340_CP.pdf
- title: Carlo Gavazzi EM300 Series and ET300 Series Communication Protocol
  version: Version 2 Revision 9 (EM341 edition)
  url: https://www.galoz.co.il/wp-content/uploads/2014/11/EM341-Modbus.pdf
  sha256: c76a245a189f53568b95fd72a9d5da264961c19782593468bf6e362a77b571f5
  archive_url: https://web.archive.org/web/20240214025138/https://www.galoz.co.il/wp-content/uploads/2014/11/EM341-Modbus.pdf
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/carlogavazzi-ex3x0.go
- id: openems
  title: OpenEMS Edge (open energy management system)
  url: https://github.com/OpenEMS/openems
  license: EPL-2.0
  commit: 25b4c2dd47e5566039ba280a3490b3d944079435
  path: io.openems.edge.meter.carlo.gavazzi/src/io/openems/edge/meter/carlo/gavazzi/em300/MeterCarloGavazziEm300Impl.java
- id: openwb
  title: openWB 2 (wallbox and energy management)
  url: https://github.com/openWB/core
  license: GPL-3.0
  commit: 809ac7425348dc4a0a2e080e742dfcd2f3cfc992
  path: packages/modules/devices/carlo_gavazzi/carlo_gavazzi

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  input_equals_holding: true
  serial:
    baud: 9600
    format: 8N1
  limits:
    max_registers: 50
    max_gap: 32

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 20480
    type: str
    length: 7
    chars: low
  checks:
  - table: input
    address: 11
    type: u16
    in:
    - 331
    - 332
    - 355
    - 335
    - 336
    - 341
    - 346
    - 345

models:
  - {id: em330_av6, name: EM330 (AV6), match: {table: input, address: 11, type: u16, equals: 331}}
  - {id: em330_av5, name: EM330 (AV5), match: {table: input, address: 11, type: u16, equals: 332}}
  - {id: em331, name: EM331, match: {table: input, address: 11, type: u16, equals: 355}}
  - {id: et330_av5, name: ET330 (AV5), match: {table: input, address: 11, type: u16, equals: 335}}
  - {id: et330_av6, name: ET330 (AV6), match: {table: input, address: 11, type: u16, equals: 336}}
  - {id: em340, name: EM340, match: {table: input, address: 11, type: u16, equals: 341}}
  - {id: em341, name: EM341, match: {table: input, address: 11, type: u16, equals: 346}}
  - {id: et340, name: ET340, match: {table: input, address: 11, type: u16, equals: 345}}

points:
