  - {key: x.l3_power_factor, label: PF L3, table: input, address: 48, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: power_factor, label: PF sys, table: input, address: 49, type: s16, unit: '', scale: 0.001, invalid: [32767], note: Negative with exported active power.}
