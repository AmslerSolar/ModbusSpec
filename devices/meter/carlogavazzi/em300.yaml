  - {key: x.system_voltage_ll, label: V L-L sys, table: input, address: 38, type: s32, unit: V, scale: 0.1}
  - {key: grid_power, label: W sys, table: input, address: 40, type: s32, unit: W, scale: 0.1, positive: import, note: 'Bidirectional mode (B / PFB): quadrants II and III show −W and count kWh(−), i.e. negative = export; the PF notes say the same. In easy connection mode (A / PFA) P is always positive and export can''t be seen.'}
