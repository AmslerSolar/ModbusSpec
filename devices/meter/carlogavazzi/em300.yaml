  - {key: grid_import_energy, label: kWh (+) TOT, table: input, address: 52, type: s32, unit: kWh, scale: 0.1}
  - {key: x.import_reactive_energy, label: kvarh (+) TOT, table: input, address: 54, type: s32, unit: kvarh, scale: 0.1}
  - {key: x.power_demand, label: kW dmd, table: input, address: 56, type: s32, unit: W, scale: 0.1}
  - {key: grid_export_energy, label: kWh (-) TOT, table: input, address: 78, type: s32, unit: kWh, scale: 0.1, note: Counts only in bidirectional mode.}
  - {key: x.export_reactive_energy, label: kvarh (-) TOT, table: input, address: 80, type: s32, unit: kvarh, scale: 0.1}
