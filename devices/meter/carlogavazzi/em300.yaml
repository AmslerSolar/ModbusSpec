  - {key: x.l1_voltage_thd, label: THD V L1-N, table: input, address: 138, type: s32, unit: '%', scale: 0.01, models: [et330_av5, et330_av6, et340], note: 'Only ET series, with THD calculation on (1106h); Version 2 Revision 9 document.'}
  - {key: x.l2_voltage_thd, label: THD V L2-N, table: input, address: 140, type: s32, unit: '%', scale: 0.01, models: [et330_av5, et330_av6, et340], note: 'Only ET series, with THD calculation on (1106h); Version 2 Revision 9 document.'}
  - {key: x.l3_voltage_thd, label: THD V L3-N, table: input, address: 142, type: s32, unit: '%', scale: 0.01, models: [et330_av5, et330_av6, et340], note: 'Only ET series, with THD calculation on (1106h); Version 2 Revision 9 document.'}

  # Identification and settings
  - {key: serial, label: Serial number (letters 1–7), table: input, address: 20480, type: str, length: 7, chars: low, poll: slow, note: The high byte of each register is not to be used.}
  - {key: x.production_year, label: Production year, table: input, address: 20496, type: u16, poll: slow, note: Only meters made from October 2018.}
  - {key: firmware, label: Version code, table: input, address: 770, type: u16, poll: slow, note: '0 = version A, 1 = B, …'}
  - {key: x.revision_code, label: Revision code, table: input, address: 771, type: u16, poll: slow}
  - {key: x.measuring_system, label: Measuring system, table: input, address: 4098, type: u16, enum: measuring_system, poll: slow, writable: true}
  - {key: x.ct_ratio, label: Current transformer ratio, table: input, address: 4099, type: u32, scale: 0.1, poll: slow, writable: true, min: 1, max: 1000}
  - {key: x.vt_ratio, label: Voltage transformer ratio, table: input, address: 4101, type: u32, scale: 0.1, poll: slow, writable: true, min: 1, max: 1000}
  - {key: x.measurement_mode, label: Measurement mode selection, table: input, address: 4355, type: u16, enum: measurement_mode, poll: slow, writable: true}
