  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/carlogavazzi-em24.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  input_equals_holding: true
  serial:
    format: 8N1
  limits:
    max_registers: 11
    max_gap: 6

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
  - table: input
    address: 4864
    type: str
    length: 7
    models:
    - av9_av2
    - av5
    - av6
  checks:
  - table: input
    address: 11
    type: u16
    in:
    - 71
    - 72
    - 73
    - 45
    - 46
    - 47
    - 48

models:
