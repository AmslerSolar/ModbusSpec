notes:
- The older RS485 EM24-DIN. Its map is the same as the newer Carlo Gavazzi meters up to 002Dh and differs from 002Eh on (demand,
  PF, Hz and energies move); the EM24 Ethernet (E1) has its own file.
- The addresses are the document's "physical address" (its 3xxxxx numbers minus 300001).
- 32-bit integers are least significant word first; bytes within a register most significant first.
- 'Overflow (display "EEEE"): the most significant word of a variable reads 7FFFh; treat such values as not available.'
- At most 11 registers per request (the text says 11; the frame table says "1 to 10h").
- The identification code 000Bh overlaps V L3-L1 and must be read alone with length 1; 0301h–0304h too ("limited to a word
  at a time").
- 'RS485: 4800 or 9600 baud (the document gives no default), 8 data bits, no parity, 1 stop bit, fixed.'
- Older meters (Version 2 Revision 0 document, 2007) report the identification codes 45 (AV9), 46 (AV0), 47 (AV5) and 48 (AV6)
  instead of 71–73; that edition lists no serial number register (1300h), has the baud rate values swapped (0 = 9600, 1 =
  4800), and its version codes at 0302h are 0–5 for six item numbers (another table than the newer one).
- Registers noted "Version 2 document" (demand maxima, partial, per-phase and per-tariff energies, counters 1–3, digital input
  status) were taken from the 2007 edition; the file's main edition wasn't checked for them.
- PFA and PFB models only support the 3Pn measuring system. With the measuring system 1P or 2P only L1, or L1 + L2, are in
  use.
- mbmd (type code CGEM24) detects the meter by reading L1 Voltage (input register 0, s32, word order little, scale 0.1); its
  bus scan accepts a value within 10% of 110 or 230 V.
- Identification as mbmd recognises the device (not checked against a document).
- "Sweep on 2026-10-31 of one AV5 (code 72), functions 03 and 04, in chunks of 11, with nothing on the measuring inputs: both functions give the same registers. Real registers answer at 0x0000 to 0x0078, 0x0300 to 0x0304 and 0x1100 to 0x1308. The non-zero ones the documents don't list are the unknown points; ones reading 0 or 0xFFFF are left out, so a register that only fills under load wouldn't show. From about 0x8000 up, the meter answers with what looks like raw memory, including machine code, not registers, so nothing there belongs in this file."
