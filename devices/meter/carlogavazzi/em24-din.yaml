  - {id: av5, name: EM24-DIN (AV5), match: {table: input, address: 11, type: u16, equals: 72}}
  - {id: av6, name: EM24-DIN (AV6), match: {table: input, address: 11, type: u16, equals: 73}}
  # Identification codes of the Version 2 Revision 0 document (2007)
