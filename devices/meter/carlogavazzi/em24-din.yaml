modbusspec: 0
id: carlogavazzi-em24-din
manufacturer: Carlo Gavazzi
name: EM24-DIN energy meters (RS485, PFA / PFB / X models)
kind: meter

sources:
- title: Carlo Gavazzi EM24-DIN PFA, PFB & X models Communication Protocol
  version: Version 4 Revision 0 (2012-12-03)
  url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_IS_CP.pdf
  sha256: b0480349f67080d66770c3a8b7f957feabe405bddd86b6d67891d4af5b1b20f6
  archive_url: https://web.archive.org/web/20261013060904/https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_IS_CP.pdf
- title: Carlo Gavazzi EM24-DIN Communication Protocol
  version: Version 2 Revision 0 (2007-02-05)
  url: https://www.ccontrols.com/support/dp/CarloGavazziEM24.pdf
  sha256: c209e085b1b384eeea6504cc59199a25bb77543d75c637a5226e50f6f7d8db09
  archive_url: https://web.archive.org/web/20250831201945/https://www.ccontrols.com/support/dp/CarloGavazziEM24.pdf
