  - {id: av0_v2, name: 'EM24-DIN (AV0, older ID code)', match: {table: input, address: 11, type: u16, equals: 46}}
  - {id: av5_v2, name: 'EM24-DIN (AV5, older ID code)', match: {table: input, address: 11, type: u16, equals: 47}}
  - {id: av6_v2, name: 'EM24-DIN (AV6, older ID code)', match: {table: input, address: 11, type: u16, equals: 48}}

