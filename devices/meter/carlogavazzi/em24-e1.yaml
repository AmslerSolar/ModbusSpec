# Written from the Carlo Gavazzi EM24 Ethernet communication protocol (Version 0 Revision 1.3).

modbusspec: 0
id: carlogavazzi-em24-e1
manufacturer: Carlo Gavazzi
name: EM24-DIN Ethernet (E1) energy meters
kind: meter

sources:
- title: Carlo Gavazzi EM24 Ethernet Communication Protocol
  version: Version 0 Revision 1.3
  url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_E1_CP.pdf
  sha256: 4dda21602c31a7bfd6368222b77dd3a1f68d94c7d7ae6cec20b0d855a2b27ca2
  archive_url: https://web.archive.org/web/20250109132357/https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_E1_CP.pdf
- title: Carlo Gavazzi EM24_E1 (Ethernet) Communication Protocol
  version: Version 0 Revision 1.2
  url: https://www.enika.eu/data/files/produkty/energy%20m/CP/em24%20ethernet%20cp.pdf
  sha256: 48fc4c86454f56af26683f29369294480b8acf080b5df2204cae6561af83122a
  archive_url: https://web.archive.org/web/20240802115206/https://www.enika.eu/data/files/produkty/energy%20m/CP/em24%20ethernet%20cp.pdf
- id: mbmd
  title: mbmd (ModBus Measurement Daemon, meter definitions used by evcc)
  url: https://github.com/volkszaehler/mbmd
  license: BSD-3-Clause
  commit: af19f17edbe0c8fa404813d70428d620db44a622
  path: meters/rs485/carlogavazzi-em24_e1.go

connection:
  default_port: 502
  default_unit: 1
  transports:
  - tcp
  input_equals_holding: true
  limits:
    max_registers: 125
    max_gap: 32

encoding:
  byte_order: big
  word_order: little

identify:
  serial:
    table: input
    address: 20480
    type: str
    length: 7
  checks:
  - table: input
    address: 11
    type: u16
    range:
    - 1648
    - 1653

models:
  - {id: av2_x, name: EM24DINAV23XE1X, match: {table: input, address: 11, type: u16, equals: 1648}}
  - {id: av2_pfa, name: EM24DINAV23XE1PFA, match: {table: input, address: 11, type: u16, equals: 1649}}
  - {id: av2_pfb, name: EM24DINAV23XE1PFB, match: {table: input, address: 11, type: u16, equals: 1650}}
  - {id: av5_x, name: EM24DINAV53XE1X, match: {table: input, address: 11, type: u16, equals: 1651}}
  - {id: av5_pfa, name: EM24DINAV53XE1PFA, match: {table: input, address: 11, type: u16, equals: 1652}}
  - {id: av5_pfb, name: EM24DINAV53XE1PFB, match: {table: input, address: 11, type: u16, equals: 1653}}

points:
  # Instantaneous variables
  - {key: l1_voltage, label: V L1-N, table: input, address: 0, type: s32, unit: V, scale: 0.1}
  - {key: l2_voltage, label: V L2-N, table: input, address: 2, type: s32, unit: V, scale: 0.1}
  - {key: l3_voltage, label: V L3-N, table: input, address: 4, type: s32, unit: V, scale: 0.1}
  - {key: x.l1_l2_voltage, label: V L1-L2, table: input, address: 6, type: s32, unit: V, scale: 0.1}
  - {key: x.l2_l3_voltage, label: V L2-L3, table: input, address: 8, type: s32, unit: V, scale: 0.1}
  - {key: x.l3_l1_voltage, label: V L3-L1, table: input, address: 10, type: s32, unit: V, scale: 0.1}
  - {key: l1_current, label: A L1, table: input, address: 12, type: s32, unit: A, scale: 0.001}
  - {key: l2_current, label: A L2, table: input, address: 14, type: s32, unit: A, scale: 0.001}
  - {key: l3_current, label: A L3, table: input, address: 16, type: s32, unit: A, scale: 0.001}
  - {key: l1_power, label: W L1, table: input, address: 18, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: Derived like the total power.}
  - {key: l2_power, label: W L2, table: input, address: 20, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: Derived like the total power.}
  - {key: l3_power, label: W L3, table: input, address: 22, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: Derived like the total power.}
  - {key: x.l1_apparent_power, label: VA L1, table: input, address: 24, type: s32, unit: VA, scale: 0.1}
  - {key: x.l2_apparent_power, label: VA L2, table: input, address: 26, type: s32, unit: VA, scale: 0.1}
  - {key: x.l3_apparent_power, label: VA L3, table: input, address: 28, type: s32, unit: VA, scale: 0.1}
  - {key: x.l1_reactive_power, label: VAR L1, table: input, address: 30, type: s32, unit: var, scale: 0.1}
  - {key: x.l2_reactive_power, label: VAR L2, table: input, address: 32, type: s32, unit: var, scale: 0.1}
  - {key: x.l3_reactive_power, label: VAR L3, table: input, address: 34, type: s32, unit: var, scale: 0.1}
  - {key: x.system_voltage_ln, label: V L-N, table: input, address: 36, type: s32, unit: V, scale: 0.1}
  - {key: x.system_voltage_ll, label: V L-L, table: input, address: 38, type: s32, unit: V, scale: 0.1}
  - {key: grid_power, label: W, table: input, address: 40, type: s32, unit: W, scale: 0.1, positive: import, verified: false, note: 'This document doesn''t state the sign in words; it only shows the geometric representation (exported / imported active power) and names the energies kWh(+) and kWh(−). Assumed like the EM300 / EM210 documents, which say negative = export.'}
  - {key: apparent_power, label: VA, table: input, address: 42, type: s32, unit: VA, scale: 0.1}
  - {key: reactive_power, label: VAR, table: input, address: 44, type: s32, unit: var, scale: 0.1}
  - {key: x.l1_power_factor, label: PF L1, table: input, address: 46, type: s16, unit: '', scale: 0.001, invalid: [32767], note: 'Negative = lead (C), positive = lag (L).'}
  - {key: x.l2_power_factor, label: PF L2, table: input, address: 47, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: x.l3_power_factor, label: PF L3, table: input, address: 48, type: s16, unit: '', scale: 0.001, invalid: [32767]}
  - {key: power_factor, label: PF, table: input, address: 49, type: s16, unit: '', scale: 0.001, invalid: [32767], note: 'Negative = lead (C), positive = lag (L); not the power direction.'}
  - {key: x.phase_sequence, label: Phase sequence, table: input, address: 50, type: s16, enum: phase_sequence, invalid: [32767]}
  - {key: frequency, label: Hz, table: input, address: 51, type: u16, unit: Hz, scale: 0.1, invalid: [32767], conflicts: [{sources: [mbmd], type: s16, label: Frequency}]}
  - {key: grid_import_energy, label: kWh(+) TOT, table: input, address: 52, type: s32, unit: kWh, scale: 0.1}
  - {key: x.import_reactive_energy, label: kvarh(+) TOT, table: input, address: 54, type: s32, unit: kvarh, scale: 0.1}
  - {key: x.power_demand, label: DMD W, table: input, address: 56, type: s32, unit: W, scale: 0.1}
  - {key: grid_export_energy, label: kWh(-) TOT, table: input, address: 78, type: s32, unit: kWh, scale: 0.1}
  - {key: x.export_reactive_energy, label: kvarh(-) TOT, table: input, address: 80, type: s32, unit: kvarh, scale: 0.1}
  - {key: x.run_hours, label: Hour, table: input, address: 90, type: s32, unit: h, scale: 0.01, poll: slow}

  # Identification and settings
  - {key: serial, label: Serial number (letters 1–13), table: input, address: 20480, type: str, length: 7, poll: slow}
  - {key: firmware, label: Version and revision code of measurement module, table: input, address: 770, type: u16, poll: slow, note: 'High byte: bits 4–7 major, 0–3 minor; low byte: revision (101Eh = 1.0.30).'}
  - {key: x.comm_module_version, label: Version and revision code of communication module, table: input, address: 772, type: u16, poll: slow, note: Same format as the measurement module version.}
  - {key: x.measuring_system, label: Measuring system, table: input, address: 4098, type: u16, enum: measuring_system, poll: slow, writable: true}
  - {key: x.ct_ratio, label: Current transformer ratio, table: input, address: 4099, type: u32, scale: 0.1, poll: slow, writable: true}
  - {key: x.vt_ratio, label: Voltage transformer ratio, table: input, address: 4101, type: u32, scale: 0.1, poll: slow, writable: true}
  - {key: x.current_tariff, label: Current tariff, table: input, address: 4609, type: u16, enum: tariff, poll: slow}
  - {key: x.application, label: Type of application, table: input, address: 40960, type: u16, enum: application, poll: slow, writable: true}
  - {key: x.front_selector, label: Front selector status, table: input, address: 41216, type: u16, enum: front_selector, poll: slow}
  - {key: x.tcp_port, label: Modbus TCP/IP port, table: input, address: 8460, type: u16, poll: slow, writable: true, min: 1, max: 9999}
  - {key: x.dhcp, label: DHCP enabled, table: input, address: 8461, type: u16, enum: off_on, poll: slow, writable: true}
  - {key: x.import_l1, label: L1 Import, table: input, address: 64, type: s32, unit: kWh, scale: 0.1, verified: false, sources: [mbmd]}
  - {key: x.import_l2, label: L2 Import, table: input, address: 66, type: s32, unit: kWh, scale: 0.1, verified: false, sources: [mbmd]}
  - {key: x.import_l3, label: L3 Import, table: input, address: 68, type: s32, unit: kWh, scale: 0.1, verified: false, sources: [mbmd]}

enums:
  phase_sequence: {'-1': L1-L3-L2, '0': L1-L2-L3}
  measuring_system: {'0': 3P.n, '1': 3P.1, '2': 2P, '3': 1P, '4': 3P}
  tariff: {'0': Tariff disabled, '1': Tariff 1, '2': Tariff 2, '3': Tariff 3, '4': Tariff 4}
  application: {'0': A, '1': B, '2': C, '3': D, '4': E, '5': F, '6': G, '7': H}
  front_selector: {'0': Unlocked (kvarh position), '1': Unlocked (position 2), '2': Unlocked (position 1), '3': Locked (LOCK position)}
  off_on: {'0': 'Off', '1': 'On'}

notes:
- The addresses are the document's "physical address" (its 3xxxxx numbers minus 300001).
- 32-bit integers are least significant word first; bytes within a register most significant first.
- 'Overflow (display "EEEE"): the most significant word of a variable reads 7FFFh; treat such values as not available.'
- 'The identification code 000Bh (models, identify) overlaps V L3-L1: it must be read alone with length 1, a longer request
  returns the instantaneous variables. Read 0302h and 0304h one register at a time too (not stated in the document).'
- With the measuring system 1P or 2P only L1, or L1 + L2, are in use. PFA and PFB models only support 3P.n.
- 'Current communication configuration (Revision 1.2 document, read only): MAC address bytes a–f at 2110h–2115h and the IP
  address, subnet mask and default gateway in use (bytes A–D each) at 2120h–2123h, 2124h–2127h and 2128h–212Bh, one byte (0–255)
  per register. These are the values in use whether DHCP is on or off; the stored settings (used when DHCP is off) are at
  2100h–210Bh and take effect after writing 1 to 210Eh.'
- The document gives no Modbus TCP unit id; 1 is assumed.
- mbmd (type code CGEM24_E1) detects the meter by reading L1 Voltage (input register 0, s32, word order little, scale 0.1);
  its bus scan accepts a value within 10% of 110 or 230 V.
- Identification as mbmd recognises the device (not checked against a document).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
