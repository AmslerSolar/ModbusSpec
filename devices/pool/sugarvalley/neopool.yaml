# Written from the Sugar Valley NeoPool Control System MODBUS Register description (2015-03-23).

modbusspec: 0
id: sugarvalley-neopool
manufacturer: Sugar Valley
name: NeoPool pool controllers (and rebrands)
kind: pool

sources:
- title: NeoPool Control System – MODBUS Register description
  version: '2015-03-23'
  url: https://downloads.vodnici.net/uploads/wpforo/attachments/69/171-Modbus-registers.pdf
  sha256: 959a6e405f58b06aaa502ea6a90668bd1eb609d3d8e6414902e91b35229f1f53
  archive_url: https://web.archive.org/web/20260303140349/https://downloads.vodnici.net/uploads/wpforo/attachments/69/171-Modbus-registers.pdf
- id: python-neopool-modbus
  title: python-neopool-modbus (Python library used by Home Assistant's neopool integration)
  url: https://github.com/svasek/python-neopool-modbus
  license: Apache-2.0
  commit: 02e325897f65478bc2f6921532f08d71cece111a
  path: src/neopool_modbus/client.py, src/neopool_modbus/registers.py, src/neopool_modbus/decoders.py, src/neopool_modbus/status_mask.py

connection:
  default_port: 502
  default_unit: 1
  transports:
  - rtu
  - tcp
  serial:
    baud: 19200
    format: 8N1

points:
  # Measurement page (0x01xx)
  - {key: x.ion_current, label: MBF_ION_CURRENT, table: input, address: 256, type: u16, note: 'Ionization current, scaled by the controller from its calibration; unit not stated.', verified: false}
  - {key: x.ph, label: MBF_MEASURE_PH, table: input, address: 258, type: u16, scale: 0.01, unit: '', note: Only valid while the pH module is enabled (see 0x0107)., verified: false}
  - {key: x.redox, label: MBF_MEASURE_RX, table: input, address: 259, type: u16, unit: V, scale: 0.001, note: 'The document''s text gives hundredths of ppm, the wording of the chlorine register next to it; the redox setpoint (0x0508) is 0…1000, which fits millivolts. Assumed mV. Only valid while the redox module is enabled.', verified: false}
  - {key: x.chlorine, label: MBF_MEASURE_CL, table: input, address: 260, type: u16, unit: ppm, scale: 0.01, note: Only valid while the chlorine module is enabled., verified: false}
  - {key: x.conductivity, label: MBF_MEASURE_CONDUCTIVITY, table: input, address: 261, type: u16, note: Unit not stated. Only valid while the conductivity module is enabled., conflicts: [{sources: [python-neopool-modbus], unit: '%', label: Measure conductivity}], verified: false}
  - {key: x.water_temperature, label: MBF_MEASURE_TEMPERATURE, table: input, address: 262, type: u16, unit: °C, scale: 0.1, verified: false}
  - {key: x.ph_status, label: MBF_PH_STATUS, table: input, address: 263, type: u16, flags: ph_status, verified: false}
  - {key: x.ph_alarm, label: pH alarm, table: input, address: 263, type: u16, bits: [0, 3], enum: ph_alarm, note: 'Meaning of 1/2 and 4/5 depends on the pH regulation (acid and base, acid only, base only; 0x0430): PH1 is the upper, PH2 the lower setpoint.', verified: false}
  - {key: x.redox_status, label: MBF_RX_STATUS, table: input, address: 264, type: u16, flags: module_status, verified: false}
  - {key: x.chlorine_status, label: MBF_CL_STATUS, table: input, address: 265, type: u16, flags: cl_status, verified: false}
  - {key: x.conductivity_status, label: MBF_CD_STATUS, table: input, address: 266, type: u16, flags: module_status, verified: false}
  - {key: x.ion_status, label: MBF_ION_STATUS, table: input, address: 268, type: u16, flags: ion_status, verified: false}
  - {key: x.hidro_status, label: MBF_HIDRO_STATUS, table: input, address: 269, type: u16, flags: hidro_status, verified: false}
  - {key: x.relay_state, label: MBF_RELAY_STATE, table: input, address: 270, type: u16, flags: relay_state, note: 'Which relay does what is set by the *_GPIO registers (relay number, 0 = none).', verified: false}
  - {key: x.hidro_switch_value, label: MBF_HIDRO_SWITCH_VALUE, table: input, address: 271, type: u16, note: 'Hydrolysis PWM opening, 0…65535.', verified: false}
  - {key: x.notification, label: MBF_NOTIFICATION, table: input, address: 272, type: u16, flags: notification, note: One bit per register page changed since the last read; the master writes 0 after reading., verified: false}

  # Global page (0x02xx)
  - {key: x.save_to_eeprom, label: MBF_SAVE_TO_EEPROM, table: holding, address: 752, type: u16, writable: true, note: Write 1 to store all settings in EEPROM (takes under 1 s; the controller may not answer meanwhile). Also done every 10 minutes; EEPROM is rated for 100000 writes.}

  # Factory page (0x03xx)
  - {key: x.mbf_par_version, label: MBF_PAR_VERSION, table: holding, address: 768, type: u16, poll: slow, note: 'Software version of the PowerBox. The document marks the register as not used, so it may not hold a meaningful version.'}
  - {key: x.model_options, label: MBF_PAR_MODEL, table: holding, address: 769, type: u16, flags: model_options, poll: slow, note: Installed options. Must not be written.}
  - {key: x.hidro_max_voltage, label: MBF_PAR_HIDRO_MAX_VOLTAGE, table: holding, address: 802, type: u16, unit: V, scale: 0.1, poll: slow, note: Fanless units only. Default 8.0 V.}
  - {key: x.hidro_flow_signal, label: MBF_PAR_HIDRO_FLOW_SIGNAL, table: holding, address: 803, type: u16, enum: hidro_flow_signal, poll: slow, note: Fanless units only.}

  # Installer page (0x04xx)
  - {key: x.hidro_mode, label: MBF_PAR_HIDRO_MODE, table: holding, address: 1028, type: u16, enum: hidro_mode, poll: slow}
  - {key: x.clock, label: MBF_PAR_TIME, table: holding, address: 1032, type: u32, word_order: little, epoch: {start: '1970-01-01', unit: s}, poll: slow, note: 'System time; 0x0408 is the low, 0x0409 the high word.'}
  - {key: x.temperature_active, label: MBF_PAR_TEMPERATURE_ACTIVE, table: holding, address: 1039, type: u16, enum: on_off, poll: slow, note: Whether the unit measures temperature.}
  - {key: x.filtration_mode, label: MBF_PAR_FILT_MODE, table: holding, address: 1041, type: u16, enum: filtration_mode, writable: true, poll: slow}
  - {key: x.filtration_relay, label: MBF_PAR_FILT_GPIO, table: holding, address: 1042, type: u16, poll: slow, note: Relay used for filtration (default 2); 0 = the unit doesn't control filtration.}
  - {key: x.filtration_manual_state, label: MBF_PAR_FILT_MANUAL_STATE, table: holding, address: 1043, type: u16, enum: on_off, writable: true, note: Filtration on/off in manual mode.}
  - {key: x.heating_mode, label: MBF_PAR_HEATING_MODE, table: holding, address: 1044, type: u16, enum: on_off, poll: slow, note: 1 = the unit has heating.}
  - {key: x.clima, label: MBF_PAR_CLIMA_ONOFF, table: holding, address: 1047, type: u16, enum: on_off, writable: true, poll: slow}
  - {key: x.smart_anti_freeze, label: MBF_PAR_SMART_ANTI_FREEZE, table: holding, address: 1050, type: u16, enum: on_off, writable: true, poll: slow, note: Smart filtration mode only.}
  - {key: x.smart_interval_reduction, label: MBF_PAR_SMART_INTERVAL_REDUCTION, table: holding, address: 1051, type: u16, unit: '%', note: 'Read only: share of the nominal filtration time being applied (100 = all of it).'}
  - {key: x.intelligent_filt_min_time, label: MBF_PAR_INTELLIGENT_FILT_MIN_TIME, table: holding, address: 1053, type: u16, unit: min, writable: true, poll: slow}
  - {key: x.filtration_state, label: MBF_PAR_FILTRATION_STATE, table: holding, address: 1057, type: u16, enum: on_off, note: Read only; the filtration's present state.}
  - {key: x.uv_mode, label: MBF_PAR_UV_MODE, table: holding, address: 1063, type: u16, enum: on_off, writable: true, poll: slow, note: UV lamp switches on with the filtration.}
  - {key: x.ph_regulation, label: MBF_PAR_RELAY_PH, table: holding, address: 1072, type: u16, enum: ph_regulation, poll: slow}
  - {key: x.relay_max_time, label: MBF_PAR_RELAY_MAX_TIME, table: holding, address: 1073, type: u16, unit: s, writable: true, poll: slow, note: Longest a dosing pump may run before an alarm.}
  - {key: x.relay_activation_delay, label: MBF_PAR_RELAY_ACTIVATION_DELAY, table: holding, address: 1075, type: u16, unit: s, writable: true, poll: slow, note: pH pump start delay; the controller adds 10 s., conflicts: [{sources: [python-neopool-modbus], offset: 10, label: Relay activation delay}]}
  - {key: x.timer_filtration1_mode, label: Filtration interval 1 timer enable, table: holding, address: 1076, type: u16, enum: timer_mode, writable: true, poll: slow}
  - {key: x.timer_filtration1_interval, label: Filtration interval 1 run time, table: holding, address: 1083, type: u32, word_order: little, unit: s, writable: true, poll: slow, note: Word order of the timer values not stated; assumed low word first like the other 32-bit registers., verified: false}
  - {key: x.timer_filtration2_mode, label: Filtration interval 2 timer enable, table: holding, address: 1091, type: u16, enum: timer_mode, writable: true, poll: slow}
  - {key: x.timer_filtration2_interval, label: Filtration interval 2 run time, table: holding, address: 1098, type: u32, word_order: little, unit: s, writable: true, poll: slow, note: Word order assumed as above., verified: false}
  - {key: x.timer_filtration3_mode, label: Filtration interval 3 timer enable, table: holding, address: 1106, type: u16, enum: timer_mode, writable: true, poll: slow}
  - {key: x.timer_filtration3_interval, label: Filtration interval 3 run time, table: holding, address: 1113, type: u32, word_order: little, unit: s, writable: true, poll: slow, note: Word order assumed as above., verified: false}
  - {key: x.timer_lighting_mode, label: Lighting interval timer enable, table: holding, address: 1136, type: u16, enum: timer_mode, writable: true, poll: slow}
  - {key: x.filtvalve_remaining, label: MBF_PAR_FILTVALVE_REMAINING, table: holding, address: 1263, type: u16, unit: s, note: Remaining time of the running filter cleaning; 0 = none running.}

  # User page (0x05xx)
  - {key: x.ion_setpoint, label: MBF_PAR_ION, table: holding, address: 1280, type: u16, writable: true, poll: slow, note: Ionization target level; at most MBF_PAR_ION_NOM (0x0303).}
  - {key: x.ion_time, label: MBF_PAR_ION_PR, table: holding, address: 1281, type: u16, unit: min, writable: true, poll: slow, note: Ionization time each time the filtration starts.}
  - {key: x.ph_setpoint_high, label: MBF_PAR_PH1, table: holding, address: 1284, type: u16, scale: 0.01, unit: '', writable: true, poll: slow, note: Upper pH limit; must stay above PH2.}
  - {key: x.ph_setpoint_low, label: MBF_PAR_PH2, table: holding, address: 1285, type: u16, scale: 0.01, unit: '', writable: true, poll: slow, note: Lower pH limit; must stay below PH1.}
  - {key: x.redox_setpoint, label: MBF_PAR_RX1, table: holding, address: 1288, type: u16, writable: true, min: 0, max: 1000, poll: slow, note: Unit not stated (presumably mV)., verified: false}
  - {key: x.chlorine_setpoint, label: MBF_PAR_CL1, table: holding, address: 1290, type: u16, unit: ppm, scale: 0.01, writable: true, poll: slow}

  # Display page (0x06xx)
  - {key: x.machine, label: MBF_PAR_UICFG_MACHINE, table: holding, address: 1536, type: u16, enum: machine, poll: slow, note: Brand style the display shows.}
  - {key: x.language, label: MBF_PAR_UICFG_LANGUAGE, table: holding, address: 1537, type: u16, enum: language, writable: true, poll: slow}
  - {key: x.mbf_power_module_version, label: Power module version, table: holding, address: 2, type: u16, note: 'High byte major, low byte minor version.', verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_power_module_register, label: Power module register, table: holding, address: 12, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_power_module_data, label: Power module data, table: holding, address: 13, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.cell_runtime_total, label: Cell runtime total, table: holding, address: 518, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.cell_runtime_part, label: Cell runtime part, table: holding, address: 520, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_cell_boost, label: Cell boost, table: holding, address: 524, type: u16, enum: cell_boost, writable: true, note: '0 = off; boost active when bits 0x05A0 are set, bit 15 additionally disables redox control. The values in the table are those the library writes.', verified: false, sources: [python-neopool-modbus]}
  - {key: x.cell_runtime_pola, label: Cell runtime pola, table: holding, address: 532, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.cell_runtime_polb, label: Cell runtime polb, table: holding, address: 534, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.cell_runtime_pol_changes, label: Cell runtime pol changes, table: holding, address: 536, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_hidro_module_version, label: Hidro module version, table: holding, address: 640, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_hidro_module_connectivity, label: Hidro module connectivity, table: holding, address: 641, type: u16, unit: '%', scale: 0.01, verified: false, sources: [python-neopool-modbus]}
  - {key: x.clear_errors, label: Clear error messages, table: holding, address: 663, type: u16, writable: true, note: Write 1 to trigger; the controller clears it., verified: false, sources: [python-neopool-modbus]}
  - {key: x.clear_eeprom, label: Clear EEPROM, table: holding, address: 753, type: u16, writable: true, note: Write 1 to trigger; the controller clears it., verified: false, sources: [python-neopool-modbus]}
  - {key: x.reset_user_counters, label: Reset user counters, table: holding, address: 754, type: u16, writable: true, note: Write 1 to trigger; the controller clears it., verified: false, sources: [python-neopool-modbus]}
  - {key: x.stop_all_modules, label: Stop all modules, table: holding, address: 756, type: u16, writable: true, note: Write 1 to trigger; the controller clears it., verified: false, sources: [python-neopool-modbus]}
  - {key: x.restart_modules, label: Apply changes (restart modules), table: holding, address: 757, type: u16, writable: true, note: Write 1 to trigger; the controller clears it., verified: false, sources: [python-neopool-modbus]}
  - {key: serial, label: Serial number, table: holding, address: 770, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_ion_nom, label: Ion nom, table: holding, address: 771, type: u16, note: Do not write., verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_nom, label: Hidro nom, table: holding, address: 774, type: u16, scale: 0.1, note: 'Maximum hydrolysis production; 100 in percent mode, else g/h. Do not write.', verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_nom2, label: Hidro nom2, table: holding, address: 775, type: u16, unit: g/h, note: Do not write., verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_sal_amps, label: Sal amps, table: holding, address: 778, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_sal_cellk, label: Sal cellk, table: holding, address: 779, type: u16, note: Ratio between measured cell resistance and salinity in g/l., verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_sal_tcomp, label: Sal tcomp, table: holding, address: 780, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_max_pwm_step_up, label: Hidro max pwm step up, table: holding, address: 804, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_max_pwm_step_down, label: Hidro max pwm step down, table: holding, address: 805, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_ph_acid_relay_gpio, label: Ph acid relay gpio, table: holding, address: 1034, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_ph_base_relay_gpio, label: Ph base relay gpio, table: holding, address: 1035, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_rx_relay_gpio, label: Rx relay gpio, table: holding, address: 1036, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_cl_relay_gpio, label: Cl relay gpio, table: holding, address: 1037, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_cd_relay_gpio, label: Cd relay gpio, table: holding, address: 1038, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_lighting_gpio, label: Lighting gpio, table: holding, address: 1040, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_heating_gpio, label: Heating gpio, table: holding, address: 1045, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_heating_temp, label: Heating temp, table: holding, address: 1046, type: u16, unit: °C, bits: [0, 7], writable: true, note: 'Setpoint in the low byte; some firmware (seen on Hayward AquaRite+) puts a measured temperature in the high byte, so writes must keep it.', verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_smart_temp_high, label: Smart temp high, table: holding, address: 1048, type: u16, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_smart_temp_low, label: Smart temp low, table: holding, address: 1049, type: u16, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_intelligent_temp, label: Intelligent temp, table: holding, address: 1052, type: u16, unit: °C, bits: [0, 7], writable: true, note: Setpoint in the low byte; the high byte may hold a measured temperature as at 0x0416., verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_intelligent_bonus_time, label: Intelligent bonus time, table: holding, address: 1054, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_intelligent_tt_next_interval, label: Intelligent tt next interval, table: holding, address: 1055, type: u16, unit: s, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_intelligent_intervals, label: Intelligent intervals, table: holding, address: 1056, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_heating_delay_time, label: Heating delay time, table: holding, address: 1058, type: u16, unit: s, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_filtering_time, label: Filtering time, table: holding, address: 1059, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_intelligent_interval_time, label: Intelligent interval time, table: holding, address: 1061, type: u32, word_order: little, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_uv_hide_warn, label: Uv hide warn, table: holding, address: 1064, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_uv_relay_gpio, label: Uv relay gpio, table: holding, address: 1065, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_ph_pump_rep_time_on, label: Ph pump rep time on, table: holding, address: 1066, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_ph_pump_rep_time_off, label: Ph pump rep time off, table: holding, address: 1067, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_cover_enable, label: Hidro cover enable, table: holding, address: 1068, type: u16, flags: hidro_options, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_hidro_cover_reduction, label: Hidro cover reduction, table: holding, address: 1069, type: u16, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.hidro_cover_reduction_percent, label: Hydrolysis reduction with cover closed, table: holding, address: 1069, type: u16, unit: '%', bits: [0, 7], writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.hidro_shutdown_temperature, label: Hydrolysis shutdown temperature, table: holding, address: 1069, type: u16, unit: °C, bits: [8, 15], writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_pump_relay_time_off, label: Pump relay time off, table: holding, address: 1070, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_pump_relay_time_on, label: Pump relay time on, table: holding, address: 1071, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.mbf_par_relay_mode, label: Relay mode, table: holding, address: 1074, type: u16, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_on, label: Filtration1 timer start (seconds since midnight), table: holding, address: 1077, type: u32, unit: s, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_off, label: Filtration1 timer off, table: holding, address: 1079, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_period, label: Filtration1 timer period, table: holding, address: 1081, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_countdown, label: Filtration1 timer countdown, table: holding, address: 1085, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_function, label: Filtration1 timer relay function, table: holding, address: 1087, type: u16, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration1_work_time, label: Filtration1 timer work time, table: holding, address: 1089, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration2_on, label: Filtration2 timer start (seconds since midnight), table: holding, address: 1092, type: u32, unit: s, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration2_off, label: Filtration2 timer off, table: holding, address: 1094, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
  - {key: x.timer_filtration2_period, label: Filtration2 timer period, table: holding, address: 1096, type: u32, word_order: little, writable: true, verified: false, sources: [python-neopool-modbus]}
