notes:
- 'Register pages: 0x00xx Modbus (internal), 0x01xx measurements, 0x02xx global, 0x03xx factory, 0x04xx installer, 0x05xx
  user, 0x06xx display. Addresses are the document''s (0-based hex).'
- The document doesn't name function codes. The measurement page is taken as input registers (function 04) and every other
  page as holding registers (function 03); not stated in the document, assumed.
- Two RS485 ports; the one labelled DISPLAY usually connects the screen (itself a Modbus master), the RF/WIFI one is for external
  use. Unit id 1 by default.
- Written settings are lost at power-off until stored with 0x02F0 (or the automatic store every 10 minutes); write all settings
  first, then store once.
- 32-bit values are stored low word first.
- 'Left out: hydrolysis current (0x0101), hydrolysis target (0x0502), hydrolysis voltage (0x0111) and maximum production (0x0306/0x0307),
  whose scaling the document doesn''t give (their unit is % or g/h depending on the machine type and 0x0607); calibration,
  polarity times, relay assignments, pump timing codes, the remaining timer registers, function dependencies and display options.'
- 'Timer blocks of 15 registers from 0x0434 (filtration 1–3, aux relays second interval, lighting at 0x0470, aux relays first
  interval): +0 mode, +1 start, +3 stop (unused), +5 period (s), +7 run time (s), +9 countdown (s), +11 function code, +13
  work time (s).'
- The serial number register (0x0302) is marked unused in the document, so it isn't listed.
- Only the measurement page 0x0100-0x01FF is read with function 04 (input registers); all other pages use function 03. The
  wrong function code reads a different register set.
- The controller refuses reads of more than 31 registers per request.
- 'Pages: 0x00xx Modbus/power module, 0x01xx measurements, 0x02xx global counters, 0x03xx factory, 0x04xx installer, 0x05xx
  user settings, 0x06xx display settings. Register 0x0110 flags which pages changed.'
- Settings written to configuration registers are made permanent by writing 1 to 0x02F0 (save to EEPROM) and applied by writing
  1 to 0x02F5. These command registers clear themselves.
- 'Timer blocks of 15 registers (filtration 1-3, light, AUX1-4 and a second block per AUX relay): +0 mode, +1/+2 start (seconds
  since midnight), +3/+4 off, +5/+6 period, +7/+8 run time (s), +9/+10 countdown, +11 relay function, +13/+14 work time. The
  AUX/light relay is switched by writing its function code to +11 and always on/off to +0, then 1 to 0x02F5. Function codes:
  light 2, AUX1 0x0800, AUX2 0x1000, AUX3 0x2000, AUX4 0x4000.'
- Installed modules (ionization, hydrolysis, UV, salinity) are flagged in 0x0301; the pH, redox, chlorine and conductivity
  modules set bit 15 of their status word when detected.
- The controller is sold under several brand names; 0x0600 says which one the display shows (enum machine).
- Points without `sources` come from the manufacturer documents; points with `sources` were added from open-source projects
  and are not checked against the documents.
