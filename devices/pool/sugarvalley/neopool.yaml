enums:
  ph_alarm: {'0': No alarm, '1': pH too high (0.8 above setpoint), '2': pH too low (0.8 below setpoint), '3': pH pump exceeded its maximum run time and stopped, '4': pH above setpoint, '5': pH below setpoint}
  filtration_mode: {'0': Manual, '1': Auto, '2': Heating, '3': Smart, '4': Intelligent, '13': Backwash, '14': Chlorination shock}
  timer_mode: {'0': Disabled, '1': Enabled, '2': 'Enabled, linked to timer 0''s relay', '3': Always on, '4': Always off, '5': Countdown}
  on_off: {'0': 'Off', '1': 'On'}
  hidro_mode: {'0': No control, '1': Standard (on/off), '2': Timed pump}
  hidro_flow_signal: {'0': Standard, '1': Always on, '2': Paddle switch (FL1), '3': Paddle and standard, '4': Paddle or standard}
  ph_regulation: {'0': Acid and base, '1': Acid only, '2': Base only}
  machine: {'0': None, '1': Hidrolife, '2': Aquascenic, '3': Oxilife, '4': Bionet, '5': Hidroniser, '6': UVScenic, '7': Station, '8': Brilix, '9': Generic, '10': Bayrol, '11': Hay}
  language: {'0': Spanish, '1': English, '2': French, '3': German, '4': Italian, '5': Portuguese, '6': Turkish, '7': Czech}
  filtration_speed: {'0': low, '1': mid, '2': high}
  python_neopool_modbus_timer_mode: {'0': Disable, '1': Enabled, '2': Enabled linked, '3': Always on, '4': Always off, '5': Countdown key}
  cell_boost: {'0': inactive, '1440': active_redox, '34208': active}
  filtvalve: {'0': 'Off', '1': Besgo valve}
  pump_type: {'0': Standard, '1': Variable speed, '2': Variable speed}

flags:
  ph_status: {'10': Control held by flow detection, '11': Low pH (acid) pump relay on, '12': High pH (base) pump relay on, '13': pH control active, '14': pH measurement active, '15': pH module detected}
  module_status: {'12': Pump relay on, '13': Control active, '14': Measurement active, '15': Module detected}
  cl_status: {'3': 'Chlorine probe flow sensor (0 = no flow, measurement invalid)', '12': Chlorine pump relay on, '13': Chlorine control active, '14': Chlorine measurement active, '15': Chlorine module detected}
  ion_status: {'0': On target, '1': Low (target not reached), '2': Reserved, '3': Programmed ionization time exceeded, '12': Dead time, '13': Polarity 1, '14': Polarity 2}
  hidro_status: {'0': On target, '1': Low (target not reached), '2': Reserved, '3': Cell flow (FL1), '4': Cover input active, '5': Hydrolysis module active, '6': Hydrolysis under regulation, '7': Enabled by the redox module, '8': Chlorine shock mode, '9': Chlorine probe flow (FL2), '10': Enabled by the chlorine module, '12': Dead time, '13': Polarity 1, '14': Polarity 2}
  relay_state: {'0': Relay 1 (usually pH), '1': Relay 2 (usually filtration), '2': Relay 3 (usually lighting), '3': Relay 4, '4': Relay 5, '5': Relay 6, '6': Relay 7}
  notification: {'0': Modbus page changed, '1': Global page changed, '2': Factory page changed, '3': Installer page changed, '4': User page changed, '5': Misc page changed}
  model_options: {'0': Ionization, '1': Hydrolysis / electrolysis, '2': UV lamp, '3': Salinity measurement (fanless units)}
  hidro_options: {'0': Cover reduces hydrolysis, '1': Temperature shutdown}
  visual_style: {'13': Force g/h units, '14': Force percent units, '15': Electrolysis}

