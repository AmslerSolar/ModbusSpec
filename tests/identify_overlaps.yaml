# Device files whose identification can't tell their devices apart, with the reason. tests/test_specs.py fails on
# any overlap not listed here (tools/collisions.py finds them). `devices`: every one is taken for every other;
# with `one_way: true` only the first is taken for the others (its checks are the more specific ones, so a search
# should try it first).

- devices: [creasol/dombus12, creasol/dombus21, creasol/dombus23, creasol/dombus31, creasol/dombus36,
            creasol/dombus37, creasol/dombusth]
  reason: The DomBus modules share one register map; only their default unit ids differ.

- devices: [eastron/sdm54, generic/ddm18sd]
  reason: Identified only by mbmd's probe, a plausible voltage (110 or 230 V ±10 %) at input register 0.

- devices: [eastron/sdm, eastron/sdm230]
  reason: The same Eastron input-register layout; the SDM230 document gives no meter code to tell it apart.

- devices: [foxess/h1, foxess/h1-lan]
  reason: The same inverters, read over RS485 or over the LAN port.

- devices: [foxess/h1-g2, foxess/h1, foxess/h1-lan]
  one_way: true
  reason: An H1-…-G2 model name also starts with "H1-"; the project tries the G2 pattern first.

- devices: [foxess/h3-pro, foxess/h3]
  one_way: true
  reason: An H3-Pro model name also starts with "H3-"; the project tries the Pro pattern first.

- devices: [foxess/h3-smart, foxess/h3]
  one_way: true
  reason: An H3-…-Smart model name also starts with "H3-"; the project tries the Smart pattern first.

- devices: [growatt/legacy, growatt/tl-x]
  one_way: true
  reason: Device type 5200 is in both register maps' lists.

- devices: [solis/fb00, solis/inverter]
  one_way: true
  reason: Two register maps for inverters with the same serial-number prefixes; the hybrid file also checks register 35000.

- devices: [neptronic/evcb, neptronic/evcb14s, neptronic/evcb44, neptronic/evcbm-dual-duct]
  reason: The EVCB controller series share product type 111; their maps differ only from about register 153 on.

- devices: [eastron/sdm120ct, eastron/sdm, eastron/sdm230]
  one_way: true
  reason: The SDM120CT shares Eastron's input-register layout and has no meter code; its CT ratio check is the more specific one.

- devices: [eastron/x96, eastron/sdm, eastron/sdm230]
  one_way: true
  reason: The Smart X96 shares Eastron's input-register layout and has no meter code; its PT ratio check is the more specific one.

- devices: [garo/gnm3, carlogavazzi/em300]
  one_way: true
  reason: The Garo GNM3D reports the Carlo Gavazzi EM340's type code (341); it is a rebranded EM340.

- devices: [neptronic/tsub, neptronic/tuxb]
  reason: Both wall-mount controller series report product id 22; only the (writable) product name differs.

- devices: [fronius/datamanager, fronius/gen24]
  one_way: true
  reason: Both are Fronius inverters speaking SunSpec; the GEN24 check also accepts the float models a Datamanager serves, and no register tells the chains apart.

- devices: [siemens/sentron-pac, siemens/pac2200]
  one_way: true
  reason: Both report Siemens' manufacturer id 42 in I&M 0; the PAC2200 document gives no order number to check, the PAC3200 file checks its "7KM211" order number.

- devices: [benshaw/emx4, aucom/emx4]
  one_way: true
  reason: The same EMX4 soft starters and product type codes under two brands; no register names the maker.
