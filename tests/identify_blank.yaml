# Device files whose identification still holds on a device that answers every register with 0 (an Eastron SDM630
# does) or with FFFFh, with the reason. tests/test_specs.py fails on any such file not listed here, and on listed
# files that no longer need it. `fills`: the register values (0, 65535) the file still accepts.

- device: hoval/toptronic-e
  fills: [0]
  reason: The Hoval documents give no identity register (serial, type, firmware); only plausible ranges of status values.

- device: ingeteam/ingecon-sun
  fills: [0]
  reason: The INGECON SUN monitoring map has no identity register; a stopped inverter reads 0 in the checked status, voltage and frequency registers.

- device: mitsubishi/pac-if013b
  fills: [0]
  reason: The PAC-IF013B document gives no identity register; only refrigerant addresses and step status.

- device: huawei/sdongle
  fills: [0, 65535]
  reason: huawei-solar-lib detects the SDongle by register 37411 answering at all (its second branch); no document.
