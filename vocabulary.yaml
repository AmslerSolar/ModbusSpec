#
# Standard keys for device values. A point that uses one of these keys must use its unit (or a unit the reader
# converts: W/kW, Wh/kWh, mA/A via `scale`), and, for keys with a `positive` direction, say which direction the
# device's raw value is positive in; readers flip the sign so every device reports the same convention.
# Values without a standard key use "x.<name>" (device-specific).

keys:
  # Grid connection (meters and inverters with a grid meter)
  grid_power:          {unit: W,   positive: export, description: "Power at the grid connection; + = feed-in (export), − = import"}
  grid_import_energy:  {unit: kWh, description: "Lifetime energy imported from the grid"}
  grid_export_energy:  {unit: kWh, description: "Lifetime energy exported to the grid"}

  # Solar
  pv_power:            {unit: W,   description: "DC or AC solar production power (≥ 0)"}
  pv_energy:           {unit: kWh, description: "Lifetime solar yield"}
  pv_energy_today:     {unit: kWh, description: "Solar yield today"}

  # Battery
  battery_power:       {unit: W,   positive: discharge, description: "+ = discharging, − = charging"}
  battery_current:     {unit: A,   positive: discharge, description: "+ = discharging, − = charging"}
  battery_voltage:     {unit: V}
  battery_soc:         {unit: "%", description: "State of charge 0–100"}
  battery_soh:         {unit: "%", description: "State of health 0–100"}
  battery_temperature: {unit: "°C"}

  # House and consumers (wallboxes, heat pumps, heating rods)
  load_power:          {unit: W,   description: "House consumption (≥ 0)"}
  consumer_power:      {unit: W,   positive: consumption, description: "Power the device draws; + = consuming"}
  consumer_energy:     {unit: kWh, description: "Lifetime energy the device consumed"}
  session_energy:      {unit: kWh, description: "Energy of the current or last charging session"}

  # AC measurements. Per-phase power ("positive: main") goes the way of the device's main power: export for
  # meters, inverters and energy managers (their grid connection), discharge for batteries, consumption for
  # chargers, heat pumps and heating rods.
  l1_voltage:          {unit: V}
  l2_voltage:          {unit: V}
  l3_voltage:          {unit: V}
  l1_current:          {unit: A}
  l2_current:          {unit: A}
  l3_current:          {unit: A}
  l1_power:            {unit: W,   positive: main}
  l2_power:            {unit: W,   positive: main}
  l3_power:            {unit: W,   positive: main}
  frequency:           {unit: Hz}
  power_factor:        {unit: "", description: "−1…1"}
  apparent_power:      {unit: VA}
  reactive_power:      {unit: var}

  # Device
  temperature:         {unit: "°C", description: "Device (inverter / heat sink) temperature"}
  state:               {unit: "", description: "Operating state; values in an enum"}
  error_code:          {unit: "", description: "Device error code; 0 = none unless the spec says otherwise"}
  serial:              {unit: "", description: "Serial number"}
  firmware:            {unit: "", description: "Firmware version"}

directions:
  main: "per-phase values: the direction of the device's main power (see the AC measurements comment)"
  export: "positive = power flowing from the site to the grid"
  import: "positive = power flowing from the grid to the site"
  discharge: "positive = battery discharging"
  charge: "positive = battery charging"
  consumption: "positive = the device consumes power"
  generation: "positive = the device produces power"
